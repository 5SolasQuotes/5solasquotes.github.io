<blockquote><p>It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>

<blockquote><p>The Papists, Socinians and Remonstrants all acknowledge faith to justify, but by it they mean obedience to God’s commandments, and so make it a work, and [do] not consider it as an instrument receiving Christ and his promise. A Papist, a Socinian, a Protestant says, ‘We are justified by faith,’ but dispositive [dispositionally, as an inherent disposition], says the Papist, conditionaliter [conditionally, as a condition only], says the Socinian, applicativè [applyingly], says the Protestant. Faith justifies not as a quality or habit [an inward abiding power] in us, as the Papists teach, Ipsa fides censetur esse justitia [faith itself is considered to be righteousness], for so it is a part of sanctification, but as it is the instrument and hand to receive Christ who is our righteousness, much less as it is an act, as Socinus and his followers teach, as though [Greek] ipsum credere [‘to believe itself’], did properly justify; if we should be justified by it as it is an act, then we should be justified by our works and we should be no longer justified actually then we do actually believe, and so there should be an intercision of justification so oft as there is an intermission of the act of faith; but justification is a continued act. … When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. … Objection: Faith is a work; therefore if we be justified by faith, then by works. Answer: With faith we must join the object of it, viz. Christ, Fides justificat non absolutè, sed relativè sc. cum objecto, non efficiendo sed afficiendo et applicando [‘Faith does not justify absolutely, but relatively, even with the object, not efficiently, but affectively and applyingly]. The Scripture says we are justified by faith, and through faith, but never for faith or because of our faith: per fidem, ex fide, non propter fidem. We can only be justified by that righteousness which is universal and complete; faith is a partial righteousness, Phil. 3:9, and as imperfect as other graces. … Only faith receives Christ and a promise. Faith justifies by the mere ordination of God, that on the receiving of Christ, or resting on Him we shall be justified. The proper act of faith which justifies is the relying on Christ for pardon of sin. To justify does not flow from any act of grace, because of the dignity and excellency of that act, but because of the peculiar nature, that it does receive and apply; therefore to receive Christ and to believe in Him is all one, and faith is always opposed to works. Bellarmine objects that to apply is a work or action. It is true, it is a grammatical action, but a predicamental passion [an Aristotelian category of disposition]. But says Bellarmine, ‘Love lays hold on Christ, and by love we are made one;’ but yet there is a difference: love makes us one with Christ extramittendo [sending out], faith intramittendo [bringing in], and besides love joins us to Christ after we are made one by faith, so that it cannot justify us.</p></blockquote>

<blockquote><p>Because all men be sinners and offenders against God, and breakers of His law and commandments, therefore can no man by His own acts, works, and deeds (seem they never so good) be justified, and made righteous before God: But every man of necessity is constrained to seek for another righteousness or justification, to be received at God’s own hands, that is to say, the forgiveness of his sins and trespasses, in such things as he hath offended. And this justification or righteousness, which we so receive of God’s mercy and Christ’s merits, embraced by faith, is taken, accepted, and allowed of God, for our perfect and full justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily of Salvation</cite>, First Book of Homilies, 1547</span></figcaption>

<blockquote><p>The Socinian, Arminian and Papists’ faith includes new repentance and new obedience, contrary to the Scripture which differs between faith and new obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, pp. 172-176</span></figcaption>

<blockquote><p>XXXVIII… Nor is he [Christopher Wittich] alone in considering sincere love of God and Christ among the essential acts of faith. [Marcus F.] Wendelin shares this sentiment. Although he reduces the parts of faith to three –knowledge, assent, and confidence – he nevertheless teaches that love also pertains to the acts of faith. For he proves that not only the intellect but also the will is the subject of faith, “Because faith is also love, and love is an act of the will,” which he supports with the testimony of Augustine saying, “To believe in Christ is to love Christ.” In Christian Theology, bk. 2, ch. 24, in the explanation of the eighth thesis. XXXIX. Similar views can be found in [Daniel] Chamier, who also uses the same argument to prove that faith is in the will, not just in the intellect. He says, ‘All love is an act of the will; but faith is love; therefore, it is an act of the will.’ He proves that faith is love because true faith is that which believes in God: But to believe in God is to love God, according to Augustine, ‘What is it to believe in God? To believe is to love.’ (Pancratia, vol. 3, bk. 12, ch. 4, no. 16). XL. And Wittich himself in the previously cited place brings forward the words of Cocceius, a professor at Leiden University while he was alive. ‘That faith,’ he says: ‘is a kind of love of God, by which I love God as the one who atones for sins and heals from the disease and penalty of sin, that I may be to His glory.’ (On the Last Words of Moses, p. 336). And in another place: ‘Therefore, faith is inherently connected with charity; since faith itself is nothing but the outpouring of Christ’s charity in our hearts, its sensation, and reciprocal recognition. One loves because they believe; and if they do not love, they do not believe.’ (in Examen Apologiae, p. 209). But many among the Reformed theologians think differently, like Samuel Maresius, Robert Baronius, Bucanus, and ultimately all who place faith solely in the intellect, like Peter du Moulin and the Professors of Saumur. For all of them indeed teach that the love of God arises from true faith and is an effect inseparable from it, yet they do not want it to be an act elicited by faith, as that would confuse faith with charity. … XCVI. Similarly, there is doubt about whether love is a formal and essential act of faith. Esteemed scholars such as Chamier, Wendelin, Wittich, and Cocceius assert it, while others deny it. For my part, I think some distinction is necessary here. Faith can be taken in two ways: First, precisely, according to what it has distinct from hope, charity, and other Christian virtues. In this sense, love is not a formal act of faith but pertains to another virtue, namely, charity. Secondly, faith is taken for a composite of several acts or habits, which are included under the term “faith working through love.” This is how many Reformed authors understand faith in this question, not as a single act or simple habit but as a complex of several acts or habits. From this, it follows that sincere love of God and Christ, without which faith cannot be conceived as living and working through love, undoubtedly belongs to faith as an essential act. . . In Lutheranism Article 1600’s Calov, Abraham – Thoughts on Objective Justification tr. Souksamay K. Phetsanghane 47 pp. in Biblia Illustrata (1672-1676; 2014), on 2 Cor. 5:18‐19; Rom. 3:23‐24; 4:25; 5:18‐19 with a bibliography Presented for the Southwestern Conference of the Western Wisconsin District of the Wisconsin Evangelical Lutheran Synod, Winter Conference, Feb. 25, 2014, St. John Lutheran, Baraboo, WI Calov (1612–1686) was a professor of theology at Konigsberg and Wittenberg and one of the champions of Lutheran orthodoxy in the 17th century. ‘Objective Justification’ refers to the erroneous notion of an objective, universal and conditional justification of all people through the work of Christ. While this doctrine is largely absent from the historic creeds of Lutheranism and Lutheran orthodoxy (which emphasized an actual, personal justification by faith), yet Phetsanghane seeks to show that this doctrine was taught to some minor extent, and incidentally, in some of the orthodox Lutheran theologians (principally Abraham Calov, 1612-1686) and it may be contained in some implicit form in some early historic Lutheran confessions. . Historical On the Post-Reformation Article Fesko, J.V. – ‘Reformed Orthodoxy on Imputation. Active &amp; Passive Justification’ in Perichoresis, vol. 14, issue 3 (2016), pp. 61-80 Abstract: “The doctrine of imputation is common to Early Modern Lutheran and Reformed theology, but Reformed orthodox theologians employed the distinction between the active and passive justification of the believer. Active justification is the objective imputation of Christ’s righteousness and passive justification is the subjective reception of the same. This distinction is a unique contribution in Reformed orthodox dogmatics and was used in polemics against Roman Catholic, Arminian, and Socinian theologians. This essay also compares Reformed orthodox formulations with Lutheran orthodox understandings of how they preserved the extra nos [outside of us] of Christ’s righteousness in justification. The Reformed orthodox employed the active-passive justification distinction in conjunction with the decree and the doctrine of the covenant of redemption, whereas the Lutheran orthodox logically placed justification first in the order of salvation. Both groups maintain the extra nos of Christ’s imputed righteousness but do so in different ways.</p></blockquote>

rom the historic creeds of Lutheranism and Lutheran orthodoxy (which emphasized an actual, personal justification by faith), yet Phetsanghane seeks to show that this doctrine was taught to some minor extent, and incidentally, in some of the orthodox Lutheran theologians (principally Abraham Calov, 1612-1686) and it may be contained in some implicit form in some early historic Lutheran confessions. . Historical On the Post-Reformation Article Fesko, J.V. – ‘Reformed Orthodoxy on Imputation. Active &amp; Passive Justification’ in Perichoresis, vol. 14, issue 3 (2016), pp. 61-80 Abstract: “The doctrine of imputation is common to Early Modern Lutheran and Reformed theology, but Reformed orthodox theologians employed the distinction between the active and passive justification of the believer. Active justification is the objective imputation of Christ’s righteousness and passive justification is the subjective reception of the same. This distinction is a unique contribution in Reformed orthodox dogmatics and was used in polemics against Roman Catholic, Arminian, and Socinian theologians. This essay also compares Reformed orthodox formulations with Lutheran orthodox understandings of how they preserved the extra nos [outside of us] of Christ’s righteousness in justification. The Reformed orthodox employed the active-passive justification distinction in conjunction with the decree and the doctrine of the covenant of redemption, whereas the Lutheran orthodox logically placed justification first in the order of salvation. Both groups maintain the extra nos of Christ’s imputed righteousness but do so in different ways.”

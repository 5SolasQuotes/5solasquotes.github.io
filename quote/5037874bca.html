<blockquote><p>The choicest saints are ‘born to troubles as the sparks fly upwards’ Job v. 7. ‘Many are the troubles of the righteous;’ if they were many, and not troubles, then, as it is in the proverb, the more the merrier; or if they were troubles and not many, then the fewer the better cheer. But God, who is infinite in wisdom and matchless in goodness, hath ordered troubles, yea, many troubles to come trooping in upon us on every side.

As our mercies, so our crosses seldom come single; they usually come treading one upon the heels of another; they are like April showers, no sooner is one over but another comes. And yet, Christians, it is mercy, it is rich mercy, that every affliction is not an execution, that every correction is not a damnation. The higher the waters rise, the nearer Noah’s ark was lifted up to heaven; the more thy afflictions are increased, the more thy heart shall be raised heavenward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 287.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-726573c8f3" data-kw="">
<blockquote><p>In order that we may arrive at even the most faint and remote conception of the indescribable sorrow and heaviness of the Saviour, it is necessary for us to have our mind impressed with the doctrine of Scripture regarding the constitution of his person. We are too apt ignorantly to conclude, that to him in whom dwelt all the fulness of the godhead bodily, nothing could be a difficulty, nothing could cost a struggle — that his omnipotence must have borne him onward above the power of pain, and grief, and distress — and that, if his apparent sufferings were not altogether unreal, they must to him at least have been trifling and contemptible.

Now, it is to be remembered that, while he was truly God, co-eternal and co-essential with the father, he was at the same time complete and perfect man, possessed of a true body and a reasonable soul — a soul of the most exquisite sensibility, and susceptible of the most painful impressions from every form of evil. The union of the two natures in his one person was without confusion of their properties.

Notwithstanding the union, the natures remained distinct, and their operations distinct. Neither his original dignity as the Son of God, nor the union of the Divine nature with the human, nor the sacred distinction attending his birth, furnished the slightest ground to doubt his absolute participation of our nature and actual communion with us in all our sufferings. In the body, he was liable to hunger, and thirst, and weariness, as much as any of us. He was capable of being bruised with stripes, torn with scourges, pricked with thorns, pierced with nails, transfixed with a spear.

So also his soul was endued with the same faculties and affections as ours. He was moved with pity and compassion. He was stung with reproach and ingratitude. He was susceptible of affliction, and disturbance, and agony. He was devoid of no property that belongs to us. He was free only from the contamination that adheres to our corrupted nature. Such was the depth of humiliation, such the capacity of suffering, to which he stooped who was the Lord of nature and fountain of life, the eternal partaker of the Father’s happiness, the brightness of his glory the express image of his person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-roxburgh.html">John Roxburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saviour s sufferings, and his satisfaction in the fruit of them’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-f6e19a7a29" data-kw="">
<blockquote><p>But we see that the godly are visited with sore anguish and very heavy afflictions beyond others; for in this manner God wishes to try their faith, that, after having laid aside their desires and forsaken the world, they may serve him. Since, therefore, the Lord has a peculiar care of them, he must chastise them, while he permits wicked men to indulge in unbounded licentiousness.

Here we are also reminded that we must endure not merely one or another calamity, and must not imagine that, when we have endured some afflictions, there are none in reserve for us; for we ought always to be prepared to endure new ones. When God begins to chastise his people, he does not immediately cease. We shall “bring forth wind” when we think that the birth is at hand; other calamities will break out, and we shall be continually attacked by additional sorrows. We must therefore maintain this warfare so long as it shall please God to employ us in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 235.</span></figcaption>

<blockquote><p>Two centuries ago, in the days of the Stuarts, it would have been impossible for the Church to purchase her freedom even at this cost. On the 1st November 1662, four hundred ministers of the Church of Scotland, substantially for the same principle of Christ’s sole kingly authority in his Church, left their churches and pleasant homes, and cast themselves and their families on the world. But it was not to poverty only, with its manifold hardships, they thus committed themselves, but, as every reader of his country’s history knows, to all manner of sufferings even unto death. And they deemed the principle worth suffering for even to death.

Well it was for the liberties of all Great Britain, as the issue proved, that they did, that they had no sympathy with those in our time who say—it is but a question about external things after all, not touching doctrine, not affecting the truths on which salvation depends. Indeed? Christ’s sole kingly authority in his Church not a matter of vital doctrine! It was well, at least, that our martyr-forefathers thought otherwise, thought that if the shepherds’ consent to the pulling down of the fence which protects the flock, and the wolf thus get in among them, it is small consolation for the sheep that it was only the fence the shepherds suffered to be broken down.

With John Knox, a hundred years before, they judged, “Take from us our assemblies, and take from us the gospel” And thus were they willing, for Christ’s sole regal authority in his kingdom, to surrender, not their livings only, but their lives. The difference in our happier times simply is, that we were able to secure our freedom by parting, not with our lives, but with our livings only. Hence the Disruption of 1843.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

Well it was for the liberties of all Great Britain, as the issue proved, that they did, that they had no sympathy with those in our time who say—it is but a question about external things after all, not touching doctrine, not affecting the truths on which salvation depends. Indeed? Christ’s sole kingly authority in his Church not a matter of vital doctrine! It was well, at least, that our martyr-forefathers thought otherwise, thought that if the shepherds’ consent to the pulling down of the fence which protects the flock, and the wolf thus get in among them, it is small consolation for the sheep that it was only the fence the shepherds suffered to be broken down.

With John Knox, a hundred years before, they judged, “Take from us our assemblies, and take from us the gospel” And thus were they willing, for Christ’s sole regal authority in his kingdom, to surrender, not their livings only, but their lives. The difference in our happier times simply is, that we were able to secure our freedom by parting, not with our lives, but with our livings only. Hence the Disruption of 1843.”

— Charles J. Brown, The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh, (Edinburgh: T. Nelson and Sons, 1863), p. 12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTwo+centuries+ago%2C+in+the+days+of+the+Stuarts%2C+it+would+have+been+impossible+for+the+Church+to+purchase+her+freedom+even+at+this+cost.+On+the+1st+November+1662%2C+four+hundred+ministers+of+the+Church+of+Scotland%2C+substantially+for+the+same+principle+of+Christ%E2%80%99s+sole+kingly+authority+in+his+Church%2C+left+their+churches+and+pleasant+homes%2C+and+cast+themselves+and+their+families+on+the+world.+But+it+was+not+to+poverty+only%2C+with+its+manifold+hardships%2C+they+thus+committed+themselves%2C+but%2C+as+every+reader+of+his+country%E2%80%99s+history+knows%2C+to+all+manner+of+sufferings+even+unto+death.+And+they+deemed+the+principle+worth+suffering+for+even+to+death.%0A%0AWell+it+was+for+the+liberties+of+all+Great+Britain%2C+as+the+issue+proved%2C+that+they+did%2C+that+they+had+no+sympathy+with+those+in+our+time+who+say%E2%80%94it+is+but+a+question+about+external+things+after+all%2C+not+touching+doctrine%2C+not+affecting+the+truths+on+which+salvation+depends.+Indeed%3F+Christ%E2%80%99s+sole+kingly+authority+in+his+Church+not+a+matter+of+vital+doctrine%21+It+was+well%2C+at+least%2C+that+our+martyr-forefathers+thought+otherwise%2C+thought+that+if+the+shepherds%E2%80%99+consent+to+the+pulling+down+of+the+fence+which+protects+the+flock%2C+and+the+wolf+thus+get+in+among+them%2C+it+is+small+consolation+for+the+sheep+that+it+was+only+the+fence+the+shepherds+suffered+to+be+broken+down.%0A%0AWith+John+Knox%2C+a+hundred+years+before%2C+they+judged%2C+%E2%80%9CTake+from+us+our+assemblies%2C+and+take+from+us+the+gospel%E2%80%9D+And+thus+were+they+willing%2C+for+Christ%E2%80%99s+sole+regal+authority+in+his+kingdom%2C+to+surrender%2C+not+their+livings+only%2C+but+their+lives.+The+difference+in+our+happier+times+simply+is%2C+that+we+were+able+to+secure+our+freedom+by+parting%2C+not+with+our+lives%2C+but+with+our+livings+only.+Hence+the+Disruption+of+1843.%E2%80%9D%0A%0A%E2%80%94+Charles+J.+Brown%2C+The+Disruption+Question+Stated.+Reprinted+%28with+some+additions%29+from+the+Free+Church+Record%2C+at+the+request+of+the+Free+Presbytery+of+Edinburgh%2C+%28Edinburgh%3A+T.+Nelson+and+Sons%2C+1863%29%2C+p.+12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F766a5a5f6c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/766a5a5f6c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/03/charles-j-brown-on-suffering-for-christs-royal-prerogatives/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Objection 17: But the particulars of your [Westminster] Directory of worship are not in Scripture, how then can the magistrate punish for not following the Directory? Answer: That there should be prayers, preaching, reading, praising of God, sacraments in the public worship, is evident by the Scripture, but for the ordering of these worships secundum prius &amp; posterius [according to what is first and that which follows] the words of prayer (so they be according to the pattern of sound doctrine) the Preface of the Directory is clear, that no man is therein to be compelled, though to transgress the Holy Ghost’s express order in the celebration of the Lord’s Supper and to break bread and eat first, and that before any of the words of institution be mentioned, or any blessing of the elements, must be a manifest breach of the directory of Jesus Christ which sure holds forth to us a twofold ordering of acts of worship, one divine, which we must peremptorily follow, another prudential and human in circumstances which concern both the worship of God and civil assemblies, as time, place, persons, etc. and in the latter we are no further to be commanded in point of uniformity than the general rules of the Word lead us; and compulsion, where God has no compelling commandment going before in an exact uniformity, we utterly disclaim, nor can men, or Church, or all the assemblies on earth make laws in matters of God’s worship where the Supreme Lawgiver has made none, and the Preface of the Directory is so clear in this that we trust we shall quickly agree with the godly and sound in judgment in this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London, 1649), pp. 372-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0444e8a231" data-kw="">
<blockquote><p>For what synods determine, being the undeniable Word of God, is intrinsically infallible, and can never become fallible, though fallible and sinful men that are obnoxious [liable] to error and mistakes do hold it forth ministerially to others: and it is false that we are to believe that what synods determine according to the Word of God, we are to believe it is fallible and liable to error, and may [be] an untruth because they so determine; for then, when a synod determines [that] ‘there is but one true God,’ this principle of faith is believed to be subject to retraction and falsehood, because a synod has determined it to be a truth. But the truth is, we are to believe truths, determined by synods, to be infallible, and never again liable to retraction or discussion, because they are, and were in themselves and without any synodical determination, infallible, but not for this formal medium, because so says the synod, but because so says the Lord.</p></blockquote>

<blockquote><p>While they [the Jews] had the tenth of their goods consecrated, these [Christians] on the other hand who have received freedom [from the Mosaic Law] assign all that they have to the uses of the Lord, cheerfully and freely giving them, and not in lesser portions only, as becomes men professing the hope of greater things.’ . . Start Here: Articles &amp; Book Articles Smyth, Thomas – The Parsimony of Professing Christians being Note A to The Rule &amp; Measure of Christian Charity in Works, vol. 7 American, southern presbyterian. Parsimony means an extreme unwillingness to spend money. Peck, Thomas – Moral Obligation of the Tithe (1890) in Miscellanies, vol. 1, pp. 146-57 Peck was an American, southern presbyterian.. He argues that while natural and Biblical principles morally obligate us to return a portion of our income to the service of the Lord, this does not obligate an exact amount of, or at least, 10% in the New Testament era. While this article is very valuable, yet throughout it Peck argues for Voluntaryism, which is contrary to the Establishment Principle of the Reformation.. This aspect of Peck’s article is not recommended. Balfour, William – The Establishment Principle Defended, pp. 126-34 (1873) Balfour was a minister in the Free Church of Scotland.. He here defends from Scripture the Reformation’s view of the Establishment Principle with regards to tithing. Balfour is here arguing against the Voluntary position of the Scottish United Presbyterian Church, with which Church the Free Church was considering union with in his time. The teaching of Scripture is clear. . Book Croteau, David – A Biblical &amp; Theological Analysis of Tithing: Toward a Theology of Giving in the New Covenant Era PhD dissertation (2005) 339 pp. Croteau brings out numerous, enlightening Biblical insights.. His historical survey on pp. 6-68 is very helpful, especially in documenting the tithing renewal that occurred in America during the late-1800’s and following.. Indispensable for further digging into the subject, especially for his citations of literature on the subject. . . Dictionary &amp; Encyclopedia Articles on the Biblical tithes 1800’s Smith, William – ‘Tithe’ in Dr. William Smith’s Dictionary of the Bible, Comprising its Antiquities, Biography, Geography &amp; Natural History, vol. 4 ed. H.B. Hackett &amp; Ezra Abbot (1871) ** ed. McClintock &amp; Strong – ‘Tithe’ in Cyclopedia of Biblical, Theological and Ecclesiastical Literature (1880) Davis, John D. – ‘Tithe’ in A Dictionary of the Bible (1898) . 1900’s Jewish Encyclopedia – ‘Tithe’ (1901-1906) ed. Orr, James – ‘Tithe’ in International Standard Bible Encyclopedia (1915 / 1939) . . Articles Theological &amp; Political 1500’s Bullinger, Henry – Tenth Sermon, pp. 486-500 in the Fifth Decade of The Decades 1550’s Bullinger (1504–1575) was a Swiss reformer, the successor of Zwingli as the head of the Zurich Church. ** Ursinus, Zacharias – p. 570 (bottom) of ‘The Fourth Commandment’ in Commentary on the Heidelberg Catechism trans. Williard, 3rd American ed. (1851) Ursinus (1534–1583) was a prominent German Reformed theologian. ** Vermigli, Peter Martyr – Pt. 4, ch. 13, ‘Of a Magistrate, &amp; of the Difference between Civil &amp; Ecclesiastical Power’, section 18-32 in Common Places (1583), pp. 235-45 Quote: “First we must understand that tithes in the old time pertained unto ceremonies, and that as well in Melchisedek as in the Levites: Because in either priesthood they were referred unto Christ, and either priesthood was in very deed a figure of Christ… But what signified the tenths in either priesthood? Truly they signified nothing else but that it behoved the old fathers to acknowledge that whatsoever they had came from Christ. By that ceremony, the people worshipped Christ Himself… Boniface says: “We receive the tithes of all laymen.” Ye take them indeed, but now that Christ is come, the paying of tithes is no more a ceremony as it was before the coming of Christ when by tithes men worshipped Christ which was to come in the flesh, and confessed that they ought unto Him, both themselves, and all that they had. After the very which manner they paid the first fruits of all that they had. Nevertheless our men in these days receive tithes: but by what law? Truly not by the ceremonial law, but by a moral Law: since it is requisite that the minister should be sustained by the people: (Mt. 10:10) For the laborer is worthy of his reward: And he which serves the Gospel ought to live by it. So then, whether stipends be paid unto ministers out of lands or out of houses, either in ready money or in tithes, it makes no matter so that they be not maintained dishonestly, but honestly. Indeed these rewards in some places do retain the old manner of tithes. Howbeit in many places they are not called tithes, but stipends or wages. And doubtless they be rather rewards which are due to the labors of ministers than tithes.</p></blockquote>

stical+Power%E2%80%99%2C+section+18-32+in+Common+Places+%281583%29%2C+pp.+235-45+Quote%3A+%E2%80%9CFirst+we+must+understand+that+tithes+in+the+old+time+pertained+unto+ceremonies%2C+and+that+as+well+in+Melchisedek+as+in+the+Levites%3A+Because+in+either+priesthood+they+were+referred+unto+Christ%2C+and+either+priesthood+was+in+very+deed+a+figure+of+Christ%E2%80%A6+But+what+signified+the+tenths+in+either+priesthood%3F+Truly+they+signified+nothing+else+but+that+it+behoved+the+old+fathers+to+acknowledge+that+whatsoever+they+had+came+from+Christ.+By+that+ceremony%2C+the+people+worshipped+Christ+Himself%E2%80%A6+Boniface+says%3A+%E2%80%9CWe+receive+the+tithes+of+all+laymen.%E2%80%9D+Ye+take+them+indeed%2C+but+now+that+Christ+is+come%2C+the+paying+of+tithes+is+no+more+a+ceremony+as+it+was+before+the+coming+of+Christ+when+by+tithes+men+worshipped+Christ+which+was+to+come+in+the+flesh%2C+and+confessed+that+they+ought+unto+Him%2C+both+themselves%2C+and+all+that+they+had.+After+the+very+which+manner+they+paid+the+first+fruits+of+all+that+they+had.+Nevertheless+our+men+in+these+days+receive+tithes%3A+but+by+what+law%3F+Truly+not+by+the+ceremonial+law%2C+but+by+a+moral+Law%3A+since+it+is+requisite+that+the+minister+should+be+sustained+by+the+people%3A+%28Mt.+10%3A10%29+For+the+laborer+is+worthy+of+his+reward%3A+And+he+which+serves+the+Gospel+ought+to+live+by+it.+So+then%2C+whether+stipends+be+paid+unto+ministers+out+of+lands+or+out+of+houses%2C+either+in+ready+money+or+in+tithes%2C+it+makes+no+matter+so+that+they+be+not+maintained+dishonestly%2C+but+honestly.+Indeed+these+rewards+in+some+places+do+retain+the+old+manner+of+tithes.+Howbeit+in+many+places+they+are+not+called+tithes%2C+but+stipends+or+wages.+And+doubtless+they+be+rather+rewards+which+are+due+to+the+labors+of+ministers+than+tithes.%E2%80%9D%0A%0A%E2%80%94+Start+Here%2C+There+are+higher+rewards+in+the+promises+of+God+for+sacrificing+the+things+of+this+life+than+we+can+conceive+of+%28Mk.+10%3A29-30%29.+Lord+increase+our+

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4670b4bbd" data-kw="">
<blockquote><p>…the last place, 2 Chron. 29, out of which no more can be drawn but that the people worshipped whiles the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, (though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4; p. 72</span></figcaption>

<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law.

11. The end of the First Commandement is that God among his people will bear rule ouer all, and wholly enjoy his authority. And to the end that this may come to pass, He commands all impiety, and all false opinions concerning God to be far from us: and in like sort, He enjoins Himself to be worshipped and adored of us in the true practice of godliness.

12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>

h%20and%20last%2C%20is%20thanksgiving" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50</span></figcaption>

asquotes.github.io%2Fquote%2F33a10a09f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33a10a09f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=Civil%20worship%20is%20the%20honor%20done,invocation%20signified%20by%20any%20bodily%20adoration&amp;text=Civil%20worship%20is%20the%20honor%20done%20to%20men&amp;text=as%20namely%20invocation%20signified%20by%20any%20bodily%20adoration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d342678c42" data-kw="">
<blockquote><p>The things set down under the former head as forbidden are such new ordinances of worship as are coordinate with the divine ordinances and are in a proper sense additions, pretending or in themselves expressing the same nature, reason, end and use that the divine ordinances have and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same; and they are not proper additions because they are not of the same nature and use: and these are unlawful. All such modes of a duty as are necessary in genere, and not determined in specie (as when there must be a practice one way or other, but whether this way or that way, is not determined of God) are left free to human determination. This human determination must be regulated by the general rules of God’s Word, of which there be these two chief: First, that all determinations be made for edification and not for destruction. Secondly, that all things be done decently and in order. These two rules we find expressly in Scripture, and they are also of the law of nature. These things are neither the essential nor integral parts of divine worship; but if any of them be called “parts” thereof, as being direct expressions of honor to God, they are but accidental parts, as the putting off the hat in divine worship is a worshipping of God so far as it is an expression of honor to God. … Whatsoever nature or custom has so made decent or reverent that the negation of it is indecent or irreverent, is doubtless commanded of God in his worship, though not by any particular, yet by general laws. And the institution and observation of such things is no addition to God’s Law, but merely an application of the general Law in particular cases, as the Law itself does warrant. All these are such mutable things as are not fit to be in particular the matter of a universal law because they are fit in one place and at one time, and not another. Note that things not determined of God and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 5, What things of or belonging to Divine Worship may be Devised or Instituted by Man</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The things set down under the former head as forbidden are such new ordinances of worship as are coordinate with the divine ordinances and are in a proper sense additions, pretending or in themselves expressing the same nature, reason, end and use that the divine ordinances have and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same; and they are not proper additions because they are not of the same nature and use: and these are unlawful. All such modes of a duty as are necessary in genere, and not determined in specie (as when there must be a practice one way or other, but whether this way or that way, is not determined of God) are left free to human determination. This human determination must be regulated by the general rules of God’s Word, of which there be these two chief: First, that all determinations be made for edification and not for destruction. Secondly, that all things be done decently and in order. These two rules we find expressly in Scripture, and they are also of the law of nature. These things are neither the essential nor integral parts of divine worship; but if any of them be called “parts” thereof, as being direct expressions of honor to God, they are but accidental parts, as the putting off the hat in divine worship is a worshipping of God so far as it is an expression of honor to God. … Whatsoever nature or custom has so made decent or reverent that the negation of it is indecent or irreverent, is doubtless commanded of God in his worship, though not by any particular, yet by general laws. And the institution and observation of such things is no addition to God’s Law, but merely an application of the general Law in particular cases, as the Law itself does warrant. All these are such mutable things as are not fit to be in particular the matter of a universal law because they are fit in one place and at one time, and not another. Note that things not determined of God and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous.”

— John Corbet, Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 5, What things of or belonging to Divine Worship may be Devised or Instituted by Man">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+things+set+down+under+the+former+head+as+forbidden+are+such+new+ordinances+of+worship+as+are+coordinate+with+the+divine+ordinances+and+are+in+a+proper+sense+additions%2C+pretending+or+in+themselves+expressing+the+same+nature%2C+reason%2C+end+and+use+that+the+divine+ordinances+have+and+consequently+importing+an+insufficiency+in+them.+But+there+are+such+institutions+of+men+in+subordination+to+the+divine+institutions+as+serve+for+the+more+convenient+modifying+and+ordering+of+the+same%3B+and+they+are+not+proper+additions+because+they+are+not+of+the+same+nature+and+use%3A+and+these+are+unlawful.+All+such+modes+of+a+duty+as+are+necessary+in+genere%2C+and+not+determined+in+specie+%28as+when+there+must+be+a+practice+one+way+or+other%2C+but+whether+this+way+or+that+way%2C+is+not+determined+of+God%29+are+left+free+to+human+determination.+This+human+determination+must+be+regulated+by+the+general+rules+of+God%E2%80%99s+Word%2C+of+which+there+be+these+two+chief%3A+First%2C+that+all+determinations+be+made+for+edification+and+not+for+destruction.+Secondly%2C+that+all+things+be+done+decently+and+in+order.+These+two+rules+we+find+expressly+in+Scripture%2C+and+they+are+also+of+the+law+of+nature.+These+things+are+neither+the+essential+nor+integral+parts+of+divine+worship%3B+but+if+any+of+them+be+called+%E2%80%9Cparts%E2%80%9D+thereof%2C+as+being+direct+expressions+of+honor+to+God%2C+they+are+but+accidental+parts%2C+as+the+putting+off+the+hat+in+divine+worship+is+a+worshipping+of+God+so+far+as+it+is+an+expression+of+honor+to+God.+%E2%80%A6+Whatsoever+nature+or+custom+has+so+made+decent+or+reverent+that+the+negation+of+it+is+indecent+or+irreverent%2C+is+doubtless+commanded+of+God+in+his+worship%2C+though+not+by+any+particular%2C+yet+by+general+laws.+And+the+institution+and+observation+of+such+things+is+no+addition+to+God%E2%80%99s+Law%2C+but+merely+an+application+of+the+general+Law+in+particular+cases%2C+as+the+Law+itself+does+warrant.+All+these+are+such+mutable+things+as+are+not+fit+to+be+in+particular+the+matter+of+a+universal+law+because+they+are+fit+in+one+place+and+at+one+time%2C+and+not+another.+Note+that+things+not+determined+of+God+and+left+to+the+determination+of+men+must+be+such+as+are+necessary+in+genere%2C+and+not+things+idle+and+superfluous.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%E2%80%A6+in+The+Remains+of+the+Reverend+and+Learned+Mr.+John+Corbet%2C+Late+of+Chichester+Printed+from+his+own+Manuscripts+%28London%3A+Thomas+Parkhurst%2C+1684%29%2C+pt.+3+%7C+sect.+5%2C+What+things+of+or+belonging+to+Divine+Worship+may+be+Devised+or+Instituted+by+Man&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd342678c42.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d342678c42.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=The%20things%20set%20down%20under%20the,and%20not%20things%20idle%20and%20superfluous&amp;text=The%20things%20set%20down%20under%20the%20former%20head&amp;text=in%20genere%2C%20and%20not%20things%20idle%20and%20superfluous" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

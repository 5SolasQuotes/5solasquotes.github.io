<blockquote><p>Aristotle’s philosophy searches for demonstrations most assiduously, and therefore it surpasses all sects by far. And it judges correctly about the purpose of moral goods and the nature of virtue, at least if it is understood as being about civic life and civic virtues.

Nevertheless, philosophy is not contained within such narrow confines that one need assume that it is all included in the books written by Aristotle that have come down to us, but its elements are in Aristotle. Mathematicians, physicians and lawyers build on these as if on foundations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the distinction between the Gospel and Philosophy (1527) in Orations on Philosophy and Education</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc3d5105c3" data-kw="">
<blockquote><p>Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-heider.html">Daniel Heider</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universals in Second Scholasticism</cite>, (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:</span></figcaption>

</figure><figure class="quote" id="q-9941f2c6bf" data-kw="">
<blockquote><p>Yet, although tyrants desire this very benefit of friendship, they cannot obtain it, for when they seek their own good instead of the common good there is little or no communion between them and their subjects. Now, all friendship is based upon something common among those who are to be friends, for we see that those are united in friendship who have in common either their natural origin, or some similarity in habits of life, or any kind of social interests.

Consequently, there can be little or no friendship between tyrants and their subjects. When the latter are oppressed by tyrannical injustice and feel they are not loved but despised, they certainly do not conceive any love, for it is too great a virtue for the common man to love his enemies and to do good to his persecutors (cf. Matt 5:44). Nor have tyrants any reason to complain of their subjects if they are not loved by them, since they do not act towards them in such a way that they ought to be loved by them.

Good kings, on the contrary, are loved by many when they show that they love their subjects and are studiously intent on the common welfare, and when their subjects can see that they derive many benefits from this zealous care. For to hate their friends and return evil for good to their benefactors—this, surely, would be too great a malice to ascribe fittingly to the generality of men. The consequence of this love is that the government of good kings is stable, because their subjects do not refuse to expose themselves to any danger whatsoever on behalf of such kings.</p></blockquote>

<blockquote><p>Similarly, the soul of a man isn’t a complete substance; only the soul and body (i.e. the form and matter) together constitute a thing or substance, that is, a man. It isn’t the soul that thinks when a man uses his intellect; it is the man himself who thinks, just as it is the man himself, and not the soul, who grows taller, digests his food, and walks around. For this reason, it is not at all surprising that human thought should be very closely correlated with certain brain events even if it is not identical to any of them. Since the soul is the form of the body, including the brain, the connection between them is in many ways like the connection between the form of the some particular table–its round shape, its having four legs, its being brown, etc.–and the matter that make up the table; that is, it i bound to be very close indeed. When the intellect determines that a certain course of action is the best one to take and the will follows it, the body proceeds to move in a way that constitutes the action. The operation of intellect and will constitute in this case is the formal-cum-final caue of the action, of which the firing of the neurons, flexing of the muscles, etc. are the material cause. Then there is the fact that even though the intellect itself operates without any bodily organ, it does depend indirectly on the senses for the raw material from which it abstracts universals or essences (e.g. it abstracts the universal ‘triangularity’ from particular triangles it has perceived). And the sense organs, along with the brain events associated with perceptual experiences, are material. But precisely because the operation of the intellect are not directly dependent on the matter of the brain, the parallel with the form of a table is not exact. If the soul can, unlike the form of a table, function apart from the matter it informs (as it does in thought), then it can also, and again unlike the form of a table, exist apart from the matter it informs, as a kind of incomplete substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (South Bend, Indiana: St. Augustine’s Press, 2008), ch. 4, ‘The Soul’, p. 127</span></figcaption>

— Edward Feser, The Last Superstition: a Refutation of the New Atheism, (South Bend, Indiana: St. Augustine’s Press, 2008), ch. 4, ‘The Soul’, p. 127">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSimilarly%2C+the+soul+of+a+man+isn%E2%80%99t+a+complete+substance%3B+only+the+soul+and+body+%28i.e.+the+form+and+matter%29+together+constitute+a+thing+or+substance%2C+that+is%2C+a+man.+It+isn%E2%80%99t+the+soul+that+thinks+when+a+man+uses+his+intellect%3B+it+is+the+man+himself+who+thinks%2C+just+as+it+is+the+man+himself%2C+and+not+the+soul%2C+who+grows+taller%2C+digests+his+food%2C+and+walks+around.+For+this+reason%2C+it+is+not+at+all+surprising+that+human+thought+should+be+very+closely+correlated+with+certain+brain+events+even+if+it+is+not+identical+to+any+of+them.+Since+the+soul+is+the+form+of+the+body%2C+including+the+brain%2C+the+connection+between+them+is+in+many+ways+like+the+connection+between+the+form+of+the+some+particular+table%E2%80%93its+round+shape%2C+its+having+four+legs%2C+its+being+brown%2C+etc.%E2%80%93and+the+matter+that+make+up+the+table%3B+that+is%2C+it+i+bound+to+be+very+close+indeed.+When+the+intellect+determines+that+a+certain+course+of+action+is+the+best+one+to+take+and+the+will+follows+it%2C+the+body+proceeds+to+move+in+a+way+that+constitutes+the+action.+The+operation+of+intellect+and+will+constitute+in+this+case+is+the+formal-cum-final+caue+of+the+action%2C+of+which+the+firing+of+the+neurons%2C+flexing+of+the+muscles%2C+etc.+are+the+material+cause.+Then+there+is+the+fact+that+even+though+the+intellect+itself+operates+without+any+bodily+organ%2C+it+does+depend+indirectly+on+the+senses+for+the+raw+material+from+which+it+abstracts+universals+or+essences+%28e.g.+it+abstracts+the+universal+%E2%80%98triangularity%E2%80%99+from+particular+triangles+it+has+perceived%29.+And+the+sense+organs%2C+along+with+the+brain+events+associated+with+perceptual+experiences%2C+are+material.+But+precisely+because+the+operation+of+the+intelle

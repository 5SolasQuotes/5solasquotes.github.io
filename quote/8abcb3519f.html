<blockquote><p>Obj 4. Faith is a condition (though not of it self, yet) of salvation, &amp; that in the Elect themselves: therefore the Application of salvation seems not to be free in respect of the Elect.

Ans. A Condition, is either a Condition properly so called, (i. e. an antecedent Condition,) Or a Condition improperly so called: i. e. a consequent Condition. A Condition (properly so called) is a Law, or Observation, annexed to a business; the performance whereof lyeth upon the Covenant; and accordingly the business becometh valid, or null. Such a condition was Works in the first Covenant. If Faith were such a condition, there would soon be an end of the Covenant of grace: yea, the Covenant of grace, were indeed no Covenant of grace.

A Condition improperly (so called, or a Consequent Condition) is such a condition, whose performance by the Covenantee, is absolutely undertaken for; and irresistibly wrought by the Covenantor, and not left in suspense upon the Covenantee, to be performed by his own strength. Faith is a consequent condition, not an antecedent condition. So as this Proposition, I will give Eternal life unto the Elect, if they do believe: is aequivolent unto this, I will out of my absolute will give unto the Elect Eternal life, because I will out of my absolute will give unto the Elect to believe. The Condition of Faith depends not upon the Will of the Elect; either to be, or not to be; but upon the absolute and gracious Will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), pp 227-28.</span></figcaption>

<blockquote><p>The term “covenant” indeed, as a rendering for berith, is not entirely felicitous, and thus it is of vital importance that our usage of “covenantal” be informed by reflection on the Biblical point of view. Because of its usage in describing purely human relationships, as in the Wilsonian “open covenants of peace openly arrived at,” the term readily brings to mind the notion of a bilateral agreement, and perhaps even that of a contract between two independent parties. While there is, in truth, an element of mutuality in the theological berith in the sense that the covenantal relationship of personal fellowship between God and his people is conspicuously in view, it is necessary to insist that even more fundamentally the covenant between God and his people is primarily a unilateral arrangement initiated and effected by God himself. The Biblical perspective in this regard comes to accurate expression in Hebrews 8:6 in the reference to the enactment of a better covenant.

In the foreground, accordingly, is the fact of the sovereign action of God in establishing and bringing to concrete realization an arrangement or administration or “covenant” of grace. This accent upon sovereign grace comes to expression in the words which most simply sum up the approach of the God of the covenant: “I will be your God and ye shall be my people.” These same words, indeed, are unspeakably rich in their expression of the privilege of fellowship between God and his people. And they carry with them profound implications with regard to religious and ethical obligation on the part of the men who become members of the covenant. It remains true, nevertheless, that the emphasis falls first of all upon the action of sovereign, efficacious grace. In thus graciously drawing near unto man for his salvation God makes himself known to man, and thus the covenant of grace is at one and the same time redemptive and revelatory.</p></blockquote>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

<blockquote><p>In the original language of the Old Testament, the word which we translate covenant is, according to some, derived from a root that signifies, to cut down, or cut off; because in ancient times, it was, in making a solemn covenant, usual for the parties contracting, to cut beasts for sacrifice in two, and to pass between the parts of them, in order to confirm their agreement. According to others, it is more properly derived from a root that signifies, to choose; and is expressive of the nature of a free compact: for, in every such compact, a choice is made of the parties between whom, of the objects about which, and of the conditions on which, the agreement is made.

Now that word is, in the Old Testament, employed by the sacred writers, to express the covenant of grace, considered as a compact, or covenant properly so called, or, as made from all eternity, between the Father, and the Son as the last Adam. In this sense, it is used especially in Psalm Ixxxix. 3, where the eternal Father saith, “I have made a covenant with my chosen One”—The same word is also used, and used most frequently, to signify the covenant of grace, considered as a testament or testamentary deed, and as manifested to sinners, in time. It is employed to express that glorious covenant, as published and offered to sinners; as accepted by the faith of elect sinners; as ratified by the sacraments; and by the internal sealing of the Holy Spirit, by which it is rendered effectual In a word, it is often used, to express the covenant in its testamentary form, as administered by the Lord Jesus Christ, to sinners of mankind.

The term in the original language of the New Testament, by which, the inspired Penmen of it, have translated the one above mentioned, from the Old; is in like manner used by them, sometimes, to express the covenant of grace, considered as a proper compact, or federal settlement, between the Father, and the Son as the Representative of his elect. In this sense, the apostle Paul uses it, in Heb. vii 22., when he says, “By so much, was Jesus made a Surety of a better covenant.” The same term is also used by the Apostle, in the same Epistle, to signify the same covenant, as turned into a testament or testamentary disposition. “And for this cause,” says he, “he is the Mediator of the new testament, that by means of death for the redemption of the transgressions that were under the first testament, they which are called, might receive the promise of eternal inheritance. For where a testament is, there must also of necessity be the death of the Testator. For a testament is of force, after men are dead: otherwise it is of no strength at all, while the Testator liveth.”

The blessings of Salvation are, in the 15th verse, styled “the eternal inheritance” because they are not given to believers, on condition of the good works which they perform; but are bequeathed to them, in a testament, ratified by the death of the blessed Testator. As the covenant, considered as administered to sinners of mankind, is of a testamentary form, in which, the Lord Jesus, who purchased all the benefits of it, and who, as the Trustee of it, has them all committed to him, actually bequeaths them to poor sinners; so it was necessary, that by his death, he should render it, as a testamentary deed, firm and irreversible.

The same word is likewise employed, by the apostle Paul, to express at once, the idea, both of a covenant properly so called, and of a testament In his epistle to the Galatians, he says, “Brethren, I speak after the manner of men: Though it be but a man’s covenant, yet if it be confirmed, no man disannulleth, or addeth thereto.” Here, the term is used in a mixed sense; to signify the covenant of grace, considered both as a covenant, and as a testament, or as a testamentary covenant. This glorious covenant, was made to assume a testamentary form, in every dispensation of it; whether as typically confirmed, by the death of typical sacrifices, or as actually ratified, by the death of Jesus Christ.

Thus then, it is manifest from the original terms, which are used in sacred Scripture, to express the covenant of grace, that this august contract is to be considered, on the one hand, as a covenant or compact properly so called, and on the other, as a testamentary disposition or deed of conveyance. In respect of Christ, it is a proper covenant; in regard to us, it is a testament: considered as made in eternity, it is a covenant, a covenant of redeeming grace; considered as administered to sinners in time, it is a testament, ratified by the death of the adorable Testator.</p></blockquote>

The same word is likewise employed, by the apostle Paul, to express at once, the idea, both of a covenant properly so called, and of a testament In his epistle to the Galatians, he says, “Brethren, I speak after the manner of men: Though it be but a man’s covenant, yet if it be confirmed, no man disannulleth, or addeth thereto.” Here, the term is used in a mixed sense; to signify the covenant of grace, considered both as a covenant, and as a testament, or as a testamentary covenant. This glorious covenant, was made to assume a testamentary form, in every dispensation of it; whether as typically confirmed, by the death of typical sacrifices, or as actually ratified, by the death of Jesus Christ.

Thus then, it is manifest from the original terms, which are used in sacred Scripture, to express the covenant of grace, that this august contract is to be considered, on the one hand, as a covenant or compact properly so called, and on the other, as a testamentary disposition or deed of conveyance. In respect of Christ, it is a proper covenant; in regard to us, it is a testament: considered as made in eternity, it is a covenant, a covenant of redeeming grace; considered as administered to sinners in time, it is a testament, ratified by the death of the adorable Testator.”

<blockquote><p>Nor is it sufficient to say, in the third place, that the relation is that of suretyship and substitution. This undoubtedly is a great step in advance. Only let the ground thus taken up be secured. Let the inquiry be pressed to the uttermost; let it be exhausted.

All truly scientific investigation searches on and on, till it arrives at somewhat of which no further explanation can be given or is required. Theology as a science meets this canon, and then claims a right to rest. Let us then still inquire.

Christ undertakes the work of Calvary, the death of the cross, for His people, because He stands towards them in the relation of a surety — a surety on their behalf to the offended Lawgiver and Judge. Be it so: but what shall justify His occupying that relation? What renders it fit, proper, righteous, that He should be accepted as standing in that relation towards them, and in that relation suffering for them? To this also it is not difficult to reply. He is their surety, because He is their substitute. He acts on their behalf, because He stands in their room. One only question now remains; and there can be no possibility, as there should be no inducement, to evade it. The relation of a substitute justifies the suretyship; what shall justify the substitution?

It is to this at last that the question must really be narrowed. The exact hinge and whole stress of the inquiry is here. And we can attain no satisfaction on this point, no sufficient answer to this question, and therefore no satisfactory conclusion to our whole line of investigation, till the doctrine of the everlasting Covenant oneness comes into view. That is the great underlying relation. That is the grand primary conjunction between the Redeemer and the redeemed, which alone bears up, and justifies, and accounts for all else in respect of relation which can be predicated as true concerning them. “Both He that sanctifieth and they that are sanctified are All Of One: for Which cause He is not ashamed to call them brethren” (Heb. ii. 11).

His substitution is a good reason for His suretyship. Covenant oneness is, if possible, a still better reason for His substitution. For now is the vicariousness of His sacrifice not merely brought to light, but vindicated. It is not merely true that He suffers for us; it is also true that we suffer in Him. And the latter of these propositions justifies the truth and righteousness of the former. He is substituted for us, because He is one With us —identified with us, and we with Him.</p></blockquote>

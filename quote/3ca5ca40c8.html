</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40e1ed74af" data-kw="">
<blockquote><p>For neither is a will confirmed in good, nor hardened in evil, so determined to all and every one of its free acts that it cannot not exercise each one; which is manifest in the state of Integrity and Innocence of the first men, in the state of Sin, in the state of Grace, and in the state of Glory. The same is to be judged of the will of the angels, and many things God does willingly which he could have not done, and the contraries of which he could have done.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-e06284c3e4" data-kw="">
<blockquote><p>They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. … The moving cause of God unto creating was not any necessity or indigence, for He is in need of nothing, Acts 17:25, but His most free will, Ps. 115:3, by which He willed to communicate and manifest Himself to creatures, Gen. 1:27, 31, and thereby to be glorified by them, Ps. 8:1; 19:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-b5df3ae534" data-kw="">
<blockquote><p>Q. DId God create the world at the same instant, or in the space of six days? A. In the space of six days: First, because Moses’ narration is historical, and therefore he speaks of six distinct days. Secondly, Moses, Ex. 20 &amp; 31, urges the Jews to work six days and rest the seventh, because God created the world in six days and rested the seventh; this reason had been ridiculous if God had made the world in an instant. Thirdly, if we understand Moses in this place allegorically, then we must make this whole history an allegory. Fourthly, if the seventh day had been the first (and in it God had created the world), then how is it understood that God rested the seventh day? Fiftly, how could so many diverse kinds of creatures be created in the same instant of time? yea, then we must say that man was created and brought into Paradise and was cast asleep, and Eve was formed of his rib the same instant. Q. How then is that understood, Ecclesiasticus 18 [v. 1], ‘He that lives forever, created all things together’? A. It is to be understood of that confused mass that God created in the beginning: out of the which afterward He created the rest of the creatures in their distinct days. Q. Why did God spend so much time in making the world? A. Not because He was weak and could not make it in less time, but that we might the more seriously consider the order of the creation, distinction and replenishing of the world; and in these, the omnipotency, wisdom and goodness of God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-02bf9e3817" data-kw="first day heaven earth light">
<blockquote><p>The works of the first day are reckoned as three (the heaven, the earth and light) according to the Mosaic account. God demonstrates his power in the production of all things ex nihilo by his word alone; his wisdom in their variety, order and use; his goodness in making all things very good. Thus he exercised an ordering and command which powerfully gave existence to things, and ordination which wisely directed all things and assigned to each its own use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1.3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4ae38ff4af" data-kw="">
<blockquote><p>It runs as follows. The human mind possesses the idea of an absolutely perfect Being; that is, of a Being than whom a more perfect cannot be conceived. But such perfection as this implies necessary existence; and necessary existence implies actual existence; because if a thing must be, of course it is. …

For a contingent being who may or may not exist, is not the most perfect being conceivable; is not the absolutely perfect. In having, therefore, as the human mind unquestionably has, the idea of an absolutely perfect in distinction from a relatively perfect being, it has the idea of a being who exists of necessity … Necessity of being, therefore, belongs to perfection of being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 1: 224.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god.html">Existence and Knowledge of God</a></span></div>

<blockquote><p>What we cannot take in by one adequate conception as being finite, we divide into various inadequate conceptions so as to obtain some knowledge of him (which is not a proof of error in the intellect, but only of imperfection). Thus omnipotence is the divine essence itself apprehended as free from every obstacle in acting; eternity is the essence of God as without limit in duration.</p></blockquote>

<blockquote><p>God’s essence is not prior to and separate from his attributes. He is never an essence without attributes. The essence and attributes are simultaneous and inseparable. God cannot be conceived of as developing from an essence without attributes, into an essence with attributes. He is not essence and attributes, but essence with attributes. The whole essence is in each attribute; and the whole essence is also in each trinitarian person.</p></blockquote>

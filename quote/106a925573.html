</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40785982bc" data-kw="">
<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works of William Perkins (RHB), vol. 3</cite>, pp. 47-75</span></figcaption>

</figure><figure class="quote" id="q-49491b8e09" data-kw="">
<blockquote><p>Krause shows in detail how resourcefully the young Aquinas developed his understanding of the beatific vision, on the shoulders of giants: his teacher Albert the Great, as well as Aristotle, Avicenna, and Averroes on the one hand, Augustine and pseudo-Dionysius on the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/katja-krause.html">Katja Krause</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thomas Aquinas on Seeing God. The Beatific Vision in his Commentary on Peter Lombard’s Sentences Ref (Marquette Univ. Press, 2020)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Krause shows in detail how resourcefully the young Aquinas developed his understanding of the beatific vision, on the shoulders of giants: his teacher Albert the Great, as well as Aristotle, Avicenna, and Averroes on the one hand, Augustine and pseudo-Dionysius on the other.”

— Katja Krause, Thomas Aquinas on Seeing God. The Beatific Vision in his Commentary on Peter Lombard’s Sentences Ref (Marquette Univ. Press, 2020)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CKrause+shows+in+detail+how+resourcefully+the+young+Aquinas+developed+his+understanding+of+the+beatific+vision%2C+on+the+shoulders+of+giants%3A+his+teacher+Albert+the+Great%2C+as+well+as+Aristotle%2C+Avicenna%2C+and+Averroes+on+the+one+hand%2C+Augustine+and+pseudo-Dionysius+on+the+other.%E2%80%9D%0A%0A%E2%80%94+Katja+Krause%2C+Thomas+Aquinas+on+Seeing+God.+The+Beatific+Vision+in+his+Commentary+on+Peter+Lombard%E2%80%99s+Sentences+Ref+%28Marquette+Univ.+Press%2C+2020%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49491b8e09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49491b8e09.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Krause%20shows%20in%20detail%20how%20resourcefully,Augustine%20and%20pseudo%2DDionysius%20on%20the%20other." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology… (Brill, 2020), vol. 2, Disputation 40, ‘On the Church’, sections 17-18</cite>, pp. 565-7</span></figcaption>

</figure><figure class="quote" id="q-421e5b9be5" data-kw="">
<blockquote><p>Yea, take the formal vision of God in an immediate fruition in heaven as a duty, and as in that notion contra-distinguished from the objective vision of Christ, then Christ is to be enjoyed, loved, rested on, infinitely above the duties of vision, beatific love, eternal resting on Him, yea, above imputed righteousness, assurance of pardon, reconciliation; as the King is more than his bracelets of gold, his myrrh, spikenard, perfumes, ointment, kisses; the tree more desireable then a fleece of apples that grows on it for the fourth part of a year.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, pp. 82-83</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fd2164f00b" data-kw="">
<blockquote><p>(2) To evince to you the greatness and horridness of that sin [of not delighting in God]. Suffer yourselves therefore to be reasoned with to this purpose; and consider, first, that you have somewhat of delectation in your natures, that is, you have the power naturally inherent in you of taking delight in one thing or other… Therefore herein an act is not enjoined you which is incompetent to your natures, or simply impossible to you… …Yea, when you look into your disaffected hearts and find that you not only do not delight in God, but you cannot, and not for the want of the natural power, but a right inclination, should you not with astonishment bethink yourselves, every one for himself, ‘What is this that has befallen me? I am convinced this is the best good, every way most worthy of my highest delight and love, and yet my heart savors it not!&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Delighting in God, p. 171 The context is an unconverted person, as is seen on</cite>, p. 172.</span></figcaption>

<blockquote><p>We ought to take care, on the other hand, lest, by proving that it is not the lack of members, senses, or faculties that accounts for man’s inability to act in a spiritual manner, we should set forth that weakness as something small, and that man may remove it by some endeavor of his own…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-elias.html">John Elias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Moral Inability of Man’, in John Elias: Life, Letters, and Essays, 1847, reprinted 1973, Banner of Truth</cite>, p. 367</span></figcaption>

</figure><figure class="quote" id="q-66005a7c8a" data-kw="">
<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God.’ Richard Baxter: 1. What not sanctified free-will? 2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’, that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw… (London: Simmons, 1671), section 56</cite>, pp. 139-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-c638ea261e" data-kw="">

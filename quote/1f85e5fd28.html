<main class="wrap"><figure class="quote" id="q-1f85e5fd28" data-kw="intention">
<blockquote><p>(1) The personal sin of one does not injure another who does not share in it. Now the defect of intention of the minister is the personal sin of that minister. Therefore it does not injure another not partaking of it—him, namely, who is the partaker of the sacrament rightly celebrated. However, it would injure him, if from the defect of that intention, the sacrament would be made void. 2. Because there is the same relation of the sacrament as of the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.7.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a> › <a href="../topics/the-sacraments-in-general/minister-and-intention/the-ministers-intention.html">The minister&#x27;s intention</a></span><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a> › <a href="../topics/the-sacraments-in-general/minister-and-intention/who-administers.html">Who administers</a></span></div>

</figure><figure class="quote" id="q-8e9662d15b" data-kw="union">
<blockquote><p>From this sealing arises the sacramental union of the sign with the thing signified. This is neither physical, such as is that of matter and form, of the subject and accident; nor local, by contact and contiguity; nor spiritual, so that by the signs the power of justifying and regenerating is immediately instilled. But it is wholly schetical (schetikē) and relative, or moral (such as between the rites of investiture and the office with which anyone is invested or between a pledge and the thing which the pledge signifies). Just as things signified are not joined by a natural position with those words by which they are signified and by the very substance, but only by a relation and schesis (schesei), inasmuch as those words (as the marks of things) make the things themselves as it were present to the understanding of those who perceive them. Thus also a sacrament (which moreover is said to be a certain visible word, bearing into the eyes that which words bring into the ears) demands no local presence or nonexistence (inexistentiam) of the sign with the thing signified, but implies the</p></blockquote>

inked</span></div>
</figure><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul. …</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4e00f766c2" data-kw="">
<blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankfurt] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things† should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, p. 188</span></figcaption>

<blockquote><p>5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: Griffin, 1644), ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?, p. 254</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-dc9d6f7f58" data-kw="">
<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue</cite>, … (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…”

</figure><figure class="quote" id="q-dd7b17c97f" data-kw="">
<blockquote><p>Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 6 (VA: Master Poole Publishing, 2011), pp. 152-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>9. Though we must not by profession, word or subscription own the sin of any Church, we must [in some circumstances] join in their communion in the worship of God, with those whose worship is mixed with sin in matter and manner, so it be not sin that is by its evil predominant against the good of the duty, to make the work rejected of God (like poison in our food, which makes the hurt greater than the good), because else we must neither worship God ourselves [because of our own impurities], nor join with any in the world: all the works of sinful men being mixed with sin. To deny this, is virtually to separate from all the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Must not own Sin, Yet must Join with Others with Mixed Worship</span></figcaption>

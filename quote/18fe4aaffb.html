<main class="wrap"><figure class="quote" id="q-18fe4aaffb" data-kw="">
<blockquote><p>…do it obedientially, hearken to the commands, that thy peace may be as a river flowing in the joys of faith: If thus thou wilt hear and open to Christ, who stands and knocks at the door of thy heart, He will come in to thee, and sup with thee, and thou with Him, Rev. 3:20. He will come in to thee in intimate communion, and sup with thee in the acceptance of thy graces, and thou shalt sup with him at a banquet of love: Thou mayst experimentally say that the Gospel is come to thee in power and in the Holy Ghost, and in much assurance, as the apostle speaks, 1 Thess. 1:5. In power in, the first work of conversion; in the Holy Ghost, in the gracious indwelling of it after faith; and in much assurance, in the sealings of truth and love upon the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Faith considered in its Nature, Working &amp; Growth (London: Cockerill, 1675), ch. 14</cite>, p. 444-45</span></figcaption>

</figure><figure class="quote" id="q-0c54be44c6" data-kw="">
<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized (London: E.M., 1660), Sermon 18</cite>, p. 397</span></figcaption>

</figure><figure class="quote" id="q-c6f5c835f2" data-kw="">
<blockquote><p>Here the Lord Jesus Christ stands knocking at the Laodicean’s door; He would fain have them to sup with Him, and that He might sup with them; that is, that they might have intimate communion and fellowship one with another. Now, pray tell me, what preparations or qualifications had these Laodiceans to entertain Christ? Surely none; for they were lukewarm, they were ‘neither hot nor cold,’ they were ‘wretched, and miserable, and poor, and blind, and naked’; yet Christ to show his free grace and his condescending love, invites the very worst of sinners to open to Him, though they were no ways so prepared or qualified to entertain Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices in Works, vol. 1, Appendix</cite>, pp. 147-48</span></figcaption>

<blockquote><p>Angels are spiritual substances created by God after his own image, and ordained to sing glory to God on high, and to be ministers upon earth, of the church or of the heirs of everlasting salvation. … By these descriptions and the testimonies cited in the text of the Epistle, seven differences may be gathered.

1 Christ is verily and by nature the son of God, begotten of the substance of the eternal father. Psal. 2. This day have I begotten thee. 2. Reg. 7. I will be a father to him, and he shall be a son to me. The Angels are not verily and by nature the sons of God, but only by adoption or grace. Ergo Christ far excelleth all the Angels.

2 Invocation is an honour to be attributed only to God the searcher of hearts, according to this saying: Thou shalt worship the Lord thy God; and in general, whosoever is worshipped, is better than he that worshippeth: But God commandeth that Christ shall be called upon, yea even of the Angels: Ps. 96. Worship ye him all ye Angels of God. Ergo Christ is both God, and also far more excellent than all the Angels.

3 Christ is the maker of heaven and earth. Psa. 101. Thou O Lord hast founded the earth from the beginning. Angels are substances created, as Psal. 103. is said: which makest thine Angels spirits, and thy ministers a flame of fire, that is to say, clear substances, which in sheerness, force, nimbleness, and swiftness, are like to fire.

4 Christ is an everlasting king, bearing a rightful scepter, and justifying all that flee unto him. Psa. 45. Thy throne O God endureth for ever and ever, the scepter of righteousness is the scepter of thy kingdom. But the Angels are but only the servants of this king, and impart not their righteousness unto any others.

5 Christ is verily and naturally the son of God. Ps. 45. O God (Christ,) thy God (the eternal father,) hath anointed thee with the oil of gladness for thy fellows’ sakes. Now the Angels are not God, but creatures.

6 Christ is anointed with fulness of the holy Ghost, to the intent he may anoint his fellows, that is to say, the rest of the members of the church. The Angels are not anointed with fulness of the holy Ghost, neither can they of their own power anoint others and garnish them with the gifts of the holy Ghost.

7 Christ sitteth at the right hand of the eternal Father, that is to say, reigneth in equal majesty and glory with the everlasting father. The Angels sit not at the right hand of the Father, nor reign in equal power with the eternal father: but are the ministers of Christ and of the whole church, pitching their tents round about all those that fear him …</p></blockquote>

<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.”

<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>

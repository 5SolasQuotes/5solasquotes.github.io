<main class="wrap"><figure class="quote" id="q-4e9e9a1064" data-kw="">
<blockquote><p>2nd, from the significancy of the symbol; since bread, as the principal natural nourishment of our bodies, represents his flesh, which, as living bread, he gave for the life of the world.–– John 6:51 . But the kind of bread, whether leavened or unleavened, is not specified in the command, nor is it rendered essential by the nature of the service. Christ used unleavened bread because it was present at the Passover. The early Christians celebrated the Communion at a common meal, with the bread of common life, which was leavened. The Romish Church has used unleavened bread ever since the eighth century, and commands the use of the same as the only proper kind, but does not make it essential (“Cat. Conc. Trident.,” Pt. 2, ch. 4:, &amp;&amp; 13 and 14). The Greek Church insists upon the use of leavened bread. The Lutherans Church uses unleavened bread. The Reformed Church, including the Church of England, regards the use of leavened bread, as the food of common life, to be most proper, since bread in the Supper is the symbol of spiritual nourishment. The use of sweet cake, practiced in some of our churches is provincial and arbitrary, and is without any support in Scripture, tradition, or good taste.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quotes was compiled by Andy Webb</cite></span></figcaption>

</figure><figure class="quote" id="q-118969d3d1" data-kw="institution">
<blockquote><p>The other sacrament of the New Testament is the holy Supper, in which, by the distribution and reception of broken bread and poured-out wine, is declared and sealed to believers the communion of the body of Christ broken for them on the cross and of his blood shed for them unto eternal life. The more illustrious and of greater moment to the consolation of believers this mystery of the Christian religion is, with so much the greater violence has Satan always endeavored to obscure and corrupt it in order to deprive the church of this inestimable treasure. Hence it has happened that in no part of religion have such prolix and animated disputations been raised up, so that at length the Romanists seem to have constituted the sum of theology in this article, nor is there anything in theology or philosophy which they have not brought to bear upon this and compelled to serve their purpose. Various names by which it is usually expressed: (1) the Lord’s Supper (1 Cor. 11:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.21.1</span></figcaption>

</figure><figure class="quote" id="q-364d33927d" data-kw="">
<blockquote><p>The Lord’s Supper is the other Sacrament of the New Testament; in which Christians that are of age, receive spiritually Christ’s body and blood sealed to them in the reception of Bread and Wine according to Christ’s institution. The Rules … III. The outward matter thereof, or Signs, are Bread and Wine. IV. The Supper is lame, without both Signs; and to rob the people of the Cup, is Sacrilege. V. The inward matter is Christ, with all his satisfaction and merit. VI. As it is Jewish superstition, to use unleavened Bread; so the Popish Penny-Wafers are superstitious relics.</p></blockquote>

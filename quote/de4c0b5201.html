<main class="wrap"><figure class="quote" id="q-de4c0b5201" data-kw="">
<blockquote><p>My assurances are not the Marvels of Merlin, nor yet the dark sentences of profane prophesies, but: 1. the plain truth of God’s Word; 2. the invincible justice of the everlasting God, and 3. the ordinary course of his punishments and plagues from the beginning are my assurance and grounds. God’s Word threatens destruction to all unobedient; his immutable justice must require the same. The ordinary punishments and plagues show examples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, pp. 168-9</span></figcaption>

<blockquote><p>…the ordinary power of working them is ceased: for it was only given to the apostles in the primitive Church, as a means to confirm the doctrine of the Gospel to unbelievers, that never heard of Christ before. So Paul says, ‘Strange tongues’ (that is, the gift of speaking strange languages, without ordinary teaching) ‘are for a sign, not to them that believe, but to them that believe not,’ 1 Cor. 14:22. And for the same end were all extraordinary gifts then given. Howbeit the Papists stand stiffly in defending the continuance of these gifts.</p></blockquote>

<blockquote><p>The durability of the view that Reformation and post-Reformation ‘prophecy’ was mediate revelation as an application of Scripture to providence by the leading of the Spirit is seen most clearly where Westminster theology took hold and had its greatest success…</p></blockquote>

</figure><figure class="quote" id="q-dc91030cbf" data-kw="">
<blockquote><p>We do not profess to teach anything new. We consider the teaching of the Westminster Confession of Faith and other standards of the Reformed Churches to be absolutely true and sufficient, as they set forth the gracious operations of the Holy Spirit in redemption. We do hope, however, to set up and maintain the traditional view as taught in them, by treating the subject from a different point of view, and in refutation of heresies that were not prominently before the minds of those who formulated these standards. … Our aim is to ascertain and classify all the works of the Holy Spirit in all ages and dispensations, and to differentiate them one from the other by accurate definition; and also to determine, from the Scriptures, which have been permanent and universal and will be till the end of time, and which were limited and temporary. So far as we know, this ground has not been traversed, nor indeed has its importance been appreciated. Having accomplished this, as we hope and believe, we then bring the more popular claims of Modern Mysticism to the test of ascertained principles, and then consider their special pleas based on the Scriptures. … The thoughtful reader may perhaps find it profitable to read ‘Summary I’ at the close before reading the discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-shearer.html">John Shearer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Modern Mysticism; or, The Covenants of the Spirit, their Scope &amp; Limitations</cite>, (Richmond, 1905) ToC</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

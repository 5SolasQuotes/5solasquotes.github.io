<blockquote><p>Now, since power is proper to God in relation to His effects, and since power, as was said, has the character of a principle, and since principle expresses relationship to that which proceeds from it, it is evident that something can be said of God relatively, with regard to His effects.</p></blockquote>

— Thomas Aquinas, Contra Gentiles, Bk. 2, On Creation | 11. ‘That Something is Said of God in Relation to Creatures’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow%2C+since+power+is+proper+to+God+in+relation+to+His+effects%2C+and+since+power%2C+as+was+said%2C+has+the+character+of+a+principle%2C+and+since+principle+expresses+relationship+to+that+which+proceeds+from+it%2C+it+is+evident+that+something+can+be+said+of+God+relatively%2C+with+regard+to+His+effects.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Contra+Gentiles%2C+Bk.+2%2C+On+Creation+%7C+11.+%E2%80%98That+Something+is+Said+of+God+in+Relation+to+Creatures%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbaff700da8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/baff700da8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-affections-of-god/#:~:text=Now%2C%20since%20power%20is%20proper%20to,relatively%2C%20with%20regard%20to%20His%20effects&amp;text=Now%2C%20since%20power%20is%20proper%20to%20God%20in&amp;text=of%20God%20relatively%2C%20with%20regard%20to%20His%20effects" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51e13b3efd" data-kw="">
<blockquote><p>To the love of God belong what may be called his desires or wishes, etc. Now it is the absence of good which excites desire; but since God enjoys all good, it is plain that desire cannot properly apply to Him; yet it is frequently attributed to Him in scripture, and to this may be referred all those passages in which God is introduced speaking to this effect: “O that my people had hearkened unto me.” (Ps. 81:14; Isa. 48:14; Lk. 19:42) Therefore this desire in God denotes, that man’s obedience is highly pleasing to him, and that He will not pass it by unrewarded; at the same time it points out man’s duty, and his great wickedness in not discharging this duty. To this desire is opposed aversion, by which God is said to loathe sin, and to have no pleasure in the destruction of the creature. From what has been said, we clearly see what ideas we ought to have of the hope of God, of his joy, sorrow, jealousy, etc. Hope or expectation in God, intimates that the thing is due to Him. Thus when He said that He “looked that his vineyard should bring forth grapes,” (Isa. 5:2) He meant that the vineyard owed him fruit, and could not be fruitless without sin. God is said to rejoice when anything is pleasing to Him; and also when He performs anything which displays his glory, as when He does good to his people, or when He punishes the rebellious and ungodly. (Deut. 28:63; 30:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, (d. 1724), bk. 2, ch. 5, p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-f55f6f4391" data-kw="">
<blockquote><p>Properly, in the sense by him [Mr. Biddle] pointed to, anger, wrath, etc., are not in God… If He be properly and literally angry and furious, and wrathful, He is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. 4. Mr. Biddle [a Socinian] has given us a rule in his preface, that when any thing is ascribed to God in one place which is denied of Him in another, then it is not properly ascribed to Him. Now, God says expressly that ‘fury’ or anger ‘is not in Him,’ Isa. 27:4; and therefore it is not properly ascribed to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, pp. 111-12, 114-5, p. 112</span></figcaption>

</figure><figure class="quote" id="q-d0708031ae" data-kw="">
<blockquote><p>Now, these relations which refer to God’s effects cannot possibly exist in Him really. [2] For they cannot exist in Him as accidents in a subject, since there is no accident in Him… Neither can they be God’s very substance… so that God’s substance would then have to be referred to something else. But that which is essentially referred to another depends upon it in a certain way, since it can neither be nor be understood without it. Hence, it would follow that God’s substance would depend on something else extrinsic to it, so that He would not be, of Himself, the necessary being… Therefore, such relations do not really exist in God. Furthermore, we observe that whatever receives something anew must be changed, either essentially or accidentally. Now, certain relations are predicated of God anew; for example, that He is Lord or Governor of this thing which begins to exist anew. Hence, if a relation were predicated of God as really existing in Him, it would follow that something accrues to God anew, and thus that He is changed either essentially or accidentally;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contra Gentiles</cite>, Bk. 2, On Creation | 12. ‘That relations predicated of God in reference to creatures do not really exist in Him’</span></figcaption>

<blockquote><p>The second part of the division, however, that between ‘proper’ and ‘figurative,’ is the point of distinction between the affections and all of the attributes discussed previously [life, intellect, will, righteousness, truth, pwer, glory, etc.]. For the affections of the divine will or, as they are sometimes called, divine virtues, are attributed to God, not properly, but figuratively… The affections are, therefore, either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. … …the [reformed] orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions… …This, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept… A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.433 433. [William] Ames, Marrow, I.iv.63… the point of the theological argument is that God act[s] but is not acted upon. The Reformed orthodox understanding of God, in accord with the greater part of the Christian tradition, assumes the divine immutability, and, typically, denies change and, certainly, acquired qualities to God. … The divine affections… are divine perfections that have some analogy to the dispositions or habits of the human will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics 2nd</cite>, ed. (Baker Academic, 2003), vol. 3, ch. 6.3, ‘The Divine Affections &amp; Virtues’, pp. 551-89; pp. 552-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

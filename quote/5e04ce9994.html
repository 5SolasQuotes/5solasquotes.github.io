<main class="wrap"><figure class="quote" id="q-5e04ce9994" data-kw="">
<blockquote><p>On this subject [of church-state relations] there are various and conflicting opinions. 1. One of these is opposed to all connection between Church and State; and this opinion is commonly defended on two separate grounds. First, it is alleged that because religion is a thing altogether personal, lying exclusively between a man and his Maker, therefore its support ought to depend on the voluntary contributions of professors. And secondly, it is argued that the State is properly little else than a national arbiter of party interests in things civil, and that it has absolutely nothing to do with religion. The latter of these is the more fundamental; and our objection to it is, that, so far as we can see, a nation acting on this principle must continue to be in all time coming essentially infidel.

Its people may, independently of this, be all of them professing members of the Church of Christ. But the nation itself, and in its corporate capacity, cannot, as we think, be other than unbelieving—making no profession of the faith of the gospel. And then we are at a loss to see how, in these circumstances, “the kingdoms of this world are to become the kingdoms of our Lord and of his Christ;” how “kings are to be nursing fathers, and their queens nursing mothers,” of the Church; and still more, how, in accordance with this theory, it should be said that by Christ “kings reign and princes decree justice” — that by him “princes rule and nobles, even all the judges of the earth” — and farther, that he hath on his vesture and on his thigh a name written, “King of kings and Lord of lords” (Rev. xi. 15; Isa. xlix. 23; Prov. viii. 15, 16; Rev. xix. 16).

There are also practical difficulties in the way. A nation, acting rigidly on this principle, would, as we think, be compelled to withdraw all public protection from the observance of the weekly Sabbath, and to disregard the moral obligation of oaths given in evidence. The nation, as a nation, would thus have to act on principles altogether at variance with those of the families and individuals composing it — a thing as impracticable as inconsistent with the proper bonds of society; but it is chiefly as regards the prophetical vision that we have to do with this theory, and here the objection is equally fundamental.

For, if the very idolatry of nations be self-will, and if this will is never to be subordinated to the will of God, then how is the stone to pound the image? and still more, how is it to take the place of the image? How is the very will of God, as taught in his Word and observed in his Church, to supplant and destroy the will of man in all things national? And yet all this is foretold, for, in the room of the image, there is to be “a kingdom, which the God of heaven shall set up, and which shall never be destroyed.” (V. 44.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-macfarlan.html">Duncan MacFarlan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church and the World in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>O Jehovah, who shall dwell in thy tabernacle? As nothing is more common in the world than falsely to assume the name of God, or to pretend to be his people, and as a great part of men allow themselves to do this without any apprehension of the danger it involves, David, without stopping to speak to men, addresses himself to God, which he considers the better course; and he intimates, that if men assume the title of the people of God, without being so in deed and in truth, they gain nothing by their self-delusion, for God continues always like himself, and as he is faithful himself, so will he have us to keep faith with him in return. No doubt, he adopted Abraham freely, but, at the same time, he stipulated with him that he should live a holy and an upright life, and this is the general rule of the covenant which God has, from the beginning, made with his Church.

The sum is, that hypocrites, who occupy a place in the temple of God, in vain pretend to be his people, for he acknowledges none as such but those who follow after justice and uprightness during the whole course of their life. David saw the temple crowded with a great multitude of men who all made a profession of the same religion, and presented themselves before God as to the outward ceremony; and, therefore, assuming the person of one wondering at the spectacle, he directs his discourse to God, who, in such a confusion and medley of characters, could easily distinguish his own people from strangers.

There is a threefold use of this doctrine. In the first place, If we really wish to be reckoned among the number of the children of God, the Holy Ghost teaches us, that we must show ourselves to be such by a holy and an upright life; for it is not enough to serve God by outward ceremonies, unless we also live uprightly, and without doing wrong to our neighbours.

In the second place, As we too often see the Church of God defaced by much impurity, to prevent us from stumbling at what appears so offensive, a distinction is made between those who are permanent citizens of the Church, and strangers who are mingled among them only for a time. This is undoubtedly a warning highly necessary, in order that when the temple of God happens to be tainted by many impurities, we may not contract such disgust and chagrin as will make us withdraw from it.

By impurities I understand the vices of a corrupt and polluted life. Provided religion continue pure as to doctrine and worship, we must not be so much stumbled at the faults and sins which men commit, as on that account to rend the unity of the Church. Yet the experience of all ages teaches us how dangerous a temptation it is when we behold the Church of God, which ought to be free from all polluting stains, and to shine in uncorrupted purity, cherishing in her bosom many ungodly hypocrites, or wicked persons.

From this the Catharists, Novatians, and Donatists, took occasion in former times to separate themselves from the fellowship of the godly. The Anabaptists, at the present day, renew the same schisms, because it does not seem to them that a church in which vices are tolerated can be a true church. But Christ, in Matthew 25:32, justly claims it as his own peculiar office to separate the sheep from the goats; and thereby admonishes us, that we must bear with the evils which it is not in our power to correct, until all things become ripe, and the proper season of purging the Church arrive. At the same time, the faithful are here enjoined, each in his own sphere, to use their endeavours that the Church of God may be purified from the corruptions which still exist within her.

And this is the third use which we should make of this doctrine. God’s sacred barn-floor will not be perfectly cleansed before the last day, when Christ at his coming will cast out the chaff; but he has already begun to do this by the doctrine of his gospel, which on this account he terms a fan. We must, therefore, by no means be indifferent about this matter; on the contrary, we ought rather to exert ourselves in good earnest, that all who profess themselves Christians may lead a holy and an unspotted life.

But above all, what God here declares with respect to all the unrighteous should be deeply imprinted on our memory; namely, that he prohibits them from coming to his sanctuary, and condemns their impious presumption, in irreverently thrusting themselves into the society of the godly. David makes mention of the tabernacle, because the temple was not yet built. The meaning of his discourse, to express it in a few words, is this, that those only have access to God who are his genuine servants, and who live a holy life.</p></blockquote>

— John Calvin, Commentary on the Book of Psalms, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 203-05.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CO+Jehovah%2C+who+shall+dwell+in+thy+tabernacle%3F+As+nothing+is+more+common+in+the+world+than+falsely+to+assume+the+name+of+God%2C+or+to+pretend+to+be+his+people%2C+and+as+a+great+part+of+men+allow+themselves+to+do+this+without+any+apprehension+of+the+danger+it+involves%2C+David%2C+without+stopping+to+speak+to+men%2C+addresses+himself+to+God%2C+which+he+considers+the+better+course%3B+and+he+intimates%2C+that+if+men+assume+the+title+of+the+people+of+God%2C+without+being+so+in+deed+and+in+truth%2C+they+gain+nothing+by+their+self-delusion%2C+for+God+continues+always+like+himself%2C+and+as+he+is+faithful+himself%2C+so+will+he+have+us+to+keep+faith+with+him+in+return.+No+doubt%2C+he+adopted+Abraham+freely%2C+but%2C+at+the+same+time%2C+he+stipulated+with+him+that+he+should+live+a+holy+and+an+upright+life%2C+and+this+is+the+general+rule+of+the+covenant+which+God+has%2C+from+the+beginning%2C+made+with+his+Church.%0A%0AThe+sum+is%2C+that+hypocrites%2C+who+occupy+a+place+in+the+temple+of+God%2C+in+vain+pretend+to+be+his+people%2C+for+he+acknowledges+none+as+such+but+those+who+follow+after+justice+and+uprightness+during+the+whole+course+of+their+life.+David+saw+the+temple+crowded+with+a+great+multitude+of+men+who+all+made+a+profession+of+the+same+religion%2C+and+presented+themselves+before+God+as+to+the+outward+ceremony%3B+and%2C+therefore%2C+assuming+the+person+of+one+wondering+at+the+spectacle%2C+he+directs+his+discourse+to+God%2C+who%2C+in+such+a+confusion+and+medley+of+characters%2C+could+easily+distinguish+his+own+people+from+strangers.%0A%0AThere+is+a+threefold+use+of+this+doctrine.+In+the+first+place%2C+If+we+really+wish+to+be+reckoned+among+the+number+of+the+children+of+God%2C+the+Holy+Ghost+teaches+us%2C+that+we+must+show+ourselves+to+be+such+by+a+holy+and+an+upright+life%3B+for+it+is+not+enough+to+serve+God+by+outward+ceremonies%2C+unless+we+also+live+uprightly%2C+and+without+doing+wrong+to+our+neighbours.%0A%0AIn+the+second+place%2C+As+we+too+often+see+the+Church+of+God+defaced+by+much+impurity%2C+to+prevent+us+from+stumbling+at+what+appears+so+offensive%2C+a+distinction+is+made+between+those+who+are+permanent+citizens+of+the+Church%2C+and+strangers+who+are+mingled+among+them+only+for+a+time.+This+is+undoubtedly+a+warning+highly+necessary%2C+in+order+that+when+the+temple+of+God+happens+to+be+tainted+by+many+impurities%2C+we+may+not+contract+such+disgust+and+chagrin+as+will+make+us+withdraw+from+it.%0A%0ABy+impurities+I+understand+the+vices+of+a+corrupt+and+polluted+life.+Provided+religion+continue+pure+as+to+doctrine+and+worship%2C+we+must+not+be+so+much+stumbled+at+the+faults+and+sins+which+men+commit%2C+as+on+that+account+to+rend+the+unity+of+the+Church.+Yet+the+experience+of+all+ages+teaches+us+how+dangerous+a+temptation+it+is+when+we+behold+the+Church+of+God%2C+which+ought+to+be+free+from+all+polluting+stains%2C+and+to+shine+in+uncorrupted+purity%2C+cherishing+in+her+bosom+many+ungodly+hypocrites%2C+or+wicked+persons.%0A%0AFrom+this+the+Catharists%2C+Novatians%2C+and+Donatists%2C+took+occasion+in+former+times+to+separate+themselves+from+the+fellowship+of+the+godly.+The+Anabaptists%2C+at+the+present+day%2C+renew+the+same+schisms%2C+because+it+does+not+seem+to+them+that+a+church+in+which+vices+are+tolerated+can+be+a+true+church.+But+Christ%2C+in+Matthew+25%3A32%2C+justly+claims+it+as+his+own+peculiar+office+to+separate+the+sheep+from+the+goats%3B+and+thereby+admonishes+us%2C+that+we+must+bear+with+the+evils+which+it+is+not+in+our+power+to+correct%2C+until+all+things+become+ripe%2C+and+the+proper+season+of+purging+the+Church+arrive.+At+the+same+time%2C+the+faithful+are+here+enjoined%2C+each+in+his+own+sphere%2C+to+use+their+endeavours+that+the+Church+of+God+may+be+purified+from+the+corruptions+which+still+exist+within+her.%0A%0AAnd+this+is+the+third+use+which+we+should+make+of+this+doctrine.+God%E2%80%99s+sacred+barn-floor+will+not+be+perfectly+cleansed+before+the+last+day%2C+when+Christ+at+his+coming+will+cast+out+the+chaff%3B+but+he+has+already+begun+to+do+this+by+the+doctrine+of+his+gospel%2C+which+on+this+account+he+terms+a+fan.+We+must%2C+therefore%2C+by+no+means+be+indifferent+about+this+matter%3B+on+the+contrary%2C+we+ought+rather+to+exert+ourselves+in+good+earnest%2C+that+all+who+profess+themselves+Christians+may+lead+a+holy+and+an+unspotted+life.%0A%0ABut+above+all%2C+what+God+here+declares+with+respect+to+all+the+unrighteous+should+be+deeply+imprinted+on+our+memory%3B+namely%2C+that+he+prohibits+them+from+coming+to+his+sanctuary%2C+and+condemns+their+impious+presumption%2C+in+irreverently+thrusting+themselves+into+the+society+of+the+godly.+David+makes+mention+of+the+tabernacle%2C+because+the+temple+was+not+yet+built.+The+meaning+of+his+discourse%2C+to+express+it+in+a+few+words%2C+is+this%2C+that+those+only+have+access+to+God+who+are+his+genuine+servants%2C+and+who+live+a+holy+life.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Book+of+Psalms%2C+%281557%29%2C+trans.+James+Anderson+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+4b%3A+203-05.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6caac118dd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6caac118dd.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/03/john-calvin-impurity-in-the-church-is-not-a-reason-for-schism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

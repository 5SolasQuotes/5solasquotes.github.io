<main class="wrap"><figure class="quote" id="q-5dbfab2b4a" data-kw="">
<blockquote><p>For hardliners like Hamilton, the ‘under-hand-dealings’ of Shields, Linning and Boyd and the Societies’ connivance in the Revolution settlement broke their Covenanted obligations and diluted the Societies’ testimony which they had so faithfully maintained. In 1691, Hamilton and some societies revived the Societies’ general correspondence or convention to maintain their former testimony in every ‘pendicule’ and to stand ‘alone’ until their cause was vindicated. Later known as the MAcmillanites, the continuing Societies would go on to form the Cameronian or Reformed Presbyterian Presbyterian Church. The continuing Societies’ formed part of a patchwork with other existing fragments of the wider militant movement which rejected the Revolution settlement. They included the rump of the Cameronian Russellites, who maintained their split from the Societies after the reunion of 1688, and the non-Cameronian Hebronites, the followers of John Hepburn… All those sects originated in the schisms of the United Societies and, like the post-Revolution Church, laid claim to the Societies’ heritage…. …Their response to the Revolution, in particular, reveals that persecution was a major factor in shaping their militancy. When persecution was removed at the Revolution, the majority of the Societies were able to moderate their demands and co-ordinate their actions with other presbyterians… The Societies were… one of the midwives of the Revolution. Even though the Revolution sidelined their Covenanted platform, the leadership and majority of the Societies accepted and supported it in the hope that it would place Scotland on a better path than it had been under the Catholic King James and the Restoration regime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland</cite>, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 243</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3812d646d" data-kw="">
<blockquote><p>As I ever abhorred division and faction in the Church, as that which tends to its utter ruin if the Lord prevent it not;” he adds (and here I join with him), “I would, in the bowels of my Lord and Master, if such a feckless one as I may presume to persuade and exhort both ministers and professors: ‘If therre by any consolation in Christ, if any comfort in love, if any fellowship of the Spirit, if any bowels and mercies, that ye be like-minded, having the same love, being of one accord, of one mind. In lowliness of mind let each esteem other better than themselves.’ (Phil. 2:2-3)</p></blockquote>

<blockquote><p>Schism is either a rash or an unjust separation upon the account of religion. It is with schism, as with error: a light error continued in with obstinacy becomes heresy. So there is a schism which may not be called unjust, but only rash, being grounded on a light cause; but if pertinacy be added, when the levity of the cause does appear, it becomes truly, and [Greek] an eminent schism. This rash schism may be known, either (à priori) from its previous cause, for no man being compelled to it (if we will speak the truth), it proceeds from self-love, therefore also hatred follows upon it. Nor would any rash schism be made if we had charity, which is the most perfect bond and is not easily provoked, and thinks no evil. It is therefore a manifest note of hatred, which hatred may arise either from an offence really given or only taken; as when a man is grieved that another is preferred before him. Again, a schism is made rashly either by the chief authors upon a light occasion, as if when an ulcer does appear upon any member, the surgeon should presently think of cutting off that member without applying other means, or expecting what nature may do. But we may suppose that the schism be made upon the occasion of heresy, and then the separation may be thought to be just and not rash. To which I answer: That as judges, who in too great passion do condemn a malefactor that is really guilty, may be unjust, because they are acted rather by a certain ferity of mind than by the love of justice: so that separation, which proceeds from hatred, though it may have just causes, yet is unjust. Again, the rashness of separation appears, à posteriori, when it is made on a light occasion, that is, where there is not a great and intolerable persecution, nor heresie, nor idolatry. For, first, if the persecution be tolerable, that is, if it do not concern our lives or things necessary thereunto, we may not catch at an opportunity of departing: for as they that delight in a civil war, though they have the better cause, and just occasions, yet because they are glad of such occasions, they are murderers and enemies of their country. 2ly, separation is rash if the error in the Church from which he departs be neither heresie, nor superstition: for if the error be tolerable, as a superstitious rite may be, we may not separate; as a sick man is not to be forsaken unless his disease be deadly and contagious, and then not without grief. Lastly, separation is rash when it is made because of corruption of manners, to which purpose our Savior said, ‘They sit in Moses’s chair, therefore do whatever they say unto you.’ [Mt. 23:1-3] This is the meaning of our Savior: Wherever the purity of doctrine does remain, there God has a Church, though overspread with many scandals. Now an unjust Schism is that, which is made where there is no persecution or heresy, no error, superstition, or idolatry, none, or but few scandals; such was the schism of the Donatists. And this is the greatest degree of schism: and it is either negative, which is a bare departure only, without gathering of new congregations; or positive, when another Church is erected, which does separately use ecclesiastical laws, and the administration of the Word of God and sacraments, which the Scripture calls setting up of altar against altar [2 Kn. 16:10-16; Hos. 8:11; 10:1-2]; for, though a peaceable departure from the Church may be lawful and just, yet if new associations be entred into, it is unjust; for this cannot be done unless there be real hatred between brethren, contrary to Christianity; for the end of the commandment is charity. It must therefore be considered again and again whether the cause of this separation be of so great moment as that the glory of God and salvation depends upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Schism, p. 322 in The Character of a Separatist, or Sensuality the ground of Separation… (London, 1677), Picture &amp; Character of a Separatist, pp. 23-25 Cameron (c. 1579 – 1625) was a Scottish theologian, professor and formalist.</span></figcaption>

ust.+Again%2C+the+rashness+of+separation+appears%2C+%C3%A0+posteriori%2C+when+it+is+made+on+a+light+occasion%2C+that+is%2C+where+there+is+not+a+great+and+intolerable+persecution%2C+nor+heresie%2C+nor+idolatry.+For%2C+first%2C+if+the+persecution+be+tolerable%2C+that+is%2C+if+it+do+not+concern+our+lives+or+things+necessary+thereunto%2C+we+may+not+catch+at+an+opportunity+of+departing%3A+for+as+they+that+delight+in+a+civil+war%2C+though+they+have+the+better+cause%2C+and+just+occasions%2C+yet+because+they+are+glad+of+such+occasions%2C+they+are+murderers+and+enemies+of+their+country.+2ly%2C+separation+is+rash+if+the+error+in+the+Church+from+which+he+departs+be+neither+heresie%2C+nor+superstition%3A+for+if+the+error+be+tolerable%2C+as+a+superstitious+rite+may+be%2C+we+may+not+separate%3B+as+a+sick+man+is+not+to+be+forsaken+unless+his+disease+be+deadly+and+contagious%2C+and+then+not+without+grief.+Lastly%2C+separation+is+rash+when+it+is+made+because+of+corruption+of+manners%2C+to+which+purpose+our+Savior+said%2C+%E2%80%98They+sit+in+Moses%E2%80%99s+chair%2C+therefore+do+whatever+they+say+unto+you.%E2%80%99+%5BMt.+23%3A1-3%5D+This+is+the+meaning+of+our+Savior%3A+Wherever+the+purity+of+doctrine+does+remain%2C+there+God+has+a+Church%2C+though+overspread+with+many+scandals.+Now+an+unjust+Schism+is+that%2C+which+is+made+where+there+is+no+persecution+or+heresy%2C+no+error%2C+superstition%2C+or+idolatry%2C+none%2C+or+but+few+scandals%3B+such+was+the+schism+of+the+Donatists.+And+this+is+the+greatest+degree+of+schism%3A+and+it+is+either+negative%2C+which+is+a+bare+departure+only%2C+without+gathering+of+new+congregations%3B+or+positive%2C+when+another+Church+is+erected%2C+which+does+separately+use+ecclesiastical+laws%2C+and+the+administration+of+the+Word+of+God+and+sacraments%2C+which+the+Scripture+calls+setting+up+of+altar+against+altar+%5B2+Kn.+16%3A10-16%3B+Hos.+8%3A11%3B+10%3A1-2%5D%3B+for%2C+though+a+peaceable+departure+from+the+Church+may+be+lawful+and+just%2C+yet+if+new+associations+be+entred+into%2C+it+is+unjust%3B+for+this+cannot+be+done+unless+there+be+real+hatred+between+brethren%2C+contrary+to+Christianity%3B+for+the+end+of+the+commandment+is+charity.+It+must+therefore+be+considered+again+and+again+whether+the+cause+of+this+separation+be+of+so+great+moment+as+that+the+glory+of+God+and+salvation+depends+upon+it.%E2%80%9D%0A%0A%E2%80%94+John+Cameron%2C+On+Schism%2C+p.+322+in+The+Character+of+a+Separatist%2C+or+Sensuality+the+ground+of+Separation%E2%80%A6+%28London%2C+1677%29%2C+Picture+%26+Character+of+a+Separatist%2C+pp.+23-25+Cameron+%28c.+1579+%E2%80%93+1625%29+was+a+Scottish+theologian%2C+professor+and+formalist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee9c9791a5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee9c9791a5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=Schism%20is%20either%20a%20rash%20or,God%20and%20salvation%20depends%20upon%20it&amp;text=Schism%20is%20either%20a%20rash%20or%20an%20unjust&amp;text=glory%20of%20God%20and%20salvation%20depends%20upon%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-404369d6ed" data-kw="">
<blockquote><p>And truly this argument of theirs seems to me very preposterous, as if they meant to tie two extremes together without a medium. For who with reason can affirm: Because a man is not of the woman, but the woman of the man, etc. Therefore ought a woman to wear a veil or a hood on her head, by an argument fetched from the moral Law of their creation? Truly I have often heard that the whole Law of God was to be known by the discourse of reason, and was called moral… But whoever could from the dictate of reason know that a woman, because she was made of man and for man, ought therefore to wear a veil or hood on her head, especially in the Church? That she is therefore inferior to her husband, and that therefore she ought to be subject unto him, is not abhorrent from the discourse of reason; and because she is for that cause subject to her husband, reason dictates she ought to acknowledge it, but by what means or sign she should do it in the Church or elsewhere, custom seems only to have taught, especially in Christian churches, as the apostle intimates in this place. For we read not of any such custom in the Old Testament. Rebecca truly might (which they instance for an example), when she came near to Isaac, Gen. 24:65, take a veil and cover herself, as well for modesty as for reverence. But Judah thought Thamar to be an harlot because she covered herself with a veil, Gen. 38:14-15. So that from the beginning the covering of a veil was no certain sign of subjection…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/norton-knatchbull.html">Norton Knatchbull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon Some Difficult Texts in all the Books of the New Testament</cite>, (Cambridge, 1693), on 1 Cor. 11:10, pp. 196-200 Knatchbull (1602–1685) was an English politician who sat in the House of Commons at various times between 1640 and 1679.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f25aa18f93" data-kw="">
<blockquote><p>But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fides Catholica</cite>, … (London, 1661), ch. 1, question 6, p. 82 Annand (1633–1689) was born and educated in Scotland (University of Aberdeen, 1649) and took another degree at Oxford in 1655. He was ordained by an Irish bishop and wrote the following as an Anglican minister against the English puritans upon the restoration of King Charles II. He then served as a Scottish minister from 1663-1689.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-17eeef07c0" data-kw="">
<blockquote><p>We must understand that in these civil things that might be decent and fit in one country (and consequently commanded of God) which in another country is utterly undecent, and consequently forbidden. It was a great sin among the Corinthians for a woman to come into the congregation with her head uncovered, that is, without a vail to cover her whole head, 1 Cor. 11:5. In our congregations (because it is undecent) it were a sin for a woman to come so attired. In which respect, though we have oft in the New Testament mention of fasts both public and private, of sackcloth used in them, we have no mention at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Fasting &amp; Prayer, &amp; Humiliation for Sin Delivered in Sundry Sermons</cite>, ... (London, 1633), Sermon 3 (1625), pp. 50-51</span></figcaption>

</figure><figure class="quote" id="q-e7f5caffe6" data-kw="">
<blockquote><p>Finney provides scholarly documentation and references to ancient sources that make it difficult to discredit the thesis that some Roman men did, in fact, have the serious obligation of appearing before a deity with their heads covered… He takes exception to the works of Jerome Murphy-O’Connor, Richard Hays, and Gordon Fee, who all argued that the text is discussing long hair, not veiling.” – Massey (2018) Abstract: “A significant yet missing dimension of scholarly engagement with 1 Cor. 11:2-16 is the consideration of honour-shame and its critical importance in ancient cultures. As this section of Paul’s letter abounds in honour-shame terminology, analysis of the text within such a framework will allow a profitable exploration of the reasons why the Corinthians are changing their attire (for purposes of this paper, their headcoverings), in a way that appears to be contrary to what may be considered the Pauline norm. The argument offered here is that notions of honour come to the fore and higher-status male Corinthians are employing modes of head attire to maintain distinctions of status. At the same time, Paul insists upon female head-coverings to safeguard the honour of the community within a context of the potential presence of non-believers in a communal service of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-finney.html">Mark Finney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Honour, Head-Coverings &amp; Headship: 1 Corinthians</cite>, 11.2-16 in Its Social Context’ JSNT 33 (2010), pp. 31-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Finney provides scholarly documentation and references to ancient sources that make it difficult to discredit the thesis that some Roman men did, in fact, have the serious obligation of appearing before a deity with their heads covered… He takes exception to the works of Jerome Murphy-O’Connor, Richard Hays, and Gordon Fee, who all argued that the text is discussing long hair, not veiling.” – Massey (2018) Abstract: “A significant yet missing dimension of scholarly engagement with 1 Cor. 11:2-16 is the consideration of honour-shame and its critical importance in ancient cultures. As this section of Paul’s letter abounds in honour-shame terminology, analysis of the text within such a framework will allow a profitable exploration of the reasons why the Corinthians are changing their attire (for purposes of this paper, their headcoverings), in a way that appears to be contrary to what may be considered the Pauline norm. The argument offered here is that notions of honour come to the fore and higher-status male Corinthians are employing modes of head attire to maintain distinctions of status. At the same time, Paul insists upon female head-coverings to safeguard the honour of the community within a context of the potential presence of non-believers in a communal service of worship.”

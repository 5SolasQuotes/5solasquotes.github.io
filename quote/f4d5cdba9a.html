<blockquote><p>4. For the profession itself, understand that we distinguish between that which makes a man a member of the universal Church (which must go first) and that which makes or declares a man to be a member of a particular church. And therefore we have first put down so much as is necessary to the former (largely, as being of most weight) and then put down that which is necessary to the later (briefly).</p></blockquote>

<blockquote><p>2. We deny also that by such a church-covenant [of the Independents] that right is obtained which the members of a Church in ecclesiastical communion have to the sacraments of grace, the privileges of the ecclesiastical ministry and other benefits which Christ has given to his Churches. The reasons of our denial are these: 1. Because the apostles have not ordained any such church-covenant between the members and the pastors of a church; neither in the admission of members into the Church did require such a covenant as necessary: but by the sacrament of baptism they received such as professed the truth and holiness into the Church-visible, and joined in the same exercises of divine worship with those who were without any such covenant received into an ecclesiastical body with themselves. See Acts 2:42,47; 5:13; 8:12; 9:6 &amp; 18:8. 2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithful of the whole national Church renewed their Covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant. 3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God hath not enjoined; without damnable will-worship. But God has not enjoined such a Covenant on the consciences of men as absolutely necessary: for there is no law of God wherein He has enjoined a necessity of this covenant as the essential form of Church-communion, so as that without it no man can be [a] member of a visible Church, or have right to the seals of the Covenant: Therefore the necessity of this covenant is a will-worship and so to be rejected. 4. The means whereby the members of a Church-visible are associated and united into external ecclesiastical communion, are baptism under the New Testament, as circumcision was under the Old Testament, 1 Cor. 12:13, as Cornelius, Acts 10:47, Lydia, Acts 16:15 and others, were by baptism engrafted into the body of the Church visible: which in those of years is joined with an embracing and profession of sound doctrine and subjection to the ordinances of God; as appears in the believers, Acts 2:41, the Bereans, Acts 17:10, and by Christ’s commandment, Mt. 28:19. Hence say the Professors of Leiden, that beside the primary uses of the sacrament of baptism, there are other secondary uses of it: to wit, the external engrafting them into a particular visible Church, Acts 2:41, the uniting of Christs members amongst themselves and into one body: 1 Cor. 12:12, and consequently upon these, a signification of our profession; and a distinction and separation from all other assemblies of unbelievers. This Church-covenant therefore is not the formal reason of our ecclesiastical communion in the Church-visible. Hence also our churches of the Netherlands in admitting of pastors or Church members do not enter into any such Church-covenant: which yet are true visible Churches of God; whose members have all essential requisites necessary to Church communion in the visible-Church. … 3. We reject also the opinion of those who affirm that the sacraments of the Old and New Testament are signs and seals to confirm this Church-covenant, and so instituted by God for the ratifying of it; that they are to be administered to those only, who are by such a Church-covenant united amongst themselves; but to be denied to others, though known to be godly, who be not in such a Church-communion and strict fellowship. Whereas it does most clearly appear out of the holy Scriptures that the sacraments were instituted by God in his Church, chiefly and in the first place to be signs and seals of the Covenant of Grace, and of the benefits promised in the Covenant of Grace, and of salvation procured by Christ for us, as is manifest by the sacrament of circumcision, Gen. 17:7,10; Rom. 4:11, of the Passover, 1 Cor. 5, of Baptism, Mark 1:4; Acts 2:38-39 and 22:16; Rom. 6:3-4; Titus 3:5, and of the Lord’s Supper, Mt. 26:26-28; 1 Cor. 11:24-26. But in a secondary respect we acknowledge the Sacraments to be seals of our outward engrafting into the Church-visible, and our conjunction into one body of the Church, Acts 2:41; 1 Cor. 12:12-13, and that, as we conceive, of the catholic Church; so that he that is baptized is not baptized into the communion only of this or that particular, or parochial Church, but is joined into that one body of the Church catholic and universal: as the whole ministry of the Church is given by Christ to men, to bring them to the unity and conjunction of the Church catholic and universal, and to engraft them as members into it, Eph. 4:11-12; 1 Cor. 12:28; Rom. 12:5-7. And as by Excommunication duly performed the person excommunicate is not cast out of this or that particular Church only, but is bound all the world over, and shut out from the brotherly communion of the Church universal, Mt. 18:17-18, so the sacraments of baptism and the Lord’s Supper are seals to a man of ecclesiastical communion, not only in a particular Church, but in the Church universal. And therefore we hold that these sacraments are to be administered not to those only who by a Church Covenant have joined themselves to some particular Church, but to all the members of the Church catholic, who have duly prepared themselves for the partaking of them. Thus our Belgic churches deny not the seal of Baptism to the children of those parents, who have not by a confession of faith and submission to ecclesiastical discipline, joined themselves to any particular church; according to the practice of the Jewish Church, Josh. 5:4-6, as neither do we deny the participation of the Lord’s Supper to those who by reason of the necessity of their calling cannot join themselves to any particular Church, but are forced to travel through diverse parochial churches.</p></blockquote>

— Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God. Written at the Command and appointment of the [Dutch] Walachrian Classis [Presbytery] (London, 1645), ch. 2, ‘Of a Church Covenant’, pp. 17-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+We+deny+also+that+by+such+a+church-covenant+%5Bof+the+Independents%5D+that+right+is+obtained+which+the+members+of+a+Church+in+ecclesiastical+communion+have+to+the+sacraments+of+grace%2C+the+privileges+of+the+ecclesiastical+ministry+and+other+benefits+which+Christ+has+given+to+his+Churches.+The+reasons+of+our+denial+are+these%3A+1.+Because+the+apostles+have+not+ordained+any+such+church-covenant+between+the+members+and+the+pastors+of+a+church%3B+neither+in+the+admission+of+members+into+the+Church+did+require+such+a+covenant+as+necessary%3A+but+by+the+sacrament+of+baptism+they+received+such+as+professed+the+truth+and+holiness+into+the+Church-visible%2C+and+joined+in+the+same+exercises+of+divine+worship+with+those+who+were+without+any+such+covenant+received+into+an+ecclesiastical+body+with+themselves.+See+Acts+2%3A42%2C47%3B+5%3A13%3B+8%3A12%3B+9%3A6+%26+18%3A8.+2.+Under+the+Old+Testament+the+particular+churches+in+the+synagogues+entered+not+into+any+solemn+church-covenant+in+the+admission+of+members%3A+but+only+on+extraordinary+occasions%2C+when+they+had+made+defection+from+God%2C+all+the+faithful+of+the+whole+national+Church+renewed+their+Covenant+with+God%2C+for+restoring+the+decayed+worship+of+God%3B+or+when+they+were+by+some+other+necessity+called+upon+for+renewing+such+a+covenant.+3.+No+man+can+enjoin+anything+upon+the+consciences+of+men+%28as+absolutely+necessary+to+enjoying+the+sacraments+of+divine+grace+and+the+benefits+of+the+ministry+of+the+Church%29+which+God+hath+not+enjoined%3B+without+damnable+will-worship.+But+God+has+not+enjoined+such+a+Covenant+on+the+consciences+of+men+as+absolutely+ <blockquote><p>IV. As to the people’s case, it needs no other answer: 1. No member may remove without cause: 2. Nor abruptly and uncharitably to the church’s dissatisfaction, when he may avoid it. But 3. He may remove upon many just causes (private or public) whether the church and pastors consent or not, so the manner be as becomes a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (1673), pt. 3, Christian Ecclesiastics, Question 104, ‘Is a pastor obliged to his flock for life? Or is it lawful so to oblige himself? And may he remove without their consent? And so also of a church-member, the same questions are put.’ Baxter was a congregationalist.</span></figcaption>

</figure><figure class="quote" id="q-0dcd3772ee" data-kw="">
<blockquote><p>The last and worst report of all the rest [of the New England churches] is in Article 12, where he [William Rathband] reports that if any amongst us do not seek and desire church fellowship in our way, [we] account them despisers of it, yea wicked and graceless persons. To which I answer with detestation: God forbid. We speak as knowing God hears all our words; we hope we are far from such a spirit: for we know well that many gracious and precious saints there amongst us may, and sometimes do, for a good time abstain from seeking and desiring church fellowship for other grounds than despite, wickedness and gracelessness: Sometimes because they are not settled in a place: sometimes because they desire more experience of the ministers and people where they should join: some for want of clear light and full conviction of the church-ways we walk in: and some others out of many fears about their own spiritual estate before God, judging themselves (through temptation) out of a state of grace and dare not venture upon the seals, etc. whom we yet esteem precious souls and have labored by all arguments we were able to encourage to come into church fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-weld.html">Thomas Weld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to W.R.’s</cite>, [William Rathband’s] Narration of the Opinions &amp; Practices of the Churches lately Erected in New England: Vindicating those Godly &amp; Orthodoxal Churches [in New England]… (London, 1644), Answer to ch. 3, pp. 19-20 Weld (1590?–1662) was a New England congregationalist. Rathband was a moderate English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

a+New+England+congregationalist.+Rathband+was+a+moderate+English+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0dcd3772ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0dcd3772ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=The%20last%20and%20worst%20report%20of,encourage%20to%20come%20into%20church%20fellowship&amp;text=The%20last%20and%20worst%20report%20of%20all%20the&amp;text=able%20to%20encourage%20to%20come%20into%20church%20fellowship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ddc2983088" data-kw="">
<blockquote><p>1. But come we to your [congregationalist] particulars: First, ‘by way of participation of the Lord’s Supper, the members of one church coming to another church, etc.’ But: 1. Why do you instance in this ordinance only? Have not their children, occasionally born there, a liberty also of baptisme? The rather, because baptism is not administred with respect to this or that church, but to the general visible Church: Unless you hold that a man or child is baptized to no church but that particular, and [is] an infidel to all the rest. Yet some of your brethren will hardly baptize a child of any but a member of their own church, which is next door to Anabaptism. … …4. But your reason I like very well: ‘For we receive the Lord’s Supper, not only as a seal of our communion with the Lord Jesus, and with his members in our own church, but also in all the churches of the saints’: Whence I infer, then, it is not any favour dispensed by you to a member of another church, but a dignity or privilege common to every member of that body, by virtue of that membership, and not with respect to his particular church membership. And I pray, is not baptism also a seal of our communion with all the members of Christ’s body? Why then may you not admit the children of the members of any church to be baptized by your pastors upon just occasion, as well as to admit the parents to the Lord’s Supper? Nay further: If the sacraments be seals of our communion with all the members of Christ, why do you not admit any true Christian, and his children, to the communion of the sacraments, though they be not as yet admitted members of any particular congregation? How dare you deny any member of that Body communion with its fellow-members, when it has union and communion with the Head? Consider it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s Called, ‘The Keys of the Kingdom of Heaven’. As also upon Another Tract of his Called, ‘The Way of the Churches of New England’. Manifesting: 1. The Weakness of his Proofs. 2. The Contradictions to Himself &amp; Others. 3. The Middle-Way</cite>, … (1645), ch. 4, pp. 39-41 Cawdrey was an English presbyterian and Westminster divine.</span></figcaption>

<blockquote><p>1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends. This the apostle proves undeniably in this epistle, especially in the chapter foregoing, and those two that follow. Hence it follows that it could abrogate or disannul nothing which God at any time before had given as a general rule unto the church. For that which is particular cannot abrogate any thing that was general, and before it; as that which is general doth abrogate all antecedent particulars, as the new covenant doth abrogate the old. And this we must consider in both the instances belonging hereunto. For,— (1.) God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfil it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant. For,— [1.] It revived, declared, and expressed all the commands of that covenant in the decalogue; for that is nothing but a divine summary of the law written in the heart of man at his creation. And herein the dreadful manner of its delivery or promulgation, with its writing in tables of stone, is also to be considered; for in them the nature of that first covenant, with its inexorableness as unto perfect obedience, was represented. And because none could answer its demands, or comply with it therein, it was called “the ministration of death,” causing fear and bondage, 2 Cor. 3:7. [2.] It revived the sanction of the first covenant, in the curse or sentence of death which it denounced against all transgressors. Death was the penalty of the transgression of the first covenant: “In the day that thou eatest, thou shalt die the death.” And this sentence was revived and represented anew in the curse wherewith this covenant was ratified, “Cursed be he that confirmeth not all the words of this law to do them,” Deut. 27:26; Gal. 3:10. For the design of God in it was to bind a sense of that curse on the consciences of men, until He came by whom it was taken away, as the apostle declares, Gal. 3:19. [3.] It revived the promise of that covenant,—that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Rom. 10:5; as he doth, Lev. 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.</p></blockquote>

<blockquote><p>This statement does not rest upon any express declaration of the Scriptures. It is, however, a concise and correct mode of asserting a plain Scriptural fact, namely, that God made to Adam a promise suspended upon a condition, and attached to disobedience a certain penalty. This is what in Scriptural language is meant by a covenant, and this is all that is meant by the term as here used. Although the word covenant is not used in Genesis, and does not elsewhere, in any clear passage, occur in reference to the transaction there recorded, yet inasmuch as the plan of salvation is constantly represented as a New Covenant, new, not merely in antithesis to that made at Sinai, but new in reference to all legal covenants whatever, it is plain that the Bible does represent the arrangement made with Adam as a truly federal transaction. The Scriptures know nothing of any other than two methods of attaining eternal life: the one that which demands perfect obedience, and the other that which demands faith. If the latter is called a covenant, the former is declared to be of the same nature. It is of great importance that the Scriptural form of presenting truth should be retained. Rationalism was introduced into the Church under the guise of a philosophical statement of the truths of the Bible free from the mere outward form in which the sacred writers, trained in Judaism, had presented them. On this ground the federal system, as it was called, was discarded. On the same ground the prophetic, priestly, and kingly offices of Christ were pronounced a cumbrous and unsatisfactory form under which to set forth his work as our Redeemer. And then the sacrificial character of his death, and all idea of atonement were rejected as mere Jewish drapery. Thus, by theory of accommodation, every distinctive doctrine of the Scriptures was set aside, and Christianity reduced to Deism. It is, therefore, far more than a mere matter of method that is involved in adhering to the Scriptural form of presenting Scriptural truths. God then did enter into a covenant with Adam. That covenant is sometimes called a covenant of life, because life was promised as the reward of obedience. Sometimes it is called the covenant of works, because works were the condition on which that promise was suspended, and because it is thus distinguished from the new covenant which promises life on condition of faith. …The condition of the covenant made with Adam is said in the symbols of our church to be perfect obedience. That that statement is correct may be inferred (1.) From the nature of the case and from the general principles clearly revealed in the word of God. Such is the nature of God, and such the relation which He sustains to his moral creatures, that sin, the transgression of the divine law, must involve the destruction of the fellowship between man and his Creator, and the manifestation of the divine displeasure. The Apostle therefore says, that he who offends in one point, who breaks one precept of the law of God, is guilty of the whole. (2.) It is everywhere assumed in the Bible, that the condition of acceptance under the law is perfect obedience. “Cursed is every one who continueth not in all things written in the book of the law to do them.” This is not a peculiarity of the Mosaic economy, but a declaration of a principle which applies to all divine laws. (3.) The whole argument of the Apostle in his epistles to the Romans and to the Galatians, is founded on the assumption that the law demands perfect obedience. If that be not granted, his whole argument falls to the ground. The specific command to Adam not to eat of a certain tree, was therefore not the only command he was required to obey. It was given simply to be the outward and visible test to determine whether he was willing to obey God in all things. Created holy, with all his affections pure, there was the more reason that the test of his obedience should be an outward and positive command; something wrong simply because it was forbidden, and not evil in its own nature. It would thus be seen that Adam obeyed for the sake of obeying. His obedience was more directly to God, and not to his own reason. The question whether perpetual, as well as perfect obedience was the condition of the covenant made with Adam, is probably to be answered in the negative. It seems to be reasonable in itself and plainly implied in the Scriptures that all rational creatures have a definite period of probation. If faithful during that period they are confirmed in their integrity, and no longer exposed to the danger of apostasy. Thus we read of the angels who kept not their first estate, and of those who did. Those who remained faithful have continued in holiness and in the favour of God. It is therefore to be inferred that had Adam continued obedient during the period allotted to his probation, neither he nor any of his posterity would have been ever exposed to the danger of sinning.</p></blockquote>

%2C+by+theory+of+accommodation%2C+every+distinctive+doctrine+of+the+Scriptures+was+set+aside%2C+and+Christianity+reduced+to+Deism.+It+is%2C+therefore%2C+far+more+than+a+mere+matter+of+method+that+is+involved+in+adhering+to+the+Scriptural+form+of+presenting+Scriptural+truths.+God+then+did+enter+into+a+covenant+with+Adam.+That+covenant+is+sometimes+called+a+covenant+of+life%2C+because+life+was+promised+as+the+reward+of+obedience.+Sometimes+it+is+called+the+covenant+of+works%2C+because+works+were+the+condition+on+which+that+promise+was+suspended%2C+and+because+it+is+thus+distinguished+from+the+new+covenant+which+promises+life+on+condition+of+faith.+%E2%80%A6The+condition+of+the+covenant+made+with+Adam+is+said+in+the+symbols+of+our+church+to+be+perfect+obedience.+That+that+statement+is+correct+may+be+inferred+%281.%29+From+the+nature+of+the+case+and+from+the+general+principles+clearly+revealed+in+the+word+of+God.+Such+is+the+nature+of+God%2C+and+such+the+relation+which+He+sustains+to+his+moral+creatures%2C+that+sin%2C+the+transgression+of+the+divine+law%2C+must+involve+the+destruction+of+the+fellowship+between+man+and+his+Creator%2C+and+the+manifestation+of+the+divine+displeasure.+The+Apostle+therefore+says%2C+that+he+who+offends+in+one+point%2C+who+breaks+one+precept+of+the+law+of+God%2C+is+guilty+of+the+whole.+%282.%29+It+is+everywhere+assumed+in+the+Bible%2C+that+the+condition+of+acceptance+under+the+law+is+perfect+obedience.+%E2%80%9CCursed+is+every+one+who+continueth+not+in+all+things+written+in+the+book+of+the+law+to+do+them.%E2%80%9D+This+is+not+a+peculiarity+of+the+Mosaic+economy%2C+but+a+declaration+of+a+principle+which+applies+to+all+divine+laws.+%283.%29+The+whole+argument+of+the+Apostle+in+his+epistles+to+the+Romans+and+to+the+Galatians%2C+is+founded+on+the+assumption+that+the+law+demands+perfect+obedience.+If+that+be+not+granted%2C+his+whole+argument+falls+to+the+ground.+The+specific+command+to+Adam+not+to+eat+of+a+certain+tree%2C+was+therefore+not+the+only+command+he+was+required+to+obey.+It+was+given+simply+to+be+the+outward+and+visible+test+to+determine+whether+he+was+willing+to+obey+God+in+all+things.+Created+holy%2C+with+all+his+affections+pure%2C+there+was+the+more+reason+that+the+test+of+his+obedience+should+be+an+outward+and+positive+command%3B+something+wrong+simply+because+it+was+forbidden%2C+and+not+evil+in+its+own+nature.+It+would+thus+be+seen+that+Adam+obeyed+for+the+sake+of+obeying.+His+obedience+was+more+directly+to+God%2C+and+not+to+his+own+reason.+The+question+whether+perpetual%2C+as+well+as+perfect+obedience+was+the+condition+of+the+covenant+made+with+Adam%2C+is+probably+to+be+answered+in+the+negative.+It+seems+to+be+reasonable+in+itself+and+plainly+implied+in+the+Scriptures+that+all+rational+creatures+have+a+definite+period+of+probation.+If+faithful+during+that+period+they+are+confirmed+in+their+integrity%2C+and+no+longer+exposed+to+the+danger+of+apostasy.+Thus+we+read+of+the+angels+who+kept+not+their+first+estate%2C+and+of+those+who+did.+Those+who+remained+faithful+have+continued+in+holiness+and+in+the+favour+of+God.+It+is+therefore+to+be+inferred+that+had+Adam+continued+obedient+during+the+period+allotted+to+his+probation%2C+neither+he+nor+any+of+his+posterity+would+have+been+ever+exposed+to+the+danger+of+sinning.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology+%28repr.+Oak+Harbor%2C+WA%3A+Logos+Research+Systems%2C+Inc.%2C+1997%29%2C+2.117%E2%80%9318%2C+119%E2%80%93120.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F91df145c0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/91df145c0c.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/charles-hodge-the-covenant-with-adam-before-the-fall-was-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-706737c25c" data-kw="">
<blockquote><p>The Law—considered as a national covenant, by which their continued possession of the land of Canaan, and of all their privileges under the Theocracy, was left to depend on their external obedience to it,— might be called a national Covenant of Works, since their temporal welfare was suspended on the condition of their continued adherence to it; but, in that aspect of it, it had no relation to the spiritual salvation of individuals, otherwise than as this might be affected by their retaining, or forfeiting, their outward privileges and means of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification</cite>, (Oxford: Oxford University Press, 1867), 38–39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-944fc81d80" data-kw="">
<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1872), 2.374–376.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

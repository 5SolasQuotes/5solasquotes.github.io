<main class="wrap"><figure class="quote" id="q-e4510cda04" data-kw="">
<blockquote><p>The term voluntas signi, literally, the will of the sign [the revealed will], is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’—thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded. This signified or perceptive will moreover, does not contradict the will of the divine good pleasure, although the relationship between the two may sometimes be difficult to establish immediately. The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker, 2003), vol. 3 | ch. 5.4, Will and Freedom, E. The Ad Intra–Ad Extra Distinctions, 1. Voluntas beneplaciti and voluntas signi, p. 458</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7cc6e2b80" data-kw="">
<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>

</figure><figure class="quote" id="q-354cd715bd" data-kw="">
<blockquote><p>…He says by this will to Judas the traitor, ‘I command and will your final obedience,’ that is, I approve, and hold it morally pleasing and acceptable, whether that obedience actually exists, or not, as the law of an earthly prince is not made to this end, that men should simply cultivate society, but on the hypothesis of society being cultivated, that they should order their life civilly and according to the rule and norm of good laws; so the formal use of the Word of God revealing to us the will of sign is to illuminate, lead, direct what may be the pleasing good acceptable will of God, and how our acts, on the hypothesis that they are elicited and exist, can be instituted according to the Word of God, so that they may be pleasing and acceptable to God, and worthy of reward in Christ.</p></blockquote>

=to%20God%2C%20and%20worthy%20of%20reward%20in%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-65583f6f88" data-kw="">
<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (Herder Book Co., 1950), ch. 10, God’s Will &amp; God’s Love, pp. 104-5</span></figcaption>

</figure><figure class="quote" id="q-d59742bc63" data-kw="">
<blockquote><p>But Damascene makes the emphasis on the mode of willing. For he distinguishes in God an antecedent will and a consequent will. And the antecedent will is the will with respect to that for which God makes man, and it is irrefragably of goods. The consequent will, however, is the will, not that which follows merits, but that which wills some things according to the foreknowledge of merits. The first, namely the antecedent, is called by the masters the conditional will or the will by which God wills, as far as it depends on Him. The second, however, namely the consequent, is called absolute. The difference, however, between this will and that is not according to a diversity of affection or mode of willing that is in God, but according to the reason of connoting and understanding. For as God is said to will the salvation of all, as far as it depends on Him and antecedently, there is connoted in all men an orderability to salvation, both on the part of the nature given and on the part of the grace offered. For God gave a nature according to which they could know Him and, once known, seek Him, and once sought, find Him, and once found, adhere to Him, and through this obtain salvation. He similarly offered grace, when he sent and offered his Son, whose price sufficed for the salvation of all. He also bestowed and showed the laws and mandates of salvation. He Himself is also present to all who inquire and is near to all who call upon Him. Therefore, to will antecedently to save man is to do what is ordered to salvation and not to be lacking to the one who wills to arrive. Whence, to will antecedently to save does not connote salvation, but orderability to salvation. To will, however, consequently or absolutely to save is to will to give salvation to him whom he foreknows will arrive at salvation through his help and grace, and it connotes the event of salvation. And thus it is not to be said that God wills all men to be saved. The masters agree more with this response, although both are good. According to this, therefore, it must be answered that God wills all men to be saved, as far as it depends on Him or by his antecedent will, but not by his absolute or consequent will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 46, Question 1, ‘Whether God wills all men to be saved by the will of his good-pleasure? [No]’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“But Damascene makes the emphasis on the mode of willing. For he distinguishes in God an antecedent will and a consequent will. And the antecedent will is the will with respect to that for which God makes man, and it is irrefragably of goods. The consequent will, however, is the will, not that which follows merits, but that which wills some things according to the foreknowledge of merits. The first, namely the antecedent, is called by the masters the conditional will or the will by which God wills, as far as it depends on Him. The second, however, namely the consequent, is called absolute. The difference, however, between this will and that is not according to a diversity of affection or mode of willing that is in God, but according to the reason of connoting and understanding. For as God is said to will the salvation of all, as far as it depends on Him and antecedently, there is connoted in all men an orderability to salvation, both on the part of the nature given and on the part of the grace offered. For God gave a nature according to which they could know Him and, once known, seek Him, and once sought, find Him, and once found, adhere to Him, and through this obtain salvation. He similarly offered grace, when he sent and offered his Son, whose price sufficed for the salvation of all. He also bestowed and showed the laws and mandates of salvation. He Himself is also present to all who inquire and is near to all who call upon Him. Therefore, to will antecedently to save man is to do what is ordered to salvation and not to be lacking to the one who wills to arrive. Whence, to will antecedently to save does not connote salvation, but orderability to salvation. To will, however, consequently or absolutely to save is to will to give salvation to him whom he foreknows will arrive at salvation through his help and grace, and it connotes the event of salvation. And thus it is not to be said that God wills all men to be saved. The masters agree more with this response, although both are good. According to this, therefore, it must be answered that God wills all men to be saved, as far as it depends on Him or by his antecedent will, but not by his absolute or consequent will.”

— Bonaventure, Commentary on the Sentences (d. 1274), bk. 1 | dist. 46, Question 1, ‘Whether God wills all men to be saved by the will of his good-pleasure? [No]’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+Damascene+makes+the+emphasis+on+the+mode+of+willing.+For+he+distinguishes+in+God+an+antecedent+will+and+a+consequent+will.+And+the+antecedent+will+is+the+will+with+respect+to+that+for+which+God+makes+man%2C+and+it+is+irrefragably+of+goods.+The+consequent+will%2C+however%2C+is+the+will%2C+not+that+which+follows+merits%2C+but+that+which+wills+some+things+according+to+the+foreknowledge+of+merits.+The+first%2C+namely+the+antecedent%2C+is+called+by+the+masters+the+conditional+will+or+the+will+by+which+God+wills%2C+as+far+as+it+depends+on+Him.+The+second%2C+however%2C+namely+the+consequent%2C+is+called+absolute.+The+difference%2C+however%2C+between+this+will+and+that+is+not+according+to+a+diversity+of+affection+or+mode+of+willing+that+is+in+God%2C+but+according+to+the+reason+of+connoting+and+understanding.+For+as+God+is+said+to+will+the+salvation+of+all%2C+as+far+as+it+depends+on+Him+and+antecedently%2C+there+is+connoted+in+all+men+an+orderability+to+salvation%2C+both+on+the+part+of+the+nature+given+and+on+the+part+of+the+grace+offered.+For+God+gave+a+nature+according+to+which+they+could+know+Him+and%2C+once+known%2C+seek+Him%2C+and+once+sought%2C+find+Him%2C+and+once+found%2C+adhere+to+Him%2C+and+through+this+obtain+salvation.+He+similarly+offered+grace%2C+when+he+sent+and+offered+his+Son%2C+whose+price+sufficed+for+the+salvation+of+all.+He+also+bestowed+and+showed+the+laws+and+mandates+of+salvation.+He+Himself+is+also+present+to+all+who+inquire+and+is+near+to+all+who+call+upon+Him.+Therefore%2C+to+will+antecedently+to+save+man+is+to+do+what+is+ordered+to+salvation+and+not+to+be+lacking+to+the+one+who+wills+to+arrive.+Whence%2C+to+will+antecedently+to+save+does+not+connote+salvation%2C+but+orderability+to+salvation.+To+will%2C+howe

<main class="wrap"><figure class="quote" id="q-1195304235" data-kw="">
<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper</cite>, … (London, 1588), ‘The First Homily… 1574’, pp. 38-9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e11ddfc3ee" data-kw="">
<blockquote><p>Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk.xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’</cite>, (1912), pp. 74-76</span></figcaption>

</figure><figure class="quote" id="q-be53d476ea" data-kw="">
<blockquote><p>The personal union of the two natures in Christ is the substantial copulation of them by which the specificness of the assumed human nature does not have subsistence in itself [but] the substance of the Logos has been communicated, so that the two natures in Christ may be one person. The essential form of the personal union in Christ, in which that subsists, is not the communication of the attributes of deity, but the communication of the subsistence of the Word with the assumed human nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 72 (top paragraph) of ‘What follows is on his State’ in The Divisions of Theology Framed according to a Natural Orderly Method (Basil, 1590; Geneva, 1623) trans. T. Fentiman</span></figcaption>

</figure><figure class="quote" id="q-d6ff100697" data-kw="">
<blockquote><p>As the soul of Christ was separated from his body for the space of three days, was the Godhead likewise separated from them both, or was the Godhead joined with the soul, and severed from the body? Neyther, says [John] Damascenus (Of the Orthodox Faith): For the Godhead remained unseparable from both, and that which the Word once took upon, Him never afterwards left. But how could it be that the divine nature should continue united to the soul which was in Paradise, and the body which was in the earth? The divine nature of the Son, because it is both infinite and present in all places, remained whole and undivided, united to both together, that is as well to the soul of Christ which was in Paradise, as to the body which lay lifeless in the earth. For seeing the nature of God is most simple, and so not to be parted or divided, God is not to be said to have one part in heaven, and another in earth, but He is whole in heaven and whole in earth, not at several times and by succession, but both together, which thing no created nature can do. Hence comes the saying of Augustine: It is proper to the whole Trinity to be whole everywhere, in spaces of places not divided. Whether was Christ being now dead, true man? He was, for although the soul and body were separated, and so it was a true death, yet by the conjunction of personal union they remained together in one third, as it were, so that our life was truly hid in Christ, yea even when He was dead. Others answer that Christ in that three days was man materially, because He was truly soul and body: but at his resurrection (they say) he was man formally, after his soul rerurned into his body. Who therefore died, and what he the the adiuncts of his death? The son of God, at the mention of whom the whole frame and nature of things in this world trembled… But when the Lord died…</p></blockquote>

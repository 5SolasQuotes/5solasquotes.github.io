<main class="wrap"><figure class="quote" id="q-bedcdada13" data-kw="">
<blockquote><p>We have peace with God through our Lord Jesus Christ.” The Saviour came to bear the curse—to take away the wrath—to mediate between God and sinners, so that the child of wrath might become a member of God’s blessed family. He saw men separated by their iniquities from the friendship of God, and lying under just condemnation. He pitied their miserable case. He saw them ready to perish through the anger of the holy Sovereign of all. His errand was to appease that anger, and to save them from it for ever.

It was not in vain that he interposed. He satisfied justice—he expiated sin—he redressed the wrongs of the law—and made peace for his people. “There is no condemnation to them that are in Christ Jesus.” There is condemnation to others. “The wrath of God abideth” on them that do not believe. But such as are in Him have “peace from God the Father.” He gives them that peace. “Peace,” he has said, “I leave with you; my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Religious Divisions (Preached at the opening of the Free Synod of Perth, 16th April 1844) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

r.wordpress.com/2021/08/03/andrew-gray-of-perth-on-our-peace-with-god-through-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, 3rd National Synod of Charenton 1644 / 1645, ch. 10, p. 455</span></figcaption>

</figure><figure class="quote" id="q-c01b0d097a" data-kw="">
<blockquote><p>Tis said [for conforming in church to what is less good:] ‘What we may do sometimes, we may and ought to do always.’ But we have hundreds of instances that we would be loth to do that always which we might do and have done sometimes. We have often eat bad and unwholesome meat, dwelt in inconvenient and bad houses, etc. but are we bound to do so always? So some have been forced and been glad to use such helps for their souls as they could get, but are they bound to use them always? If we have better means and helps, should we not use them rather? Reason speaks it, and Scripture also, and gives us some examples which look that way. St. Paul circumcised Timothy, but opposed it in others, and would not let Titus be circumcised. He also, to satisfy the believing Jews that were too zealous for the Law, and misinformed of him, took men, shaved his head, purified himself with them, entered into the Temple, etc. This he did once, but would he have done so always?</p></blockquote>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-761439a811" data-kw="">
<blockquote><p>Also this word ‘communion’ is very evident and comfortable. For first, the meaning thereof is, that betwixt God and us there is a communion, that is, a fellowship and participation, and so, consequently, a parting betwixt us of all good and heavenly things. And then also we understand, that we are fellows and partakers with all the saints that are living either in heaven or on earth: for we are members of them under one head, Christ. For the apostle John says: “That which we have seen and heard we declare unto you, that ye also may have fellowship with us, and that your fellowship may be with the Father, and his Son Jesus Christ… …What can be more delightful to our ears than to hear that all the saints, as well in heaven as in earth, are our brethren, and that we again are members, partners, and fellows with them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, p. 163</span></figcaption>

</figure><figure class="quote" id="q-388b438a3a" data-kw="">
<blockquote><p>First, for schismatical Churches, that is, such as embrace and profess the common saving faith of the catholic Church; but yet have separated themselves from the outward communion of those particular visible Churches, that sometimes they have been, and should be members of: the cause of such schisms is sometimes pride, discontent, weakness, willfulness, pretended zeal, a factious spirit; always it is Satan’s instigation, and man’s acceptation: whatsoever the cause be, and how great soever the schism be, though they be justly condemned as schismatical, in regard they are rent from the outward fellowship of such visible congregations as they belong unto, yet because they hold correspondency with the catholic Church in matters of saving faith, and accordingly profess the same, they [the schismatics] cannot be denied to be true visible Churches: Such were the Donatists of old, and such are the Brownists at this day…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 2, Lecture 26; p. 151</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fa8df77fa3" data-kw="">
<blockquote><p>…how inexcusable is it in the presbyterians to prosecute them [ministers in the Church of Scotland] so violently when they have nothing to object against them but that they complied with episcopacy [from 1661-1688], since the first covenanters [in the late-1500’s and early-1600’s] were as liable to this accusation as any of the present clergy [in 1690]. … The author is much mistaken if he thinks that the plurality of the Scots clergy [in 1690] are presbyterians, though they are content to join with presbyterians in Church judicatories in all those duties that are uncontroverted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-monro.html">Alexander Monro</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterian Inquisition, as it was lately Practiced against the Professors of the College of Edinburgh, August &amp; September, 1690… (London: Hindmarsh, 1691), pp. 16-17 Monro was an episcopalian.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-544f7ad273" data-kw="">
<blockquote><p>But as touching these ceremonies in question, we are upon evident grounds persuaded in our consciences that they are both unlawful and inexpedient for our Church: and though they were lawful in themselves, yet we may answer as the oppugners of the Interim [1548] replied to those who urged yielding to the ceremonies of the same (Friedrich Balduin [a Lutheran], On Cases of Conscience, bk. 4, ch. 11, case 3), surplice, holy days, tapers [candles], etc. because of the emperor’s commandment. That the question is not about things indifferent, but about a main article of faith, namely Christian Liberty, which admits not any yoke to be imposed upon the conscience, no not in things indifferent.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7f4a9b7ead" data-kw="Succession">
<blockquote><p>Thirdly, I say that this appertains as much to all bishops and ministers as to the pope of Rome himself; because they all succeed Peter in this matter, that is, in the preaching of the word, and should imitate his diligence in feeding the sheep of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c39fb5cf7c" data-kw="Apostolic succession">
<blockquote><p>Here, then, is the value of succession when not conjoined with imitation and corresponding conduct: posterity, as soon as they are convicted of having revolted from their origin, are deprived of all honour; unless, indeed, we are prepared to say, that because Caiaphas succeeded many pious priests (nay, the series from Aaron to him was continuous), that accursed assembly deserved the name of Church. … That in the government of the Church especially, nothing is more absurd than to disregard doctrine, and place succession in persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span></div>

— John Calvin, Institutes of the Christian Religion, 4.2.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere%2C%20then%2C%20is%20the%20value%20of%20succession%20when%20not%20conjoined%20with%20imitation%20and%20corresponding%20conduct%3A%20posterity%2C%20as%20soon%20as%20they%20are%20convicted%20of%20having%20revolted%20from%20their%20origin%2C%20are%20deprived%20of%20all%20honour%3B%20unless%2C%20indeed%2C%20we%20are%20prepared%20to%20say%2C%20that%20because%20Caiaphas%20succeeded%20many%20pious%20priests%20%28nay%2C%20the%20series%20from%20Aaron%20to%20him%20was%20continuous%29%2C%20that%20accursed%20assembly%20deserved%20the%20name%20of%20Church.%20%E2%80%A6%20That%20in%20the%20government%20of%20the%20Church%20especially%2C%20nothing%20is%20more%20absurd%20than%20to%20disregard%20doctrine%2C%20and%20place%20succession%20in%20persons.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%204.2.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc39fb5cf7c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c39fb5cf7c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 4.6.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20question%2C%20then%2C%20may%20be%20thus%20stated%2C%20Is%20it%20necessary%20for%20the%20true%20order%20of%20the%20hierarchy%20%28as%20they%20term%20it%29%2C%20or%20of%20ecclesiastical%20order%2C%20that%20one%20See%20should%20surpass%20the%20others%20in%20dignity%20and%20power%2C%20so%20as%20to%20be%20the%20head%20of%20the%20whole%20body%3F%20We%20subject%20the%20Church%20to%20unjust%20laws%20if%20we%20lay%20this%20necessity%20upon%20her%20without%20sanction%20from%20the%20word%20of%20God.%20%E2%80%A6%20Every%20one%20knows%20that%20the%20high%20priest%20was%20a%20type%20of%20Christ%3B%20now%2C%20the%20priesthood%20being%20transferred%2C%20that%20right%20must%20also%20be%20transferred.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%204.6.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5dd7f1a21d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5dd7f1a21d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-cea8c0fef0" data-kw="Apostolic succession">
<blockquote><p>Here we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). … For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is. “They do not have the inheritance of Peter, who have not the faith of Peter” (Ambrose).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.13.28</span></figcaption>

</figure><figure class="quote" id="q-cd1dc35099" data-kw="Equality of apostles">
<blockquote><p>If Peter was constituted an ecumenical pontiff, he was greater and superior to the others. But we read of no such superiority having been bestowed upon Peter above the others by Christ or usurped by Peter himself or acknowledged by the apostles. Christ sends them equally: “As the Father sent me, so send I you” (Jn. 20:21). He equally breathes his Spirit into them (v. 22) and gives them the power to remit and to retain sins: “Whose soever sins ye remit, they are remitted unto them; and whose soever sins ye retain, they are retained” (v. 23). He equally gives to all the command to preach and to baptize: “Go ye therefore, and teach all nations” (Mt. 28:19). Hence, he promises them an equality of thrones: “In the regeneration” (i.e., in the renovation of the church caused by the gospel) “ye shall sit upon twelve thrones, judging the twelve tribes of Israel” (Mt. 19:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.5</span></figcaption>

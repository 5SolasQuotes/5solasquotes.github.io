<main class="wrap"><figure class="quote" id="q-7ac5fe6039" data-kw="">
<blockquote><p>It has sometimes been assumed that the Westminster divines formulated the Lex Triplex, or, the threefold division of the law into the moral, judicial, and ceremonial categories. This is not the case, as Henry Bullinger affirmed such a division long before the Westminster Assembly met (I have heard it said that the idea actually comes from the medieval theologian, Thomas Aquinas):

This law is divided into the moral, ceremonial, and judicial laws: all which parts, and every point whereof, Moses hath very exquisitely written, and diligently expounded. The moral law is that which teacheth men manners, and layeth down before us the shape of virtue; declaring therewithal how great righteousness, godliness, obedience, and perfectness God looketh for at the hands of us mortal men. The ceremonial laws are they which are given concerning the order of holy and ecclesiastical rites and ceremonies, and also touching the ministers and things assigned to the ministry and other holy uses. Last of all, the judicial laws give rules concerning matters to be judged between man and man, for the preservation of public peace, equity, and civil honesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 210.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Answer:

1. Show a law of nature that the father might enslave his children; by a divine positive law, presupposing sin, the father might do that; and yet I think that may be questioned, whether it was not a permission rather than a law, as was the bill of divorce; but a law of nature it was not;

2. The Popish Prelate [John Maxwell] can see no law but the law of nature here; but it is because he is blind or will not see. His reason is, It was not by mutual and voluntary contract of children and fathers, therefore it was by the law of nature; so he that cursed his father was to die by God’s law. This law was not made by mutual consent betwixt the father and the son, therefore it was a law of nature: the Prelate will see no better. Nature will teach a man to enslave himself to redeem himself from death, but that it is a dictate of nature that a man should enslave his son, I conceive not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>

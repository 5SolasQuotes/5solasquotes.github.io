<main class="wrap"><figure class="quote" id="q-d2242bf998" data-kw="">
<blockquote><p>The presbyterial government has no such liberty nor arbitrariness as civil or military government has, there being in all civil or temporal affairs a great deal of latitude left to those who manage the same, so that they command nor act against the Word of God. But presbyterial government is tied up to the rules of Scripture in all such particulars as are properly spiritual and proper to the church, though, in other particulars, occasional circumstances of times, places, accommodations and the like, the same light of nature and reason guides both church and state; yet in things properly spiritual and ecclesiastical, there is not near so much latitude left to the presbytery, as there is in civil affairs to the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>bk. 1 ToC of Aaron’s Rod Blossoming</cite>, (1646; Edinburgh, 1844), p. 84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), Appendix, Question 1, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-b3cd668278" data-kw="">
<blockquote><p>40. The reformed churches believe also, and openly confess, the power and authority of emperors over their empires, of kings over their kingdoms, of princes and dukes over their dominions, and of other magistrates or states over their commonwealths and cities, to be the ordinances of God Himself appointed as well as to the manifestation of his own glory, as to the singular profit of mankind: and withal, that by reason of the will of God Himself, revealed in his Word, we must not only suffer and be content that those do rule which are set over their own territories, whether by hereditary or elective right, but also to love them, fear them, and with all reverence and honor embrace them as the ambassadors and ministers of the most high and good God, being in his stead, and preferred for the good of their subjects, to pour out prayers for them, to pay tributes to them, and in all business of the commonwealth which is not against the Word of God, to obey their laws and edicts. … 48. For to that end also is the holy Scripture profitable, to show which is the best manner of governing a commonwealth, and that the magistrate, as being Gods minister, may by this guiding star be so directed, as that he may execute the parts of his office according to the will of God and may perfectly be instructed to every good work…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred and Eleven Propositions concerning the Ministry and Government of the Church</cite>, (1647; Edinburgh, 1844), p. 12</span></figcaption>

</figure><figure class="quote" id="q-8c322100d5" data-kw="">
<blockquote><p>It is agreed on by all real Christians that man being made an intelligent, free agent, not under bruitish necessitating determination by objects, is governed by God by the moral way of law; that is by the signification of his Ruler’s will, making his duty, and not by mere natural or forcible motion: And it is agreed that God Himself is his only absolute Universal Ruler, and his laws given in nature and by revelation are the only universal laws, which no human power can abrogate or dispense with: And that kings and magistrates are his ministers for men’s good, and have no power but from Him, and none against Him or his laws; and that it is not man but God, by whom we must all be judged to everlasting reward or punishment: And therefore that all men must obey God before men, and must not fear them that can but kill the body, but Him who is able to cast both soul and body into Hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London: Parkhurst, 1689), Preface</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

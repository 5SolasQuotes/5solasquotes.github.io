<main class="wrap"><figure class="quote" id="q-4fcad14e0a" data-kw="">
<blockquote><p>Besides, creation is the only first discovery of his dominion. Before the world was framed there was nothing but God Himself, and, properly, nothing is said to have dominion over itself; this is a relative attribute, reflecting on the works of God; He had a right of dominion in his nature from eternity, but before creation He was actually Lord only of a nullity; where there is nothing it can have no relation; nothing is not the subject of possession nor of dominion. There could be no exercise of this dominion without creation: what exercise can a sovereign have without subjects? Sovereignty speaks a relation to subjects, and none is properly a sovereign without subjects. To conclude: from hence does result God’s universal dominion; for being Maker of all, He is the ruler of all, and his perpetual dominion; for as long as God continues in the relation of Creator, the right of his sovereignty as Creator cannot be abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God 2 vols. (NY: 1853), vol. 2 | Discourse 13, ‘On God’s Dominion’</cite>, p. 370</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-dee57a070d" data-kw="">
<blockquote><p>Some [attributes] are said absolutely concerning God, as all the preceding attributes. Others relatively, which relation is two-fold: either with respect to the persons among themselves, as the Father, the Son, and the Holy Spirit, or with respect of the creatures to God, as Creator, Savior, Lord, King, etc. Here it is asked, whether all these things were in God from eternity past. Response: All those things that are attributed to God absolutely are eternal, even those that are spoken relative to the very persons, as shall be proven afterwards against the heretics – Arians, Samosatensians, etc. The difficulty, therefore, remains only in those which are spoken concerning God with respect to the creatures, concerning which we respond, if we consider the foundation of the relation, such as the power to create, to conserve, to reign, etc, this also is eternal, because it is referred to the absolute: but if we consider the formal relation, that is added in time: for God was not an actual creator until he had created things. Objection: But then it is stated that something was added to God; and therefore, some change was also done in Him. Response: That relation, with respect to God, is not real; but it is only so with respect to the creature. For to the creature, something real is added, and not to God; but only some notional concept. Augustine compares it to a coin: when it becomes a pledge, nothing is really added to the coin; but to the man who accepts it, something is really added. Thomas compares it to a column, which is to my right: when I turn to that side, still nothing is really added to the column; but only to the man, who turns himself toward it in this or that way, does any change take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Johannes Hornbeek, Institutes 3.9 trans. Charles Johnson</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

e+place.%E2%80%9D%0A%0A%E2%80%94+Antonius+Walaeus%2C+as+quoted+in+Johannes+Hornbeek%2C+Institutes+3.9+trans.+Charles+Johnson&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdee57a070d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dee57a070d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-affections-of-god/#:~:text=Some%20%5Battributes%5D%20are%20said%20absolutely%20concerning,way%2C%20does%20any%20change%20take%20place&amp;text=Some%20%5Battributes%5D%20are%20said%20absolutely%20concerning%20God%2C%20as&amp;text=or%20that%20way%2C%20does%20any%20change%20take%20place" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-33ef8d9b22" data-kw="">
<blockquote><p>For if a lord also is not so called unless when he begins to have a slave, that appellation likewise is relative and in time to God; for the creature is not from all eternity, of which He is the Lord. How then shall we make it good that relative terms themselves are not accidental, since nothing happens accidentally to God in time, because He is incapable of change, as we have argued in the beginning of this discussion? Behold! To be the Lord is not eternal to God; otherwise we should be compelled to say that the creature also is from eternity, since He would not be a lord from all eternity unless the creature also was a servant from all eternity… Certainly to be the Lord of man happened to God in time. And that all dispute may seem to be taken away, certainly to be your Lord, or mine, who have only lately begun to be, happened to God in time. How then shall we make it good that nothing is said of God according to accident, except because nothing happens to His nature by which He may be changed, so that those things are relative accidents which happen in connection with some change of the things of which they are spoken. As a friend is so called relatively… how much more easily ought we to admit, concerning that unchangeable substance of God, that something may be so predicated relatively in respect to the creature, that although it begin to be so predicated in time, yet nothing shall be understood to have happened to the substance itself of God, but only to that creature in respect to which it is predicated? Lord, it is said, ‘You have been made our refuge.’ God, therefore, is said to be our refuge relatively, for He is referred to us, and He then becomes our refuge when we flee to Him; pray does anything come to pass then in His nature, which, before we fled to Him, was not? In us therefore some change does take place; for we were worse before we fled to Him, and we become better by fleeing to Him: but in Him there is no change… Therefore that which begins to be spoken of God in time, and which was not spoken of Him before, is manifestly spoken of Him relatively; yet not according to any accident of God, so that anything should have happened to Him, but clearly according to some accident of that [thing or person], in respect to which God begins to be called something relatively… that what is said may be said in that way in which it can be comprehended by human affections. So also, when He is said to be angry with the unrighteous, and gentle with the good, they are changed, not He: just as the light is troublesome to weak eyes, pleasant to those that are strong; namely, by their change, not its own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity, bk. 5, ch. 16, ‘What is Said of God in Time, is Said Relatively, Not Accidentally’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

here is no change… Therefore that which begins to be spoken of God in time, and which was not spoken of Him before, is manifestly spoken of Him relatively; yet not according to any accident of God, so that anything should have happened to Him, but clearly according to some accident of that [thing or person], in respect to which God begins to be called something relatively… that what is said may be said in that way in which it can be comprehended by human affections. So also, when He is said to be angry with the unrighteous, and gentle with the good, they are changed, not He: just as the light is troublesome to weak eyes, pleasant to those that are strong; namely, by their change, not its own.”

— Augustine of Hippo, On the Trinity, bk. 5, ch. 16, ‘What is Said of God in Time, is Said Relatively, Not Accidentally’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+if+a+lord+also+is+not+so+called+unless+when+he+begins+to+have+a+slave%2C+that+appellation+likewise+is+relative+and+in+time+to+God%3B+for+the+creature+is+not+from+all+eternity%2C+of+which+He+is+the+Lord.+How+then+shall+we+make+it+good+that+relative+terms+themselves+are+not+accidental%2C+since+nothing+happens+accidentally+to+God+in+time%2C+because+He+is+incapable+of+change%2C+as+we+have+argued+in+the+beginning+of+this+discussion%3F+Behold%21+To+be+the+Lord+is+not+eternal+to+God%3B+otherwise+we+should+be+compelled+to+say+that+the+creature+also+is+from+eternity%2C+since+He+would+not+be+a+lord+from+all+eternity+unless+the+creature+also+was+a+servant+from+all+eternity%E2%80%A6+Certainly+to+be+the+Lord+of+man+happened+to+God+in+time.+And+that+all+dispute+may+seem+to+be+taken+away%2C+certainly+to+be+your+Lord%2C+or+mine%2C+who+have+only+lately+begun+to+be%2C+happened+to+God+in+time.+How+then+shall+we+make+it+good+that+nothing+is+said+of+God+according+to+accident%2C+except+because+nothing+happens+to+His+nature+by+which+He+may+be+changed%2C+so+that+those+things+are+relative+accidents+which+happen+in+connection+with+some+change+of+the+things+of+which+they+are+spoken.+As+a+friend+is+so+called+relatively%E2%80%A6+how+much+more+easily+ought+we+to+admit%2C+concerning+that+unchangeable+substance+of+God%2C+that+something+may+be+so+predicated+relatively+in+respect+to+the+creature%2C+that+although+it+begin+to+be+so+predicated+in+time%2C+yet+nothing+shall+be+understood+to+have+happened+to+the+substance+itself+of+God%2C+but+only+to+that+creature+in+respect+to+which+it+is+predicated%3F+Lord%2C+it+is+said%2C+%E2%80%98You+have+been+made+our+refuge.%E2%80%99+God%2C+therefore%2C+is+said+to+be+our+refuge+relatively%2C+for+He+is+referred+to+us%2C+and+He+then+becomes+our+refuge+when+we+flee+to+Him%3B+pray+does+anything+come+to+pass+then+in+His+nature%2C+which%2C+before+we+fled+to+Him%2C+was+not%3F+In+us+therefore+some+change+does+take+place%3B+for+we+were+worse+before+we+fled+to+Him%2C+and+we+become+better+by+fleeing+to+Him%3A+but+in+Him+there+is+no+change%E2%80%A6+Therefore+that+which+begins+to+be+spoken+of+God+in+time%2C+and+which+was+not+spoken+of+Him+before%2C+is+manifestly+spoken+of+Him+relatively%3B+yet+not+according+to+any+accident+of+God%2C+so+that+anything+should+have+happened+to+Him%2C+but+clearly+according+to+some+accident+of+that+%5Bthing+or+person%5D%2C+in+respect+to+which+God+begins+to+be+called+something+relatively%E2%80%A6+that+what+is+said+may+be+said+in+that+way+in+which+it+can+be+comprehended+by+human+affections.+So+also%2C+when+He+is+said+to+be+angry+with+the+unrighteous%2C+and+gentle+with+the+good%2C+they+are+changed%2C+not+He%3A+just+as+the+light+is+troublesome+to+weak+eyes%2C+pleasant+to+those+that+are+strong%3B+namely%2C+by+their+change%2C+not+its+own.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+On+the+Trinity%2C+bk.+5%2C+ch.+16%2C+%E2%80%98What+is+Said+of+God+in+Time%2C+is+Said+Relatively%2C+Not+Accidentally%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33ef8d9b22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33ef8d9b22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-affections-of-god/#:~:text=For%20if%20a%20lord%20also%20is,by%20their%20change%2C%20not%20its%20own&amp;text=For%20if%20a%20lord%20also%20is%20not%20so&amp;text=strong%3B%20namely%2C%20by%20their%20change%2C%20not%20its%20own" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

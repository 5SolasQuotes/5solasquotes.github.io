<main class="wrap"><figure class="quote" id="q-02157fa0df" data-kw="">
<blockquote><p>As in Judaism, the Sabbath was a monumental pillar bearing the record of Israel’s redemption from Egypt, so Christianity engraves upon it the sinner’s redemption from hell, through a Saviour’s resurrection. By a change only in what was positive, and not moral, in the command, its transfer from the seventh to the first day of the week proclaims “this same Jesus hath God raised up, whereof I am witness.” But the Sabbath which commemorates the consummating act, is equally the memorial of that entire redeeming work undertaken by Christ upon the earth.

Thus in the religion of grace, as in the religion of nature, the Sabbath lifts itself like some proud obelisk, all covered with inscriptions of man’s duties to his God, and of God’s rich grace to man. So complete is the identity between the Sabbath and the gospel it attests, as to have extorted the confession, that till the former was destroyed, it was hopeless to overturn the latter; and infidel France was instigated to rob it of its sacred associations, by the substitution of a tenth day of rest and pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-morgan-palmer.html">Benjamin Morgan Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath, to the Churches and Church members within the Synod of South Carolina in Minutes of the Synod of South Carolina, at their Sessions, in Winnsborough, Fairfield District, S.C., Nov. 1851</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01a67b3397" data-kw="">
<blockquote><p>It is no wonder, therefore, that such a number of musical instruments should be so heaped together; but although they were a part of the Pedagogia Legalis [the instruction of the law], yet they were not for that reason to be brought into Christian assemblies. For God willeth that, after the coming of Christ, his people should cultivate the hope of eternal life and the practice of true piety by very different and more simple means than these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, Instrumental Music in the Public Worship of the Church</cite></span></figcaption>

</figure><figure class="quote" id="q-8d6d420903" data-kw="">
<blockquote><p>In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I</cite>, (Carlisle: The Banner of Truth Trust, repr. 2009), 8:28.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8aa6b2f93f" data-kw="">
<blockquote><p>That He [Christ] did not abide in death, that the wounds which His body had received from the iron of the nails and spear offered no impediment to His rising again, that after His resurrection He showed Himself as He pleased to his disciples, that when He wished to be present with them He was in their midst without being seen, as needing no entrance through open doors, and that He strengthened the disciples by the inspiration of the Holy Ghost, and that He promised to be amongst them, and that no partition wall should intervene between them and Him, and that to the sight He ascended to Heaven while to the mind He was everywhere; all these, and whatever like facts the history of Him comprises, need no assistance from arguments to show that they are signs of deity and of a sublime and supereminent power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Catechism</cite>, (c. 385), 32 in Nicene and Post-Nicene Fathers 2, 5: 500.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24fdbe45f0" data-kw="">
<blockquote><p>WHAT Luther said of Justification by Faith, that may we concerning the Resurrection of the dead, Articulus est Ecclesiae stantis, aut cadentis; it is an Article with which the Church standeth or falleth; Yet so foul an error had taken the head of some Members in the Church of Corinth, as to deny this grand Truth, which St Paul calls in another place, one of the principles of the Doctrine of Christ: how say some among you, there is no Resurrection of the dead? v. 12.

And, is it not strange, that such who professed to believe the Resurrection of Christ should deny their own! but much more, that any in the Church of Corinth (especially in those early days) should have such a darkness found upon their minds, who stood so near the rising Sun? and that while St Paul himself was yet alive, who had planted this Church; by this we see, though Truth is errors elder, yet error is not much Truths younger. Though the Gospel-Church was purest in the Primitive times, yet it soon began to corrupt in its Members. Not unapt therefore was his saying, who compared (in this respect) the gathering of Churches to the gathering of Apples, which when first gathered, may appear all fair and sound, but then within a while, some amongst them begin to speak, and others to discover their rottenness.

No doubt this Church of Corinth, and so others gathered by the rest of the Apostles, appeared in their Members very sound in the faith, and fair in their lives at their first embracing of the Gospel; yet some we see did thus soon discover corruption in both. Now to recover the tainted, and especially to preserve the sound from this dangerous infection, the Apostle sets himself to defend this Article of our Faith, well knowing, that this was a blow made at the root of Christianity; which must needs fall to the ground, if this cannot be maintained; and he doth it with such invincible arguments, that if any Heretic shall now deny it, the reason cannot be deficiency in the proof here given, but rather a criminous conscience in himself, which makes him on his own defence, deny a Resurrection, for fear of the Judgment which attends it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Labour and Reward, or, A Sermon, part of which was Preached at the Funeral of the Right Honourable the Lady Mary Vere, relict of Sir Horace Vere, Baron of Tilbury, on the 10th of January, 1671, at Castle Heviningham in Essex</cite>, (London: Ralph Smith, 1672), pp 1-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>

<blockquote><p>102 Q. What benefits do believers receive from the resurrection of Christ? A. Four in all. First, the resurrection of Christ is a sure testimony to us that God considers us to be as just and righteous in His eyes as the body of Christ was when He arose from the dead out of all of our sins. This is what St. Paul teaches in 1 Corinthians 15[:17]: “If Christ were not risen, you would still be in your sins.” From that it follows that since Christ has risen, believers are no longer in their sins. Not that there is no more sin them but that it is pardoned and not imputed to them. Christ died not in His own sin but in all of those sins of ours that we commit right up to our death, and He arose out of all of those selfsame sins. It necessarily follows, therefore, that every single one of our sins laid upon His body is completely punished and paid for. Otherwise Christ could not have arisen. For if even one sin remains, death, the penalty for sin, also remains (Rom. 6[:23]). This teaching is found in the verse mentioned a short while ago (1 Cor. 15[:17]) and in Romans 4[:25]: “Christ was delivered up because of our offenses and was raised because of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation</cite>, trans. Lyle Bierma (Grand Rapids: Baker, 1995), 73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>

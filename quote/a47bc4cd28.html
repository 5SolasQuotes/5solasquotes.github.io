</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93c99b2fc5" data-kw="">
<blockquote><p>When men may unite without personal guilt or accession to the defects or guilt of others, there may and ought to be union, even though there be failings and defects of several kinds in a Church; because men are to reckon not for other men’s carriages, but their own: And no such Church-state is to be expected as is free of defects. Beside, can it warrand a man to abstain from his duty because others do not theirs, while as there is no sinful impediment lying in the way of his access thereto?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>because they had not freedom to retract their Protestation, and profess their sorrow for it, two sinful terms of ministerial communion have been imposed:

1. That no minister of this Church should testify from the pulpit against acts of Assembly, and proceedings of Church judicatories, even though they were such as had a direct tendency to undermine our constitution.

2. That no minister or member of this Church should protest, for their own exoneration, against acts, sentences, or decisions of the supreme judicatory, even though they should nearly affect the public cause of God and restrain ministerial freedom and faithfulness in testifying against the sins and defections of a backsliding Church.</p></blockquote>

</figure><figure class="quote" id="q-e15e1b5f18" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing, and we are not only to shun that which gives scandal, but also that whereupon follows a scandal taken, whatsoever it be, if it be not necessary. This is so evident, that Papists themselves subscribe to it, for both Cardinal Cajetan and Dominicus Bannes say that we should abstain even spiritualibus non necessariis [non-necessary spiritual things] when scandal rises out of them. … XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious; and from things that are not necessary, we ought to abstain for the scandal of the malicious as well as for the scandal of the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, p. 32-33</span></figcaption>

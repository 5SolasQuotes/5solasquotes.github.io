<main class="wrap"><figure class="quote" id="q-f48efaebde" data-kw="">
<blockquote><p>The ministers of the Gospel are as this dove, and they come with an olive leaf in their mouths; and they do not get it from the wilderness, but they take it from Paradise; they bring it from the Scriptures, from those blessed things of the Gospel, that are revealed in the Word, and bring it to your souls. Now therefore you should open your hearts and take in the blessed message of peace and reconciliation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Useful Discourses</cite>, ... (d. 1646; London: Parkhurst, 1675), bk. 1, Sermon on Lk. 10:5-6, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74624ffb35" data-kw="">
<blockquote><p>Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works</cite>, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!”

</figure><figure class="quote" id="q-c519eef0e2" data-kw="">
<blockquote><p>A crucified Christ, with all his purchase, is offered to all the hearers of the gospel: for Christ in his Word, and by his ministers in the gospel-offer, speaks to all and every one of them; yea, speaks to every sinner, man and woman in particular, as though He called them by name and surname. And every man is bound to take the call and offer home to himself, as if he were so named, and believe that Christ stands at his door and knocks, saying, ‘If you, or any man, will open to me, I will come in.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacramental Meditations, in The Whole Works of John Willison</cite>, 1816, vol. 3 | Meditation 25, pp. 286-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-240af0c0f7" data-kw="">
<blockquote><p>(2) If they would comply with his admonitions, he was ready to make them good to their souls: Behold, I stand at the door and knock, etc., v. 20. Here observe, [1.] Christ is graciously pleased by his Word and Spirit to come to the door of the heart of sinners; He draws near to them in a way of mercy, ready to make them a kind visit. [2.] He finds this door shut against Him; the heart of man is by nature shut up against Christ by ignorance, unbelief, sinful prejudices. [3.] When He finds the heart shut, He does not immediately withdraw, but He waits to be gracious, even till his head be filled with the dew. [4.] He uses all proper means to awaken sinners, and to cause them to open to Him: He calls by his Word, He knocks by the impulses of his Spirit upon their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tong.html">William Tong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Henry’s Commentary on the Whole Bible. Tong (1662-1727) was one of the puritans that finished Henry’s Commentary when died, still on Acts. | Rev. 3:20, “Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with me.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>It’s true which our Saviour told Nicodemus, Jn. 3:17, that God sent not his Son into the world to condemn the world, but that the world through Him might be saved. Christ does not knock at any man’s heart with that intent that He may have the more advantage against Him, if he let Him not in; no He comes with purpose and desire to bring in salvation with Him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pinke.html">William Pinke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trial of a Christian’s Sincere Love Unto Christ</cite>, (d. 1629; Oxford: Lichfield, 1636), p. 23 Pinke (1599?–1629) was an English puritan in the established Church.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

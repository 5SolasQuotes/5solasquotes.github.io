<main class="wrap"><figure class="quote" id="q-3adc09ff17" data-kw="">
<blockquote><p>Classical metaphysics attains knowledge of God’s nature by means of an interpretation, mostly taken from the Christian Neo-Platonist Pseudo-Dionysius the Areopagite (c. late fifth century) known as the via triplex or three-fold way. This entails (1) the way of causality (via causalitatis), (2) the way of remotion or negation (via remotionis), and (3) the way of eminence (via eminentiae).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dennis-bonnette.html">Dennis Bonnette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How God’s Nature Is Known: The Three-Fold Way” (2018)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8394b46f2c" data-kw="insufficient">
<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.4</span></figcaption>

</figure><figure class="quote" id="q-052496234b" data-kw="">
<blockquote><p>1. Revelation of God in the destitute state is one thing, subjective, which can be called impressed on conscience; objective another, and that either inscribed in Nature or inserted in Scripture. 2. Subjective revelation impressed on conscience is convictive, but not converting. 3. Objective revelation inscribed in nature proposes God the Creator, but by no means God the Redeemer. 4. Of this revelation there is neither other efficacy nor other outcome except ἀπολογησία [inexcusability]. 5. Revelation inserted in Scripture is both the only adequate one and the only one that can be salutary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/disputationum-theologicarum-miscellaneorum-pars-prima.html">Disputationum Theologicarum Miscellaneorum Pars Prima</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation’</cite></span></figcaption>

</figure><figure class="quote" id="q-8c38b87560" data-kw="">
<blockquote><p>So then as when I see an house, I say there has been a carpenter, though I see him not: so when I look upon the frame of this world, I must say, it had a builder, though I behold him not.</p></blockquote>

</figure><figure class="quote" id="q-46901590d5" data-kw="">
<blockquote><p>Now, am I insinuating that to abandon the Aristotelian-Scholastic philosophy of nature, and in particular the theory of act and potency, would be to… threaten to open the door to pantheism, deism, or even atheism? That is exactly what I am insinuating. And here’s one reason to think that I am right: These dire consequences are exactly what followed when the Aristotelian-Scholastic tradition lost its hegemony in Western thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015) | 4. Natural Theology Must Be Grounded in the Philosophy of Nature, Not in Natural Science 61</cite>, p. 66</span></figcaption>

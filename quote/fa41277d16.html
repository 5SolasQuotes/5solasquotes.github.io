<main class="wrap"><figure class="quote" id="q-fa41277d16" data-kw="">
<blockquote><p>The communication of grace effectual, producing infallibly the good things proposed and promised in the minds and hearts of men, belonged not unto that covenant. If, therefore, there be no more in the making of the new covenant but only the adding of more forcible outward means and motives, more suitable unto our reasons, and meet to work on our affections, it differs only in some unassignable degrees from the former. But this is directly contrary unto the promise in the prophet, that it shall not be according unto it, or of the same kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 178</span></figcaption>

</figure><figure class="quote" id="q-4e78a94b75" data-kw="david">
<blockquote><p>Any “good and joyful tidings” whatsoever are called by the Greeks euangelion and by the Hebrews khshrh tvbhh. Yet that is eminently (kat’ exochēn) ascribed in Scripture to the news (the most pleasing of all) concerning the happy advent of Christ to the world, the covenant of grace made in him and the salvation obtained through him. It is not, however, used always with the same meaning. Sometimes it denotes (broadly and in general) the gratuitous covenant made in Christ. In this sense, Paul speaking of the ancient people, says, “They have not all obeyed the gospel” (Rom. 10:16); and it is said, “The gospel was preached to them that are dead” (1 Pet. 4:6). Sometimes it is put strictly and in particular either for the promise and the doctrine concerning Christ about to come (in which sense, Paul says, “The gospel was preached before unto Abraham when the promises were given to him,” Gal. 3:8); or more properly for the doctrine of Christ manifested and the fulfillment of all the promises (in which sense it is everywhere used in the New Testament for the doctrine of the mission of Christ or the completed gospel and is opposed to the epangelia, which denotes simply the doctrine of the promise of Christ in the Old Testament).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12</span></figcaption>

</figure><figure class="quote" id="q-18c1fcd7c3" data-kw="">
<blockquote><p>First, therefore, the apostle doth evidently in this place dispute concerning two covenants, or two testaments, comparing the one with the other, and declaring the disannulling of the one by the introduction and establishment of the other. What are these two covenants in general we have declared, — namely, that made with the church of Israel at mount Sinai, and that made with us in the gospel; not as absolutely the covenant of grace, but as actually established in the death of Christ, with all the worship that belongs unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 84</span></figcaption>

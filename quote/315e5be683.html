<blockquote><p>…Which comes to pass thus:

1. By habitual grace infused, the sanctified will is constantly determined to embrace all spiritual good.

2. By assisting grace the will is stirred up, provoked, allured and inclined to obedience, through the proposal of the promises and the heavenly suggestions of the Holy Spirit.

3. By the same assisting grace all contrary motions of concupiscence are subdued and kept under. So that nothing can hinder obedience to follow; because by grace the will is made willing to obey and by grace all impediments in obeying are taken away: now when all lets are removed, what can let a willing mind to do that which it desires?</p></blockquote>

<blockquote><p>21. The effects of justification, or its necessary consequences, are:

1. Actual adoption, Eph. I.5.

2. Peace of conscience, Rom. V.1.

3. Love, Luke VII.47; and other spiritual charismata [gifts] of that kind, which the Spirit of adoption works in the hearts of the justified. For justification is to be conjoined with sanctification by an inseparable and perpetual bond, yet not to be confounded with it; and to those for whom Christ has been made δικαιοσύνη [dikaiosynē, righteousness], to them He has also been made ἁγιασμός [hagiasmos, sanctification], 1 Cor. I.30.

4. Life and glory, Rom. VIII.30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-b032c34f43" data-kw="">
<blockquote><p>Since, however, it [concupiscence] is diffused through all the parts of our soul, not even the will can be excepted from being infected by it. Since, however, its movements tickle, allure, and entice, this cannot happen without some will, which happens with delight. One and the same man in us is both old and new, in different respects. From this it comes that an inordinate movement is both voluntary and involuntary. Voluntary in that the will of the remaining old man inclines to it; involuntary, in that the new man resists. Although it is one and the same will, since however there are in it two qualities fighting against each other, as long as the Spirit and the flesh remain in us, it is not surprising if concerning one and the same object there is both willing and not willing. When, therefore, a regenerate person does the evil that he does not want [Rom. 7], it is not to be understood that he in no way wants it, but insofar as he is regenerate. Therefore, even the first movements are sins, because they proceed from the corruption of our will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’, p. 13 trans. AI</span></figcaption>

<blockquote><p>Assertion 2. The Gospel-love of Christ frees a captive from under the Law as a curser and delivers him over to the Law as to a pedagogue to lead him to Christ, and as to an instructor to rule and lead him when He is come to Christ. Love is the immediate and nearest lord; law the mediate and remote lord. Love bids the man do all for Christ; the law now of itself, because of our sinfulness, is a bitter and sour thing; but now the law is dipped in Christ’s Gospel-love and is sugared and honeyed, and evangelized with free grace and receives a new form from Christ and is become sweeter than the honey and the honeycomb to draw and persuade: and all the law is made a new commandment of love and a Gospel-yoke, sweet and easy; But still the law obliges justified men to obedience, not only for the matter of it, but for the supreme authority of the Lawgiver; now Christ, who came to fulfill, not to dissolve the law, does not remove this authority, but adds a new bond of obligation, from: [1.] the tie of Redemption in Jesus Christ, and we are freed from the curse of the Law. 2. the rigid exaction of obedience, every way perfect. 3. the seeking of life and justification by the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: J.D., 1647), pt. 3, p. 273</span></figcaption>

<blockquote><p>XX. But, you might say, the apostle himself implies that some are perfect, and includes himself among them. For he adds, “All of us, then, who are mature should take such a view of things” (Phil. 3:15). And in 1 Cor. 2, he says, “We do, however, speak a message of wisdom among the mature.” Many holy men in Scripture are also testified to be perfect. Thus, it is said of Noah, “Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God” (Gen. 6:9). And God Himself, speaking to Satan about Job, says, “Have you considered my servant Job? There is no one on earth like him; he is blameless and upright, a man who fears God and shuns evil” (Job 1:8). Indeed, David in Ps. 18 does not hesitate to attribute such perfection to himself. He says, “I have been blameless before him and have kept myself from sin. The Lord has rewarded me according to my righteousness, according to the cleanness of my hands in his sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses in which the Doctrine of the Roman School concerning the Division of Grace into Sufficient &amp; Efficent, and the Harmony of Human Freedom with the Efficacy of Grace are set forth</cite>, tr. AI by Inquisitor (@WesternCatholik on Twitter) (d. 1675), pp. 76-78</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XX. But, you might say, the apostle himself implies that some are perfect, and includes himself among them. For he adds, “All of us, then, who are mature should take such a view of things” (Phil. 3:15). And in 1 Cor. 2, he says, “We do, however, speak a message of wisdom among the mature.” Many holy men in Scripture are also testified to be perfect. Thus, it is said of Noah, “Noah was a righteous man, blameless among the people of his time, and he walked faithfully with God” (Gen. 6:9). And God Himself, speaking to Satan about Job, says, “Have you considered my servant Job? There is no one on earth like him; he is blameless and upright, a man who fears God and shuns evil” (Job 1:8). Indeed, David in Ps. 18 does not hesitate to attribute such perfection to himself. He says, “I have been blameless before him and have kept myself from sin. The Lord has rewarded me according to my righteousness, according to the cleanness of my hands in his sight.”

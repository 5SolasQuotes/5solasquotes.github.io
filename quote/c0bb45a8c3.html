<blockquote><p>Argument I. The first argument [against universal redemption] may be taken from the nature of the covenant of grace, which was established, ratified, and confirmed in and by the death of Christ; that was the testament whereof he was the testator, which was ratified in his death, and whence his blood is called “The blood of the new testament,” Matt. xxvi. 28. Neither can any effects thereof be extended beyond the compass of this covenant. But now this covenant was not made universally with all, but particularly only with some, and therefore those alone were intended in the benefits of the death of Christ.

The assumption appears from the nature of the covenant itself, described clearly, Jer. xxxi. 31, 32, “I will make a new covenant with the house of Israel, and with the house of Judah: not according to the covenant that I made with their fathers in the day that I took them by the hand to bring them out of the land of Egypt; which my covenant they brake, though I was an husband to them, saith the Lord;” — and Heb. viii. 9–11, “Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord. For this is the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws in their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people: and they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest.”

Wherein, first, the condition of the covenant is not said to be required, but it is absolutely promised: “I will put my fear in their hearts.” And this is the main difference between the old covenant of works and the new one of grace, that in that the Lord did only require the fulfilling of the condition prescribed, but in this be promiseth to effect it in them himself with whom the covenant is made. And without this spiritual efficacy, the truth is, the new covenant would be as weak and unprofitable, for the end of a covenant (the bringing, of us and binding of us to God), as the old. For in what consisted the weakness and unprofitableness of the old covenant, for which God in his mercy abolished it? Was it not in this, because, by reason of sin, we were no way able to fulfil the condition thereof, “Do this, and live?” Otherwise the connection is still true, that “he that doeth these things shall live.”

And are we of ourselves any way more able to fulfil the condition of the new covenant? Is it not as easy for a man by his own strength to fulfil the whole law, as to repent and savingly believe the promise of the gospel? This, then, is one main difference of these two covenants, — that the Lord did in the old only require the condition; now, in the new, he will also effect it in all the federates, to whom this covenant is extended. And if the Lord should only exact the obedience required in the covenant of us, and not work and effect it also in us, the new covenant would be a show to increase our misery, and not a serious imparting and communicating of grace and mercy. If, then, this be the nature of the new testament, — as appears from the very words of it, and might abundantly be proved, — that the condition of the covenant should certainly, by free grace, be wrought and accomplished in all that are taken into covenant, then no more are in this covenant than in whom those conditions of it are effected.

But thus, as is apparent, it is not with all; for “all men have not faith,” — it is “of the elect of God:” therefore, it is not made with all, nor is the compass thereof to be extended beyond the remnant that are according to election. Yea, every blessing of the new covenant being certainly common, and to be communicated to all the covenantees, either faith is none of them, or all must have it, if the covenant itself be general. But some may say that it is true God promiseth to write his law in our hearts, and put his fear in our inward parts; but it is upon condition. Give me that condition, and I will yield the cause. Is it if they do believe? Nothing else can be imagined. That is, if they have the law written in their hearts (as every one that believes hath), then God promiseth to write his law in their hearts! Is this probable, friends? is it likely?

I cannot, then, be persuaded that God hath made a covenant of grace with all, especially those who never heard a word of covenant, grace, or condition of it, much less received grace for the fulfilling of the condition; without which the whole would be altogether unprofitable and useless. The covenant is made with Adam, and he is acquainted with it, Gen. iii. 15, — renewed with Noah, and not hidden from him, — again established with Abraham, accompanied with a full and rich declaration of the chief promises of it, Gen. xii.; which is most certain not to be effected towards all, as afterwards will appear. Yea, that first distinction, between the seed of the woman and the seed of the serpent is enough to overthrow the pretended universality of the covenant of grace; for who dares affirm that God entered into a covenant of grace with the seed of the serpent?

Most apparent, then, it is that the new covenant of grace, and the promises thereof, are all of them of distinguishing mercy, restrained to the people whom God did foreknow; and so not extended universally to all. Now, the blood of Jesus Christ being the blood of this covenant, and his oblation intended only for the procurement of the good things intended and promised thereby, — for he was the surety thereof, Heb. vii. 22, and of that only, — it cannot be conceived to have respect unto all, or any but only those that are intended in this covenant.</p></blockquote>

<blockquote><p>[T]here is a further consideration that will make it appear, that the Grace of God does exceed the grace of the most glorious angel in heaven: which is the unlimited perfection of God’s nature, the Angels have a stinted measure of perfection: the excelling of their nature is not sufficient in order to some acts of grace: as in other respects, they are not sufficient, so they have not grace enough to pardon such wrongs as God pardons; to be at such cost for man’s salvation, as God has been at: ’tis true that they do approve of and rejoice in all those acts of Grace that God does? but such actions do exceed the grace that is in their hearts; they have can’t perform those acts of mercy that God does: therefore where God would shew his sufficiency to pardon the iniquities of his people, he tells them, that God, Hos. 11.6. this infiniteness of God’s grace is the foundation of our faith, for such things as we are utterly unworthy of: Psal. 36.7. how excellent is thy loving kindness O Lord, therefore the Sons of men put their trust under the shadow of thy wings.

There is an infinite Ocean of grace in the heart of God, whereby he can bestow the greatest gifts upon his creatures, that their natures are capable of: this plain from that absolute liberty which the Scripture does ascribe unto God in all his actions; he does all things after the counsel of his own Will. Eph. 1.11. I will have mercy on whom I will have mercy, Rom 9.15. which shews there is no limitedness in his perfection, to be any restraint unto him: or a reason why he does not pardon and save these and those: his glorious excellency is such, that no unworthiness, nor provocation can overcome his mercy: but there is a sufficiency of grace in him, for any thing that is an act of mercy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[T]here is a further consideration that will make it appear, that the Grace of God does exceed the grace of the most glorious angel in heaven: which is the unlimited perfection of God’s nature, the Angels have a stinted measure of perfection: the excelling of their nature is not sufficient in order to some acts of grace: as in other respects, they are not sufficient, so they have not grace enough to pardon such wrongs as God pardons; to be at such cost for man’s salvation, as God has been at: ’tis true that they do approve of and rejoice in all those acts of Grace that God does? but such actions do exceed the grace that is in their hearts; they have can’t perform those acts of mercy that God does: therefore where God would shew his sufficiency to pardon the iniquities of his people, he tells them, that God, Hos. 11.6. this infiniteness of God’s grace is the foundation of our faith, for such things as we are utterly unworthy of: Psal. 36.7. how excellent is thy loving kindness O Lord, therefore the Sons of men put their trust under the shadow of thy wings.

There is an infinite Ocean of grace in the heart of God, whereby he can bestow the greatest gifts upon his creatures, that their natures are capable of: this plain from that absolute liberty which the Scripture does ascribe unto God in all his actions; he does all things after the counsel of his own Will. Eph. 1.11. I will have mercy on whom I will have mercy, Rom 9.15. which shews there is no limitedness in his perfection, to be any restraint unto him: or a reason why he does not pardon and save these and those: his glorious excellency is such, that no unworthiness, nor provocation can overcome his mercy: but there is a sufficiency of grace in him, for any thing that is an act of mercy.”

<blockquote><p>At first Ishmael had obtained the same rank with his brother Isaac, because the spiritual covenant was equally sealed in him by the symbol of circumcision. He is first cut off, then Esau, at last an innumerable multitude, almost the whole of Israel. In Isaac was the seed called. The same calling held good in the case of Jacob. God gave a similar example in the rejection of Saul. This is also celebrated in the psalm, “Moreover, he refused the tabernacle of Joseph, and chose not the tribe of Ephraim: but chose the tribe of Judah,” (Ps. 78:67-68) This the sacred history sometimes repeats, that the secret grace of God may be more admirably displayed in that change. I admit that it was by their own fault Ishmael, Esau, and others, fell from their adoption; for the condition annexed was that they should faithfully keep the covenant of God, whereas they perfidiously violated it.</p></blockquote>

<blockquote><p>Effects arisen and dependent from faith considered organically are:

I. Real and passive, or received, union with Christ, and ingrafting into the new covenant, and thus communion of all goods in Christ.

II. Passive reconciliation and justification (as they call it), or rather internal, in us—from which is distinguished external or active justification, which is concerning us. Furthermore, this necessary distinction [between active and passive justification] has been illustrated above all others, and clearly and solidly defended by Dr. [Johannes] Maccovius in his Theological Collection, pt. 4, Disputation 9, compared with pt. 3, Disputation 16, and his particular syllabus of disputations on Justification. And we in the Problems on Justification shall vindicate it ἐν παρόδῳ [en parodō, in passing] from certain objections. There is no reason therefore to pursue it here at greater length. Only I add these three things for the sake of younger students:

      1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.

      2. That active justification is distinguished from the decree of justification, as the execution of a decree from the decree, and the emanating action of God from the immanent. Just as the decree of creation must necessarily be distinguished from creation itself.

      3. That the same was accomplished fundamentally and κατ’ ἐπαγγελίαν [kat’ epangelian, according to promise] in the first institution, contracting, and promulgation of the new covenant, Gen. 3 [v. 15]; consummatively in the cross and resurrection of Christ, Rom. 8:32–33; 2 Cor. 5:18–19.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a51fafc090" data-kw="">
<blockquote><p>For the poor and the sons of toil, we plead the relaxation of oppressive labour; we urge that recreation shall be allowed them; and we earnestly claim for them the improvement of their dwellings, a plentiful supply of wholesome food, and whatever else can alleviate their burdens, and make their outward condition comfortable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The races: the evils connected with horse-racing and the steeple-chase and their demoralizing effects</cite>, (1853) in Works doctrinal and practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh, 1876), iv, 337.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12d3158c04" data-kw="">
<blockquote><p>Gilbert McMaster was an American Covenanter who originally hailed from Saintfield, County Down in what is now Northern Ireland. In 1818 he wrote a number of letters in defence of psalmody. In one of these letters, he pointed out that the excitements of so-called revivals were no excuse for the use of uninspired hymns:

It is most notorious, that those excitements called revivals of religion, which make the greatest noise, are effected where the most pernicious errors are habitually taught. That these, and modern hymns, have a great share in the production of those noisy but short-lived agitations, need not be doubted. Israel’s worship of the golden calf was marked by a greater excitement than the usual and approved worship of Jehovah.

A visit to those favoured districts of revival, a few months after a magazine description, or ecclesiastical report has been given of the multitudes converted, would cast a shade of doubt, generally, on those fine narratives. And the man who considers that the embracing of truth, turning to God through a crucified and exalted Saviour, and living a life of practical godliness, are the best proofs of real conversion, wishes, sincerely, that the things were published as they really are, and that our country furnished one journal, which would venture to tell all the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-mcmaster.html">Gilbert McMaster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the C</cite>, hurch of God (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), p. 190.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-87ad15d57f" data-kw="">
<blockquote><p>I do highly approve the distinction following of things commanded, and things permitted on the Lord’s Day, and the explication of each member; the object of the one, all actions advancing God’s service; the object of the other, such things as are no hindrance thereunto; As in the first place works of necessity; then works of charity; yet the permitting of these, is rightly to be understood; not so as if the works of necessity here mentioned, were in such sort permitted as left to a man’s liberty, whether he will perform them or no. For undoubtedly we are bound as much as lies in our power, to quench a dangerous fire kindled in a town, on the Sabbath day, it being a work of mercy, necessarily required. For if to return a pledge ere the poor pawner of it went to his bed, in case it were his covering, were a work of mercy, how much more to save a man’s house from burning, how much more to save a whole town from being consumed, whereby many might be driven to lie without doors, void of all comfort to the body? So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>

</figure><figure class="quote" id="q-d6862f053c" data-kw="">
<blockquote><p>26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant [1643] which renounces profaneness, schism and all that is contrary to godliness.

27. So much are Papists angry at Protestant ministers that keep them [non-conformists] out of the parish churches, [Papists] reviling them [such Protestant ministers] as trimmers, [Papists] supposing that conventicles [worship assemblies of non-conformists] can do them less harm, that all that love the Protestant religion should do their best to encourage† all such orthodox men and to strengthen the Protestant interest in the parish churches, and not join against them with the Papists (however it be with other intents and minds).</p></blockquote>

62f053c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=26.%20In%20most%20countries%20of%20England,be%20with%20other%20intents%20and%20minds&amp;text=26.%20In%20most%20countries%20of%20England%2C%20many%20hundred&amp;text=however%20it%20be%20with%20other%20intents%20and%20minds" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I do heartily acknowledge that what we find to have been an ordinance, or an approved practice in the Jewish Church, ought to be a rule and pattern to us, such things only excepted which were typical or temporal, that is, for which there were special reasons proper to that infancy of the Church and not common to us.</p></blockquote>

<blockquote><p>7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].</p></blockquote>

<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>

</figure><figure class="quote" id="q-c2e86419c9" data-kw="">
<blockquote><p>…his [John Robinson’s] answer is that no parish assemblies [under patrons and bishops] have power of right to choose their ministers. Whereas on the contrary it is most evident that every congregation of Christians has right unto this thing from Christ Himself so inseparably annexed unto it that no external oppression by others or abuse of their own can possibly deprive them of this right, so long as they remain a Christian assembly or congregation. Suppose they be in external bondage, and that in some sense spiritual, yet no matter of fact can take away right, while they abide such as Christ has given that right unto. The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed. Even so stands the matter betwixt minister and people in England, they agreeing or contracting betwixt themselves have right one in other: but external legal power or liberty they must receive from others. Another example also I would have considered: the emperor sometime was so subiect unto the pope that he had not liberty of emperial rule until he received his crown from Rome: yet was the emperor then no proper part of the papacy, nor did he take his right from the pope, neither did those that submitted unto him therein communicate with the pope’s authority. So is this in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-e09ed042bc" data-kw="">
<blockquote><p>III. …acts of divine worship are twofold, some which do not differ from the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded of God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the church has no control or power over them; the latter God has thus far left to the will of the church as means and indifferent, so that a regard be always paid to divine truth., Christian simplicity and public edification. … XIX. The object of this directive power is not the doctrine itself of faith and worship (which rests upon the Word of God alone), but other things concerning which the express Word of God is not given, which are either merely indifferent and free or ambiguous and doubtful, concerning which God has delivered nothing certain in particular, such as was the case about which the apostle speaks in 1 Cor. 7:10,12, or which refer to the mode of external worship, or the determination of the circumstances, without which the precepts of the first table and the public exercises of piety in ecclesiastical assemblies scarcely and not even scarcely can be rightly observed and performed. Here pertain the time, place, form and rule of prayers, addresses, of the administration of the sacraments, fasts, alms-giving: all of which ought to be established and exercised not with confusion, but rightly and decently (euschemonos) for the edification of the church. Since these in themselves are indifferent and do not directly touch the mystery of our salvation, they do not of themselves bind the conscience, nor yet are they so fixed and immovable that they may not be reformed and changed where the use of the church shall demand.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“III. …acts of divine worship are twofold, some which do not differ from the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded of God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the church has no control or power over them; the latter God has thus far left to the will of the church as means and indifferent, so that a regard be always paid to divine truth., Christian simplicity and public edification. … XIX. The object of this directive power is not the doctrine itself of faith and worship (which rests upon the Word of God alone), but other things concerning which the express Word of God is not given, which are either merely indifferent and free or ambiguous and doubtful, concerning which God has delivered nothing certain in particular, such as was the case about which the apostle speaks in 1 Cor. 7:10,12, or which refer to the mode of external worship, or the determination of the circumstances, without which the precepts of the first table and the public exercises of piety in ecclesiastical assemblies scarcely and not even scarcely can be rightly observed and performed. Here pertain the time, place, form and rule of prayers, addresses, of the administration of the sacraments, fasts, alms-giving: all of which ought to be established and exercised not with confusion, but rightly and decently (euschemonos) for the edification of the church. Since these in themselves are indifferent and do not directly touch the mystery of our salvation, they do not of themselves bind the conscience, nor yet are they so fixed and immovable that they may not be reformed and changed where the use of the church shall demand.”

— Francis Turretin, Institutes | vol. 3, pp. 286 &amp; 290 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+%E2%80%A6acts+of+divine+worship+are+twofold%2C+some+which+do+not+differ+from+the+worship+itself+%28to+wit%2C+from+piety+and+holiness%2C+in+which+worship+essentially+consists%29%3B+others+ordinated+to+worship+as+helps+or+instruments+to+perform+that+worship+suitably+and+declare+it+abroad.+The+former+kind+of+acts+can+be+instituted+and+commanded+of+God+alone%2C+who+is+the+sole+chief+and+legislator%2C+who+has+dominion+over+the+conscience%3B+nor+does+any+right+belong+to+the+church+of+adding%2C+taking+away+or+changing+anything.+The+latter%2C+again%2C+are+either+necessary+and+so+also+instituted+by+God%2C+at+least+as+to+being+%28to+on%29%E2%80%93for+example+that+assemblies+should+be+held%2C+the+word+preached%2C+the+sacraments+administered%3B+others+are+contingent+and+free+as+to+quality+%28to+poion%29%2C+the+reason+of+which+depends+upon+the+honesty+and+fitness+of+particular+churches+%28to+wit%2C+that+assemblies+should+be+held+in+this+or+that+time+and+place+and+the+sacraments+administered%29.+The+former%2C+as+being+necessary%2C+depend+upon+God+alone+and+the+church+has+no+control+or+power+over+them%3B+the+latter+God+has+thus+far+left+to+the+will+of+the+church+as+means+and+indifferent%2C+so+that+a+regard+be+always+paid+to+divine+truth.%2C+Christian+simplicity+and+public+edification.+%E2%80%A6+XIX.+The+object+of+this+directive+power+is+not+the+doctrine+itself+of+faith+and+worship+%28which+rests+upon+the+Word+of+God+alone%29%2C+but+other+things+concerning+which+the+express+Word+of+God+is+not+given%2C+which+are+either+merely+indifferent+and+free+or+ambiguous+and+doubtful%2C+concerning+which+God+has+delivered+nothing+certain+in+particular%2C+such+as+was+the+case+about+which+the+apostle+speaks+in+1+Cor.+7%3A10%2C12%2C+or+which+refer+to+the+mode+of+external+worship%2C+or+the+determination+of+the+circumstances%2C+without+which+the+precepts+of+the+first+table+and+the+public+exercises+of+piety+in+ecclesiastical+assemblies+scarcely+and+not+even+scarcely+can+be+rightly+observed+and+performed.+Here+pertain+the+time%2C+place%2C+form+and+rule+of+prayers%2C+addresses%2C+of+the+administration+of+the+sacraments%2C+fasts%2C+alms-giving%3A+all+of+which+ought+to+be+established+and+exercised+not+with+confusion%2C+but+rightly+and+decently+%28euschemonos%29+for+the+edification+of+the+church.+Since+these+in+themselves+are+indifferent+and+do+not+directly+touch+the+mystery+of+our+salvation%2C+they+do+not+of+themselves+bind+the+conscience%2C+nor+yet+are+they+so+fixed+and+immovable+that+they+may+not+be+reformed+and+changed+where+the+use+of+the+church+shall+demand.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+%7C+vol.+3%2C+pp.+286+%26+290+of+Question+31%2C+%E2%80%98Does+a+legislative+power+properly+so+called%2C+of+enacting+laws+binding+the+conscience%2C+belong+to+the+church%3F+Or+only+an+ordaining+%28diataktike%29+power%2C+of+sanctioning+constitutions+and+canons+for+the+sake+of+good+order+%28eutaxian%29%3F+The+former+we+deny%3B+the+latter+we+affirm+against+the+Romanists.%E2%80%99+under+%E2%80%98Ecclesiastical+Power%E2%80%99+in+the+18th+topic%2C+%E2%80%98The+Church%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe09ed042bc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e09ed042bc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=acts%20of%20divine%20worship%20are%20twofold,use%20of%20the%20church%20shall%20demand&amp;text=acts%20of%20divine

<blockquote><p>Helvidius [lived before 383 A.D.] displayed excessive ignorance in concluding that Mary must have had many sons, because Christ’s ‘brothers’ are sometimes mentioned.</p></blockquote>

</figure><figure class="quote" id="q-98b0196328" data-kw="">
<blockquote><p>Calvin, like Luther and Zwingli, taught the perpetual virginity of Mary. The early Reformers even applied, though with some reticence, the title Theotokos [God-bearer] to Mary… Calvin called on his followers to venerate and praise her as the teacher who instructs them in her Son’s commands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/qualified-acceptance-of.html">Qualified Acceptance of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On John Calvin | J. A. Ross MacKenzie (a Protestant), in ed. Stacpoole, Alberic, Mary’s Place in Christian Dialogue (Wilton, Connecticut: Morehouse-Barlow, 1983)</cite>, pp. 35-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“Calvin, like Luther and Zwingli, taught the perpetual virginity of Mary. The early Reformers even applied, though with some reticence, the title Theotokos [God-bearer] to Mary… Calvin called on his followers to venerate and praise her as the teacher who instructs them in her Son’s commands.”

</figure><figure class="quote" id="q-e67d284668" data-kw="">
<blockquote><p>[According to Hickman’s opponent, Mary] had not set one step forward toward the consummation of her marriage so much as in thought, and possibly had set herself back from it by a vow of chastity and holy celibate… and of the burden [pregnancy] which she bare not hindering her… That she had no pain in the production, for to her alone did not the punishment of Eve extend, that in sorrow she should bring forth… so He came also into the world without doing violence to the virginal and pure body of his mother. He [the opponent] contents not himself to assert the perpetual virginity of Mary, which is not denied by any Protestant, but [he] will abuse Scripture to prove it; viz. that of Eze. 44:2…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Laudensium Apostasia: or A Dialogue in which is shown that some divines risen up in our church since the greatness of the late archbishop [Laud, d. 1645], are in sundry points of great moment, quite fallen off from the doctrine received in the Church of England (London, 1660), Preface. Hickman was a reformed puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“[According to Hickman’s opponent, Mary] had not set one step forward toward the consummation of her marriage so much as in thought, and possibly had set herself back from it by a vow of chastity and holy celibate… and of the burden [pregnancy] which she bare not hindering her… That she had no pain in the production, for to her alone did not the punishment of Eve extend, that in sorrow she should bring forth… so He came also into the world without doing violence to the virginal and pure body of his mother. He [the opponent] contents not himself to assert the perpetual virginity of Mary, which is not denied by any Protestant, but [he] will abuse Scripture to prove it; viz. that of Eze. 44:2…”

%99s%20opponent%2C%20Mary%5D%20had%20not%20set&amp;text=to%20prove%20it%3B%20viz.%20that%20of%20Eze.%2044%3A2" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b612f4cfc4" data-kw="Mary Saviour">
<blockquote><p>It is with great propriety, in speaking of the joy of her heart, that she gives to God the appellation of Savior. Till God has been recognised as a Savior, the minds of men are not free to indulge in true and full joy, but will remain in doubt and anxiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:47</span></figcaption>

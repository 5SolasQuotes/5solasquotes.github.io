<blockquote><p>21. The effects of justification, or its necessary consequences, are: 1. Actual adoption, Eph. I.5. 2. Peace of conscience, Rom. V.1. 3. Love, Luke VII.47; and other spiritual charismata [gifts] of that kind, which the Spirit of adoption works in the hearts of the justified. For justification is to be conjoined with sanctification by an inseparable and perpetual bond, yet not to be confounded with it; and to those for whom Christ has been made δικαιοσύνη [dikaiosynē, righteousness], to them He has also been made ἁγιασμός [hagiasmos, sanctification], 1 Cor. I.30. 4. Life and glory, Rom. VIII.30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5e879f068" data-kw="">
<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: 1) A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) If love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was [not] formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection. 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. That this blessedness is not simply intellection, but includes an act of will or love, seems to follow from the fact that there is in God some operation besides what is formally called intellection, for God is formally willing, at least in respect of creatures. (See the next chapter [Part 3] about the proof of free volition in God.) For if God freely creates things outside himself and so has volition, it seems that he also has some act of volition, namely love, toward himself. 3) God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally. As was said above about divine intellection, this divine love is not something really distinct from God’s essence. It extends, therefore, to everything that is really identified with the same essence. Hence it can be said that God loves his essence, his decrees, his knowledge, etc. This love is also eternal, unchangeable, non-contingent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Proof of God’</cite></span></figcaption>

get="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>

</figure><figure class="quote" id="q-e3cb1665bd" data-kw="">
<blockquote><p>Now yet this might stand, if as learned Mr. [William] Pemble and others assert, sanctification does, in order of nature, precede justification, and which to me seems not remote from truth, or prejudicial to the grace of justification at all, and withal consonant to right reason, for if (as all grant) justification be upon an act of faith on Christ for justification, and that not until then we are justified, as all do and must acknowledge that hold justification by faith, according to the Scriptures, and that an act of faith must proceed from a principle of faith habitually wrought, then necessarily sanctification, taking it for the principles of habitual sanctification, must be in order of nature afore justification; for the seed and principle of faith is a part, and a principal part, of regeneration or sanctification, as taken in that sense, for the working the principles of all grace, and so is agreeable to that order and chain, Rom. 8:29, where ‘called’ is put before being ‘justified,’ as predestination is put before being called, understanding calling, of the working [of] the principles of regeneration.</p></blockquote>

<blockquote><p>…Which comes to pass thus: 1. By habitual grace infused, the sanctified will is constantly determined to embrace all spiritual good. 2. By assisting grace the will is stirred up, provoked, allured and inclined to obedience, through the proposal of the promises and the heavenly suggestions of the Holy Spirit. 3. By the same assisting grace all contrary motions of concupiscence are subdued and kept under. So that nothing can hinder obedience to follow; because by grace the will is made willing to obey and by grace all impediments in obeying are taken away: now when all lets are removed, what can let a willing mind to do that which it desires?</p></blockquote>

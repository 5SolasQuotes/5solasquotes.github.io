<blockquote><p>They are such prayers as are offered to God in the name of Jesus Christ. This is a thing you all know, that those prayers that are not offered up in Christ are not acceptable because the person is not regarded. It was the sin of Uzziah, in 2 Chronicles 26, that he would go to the temple, himself being a king on the throne, and would offer incense without a priest. We do the very same thing whenever we go to offer up any prayer to God without Christ Jesus.

In the old law men might bring their sacrifices, but the priest must still be the one to offer them up. So must we here; and the reason is given in Revelation 8, because the prayers that come from us savour of the flesh from which they come, and the angel of the covenant mingles much incense with them and makes them sweet and acceptable to God with much incense. That is, as the flesh is more, so there needs to be more incense so that they may be made acceptable to God the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Daily Exercise: A Treatise Concerning the Whole Duty of Prayer</cite>, (1632) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), pp 8-9.</span></figcaption>

<blockquote><p>In some Christian circles, it is common for people to assume that an afflicted person is being punished by God for personal sin. Although God sometimes disciplines his people to promote their sanctification (Hebrews 12:11), James Ussher points out that we must be careful of such censorious thoughts. Indeed, in his discussion of the third commandment, he goes so far as to assert that such assumptions are tantamount to taking the Lord’s name in vain. Amid a list of violations of the third commandment, he writes:

Evil thoughts towards our Brethren, which are afflicted. As when we see one visited by God, either in Body, Goods, or both; we are always read to think the worse of him; viz. that God executeth these Punishments on him for his sin. When as God may do it either to exercise the Faith and Patience of the Party afflicted, as in Job; or to stir others to Compassion and Pity; or else to set forth his own Glory, as we may see verified in the Example of the blind Man in the Gospel, John 9. 2, 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: or, The Sum and Substance of Christian Religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 216.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Q. Which is the fourth Commandment?

A. Remember the Sabbath day, &amp;c.

Q. What is the general duty here required?

A. That the whole Sabbath or Lord’s day be set apart from all common use, as holy to the Lord, both publicly and privately in the practise of the duties of necessity, holiness, and mercy.

Expos. 11. In this commandment it is enjoined, that we finish all our worldly business in six days, Deu. 5. 13. and that we rise betimes in the morning upon the Sabbath, Mark. 1. 35. compared with ver. 38. 39. Exod. 32. 5, 6. Psal. 92. 2. and prepare our selves for the public congregation, by prayer, meditation, thanksgiving, and examination of our hearts, Eccles. 4. 17. Psal. 93. 5. 2. Tim. 2. 19. going about the works of mercy, and instant necessity with heavenly minds, Matth. 12. 1. &amp;c. Luk. 13. 15.

It is also required that we join with the people of God in the public congregation, hearing the word read and preached, calling upon God’s name, receiving the Sacraments, praising God for his mercies, singing of Psalms, 2. King. 4. 23. Act. 13. 14, 15. 44. and 15. 21. and 16. 13. and 17. 2. and 20. 7. In which exercises we must be all the while attentive, Act. 16. 14. reverent, Esa. 66. 2. &amp; eager to get good, Psa. 42. 1, 2. not departing till the blessing bee pronounced, Ezec. 46. 1, 2. 10. Act. 10. 33. 1. Cor. 14. 16. After the whole day is to be spent with delight, and cheerfulness in religious meditation, reading and conference, and the works of necessity and mercy, Esa. 58. 13. 14. Act. 17. 11. Psal. 1. 2. Luk. 24. 14. 17. 1. Cor. 16. 2.

Q. What is the general sin there forbidden?

A. All neglecting of the duties of that time, or profaning of that day in whole or in part, by needless works, words, or thoughts, about our callings or recreations.

Expos. 12. Here is forbidden idleness or a negligent omission of any duty required, either in whole or in part, for matter or manner: as sleeping out of the Sabbath in the morning, sleight preparing our selves for the public assembly, absence from it, coming late, sleeping there, staring about, going forth before the blessing, misapplying the word. Mat. 20. 6. Act. 20. 9.

13. All profanation of the Sabbath, or any moment of that precious time, with worldly cares, words, or business, is condemned also, Esa. 58. 13. as travailing journeys, Exod. 16. 29. 30. keeping fairs, Neh. 13. 15, 16, 17. labouring in seed-time and harvest, Exod. 34. 21. going on trifling errands, &amp;c. vain recreations, as bowling, shooting, hunting, stool-ball, &amp;c. on this day are unlawful.

Q. Which day is to be set apart as holy to the Lord?

A. It is moral and perpetual to keep one day in seven as holy: from the creation to the resurrection of Christ, the seventh day was instituted: after Christ his resurrection, the first day of the week was ordained, and is to be kept for ever.

14. The work of our redemption is the greatest work that ever was, Joh. 3. 16. and by Christ his resurrection from the dead, a new creation was as it were finished: wherefore seeing that he rose again the first day, it was (as divines agree) meet the Sabbath should be changed to the first day. Act. 20. 7. 1. Cor. 16. 2.</p></blockquote>

<blockquote><p>Vers. 13. Go to now, ye that say, To day or tomorrow we will go into such a City, and continue there a year, and buy, and sell, and get gain.

The third Admonition, especially to buyers, touching the correcting of their slothful neglect of Divine Providence in undertaking businesses: He convinces them of this sin, from the words mimically propounded. The Arguments of the Exhortation are six.

Argum. 1. It is contained in form of citation to God’s Tribunal, Go to, &amp;c. As if he should say, this prophane and wicked manner of deliberation, which doth not acknowledge the Providence of God, can neither bear the trial of God, nor men judging aright: For as if you were Lords of your lives, and of your strength, and success of your labours, so ye speak, ye dare not defend this carriage before God: Therefore ye are held guilty of prophaneness, for these forms of speaking used by you.

Vers. 14. Whereas ye know not what shall be on the morrow: for what is your life? it is even a vapour, that appeareth for a little time, and then vanishes away.

Argum. 2. Ye foolishly determine touching the time to come, when we are all ignorant what will be to morrow: Therefore here you are accused of prophaneness.

For what] Argum. 3. Ye forget your mortality, and the frailty of your life, which is like a vapour, appearing for a little time, by and by cast down by the wind, it vanisheth away: Therefore here ye are deservedly accused of prophaneness.

Vers. 15. For that ye ought to say, if the Lord will, we shall live and do this or that.

Argum. 4. Ye consider not that ye ought to depend upon the Divine will, which is the fountain, rule, and measure of all things. In which argument he prescribes also the remedy against this evil; viz. that we do not always seriously acknowledge only the commanding or revealed will of God (which prescribes to us what, and how we ought to act:) But also the secret will of God, governing and efficaciously working in us, and by us, what, and how much, and as long as it seems good to him:

<blockquote><p>If life be brief and fading, we have all the more need to improve it diligently, and to realize its awful bearing on eternity. Knowing that we are every day advancing nearer to the grave, oh! how important to be daily looking beyond it, and turning our time to a spiritual account. Consider, then, for what ends life was given you, how these ends have already been prosecuted, and to what extent they have yet been attained. Without all controversy, the most urgent business of time is to secure the salvation of the soul — to acquire the knowledge and the favour of God — to learn his truth, and to live to his glory. How much, then, of the time past of your lives has been devoted to spiritual exercises, to prayer, to searching the Holy Scriptures, to the study of your own hearts?

Just let the last year of your existence be the subject of review, and say what were your spiritual views and experience at the time it commenced, and what are they now? Surely some change, either to the better or the worse, must have taken place upon your moral condition, for character is no more stationary than time — and in not improving, it must be degenerating. And it becomes you to ascertain whether you have advanced in knowledge and in grace, or whether you have been losing ground, and pursuing a careless and a backsliding path.

Ah, brethren, it is certain that the progress of the year has brought every one of you nearer to death, and judgment, and eternity — and how near none of us can tell. But are you any nearer heaven any better prepared for the solemn meeting with your God? You are more nearly being done with this world and with all its passing interests. But are your hearts more dead to it in proportion, and more decidedly and earnestly set on the things which arc above? Or, just as your interest in time has been diminishing, has your love for the world been increased?

Oh! inquire — search diligently into your own spiritual condition. Much of your time has been necessarily occupied with the business of the world — and too much of it, perhaps, has been wasted in idleness and in unprofitable amusement, if not in sinful pleasure. But what have you been doing for your souls? Is your peace made with God through Jesus Christ? Have you clearly understood, and cordially embraced, the way of salvation revealed? Are you satisfied that you are in a state of grace — that you have been effectually called and regenerated — and that God has given you the earnest of his Spirit in your heart?</p></blockquote>

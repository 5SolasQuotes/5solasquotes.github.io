<main class="wrap"><figure class="quote" id="q-373f952ee3" data-kw="">
<blockquote><p>From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 4.26.4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69e49f7459" data-kw="">
<blockquote><p>For seeing that Christ is the rock (Petra), Peter is the Christian people. For the rock (Petra) is the original name. Therefore Peter is so called from the rock; not the rock from Peter; as Christ is not called Christ from the Christian, but the Christian from Christ. Therefore, he says, You are Peter; and upon this Rock which you have confessed, upon this Rock which you have acknowledged, saying, You are the Christ, the Son of the living God, will I build My Church; that is upon Myself, the Son of the living God, will I build My Church. I will build you upon Myself, not Myself upon you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the New Testament</cite>, serm. 26 (Ben. 76), §1</span></figcaption>

</figure><figure class="quote" id="q-c23f226acb" data-kw="">
<blockquote><p>For neither does any of us set himself up as a bishop of bishops, nor by tyrannical terror does any compel his colleague to the necessity of obedience; since every bishop, according to the allowance of his liberty and power, has his own proper right of judgment, and can no more be judged by another than he himself can judge another. But let us all wait for the judgment of our Lord Jesus Christ, who is the only one that has the power both of preferring us in the government of His Church, and of judging us in our conduct there.</p></blockquote>

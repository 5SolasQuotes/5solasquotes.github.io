<main class="wrap"><figure class="quote" id="q-e46b470ae9" data-kw="">
<blockquote><p>He that commandeth not what God commandeth, and punisheth and killeth where God, if personally and immediately present, would neither command nor punish, is not in these acts to be subjected unto, and obeyed as a superior power, though in habit he may remain a superior power; for all habitual, all actual superiority is a formal participation of the power of the Most High.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b1561376e" data-kw="">
<blockquote><p>It is not in men’s free will that they have government or no government, because it is not in their free will to obey or not to obey the acts of the court of nature, which is God’s court; and this court enacts that societies suffer not mankind to perish, which must necessarily follow if they appoint no government; also it is proved elsewhere, that no moral acts, in their exercises and use, are left indifferent to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-36cd623f61" data-kw="">
<blockquote><p>It has been lately announced that the Synod of Philadelphia… adopted, and proceeded at once to enforce, a doctrine in reference to ecclesiastical proceedings, which appears to some altogether novel, and truly extraordinary. The doctrine is this,—’That no complaint, appeal, or protest, can be admitted by any judicatory, except in judicial cases.’… It never occurred to us, however, as possible, that it [the new doctrine] should receive countenance from gentlemen of experience and reflection… It is of more practical importance to show that the doctrine here assumed, cannot in our opinion, stand the test of a moment’s examination… In the Presbyterian Church in the United States, it is manifest that appeals, complaints and protests, have ever been allowed in all sorts of cases. Whenever a judicatory has decided any question which came before it by a vote, —whether the question were legislative, declarative, executive or strictly judicial—in any and every such case, both theory and practice allow of appeal, complaint and protest, at the pleasure of the party wishing to offer either. …more than thirty years before that time [1821], when the General Assembly was first organized, the following article appears in the system of Rules adopted for the government of that body: ‘Any member who may think himself aggrieved by a decision of the General Assembly, shall have his dissent or protest, with his reasons, entered on the records of the Assembly, or filed among their papers, if given in before the rising of the Assembly.’ … We have been in the constant habit of attending on the judicatories of the church, in all their grades, for more than forty years; and we never knew or heard of an in- dividual who doubted the right of appeal, complaint, and protest, in all sorts of cases… many a time, and on a great variety of occasions, we have participated in protests, etc. in all sorts of cases, without dreaming that any one ever thought of confining the privilege to cases of process only… The archives of the church are better than cursory assertions. Litera scripta manet. Let us, therefore, appeal to public records, which cannot lead us astray. In the year 1826, the General Assembly… determined, by a vote, to postpone fixing the location [of Western Theological Seminary] for another year. Against this decision the Reverend Joshua L. Wilson, of Cincinnati, entered his solemn protest, accompanied with five reasons, which still remain on permanent record. In the very same General Assembly, (of 1826)… Against this decision to receive Mr. B, forty-two members of the Assembly entered their solemn protest, supported by three reasons… In the General Assembly of 1828… In opposition to this act a solemn protest was presented and read, by a minority of the Assembly… Again, in the General Assembly of 1831… Against this decision a formal protest was entered by sixty-seven of the minority. And it is worthy of notice, that among the subscribers to this protest, the following names are found… the Reverend Robert J. Breckinridge… Alexander Boyd, Ashbel Green… At the same General Assembly, (1831)… Against this expression of opinion, a protest was offered, accepted, and recorded, signed by thirty members of the minority… Let us now attend–Secondly, to the dictates of reason on this subject…</p></blockquote>

</figure><figure class="quote" id="q-0c73e026c1" data-kw="">
<blockquote><p>As touching submission or subjection, we say with Dr. Field that subjection is generally and absolutly required where obedience is not, and even when our consciences suffer us not to obey, yet still we submit and subject ourselves, and neither do nor shall (I trust) show any the least contempt of authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies… (1637), | Pt. 1, ch. 3, ‘That the Ceremonies thus imposed &amp; urged as things necessary, do bereave us of our Christian liberty, first, because our practise is adstricted’</cite>, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“As touching submission or subjection, we say with Dr. Field that subjection is generally and absolutly required where obedience is not, and even when our consciences suffer us not to obey, yet still we submit and subject ourselves, and neither do nor shall (I trust) show any the least contempt of authority.”

— George Gillespie, English-Popish Ceremonies… (1637), | Pt. 1, ch. 3, ‘That the Ceremonies thus imposed &amp; urged as things necessary, do bereave us of our Christian liberty, first, because our practise is adstricted’, p. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+touching+submission+or+subjection%2C+we+say+with+Dr.+Field+that+subjection+is+generally+and+absolutly+required+where+obedience+is+not%2C+and+even+when+our+consciences+suffer+us+not+to+obey%2C+yet+still+we+submit+and+subject+ourselves%2C+and+neither+do+nor+shall+%28I+trust%29+show+any+the+least+contempt+of+authority.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies%E2%80%A6+%281637%29%2C+%7C+Pt.+1%2C+ch.+3%2C+%E2%80%98That+the+Ceremonies+thus+imposed+%26+urged+as+things+necessary%2C+do+bereave+us+of+our+Christian+liberty%2C+first%2C+because+our+practise+is+adstricted%E2%80%99%2C+p.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c73e026c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c73e026c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=As%20touching%20submission%20or%20subjection%2C%20we,any%20the%20least%20contempt%20of%20authority." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b2daf828e1" data-kw="">
<blockquote><p>To open this, consider, That there is a twofold original fountain of Righteousness towards man: 1. There is the immediate command and word of God, and that is called Jus Divinum, Divine Righteousness. 2. There is the Law and Command of Nature, and that is Jus Humanum, An humane Righteousness, or Right: And this is either general, the first and immediate principles of nature, such as the apostle speaks of, Rom. 1, concerning the gentiles, that they had ‘a Law written in their hearts,’ [sic] verse 7 [2:14-15], about just and unjust things, and their consciences accusing or excusing, upon the omission or commission of such things, or else they are more remote and particular dictates, such as the good and wholesome laws of all lawgivers, in respective nations. So what is righteous and just between man and man, is to be determined by the laws of that land where they live: Indeed, if any lawgivers (as some heathenish have) commanded or allowed anything that is against the Law of God, or the universal dictates of right reason; such commands are not worthy the name of laws, they are rather unjust decrees, and so do not bind: But otherwise, the laws of a land determine what is righteous and just between man and man: for although it be God’s command, that a man should not steal, yet they are human laws that give the bounds and proprieties of estates to men: So that we Christians, and the Jews, do something differ about the rules of righteousness and equity; for God was the immediate Lawgiver unto that people: Moses as a messenger from God, received from God’s mouth the Judicial Law, which he delivered to them; so that the Judicial Law appointed by God Himself, was the statute-law of that realm: Their Laws were not human, as all the laws of kingdoms and states are since Christ’s coming, but they were Divine: Their laws about a thief, a murderer, the buyer and the seller, were all Divine laws, because immediately commanded by God, though the matter was merely human. Now its greatly disputed how far these Judicial Laws commanding judgement and justice between man and man, do bind us Christians; and whether all lawgivers and statesmen, are not bound to bring in those Judicial Laws? For who can determine what is righteousness and equity better then God, a righteous and wise God? It’s not pertinent to wade into this excellent question at this time: Though some in this point are very rigid, to make all obligatory, that are not expressly repealed by Christ; and some again are very remiss and lax; yet all conclude that the Moral Equity and Reason that was in every Judicial Law, does bind Christians as well as Jews; and with that we shall conclude this particular, whatsoever law God made about justice, restitution or punishment to the Jews, the equity and reason of that law, does still bind us, though not the particular manner. As for the New Testament, Christ’s Kingdoms was not temporal, or of this world; and therefore He only commands righteousness in the general, and commands that excellent maxim, which an heathen emperor did so much admire, saying, he received it from Christians, ‘What ye would have men do to you, do ye to them, for this is the Law and the Prophets,’ Mt. 7:12… Christ therefore He has only given us general rules of righteousness, and for the particulars, He does command Christians to obey and submit to the wholesome laws of that place where they are; as Rom. 13, ‘Pay tribute to whom tribute, custom to whom custom:’ And this the Scripture does often press, that none might think that the freedom they had by Christ did take them off from human obligations and relations: This was a great temptation, they thought because they were Christians, and made free by Christ, that this also did take them off from obedience to civil magistrates, and from the laws they lived under: No, the Scripture is diligent to teach this, That Christianity and the Gospel does not abolish political and civil government, but rather greatly advances it as an institution of God, pressing obedience thereunto for conscience sake.</p></blockquote>

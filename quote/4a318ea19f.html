<main class="wrap"><figure class="quote" id="q-4a318ea19f" data-kw="">
<blockquote><p>Turn unto me] Renounce all Idols and men’s Devices in my Worship; acknowledge me alone to be your God, and my Word to be your only Rule, with unfeigned Repentance for your former departures from me, and disobedience to my Word; be my people, and observe my Commandments: for, to cry to God for Corn, &amp;c. is not a turning to God, but to the Creature, Hos. 7.14. but it is to seek God for himself, when nothing will satisfy us besides God himself to be our God, Psal. 144.15.

[A]nd when we mourn, not so much for the loss, or want of these things, as for God’s displeasure for our sins that have incensed his wrath, and so seek God’s face, &amp; reconciliation with him in Christ, Psal. 4.6, 7. God doth not require this of them, as if it were in their power to do it, but to convince them that it is their duty, whereunto he would excite them by the Ministry of his Prophet, and would quicken and enable them by the efficacy of his Spirit accompanying the same.

And I will turn unto you] God’s turning to us is not like our turning to God: for, our turning to God supposeth a change in us, but God’s turning to us is without shadow of turning, Jam. 1.17. both in his Nature, Mal. 3.6. and in his Will, Isa. 46.10. but it is to be understood in respect of his Effects; that is to say, I will be reconciled to you, and shew it by suitable effects, as Micah 7.19. He will turn again, he will have compassion upon us.

Saith the Lord of Hosts] This Attribute shews his Absolute dominion over all Creatures in Heaven and Earth, whom he can dispose of by his command, to execute his vengeance upon those that disobey him: in this sense it is added to the Precept. And to be Instruments of dispensing the effects of his favour to those that turn unto him, and obey him; in this sense it is added to the Promise: In both it is suited with their condition, who had experience of the former, and upon their returning to him should find him ready to use his Hosts for their good.</p></blockquote>

</figure><figure class="quote" id="q-4f0ad7c7ae" data-kw="">
<blockquote><p>The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny [though the Reformed affirm] the contrast between a universally offered salvation revealed in the voluntas signi [the will of sign, or revealed will] and a secret elective will in the voluntas beneplaciti. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), voluntas Dei, pp. 332-33</span></figcaption>

<blockquote><p>What God seeth once by his simple and absolute knowledge, he ever seeth, by one external and simple act, which is not capable of change, or forgetfulness; not now seeing, and now not seeing; he never seeth any new thing, but seeth and knoweth all things at once with one and the same sight; for the knowledge of God is the essence of God: according to that ancient and approved saying, Nothing is in God but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regula Vitæ, the rule of the law under the Gospel. Containing a discovery of the pestiferous sect of Libertines, Antinomians, and sons of Belial, lately sprung up both to destroy the law, and disturb the faith of the Gospel: wherein is manifestly proved, that God seeth sin in justified persons</cite>, (London: Robert Dawlman, 1631), p. 92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

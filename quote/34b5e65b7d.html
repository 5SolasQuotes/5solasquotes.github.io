<main class="wrap"><figure class="quote" id="q-34b5e65b7d" data-kw="against invocation of saints">
<blockquote><p>The question is not whether the saints piously dying in the Lord are to be held in any respect and honor. We do not deny that they are to be honored by us according to the degree of their excellence, both by thinking highly of them as servants of God most happy and admitted into the fellowship of the Lord and by cherishing their memory with a grateful and pleasant recollection, extolling their conflicts and victories, preserving their doctrine, celebrating and imitating their virtues (Heb. 12:1), praising God in and for them. Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9 / on invocation</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3bb62268e" data-kw="Mary Queen of Heaven">
<blockquote><p>She was called the Queen of heaven, Queen of queens, said to be exalted above all principalities and powers; to be seated at the right hand of Christ, to share with Him in the universal and absolute power committed to his hands. All the blessings of salvation were sought at her hands, as well as protection from all enemies, and deliverance from all evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3 (Mariolatry)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/worship-of-saints-mary-and-angels-latria-dulia-hyperdulia.html">Worship of saints, Mary and angels (latria, dulia, hyperdulia)</a></span><span class="t"><a href="../topics/prayer/prayers-to-saints-and-for-the-dead.html">Prayers to Saints and for the Dead</a> › <a href="../topics/prayer/prayers-to-saints-and-for-the-dead/mary-and-the-saints-as-intercessors.html">Mary and the saints as intercessors</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-is-not-the-queen-of-heaven.html">Mary is not the queen of heaven</a></span></div>
<div class="actions"><button class="copy" data-copy="“She was called the Queen of heaven, Queen of queens, said to be exalted above all principalities and powers; to be seated at the right hand of Christ, to share with Him in the universal and absolute power committed to his hands. All the blessings of salvation were sought at her hands, as well as protection from all enemies, and deliverance from all evils.”

— Charles Hodge, Systematic Theology, vol. 3 (Mariolatry)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CShe+was+called+the+Queen+of+heaven%2C+Queen+of+queens%2C+said+to+be+exalted+above+all+principalities+and+powers%3B+to+be+seated+at+the+right+hand+of+Christ%2C+to+share+with+Him+in+the+universal+and+absolute+power+committed+to+his+hands.+All+the+blessings+of+salvation+were+sought+at+her+hands%2C+as+well+as+protection+from+all+enemies%2C+and+deliverance+from+all+evils.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+3+%28Mariolatry%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe3bb62268e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e3bb62268e.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology3" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-cfbccf335c" data-kw="">
<blockquote><p>Therefore, we maintain that the blessed Virgin is not to be worshiped, not to be invoked as a mediator or mother of graces; we do not want to place our trust in her, offer sacrifices in her name, celebrate festivals in her honor, erect images of her, or honor her through any such cult!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Virgin Mary</cite>, p. 13</span></figcaption>

</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d2d96bae94" data-kw="">
<blockquote><p>To invite all sound and sober Christians, by what names soever called, to receive each other to communion in the same churches. 2. And where that (which is first desireable) cannot be attained, to bear with each other in their distinct assemblies, and to manage them all in Christian love.</p></blockquote>

</figure><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.”

ity%20of%20Church%2Dsocieties&amp;text=And%20I%20make%20no%20doubt%20but%20some%20opinions&amp;text=and%20seasonable%20use%20to%20the%20tranquillity%20of%20Church%2Dsocieties" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XXV. The question concerning the number of fundamental articles which our adversaries have proposed, besides being rash (since Scripture says nothing definitely about it) is also useless and unnecessary because there is no need of our knowing particularly the number of such articles, if we can prove that they err fundamentally in one or more. And this can be done easily with regard to the papists, Socinians, Anabaptists and similar heretics.</p></blockquote>

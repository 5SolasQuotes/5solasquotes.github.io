<main class="wrap"><figure class="quote" id="q-73dc8346f3" data-kw="">
<blockquote><p>The last thing that I shall trouble you with at present, is the consideration of the persons against whom the present Excommunications are blustered, with the pretended causes of them. These are they whom they call Dissenters, concerning whom we may enquire what they are, and the cause of this pretended Ecclesiastical severity towards them. And as unto the first part of the enquiry, They are such as believe and make open profession of all the Articles of the Christian Faith; they do so, as they are declared in the Scripture; nor is the contrary charged on them.

There is nothing determined by the ancient Councils to belong unto Christian Faith, which they disbelieve; nor do they own any Doctrine condemned by them: They profess an equal interest of Consent in the Harmony of Protestant Confessions, with any other Protestants whatever. They own the Doctrine of the Church of England as established by Law, in nothing receding from it; nor have they any novel, or Uncatholic Opinion of their own. It is therefore utterly impossible to separate them from the Communion of the Catholic Church in Faith; or to cast them from that Rock whereon they are built thereby.

They do also attend unto Divine Worship in their own assemblies; and herein they do practise all that is agreed on by all Christians in the world, and nothing else; for they do not only make the Scripture the sole Rule of their Worship, so as to omit nothing prescribed therein to that purpose, nor to observe any thing prohibited thereby; but their Worship is the very same with that of the Catholic Church in all ages nothing do they omit that was ever used by it, nothing do they observe that was ever condemned by it; and this must be the principle and measure of Catholic Union in Worship, if ever there be any such thing in the Earth; to expect it in any other observances, is vain and foolish.

Offering Prayers and Praises to God in the Name of Jesus Christ, reading the Holy Scripture, and expounding of it; singing of Psalms to God, preaching of the Word, with the administration of the Sacraments of Baptism and the Lords Supper; in a Religious Observation of the Lord’s Day, unto these ends; all according as God doth enable them by his Spirit, is the Sum and Substance of the Worship of the Catholic Church, wherein all Christians are agreed:

These things the Scripture doth prescribe, and these things the Church in all ages hath observed: All differences about this Worship which have filled the World with inhumane contentions, arose from men’s Arbitrary Addition of Forms, Rites, Modes, Ceremonies, Languages, Cringings, Adorations, which they would have observed in it, whereof the Scripture is silent, and Primitive Antiquity utterly ignorant—And it may be it will be one day understood, that the due observance of this Catholic Worship, according as God enableth any thereunto, leaving others at liberty to use such helps unto their Devotion, as they shall think meet; is the only Communion of Worship in the Church, which the Scripture requires, or which is possible to be attained:

About the imposition of other things, there ever were, since they were, and ever will be, endless contentions. Wherefore these Dissenters practising nothing in the Worship of God, but what is approved by all Christians, particularly by the Church of England, omitting nothing that either the Scripture or Catholic tradition directs unto, they are, notwithstanding this pretended Excommunication, secure of Communion with the Catholic Church in Evangelical Worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A letter concerning the matter of the present excommunications</cite>, (London: Benjamin Alsop, 1683), pp 21-24.</span></figcaption>

<blockquote><p>Now, the ceremonies are the bane of our churches’ peace and the unhappy instruments of lamentable discord among bretheren who should dwell together in unity. I know that the refusers of the ceremonies are blamed as if they were the troublers of the peace of the Church and the tumultuating contentious spirits who make so much ado about matters of rite and ceremony. But I know also that none have been more ordinarily and commonly blamed for troubling the peace of the Church than they who least deserved to be blamed for it. So was Elijah himself thought to be he that troubled Israel when he contended against the corruptions of the Church in his time.</p></blockquote>

<blockquote><p>…the decision of a Convention of Estates, or Parliament, in June to levy a ‘cess’, or tax, for the express purpose of raising additional troops to suppress the field-meetings. To Hamilton in particular, opposition to this tax became a test of orthodoxy, on a par with opposition to the indulgence. There is considerable evidence that in the summer and autumn of 1678 both he and Kersland sought to influence the younger field-preachers to adopt an increasingly militant tone in their preaching, and to condemn both those who payed the ‘cess’ and the ministers who had accepted the Indulgence. It is also clear that during this period both Hamilton and Kersland became increasingly associated with Richard Cameron… Throughout the 1670’s it had been customary for the leading field-preachers, such as John Welsh, to be accompanied by armed bodyguards as they moved around the country. This was seen as a necessary precaution for their own safety… Having attached himself to Cameron, Hamilton concluded that Cameron too should enjoy the same protection. He therefore gathered a body of men… whom he engaged to accompany Cameron around the country… Hamilton himself assumed the command of this group. A show of military order was observed, though neither Hamilton himself, nor, it apprears, any of those whom he led, had any military experience. However, it satisfied Hamilton’s fondness for demonstration and for display, and it was, of course, fully consistent with the militant approach which he advocated.</p></blockquote>

<blockquote><p>Unhappily, however, a spirit of disunion began to appear among their leaders, who, instead of combining against the common enemy, spent their time in hot disputes about points in which the most hearty and genuine friends of the Presbyterian cause [outside the establishment] differed from each other. These disputes referred to the indulgence; and it may appear strange that there should have been any controversy about a subject with regard to the sinfulness of which all of them were agreed. The question agitated was not whether the indulgence was lawful, but whether the acceptance of it should be expressly condemned in the proclamation to be made by those who were in arms, and numbered among their causes of fasting. This was opposed by some as inexpedient, because it would hinder many from joining them who were cordial friends to Presbytery; and it was proposed that this point should be reserved for the determination of a free General Assembly.¹ At the head of this party was Mr. John Welsh, whose expulsion from Irongray was formerly noticed, and who was not only in his own judgment opposed to the indulgence, but had been intercommuned for preaching in the fields for many years. Among all the eighteen ministers present, there was not one who had accepted the indulgence, or who approved of it. ¹ M’Crie’s Miscellaneous Writings, Review of Tales, &amp;c, p. 437. Sixteen of these ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron,² and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ² Richard Cameron was not present at Bothwell, being at that time in Holland, but he returned to Scotland shortly after. He declared to the ministers who licensed him, “that he would be a bone of contention among them; for if ever he preached against a national sin in Scotland, it should be against the indulgence, and for separation from the indulged.” [P. Walker’s Biograph. Presbyter, i. 292) ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians. On the present occasion they insisted that there should be inserted in the statement of their quarrel a decided condemnation of those who had taken the benefit of the indulgence; and proceeding on a mistaken view of the principles advocated by the Church of Scotland in the time of the Engagement, and by the Protesters in their contendings against the public resolutions [in the late-1640’s and early-1650’s], they refused to admit any into their ranks but those who would condemn and testify against the indulgence.† † M’Crie’s Memoirs of Veitch, &amp;c., p. 453… The violence, pertinacity, and extravagance of this party, prevailed over the more sober counsels of their brethren; and the consequence was, that several of the latter left the army in disgust. Still, however, the great body of the people remained, and though placed in the most unfavourable circumstances for meeting the enemy, they drew up with determined front at Bothwell Bridge, where they awaited their approach. The Covenanters behaved with the utmost gallantry, but, overpowered by superior numbers, they soon gave way, and the royal army obtained an easy victory over troops divided and disheartened by the conduct of their leaders.</p></blockquote>

<blockquote><p>Alas! the clouds are not now a gathering! but our horizon is covered over with blackness, and great drops are a falling, that presage a terrible overflowing deluge of error, and Apostasy from the Truth and Profession of the Gospel of Jesus Christ, to be at hand, if the Lord wonderfully prevent it not. And behold (O wonderful!) the generality of Professors are sleeping in security, apprehending no danger. Satan is more cunning now, than to drive men to Popery by rage and cruelty; (and yet what he may be permitted to do after this manner, who can tell?) or by openly pleading, in his emissaries, for this abomination, (and yet even thus is he already prevailing with not a few) or to send forth his agents for Arminianism and Socinianism (though even this way too, he is too much prevailing.)

But his main work now seemeth to be, to bring in another Gospel, (and yet there is not another) or rather an Antievangelic and Antichristian delusory dream, overturning at, once the whole Gospel of our Lord and Saviour Jesus Christ; and for this end he employeth the Quakers, one the one hand, Men of desperate and antievangelic principles, the very sink of all abominations, old and late (as I shall show, if the Lord will continue health and strength, in an examination of their doctrine and principles, lately emitted by one Robert Barclay) and on the other hand, Men (or Moralists if you will call them so) pleading for and crying up an antievangelic holiness, a mere shadow without substance or reality; and that in place of Christ himself[.]

And in order to the carrying on of this desperate design, The old dragon is employing men of seeming different principles and ways, whom, though their faces seem to look to contrary airths, yet he holdeth notwithstanding fast tied by their tails (as Samson’s foxes were) that thereby, if the Lord permit it, he may, by the fire of enmity to the pure Gospel of the grace of God, burning in their tails, cause a conflagration of that Truth, wherein lieth all our hope: for this new model of Religion, that many are so busied about, is such as Pelagians, Arminians, Papists, Socinians, Quakers, yea Turks [Muslims], and moral Heathens; Yea and all, who are enemies to, and not reconcilable with the true grace of God held forth in the Gospel, will willingly admit of, and harmoniously agree in: A way, which complieth so well with proud self, and with the Corrupt Nature of Man, that it is little wonder, if it have many abettors and admirers.</p></blockquote>

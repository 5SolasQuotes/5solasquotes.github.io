<blockquote><p>[1.] In order to engage us to this charity, which would issue in an unity of measures, let us consider what melancholy consequences may ensue upon our divisions, if they be not happily removed. ‘Tis notour, they have been fatal to all societies, have tumbled down flourishing monarchies, and laid magnificent cities into ashes; they have rent Churches into pieces, and knocked religion on the head. 2. The enemies of our Zion, whose projects have been baffled of Heaven, and their counsels infatuated of God, will have this piece of satisfaction left them, to rejoice when they see us disagree among ourselves, and be pleased with the agreeable thoughts that we are about to accomplish ourselves what they designed for us.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-65e3335b8a" data-kw="">
<blockquote><p>Purity of life has reference to the love of God and one’s neighbor; soundness of doctrine to the knowledge of God and one’s neighbor. Every man, moreover, has hope in his own conscience, so far as he perceives that he has attained to the love and knowledge of God and his neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>NPNF1 | On Christian Doctrine, bk. 3, ch. 10, pp. 560-61</cite>, vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d757378e08" data-kw="">
<blockquote><p>The Shorter Catechism agreed upon by the Assembly of divines at Westminster, and presented to the honorable Houses of Parliament then sitting, and by them ordered to be printed and published, but no man enjoined to use it, or punishable if he made use of any other to instruct his people in. This little book for the comprehensiveness of it, as also exactness of order and expression, has (as it deserves) a great esteem with many learned men, notwithstanding to be the one and only book for all capacities that are to be instructed in principles throughout the nation, is a perfection not to be expected from any common gift, nor is this for such purpose the fittest in its kind, as we shall endeavor to show in this dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662.</cite>, pp. 10-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

;text=we%20shall%20endeavor%20to%20show%20in%20this%20dispute" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-25881b937a" data-kw="">
<blockquote><p>But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true; but that all the letters of bishops which have been written, or are being written, since the closing of the canon, are liable to be refuted if there be anything contained in them which strays from the truth, either by the discourse of some one who happens to be wiser in the matter than themselves, or by the weightier authority and more learned experience of other bishops, by the authority of Councils</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Baptism, Against the Donatists</cite>, bk. 2, ch. 3, §4</span></figcaption>

</figure><figure class="quote" id="q-7150fa0a38" data-kw="">
<blockquote><p>Thirdly, the doctrine it self (short, but exceeding effectual) of the Lord Jesus and his office, as we shall hear hereafter. Fourthly, after the doctrine, he comes to the exhortation, exhorting the Colossians to constancy and perseverance in the faith and doctrine of Jesus Christ. … for the office of every Evangelist was to water where the apostles before had planted, and to build where they had laid the foundation of the true doctrine of Jesus Christ the Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the Epistle of Paul to the Colossians… (d. 1599; London, 1603), 1st Lecture, on Col.</cite>, 1:1-6</span></figcaption>

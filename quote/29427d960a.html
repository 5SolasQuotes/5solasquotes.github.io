<main class="wrap"><figure class="quote" id="q-29427d960a" data-kw="">
<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40</cite>, … (London, 1661), pp. 8-9</span></figcaption>

<blockquote><p>The gross impiety of which they had been accused was now well refuted; and yet they seem not to have been in every respect free from blame, because the Law forbids the erection of any kind of statues. It is easy, however, to excuse this by saying, that no kind of statues are condemned except those which are intended to represent God. To erect a heap of stones as a trophy, or in testimony of a miracle, or a memorial of some signal favor of God, the Law has nowhere prohibited. (Exodus 20:4; Leviticus 26:1; Deuteronomy 5:8) Otherwise, Joshua and many holy judges and kings after him, would have defiled themselves by profane innovation. But the only thing displeasing to God was to see the minds of men drawn hither and thither, so as to worship him in a gross and earthly manner. The children of Reuben, Gad, and Manasseh do all that is required for their exculpation, when they declare that they would use the altar only as a bond of brotherly union; and add a sufficient reason…</p></blockquote>

</figure><figure class="quote" id="q-acb1ada085" data-kw="">
<blockquote><p>In 1662, the same spirit and sentiment afresh appeared; when most of the considerable ejected London ministers met, and agreed to hold occasional communion with the now re-established Church—not quitting their own ministry, or declining the exercise of it as they could have opportunity. And as far as I could by inquiry learn, I can little doubt this to have been the judgment of their fellow sufferers through the nation, in great part, ever since… any one of common sense can see through it; such as that: ‘How can a man dissent and conform at the same time?’ when all the world knows, or may, conformity consists of numerous parts; and is it such a miracle for a man to conform in some part and not in every part? Conscientiously to scruple constant entire conformity, and not scruple some part of it, at some time?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (Religious Tract Society, 1863), pp. 261-90, p. 289</span></figcaption>

<blockquote><p>§11. Of the Cross in Baptism Some nonconformists say that they deny not the civil use of the cross in coins and banners. Others of them say they dare not reprove the ancient Christians that used the sign of the cross merely as a professing, signal action to show to the heathen that they did believe in Christ crucified. Indeed that usage thereof was not an act of worship, but an informing of men touching their faith. It seems lawful to signify, as by words so by other signs, that we are Christ’s and his devoted servants, for words are but a kind of signs. The grounds of scrupling the sign of the cross in baptism are these:

1. That it is not a mere circumstance, but an ordinance of worship, as important as an external rite can be.

2. That being a solemn and stated, symbolic sign of a divine mystery and devised of men, it is of that classis or rank of things which are not necessary in genere, and so not allowed to be determined and imposed by men as things necessary in genere are allowed.

3. That either the whole nature of a sacrament, or at least a part thereof, is in it. That it is a sacrament is thus proved: It is an outward and visible sign of inward and spiritual grace. The outward sign is the representation of the cross, the instrument of Christ’s sufferings, and the inward spiritual grace is fortitude in the Christian warfare, according to the words of the Liturgy. Here is a signification of grace to be given us of God and of our duty according to that grace. Likewise this sign has assigned unto it the moral efficacy of a sacrament for working grace, by teaching and exciting us to the spiritual warfare and minding us of Christ crucified. Also it signifies and seals our relation to Christ, or the grace of being a Christian. And the Liturgy so speaks, “We receive this child into the Congregation of Christ’s Flock, and sign him, etc. in token, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 11 in Remains (London: Parkhurst, 1684), pp. 220-21</span></figcaption>

<blockquote><p>It is false also that all the Churches abroad have human ceremonies so twisted with their solemn worship that presbyterians cannot join with them. We have often (and do when occasion serves) very cordially and to our edification joined with them, and yet partake in none of these: nor is [there] so much of these [human ceremonies] among them as he would make us believe.</p></blockquote>

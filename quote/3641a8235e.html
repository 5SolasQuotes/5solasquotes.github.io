<main class="wrap"><figure class="quote" id="q-3641a8235e" data-kw="">
<blockquote><p>In this extract from The two sons of oil, Samuel B. Wylie explains how the civil government is to extend care and protection to the church. His application of Matthew 25:42, 45 to the state is a significant blow against Libertarian Theology, and suggests that the concept of the state not intervening in relief for the afflicted is an ungodly idea (but this is an aside):

The civil magistrate ought to defend and protect the Church of Christ. Isa. 49:23: “Kings shall be thy nursing fathers, and their queens thy nursing mothers,” &amp;c. Does not this imply protection? The metaphors selected by the Spirit of God, involve the highest possible care and tenderness. I know it has been objected by some, that the tender care and concern here intended is not official, but merely personal, as an individual member of the church. The reason assigned is, that the epithet involving concern is not confined to kings, but is common to all their queens: and this must be acknowledged to be unofficial. Sure none are exempted from being concerned about the interests of religion. The irrelevancy of the objection will appear, by attending to an observation formerly made, viz. that the commands of God are obligatory upon every one, in his respective station and department of life. Queens are bound to exercise all the influence, which in the providence of God is conferred upon them, in promoting the religion of Jesus. Kings, or civil magistrates, in like manner, are indispensably bound to exercise all the power which they possess in their stations, to promote the same desirable end. Whatever quantity of this power is kept back, is so much unliquidated debt due to the Messiah, by the express command of that God whom magistrates represent. Ps. 2:12: “Kiss ye the Son lest he be angry.” When Christ’s mystical body needs this power, and the magistrate withholds the benefit of it, does he not run the risk of being charged by Jesus at the last day, as we read, Matt. 25:42, 45 “I was an hungered, and ye gave me no meat; I was thirsty, and ye gave me no drink, &amp;c. Inasmuch as ye did it not unto one of the least of these my brethren, ye did it not to me.”

This same idea of protection, tenderness, and care, as a blessing to be expected in New Testament times, is held out, Isa. 60:10,16: “Kings shall minister unto thee,” and “thou shalt suck the breasts of kings.” All these passages evidently intimate, that the civil power shall be exercised in administering officially to the church, every comfort which may be expected to result from the union of magistratical authority and paternal care; such as defending her from her enemies, and securing to her all her privileges.

Moreover, when in 1 Tim. 2:2, we are commanded to pray for magistrates, the end proposed is, that the church and people of God, under the wing of their protection, “may lead quiet and peaceable lives in all godliness and honesty.” Either indifference, therefore, on the part of the state, toward the church, or an equal protection to her enemies, is notoriously incompatible with the ideas obviously contained in these sacred passages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 19-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>2. By refusing to hold office, one qualification of which is an acknowledgment of the constitution directly, or implied. To hold civil office is not wrong, and cannot be inconsistent with the Christian character; for civil government is the ordinance of God. The Christian character is not too holy to be engaged in civil transactions, nor are they too profane for his character. But civil office may be suspended on terms direct or implied, that are inconsistent with his character, and obligations as a Christian, and as a witness for the testimony of Jesus. The objection to civil office, then, is not on any abstract ground relating to civil government, but is determined by the character of the particular government objected to. The ordinance itself is entitled to every respect on the part of the Christian, because it is a divine institution, but immoral principles or radical defects in the constitution invalidate the claim of a particular government. Such are not an exemplification of the moral ordinance of God, and therefore have no claim upon that acknowledgment which is due to his institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 321.</span></figcaption>

<blockquote><p>But what then is the part of the Prince after that the Church has given judgement? Surely, whensoever need is, he ought by the private judgement of Christian discretion to try and examine whether this [ecclesiastical] discipline be rightly executed or not. If he find the execution thereof to be unreproveable and that yet the sinner goes on in his contumacy, then by his civil power he ought further to punish him in his person, or wordly estate, that he may either reform or repress such a one as has not been terrified by the Church’s censures (Calvin, Book of Epistles, col. 169; Gratian., Caus. 11, q. 1, ch. 20). But if after trial, he understand that the sentence given forth is unjust and erroneous, either through the ignorance or the malice of the ecclesiastical and regular judges, then he ought to interpone his authority, and cause a due proceeding [in ecclesiastical courts], for in such extraordinary cases of the failing of ecclesiastical persons, Princes may do much in things and causes Spiritual which ordinarily they cannot.</p></blockquote>

<blockquote><p>They have their ministerial calling, or which is all one, authority to exercise the acts of their ministerial office, from Jesus Christ, as the fountain of their spiritual power… But they have the peaceable, public exercise of their ministry in these places by the magistrate, under God. It’s the magistrate’s civil authority by which the penal statutes which rendered their preaching hazardous are removed or relaxed; by the protection of civil authority they have the peaceable exercise of their ministry, or they have freedom from molestation or disturbance while they are exercising their ministry in these places. Before the act of indulgence they had their ministerial authority and did preach upon hazard before they were indulged; but by the indulgence they had this benefit, that whereas before it they were exposed to hazard wherever they preached, whether in private or public; after it, they might preach publicly and exercise the other parts of the ministerial office, in some places, without molestation.</p></blockquote>

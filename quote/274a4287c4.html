<main class="wrap"><figure class="quote" id="q-274a4287c4" data-kw="">
<blockquote><p>To be easily seduced and led away into error argues weakness in grace. The Apostle Paul calls those children who are “tossed to and fro and carried about with every wind of doctrine” (Ephesians 4:14). Weakness of head argues that grace is not very strong in your heart.

The way not to fall from our steadfastness is to grow in grace, for the Apostle Peter joins these two duties together. Having given caution in 2 Peter 3:17 “not to fall from steadfastness,” in verse 18 he gives counsel “to grow in grace.” Strong Christians are steadfast, whereas weak ones are inconstant; and therefore, as for those professors who have been whirled about with divers opinions, it is an evidence they have but weak grace, if any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: The Truth, Growth, and Different Degrees</cite>, ed. Don Kistler (1652; Morgan PA: Soli Deo Gloria, 1997), p. 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-beb1f4e886" data-kw="">
<blockquote><p>If someone could believe with a certain and constant faith, and could understand the magnitude of it all, that he is the son and heir of God, he could regard all the power and wealth of all the kingdoms of the world as filth and refuse in comparison with his heavenly inheritance. Whatever the world has that is sublime and glorious would make him sick. And the greater the pomp and glory of the world is, the more detestable it would be to him. In other words, whatever the world admires and exalts most, that is foul and worthless in his eyes. For what is the whole world with its power, wealth, and glory in comparison with God, whose heir and son he is? He also desires anxiously to depart with Paul and to be with Christ (Phil. 1:23). Nothing more delightful could happen to him than a premature death, which he would embrace as the most joyous peace; for he would know that it is the end of all his evils and that through it he comes into his inheritance. In fact, a man who believed this completely would not go on living very long but would soon be consumed by his overwhelming joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 392–93.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

ared-to-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-3a095e93a3" data-kw="">
<blockquote><p>We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 233.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

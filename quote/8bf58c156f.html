<main class="wrap"><figure class="quote" id="q-8bf58c156f" data-kw="">
<blockquote><p>But though all this were true of some ministers, does this justify your separation from all? How many worthy ministers are there in the congregations where you dwell, who are grave and edifying, and preach and practice godliness in the power of it, and yet you withdraw from them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80dd9a5324" data-kw="">
<blockquote><p>We therefore disallow all such things as are repugnant to this foresaid doctrine, confirmed by the scriptures, and chiefly these special points: .. 3. That the church does so consist of the elect and of true saints that in it should be contained no hypocrites, and that in the Scriptures they should never be comprehended under the Church’s name. …

7. So to bind the church to certain places and persons, as to say there only with them is the church.

8. Not to acknowledge those for Christ’s churches, which, although they hold the grounds of faith, yet in ceremonies or in some part of doctrine do not altogether jump with us.

9. To make a separation from the churches upon any error or for the ill life of some men. 10. …and contrariwise, that those are not true churches which, although they keep fast the true doctrine, right sacraments and pure discipline, yet cannot show a continuance and succession of bishops never broken.</p></blockquote>

</figure><figure class="quote" id="q-94ed4154c0" data-kw="">
<blockquote><p>The pretext of Christian fellowship is abused, to the hatching and propagating of the most absurd opinions, when people turn light and frothy, taking up their time with vain janglings, and diverting from the main scope, to wit, edification: These things are indeed to be shunned; but Christian fellowship is not to be disclaimed, but wisely to be ordered in respect of the persons with whom, and occasions upon which it is used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-58630b2678" data-kw="">
<blockquote><p>Upon the Sabbath, [the 15th] when we were convened in the muir to hear sermon, they called a council of war and called the whole ministers, and told them, if they did not preach, name and sir-name, against the indulgence, they should preach none. They [the ministers] thought it very hard to be kept within guard, and to be commanded what to preach. They told them, they were to receive their commission from Jesus Christ what to preach, and not from them. When we heard of it, we came [to the council meeting] — for they never called us if we came not of ourselves. We told them that it was the height of supremacy to give instructions to ministers what to preach; we would hear no such doctrine. With this confusion this day was well spent, and when they saw us own them (the ministers) and that they could not prevail, they slipped their way; and so they went and preached, and every man went to hear him whom they liked best. At this debate there was one minister left us, and never returned again [to the camp], but was a-coming upon the Monday when we were broken; for he declared to me, when he was let out without the guard, that he thought they were set to take their lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., p. 466</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>THE two only things that should induce any one to give his Testimony and Recommendation unto Discourses that are published for public use, are the importance of the Argument treated on, and the useful judicious handling of it, in those Discourses. Whatever else may be, or usually is spoken unto, on such occasions, is a diversion from what ought to be intended, and what is expected by all them who give such Prefaces the perusal. But both these in the ensuing Discourses seem to be such, and so stated, as to render any Recommendation of mine in this way needless and superfluous.

For the Argument treated of, being the Covenants of God with Christ the Mediator, and with the Church in him, there are none who have any acquaintance with Christian Religion, or care of their own Souls, but must, and will acknowledge it to be of the greatest weight in it self, and highest concernment unto them. For the Doctrine hereof, or the truth herein, is the very Center wherein all the lines concerning the Grace of God and our own duty, do meet; wherein the whole of Religion doth consist. Hence unto the understanding, Notions, and Conceptions, that men have of these Covenants of God, and according as the Doctrine of them is stated in their minds, their Conceptions of all other sacred Truths, or Doctrines, are conformed.

And therefore as they who have right apprehensions, and a true understanding of these things, cannot in the use of diligence, and the means appointed thereunto, lightly mistake the Truth in any other point of weight in the whole compass of Religion; so those who unhappily fall under misapprehension about them, do generally either fluctuate in their own minds about all other Evangelical Truths, or do corrupt and pervert the whole Doctrine concerning them. And hereon also depends the regulation of all our entire Christian practise or Obedience, as all will acknowledge who have any knowledge of these things. It seems therefore altogether needless, that there should be any new Recommendation of the subject-matter of the ensuing Discourses, unto those who seriously mind their own Spiritual and Eternal concerns; and as unto others, it is to no purpose to declare the worth and nature of such Pearls unto them.

As for the manner of the Declaration or handling of these sacred Truths in the ensuing Discourses, the known Abilities, Piety, Learning, and Judgment of this Author, with that leisure he had to add his last thoughts and considerations unto them, are sufficient to give the Sober Reader an expectation of as much satisfaction as he is like to meet withal in endeavours of this nature. I cannot therefore but judge that there is little need of this Attestation which I am desired to give unto this excellent and useful Treatise. Howbeit, that I may not seem wholly to condemn my self in what I do, I must acknowledge that there were some reasons which induced me to comply with the desire of the worthy Publisher of it.

My long Christian acquaintance, and friendship with the Author, made me not unwilling to testify my Respects unto him and his Labours in the Church of God, now he is at Rest, for whom I had so great an esteem whilst he was alive. And whereas the whole Design and end of my self, as unto others, is to promote the knowledge of the truths of the Gospel of our Lord Jesus Christ, and the practise of them; I knew not but that with some at least, this occasional word might one way or other conduce unto that end. I shall therefore briefly and plainly give an account of my thoughts concerning this Discourse, which I have with some diligence and great satisfaction perused.

Very many learned and godly persons have laboured in the same subject unto the edification of the Church: I intend them only who agreeing in the truth as to the substance of it, may yet differ in some conceptions about it, or the way of Explanation of it. For it is not unuseful that the same truth, especially that which is of so great importance as is what concerneth the Covenant, be variously handled by many, according unto the measure of the gift of Christ which they have received; so whereas we know all but in part, if we have, as we ought to have, a continual sense of the imperfection of our knowledge, none ought to be offended if they meet with some difference in Conceptions and Expositions about things of lesser moment, among those who agree in the substance of what they do propose:

Perfect Harmony, and Universal Agreement in all things, is the privilege only of the sacred Writers who were Divinely inspired. But from the first day that the management of Religion was in the Providence of God entrusted with them who had not an infallible Guidance, there is an apparent evidence of such differences as those we speak of, amongst them all; even the best and wisest of them. We may therefore allow them all their just Commendation who have laboured diligently in the investigation of the Truth, although some of them have not escaped various mistakes about it. Nor is it spoken with any reflection on the endeavours of others who have written on this subject, when I do freely declare my judgment, That for Order, Method, Perspicuity in treating, and solidity of Argument, the ensuing Discourse exceedeth whatsoever single Treatise I have seen written with the same design; as it also is entirely compliant with the Doctrine of the Gospel, in what is assented in it.

Three things may be expected in discourses of this nature, or however the subject requires that they may be attended unto.

Each of these the Reverend and Learned Author of the ensuing Discourse had an especial regard unto; and how he hath discharged himself in them all, will quickly appear unto every judicious and attentive Reader. I am sure I shall not offend in wishing that others may find the same satisfaction in their perusal, as I have done. Wish, I heartily do also, that as many of those as can with convenience, who desire a good and safe Guide in these important truths, in the declaration whereof so many have run into extremes, even unto the hazard of the Souls of Men, and would have their hearts excited unto their practise, would furnish themselves with what is here tendered unto them. For I find that in what is Doctrinal in the whole Discourse, wherein a great and excellent part of the Mystery of the Gospel is unfolded, the Reverend Author hath fully weighed, not only what can be said in the confirmation of what he asserts, but also what can be said against it, or be set up in competition with it, carrying on the Truth with successful Evidence, and clear Demonstration.

And as unto what is Practical, as he had the experience of it in his own Soul, so there is nothing wanting that might give the severals insisted on, a due impression on the Minds and Affections of others. Soundness in Doctrine, Gravity in Speech, Conviction in Argument, Power in Exhortation, Clearness and Perspicuity in Order, with a nervous intertexture of Scripture-Testimonies and Reason, throughout the whole, all evidencing their spring in this work to have been, Zeal for the Glory of God, Love of the Truth, and Compassion towards the Souls of Men, do in my judgment animate and fill up these discourses from the Beginning unto the End. That they may be blessed unto the benefit and advantage of them who desire to be edified in the truth that is after Godliness, is, The earnest Prayer of, READER, Thy Servant in the Work of the Gospel, JOHN OWEN.</p></blockquote>

<blockquote><p>Early the next morning [after Renwick’s ordination]… a letter was delivered to him… from William Brakel… Brakel conveyed the startling news that Scottish ministers at Rotterdam–specifically George Barclay, Robert Langlands and Thomas Hog the younger–were preparing to bring accusations against Hamilton, Renwick, and the other students, charging them with very serious offences.</p></blockquote>

</figure><figure class="quote" id="q-0b1f617f85" data-kw="">
<blockquote><p>Up to this time [1573], the prevailing practice was that only ministers signed the Belgic Confession. In 1574, however, the provincial Synod of Dordrecht decided that ‘it would be useful that the elders and deacons also subscribe to the Netherlands Confession, and to the articles of the [Emden] Synod.’ For this purpose, it was considered advisable that a copy of the confession and of the articles of the Emden Synod be kept by all consistories [sessions] or at least by all classes [presbyteries]. For the first time, schoolteachers were also required to sign the confession and to submit to the ‘discipline’ or articles of the Emden Synod. The idea of elders’ and deacons’ subscribing was not immediately accepted in all the churches. For example, at Delft the elders and deacons refused to sign the confession, while at Middelburg they did. Gaspar van der Heyden, pastor at Middelburg and president of the recent Dordrecht Synod, on 16 November 1574 wrote to Delft pastor Arent Cornelisz: ‘Our elders and deacons have signed the Confession of Faith and the articles of the [Emden] synod; I certainly wish that yours had done the same. How would they who now refuse to sign the Confession with ink seal it with their own blood?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription</cite></span></figcaption>

the%20prevailing%20practice&amp;text=with%20ink%20seal%20it%20with%20their%20own%20blood" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-07e9f8db5b" data-kw="">
<blockquote><p>The Mormon degradation and defamation of the notion of God marks it as no development of Christianity, but a most foul and blasphemous apostasy. … Christianity teaches that man was created by God. It teaches the doctrine of ex nihilo creation. Mormonism teaches the eternity of matter, and regards the souls of men as a part of that eternal matter. Christianity teaches that mankind fell in Adam, our ancestral head, from an estate of holiness. Mormonism teaches that souls in an imperfect state were embodied as a necessary stage in their progress toward perfection. Christianity teaches the moral helplessness of man and the need of divine grace in order to salvation. Mormonism teaches that man can do everything necessary to salvation once the eldest son of the Michael, who became Adam, has died in the race’s behalf. Mormonism looks forward to a heaven of sensuality much like that of Mohammed. Christianity looks forward to a heaven in which fleshly appetites have no scope. Mormonism is no development of Christianity. It is another gospel than that which Paul preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cary-johnson.html">Thomas Cary Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mormonism in Presbyterian Quarterly</cite></span></figcaption>

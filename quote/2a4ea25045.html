<blockquote><p>The General Assembly, soon after the Disruption, thought it necessary to embody the great principle for the sake of which the Church had resigned the emoluments of the State, in an additional question to be proposed to all office-bearers at the time of their ordination. The question is in these terms:—“Do you believe that the Lord Jesus Christ, as King and Head of the Church, has therein appointed a government in the hands of Church-officers, distinct from, and not subordinate in its own province to, civil government, and that the civil magistrate does not possess jurisdiction or authoritative control over the regulation of the affairs of Christ’s Church! and do you approve,” &amp;c.

Let the opening statement be observed carefully, “that the Lord Jesus Christ, as King and Head of the Church, has therein appointed a government in the hands of Church-officers, distinct from, and not subordinate in its own province to, civil government.” It is but a slight enlargement of the following words of the Confession of Faith:—“The Lord Jesus Christ, as King and Head of his Church, hath therein appointed a government in the hand of Church officers, distinct from the civil magistrate.”

First, that Christ is the only King and Head of the Church: second, that as such he has appointed a government of the Church in the hands of officers of her own, of ecclesiastical office-bearers; and, third, that this government in their hands, derived from Him, is wholly distinct from the State, or civil power, is subordinate to Him alone,—is not subordinate within its own province to the civil magistrate.</p></blockquote>

<blockquote><p>Thus of the producing of the body of Christ: His soul was produced as the souls of other men are, that is, it was immediately created by the Holy Ghost and infused into his body: only there is difference amongst divines about the time of the infusing of the soul of Christ: for in the ordinary course, nature proceeds in this manner: First, there is the mass of blood or seed received in the womb, but there is no parts of a body framed at the first: after a certain number of weeks, nature forms that substance into the parts of the body distinctly, but yet it is without life: then is the soul infused, when the body is organical, and so it is quickened and a true man; it is not before a man, but embryo as they call it: Now the question is how Christ could receive that imperfect embryo or the flesh at the first conception, seeing it was not a perfect human nature? To this some answer that our Savior did not follow the ordinary course of taking flesh, as other men do, but in the very instant of the conception, his body was made organical, and had perfect members, and the soul infused at that instant also: and their reason is this: Because the Son of God did not become a person to any thing but the manhood of Christ: Now the manhood must needs have a reasonable soul and body formed, and organical: else we must say that something did subsist in the Person of his divine nature that was not man, as embryo or the lump unformed, and not animated was. Besides, when God made a man by the power of the Holy Ghost, without the seed of man, He made him perfect at one instant, and every way formed in all parts: as when He made Adam and Eve, they were in an instant made perfect in soul and body. Other divines conceive that this opinion cannot be true, because Christ was made in all things like unto us, sin only excepted. Now there could be no sin in that ordinary course of nature, if original sin be removed as it was in Christ. Now in the course of nature: first, that which is material is formed, as it were the house of the soul, and then the soul is infused, not only as the guest of it, but as the form and life of it: and so it must be in Christ. Now for the first reason they answer that the hypostatical union in the person of Christ was so made above nature, as withal, Christ assumed that which belonged to the nature of man according to the course of nature: and so first the seed, and then the body formed, and the soul infused according to nature into that body so as that flesh before the coming in of the soul did subsist in the Word, as it did after the soul was infused: for the Word took our nature, which is not hindered by the absence or presence of the soul: as when Christ was dead, his soul was in his Father’s hands, and his flesh was shut up in the grave, and was not quickened then by the soul, yet the flesh of Christ without the soul and life did subsist in the Word, as well as it did before or after: The other reason is of no force, for God did not make our first parents so out of necessity, but out of the good pleasure of his will, not binding himself to that frame of working for all times afterwards.</p></blockquote>

<blockquote><p>Now for the good election of magistrates, the Lord himself declareth whom and what kind of men he will have to be chosen, in these very words: “Look over all the people, consider them diligently, and choose from among them men of courage, such as fear God, speakers of truth, and haters of covetousness, and make them rulers over thousands, rulers of hundreds, rulers of fifties, and rulers of tens, to judge the people at all seasons.” [Exodus 18:21] Four things the Lord requireth in a good governor. First, that he be a man of courage, of strength or force, that is, which hath ability to do the thing whereunto he is appointed. That ability consisteth in mind rather than in body. For it is required, that he be not a fool, but wise and skilful in that which he hath to do […]

In the second place that is set down, which indeed is the first; let him fear God, let him be religious, and not superstitious. No idolater preserveth the commonweal, but rather destroyeth it; and a wicked man defendeth not truth and true religion, but persecuteth and driveth them out of his jurisdiction. Let this magistrate of ours therefore be of the right religion, sound in faith, believing the word of God, and knowing that God is present among men and doth repay to whom he list according to their deserts. And for that cause Justinian, the emperor, in Novellis Constitutionib. 109, doth freely confess that all his help is of God; and that therefore it is convenient, that the making of all laws should depend upon him alone. […] And where the princes are God’s friends, and have often conference with God, there is hope that those commonwealths shall prosper and flourish. But, on the other side, there must needs be feared an unhappy end of that commonweal, where the enemies of God have the pre-eminence. Thirdly, there is required of him, which must be chosen and called to be magistrate, that he be true in word and deed, so that he be not found to be an hypocrite, a liar, a deceiver, a turncoat, nor one which out of one mouth doth blow both hot and cold; but faithful, simple, a plain dealer, and blameless. […]

Covetousness and greedy desire of bribes are the very plagues that choke good magistrates. By covetous men and takers of bribes law, judgment, liberty, justice, and the country itself, is set to sale and sold to the devil for money. And now, though in this place the Lord hath named only the most pestilent mischief of all other, yet there is no doubt but that he doth inclusively debar all other vices and evils of that sort, commanding them to be strange and far off from the good magistrate and godly governor. Those vices are pride, envy, anger, dicing, surfeiting, drunkenness, whoredom, adultery, and whatsoever else is like to these.

This place is made more manifest by conferring it with other places in the law of God. Moses, in Deuteronomy, saith to the people: “Bring men of wisdom, of understanding, and of an honest life, according to your tribes.” [Deuteronomy 1:13] Three things here again doth the wise man, Moses, require in them that are to be appointed magistrates in his commonweal. First, saith he, let them be wise. But the beginning of wisdom is the fear of the Lord. Let them therefore be ordained as magistrates, that are friends to God and true religion; let them be wise, and not foolish idiots. Secondarily, they must be men of understanding; that is, men of experience, who by long and continual exercise in handling of matters are able at the first brunt to deal in all cases according to the law. Lastly, they must be men of honest report, whose life and sound conversation are by their deeds perfectly tried and sufficiently witnessed of unto the people: and finally, they must be such as bear authority, and not be despised as rascal and vile knaves.</p></blockquote>

This place is made more manifest by conferring it with other places in the law of God. Moses, in Deuteronomy, saith to the people: “Bring men of wisdom, of understanding, and of an honest life, according to your tribes.” [Deuteronomy 1:13] Three things here again doth the wise man, Moses, require in them that are to be appointed magistrates in his commonweal. First, saith he, let them be wise. But the beginning of wisdom is the fear of the Lord. Let them therefore be ordained as magistrates, that are friends to God and true religion; let them be wise, and not foolish idiots. Secondarily, they must be men of understanding; that is, men of experience, who by long and continual exercise in handling of matters are able at the first brunt to deal in all cases according to the law. Lastly, they must be men of honest report, whose life and sound conversation are by their deeds perfectly tried and sufficiently witnessed of unto the people: and finally, they must be such as bear authority, and not be despised as rascal and vile knaves.”

— Heinrich Bullinger, Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 319-21.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+for+the+good+election+of+magistrates%2C+the+Lord+himself+declareth+whom+and+what+kind+of+men+he+will+have+to+be+chosen%2C+in+these+very+words%3A+%E2%80%9CLook+over+all+the+people%2C+consider+them+diligently%2C+and+choose+from+among+them+men+of+courage%2C+such+as+fear+God%2C+speakers+of+truth%2C+and+haters+of+covetousness%2C+and+make+them+rulers+over+thousands%2C+rulers+of+hundreds%2C+rulers+of+fifties%2C+and+rulers+of+tens%2C+to+judge+the+people+at+all+seasons.%E2%80%9D+%5BExodus+18%3A21%5D+Four+things+the+Lord+requireth+in+a+good+governor.+First%2C+that+he+be+a+man+of+courage%2C+of+strength+or+force%2C+that+is%2C+which+hath+ability+to+do+the+thing+whereunto+he+is+appointed.+That+ability+consisteth+in+mind+rather+than+in+body.+For+it+is+required%2C+that+he+be+not+a+fool%2C+but+wise+and+skilful+in+that+which+he+hath+to+do+%5B%E2%80%A6%5D%0A%0AIn+the+second+place+that+is+set+down%2C+which+indeed+is+the+first%3B+let+him+fear+God%2C+let+him+be+religious%2C+and+not+superstitious.+No+idolater+preserveth+the+commonweal%2C+but+rather+destroyeth+it%3B+and+a+wicked+man+defendeth+not+truth+and+true+religion%2C+but+persecuteth+and+driveth+them+out+of+his+jurisdiction.+Let+this+magistrate+of+ours+therefore+be+of+the+right+religion%2C+sound+in+faith%2C+believing+the+word+of+God%2C+and+knowing+that+God+is+present+among+men+and+doth+repay+to+whom+he+list+according+to+their+deserts.+And+for+that+cause+Justinian%2C+the+emperor%2C+in+Novellis+Constitutionib.+109%2C+doth+freely+confess+that+all+his+help+is+of+God%3B+and+that+therefore+it+is+convenient%2C+that+the+making+of+all+laws+should+depend+upon+him+alone.+%5B%E2%80%A6%5D+And+where+the+princes+are+God%E2%80%99s+friends%2C+and+have+often+conference+with+God%2C+there+is+hope+that+those+commonwealths+shall+prosper+and+flourish.+But%2C+on+the+other+side%2C+there+must+needs+be+feared+an+unhappy+end+of+that+commonweal%2C+where+the+enemies+of+God+have+the+pre-eminence.+Thirdly%2C+there+is+required+of+him%2C+which+must+be+chosen+and+called+to+be+magistrate%2C+that+he+be+true+in+word+and+deed%2C+so+that+he+be+not+found+to+be+an+hypocrite%2C+a+liar%2C+a+deceiver%2C+a+turncoat%2C+nor+one+which+out+of+one+mouth+doth+blow+both+hot+and+cold%3B+but+faithful%2C+simple%2C+a+plain+dealer%2C+and+blameless.+%5B%E2%80%A6%5D%0A%0ACovetousness+and+greedy+desire+of+bribes+are+the+very+plagues+that+choke+good+magistrates.+By+covetous+men+and+takers+of+bribes+law%2C+judgment%2C+liberty%2C+justice%2C+and+the+country+itself%2C+is+set+to+sale+and+sold+to+the+devil+for+money.+And+now%2C+though+in+this+place+the+Lord+hath+named+only+the+most+pestilent+mischief+of+all+other%2C+yet+there+is+no+doubt+but+that+he+doth+inclusively+debar+all+other+vices+and+evils+of+that+sort%2C+commanding+them+to+be+strange+and+far+off+from+the+good+magistrate+and+godly+governor.+Those+vices+are+pride%2C+envy%2C+anger%2C+dicing%2C+surfeiting%2C+drunkenness%2C+whoredom%2C+adultery%2C+and+whatsoever+else+is+like+to+these.%0A%0AThis+place+is+made+more+manifest+by+conferring+it+with+other+places+in+the+law+of+God.+Moses%2C+in+Deuteronomy%2C+saith+to+the+people%3A+%E2%80%9CBring+men+of+wisdom%2C+of+understanding%2C+and+of+an+honest+life%2C+according+to+your+tribes.%E2%80%9D+%5BDeuteronomy+1%3A13%5D+Three+things+here+again+doth+the+wise+man%2C+Moses%2C+require+in+them+that+are+to+be+appointed+magistrates+in+his+commonweal.+First%2C+saith+he%2C+let+them+be+wise.+But+the+beginning+of+wisdom+is+the+fear+of+the+Lord.+Let+them+therefore+be+ordained+as+magistrates%2C+that+are+friends+to+God+and+true+religion%3B+let+them+be+wise%2C+and+not+foolish+idiots.+Secondarily%2C+they+must+be+men+of+understanding%3B+that+is%2C+men+of+experience%2C+who+by+long+and+continual+exercise+in+handling+of+matters+are+able+at+the+first+brunt+to+deal+in+all+cases+according+to+the+law.+Lastly%2C+they+must+be+men+of+honest+report%2C+whose+life+and+sound+conversation+are+by+their+deeds+perfectly+tried+and+sufficiently+witnessed+of+unto+the+people%3A+and+finally%2C+they+must+be+such+as+bear+authority%2C+and+not+be+despised+as+rascal+and+vile+knaves.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+godly+and+learned+sermons+divided+into+the+five+decades+containing+the+chief+and+principal+points+of+Christian+religion%2C+ed.+Thomas+Harding+%281849-52+Parker+edn%3B+4+vols%2C+Grand+Rapids%2C+2004%29%2C+i%2C+319-21.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feab71e3b1a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eab71e3b1a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/03/21/henry-bullinger-on-biblical-qualifications-for-civil-magistrates/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>54. That the Pope can forbid subjects to keep the oath of fidelity to Christian kings, if they be such as acknowledge not the Roman sea.

55. That the Pope can absolve subjects from the oath of fidelity.

56. That the Pope has power to depose princes.

57. That the subjects of such princes are bound to obey such a sentence, if it be published.

58. That if grave and learned men (such as the Jesuits especially are) shall judge any prince to be a tyrant, it is lawful for their subjects to overthrow them, and if they want [lack] power, to poison them.

59. That the subjects of the most Christian kings, whom they call Lutherans and Sacramentarians, are free from all bonds, and that they may lawfully destroy their kings.

60. That ’tis not lawful for Christians to tolerate a king that is an infidel or a heretic endeavoring to draw men to his sect, but they are bound to depose him.

61. That the ancient Christians did not depose such because they wanted [lacked] power.

62. That the Pope may give the kingdoms and principalities, and lordships of all those whom he judges heretics unto his Roman Catholics, or may adjudge them to those that can lay hold of them.

63. That ’tis not only lawful, but meritorious to kill princes that are excommunicated by the Pope.</p></blockquote>

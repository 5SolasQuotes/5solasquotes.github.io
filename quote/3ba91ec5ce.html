<main class="wrap"><figure class="quote" id="q-3ba91ec5ce" data-kw="">
<blockquote><p>Moreover, why should he be said to distrust the promises of God, who doth follow the ways appointed by God, to avoid evils, that notwithstanding he dependeth wholly upon God; unless peradventure we can any where find in the holy Scriptures this commandment expressly written: ‘When the plague rageth, fly not away.’ And amongst them, preservative remedies are to be reckoned; and amongst these, going aside in due time; the like also, as the very name of ‘contagion’ doth manifest. And this also is plain, That he doth not only not offend against Christian charity, neither yet tempt God, who in such manner by going aside doth avoid the plague, so that in the mean time he let pass no act of piety towards God, or of charity towards his neighbour; That on the contrary, unless he perform these duties, he may be thought to provoke the wrath of God against himself, and to be worse than an infidel, as being one that rashly puts himself in danger of deadly infection, without any care of himself, or his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Learned &amp; Pithy Treatise of the Plague, Wherein are Handled These Two Questions: the One, Whether the Plague Be Infectious, Or No: the Other, Whether and How Far it May of Christians Be Shunned by Going Aside</cite>, (1580; London, 1665), p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a4fe470af" data-kw="">
<blockquote><p>1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, on the 6th Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<main class="wrap"><figure class="quote" id="q-c519eef0e2" data-kw="">
<blockquote><p>A crucified Christ, with all his purchase, is offered to all the hearers of the gospel: for Christ in his Word, and by his ministers in the gospel-offer, speaks to all and every one of them; yea, speaks to every sinner, man and woman in particular, as though He called them by name and surname. And every man is bound to take the call and offer home to himself, as if he were so named, and believe that Christ stands at his door and knocks, saying, ‘If you, or any man, will open to me, I will come in.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacramental Meditations, in The Whole Works of John Willison, 1816, vol. 3 | Meditation 25</cite>, pp. 286-88</span></figcaption>

<blockquote><p>(5) This lamentation of Christ over impenitent Jerusalem teaches us also that man’s ruin is from himself? If after all Christ’s gracious invitations, all his unwearied forbearances, all his bitter and salt tears, Jerusalem will stil persist in her rebellious contempt of his gracious offers, how inexcusable is her sin, and inevitable her ruin? What will prevail upon her, if Christ’s tears and entreaties will not prevail? What can save her, if her Redemer’s grace and mercy save her not? What is it that keeps evangelic sinners from being saved? is it any defect in the object, or its revelation? is it mere simple ignorance, or impotence in the subject? No; but it is wilfull blindness and impotence: they shut their eyes and will not see; they bolt their hearts and will not open to Christ, who knocks at the door of the soul by many gracious invitations of his Gospel and Spirit. And do not such deservedly perish, who electively embrace their own ruin, and wilfully reject the things that belong to their peace, Mt. 23:37?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger (London: Widdowes, 1679), bk. 1, ch. 9</cite>, pp. 68-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“(5) This lamentation of Christ over impenitent Jerusalem teaches us also that man’s ruin is from himself? If after all Christ’s gracious invitations, all his unwearied forbearances, all his bitter and salt tears, Jerusalem will stil persist in her rebellious contempt of his gracious offers, how inexcusable is her sin, and inevitable her ruin? What will prevail upon her, if Christ’s tears and entreaties will not prevail? What can save her, if her Redemer’s grace and mercy save her not? What is it that keeps evangelic sinners from being saved? is it any defect in the object, or its revelation? is it mere simple ignorance, or impotence in the subject? No; but it is wilfull blindness and impotence: they shut their eyes and will not see; they bolt their hearts and will not open to Christ, who knocks at the door of the soul by many gracious invitations of his Gospel and Spirit. And do not such deservedly perish, who electively embrace their own ruin, and wilfully reject the things that belong to their peace, Mt. 23:37?”

ver,belong%20to%20their%20peace%2C%20Mt.%2023%3A37&amp;text=5%29%20This%20lamentation%20of%20Christ%20over%20impenitent%20Jerusalem&amp;text=things%20that%20belong%20to%20their%20peace%2C%20Mt.%2023%3A37" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4f3926db77" data-kw="">
<blockquote><p>Saint Augustine makes it plain again, Non ideo non habet homo Deus non dat, sed quia homo non acipit [A man does not lack it because God does not give, but because the man does not receive]: men become hardened, and want the spirit of grace, why? Not because God does not offer it unto them, but because they receive it not, when it is offered. For example: One of us being sick and like[ly] to die, the physician knowing our case, he takes with him some preservative to comfort us, and comes to the door and knocks; if we will not or be not able to let him in, we perish and die, and the cause is not in the physician, but in ourselves that let him not in. Amartema nosema, ‘Sin is a disease’, whereof we are all sick, for we have all sinned: Rom. 6:12. Christ is the Physician of our souls: Venit de cœlo magnus medicus, quia per totum ubique iacebit agrotus [A great physician came from heaven, because everywhere the sick man lay throughout the whole world]. Christ the great Physician came down from heaven, because all mankind was generally infected. He comes to the door of our hearts and knocks, Rev. 3:20, “Behold, I stand at the door and knock.” He brings with Him arton tes zoes, ‘the bread of life’ [Jn. 6:35], his eternal Word to comfort us, if we let Him in, if we open the door of our hearts, He will come in and sup with us, as He did with Mary [Lk. 10], and forgive us all our sins; but if we will not, or through long contagion of our sin be not able to let Christ in, we die in our sins and the case is evident, not because Christ does not offer grace, and comfort unto us, but because we receive it not when it is offered, Merito perit agrotus qui non medicum vocat, sed ultre venientem respuit, ‘worthily does that sick patient perish, who will neither send for the physician himself, nor accept of his help when it is offered.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-maxey.html">Anthony Maxey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Golden Chain of Man’s Salvation (London: T.E., 1607), 2nd Sermon, ‘God hardens not’, pp. 72-75 Maxey (d. 1618) was the dean of Windsor.</cite></span></figcaption>

</figure><figure class="quote" id="q-1aa5655632" data-kw="">
<blockquote><p>He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his Word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, Sermon 1, pp. 463-79</span></figcaption>

<blockquote><p>3. Behold I stand at the door of thy heart as one ready to help thy weakness. (2 Thess. 2; Ps. 106) And I knock at the portal of thy conscience as one that would gladly comfort thee, I send forth my heavenly Word to succour thee, lighten thee, raise thee up and save thee. 4. If any man with a glad heart will hear my voice, or the true preaching of my Word (Jn. 10; Mk. 16; Gal. [?]; Lk. [?]) and open the door of his faith, thankfully to receive it, I will come in unto him, enduing with all spiritual delights, as righteousness, peace, love and joy in the Holy Ghost. 5. Yea to him shall I make manifest as to my friend the hidden mysteries of the Scripture (Jn. 15; Lk. 14; Mt. 8; [?] Cor. 2) and secret counsels of my Father. And he shall finally sup with Me and I with him in the eternal habitacle of God, where no heart can esteem what He has prepared for them that love Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John... (d. 1563), ch. 3, p. 50 Bale was an Anglican reformer.</cite></span></figcaption>

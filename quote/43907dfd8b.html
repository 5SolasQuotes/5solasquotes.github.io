<main class="wrap"><figure class="quote" id="q-43907dfd8b" data-kw="">
<blockquote><p>For the understanding [of the forgiveness of sins] we must distinguish

[1.] of two covenants that God hath made with man

a. A covenant of works – made with our first parents in innocency wherein life was promised upon condition of perfect, personal and perpetual obedience. Do this and live, i.e. continue happy.

Now

i. when Adam was taken into this covenant he needed no pardon – for God made man upright (Eccles. 7:29). There was a perfect purity and rectitude in his nature, his understanding clear, his will complying, his affections regular, all in frame. He was created in God’s image. That in us which needs pardon is the devil’s image. He that is innocent needs not to be justified. That was a covenant of friendship, not a covenant of reconciliation which supposeth a quarrel. Therefore there needed no mediator. Adam in his innocent estate dealt with God immediately. There was no cloud to interpose or interrupt his communion – no fracas, no wrath, but all clear.

ii. in case of failure the covenant promised no pardon. That covenant left no room for repentance (Gen. 2:17, thou shalt surely die), and therefore when Adam had eaten forbidden fruit he fled from God, and hid himself (Gen. 3:8), in a sense of his guilt, having no encouragement to hope for pardon, like the malefactor while the hue and cry is in pursuit of him. And if God had not presently revealed a Saviour, the seed of the woman that should break the serpent’s head, Adam had sunk in despair. The law could not do it (Rom. 8:3).

b. A covenant of grace, and it is in and by this covenant that pardon and forgiveness is to be had, a better covenant established upon better promises, for the redemption of the transgressions that were under the first testament (Heb. 9:15). This is a plank thrown out after the shipwreck, as the valley of Achor for a door of hope (Hos. 2:15). This is a covenant of reconciliation, supposeth man fallen, and so guilty and obnoxious, and needing pardon. ‘Tis a remedial law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), pp 39-40.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99809b9d03" data-kw="">
<blockquote><p>The second consequence attributed to the imputation of Christ’s righteousness, is a title to eternal life. This in the older writers is often expressed by the words “adoption and heirship.” Being made the children of God by faith in Christ Jesus (Gal. 3:26), they are heirs of God and joint heirs with Jesus Christ of a heavenly inheritance. (Romans 8:17.) The mere expiation of guilt confers no title to eternal life. The condition of the covenant under which man was placed was perfect obedience. This, from all that appears in Scripture, the perfection of God requires. As He never pardons sins unless the demands of justice be satisfied, so He never grants eternal life unless perfect obedience be rendered. Heaven is always represented as a purchased possession. In the covenant between the Father and the Son the salvation of his people was promised as the reward of his humiliation, obedience, and death. Having performed the stipulated conditions, He has a claim to the promised recompense. And this claim inures to the benefit of his people. But besides this, as the work of Christ consisted in his doing all that the law of God, or covenant of works requires for the salvation of men, and as that righteousness is freely offered to every one that believes. every such believer has as valid a claim to eternal life as he would have had, had he personally done all that the law demands. Thus broad and firm is the foundation which God has laid for the hopes of his people. It is the rock of ages; Jehovah our righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 3 vols. (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 3.164–65.</span></figcaption>

9d03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99809b9d03.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/hodge-christ-fulfilled-the-conditions-of-the-covenant-of-works-for-believers/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-7dc25ca674" data-kw="">
<blockquote><p>In Adam’s sin there was the breach of the whole law in every commandment, either directly or by consequence, for he showed evident want of love to God in believing Satan more than God. Therein he chose Satan for his god; he worshipped Satan and took God’s name in vain; he showed also evident want of brotherly love, for hereby he became a murderer not only of himself, but of all his posterity. And thus do sins concur in every wicked action, in which regard it may be said with James that “he which faileth in one commandment is guilty of all” [2:10], which must admonish us to make conscience of every sin, for we cannot live in any one but we must needs run into many other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Christ’s Sermon on the Mount in The Works of William Perkins</cite>, (Reformation Heritage Books, 2014), 399.</span></figcaption>

<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1872), 2.374–376.</span></figcaption>

<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>

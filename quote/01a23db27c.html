<blockquote><p>But here it is asked, since Christ is said to have tasted death for every man (Heb. 2:9), and for all (2 Cor. 5:15), and to have given Himself a ransom for all (1 Tim. 2:6), whether this can and ought to be understood of all men without exception, even of those who become not partakers of righteousness and life, nor are elected and given to Christ by special grace: at least with a distinction between sufficiency and efficacy? We answer… there are grave reasons why we dare not speak in this manner, in whatever sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether Christ Satisfied for All’ in ch. 61, ‘On the Satisfaction of Christ’ in Sum of Theology</cite>, (Geneva, 1665), trans. AI at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>3. The kingdom of the Son of God is twofold: universal and singular. 4. The universal kingdom of the Son of God is the kingdom that, by nature, God Himself truly possesses in common with the Father and the Holy Spirit throughout the universe, from eternity to eternity, and this by nature or by natural right, as the Only Begotten Son of God the Father. Hence, it is also called the divine kingdom by Athanasius in his work De Incarnatione Verbi Contra Arianos (On the Incarnation of the Word Against the Arians), Volume 1, Page 476. This same natural kingdom of His is accustomed to be called. 5. He has never relinquished nor will He ever relinquish this kingdom. 6. The singular kingdom of the Son of God is His special possession within the Church, which is His mystical body. It is often called the kingdom of gift and acquisition. 7. It encompasses both grace and glory. 8. The kingdom of grace is the governance of the Church in this life, in which Christ exhibits His grace to His elect for the attainment of their eternal salvation. This kingdom is called “human” by Athanasius in the aforementioned passage because it is administered by the Son of God in His capacity as the Word made flesh, voluntarily and graciously undertaking the role of Mediator. Hence, it is also appropriately called the “Economical” or “Mediatorial” kingdom, as it pertains specifically to us humans. 9. Christ will deliver this kingdom to God the Father, as stated in 1 Corinthians 15:24. As Athanasius noted in the previously mentioned passage, the Lord of heaven assumed the likeness of our humanity and took upon Himself the human throne of David, who is His Father according to the flesh, in order to rebuild and restore it. Through this restoration, we all reign in Him, and He will deliver the restored human kingdom to His Father. … 13. That God may be all in all [1 Cor. 15:28], that is, that God the Father may reign through the Son, through His own Word, after He has reigned here through Him as the Savior, as the same Athanasius piously declares. 14. The kingdom of glory is the governance of the Son of God, which will accompany the universal resurrection of all the dead. When the restoration and glorification of God’s elect are completed, they will contemplate the glory of God the Father in the Only Begotten Son through the Holy Spirit for eternity, and they will be blessed without end in the present vision of God and will reign gloriously with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601) | section XIV, Consequences</span></figcaption>

</figure><figure class="quote" id="q-b5af0f9625" data-kw="">
<blockquote><p>It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-ponter.html">David Ponter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Classic “Sufficient for all, Efficient for the elect” and its Revision’ at Calvin &amp; Calvinism The webmaster is a hypothetical universalist</cite>, This historical development of the interpretation of the Lombardian formula is partially confirmed by William Cunningham, The Reformers &amp; the Theology of the Reformation (Edinburgh: T&amp;T Clark, 1866), Essay 7, ‘Calvin &amp; Beza’, p. 397:</span></figcaption>

</figure><figure class="quote" id="q-7e77844b8c" data-kw="">
<blockquote><p>How could he die, if he were not a reputed sinner? Had he not first had a relation to our sin, he could not in justice have undergone our punishment. He must in the order of justice be supposed a sinner really, or by imputation; really he was not, by imputation then he was.</p></blockquote>

<blockquote><p>…the word… ‘Christ died for all‘ does never signify all and every one of mankind, by neither Scripture, nor the doctrine of adversaries: but is, as all divines say, to be expounded according to the subject in hand, secundum materiam substratam. Hence our 1st Rule, ‘All’ often signifies the most part, Mk. 1:64, ‘they all condemned him to be guilty of death,’ ‘the whole counsel,’ Mt. 26:59, yet Joseph of Arimathea consented not to his death, Lk. 23:51, and the flood destroyed them ‘all,’ Lk. 17:27, yet eight persons were saved; so ‘all Judah,’ Jer. 13:19, was carried into captivity. ‘All’ is often the same with many, ‘all the sheep of Kedar shall be gathered to thee,’ that is many, and Gen. 41, ‘and all the land came to Egypt,’ when the matter bears a clear exception, and other Scriptures expound it; then sure Christ’s dying for all must be expounded for his giving Himself a ransome for many, Mt. 20:28, compared with 1 Tim. 2:6… [Rule] 2. All skilled in the mother languages, and all divines say that the particle ‘ali’ [in Greek] is taken pro singulis generum, vel pro generibus singulorum; ‘all and every one of kinds, and for the kinds of all,’ though not absolutely excluding any kind. 1. The word ‘all’ is in materia necessaria, ‘in a necessary matter,’ taken for all and every one. ‘God made all nations of one blood,’ Acts 17:26. He ‘knows the hearts of all men,’ Acts 1:24; Rom. 3:12, ‘All have sinned,’ Rom. 5:12; 2 Cor. 5:10; 1 Tim. 4:10; Jam. 1:5; Phil. 2:10-11. 2. All without exclusion of particular men in a contingent matter is sometimes so taken, Mt. 26:33, ‘Though all be offended,’ Lk. 6:26; Rev. 4:26. 3. When ‘all’ is spoken of God’s works for men, or in men, especially works of mere grace opposite to men’s works: ‘all men,’ then is not taken in the largest sense, as Mr. Moor imagines: So our text; ‘I when I am lifted up from the earth, will draw all men to Me,’ cannot be meant of all men without exception: 1. Because it’s a clear restriction of calling of multitudes under the Messiah’s Kingdom after his death, and cannot but speak against a universal drawing in the times of the Old Testament. 2. Christ draws not all to Himself by the Gospel, because thousands hear not of Him; not virtually, for we read of no calling or drawing of Christ lifted up on the cross and crucified by the works of Nature: So God blesses all nations, not all and every one; God saves all Israel and turns away iniquity from Jacob, and forgives the sins of Israel; and God only saves, and only pardons believers. But will Mr. Moor say, God saves and pardons all and every man in Israel? Rule 3. There is hence a third rule, that ‘many’ is placed for all the elect, as Mt. 10:28, He ‘gave Himself a ransom for many.’ Mk. 14:14, ‘This is my blood of the New Testament, that is shed for many,’ as Rom. 5:15, ‘Through the offence of one, many were dead,’ that is, all were dead: So the sheep of Christ, Jn. 10:11, the scattered sons of God, Jn. 11:52, his people, Mt. 1:21, his brethren, Heb. 2, that he died, ‘for,’ must be exclusive of those that are not his sheep, not his brethren, not his people, not the sons of God… Rule 4. In the matter of our redemption, especially in the New Testament and prophecies of the Old of the same subject, Christ died for all, pro generibus singulorum, for men of all nations, some of all kinds… Rule 5. [Greek] or [Greek] is undeniably expounded of all that are saved only and is restrictive; such a physician cured all the city; that is, no man is cured but by him. Ex. 28:•4, Jethro says to Moses, ‘What is this that thou doest? thou sittest alone and all the people stand by thee from morning till evening,’ (for judgement)… Num 11:13 and his words bear not that all the people without exception came for judgment, that had been unpossible; but because there was then no other judge but Moses, the sense is cleare; all that were to be judged, they were to be judged by no other but by Moses only. Rev. 13:8, ‘And all that dwell in the earth worshipped the beast,’ that is, all seduced to Popish idolatry were seduced by the beastly vicar of Christ and his limbes; Jn. 11:48, ‘If we let him alone, all will believe in him;’ that is, none will believe in us, nor follow us; and all seduced men, shall be seduced by him… That Christ in this sense should be the Savior of all men, that He should have a negative voice in the salvation of all, that all the ransomed ones should come through his hands, is no other thing than Peter says, Acts 4:11, ‘That there is no other name under heaven by which men may be saved,’ and none comes to the Father, but by him, Jn. 14:6…</p></blockquote>

3A12%3B+2+Cor.+5%3A10%3B+1+Tim.+4%3A10%3B+Jam.+1%3A5%3B+Phil.+2%3A10-11.+2.+All+without+exclusion+of+particular+men+in+a+contingent+matter+is+sometimes+so+taken%2C+Mt.+26%3A33%2C+%E2%80%98Though+all+be+offended%2C%E2%80%99+Lk.+6%3A26%3B+Rev.+4%3A26.+3.+When+%E2%80%98all%E2%80%99+is+spoken+of+God%E2%80%99s+works+for+men%2C+or+in+men%2C+especially+works+of+mere+grace+opposite+to+men%E2%80%99s+works%3A+%E2%80%98all+men%2C%E2%80%99+then+is+not+taken+in+the+largest+sense%2C+as+Mr.+Moor+imagines%3A+So+our+text%3B+%E2%80%98I+when+I+am+lifted+up+from+the+earth%2C+will+draw+all+men+to+Me%2C%E2%80%99+cannot+be+meant+of+all+men+without+exception%3A+1.+Because+it%E2%80%99s+a+clear+restriction+of+calling+of+multitudes+under+the+Messiah%E2%80%99s+Kingdom+after+his+death%2C+and+cannot+but+speak+against+a+universal+drawing+in+the+times+of+the+Old+Testament.+2.+Christ+draws+not+all+to+Himself+by+the+Gospel%2C+because+thousands+hear+not+of+Him%3B+not+virtually%2C+for+we+read+of+no+calling+or+drawing+of+Christ+lifted+up+on+the+cross+and+crucified+by+the+works+of+Nature%3A+So+God+blesses+all+nations%2C+not+all+and+every+one%3B+God+saves+all+Israel+and+turns+away+iniquity+from+Jacob%2C+and+forgives+the+sins+of+Israel%3B+and+God+only+saves%2C+and+only+pardons+believers.+But+will+Mr.+Moor+say%2C+God+saves+and+pardons+all+and+every+man+in+Israel%3F+Rule+3.+There+is+hence+a+third+rule%2C+that+%E2%80%98many%E2%80%99+is+placed+for+all+the+elect%2C+as+Mt.+10%3A28%2C+He+%E2%80%98gave+Himself+a+ransom+for+many.%E2%80%99+Mk.+14%3A14%2C+%E2%80%98This+is+my+blood+of+the+New+Testament%2C+that+is+shed+for+many%2C%E2%80%99+as+Rom.+5%3A15%2C+%E2%80%98Through+the+offence+of+one%2C+many+were+dead%2C%E2%80%99+that+is%2C+all+were+dead%3A+So+the+sheep+of+Christ%2C+Jn.+10%3A11%2C+the+scattered+sons+of+God%2C+Jn.+11%3A52%2C+his+people%2C+Mt.+1%3A21%2C+his+brethren%2C+Heb.+2%2C+that+he+died%2C+%E2%80%98for%2C%E2%80%99+must+be+exclusive+of+those+that+are+not+his+sheep%2C+not+his+brethren%2C+not+his+people%2C+not+the+sons+of+God%E2%80%A6+Rule+4.+In+the+matter+of+our+redemption%2C+especially+in+the+New+Testament+and+prophecies+of+the+Old+of+the+same+subject%2C+Christ+died+for+all%2C+pro+generibus+singulorum%2C+for+men+of+all+nations%2C+some+of+all+kinds%E2%80%A6+Rule+5.+%5BGreek%5D+or+%5BGreek%5D+is+undeniably+expounded+of+all+that+are+saved+only+and+is+restrictive%3B+such+a+physician+cured+all+the+city%3B+that+is%2C+no+man+is+cured+but+by+him.+Ex.+28%3A%E2%80%A24%2C+Jethro+says+to+Moses%2C+%E2%80%98What+is+this+that+thou+doest%3F+thou+sittest+alone+and+all+the+people+stand+by+thee+from+morning+till+evening%2C%E2%80%99+%28for+judgement%29%E2%80%A6+Num+11%3A13+and+his+words+bear+not+that+all+the+people+without+exception+came+for+judgment%2C+that+had+been+unpossible%3B+but+because+there+was+then+no+other+judge+but+Moses%2C+the+sense+is+cleare%3B+all+that+were+to+be+judged%2C+they+were+to+be+judged+by+no+other+but+by+Moses+only.+Rev.+13%3A8%2C+%E2%80%98And+all+that+dwell+in+the+earth+worshipped+the+beast%2C%E2%80%99+that+is%2C+all+seduced+to+Popish+idolatry+were+seduced+by+the+beastly+vicar+of+Christ+and+his+limbes%3B+Jn.+11%3A48%2C+%E2%80%98If+we+let+him+alone%2C+all+will+believe+in+him%3B%E2%80%99+that+is%2C+none+will+believe+in+us%2C+nor+follow+us%3B+and+all+seduced+men%2C+shall+be+seduced+by+him%E2%80%A6+That+Christ+in+this+sense+should+be+the+Savior+of+all+men%2C+that+He+should+have+a+negative+voice+in+the+salvation+of+all%2C+that+all+the+ransomed+ones+should+come+through+his+hands%2C+is+no+other+thing+than+Peter+says%2C+Acts+4%3A11%2C+%E2%80%98That+there+is+no+other+name+under+heaven+by+which+men+may+be+saved%2C%E2%80%99+and+none+comes+to+the+Father%2C+but+by+him%2C+Jn.+14%3A6%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+pp.+422-30+of+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84520a3180.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84

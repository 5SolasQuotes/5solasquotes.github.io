<main class="wrap"><figure class="quote" id="q-f4f0adf507" data-kw="">
<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, section 3</cite>, p. 443</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>3. An ordinance may be said to be polluted upon this extrinsic consideration, to wit, when by some circumstance in it, or miscarriage of those that are about it, it is made common-like, and so wants that luster and honorableness that it ought to have; by such a fault the ordinance is made obnoxious to contempt and is despised by others, contrary to the Lord’s allowance. Thus the priests of old made the offerings of the Lord vile and contemptible, which was not by corrupting them in essentials, nor making them cease to be Ordinances, but by their miscarriages and corrupt irreverent way of going about them, they did lay that stumbling-block before others, to make them account these ordinances contemptible. This may be diverse ways fallen into… they do pollute that admonition, yet still these ordinances are ordinances, and that admonition an admonition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pt. 2, ch. 14, ‘Clearing Whether the Ordinances of Christ be Any Way Polluted by Corrupt Fellow-Worshippers’ in The Dying Man’s Testament… (1659)</cite>, pp. 148-9</span></figcaption>

</figure><figure class="quote" id="q-0bce3d4602" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil112 (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

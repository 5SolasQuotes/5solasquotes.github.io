<main class="wrap"><figure class="quote" id="q-280d5e37c6" data-kw="">
<blockquote><p>Again; an Elder ought to be a man of eminent prudence. By prudence here is, of course, not meant that spurious characteristic, which calls itself by this name, but which ought rather to be called timidity, or a criminal shrinking from duty, on the plea that “there is a lion in the way.” Yet, while we condemn this as unworthy of a Christian, and especially unworthy of a Christian Counsellor and Ruler; there is a prudence which is genuine, and greatly to be coveted. This is no other than practical Christian wisdom, which not only discerns what is right, but also adopts the best mode of doing it; which is not at all inconsistent with firmness, and the highest moral courage; but which happily regulates and directs it.

It has been often observed, that there is a right and a wrong way of doing the best things. The thing done, may be excellent in itself; but may be done in a manner, at a time, and attended with circumstances, which will be likely to disgust and repel, and thus prevent all benefit. Hence a man who is characteristically eccentric, undignified, rash, precipitate, or indiscreetly talkative, ought by no means to be selected as an ecclesiastical ruler. He will, probably, do more mischief than good; will generally create more divisions than he heals; and will rather generate offences than remove them.

Perhaps there is no situation in human society which more imperiously calls for delicacy, caution, reserve, and the most vigilant discretion, than that of an ecclesiastical Ruler. If Popular rumour begin to charge a Church member with some delinquency, either in faith or practice: let one of the Elders, under the notion of being faithful, implicitly credit the story, go about making inquiries respecting its truth, winking and insinuating, and thus contributing to extend its circulation; and however pure his motives, he may, before he is aware, implicate himself in the charge of slander, and become so situated in respect to the supposed culprit as to render it altogether improper that he should sit in judgment on his case. The maxim of the wise man; “be swift to hear, slow to speak, slow to wrath”–applies to every human being; especially to every professing Christian: but above all to every one who is appointed to maintain truth, order, purity, peace and love in the Church of God.

It requires much prudence to judge when it is proper to commence the exercise of discipline against a supposed offender. Discipline is an important, nay, a vital matter in the Christian Church. But it may be commenced indiscreetly; vexatiously; when that which is alleged cannot be shown to be an offence against the divine law; or when, though a really censurable offence, there is no probability that it can be proved. To attempt the exercise of discipline in such cases, is to disgrace it; to convert it, from one of the most important means of grace, into an instrument of rashness, petulance, and childish precipitancy.

Often, very often, has the very name of discipline been rendered odious, the peace of families and neighbourhoods grievously disturbed, the influence of ecclesiastical judicatories destroyed, and the cause of religion deeply wounded, by judicial proceedings, which ought either never to have been commenced, or to which the smallest measure of prudence would have given a very different direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay, on the Warrant, Nature and Duties of the Office of the Ruling Elder in the Presbyterian Church</cite>, (New York: Jonathan Leavitt, 1831), pp 251-53.</span></figcaption>

<blockquote><p>…we are unworthy to lift up our eyes unto heaven and appear in thy presence, and that we ought not to presume to hope that thou wilt listen to our prayers if thou takest account of the things which we lay before thee; for we are accused by our own consciences, and our sins bear witness against us, while we know thee to be a just Judge, who justifiest not sinners and wicked men, but inflictest punishment on those who have broken thy commands. Hence it is, Lord, that when we reflect on the state of our whole life, we are ashamed of ourselves, and can do nothing but despond, just as if we were plunged into the abyss of death. And yet, Lord, since thou hast deigned, of thy boundless mercy, to command us to call upon thee, and that from the lowest hell, and the more devoid of strength we see ourselves to be to flee the more to thy supreme goodness ; since, moreover, thou hast promised that thou wilt listen to our prayers in the name of the Lord Jesus Christ, (whom thou hast appointed to be our advocate and intercessor,) and for his merit, without looking to what we have deserved, we here, renouncing all human confidence, and trusting solely to thy goodness, hesitate not to come into thy sight, and call upon thy holy name, in order to obtain mercy.</p></blockquote>

<blockquote><p>Messiah’s subjects are his, because by his spirit and power he forms them anew; fitting them now for his service here, and for the full enjoyment of heaven hereafter. To rescue men from external slavery, yet to leave their slavish habits and propensities in full force, would not greatly ameliorate their condition nor render them proper subjects of a free state. Christ does more than this for his people, and thereby his right to their persons and services is strengthened and confirmed. “Behold,” says he, “I make all things new,” and through his creative energy new light shines into the understanding, and new affections are kindled in the heart—new principles are implanted in the mind, and new hopes gladden the soul—new desires influence the will, and new actions characterise the life—old things pass away, and all things become new.

All this is effected by his blessed spirit. “Lo,” said Jesus, when about to leave this scene of suffering and of sorrow, “Lo I am with you always, even to the end of the world.” The disciples to whom this promise was made, continued not long upon earth, and we now behold him with the eye of flesh no more. Yet is he still present with his people. Yea he will never leave nor forsake them. Soon was his promise fulfilled, and the Comforter, sent from on high, took up his abode in the hearts of his people. They thus become temples of the Holy Ghost, in which he delights to dwell, and will for ever be glorified; they are members of that body of which Christ is at once the sovereign and head, and one spirit animates the whole.

If slight benefits conferred, or trivial changes of character produced, furnish claims of gratitude or of submission, what must be due from Messiah’s subjects to their Lord, who makes them new creatures, and fits them for the society of angels, and the spirits of just men made perfect? In consequence of this, whatever their previous character or conduct may have been, they now perceive that Christ is indeed a King; they cordially submit to him as their king; and, by cheerfully submitting themselves to him as his subjects, they confirm his right to their persons and services, they secure their own felicity in time and for ever, and they verify the prediction of our text, “Thy people shall be willing.</p></blockquote>

</figure><figure class="quote" id="q-69c466e0fb" data-kw="">
<blockquote><p>The question of negro slavery moves ecclesiastical and civil society to their centres. The rights of man have always occupied a prominent place in the testimony of Covenanters; and as we never permitted slaveholders to enjoy the communion of the church, we could not witness the great efforts of British and American philanthropists without deep sympathy. We, as Covenanters, look with peculiar interest at this most intense movement of the public mind, in its bearings on the United States’ Constitution, and on the fourteen state constitutions south of Mason and Dixon’s line, in all of which there are imbodied pro-slavery provisions.

In this view our distinctive principles are justified, as they respect human rights, by these benevolent anti-slavery efforts. On this great topic, a Christian, especially a Reformed Presbyterian magazine should, and by the Divine aid will, speak out in a manner that cannot be misunderstood. We thank God that he has called forth so strong and increasing a host of auxiliaries in pleading the cause of human liberty. We hope and pray that Messiah will lead them all on, as he has done many, to assault the citadel of this despotism—the United States’ Constitution.</p></blockquote>

</figure><figure class="quote" id="q-54d01066dc" data-kw="">
<blockquote><p>Nomist.

Tell me what is that Law which this Faith doth not make void?

Evangelist.

You must know that there were three sorts of Laws delivered by God to Moses.

1. Ceremonial; which were temporary Ordinances and Rites really pointing to Christ, of whom they were figures and shadows; and by whose presence and death they were all fulfilled, terminated and abrogated; Christ was finis inter ficiens legis Ceremonialis; so that the law of Ceremonies was made void by the Doctrine of faith, and therefore this law cannot be here meant.

2. Judicial, which were peculiar Ordinances given by God to Moses, for the well-ordering of the Common-wealth of Israel.

This Law concerned the Jews not simply, as men, but as Jews; the National, personal, or particular binding right of this Law rested so in them, that it died with the decay of their Common-wealth: only the common equity or right hereof remaineth (i) as far as it was grounded on the Law of Nature, served directly to confirm any of the Ten Commandments, or to uphold the good of Family, Church, or Common-wealth, it is still in force, and of good use; but of this Law the Apostle in this Scripture makes no mention: Now if he speak not of the Law Ceremonial, nor of the Law Judicial, it followeth that we must understand him speaking of the Law—

3. Moral, and that not as it is a rule of Justification, but a rule of Service and Obedience; the whole compass of man’s duty respectively to be manifested, is principally contained in the Law Moral; which is no other then the revealed Copy of God’s will touching man’s duty, laid down in the ten Commandments: if we do cast our eyes upon the scope of the Apostle, it will be very evident that he speaketh of this Law; for he deals against such who sought to be justified and saved by the works of the Law, and not by faith in Jesus Christ; they went about to set up the Law of Works, and to destroy the Law of Faith.

Now Paul sheweth that no man’s conformity to the Moral Law could be matter of life and justification unto him in God’s sight; The Law, by sin, is become weak and unprofitable to the purpose of righteousness, it could not be a covenant of life unto man; now having excluded it from being a covenant of life to sinners, there were those who would have it to be disannulled from being a rule of life unto men, which the Apostle will not admit of, so that its plain that the vindication is of the Moral Law, that, as a rule of life is not made void unto Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sedgwick.html">John Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antinomianism Anatomized. Or, A Glass for the Lawless: Who deny the Ruling use of the Moral Law unto Christians under the Gospel</cite>, (London: Samuel Gellibrand, 1643), pp 7-8.</span></figcaption>

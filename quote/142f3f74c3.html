<main class="wrap"><figure class="quote" id="q-142f3f74c3" data-kw="">
<blockquote><p>…for when we see the strictness of the institution, and how far we come short of it, we are ready to doubt that we do too little, less than God requires… the true soul can comfort itself in the sincerity of its desires; for though God accounts nothing little that springs from an upright heart… Though they cannot be perfect in their services, yet they will make a right choice, serve God after his own manner; not make it up in the pomp, what is wanting in the power of religion, as many do; but look principally to the inward part, to the truth of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 15 | ‘First Sermon’ of Sermons on the Sacraments, p. 354</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers</cite>, … (London, 1644), ch. 9, p. 35 Rathband was an English puritan and Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-7cc0ca3135" data-kw="">
<blockquote><p>What assemblies of Christians we behold visibly worshiping God in Christ, we take for granted to be true visible churches. And when we judge of our own communion with them, it is not upon this question, whether they are true churches or no, as though the determination of our practice did depend solely thereon: For as we are not called to judge of the being of their constitution, as to the substance of it, unless they are openly judged in the Scripture, as in the case of idolatry and persecution persisted in, so a determination of the truth of their constitution, or that they are true churches, will not presently resolve us in our duty as to communion with them, for the reasons before given. But in such a case, two things are by us principally to be considered: 1. That nothing sinful in it self, or unto us, be required of us as the condition of communion. 2. That we may in such churches obtain the immediate end of their institution, and our conjunction with them, which is our edification in faith, love and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious</cite>, (1672), ch. 3, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

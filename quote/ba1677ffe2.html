<blockquote><p>3. The government gives a legal security and establishment to gross heresy, blasphemy, and idolatry, under the notion of liberty of conscience. It would be too tedious to examine each of the State constitutions on this head. One may suffice.

We shall select that of the State of Pennsylvania. See the preamble, together with the third and twenty-sixth sections of the ninth article. Here the constitution recognizes and unalterably establishes the indefeasible right of worshipping the Almighty God in whatever way a man’s conscience may dictate; and declares that this shall for ever remain inviolate. We believe that no man has a right to worship God any other way than he himself hath prescribed in his law. We also think it criminal for a man’s conscience to approve any way repugnant to this sacred rule: and that this crime cannot legitimate another, or make an action right which God expressly condemns under pain of eternal wrath.

If conscience can legitimate what God’s law condemns, it must be paramount to the divine law, and, consequently, to the Legislator also, in having a negative over the requisitions of both the one and the other.

Were this the case, it would not only free from criminality, but would render virtuous, laudable, and praiseworthy the most damnable errors—the most horrid blasphemies and detestable abominations—if but dictated by the consciences of Pagans, Mohammedans, &amp;c. Then the Egyptians, worshipping God under the form of a snake or crocodile, would be as lawful, yea, as commendable, as doing it precisely according to the manner which he has prescribed in his word, provided, that, in both cases, conscience said Amen!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-b-wylie.html">S. B. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The two sons of oil; or, the faithful witness for magistracy and ministry upon a scriptural basis</cite>, (1803; York PA, 2002), pp 35-6.</span></figcaption>

<blockquote><p>Here it may be demanded whether it be lawful for Christian men to go into the temples of idols. I answer: they may, if they have a calling so to do, and do not communicate with idolaters in their superstitions, or give any honor to idols: but on the contrary, do openly profess, either by word , or by their deeds, or both, that they abhor both the idols and their service. Thus was Elijah present with the priests of Baal. Thus were the three children present when the golden image was worshipped. Thus was the prophet of God present at the altar of Bethel, when Jeroboam stretched out his hand to offer incense to the idol. (1 Kings 13) Thus Paul was present in Athens, and in the places of idolatry, that he might behold their superstitions. (Acts 17; 27) The Protestant princes in the crowning of Maximilian at Frankfurt brought the Emperor to the Church and to the place whereas he was to sit: this done, they returned without doing any reverence at all, and thereby professed their mislike of popish idols, and their service. It may be objected that the prophet of the Lord prayed in the place where idolatry was exercised: because he prayed at the altar of Bethel, for the restoring of the King’s arm. (1 Kings 13:6) Answer: He did not amiss: For to the clean, all things indifferent are clean : and therefore the place, though polluted with idolatry of others , was clean to the clean prophet. And the Jews were commanded, when they were in the midst of idolatrous nations, to worship God towards the Temple at Jerusalem. (1 Kings 8:48; Dan. 6:10) And God heard his prayer, by miracle restoring the king’s arm: and therefore He approved it. And a prayer made in an idolatrous assembly is no approbation of idolatry, if there be an open profession of the mislike thereof: and the prayer be made upon some necessity, as this of the prophets was, that the king might be convinced of his impiety. It may be objected that the prophet, refusing to eat in the place (1 Kings 13:8), should also have refused to pray there. I answer: No, because God appointed abstinence from meat to be the sign of detestation of the idolatry committed in Bethel, and not abstinence from prayer. And this example of the prophet, does not warrant us to be present at idolatrous service, there to worship the true God, because he did not dissemble, but he openly professed the truth against idolaters. On the contrary, if men resolve not to profess their detestation of idolatrous worship, either by word of mouth, gesture, or some other way; but only desire upon curiosity, to see new fashions, and hereupon, enter into the temples of idols; I think they ought not to do it. For they themselves tempt God by so doing; they offend their weak brethren and draw them by their example to do the like. And lastly, by their presence they confirm the obstinate idolaters in their superstition. The like is to be said of them, that curiously without calling go out of the precincts of the Church into idolatrous countries for this end only to see and to be seen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

<blockquote><p>The argument of this paper is that Byzantine Iconoclasm was a response to the rise of Islam. This is an old-fashioned point of view. First advanced by the Byzantines themselves, the theory of Saracen influence was accepted by older scholarship on the subject, and long remained academically respectable. In the last generation, however, it has fallen out of favour. Contemporary literature on the subject, though far from agreed in other respects, is virtually unanimous that, whatever may have been the causes of Iconoclasm, Islam was not among them… the assumption that the Byzantines paid attention to what the successful Arabs believed is now deemed unproven, unnecessary or even incredible. Yet the case for Islam seems so effortless that the determination to exclude it must strike the outsider as an almost wilful exercise of professional scepticism… it is considerably simpler to assume that it was the role of Islam to make epidemic what had hitherto been merely endemic [in Christianity]…</p></blockquote>

<blockquote><p>And it is very frivolous that they have always in their mouth that images are certain visible words of God which help the faith of them that be ignorant. For Paul testifies that faith comes by hearing and hearing by the word of God, not by pictures or images. If any be desirous to have Christ pictured, let him read the holy scriptures, let him have in his hand the gospels, the apostolical epistles, and the Acts of the apostles, and let him be oftentimes present at godly sermons.</p></blockquote>

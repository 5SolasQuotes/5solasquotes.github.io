<main class="wrap"><figure class="quote" id="q-7f9e890881" data-kw="omnipresence purity">
<blockquote><p>What place can defile a spirit? Is light polluted by shining upon a dunghill, or a sunbeam tainted by darting upon a quagmire? What can steam from the most noisome body, to pollute the spiritual nature of God? As he is of purer eyes than to behold iniquity, so he is of a more spiritual substance than to contract any physical pollution from the places where he doth diffuse himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Omnipresence of God</span></figcaption>

<blockquote><p>Grace is unmerited favor; and the grace or favor of God is the source of all good. Peace, according to the usage of the corresponding Hebrew word, means well-being in general. It comprehends all blessings flowing from the goodness of God. The apostle prays to Christ, and seeks from him blessings which God only can bestow. Christ therefore was to him the object of habitual worship. He lived in communion with Christ as a divine person, the ground of his confidence and the source of all good.</p></blockquote>

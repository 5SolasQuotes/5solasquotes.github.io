<blockquote><p>Ver. 9. Think not to say. We have Abraham to our Father.]

The foolish heart is still leaning to this fancy of external relations and privileges. Beware; rest not on these, — the reformed religion, pure ordinances, or a place of esteem possibly amongst the strictest sort of reformed professors.

And do not think you put an obligation on religion, and that it is indebted to you; but pray take heed. God can leave you, and deliver you up to these vain thoughts, and provide Himself without you. He can draw the remotest and unlikeliest to Himself, and let you go.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55acd10433" data-kw="">
<blockquote><p>I will not say but sometimes it may be meet to discover the least error, and it may be by circumstances so aggreged that it may be needful judicially to take notice of it, as when it’s involved with offence and ready to breed schism or scandal, or in such like cases (in which respect there are some things mentioned in the decree, Acts 15, which are not very material in themselves, as the eating of things strangled) yet, we say, it is not simply and always necessary for ministers to press at the convincing of all who maintain something different from truth, or which is supposed to be so by them, if it be of things extra-fundamental, or, which have not direct or palpable influence upon the violating of faith, or corrupting of manners, much less to censure for the maintaining of it. For, it is not of such that these epistles speak: and we see, Rom. 14, and in the epistles to the Corinthians, in the debate about meats and eating of things sacrificed to idols, and such like, wherein though there was still a right side and a wrong, yet does he rather press the forbearing of these debates, than the dipping into them, not astricting men always to follow this or that, providing it be done without breach of unity and charity. Hence it is that although there be somethings he will give no forbearance unto, but authoritatively and ministerially he decides in them, yet in the same epistles there is something amongst the saints that he seeks rather to heal, and to obtain mutual forbearance in, than peremptorily to decide. See Rom. 14:1; Cor. 8:2-3, etc.; Phil. 2:3. … …there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>

<blockquote><p>It is (Men, Brethren and Fathers) a great work that God hath called you to set your heads, and hearts, and hands unto, to rescue truth from the jaws of those monstrous errors, that had almost devoured it; to disburthen the worship of God of those corruptions, that have so long clogged and defiled it; to advise of, and propound such a Government in the Church, as may be most agreeable to God’s word, most conformed to the pattern in the Mount, and to the practises of the best Reformed Churches; …

Had our God cast you upon this work in the most pacate times, and among a People the most prepared for Reformation that any ever were, yet (in it self considered) such is the infinite weight of your employment as might even swallow up all your thoughts.

But then to consider how unprepared the hearts of people are for that which is the work of this age, and this Assembly Reformation, which hath been represented to Prince and People under the odious notion of Brownism, Anabaptism, Church Anarchy, Confusion, in so much that with many, endeavours and assays of Reformation will find no better entertainment, then Hezekiah’s messengers of Reformation did, 2 Chron. 30.10. when the people laughed them to scorn, and mocked them[.]

Nay, with some worse, for so enraged do some burn after their Idolatrous ways, and so mad are they upon their own inventions, that deny them these, and it is to be feared you shall find them in the temper the Abezrites were, scarce anything will pacify them, but the blood of those that have cast down the altar of Baal, and cut down the grove that was by it; Judg. 6.30. Do not Multitudes cry already upon the disuse of some Ceremonies, and the displacing of some Superstitious Priests? do they not cry with Micah, Judg. 18.24. Ye have taken away our Gods and our Priests, and what have we more?</p></blockquote>

But then to consider how unprepared the hearts of people are for that which is the work of this age, and this Assembly Reformation, which hath been represented to Prince and People under the odious notion of Brownism, Anabaptism, Church Anarchy, Confusion, in so much that with many, endeavours and assays of Reformation will find no better entertainment, then Hezekiah’s messengers of Reformation did, 2 Chron. 30.10. when the people laughed them to scorn, and mocked them[.]

Nay, with some worse, for so enraged do some burn after their Idolatrous ways, and so mad are they upon their own inventions, that deny them these, and it is to be feared you shall find them in the temper the Abezrites were, scarce anything will pacify them, but the blood of those that have cast down the altar of Baal, and cut down the grove that was by it; Judg. 6.30. Do not Multitudes cry already upon the disuse of some Ceremonies, and the displacing of some Superstitious Priests? do they not cry with Micah, Judg. 18.24. Ye have taken away our Gods and our Priests, and what have we more?”

— Matthew Newcomen, Jerusalem’s Watch-men, the Lord’s Remembrancers: A Sermon Preached at the Abbey at Westminster, before both Houses of Parliament, and the Assembly of Divines, upon their Solemn Fast, July 7, 1643, (London: Christopher Meredith, 1643), epistle dedicatory.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+%28Men%2C+Brethren+and+Fathers%29+a+great+work+that+God+hath+called+you+to+set+your+heads%2C+and+hearts%2C+and+hands+unto%2C+to+rescue+truth+from+the+jaws+of+those+monstrous+errors%2C+that+had+almost+devoured+it%3B+to+disburthen+the+worship+of+God+of+those+corruptions%2C+that+have+so+long+clogged+and+defiled+it%3B+to+advise+of%2C+and+propound+such+a+Government+in+the+Church%2C+as+may+be+most+agreeable+to+God%E2%80%99s+word%2C+most+conformed+to+the+pattern+in+the+Mount%2C+and+to+the+practises+of+the+best+Reformed+Churches%3B+%E2%80%A6%0A%0AHad+our+God+cast+you+upon+this+work+in+the+most+pacate+times%2C+and+among+a+People+the+most+prepared+for+Reformation+that+any+ever+were%2C+yet+%28in+it+self+considered%29+such+is+the+infinite+weight+of+your+employment+as+might+even+swallow+up+all+your+thoughts.%0A%0ABut+then+to+consider+how+unprepared+the+hearts+of+people+are+for+that+which+is+the+work+of+this+age%2C+and+this+Assembly+Reformation%2C+which+hath+been+represented+to+Prince+and+People+under+the+odious+notion+of+Brownism%2C+Anabaptism%2C+Church+Anarchy%2C+Confusion%2C+in+so+much+that+with+many%2C+endeavours+and+assays+of+Reformation+will+find+no+better+entertainment%2C+then+Hezekiah%E2%80%99s+messengers+of+Reformation+did%2C+2+Chron.+30.10.+when+the+people+laughed+them+to+scorn%2C+and+mocked+them%5B.%5D%0A%0ANay%2C+with+some+worse%2C+for+so+enraged+do+some+burn+after+their+Idolatrous+ways%2C+and+so+mad+are+they+upon+their+own+inventions%2C+that+deny+them+these%2C+and+it+is+to+be+feared+you+shall+find+them+in+the+temper+the+Abezrites+were%2C+scarce+anything+will+pacify+them%2C+but+the+blood+of+those+that+have+cast+down+

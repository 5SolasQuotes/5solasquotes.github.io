<main class="wrap"><figure class="quote" id="q-41deb671e7" data-kw="">
<blockquote><p>Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful. How then shall I acquiesce in their sentence? How can my conscience certainly determine, so as to leave no room for my faith to waver, that whatever they may pronounce is true? This is surely to leave no difference between God and men. For I believe what God says to be true, because he says it, and seek no other reason; but when I hear scripture saying that “all men are liars,” I dare not ascribe so much to man, lest I make him equal to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6220ca2321" data-kw="">
<blockquote><p>There is no hierarchy in the church of Christ (Luke 22:25–26; 2 Cor. 1:24; 1 Pet. 5:3). There is no such thing as a diocesan, cathedral, patriarchal, or metropolitan church, for in the New Testament all churches are equal and all have their own ἐπισκοποι; and believers are nowhere instructed to inquire into the legitimate succession of their ministers, but rather to examine the Scriptures and to remain in the teaching [handed down to them] (John 5:39; Acts 17:11; 1 Tim. 4:13–16; 2 Tim. 1:13–14; 3:14–17). Neither does legitimate succession guarantee purity of doctrine (John 8:39; Rom. 2:28; 9:6). [Such succession] would sooner make salvation dependent on certain specific persons and on impracticable, fallible, and often even impossible historical research.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><figure class="quote" id="q-3e0ab16df0" data-kw="Seat of infallibility">
<blockquote><p>They are not yet agreed among themselves on the seat of this infallibility, nor is it known as yet with whom it ought to be—with the pope or with a council. Some claim this privilege for a council, as is done by all those who believe the pope to be fallible and who on that account wish the council to be above him (as it was decreed in the councils of Constance and Basil and is constantly believed by the French church). Others ascribe it to the pope, as those who maintain that he is superior to a council (as the Council of Trent determined and with it the canonists and Scholastics).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.19</span></figcaption>

</figure><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.”

</figure><figure class="quote" id="q-b6d80b7d0a" data-kw="">
<blockquote><p>Let Peter have the pre-eminence, still there is a great difference between the honour of rank and the possession of power. We see that the Apostles usually left it to Peter to address the meeting, and in some measure take precedence in relating, exhorting, admonishing, but we no where read any thing at all of power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.5</span></figcaption>

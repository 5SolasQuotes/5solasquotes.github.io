<blockquote><p>Thomas Aquinas begins Summa Theologicae Part III with reflections on the Incarnation of Christ… This section of the Summa reinvigorated Chalcedonian Christology in the West… Aquinas repeatedly affirms that Christ remains omnipresent according to his divine nature even while taking to himself a finite and circumscribed human nature, what will come to be known as the extra Calvinisticum in later centuries. Christ’s presence extra carnem, beyond the flesh, in no way separates the person of Christ but rather secures his presence with the Church.” (K.J. Drake, ‘Beyond the Flesh’) . Christ’s Human Nature: an Individual Thing Aquinas: “…although this human nature [of Christ] is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agreements.html">Agreements</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Extra Calvinisticum</cite></span></figcaption>

</figure><figure class="quote" id="q-79f7667f22" data-kw="">
<blockquote><p>Is there any other way the end or goal might exist already [as it must]? There would seem to be only four possibilities: It might exist in the natural object itself; it might exist in a Platonic “third realm”; it might exist in some human intellect, or in another intellect within the natural world; or it might exist in an intellect outside the natural world altogether. But it obviously doesn’t exist in the natural object itself; if the form of an oak were already in the acorn itself, it would be an oak, and it’s not. It cannot exist in a Platonic “third realm” either, at least not if one endorses (as the Scholastic teleological realist does) the Aristotelian realist critique of Platonic realism about universals. Nor can it exist in some human or other intellect within the natural order, at least not without a vicious regress. Humans obviously are not the ones directing acorns and other natural objects (including human beings themselves) to their natural ends… The only possibility remaining, then, is the last one: Final causation in the natural world is intelligible because there is an intelligence altogether outside the natural order that directs natural objects to their ends. To the “How can something non-existent be a cause?” objection to final causation, then, the Thomist’s reply is to say “It can’t. That’s why the final cause of a natural object must exist already as an idea or form in an intellect existing altogether outside the natural order.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, pp. 46-47</span></figcaption>

</figure><figure class="quote" id="q-0edcc5e7a1" data-kw="">
<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds &amp; John Hart touching the Head &amp; the Faith of the Church</cite>, … (London: Bishop, 1584), p. 44</span></figcaption>

</figure><figure class="quote" id="q-c6f3600098" data-kw="">
<blockquote><p>The overall chain of argument, then, goes something like this: Pure reason proves through philosophical arguments that there is a God and that we have immortal souls. This by itself entails that a miracle like a resurrection from the dead is possible. Now the historical evidence that Jesus Christ was in fact resurrected from the dead is overwhelming when in interpreted in light of that background knowledge. Hence pure reason also shows that Jesus really was raised from the dead. But Jesus claimed to be divine, and claimed that the authority of his teachings would be confirmed by His being resurrected. So the fact that He was resurrected provides divine authentication of His claims. Hence reason shows that He really was divine… Of course some of those teachings [of Christ] are taken on the basis of authority, but the point is that the trustworthiness of that authority is something that, it is claimed, can be established by reason.. We can know such-and-such a teaching was true because Christ taught it… and a divine being cannot be in error… Every link in the chain is supported by argument… All I am interested in doing here is sketching out the general strategy that Christian theology has traditionally used in justifying its doctrinal claims, and the point of doing so is to understand where faith fits into the picture… So how does it come into play? This way… suppose that the general strategy just sketched can be successfully fleshed out. Then it follows that if you are rational you will believe anything Christ taught; indeed, if you are rational you will believe it even if it is something that you could not possibly have come to know in any other way, and even if it is something highly counterintuitive and difficult to understand. For reason will have told you that Christ is infallible, and therefore cannot be wrong in anything He teaches. In short, reason tells you to have faith in what Christ teaches, because He is divine. And that is at bottom what faith is from the point of view of traditional Christian theology: belief in what God has revealed because if God has revealed it it cannot be in error; but where the claim that He revealed it is itself something that is known on the basis of reason. Faith doesn’t conflict with reason, then; it is founded on reason and completes reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (Southbend, IN: St. Augustine’s Press, 2008), pp. 155-157</span></figcaption>

terintuitive+and+difficult+to+understand.+For+reason+will+have+told+you+that+Christ+is+infallible%2C+and+therefore+cannot+be+wrong+in+anything+He+teaches.+In+short%2C+reason+tells+you+to+have+faith+in+what+Christ+teaches%2C+because+He+is+divine.+And+that+is+at+bottom+what+faith+is+from+the+point+of+view+of+traditional+Christian+theology%3A+belief+in+what+God+has+revealed+because+if+God+has+revealed+it+it+cannot+be+in+error%3B+but+where+the+claim+that+He+revealed+it+is+itself+something+that+is+known+on+the+basis+of+reason.+Faith+doesn%E2%80%99t+conflict+with+reason%2C+then%3B+it+is+founded+on+reason+and+completes+reason.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+The+Last+Superstition%3A+a+Refutation+of+the+New+Atheism+%28Southbend%2C+IN%3A+St.+Augustine%E2%80%99s+Press%2C+2008%29%2C+pp.+155-157&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc6f3600098.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c6f3600098.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/apologetics#:~:text=The%20overall%20chain%20of%20argument%2C%20then,founded%20on%20reason%20and%20completes%20reason&amp;text=The%20overall%20chain%20of%20argument%2C%20then%2C%20goes%20something&amp;text=it%20is%20founded%20on%20reason%20and%20completes%20reason" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-692bfa9027" data-kw="Hardening|Holy Spirit">
<blockquote><p>God may be said to cause men to err from his ways, and to harden their hearts from his fear, by withholding, upon their provocation, some such supply of his Spirit and actings of his grace as they have formerly enjoyed, to keep up their hearts to the ways and in the fear of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God&#x27;s Withdrawing His Presence, the Correction of His Church</cite>, sermon on Isa. 63:17, 1675</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/judicial-hardening.html">Judicial hardening</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5ef3f2a919" data-kw="Hardening|Holy Spirit">
<blockquote><p>When his light is taken away, nothing remains but blindness and darkness: when his Spirit is taken away, our hearts become hard as stones: when his guidance is withdrawn, we immediately turn from the right path: and hence he is properly said to incline, harden, and blind those whom he deprives of the faculty of seeing, obeying, and rightly executing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/permission-and-hardening.html">Permission and hardening</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/hardening.html">Hardening</a></span></div>
<div class="actions"><button class="copy" data-copy="“When his light is taken away, nothing remains but blindness and darkness: when his Spirit is taken away, our hearts become hard as stones: when his guidance is withdrawn, we immediately turn from the right path: and hence he is properly said to incline, harden, and blind those whom he deprives of the faculty of seeing, obeying, and rightly executing.”

— John Calvin, Institutes of the Christian Religion, 2.4.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+his+light+is+taken+away%2C+nothing+remains+but+blindness+and+darkness%3A+when+his+Spirit+is+taken+away%2C+our+hearts+become+hard+as+stones%3A+when+his+guidance+is+withdrawn%2C+we+immediately+turn+from+the+right+path%3A+and+hence+he+is+properly+said+to+incline%2C+harden%2C+and+blind+those+whom+he+deprives+of+the+faculty+of+seeing%2C+obeying%2C+and+rightly+executing.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.4.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ef3f2a919.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ef3f2a919.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-276fa7e7b7" data-kw="Hardening|Original Sin|Depravity">
<blockquote><p>Thus God is said to harden men, not by positive hardening, or working anything in the creature, but by not working, not softening, leaving a man to the hardness of his own heart, whereby it is unavoidable, by the depravation of man’s nature, and the fury of his passions, but that he should be further hardened. … If you put fire near to wax or resin, both will melt; but when the fire is removed, they return to their natural quality of hardness and brittleness. The positive act of the fire is to melt and soften, and the softness of the rosin is to be ascribed to that, but the hardness is from the resin itself, wherein the fire hath no influence, but only a negative act by a removal of it; so when God hardens a man, he only leaves him to that stony heart which he derived from Adam, and brought with him into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/permission-and-hardening.html">Permission and hardening</a></span></div>

</figure><figure class="quote" id="q-400669531f" data-kw="Hardening|Justice|Reprobation">
<blockquote><p>Thus, God is said to harden a wicked man because of his demerits when, being provoked by that man’s impiety, He takes occasion to withdraw granted grace and to do certain things through which He knows that this man will grow worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Predestination and Reprobation</cite>, ch. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/judicial-hardening.html">Judicial hardening</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus, God is said to harden a wicked man because of his demerits when, being provoked by that man’s impiety, He takes occasion to withdraw granted grace and to do certain things through which He knows that this man will grow worse.”

— John Davenant, On Predestination and Reprobation, ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%2C+God+is+said+to+harden+a+wicked+man+because+of+his+demerits+when%2C+being+provoked+by+that+man%E2%80%99s+impiety%2C+He+takes+occasion+to+withdraw+granted+grace+and+to+do+certain+things+through+which+He+knows+that+this+man+will+grow+worse.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+On+Predestination+and+Reprobation%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F400669531f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/400669531f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-52550c975a" data-kw="Hardening|Author of sin">
<blockquote><p>When God is here spoken of as hardening some of the children of men, it is not to be understood that God by any positive efficiency hardens any man&#x27;s heart. There is no positive act in God, as though he put forth any power to harden the heart. To suppose any such thing would be to make God the immediate author of sin. God is said to harden men in two ways: by withholding the powerful influences of his Spirit, without which their hearts will remain hardened, and grow harder and harder; in this sense he hardens them, as he leaves them to hardness. And again, by ordering those things in his providence which, through the abuse of their corruption, become the occasion of their hardening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God&#x27;s Sovereignty</cite>, sermon on Romans 9:18</span></figcaption>

<main class="wrap"><figure class="quote" id="q-90de0bbebc" data-kw="">
<blockquote><p>But here again it is objected, that all the corruptions of the Church are not to be corrected by such harsh remedies — that they are not to be cut in to the quick — that not even is medicine to be applied to all, but some are to be treated gently, and others submitted to, if they cannot without difficulty be removed.

I answer, that we are not so unacquainted with ordinary life as not to know that the Church always has been, and always will be, liable to some defects which the pious are indeed bound to disapprove, but which are to be borne rather than be made a cause of fierce contention.

But our adversaries are unjust when they accuse us of being excessively morose, as if we had brought the Church into trouble on account of small and trivial errors. For to their other misrepresentations they add this one also, of endeavouring, by every artifice in their power, to extenuate the importance of the things which we have made the subject of controversy; the object being to make it seem that we have been hurried on by a love of quarrelling, and not that we were drawn into it by a just cause. This they do, not in ignorance, but with cunning design, namely, because they know that there is nothing more odious than the rash haste which they impute to us.

And yet they, at the same time, betray their own impiety in speaking so contemptuously of matters of the greatest moment. And is it indeed so, that when we complain that the worship of God was profaned — that His honour was utterly impaired — that the doctrine of salvation was entangled with numerous destructive errors — that the virtue of Christ’s death was suppressed — and that, in short, all things sacred were sacrilegiously polluted; is it indeed so, that we are to be derided and charged with the folly of disturbing ourselves and the whole world besides, to no purpose, with disputes about insignificant questions?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign</cite>, (1544) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 186-87.</span></figcaption>

</figure><figure class="quote" id="q-06fa1177e8" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: …

IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience… Now the proper character of this new practice of holiness is perfection or integrity, which consists in this: …

      5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely.

      6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16.

      7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.</p></blockquote>

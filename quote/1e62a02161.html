<blockquote><p>The Westminster Shorter Catechism has a helpful, biblically-based definition of repentance: Q. 87. What is repentance unto life? A. Repentance unto life is a saving grace, whereby a sinner, out of a true sense of his sin, and apprehension of the mercy of God in Christ, does, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavor after, new obedience. The Heidelberg Catechism gives a good biblical definition of true faith: Question 21. What is true faith? Answer: True faith is not only a certain knowledge, whereby I hold for truth all that God has revealed to us in his word, but also an assured confidence, which the Holy Ghost works by the gospel in my heart; that not only to others, but to me also, remission of sin, everlasting righteousness and salvation, are freely given by God, merely of grace, only for the sake of Christ’s merits. Repentance is turning from sin to obedience. Internally, it is a hatred of sin and a motivation to live in gratitude and love by obeying God’s commands. Externally it is changed conduct. Saving faith is a gift of God in our hearts leading us to trust him alone for our forgiveness, righteousness, and salvation, only because of what Christ has done for us. So, which comes first—faith or repentance? The answer is faith precedes repentance; it is a fruit of saving faith—not the other way around. A person is reconciled to God (justified) by faith alone, not by faith plus works. Yet, faith without repentance is not saving faith. Let me explain by considering what the Bible teaches.</p></blockquote>

<blockquote><p>I. Free-will in lapsed nature cannot without the help of grace do a moral work, which by co-operation of the supernatural end shall be truly good and a work of virtue, so as that by the doer it be referred to God, beloved simply above all, as to the ultimate natural end.

II. Man by the sole strength of nature cannot assent to all supernatural mysteries propounded and explained to him as revealed of God, or because revealed of God, so as the formal reason of his belief is divine revelation.

III. Not only faith itself, but also the first beginning of faith proceeds from the help of grace, and not from the strength of nature only.

IV. The free-will of man in lapsed nature cannot without the help of grace, love God above all simply, even as He is the author of Nature.

V. Man in lapsed Nature, without the help of grace, cannot fulfill all the precepts even of the Law of Nature, nor overcome any great difficulty and temptation, even for any little time, which it is necessary to overcome, for the keeping of that Law.

VI. There is no law, nor ever was made by God, of his giving the actual helps of preventing grace to them that do all that is in them by the sole faculty of nature: nor has Christ merited, or would have, any such law.

VII. God by his helping grace flows into free-will by pre-moving it that it may co-operate; and also, truly-efficiently together with the same free-will, causes its pious operation.

VIII. When God by his exciting grace strikes and touches the hearts of men, He does not expect that the will by its innate liberty begin its motion by consenting: But God by adjuvant [assisting] grace effects that it freely and infallibly consent.

IX. Adjuvant grace and free-will are not partial causes of supernatural consent, as two drawing a boat, so as neither is pre-moved by the other, or makes it co-operate with it.

X. Scientia media [middle knowledge] is not to be ascribed to God—But all prescience [foreknowledge] of the future co-operation of the will, even from the foresaid hypothesis, presupposes in signo rationis [in the sign of reason, or according to man’s conceptions] the free decree of God’s will, by which absolutely (or granting that hypothesis) He will in us, and with us, effect that operation if good, and permit it if evil.

XI. There is on our part no cause, reason or condition assignable for which God’s supernatural providence, in comparison of this or that, has the formal reason of predestination, or retains the common reason of providence: but predestination is to be reduced into the sole free-will of God.

XII. God by an absolute and efficacious decree of his will, antecedently to the prescience of the future good use of free-will, predetermined all good acts which are done in time, specially those by which the predestinate come to eternal life.

XIII. The co-operation of free-will with the gifts of grace is in the predestinate an effect of predestination, and efficiently proceeds from God making us by the help of grace freely to co-operate; and consequently depends not on the sole and innate liberty of the will.

XIV. We must necessarily distinguish of a twofold help of grace: one sufficient, by which man may be converted to God or work piously; the other effectual, by which God effects that he be actually converted and act piously.

XV. The effectual help of preventing or pre-operating grace moves man’s free-will to act, not only by persuading, alluring, inviting or other morally attracting, even inwardly, but also efficaciously and truly effecting that the will moved and excited of God determine itself and act well. XVI. The efficacy of the help of preventing grace and the infallible connection of it with the free co-operation of the will, is totally founded and taken as from its first root, from the omnipotency of God and from the absolute and efficacious decree of his will willing that the man whom He moves be converted and work piously. Nor does this efficacy any way depend, no not as on a condition sine qua non [without which: nothing], on the future co-operation of the created will, though the free act by which man perseveres depend effectively on his will moved by God. XVII. Supposing effectual grace in free-will, it infallibly follows that free-will will consent and act piously. So that these two are incompossible: that effectual Grace be in a man and that he actually dissent. XVIII. The gift of perseverance, as such, and the efficacy of it depends not, no not as on a condition sine qua non on the co-operation of our free-will, but on the absolute decree of God effecting man’s perseverance. XIX. Effectual aid and a power of dissenting are compossible in the same subject and consist in the same will. XX. By preventing-grace-efficacious as aforesaid, the liberty of the will is not destroyed, nor the actual use of it hindered, but is wonderfully perfected and roborated [made strong].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/diego-alvarez.html">Diego Alvarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Twenty Propositions’</cite>, (1620) as translated and excerpted from Richard Baxter, Catholic Theology (London: White, 1675), bk. 1, Conclusion, §II. ‘Alvarez’s Epitome in Twenty Propositions Considered’, pp. 70-74 from Alvarez, Of Divine Grace &amp; the Powers &amp; Liberty of Human Choice, &amp; the Legitimate Harmony of that with the Efficacy of those same Helps, in 12 Books (Lugduni, Cardon &amp; Cavellat, 1620), pp. 494-502 For Baxter’s commentary on these propositions, see his link.</span></figcaption>

<blockquote><p>§XII. For in the State of Grace, restituted or of inchoate reparation, the man who is called is excited and vivified from the lethargy and death of sin by prevenient and preparing grace, so that he may be able to read, hear, understand and meditate on the Word of God; by which means the intellect is illuminated and the will is impelled, and is gradually prepared and disposed, so that he can obey God calling through the Word, believe, and convert himself [Acts 2:40]. Eph. 2:5: “God, even when we were dead in sins, hath quickened us together in Christ… And hath raised us up together, and made us sit together in the heavenly places, in Christ Jesus.” ch. 5:8: “For you were heretofore darkness; but now, light in the Lord. Walk then as children of the light.” v. 14: “Wherefore he saith: Arise, thou that sleepest, and arise from the dead: and Christ shall enlighten thee.” Tit. 2:11-12: “For the grace of God our Saviour hath appeared to all men; Instructing us, that, denying ungodliness and worldly desires, we should live soberly, and justly, and godly in this world.” Rev. 3:20: “Behold, I stand at the gate, and knock. If any man shall hear my voice, and open to me the door, I will come in to him, and will sup with him, and he with me.</p></blockquote>

d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-preparation-unto-salvation/#:~:text=XII.%20For%20in%20the%20State%20of,with%20him%2C%20and%20he%20with%20me&amp;text=XII.%20For%20in%20the%20State%20of%20Grace%2C%20restituted&amp;text=will%20sup%20with%20him%2C%20and%20he%20with%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4cdb14dafa" data-kw="">
<blockquote><p>For Aquinas, a necessary condition for repentance is the recognition of a higher good the realization of which is frustrated by the action of which one repents (Of Evil, quest. 3, art. 13). He compares this to correcting an intellectual error by reasoning back to first principles (an example of which would be the law of non-contradiction). If one is correct about which principles are truly first, then rectifying the error is possible. But if one is incorrect about that, rectifying an error is far more difficult, because one will not have anything more fundamental to appeal to in order to correct one’s mistake about which principles are truly first. Similarly, if one correctly understands which ultimate end will conduce to human happiness, repentance of sin will be much easier than if one is wrong about the ultimate end.</p></blockquote>

</figure><figure class="quote" id="q-9f8dab1808" data-kw="">
<blockquote><p>Therefore, good works do not entirely lose their salutary force by any grave sin. Let it be that they are mortified for a time. Let it be that their force and efficacy of leading to life is blunted, let it be that it is intercepted, let it be that it is suspended; yet it is not taken away, not extinguished, not abolished, not to die; but with the arrival of a new act of penitence and of trust in Christ our propitiator, they are finally revived, because the interposition of the grave sin is removed, they recover their former vigor and do not cease to exercise their force of leading to life, until all who are truly penitent are crowned, redeemed with a diadem of unfading glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>

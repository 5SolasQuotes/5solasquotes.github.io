<main class="wrap"><figure class="quote" id="q-64f61fc0cc" data-kw="">
<blockquote><p>For in a Christian communion there are these different administrations or polities or states, ecclesiastical and civil. … For, 1. Though both agree in this, that there is order in their administrations, yet with this difference that the guides in the church have not a despotical, but Œconomical power only, being not lords over Christ’s heritage, but stewards and ministers of Christ and of the church; the dominion and law-giving power being reserved to Christ alone, as he only [is the] head of the church. But in the other state he has given lordly power, authority, and dominion unto men.

2. Though both agree in this, that man is the common subject of them both, yet with this difference, man by nature being a reasonable and sociable creature, capable of civil order, is or may be the subject of civil power and state. But man by grace called out of this world to fellowship with Jesus Christ, and with his people, is the only subject of church power; yet so, as the outward man of church members is subject to the civil power in common with other men, while their inward man is the subject of spiritual order and administrations.

3. Though they both agree in this, that God is the efficient [cause] and author of them both, and that by Christ, yet not eadem ratione [for the same reason]. For, God as the Creator and Governor of the world is the author of civil order and administrations. But God as in covenant with his people in Christ is the author of church administrations. So likewise Christ, as the essential word and wisdom of God creating and governing the world is the efficient [cause] and fountain of civil order and administrations. But as mediator of the New Covenant and head of the church, he establishes ecclesiastical order.

4. Though they both agree in this, that they have the same last end, viz., the glory of God, yet they differ in their next ends; for the next end of civil order and administrations is the preservation of humane societies in outward honour, justice, and peace. But the next ends of church order and administrations are the conservation, edification, and salvation of souls, pardon of sins, power against sin, peace with God, etc.

5. Hence arises another difference about the objects of these different states. For though both agree in this, that they have the common welfare for their aim and scope, yet the things about which the civil power is primary conversant are bodies, τα βιωτικά (1 Cor. 6:4) or τά πρός τόν βίον, “the things of this life” as goods, lands, honour, the liberties and peace of the outward man. The things whereabout the church power is exercised are τά πρός τόν θεόν, “the things of God” (Heb. 5:1) as the souls and consciences of men, the doctrine and worship of God, the communion of the saints. Hence also they have different laws, different officers, different power, whereby to reduce men to order, according to their different objects and ends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discourse about civil government in a new plantation whose design is religion. Written many years since, by that Reverend and worthy Minister of the Gospel, John Cotton, B.D.; And now published by some undertakers of a new plantation, for general direction and information</cite>, (Cambridge MA: Samuel Green, 1663), pp 6-7.</span></figcaption>

<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>

<blockquote><p>Robert Baillie reminds us that absolute religious toleration is an evil which is to be abhorred. Moreover, the extract is also interesting for his acknowledgment that the more orthodox Independents (such as Jeremiah Burroughs) did not advocate the tolerationist opinions of Rodger Williams and others:

Liberty of Conscience, and Toleration of all or any Religion is so prodigious an impiety, that this religious Parliament cannot but abhor the very naming of it. Whatever may be the opinion of Jo[hn] Godwin, of Mr [Rodger] Williams and some of their stamp, yet Mr [Jeremiah] Burrowes in his late Irenicon [sic] upon many unanswerable arguments explodes that abomination. Likewise our Brethren who seek to be accommodate, will be willing I hope to profess their going along with us, without any considerable dissent, as in the Directory for all the parts of divine worship, so in the confession of Faith and Catechism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Our fathers were exposed to great peril, when they entered into covenant with God, 1643, London, in that immortal bond, known as the Solemn League and Covenant. The Pope, Urban VIII, had engaged all the Roman Catholic powers of Continental Europe in an impious confederacy against the Protestant church, and the cause of liberty in Britain. God blessed the Solemn League and Covenant to defeat their plans.

Our own times are fraught with danger to the church. The complexion, animating spirit, and administration of every civil government in the world is adverse to the government of Messiah, the Prince of the kings of the earth. “The Devil has come down, having great wrath, for he knoweth he hath but a short time.” All the organized systems of worship, as systems which are confederated with these bad thrones, give their power to the beast, in the war which the dragon wages with’ the Lamb. Messiah calls on all his followers to unite in solemn covenanting for the city of our God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick-willson.html">James Renwick Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seasons of Covenanting , 6, no. 5, Covenanter</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Our fathers were exposed to great peril, when they entered into covenant with God, 1643, London, in that immortal bond, known as the Solemn League and Covenant. The Pope, Urban VIII, had engaged all the Roman Catholic powers of Continental Europe in an impious confederacy against the Protestant church, and the cause of liberty in Britain. God blessed the Solemn League and Covenant to defeat their plans.

</figure><figure class="quote" id="q-850ecbb720" data-kw="">
<blockquote><p>That the heavy hand of God upon a Nation, as it is laid on for sin, so for the most part not merely for punishment and destruction, but to discover to us the evil of our doings, that they may be repented of, and put away. And so there is much mercy in the midst of these Judgments, if they be improved to those ends to which their nature is fitted for, and which we are commanded to make of them.

The greatest of these Calamities to those that remain, are but like the sounding of a Trumpet, the giving an Alarm, the shooting off a Warning-piece, the hanging forth of a white Flag, and all speak to this purpose, That though the Sins of a Nation have been exceeding great and provoking, whereby the Anger of the most holy God is justly kindled against them, which he sends these his Judgments to testify, that yet he is willing to put up all former affronts that have been offered, if now at length they will become a reformed People, and with detestation of their sins turn from them unto God and his holy Ways; but if not, that his anger shall not be turned away, but his hand stretched out still, till he hath made a full end of them, and will follow them with judgment after judgment, till they are cast into the lowest hell.

So that you see plainly the Rod, hath a voice, and is a kind of Sermon, but comes nearer to the sense, and will force an observance more than mere words could do. We could choose whether we would read a Bible or good Book, or regard a Minister or godly Neighbour, giving us this very Lesson as plainly, but in a more gentle manner. We could stop our ears, or turn our backs, or harden our hearts against all the most awakening, startling Truths: We could make a pish of the most dreadful threatenings in the Book of God, denounced against those very sins we committed; we could laugh at our Teachers and Reprovers, and scorn at the offers of their love for our recovery.

And when we were sunk into such a deplorable estate, wanting nothing of falling head-long into Hell, but the withdrawing of that miraculous patience which kept us out every moment, then in infinite mercy did our God, who like a wise Physician, suits his potions to the nature of the disease, and temper of his Patients, make bare his Arm, and reveal himself and his pleasure to us, in a way most likely to affect us, if we who yet survive, be not obstinately bent upon our own destruction.</p></blockquote>

<blockquote><p>Controversy XIV: Do good works truly merit eternal salvation? Orthodox Position: No one can be saved without merits; but the root, source, and origin of these merits is Christ. Although God adorns and rewards our works, both in this life and the next, with the most abundant rewards, not only by His mercy but also by justice, due to the previous promise or covenant, however, speaking properly, we do not merit eternal life with them. [Romanist] Position of Bellarmine: Good works are properly meritorious, and this by merit of congruence or condign. The merit of congruence is in relation to moral works performed before justification. For these, by their nature, do not merit salvation, except concerning what is promised to them by God’s goodness. The merit of condign is that by which the reward is entirely due. And this is attributed to good works after justification. The works of the righteous merit eternal life by condign in two ways: first, in reason of the covenant or justice, which makes God our debtor; second, in reason of the intrinsic dignity of these works; for they are proportional to the reward in an arithmetical proportion, as seen in commutative justice. Confirmation of the Thesis:

1. God’s grace and our merit are contrary (Romans 4, 11).

2. Christ merited for us the beginning, middle, and end of salvation (John 2; Acts 3, 4).

3. Good works do not meet the conditions of proper merit, which are contained in this verse: Gratia, si non debes, est gratia. Good works are the fruits of the Holy Spirit, and for that reason, we owe them to God. There is no proportion between our works and eternal life, for here everything is perfect and infinite, there everything is imperfect, as admitted by Scotus and Durandus.

4. The Church Fathers teach this. Bernard says that our merits, that is, our works, are the way to the kingdom, not the cause of the kingdom. And Augustine: “In your justice, Lord, not in mine. Not because I deserved it, but because you had mercy.” And also: “All my hope is in the death of my Lord. His death is my merit, my life, and resurrection. My merit is the mercy of the Lord. I will not lack merit as long as the Lord of mercies does not lack me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db6e52eb0d" data-kw="">
<blockquote><p>The question also arises, whether it was strictly speaking through his passion and death that Christ merited this glory for his human nature. And whereas we really do not wish to enter into a dispute with those who make this claim,† since Christ certainly did obtain it for us by the worthiness of what He merited, yet we are of the opinion that the opposite point of view, which is shared by many Reformed writers, rests upon arguments that are stronger. The chief one of these is that the glory was owed to Christ by the right of his hypostatic union, and as the Son’s, and as the Son’s rightful inheritance (Ps. 2:7-8; Heb. 1:2). And so, by the consensus of all theologians, that hypostatic union does not follow upon any merit, nor the things which necessarily and by God’s decree followed it–which is why the apostle Paul also uses the word [karisasthai] ‘to bestow as gift’ in this context (Phil. 2:9 [‘and given Him’]).</p></blockquote>

<blockquote><p>But 2. let us understand that according to works signifies an analogy or measure of good works and of evil, as it may fitly be understood, and we also have elsewhere interpreted. There is then an ambiguity in the word ‘analogy,’ or ‘proportion,’ and we must distinguish between a proportion causal, meritorious, and a proportion-conditional. A causal, meritorious proportion of works and reward is when greater or lesser works are the cause or merit of a greater or lesser reward. A conditional proportion is when greater or lesser works are not the cause or merit, but only the position of the condition under which a greater or lesser reward is to be had. In evil works or sins, there are both proportions, causal or meritorious, and conditional of the works to the reward. Of good works, this proposition is false: ‘According to whose proportion eternal life is promised, that is meritorious of eternal life.’ For here is understood not a causal, but a conditional proportion, etc. For they have not the conditions of merit properly so called; but they are the position (or performing) of the condition on which God does promise and distribute the rewards of eternal life and glory.</p></blockquote>

</figure><figure class="quote" id="q-d8aa891617" data-kw="">
<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.”

— Conrad Bergius, Praexi Cathol. Divin. Canon., Dissertation 7, pp. 963-64 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+the+Papists+err+grievously+when+they+confuse+works+taken+generally+with+merits%2C+and+as+soon+as+they+hear+of+a+pious+work+being+commanded%2C+immediately+understand+merit+and+a+work+spoken+of+in+a+legal+sense.+Likewise%2C+when+they+hear+that+a+reward+is+promised%2C+they+again+understand+it+juridically+and+legally%2C+as+in+some+contract+of+hiring+and+payment%3B+whereas+reward+is+commonly+called+whatever+we+obtain+after+preceding+labor+and+difficulties%2C+whose+fear+might+have+deterred+us+from+a+good+purpose%2C+and+which+are+compensated+by+the+sweetness+of+the+good+that+follows.+Such+are+not+only%3A+%281%29+the+rendering+of+a+good+to+which+a+preceding+work+corresponds+in+equal+worth+%28that+is%2C+merit+of+condignity%29%E2%80%A6+%E2%80%A6+%283%29+Likewise%2C+the+execution+of+a+promise+made+under+a+condition%E2%80%94not+only+of+gratefully+accepting+and+not+despising+the+gift+%28for+no+donation+is+so+free+and+pure+as+not+to+include+this+condition%29%2C+but+also+of+a+certain+work%2C+besides+acceptance+and+gratitude%2C+required+in+addition%E2%80%94which+therefore+is+in+some+sense+meritorious%2C+although+there+is+perhaps+no+equality+or+commutation+between+the+work+and+the+promised+reward%3B+as+if+a+father+promises+a+jewel+to+his+son+who+takes+bitter+medicine%2C+or+a+prince+promises+a+prize+to+a+subject+engaged+in+an+exercise+or+contest+beneficial+to+him.+In+this+case%2C+the+donation+is+not+purely+free%2C+since+the+thing+does+not+begin+to+be+owed+as+soon+as+the+promise+is+accepted%2C+but+only+when+the+condition+is+fulfilled%3B+nor+is+it+properly+merit+of+condignity%2C+since+the+worker+benefits+himself+rather+than+giving+something+ <blockquote><p>First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.</p></blockquote>

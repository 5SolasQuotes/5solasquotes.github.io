<blockquote><p>33. The divine ideas, therefore, are not the creatures themselves known by God, but are objective reasons, that is, the divine essence itself, conceived by God, insofar as it is imitable by created things: so that the divine exemplar is infinitely more perfect than created things, since it is the divine essence itself known as imitable. 34. But they express the things themselves, because the divine essence, which holds the nature of an idea, insofar as it is known by God, as in tablets by creatures, eminently contains man, for example, of whom it is the idea, as it is imitable by him, and similarly the other things, and represents them most perfectly. 35. The ideas are removed and separated from the commerce of matter and the concretion of singulars. 36. They are eternal, stable, unchangeable, and incorruptible. And they themselves are not formed: just as neither are created ideas made by an artificer, as Plato rightly teaches in the tenth book of the Republic, not far from the beginning. 37. They agree in part with created ideas and in part differ from them. They agree in that both are objective reasons: they differ in that the ideas of the supreme Architect are not things which he intends to produce, as the created ideas of a created artisan. The reason for this distinction is that in the divine essence, which is the primary object of divine understanding, all things that can be made are contained and reflected; therefore, it is necessary that God, in making any work, principally regards the idea of it in his mind and primarily imitates it. In the created artisan, however, the matter is not so, who sometimes changes something as the situation arises and does not always imitate the idea first conceived. They also differ from the conjoined forms of things. For ideas are objective forms, from which imitation is taken, and they always remain outside the essences of made things, not becoming part of them: but the conjoined forms of things are [Hebrew or Greek] forms, constitutive, and part of composite things. Furthermore, ideas are the prototypical reasons of things, of which they are the exemplars: but the conjoined forms, induced into things by God the Creator, are certain principled likenesses of them, which by informing matter comprehend essence.</p></blockquote>

</figure><figure class="quote" id="q-57a97c89f5" data-kw="">
<blockquote><p>Secondly, that which is the only foundation of a scruple in this case, is a principle most unreasonable in itself, that we are to embrace nothing for truth, though divinely revealed, but what our reason is able to comprehend, as to the nature of the thing, and the manner of its existence; on which account the doctrine of the Trinity, Incarnation, Satisfaction, and consequently the whole mystery of the Gospel of Christ must be rejected as incredible, and that on this bare pretense, because although many expressions in Scripture seem to import all these things, yet we are bound to interpret them to another sense, because this is incongruous to our reason. But although Christianity be a religion which comes in the highest way of credibility to the minds of men, although we are not bound to believe anything but what we have sufficient reason to make it appear that it is revealed by God, yet that anything should be questioned whether it be of divine revelation, merely because our reason is to seek, as to the full and adaequate conception of it, is a most absurd and unreasonable pretence: And the assertors of it must run themselves on these unavoidable absurdities: First, of believing nothing either in nature or religion to be true, but what they can give a full and satisfactory account of, as to every mode and circumstance of it. Therefore let such persons first try themselves in all the appearances of nature: And then we may suppose they will not believe that the sun shines, till they have by demonstrative arguments proved the undoubted truth of the Ptolomaic or Copernican hypothesis, that they will never give credit to the flux and reflux of the Sea, till they clearly resolve the doubts which attend the several opinions of it. That there is no such thing as matter in the world, till they can satisfactorily tell us how the parts of it are united; nor that there are any material beings, till they have resolved all the perplexing difficulties about the several affections of them; and that themselves have not so much as a rational soul, till they are bound to satisfy us of the manner of the union of the soul and body together. And if they can expedite all these, and many more difficulties about the most obvious things…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Origines Sacræ, or, A Rational Account of the Grounds of Christian Faith</cite>, ... (London, 1662), bk. 2, ch. 8, pp. 233-34</span></figcaption>

</figure><figure class="quote" id="q-62d6ab6209" data-kw="">
<blockquote><p>With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-barker.html">William S. Barker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘The Westminster Assembly on the Days of Creation: a Reply to David W. Hall’ in Word to the World (Ross-shire, UK: Christian Focus Publications, 2005), pp. 259-70, pp. 263, 265-66</span></figcaption>

<div class="actions"><button class="copy" data-copy="“With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.”

<main class="wrap"><figure class="quote" id="q-829674cc1a" data-kw="">
<blockquote><p>James Fergusson, an early Covenanter minister, explains that the Sectaries adopted a latitudinarian view of admission to communion, thinking that church censure only applied to deniers of fundamental doctrines. Conversely, the Presbyterian Covenanter position was that those who persist in unconfessional error are to be subjected to ecclesiastical discipline:

A Church Toleration is, That whereby it is pleaded that Error and Heresy should have liberty to be vented and go free even from Church Censure; such as suspension from the Sacraments or Excommunication. There are but few Sectaries of any note that plead for Toleration in this Latitude, and that because the Scripture is so plain against it, Paul says, An Heretic after the first and second Admonition reject. Therefore they are content that Church-censures such as Excommunication be inflicted on Heretics, providing, First, that they be free from Civil censure. Secondly, That Excommunication be inflicted for no Error, but for these that are contrary to fundamental points of Truth, or as some say contrary to the very light of Nature: Upon these and no other will they have excommunication to strike.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors of toleration, Erastianism, Independency and separation. Delivered in some sermons from I John 4.1. Preached in the year 1652. To which are added four sermons preached on several occasions</cite>, (1652; Edinburgh, 1692), p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-f594b3694b" data-kw="">
<blockquote><p>Now on the other side, if after the truth shall be truly tried out, it shall be found, that the substance of bread is the natural substance of the Sacrament, although for the change of the use, office and dignity of the bread, the bread indeed sacramentally is changed into the body of Christ, as the water in Baptism is sacramentally changed into the fountain of regeneration, &amp; yet the natural substance thereof remaineth all one, as was before: if (I say) the true solution of that former question (whereupon all these controversies do hang) be, that the natural substance of bread, is the material substance in the Sacrament of Christ’s blessed body:

[T]han must it needs follow, of the former proposition (confessed of all that be named to be learned, so far as I do know, in England) which is, that there is but one material substance in the Sacrament of the body, and one only likewise in the Sacrament of the blood: that there is no such thing in deed and in truth, as they call Transubstantiation: for the substance of bread remaineth still in the Sacrament of the body: than also the natural substance of Christ’s human nature, which he took of the virgin Mary is in heaven, where it reigneth now in glory, and not here enclosed under the form of bread: than that godly honour, which is only due unto God the creator, may not be done unto the creature without idolatry and sacrilege, is not to be done unto the holy Sacrament.

Than also the wicked, I mean the impenitent murderer, adulterer, or such like, do not receive the natural substance of the blessed body &amp; blood of Christ. Finally than doth it follow, than Christ’s blessed body &amp; blood, which was once only offered &amp; shed upon the cross, being available for the sins of all the whole world, is offered up no more, in the natural substance thereof, neither by the priest nor any other thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-ridley.html">Nicholas Ridley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief declaration of the Lord’s Supper, written by the singular learned man, and most constant martyr of Jesus Christ, Nicholas Ridley Bishop of London prisoner in Oxford, a little before he suffered death for the true testimony of Christ</cite>, (Emden: E. van der Erve, 1555), unpaginated.</span></figcaption>

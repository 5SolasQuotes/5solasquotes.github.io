<main class="wrap"><figure class="quote" id="q-921c757d4a" data-kw="">
<blockquote><p>We learn, therefore, from this law in the second place, not only that it is God whom we ought to love above all things, but also that H̲e̲ b̲y̲ H̲i̲s̲ n̲a̲t̲u̲r̲e̲ l̲o̲v̲e̲s̲ n̲o̲t̲ o̲n̲l̲y̲ m̲a̲n̲ b̲u̲t̲ a̲l̲l̲ H̲i̲s̲ c̲r̲e̲a̲t̲u̲r̲e̲s̲. For unless He loved them, He would not create them, sustain them, live and work in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ulrich-zwingli.html">Ulrich Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>𝘛𝘩𝘦 𝘓𝘢𝘵𝘪𝘯 𝘞𝘰𝘳𝘬𝘴 𝘰𝘧 𝘏𝘶𝘭𝘥𝘳𝘦𝘪𝘤𝘩 𝘡𝘸𝘪𝘯𝘨𝘭𝘪, ed. William John Hinke, vol. 2 (Philadelphia: Heidelberg Press, 1922), ch. 5, “Reproduction from Memory of a Sermon on the Providence of God”</cite>, p. 168</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“We learn, therefore, from this law in the second place, not only that it is God whom we ought to love above all things, but also that H̲e̲ b̲y̲ H̲i̲s̲ n̲a̲t̲u̲r̲e̲ l̲o̲v̲e̲s̲ n̲o̲t̲ o̲n̲l̲y̲ m̲a̲n̲ b̲u̲t̲ a̲l̲l̲ H̲i̲s̲ c̲r̲e̲a̲t̲u̲r̲e̲s̲. For unless He loved them, He would not create them, sustain them, live and work in them.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c387c9c582" data-kw="">
<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jonah, ch. 4, verse 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-96d45ff267" data-kw="">
<blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>

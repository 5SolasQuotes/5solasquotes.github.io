<blockquote><p>Again, it is said, That if this Doctrine be true, then it follows, that God creates Men to damn them. This seems to be a ready-hand Argument, almost in every ones Mouth that denies the Doctrine.

Before we speck to any Words or Propositions, we ought to understand what is meant by them. Now and the Meaning I can conceive in this Sentence, [God creates Men to damn them] consistent with the Propriety of Speech, is, that their Damnation is God’s End in creating them; the final Cause and Reason of his bringing them into Being: And this imports in it that God loves, and delights in the Punishment and Misery of Creatures, merely as such, and for its own Sake; which is a Thing most blasphemous to suppose of him.

To suppose, that the Misery of any Creature, strictly and abstractly in itself, without any other Consideration, is agreeable and pleasing to God; yea so agreeable, that he makes them for this very End that he may have the Pleasure of punishing them; is indeed, to represent him like the very worst of Beings But then I would ask, Does God’s decreeing to punish Men for their Sin, as they deserve, for maintaining the Dignity of his Government, and the shewing forth of his infinite Holiness, Justice, and rightful Authority; does this, I say, bear in it any such Thing, as that he delights barely in the Misery of Creatures, so as to create them for the Sake of it? How irrational is such a Consequence?

But if any will yet insist on it, as a just Consequence, I desire them to consider a little, how they will free their own Scheme of it; which is every whit as liable to the Charge: Unless they have stupid Ignorance, and blasphemous Presumption enough, to deny God’s infinite Understanding and Fore-knowledge of all Things, it is just as reasonable to bring this Objection against the Arminians, as the Calvinists; and say, that God creates Men to damn them, if he knows before-hand, that he will damn them; if he fore-knew that they would die impenitent, in Unbelief; and thereupon has decreed their Damnation, before he has created them.

The Truth in the Matter is this, God decreed to create all Men for the Manifestation of his own Glory, which is his End in all his Works; and looking upon Mankind in their Apostacy and Sin, he decreed to leave a particular Part of them in that State, and to punish them according to their Sin, for the Manifestation of the Glory of his Sovereignty, Holiness and Justice, and the right and infinite Obligations of his Authority, as a Law-giver over his reasonable Creatures. This View of the Case gives no Ground for the Charge contained in the Objection.

Tho’ God foresees that Mankind will sin against him, cannot he, notwithstanding, create them; and determine to punish them, or any Part of them, as their Sin deserves, for the Illustration of his Glory aforesaid; without being chargeable with creating them, just that he might damn them? To say so, is the same Thing as to say, that the Sin and Default of the Creature, must bind up God’s Hands from doing that which is in itself every Way reasonable and Right; And in short, to say, that right is wrong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-blair.html">Samuel Blair</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine of predestination truly and fairly stated: confirmed from clear Scripture-evidence, and defended against all the material arguments and objections advanced against it</cite>, (Philadelphia PA: B. Franklin, 1742), pp 25-27.</span></figcaption>

<blockquote><p>XXIII. There is in man a twofold judgment, to wit, an antecedent, which is that of the affections and senses; and a consequent, which is that of reason: so there is a twofold volition: the one follows the judgment of sense, and it is rather an imperfect desire than a perfect volition; the other follows the judgment of reason: both these volitions were in Christ more eminently than in us, because in Him were two wills, and these, by reason of his two natures, were distinct in Him, though his person was but one; therefore He desired the cup might pass from Him, but willed it not; or, He willed it by his antecedent, not by his consequent will. O Thou that madest in Thyself the judgement of affection stoop to the judgment of reason and madest thy desire subservient to thy will, and causedst thy antecedent will to give place to thy consequent: produce in me the same effect, that these sinful delights which my affections so earnestly run after, and thy gentle corrections, which they so earnestly run from, may be so ordered that the one by me may be courageously subdued, the other patiently endured, that my affections may submit to my will, my will to reason and reason to thy Spirit.</p></blockquote>

<blockquote><p>II. This punishment (this disobedience having been posited) the divine nature first of all requires, for God is a consuming fire who cannot bear sin (Deut 4:24, Hab 1:13). Yet we do not want God to act irrationally (just as elementary fire), but most rationally, concomitantly to his nature but not antecedently, for he is a rational and intelligent fire who, although he can transfer the burning to another combustible thing, yet cannot suspend it totally:

      1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20).

      2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions, which does not happen unless by vindicating the contempt of himself which he suffers through sin, which is not expiated except through punishment.

      3. The supreme Lord by necessity of nature requires supreme acknowledgment of himself, which is denied to him through sin, which cannot be repaired except through the acknowledgment of the despiser by which he may experience how grave and sad is the contempt of his master. And these things are so true that even in civil affairs, neglect of his majesty cannot consist with the supreme magistrate; nor therefore through this is God rendered impotent, as the Socinian Gitichius deduces from this (Against Lucius, Argument 2). For he cannot deny himself (2 Tim 2:13) nor his glory. Secondly, the truth of the divine threats, by which the highest torments await sinners, demands this punishment (see the previous thesis).

III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied. But what can man do for this? His demerit is infinite (by the previous thesis)… IV… Hence fall:

      1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

      2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

      3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

      4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said.</p></blockquote>

<blockquote><p>It seems, I confess, by its more obvious aspect [in the term ‘will of sign’, which is often misunderstood], too much to countenance the ignominious slander which profane and atheistical dispositions would fasten on God, and the course of his procedure towards men; and which it is the design of these papers to evince of as much absurdity and folly, as it is guilty of impiety and wickedness: as though He only intended to seem willing of what He really was not; that there was an appearance to which nothing did subesse [exist under]. And then why is the latter called voluntas [will]? unless the meaning be, He did only will the sign; which is false and impious;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-679abe25a6" data-kw="">
<blockquote><p>ALL you that make a profession of God, and of Christ, try your selves with the Light that sheweth you sin in your Consciences, and see whether you have fellowship with the Father and the Son, 1 John 1. 3. for all they who have not fellowship with the Father and the Son, are not of the Church of Christ, for his Church is his body, Col. 1. 18. and he is the Head, and the body hath fellowship with the Head; and he that hath fellowship with the Son, hath fellowship with the Father also; for the Father and the Son is one eternal Power by whom all things were made, John 1. 1, 2, 3. and he is pure and holy, and they that have unity with him, must be holy as he is holy, 1 Pet. 1. 15. else there is no unity, 2 Cor. 6. 14. nor fellowship; for this holy God, (Mal. 3. 6.) is an unchangeable being, who cannot be reconciled to any thing which is not of himself, because he is holy, pure and immortal; and all other beings that are not one with this pure being, hath an end, 1 Cor. 15. 28.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sound out of Sion from the holy mountain which the Lord is establishing above all the mountains. Declaring the salvation of God which is near to be revealed to the captivated seed that waits for redemption. And the deceit of sinners laid open and witnessed against who make a profession of God, and</cite>, (London: William Warwick, 1663), p. 1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“ALL you that make a profession of God, and of Christ, try your selves with the Light that sheweth you sin in your Consciences, and see whether you have fellowship with the Father and the Son, 1 John 1. 3. for all they who have not fellowship with the Father and the Son, are not of the Church of Christ, for his Church is his body, Col. 1. 18. and he is the Head, and the body hath fellowship with the Head; and he that hath fellowship with the Son, hath fellowship with the Father also; for the Father and the Son is one eternal Power by whom all things were made, John 1. 1, 2, 3. and he is pure and holy, and they that have unity with him, must be holy as he is holy, 1 Pet. 1. 15. else there is no unity, 2 Cor. 6. 14. nor fellowship; for this holy God, (Mal. 3. 6.) is an unchangeable being, who cannot be reconciled to any thing which is not of himself, because he is holy, pure and immortal; and all other beings that are not one with this pure being, hath an end, 1 Cor. 15. 28.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, 3rd National Synod of Charenton 1644 / 1645, ch. 10, p. 455</span></figcaption>

</figure><figure class="quote" id="q-7610f0052e" data-kw="">
<blockquote><p>Therefore, “the law entered,” [Rom 5:20] that Adam’s offence and their own actual transgression might abound, so that now the Lord saw it needful, that there should be a new edition and publication of the covenant of works, the sooner to compel the elect unbelievers to come to Christ the promised seed, and that the grace of God in Christ to the elect believers might appear the more exceeding glorious. So that you see the Lord’s intention therein was, that they, by looking upon this covenant, might be put in mind what was their duty of old, when they were in Adam’s loins; yea and what was their duty still, if they would stand to that covenant, and so go the old and natural way to work; yea, and hereby they were also to see what was their present infirmity in not doing their duty:f that so they seeing an impossibility of obtaining life by that way of works, first appointed in Paradise, they might be humbled, and more heedfully mind the promise made to their father Abraham, and hasten to lay hold on the Messiah, or promised seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of Thomas Boston: An Explication of the Assembly’s Shorter Catechism</cite>, ed. Samuel M‘Millan, vol. 7 (Aberdeen: George and Robert King, 1850) 202–03. From Boston’s notes on The Marrow of Modern Divinity.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

he-marrow-on-pedagogical-republication/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ebc8cf72cc" data-kw="">
<blockquote><p>They sympathize with the condition of all distressed saints, wherever they are, and thereby hold communion with all saints in the world, all Churches of Christ throughout the universe. And from this compassion and love it is, that they feel an ineffable pleasure and satisfaction in their souls whenever they understand and hear of, or behold the success of the family of God, the prosperity of his people, and the spreading of his kingdom in the world. … Those that hold communion with God and his Son Jesus Christ… do necessarily maintain a Communion and Society with those that are the children of God, and the members of Jesus Christ… …When Peter was cast into prison, ‘Prayer was made without ceasing of the Church unto God for him,’ Acts 12:5. There is a continual stock of prayers, a common bank, whereby a constant traffic and exchange is kept up among the saints. This is called by the apostle, ‘supplication for all saints,’ Eph. 6:18, whereby they are ever partaking of the benefit of the petitions and addresses that are put up to the Divine Majesty throughout the whole world. And accordingly the fellowship of all Christians dispersed over the whole earth is preserved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologia Reformata</cite>, … (London: 1713), ‘The Latter Part of the 9th Article, Namely, the Communion of Saints, where the Nature of this Communion is Explained…’, pp. 747-48</span></figcaption>

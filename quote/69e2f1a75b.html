<main class="wrap"><figure class="quote" id="q-69e2f1a75b" data-kw="">
<blockquote><p>3rd Problem. Whether God is universally perfect, as it were having in Himself the perfection of all things? Answer: Affirmed—provided you distinguish the “having,” or the “containing,” into the virtual or eminent and the formal. For certain perfections are in God formally, as life, goodness, intellect, will, etc. But certain others only virtually or causally, as in a producing and conserving cause, but not formally—as, e.g., sensitive life, corporeal perfections, and all the other specific perfections of the stars, elements, minerals, plants, animals, etc. According to this distinction, the Enthusiastic frenzies are to be refuted; and rightly are to be explained the texts which say that all things are, or subsist, in God. By this same distinction is determined another Problem, which occurs a little later in my syllabus: Whether created perfections can be in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations | ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin</cite>, vol. 5 (1669)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>§13… 3. The will of God is also most free, inasmuch as it is determined by no cause outside God, and this on account of the independence of the divine essence… Meanwhile it is inquired concerning the will of God tending toward creatures (which we have called free, because in them alone a possible existence can be conceived) whether God has willed and wills them with a freedom of indifference. We, if anyone by the indifference of God understands that the will of God in decreeing was not determined by the objects regarded in the decree, acknowledge that all things which are proposed to the decree as possible must in themselves be conceived as indifferent toward futurition, involving no necessity in their concept that they should be made, or compelling God to determine anything. If also by the indifference of the freedom of God anyone understands the sufficiency of God, whereby, being in need of nothing outside Himself, He did not need to seek the supply of any deficiency outside Himself, and therefore to deliberate concerning the production of creatures—in this respect also we acknowledge that God acted with a freedom of indifference. Which, however, is not to be extended so far as though, the will to manifest His glory being posited, His freedom was not determined by His own decency [decentia], which did not admit that He should will otherwise than what is consonant with His glory and virtues. But whether God was so indifferent to creation itself and the manifestation of His glory, considered antecedently to the decree, that He could decently also not create, or not will to manifest His glory, is a problem which is debated among learned men, worthy of further investigation. You may see here the celebrated Wittichius of blessed memory and the celebrated Roëllius disagreeing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed… (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</cite></span></figcaption>

<blockquote><p>’The sun and the moon stood still in their habitation’ – they stood still in their several spheres wherein they move, for these be their habitations, and note that they both stood still, sun and moon. For the moon borrowing all her light of the sun, had she kept her course while the sun had stool still the length of a day, there had been great irregularity of motion in these celestial bodies, from the constant order set them by their Maker in their creation. Observe also, he does not say the earth stood still, but the sun: it had been, as some said, the earth and moon stood still as the sun and moon, and our understanding would have soon apprehended, if that new astronomy had been then revealed, which some of our empericks, and journeymen in that excellent science of astronomy have late revived in their almanacs, telling the world that they have long been in a wrong belief, that the sun moves and the earth is fixed, for they believe that the sun is fixed, and the earth is moved. And to evade the clear evidence of the text, which tells it for a wonder that the sun stood still, they say, this is spoken to our capacity, because to our sight it so seems, that the sun moves and the earth is fixed, but indeed it is otherwise. Our capacity I think has much wrong done in this, for if the Word of God had told us that God had created the sun to stand still, and the earth to move, it is more likely that we should have taken his word for it, and have believed it as it is, as well as we now believe it, as it appears. We are neither incapable nor incredulous, but that many against the letter of Scripture have written, and made more believe, that the sun stands still from the creation. The common defence of this opinion grounded on God’s application of himself, to human capacity, does make figures in a story where is no need, and makes David a man of small judgement in the knowledge of the sun, who says, that God ‘hath set a tabernacle for the sun in the heavens’ (called here) a habitation, ‘which is a bridegroom coming out of his chamber, and rejoiceth, as a strong man, to run his race.’ His going forth is from the end of the Heaven, and his circuit unto the ends of it. Does not this prophet speak of the glory of God, declared in the motion, not the station of the sun? or in the glory of God showed in our opinion of the sun’s motion, not in the truth thereof. Greater secrets then this are revealed in holy Scripture, which are against the vouchie of the outward sense, or the rational discourse of man, and no doubt, but if the sun had stood still, and the earth that we live upon had moved, when this miracle was by the spirit of truth recorded, it had been so set down to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-marbury.html">Edward Marbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary or Exposition upon the Prophecy of Habbakuk... (London, 1650), on Hab. 3:11</cite>, pp. 127-128</span></figcaption>

<blockquote><p>All creatures and created beings compared with God, the first being of Himself subsisting, and the infinite God may be denied, to be beings comparatively: And so our created self is nothing, to wit, nothing in dignity, or excellency beside God, or nothing in the kind of a being that essentially is of itself: as God is in genere entis per essentiam, yet man is a being in the kind of being by participation, in genere entis per participationem; man comared with God, is a poor, worthless, sorry, little-nothing, a weeping, melting, evanishing cipher… So the Scripture says, ‘Man at his best state is altogether vanity.’ Ps. 39:5, ‘Behold, thou hast made my days as a handbreadth, and mine age is nothing before thee: verily every man at his best state is altogether vanity.’ Isa. 40:17, ‘All nations before Him are nothing, and less than nothing, and vanity.’ Yet a heathen may say and think and demonstrate by reason that self and man, and all the world are less in incomparison of the infinite God than nothing to all things, a drop of water to the sea, the shadow to the body, a peny-torch to the light of ten thousand millions of suns in one;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-af95c11a73" data-kw="">
<blockquote><p>Look even to the Synod of Ulster. While that church was unfaithful to her Lord, and had allowed her standards to fall into disuse; error, it is admitted, crept into and devastated her borders. But fearless men arose within her to “contend for the faith,” and uplift again her ancient testimony, and now, having shaken off the incubus that prostrated her energies, she is walking forth over the land with brightening vision and buoyant tread, having favour with her Lord, and going forth to his help against the embattled hosts of the mighty.

Her past redemption from error she achieved, her present steadfastness in the truth she maintains, and all without the aid of a liturgy. How? By the blessing of God on the means she used, not the “conservative resource” of preaching merely, but the resumption of her ancient formularies, and the exercise of a discipline which the Presbyterianism of her government enabled her to wield.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-porter-goudy.html">Alexander Porter Goudy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse IV. Worship of the Presbyterian Church in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f801482aa" data-kw="">
<blockquote><p>Is it not the same Christians whom you then derided, and now revile at, and condemn as Children of the devil: O miserable man! Is all your hearing and praying come to this? Dare you meet the Messengers of Christ in the face, and tell them they are Liars and deceivers?

Dare you cast out the holy worship of Christ as false worship, and seek to draw people into the contempt of it? Dare you damn those Churches and millions of Saints that Christ hath bought with his precious blood? Dare you seek to draw men to hate their Teachers whom Christ hath set over them, and to hate his people as if they were the Children of the Devil, and to hate his worship and holy ways?

Alas that ever a man in his wits should look upon such abominations as amiable, and much more that any man should be so mad as to do this under the Name and profession of a Christian! That you can imagine that the furious opposition to the whole Army of Christ, his Officers, Church and Ordinances, can yet be a work that Christ accepteth: That you should no better know Christ’s work from Satan’s, nor know that it is the Dragon whose warfare these men do manage?

I must needs profess that it is a very grievous thing in mine eyes, that after all our pains with men’s souls, and after the rejoicings which we had in their seeming conversion, and zealous lives, we should yet see so much ignorance, levity, and giddiness of professors, as that they are ready to entertain the most horrid abominations!

That the devil can no sooner bait his hook, but they greedily catch at it, and swallow it without chewing; yea, nothing seems too gross for them, but so it seems Novelty all goes down. I am afraid if they go a little further, they will believe him that shall say, The Devil is God, and to be worshipped and obeyed. Shall I freely tell you whence all this comes? Even from hellish pride of heart: You see it not (it’s like) in your self or in them, but I shall endeavour to make you see it both in your selves and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-796a2944fa" data-kw="">
<blockquote><p>Though in some cases as we are warranted, so we are necessitated to withdraw, yet neither do we allow it upon slight or slender grounds; nor can any tender soul be forced to discountenance the ministers of Christ (I do not speak here of the prelatic curates) without great reluctancy and grief of heart, even when the grounds of it are solid and valid, and the necessity unavoidable: Therefore we reject these as insufficient grounds, besides what are given already:

1. We cannot withdraw from a minister for his infirmities and weaknesses, natural, spiritual or moral.

2. Neither for personal faults and escapes; we expect a faithful but not a sinless ministry.

3. Nor for every defect in faithfulness through ignorance, want of courage, misinformation, or being biased with affection for particular persons. We do not hold that faults in members, or defects in ministers do pollute the ordinances, and so necessitate a separation; but agree with what Mr. Durham says on Revelation, ch. 2, lect. 6, ‘Sincerity discovered will cover many faults.’

4. Nor for every discovery of hypocrisy: Though we may have ground to suspect a man’s principle and motive be not right, yet if he be following duty unblameably, and have a lawful call, what then? “Notwithstanding every way, whether in pretense or in truth, Christ is preached; therein we may rejoice,” Phil. 1:18.

5. Nor yet for real scandals not attended with obstinacy, if ministers will take reproof and admonition, and at least by doctrinal confessing, and practical forsaking them, satisfy the offended, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>Nothing begets so great an aptness in men to receive errors as this sinful admiration. Affection commonly makes men take down falsities; and error is easily received from them whom we much admire; and God does often leave admired teachers to err, for trial of the people, and the punishing of their vanity, in making God’s truth to stand at the devotion of the teacher for its acceptance, and trampling upon the holy, and (perhaps) learned labors of those who are more seeing and faithful than the admired.</p></blockquote>

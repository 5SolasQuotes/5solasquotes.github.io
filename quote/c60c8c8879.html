<main class="wrap"><figure class="quote" id="q-c60c8c8879" data-kw="">
<blockquote><p>Then the true state of the question is not [1.] whether the sword be a means of conversion of men to the true faith [which its not], nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [they’re not], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers [its not], nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty [it can’t]. But whether or not ought the godly and Christian prince [to] restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, ... (London, 1649), pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-119f1300fe" data-kw="">
<blockquote><p>Though the king have power in case of the Church aberration (which is somewhat extraordinary) it follows not therefore, in ordinary, he has a nomothetic [law-making] power to make Church-Laws.</p></blockquote>

</figure><figure class="quote" id="q-129abc9c11" data-kw="">
<blockquote><p>Those who are engaged in a spiritual ministry such as preachers and pastors must likewise remain steadfast before the peril of death.¹ We have a plain command from Christ, “A good shepherd lays down his life for the sheep but the hireling sees the wolf coming and flees” [Jn. 10:11]. For when people are dying, they most need a spiritual ministry which strengthens and comforts their consciences by Word and sacrament and in faith overcomes death. ¹ Elector John wrote Luther and urged him and the professors at the university to leave on account of the plague and go to Jena. Luther, Bugenhagen, and two chaplains, however, stayed on at Wittenberg. However, where enough preachers are available in one locality and they agree to encourage the other clergy to leave in order not to expose themselves needlessly to danger, I do not consider such conduct sinful because spiritual services are provided for and because they would have been ready and willing to stay if it had been necessary. We read that St. Athanasius fled from his church that his life might be spared because many others were there to administer his office (Augustine, MPL 30.1017). Similarly, the brethren in Damascus lowered Paul in a basket over the wall to make it possible for him to escape, Acts 9 [:25]. And also in Acts 19[:30] Paul allowed himself to be kept from risking danger in the marketplace because it was not essential for him to do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether one may Flee from a Deadly Plague’</cite>, (c. 1527), p. 2 in Luther’s Works, Vol. 43: Devotional Writings II, ed. Jaroslav Jan Pelikan, Hilton C. Oswald &amp; Helmut T. Lehmann, vol. 43 (Philadelphia: Fortress Press, 1999), 119–38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

+II%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald+%26+Helmut+T.+Lehmann%2C+vol.+43+%28Philadelphia%3A+Fortress+Press%2C+1999%29%2C+119%E2%80%9338&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F129abc9c11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/129abc9c11.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=Those%20who%20are%20engaged%20in%20a,essential%20for%20him%20to%20do%20so&amp;text=Those%20who%20are%20engaged%20in%20a%20spiritual%20ministry&amp;text=was%20not%20essential%20for%20him%20to%20do%20so" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cb0fbf9de6" data-kw="">

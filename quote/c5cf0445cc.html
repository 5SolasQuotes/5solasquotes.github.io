<blockquote><p>The fulness of the Gentiles,” who must be brought in before blindness is lifted from Israel, is not, according to Dr. [Benjamin H.] Charles, a general conversion of the nations, but simply the ingathering of some, and by implication a few, incidentally to the preaching of the gospel in every land “for a witness”; which preaching itself is but a paving of the way for what is the great hope of the world and the most effective means of applying salvation readily to man, the visible presence of Christ returned to the earth. The gathering in of the Jews, in the interpretation of these latter-day Judaists, means all the Jews. The fulness of the Gentiles means a handful here and there. Evidently the Jews are still in the favoured place, and will occupy the seats of honour in the kingdom.

We think that this school, if it does not misconceive, yet by emphasis misrepresents, the design of preaching the gospel throughout the world. The duty of the apostles was to bear witness. It is the duty of the church to-day, and the design of such testimony is that men may believe and not that they may be made the more fit for judgment. Furthermore, we think there is here a great exaggeration of the importance of the Jew in the future of the church and of his prominence in dispensations to come, as taught in the Scripture. That the knowledge of the Lord is to cover the earth, that all nations and kindreds and tongues are to be brought to Messiah’s feet, is taught in the word. But we see the Jew cast out by reason of his rejection of the Messiah.

As an assurance of the universality of the Messiah’s conquests and a conspicuous example of the divine forgiveness, we are told that the Jew also will ultimately be restored to the covenant and restored to the faith from which his fathers apostatized; but that he is to enjoy in the kingdom, when restored, a higher dignity or honour, that he will still be, par excellence, the chosen people of God, or have any special privileges by reason of his former station under the Abrahamic national covenant, we are not told. We are all one in the kingdom and so it will ever continue; no Jew, no Greek, but all one in Christ. The Jew now shut out will be restored to an equal place with the Gentile, but not to a higher, as though he and his country and his capital and his ancient theocracy in its pristine purity, are to be the nucleus of the glorified millennial kingdom, which will be so enlarged as to embrace all believers among the Gentiles.

Why, then, this extra concern, this deeper grief at the present apostasy of this ancient people? The condition of any people away from God excites our pity and should awaken yearnings for their salvation. But that the condition of one is more desperate or pitiable than another, we cannot believe; nor have we been able to feel a deeper concern for the welfare of the Jews than for the welfare of the Irish, or the Brazilians or the Koreans. If Scripture expressly says the Jews are to be reclaimed to their ancient faith, it equally teaches what is equally precious to us and equally a ground of heavenly joy, that these other races and peoples are to give in their loyal allegiance to our Redeemer and King. No, this prominence of the Jew in the premillenarian scheme is due to the fact that it is a sensuous, earthly and Judaistic scheme.

It is because prophecies that apply to the church or the spiritual Israel are taken in a grossly literal sense and applied to Israel in the flesh, thus unwarrantedly magnifying the glory of the Jews in Christ’s kingdom. As it is expressly said that the Jew must be converted before Christ’s return, and as by construction and evaporation of their import, the other conditions prescribed as precedent to his return are all assumed to be virtually fulfilled, there remains to the immediate return of our Lord chiefly the hindrance of the continued apostasy of Abraham’s natural children. Hence anxiety goes out to these, and their importance rises in this stage of the economy of grace above all other nations, and the view is held that the paramount duty of the church to-day is to pray and labour for the saving of the Jews.

But are the Jews still a people nearer to God and dearer to him in his covenant than all other peoples? Once more favoured than the Gentiles, is it their destiny to be again more highly honoured? When the Gentiles, as a class, were outside the covenant, prophecies ran that they should be gathered in to an equal place with the Jews. When the Jews, by rejecting their Messiah, were cast out, prophecy declared that they should be brought back to faith and allegiance. But do we read that it is to anything else than a place with believing Gentiles under the one ancient and eternal covenant? Are the promises of their recovery any more particular or rich than those under the old dispensation which foretell the conversion of the isles of the sea? No, it is to equal privileges with the Gentiles as people of God, and not to their former theocratic conditions and superior advantages that they are to be restored.

The tropes employed by the prophets and drawn from the symbolism of the existing economy only point to evangelical blessings and privileges for the Gentiles; and this is all Paul affirms of the Jews in their recovery. The middle wall once broken down is not to be re-erected at the outburst of the millennium. We Gentiles have to-day every privilege the Jews ever had. Nor will they have hereafter any station or honour denied as such to us. The end for which the Jew was promoted to special privilege has been accomplished. His importance in the future lies in the fact that having been cast out for rejecting Christ he is to be brought back after the nations have been evangelized, in order that all may be saved.</p></blockquote>

<blockquote><p>Matters of smaller weight, and so covertly discovered that no great offence to the Church was to be feared in them, I wholly passed by, as one that discerned nothing of them, or had been unfurnished of replies. For other of greater moment, and so openly delivered, as there was just cause of fear, least the truth and church of God should be prejudiced and periled by it, and such as the conscience of my duty &amp; calling would not suffer me altogether to pass over, this was my course, to deliver, when I should have just cause by my text, the truth of such doctrine as he had otherwise taught in general speeches, without touch of his person in any sort, and further at convenient opportunity to confer with him in such points.

According to which determination, whereas he had taught certain things concerning predestination otherwise then the word of God doth, as it is understood by all churches professing the gospel, and not unlike that wherewith Coranus some times troubled his church; I both delivered the truth of such points in a general doctrine, without any touch of him in particular, and conferred with him also privately upon such articles.

In which conference, I remember, when I urged the consent of all churches, and good writers against him that I knew, and desired if it were otherwise, what authors he had seen of such doctrine, he answered me that his best author was his own reason: which I wished him to take heed of, as a matter standing with Christian modesty &amp; wisdom in a doctrine not received by the church, not to trust to his own judgment so far, as to publish it before he had conferred with others of his profession, labouring by daily prayer, and study to know the will of God, as he did, to see how they understood such doctrine: notwithstanding he with wavering replying that he would some other time deal more largely in the matter, I wished him, &amp; prayed him not so to do, for the peace of the church, which by such meanes might be hazarded; seeing he could not but think, that men, who make any conscience of their ministry, will judge it a necessary duty in them, to teach the truth, and to convince the contrary.

Another time upon like occasion of this doctrine of his that the assurance of that we believe by the word, is not so certain, as of that we perceive by sense; I both taught the doctrine otherwise, namely the assurance of faith to be greater, which assureth both of things above, and contrary to all sense and human understanding, and dealt with him also privately upon that point.</p></blockquote>

<blockquote><p>…these… truths are most certainly evident out of the Scripture. All Christians in the Church of Jerusalem were admitted into Church-fellowship upon their repenting, believing and being baptized, without any other conditions, and that upon offering themselves… But it will farther more illustriously yet appear, if we consider the diverse other additions of believers, and that daily unto the Church of Jerusalem: for in the last verse of this chapter it is said that the Lord added daily unto the Church such as should be saved; here we find additions upon additions of believers, and that daily, indefinitely set down, as if they could not easily have been told, which adds no small emphasis unto the expression; and all these were admitted into Church-fellowship without any of those conditions the Independents require of all their members in these our times; for it is said the Lord added daily unto the Church such as should be saved; and therefore He did it only upon his own terms of repentance, faith and baptism.</p></blockquote>

<blockquote><p>§.23. Of the restraint of the benefit of Christ’s headship to them only that are of his body. That none but those who are of Christ’s body shall partake of the benefit of his office is clear by other like titles of restraint, as ‘his people’, and ‘his sheep’: but especially by denying to the world the benefit of his intercession, ‘I pray not for the world,’ says He. In this respect this position (out of the Church no salvation) is without exception true: for the body is the true, catholic, invisible Church: he that is not a member of this Church, but is out of it, has not Christ to be his head and Savior, whence then can he have salvation? The former point is not more comfortable to those that have assurance that they are members of this body, then this is terrible to those that give too great evidence they are no members thereof; as all they do that have not the spirit of Christ ruling in them, but rather rebel against Him: and bear no love to the saints, but rather hate them, and do them all the spight they can.</p></blockquote>

ht%20they%20can" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XLII. As for the name ‘catholic,’ most of our [Reformed] theologians say that it is common to both the visible and invisible Church, but the invisible Church is absolutely and simply to be called catholic, that is, universal, because it encompasses all the elect from the beginning of the world. However, the visible Church is to be considered catholic in a certain respect, as it encompasses all those who together profess the true and saving religion on earth and includes all particular churches scattered in various parts of the world. In my opinion, the name Catholic is a title of that part of the Church which now militates on earth under Christ, and this name is given to it:

1. Because it is spread throughout the whole world, not restricted to one nation as the Jewish Church was in ancient times.

2. Because it embraces the entire doctrine of the apostles, not admitting part and rejecting part like heretical sects. Finally, because it has persevered the same in all times, namely, through succession and continuation.</p></blockquote>

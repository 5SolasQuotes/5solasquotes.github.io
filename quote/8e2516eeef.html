<main class="wrap"><figure class="quote" id="q-8e2516eeef" data-kw="">
<blockquote><p>WE are now to speak of the Second Head, Concerning Separation from true Churches, and the true worship of God in them, because of the sins of Fellow-worshipers.

I. That which our Adversaries hold concerning this, is, That the presence of wicked men at Ordinances do defile the Ordinances to the Godly: Therefore, say they, where ever there is any corruption in a Church, or where prophane or wicked men are suffered to be in it, The Godly are bound to abstain from the Lords Table, and not to communicate with the mixed multitude; And because they hold it is not Lawful for any to live in any Church, where they cannot enjoy the whole Ordinances of God: Therefore they maintain that the Godly are bound to Separate from That Church, and to make up a Church of their Own, by gathering out so many of the Godly that are in it, as they can get, and make a little Congregation of their own, choosing any of them to be a Minister, and some one or two to be Elders, And so they set up a Church against a Church, a Church in the Bosom of a Church.

This is not a new Error, It troubled the Church of Christ long since, in the Fourth Century or something more than Three hundred years after Christ: The Donatists, a kind of Hereticks arose and troubled the Church for a long time, and did teach the same very thing; Against whom the Godly Fathers of the Church in that time did write: Yet because this Error was carried on with a shew of Holiness and Strictness more than ordinary, It took such deep rooting in the minds of some well minding People (some of them at least) that it could not be driven out by force of Argument, till the Lord did leave the maintainers of this Error to fall into other vile abominations, for all their pretence of Strictness; Which made all others to loathe them: And before it could be gotten rooted out of the minds of men, It troubled the Church almost 100. years together. The same is the Error which we have now to Refute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors toleration, Erastianism, Independency and separation delivered in some sermons from I Joh. 4. I, preached in the year 1652: to which are added four sermons preached on several occasions</cite>, (Edinburgh: George Mosman, 1692), pp 214-15.</span></figcaption>

</figure><figure class="quote" id="q-508ebee398" data-kw="">
<blockquote><p>The Church of Scotland was founded on the principle, that not only is the Bible the only rule of faith, but the only statute-book by which the Lord Jesus would have His Church on earth governed. It assumed that Christ Himself has given certain office-bearers for the administration of His Church, and that He has given to these office-bearers their Directory, their only book of Canons in the written Word.

And it farther assumed, that in the administration of the Church, civil rulers and secular magistrates ought not to interfere with the servants of Christ, but should leave it to them to rule Christ’s house — His Church on earth, according to Christ’s own laws. And it still farther assumed that in the event of the Church entering into any connexion with the State — accepting an endowment for instance — the Church was not at liberty to surrender any spiritual privilege as the price of protection, or pecuniary support. This was the theory. And at the Revolution, this theory became the statute-law of Scotland; and at the Union, it was stipulated that this should abide the statute-law of Scotland for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-hamilton.html">James Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Egypt. To which is Appended the Original Protest, read at the General Assembly in May 1843 (Montreal: John C. Becket, 1844), p. 7.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>As there is an itching after new doctrine in some, so is there for division in others. Gal. 5:19-20, ‘Now the works of the flesh are manifest; which are these, hatred, variance, emulations, wrath, strife, seditions.’ The Greek word dicostasias [***], there rendered “seditions,” signifies a renting of those who ought to be united in one common society. Jude 19, there says the apostle, ‘These are they who separate themselves, sensual, not having the Spirit.’ Sometimes separatists have made high pretenses to the Spirit, and yet been sensual. And the Assembly 1641, in their act against impiety and schism in meetings for mutual edification, having advised to eschew all such meetings as are apt to bread error, scandal and schism, they expressly say, “These are works of the flesh, but not of the Spirit, and are contrary to truth and peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

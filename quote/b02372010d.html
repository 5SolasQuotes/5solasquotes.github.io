<blockquote><p>2 Pet. 3:8, ‘One day is with the Lord as a thousand years, and a thousand years as one day.’ When he says, ‘a thousand years’, he means all years, all time put together, is but as one day to the Lord. A day was the first distinction of time; the first perfect time that was created, was a day: now put a thousand years together, it is but as one day to the Lord; All times and one time are all one to him who inhabits eternity. In Ps. 90:6, it is, a thousand years are but as yesterday, which notes all time past, as Peter notes, all time to come, is, but as one day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, (London, 1647), on ch. 9:3, pp. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Josephus, Of the Jewish War, bk. 7, ch. 24, writes that there is a river in Palestine, which passes between two cities… which river is admirable for an extraordinary singularity: namely, that having entertained his violent and swift course for the space of six days, on the seventh it remains dry: which being past, it runs as before; and therefore is called the river of the Sabbath:</p></blockquote>

</figure><figure class="quote" id="q-02908a3ee6" data-kw="">
<blockquote><p>First by ‘day’ we are here [in Gen. 1:14, ‘to separate the day from the night’] to understand not the space of the sun, moon, and stars compassing the earth, which is the space of 24 hours; for that ‘day’ consists of an evening and a morning, and comprehends in it one night; and some call it a natural, and some a civil, and some an astronomical day: but here by ‘day’ we are to understand the time while the sun, the greatest light, shines and gives light upon the face of the earth: And by ‘night’ the time while the moon and stars do only appear and give their dim light upon the earth, which some call an artificial and civil day and night, but others do more properly call it a natural day, and a natural night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 9, pp. 138-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

0night" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>

</figure><figure class="quote" id="q-57a97c89f5" data-kw="">
<blockquote><p>Secondly, that which is the only foundation of a scruple in this case, is a principle most unreasonable in itself, that we are to embrace nothing for truth, though divinely revealed, but what our reason is able to comprehend, as to the nature of the thing, and the manner of its existence; on which account the doctrine of the Trinity, Incarnation, Satisfaction, and consequently the whole mystery of the Gospel of Christ must be rejected as incredible, and that on this bare pretense, because although many expressions in Scripture seem to import all these things, yet we are bound to interpret them to another sense, because this is incongruous to our reason. But although Christianity be a religion which comes in the highest way of credibility to the minds of men, although we are not bound to believe anything but what we have sufficient reason to make it appear that it is revealed by God, yet that anything should be questioned whether it be of divine revelation, merely because our reason is to seek, as to the full and adaequate conception of it, is a most absurd and unreasonable pretence: And the assertors of it must run themselves on these unavoidable absurdities: First, of believing nothing either in nature or religion to be true, but what they can give a full and satisfactory account of, as to every mode and circumstance of it. Therefore let such persons first try themselves in all the appearances of nature: And then we may suppose they will not believe that the sun shines, till they have by demonstrative arguments proved the undoubted truth of the Ptolomaic or Copernican hypothesis, that they will never give credit to the flux and reflux of the Sea, till they clearly resolve the doubts which attend the several opinions of it. That there is no such thing as matter in the world, till they can satisfactorily tell us how the parts of it are united; nor that there are any material beings, till they have resolved all the perplexing difficulties about the several affections of them; and that themselves have not so much as a rational soul, till they are bound to satisfy us of the manner of the union of the soul and body together. And if they can expedite all these, and many more difficulties about the most obvious things…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Origines Sacræ, or, A Rational Account of the Grounds of Christian Faith</cite>, ... (London, 1662), bk. 2, ch. 8, pp. 233-34</span></figcaption>

— Edward Stillingfleet, Origines Sacræ, or, A Rational Account of the Grounds of Christian Faith... (London, 1662), bk. 2, ch. 8, pp. 233-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+that+which+is+the+only+foundation+of+a+scruple+in+this+case%2C+is+a+principle+most+unreasonable+in+itself%2C+that+we+are+to+embrace+nothing+for+truth%2C+though+divinely+revealed%2C+but+what+our+reason+is+able+to+comprehend%2C+as+to+the+nature+of+the+thing%2C+and+the+manner+of+its+existence%3B+on+which+account+the+doctrine+of+the+Trinity%2C+Incarnation%2C+Satisfaction%2C+and+consequently+the+whole+mystery+of+the+Gospel+of+Christ+must+be+rejected+as+incredible%2C+and+that+on+this+bare+pretense%2C+because+although+many+expressions+in+Scripture+seem+to+import+all+these+things%2C+yet+we+are+bound+to+interpret+them+to+another+sense%2C+because+this+is+incongruous+to+our+reason.+But+although+Christianity+be+a+religion+which+comes+in+the+highest+way+of+credibility+to+the+minds+of+men%2C+although+we+are+not+bound+to+believe+anything+but+what+we+have+sufficient+reason+to+make+it+appear+that+it+is+revealed+by+God%2C+yet+that+anything+should+be+questioned+whether+it+be+of+divine+revelation%2C+merely+because+our+reason+is+to+seek%2C+as+to+the+full+and+adaequate+conception+of+it%2C+is+a+most+absurd+and+unreasonable+pretence%3A+And+the+assertors+of+it+must+run+themselves+on+these+unavoidable+absurdities%3A+First%2C+of+believing+nothing+either+in+nature+or+religion+to+be+true%2C+but+what+they+can+give+a+full+and+satisfactory+account+of%2C+as+to+every+mode+and+circumstance+of+it.+Therefore+let+such+persons+first+try+themselves+in+all+the+appearances+of+nature%3A+And+then+we+may+suppose+they+will+not+believe+that+the+sun+shines%2C+till+they+have+by+demonstrative+arguments+proved+the+undoubted+truth+of+the+Ptolomaic+or+Copernican+hypothesis%2C+that+they+will+never+give+credit+to+the+flux+and+reflux+of+the+Sea%2C+till+they+clearly+resolve+the+doubts+which+atten

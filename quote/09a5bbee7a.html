<main class="wrap"><figure class="quote" id="q-09a5bbee7a" data-kw="">
<blockquote><p>When preaching before the House of Commons in 1645, the Westminster divine, Peter Sterry (see the entry in the Journal of the House of Commons for Sterry’s appointment to the Westminster Assembly) made the following comments regarding the Holy Spirit and civil rulers:

GOD hath promised his people to carry them on the Eagle’s Wing. The only desire and humble endeavour of your lowest servant in Christ, hath been to work with God in this Sermon; that your Souls, Counsels, Wars, may be carried on by the Spirit of God; who in the language of the Scriptures is not only the Dove for Purity and Peace; but also the True Eagle for Wisdom and Power.

Worthy Senators, if you knew this Spirit, you would ask Him of your Saviour; and He would be in you a Fountain of Counsel and Strength springing up to Everlasting Peace and Glory. But have you not known The Spirit? His sound hath gone forth into all your Ears. All the Scriptures speak of Him as they do of Jesus Christ.

Daniel was chosen by the King of Assyria to sway the great affairs of that vast Empire; because the Spirit of the immortal God was found in him.

David was a Statesman, Wiser then his Teachers: David was a Soldier; His fingers were skil’d in fighting, his hands train’d up to Victory over Wild Beasts, Giants, Armies of Men. was not the Spirit the Lamp of God which shone thus gloriously on David’s Court and Camp, which made his Throne so great? Thy Word, saith he, was a Light to my Feet. The Word of God is the Spirit of God, saith St. Paul; The Sword of the Spirit, which (Spirit, not Sword) is the Word of God. This made David when he had sin’d, cry: Take not thine Holy Spirit from me. When the Spirit of God once left Saul, an evil Spirit came upon him, which vex’t him, which haunted him to the loss of his kingdom and life together.

Honourable Fathers of your Countries, I humbly move to know, By what Title you sit there and rule over us. Is it not as Powers on Earth? But All power on Earth as well as in Heaven, is given to Jesus Christ. You are Substitutes and Vice-gerents to the Lord Jesus. Look then to Jesus the Beginning and End of your Authority. God hath laid the Government on his Shoulder. What is his sufficiency for it? The Spirit of the Lord resteth on him, and this is, A Spirit of Counsel and Might in him.

You who sit at the right hand of the Lord Jesus, in this Common-wealth, as the Lord Jesus sits at the right hand of his Father in that Kingdom, which is over all: pray, that the same Spirit, which was poured forth on him, may be by him poured forth on you: So shall you be Messiahs, anointed ones, and Saviours to this people. Can You be able to rule over any spot of this earth; when Jesus Christ was not fit for the government of the whole; without the Spirit?

Do you put your whole trust in the promises of God, and expect by them to be made partakers of every blessing? Do you believe the promises made in the Word of God? I hope, I may say, at least with as good confidence, as Paul said it to Agrippa; I know you believe them.</p></blockquote>

<blockquote><p>In George Smeaton’s preface to the 1871 edition of the elder Thomas McCrie’s classic defence of the establishment principle, Statement of the Difference the Free Church theologian explained the circumstances that had given rise to the publication of McCrie’s book:

THE celebrated Statement of the late Dr M’Crie, of which a reprint in full is here presented to the public, was drawn up with the express design of exhibiting the difference between the profession of the Reformed Church of Scotland and the theory of Voluntaryism. The latter term, indeed, was not yet in common use. The question discussed, however, was precisely the same. It was not the question as in former times: with what restrictions and with what regard to the church’s intrinsic freedom may magistrates competently exercise their power about religion? It was the absolute question: is any power whatever competent to the Christian Civil ruler in seeking to further the cause of Christ?

Dr M’Crie’s work discusses this point, and possesses the following peculiarities:— It is a masterly defence of the principle of Establishments as a scripture truth; and the most complete vindication ever given to the world of the position occupied by the Reformed Church of Scotland on the whole subject of national religion, and of the magistrate’s legitimate power in promoting it.

The occasion which called forth the treatise, was as follows. A change had been introduced into the testimony of the church of which Dr M’Crie was a minister, on the question of the Civil Ruler’s authority and duty in reference to religion. About the same period, that is, during the last decennium of the previous century, the leaven of Voluntaryism, or, the theory that it is not competent to the Christian ruler to exercise his authority and influence in behalf of religion in any form, — began to work within the pale both of the Burgher and Antiburgher sections of the Secession Church. To the latter only, as the Denomination to which Dr M’Crie belonged, do we deem it necessary to refer in this place.

In the Antiburgher Synod, or General Associate Synod, as it was termed, a motion was made in 1795 to take steps for preparing or compiling a new Historical and Doctrinal Testimony for the use of the Denomination. Various reasons prompted this proposal. It was deemed fitting to simplify the document heretofore used as a testimony; to put together in a readable form what had been said in several publications on their distinctive principles; and to bring down the testimony to the time then present. But above all it was thought desirable as the event too plainly proved, to find expression for the new opinions already widely diffused on the subject of the magistrate’s power in reference to religion; in other words, to make room for the Voluntary Theory.

For some years, the people were kept on the tip-toe of expectation for the new Display of the Secession Testimony, which was to supersede that previously in use, and to prove a great improvement upon it. When at length it appeared, after nine years spent in its preparation, it was found to say and unsay; some passages doing homage to the past attainments of the Reformed Church of Scotland, while others were all too plainly at variance with the previously recognised doctrine of the Secession Church, in reference to the lawfulness of the connection between church and state.

But, as is not unusual in such cases, the extent of the alteration was sought to be concealed. A radical change, or rather a revolution, had been made in the constitution of this section of the Secession Church. But the change was not for a time openly avowed. The Synod, abandoning the principles and position of the Secession Church, though still retaining the name, had, in fact become a Dissenting Denomination. It had broken with the Historic Church of Scotland. The connection was dissolved.

There was a certain mis-statement, therefore, in asserting that they continued, as Heretofore, to bear testimony to the doctrine, worship, discipline, and government of the Reformed Church of Scotland, (p. 15.) The Confession, received in 1647 with one explanation, was now received with many limitations, under colour of carrying out the course of action then initiated. They declared their liberty of signifying their adherence to it with the same or similar limitations, (p. 12.) The section, in particular, which described what was competent to the civil magistrate, was evacuated of its import under the plea that it taught compulsory measures in religion. It was perverted, too, from its proper meaning, as if it might be accepted in the sense of referring to the magistrate in his private capacity, (p. 198.)

Furthermore, the scheme of separating the narrative and doctrinal part of the new Testimony from each other; — that is, by binding the members of the church solely to the latter, — men’s minds were gradually led away from the facts, in support of which the Secession testimony had at first been raised. In short, the Historic basis was to a large extent removed. We frankly acknowledge that in the exhibition of doctrine, there is much precious statement of central truth, worthy of the best times of the Secession Church. But it cannot be denied that wherever reference is made, directly or indirectly, to the misleading negation of Voluntaryism, we encounter one-sided statements, vacillation, and defective exposition.

The Synod, on the 1st of May 1804, approved the testimony, and enacted that henceforth, for all who entered the denomination, it should be held as the bond or term of ministerial and Christian communion. Then followed, on the part of a small but influential minority, a determined opposition. Only six ministers refused to acquiesce in the change made on the constitution of the church. But their piety and ability, as well as their literary eminence, gave weight to the cause they represented.

Two of the number, Messrs Whytock of Dalkeith and Hog of Kelso, were soon removed from the scene of conflict, by death. The four who remained — Rev. Prof. Bruce of Whitburn, Rev. Mr Aitken of Kirriemuir, Rev. Mr Chalmers of Haddington, and Dr M’Crie — maintained the old testimony in all its integrity. But they suffered deposition at the hand of the majority.

Their testimony, however, was not to be suppressed. Forming themselves into a Presbytery, under the designation of the Constitutional Presbytery, they rendered the most important service to the entire Presbyterian church by their clear and scriptural testimony to national Christianity.</p></blockquote>

Dr M’Crie’s work discusses this point, and possesses the following peculiarities:— It is a masterly defence of the principle of Establishments as a scripture truth; and the most complete vindication ever given to the world of the position occupied by the Reformed Church of Scotland on the whole subject of national religion, and of the magistrate’s legitimate power in promoting it.

The occasion which called forth the treatise, was as follows. A change had been introduced into the testimony of the church of which Dr M’Crie was a minister, on the question of the Civil Ruler’s authority and duty in reference to religion. About the same period, that is, during the last decennium of the previous century, the leaven of Voluntaryism, or, the theory that it is not competent to the Christian ruler to exercise his authority and influence in behalf of religion in any form, — began to work within the pale both of the Burgher and Antiburgher sections of the Secession Church. To the latter only, as the Denomination to which Dr M’Crie belonged, do we deem it necessary to refer in this place.

In the Antiburgher Synod, or General Associate Synod, as it was termed, a motion was made in 1795 to take steps for preparing or compiling a new Historical and Doctrinal Testimony for the use of the Denomination. Various reasons prompted this proposal. It was deemed fitting to simplify the document heretofore used as a testimony; to put together in a readable form what had been said in several publications on their distinctive principles; and to bring down the testimony to the time then present. But above all it was thought desirable as the event too plainly proved, to find expression for the new opinions already widely diffused on the subject of the magistrate’s power in reference to religion; in other words, to make room for the Voluntary Theory.

For some years, the people were kept on the tip-toe of expectation for the new Display of the Secession Testimony, which was to supersede that previously in use, and to prove a great improvement upon it. When at length it appeared, after nine years spent in its preparation, it was found to say and unsay; some passages doing homage to the past attainments of the Reformed Church of Scotland, while others were all too plainly at variance with the previously recognised doctrine of the Secession Church, in reference to the lawfulness of the connection between church and state.

But, as is not unusual in such cases, the extent of the alteration was sought to be concealed. A radical change, or rather a revolution, had been made in the constitution of this section of the Secession Church. But the change was not for a time openly avowed. The Synod, abandoning the principles and position of the Secession Church, though still retaining the name, had, in fact become a Dissenting Denomination. It had broken with the Historic Church of Scotland. The connection was dissolved.

There was a certain mis-statement, therefore, in asserting that they continued, as Heretofore, to bear testimony to the doctrine, worship, discipline, and government of the Reformed Church of Scotland, (p. 15.) The Confession, received in 1647 with one explanation, was now received with many limitations, under colour of carrying out the course of action then initiated. They declared their liberty of signifying their adherence to it with the same or similar limitations, (p. 12.) The section, in particular, which described what was competent to the civil magistrate, was evacuated of its import under the plea that it taught compulsory measures in religion. It was perverted, too, from its proper meaning, as if it might be accepted in the sense of referring to the magistrate in his private capacity, (p. 198.)

Furthermore, the scheme of separating the narrative and doctrinal part of the new Testimony from each other; — that is, by binding the members of the church solely to the latter, — men’s minds were gradually led away from the facts, in support of which the Secession testimony had at first been raised. In short, the Historic basis was to a large extent removed. We frankly acknowledge that in the exhibition of doctrine, there is much precious statement of central truth, worthy of the best times of the Secession Church. But it cannot be denied that wherever reference is made, directly or indirectly, to the misleading negation of Voluntaryism, we encounter one-sided statements, vacillation, and defective exposition.

The Synod, on the 1st of May 1804, approved the testimony, and enacted that henceforth, for all who entered the denomination, it should be held as the bond or term of ministerial and Christian communion. Then followed, on the part of a small but influential minority, a determined opposition. Only six ministers refused to acquiesce in the change made on the constitution of the church. But their piety and ability, as well as their literary eminence, gave weight to the cause they represented.

Two of the number, Messrs Whytock of Dalkeith and Hog of Kelso, were soon removed from the scene of conflict, by death. The four who remained — Rev. Prof. Bruce of Whitburn, Rev. Mr Aitken of Kirriemuir, Rev. Mr Chalmers of Haddington, and Dr M’Crie — maintained the old testimony in all its integrity. But they suffered deposition at the hand of the majority.

Their testimony, however, was not to be suppressed. Forming themselves into a Presbytery, under the designation of the Constitutional Presbytery, they rendered the most important service to the entire Presbyterian church by their clear and scriptural testimony to national Christianity.”

<blockquote><p>§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.</p></blockquote>

al his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.”

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, (London, 1673), pt. 4, ch. 19, title 2, p. 116-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A713.+Question+8%3A+May+I+give+money+to+a+judge+or+justice+or+court-officer+to+hire+him+to+do+me+justice+or+to+keep+him+from+doing+me+wrong+or+to+avoid+persecution%3F+Answer%3A+You+may+not%2C+in+case+your+cause+be+bad%2C+give+anything+to+procure+injustice+against+another%3B+no+nor+speak+a+word+for+it+nor+desire+it%3A+This+I+take+as+presupposed.+You+may+not+give+money+to+procure+justice+when+the+law+of+the+land+forbids+it+and+when+it+will+do+more+hurt+accidentally+to+others+than+good+to+you%3A+when+it+will+harden+men+in+the+sin+of+bribery+and+cause+them+to+expect+the+like+from+others.+But+except+it+be+when+some+such+accidental+greater+hurt+does+make+it+evil%2C+it+is+as+lawful+as+to+hire+a+thief+not+to+kill+me%3B+when+you+cannot+have+your+right+by+other+means%2C+you+may+part+with+a+smaller+matter+for+a+greater.+%C2%A714.+Question+9.+But+if+I+make+such+a+contract%2C+may+the+other+lawfully+take+it+of+me%3F+Answer%3A+No%3A+for+it+is+now+supposed+that+it+is+unlawful+on+his+part.+%C2%A715.+Question+10.+But+if+under+necessity+or+force+I+promise+money+to+a+robber+or+a+judge+or+officer%2C+am+I+bound+to+perform+it+when+necessity+is+over%3F+Answer%3A+You+have+lost+your+own+propriety+by+your+covenant+and+therefore+must+not+retain+it.+But+he+can+acquire+no+right+by+his+sin%3B+and+therefore+some+say+that+in+point+of+justice+you+are+not+bound+to+give+it+him%2C+but+to+give+it+to+the+magistrate+for+the+poor.+But+yet+prudence+may+tell+you+of+other+reasons+a+fine+to+give+it+the+man+himself%2C+though+justice+bind+you+not+to+it%3A+as+in+case+that+else+he+may+be+revenged+and+do+you+some+greater+hurt%2C+or+some+greater+hurt+is+any+other+way+likely+to+be+the+consequent%2C+which+it+is+lawful+by+money+to+prevent.+But+many+think+that+you+are+bound+to+deliver+the+money+to+the+thief+or+officer+himself%2C+because+it+is+a+lawful+thing+to+do+it%2C+though+he+have+no+just+title+to+it%3B+and+because+it+was+your+meaning%2C+or+the+signification+of+your+words+in+your+covenant+with+him.+And+if+it+were+not+lawful+to+do+it%2C+it+could+not+be+lawful+to+promise+to+do+it%3A+otherwise+your+promise+is+a+lie.+To+this%2C+those+of+the+other+opinion+say+that+as+a+man+who+is+discharged+of+his+promise+by+him+that+it+was+made+to+is+not+to+be+accounted+false+if+he+perform+it+not%2C+so+is+it+as+to+the+thief+or+officer+in+question%2C+because+he+having+no+right%2C+is+to+you+as+the+other+that+has+quit+his+right.+And+this+answer+indeed+will+prove+that+it+is+not+strict+injustice+not+to+pay+the+money+promised%3A+but+it+will+not+prove+that+it+is+not+a+lie+to+make+such+a+promise+with+an+intent+of+not-performing+it%2C+or+that+it+is+not+a+lie+to+make+it+with+an+intent+of+performing+it%2C+and+not+to+do+it+when+you+may.+Though+here+a+Jesuit+will+tell+you+that+you+may+say+the+words+of+a+promise+with+an+equivocation+or+mental+reservation%2C+to+a+thief+or+persecuting+magistrate+%28of+which+see+more+in+the+chapters+of+lying%2C+vows+and+perjury%29.+I+am+therefore+of+opinion+that+your+promise+must+be+sincerely+made+and+according+to+the+true+intent+of+it%2C+you+must+offer+the+money+to+the+thief+or+officer%3B+except+in+case+the+magistrate+forbid+you%2C+or+some+greater+reason+lie+against+it%2C+which+you+foresaw+not+when+you+made+the+promise.+But+the+offender+is+undoubtedly+obliged+not+to+take+the+money.+%C2%A716.+The+same+determination+holds+as+to+all+contracts+and+promises+made+to+such+persons+who+by+injurious+force+constrained+us+to+make+them.+There+is+on+us+an+obligation+to+veracity%2C+though+none+to+them+in+point+of+justice%2C+because+they+have+no+proper+right%3B+nor+may+they+lawfully+take+our+payment+or+service+promised+them.+And+in+case+that+the+public+good+unexpectedly+cross+our+performance%2C+we+must+not+perform+it%3A+Such+like+is+the+case+of+conquerors%2C+and+those+that+upon+conquest+become+their+vassals+or+subjects+upon+unrighteous+terms.+But+still+remember%2C+that+if+it+be+not+only+a+covenant+with+man%2C+but+a+vow+to+God%2C+which+makes+him+a+party%2C+the+case+is+altered%2C+and+we+remain+obliged.+%C2%A717.+Question+11.+But+may+I+promise+the+thief+or+bribe-taker+to+conceal+his+fault%3F+and+am+I+obliged+to+the+performance+of+such+a+promise%3F+Answer%3A+This+is+a+promise+of+omitting+that+which+else+would+be+a+duty.+It+is+ordinarily+a+duty+to+reveal+a+thief+and+bribe-taker+that+he+may+be+punished.+But+affirmatives+bind+not+ad+semper+%5Bto+all+times%5D%3A+no+act+%28especially+external%29+is+a+duty+at+all+times%3A+therefore+not+this+of+revealing+an+offender%E2%80%99s+fault.+And+if+it+be+not+always+a+duty%2C+then+it+must+be+none+when+it+is+inconsistent+with+some+greater+benefit+or+duty%3A+For+when+two+goods+come+together%2C+the+greater+is+to+be+preferred.+Therefore+in+case+that+you+see+in+just+probability+that+the+concealment+of+the+sinner+will+do+more+hurt+to+the+commonwealth+or+the+souls+of+men+than+the+saving+of+your+life+is+like+to+do+good%2C+you+may+not+promise+to+conceal+him%3A+or+if+you+sinfully+promise+it%2C+you+may+not+perform+it.+But+in+case+that+your+life+is+likely+to+be+a+greater+good+than+the+not+promising+to+conceal+him%2C+then+such+a+promise+is+no+fault%3B+because+the+disclosing+him+is+no+duty.+But+to+judge+rightly+of+this+is+a+matter+of+great+difficulty.+If+it+be+less+than+life+which+you+save+by+such+a+promise%2C+it+oft+falls+out+that+it+is+a+lesser+good+than+the+detecting+of+the+offence.+%C2%A718.+But+it+will+here+be+said%2C+%E2%80%98If+I+promise+not+to+conceal+a+robber%2C+I+must+conceal+him+nevertheless%3B+for+when+he+has+killed+me%2C+I+cannot+reveal+him%3B+and+I+must+conceal+the+bribe-taker%2C+for+till+I+have+promised+secrecy%2C+I+cannot+prove+him+guilty.+And+he+that+promises+to+forbear+a+particular+good+action+whilst+he+lives%2C+does+yet+reserve+his+life+for+all+other+good+works%3A+whereas+if+he+die%2C+he+will+neither+do+that+nor+any+other.%E2%80%99+But+this+case+is+not+so+easily+determined%3A+If+Daniel+die%2C+he+can+neither+pray+nor+do+any+other+good+on+earth.+And+if+he+live%2C+he+may+do+much+other+good+though+he+never+pray%3A+and+yet+he+might+not+promise+to+give+over+praying+to+save+his+life.+I+conceive+that+we+must+distinguish+of+duties+essential+to+the+outward+part+of+Christianity%2C+or+of+constant+indispensable+necessity%2C+and+duties+which+are+alterable+and+belong+only+to+some+persons%2C+times+and+places%3A+Also+between+the+various+consequents+of+omissions.+And+I+conceive+that+ordinarily+a+man+may+promise+for+the+saving+of+his+life+that+he+will+forbear+a+particular+alterable+duty+or+relation%3A+as+to+read+such+a+commentary%2C+to+speak+with+such+a+minister%2C+to+be+a+magistrate+or+a+minister%2C+etc.+in+case+we+have+not+before+bound+ourselves+never+to+give+over+our+calling+till+death%3A+and+in+case+that+the+good+which+will+follow+our+forbearance+is+likely+%28to+a+judicious+person%29+to+be+greater+than+the+evil.+But+no+man+may+promise+to+omit+such+a+duty+as+God+has+made+necessary+during+life%3A+as+not+to+love+God+or+fear+or+trust+Him%3A+not+to+worship+Him+and+call+upon+Him+and+praise+Him%3A+nor+to+do+good+to+men%E2%80%99s+souls+or+bodies+in+the+general%3A+or+not+to+preach+or+pray+while+I+am+a+minister+of+Christ%2C+or+not+at+all+to+govern+while+you+are+a+governor.+For+all+these+contradict+some+former+and+greater+promises+or+duties.+Nor+may+you+omit+the+smallest+duty+to+save+your+life+at+such+a+time+when+your+death+is+likely+to+do+more+good+than+your+life+would+do+without+that+one+duty.+Apply+this+to+the+present+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+%28London%2C+1673%29%2C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+116-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca12e1cddd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca12e1cddd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=13.%20Question%208%3A%20May%20I%20give,Apply%20this%20to%20the%20present%20case&amp;text=13.%20Question%208%3A%20May%20I%20give%20money%20to&amp;text=one%20duty.%20Apply%20this%20to%20the%20present%20case" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

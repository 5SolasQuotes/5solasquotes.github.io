<main class="wrap"><figure class="quote" id="q-6337527b5a" data-kw="">
<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, (London, 1631), vol. 1, pp. 495–98 on 1 Tim. 2:4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f8f191fe0f" data-kw="">
<blockquote><p>All the Reformed agree in this, that there is such a great value and price in the death of Christ, from the infinite dignity of the person, that it could be sufficient for saving each and every person, but because neither the Father nor the Son willed that death to be destined for redeeming each and every person, it cannot be fittingly said that Christ died for each and every person…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 4, bk. 5, ch. 12, section 27, p. 427</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-04e73746c9" data-kw="">
<blockquote><p>There is such a fulness in the satisfaction of Christ, as is sufficient for the salvation of the whole world, were the whole world to believe in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | “Christ died for sinners. But everything turns on the significance of the preposition. What is meant by “Christ died for sinners”? To answer that Christ died in order to make it possible for God to righteously receive sinners who come to Him through Christ, is only saying what many a Socinian has affirmed. The testing of a man’s orthodoxy on this vital truth of the atonement requires something far more definite than this. The saving efficacy of the atonement lies in the vicarious nature of Christ’s death, in his representing certain persons, in his bearing their sins, in his being made a curse for them, in his purchasing them, spirit and soul and body. It will not do to evade this by saying</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

solasquotes.github.io%2Fquote%2F04e73746c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/04e73746c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=There%20is%20such%20a%20fulness%20in,whole%20world%20to%20believe%20in%20Him&amp;text=There%20is%20such%20a%20fulness%20in%20the%20satisfaction&amp;text=were%20the%20whole%20world%20to%20believe%20in%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c608953fb1" data-kw="">
<blockquote><p>It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed… The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review</cite>, (1902), 13:1-37, p. 19</span></figcaption>

<blockquote><p>[Jonathan] Rainbow convinces me that Gottshalk [of Orbais, c.803-868] and [Martin] Bucer [1491-1551] (in debates with Anabaptists) taught limited atonement before Calvin. I must modify my judgment, therefore, and argue that limited/unlimited atonement was not a debated issue within reformed circles until the time of Calvin’s successor, [Theodore] Beza. I thus agree with Robert Letham that the extent of the atonement ‘only became a major issue in the next generation’…</p></blockquote>

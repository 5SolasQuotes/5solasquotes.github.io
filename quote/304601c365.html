</figure><figure class="quote" id="q-ccff3f6b3e" data-kw="">
<blockquote><p>Though Saul’s destroying of the Amalekites in that cause was moral, in regard ‘they lay in wait for Israel, when they came out of Egypt,’ and so of perpetual obligation, yet the destroying of them, 1 Sam. 15, is temporary and obliges not us: 1. Because that generation were their sons, not those same persons that oppressed Israel when they came out of Egypt, and we may not punish the sons for the sins of their fathers with death; therefore God’s positive command to Saul, and the reason, ‘I remember what Amalek did’ (in Moses his time) ‘therefore kill them,’ does not oblige us, except we had the like command. 2. Because the slaying of man, woman, infant and suckling, ox and sheep, was temporary and cannot have a perpetually obligatory ground in the Law of nature or natural justice obliging us. 3. Where there is an injury done to God against the Law of nature and against our brethren in drawing them from serving the true God, and a punishment commanded by God to be inflicted once; that punishment, or the like in substance and nature, must ever be such as obliges us in the like cases; The learned professors in Leiden say, ‘They can see no reason but they must oblige under the New Testament.’ I confess when the fault is ceremonial, though the punishment be real, as the cutting off of an infant not circumcised [Gen. 17:14], and some punishments inflicted on the leper, it is not reason the Law should oblige us in the New Testament, either as touching the punishment or the degree. Because these punishments for typical faults are ordained to teach rather than to be punishments, and the Magistrate by no light of nature could make laws against unbaptized infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), p. 299</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

rford%2C+A+Free+Disputation%E2%80%A6+%281649%29%2C+p.+299&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fccff3f6b3e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ccff3f6b3e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text=Though%20Saul%E2%80%99s%20destroying%20of%20the%20Amalekites,could%20make%20laws%20against%20unbaptized%20infants&amp;text=Though%20Saul%E2%80%99s%20destroying%20of%20the%20Amalekites%20in%20that&amp;text=of%20nature%20could%20make%20laws%20against%20unbaptized%20infants" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-21077c0d55" data-kw="">
<blockquote><p>Some judicial precepts are Juris communis, of common equity, such as are agreeable to the instinct and law of nature, common to all men; and these for substance bind all persons, both Jews and Gentiles; as being Moral, and so agreeing with the Moral Law. These judicial precepts which were Juris particularis, of particular equity, such as pertained especially to the Jews’ commonwealth, and were fitted for them and their time, are now abolished, e.g., that a man should marry with none but his own stock; that the brother should raise up seed to his brother, and that a thief should restore fourfold, this was peculiar to the Jewish commonwealth and not to ours…. So then those judicial and civil precepts which are agreeable to the Moral Law, and do confirm and uphold it, they bind for ever. For example, ’tis a judicial Law that adulterers and adulteresses should die the death; now this being agreeable to common equity, and to the Law of Nature, as appears (Gen. 38:24) where Judah (before this judicial Law was publish by Moses) appoints Tamar his daughter-in-Law to be burnt for this sin, and Nebuchadnezzar burnt Ahab and Zedekiah for it (Jer. 29:21-23), so this judicial Law of putting witches to death by the magistrate, is agreeable to common equity, it helps to preserve all the Moral precepts which are broken by the idolatry, murder, and malice, of witches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, (1658), pp. 227-28</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5b880359da" data-kw="hypostatic union">
<blockquote><p>In the Christian religion there are two questions above all others which are difficult. The first concerns the unity of the three persons in the one essence in the Trinity; the other concerns the union of the two natures in the one person in the incarnation. As in the Trinity the unity of essence does not hinder the persons from being distinct, so the union of natures in the person of Christ does not prevent both the natures and their properties from remaining unconfounded and distinct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.6.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85f68b35e8" data-kw="">
<blockquote><p>Nothing can be plainer than that the Scriptures do teach that Christ is truly God, that He is truly man, and that He is one person. They assert of Him whatever may be said of God, and everything that can be said of a sinless man. They enter into no explanations. They assume it as a certain fact that Christ is God and man in one person, just as they assume that a man is a soul and body in one person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 3, “Person of Christ”</span></figcaption>

</figure><figure class="quote" id="q-a26186edb9" data-kw="assume human nature">
<blockquote><p>Did the Son of God assume human nature into the unity of his person? We affirm against the Socinians. As in the Trinity, the unity of essence does not hinder the persons from being distinct from each other and their properties and operations from being incommunicable, so the union of natures in the person of Christ does not hinder the natures and their properties from remaining distinct and unconfounded.</p></blockquote>

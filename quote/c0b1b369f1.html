<main class="wrap"><figure class="quote" id="q-c0b1b369f1" data-kw="">
<blockquote><p>This external inspection and administration of the magistrate, in reference to religion, is twofold.

1. Corrective, by external punishments.

2. Auxiliary, by external benefits and adminicles. The magistrate may and ought to be both custos et vindex utrisuque tabulae, he ought to preserve both the first and second table of the holy and good law of God, from being despised and violated, and punish by corporal or other temporal punishments, such (whether church officers or church members) as openly dishonour God by gross offences, either against the first or against the second table; and this he doth as God’s deputy and vicegerent, subordinate and subservient to that universal dominion which God Almighty exerciseth over the children of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, the Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh, 1844), p. 122.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>To go as pirates and catch up poor negroes or people of another land, that never forfeited life or liberty, and to make them slaves, and sell them, is one of the worst kinds of thievery in the world; and such persons are to be taken for the common enemies of mankind; and they that buy them and use them as beasts, for their mere commodity, and betray, or destroy, or neglect their souls, are fitter to be called incarnate devils than Christians, though they be no Christians whom they so abuse.</p></blockquote>

</figure><figure class="quote" id="q-e7d02b7932" data-kw="">
<blockquote><p>…an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. [That is, a magistrate not doing these ennumerated things is still a valid magistrate.] For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [from the nature of the magisterial work], and operantium [from the nature of the persons working by the office]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither from the nature or the intention of the work of magistracy, nor from the nature of the magistrate working]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London: 1646), ch. 24, pp. 547-48</span></figcaption>

f%20the%20magistrate%20working" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-80218f438b" data-kw="">
<blockquote><p>Moreover, the law of Moses is an example of the natural law, most suitably expressing the common notions of nature endowed by natural law. For the principles and conclusions of the natural law, that is, those common notions of nature, are perfectly expressed in the law of Moses. These common notions not only exist in the corrupted nature of man, but also existed in the pure and original nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mosaic Polity</cite>, trans. Todd M. Rester, ed. Andrew M. McGinnis (Grand Rapids: CLP Academic 2015), 60.</span></figcaption>

</figure><figure class="quote" id="q-ad1dc4f407" data-kw="">
<blockquote><p>Vers. 32. And the Spirits of the Prophets are subject to the Prophets.

Reason 3. Because the Spirits of the Prophets are to be examined and judged of by the other Prophets, who might afterwards give their opinions concerning those things which were heard, whether anyone hath seasonably interrupted another, and whether it were agreeable to the Word of God, which was delivered by him; and therefore there was no danger, if he that spoke before, should give place to him that modestly interrupted him, and so more might speak in their order.

When he refers to the Prophets, the judging of the Spirit, or the Doctrine which the Prophet utters by the Spirit, he does not exclude Spiritual men, i. e. the other Governors of the Church, who were skilful in spiritual knowledge and judgement, such as all ought to be in an Ecclesiastical Senate: For he commands these, vers. 37. together with the Prophets, or Ministers of the Word, that according to their Ecclesiastical authority, they acknowledge and defend their doctrine in the Church, that according thereunto they would judge and determine concerning those that were disorderly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 64.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

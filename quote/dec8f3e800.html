</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24451dee93" data-kw="">
<blockquote><p>…Christ Himself is not by us worshipped under any other formal reason but as He is God… 1. Jesus Christ, the Mediator, being theanthropos, God and man… is to be worshipped with divine religious worship, even as the Father…. 2. That our religious, divine and spiritual worship, has a double or two-fold respect unto Jesus Christ: (1) As He is the ultimate formal object of our worship, being God, to be blessed for evermore… (2) As the way, means and cause of all the good we receive from God in our religious approach to Him…. 3. That Jesus Christ our Mediator, theanthropos, God and man, who is to be worshipped with divine or religious worship, is to be so worshipped because He is our Mediator. That is, his mediation is the ratio quia, an unconquerable reason and argument, why we ought to love Him, fear Him, believe in Him, call upon Him, and worship Him in general… 4. Though Jesus Christ, who is our Mediator, God and man, is to be worshipped with divine worship, even as we honor the Father, yet this is not as He is mediator, but as He is God, blessed for evermore… That is, his mediatory office is not the formal cause and reason of yielding divine worship to Him, nor under that consideration is that worship ultimately terminated in Him… Now the formal cause or reason of all divine worship is the deity or divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 19, ‘Of Christ’s Kingly Office’, pp. 373-96 in The Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12 See especially bottom of p. 385 ff., pp. 385-389</span></figcaption>

url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F24451dee93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/24451dee93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-grounds-of-christ-the-mediator-receiving-divine-worship/#:~:text=Christ%20Himself%20is%20not%20by%20us,is%20the%20deity%20or%20divine%20nature&amp;text=Christ%20Himself%20is%20not%20by%20us%20worshipped%20under&amp;text=divine%20worship%20is%20the%20deity%20or%20divine%20nature" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>First of all, therefore, our position must be explained briefly, which is emphatically this: That the whole Christ is indeed to be worshipped and called upon by us lest we divide the person of Christ (which is unique, consisting of both natures), or separate it. But worship ought not to be directed to the whole of Christ, lest we confuse the natures which remain in the Person unconfused, or regard the human as equal to the divine. Both our worship and invocation are in fact not rendered or directed properly and of themselves to the flesh of Christ itself, that is, to the human nature,¹ but rather to the Deity of Christ itself, nor indeed as it subsists by itself and separate, outside of the assumed human nature (as Nestorius understood, and Cyril refuted in his Anathemas), but instead as it is ever joined together with the same assumed nature in one Person, and remains united. ¹ [Daneau uses strong language below about not directing worship to Christ’s human nature. However, in light of this sentence, and other evidence below, it is clear Daneau is not denying that worship may be materially directed to Christ’s human nature, but only that worship is not to be formally directed to Christ’s human nature.] For in the same way when we praise anyone (for example Apollo, the fellow-worker [Greek] of Paul) as blessed [Greek] and endowed with the greatest faculty of reasoning and understanding, we indeed praise the whole man himself, who consists of body and soul, and we celebrate and proclaim him. Nevertheless the praise and proclamation of that person’s reason and intelligence pertains only to his mind, which nevertheless remains not separately and in itself, but rather conjoined together with its own body. In such a way do we offer our adoration and invocation indeed to the whole Christ (who is God and man) but nevertheless the praise in and of itself, and the invocation and worship, we offer not to the whole of Christ, but rather to his deity, and this we regard, even though it does not subsist piecemeal [Greek], that is, not having a hypostasis of its own, by itself, outside of the human nature. In summary therefore, while we worship Christ, and call upon Him (though here we are talking about religious worship and adoration, but not civil adoration and invocation, a point on which we agree with Chemnitz), neither our invocation nor adoration is directed at, in and of itself, or looks toward, the flesh of Christ itself, even though it remains in union of the Person. And these are some of the many reasons for our opinion. 1. First. The man is cursed (says the prophet, speaking as the very person of God) who puts his trust in man, and makes fleshhis arm (Jeremiah 17:5). Now the flesh of Christ is true flesh, and the man Christ is true man. But the one who adores or calls upon any man in religious worship puts his trust in him whom he thus calls upon and worships. Therefore he who directs his worship to the flesh of Christ itself has been cursed by the mouth of God Himself. 2. Second. They are true idolaters who serve, that is adore or call upon those, who by nature are not Gods (Galatians 4[:8]). Now Christ’s flesh is not by nature God, even though it is hypostatically united to the true God. Therefore those who direct their invocation particularly to it are true idolaters. Butthis word ‘nature’ is of such great significance in this passage of Paul, that even if Chemnitz’s construct of the real communication of the essential properties of deity into the assumed human nature were true, nevertheless the result would not be that on this account Christ’s flesh was an object of worship, which it would [then] be God by grace and [yet] not by nature. 3. Third. Those who adore or call upon their own fellow-slaves who are from among their brothers in religious worship are chastised by the Holy Spirit Himself through his angel and condemned (Revelation 19:10; 22:8). And Christ, as man, is fellow-slave and one of our brothers, even if He is the firstborn. Therefore as man, Christ should not be adored or called upon. 4. Fourth. Only God should be adored (Revelation 19:10). But Christ’s flesh is not God. Therefore. 5. Fifth. He who calls upon a creature or adores one with religious worship, is a blasphemer against God (Deuteronomy 4:6; 10:17; Matthew 4:10). Christ’s flesh remains a creature, even though it is glorified and in the union of the Person of Christ (Augustine on John, sermon 58), therefore he who directs his worship to it blasphemes God. 6. Paul, though he says Christ should be adored, explains that it is to be attributed to Him by reason of his nature, calling Him God (Romans 9:5). Therefore Christ, as God, and not as man, should be adored. 7. The Lord says (Isaiah 43[42:8]), I will not give my glory to another. Therefore the glory of God should not be given to him [that]. And this is the glory of God: religious worship. 8. This was once the error of Nestorius: he taught that Christ, as He is man, should be worshipped together with the Word. Therefore he is a Nestorian who teaches and stresses the same thing today. 9. All the orthodox fathers teach that our invocation and adoration should not be directed to the flesh of Christ itself, even as it remains in the hypostasis of the Son of God, but rather to the very deity of the Son. Therefore he contradicts the orthodox fathers and the pious and learned ancient practice of the Church who desires and thinks and says, when Christ is adored or called upon, that the flesh of Christ itself is also an object of this sort of adoration and invocation. And a little later [in Chemnitz], But I ask, how can it happen that, if Christ’s human nature, just as the divine also, should be worshipped and adored, that it would itself not also be divine, that is, God? And would it follow logically that the distinction between the natures still remain preserved? And a little later, Chemnitz first of all works partly from the very solid and unvanquished foundation by which it is said that no creature ought to be worshipped, and partly by the making sport of the very true and suitable analogy of the crown by which the king is adorned, and which is greeted along with the king himself. Therefore (says Chemnitz), Christ’s flesh should not be adored apart from the union. But whoever said this or thought this? Much to the contrary, the fathers themselves, whose testimonies I have offered, deny, and clearly so, that Christ’s flesh, even as it remains in the union, ought to have our adoration directed to it. Therefore Chemnitz seeks precedence, and perverts the fathers, while he wishes to twist their opinions to his own, though they teach so clearly that not even united to the Word [logos] is the flesh in Christ an object of our worship. And the reason is, since the flesh of Christ, even in the union, is true flesh, and truly creature. And so it is never to be adored with religious worship.</p></blockquote>

— Lambert Daneau, Examination of the Book of Dr. Chemnitz regarding the Two Natures in Christ (1581) as quoted and translated in Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586 ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), pp. 404-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+of+all%2C+therefore%2C+our+position+must+be+explained+briefly%2C+which+is+emphatically+this%3A+That+the+whole+Christ+is+indeed+to+be+worshipped+and+called+upon+by+us+lest+we+divide+the+person+of+Christ+%28which+is+unique%2C+consisting+of+both+natures%29%2C+or+separate+it.+But+worship+ought+not+to+be+directed+to+the+whole+of+Christ%2C+lest+we+confuse+the+natures+which+remain+in+the+Person+unconfused%2C+or+regard+the+human+as+equal+to+the+divine.+Both+our+worship+and+invocation+are+in+fact+not+rendered+or+directed+properly+and+of+themselves+to+the+flesh+of+Christ+itself%2C+that+is%2C+to+the+human+nature%2C%C2%B9+but+rather+to+the+Deity+of+Christ+itself%2C+nor+indeed+as+it+subsists+by+itself+and+separate%2C+outside+of+the+assumed+human+nature+%28as+Nestorius+understood%2C+and+Cyril+refuted+in+his+Anathemas%29%2C+but+instead+as+it+is+ever+joined+together+with+the+same+assumed+nature+in+one+Person%2C+and+remains+united.+%C2%B9+%5BDaneau+uses+strong+language+below+about+not+directing+worship+to+Christ%E2%80%99s+human+nature.+However%2C+in+light+of+this+sentence%2C+and+other+evidence+below%2C+it+is+clear+Daneau+is+not+denying+that+worship+may+be+materially+directed+to+Christ%E2%80%99s+human+nature%2C+but+only+that+worship+is+not+to+be+formally+directed+to+Christ%E2%80%99s+human+nature.%5D+For+in+the+same+way+when+we+praise+anyone+%28for+example+Apollo%2C+the+fellow-worker+%5BGreek%5D+of+Paul%29+as+blessed+%5BGreek%5D+and+endowed+with+the+greatest+faculty+of+reasoning+and+understanding%2C+we+indeed+praise+the+whole+man+himself%2C+who+consists+of+body+and+soul%2C+and+we+celebrate+and+proclaim+him.+Nevertheless+the+praise+and+proclamation+of+that+person%E2%80%99s+reason+and+intelligence+pertains+only+to+his+mind%2C+which+nevertheless+remains+not+separately+and+in+itself%2C+but+rather+conjoined+together+with+its+own+body.+In+such+a+way+do+we+offer+our+adoration+and+invocation+indeed+to+the+whole+Christ+%28who+is+God+and+man%29+but+nevertheless+the+praise+in+and+of+itself%2C+and+the+invocation+and+worship%2C+we+offer+not+to+the+whole+of+Christ%2C+but+rather+to+his+deity%2C+and+this+we+regard%2C+even+though+it+does+not+subsist+piecemeal+%5BGreek%5D%2C+that+is%2C+not+having+a+hypostasis+of+its+own%2C+by+itself%2C+outside+of+the+human+nature.+In+summary+therefore%2C+while+we+worship+Christ%2C+and+call+upon+Him+%28though+here+we+are+talking+about+religious+worship+and+adoration%2C+but+not+civil+adoration+and+invocation%2C+a+point+on+which+we+agree+with+Chemnitz%29%2C+neither+our+invocation+nor+adoration+is+directed+at%2C+in+and+of+itself%2C+or+looks+toward%2C+the+flesh+of+Christ+itself%2C+even+though+it+remains+in+union+of+the+Person.+And+these+are+some+of+the+many+reasons+for+our+opinion.+1.+First.+The+man+is+cursed+%28says+the+prophet%2C+speaking+as+the+very+person+of+God%29+who+puts+his+trust+in+man%2C+and+makes+fleshhis+arm+%28Jeremiah+17%3A5%29.+Now+the+flesh+of+Christ+is+true+flesh%2C+and+the+man+Christ+is+true+man.+But+the+one+who+adores+or+calls+upon+any+man+in+religious+worship+puts+his+trust+in+him+whom+he+thus+calls+upon+and+worships.+Therefore+he+who+directs+his+worship+to+the+flesh+of+Christ+itself+has+been+cursed+by+the+mouth+of+God+Himself.+2.+Second.+They+are+true+idolaters+who+serve%2C+that+is+adore+or+call+upon+those%2C+who+by+nature+are+not+Gods+%28Galatians+4%5B%3A8%5D%29.+Now+Christ%E2%80%99s+flesh+is+not+by+nature+God%2C+even+though+it+is+hypostatically+united+to+the+true+God.+Therefore+those+who+direct+their+invocation+particularly+to+it+are+true+idolaters.+Butthis+word+%E2%80%98nature%E2%80%99+is+of+such+great+significance+in+this+passage+of+Paul%2C+that+even+if+Chemnitz%E2%80%99s+construct+of+the+real+communication+of+the+essential+properties+of+deity+into+the+assumed+human+nature+were+true%2C+nevertheless+the+result+would+not+be+that+on+this+account+Christ%E2%80%99s+flesh+was+an+object+of+worship%2C+which+it+would+%5Bthen%5D+be+God+by+grace+and+%5Byet%5D+not+by+nature.+3.+Third.+Those+who+adore+or+call+upon+their+own+fellow-slaves+who+are+from+among+their+brothers+in+religious+worship+are+chastised+by+the+Holy+Spirit+Himself+through+his+angel+and+condemned+%28Revelation+19%3A10%3B+22%3A8%29.+And+Christ%2C+as+man%2C+is+fellow-slave+and+one+of+our+brothers%2C+even+if+He+is+the+firstborn.+Therefore+as+man%2C+Christ+should+not+be+adored+or+called+upon.+4.+Fourth.+Only+God+should+be+adored+%28Revelation+19%3A10%29.+But+Christ%E2%80%99s+flesh+is+not+God.+Therefore.+5.+Fifth.+He+who+calls+upon+a+creature+or+adores+one+with+religious+worship%2C+is+a+blasphemer+against+God+%28Deuteronomy+4%3A6%3B+10%3A17%3B+Matthew+4%3A10%29.+Christ%E2%80%99s+flesh+remains+a+creature%2C+even+though+it+is+glorified+and+in+the+union+of+the+Person+of+Christ+%28Augustine+on+John%2C+sermon+58%29%2C+therefore+he+who+directs+his+worship+to+it+blasphemes+God.+6.+Paul%2C+though+he+says+Christ+should+be+adored%2C+explains+that+it+is+to+be+attributed+to+Him+by+reason+of+his+nature%2C+calling+Him+God+%28Romans+9%3A5%29.+Therefore+Christ%2C+as+God%2C+and+not+as+man%2C+should+be+adored.+7.+The+Lord+says+%28Isaiah+43%5B42%3A8%5D%29%2C+I+will+not+give+my+glory+to+another.+Therefore+the+glory+of+God+should+not+be+given+to+him+%5Bthat%5D.+And+this+is+the+glory+of+God%3A+religious+worship.+8.+This+was+once+the+error+of+Nestorius%3A+he+taught+that+Christ%2C+as+He+is+man%2C+should+be+worshipped+together+with+the+Word.+Therefore+he+is+a+Nestorian+who+teaches+and+stresses+the+same+thing+today.+9.+All+the+orthodox+fathers+teach+that+our+invocation+and+adoration+should+not+be+directed+to+the+flesh+of+Christ+itself%2C+even+as+it+remains+in+the+hypostasis+of+the+Son+of+God%2C+but+rather+to+the+very+deity+of+the+Son.+Therefore+he+contradicts+the+orthodox+fathers+and+the+pious+and+learned+ancient+practice+of+the+Church+who+desires+and+thinks+and+says%2C+when+Christ+is+adored+or+called+upon%2C+that+the+flesh+of+Christ+itself+is+also+an+object+of+this+sort+of+adoration+and+invocation.+And+a+little+later+%5Bin+Chemnitz%5D%2C+But+I+ask%2C+how+can+it+happen+that%2C+if+Christ%E2%80%99s+human+nature%2C+just+as+the+divine+also%2C+should+be+worshipped+and+adored%2C+that+it+would+itself+not+also+be+divine%2C+that+is%2C+God%3F+And+would+it+follow+logically+that+the+distinction+between+the+natures+still+remain+preserved%3F+And+a+little+later%2C+Chemnitz+first+of+all+works+partly+from+the+very+solid+and+unvanquished+foundation+by+which+it+is+said+that+no+creature+ought+to+be+worshipped%2C+and+partly+by+the+making+sport+of+the+very+true+and+suitable+analogy+of+the+crown+by+which+the+king+is+adorned%2C+and+which+is+greeted+along+with+the+king+himself.+Therefore+%28says+Chemnitz%29%2C+Christ%E2%80%99s+flesh+should+not+be+adored+apart+from+the+union.+But+whoever+said+this+or+thought+this%3F+Much+to+the+contrary%2C+the+fathers+themselves%2C+whose+testimonies+I+have+offered%2C+deny%2C+and+clearly+so%2C+that+Christ%E2%80%99s+flesh%2C+even+as+it+remains+in+the+union%2C+ought+to+have+our+adoration+directed+to+it.+Therefore+Chemnitz+seeks+precedence%2C+and+perverts+the+fathers%2C+while+he+wishes+to+twist+their+opinions+to+his+own%2C+though+they+teach+so+clearly+that+not+even+united+to+the+Word+%5Blogos%5D+is+the+flesh+in+Christ+an+object+of+our+worship.+And+the+reason+is%2C+since+the+flesh+of+Christ%2C+even+in+the+union%2C+is+true+flesh%2C+and+truly+creature.+And+so+it+is+never+to+be+adored+with+religious+worship.%E2%80%9D%0A%0A%E2%80%94+Lambert+Daneau%2C+Examination+of+the+Book+of+Dr.+Chemnitz+regarding+the+Two+Natures+in+Christ+%281581%29+as+quoted+and+translated+in+Jakob+Andreae+%26+Theodore+Beza%2C+Lutheranism+vs.+Calvinism%3A+the+Classic+Debate+at+the+Colloquy+of+Montbeliard+1586+ed.+Jeffrey+Mallinson+tr.+Clinton+J.+Armstrong+%28Concordia+Publishing+House%2C+2017%29%2C+pp.+404-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1619c7d1a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1619c7d1a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-grounds-of-christ-the-mediator-receiving-divine-worship/#:~:text=First%20of%20all%2C%20therefore%2C%20our%20position,to%20be%20adored%20with%20religious%20worship&amp;text=First%20of%20all%2C%20therefore%2C%20our%20position%20must%20be&amp;text=is%20never%20to%20be%20adored%20with%20religious%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. The intrinsical acts of God which do connote some habitude and respect to some thing that is out of the Godhead, are the will of God, or the essence of God considered after the manner of an act of his will, ‘essentia ex se actuosa’ (as the Schools speak) ‘concepta per modum actus volendi.’ If this act be considered in itself, it is nothing else but the will or essence of God, because it is an intrinsical and vital act. But now if this act be considered as relative, and as related to some thing that is out of God, we say this act is not necessary, but free in respect of all those things which God decrees to produce or permit in the world; for God does arbitrarily decree to permit or produce this, and not that, according to the counsel of his own will, it being as truly and fully in his power to permit or produce that, as this: both were alike possible, but this is made future, and will in the fullness of time be present in act by virtue of the free decree of God; for all creatures are produced and do exist by the will of God. It is most evident that the will of God is the same whether it act upon Himself or something that is out of the Godhead. 5. The relation which is between the will of God, and the creature, whether in futurition, or existence, is extrinsical. 6. The denominations grounded upon the termination, or relation of the will of God towards the creatures, is extrinsecal also. 7. These actions of God which are said to be rather from God, than in God, as to create, govern, redeem or the like, are called extrinsical, and therefore the denomination of God from them must needs be extrinsical. 8. We have no ground to conceive that the essence of God is compounded with extrinsical terminations, relations, or denominations. 9. Though the objects which God does will are very different, and their production is successive, yet the will of God is the self same, and is one single and pure act: the Power of willing and the act of willing are not distinct in God; nay God does will his own happiness necessarily, and the happiness of men and angels freely by the same will; necessity and liberty do not make distinct powers or wills in God. 10. There is no potentia executiva in God, and therefore all those conceits of Vorstius [an Arminian] concerning any change or composition in God by several acts or decrees are but mere dreams, and vain conceits, though they be now published to the world, not with less blasphemy than impudence in this licentious age. It is evident by what has been said that the eminent virtue of God (notwithstanding its several objects, egresses, terminations, relations, denominations and effects) is one single and infinite perfection. This will be the constant result and conclusion of all sober debates, and Christian discussions.</p></blockquote>

<blockquote><p>No consideration of flesh or human nature is necessary. Much to the contrary, it should be utterly removed from religious adoration of God and the divine nature, even in Christ Himself. Since this honor is owed to God alone (Deuteronomy 6[:14-15]; Matthew 4[:10]).</p></blockquote>

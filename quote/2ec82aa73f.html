<blockquote><p>Though God’s mind be most plainly revealed to us in his written Word, yet are his Providences also teaching, and it is the duty of his Servants to read and study them, especially the Penal withdrawing or withholding of his grace, and giving men up to believe lies, and to vile affections, to a reprobate sense, and to an abominable conversation, these are such discoveries of the sore displeasure of the Most High, as should make even the beholders to fear, and all that stand but near to this heavy judgement to fly away from it, as the Israelites did at the cries of the Rebellious followers of Corah, Num. 16. lest the earth should have swallowed them up also:

I am not of their mind that make light of the strange Providences in our military affairs and changes of State, though I think every carnal admirer of them doth not understand them: But it’s a matter of very sad consideration, that many of those same men that seem so much to magnify these, do no more observe, understand, and lay to heart the more remarkable Providence of our heavy spiritual judgements!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Vers. 24. Then cometh the end, when he shall have delivered up the Kingdom to God, even the Father, when he shall have put down all rule, and authority, and power.

He further declares this Argument, shewing that by the purpose of God, two things are conjoined in time, with the end of the world, viz. The delivering up the Kingdom by the Son into the hands of the Father, and the putting down of all rule, authority, and contrary power; whereof this is the meaning: After Christ shall have subdued and abolished all adverse power, as the Devil, the World, and the rest, of what kind soever, he will vanquish those powers so far forth, that they shall not any longer be injurious to his members, all of them being thrust down to hell; at last Christ shall present his Church (which is called the Kingdom of Christ, given him of his Father) every way perfect, and deliver it up, as it were, into the hands of his Father.

Thirdly, Having now perfected his Mediatory Office, and laid aside that manner of ruling, by those means which he now useth for the gathering and governing of his Church. Fourthly, Having finished all things which were committed to him by his Father to finish, he shall resign up the Kingdom also committed to him, over all things which are in the world, to the perfecting the work of our Redemption, he shall (I say) deliver up the Kingdom to God, according to his Humanity, and to his Father, according to his Divinity; not that he shall cease to reign immediately, but mediately, and as before: not that he shall leave off to reign with the Father, but shall cease to reign as deputed by the Father, to conflict with his enemies, or to administer any longer in a laborious and painful work of gathering his Church, otherwise there is no end of his Kingdom, he shall indeed reign much more gloriously than now he doth, when his adversaries are conquered, without the Ministry of Angels or men, he shall govern, together with the Father, and fill all his with light, love, life, with his virtues immediately. …

Vers. 28. And when all things shall be subdued unto him, then shall the Son also himself bee subject unto him that put all things under him, that God may be all in all.

This he further illustrates, because the Mediatory Kingdom of Christ being delivered up, as was now said, the Son himself is to be subjected unto God, who hath subdued all things to him, that God may be all in all, i. e. Christ as man having laid aside his Mediatory Embassage, will most fully manifest, that all things which were done by him as man, were done in the power, authority, and Name of God; and that he, as man, is less than the Father, being for ever united to his Body, the Church, is subject to the Father; that the mediation, and means, and instruments, and helps which are now used being laid aside, God the Father, Son, and Holy Ghost, may supply all the necessities of the Saints immediately; and may by his power bee all means in all his Saints, and may altogether extinguish the necessity of all means, instruments, and helps by his immediate presence with them most fully for ever; and he will more than supply the room of all those; and he himself by his power and efficacy, will be more than all these, and what ever may be needful for the most happy felicity of all his Saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 66-67.</span></figcaption>

</figure><figure class="quote" id="q-3904a79ece" data-kw="">
<blockquote><p>Consecrating of churches is taken two ways:

1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches:

1. That the end being sacred, to wit, the habitual worshipping of God in that place.

2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple.

2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place.

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.”

— Samuel Rutherford, The Divine Right of Church Government, ... (1646), pp. 90-91">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConsecrating+of+churches+is+taken+two+ways%3A+1.+For+a+mere+dedication+or+civil+destination+of+any+thing+to+its+end+and+use%3A+As+when+a+house+is+builded%2C+a+garment+is+first+put+on%2C+when+we+refresh+ourselves+with+a+draught+of+water%2C+we+may+pray+for+a+blessing+on+these+%5BLk.+9%3A16%5D%2C+and+on+all+the+creatures+for+our+use+%5B1+Tim.+4%3A4-5%5D%3B+and+the+very+habitual+intention+of+the+builder+of+an+house+to+dwell+in+is+a+civil+dedication+of+it+to+that+use+for+which+it+is+ordained.+Prayer+added+to+it+for+a+blessing+of+it+in+the+use+makes+not+a+consecrated+thing%3B+for+then+my+clothes+every+day+put+on%2C+my+sleep%2C+my+daily+walking+in+and+out%2C+my+physic%2C+my+meals%2C+my+horse%2C+my+ship+I+sail+in%2C+should+all+be+holy%2C+consecrated+and+religious+things%2C+which+I+were+to+reverence+as+religious+things%3B+for+all+these+may+be+blessed+in+their+use.+%5B2.%5D+But+here+is+that+%5Bwhich%5D+we+condemn+in+religious+dedication+of+churches%3A+1.+That+the+end+being+sacred%2C+to+wit%2C+the+habitual+worshipping+of+God+in+that+place.+2.+The+praying+for+the+church+or+house+of+worship%2C+to+say+nothing+of+the+vain+ceremonies+used+in+the+dedication+of+churches%3A+These+two+are+applied+to+make+the+church+holy+and+to+denominate+it+the+house+of+God%2C+and+capable+of+religious+veneration+and+salutation+%5Bit+was+the+custom+of+Anglicans+to+bow+to+or+salute+even+the+architecture+or+furniture+of+the+church%E2%80%99s+building%5D.+Then%3A+%5B1.%5D+Certainly+all+the+synagogues+of+Judea+should+be+religiously+holy%2C+as+was+the+Temple.+2.+And+prayers+should+be+more+acceptable+to+God+in+the+synagogue+for+the+house%E2%80%99s+sake+%5Bas+was+an+Anglican+custom+for+their+church+buildings%5D%2C+than+prayers+in+any+other+place.+3.+God+shall+bind+Himself+by+promise+to+hear+prayers+in+the+synagogue%2C+or+made+with+the+face+toward+the+synagogue%2C+as+He+did+toward+the+Temple%3A+we+were+%5Bthen%5D+obliged+in+the+New+Testament+to+pray+with+our+faces+toward+the+churches+or+meeting+places+in+the+New+Testament%2C+and+we+should+have+one+famous+and+celebrious+Church+for+all+Jews+and+gentiles+more+holy+than+all+the+little+holy+temples+now+consecrated+as+holy+places%2C+and+where+shall+this+be%3F+And+what+typical+signification+shall+it+have%3F+It+must+signify+Christ+to+come%2C+or+already+come%3B+both+are+unlawful.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+...+%281646%29%2C+pp.+90-91&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3904a79ece.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3904a79ece.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-meeting-places-for-public-worship/#:~:text=Consecrating%20of%20churches%20is%20taken%20two,or%20already%20come%3B%20both%20are%20unlawful&amp;text=Consecrating%20of%20churches%20is%20taken%20two%20ways%3A%201&amp;text=to%20come%2C%20or%20already%20come%3B%20both%20are%20unlawful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>HAVING finished (Right Worshipful,) the Translation of this Logical, and Theological Treatise; I thought good, both for the patronizing of the Book, and the Testimony of my duty, to offer the Dedication of the same unto your Worshipper: for the former cause, that as the Author himself, dedicated this Book at first to such persons, as were for authority able, and for Religion zealous to protect the same; so I the unworthy Translator of so worthy an Author, made bold to make choice of your Worship, being for authority in your place, no less eminent, and for zeal to Religion no worse affected, To the end it may be shielded by your Patronage, from the mouths of the malignant; not in regard of my labour herein, (which as it is but small, if either the quantity of the Book, or the Authors own Industry be considered; so it is not without imperfections, which notwithstanding, I hope the discreet, with favourable Connivence will pass over, considering the difficulty of Translation in this succinct and Logical kind of writing, and the penury of our English Language in the Terms of Art;) but in respect of the matter it self, which being so worthy, for Gods cause deserveth, and so profitable for the Churches sake, desireth your favourable countenance.

For the latter Cause, that as your Worship, is my best, and chiefest favourer, and that for the best and chiefest cause, the profession of godliness; so meet it were I should declare, whom first, and best I should remember in this the first fruit of my labour, and best token of my love: best I say, in regard of the matter, which is here contained, though least to be esteemed in respect of the manner, how it is by me delivered; which (though being offered in a homely style, as a golden Treasure in an earthen vessel, or a rich Pearl in a polluted hand) I trust your worship will not reject. And so I commend the same, such as it is, to your Worship, in your Christian favour to bee regarded, your self to the Lord in his continual mercy to bee protected, and all that I am, and have to your self, at your godly pleasure to be commanded,

JOHN GAWEN</p></blockquote>

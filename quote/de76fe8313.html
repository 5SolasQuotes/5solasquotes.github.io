<main class="wrap"><figure class="quote" id="q-de76fe8313" data-kw="">
<blockquote><p>Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 3, ch. 8, Digression 4</cite>, p. 194</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654)</cite>, pp. 211-13, 218-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.”

</figure><figure class="quote" id="q-5348ac5b40" data-kw="">
<blockquote><p>Freedom from the laws of Moses is that by which Christians are loosed from the ceremonial and judicial laws of Moses, namely so far forth as they only pertain to the civil government under Moses. 1 Cor. 9:1, 19; 2 Cor. 3:17; Heb. 9:10. For such laws which belong to the law of nature, and by which all nations are bound, are not abrogated.</p></blockquote>

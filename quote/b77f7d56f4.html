<main class="wrap"><figure class="quote" id="q-b77f7d56f4" data-kw="">
<blockquote><p>And he says, though He be a king, yea, the King of Kings, yet He stands at the door and knocks, that is, calls them to repentance and promises if they will let Him in, that is, turn from their sin and yield to his will, He will come unto them and sup with them, signifying what exceeding joy and comfort they should receive by Him; yea, they should be made partakers of the joys of Heaven: where he alludes to the comfort that friends have one of another when they meet together at their dinners, suppers and feasts, which thing, if it be comfortable to men, much more comfort shall it minister unto us, to be partakers of the company of Christ Jesus Himself in his heavenly banquet. A second benefit he notes in that those that do thus receive Him and overcome shall not only receive comfort, but glory also and honor in his Kingdom…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Explanation of the Whole Revelation of St. John</cite>, … (d. 1603; London: 1622), ch. 3, p. 22</span></figcaption>

<blockquote><p>…but take these for marks of deluded men: … 2. Profession [of Christianity] looks like paradise and the rainbow; its big in its own eyes and the fairest for variety of coulors, but its a self-plague and does carry millions of souls to hell without din and noise of feet, it’s Christ acting judicially on the hypocrite within pistol shot of a besieged soul, making fire-works under the earth; and when all within are sleeping, Christ springs a powder-mine, and burns up all forward: Gospel-fire-works makes more than ordinary fury in the soul; Open, open to Christ;</p></blockquote>

</figure><figure class="quote" id="q-9e6d3c36ef" data-kw="">
<blockquote><p>55. Nor can it [unregenerate choice] apprehend offered grace, unless it first receives through regeneration the faculty of apprehending. 56. In receiving this faculty of apprehending grace and assenting to the promise, it conducts itself merely passively, because then the choice is only the subject in which God works, in which he imprints new qualities and inclinations (Ezk. 11:19; 36:26; Eccl. 17:14; Job 33:3-6; Jn. 1:13). 57. But in the very apprehension of grace, or the act of apprehending, it conducts itself both passively and actively; for the choice acts, but having been acted upon by the Holy Spirit (Ezk. 36:27). 58. For one thing is δύναμις, the faculty of apprehending; another is ἐνέργεια, the act of apprehending or the apprehension itself. 59. After the choice has been regenerated, it indeed wills and does good, and perseveres in it, but only insofar as God effects and confirms these things in it (Phil. 1:6, 2:13; 1 Cor. 4:7; Jn. 15:5; 1 Cor. 12:3, 1:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Choice of Man’, pt. 2</cite>, (Basel: Waldkirchius, 1597) trans. at Obedientia Mortis Christi Latin</span></figcaption>

<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

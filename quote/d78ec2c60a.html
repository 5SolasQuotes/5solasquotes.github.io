<main class="wrap"><figure class="quote" id="q-d78ec2c60a" data-kw="">
<blockquote><p>The Gospel of Christ in general is this: It is the good Tidings that God hath revealed concerning Christ, This hath come unto your ears, the good Tidings concerning Christ, for so the word [Gospel] the Greek word signifies nothing else but the good Tidings; the good Tidings that comes from Heaven unto you concerning Jesus Christ, that’s the Gospel of Christ.

More largely it is this, As all Mankind were lost in Adam, &amp; become the children of wrath, put under the sentence of death, God though he left his fallen Angels, and hath reserved them in the chains of eternal darkness, yet he hath thought upon the children of men, he hath provided a way of atonement to reconcile them to himself again. Namely, the second Person in Trinity takes man’s nature upon him, and becomes the Head of a second Covenant, standing charged with man’s sin, and to answer for it in a way of suffering what the Law and Divine Justice required, and for making satisfaction, and keeping the Law perfectly, which satisfaction and righteousness he tenders up unto the Father as a sweet savour of Rest for the souls of those that are given to him[.]

[A]nd now, this mediation of Christ is by the appointment of the Father preached to the children of men, of what Nation or rank soever, freely offering this unto sinners for atonement for them, requiring them to believe in him, and upon believing, promising not only a discharge of all their former sins, but that they shall never enter into condemnation, that none of their sins or unworthiness shall ever hinder the peace of God with them, but that they shall through him be received into the number of Sons, that they shall have the Image of God again to be renewed in them, &amp; that they shall be kept by the Power of God through faith and salvation, that these souls and bodies shall be raised to the height of glory that such creatures are capable of, that they shall live for ever enjoying the presence of God, and Christ, in the fulness of all good; this is the Gospel of Christ; this is the sum of the Gospel that is preached unto sinners[.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 3-4.</span></figcaption>

<blockquote><p>c. Special grace is irresistible. This does not mean that it is a deterministic force which compels man to believe against his will, but that by changing the heart it makes man perfectly willing to accept Jesus Christ unto salvation and to yield obedience to the will of God. Common grace is resistible, and as a matter of fact is always more or less resisted. Paul shows in Rom. 1 and 2 that neither the Gentiles nor the Jews were living up to the light which they had. Says [W.G.T.] Shedd: “In common grace the call to believe and repent is invariably ineffectual, because man is averse to faith and repentance and in bondage to sin.” [Calvinism Pure &amp; Mixed, p. 99.] It is ineffectual unto salvation because it leaves the heart unchanged. d. Special grace works in a spiritual and re-creative way, renewing the whole nature of man, and thus making man able and willing to accept the offer of salvation in Jesus Christ, and to produce spiritual fruits. Common grace, to the contrary, operates only in a rational and moral way by making man in a general way receptive for the truth, by presenting motives to the will, and by appealing to the natural desires of man. This is equivalent to saying that special (saving) grace is immediate and supernatural, since it is wrought directly in the soul by the immediate energy of the Holy Spirit, while common grace is mediate, since it is the product of the mediate operation of the Holy Spirit through the truth of general or special revelation and by moral persuasion.</p></blockquote>

<blockquote><p>Christ knocks at the door of thy heart, O sinner. Though invisible to mortal eyes, He is here, whether you regard it or not. He knocks. But how? By his Word—by a preached gospel—by the admonitions of conscience—and by the strivings of his Spirit. Nor is this all. He calls. “Unto you O men, I call, and my voice is unto the sons of men.” [Prov. 8] He calls by all the invitations of mercy contained in the Bible.</p></blockquote>

<blockquote><p>[407] Although vicarious atonement as the acquisition of salvation in its totality cannot therefore be expanded to include all persons individually, this is not to say that it has no significance for those who are lost. Between the church and the world there is, at this point, not just separation and contrast. It is not the case that Christ has acquired everything for the former and nothing for the latter. … And also his work has value for all, even for those who have not believed and will never believe in Him. For though it is true that Christ did not, strictly speaking, acquire the natural life by his suffering and death, yet the human race was spared on account of the fact that Christ would come to save it. Christ is not the head of all human beings, not the prophet, priest, and king of everyone, for He is the head of the church and has been anointed king over Zion. Yet all human beings owe a great deal to Christ. The light shines in the darkness and illumines every person coming into the world. The world was made through him and remains so, though it did not recognize him. Also as the Christ, He gives to unbelievers many benefits: the call of the gospel, the warning to repent, historical faith, a virtuous life, a variety of gifts and powers, offices and ministries within the church, such as, for example, even the office of an apostle in the case of Judas. “Without Jesus Christ the world would not exist, for it would necessarily either be destroyed or be a hell” (Pascal). Even hanging from the cross, He still prays for forgiveness for the appalling sin being committed by the Jews at that very moment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 3:470-75</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[407] Although vicarious atonement as the acquisition of salvation in its totality cannot therefore be expanded to include all persons individually, this is not to say that it has no significance for those who are lost. Between the church and the world there is, at this point, not just separation and contrast. It is not the case that Christ has acquired everything for the former and nothing for the latter. … And also his work has value for all, even for those who have not believed and will never believe in Him. For though it is true that Christ did not, strictly speaking, acquire the natural life by his suffering and death, yet the human race was spared on account of the fact that Christ would come to save it. Christ is not the head of all human beings, not the prophet, priest, and king of everyone, for He is the head of the church and has been anointed king over Zion. Yet all human beings owe a great deal to Christ. The light shines in the darkness and illumines every person coming into the world. The world was made through him and remains so, though it did not recognize him. Also as the Christ, He gives to unbelievers many benefits: the call of the gospel, the warning to repent, historical faith, a virtuous life, a variety of gifts and powers, offices and ministries within the church, such as, for example, even the office of an apostle in the case of Judas. “Without Jesus Christ the world would not exist, for it would necessarily either be destroyed or be a hell” (Pascal). Even hanging from the cross, He still prays for forgiveness for the appalling sin being committed by the Jews at that very moment.”

— Herman Bavinck, Reformed Dogmatics: God and Creation, 3:470-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B407%5D+Although+vicarious+atonement+as+the+acquisition+of+salvation+in+its+totality+cannot+therefore+be+expanded+to+include+all+persons+individually%2C+this+is+not+to+say+that+it+has+no+significance+for+those+who+are+lost.+Between+the+church+and+the+world+there+is%2C+at+this+point%2C+not+just+separation+and+contrast.+It+is+not+the+case+that+Christ+has+acquired+everything+for+the+former+and+nothing+for+the+latter.+%E2%80%A6+And+also+his+work+has+value+for+all%2C+even+for+those+who+have+not+believed+and+will+never+believe+in+Him.+For+though+it+is+true+that+Christ+did+not%2C+strictly+speaking%2C+acquire+the+natural+life+by+his+suffering+and+death%2C+yet+the+human+race+was+spared+on+account+of+the+fact+that+Christ+would+come+to+save+it.+Christ+is+not+the+head+of+all+human+beings%2C+not+the+prophet%2C+priest%2C+and+king+of+everyone%2C+for+He+is+the+head+of+the+church+and+has+been+anointed+king+over+Zion.+Yet+all+human+beings+owe+a+great+deal+to+Christ.+The+light+shines+in+the+darkness+and+illumines+every+person+coming+into+the+world.+The+world+was+made+through+him+and+remains+so%2C+though+it+did+not+recognize+him.+Also+as+the+Christ%2C+He+gives+to+unbelievers+many+benefits%3A+the+call+of+the+gospel%2C+the+warning+to+repent%2C+historical+faith%2C+a+virtuous+life%2C+a+variety+of+gifts+and+powers%2C+offices+and+ministries+within+the+church%2C+such+as%2C+for+example%2C+even+the+office+of+an+apostle+in+the+case+of+Judas.+%E2%80%9CWithout+Jesus+Christ+the+world+would+not+exist%2C+for+it+would+necessarily+either+be+destroyed+or+be+a+hell%E2%80%9D+%28Pascal%29.+Even+hanging+from+the+cross%2C+He+still+prays+for+forgiveness+for+the+appalling+sin+being+committed+by+the+Jews+at+that+very+moment.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+3%3A470-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote

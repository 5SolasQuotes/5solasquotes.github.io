<main class="wrap"><figure class="quote" id="q-98f9938805" data-kw="" data-pol="">
<blockquote><p>The third opinion is of those who attribute the work of justification unto God, but place their righteousness partly in their faith, as their own work, and partly in the obedience of Christ; and make two actions of God in justifying. … All these three opinions do attribute man’s righteousness, either wholly or in part, to his own working. The first and last do join grace and merit together in justification. Which things are most contrary to the truth of God</p></blockquote>
<figcaption>— <a href="../authors/john-forbes.html">John Forbes</a>, <cite>A Treatise Tending to Clear the Doctrine of Justification (1616)</cite>, p. 52</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../topics/salvation/justification.html">Justification</a><a class="tag" href="../topics/salvation/faith.html">Faith</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f4d3c1b67" data-kw="" data-pol="">
<blockquote><p>The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins, and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification is an excellent gift of God … yet we deny it to be the thing, which makes us of sinners to become righteous or just before God.</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>The Reformed Doctrine Touching the Justification of a Sinner</cite></figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-justification.html">Rome: Justification</a><a class="tag" href="../topics/salvation/justification.html">Justification</a><a class="tag" href="../topics/salvation/imputation.html">Imputation</a></div>

</figure><figure class="quote" id="q-9c4add85b0" data-kw="" data-pol="">
<blockquote><p>They say, we are justified by works, as by causes thereof: we say, that we are justified by works as by signs and fruits of our justification before God, and no otherwise.</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, on James 2:21</figcaption>

</figure><figure class="quote" id="q-a046484a06" data-kw="" data-pol="">
<blockquote><p>And consequently he contends that justification consists of two parts, namely, reconciliation and the other new virtues. … Out of these effects, Andrada, in his subtlety, makes the cause and form of justification. We, indeed, do not deny these and other effects of justification, but we do not say that the effects are the causes.</p></blockquote>
<figcaption>— <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a>, <cite>Examination of the Council of Trent</cite>, Part 1, Topic on Justification</figcaption>

</figure><figure class="quote" id="q-5e998e8dd1" data-kw="" data-pol="">
<blockquote><p>Between them and us there is this difference, that they persuade themselves that the movement comes from the man himself, whereas we maintain that faith is voluntary, because God draws our wills to himself. Add, that when we say a man is justified by faith alone, we do not fancy a faith devoid of charity, but we mean that faith alone is the cause of justification.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on Canon 9</figcaption>

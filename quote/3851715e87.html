<main class="wrap"><figure class="quote" id="q-3851715e87" data-kw="">
<blockquote><p>…we haue delivered in the former observation that the Church of Rome in some sense may rightly be reputed a true visible Church; Everyone will be ready to except against it, and say, why then have you forsaken it, why do ye not still hold communion with her, what just exception can ye allege for your separation from her? For answer to which exception: Doctrine 2. I will propound in the second place this observation, namely, that howsoever the Church of Rome in some sense may be reputed a true visible Church, yet it is marvelously unsound and corrupt, and exceedingly corrupt with many foul abuses, errors and abominations; yea, so corrupt, as it is not lawful nor safe for us to communicate with her:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London, 1631), Lecture 27, p. 170 Randall (1570–1622) was an English puritan.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b971b9c2fa" data-kw="">
<blockquote><p>In reality, this reconciliation will prove a total defection from the protestant religion; for the church of Rome neither will nor can part with any thing that shall change its antichristian state and idolatrous worship. The whole of their pretension is but a decoy to get us into their power; where we shall be made to understand both where we are and where we have been also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief and Impartial Account of the Nature of the Protestant Religion</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><figure class="quote" id="q-dc6726407e" data-kw="">
<blockquote><p>4. [John] Robinson [a Separatist] and our [Independent] Brethren acknowledge that the Church of Rome hath true baptism, for ‘they retain the essential causes of baptism, even as the vessels of the Lord’s house profaned in Babylon may be carried back to the Temple, but if these vessels were broken and mingled with brass and iron, and cast in another mold, they could not obtain their former place in the Temple. Baptism is a vessel profaned in Babel, but not broken; but the ministry and priesthood of Rome is like the new melted and mingled vessel, and essentially degenerated from the office of pastorship.’ But I answer, [1.] if baptism be valid in Rome so are the ministers baptizers, for if the ministers and priests be essentially no ministers, the baptism administrated by the Romish priests is no ministry, and [that would be] all one as [if it were] administrated by midwives and private persons, who therefore cannot administrate the sacraments validly in the essential causes, because they are essentially no ministers. If therefore Robinson will have the Romish priesthood essentially no ministry, by that same reason he must say, baptism administrated by Romish priests is no baptism, the contrary whereof he confesses: otherwise he must say baptism administrated, a non habente potestatem [by one not having the power], even by women and private men, is valid, and cannot be but esteemed lawful in the substance of the act. 2. These have a ministry essentially entire who have power under Christ to preach the Gospel and administrate the sacraments, Mt. 28:19. The Romish priests have this, and are called to this by the Church. … I answer, [1.] England may well separate from Rome everting the fundamental parts of faith, and not separate from Rome’s baptism, or ministry, in so far, as they be essentially the ordinances of Christ… 2. A ministry true in the essence may make a Church true, insofar; but because of many other substantial corruptions in Rome, it is a Church which we ought to forsake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 235-6</span></figcaption>

</figure><figure class="quote" id="q-48d95ae109" data-kw="Marks of the church Rome">
<blockquote><p>The Lord recognises nothing as his own, save when his word is heard and religiously observed. … If that temple which seemed consecrated for the perpetual habitation of God, could be abandoned by God and become profane, the Romanists have no ground to pretend that God is so bound to persons or places, and fixed to external observances, that he must remain with those who have only the name and semblance of a Church.</p></blockquote>

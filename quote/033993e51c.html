<blockquote><p>Answer 1. That ordination be wanting where ministers are wanting, is extraordinary and not against, 1 Tim. 4:14; no more than that one not baptized for want of a pastor should yet believe in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 199</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“Answer 1. That ordination be wanting where ministers are wanting, is extraordinary and not against, 1 Tim. 4:14; no more than that one not baptized for want of a pastor should yet believe in Christ.”

— Samuel Rutherford, The Due Right of Presbyteries (1644), pt. 1, p. 199">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnswer+1.+That+ordination+be+wanting+where+ministers+are+wanting%2C+is+extraordinary+and+not+against%2C+1+Tim.+4%3A14%3B+no+more+than+that+one+not+baptized+for+want+of+a+pastor+should+yet+believe+in+Christ.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries+%281644%29%2C+pt.+1%2C+p.+199&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F033993e51c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/033993e51c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=Answer%201.%20That%20ordination%20be%20wanting,pastor%20should%20yet%20believe%20in%20Christ." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02839b324d" data-kw="">
<blockquote><p>It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Cor. 5, v. 4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-c9bf4ea8ae" data-kw="">
<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (London, 1644) | pt. 2</cite>, p. 272</span></figcaption>

</figure><figure class="quote" id="q-9c1bb1857c" data-kw="">
<blockquote><p>Kneeling in receiving imposition of hands, which is joined with prayer and invocation, has nothing ado with kneeling in a mediate worship, for in this case a man kneels because of the immediate worship of invocation: But when there is no prayer, I suppose no man will kneel religiously and with a religious respect to those persons or things which are before him, as there purposely in his sight that before them he may adore, which is the kind of kneeling now in question, or if any did so, there were more need to give him instruction than ordination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3</cite>, ch. 4, p. 73</span></figcaption>

<blockquote><p>2. And as to the last edition of the Covenant of Grace by Christ [in the New Testament]: 1. The tenor of it extends to all; as is visible Mt. 28:19; Mk. 16:16; Jn. 3:16. 2. And Christ has made it the office of his ministers by his commission to promulgate and offer it to all. 3. And whereas providence concurs not to the universal execution, we must all confess, that Christ came not to put the world into a worse condition than He found them in. If He did any no good by his incarnation, He would do them no harm. Therefore they that never hear the Gospel, are still under the first edition of the Covenant made with Adam and Noah, so far as it is unaltered. I add that word [“so far as it is unaltered”], because, that so far as the promise was to give salvation by the Messiah hereafter to be incarnate, none is now bound to expect his future incarnation, because it is past. But the same benefits that were due to believers before Christs incarnation, are due since upon the true performance of so much of the condition as is still in force, and not repealed. … 4. And also, that more was required then, to be known particularly by the Jews that had the Scripture and tradition to acquaint them with the Messiah to come, than of the rest of the world, that had not those distinct discoveries, nor Abraham’s promises made known unto them: And how much Gen. 3:15 might cause them to understand, we may conjecture by the words. At least this much was required of all, that they believe that their sin deserves punishment and misery, and yet that God of his abundant mercy, by his wisdom securing his truth and justice, will pardon sin and grant salvation to all that truly believe and trust in that his wisdom and mercy, and repent of their sins, and unfeignedly give up themselves to God as their merciful Redeemer. Thus far we are agreed about the grace of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology… (1675), Preface</cite>, pp. 5-6</span></figcaption>

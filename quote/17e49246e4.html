<main class="wrap"><figure class="quote" id="q-17e49246e4" data-kw="">
<blockquote><p>Objection 1 [of Saltmarsh, an Antinomian]: ‘Christ is not ours by any act of our own, but by an infinite act of God’s imputing his righteousness. Therefore, Christ is not ours by faith.’ [Rutherford’s] Answer: Christ is not ours, by any act of our own, as by a ransom, a meritorious and principal cause. [This is] True, therefore [Saltmarsh concludes], [Christ is] not [ours] by faith, as a condition knowing, apprehending, feeling, applying, receiving, [and] opening the everlasting doors, that the King of glory may enter in. It’s false [that is, Saltmarsh’s inference]. So bread is ours only by an omnipotent act of Him that causes the earth to bring forth, as by the first principal and effectual cause: Therefore [Saltmarsh would conclude], bread is not our’s in a civil way, by plowing, sowing, earing, and in a spiritual way, by laying hold by faith on the Covenant, in which the world, the things of this life, are made ours (1 Cor. 3:21); this is a lax and vain consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of Spiritual Antichrist, Pt. 2</cite>, ch. 61, ‘How Faith Justifies…’, p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<blockquote><p>Now although the human nature may rightly be said to be substantial with the Logos (enypostatos Logo) (because it was assumed into the unity of the person and is sustained by it, yet less accurately is it said to subsist with the subsistence of the Logos (Logou) because then the human nature would be a divine person.</p></blockquote>

</figure><figure class="quote" id="q-0c37551b27" data-kw="">
<blockquote><p>XI. Therefore all Christ is everywhere, although his human nature, since his ascension untill the day of the Last Judgment, be nowhere but in Heaven. Mt. 28:6, ‘He is risen, he is not here,’ Mt. 26:11, ‘Me ye have not always with you.’ Jn. 16:28; ‘I leave the world and go unto my Father.’ Acts 3:21, ‘Whom the heavens must contain, until the time of restoring of all things. XII. And the godly in what place of heaven or earth so ever they abide, are united to the human nature assumed by the Son of God, as members to their head, the same Holy Spirit dwelling in Christ by unity of essence with the Word, and in the godly by grace. 1. Cor. 12:13, ‘By one Spirit we are all baptized into one body.’ Eph. 4:4, ‘There is one body and one Spirit.’ 1 Jn. 4:13, ‘By this we know that we abide in Him and He in us, because He hath given us of his Spirit.’ Rom. 8:11, ‘If the Spirit of Him who hath raised etc. dwell in you etc.’ Irenaeus, bk. 3, ch. 19, ‘As of dry meal one lump cannot be made, nor one bread: so neither could we which are many, be made one in Christ Jesus, without that water which is from Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Office &amp; Person of Christ the Only Mediator’ in A Collection of Certain Learned Discourses</cite>, … (Oxford, 1600), p. 245</span></figcaption>

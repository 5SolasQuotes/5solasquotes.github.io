<main class="wrap"><figure class="quote" id="q-5cdc07d4df" data-kw="Wisdom">
<blockquote><p>It is a marked proof of the wisdom of God that he can so direct all the affairs of the universe as, without need of special action, to accomplish all the events he chooses. All providence, therefore, is general, because operated through general laws. It is also special, because every individual event comes to pass under God&#x27;s own inspection, and through his own will and work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abstract of Systematic Theology</cite>, ch. XXI, “Providence,” §IV.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/government.html">Government</a> › <a href="../topics/providence/government/universal-and-particular-government.html">Universal and particular government</a></span><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-940c6385f9" data-kw="Affliction|Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

</figure><figure class="quote" id="q-8a099d7ada" data-kw="Sovereignty|Free Will">
<blockquote><p>God brings about every man&#x27;s lot, and all the parts of it. He sits at the helm of human affairs, and turns them about in whatever way he lists. &quot;Whatever the Lord pleased, that He did in heaven and in earth, in the seas and all deep places.&quot; There is not anything whatever befalls us without his overruling hand. The same providence that brought us out of the womb, brings us to, and fixes us in the condition and place allotted for us, by him who &quot;has determined the times and the bounds of our habitation.&quot; It overrules the smallest and most casual things about us, such as &quot;hairs of our head being all numbered;&quot; a &quot;lot cast into the lap.&quot; Yea, the free acts of our will, by which we choose for ourselves: for even &quot;the king&#x27;s heart is in the hand of the Lord, as rivers of water.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crook in the Lot</cite>, Doct. I, head II (the crook is of God&#x27;s making)</span></figcaption>

</figure><figure class="quote" id="q-5636806dec" data-kw="Sovereignty|Author of sin|Satan">
<blockquote><p>We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 13</span></figcaption>

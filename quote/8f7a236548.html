<main class="wrap"><figure class="quote" id="q-8f7a236548" data-kw="">
<blockquote><p>This thing [that the Word of God is the object of faith] our [papist] adversaries can by no means abide; for they contend that there be certain things (I know not what) to be believed, which are not contained in the holy Scriptures. But we say that faith is an assent that is given to the holy Scripture and unto those things which are necessarily and evidently concluded of it. Among other things, they are wont to object unto us the perpetual virginity of the mother of Christ, which they say must be believed although it be not mentioned in the holy Scriptures…. 3. As touching the first, it is sufficient for us that we are taught by the holy Scriptures (Mt. 1 &amp; Lk. 1) that Christ was conceived and born of a virgin. And above that, to affirm that the blessed Virgin was joined with man in fellowship of the flesh, it were rash and presumptuous; for seeing there is nothing spoken thereof in the holy Scriptures, nor yet is the same likely; why (in God’s name) should we either believe it or affirm it? And contrariwise, that she abode perpetually a virgin; forsomuch as the holy Scriptures do not by express words avouch the same, it is not to be admitted among those things which must of necessity be believed such as are the things expressly contained in the holy Scriptures. Jerome against Helvidius wrote of this matter; for he was worthily to be condemned because he did rashly affirm that she was not perpetually a virgin. And Augustine very well admonishes us that when we come to such places where the sense of the Scripture cannot certainly be gathered, we should not rashly set our opinion on the one part or the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (d. 1562; 1583), Pt. 3, ch. 3, ‘Of Faith &amp; the Certainty Thereof’, section 7, p. 62. While Vermigli’s agnosticism on the question appears to be strong, nonetheless he uses language that appears to default to belief in perpetual virginity.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0602870132" data-kw="Mary Queen of Heaven Idolatry">
<blockquote><p>This saying of Christ openly and manifestly warns men to beware lest, by too superstitiously elevating the honor of the name of mother in the Virgin Mary, they transfer to her what belongs exclusively to God. … For Mary has been constituted the Queen of Heaven, the Hope, the Life, and the Salvation of the world; and, in short, their fury and madness proceeded so far that they stripped Christ of his spoils, and left him almost naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel according to John</cite>, John 2:4</span></figcaption>

</figure><figure class="quote" id="q-a298cb1788" data-kw="">
<blockquote><p>Master Perkins says nothing of the necessity of believing. That point of the virgin Mary’s perpetual virginity, we hold to be true, but we dare not lay a burden upon any man’s conscience where the Scripture is silent. St. Austin’s judgment, though he were a singular light of the Church, is not of weight enough to determine, without all warrant of scripture, what is heresy and what is not… Besides, Austin thus delivers the matter concerning the Helvidians’ heresy. The Helvidians (says he) so gainsaid the virginity of Mary that they confidently affirm [that] she had other children after Christ by her husband Joseph. So that it may well be Austin counted them heretics especially for avouching that peremptorily which they could no way make good by Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of Mr. [William] Perkins’ book, called A Reformed Catholic, against the Cavils of a Popish Writer... (London, 1606), The 7th Point, ‘Of Traditions’. Wotton (c. 1561 – 1626) was an English clergyman and controversialist, of puritan views.</cite>, pp. 401-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“Master Perkins says nothing of the necessity of believing. That point of the virgin Mary’s perpetual virginity, we hold to be true, but we dare not lay a burden upon any man’s conscience where the Scripture is silent. St. Austin’s judgment, though he were a singular light of the Church, is not of weight enough to determine, without all warrant of scripture, what is heresy and what is not… Besides, Austin thus delivers the matter concerning the Helvidians’ heresy. The Helvidians (says he) so gainsaid the virginity of Mary that they confidently affirm [that] she had other children after Christ by her husband Joseph. So that it may well be Austin counted them heretics especially for avouching that peremptorily which they could no way make good by Scripture.”

</figure><figure class="quote" id="q-61a2efa655" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>Except for those honorary titles which belong to God the Lord and to our only Saviour, one may give her the highest and most glorious titles. … But that we do not name her a Goddess, a Mediator between God and men, an all-knowing and almighty Queen of Heaven, a Gate of the Heavenly Paradise, a Redeemer, a Reconciler of the human race, and more suchlike honorary titles which were raised by men, comes solely therefrom, that suchlike honorary titles are adverse to the honour of God and of Our Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Short Instruction on the Holy Virgin Mary</cite>, 1673, Q. 29</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1749a32780" data-kw="">
<blockquote><p>In a formal sense, there are no dogmas in Scripture, but the material for them is all to be found in it. Hence dogmatics can be defined as the truth of Scripture, absorbed and reproduced by the thinking consciousness of the Christian theologian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 1 HT: A Pilgrim’s Theology</cite>, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f8b91c1809" data-kw="">
<blockquote><p>And although ordinary believers are obliged to make diligent and conscientious use of the ministry of the church, among other things, as a means appointed of God to lead, guide, and instruct them in the knowledge of his mind and will revealed in the Scripture, which is the principal end of that ordinance; yet is not their understanding of the truth, their apprehension of it and faith in it, to rest upon or to be resolved into their authority, who are not appointed of God to be lords of their faith, but helpers of their joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-063d7aca10" data-kw="">
<blockquote><p>A supreme and infallible judge is indeed one who is never wrong in his decisions, and cannot err, who is not influenced by any interested party, and from whom there can be no appeal. But all these qualities can be attributed neither to the church nor to the councils nor to the pope, for they both can err and often have done so most grievously. … Only God speaking in Scripture lays claim to all these qualities in his own person, for he cannot fall into error, since he is truth itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span></div>

</figure><figure class="quote" id="q-61b3ae799e" data-kw="">
<blockquote><p>But the Jesuit deceives us by the ambiguity of a word. For there is both a public and a private interpretation. We confess that all have not the gift of publicly interpreting the scriptures; but in private all the faithful, taught by the Holy Ghost, can understand the scriptures and recognise the true sense of scripture.</p></blockquote>

</figure><figure class="quote" id="q-28d3ab91db" data-kw="">
<blockquote><p>Seventhly, all our expositions should accord with the analogy of faith, which we read of, Rom. xii. 6. Now the analogy of faith is nothing else but the constant sense of the general tenour of scripture in those clear passages of scripture, where the meaning labours under no obscurity; such as the articles of faith in the Creed, and the contents of the Lord&#x27;s Prayer, the Decalogue, and the whole Catechism: for every part of the Catechism may be confirmed by plain passages of scripture. Whatever exposition is repugnant to this analogy must be false.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 9 (p. 472)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-db215012fe" data-kw="Lord&#x27;s day apostolic institution">
<blockquote><p>Others ascend to a divine ordination, so that either Christ himself may be said to have immediately and expressly instituted that day, which Junius holds and some others with him; or mediately only inasmuch as the apostles inspired of God sanctioned it in the Christian church by precept, example and their own practice. This is the more common opinion of the orthodox and to this we adhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 100</span></figcaption>

</figure><figure class="quote" id="q-6b796f8cf5" data-kw="">
<blockquote><p>That which we most love we worship as our God; for love is an act of soul-worship.… This is undoubtedly true, if we intend hereby that love which is superlative and transcendent; for to be loved above all things is an act of honour, worship, which the Lord challenges as his due in peculiar, Deut. 6:5.… Other things may be loved, but he will be loved above all other things.… He looks upon us as not worshipping him at all, not taking him for a God, when we love other things more, or as much as himself, 1 John 2:15.… Those that love their riches, the things of the world, more than, or equally with, God, they make these their gods.… Love, whenever it is inordinate, it is an idolatrous affection.… That which we most trust we make our god; for confidence and dependence is an act of worship which the Lord calls for as due only to himself.… Trust in the creature is always idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (love and trust as soul worship)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-bff858ca14" data-kw="">
<blockquote><p>Philip Nye gave an exhortation before the House of Commons and the Westminster Assembly of divines before they took the Solemn League and Covenant in 1643. In the midst of doing so, he was careful to remind them that it was a perpetually binding covenant:

We are to exalt and acknowledge Him this day, Who is fearful in praises, swear by that name which is holy and reverend, enter into a covenant and league that is never to be forgotten by us nor our posterity, and the fruit I hope of it shall be so great, as both we and they shall have cause to remember it with joy; and such an oath as for matter, persons, and other circumstances, the like hath not been in any age or oath we read of in sacred or human history, yet sufficiently warranted in both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League and Covenant. Exhortation at Westminster (1643) in James Kerr (ed.), The Covenants and the Covenanters: Covenants, Sermons, and Documents of the Covenanted Reformation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-49b0e67f73" data-kw="">
<blockquote><p>But what are the means for redeeming time? I answer.—They are so many, that I may have no time to enumerate the Particulars; shall we instance in some? you must pray, read, hear the Word, meditate, and watch over your hearts with extraordinary industry; mortify your members which are upon the Earth, as pride, covetousness, lusts, &amp;c. grow up in grace, clear up your evidences against that day when all shall stand naked before that great and glorious Judge, &amp;c. And these, and all other Duties (of which anon) must be done while the day lasteth. Here’s a great work, and a little time; doth it not concern you to bestir your selves? If a man have much to write, and but a little Paper to write on, he must write small, and thick, and close as ever he can: So must you do.

I verily believe there’s not one Soul amongst us but he may find out hundreds and thousands of sins to repent him of; he may find out many and many a Particular Duty that he should be exercised in from morning to evening, and from evening to morning; so that ’tis a wonder how he can spare any time at all for any thing else. Well then, up and be doing; lose not a minute, but be in the use and exercise of some of these Duties. These are the means, and in the use of these means you may (by the Lord’s help and grace concurring) redeem your time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redeeming the time a sermon preached at Preston in Lancashire, January 4th, 1657 at the funeral of the honourable lady, the Lady Margaret Houghton</cite>, (London: Rowland Reynolds, 1657), p. 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

otes.github.io%2Fquote%2F49b0e67f73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49b0e67f73.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/09/isaac-ambrose-on-means-for-redeeming-the-time/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1066704188" data-kw="">
<blockquote><p>For even if images can be retained [in churches] without offense to God, in which are represented sacred matters and histories, and which are extant throughout holy Scripture, and call to mind for the illiterate the stories of the deeds… Luther in fact, of pious memory, cleansed Churches in those locations by means of the Word of the Lord alone from the beginning, and through this one instrument of the Holy Spirit dragged away all idols from the hearts of his hearers… before he ever removed even the smallest ones from their eyes. For an idol in the world is nothing, as the apostle testifies, 1 Corinthians 8[:4], but instead they reside in the hearts of people… Thus Luther for many years [after the Reformation] wore the monastic hood or habit [clothing]… We experienced the same thing in the Dukedom of Wurttemberg, where in the first year after the light of the Gospel was introduced and lit, and Papal idolatry abrogated, images were removed throughout all the temples before the imagination of their worship was pulled away from the minds of men. This is why it has come about that very many people were so offended by this unseasonable reformation undertaken with a two-edged sword… that neither listened to evangelical assemblies nor approached their sacraments any longer, but rather clung to their Papist idolatry till their final breath, despising the teaching of the Gospel and the true use of the sacraments. This was the fruit of the unseasonable reformation in which everything was destroyed with no regard given to the weak in faith… But there is less danger when pure and genuine doctrine is heard, by which all people are called away from idolatry to the true worship of God in daily meetings, should they be retained, than if they should be abolished rashly and unthoughtfully. Because of this, we think that the magistrate of each place sins less, and takes counsel to the advantage of the salvation of souls far better, if they have endured them longer than if they have unseasonably abrogated them… If in fact they are matters of indifference [adiaphora], as is the consensus between us… Beza: This whole business can best be described as resting on two points, namely, the prudence of pastors and the consideration of circumstances… The custom was observed in certain places that images of this kind were retained for four years after reformation. But I do not want to fight with anyone about these things or reprove the deeds of other people; let us just be on guard against all opportunities for idolatry, as much as possible.</p></blockquote>

re+and+genuine+doctrine+is+heard%2C+by+which+all+people+are+called+away+from+idolatry+to+the+true+worship+of+God+in+daily+meetings%2C+should+they+be+retained%2C+than+if+they+should+be+abolished+rashly+and+unthoughtfully.+Because+of+this%2C+we+think+that+the+magistrate+of+each+place+sins+less%2C+and+takes+counsel+to+the+advantage+of+the+salvation+of+souls+far+better%2C+if+they+have+endured+them+longer+than+if+they+have+unseasonably+abrogated+them%E2%80%A6+If+in+fact+they+are+matters+of+indifference+%5Badiaphora%5D%2C+as+is+the+consensus+between+us%E2%80%A6+Beza%3A+This+whole+business+can+best+be+described+as+resting+on+two+points%2C+namely%2C+the+prudence+of+pastors+and+the+consideration+of+circumstances%E2%80%A6+The+custom+was+observed+in+certain+places+that+images+of+this+kind+were+retained+for+four+years+after+reformation.+But+I+do+not+want+to+fight+with+anyone+about+these+things+or+reprove+the+deeds+of+other+people%3B+let+us+just+be+on+guard+against+all+opportunities+for+idolatry%2C+as+much+as+possible.%E2%80%9D%0A%0A%E2%80%94+Jacob+Andreae%2C+Lutheranism+vs.+Calvinism%2C+%28Concordia+Publishing+House%2C+2017%29%2C+ch.+4%2C+%E2%80%98On+the+Reformation+of+Temples%2C+Images+%26+Organs%E2%80%99+Andreae+%281528%E2%80%931590%29+was+a+leading+Lutheran+theologian+debating+Theodore+Beza.+%7C+Andreae%3A%2C+pp.+472-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1066704188.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1066704188.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=For%20even%20if%20images%20can%20be,for%20idolatry%2C%20as%20much%20as%20possible&amp;text=For%20even%20if%20images%20can%20be%20retained%20%5Bin&amp;text=all%20opportunities%20for%20idolatry%2C%20as%20much%20as%20possible" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

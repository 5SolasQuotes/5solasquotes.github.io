<blockquote><p>II. The Scriptures plainly represent magistrates’ granting of men an unrestrained freedom to profess and practice a false religion as extremely sinful and hurtful.

1. It is in the name of God to give liberty to the flesh, of which heresies and idolatry are the manifest and damning works, Gal. v. 13, 19-21, with Rom. viii. 7, 8.

2. It is not merely to pity and spare, but to encourage such as seek to draw away their subjects from God, contrary to Deut. xiii. 9-10; Eph. iv. 14; 2 Tim. iii. 4, 5; 2 Pet. ii. 1-3.

3. In so doing, magistrates, as political shepherds, not only suffer the flock of God, the King of nations, under their charge, to wander or be driven from their fold and pasture, but encourage them in it, contrary to Ezek. xxxiv. 5-8; Acts xx. 30.

4. It marks a heavy judgement of God upon, and anarchy in a Commonwealth, when every man is left without restraint, and does that which is right in his own eyes, in matters of religion, Judges xvii. 6; Zech. xi. 9, 16; 2 Chron. xx. 33; Amos iv. 4, 5.

5. In granting such liberty, magistrates are not for Christ, by whom they rule, Prov. viii. 15, 16, but against him, in encouraging and protecting doctrines and works of the devil, which he came to destroy, John viii. 44; 1 Tim. iv. 2; Rev. xvi. 13, 14, with 1 John iii. 8 and Zech. xiii. 2.

6. False religion eats out the true doctrine of Christ, and the true piety and virtue which proceed from the faith of it, which are like joints and bands to connect and establish a nation, Isa. lix, lxv; 2 Tim. ii. 16, 17; Gal. v. 10-12.

7. Heresies produce divisions, 1 Cor. xi. 18, 19, make men wanton, filthy, dreamers, despisers and revilers of magistrates, Jude 4, 8; 2 Pet. ii. 10-17. They render times perilous, and make traitors, heady, high minded, truce breakers, false accusers, fierce, without natural affection, despisers of those that are good, 2 Tim. iii:1-13. They produce envy, strife, evil surmising, and perverse disputing, 1 Tim. vi. 3, 4; Gal. v. 19. 20. They spoil Christ’s vines, Song. ii. 15.

8. False religion deprives a nation of God’s protecting hedge of favourable providence, and opens an inlet to the floods of destructive judgements, Exod. xxxii. 25; Ezek. xiii. 4, 5; xxii. 30, 31.

9. Magistrates’ indulgence of a false religion is represented as a kicking at the true religion, and an honouring of the corrupters above God, and brings a charge of the wickedness upon the tolerators of it. Hence Eli the judge of Israel is represented as kicking at God’s sacrifice, honouring his profane sons above God, and making himself fat with God’s portion of the sacrifices, because he did not effectually restrain his sons, 1 Sam. ii. 12-16, 23-25, 29; Eph. v. 7, 11; and Nehemiah contended with the rulers of Judah for suffering the worship of God to be neglected, and the Sabbath profaned, Neh. xiii. 10-18.

10. Such indulgence of false or corrupt religion is represented as tending to make men abhor the true religion, and speak evil of it, 1 Sam. ii. 17; 2 Pet. ii. 1-3.</p></blockquote>

<blockquote><p>In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.</p></blockquote>

<blockquote><p>Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>

— Travis Fentiman, “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists, (1604; RBO, 2025), pp. 150-51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWamphray+argues%2C+%E2%80%982.+If+the+Council%E2%80%99s+act+or+grant%E2%80%A6+be+sinful%2C+then+the+giving+of+this+bond+%5Bby+the+indulged%5D%E2%80%A6+must+be+much+more+sinful%E2%80%A6%E2%80%99+Yet+it+is+plain%2C+though+an+authority+sin+in+giving+commands%2C+it+is+not+necessarily+sinful+for+one+to+keep%2C+or+promise+to+keep%2C+those+commands+%28otherwise+there+would+be+no+such+thing+as+passive+obedience%2C+but+there+is%29.+%5BRichard%5D+Baxter+had+previously%2C+rightly+argued+at+length%C2%B9+against+the+view+Wamphray+puts+forth%3B+Baxter%E2%80%99s+position+was+precisely+the+indulged+ministers%E2%80%99+viewpoint.%C2%B2+%C2%B9+Baxter%2C+Five+Disputations%2C+5th+Disputation%2C+ch.+12%2C+%E2%80%9DIt+may+be+very+sinful+to+command+some+ceremonies%2C+when+yet+it+may+be+the+subjects%E2%80%99+duty+to+use+them+when+they+are+commanded%2C%E2%80%9D+pp.+460%E2%80%9363.+%C2%B2+Bairdie%3A+%E2%80%9Cyour+indulged+ministers%2C+looking+upon+these+statuted+rules%2C+at+least+ways%2C+as+unjust+upon+their+matter%2C+have+never+embraced+nor+observed+them%2C+except+it+be+in+some+civil+points+%28inflicted+on+them+as+penal%29%2C+and+that+only+so+far+as+they+judged+might+be+lawfully+submitted+unto%2C+however+unjustly+imposed.%E2%80%9D+Balm+from+Gilead%2C+p.+77.+Saul+unjustly+required+100+Philistine+foreskins+for+David+to+marry+his+daughter.+David+gave+200+%281+Sam.+18%3A17%E2%80%9327%29+and+could+have+promised+to+do+so+in+that+broken+and+declining+Church.+The+king+of+Babylon+sinfully+exacted+from+king+Zedekiah+of+Israel+an+oath+to+serve+him.+Zedekiah+broke+this+oath+and+would+not+serve+him+in+that+broken+and+declining+Church-state.+God+condemned+Zedekiah+for+it%2C+seeing+as+he+should+have+kept+the+sinfully+exacted+service+%28Eze.+17%3A11%E2%80%9319%29.+The+magistrates+sinfully 0act%20or&amp;text=enthroned%20king%20Saul%20for%20them%3F%20%281%20Sam.%208%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XVII. The consideration of this, that magistracy is an ordinance of the only wise God, and that such as are in authority are warranted of Him, and have commission from Him, should move Christians to carry themselves under them in the exercise of their power, as loyal, dutiful subjects, whatever their persons be, tho’ heathens and strangers to Christ, and enemies to his kingdom; for He would have the Christian Romans live in subjection unto their heathen magistrates, emperors, consul or senate, upon this motive, that there is no power but of God; and the powers that be, are ordained of God [Rom. 13].</p></blockquote>

</figure><figure class="quote" id="q-d375e15221" data-kw="">
<blockquote><p>Here is Movens. The party longing desiring to depart; and that is Paul a chosen vessel, a faithful servant of God a living member of Christ. None can truly desire to be dissolved but he that is sure to be saved. No man willingly leaveth his present habitation, but he that is assured of a better dwelling. No wise man willingly to cast of his present garment, but he that hath another, a better to put on: No man can be upon right grounds willing to be dissolved, but only that man who is truly sanctified: he who is not thoroughly interested in Christ, cannot willingly leave all for Christ:

Eleazar Abraham’s servant, put a jewel upon Rebecca’s face, and bracelets upon her hands, and gave her jewels of silver and jewels of gold and raiment, and then she was willing to go with him, willing to leave all, and enjoy Isaac for her husband. That soul alone which Christ beautifieth with the saving gifts of his spirit, the love tokens of Christ, better gifts then jewels of silver, and gold. Is the soul, the only soul, that can forsake the dearest things of this life, that can readily leave its habitation in this mortal flesh, and take up its everlasting abode with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-grosse.html">Alexander Grosse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Christian’s choice. Or A sermon preached at the funeral of Mr John Cavvs one of the magistrates of the famous corporation of Plymouth. March the 29. Anno Dom. 1645</cite>, (London: John Bartlet, 1645), p. 4.</span></figcaption>

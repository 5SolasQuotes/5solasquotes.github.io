<main class="wrap"><figure class="quote" id="q-ef2f2a676e" data-kw="">
<blockquote><p>Assertion 3. The king is more properly a sort of patron, to defend the people (and therefore has no power given either by God or man to hurt the people) and a minister, or public and honorable servant (Rom. 13:4), for he is the minister of God to thee for good. 1. He is the commonwealth’s servant objectively, because all the king’s service, as he is king, is for the good, safety, peace and salvation of the people, and in this he is a servant. 2. He is the servant of the people representatively, in that the people has impawned in his hand all their power to do royal service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 70 lt col mid</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-mcward.html">Robert McWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded (1681), p. 47 McWard was a protege of Rutherford and leader of the Scottish covenanters.</cite></span></figcaption>

</figure><figure class="quote" id="q-035047e7f3" data-kw="">
<blockquote><p>Though the children of Ammon did a high injury to David, yet no injury can be recompensed in justice with the pressure of the constrained subjection of loyalty to a violent lord. If David had not had an higher warrant from God than an injury done to his messengers, he could not have conquered them. But the Ammonites were the declared enemies of the church of God, and raised forces against David when they themselves were the injurers and offenders. And if David’s conquest will prove a lawful title by the sword to all conquerors, then may all conquerors lawfully do to the conquered people as David did; that is, they may ‘put them under saws, and under harrows of iron, and under axes of iron, and cause them pass through the brick-kilne.’ But, I beseech you, will royalists say, that conquerors, who make themselves kings by their sword, and so make themselves fathers, heads, defenders, and feeders of the people, may use the most extreme tyranny in the world, such as David used against the children of Ammon, which he could not have done by the naked title of sword-conquest, if God had not laid a commandment of an higher nature on him to serve God’s enemies so? I shall then say, if a conquering king be a lawful king, because a conqueror, then has God made such a lawful king both a father, because a king, and a tyrant, and cruel and lionhearted oppressor of those whom he has conquered; for God has given him royal power by this example (2 Sam. 12:30-31) to put these, to whom he is a father and defender by office, to torment, and also to be a torturer of them by office, by bringing their backs under such instruments of cruelty as ‘saws, and harrows of iron, and axes of iron.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-a9aceb5085" data-kw="">
<blockquote><p>Nay suppose some should so extol the fullness and sufficiency of the Scriptures that they should hold them so perfect and sufficient for all Christians as to be a perfect rule for all civil government, and that Chrstian commonwealths ought to be governed by laws only there recorded and by no other (which opinion in substance Carolostadius held; that in courts of justice judges should not proceed according to humane laws, but according to the law of Moses; and so for military practices, should hold all the way of war must be founded upon the Scriptures, and thereupon should clamor against any other art and way of war than what was practised there. What would you reply to these men, or what strength were there in such principles? Would not you answer them in what sense the Scriptures were perfect, and how they must understand it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or a Full Answer to the Apologetical Narration (London: G.M., 1644)</cite>, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-6c56e7c541" data-kw="">
<blockquote><p>Now there was brought forth in Scotland, anno 1610, a certain amphibian brood, sprung out of the stem of Neronian tyranny and in manners like to his nearest kinsman, the Spanish Inquisition. It is armed with a transcendent power and called by the dreadful name of the High Commission. Among other things, it arrogates to itself the power of deposing ministers. But how unjustly, thus it appears: 1. If those commissioners have any power at all to depose ministers, they have it from the king whose commissioners they are. But from him they have it not. Therefore they have none at all. The proposition is most certain: For they sit not in that commission to judge in their own name, nor by their own authority quum nihil exerceat delegatus nomine proprio, as Panormitan says (apud Forb. Iren, bk. 2, ch. 11, p. 177), but by virtue only of the commission and delegation which they have of the king. Yea, bishops themselves exerce not any jurisdiction in the High Commission as bishops, but only as the king’s commissioners, as Dr. Downame aknowledges (Defens., bk. 1, p. 8). The assumption is grounded upon this reason: The king has not power to depose ministers. Therefore he cannot give this power to others. For Nemo potest plus juris transferre in alium quam sibi competere dignoscatur (Boniface, 8, De Regul. Juris Reg., 79). The king may sometimes inflict such a civil punishment upon ministers, whereupon secondarily and accidentally will follow their falling away from their ecclesiastical office and function, (in which sense it is said that Solomon deposed Abiathar, as we heard before), but to depose them directly and formally (which the High Commission usurps to do), he has no power, and that because this deposition is an act of ecclesiastical jurisdiction: Whereas the power of Ecclesiastical jurisdiction does no more agree to the king than the power of ecclesiastical order: his power is civil and temporal, not spiritual and ecclesiastical. Dr. Field also confesses that none may judicially degrade or put anyone lawfully admitted from his degree and order but the spiritual guides of the Church alone (Of the Church, bk. 5, ch. 53, p. 682). 2. The deposing of ministers pertains to classical presbyteries, or (if the matter be doubtful and difficille) to synods, as has been showed. And who then can give the High Commission such authority as to take this power from them, and to assume it unto itself. These Commissioners profess that they have authority to discharge other ecclesiastical judicatories within the kingdom from meddling with the judging of anything which they shall think impertinent for them, and which they shall think good to judge and decide by themselves in their commission. Which, if it be so, then (when it pleases them) they may make other ecclesiastical judicatories to be altogether useless and of no effect in the Church. 3. In this commission, ecclesiastical and temporal men are joined together, and both armed with the same power. Therefore it is not right nor regular, nor in any wise allowable. For even as when a minister has offended in a civil matter, his fault is to be judged by civil judges according to the civil laws, and by no other: so when he offends in an ecclesiastical matter, his fault is to be judged only by ecclesiastical persons according to ecclesiastical laws: and in such a case Justinian forbids civil men to be joined with ecclesiastical men in judgment (Novell., 83, ch. 1). They are ecclesiastical things or causes which are handled and examined by the High Commission in the process of deposing ministers: and a shame it is to ecclesiastical men if they can, without the help and joining of temporal men, judge and decide things of this quality. 4. As in the matters to be judged, so in the censures and punishments to be inflicted; ecclesiastical and civil men have in this Commission alike power and authority: for ecclesiastical men therein have power of fining, confining, warding, etc. common to them with the temporal men: and again, the temporal men have power of excommunication, suspension, deprivation, etc. common to them with the ecclesiastical men. For they all sit there as the king’s commissioners, and so nomine [by name] they exerce this jurisdiction: which Commission being alike discharged by them all, it is manifest that both temporal men take hold of the keys and ecclesiastical men take hold of the civil sword. And this monstruous confusion and mixture gives sufficient demonstration that such a form of judgement is not from the God of order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 3, bk. 8, Digression 4</cite>, pp. 195-97</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now there was brought forth in Scotland, anno 1610, a certain amphibian brood, sprung out of the stem of Neronian tyranny and in manners like to his nearest kinsman, the Spanish Inquisition. It is armed with a transcendent power and called by the dreadful name of the High Commission. Among other things, it arrogates to itself the power of deposing ministers. But how unjustly, thus it appears: 1. If those commissioners have any power at all to depose ministers, they have it from the king whose commissioners they are. But from him they have it not. Therefore they have none at all. The proposition is most certain: For they sit not in that commission to judge in their own name, nor by their own authority quum nihil exerceat delegatus nomine proprio, as Panormitan says (apud Forb. Iren, bk. 2, ch. 11, p. 177), but by virtue only of the commission and delegation which they have of the king. Yea, bishops themselves exerce not any jurisdiction in the High Commission as bishops, but only as the king’s commissioners, as Dr. Downame aknowledges (Defens., bk. 1, p. 8). The assumption is grounded upon this reason: The king has not power to depose ministers. Therefore he cannot give this power to others. For Nemo potest plus juris transferre in alium quam sibi competere dignoscatur (Boniface, 8, De Regul. Juris Reg., 79). The king may sometimes inflict such a civil punishment upon ministers, whereupon secondarily and accidentally will follow their falling away from their ecclesiastical office and function, (in which sense it is said that Solomon deposed Abiathar, as we heard before), but to depose them directly and formally (which the High Commission usurps to do), he has no power, and that because this deposition is an act of ecclesiastical jurisdiction: Whereas the power of Ecclesiastical jurisdiction does no more agree to the king than the power of ecclesiastical order: his power is civil and temporal, not spiritual and ecclesiastical. Dr. Field also confesses that none may judicially degrade or put anyone lawfully admitted from his degree and order but the spiritual guides of the Church alone (Of the Church, bk. 5, ch. 53, p. 682). 2. The deposing of ministers pertains to classical presbyteries, or (if the matter be doubtful and difficille) to synods, as has been showed. And who then can give the High Commission such authority as to take this power from them, and to assume it unto itself. These Commissioners profess that they have authority to discharge other ecclesiastical judicatories within the kingdom from meddling with the judging of anything which they shall think impertinent for them, and which they shall think good to judge and decide by themselves in their commission. Which, if it be so, then (when it pleases them) they may make other ecclesiastical judicatories to be altogether useless and of no effect in the Church. 3. In this commission, ecclesiastical and temporal men are joined together, and both armed with the same power. Therefore it is not right nor regular, nor in any wise allowable. For even as when a minister has offended in a civil matter, his fault is to be judged by civil judges according to the civil laws, and by no other: so when he offends in an ecclesiastical matter, his fault is to be judged only by ecclesiastical persons according to ecclesiastical laws: and in such a case Justinian forbids civil men to be joined with ecclesiastical men in judgment (Novell., 83, ch. 1). They are ecclesiastical things or causes which are handled and examined by the High Commission in the process of deposing ministers: and a shame it is to ecclesiastical men if they can, without the help and joining of temporal men, judge and decide things of this quality. 4. As in the matters to be judged, so in the censures and punishments to be inflicted; ecclesiastical and civil men have in this Commission alike power and authority: for ecclesiastical men therein have power of fining, confining, warding, etc. common to them with the temporal men: and again, the temporal men have power of excommunication, suspension, deprivation, etc. common to them with the ecclesiastical men. For they all sit there as the king’s commissioners, and so nomine [by name] they exerce this jurisdiction: which Commission being alike discharged by them all, it is manifest that both temporal men take hold of the keys and ecclesiastical men take hold of the civil sword. And this monstruous confusion and mixture gives sufficient demonstration that such a form of judgement is not from the God of order.”

— George Gillespie, English Popish Ceremonies (1637), pt. 3, bk. 8, Digression 4, pp. 195-97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+there+was+brought+forth+in+Scotland%2C+anno+1610%2C+a+certain+amphibian+brood%2C+sprung+out+of+the+stem+of+Neronian+tyranny+and+in+manners+like+to+his+nearest+kinsman%2C+the+Spanish+Inquisition.+It+is+armed+with+a+transcendent+power+and+called+by+the+dreadful+name+of+the+High+Commission.+Among+other+things%2C+it+arrogates+to+itself+the+power+of+deposing+ministers.+But+how+unjustly%2C+thus+it+appears%3A+1.+If+those+commissioners+have+any+power+at+all+to+depose+ministers%2C+they+have+it+from+the+king+whose+commissioners+they+are.+But+from+him+they+have+it+not.+Therefore+they+have+none+at+all.+The+proposition+is+most+certain%3A+For+they+sit+not+in+that+commission+to+judge+in+their+own+name%2C+nor+by+their+own+authority+quum+nihil+exerceat+delegatus+nomine+proprio%2C+as+Panormitan+says+%28apud+Forb.+Iren%2C+bk.+2%2C+ch.+11%2C+p.+177%29%2C+but+by+virtue+only+of+the+commission+and+delegation+which+they+have+of+the+king.+Yea%2C+bishops+themselves+exerce+not+any+jurisdiction+in+the+High+Commission+as+bishops%2C+but+only+as+the+king%E2%80%99s+commissioners%2C+as+Dr.+Downame+aknowledges+%28Defens.%2C+bk.+1%2C+p.+8%29.+The+assumption+is+grounded+upon+this+reason%3A+The+king+has+not+power+to+depose+ministers.+Therefore+he+cannot+give+this+power+to+others.+For+Nemo+potest+plus+juris+transferre+in+alium+quam+sibi+competere+dignoscatur+%28Boniface%2C+8%2C+De+Regul.+Juris+Reg.%2C+79%29.+The+king+may+sometimes+inflict+such+a+civil+punishment+upon+ministers%2C+whereupon+secondarily+and+accidentally+will+follow+their+falling+away+from+their+ecclesiastical+office+and+function%2C+%28in+which+sense+it+is+said+that+Solomon+deposed+Abiathar%2C+as+we+heard+before%29%2C+but+to+depose+them+directly+and+formally+%28which+the+High+Commission+usurps+to+do%29%2C+he+has+no+power%2C+and+that+because+this+deposition+is+an+act+of+ecclesiastical+jurisdiction%3A+Whereas+the+power+of+Ecclesiastical+jurisdiction+does+no+more+agree+to+the+king+than+the+power+of+ecclesiastical+order%3A+his+power+is+civil+and+temporal%2C+not+spiritual+and+ecclesiastical.+Dr.+Field+also+confesses+that+none+may+judicially+degrade+or+put+anyone+lawfully+admitted+from+his+degree+and+order+but+the+spiritual+guides+of+the+Church+alone+%28Of+the+Church%2C+bk.+5%2C+ch.+53%2C+p.+682%29.+2.+The+deposing+of+ministers+pertains+to+classical+presbyteries%2C+or+%28if+the+matter+be+doubtful+and+difficille%29+to+synods%2C+as+has+been+showed.+And+who+then+can+give+the+High+Commission+such+authority+as+to+take+this+power+from+them%2C+and+to+assume+it+unto+itself.+These+Commissioners+profess+that+they+have+authority+to+discharge+other+ecclesiastical+judicatories+within+the+kingdom+from+meddling+with+the+judging+of+anything+which+they+shall+think+impertinent+for+them%2C+and+which+they+shall+think+good+to+judge+and+decide+by+themselves+in+their+commission.+Which%2C+if+it+be+so%2C+then+%28when+it+pleases+them%29+they+may+make+other+ecclesiastical+judicatories+to+be+altogether+useless+and+of+no+effect+in+the+Church.+3.+In+this+commission%2C+ecclesiastical+and+temporal+men+are+joined+together%2C+and+both+armed+with+the+same+power.+Therefore+it+is+not+right+nor+regular%2C+nor+in+any+wise+allowable.+For+even+as+when+a+minister+has+offended+in+a+civil+matter%2C+his+fault+is+to+be+judged+by+civil+judges+according+to+the+civil+laws%2C+and+by+no+other%3A+so+when+he+offends+in+an+ecclesiastical+matter%2C+his+fault+is+to+be+judged+only+by+ecclesiastical+persons+according+to+ecclesiastical+laws%3A+and+in+such+a+case+Justinian+forbids+civil+men+to+be+joined+with+ecclesiastical+men+in+judgment+%28Novell.%2C+83%2C+ch.+1%29.+They+are+ecclesiastical+things+or+causes+which+are+handled+and+examined+by+the+High+Commission+in+the+process+of+deposing+ministers%3A+and+a+shame+it+is+to+ecclesiastical+men+if+they+can%2C+without+the+help+and+joining+of+temporal+men%2C+judge+and+decide+things+of+this+quality.+4.+As+in+the+matters+to+be+judged%2C+so+in+the+censures+and+punishments+to+be+inflicted%3B+ecclesiastical+and+civil+men+have+in+this+Commission+alike+power+and+authority%3A+for+ecclesiastical+men+therein+have+power+of+fining%2C+confining%2C+warding%2C+etc.+common+to+them+with+the+temporal+men%3A+and+again%2C+the+temporal+men+have+power+of+excommunication%2C+suspension%2C+deprivation%2C+etc.+common+to+them+with+the+ecclesiastical+men.+For+they+all+sit+there+as+the+king%E2%80%99s+commissioners%2C+and+so+nomine+%5Bby+name%5D+they+exerce+this+jurisdiction%3A+which+Commission+being+alike+discharged+by+them+all%2C+it+is+manifest+that+both+temporal+men+take+hold+of+the+keys+and+ecclesiastical+men+take+hold+of+the+civil+sword.+And+this+monstruous+confusion+and+mixture+gives+sufficient+demonstration+that+such+a+form+of+judgement+is+not+from+the+God+of+order.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+3%2C+bk.+8%2C+Digression+4%2C+pp.+195-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6c56e7c541.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6c56e7c541.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=Now%20there%20was%20brought%20forth%20in,not%20from%20the%20God%20of%20order&amp;text=Now%20there%20was%20brought%20forth%20in%20Scotland%2C%20anno&amp;text=judgement%20is%20not%20from%20the%20God%20of%20order" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

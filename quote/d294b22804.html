<main class="wrap"><figure class="quote" id="q-d294b22804" data-kw="against genus maiestaticum">
<blockquote><p>Were certain properties of the divine nature formally communicated to the human nature of Christ by the personal union? We deny against the Lutherans. The effects of the hypostatical union with respect to the human nature are: the grace of eminence and habitual graces. To the former are commonly ascribed both the grace of eminence (which is the dignity of human nature above all creatures, arising from the union of the same with the divine nature, by which flesh is a property of the Son of God—which can be said of no other creature) and habitual graces (to wit, those remarkable gifts with which the human nature was adorned).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.8.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2838d2990a" data-kw="two wills dyothelite">
<blockquote><p>The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6, 7, 11); (2) two wills are ascribed to him (“not my will, but thine, be done,” Lk. 22:42). Nor does it follow that there are two willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.7.14</span></figcaption>

</figure><figure class="quote" id="q-4730c523b9" data-kw="session not ubiquity">
<blockquote><p>What is the session of Christ at the right hand of God? According to what nature does it apply to Christ and does it pertain to the relation of situation? We deny. This question is necessary on account of the Lutherans, who, to prove the omnipresence and omnipotence of the human nature of Christ, maintain that he (according to his human nature) sits at God’s right hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.19.1</span></figcaption>

</figure><figure class="quote" id="q-26919745da" data-kw="sinless without immaculate Mary">
<blockquote><p>Thus there is no necessity to have recourse to the immaculate conception of Mary. For although there is no creature of whatever power possessed who can bring a clean thing out of an unclean (Job 14:4), still the power of God is not thus to be measured (with whom nothing is impossible and who calls those things which are not).</p></blockquote>

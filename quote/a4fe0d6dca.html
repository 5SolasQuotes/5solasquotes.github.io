<main class="wrap"><figure class="quote" id="q-a4fe0d6dca" data-kw="">
<blockquote><p>Never make those things to he sins, which God never made to be sins. To make those things to be sins which God hath made to be no sins, is to make gods of yourselves; yea, it is to lift up yourselves above God himself, as if you were more holy, more wise, more just, and more righteous than the Holy One of Israel is.

Indeed the Papists, that are will-worshippers, and commonly highly conceited of their own wisdom and worth, they frequently transgress this rule with their ‘Touch not, taste not, handle not,’ Col. ii. 21, 23; which things have indeed a show of wisdom in will-worship, &amp;c. But why should you, why should you, who have a higher profession upon you, and a more clear gospel-light shining every day more strongly upon you?

But, … Never make those things to be absolute and necessary duties, that God hath nowhere declared to be such, Isa. xxxiii. 22; James iv. 12. Such things that do neither fall under a general nor a particular command of God, may not be imposed upon the consciences of men as absolute and necessary duties to be performed by them. A faithful observing of these two rules would prevent a multitude of sins, a sea of sorrows, and a world of troubles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 21.</span></figcaption>

<blockquote><p>[E]very good man, and especially a Minister should flee all occasion of vain glory: Yea, Christian modesty, and soberness require, that every man though they were endued with the greatest graces in the world, yet they should speak and think of themselves soberly: the more they have, the greater graces that God hath given them, the less they should account of themselves: yea, suppose they be something in the sight of God, yet looking to the naughtiness that abideth in this cankered nature, they should say of themselves (I am nothing) for the Apostle saith, 1. Cor. 8. 2 &amp; Gal. 6. 3. He that thinketh himself something, he is nothing &amp; Phil. 2. 3. Let every man account another man better than himself.

If a man will meditate on his own estate, either by night or by day, let him think of his infirmities, his sins and naughtiness: will he rejoice of himself in his own mind? look to Paul what he saith. 2. Corin. 12. 9. I will rejoice in mine infirmities, that the power of Jesus may dwell in me. The power of God never dwelt in a proud nor ambitious heart, but in an humble heart: God resisteth the proud, &amp; giveth grace to the humble,1. Pet. 5. 5. So Paul, when he was musing of himself, albeit hee had seen great visions, 2. Cor. 12. he complaineth of his infirmity to the Lord: the Lord answereth, My grace is sufficient for thee, my power is made perfect through weakness. Then thou that wouldst be strong in God, be weak in thy self: think night and day of thine infirmity &amp; misery by sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain sermons, upon several texts of Scripture</cite>, eds Henry Charteris and William Arthur (Edinburgh: Andro Hart, 1616), pp 66-67.</span></figcaption>

</figure><figure class="quote" id="q-da825358c8" data-kw="">
<blockquote><p>The Sabbath came out of Christ’s hands, we see then, not despoiled of any of its authority or robbed of any of its glory, but rather enhanced in both authority and glory. Like the other commandments it was cleansed of all that was local or temporary in the modes in which it had hitherto been commended to God’s people in their isolation as a nation, and stood forth in its universal ethical content. Among the changes in its external form which it thus underwent was a change in the day of its observance. No injury was thus done the Sabbath as it was commended to the Jews; rather a new greatness was brought to it. Our Lord, too, following the example of his Father, when he had finished the work which it had been given him to do, rested on the Sabbath—in the peace of his grave. But he had work yet to do, and, when the first day of the new week, which was the first day of a new era, the era of salvation, dawned, he rose from the Sabbath rest of the grave, and made all things new. As C. F. Keil beautifully puts it; “Christ is Lord of the Sabbath, and after the completion of his work, he also rested on the Sabbath. But he rose again on the Sabbath; and through his resurrection, which is the pledge to the world of the fruit of his redeeming work, he made this day the Lord’s Day for his Church, to be observed by it till the Captain of its salvation shall return, and having finished the judgment upon all his foes to the very last, shall lead it to the rest of that eternal Sabbath which God prepared for the whole creation through his own resting after the completion of the heaven and the earth.” Christ took the Sabbath into the grave with him and brought the Lord’s Day out of the grave with him on the resurrection morn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Foundations Of The Sabbath In the Word of God”</cite>, An address delivered at the Fourteenth International Lord’s Day Congress held in Oakland, California, July 27-August 1, 1915, published in Sunday the World’s Rest Day. 1916, pp.63-81, and in The Free Presbyterian Magazine. Glasgow, 1918, pp. 316</span></figcaption>

<blockquote><p>God will manifest that He is displeased with such duties that thou doest perform; He will manifest it one way or other that He is a holy God, and He does not accept of such unholy things as thou doest tender up to Him; for the truth is, if God should accept of such unholy things from men, God may be said to be like unto themselves. As a man if he does entertain any as his familiar friend that is naught and wicked, it is his disgrace and dishonour… So God may employ the most wicked men in the world in some outward services, but if He should accept of them in his worship, it would be a dishonour to God, and therefore God, that He might sanctify his own name, He will manifest his displeasure at one time or other against such duties of worship you that perform worship in a formal manner and with unclean, vile hearts;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b7fc69887b" data-kw="">
<blockquote><p>4th Problem. Whether creatures can be similar to God? Answer: Of an accidental similitude, and by participation, Affirmed—as is manifestly proved from Gen. 1, where it treats of the creation of man to the image and likeness of God. But of an essential similitude, or one by essence, Denied. And under this distinction is to be explained, against the enthusiastic distortions, the passage 2 Pet. 1:4, where the participation of θείας φύσεως [the divine nature] is to be understood accidentally, by imitation and similitude—but not essentially according to substance, whether the same in number or in species. Hence, too, the passage Isa. 46 receives light, where God denies Himself to be similar to any thing—much less that any external image can be a picture of Him, or a formal sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin, vol. 5 (1669)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-643453b65e" data-kw="">
<blockquote><p>All creatures and created beings compared with God, the first being of Himself subsisting, and the infinite God may be denied, to be beings comparatively: And so our created self is nothing, to wit, nothing in dignity, or excellency beside God, or nothing in the kind of a being that essentially is of itself: as God is in genere entis per essentiam, yet man is a being in the kind of being by participation, in genere entis per participationem; man comared with God, is a poor, worthless, sorry, little-nothing, a weeping, melting, evanishing cipher… So the Scripture says, ‘Man at his best state is altogether vanity.’ Ps. 39:5, ‘Behold, thou hast made my days as a handbreadth, and mine age is nothing before thee: verily every man at his best state is altogether vanity.’ Isa. 40:17, ‘All nations before Him are nothing, and less than nothing, and vanity.’ Yet a heathen may say and think and demonstrate by reason that self and man, and all the world are less in incomparison of the infinite God than nothing to all things, a drop of water to the sea, the shadow to the body, a peny-torch to the light of ten thousand millions of suns in one;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pt. 2, p. 359</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

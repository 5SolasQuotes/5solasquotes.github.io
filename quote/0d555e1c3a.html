<main class="wrap"><figure class="quote" id="q-0d555e1c3a" data-kw="">
<blockquote><p>They [angels] are all from creation of a spiritual nature, Heb. 1:14; Mt. 10:1, and thereby intelligent and willing… Adorned with the image of God, whose sons they are called, Job 1:6, and that in a more perfect manner than men, Ps. 8:5.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b8c4d98eca" data-kw="">
<blockquote><p>Man is brought forth into life not as by a mother, but as by a stepmother, nature, with a body naked and fragile and weak, and with a soul anxious for troubles, humble for fears, soft for labors, prone to lusts; in which, however, there is, as if buried, a certain divine fire of genius and mind.” ([as quoted by] Augustine, bk. 4, contr. Pelag.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sin &amp; its Distinctions’ (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, p. 16 | “The words of Cicero in a fragment of De Republica, bk. 3, are consonant:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-bf53d697a1" data-kw="">
<blockquote><p>But when I say that God can without respect of sin, inflict any torment upon his creature, this is delivered of power absolute. This power the Lord did execute upon his own Son: for what was his sin? Was He not the spotless lamb of God? Yet what agonies did He suffer in the garden, what torments and terrors upon the cross, when He cried out ‘My God, my God, Why hast thou forsaken Me?’ But the like power He does not execute on us, only He gives us authority to exercise the like power over other creatures: If the powder of an hare [rabbit] burnt alive in an oven, be found to be wholesome for us, He gives us leave thus to deal with him, and the like: yet have not these creatures sinned either against God, or against us. Of this absolute power of God I have discoursed more sparingly in the place cited by him, bk. 1, pt. 2, De Electione, digression 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath… (Oxford: L.L., 1653), pt. 2, 2nd Sort of Arguments, sect. 3</cite>, pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“But when I say that God can without respect of sin, inflict any torment upon his creature, this is delivered of power absolute. This power the Lord did execute upon his own Son: for what was his sin? Was He not the spotless lamb of God? Yet what agonies did He suffer in the garden, what torments and terrors upon the cross, when He cried out ‘My God, my God, Why hast thou forsaken Me?’ But the like power He does not execute on us, only He gives us authority to exercise the like power over other creatures: If the powder of an hare [rabbit] burnt alive in an oven, be found to be wholesome for us, He gives us leave thus to deal with him, and the like: yet have not these creatures sinned either against God, or against us. Of this absolute power of God I have discoursed more sparingly in the place cited by him, bk. 1, pt. 2, De Electione, digression 3.”

<blockquote><p>Consider what is the general judgement of infidels… can they digest our Christian doctrine concerning the general condition of all mankind as born in original sin… Especially, in case the soul of the child proceeds not from the parents, but immediately from God, as who by infusing it creates it, and by creating it, infuses it?</p></blockquote>

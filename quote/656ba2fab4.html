<blockquote><p>But it is taken most strictly and properly for that full and august revelation of the mysteries of salvation which Christ (as the highest teacher of the church) has exhibited to us. It is not comprehended under the priesthood or under the kingly office, but constitutes a distinct part of the mediatorial office—the prophetic.</p></blockquote>

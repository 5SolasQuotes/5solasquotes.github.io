<main class="wrap"><figure class="quote" id="q-d5c4fbf3c4" data-kw="">
<blockquote><p>As for those who allege some conveniency in the ceremonies, they say more than can abide the proof of reason, which the induction [enumeration] of some particulars shall demonstrate. Dr. [Thomas] Morton (Particular Defense, ch. 1, sect. 1 [1618]) alleges for the surplice that the difference of outward garments cannot but be held convenient for the distinguishing of ministers from laics [laity] in the discharge of their function. Answer: This conveniency is as well seen to without the surplice. If a man having a black gown upon him be seen exercising the function of a minister, it is very strange if any man think it not sufficiently distinguished from laics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 2, Ch. 2, p. 73</span></figcaption>

</figure><figure class="quote" id="q-12ad2ed2ac" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, … ([Basel: Guarinus, 1577]), pt. 2, ch. 8, pp. 262-63</span></figcaption>

</figure><figure class="quote" id="q-cd99044f54" data-kw="">
<blockquote><p>…we think that some things are tolerated which should not at all be endured. We are not spending so much time on those linen vestments that we would want the progress of God’s Word to be disturbed because of them–even just a little. Yet we judge that they have acted correctly and wisely who have thrown out of their churches that whole form of dress, which is more suited to actors than to ministers of the Word, as well as other remnants of paganism. For surely they can do a great deal of harm, as experience itself has taught; and they cannot help at all. But we certainly do not count the restoring of what has been thrown out among things that are indifferent [adiaphora].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (1559; RHB, 2016), pp. 143-44</span></figcaption>

</figure><figure class="quote" id="q-7ae450d63b" data-kw="">
<blockquote><p>Liturgical vestments that distinguished the priest from the community are attested only from the fourth century onward. There are no guidelines or regulations given in the New Testament. Moreover, the early Christian communities did not place themselves in the tradition of the Old Testament priesthood and its cultic dress… As the customary everyday dress changed, the clergy held on to the old style of dress… This older form of dress… served to distinguish the clergy from the other members of the community. In Rome as early as the sixth century it seems that there existed blessings for liturgical vestments. From the ninth century onward prayers were said as the vestments were put on… Liturgical vestments were given ever new allegorical interpretations reflecting salvation history (Rabanus Maurus [780-856] and Amalar of Metz [775-850])… …In the adiaphorist [indifferent] controversy Zwingli, Calvin, the Anabaptists, and Matthias Flacius Illyricus [a Lutheran] and his followers among other things called for doing away with liturgical vestments. As early as the first Zurich Disputation of 1523 Zwingli rejected liturgical vestments; he allowed for them in his work De canone missae epicheiresis, which appeared that same year; finally, toward the end of the year, presumably under external pressure, he adopted a stance against vestments. In the Zurich regulations of 1535 he disapproved of external adornments such as silk, gold and silver in the churches on the grounds that the early church not only did not possess these things, but even rejected them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oxford-encyclopedia-of-the-reformation.html">Oxford Encyclopedia of the Reformation</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oxford Encyclopedia of the Reformation</cite>, (1996), ‘Clerical Vestments’, vol. 1, pp. 366-68</span></figcaption>

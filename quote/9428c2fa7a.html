<main class="wrap"><figure class="quote" id="q-9428c2fa7a" data-kw="">
<blockquote><p>For in the Old Testament there are many rules, directions and examples, as a pillar of fire to guide the Churches now by (as that Rom. 15:4 shows) namely those examples and rules of moral and common equity, else the Church of God should loose now many a good ground, for many practices… Now if you [Independents] will use the Old Testament in some examples and commands, as you do (though here you forget to mention it), then grounds out of the Old Testament (in matters not ceremonial and judicial proper to the Jews’ policy, nation and times) but in things of moral and common equity will justify other practices…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, (1644), p. 69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-101dd2df33" data-kw="">
<blockquote><p>Aquinas argues that every natural inclination towards the good is “a kind of impression from the first mover.” (ST i q.103, a. 8 co. As in St. Thomas Aquinas, Summa Theologica, trans. Fathers of the English Dominican Province, 3 vols (New York: 1947). See also ST i q. 103, a. 1 ad 3, a. 5, ad 2)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 230 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>

</figure><figure class="quote" id="q-afd1f73699" data-kw="">
<blockquote><p>Of the forensic laws of Moses, those are perpetual which are of common right, or which have something moral. However, those have been abrogated which are of particular right, that is, such laws as were specially for the Mosaic constitution, and which have something ceremonial attached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-heinrich-alsted.html">Johannes Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Encyclopedia</cite>, vol. 4, p. 1599 trans. Adam Brink</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-993670cede" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, pt. 2, ch. 1, ‘Against Some of our Opposites who aknowledge the inconveniency of the Ceremonies &amp; yet would have us yield to them’ in English Popish Ceremonies (1637), pp. 1-13, p. 9</span></figcaption>

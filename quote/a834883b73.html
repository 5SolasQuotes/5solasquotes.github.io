<blockquote><p>One Instance more of his mis-alledging and perverting of testimonies. In the close he cites a passage of Mr. Case his Sermon August 22. 1645. “He (Christ) is King of Nations and King of Saints. As King of Nations he has a temporal Kingdom and Government over the world, etc. and the rule and regiment of this Kingdom he has committed to Monarchies, etc. Here is Erastianism, (says Mr. Coleman p. 38.) a step higher then ever I or Erastus himself went. And I desire to know of Mr. Gillespie, if he will own this as good divinity.” Yes Sir I own it for very good divinity, for my Reverend Brother Mr. Case, says not that Christ as Mediator is King of Nations, and has a temporal Kingdom in the world, and has committed rule and regiment to Monarchies or other lawful Magistrates, (which is the point that you and Mr. Hussey contend for, being a great Heterodoxy in Divinity) but he says of the Son of God, that he is King of Nations, and has committed Rule to Monarchies, which I own with all my heart. The distinction of the twofold Kingdom of Christ, a universal Kingdom, whereby he reigns over all things as God: and a special economical Kingdom, whereby he is King to the Church only, and rules and governs it, is that which being rightly understood, overturns, overturns, overturns the Erastian principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Male audis or, An answer to Mr. Coleman his Malè dicis: Wherein the repugnancy of his Erastian doctrine to the word of God, to the solemne league and covenant, and to the ordinances of Parliament</cite>, …. (London, 1646), 55.. [Spelling modernized].</span></figcaption>

</figure><figure class="quote" id="q-80d066d2da" data-kw="">
<blockquote><p>The British Baptists held to a high view of the magistrate and followed largely in the Magisterial Protestant tradition in terms of constitutional monarchy, the two kingdoms, and, to varying degree, the magistrate’s care of religion… the English Baptist theologian John Gill exemplifes this political perspective. Judging from his statements about the duties of a magistrate, that include securing right religious worship in the commonwealth and enforcing virtue using the two tables of the Decalogue, it is apparent that Gill would not have agreed with Jeferson’s wall of separation, nor with the Baptists who followed him. The “frst care of government” is of divine things. Though the Second London Confession does not stipulate the magistrate’s responsibility for care of religion, it does not argue against it, and so Gill is not in violation of this doctrinal standard for maintaining this view held by the Magisterial Reformers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ian-clary.html">Ian Clary</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The First Care of Government’: John Gill on the Magistrate &amp; the Church’ The Hanover Review</cite>, (2024), pp. 4-23, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5f44cb6f49" data-kw="">
<blockquote><p>The woman being created was brought to man and given unto him by God, and he took her, with her consent, as flesh of his flesh, and bone of his bone; and they twain became one flesh. And God commanded this order to be observed unto the end of the world. This was the first institution of this sacred society: So that the first and principal efficient of marriage, was God instituting it; the subordinate, is the mutual consent of the parties. For marriage is a contract, or covenant: This is the general nature of it; and as the matter is one man, and one woman, free from all former obligation that may hinder it, so the form, and chief essence is in the special nature of the contract, whereby they mutually bind themselves one unto another so as to become one flesh for term of life of both the parties. The end is propagation mutual help and comfort, and upon the Fall, per accidens, the avoiding of fornication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theo-Politica, or, A Body of Divinity Containing the Rules of the Special Government of God</cite>, ... (London: Streater, 1659), ch. 8, 7th Commandment, p. 205</span></figcaption>

<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(XI, 27) as quoted in Heinrich Heppe, Reformed Dogmatics, ch. 17, Person of Christ, section 12</cite>, pp. 425-6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.”

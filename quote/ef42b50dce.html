<main class="wrap"><figure class="quote" id="q-ef42b50dce" data-kw="">
<blockquote><p>This mode of expression, they tell us, is employed, because God bestows the first grace. It is really foolish to imagine that they can succeed in this way, since Paul excludes man and his utmost ability, -- not only from the commencement, but throughout, -- from the whole work of obtaining salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08d6a514fe" data-kw="Faith alone">
<blockquote><p>Man is justified by faith without works; therefore by faith alone. The reason of the consequence is manifest because there are not more modes of justifying than these two—by faith and by works. Thus, one being removed, the other must not only necessarily be left, but also left alone. Otherwise the enumeration would not be legitimate. … Now why would the apostle so often and so expressly institute an antithesis between faith and works in this matter, if works could concur with faith in any way to the act of justification? Would he not in this particular have occasioned believers to err by removing works absolutely and simply from it, if they contribute anything towards it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.8</span></figcaption>

</figure><figure class="quote" id="q-76f840e0cf" data-kw="">
<blockquote><p>We cannot by our best works merit pardon of sin or eternal life at the hand of God, by reason of the great disproportion that is between them and the glory to come, and the infinite distance that is between us and God, whom by them we can neither profit nor satisfy for the debt of our former sins; but when we have done all we can, we have done but our duty, and are unprofitable servants (Rom. 3:20; Eph. 2:8–9; Rom. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 16.5</span></figcaption>

</figure><figure class="quote" id="q-80548af3e9" data-kw="Merit">
<blockquote><p>I ask, what need was there to introduce the word Merit, when the value of works might have been fully expressed by another term, and without offense? The quantity of offense contained in it the world shows to its great loss. It is certain that, being a high sounding term, it can only obscure the grace of God, and inspire men with pernicious pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span></div>

</figure><figure class="quote" id="q-98f9938805" data-kw="">
<blockquote><p>The third opinion is of those who attribute the work of justification unto God, but place their righteousness partly in their faith, as their own work, and partly in the obedience of Christ; and make two actions of God in justifying. … All these three opinions do attribute man’s righteousness, either wholly or in part, to his own working. The first and last do join grace and merit together in justification. Which things are most contrary to the truth of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Tending to Clear the Doctrine of Justification</cite>, 1616, p. 52</span></figcaption>

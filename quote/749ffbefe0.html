<main class="wrap"><figure class="quote" id="q-749ffbefe0" data-kw="">
<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer’ in Practical Religion</cite>, (Evangelical Press), pp. 97-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe4aa0bdd8" data-kw="">
<blockquote><p>Virtually all of the orthodox systems cite a wide variety of texts–dicta probantia [proving texts]–which are intended for use, not crassly as proof texts for citation without exegesis, but as points of reference to the long-established results of the church’s exegetical tradition. The dicta probantia or proving texts serve not to circumvent study of the text but to indicate received interpretation leading from exegesis to doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (2003) 1.426</span></figcaption>

</figure><figure class="quote" id="q-fed762504d" data-kw="">
<blockquote><p>Let us then here call to mind the distinction which has been showed betwixt religious ceremonies and moral circumstances: for as touching moral circumstances which serve for common order and decency in the worship of God, they being so many and so alterable that they could not be particularly determined in Scripture, for all the different and almost infinite cases which might occur, the Jewish Synagogue had the same power for determining things of this nature which the church of Christ now has. For the law did not define but left the[m to] be defined by the Synagogue, the set hours for all public divine service, when it should begin, how long it should last, the order [that] should be kept in the reading and expounding of the law, praying, singing, catechizing, excommunicating, censuring and absolving of delinquents, etc., the circumstances of the celebration of mariage, of the education of youth in schools and colleges, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637), pt. 3, ch. 7, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-ee7f641456" data-kw="">
<blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 303-304</span></figcaption>

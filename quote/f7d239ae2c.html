<main class="wrap"><figure class="quote" id="q-f7d239ae2c" data-kw="">
<blockquote><p>It is the Confession to which all ranks in these lands are bound to adhere as a part of their Covenanted uniformity. This Confession was framed in carrying into effect one principal object of the Solemn League, which was to bring the Churches in the three kingdoms to the nearest possible uniformity, in doctrine, worship, discipline, and government. Moreover, it was actually received, and solemnly recognized by the parties concerned in that federal deed, as their doctrinal standard of uniformity, to which they were bound to adhere by the oath of God. To abandon this Confession, therefore, in principle at least, so long as it cannot be shown to be unscriptural, would be to incur the charge of covenant violation.

We do not insist that the design of that League would be defeated by a mere change of statement, if the principles in the Westminster Confession were retained, provided the change of statement had that concurrence of all the Churches in Britain and Ireland, which gave their sanction to that Confession. But till this is obtained, the safest way to preserve the public faith inviolate, is to adhere to it not only in the spirit, but also in the letter of it. …

It is a Confession to which the Churches in Britain and Ireland are not only bound to adhere by solemn covenant, but it is also the basis on which there is a great probability that they will unite, when the Lord brings again Zion. Though the greater part of these Churches have never fully redeemed the pledge given by them in the Solemn League, to cleave to the Westminster Standards, as standards of uniformity to the three nations; it does not free any of them from their solemn engagements. The friends of these standards are still bound to hold them fast, and to display them as a banner to the generation, in order to remind them of their first love, and of their first works.

Nor are they left without hope that the great object of the Westminster Confession, as a standard of uniformity, will ultimately be gained. However far even the Presbyterian Churches in Britain and Ireland may have departed in administration from that Confession, it is still recognised by them in some form or other, as an explanatory standard. It seems therefore to be reserved in the providence of God as a central point, in which all the scattered sections of the Church in these lands will meet, when times of refreshing shall come from the presence of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-stevenson.html">George Stevenson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plea for the Covenanted Reformation in Britain and Ireland</cite>, (3rd edn, Edinburgh: W. P. Kennedy, 1844), p. 95.</span></figcaption>

</figure><figure class="quote" id="q-175936c8aa" data-kw="">
<blockquote><p>In his preface to the works of Robert Leighton, Philip Doddridge expressed his desire for greater unity and catholicity among Protestants. We agree with the general sentiment expressed here, though we would not commit ourselves to every expression. There certainly should be greater exertions for unity today among those who maintain the true Reformed religion:

And let me be permitted to add, that I have some secret hope this publication, in these circumstances, may, among other good effects, promote that spirit of Catholicism, for which our Author was so remarkable, and extend it among various denominations of Christians, in the northern and southern parts of our island.

If the sincerest language or actions can express the disposition of the heart, it will be here apparent, that a diversity of judgment, with regard to Episcopacy, and several forms both of discipline and worship connected with it, have produced in my mind no alienation, no indifference towards Archbishop Leighton, nor prevented my delighting in his works, and profiting by them.

In this respect I trust my brethren in Scotland will, for their own sake, and that of religion in general, show the like candour. On the other side, as I have observed with great pleasure and thankfulness how much many of the established clergy in this part of Britain are advancing in moderation towards their dissenting brethren, I am fully assured they will not like these excellent pieces the worse, for having passed through my hand.

It is truly my grief, that any thing should divide me from the fullest communion with those to whom I am united in bonds of as tender affection as I bear to any of my fellow Christians. And it is my daily prayer, that God will, by his gentle but powerful influence on our minds, mutually dispose us more and more for such a further union, as may most effectually consolidate the Protestant cause, establish the throne of our gracious Sovereign, remove the scandal our divisions have occasioned, and strengthen our hands in those efforts by which we are attempting, and might then, I hope, more successfully attempt the service of our common Christianity. In the mean time, I desire most sincerely to bless God for any advances that are made towards it …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-doddridge.html">Philip Doddridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 106-07.</span></figcaption>

</figure><figure class="quote" id="q-0b44dcca6e" data-kw="">
<blockquote><p>I answer, recommendatory letters can never give a Church-right to the Church-privileges of the seals of the Covenant: they do but only notify, manifest and declare the Church-right which the man had before. Therefore, either he cannot in any sort be capable of the seals of the Covenant in another congregation than his own whereof he is an inchurched member [as upon a congregationalist view], which destroys all communion of sister Churches, or if he be capable of the seals in another congregation [which be the case], he was capable and had a Church-right in himself before he received recommendatory letters: yea, these whom we recommend by letters as fit to partake of the sacraments in another congregation, we presuppose they have Church-right to the seals in another congregation-visible than in their own whereof they are members, except our testimony be false. Therefore, before our recommendatory letters, the person of approved piety was a member of all the visible Churches about, hoc ipso, and ‘by that same reason,’ that he is a member of one visible congregation: Yea Peter clearly insinuates that all who have received the Holy Ghost, are to be baptized, Acts 8:47, as Philip, Acts 8:37, and that if the Eunuch believed, he might be baptized. So that faith, to speak properly, does give us right to the seals, and to speak accurately, a visible profession of faith does not give a man right to the seals of grace, but only it does notify and declare to the Church that the man has right to the seals because he believes, and that the Church may lawfully give to him the seals, and that profession is a condition required in the right receivers of the seals in an ecclesiastical way; But faith gives the right to these seals, and because the faith of the believer goes with the believer when he goes to another visible congregation than his own, that faith gives him right to the seals in all places and in all congregations: for faith gives right to receive Christ sacramentally, not in one congregation only, but in all, and a visible profession does as a condition notify this faith and Church-right in all congregations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, pp. 195-96 Rutherford (c. 1600–1661) was a Scottish presbyterian Westminster divine.</span></figcaption>

— Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, … (London, 1644), pt. 2, ch. 4, section 5, pp. 195-96 Rutherford (c. 1600–1661) was a Scottish presbyterian Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer%2C+recommendatory+letters+can+never+give+a+Church-right+to+the+Church-privileges+of+the+seals+of+the+Covenant%3A+they+do+but+only+notify%2C+manifest+and+declare+the+Church-right+which+the+man+had+before.+Therefore%2C+either+he+cannot+in+any+sort+be+capable+of+the+seals+of+the+Covenant+in+another+congregation+than+his+own+whereof+he+is+an+inchurched+member+%5Bas+upon+a+congregationalist+view%5D%2C+which+destroys+all+communion+of+sister+Churches%2C+or+if+he+be+capable+of+the+seals+in+another+congregation+%5Bwhich+be+the+case%5D%2C+he+was+capable+and+had+a+Church-right+in+himself+before+he+received+recommendatory+letters%3A+yea%2C+these+whom+we+recommend+by+letters+as+fit+to+partake+of+the+sacraments+in+another+congregation%2C+we+presuppose+they+have+Church-right+to+the+seals+in+another+congregation-visible+than+in+their+own+whereof+they+are+members%2C+except+our+testimony+be+false.+Therefore%2C+before+our+recommendatory+letters%2C+the+person+of+approved+piety+was+a+member+of+all+the+visible+Churches+about%2C+hoc+ipso%2C+and+%E2%80%98by+that+same+reason%2C%E2%80%99+that+he+is+a+member+of+one+visible+congregation%3A+Yea+Peter+clearly+insinuates+that+all+who+have+received+the+Holy+Ghost%2C+are+to+be+baptized%2C+Acts+8%3A47%2C+as+Philip%2C+Acts+8%3A37%2C+and+that+if+the+Eunuch+believed%2C+he+might+be+baptized.+So+that+faith%2C+to+speak+properly%2C+does+give+us+right+to+the+seals%2C+and+to+speak+accurately%2C+a+visible+profession+of+faith+does+not+give+a+man+right+to+the+seals+of+grace%2C+but+only+it+does+notify+and+declare+to+the+Church+that+the+man+has+right+to+the+seals+because+he+believes%2C+and+that+the+Church+may+lawfully+give+to+him+the+seals%2C+and+that+profession+is+a+condition+required+in+the+right+receivers+of+the+seals+in+an+ecclesiastical+way%3B+But+faith+gives+the+right+to+these+seals%2C+and+because+the+faith+of+the+believer+goes+with+the+believer+when+he+goes+to+another+visible+congregation+than+his+own%2C+that+faith+gives+him+right+to+the+seals+in+all+places+and+in+all+congregations%3A+for+faith+gives+right+to+receive+Christ+sacramentally%2C+not+in+one+congregation+only%2C+but+in+all%2C+and+a+visible+profession+does+as+a+condition+notify+this+faith+and+Church-right+in+all+congregations.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%E2%80%A6+%28London%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+section+5%2C+pp.+195-96+Rutherford+%28c.+1600%E2%80%931661%29+was+a+Scottish+presbyterian+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b44dcca6e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b44dcca6e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=I%20answer%2C%20recommendatory%20letters%20can%20never,faith%20and%20Church%2Dright%20in%20all%20congregations&amp;text=I%20answer%2C%20recommendatory%20letters%20can%20never%20give%20a&amp;text=notify%20this%20faith%20and%20Church%2Dright%20in%20all%20congregations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Wherein shall this great restauration and reformation of the Church consist?

In the fruition and enjoyment of certain privileges, such as the Church hath not at other times, at least not in the like degree.

The Privileges are of two sorts; Privative and Positive.

The Church shall be freed from the inundation of profaneness, with which it hath been miserably annoyed, leavened and infected before. Such shall be the piety and strictness of the government Ecclesiastical and Civil, that there shall not enter into the Church in any wise, any thing that defileth, Rev. 21.27.

She shall be purged from errors, superstition, idolatry, false and formal worship. It is sufficient to prove it, that we find no such thing mentioned in the Scriptures that speak of the state of the Church in the last times, besides what hath been said already, and shall be by and by. During Antichrist’s reign, men have been, and still are so zealous and tenacious of their old mumpsimuses, they can in no wise endure to hear of parting with them; like Micah of mount Ephraim, Judg. 18.23.24. that followed after the Danites, crying and complaining; they turned about, and asked him what he ailed. Ye have taken away my gods (saith he) which I made, and my priest (which he himself had consecrated for a priest) who should have blessed me, and doe you ask me what I ail? What have I more? I protest I had as live you had taken away all that I have. So it is with the men of our generation: from these things shall the Church then be freed.

She shall have exemption from oppression and persecution both Civil and Ecclesiastical; God shall wipe away all tears from the Saints eyes, and there shall be no more death, neither sorrow, nor crying, &amp;c. Rev. 21.4. That must needs be meant of the Church in this world, as appears by the context, Then shall the Lyon and the Lamb lie down and feed together, and the Tiger become tame the Childe shall play with the Asp and Cockatrice. Isa. 11.6.7. &amp; 65.25. Rev. 7.16.

There be two reasons of these privative privileges.

The earth-quake going before, shall shakedown these evils and all their supporters, as we have heard; the Beast his Hierarchy; his horns, the Kings of the earth that shall defend him to the last. And as the Lord did destroy not only the heathen Empire guilty of so much blood cruelty, and idolatry but would not let so much as that very form of government to stand; so it is probable, if not more, that all these dignities that have so desperately opposed the Sceptre of Christ, shall be taken away, Dan. 2.34, 5.44. Rev. 19. from ver. 17. to the end. God will purge out rebels. Ezek. 20.38. that at last none shall dare so much as to speak for false worship, formal worship, &amp;c. Then (and I doubt) not till then, will all these Sects and Divisions have an end.

Satan shall then be bound and chained up, that he shall not seduce the Nations to idolatry and persecution, as he hath always before done, Rev. 20.2. He hath been cast down before, as Rev. 12.9. but never bound, nor shall be till Antichrist’s fall. And so this prevents that which might be objected: though the wicked be taken away with the Earth-quake, yet sin will revive again. Answ. No: Satan shall be tied up from seducing that he cannot play such reaks in the world as before, man’s corruption wanting those bellows to blow it up which did formerly inflame it.</p></blockquote>

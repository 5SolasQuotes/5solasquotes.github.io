<main class="wrap"><figure class="quote" id="q-4c5e512b11" data-kw="">
<blockquote><p>And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 9, ‘The Road from Atheism’, p. 214</span></figcaption>

<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John</cite>, (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4, pp. 224-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-da02e8c88a" data-kw="">
<blockquote><p>4. Newness of being is essential to it [created being], or of its notion…

5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, pt. 2, On Creation, pt. 2, p. 118, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648)</span></figcaption>

</figure><figure class="quote" id="q-efc69252f5" data-kw="">
<blockquote><p>Fifthly, it can also be asked to what end God created all things. The principal end is, that there might be those who should enjoy the divine goodness known in very deed, and should glorify the majesty of God sempiternally. Unto this end both angels and men have been created. The secondary end is that the remaining created things should at the same time illustrate the glory of God and serve the uses of men. The consideration of these ends has nothing of ambiguity, and makes very much unto nourishing in us the faith of divine goodness and providence. … That place, Prov. 16, where Solomon says: ‘The Lord works all things for Himself, and the impious also unto the evil day,’ is not to be adduced unto this operation of creation. For Solomon speaks there not concerning creation, although God Himself the principle and end of all things created all things for Himself: but concerning His providence and government, by which He so governs all things, even the minds of the impious, that they make unto His glory. Therefore it is to be taken heed, lest anyone from the words of Solomon badly understood and applied, should gather that God created the impious, as impious. For the impious as impious is not from God, but from the father the devil (Jn. 8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd</cite>, ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

/creation#:~:text=Fifthly%2C%20it%20can%20also%20be%20asked,the%20father%20the%20devil%20%28Jn.%208&amp;text=Fifthly%2C%20it%20can%20also%20be%20asked%20to%20what&amp;text=but%20from%20the%20father%20the%20devil%20%28Jn.%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a198ed1450" data-kw="">
<blockquote><p>The creation of the world is an external, temporal, and universal action of God, by which He alone made and perfected the whole universe, by the power of His omnipotent will, in the space of six days; for His own glory, and the utility of creatures, especially intelligent ones, and the eternal salvation of the elect in heaven. … The adjunct of time is that God created the world in the space of six natural days, Gen. 2:3, Ex. 20:11. For although God could have created it in a moment, yet He willed to use these intervals: that He might more openly declare that the creation of the world was not made from eternity, but in time; and that He might render men more attentive in the particular meditation of distinct works, as appears especially from Ps. 104 &amp; 136.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

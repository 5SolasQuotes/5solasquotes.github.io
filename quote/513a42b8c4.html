<main class="wrap"><figure class="quote" id="q-513a42b8c4" data-kw="">
<blockquote><p>with the Reformed Churches, martyrs, confessors, doctors, we detest it [the Romish mass] from the heart as a denial of the unique sacrifice of Christ on the cross, and execrable idolatry, as our [Heidelberg] Catechism says in question 80. Moreover, we add that Christian Magistrates most gravely wound their conscience when they knowingly and willingly allow the miserable people to be imposed on by those abominable rites; which, however, we do not want to apply to those who can protest before God in conscience that they only tolerate an evil which they cannot remove without subversion of the Republic, or great concussion, or formidable and inevitable danger; which brings more evil than tolerating the mass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Sacrifice of Melchizedek, on Gen. 14:18’ tr. by AI by Onku in Select Disputations (Utrecht, 1669), vol. 4</cite>, p. 527 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-8ca0d5ad12" data-kw="">
<blockquote><p>For lest we of the people should bogle at coming on the stage to act our late tragedy over again, he [the opponent] would impose it on our beliefs that we are still in the middle act of it and that we ought to finish it. It is high time for him to consider whether if we run along with him in this we should not shut up compassion from our brethren and shut out a great part of our gratitude towards God; although I confess some scars and haltings may remain yet, after the war itself is ended. Methinks he should find everything both in Nature and Christianity more favourable for our present peace than for our third war, especially seeing all our former wars have ended very contrary to the expectation of those who were hottest to begin them. But I consider that passion is the last hold out of which we are beaten, of which the fuller men are, the less do they (through a great judgement on their spirits) perceive into what deformities they do transport them, it being the nature of all intoxications that their defects are better perceived by any than by those who are oppressed by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, pp. 36-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

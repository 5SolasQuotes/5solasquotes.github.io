<main class="wrap"><figure class="quote" id="q-68b3706ba6" data-kw="">
<blockquote><p>He that ruleth, with diligence.] Although I doubt not that there were many kinds of government in the Church, yet to confess the truth, this as I think may most aptly be understood of those which were called praesbiteri, that is, elders, not of these which had the charge of the word and of doctrine, but of those which were appointed as helpers to the pastors. They as men of the wiser sort &amp; endowed with a greater zeal and piety, were chosen out of the Laity. Their office was chiefly to see unto discipline, and to look what every man did, and in every house &amp; family to see what every man needed, either as touching the soul, or as touching the body.

For the Church had his elders, or if I may so speak, his senate, which as time required provided for all things mete and profitable. Paul describeth this kind of ministry not only in this place but also in the first to Timothy: For thus he writeth. The elders, are worthy of double honour, especially they which labour in the word &amp; in doctrine. In which words he seemeth to signify, there are some praesbiteri which teach and set forth the word of God: and there are others, which although they do not this, yet are they governors in the Church as elders.

This thing Ambrose left not untouched, when he expounded that place, yea he complaineth, that even them either thorough the pride, or thorough the slothfulness of the priests they were in a manner worn away. For whilst they which have the government of the Church seek to draw all things to themselves, they diligently as much as they can, labour that in that room should be joined no fellow officers with them. Wherefore Paul willeth, that they which have this charge, doo put to their diligence, and expel slothfulness and sluggishness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romanes wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Ep</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 418.</span></figcaption>

<blockquote><p>[18. You shall bind.] The Jesuits would fain the this key of excommunication unto the Bishop’s girdle alone: which is against the mind of our Saviour Christ, and circumstance of the place: but if they will say so, and speak so strangely, they must warrant it with some other places of scriptures, where the Church is taken for one, which is as much to say, one man is many, one member is as body, one alone is a company. And beside this strangeness of speech, it destroyeth the sovereignty of the medicine which our Saviour Christ prepared for such a festered soar, as would neither be healed by private admonition, neither with admonition before one or two witnesses.

For as the fault growth, so our Saviour Christ would have the number of those before whom he should be checked and rebuked, likewise grow. Therefore from a private admonition, he riseth unto the admonition before two or three: and from them to the Church; which if we should say, it is but one: then unto a dangerouser wound, should be laid an easier plaster. And therefore our Saviour doth not rise from two to one (for that were not to rise but to fall, nor to proceed, but go backward) but to many. But Paul is the best interpreter, who in a case of excommunication, declareth that the same is to be done in the presence, and with consent of the assembly, whereof the party which is to be excommunicated, is a member.

To conclude: Theophilact upon this place interpreteth, Tell the Church, that is Many. And because that assembly in the time of the Law, were of two sorts: for some had the handling of the word, othersome watching against the offences of the Church, did by common counsel with the ministers of the word, take order against the same. Those governing Elders are divers times in the story of the Gospel made mention of, under the title of the Rulers of the Synagogue. And this manner of government, because it was to be translated into the Church of Christ under the Gospel, our Saviour by the order (at that present) used amongst the Jews, declareth what after should be done in his Church.

Agreeably hereunto the Apostle both declared the Lord’s ordinance in this behalf, and put the same in practice in ordaining to every several Church, beside the Ministry of the word, certain of the chiefest men which should assist the work of the Lord’s building. This was also faithfully practised of the Churches, after the Apostles’ times, as long as they remained in any good and allowable soundness of the doctrine. And being fallen from the Churches, especially from certain of them, the want thereof is sharply and bitterly cast in the teeth of the Church teachers, by whose ambition that came to pass.

I conclude therefore, that to tell the Church, is not to tell the Bishop or Minister of the word only; but a company which hath oversight of the Church; by whom, or by whose mouth, which is the minister of the word, the rest of the body of the Church is to be advertised: to the end that the sword of excommunication cut not without their privity and consent. Whereupon it is evident, that the places of these Fathers, which give power to the Bishops to bind, and to loose: do not restrain it unto them, shutting out the rest of the Church, which might be shewed by many testimonies out of them, if the same were needful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Confutation of the Rhemists Translation, Glosses and Annotations on the New Testament</cite>, (Leiden, 1618), p. 90.</span></figcaption>

I conclude therefore, that to tell the Church, is not to tell the Bishop or Minister of the word only; but a company which hath oversight of the Church; by whom, or by whose mouth, which is the minister of the word, the rest of the body of the Church is to be advertised: to the end that the sword of excommunication cut not without their privity and consent. Whereupon it is evident, that the places of these Fathers, which give power to the Bishops to bind, and to loose: do not restrain it unto them, shutting out the rest of the Church, which might be shewed by many testimonies out of them, if the same were needful.”

+take+order+against+the+same.+Those+governing+Elders+are+divers+times+in+the+story+of+the+Gospel+made+mention+of%2C+under+the+title+of+the+Rulers+of+the+Synagogue.+And+this+manner+of+government%2C+because+it+was+to+be+translated+into+the+Church+of+Christ+under+the+Gospel%2C+our+Saviour+by+the+order+%28at+that+present%29+used+amongst+the+Jews%2C+declareth+what+after+should+be+done+in+his+Church.%0A%0AAgreeably+hereunto+the+Apostle+both+declared+the+Lord%E2%80%99s+ordinance+in+this+behalf%2C+and+put+the+same+in+practice+in+ordaining+to+every+several+Church%2C+beside+the+Ministry+of+the+word%2C+certain+of+the+chiefest+men+which+should+assist+the+work+of+the+Lord%E2%80%99s+building.+This+was+also+faithfully+practised+of+the+Churches%2C+after+the+Apostles%E2%80%99+times%2C+as+long+as+they+remained+in+any+good+and+allowable+soundness+of+the+doctrine.+And+being+fallen+from+the+Churches%2C+especially+from+certain+of+them%2C+the+want+thereof+is+sharply+and+bitterly+cast+in+the+teeth+of+the+Church+teachers%2C+by+whose+ambition+that+came+to+pass.%0A%0AI+conclude+therefore%2C+that+to+tell+the+Church%2C+is+not+to+tell+the+Bishop+or+Minister+of+the+word+only%3B+but+a+company+which+hath+oversight+of+the+Church%3B+by+whom%2C+or+by+whose+mouth%2C+which+is+the+minister+of+the+word%2C+the+rest+of+the+body+of+the+Church+is+to+be+advertised%3A+to+the+end+that+the+sword+of+excommunication+cut+not+without+their+privity+and+consent.+Whereupon+it+is+evident%2C+that+the+places+of+these+Fathers%2C+which+give+power+to+the+Bishops+to+bind%2C+and+to+loose%3A+do+not+restrain+it+unto+them%2C+shutting+out+the+rest+of+the+Church%2C+which+might+be+shewed+by+many+testimonies+out+of+them%2C+if+the+same+were+needful.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+Confutation+of+the+Rhemists+Translation%2C+Glosses+and+Annotations+on+the+New+Testament%2C+%28Leiden%2C+1618%29%2C+p.+90.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb33f1dd2a9.html&amp;via=5Solas" target="_blank" rel="noopener">Shar

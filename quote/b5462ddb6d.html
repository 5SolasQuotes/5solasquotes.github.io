<main class="wrap"><figure class="quote" id="q-b5462ddb6d" data-kw="">
<blockquote><p>But the truth is, the Law as pressed upon Israel was not a Covenant of Works. 1. The Law as the Law or as a Covenant of Works is made with perfect men who need no mercy; But this Covenant is made with sinners, with an express preface of mercy: I am the Lord thy God that brought thee out of the land of Egypt, etc. It is made with stiff-necked Israel, Deuteronomy 29; Deuteronomy 30-32, and that is called a Covenant from the end and object, as motions are denominate from their end: for the end of the Lord’s pressing the Law upon them was to bring them under a blessed necessity to seek salvation in their true City of Refuge Christ Jesus, who redeemed them out of the spiritual bondage of sin.

2. It was the Covenant made with Abraham, which was a Covenant of Grace: and though it be called, Deuteronomy 29:1, a Covenant beside that which was made in Horeb: Because 1) Renewed again after their breach. 2) Repeated a little before the death of Moses, Deuteronomy 31:28-30. 3. Because there were some additions of special blessings, cursings, Ceremonial Commands, that were not in the formerly proposed Covenant, Exodus 20, yet the same it was in substance, to love the Lord with all the heart, Deuteronomy 2:10, 12-14. The same with that of Abraham, Deuteronomy 8:18. That he may establish his Covenant, which he sware unto thy fathers, as it is this day. When he is to deliver them out of Egypt, Exodus 2:24. And God heard their groaning, and remembered his covenant with Abraham and Isaac and Jacob. So the Lord expounds it in his appearing to Moses, Exodus 3:6; Jeremiah 31; 32. Not according to the Covenant which I made with their fathers, in the day that I took them by the hand, to bring them out of the Land of Egypt. Now that was the Covenant which God made with Abraham, of which circumcision was a seal, Genesis 17, not of a temporary Canaan only, but of heart Circumcision, Colossians 2:11. For the Lord expressly tells them, when he took them by the hand as his married people, to bring them out of the Land of Egypt, and out of the house of bondage, Exodus 20.

He meant no other covenant then he made with Abraham, of believing, Genesis 15, and of walking before him and being perfect, Genesis 17:1, 2, which is somewhat more legal, as Moses, and the Lord himself expounds it, Exodus 2:24; Exodus 3:6; Exodus 20:1-2. And he shows them, Leviticus 26, if in their enemy’s land they repent and shall come out and meet the rod, and their uncircumcised hearts shall willingly accept of the punishment of their iniquity: Leviticus 26:42. Then (saith the Lord) I will remember, Beside there are not here three Covenants, but one, there is no word of the subservient Covenant with Israel in Sinai. Except that when he mentions the one, he excludes not the other. For to walk before the Lord required in Abraham’s Covenant, Genesis 17:1, is to walk in all the ways of the Lord, to fear and love him, (Deuteronomy 10:12, 13) and Samuel (1 Samuel 12:22), Joshua (Joshua 24:22-25). And Mary (Luke 1:55) and Zachariah (Luke 1:70, 72-73) refer to the Covenant made with Abraham to give Canaan to his seed, verse 10, Deuteronomy 7:12. If thou hearken to these judgments to do them, it shall come to pass that the Lord thy God will keep unto thee the Covenant of mercy that he sware unto thy fathers, etc.</p></blockquote>

<blockquote><p>2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are given, however, doubly when the covenant is received. In the first place, by the substance of the covenant itself or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first sense (learned from Jeremiah in the place already cited), which substance also is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1).</p></blockquote>

<blockquote><p>3. I reply: In us can be distinguished a double act of will, namely to will and to will-not, and each is a positive act; and if they be about the same object, they are contrary acts – which also are expressed by different words, which are ‘to love’ and ‘to hate’.

4. And both [of these] in us can be distinguished, so that to will is distinguished into efficacious and remiss: so that ‘efficacious willing’ is called that whereby to the will is not only the being of what is willed pleasing but, if it can at once put what is willed into being, it at once does; so too ‘efficacious willing-not’ is called that whereby not only does he who wills-not impede something but, if he can, he altogether destroys it. ‘Remiss will’ is that by which a willed thing so pleases that yet the will does not put it into being, although it can put it into being; ‘remiss willing-not’ is that whereby the thing willed-not thus displeases that it [the will] not prevent it from being, although it could.

5. In us, therefore, weak [or remiss] willing-not – properly speaking – seems to be the permission of something bad that I know: for I am not said to permit that about which I know nothing, or that which is so done by another that it pleases me – but that which I know is wrongly done by another but do not prevent, this I permit.

6. A sign of efficacious willing, if it be done immediately by the will, is fulfilment; if through another, it is precept; and of weak [remiss] willing in us, perhaps counsel is a sign, or persuasion or warning. And a sign of weak [remiss] willing-not is permission or dissuasion; and a sign of efficacious willing-not is prohibition.

7. But this distinction could be posited in God, so that as one act of his is willing and willing-not (and this without contrariety or dissimilarity in the act in itself), so over certain objects of his willed would be put ‘efficacious willing’, and similarly his willing-not over certain objects: willed-not ‘efficacious’, and over certain, not [efficaciously, or remissly]. And then could God’s willing-not be called weak with respect to those objects which he so wills-not that he wills-not to prohibit them; and this willing-not of God can be called his permission – and so the act in God, insofar as it passes over the object, thus disposes itself to the divine will.

8. But if this [n. 7] does not please (to the extent the willing-not of anything posited in being would seem to be with some sadness and with some imperfection of the volition and will), then it can be said that permission outwardly, or the sign, is that an effect be, which [sign] however is against the divine precept – and this is the permission that is a sign of the divine will; but to this does not correspond anything in the divine will save the not-willing to prohibit something being done, or the not willing-not, which is a negation of a divine positive act and consequently is not a positive [act].

9. And that he is called ‘willing to allow’, this can be meant, not that he has a direct willing about what he permits, but a reflex act; for he offers to his will that this man will sin or is sinning, and first his will does not have a ‘to will’ about this man (for he cannot will him to have sin); secondly he can understand his will not to be willing this, and then he can will his will ‘not to will this’, – and so he is called willing to allow and to allow willingly; willing to permit and to permit willingly. Just as on the other side, with Judas presented to him: first God has a not willing him glory, and not first a willing-not (according to the final position in Ord. I, d. 41, n. 45); and he can then secondly reflect on this negation of act and will it – and so willing (or willingly) he does not choose Judas going to sin finally and a willing-not of glory, but a non-willing of glory.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. I reply: In us can be distinguished a double act of will, namely to will and to will-not, and each is a positive act; and if they be about the same object, they are contrary acts – which also are expressed by different words, which are ‘to love’ and ‘to hate’.

4. And both [of these] in us can be distinguished, so that to will is distinguished into efficacious and remiss: so that ‘efficacious willing’ is called that whereby to the will is not only the being of what is willed pleasing but, if it can at once put what is willed into being, it at once does; so too ‘efficacious willing-not’ is called that whereby not only does he who wills-not impede something but, if he can, he altogether destroys it. ‘Remiss will’ is that by which a willed thing so pleases that yet the will does not put it into being, although it can put it into being; ‘remiss willing-not’ is that whereby the thing willed-not thus displeases that it [the will] not prevent it from being, although it could.

5. In us, therefore, weak [or remiss] willing-not – properly speaking – seems to be the permission of something bad that I know: for I am not said to permit that about which I know nothing, or that which is so done by another that it pleases me – but that which I know is wrongly done by another but do not prevent, this I permit.

6. A sign of efficacious willing, if it be done immediately by the will, is fulfilment; if through another, it is precept; and of weak [remiss] willing in us, perhaps counsel is a sign, or persuasion or warning. And a sign of weak [remiss] willing-not is permission or dissuasion; and a sign of efficacious willing-not is prohibition.

7. But this distinction could be posited in God, so that as one act of his is willing and willing-not (and this without contrariety or dissimilarity in the act in itself), so over certain objects of his willed would be put ‘efficacious willing’, and similarly his willing-not over certain objects: willed-not ‘efficacious’, and over certain, not [efficaciously, or remissly]. And then could God’s willing-not be called weak with respect to those objects which he so wills-not that he wills-not to prohibit them; and this willing-not of God can be called his permission – and so the act in God, insofar as it passes over the object, thus disposes itself to the divine will.

8. But if this [n. 7] does not please (to the extent the willing-not of anything posited in being would seem to be with some sadness and with some imperfection of the volition and will), then it can be said that permission outwardly, or the sign, is that an effect be, which [sign] however is against the divine precept – and this is the permission that is a sign of the divine will; but to this does not correspond anything in the divine will save the not-willing to prohibit something being done, or the not willing-not, which is a negation of a divine positive act and consequently is not a positive [act].

9. And that he is called ‘willing to allow’, this can be meant, not that he has a direct willing about what he permits, but a reflex act; for he offers to his will that this man will sin or is sinning, and first his will does not have a ‘to will’ about this man (for he cannot will him to have sin); secondly he can understand his will not to be willing this, and then he can will his will ‘not to will this’, – and so he is called willing to allow and to allow willingly; willing to permit and to permit willingly. Just as on the other side, with Judas presented to him: first God has a not willing him glory, and not first a willing-not (according to the final position in Ord. I, d. 41, n. 45); and he can then secondly reflect on this negation of act and will it – and so willing (or willingly) he does not choose Judas going to sin finally and a willing-not of glory, but a non-willing of glory.”

— John Duns Scotus, Ordinatio, tr. Peter Simpson (2013 / 2023), bk. 1, dist. 26-48, 47. Whether divine permission is some act of the divine will?, pp. 198-99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+I+reply%3A+In+us+can+be+distinguished+a+double+act+of+will%2C+namely+to+will+and+to+will-not%2C+and+each+is+a+positive+act%3B+and+if+they+be+about+the+same+object%2C+they+are+contrary+acts+%E2%80%93+which+also+are+expressed+by+different+words%2C+which+are+%E2%80%98to+love%E2%80%99+and+%E2%80%98to+hate%E2%80%99.+4.+And+both+%5Bof+these%5D+in+us+can+be+distinguished%2C+so+that+to+will+is+distinguished+into+efficacious+and+remiss%3A+so+that+%E2%80%98efficacious+willing%E2%80%99+is+called+that+whereby+to+the+will+is+not+only+the+being+of+what+is+willed+pleasing+but%2C+if+it+can+at+once+put+what+is+willed+into+being%2C+it+at+once+does%3B+so+too+%E2%80%98efficacious+willing-not%E2%80%99+is+called+that+whereby+not+only+does+he+who+wills-not+impede+something+but%2C+if+he+can%2C+he+altogether+destroys+it.+%E2%80%98Remiss+will%E2%80%99+is+that+by+which+a+willed+thing+so+pleases+that+yet+the+will+does+not+put+it+into+being%2C+although+it+can+put+it+into+being%3B+%E2%80%98remiss+willing-not%E2%80%99+is+that+whereby+the+thing+willed-not+thus+displeases+that+it+%5Bthe+will%5D+not+prevent+it+from+being%2C+although+it+could.+5.+In+us%2C+therefore%2C+weak+%5Bor+remiss%5D+willing-not+%E2%80%93+properly+speaking+%E2%80%93+seems+to+be+the+permission+of+something+bad+that+I+know%3A+for+I+am+not+said+to+permit+that+about+which+I+know+nothing%2C+or+that+which+is+so+done+by+another+that+it+pleases+me+%E2%80%93+but+that+which+I+know+is+wrongly+done+by+another+but+do+not+prevent%2C+this+I+permit.+6.+A+sign+of+efficacious+willing%2C+if+it+be+done+immediately+by+the+will%2C+is+fulfilment%3B+if+through+another%2C+it+is+precept%3B+and+of+weak+%5Bremiss%5D+willing+in+us%2C+perhaps+counsel+is+a+sign%2C+or+persuasion+or+warning.+And+a+sign+of+weak+%5Bremiss%5D+willing-not+is+permission+or+dissuasion%3B+and+a+sign+of+efficacious+willing-not+is+prohibition.+7.+But+this+distinction+could+be+posited+in+God%2C+so+that+as+one+act+of+his+is+willing+and+willing-not+%28and+this+without+contrariety+or+dissimilarity+in+the+act+in+itself%29%2C+so+over+certain+objects+of+his+willed+would+be+put+%E2%80%98efficacious+willing%E2%80%99%2C+and+similarly+his+willing-not+over+certain+objects%3A+willed-not+%E2%80%98efficacious%E2%80%99%2C+and+over+certain%2C+not+%5Befficaciously%2C+or+remissly%5D.+And+then+could+God%E2%80%99s+willing-not+be+called+weak+with+respect+to+those+objects+which+he+so+wills-not+that+he+wills-not+to+prohibit+them%3B+and+this+willing-not+of+God+can+be+called+his+permission+%E2%80%93+and+so+the+act+in+God%2C+insofar+as+it+passes+over+the+object%2C+thus+disposes+itself+to+the+divine+will.+8.+But+if+this+%5Bn.+7%5D+does+not+please+%28to+the+extent+the+willing-not+of+anything+posited+in+being+would+seem+to+be+with+some+sadness+and+with+some+imperfection+of+the+volition+and+will%29%2C+then+it+can+be+said+that+permission+outwardly%2C+or+the+sign%2C+is+that+an+effect+be%2C+which+%5Bsign%5D+however+is+against+the+divine+precept+%E2%80%93+and+this+is+the+permission+that+is+a+sign+of+the+divine+will%3B+but+to+this+does+not+correspond+anything+in+the+divine+will+save+the+not-willing+to+prohibit+something+being+done%2C+or+the+not+willing-not%2C+which+is+a+negation+of+a+divine+positive+act+and+consequently+is+not+a+positive+%5Bact%5D.+9.+And+that+he+is+called+%E2%80%98willing+to+allow%E2%80%99%2C+this+can+be+meant%2C+not+that+he+has+a+direct+willing+about+what+he+permits%2C+but+a+reflex+act%3B+for+he+offers+to+his+will+that+this+man+will+sin+or+is+sinning%2C+and+first+his+will+does+not+have+a+%E2%80%98to+will%E2%80%99+about+this+man+%28for+he+cannot+will+him+to+have+sin%29%3B+secondly+he+can+understand+his+will+not+to+be+willing+this%2C+and+then+he+can+will+his+will+%E2%80%98not+to+will+this%E2%80%99%2C+%E2%80%93+and+so+he+is+called+willing+to+allow+and+to+allow+willingly%3B+willing+to+permit+and+to+permit+willingly.+Just+as+on+the+other+side%2C+with+Judas+presented+to+him%3A+first+God+has+a+not+willing+him+glory%2C+and+not+first+a+willing-not+%28according+to+the+final+position+in+Ord.+I%2C+d.+41%2C+n.+45%29%3B+and+he+can+then+secondly+reflect+on+this+negation+of+act+and+will+it+%E2%80%93+and+so+willing+%28or+willingly%29+he+does+not+choose+Judas+going+to+sin+finally+and+a+willing-not+of+glory%2C+but+a+non-willing+of+glory.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+Ordinatio%2C+tr.+Peter+Simpson+%282013+%2F+2023%29%2C+bk.+1%2C+dist.+26-48%2C+47.+Whether+divine+permission+is+some+act+of+the+divine+will%3F%2C+pp.+198-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F917c1a7623.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/917c1a7623.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/how-did-the-first-human-sin-happen/#:~:text=3.%20I%20reply%3A%20In%20us%20can,glory%2C%20but%20a%20non%2Dwilling%20of%20glory&amp;text=3.%20I%20reply%3A%20In%20us%20can%20be%20distinguished&amp;text=willing%2Dnot%20of%20glory%2C%20but%20a%20non%2Dwilling%20of%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a54315bb33" data-kw="">
<blockquote><p>…gifts give not the keys, nor authority to use gifts; and so that all believers, though gifted and graced also, have not power of the keys. 2. It’s certain that in a constituted Church there be no hands nor mouths to do and speak by authority, and ex officio, by virtue of an office, save only elders and pastors; and that if they do or speak, they do it extraordinarily, when Churches’ hands are lame and her eyes blind; or if they do and speak ordinarily, it is from the law of charity in a private way, not by power of the keys, and as judges and officers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d0de7ca7d1" data-kw="">
<blockquote><p>But it is further objected by Sutlivius that this could not be such a Presbytery as is among us, because ordination and imposition of hands pertain to none but the ministers of the Word. Answer 1. The children of Israel laid their hands upon the Levites (Num. 8:10), and we would know his reason why he denies the like power to ruling elders now, especially since this imposition of hands is but a gesture of one praying, and a moral sign declaring the person prayed for. 2. Howsoever our practice (which is also approved by good divines, Junius, Cont. 5, book 1, ch. 3; Synopsis Pur. Theol., Disputation 42, Thesis 37) is to put a difference betwixt the act of ordination and the external right thereof, which is imposition of hands, ascribing the former to the whole Presbytery both pastors and elders, and reserving the latter to the ministers of the Word, yet to be done in the name of all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), pt. 2, ch. 3, p. 132</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“But it is further objected by Sutlivius that this could not be such a Presbytery as is among us, because ordination and imposition of hands pertain to none but the ministers of the Word. Answer 1. The children of Israel laid their hands upon the Levites (Num. 8:10), and we would know his reason why he denies the like power to ruling elders now, especially since this imposition of hands is but a gesture of one praying, and a moral sign declaring the person prayed for. 2. Howsoever our practice (which is also approved by good divines, Junius, Cont. 5, book 1, ch. 3; Synopsis Pur. Theol., Disputation 42, Thesis 37) is to put a difference betwixt the act of ordination and the external right thereof, which is imposition of hands, ascribing the former to the whole Presbytery both pastors and elders, and reserving the latter to the ministers of the Word, yet to be done in the name of all.”

</figure><figure class="quote" id="q-327cd3c630" data-kw="">

</figure><figure class="quote" id="q-a190a878ae" data-kw="">
<blockquote><p>And though women be forbidden authoritatively to teach in the Church, 1 Tim. 2:7; 1 Cor. 14, and publicly, yet they may teach the younger women, Tit. 2:2-3, give a seasonable rebuke and counsel to men, 2 Sam. 20:16-17; 1 Sam 25:23-24, 32-33, and a woman, a sister is to labor to gain a sister, by Mt. 18, and that in a Church-way; and women, as other Church-members, are to teach, exhort, warn, according to their place, as well as men, Col. 3:16; Rom. 15:14; 1 Thess. 5:14; Heb. 3:13 &amp; 20, 25.</p></blockquote>

<blockquote><p>2. What is essential for making a minister who is extraordinarily called of God, is not ever more essential to the making of a minister ordinarily called of God, in an island where the Gospel is: if all the pastors should die, the people might choose pastors to themselves, but they could not then make pastors; God only, without the ministry of other pastors, in that case should make pastors; but it follows not hence that pastors ordinarily have not their calling to be pastors from the ordination of pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), pp. 266-67</span></figcaption>

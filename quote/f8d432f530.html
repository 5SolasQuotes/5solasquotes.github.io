<main class="wrap"><figure class="quote" id="q-f8d432f530" data-kw="">
<blockquote><p>What the Moral Law is, I will describe in three points: First, it is that part of God’s Word concerning righteousness and godliness, which was written in Adam’s mind by the gift of creation; and the remnants of it be in every man by the light of nature: in regard whereof it binds all men. Secondly, it commands perfect obedience, both inward in thought and affection; and outward in speech and action. Thirdly, it binds to the curse and punishment, every one that fails in the least duty thereof, though but once, and that in thought only: Gal. 3:10 Cursed is everyone that continues not in all things that are written in the Law, to do them. The sum of the Moral Law is propounded in the Decalogue, or Ten Commandments, which many can repeat, but few do understand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon on the Mount</cite>, (London, 1631), p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>The Reformed on the contrary state that all concupiscence, which certainly inclines toward evil, is sin, insofar as (1) all such concupiscence is against the law (Rom. 7:7) and thus is lawlessness, in which sin fully consists (1 John 3:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, 4.2.28</span></figcaption>

— Petrus van Mastricht, Theoretical Practical Theology, 4.2.28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformed+on+the+contrary+state+that+all+concupiscence%2C+which+certainly+inclines+toward+evil%2C+is+sin%2C+insofar+as+%281%29+all+such+concupiscence+is+against+the+law+%28Rom.+7%3A7%29+and+thus+is+lawlessness%2C+in+which+sin+fully+consists+%281+John+3%3A4%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology%2C+4.2.28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31ad792516.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/31ad792516.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c0ea707ae3" data-kw="">
<blockquote><p>There is no duty imposed upon the Israelite in the Ten Commandments, which is not equally incumbent upon all men, everywhere. These commandments are but the positive publication to Israel, of the universal human duties, the common morality of mankind. It was not merely natural but inevitable that in this positive proclamation of universal human duties to a particular people, a special form should be given their enunciation specifically adapting them to this particular people in its peculiar circumstances; and it was eminently desirable that they should be so phrased and so commended as to open a ready approach for them to this particular people’s mind and to bring them to bear with especial force upon its heart.

This element of particularity embedded in the mode of their proclamation, however, has no tendency to void these commandments of their intrinsic and universal obligation. It only clothes them with an additional appeal to those to whom this particular proclamation of them is immediately addressed. It is not less the duty of all men to do no murder, not to commit adultery, not to steal, not to bear false witness, not to covet a neighbour’s possession, that the Israelite too is commanded not to do these things, and is urged to withhold himself from them by the moving plea that he owes a peculiar obedience to a God who has dealt with him with distinguishing grace.

And it is not less the duty of all men to worship none but the one true God, and Him only with spiritual worship; not to profane His name nor to withhold from Him the time necessary for His service, or refuse to reverence Him in his representatives, that these duties are impressed especially on the heart of the Israelite by the great plea that this God has shown Himself in a peculiar manner his God. The presence of the Sabbath commandment in the midst of this series of fundamental human duties, singled out to form the compact core of the positive morality divinely required of God’s peculiar people, is rather its commendation to all peoples of all times as an essential element in primary human good conduct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Foundations of the Sabbath in the Word of God in Duncan J. McMillan, et al</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-e635632681" data-kw="">
<blockquote><p>Q. What does the LORD require in the first commandment? A. That for the sake of my very salvation I avoid and flee all idolatry, witchcraft, superstition, and prayer to saints or to other creatures. Further, that I rightly come to know the only true God, trust in him alone, submit to him with all humility and patience, expect all good from him only, and love, fear, and honour him with all my heart. In short, that I forsake all creatures rather than do the least thing against his will.</p></blockquote>

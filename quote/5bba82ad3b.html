<main class="wrap"><figure class="quote" id="q-5bba82ad3b" data-kw="">
<blockquote><p>But in some places “the cross” also indicates the doctrine that Christ died for sinners on the cross – the atonement that He made for sinners by His suffering for them on the cross, the complete and perfect sacrifice for sin that He offered when He gave His own body to be crucified. In short, this one word, the cross, stands for Christ crucified, the only Savior. This is the meaning in which Paul used the expression when he told the Corinthians the word of the cross is foolishness to those that perish (1 Corinthians 1:18). This is the meaning in which he wrote to the Galatians, God forbid that I should glory, save in the cross. He simply meant, “I glory in nothing but Christ crucified as the salvation of my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross: Crucified with Christ, and Christ Alive in Me</cite>, (Abbotsford, Wisconsin: Aneko Press, 2019), 12–13, Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Reply to Objection 4: Although the drop of blood that bled in the circumcision would be sufficient for every satisfaction, considering the condition of the divine person, nevertheless it would not be sufficient relative to the kind of penalty. For the human race was obligated to death, for which it was necessary that a death be paid. … Reply to Objection 6: The other penalties that Christ endured, although they were sufficient to make satisfaction on behalf of human nature, considering the condition of the one suffering, nonetheless this is not the case when considering the kind of penalty. For all other penalties were not contained in those penalties, as they were in the suffering of death.</p></blockquote>

</figure><figure class="quote" id="q-926982d7c8" data-kw="">
<blockquote><p>‘Christ died for all sufficiently, for the elect alone efficiently: that is, He indeed satisfied for all, but only the elect apply His satisfaction to themselves.’ Response: We have said above that the death of Christ is in itself sufficient for the redemption of all, yet destined only for the elect. But that He died sufficiently for all, and efficiently for the elect, can in no way be said:

I. Because the division of efficiency and sufficiency implies a contradiction with the thing divided. For if He died for all, it follows that He willed by His death to expiate the sins of all, and to obtain their remission. For this the particle for (pro) requires, indicating the end, as does the very phrase. But if He willed to expiate, then certainly He also actually expiated. The reason is that whatever He ever willed to effect, He brought to effect; whether as the omnipotent God, or as the faithful servant of the Father, whom the Father always heard. If He actually expiated the sins of all individuals, therefore He died efficiently for all and each individual; which nevertheless this distinction denies.

II. A distinction that removes theological principles is faulty. The distinction of sufficiency and efficiency removes theological principles. The reason is that it separates those things which God has joined in the covenant Jer. 31:33–34. For those whose Savior Christ is, He is their Savior both by merit and by efficacy together, not by one only. Therefore.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Logical &amp; Theological Exegesis of the Augsburg Confession</cite>, (Amsterdam: Janssonius, 1647), Syllabus of Controversies with Lutherans, Controversy 4, on Predestination, Question 3, 4. ‘Whether for All &amp; Every Person Christ Died’, p. 237 trans. AI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative</cite>, A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) | Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58-102</span></figcaption>

</figure><figure class="quote" id="q-dd1fec55c9" data-kw="">
<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Predestination &amp; Justification</cite>, tr. Frank A. James (Kirksville, Missouri: Sixteenth Century Essays &amp; Studies, 2003), vol. 8, p. 62</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7468f88d0b" data-kw="">
<blockquote><p>But what then is the part of the Prince after that the Church has given judgement? Surely, whensoever need is, he ought by the private judgement of Christian discretion to try and examine whether this [ecclesiastical] discipline be rightly executed or not. If he find the execution thereof to be unreproveable and that yet the sinner goes on in his contumacy, then by his civil power he ought further to punish him in his person, or wordly estate, that he may either reform or repress such a one as has not been terrified by the Church’s censures (Calvin, Book of Epistles, col. 169; Gratian., Caus. 11, q. 1, ch. 20). But if after trial, he understand that the sentence given forth is unjust and erroneous, either through the ignorance or the malice of the ecclesiastical and regular judges, then he ought to interpone his authority, and cause a due proceeding [in ecclesiastical courts], for in such extraordinary cases of the failing of ecclesiastical persons, Princes may do much in things and causes Spiritual which ordinarily they cannot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, bk. 8, Digression 4, pp. 192-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>16. All persons living in the Province who confess and acknowledge the one Almighty and Eternal God, and holds themselves obliged in conscience to live peaceably and quietly in a civil society, shall in no way be molested or prejudged for their religious persuasions and exercise in matters of faith and worship… Yet it is also hereby provided, that no man shall be admitted a member of the great or common Council, or any other place of public trust, who shall not [sic] profaith in in Christ Jesus, and solemnly declare that he does no ways hold himself obliged in conscience to endeavor alteration in the government… Nor by this article is it intended, that any under the notion of this liberty shall allow themselves to avow atheism, irreligiousness, or to practice cursing, swearing, drunkenness, prophaneness, whoring, adultery, murdering or any kind of violence… … 20. That all marriages nor forbidden in the law of God, shall be esteemed lawful…</p></blockquote>

s Online</a></div>
</figure><figure class="quote" id="q-3a5a622bb0" data-kw="">
<blockquote><p>1. We do not question the duty of obeying the king and all his officers, governing as magistrates by the power of the swords which the king may commit to them. If bishops or lay-chancellors be made magistrates, we will obey them as such: And therefore when they summon us, we appear and answer, because the king authorizes them. And many non-conformists have defended the taking the promise [of canonical obedience to a bishop or ordinary in things lawful and honest] as supposing that the word ‘ordinary’ signifies only the judge of a court set up by the king as supreme governor by the sword in matters and over persons ecclesiastical as well as civil, according to the true sense of the Oath of Supremacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689) The preface is dated 1683., ch. 6, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

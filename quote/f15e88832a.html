<main class="wrap"><figure class="quote" id="q-f15e88832a" data-kw="">
<blockquote><p>Faith therefore justifies because it is an instrument to apprehend and apply that which justifies, namely, Christ and His obedience. As the Israelites stung of fiery serpents were cured, so are we saved (John 3:14). The Israelites did nothing at all, but only look upon the brazen serpent; so are we to do nothing for our justification and salvation, but to fix the eye of our faith on Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:122.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-0d7f8eb7ed" data-kw="">
<blockquote><p>One reason, therefore, why the Lord displayed the law as a covenant of works* on Sinai was that self-righteous Israelites and all pharisaic professors to the end of time might see that as they have sinned and so have not performed perfect obedience, it is absolutely impossible for them to attain justification and eternal life on the footing of their own works (Rom. 3:20). The law was there displayed in its covenant form in order to discover sin and condemn for it and so to stir up secure sinners to inquire after the perfect fulfillment of it by the second Adam (Deut. 27:26), for until self-righteousness is overthrown, a man will never submit to the righteousness of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-08f2c04b0b" data-kw="">
<blockquote><p>But I fear the sense of this [said by antinomians], that ‘Christ repents for us, and obeys for us, He being the end of the Law to overy one that believes,’ be far otherwise, to wit, that Christ’s obedience of the Law, He being the end of the Law, as also his passive obedience is ours. If this be the intended sense, then: [1.] All our sanctification is nothing but the sanctification and holy active obedience of Christ. I yield this to be a broad, a fair and easy way to heaven. Christ does all for us [according to antinomians:], Christ weeped for my sins, and that is all the repentance required in me, if I believe that Christ was mortified and dead to the world for me, that is my mortification; and if I believe that the change of the whole man was truly in Christ, this is my true holiness: then my walking in holiness cannot be rewarded with life eternal, nor have any influence as a way or means leading to the kingdom. 2. Christ’s active obedience imputed to the sinner can be no evidence of justification, because it is in Christ, not in me; any evidence or mark of justification must be inherent in the believer, not in Christ. 3. And one and the same thing cannot be a mark and a sign of itself. Now the active obedience of Christ imputed to the sinner is holden [by antinomians] to be a part of justification [and therefore it cannot be a sign of justification].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 79</span></figcaption>

nline.com/the-active-obedience-of-christ#:~:text=But%20I%20fear%20the%20sense%20of,cannot%20be%20a%20sign%20of%20justification&amp;text=But%20I%20fear%20the%20sense%20of%20this%20%5Bsaid&amp;text=therefore%20it%20cannot%20be%20a%20sign%20of%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5ba43f5615" data-kw="">
<blockquote><p>I answer, not only in the beginning of our conversion, but also in the continuance and final accomplishment thereof. For here Paul desires in the day of judgment to stand before God only by the justice of faith without his own justice of the law. And Paul brings in Abraham (as I have noted before) in the very midst of godly conversation and holy obedience to be justified without any works by his faith in the Messiah [Rom. 4:2–3]. And Paul avouches three things of faith: (1) by it ‘we have access’ to the grace of God; (2) by it we ‘stand in the same grace’; (3) by it ‘we rejoice under the hope of glory’ [Rom. 5:2]. Thus then, we see there is only one way of justification, namely that we are justified and accepted of God to life eternal through grace alone by faith alone for Christ alone in the beginning, middle, and end of our conversion. And here is plainly discovered the error of the Church of Rome. It makes a double justification: the first [is] whereby the sinner is made of an evil man a just man, and this (they say) is by faith alone; [and] the second is whereby a man of a just man is made more just, and this (they say) is by faith and works together. But [they speak] falsely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, 9:65–66.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

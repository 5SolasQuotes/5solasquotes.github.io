<main class="wrap"><figure class="quote" id="q-0201af1316" data-kw="">
<blockquote><p>That however your judgment stand in the matter contraverted (for we are to impose upon nobody’s judgment, but to leave everyone to their own light), yet ye who are… fomenters of the division, consider, though ye be but few, yet the stir ye make is great, and one man will easily raise more fire than twenty will be able to extinguish. Therefore be exhorted in the fear of God to carry the difference more soberly. Are your brethren willing to let you enjoy your judgments and serve your light in your own practice? and to live in peace with you, notwithstanding the difference? And as to things wherein ye and they are agreed to join with you therein, till God in his time clear up the mistake that is betwixt you, and show upon whose side it is? and will not ye be content unless ye impose your apprehensions upon them and have them conform unto, and lackey after your opinion and practice? must your judgment be the standard and canon to everybody else? and all be anathematized that differ in the least from you? Can there be no peace with you unless ye have leave to trail them at your heels? will ye agree with none that are not of your mind in everything? then Actum est de pace, peace is gone foever on this side of time; for, Non datur intellectus Averroisticus, men’s minds to jump to an ace in all things is hardly to be expected. While we know only in part, will there not be perpetually different measures of light? and diversity of apprehensions in many things? Theology has its own problems, even in greater points than this, which calls for sobriety and mutual tolerance. As we are not for skepticism, nor sinful syncritisms, so we tremble at the vanity of dogmatizing in things of this nature. But whatever ye deem it, treat not your brethren indiscreetly. Speak or write to them, rather than of them. Argue the case with them, convince them if ye can, Lk. 19:17, but usurp not a magistery over them; presume not to be dictators to them more, than ye would take it well they should impose on you, Jam. 3:1. Remember they must serve their own consciences, and be guided by their own light, and not yours, Rom. 14:12. Ye think them wrong, so do they, no doubt, you: But how would ye take it if they served you as ye do them, with outrageous out-cries, virulent epistles and Philippic declamations? What if they did preach against you, your divisive principles and unbrotherly practices, as Erroneous and Donatistical (if not worse), as ye call theirs Erastian? What a pitiful taking would ye and they be in by such Contradictions and invectives? Do therefore no otherwise than ye would be done unto, Mt. 7:12. Think ye are but men fallible, and may be mistaken in not a few of your confident notions; and that it is possible they may have as much of the mind of Christ as you. Therefore reverence their judgments, so far at least as not lightly to trample upon the same: Or, if ye were sure they were in the wrong, yet think, surely they mind honestly (as they judge ye do) and have not wickedly departed from the Lord, Ps. 18:21. If they be stepped aside, it is but for want [lack] of light, which ye (who think ye see more) should pity and bemoan to God, and labor to discover their mistake unto them (for as yet ye cannot charge them with contumacy, sufficient conviction never being yet held forth unto them). But, O! reproach them not; rate them not behind their backs; go not to preach them down, nor out of the hearts of honest people, much less to preach their own people from them! What service were that to Christ, or his Kingdom? or what edification unto people? Sure ye do more hurt than ye are aware of by this course, staggering and unsettling people, weakening your honest brethren’s hands in the Gospel, and marring the success of their labors what ye can. See Jam. 3:16; Gal. 5:14-15. But what? are not ye and they agreed in chiefest principles and theses? What’s your difference then but about the application of principles to some hypotheses or particular cases and practices? The intricacy whereof, with the sense of your short-sightedness, may teach you to think, speak and act more soberly and with all due respect to them that differ from you. O fall not into a stated schism upon so small and disputable a matter! nor lift up yourselves in conceit above your fellows! Are ye preachers of Christ? so are they: Have ye the seal of your labors, so have they; and that they have not more is perhaps through your fault, your contending with them, thereby confounding and distracting their people and taking them off their souls’ ease, by your perplexing controversies and exceptions against their ministers. And if ye continue by this contending to discourage your brethren and enervate the work of God in their hands, fear lest ye be found guilty of destroying so much of the Kingdom of Jesus Christ, [be] and countable for the blood of these souls whose edification ye mar, by abusing and amusing them with your bartering at their ministers and bringing them and their preaching into disesteem, so far as ye can, as Zech. 13:7, ‘Smite the shepherd, and the sheep shall be scattered.’ And what have ye gained when this is done? What advantage is it to the Gospel, to break so many faithful men’s ministry? And what peace will it yield you when accomplished? Bella geri placuit, nullos habitura triumphos. It were but a Cadmean victory. What! may still the old question be put unto you: Does your piety and zeal lie all in negatives? (as theirs in Col. 2:21) Are ye only skillful to destroy? and bold to treat the friends of Christ like foes? Preach the Gospel and propagate real godliness as much as ye can: but O! beware of hurting the Lord’s work and vineyard in your brethren’s hands! Will it not be but a poor vassalage to preach down your brethren, while ye should preach up Christ? and to propagate your private opinions more than the power of piety? or to draw disciples after you more than after Christ? Were it not better make one real Christian than proselyte twenty to your side and party? Ye complain of your brethren’s want [lack] of success, as Peninnah upbraided Hannah with her barrenness; but do not ye much mar their fruitfulness? O be tender of them, for the Gospel’s sake! Go, we pray you, convert the profane to piety rather than preach professors into faction and parties. Mind the great interest of the Gospel more than your particular debates or personal interests. Away with selfish designs under a spiritual mask! Beware of giving ground for that old complaint, Faciunt causam suam, causam publicam. Let not your excellent parts, fervor, zeal and spirits be spent upon so unprofitable a task as this of jangling, plunging, and confounding is. And tempt not people to any unhappy courses, which yourselves may repent of in the end, and come off with that inconsiderate warrior’s word in your mouth, Non putarum— It is easy to kindle a fire, but not so easy to set bounds unto it when and where ye list, saying, ‘Hitherto shalt thou come, but no further.’ Nay, once kindled, it may rage whither soever the winds and aptness of the matter to take with it may carry it, till all be burned down to ashes. And finally, let not your brethren have cause to take up that sad regrate of the psalmists, Ps. 55:12-14, ‘Had it been an enemy,’ etc. How bitter is this? Were it rampant Romanists, or inimical Prelatists, or foul mouthed sectaries who thus battered at honest ministers, it were more tolerable? But to see brethren at such odds, tearing the flesh (as it were) off the bones of their brethren by bitter railings and reproaches (which are as drawn swords, Ps. 57:4), how incongruous and unkindly is that? and may not the world wonder at it? What! shall all your edge and sting be turned against them, no less upright than yourselves? Shall they have no such adversaries as you whom they love and desire to be at peace with? and with whom they agree in all things (almost) else? Will ye do the Prelates work for them, in breaking that little liberty which at first they trembled at, till they saw you made it a bone of contention? and so more likely to break yourselves and it both than to hurt them, while ye stumble so upon it. What thanks will ye get for joining issues with them? See Obad. vv. 10-14. And will ye so positively condemn your brethren unheard (Jn. 7:51) and persecute them as apostates before ever ye wair an admonition on them? It is our admiration and astonishment, that some of you (as is informed) takes the confidence to baffle them in sermons, letters and private discourses to the people and others; and yet to this day never used the brotherliness to write or speak unto themselves what might have sufficed to convince them of their error, if any be. The grossest of heretics are not allowed by the rules of the Word to be so hardly dealt with, Tit. 3:10. Pronounce no anathema upon them till ye first take pains sufficient to reclaim them and find them obstinate. Shall ye be sharper scourges in their sides and thorns in their eyes than any others? Do ye like it, to put them to cry to God against you and (like Job) to complain of their friends mockage, injustice and cruel usage? Shall not God visit for these things? Zeph. 2:8; Obad. vv. 10-14. Beware of inventing or venting stories and reproaches of such friends of Christ! And make not calumnies the strongest arguments you plead against them with. Monopolize not the reputation of honesty to yourselves; give your brethren charity, and treat them not disrespectively. To stigmatize your brethren with black characters and odious imputations, consider again and again what spirit it comes from, Jam. 3:9-12. Upon all these grounds and many more which might be added, be intreated (in the bowels of Christ) to remit and relent of your acrid fervor and bring your dispositions and differences to some temper, and manage your discord with more sobriety. We think we may say the two part of your differences lies more in the acrimony of your spirits and alienation of affection than in the distance of your principles. Would ye let go the misunderstanding and prejudices that are between you, and God heal your dispositions and distempers, the two parts of your disease were away.</p></blockquote>

+were+that+to+Christ%2C+or+his+Kingdom%3F+or+what+edification+unto+people%3F+Sure+ye+do+more+hurt+than+ye+are+aware+of+by+this+course%2C+staggering+and+unsettling+people%2C+weakening+your+honest+brethren%E2%80%99s+hands+in+the+Gospel%2C+and+marring+the+success+of+their+labors+what+ye+can.+See+Jam.+3%3A16%3B+Gal.+5%3A14-15.+But+what%3F+are+not+ye+and+they+agreed+in+chiefest+principles+and+theses%3F+What%E2%80%99s+your+difference+then+but+about+the+application+of+principles+to+some+hypotheses+or+particular+cases+and+practices%3F+The+intricacy+whereof%2C+with+the+sense+of+your+short-sightedness%2C+may+teach+you+to+think%2C+speak+and+act+more+soberly+and+with+all+due+respect+to+them+that+differ+from+you.+O+fall+not+into+a+stated+schism+upon+so+small+and+disputable+a+matter%21+nor+lift+up+yourselves+in+conceit+above+your+fellows%21+Are+ye+preachers+of+Christ%3F+so+are+they%3A+Have+ye+the+seal+of+your+labors%2C+so+have+they%3B+and+that+they+have+not+more+is+perhaps+through+your+fault%2C+your+contending+with+them%2C+thereby+confounding+and+distracting+their+people+and+taking+them+off+their+souls%E2%80%99+ease%2C+by+your+perplexing+controversies+and+exceptions+against+their+ministers.+And+if+ye+continue+by+this+contending+to+discourage+your+brethren+and+enervate+the+work+of+God+in+their+hands%2C+fear+lest+ye+be+found+guilty+of+destroying+so+much+of+the+Kingdom+of+Jesus+Christ%2C+%5Bbe%5D+and+countable+for+the+blood+of+these+souls+whose+edification+ye+mar%2C+by+abusing+and+amusing+them+with+your+bartering+at+their+ministers+and+bringing+them+and+their+preaching+into+disesteem%2C+so+far+as+ye+can%2C+as+Zech.+13%3A7%2C+%E2%80%98Smite+the+shepherd%2C+and+the+sheep+shall+be+scattered.%E2%80%99+And+what+have+ye+gained+when+this+is+done%3F+What+advantage+is+it+to+the+Gospel%2C+to+break+so+many+faithful+men%E2%80%99s+ministry%3F+And+what+peace+will+it+yield+you+when+accomplished%3F+Bella+geri+placuit%2C+nullos+habitura+triumphos.+It+were+but+a+Cadmean+victory.+What%21+may+still+the+old+question+be+put+unto+you%3A+Does+your+piety+and+zeal+lie+all+in+negatives%3F+%28as+theirs+in+Col.+2%3A21%29+Are+ye+only+skillful+to+destroy%3F+and+bold+to+treat+the+friends+of+Christ+like+foes%3F+Preach+the+Gospel+and+propagate+real+godliness+as+much+as+ye+can%3A+but+O%21+beware+of+hurting+the+Lord%E2%80%99s+work+and+vineyard+in+your+brethren%E2%80%99s+hands%21+Will+it+not+be+but+a+poor+vassalage+to+preach+down+your+brethren%2C+while+ye+should+preach+up+Christ%3F+and+to+propagate+your+private+opinions+more+than+the+power+of+piety%3F+or+to+draw+disciples+after+you+more+than+after+Christ%3F+Were+it+not+better+make+one+real+Christian+than+proselyte+twenty+to+your+side+and+party%3F+Ye+complain+of+your+brethren%E2%80%99s+want+%5Black%5D+of+success%2C+as+Peninnah+upbraided+Hannah+with+her+barrenness%3B+but+do+not+ye+much+mar+their+fruitfulness%3F+O+be+tender+of+them%2C+for+the+Gospel%E2%80%99s+sake%21+Go%2C+we+pray+you%2C+convert+the+profane+to+piety+rather+than+preach+professors+into+faction+and+parties.+Mind+the+great+interest+of+the+Gospel+more+than+your+particular+debates+or+personal+interests.+Away+with+selfish+designs+under+a+spiritual+mask%21+Beware+of+giving+ground+for+that+old+complaint%2C+Faciunt+causam+suam%2C+causam+publicam.+Let+not+your+excellent+parts%2C+fervor%2C+zeal+and+spirits+be+spent+upon+so+unprofitable+a+task+as+this+of+jangling%2C+plunging%2C+and+confounding+is.+And+tempt+not+people+to+any+unhappy+courses%2C+which+yourselves+may+repent+of+in+the+end%2C+and+come+off+with+that+inconsiderate+warrior%E2%80%99s+word+in+your+mouth%2C+Non+putarum%E2%80%94+It+is+easy+to+kindle+a+fire%2C+but+not+so+easy+to+set+bounds+unto+it+when+and+where+ye+list%2C+saying%2C+%E2%80%98Hitherto+shalt+thou+come%2C+but+no+further.%E2%80%99+Nay%2C+once+kindled%2C+it+may+rage+whither+soever+the+winds+and+aptness+of+the+matter+to+take+with+it+may+carry+it%2C+till+all+be+burned+down+to+ashes.+And+finally%2C+let+not+your+brethren+have+cause+to+take+up+that+sad+regrate+of+the+psalmists%2C+Ps.+55%3A12-14%2C+%E2%80%98Had+it+been+an+enemy%2C%E2%80%99+etc.+How+bitter+is+this%3F+Were+it+rampant+Romanists%2C+or+inimical+Prelatists%2C+or+foul+mouthed+sectaries+who+thus+battered+at+honest+ministers%2C+it+were+more+tolerable%3F+But+to+see+brethren+at+such+odds%2C+tearing+the+flesh+%28as+it+were%29+off+the+bones+of+their+brethren+by+bitter+railings+and+reproaches+%28which+are+as+drawn+swords%2C+Ps.+57%3A4%29%2C+how+incongruous+and+unkindly+is+that%3F+and+may+not+the+world+wonder+at+it%3F+What%21+shall+all+your+edge+and+sting+be+turned+against+them%2C+no+less+upright+than+yourselves%3F+Shall+they+have+no+such+adversaries+as+you+whom+they+love+and+desire+to+be+at+peace+with%3F+and+with+whom+they+agree+in+all+things+%28almost%29+else%3F+Will+ye+do+the+Prelates+work+for+them%2C+in+breaking+that+little+liberty+which+at+first+they+trembled+at%2C+till+they+saw+you+made+it+a+bone+of+contention%3F+and+so+more+likely+to+break+yourselves+and+it+both+than+to+hurt+them%2C+while+ye+stumble+so+upon+it.+What+thanks+will+ye+get+for+joining+issues+with+them%3F+See+Obad.+vv.+10-14.+And+will+ye+so+positively+condemn+your+brethren+unheard+%28Jn.+7%3A51%29+and+persecute+them+as+apostates+before+ever+ye+wair+an+admonition+on+them%3F+It+is+our+admiration+and+astonishment%2C+that+some+of+you+%28as+is+informed%29+takes+the+confidence+to+baffle+them+in+sermons%2C+letters+and+private+discourses+to+the+people+and+others%3B+and+yet+to+this+day+never+used+the+brotherliness+to+write+or+speak+unto+themselves+what+might+have+sufficed+to+convince+them+of+their+error%2C+if+any+be.+The+grossest+of+heretics+are+not+allowed+by+the+rules+of+the+Word+to+be+so+hardly+dealt+with%2C+Tit.+3%3A10.+Pronounce+no+anathema+upon+them+till+ye+first+take+pains+sufficient+to+reclaim+them+and+find+them+obstinate.+Shall+ye+be+sharper+scourges+in+their+sides+and+thorns+in+their+eyes+than+any+others%3F+Do+ye+like+it%2C+to+put+them+to+cry+to+God+against+you+and+%28like+Job%29+to+complain+of+their+friends+mockage%2C+injustice+and+cruel+usage%3F+Shall+not+God+visit+for+these+things%3F+Zeph.+2%3A8%3B+Obad.+vv.+10-14.+Beware+of+inventing+or+venting+stories+and+reproaches+of+such+friends+of+Christ%21+And+make+not+calumnies+the+strongest+arguments+you+plead+against+them+with.+Monopolize+not+the+reputation+of+honesty+to+yourselves%3B+give+your+brethren+charity%2C+and+treat+them+not+disrespectively.+To+stigmatize+your+brethren+with+black+characters+and+odious+imputations%2C+consider+again+and+again+what+spirit+it+comes+from%2C+Jam.+3%3A9-12.+Upon+all+these+grounds+and+many+more+which+might+be+added%2C+be+intreated+%28in+the+bowels+of+Christ%29+to+remit+and+relent+of+your+acrid+fervor+and+bring+your+dispositions+and+differences+to+some+temper%2C+and+manage+your+discord+with+more+sobriety.+We+think+we+may+say+the+two+part+of+your+differences+lies+more+in+the+acrimony+of+your+spirits+and+alienation+of+affection+than+in+the+distance+of+your+principles.+Would+ye+let+go+the+misunderstanding+and+prejudices+that+are+between+you%2C+and+God+heal+your+dispositions+and+distempers%2C+the+two+parts+of+your+disease+were+away.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%2C+1681%29%2C+pp.+141-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0201af1316.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0201af1316.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=That%20however%20your%20judgment%20stand%20in,parts%20of%20your%20disease%20were%20away&amp;text=That%20however%20your%20judgment%20stand%20in%20the%20matter&amp;text=the%20two%20parts%20of%20your%20disease%20were%20away" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-c9eab65a4f" data-kw="">
<blockquote><p>So then did you know any to hold forth fundamental errours, such as are the overthrow of faith or destructive to the power of godliness, there is no countenance to be given to such, you make yourselves sharers with him in his sin and bring upon yourselves the same guilt. And therefore says Paul, Tit. 3:10: ‘A man that is an heretic after the first and second admonition reject, knowing that he that is such, is subverted, and sins being condemned of himself.’ These are the rules for undoing errors: Nay and were they defiling though not damning errors, were they but sinful, though not destroying errours, yet if they were evidenced to us, and manifest to us to be errors, we ought not to connive at them, to countenance them in their way, but to admonish, to reprove them, to exhort them and use all possible ways left by Christ to reclaim them. But now when the things held forth are but merely opinion, or if more, yet they are not any way injurious to faith, or hurtful to the power and practise of godliness, then there may be more agreement, the difference of judgment should not in this case alienate affections, though you are not all of one mind, yet you are all of one heart, and here you differ only about the way to advance God’s glory. You have both cordial affections to God and Christ, you desire to bring Him glory, only you differ in the way; one thinks this way, and the other this, and in both it may be the Scripture is silent, or holds out as much for one as the other. Now in this case why should there be falling out: certainly diversities of opinion, may be countenanced, and yet without sin, provided that it does not arise either from fickleness, unsettledness and inconstancy in us, or from pride, that we love to side and differ from others, or that it does not tend to make disturbance of the peace of the Churches of Christ.</p></blockquote>

— Samuel Bolton, The Arraignment of Errour… (London: Kembe, 1646), pp. 67-68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+then+did+you+know+any+to+hold+forth+fundamental+errours%2C+such+as+are+the+overthrow+of+faith+or+destructive+to+the+power+of+godliness%2C+there+is+no+countenance+to+be+given+to+such%2C+you+make+yourselves+sharers+with+him+in+his+sin+and+bring+upon+yourselves+the+same+guilt.+And+therefore+says+Paul%2C+Tit.+3%3A10%3A+%E2%80%98A+man+that+is+an+heretic+after+the+first+and+second+admonition+reject%2C+knowing+that+he+that+is+such%2C+is+subverted%2C+and+sins+being+condemned+of+himself.%E2%80%99+These+are+the+rules+for+undoing+errors%3A+Nay+and+were+they+defiling+though+not+damning+errors%2C+were+they+but+sinful%2C+though+not+destroying+errours%2C+yet+if+they+were+evidenced+to+us%2C+and+manifest+to+us+to+be+errors%2C+we+ought+not+to+connive+at+them%2C+to+countenance+them+in+their+way%2C+but+to+admonish%2C+to+reprove+them%2C+to+exhort+them+and+use+all+possible+ways+left+by+Christ+to+reclaim+them.+But+now+when+the+things+held+forth+are+but+merely+opinion%2C+or+if+more%2C+yet+they+are+not+any+way+injurious+to+faith%2C+or+hurtful+to+the+power+and+practise+of+godliness%2C+then+there+may+be+more+agreement%2C+the+difference+of+judgment+should+not+in+this+case+alienate+affections%2C+though+you+are+not+all+of+one+mind%2C+yet+you+are+all+of+one+heart%2C+and+here+you+differ+only+about+the+way+to+advance+God%E2%80%99s+glory.+You+have+both+cordial+affections+to+God+and+Christ%2C+you+desire+to+bring+Him+glory%2C+only+you+differ+in+the+way%3B+one+thinks+this+way%2C+and+the+other+this%2C+and+in+both+it+may+be+the+Scripture+is+silent%2C+or+holds+out+as+much+for+one+as+the+other.+Now+in+this+case+why+should+there+be+falling+out%3A+certainly+diversities+of+opinion%2C+may+be+countenanced%2C+and+yet+without+sin%2C+provided+that+it+does+not+arise+either+from+fickleness%2C+unsettledness+and+inconstancy+in+us%2C+or+from+pride%2C+that+we+love+to+side+and+differ+from+others%2C+or+that+it+does+not+tend+to+make+disturbance+of+the+peace+of+the+Churches+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Samuel+Bolton%2C+The+Arraignment+of+Errour%E2%80%A6+%28London%3A+Kembe%2C+1646%29%2C+pp.+67-68&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9eab65a4f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9eab65a4f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=So%20then%20did%20you%20know%20any,peace%20of%20the%20Churches%20of%20Christ&amp;text=So%20then%20did%20you%20know%20any%20to%20hold&amp;text=of%20the%20peace%20of%20the%20Churches%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-02de796914" data-kw="">
<blockquote><p>The apostle, 1 Tim. 6:3-5, saying, separate from such, has a two-fold sense: Either such as teach otherwise than the truth fundamentally, and then separate wholly: Or not fundamentally, but erring only in points less than the foundation. And these diversely also: Either presumptuously obstinately, and of a desparate conscience: and then if that apear, separate from such wholly: Or else, erring in simplicity and of oversight, and former preiudice, from such, separate not wholly, but only from the very error or errors, in no wise from their Christian communion and society, seeing these are true Christians. Seing therefore our corruptions of the prelacy and ceremonies be of these latter sort: which thing hitherto you haue not, nor cannot overthrow (and withal you must utterly overthrow Master [Thomas] Cranmer and the rest of the martyrs’ Christianity likewise): Therefore we in England, by the grace of God, are still true Christians: and you ought so to acknowledge us, as you will answer unto God: All which you may do, and yet touch no part of our ecclesiastical corruptions at all, to give allowance unto them: And in all this, there is no contradiction with myself, it is but your distempered conceit, that seems contrary. Neither is our absolute departure from the Papists hereby any whit impeached…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jacob.html">Henry Jacob</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Churches &amp; Ministry of England, written in Two Treatises, against the reasons and objections of Master Francis Johnson, and others of the Separation commonly called Brownists</cite>, (Middleburg, 1599), ‘Jacob’s 2nd Reply to the 9th Reason’, pp. 79-80</span></figcaption>

<blockquote><p>…and so [these examples brought forward by the Protesters] do not at all touch our case of joint acting in arms for just and necessary defence of subjects of one nation, habitually and antecedently incorporated, and now in common hazard. And for these alleged [verses] from the New Testament, they are such as are alleged by Separatists for separation from Churches for the the sin of fellow-members (as that 2 Cor. 6:14-15, etc.), which yet we believe judicious Separatists themselves will judge to be impertinently applied to a separation in the case [of civil, military defense] now in hand.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2c5132bea7" data-kw="">
<blockquote><p>In times of public calamity, as a general rule we should stand in our lot, and do and suffer the Lord’s will there. We may indeed flee from pestilence, if we neglect no duty in so doing. This may sometimes be done, especially where a whole community may retire to a healthy spot. Where this cannot be done, let physicians, ministers of the Gospel, public officers and those who may be useful as nurses stand their ground, and commit their case to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc8bb9f4db" data-kw="">
<blockquote><p>4. The sin of receiving and spreading false reports of others upon hearsay, is now so common among those that do profess sobriety and religion, that all men should take heed of it in all company, as they would do of the plague in an infectious time: And now it is so notorious that false news and slanders of others are so common, neither good men’s words, nor common fame, will allow you (or excuse you) to believe or report any evil of another, till you are able to prove that it is your duty: But all Christians should join in lamenting and reproving this common uncharitable sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 430</span></figcaption>

<blockquote><p>86. What then? Shall it be lawful ordinarily for ministers and elders to do what they list, or shall the governors [elders] in the Churches, glorying in the law, by their transgression dishonor God: God forbid. For first, if they shall trespass in anything against the magistrate or municipal laws, whether by inter-meddling in judging of civil causes, or otherwise disturbing the peace and order of the commonwealth, they are liable to civil trial and judgments, and it is in the power of the magistrate to restrain and punish them.</p></blockquote>

</figure><figure class="quote" id="q-018ed0281b" data-kw="">
<blockquote><p>Let us do as Jacob did, who sent a present and gift before to his brother: for as the wise man saith, a man’s gift enlargeth his steps, and leadeth him before great men (Prov. 18:16). So let us present the Lord, with contrite hearts, humble and sorrowful spirits, bring forth worthy fruits of repentance, which are the most acceptable gifts unto God. As Aaron took a censor and censed before the Lord, and so stayed the plague (Num. 16:48). So let us cense up unto God the sighs and groanings of our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A fruitful and godly sermon preached at Paul’s Cross before the Honorable audience and assembly there, this present year 1592, upon the 5th chapter of the prophesy of Zachariah</cite>, vv. 1-5’ (London, 1592)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-139d516bd3" data-kw="">
<blockquote><p>Whereas some object that the care both of temporal good and spiritual good belongs to the magistrate, therefore he must have a power to make Church laws. See [David] Pareus. For his care cannot be supreme, if he must rule at the nod and beck of Church-men. I Answer, the connection is weak: he who has the care of both the temporal and spiritual good of the people, he has a nomothetic [law-making] power to procure both these two goods: it follows [in] no way, for then might he have a power in his own person to preach, and administrate the sacraments; this power [of the magistrate] procures the spiritual good, but such as is the care, such is the power: the care is politic and civil; Therefore the power to procure the spiritual good, must bee politic and civil [circa sacra, not in sacra].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 442-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<main class="wrap"><figure class="quote" id="q-1b00e652a0" data-kw="">
<blockquote><p>The similarity [of the determination of the synod in the morning] to the Irish [Pacific] Act [1720] is apparent [which expressly allowed for exceptions], and in the context, especially given [Thomas] Craighead’s involvement, it is certain that it served as the source for the Committee’s proposal… in light of the actual overture by [John] Thomson, which stipulated the two needs [of subscription and adopting a confession], it makes more sense to see the morning session establishing the requirement and terms of subscription and the afternoon session as the formal adoption by the Synod [of the Westminster Confession]. In other words, the Synod’s adopting of the Confession is distinguished from the requirement for subscription and later debates in the American Church has been the result of not recognizing the distinction. The ‘preliminary’ or morning session is the only one to explicitly require subscription. Moreover, allowing presbyteries to judge scruples would be nonsense had the Synod intended to decide what scruples would be allowed in the afternoon session.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-scott-sealy.html">Charles Scott Sealy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), pp. 169-28 | ch. 5, ‘The Synod of Philadelphia &amp; the Adopting Act (1729)’</cite>, pp. 179-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

— Charles Scott Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), pp. 169-28 | ch. 5, ‘The Synod of Philadelphia &amp; the Adopting Act (1729)’, pp. 179-81">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+similarity+%5Bof+the+determination+of+the+synod+in+the+morning%5D+to+the+Irish+%5BPacific%5D+Act+%5B1720%5D+is+apparent+%5Bwhich+expressly+allowed+for+exceptions%5D%2C+and+in+the+context%2C+especially+given+%5BThomas%5D+Craighead%E2%80%99s+involvement%2C+it+is+certain+that+it+served+as+the+source+for+the+Committee%E2%80%99s+proposal%E2%80%A6+in+light+of+the+actual+overture+by+%5BJohn%5D+Thomson%2C+which+stipulated+the+two+needs+%5Bof+subscription+and+adopting+a+confession%5D%2C+it+makes+more+sense+to+see+the+morning+session+establishing+the+requirement+and+terms+of+subscription+and+the+afternoon+session+as+the+formal+adoption+by+the+Synod+%5Bof+the+Westminster+Confession%5D.+In+other+words%2C+the+Synod%E2%80%99s+adopting+of+the+Confession+is+distinguished+from+the+requirement+for+subscription+and+later+debates+in+the+American+Church+has+been+the+result+of+not+recognizing+the+distinction.+The+%E2%80%98preliminary%E2%80%99+or+morning+session+is+the+only+one+to+explicitly+require+subscription.+Moreover%2C+allowing+presbyteries+to+judge+scruples+would+be+nonsense+had+the+Synod+intended+to+decide+what+scruples+would+be+allowed+in+the+afternoon+session.%E2%80%9D%0A%0A%E2%80%94+Charles+Scott+Sealy%2C+Church+Authority+%26+Non-Subscription+Controversies+in+Early+18th+Century+Presbyterianism+PhD+thesis+%28Univ.+of+Glasgow%2C+2010%29%2C+pp.+169-28+%7C+ch.+5%2C+%E2%80%98The+Synod+of+Philadelphia+%26+the+Adopting+Act+%281729%29%E2%80%99%2C+pp.+179-81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b00e652a0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b00e652a0.html">Permalink</a><a class="src" href=" </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6e13fc085d" data-kw="">
<blockquote><p>Conservatives argued that the Synod of Philadelphia was correct in interpreting the 1729 Adopting Act in terms of the ‘afternoon minute’ and the strict reinterpretation of 1736. Receiving and adopting the ‘system’ [a term used in 1788] of the [Westminster] Confession meant embracing the whole confession without exception, once the originally scrupled articles on the civil magistrate had been amended in 1788. A larger group of Presbyterians, recalling the original intent of the morning minute of 1729, believed the ‘system’ referred to the Confession’s Calvinistic doctrines; this body advocated the distinction between doctrines ‘essential’ to the system and those that were not. This was the spirit of the old Synod of New York. And there was a third small party, which held that ‘system of doctrine’ [in 1788] referred to the fundamental doctrines shared in common with all Christian churches. This minority expression drew inspiration from the 1729 language ‘systems of Christian doctrine’ [in the early morning session of the Adopting Act 1729]. Some of the early pre-1729 discussions about subscription had advocated this opinion, but, it ultimately had been rejected [Fortson claims] in the compromise of 1729. Nonetheless, a few voices would continue to herald a loose view of subscription which favored mere assent to catholic Christianity as the ‘substance’ of Westminster doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43</cite>, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-60ede33560" data-kw="">
<blockquote><p>Besides this, your servants should be the most thoroughly honest, and circumspect, and modest, and as serviceable to you as possible. And see that you instruct and teach them in true doctrine with all the patience and charity of Christ; but if they despise and light esteem your instruction…</p></blockquote>

</figure><figure class="quote" id="q-a495b14ff1" data-kw="">
<blockquote><p>Article 1… the Sieur de la Milletiere… a fellow who would not submit himself unto their judgment and authority, and who has told the world that for these two last years he had no other intention than to incorporate himself into the communion of the Church of Rome, and to form a party against all the Reformed Churches, impugning with might and main the common confessions of all Protestants, perpetually accusing them of contemning the Catholic, that is, his Romish Church, and of schism from it, and propounding to them for the Rule of their Faith the Acts and Canons of the Council of Trent… But the said de la Milletiere having given it under his own hand in writing that he would submit himself unto the judgment of this synod; when as the commissioners, whom he himself had nominated, brought in their report… the Synod did once more refuse him, especially, because that he had fully opened his intentions, and in formal words declared that by that writing subscribed with his own hand, he never promised to submit his doctrine, but himself and person to the judgment of the Assembly; who taking, as in truth they could not but take this distinction, such an one as it was, in any other sense than a notorious scorn of their just and charitable endeavours for his eternal welfare; They told him plainly, that neither they nor any of their commissioners would waste a moment more of their precious time about him, and adjured him… to give Glory unto God, and to relinquish his most impious designs; and added farther, that they did as the National Synod of Alanson had done before them, declare, that for diverse years past he was not to be reputed a member of our Reformed Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/disciplinary-cases.html">Disciplinary Cases</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. John Quick, Synodicon (London, 1692), 3rd National Synod of Charenton</cite>, ch. 15, pp. 476-77</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-321cf00249" data-kw="">
<blockquote><p>We shall here declare what offences are censurable with this greatest and last censure of excommunication, according to the order that is there prescribed, and which, as it requires, ‘that it be inflicted with great and mature deliberation, and after all other good means have been essayed;’ so it appoints in these express words: ‘That such errours in practice as subvert the Faith, or any other errours which overthrow the power of godliness; if the party who holds them spread them, seeking to draw others after him; and such sins in practice as cause the name and truth of God to be blasphemed, cannot stand with the power of godliness; and such practices, as in their own nature manifestly subvert that order, unity and peace which Christ has established in his Church; and particularly all those scandalous sins, for which any person is to be suspended from the sacrament of the Lord’s Supper, obstinately persisted in; these being publicly known, to the just scandal of the Church; The sentence of excommunication may and ought to proceed, according to the directions after following. But the persons that hold other errors in judgment, about which learned and godly men possibly may and do differ, and which subvert not the faith, nor are destructive to godliness, or that be guilty of such sins of infirmity as are commonly found in the children of God: or being otherwise sound in the Faith and holy in life (and so not falling under censure by the former rules) endeavour to keep the unity of the spirit in the bond of peace; and do yet out of conscience not come up to the observation of all those rules which are or shall be established by authority for regulating the outward worship of God and government of his Church; the sentence of excommunication for these causes shall not be denounced against them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancaster-presbyterians.html">Lancaster Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Censures of the Church Revived… (London: Eversden, 1659) sect. 4</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

hurch%3B+the+sentence+of+excommunication+for+these+causes+shall+not+be+denounced+against+them.%27%E2%80%9D%0A%0A%E2%80%94+Lancaster+Presbyterians%2C+The+Censures+of+the+Church+Revived%E2%80%A6+%28London%3A+Eversden%2C+1659%29+sect.+4%2C+p.+36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F321cf00249.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/321cf00249.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=We%20shall%20here%20declare%20what%20offences,shall%20not%20be%20denounced%20against%20them&amp;text=We%20shall%20here%20declare%20what%20offences%20are%20censurable&amp;text=these%20causes%20shall%20not%20be%20denounced%20against%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-43c4f14f1b" data-kw="">
<blockquote><p>And because in this matter it chiefly behoves to know who is truly said to be an heretic or whom is a schismatic: of these matters I will first of all speak these few words. St. Augustine thinks that this difference there is between an heretic and a schismatic: That a heretic does corrupt the sincerity of faith and doctrine of the apostles with his wicked doctrine; and a schismatic, although he sin not at all against the pure doctrine and sincere faith, yet he rashly separates himself from the Church, breaking the bond of unity. And surely he properly is an heretic, whosoever he be that contrary to the Scripture, which is the Word of God, against the Articles of Faith,¹ or against the sound opinions of the Church grounded on the Word of God, through hope of any temporal commodity, of his own brain and fleshly choice chooses, receives, teaches, follows strange things, and stiffly retaining does both defend them and spread them abroad. ¹ [This likely refers to the Apostles’ Creed, which was also known as the 12 Articles, and around which Bullinger’s Decades was roughly organized.] By the imperial edict of Augustus Cesar, Gratian, Valentinian and Theodosius, they are defined to be catholics or Christians who continue in that religion which St. Peter taught the church of Rome and which blessed Damasus and St. Peter, bishop of Alexandria, did teach, that is to say, confessing according to the teaching of the apostles and doctrine of the Gospel the only Godhead of the Father, and of the Son, and of the Holy Ghost in equal majesty and in an holy Trinity. And again they are by them declared to be heretics, who follow contrary opinions, whom they accompt both mad and infamous, and worthy of punishment. And he is a scismatic, whosoever he be that separates himself from the unity of the true Church of God, and either himself gathers together new assemblies, or joins himself to congregations gathered by others, albeit in doctrine he err little or nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades… (d. 1575; London: Newberrie, 1577), 5th Decade, Sermon 2, “That there is one catholic Church”</cite>, p. 850</span></figcaption>

</figure><figure class="quote" id="q-14e6d90eae" data-kw="">
<blockquote><p>…we must prove ourselves the true Church of God: Thus we do it: We are true Christians, for we were baptized into the name of Christ; we truly profess our continuance in the same faith, into which we were baptized: we join together in the public services of God: we maintain every point of the most ancient Creeds: we overthrow not the foundation by any consequence; Therefore whateuer is wanting to us, whatever is superfluous, in spite of all the gates of Hell, we are the true Church of God.</p></blockquote>

<blockquote><p>Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-alley.html">William Alley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.”

— William Alley, The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSchismatical+is+such+as+was+the+schisms+of+the+Donatists+%5Bin+the+Early+Church%5D%2C+which+separated+themselves+from+the+true+Church+of+God+under+the+pretense+of+a+more+absolute+life+and+a+more+perfect+holiness%E2%80%A6+But+none+of+these+%5Bkinds+of+schisms%5D+can+be+justly+imputed+unto+us+declining+from+the+Romish+Church%2C+for+that+departing+is+without+all+blame%2C+which+is+not+from+a+true+Church%2C+but+from+a+false+Church%3A+not+from+the+people+of+God%2C+but+from+the+persecuters+of+the+people+of+God%2C+not+from+the+articles+of+the+Faith+and+sound+doctrine+of+the+church%2C+but+from+errors+which+darken+the+articles+of+the+Faith+and+from+the+wicked+traditions+of+men%2C+which+specially+is+not+done+by+any+lightness+but+by+necessity%2C+not+for+the+desire+of+innovation+but+for+true+religion%E2%80%99s+sake%2C+and+to+recover+the+true+Faith+according+to+the+testimony+of+the+eternal+verity%2C+that+leaving+the+fellowship+of+darkness%2C+we+may+be+gathered+again+in+true+light%2C+placed+with+Christ+and+all+his+members.+So+we+at+this+day+have+forsaken+that+Romish+Sea+full+of+false+doctrine+and+idolatry%2C+and+flowing+with+the+innocent+blood+of+martyrs%2C+and+have+embraced+the+evangelic+and+apostolic+doctrine%2C+and+so+Christ+Himself+being+head+of+the+Church%2C+which+is+the+commmunion+of+all+saints+believing+in+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Alley%2C+The+Poor+Man%E2%80%99s+Library+Rapsodi%C3%A6+G.A.+Bishop+of+Exeter+upon+the+First+Epistle+of+Saint+Peter...+%281560%3B+London%3A+Day%2C+1565%29%2C+Lecture+7%2C+Now+to+the+Romish+Church%2C+Response%2C+3.+Schismatical%2C+p.+246+Alley+was+the+Anglican+bishop+of+Exeter

<blockquote><p>For the preaching of error is like the selling of poisoned pestied [sic] bread, that slays the eater of it, and infects with the breath every man that comes near hand; and albeit the Lord hath brought in wholesome food in his house, and lies held his table long covered, yet the malice of Satan, and the business of the Pope to recover his kingdom, and the dalliance of worldly men, lies set instruments on foot to trouble our Church again; and God, in his deep wisdom and justice, has suffered, the matter to go that far on, that we might see what a fearful sin it was to put the keys of the house of God in wrong hands, and what evil freicks [sic], errors in discipline would bring forth, and also that he might punish the unsanctified and proud wits of men that would take upon them to govern his Kirk, as also he would have these ministers in this land corrected for their negligence who are like the rest of the country, who thinks of arms whilst they are in peace. So have we done. In time of peace we were all secure, and dreamed not of straits, and studied for no more but to get any sermon in the week; yet blessed be our God, who has also many painful and faithful servants as will be sufficient to clear his truth of his Kirk against all that will say the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Arminianism Discussed. Address to the General Assembly of 1638 in Select Biographies. Edited for the Wodrow Society, Chiefly from Manuscripts in the Library of the Faculty of Advocates</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

fd4f2691ea.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/08/david-dickson-on-the-danger-of-poisonous-error/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Son of God manifested in the flesh is named Jesus, because he hath saved us, through his desert, and yet still saveth us by his power from all our sins. Matt. 1. Acts 4. Hebr. 7. … As often as I hear therefore the name of Jesus, I ought to remember the promise of the Gospel that lieth hid in it: that he through his merit, hath saved me from my sins, and by his power, mortifieth the remnants of sin in me, until he fully deliver me from them: that he also quickeneth me through his holy spirit, and that he everlastingly keepeth for me that same salvation purchased with so great a price, 1 Pet. 1. And so he beareth that worthy name for my sake, which was given unto him by the father from heaven, that he might shew the truth of his name, in truth and effectually as well in my salvation, as in the salvation of all believers. He is faithful that beareth that notable name of saviour, and he that hath promised, shall do it.</p></blockquote>

</figure><figure class="quote" id="q-da5f5fb0d6" data-kw="">
<blockquote><p>Beware therefore Kings and Princes, beware kingdoms and common-wealths. Beware of false prophets, which come to you in sheep’s clothing, but inwardly are ravening wolves. And thou Britain especially Scotland, my dear country, the purest portion of Christ’s Church in the world this day, assure thy self, and I assure thee, for I know it, that thy good people are as sheep in the midst of wolves, be ye therefore (heads and members thereof) wise as serpents Casting out this bound woman and her Son, by the execution of the Law, of the kingdom, ad amussim, punctually, not granting them a pecunial [sic] liberty of conscience, or any toleration whatsoever, and GOD will help you, yet notwithstanding your imminent dangers, whereof I shall advertise you in the end of this discourse; otherwise your liberties and kingdoms are lost, and Antichrist hath prevailed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-abernethy.html">Thomas Abernethy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abjuration of popery, by Thomas Abernethy: sometime Jesuit, but not penitent sinner, and an unworthy member of the true Reformed Church of God in Scotland, at Edinburgh, in the Gray-frier church, the 24 of August, 1638</cite>, (Edinburgh: George Anderson, 1638), p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

ormed Covenanter</a></div>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks:

1. It is more for controversies and speculations than for practical holiness.

2. It is selfish and kindled by an overvaluing their own conceits or ways.

3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church.

4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like.

5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like.

5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.”

— Richard Baxter, The True Catholic, &amp; Catholic Church Described, … (London: A.M., 1660), pp. 158-62 &amp; 184-87">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+A+peaceable+spirit+must+have+a+high+esteem+of+peace%2C+and+be+zealous+for+it%2C+and+industrious+to+obtain+it.+Only+against+ungodliness+and+unpeaceableness+must+he+be+unpeaceable.+Many+have+a+good+wish+and+a+good+word+for+peace%2C+as+hypocrites+have+for+godliness%2C+but+this+will+not+serve+the+turn.+He+that+is+not+for+us+is+against+us%2C+and+he+that+gathers+not+with+us%2C+and+he+that+gathers+not+with+us%2C+scatters+abroad.+The+wicked+and+unpeaceable+are+zealous+and+industrious+against+peace%3B+and+those+that+are+for+peace+are+cold+and+indifferent+for+the+greater+part%3B+and+the+zealous+and+industrious+are+so+few+that+their+voices+cannot+be+heard+in+the+contentious+crowd.+The+unpeaceable+are+commonly+the+loudest+and+are+actuated+by+a+fervent+zeal%2C+which+nature+agrees+with+and+Satan+cherishes+and+excites%3A+such+will+even+as+the+Quakers%2C+go+up+and+down+from+one+assembly+to+another%2C+and+in+the+market-places+and+other+places+of+concourse%2C+revile+and+rail%2C+and+reproach+the+ministry%2C+and+speak+as+earnestly+as+if+they+were+the+agents+of+Christ.+And+others+are+busy+in+secret%2C+that+will+not+incur+the+disgrace+of+such+visible+impiety.+And+when+the+enemies+of+unity+and+peace+are+many%2C+and+hot+and+loud%2C+and+the+friends+of+unity+and+peace+are+either+few+or+cold+and+dull+and+silent%2C+what%E2%80%99s+like+to+be+the+issue%2C+but+even+the+mischiefs+which+we+feel%3F+Forsooth%2C+some+dare+not+be+fervent+for+peace%2C+lest+they+be+censured+for+their+fervor+to+be+unpeaceable%3A+These+show+how+much+they+love+the+praise+of+men+and+stick+yet+in+the+power+of+self.+There%E2%80%99s+need+of+zeal+for+peace%2C+as+well+as+for+other+parts+of+holiness.+All+the+resistance+that+the+enemies+of+Hell+and+earth+can+make%2C+will+be+made+against+it%3A+And+will+it+be+carried+on+against+all+by+sleepy+wishes+and+sitting+still%3F+I+am+sure+this+agrees+not+with+the+precepts+of+the+Spirit.+%E2%80%98Follow+peace+with+all+men%2C%E2%80%99+Heb.+12%3A14.+If+it+be+possible%2C+as+much+as+in+you+lies%2C+live+peaceably+with+all+men%2C+Rom.+12%3A18.+It%E2%80%99s+a+sorry+surgeon%2C+or+physician+that+will+think+it+enough+to+wish+well+to+their+patient%3A+the+House+of+God+will+be+neither+built%2C+nor+repaired+without+zeal+and+industry+and+patience+in+the+work.+If+men%E2%80%99s+hearts+were+set+upon+the+Church%E2%80%99s+peace%2C+and+they+did+but+feel+the+disjoiting+of+her+members%2C+the+breaking+of+her+bones%2C+and+the+smart+of+her+wounds%2C+as+sensibly+as+they+feel+the+like+in+their+own+bodies%3B+and+if+ministers+and+other+Christians+were+as+sensible+of+the+evil+of+divisions+as+they+are+of+drunkenness%2C+and+whoredom%2C+and+such+other+sins%2C+and+if+we+were+all+awakened+to+quench+the+flames+of+the+Church%2C+as+earnestly+as+we+would+do+the+fire+in+our+houses%2C+and+would+preach+for+peace+and+pray+for+peace%2C+and+plead+and+labor+and+suffer+for+peace%2C+then+some+good+might+be+done+on+it%2C+against+the+rage+and+multitude+of+dividers.+%E2%80%A6+8.+Another+hindrance+of+unity+and+peace+is+a+carnal+zeal+in+matters+of+religion%2C+which+is+frequently+mistaken+for+the+true+zeal+of+the+saints.+When+men+are+confident+that+their+opinions+are+the+truth%2C+and+overvalue+them+as+to+the+necessity+%28because+they+are+their+own%2C+though+they+observe+not+the+reason%29%2C+they+presently+think+they+must+be+hot+against+all+the+gainsayers+of+their+opinions%3B+and+herein+they+place+the+most%2C+or+at+least+too+much%2C+of+their+religion.+There%E2%80%99s+not+one+of+many+that+has+this+zeal+but+thinks+it+is+of+God+and+is+part+of+their+holiness%2C+when+as+it+is+often+from+the+Devil+and+the+flesh%2C+even+when+the+doctrine+is+true+which+they+contend+for.+You+may+know+it+from+true+zeal+by+these+following+marks%3A+1.+It+is+more+for+controversies+and+speculations+than+for+practical+holiness.+2.+It+is+selfish+and+kindled+by+an+overvaluing+their+own+conceits+or+ways.+3.+It+is+private+and+would+promote+a+lower+truth+to+the+loss+of+a+greater%2C+or+a+doubtful+point%2C+to+the+loss+of+undoubted+truth%3B+or+a+single+truth%2C+to+the+loss+or+hindrance+of+the+body+of+common+truth%3B+and+it+is+hotter+for+a+party+than+for+the+catholic+Church%2C+and+will+promote+the+interest+of+an+opinion+or+purity+to+the+wrong+of+the+common+interest+of+the+Church.+4.+It+is+blind+and+carries+men+to+sinful+means%2C+as+resisting+authority%2C+order+or+ordinances%2C+or+the+like.+5.+It+is+unmerciful+and+unpeaceable%2C+and+little+sensible+of+the+case+of+others+or+smart+of+the+divided+Church.+Many+are+calling+for+fire+from+Heaven+for+the+cause+of+Christ%2C+that+little+know+what+spirit+they+are+of%2C+Lk.+9%3A55.+O+how+true+is+this+of+many+that+think+they+excel+in+knowledge+or+zeal+and+are+but+defending+the+truth+against+erroneous+adversaries.+But+%E2%80%98who+is+the+wise+man+and+endued+with+knowledge+among+you%3F+let+him+show+out+of+a+good+conversation%2C+his+works+with+meekness+of+wisdom%3A+But+if+you+have+bitter+envying+and+strife+in+your+hearts%2C+glory+not%2C+and+lie+not+against+the+truth%3A+This+wisdom+descends+not+from+above%2C+but+is+earthly%2C+sensual%2C+devilish%3A+For+where+envying+and+strife+is%2C+there+is+confusion%2C+and+every+evil+work%3A+But+the+wisdom+that+is+from+above%2C+is+first+pure%2C+then+peaceable%2C+gentle%2C+and+easy+to+be+entreated%2C+full+of+mercy+and+good+fruits%2C+without+partiality%2C+without+hypocrisy%3B+And+the+fruit+of+righteousness+is+sown+in+peace+of+them+that+make+peace.%E2%80%99+Jam.+3%3A13+to+the+end.+But+of+this+I+have+formerly+spoken+at+large+in+many+sermons+on+these+words+of+James.+Dividing+zeal+is+a+grievous+distracter+of+the+Church%E2%80%99s+peace.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+True+Catholic%2C+%26+Catholic+Church+Described%2C+%E2%80%A6+%28London%3A+A.M.%2C+1660%29%2C+pp.+158-62+%26+184-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f64231e22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f64231e22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-zeal/#:~:text=5.%20A%20peaceable%20spirit%20must%20have,grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace&amp;text=5.%20A%20peaceable%20spirit%20must%20have%20a%20high&amp;text=is%20a%20grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

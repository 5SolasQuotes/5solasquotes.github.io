<blockquote><p>Minister: …But is there any minister or Church that has no open faults in ministry and worship? Lawyer: They mean not small infirmities, such as weak, faulty expressions, methods, disorders, dullness, etc. but gross, intolerable faults. Minister: So then you are come to what I hold; I profess that if I see or hear any such blasphemy, idolatry, heresy or malignity as renders the worship abhorred of God, I will abhor it and avoid it.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a817a3fce0" data-kw="">
<blockquote><p>Fourthly, it may inform us, if our God be so holy and pure, then his worship also must be pure. What should a pure God do with an impure and mixed worship? He will have no plowing with an ox and an ass… Dt. 22:10-11. There is no serving Him and idols too, Josh. 24:19. He tells these idolaters, ‘Ye cannot serve the Lord, for He is an holy and a jealous God’ that can endure no co-rival in his worship. He will have all done there according to the pattern; we must set up nothing in his worship without the warrant of his Word, Mt. 28:20. Whatsoever He commands, not whatsoever men command, must we observe to do. God’s courts are courts of holiness and therefore no uncleanness must be set up there, Isa. 62:9… Fifthly, it informs us that the persons must be pure: As the worship must be pure, so must the worshippers; The God of purity must have pure servants: the fountain of holiness will have none but holy followers. It is a disgrace to an eminent holy man to have a bastard lay claim to him. Ps. 50:16, To the wicked says God, ‘What hast thou to do to declare my statutes?’ Whenever we come to worship this glorious God, we must wash our hands in innocency, Ps. 26:6, and purge our families from sin, as Jacob did his from idols before he went to Bethel, Gen. 35:1-3. The people must be sanctified and prepared before the Lord will deliver his holy Law unto them; then and not tell then does God speak, Ex. 19:14-15 compared with 20:1. He will not take a wicked man by the hand. What communion has light with darkness, purity with impurity, virtue with vice, beauty with deformity, life with death, or the chiefest good with the foulest evil? There must be always a purging of our hearts from sin before we draw nigh to God in praying, hearing, sacraments, etc. else the Lord will abhor both us and our duties, and will answer us according to our idols, Eze. 14:3-4. Under the Law, if any man came to offer a sacrifice with his uncleanness on him, he must be cut off; there must be washing and cleansing before he came; so in all our approaches to God in duty there must be not only a habitual, but also an actual fitting and preparing of ourselves for the work. Therefore when James (4:8) had commanded us to draw nigh to God, he presently adds, ‘Cleanse your hands ye sinners, and purify your hearts.’ Our hearts are not fit to serve the living God till they be purged from dead works, Heb. 9:14; God will not vouchsafe to reason with us, nor to have any communion with us, till we have first washed ourselves and made us clean; Isa. 1:16-18, ‘Then come let us reason together.’ The Lord will be worshipped in the beauty of holiness or not at all, Ps. 96:9, there is no pleasing Him without it, and none that ever had it in truth but pleased him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Holiness</cite>, … (London: 1655), ch. 2, pp. 44-47</span></figcaption>

<blockquote><p>26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant [1643] which renounces profaneness, schism and all that is contrary to godliness. 27. So much are Papists angry at Protestant ministers that keep them [non-conformists] out of the parish churches, [Papists] reviling them [such Protestant ministers] as trimmers, [Papists] supposing that conventicles [worship assemblies of non-conformists] can do them less harm, that all that love the Protestant religion should do their best to encourage† all such orthodox men and to strengthen the Protestant interest in the parish churches, and not join against them with the Papists (however it be with other intents and minds).</p></blockquote>

<blockquote><p>…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?”

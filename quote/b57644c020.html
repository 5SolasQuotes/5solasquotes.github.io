<main class="wrap"><figure class="quote" id="q-b57644c020" data-kw="">
<blockquote><p>No, I ground my faith on God&#x27;s word, and not upon the church. For if the church be a good church, the faith of the church must be tried by God&#x27;s word; and not God&#x27;s word by the church, neither yet my faith.</p></blockquote>
<figcaption>— <a href="../authors/lady-jane-grey.html">Lady Jane Grey</a>, <cite>Foxe&#x27;s Book of Martyrs</cite>, conference with Feckenham (as reported by John Foxe)</figcaption>

<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, vol. 1, Second Topic, Q. 20, §XI</figcaption>

</figure><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>Now, the Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption>— <a href="../authors/robert-shaw.html">Robert Shaw</a>, <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, on ch. 1, §§ 9–10</figcaption>

</figure><figure class="quote" id="q-a067c1d621" data-kw="">
<blockquote><p>When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Table Talk</cite>, Of the Fathers of the Church, DXIX, p. 297</figcaption>

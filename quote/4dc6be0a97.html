<blockquote><p>4. Whether the regenerate soul here [after death in the consummation of regeneration] conducts itself purely passively, or rather actively concurs with the motion of the Spirit, and that by virtue of the new creature implanted in it as the principium quo [principle by which]? Response: The latter can be affirmed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

— Gisbertus Voetius, XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+Whether+the+regenerate+soul+here+%5Bafter+death+in+the+consummation+of+regeneration%5D+conducts+itself+purely+passively%2C+or+rather+actively+concurs+with+the+motion+of+the+Spirit%2C+and+that+by+virtue+of+the+new+creature+implanted+in+it+as+the+principium+quo+%5Bprinciple+by+which%5D%3F+Response%3A+The+latter+can+be+affirmed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+XI.+%E2%80%98Appendix+concerning+the+Second+Moment+of+Conversion%E2%80%99+in+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4dc6be0a97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4dc6be0a97.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=4.%20Whether%20the%20regenerate%20soul%20here,Response%3A%20The%20latter%20can%20be%20affirmed&amp;text=4.%20Whether%20the%20regenerate%20soul%20here%20%5Bafter%20death&amp;text=by%20which%5D%3F%20Response%3A%20The%20latter%20can%20be%20affirmed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-34e17462fb" data-kw="">
<blockquote><p>In one word, then, by repentance I understand regeneration, the only aim of which is to form in us anew the image of God, which was sullied, and all but effaced by the transgression of Adam. So the apostle teaches when he says, ‘We all with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, as by the Spirit of the Lord.’ Again, ‘Be renewed in the spirit of your mind,’ and ‘put ye on the new man, which after God is created in righteousness and true holiness.’ Again, ‘Put ye on the new man, which is renewed in knowledge after the image of him that created him.’ Accordingly, through the blessing of Christ we are renewed by that regeneration into the righteousness of God from which we had fallen through Adam, the Lord being pleased in this manner to restore the integrity of all whom He appoints to the inheritance of life. This renewal, indeed, is not accomplished in a moment, a day, or a year, but by uninterrupted, sometimes even by slow, progress God abolishes the remains of carnal corruption in his elect, cleanses them from pollution, and consecrates them as his temples, restoring all their inclinations to real purity, so that during their whole lives they may practise repentance, and know that death is the only termination to this warfare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3. ‘Regeneration by Faith…’ in Institutes of the Christian Religion tr. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, pp. 149-82, pp. 159-60</span></figcaption>

s.github.io%2Fquote%2F34e17462fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/34e17462fb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/regeneration#:~:text=In%20one%20word%2C%20then%2C%20by%20repentance,the%20only%20termination%20to%20this%20warfare&amp;text=In%20one%20word%2C%20then%2C%20by%20repentance%20I%20understand&amp;text=death%20is%20the%20only%20termination%20to%20this%20warfare" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-14b4f74e38" data-kw="">
<blockquote><p>Secondly, I say Christ is a second Adam, and a public person, and became ours, we then being in his loins, so the righteousness of Christ is made ours, we being born in Christ by faith, and found in Him: He being our head, we have a spiritual life descending upon us; He being our husband, all his goods are ours also. This point is the soul of the Church and the golden key which opens Heaven for us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Third Chapter of the Epistle of St. Paul to the Philippians</cite>, ... (London: Cotes, 1639), on verse 9, ‘But that which is through the faith of Christ…’, p. 110</span></figcaption>

</figure><figure class="quote" id="q-c7d28ddb58" data-kw="">
<blockquote><p>Thesis 10… But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us, is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses Written Out in Full with the Unanimous Consent of the Pastors of the Swiss Churches by the Authority of the Very Distinguished Senate of Bern</cite>, 1588’ in Justification by Faith Alone: Selected Writings from Theodore Beza (1519-1605), Amandus Polanus (1561-1610), Francis Turretin (1623-1687), trans. Casey Carmichael in Classic Reformed Theology (RHB, 2023), pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

<blockquote><p>XXVI. If it is necessary for the reparation to be co-extensive with the corruption, and the latter has invaded all the faculties of the soul, the former must also be constituted in all its parts. And since supernatural life has been extinguished in the whole man, and not in the will or the mind separately, the whole man must also become a partaker of spiritual life, so that he may be truly called regenerated. XXVII. Therefore, the darkened mind is illuminated (Eph. 1:18), the will, prone only to evil, is bent toward the good, the disordered affections, alienated from the rule of reason, begin again to listen to it and to be more subject to the will (Rom. 6:12), and finally, the whole man comes into some part of this new and divine change. XXVIII. Those who state that here only the mind is illuminated and the affections corrected, but that the will is not healed, but only freed from impediments and rendered more ready to exercise the faculty inherent in it, must see on what foundation of Scripture they do this. We, on the contrary, feel that the will is as much the subject of this reparation as the mind.</p></blockquote>

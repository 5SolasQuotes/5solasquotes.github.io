<main class="wrap"><figure class="quote" id="q-f34c7d8df8" data-kw="">
<blockquote><p>And as the enjoyment of God, and so everlasting happiness, was promised in the Old, as well as in the New Testament, so was it promised then too, as well as now, only in Jesus Christ; there being no other Mediator to reconcile God to us, and us to God, because none but he ever was or ever will be both God and man. And whosoever is God only and not man, or man only and not God, can never mediate betwixt God and man. For he that is God only cannot suffer for man; and he that is man only cannot make satisfaction to God: and therefore to make a person capable of suffering for man, and able to satisfy God, and so to mediate betwixt God and man, by suffering for the sins of the one, and satisfying the justice of the other; it is necessary that himself participate of both natures, which being joined together in one Person might so be reconciled to one another.

Now seeing there never was nor ever will be any such person in the world besides Christ, and seeing Christ was exactly such a person, perfect God and perfect man, it necessarily follows, that it was he, and he alone, that could be the Mediator betwixt God and man in the Old as well as in the New Testament: and so that whatsoever promises or overtures were made to the old Fathers were made only in him, without whom they could have enjoyed no mercy, nor have partaked any happiness, either in this world or that which is to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 226-27.</span></figcaption>

<blockquote><p>For when Scripture speaks of the sons of God, sometimes it has respect to eternal election, which extends only to the lawful heirs; sometimes to external vocation, according to which many wolves are within the fold; and though, in fact, they are strangers, yet they obtain the name of sons, until the Lord shall disown them. Yea, even by giving them a title so honourable, Moses reproves their ingratitude, because, leaving their heavenly Father, they prostituted themselves as deserters.</p></blockquote>

</figure><figure class="quote" id="q-dcf053489c" data-kw="">
<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.7, pp 7-8.</span></figcaption>

</figure><figure class="quote" id="q-0a4750d2de" data-kw="">
<blockquote><p>3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, p. 588</span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. This goodness is communicative. [There is] None so communicatively good as God. As the notion of God includes goodness, so the notion of goodness includes diffusiveness; without goodness He would cease to be a Deity, and without diffusiveness He would cease to be Good. The being good is necessary to the being God: For goodness is nothing else in the notion of it, but a strong inclination to do good; either to find or make an object wherein to exercise itself according to the propension of its own nature; and it is an inclination of communicating itself not for its own interest, but the good of the object it pitches upon. Thus God is good by nature and his nature is not without activity; He acts conveniently to his own nature. Ps. 119:68, ‘Thou art good and dost good.’ And nothing accrues to Him by the communications of Himself to others, since his blessedness was as great before the frame of any creature as ever it was since the erecting of the world; so that the goodness of Christ Himself increases not the luster of his happiness: Ps. 16:2, ‘My goodness extends not to Thee.’ He is not of a niggardly and envious nature; He is too rich to have any cause to envy, and too good to have any will to envy: He is as liberal as he is rich, according to the capacity of the object about which his goodness is exercised. The divine goodness being the supreme goodness, is goodness in the highest degree of activity; Not an idle, enclosed, pent up goodness, as a spring shut up or a fountain sealed, bubbling up within itself, but bubbling out of itself. A fountain of gardens to water every part of his creation; He is an ointment poured forth (Cant. 1:5). Nothing spreads itself more than oil and takes up a larger space, wheresoever it drops. It may be no less said of the goodness of God, as it is of the fulness of Christ, Eph. 1:23, ‘He fills all in all‘: He fills rational creatures with understanding, sensitive nature with vigor and motion, the whole world with beauty and sweetness. Every taste, every touch of a creature is a taste and touch of divine goodness. Divine goodness offers itself in one spark in this creature, in another spark in the other creature, and altogether make up a goodness inconceivable by any creature. The whole mass and extracted spirit of it is infinitely short of the goodness of the divine nature, imperfect shadows of that goodness which is in Himself.”

— Stephen Charnock, Several Discourses upon the Existence &amp; Attributes of God, … (d. 1680; London: Newman, 1682), Goodness of God, p. 588">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+This+goodness+is+communicative.+%5BThere+is%5D+None+so+communicatively+good+as+God.+As+the+notion+of+God+includes+goodness%2C+so+the+notion+of+goodness+includes+diffusiveness%3B+without+goodness+He+would+cease+to+be+a+Deity%2C+and+without+diffusiveness+He+would+cease+to+be+Good.+The+being+good+is+necessary+to+the+being+God%3A+For+goodness+is+nothing+else+in+the+notion+of+it%2C+but+a+strong+inclination+to+do+good%3B+either+to+find+or+make+an+object+wherein+to+exercise+itself+according+to+the+propension+of+its+own+nature%3B+and+it+is+an+inclination+of+communicating+itself+not+for+its+own+interest%2C+but+the+good+of+the+object+it+pitches+upon.+Thus+God+is+good+by+nature+and+his+nature+is+not+without+activity%3B+He+acts+conveniently+to+his+own+nature.+Ps.+119%3A68%2C+%E2%80%98Thou+art+good+and+dost+good.%E2%80%99+And+nothing+accrues+to+Him+by+the+communications+of+Himself+to+others%2C+since+his+blessedness+was+as+great+before+the+frame+of+any+creature+as+ever+it+was+since+the+erecting+of+the+world%3B+so+that+the+goodness+of+Christ+Himself+increases+not+the+luster+of+his+happiness%3A+Ps.+16%3A2%2C+%E2%80%98My+goodness+extends+not+to+Thee.%E2%80%99+He+is+not+of+a+niggardly+and+envious+nature%3B+He+is+too+rich+to+have+any+cause+to+envy%2C+and+too+good+to+have+any+will+to+envy%3A+He+is+as+liberal+as+he+is+rich%2C+according+to+the+capacity+of+the+object+about+which+his+goodness+is+exercised.+The+divine+goodness+being+the+supreme+goodness%2C+is+goodness+in+the+highest+degree+of+activity%3B+Not+an+idle%2C+enclosed%2C+pent+up+goodness%2C+as+a+spring+shut+up+or+a+fountain+sealed%2C+bubbling+up+within+itself%2C+but+bubbling+out+of+itself.+A+fountain+of+gardens+to+water+every+part+of+his+creation%3B+He+is+an+ointment+poured+forth+%28Cant.+1%3A5%29.+Nothing+spreads+itself+more+than+oil+and+takes+up+a+larger+space%2C+wheresoever+it+drops.+It+may+be+no+less+said+of+the+goodness+of+God%2C+as+it+is+of+the+fulness+of+Christ%2C+Eph.+1%3A23%2C+%E2%80%98He+fills+all+in+all%E2%80%98%3A+He+fills+rational+creatures+with+understanding%2C+sensitive+nature+with+vigor+and+motion%2C+the+whole+world+with+beauty+and+sweetness.+Every+taste%2C+every+touch+of+a+creature+is+a+taste+and+touch+of+divine+goodness.+Divine+goodness+offers+itself+in+one+spark+in+this+creature%2C+in+another+spark+in+the+other+creature%2C+and+altogether+make+up+a+goodness+inconceivable+by+any+creature.+The+whole+mass+and+extracted+spirit+of+it+is+infinitely+short+of+the+goodness+of+the+divine+nature%2C+imperfect+shadows+of+that+goodness+which+is+in+Himself.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+Several+Discourses+upon+the+Existence+%26+Attributes+of+God%2C+%E2%80%A6+%28d.+1680%3B+London%3A+Newman%2C+1682%29%2C+Goodness+of+God%2C+p.+588&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0a4750d2de.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0a4750d2de.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=3.%20This%20goodness%20is%20communicative.%20%5BThere,that%20goodness%20which%20is%20in%20Himself&amp;text=3.%20This%20goodness%20is%20communicative.%20%5BThere%20is%5D%20None&amp;text=shadows%20of%20that%20goodness%20which%20is%20in%20Himself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For here I observe, that men of learning in other respects have stumbled, who, when explaining the nature of those Sacraments, too incautiously blend things belonging to a quite different covenant. Nothing is here to be brought in which does not belong to the covenant of works, the promises of that covenant, and the duties of man under the same; all which are most distinct from the covenant of grace. Here we are to say nothing of Christ, nothing of justifying faith in him, nothing of our ceasing from our own works as impure, nor any thing of that rest after the miseries of this life. All these belong to another covenant. I do not, however, deny, that the unsearchable wisdom of God did appoint and order these symbols in such a manner that the remembrance of them, after the fall, might be able to instruct man in many things relating to the covenant of grace and its mediator. As that, according to Paul, the first Adam himself was a type of the second; Eve, curiously formed out of Adam’s rib while asleep, was a type of the church, as it were, taken from Christ in virtue of his death; and that the first marriage represented that great mystery which regards Christ and the church. These things, however, were neither known nor thought of in a state of nature; nor to be mentioned in a discourse on the Sacraments of the covenant of works. Having premised these things, let us now inquire into each particular with all the care possible, beginning with Paradise.</p></blockquote>

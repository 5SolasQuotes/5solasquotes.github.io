<main class="wrap"><figure class="quote" id="q-3b1cfb93cb" data-kw="">
<blockquote><p>Secondly, justification does connote a state and established condition of a man, and therefore is not frequently iterated, although it be continued. A man is not justified many times in a day, though sins be pardoned often in a day. It is true, God does continue to justify those that believe in Him, and if He should cease to do so, they would immediately fall into misery and guilt; but yet God does not renew or revive our justification, as if there were an interruption or intermission of it. That justification does denote an estate is plain by comparing it with all the other privileges God vouchsafes his people: regeneration and vocation denote a state the person is put into, so does glorification. As therefore sanctification is one thing, and those auxiliary actings of God’s grace are another thing, so that though we may say such a man has new quickening grace every day, yet we cannot say he has a new regeneration; so it is here: though we may say that every day the believer, begging the pardon of his daily infirmities, has a new pardon, yet he has not a new justification, because this denominates the state of a man. Neither can it be said that pardon of this sin or that sin puts a man into the state of God’s favor absolutely, but quoad hoc [so far as this]; the pardon of this or that sin does not make that universal righteousness of the person whereby he stands acquitted from all. It is true, some learned men call this daily remission of sin justificatio particularis [a particular justification]; but we are now treating of that universal justification whereby the person of a believer stands acquitted and disobliged from the guilt of all his sins he has committed. And great is the comfort of a Christian in that his justification is a state of favor with God; for hence flow many other inestimable benefits and advantages, which the believer is to study out and improve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’, p. 268</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82485833f0" data-kw="">
<blockquote><p>We do not deny (as the Papists falsely slander us) all inherent righteousness, 2 Cor. 5:17, nor all justification before God by inherent righteousness, 1 Kn. 8:32 [“Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.”]. But this we teach, that this inherent righteousness is not that righteousness whereby any poor sinner in this life can be justified before God’s Tribunal, for which he is pronounced to be innocent, absolved from death and condemnation, and adjudged unto eternal life. … Whether inherent justice be actual or habitual? Bishop Davenant, ch. 3, Of Habitual Righteousness, says a certain habitual or inherent justice is infused into all that are justified, Jn. 1:13; 2 Cor. 5:17; Gal. 6:15; 1 Cor. 6:11, 19; 2 Pet. 1:4. All those that are justified do supernatural works; Therefore, it is certain that they are endued with supernatural grace and holiness. We are said to be righteous, from this inherent justice we are said to be just, and that by God Himself, Gen. 6:9; Heb. 11:4; Lk. 1:61 &amp; 2:25; 1 Pet. 4:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, Of Justification, pp. 517-18 Leigh, though he says what he says below, nor Davenant, who is referenced, evidences a twofold justification as such.</span></figcaption>

<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

<blockquote><p>We honour God more than if we had the obedience that Adam had at first before the fall. For now in the covenant of grace, he will be glorified in his mercy, in his forgiving, forbearing, rich, transcendent mercy, and in going beyond all our unworthiness and sins, by showing that there is a righteousness provided for us, the righteousness of the God-man; whose obedience and satisfaction is more than our disobedience, because it is the disobedience of man only, but his obedience and righteousness is the obedience of God-man. So it satisfieth divine justice, and therefore ought to satisfy conscience to the full. Our faith must answer Christ’s carriage to us. We must therefore account ourselves in him ‘undefiled’, because he accounts us so. Not in ourselves, but as we have a being in him, we are undefiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of Christ</cite>, (1639; Edinburgh: Banner of Truth, 2011), p. 149.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Touching the subject or persons to whom it is appropriate, faith is the proper and peculiar gift of God’s elect, which only [alone] distinguishes them from the rest of the world; for all other graces, be they never so bright, or shining, are common with the reprobate; but faith, with the fruits thereof, is proper to the godly. Whereupon, (Tit. 1:1) it is called, The “faith of God’s elect”: for only they, and of them all and every one, are in their time, by virtue of God’s covenant, brought to believe (John 6:37). “Every one that the Father gives me, comes to me.” Else, in what better case are we now, then when the covenant of works did hold us, seeing it is as impossible of our selves, and by our own strength, to repent, and believe the gospel, (which is the condition of the covenant of grace) as it was to fulfill the law? Wherefore we must understand, that God, to speak properly, does not require the same, as a mutual re-stipulation of our part, as it was in the former covenant, where nothing is imposed which man’s nature could not wield: but here it is rather a declaration of his pleasure, what he would have us do, and whereunto he will enable us: not a condition to endanger the covenant, but an assurance that he will give us strength to keep it. So as the whole covenant properly and in truth rises of his part, and lies upon him: like his other covenant (brought to confirm this) with the sun and moon, and stars, whom (otherwise unable of themselves) he makes to run their course. But howsoever, all come from his only grace and virtue, yet to us that are not stocks and stones, but endued with a reasonable soul, understanding, will, and other faculties, this covenant is wont to be expressed, sometimes by words conditional, sometimes in commanding wise; that the greatness of the peril, and the difficulty of the precept might make us to bestir ourselves, to use with care and conscience the mean that he appoints, for the attaining of that precious gift, and to work together with God, when we are once wrought upon by his Spirit. And herein lies one other main difference between the law and the gospel, or the covenant of works, and this covenant of grace: The law only commands obedience, but gives no power to obey; and therefore is called, “the dead letter,” “written with ink,” and “in tables of stone,” ready indeed to be read and seen, but having no life in it to change the heart, which remains as stony as before. The Gospel not only commands, but gives faith and newness of life; and is therefore said to be written in our hearts, and called The ministration of the Spirit, because it gives the Spirit of Christ, and righteousness through him. The law therefore, pronouncing nothing but judgement and condemnation against us, as that which commands things impossible, by reason of our weakness, terrifies and amazes the conscience: In which respect it is called, “the ministry of death and condemnation.” Contrariwise, the gospel bringing glad tidings of peace and reconciliation, quiets and appeases the conscience (Rom. 5:1) “Being justified by faith, we have peace with God, through Jesus Christ our Lord.” Both parts of this difference are found (Rom. 10:5, 6, 7, 8). For Moses thus describes the righteousness which is of the law, that the man which does these things, shall live thereby. But the righteousness which is of faith, speaks on this wise, “Say not in your heart, ‘who shall ascend into heaven?’ That is to bring Christ from above. Or, ‘Who shall descend into the deep?’ That is, to bring Christ again from the dead. But what says it? The word is near you, even in your mouth and in your heart. This is the Word of Faith which we preach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Summe of Sacred Divinite</cite>, (London, 1620), 406–08. [spelling and punctuation modernized]</span></figcaption>

</figure><figure class="quote" id="q-bd24c07e16" data-kw="">
<blockquote><p>But we must remember that our new obedience, which is the fruit of our redemption, standeth in the study of piety, that is, in the truth of our desires, uprightness of our will, and purpose, sincerity of our care and endeavours, rather then in the perfect performance, the Lord in his children accepting the will for the deed.

By which desire, will, and endeavour, though we do not perfectly fulfil the law, yet we may be truly said to keep it. And if we have this unfained desire, sincere purpose, and upright endeavour to please God in the duties of piety and charity; we shall be accepted of God, according to the covenant of grace, as true worshippers of God in holiness &amp; righteousness. This caution is carefully to be remembered; otherwise, the greatest part of true Christians might seem to be excluded out of the covenant of grace, and out of the number of them that are redeemed by CHRIST.</p></blockquote>

<blockquote><p>Now, what is the foundation of this, that God is our God in the covenant of grace? We say it is founded on Christ. God is Christ’s God, and then our God; and that is the reason why Christ is called ‘Immanuel’, which is as much as to say, as it is expounded, ‘God with us’.

Not only because when he took our nature on him, there was God and man in one person; but the meaning of the word is, Christ is Immanuel, ‘God with us’; by being God in our nature, and satisfying divine justice in our nature, hath brought God the Father and us into a sweet covenant. So that God may be our God and our Father, notwithstanding his justice; because all is satisfied by Christ, who took our nature to die for us.

Christ is Immanuel, because he hath made God and us one. So that God is our God, and not only so, but our Father is him. Thus you see how it cometh to pass that God is our Father by Christ, who came to bring us again to God, as his whole office was to bring a few that had been singled out of mankind to God again, from whom they fell; for we all had communion with God in Adam, but we lost it; and now must be brought again to God, which must be done by Christ, God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference</cite>, (1654; Edinburgh: Banner of Truth, 2015), pp 114-15.</span></figcaption>

<blockquote><p>The strength, we see, of the consolation depends upon the stability of the covenant: and is God’s covenant made more firm by an oath than by a promise? The truth of God is as his nature, without variableness or shadow of changing; and can it then be made more immutable? Certainly as to infiniteness in regard of accession, so unto immutability in regard of firmness, there cannot be any accession of degrees, or parts; all immutability being nothing else but an exclusion of whatsoever might possibly occur to make the thing variable and uncertain. So then the oath of God doth no more add to the certainty of his word, than do men’s oaths and protestations to the truth of what they affirm; but because we consist of an earthly and dull temper, therefore God, when he speaks unto us, doth ingeminate his compellations, “O earth, earth, earth, hear the Word of the Lord.”

So weak is our sight, so diffident our nature, as that it seems to want the evidence of what it sees. Peradventure God may repent him of his promise, as he did sometime of his creature. Why should not the covenant of grace be as mutable as was that of works? God promised to establish Sion for ever; and yet Sion, the city of the great God, is fallen. Was not Shilo beloved; and did not God forsake it? Had not Coniah been as the signet of his hand, and has he not yet been cast away? Was not Jerusalem a vine of God’s planting, and hath not the wild boar long since rooted it up? Was not Israel the natural olive, that did partake of the fat and sweetness of the root, and is it not yet cut off, and wrath come upon it to the uttermost.

Though God be most immutable, may he not yet alter his promise? Did the abrogation of ceremonies prove any way a change in him, who was as well the erector as the dissolver of them. Though the sun be fastened to his own sphere, yet may he be moved by another orb. What if God’s promise, barely considered, proceed from his antecedent and simple way of benevolence towards the creature; but the stability and certainty of his promise in the event depend on a second resolution of his consequent will, which presupposeth the good use of mine own liberty?

May not I then abuse my free-will, and so frustrate unto myself the benefit of God’s promise? Is not my will mutable, though God’s be not? May not I sink and fall, though the place on which I stand, be firm? May not I let go my hold, though the thing which I handle, be itself fast! What if, all this while, I have been in a dream, mistaking mine own private fancies and mis-persuasions for the dictates of God’s Spirit? mistaking Satan (who useth to transform himself) for an angel of light! God hath promised, it is true, but hath he promised unto me? Did he ever say unto me, “Simon, Simon,” or “Saul, Saul,” or “Samuel, Samuel?” Or if he did, must he needs perform his promise to me, who am not able to fulfil my conditions unto him?

Thus, as unto men floating upon the sea, or unto distempered brains, the land and house, though immovable, seem to reel and totter; or as unto weak eyes, every thing seems double;—so the promises of God, however built on a sure foundation, his counsel and fore-knowledge, yet unto men, prepossessed with their own private distempers, do they seem unstable and frail, unto a weak eye of faith, God’s covenant to be (if I may so speak) double, to have a tongue and a tongue, a promise and a promise, that is, a various and uncertain promise.

And for this cause (notwithstanding diffident and distrustful men do, indeed, deserve what they suspect, and are worthy to suffer what they unworthily do fear) doth God yet, in compassion towards our frailty, condescend to confirm his promises by an oath, to engage the truth of his own essence for performance, to seal the patent which he hath given with his own blood, and to exhibit that seal unto us so often, as, with faith, we approach unto the communion of these holy mysteries. And who can sufficiently admire the riches of this mercy, which makes the very weaknesses and imperfections of his church, occasions of redoubling his promises unto it?</p></blockquote>

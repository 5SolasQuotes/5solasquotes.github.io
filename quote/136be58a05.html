<blockquote><p>Indeed the notion of God as simple, as Him being pure act, and as thus being perfect in terms of having no potentiality, is an obvious point of continuity between Thomas and the Reformed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/carl-trueman.html">Carl Trueman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reception of Thomas Aquinas in Seventeenth-Century Reformed Orthodoxy &amp; Anglicanism’ in The Oxford Handbook of the Reception of Aquinas</cite>, p. 212</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-711b1f206b" data-kw="">
<blockquote><p>Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another. 2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things. 3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation. 5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels. 6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number. 7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows: 1. That whatsoever is in God, is God. 2. Whatsoever God wills He willed from eternity and always wills. 3. Whatsoever God wills, He wills simply, absolutely and independently. 4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.</p></blockquote>

</figure><figure class="quote" id="q-20c3a53900" data-kw="">
<blockquote><p>For suppose we agree that its [God’s] existence involved no actualization of potential. Might not we still say that its activity involved the actualization of potential? Might not we thus say that while it had no potentialities with respect to its existence, it does have potentialities with respect to its activity (such as its activity of actualizing the existence of other things)? There are several problems with this suggestion, however, one of which might be obvious now that we have set out the principle agere sequitur esse [action follows being], according to which what a thing does reflects what it is. If the first cause of things exists in a purely actual way, how could it act in a less than purely actual way? How could its acting involve potentiality any more than its existence does? A thing’s existence is, after all, what is metaphysically most fundamental about it; everything else follows from that. In this case we are talking about something whose very existence is purely actual and devoid of potentiality. So, from where in its nature are the (metaphysically less fundamental) potentialities for activity that the critic suggests it has supposed to derive? Another problem with the suggestion in question is that to say of God that he has potentiality with respect to his activity, though not with respect to his existence, entails that God has parts—a purely actual part, and a part that is a potentiality. Now, as we saw in chapter 2, whatever has parts requires a cause. The reason is that the whole of which the parts are constituents is merely potential until actualized by some principle which combines the parts. This principle cannot be something intrinsic to the thing, for in that case it would be the cause of itself, which is incoherent. So, it must be something extrinsic to the thing. Keep in mind that this is true even if we think of the thing in question as having always existed, since we still need some explanation of why the parts are combined at all regardless of how long they have been combined. Even if the thing had no temporally prior cause, it would still require an ontologically prior cause. But to say of the first cause of things that it has a cause of its own is also incoherent, since if it has a cause of its own, it just isn’t really the first cause at all, and it isn’t what terminates the regress of a hierarchical series of the causes of the existence of things. For this reason too, then, there isn’t any sense to be made of the idea that God qua [as] first cause has potentialities with respect to his activity. So, again, God is purely actual, with no potentiality at all.</p></blockquote>

he+cause+of+itself%2C+which+is+incoherent.+So%2C+it+must+be+something+extrinsic+to+the+thing.+Keep+in+mind+that+this+is+true+even+if+we+think+of+the+thing+in+question+as+having+always+existed%2C+since+we+still+need+some+explanation+of+why+the+parts+are+combined+at+all+regardless+of+how+long+they+have+been+combined.+Even+if+the+thing+had+no+temporally+prior+cause%2C+it+would+still+require+an+ontologically+prior+cause.+But+to+say+of+the+first+cause+of+things+that+it+has+a+cause+of+its+own+is+also+incoherent%2C+since+if+it+has+a+cause+of+its+own%2C+it+just+isn%E2%80%99t+really+the+first+cause+at+all%2C+and+it+isn%E2%80%99t+what+terminates+the+regress+of+a+hierarchical+series+of+the+causes+of+the+existence+of+things.+For+this+reason+too%2C+then%2C+there+isn%E2%80%99t+any+sense+to+be+made+of+the+idea+that+God+qua+%5Bas%5D+first+cause+has+potentialities+with+respect+to+his+activity.+So%2C+again%2C+God+is+purely+actual%2C+with+no+potentiality+at+all.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God+%28Ignatius+Press%2C+2017%29%2C+%E2%80%98The+Divine+Attributes%E2%80%99%2C+%E2%80%98Unity%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20c3a53900.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/20c3a53900.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-god-as-pure-act/#:~:text=For%20suppose%20we%20agree%20that%20its,actual%2C%20with%20no%20potentiality%20at%20all." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26ebf9e579" data-kw="">
<blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>

<blockquote><p>Immutability is a glory belonging to all the attributes of God. It is not a single perfection of the divine nature. There is not one perfection but may be said to be, and truly is, immutable; none of them will appear so glorious without this beam, the sun of immutability, which renders them highly excellent without the least shadow of change.</p></blockquote>

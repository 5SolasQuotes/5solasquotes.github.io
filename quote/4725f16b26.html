<blockquote><p>AS S. Gregory said, plus debeo Thomae, quam Petro, I am more indebted to Thomas then Peter, because his doubting of Christ’s resurrection occasioned a more sensible demonstration thereof then otherwise we should have had: so truly I may say, we are much beholding to him, who first moved the scruple concerning the imputation of Christ’s sole satisfaction; for it hath occasioned the resolution, not only of that doubt, but of many other concerning the communicatio idiomatum, the effects of the hypostatical union, the nature of the law, and the faithful’s title to heaven.

It is true, there hath been some clashing among the worthy Members of this [Westminster] Assembly: but it hath been like the collision of steel and flint, whereby have been struck out many sparks of divine and saving truth. Nothing seemeth to me now to hinder the putting the question to the vote and determining it ex voto, according to our desire, but the vindication of it from aspersions cast upon it by four sorts of miscreants, the Antinomians, the Papists, the Arminians, and Socinians.

First, the Antinomians object, if Christ’s active righteousness be imputed unto us, then are not we bound to keep the law, because Christ hath kept it for us. This objection may be assoiled [acquitted] with a double answer: first, that this active obedience of Christ is imputed to none but true penitents. For though repentance be no cause of our justification, yet it is conditio requisita in subjecto, a condition required in the subjects and to believe the remission of our sins, by imputation of Christ’s satisfaction and righteousness without a sincere and serious purpose to forsake all our transgressions, and walk in newness of life, is an act, not of Faith, but of presumption.

Secondly, I grant, that Christ’s righteousness being imputed to us, we are not bound to fulfill the law hoc nomine to justify us before God, or procure us a title to the Kingdom of Heaven: but for other ends, namely, to glorify God, obey his will, to testify our thankfulness to our Redeemer, to shew our faith by our works, to make our election sure to our selves, to adorn our profession with a holy conversation, to avoid scandal, and avert God’s judgements.

Secondly, the Papists object, if Christ’s active obedience be imputed to us, then either the whole, or a part of it: not a part, for that will make us righteous but in part: not the whole, for then no other should have share in it, but our selves; and every particular believer should be as righteous as Christ himself, and every one as another.

But this objection may be assoiled [acquitted] by a three-fold answer. First, there is a double totum or whole, totum extra quod nihil est, &amp; totum cui nihil deest: a whole out of which there is nothing; as the whole water is in the basin; and a whole to which nothing is wanting, as the whole soul is in every part of the body; for the soul is tota in toto, and tota in qualibet parte. Christ’s whole obedience in the first sense is imputed to us, not in the second. 2. All believers, according to the speech of Luther, are aeque justi ratione justitiae imputatae, equally just in respect of imputed justice, though not inhaerentis, of inherent; in respect of passive, not active righteousness.

Thirdly, aeque pronunciamur justi, ut Christus; we are equally pronounced just, as Christ; that is, we are as truly acquitted and absolved as he; sed non pronunciamur aeque justi, but not pronounced equally just: for his justice was inherent, our’s imputed; his from himself, ours from him; his of infinite worth, sufficient to justify all believers; ours of finite, and sufficient only for our selves.

The Arminians object, if … the very act of believing justify us, then not Christ’s imputed righteousness. But the very act of believing justifieth, as the Apostle saith, Abraham believed, and it was counted to him for righteousness. To this I answer, that saith may be considered either ratione actus, or ratione objecti, in regard of the act, or of the object. Faith justifieth not ratione actus, for then some work should justify; but ratione objecti, not in regard of the act, but in regard of the object; as the spoon feeds the child, in regard of the milk in it; and the surgeons hand heals, in regard of the playster he applies: those that were healed by looking upon the brazen serpent, were not cured by the sharpness of their sight, for the purblind were as well healed as the sharp-sighted, but by a supernatural virtue at that time given to the object, the brazen serpent, a type of Christ.

The Socinians object, God doth not justify man by an act of injustice: but it is injustice to punish one man for another, or attribute one man’s righteousness to another: for, justitiae est suum cuique tribuere, it is the office or property of justice to give to every man his own; therefore we are not justified by the imputation of Christ’s active or passive obedience. But this objection may be assoiled [acquitted] with a double answer.

First it is not against justice, but agreeable to justice, to lay the debt or penalty of one man upon another, in case that one man voluntarily undertake for the other, and becomes his surety: as it was just to lay Cimon in the gaol for his father Miltiades debt, after he engaged himself for it, and made it his own: neither was it unjust to put out one of Zaleuchus his eyes for his son’s adultery, after he undertook to satisfy for his son, and to save him one eye, who otherwise should have lost both. Secondly when God imputes Christ’s righteousness unto us, he gives us our own, namely, that which Christ hath purchased for us by his death: and secondly in regard of our union with Christ, whatsoever is Christ’s in this kind, is ours, and Rom 5. he that hath given Christ to us, hath given his righteousness also.</p></blockquote>

<blockquote><p>Justification does not come by keeping the whole law or any part of it, nor is it given on the basis of uncircumcision, the laws of nature or any other traditions. Here we see the opinion of those who say that before the law was given, our ancestors were justified by the laws of nature, but that after the law was given, they were justified by the laws of Moses and nowadays we are justified by the gospel and the other laws that we have.

To counter this idea, we must firmly insist that there has always been only one and the same form of justification, which consists of faith. In this verse [Galatians 5:6] Paul removes every privilege of the flesh and thus everything else as causes of righteousness, apart from faith, the promise, the gospel and so on. To express all this the apostle uses two words, circumcision and uncircumcision, in order to make Jews and Gentiles equal to one another and proclaim that both are justified for exactly the same reasons. …

Faith is effective through love. Once it has obtained righteousness, it is neither slow nor lazy in doing other good works of charity. If faith justified us through love or by the addition of love, our righteousness would be uncertain because nobody would know at what point he had loved enough to obtain righteousness.</p></blockquote>

— Erasmus Sarcerius, In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 176.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+does+not+come+by+keeping+the+whole+law+or+any+part+of+it%2C+nor+is+it+given+on+the+basis+of+uncircumcision%2C+the+laws+of+nature+or+any+other+traditions.+Here+we+see+the+opinion+of+those+who+say+that+before+the+law+was+given%2C+our+ancestors+were+justified+by+the+laws+of+nature%2C+but+that+after+the+law+was+given%2C+they+were+justified+by+the+laws+of+Moses+and+nowadays+we+are+justified+by+the+gospel+and+the+other+laws+that+we+have.%0A%0ATo+counter+this+idea%2C+we+must+firmly+insist+that+there+has+always+been+only+one+and+the+same+form+of+justification%2C+which+consists+of+faith.+In+this+verse+%5BGalatians+5%3A6%5D+Paul+removes+every+privilege+of+the+flesh+and+thus+everything+else+as+causes+of+righteousness%2C+apart+from+faith%2C+the+promise%2C+the+gospel+and+so+on.+To+express+all+this+the+apostle+uses+two+words%2C+circumcision+and+uncircumcision%2C+in+order+to+make+Jews+and+Gentiles+equal+to+one+another+and+proclaim+that+both+are+justified+for+exactly+the+same+reasons.+%E2%80%A6%0A%0AFaith+is+effective+through+love.+Once+it+has+obtained+righteousness%2C+it+is+neither+slow+nor+lazy+in+doing+other+good+works+of+charity.+If+faith+justified+us+through+love+or+by+the+addition+of+love%2C+our+righteousness+would+be+uncertain+because+nobody+would+know+at+what+point+he+had+loved+enough+to+obtain+righteousness.%E2%80%9D%0A%0A%E2%80%94+Erasmus+Sarcerius%2C+In+Epistolas+Divi+Pauli+ad+Galatas+et+Ephesios+Annotationes%2C+%28Frankfurt%2C+1542%29.+Quoted+in+Gerald+L.+Bray%2C+Timothy+F.+George%2C+Scott+M.+Manetsch+%28eds%29%2C+Reformation+Commentary+on+Scripture+X%3A+Galatians%2C+Ephesians+%28Downers+Grove+IL%3A+IVP+Academic%2C+2011%29%2C+p.+176.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F285b3777e4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/285b3777e4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/24/erasmus-sarcerius-on-justification-by-faith-not-the-law-of-nature-nor-of-moses/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-155e914340" data-kw="">
<blockquote><p>We acknowledge, then, that as soon as any one is justified, renewal also necessarily follows: and there is no dispute as to whether or not Christ sanctifies all whom he justifies. It were to rend the gospel, and divide Christ himself, to attempt to separate the righteousness which we obtain by faith from repentance.</p></blockquote>

</figure><figure class="quote" id="q-9fc4b13214" data-kw="">
<blockquote><p>WHAT FAITH IS.

FAITH is a sure persuasion and an undoubted belief of the heart in the merciful promises of God, made to all faithful penitent sinners in Christ’s blood, and freely performed of God the Father for Christ’s sake.

WHAT BENEFITS WE RECEIVE OF GOD THROUGH FAITH.

By faith we, which afore by nature were the children of wrath, are made the sons and children of God. …

By faith we, which afore were sinners, are justified and counted righteous in the sight of God for Christ’s sake. …

By faith Christ’s fulfilling of the law is counted our fulfilling. …

By faith our works are allowed before God for Christ’s sake. …

By faith everlasting life is given unto us for Christ’s sake. …</p></blockquote>

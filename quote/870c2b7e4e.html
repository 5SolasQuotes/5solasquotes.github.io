<blockquote><p>If we look into Rom. 8.22. we shall find that the whole creation is said to groan: for indeed the Bondage of Corruption, the burden of sin is very heavy and grievous: but, if we consider aright, we shall perceive, that tis Man, which hath drawn this burden upon the Creature; tis Man, that is out of order; Man, that is corrupted; Man, that is grown as old in sin as the world in years: and therefore tis Man, that must be set right again; tis He, that must be cleansed; tis He, even sinful Man, that must become New. And indeed if He be once right, then are all things well: if Man be once Renewed, there is nothing any longer Old: for He hath, as it were, all other things contained in Him; being (as he is called) that Microcosm, or lesser world, the Epitome of nature and of the works thereof; so that if He be New, then are all things so.

Now Man is said to become New; first Inwardly in the Root, by Justification; and thus are Infidels, men not called before, said to become New, when by the power of Gods spirit they are converted to the faith of Christ. Next, Outwardly in the Fruit, by sanctity and holiness in life; and thus are the Regenerate, the Justified members of Christ, again said to become New, when, leaving the deceitfulness and allurements of sin, they devote themselves unto God in a renewed conversation, by conforming their lives unto His word as the rule thereof.</p></blockquote>

<blockquote><p>And first, as to His work of active obedience. In being made “under the law” He had become bound as the covenant head and representative of His chosen people, to fulfil all righteousness. The law under which He had thus placed himself, was obviously that very law which God gave to Israel in the wilderness.

He could not redeem Israel from the law to which they were subject, by taking upon himself the obligations of some other or different law. They, beyond all question, were under the law engraven on the tables of stone; and only by taking up the same position could He meet the necessities of their case.

Equally obvious and certain it is, that if the law as given to Israel was a merely Jewish law — if it was a law the obligation of which rested on that people alone, and which was to be done away so soon as their peculiar economy came to an end — then, and in that case, the obedience which Christ rendered to that law, could be of no avail to justify any but the Jews. On the footing of such a view of the law, Christ could not be, as He actually is, “the end of the law for righteousness to every one that believeth,” (Rom. x. 4); but only to every Jew that believeth.

It is true, indeed, that the righteousness which Christ wrought out, went unspeakably beyond the righteousness of the Scribes and Pharisees. It was the law as interpreted by the Sermon on the Mount, whose righteousness He fulfilled — a righteousness which looked not to actions merely, but to the motives in which they originated, and to the spirit in which they were performed — a righteousness which looked to the very thoughts and intents of the heart. But by the commentary upon the law which the Sermon on the Mount presents, there is not so much as one jot or tittle added to the law, as given to Israel at Sinai.

That commentary showed the law to be “exceeding broad;” but the Psalmist, long before, had pronounced it to be so; and all that broadness was embraced in the Ten Commandments. That commentary showed the law to be “spiritual,” as Paul subsequently testified that it is; but all that spirituality was inherent in it from the first. There may be a show and semblance of putting honour upon Christ, in disparaging the Decalogue — the law as embodied in the Ten Commandments, — and in speaking of the law as abrogated, or at the very least absorbed by the Gospel.

But so to disparage the Decalogue, is simply to disparage the work of Christ. It was the righteousness of that very Decalogue which He fulfilled. It was that very Decalogue, the sum and essence of all whose commandments, the Lord was setting forth, when He said by Moses to His people of old—”Hear, O Israel; the Lord our God is one Lord: and thou shalt love the Lord thy God with all thine heart, and with all thy soul, and with all thy might,” (Deut. vi., 4, 5).

And was it not of His own perfect obedience to that very command Christ was speaking, when He said to His disciples, beside the well in Samaria — “My meat is to do the will of Him that sent Me, and to finish His work,” (John iv. 24). Christ had no other gods before that one only living and true God. He worshipped that God in spirit and in truth. He hallowed that God’s name. He remembered the Sabbath-day to keep it holy — He honoured His parents according to the flesh. He loved His neighbour as himself — for he went about doing good — and in all the relations of life, He was holy, harmless, undefiled, and separate from sinners.

What David said typically, Christ could say in the strictness and fulness of literal truth, “I delight to do Thy will, O my God: yea, Thy law is within my heart,” (Psa. xl., 8). It is impossible, in a word, to point to so much as one solitary act or utterance of that holy and spotless life which He led on earth, from the cradle to the cross, that is not included in the righteousness of the law as given to Israel on the two tables of stone. It was that law that was in His heart; and it was that law, the holiness, justice, and goodness of which was exemplified in His life. In Him “there was no sin,” because in Him there was no transgression of that law’s commands. And it is in virtue of His perfect obedience to that law in our stead that this is the name by which He is called — “the Lord our Righteousness.</p></blockquote>

<blockquote><p>XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), p. 6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?”

— Joshua Placeus, ‘Theological Theses on the Justification of Man before God’, (1634), p. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXX.+We+are+justified+by+that+righteousness+alone+by+which+our+Surety+was+freed+from+our+guilt.+But+He+was+fully+freed+from+our+guilt+by+the+power+of+the+satisfaction+which+He+rendered+on+our+behalf%3B+therefore%2C+by+that+same+righteousness+alone%2C+we+too+are+fully+justified.+Who+would+deny+that%2C+when+the+debt+owed+by+us+is+paid%2C+the+handwriting+that+was+against+us+%28Col.+2%3A14%29+is+erased%2C+and+we+are+no+longer+liable+to+our+creditor%3F+That+by+the+same+righteousness+by+which+we+are+redeemed+from+condemnation+and+the+curse+of+the+law+%28Gal.+3%3A13%29%2C+we+are+also+justified%3F+That+by+the+same+satisfaction+by+which+divine+justice+was+perfectly+satisfied+for+us%2C+and+by+which+we+were+so+reconciled+to+God+that+He+adopted+us+as+sons+and+heirs%2C+God+is+now+completely+propitiated+toward+us%3F+That+by+the+same+propitiation+by+which+our+sins+were+fully+expiated+and+cleansed%2C+we+now+obtain+the+right+of+access+into+the+Temple+of+God%3F%E2%80%9D%0A%0A%E2%80%94+Joshua+Placeus%2C+%E2%80%98Theological+Theses+on+the+Justification+of+Man+before+God%E2%80%99%2C+%281634%29%2C+p.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b0386e2f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6b0386e2f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=XXX.%20We%20are%20justified%20by%20that,access%20into%20the%20Temple%20of%20God&amp;text=XXX.%20We%20are%20justified%20by%20that%20righteousness%20alone&amp;text=right%20of%20access%20into%20the%20Temple%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-142b2e2d78" data-kw="">
<blockquote><p>You will be on all occasions improving the righteousness of Christ by faith, for all the ends and uses of it which I mentioned, when discoursing of the excellency of this righteousness. You will improve it as a ransom unto justice, to deliver you from going down to the pit; you will improve it as a laver, to wash you from going down to the pit; you will improve it as a laver, to wash you from sin and from uncleanness; as a spiritual banquet, on which you will feed your hungry souls, for it is meat indeed and drink indeed; as a robe to cover your nakedness, and the best robe whereby to appear in the presence of God; as a shade to defend you from the scorching heat of the fiery law, or an awakened conscience; as a refuge to shelter you when pursued by avenging justice; as a ladder by which you will ascend unto communion with God, here and hereafter; and as the only title and foundation of your claim to eternal life.

Thus, I say, you will be constantly improving the righteousness of Christ by faith, for some of these ends and uses; and in this sense we may understand that word of the apostle, Rom. i. “The righteousness of God revealed from faith to faith.” It is that which faith fastens upon at first for justification, and it is that which faith is continually afterwards applying for some good use or other, in the soul’s progress in the way to glory.</p></blockquote>

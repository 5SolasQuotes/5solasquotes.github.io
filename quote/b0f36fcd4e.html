<main class="wrap"><figure class="quote" id="q-b0f36fcd4e" data-kw="">
<blockquote><p>Many things are ascribed to God only, by reason of a special and admirable act of providence — as the saving of the world by Christ, the giving of Canaan to Israel, the bringing his people out from Egypt and from Chaldee, the sending of the gospel to both Jew and Gentile, etc.; but, shall we say that God did none of these things by the ministry of men, and weak and frail men?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-858e5287fa" data-kw="Author of sin">
<blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 27 (on providence)</span></figcaption>

</figure><figure class="quote" id="q-7df9615162" data-kw="Permission Author of sin">
<blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

</figure><figure class="quote" id="q-d43476860a" data-kw="">
<blockquote><p>All the acts necessary for war-making are, in an eminent manner, ascribed to God, as (1) The Lord fights for his own people. (2) The Lord scattered the enemies. (3) The Lord slew Og, king of Bashan. (4) The battle is the Lord’s. (5) The victory [is] the Lord’s; therefore Israel never fought a battle. So Deut. 32[:10], The Lord alone led his people — the Lord led them in the wilderness — their bow and their sword gave them not the land. God wrought all their works for them (Isa. 26:12), therefore Moses led them not; therefore the people went not on their own legs through the wilderness; therefore the people never shot an arrow, never drew a sword. It follows not. God did all these as the first, eminent, principal and efficacious pre-determinator of the creature (though this Arminian and popish prelate [John Maxwell] mind not so to honour God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 18</span></figcaption>

<main class="wrap"><figure class="quote" id="q-37425e9073" data-kw="">
<blockquote><p>But all who are righteous in the primary, evangelical sense of the word, are also holy in their dispositions. The relative change made on their state by justification, is accompanied by a real change on their hearts, effectuated by Divine power through the instrumentality of the word. By means of the light of divine knowledge, which is made to pervade the whole soul, not only are their consciences pacified, but their hearts are purified, rectified, and reduced to a cheerful conformity to the eternal law of righteousness.

Examine yourselves by this test. Are your hearts right with God, and sound in his statutes? Do you love him supremely? is it your desire to please him in all things? Do you esteem his commandments concerning all things to be right, and hate every false and wicked way? Have your affections been disengaged from the world, and set on things above, where Christ is?

In fine, the righteous have a holy practice regulated by the moral law. Instead of considering themselves as released by their redemption from any moral duty, they judge that they are laid under new and stronger obligations to holiness in all manner of conversation. “They are righteous before God, walking in all his commandments and ordinances blameless.” Try yourselves by this. Is your obedience universal and unexceptioned? Do you exercise yourselves to have consciences void of offence toward God and toward man?

“Little children, let no man deceive you: he that doth righteousness is righteous, even as he is righteous. In this the children of God are manifest, and the children of the devil. Whosoever doth not righteousness is not of God, neither he that loveth not his brother.” In many things you are conscious of offending, but you do not live in the allowed transgression of any divine precept; you feel that sin dwells in you and obtains the mastery for a time over the better part of your nature, but you are engaged in a constant warfare against it, abhor yourselves so far as you are involved in its pollutions, and long for the time when you shall be completely set free from its power.

Does your character, gospel hearers, answer in any good degree to the description which has been given? If not, then you are among the unrighteous; and you must die their death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Death of the Righteous in Sermons</cite></span></figcaption>

<blockquote><p>Bodies are in places circumscriptively bounded by their dimensions without penetration. Angels are in places definitively, that is, though they are not bounded by dimensions of height, breadth and depth, as bodies, yet they are not in two places at once; whilst they are in this place, they are not in another. God is in every place always.</p></blockquote>

</figure><figure class="quote" id="q-3deccb32a6" data-kw="">
<blockquote><p>Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11), angels, by reason of the quickness and strength of their understanding, apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>

</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

<blockquote><p>Evangelical,” on the other hand, although it is a fine term, does not quite seem to designate clearly enough the position of those who hold specifically to the system of doctrine taught in the Westminster Confession of Faith, as distinguished from other systems which are near enough to the truth in order that they may be called “evangelical” but which yet fall short of being the system that is contained in God’s Word.</p></blockquote>

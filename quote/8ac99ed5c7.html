<main class="wrap"><figure class="quote" id="q-8ac99ed5c7" data-kw="">
<blockquote><p>And secondly, whereas they allege that we let the wicked continue in our Church without separation, whereas we should cut them off when we find them to be hypocrites. I answer: We doe separate, as much as in us lies, for we labor to have them separated from us, and also we labor to separate ourselves from them. First, we labor their separation from us, desiring their removal, bewailing their wickedness, and our condition that live in Mesech and Kedar, and reproving them for their sins; and if that will not serve, complaining against them to those that are in authority, that they may bee excommunicated, and withal we are instant with God by prayer to stir up the hearts of such as are in authority to execute his ordinances upon them: we do what we can to separate them from us, and it comes sometime to pass, that many are so separated from us; but if they should not, that indeed were the Churches sin, and a foul sin too; yet it destroyes not the true being of our Church. Secondly, if we cannot get them separated from us, yet we separate ourselves from them, and that is the separation that the Scripture so much beats upon in private persons, as we are more conscionable, so we doe more separate from them, from their wills, affections and courses; yea, we must separate as much as conveniently we may from their persons, at least from their sins, which for our parts we are persuaded to be the chief separation that the Scripture intends. Yea, but this is a secret separation, say they, under hand, not openly known. Nay, this is a notorious and known separation: For first, it is ingenuously professed on our part, to the moving of their after-hatred and despite against us; we disclaiming them that are lewd, swearing and profane wretches, and that openly, not caring who know it; and likewise it is known on their part, they upbraiding us therefore very reproachfully, with the names of Puritans, Precisions, holy Brethren, and such like, because we will not accompany with them; if this be not an holy and a plain separation, what is?… Yea, but say they, ye should separate from them in the assemblies, from the Word and the sacraments? I answer: Rather the wicked should separate from us in these things: where the assembly and business are naught in themselves, as at playhouses and such like, there the good must separate: but where the assembly and business is good in itself, there the bad must separate; and the reason is good, for it is none of theirs, and the good must tarry and be present, for it is their own right; and it is sin to refuse God’s ordinances for the pollution of others, 1 Sam. 2:17, 24… yet our holiness being true in us, and openly professed and practiced, it shall be enough to make us a true visible Church, yea, and an holy congregation in God’s acceptation, and in the charitable estimation of our brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 1, Lecture 12; pp. 208-9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12a7c3447d" data-kw="">
<blockquote><p>The most significant attempts to overcome religious division between the old church and those desiring reformation were those colloquies that the emperor called at the level of the Holy Roman Empire of the German Nation. They took place in a twenty-year period beginning in 1540. Thereafter this type of imperial colloquy faded because the Religious Peace of Augsburg (1555) guaranteed adherents of the Augsburg Confession legal protection within the boundaries of their own territories. This essentially rendered further Catholic-Evangelical colloquies superfluous.</p></blockquote>

<blockquote><p>There is no doctrine objectively of absolute necessity to salvation, but the doctrine of the Baptismal Covenant which is expounded in the [Apostles’] Creed, Lord’s prayer and Decalogue. But there is much doctrinal and active means necessary to make men uUnderstand, Believe, Love and Practice this necessary Covenant doctrine. And the doctrine or articles of faith, will save none that do not understand, believe, love, and practise it, and that sincerely preferring the things revealed before all the pleasures, riches and honors of this world. A parrot shall not be a saint for saying the Creed.</p></blockquote>

<blockquote><p>…the business about Easter and ceremonies… ordinarily such debates pretend some lawfulness or unlawfulness in the thing contended for and are to be counted amongst the jangling debates that the men of God are to eschew… 1. That, as there is a necessity of suffering some difference in doctrine, so is there also a necessity to bear with some differences in circumstances in the external manner of worship, etc. and men would not soon offend at every difference, nor be displeased if it proceed not from affectation of singularity, unfaithfulness or some other corrupt rise. And we will find great condescendency in the greatest men both of old and late in things that are not sinful in themselves for keeping of union in the Church: and thus far the apostles’ practice of becoming all things to all will warrant. Zanchius in an epistle to this purpose gives both many examples of and reasons for this. 2… the condemning of the way and manner used by others as having some great absurdity in it, and the pressing of their way, even in circumstances, upon others; These and such things are to be eschewed: and so indeed there is no way to peace in these things but to forbear; for it is more easy to forbear some new thing than to make others alter what is old, except there be some reason in the matter to move to this.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the business about Easter and ceremonies… ordinarily such debates pretend some lawfulness or unlawfulness in the thing contended for and are to be counted amongst the jangling debates that the men of God are to eschew… 1. That, as there is a necessity of suffering some difference in doctrine, so is there also a necessity to bear with some differences in circumstances in the external manner of worship, etc. and men would not soon offend at every difference, nor be displeased if it proceed not from affectation of singularity, unfaithfulness or some other corrupt rise. And we will find great condescendency in the greatest men both of old and late in things that are not sinful in themselves for keeping of union in the Church: and thus far the apostles’ practice of becoming all things to all will warrant. Zanchius in an epistle to this purpose gives both many examples of and reasons for this. 2… the condemning of the way and manner used by others as having some great absurdity in it, and the pressing of their way, even in circumstances, upon others; These and such things are to be eschewed: and so indeed there is no way to peace in these things but to forbear; for it is more easy to forbear some new thing than to make others alter what is old, except there be some reason in the matter to move to this.”

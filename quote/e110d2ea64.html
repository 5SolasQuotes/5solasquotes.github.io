<main class="wrap"><figure class="quote" id="q-e110d2ea64" data-kw="">
<blockquote><p>Spiritual judgments are to be observed no less than temporal, both because there is more wrath in them, and they are more hardly discerned. Pelagianism of old, and Arminianism of late, is the just punishment of a formal profession; Socinianism, of the neglect of the Son of God; Antinomianism, of turning the grace of God into wantonness; Anabaptism, of baptizing infants in private, and of the slighting of the baptism in public, as if it did not concern the whole congregation; and Separation, of the despising of the true government of the kirk. So does the Lord send strong delusions upon them that receive not the love of the truth, and take pleasure in unrighteousness (2 Thess. 2:10-12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached before the Lords and Commons at Margaret s Church in Westminster, upon Thursday the 18th of July, 1644’ in Chris Coldwell (ed.), Sermons Preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of Divines 1643-1645</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“Spiritual judgments are to be observed no less than temporal, both because there is more wrath in them, and they are more hardly discerned. Pelagianism of old, and Arminianism of late, is the just punishment of a formal profession; Socinianism, of the neglect of the Son of God; Antinomianism, of turning the grace of God into wantonness; Anabaptism, of baptizing infants in private, and of the slighting of the baptism in public, as if it did not concern the whole congregation; and Separation, of the despising of the true government of the kirk. So does the Lord send strong delusions upon them that receive not the love of the truth, and take pleasure in unrighteousness (2 Thess. 2:10-12).”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d68f545e10" data-kw="">
<blockquote><p>1. Now we can clearly see from what has already been said that all men adopted by God into the company of his people since the beginning of the world were covenanted to him by the same law and by the bond of the same doctrine as obtains among us. It is very important to make this point.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Institutes Christian Religion, ed. John T. McNeill, tr. Ford Lewis Battles in The Library of Christian Classics, vol. 20 (Philadelphia: Westminster Press, 1960), vol. 1 | ch. 10, ‘The Similarity of the Old &amp; New Testaments’, p. 428, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Now we can clearly see from what has already been said that all men adopted by God into the company of his people since the beginning of the world were covenanted to him by the same law and by the bond of the same doctrine as obtains among us. It is very important to make this point.”

</figure><figure class="quote" id="q-3941b2b017" data-kw="">
<blockquote><p>…this accommodation is not impossible: if indeed it were, God does not bind us to the seeking after it… If we look upon the nature of the things wherein they differ, they are not of such moment as to divide between brethren; their differences are not about fundamentals, but superstructures: there is no opinion expressly maintained by either side which is directly contrary to the substance of faith, or destructive to salvation; nay, whatever are such, they are condemned by both. Nor [is] the difference in those matters wherein they differ so wide but they may be composed and brought together, if men will act humility and self-denial. It was said of the differences between Luther and the [reformed] Helvetians, that there was not any impossibility in respect of the things themselves; if their spirits could be reconciled, their causes might easily be reconciled… where the difference is substantial, I do not see but if humility and self-denial might take place, if interests might be waved, if pre-engagements might be slighted, even in those things there might be an agreement; certainly, God does not make the difference so great as we ourselves do make it… It was the speech of one concerning the reconciliation of the German Churches: It is possible for the most hot and rigorous spirits to be reconciled, but it is easy for peaceable and moderate men to be agreed. The differences are not between enemies, but between brethren, and neither of them proud, imperious and contentious, but both of them humble, holy and peaceable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), pp. 349–50</span></figcaption>

Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3941b2b017.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=this%20accommodation%20is%20not%20impossible%3A%20if,of%20them%20humble%2C%20holy%20and%20peaceable&amp;text=this%20accommodation%20is%20not%20impossible%3A%20if%20indeed%20it&amp;text=but%20both%20of%20them%20humble%2C%20holy%20and%20peaceable" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-67509949cf" data-kw="Councils under Scripture">
<blockquote><p>The weightiest controversies have been determined and settled in councils, but not by the absolute authority of the council itself, but by the judgment and authority of scripture in the council. Pious bishops never assembled to define a point themselves by their own authority, but by that of scripture. Therefore all religious councils have ascribed the supreme decision to the scriptures. … Since, then, councils, whenever they are good and pious, follow the scriptures, it is manifest that the supreme authority of judging belongs to the scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 6</span></figcaption>

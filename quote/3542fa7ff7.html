<main class="wrap"><figure class="quote" id="q-3542fa7ff7" data-kw="">
<blockquote><p>This separation in Corinth was in a Church from the idolatry in it; which separation we allow, but not a separation out of a Church, else the words would bear that Paul will have them to forsake the Church of Corinth for idolatrous tables in it and set up a new Church of their own, which the Separatists dare not say, and is contrary to other places, 1 Cor. 5:4; chs. 11 &amp; 14, where he commands and allows their meetings and public Church-communion: Therefore this place proves not their point. What logic is this? Separate from idols, therefore separate from a Church where the true worship of God is professed and taught.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ed5b45341" data-kw="">
<blockquote><p>It’s no duty [to separate from an impure church], as he elsewhere says, because there is no command; it’s no duty, and therefore we read not this word, ‘come forth’, in any of the epistles written to the seven Churches [in Rev. 2-3], against which Christ says He has such and such things. They that lived in the impurer are not called forth into the purer, but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part. For we may not make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s Presence because Satan came also amongst them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Sacrament, p. 246 &amp; p. 31 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

em" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b962bf4ef6" data-kw="">
<blockquote><p>Some of these excellent men [at Bothwell] now went the length of disowning the authority of the king and government altogether. They contended that, by overturning the true religion, by setting up Prelacy and Erastianism, by ruining the covenanted work of reformation, and by persecuting to the death its faithful adherents, Charles had perfidiously violated the conditions of his coronation oath, and forfeited all right to their allegiance. Another party, however, much more numerous though less conspicuous, because less violent and extreme, defended their appearance in arms on other grounds. While they condemned the proceedings of the government as arbitrary and tyrannical, they were not prepared to renounce their allegiance to it in civil matters; they held with the compilers of our [Westminster] Confession [ch. 23], that ‘infidelity or difference in religion doth not make void the magistrate’s just and legal authority, nor free the people from their due obedience to him;’ and though they lamented as much as their brethren the general defection of all classes from the engagements of the [Solemn League and] covenant [1643], they could not see how this denuded the sovereign of his authority, which they were ready to acknowledge so long as he was, by the common consent of the nation, recognized as its ruler. At the same time, they considered themselves warranted to assume the attitude of self-defence against the intolerable oppressions and illegal encroachments which had, ‘contrary to all law and humanity,’ been practiced on them; and the reasons on which they justified their appearing in arms were chiefly these — that all other modes of redress had been closed against them; and that they found it necessary for the defence of the Protestant religion and Presbyterian government, and for the preservation of his majesty’s person and throne from the projects of Popish adversaries. A declaration embodying these views was prepared and presented at the council of war, before the battle of Bothwell Bridge; but through the opposition of the more violent leaders it was unhappily rejected.‡ There is reason to believe that this paper contained the sentiments of the most judicious, as well as of the great majority of the suffering Presbyterians; and that, had it been adopted, it might have recommended their cause more to the country at large, procured greater accessions to their numbers, and perhaps have insured success at an earlier period of the contest. ‡ This declaration is given in Wodrow’s History, iii. 96. In venturing these remarks we are far, very far, from allowing that those of the Covenanters who openly cast off allegiance to Charles suffered justly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), pp. 334-35</span></figcaption>

</figure><figure class="quote" id="q-3341572616" data-kw="">
<blockquote><p>Schism is a breach of unity; and therefore, there can be no schism where there ought to be no unity; yea, where there need be no unity, or where there can be no unity. Wherefore that we may understand what schism is, it is needful to consider what unity should, and must be among Churches, and among Christians. There are several sorts of unity, that we cannot have with all Churches, as local communion: some that we need not have, as identity of rites: some that we ought not to have with some Churches; as communion in false doctrine, or impure worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10, p. 246</span></figcaption>

<blockquote><p>…we know no external lawful calling that kings have now, or their family, to the crown, but only the call of the people. All other calls to us are now invisible and unknown; and God would not command us to obey kings and leave us in the dark that we shall not know who is the king.” Lex Rex, p. 33 (rt col, bot). ² Cameron, Dictionary, p. 745. Rutherford: “Any tyrant stands in titulo [in the title], so long as the people and the estates who make him king have not recalled their grant; so as neither David, nor any single man, though six hundred with him [1 Sam. 23:13; 30:9], may un-king him or detract obedience from him as king…” Lex Rex, p. 59 (lt col, top)… As Rutherford argued during the Westminster era in Lex Rex (1644), that magnum opus of puritan political thought, the power of governing is retained in root in the commonality of the people³ and conferred on governors by the community’s consent. Hence by natural law the community’s consent is more fundamental than changeable positive laws and constitutions. ³ Lex Rex, pp. 1–2, 6, 29, 34, 123–24. … As the puritan political tradition was summed up and delineated by Rutherford, while a material tyrant with grounds for deposition may continue for a long time, he formally remains the valid, civil, God-recognized ruler, continuing to bear God’s authority in all lawful things, until the consent of the community (which had been given to him, legitimizing him as their ruler) is removed from him, normally by the publicly recognized and accepted civil procedure (that is, by the official bodies and in due order).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…we know no external lawful calling that kings have now, or their family, to the crown, but only the call of the people. All other calls to us are now invisible and unknown; and God would not command us to obey kings and leave us in the dark that we shall not know who is the king.” Lex Rex, p. 33 (rt col, bot). ² Cameron, Dictionary, p. 745. Rutherford: “Any tyrant stands in titulo [in the title], so long as the people and the estates who make him king have not recalled their grant; so as neither David, nor any single man, though six hundred with him [1 Sam. 23:13; 30:9], may un-king him or detract obedience from him as king…” Lex Rex, p. 59 (lt col, top)… As Rutherford argued during the Westminster era in Lex Rex (1644), that magnum opus of puritan political thought, the power of governing is retained in root in the commonality of the people³ and conferred on governors by the community’s consent. Hence by natural law the community’s consent is more fundamental than changeable positive laws and constitutions. ³ Lex Rex, pp. 1–2, 6, 29, 34, 123–24. … As the puritan political tradition was summed up and delineated by Rutherford, while a material tyrant with grounds for deposition may continue for a long time, he formally remains the valid, civil, God-recognized ruler, continuing to bear God’s authority in all lawful things, until the consent of the community (which had been given to him, legitimizing him as their ruler) is removed from him, normally by the publicly recognized and accepted civil procedure (that is, by the official bodies and in due order).”

is+more+fundamental+than+changeable+positive+laws+and+constitutions.+%C2%B3+Lex+Rex%2C+pp.+1%E2%80%932%2C+6%2C+29%2C+34%2C+123%E2%80%9324.+%E2%80%A6+As+the+puritan+political+tradition+was+summed+up+and+delineated+by+Rutherford%2C+while+a+material+tyrant+with+grounds+for+deposition+may+continue+for+a+long+time%2C+he+formally+remains+the+valid%2C+civil%2C+God-recognized+ruler%2C+continuing+to+bear+God%E2%80%99s+authority+in+all+lawful+things%2C+until+the+consent+of+the+community+%28which+had+been+given+to+him%2C+legitimizing+him+as+their+ruler%29+is+removed+from+him%2C+normally+by+the+publicly+recognized+and+accepted+civil+procedure+%28that+is%2C+by+the+official+bodies+and+in+due+order%29.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CCivil+Authority%2C+Dethronement+%26+Cameronianism%E2%80%9D+in+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D%2C+3.+%E2%80%9CPrincipled+Partial+Conformity+in+Government%3A+The+Church+of+Scotland+under+Erastianism+%26+Episcopacy+%281660%E2%80%931688%29%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+pp.+95-103+%7C+%E2%80%9CNot+till+1679+%28with+increasing+sanctions+on+the+non-conformists%29+did+a+minority+of+these+covenanters+split+away+from+the+rest%2C+coming+to+believe+Charles+II+had+lost+his+valid+civil+authority+due+to+his+despotism%E2%80%A6+The+Cameronians%2C+contrary+to+the+principles+and+ethos+of+the+Scottish+Reformation+and+the+Westminster+era+covenanters%2C%C2%B9+and+nearly+all+reformed+theology+before+them%2C+in+a+public+declaration+in+1680+at+Sanquhar+with+around+twenty+men%2C%C2%B2+%E2%80%9Cdisowned%E2%80%9D+Charles+II+as+king%E2%80%A6+%7C+%E2%80%A6+Rutherford%3A%2C+pp.+96-100&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6894577b59.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6894577b59.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=we%20know%20n

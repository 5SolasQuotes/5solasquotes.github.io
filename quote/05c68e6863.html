<main class="wrap"><figure class="quote" id="q-05c68e6863" data-kw="">
<blockquote><p>Obviously, the Sabbath, in our Lord’s view, was not a day of sheer idleness: inactivity was not its mark. Inactivity was not the mark of God’s Sabbath, when He rested from the works which He creatively made. Up to this very moment He has been working continuously; and, imitating Him, our Sabbath is also to be filled with work. God rested, not because He was weary, or needed an intermission in His labours; but because He had completed the task He had set for Himself (we speak as a man) and had completed it well: “And God finished His work which He had made”; “and God saw everything that He had made, and behold it was very good.” He was now ready to turn to other work. And we, like Him, are to do our appointed work—”Six days shalt thou labour and do all thy work”—and then, laying it well aside, turn to another task. It is not work as such, but our own work, from which we are to cease on the Sabbath.

“Six days shalt thou labour and do all thy work,” says the commandment; or as Isaiah puts it: “If thou turn thy foot from the Sabbath ” (that is, from trampling it down) “from doing thy pleasure on my holy day” (That is the way we trample it down); “and call the Sabbath a delight, and the holy (day) of the Lord honourable; and shalt honour Him, not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words; then shalt thou delight thyself in the Lord; and I will make thee to ride upon the high places of the earth; and I will feed thee with the heritage of Jacob thy father: for the mouth of the Lord hath spoken it.”

In one word, the Sabbath is the Lord’s day, not ours ; and on it is to be done the Lord’s work, not ours; and that is our “rest.” As Bishop Westcott, commenting on the saying of the Lord’s which is at the moment in our mind, put it, perhaps not with perfect exactness but with substantial truth: “man’s true rest is not a rest from human, earthly labour, but a rest for divine heavenly labour.” Rest is not the true essence of the Sabbath, nor the end of its institution; it is the means to a further end, which constitutes the real Sabbath “rest.” We are to rest from our own things that we may give ourselves to the things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Foundations of the Sabbath in the Word of God in Duncan J. McMillan, et al</cite></span></figcaption>

<blockquote><p>§66… There is a second thing unlawful also, and that is the misdetermining of those same modes and circumstances which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude:

1. That every misordering of such great affairs is the sin of them that do it.

2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is. §67. If the mischoosing of such circumstances by Church-governors be but an inconvenience and do not destroy the ordinance itself, or frustrate the ends of it, we are to obey: 1. For he is the judge in his own work, and not we: 2. the thing is not sinful, though inconvenient.

3. Obedience is commanded to our lawful governors… §68. But if a governor so misdetermine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to. As for example: If a governor make a new sacrament, I will not obey, because his command is null and the thing [is] simply evil. If he miscommand a circumstance of time or place, or gesture, I will consider the consequents. If he command the solemn assemblies to be held a mile or two or three from the people, I will obey him, if it be but as far as I can go without frustrating the work itself. But if he command us all to go ten miles or twenty miles to worship, I would obey for some time to avoid a greater evil, but ordinarily I would no more obey than if he forbade all Christian assemblies, for it comes all to one. So if he command the assemblies to be at break of day or after sun-setting, I would obey. But if he command that we assemble only at midnight, what should I do then? The thing is not simply unlawful: He does but misdo his own work. And therefore for some times I would obey, if it were necessary to avoid a greater evil. But if he make it the ordinary case, I would not obey: because it destroys the worship itself in a manner, as if he simply forbade it, and this he has no power to do. An inconvenient gesture I would use in obedience and to avoid a greater evil: But I would not obey him that would command me to stand on my head always in hearing. An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: But not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for. §69. In all such cases where governors act not as usurpers in a matter that they have no authority in, but only misdo their own work, it much concerns the subjects to foresee what’s likely to be the consequents of their obeying or disobeying, and accordingly to do that which tends most to the ends of the work: still holding to this rule, that we must obey in all things lawful. §70. And when we do obey in a case of miscommanding, it is not a doing evil that good may come of it, as some do misconceive: But it is only a submitting to that which is ill commanded, but not evil in him that does submit. It is the determiner that is the cause of the inconvenience, and not the obeyer. Nor is it inconvenient for me to obey, though it be worse perhaps to him that commands. While he sins in commanding, he may make it my duty to obey.</p></blockquote>

<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.”

— Jeremiah Burroughs, The Saints Happiness, … (London: M.S., 1660), pp. 15-16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+some+would+make+a+significancy+in+it+%5BChrist+sitting+to+preach%2C+Lk.+4%3A20%5D%3B+but+I+take+it%2C+it+was+only+a+civil+gesture%2C+that+Christ+observing+what+the+way+was+at+that+time%2C+He+would+conform+himself+to+the+order+and+way+of+sitting%2C+not+that+it+had+any+spiritual+signification%3A+As+now%2C+the+French+Ministers%2C+they+preach+with+their+hats+on%2C+It%E2%80%99s+the+custom+there%2C+and+no+question%2C+if+any+one+were+to+go+among+them+it+were+fit+they+should+observe+the+customs+that+they+have%3A+and+so+here%2C+to+sit+down%2C+and+in+other+Churches+to+stand%E2%80%A6+Therefore+observe+here%2C+whatsoever+ceremony+is+but+natural+and+helpful+in+a+natural+way%2C+there+should+be+no+contention%2C+we+have+no+such+custom%2C+nor+the+Churches+of+God+to+contend+about+these%2C+but+if+they+come+to+have+a+religious+use+put+upon+them%E2%80%A6+now+they+come+to+be+sinful%2C+and+therefore+Christ+He+observed+the+ceremony+of+the+Jews+%5Bof+sitting+to+preach%5D+as+a+natural+help.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+The+Saints+Happiness%2C+%E2%80%A6+%28London%3A+M.S.%2C+1660%29%2C+pp.+15-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F18487bdd66.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/18487bdd66.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Now%20some%20would%20make%20a%20significancy,to%20preach%5D%20as%20a%20natural%20help&amp;text=Now%20some%20would%20make%20a%20significancy%20in%20it&amp;text=of%20sitting%20to%20preach%5D%20as%20a%20natural%20help" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-84434082ab" data-kw="">
<blockquote><p>CXIII. Then, it seems somewhat uncertain when they [some Reformed theologians] distinguish between the act that predisposes one to justification and the act they say is formally justifying. According to the Reformed perspective, faith does not justify as a sort of form through which we are justified but rather as an instrument grasping Christ’s merit, as many say, or as a condition of the covenant of grace, which God counts as righteousness for Christ’s sake, as others prefer to say. These views, upon closer examination, converge to the same point. No one would say faith is a physical instrument of our justification; it can only intervene as a moral instrument. But faith can’t be a moral instrument of justification unless in the sense that God has promised forgiveness of sins to believers, which cannot be attained without the intervention of a living and effective faith. This is essentially the same as being a condition of the covenant of grace, wherein God offers grace and glory to believers and repentants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 165-66 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

booksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=CXIII.%20Then%2C%20it%20seems%20somewhat%20uncertain,and%20glory%20to%20believers%20and%20repentants&amp;text=CXIII.%20Then%2C%20it%20seems%20somewhat%20uncertain%20when%20they&amp;text=offers%20grace%20and%20glory%20to%20believers%20and%20repentants" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f9aeee0f2" data-kw="">
<blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

<blockquote><p>The reception of that gift is faith: faith means not doing something but receiving something; it means not the earning of a reward but the acceptance of a gift. A man can never be said to obtain a thing for himself if he obtains it by faith; indeed to say that he obtains it by faith is only another way of saying that he does not obtain it for himself but permits another to obtain it for him.</p></blockquote>

</figure><figure class="quote" id="q-d7a8aa218c" data-kw="">
<blockquote><p>If you confess with your mouth the Lord Jesus and believe in your heart that God has raised Him from the dead, you will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 160-61 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | XCII. Nevertheless, when it is said that faith, as it justifies and saves, primarily deals with the Gospel promises, it should signify mainly and principally, not exclusively. For faith, as it saves and justifies, does not deal only with those promises. Faith is said to save and justify as it is the condition of the covenant of grace, where God no longer demands from us, under the penalty of eternal death and curse, the perfect and absolute observation of the law in all its details as the covenant of works required, but instead requires living faith, which works through love. While the Law of Moses says, “do and live,” the Gospel says, “believe and be saved.” However, the faith that the Gospel demands as the condition under which it offers us salvation, does not only regard the promises of the Gospel but also its commands and doctrines, such as the Resurrection of our Lord Jesus Christ, as is evident from the words of Paul:</span></figcaption>

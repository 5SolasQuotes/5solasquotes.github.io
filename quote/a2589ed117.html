<main class="wrap"><figure class="quote" id="q-a2589ed117" data-kw="">
<blockquote><p>It is very plain that any plan designed to secure the salvation of an elect portion of a race propagated by generation and living in association, as is the case with mankind, cannot secure its end without greatly affecting, for better or for worse, the character and destiny of all the rest of the race not elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Grace (outline)</cite>, C. COMMON GRACE AND THE ATONING WORK OF CHRIST, And it is but natural that this should be so. If Christ was to save an elect race, gradually called out of the world of humanity in the course of centuries, it became necessary for God to exercise forbearance, to check the course of evil, to promote the development of the natural powers of man, to keep alive within the hearts of men a desire for civil righteousness, for external morality and good order in society, and to shower untold blessings upon mankind in general. Dr. [Charles] Hodge expresses it thus:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bfe47d0801" data-kw="">
<blockquote><p>We reject likewise the fictions of the Pelagianizers: Concerning the conditioned will, concerning the decree of velleity or desire. Concerning Middle or conditioned Knowledge, by which that desired determination is said to be foreseen. Concerning the intention of conditioned concourse concomitantly into the effect—and consequently concerning the simultaneous concourse and egress of grace and free will, which is really independence and primacy, pre-running and predetermination of the second cause. Concerning universal sufficient grace, and according to it a salvific calling, whose presupposition is the grace of universal redemption, reconciliation, and confederation. Which fictions have been sufficiently sifted by the authors just cited, partly also by the Dominican theologians and other genuine followers of Thomas, whom you will see alleged in those authors passim [throughout], and especially in Sylvius the Douai theologian, in his treatise On the Motion of the First Mover. Of our men, Ferri in his Orthodox Scholastic and its Defense against the Jesuit Perrin has rendered most useful service here. The Various Dissertations on the [End] Term of Life edited by Beverovicio can also be compared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 432 ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-b6bfd17c0d" data-kw="">
<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts:

1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added.

2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast.

3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

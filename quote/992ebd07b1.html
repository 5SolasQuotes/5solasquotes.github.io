<blockquote><p>Of course there are many other arguments for the use of hymns, as, for instance, that the Psalms are unsuitable for New Testament worship, breathe a spirit of revenge, and so forth, which borders, we think, on blasphemy; or that, as we are at liberty to pray in our own words, so we must be at liberty to sing praise in our own words in answer to this is that our liberty depends altogether on God’s revealed will, not on what we may think reasonable and further, that men were at liberty to pray in Old Testament times in their own words, but were required to employ only authorized psalmody in praise; and there is no reason for change in the matter now, and no reason for supposing that men are able now to frame suitable ones of praise, when they were considered so unable then that God furnished them with songs from heaven. Besides when people sing a hymn, they are not singing in their own words, but in the words of the hymn-writer, or in the words of an ecclesiastically authorized hymn-book. And if congregations are to take words other than their own in any case, one would think they would be safer with God’s words than with man’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ada1c8474e" data-kw="">
<blockquote><p>The matter is here three ways to be considered: First, in the ground, foundation, or authority of the Psalms we use, viz. they must be the word of Christ, that is contained in the Scriptures. Secondly in the kinds of Psalms, there are many sort of Psalms in Scripture. The Psalms of Moses, David, Solomon, and other prophets: but all are here referred to three heads; they are either Psalms, specially so called, or hymns, or songs. Great ado there is among interpreters to find a difference in these: some would have Psalms to be the songs of men, and Hymns of angels: some think they differ, especially in the manner of music. Some are sung by voice, some played upon instruments; but the plausiblest opinion is not to distinguish them by the persons that use them, or by the kind of music, but by the matter, and so they say Psalms contain exhortation to manners or holy life. Hymns contain praises to God in the commemoration of his benefits. Songs contain doctrine of the chief good, or man’s eternal felicity. But I think there needs not any curious distinction: it may suffice us that there is variety of Psalms in Scripture and God allows us the use of every kind. Thirdly, the property of the Psalms, they are Spiritual, both because they are indited by the spirit, and because they make us more spiritual in the due use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (London, 1615), commentary on ch. 3, v. 16, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>

</figure><figure class="quote" id="q-e6965be348" data-kw="">
<blockquote><p>Samuel Simms, who at the time of writing was the minister of Loughbrickland Reformed Presbyterian Church (Covenanter) in Co. Down, did not exactly think that exclusive psalmody was a “non-essential”. Here is what he says about the evil of uninspired hymns:

Singing uninspired hymns is not, properly speaking, public worship at all; it is public will-worship, and is an utter abomination in God’s sight! A minister might just as well take his text out of Calvin’s Institutes, as give out a mere human composition, however good, to be sung by the congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-db8d695569" data-kw="">
<blockquote><p>Should we hesitate to embrace a faithful witness for the cause of truth, and one, too, suffering in that cause? Surely not. It is not the cause of a party. The question between us and our antagonists is, in my opinion, come to this—Is the Testament of our Lord and Saviour Jesus Christ one Testament? Is it given by the inspiration of God, or not? Did holy men of God speak as moved by their own passions and local prejudices, or as moved by the Holy Ghost? If the book of Psalms be such as many represent it, and if it must be set aside from the peculiar use for which the Lord and Saviour Jesus Christ intended it, I see not but it is a thrust at the whole Bible, and implicitly dishonours and subverts the whole.

I believe the men have no such intention, they mean not so. But they appear to me to be under the influence of most dreadful and dangerous temptations; and to yield to them would be the greatest evil we could do to them, the greatest cruelty and injustice to themselves and their posterity, as well as unfaithfulness to the Lord. This has been long my opinion, and I yet see no cause to alter it. The cunning adversary of the church is never at rest. By various artifices and deceptions he endeavours to subvert the faith of Christians, and weaken their attachment to the Word of God. I cannot help ranking the present opposition to the pure scriptural Psalmody in the same class with Deism, Socinianism, Arianism, Arminianism, Universal Salvation, Antinomianism, and that it is a trial of the faith and patience of the saints. May the Lord enable us to stand fast, and to keep clean garments.

Conscious of much unworthiness, and that I am less than the least of all saints, yet I should shudder to chime in with the prevailing defamation, not to say blaspheming of that part of the Word of God, the book of Psalms, which indeed falls equally, though indirectly, on the whole of the Old Testament, and from that rebounds with equal force on the New Testament; for without faith in the one, I cannot see how there can be a true and saving faith in the other. The saying of the apostle respecting the law, is equally applicable here — “He that offends in one point, is guilty of all.” Whoever lifted up a tool on God’s altar, was guilty of polluting it. But what impure tools have proud, carnal, daring mortals, lifted against the Bible, with the pretext, as they say, of smoothing and polishing the rough stones thereof! But they have by their foolish and sinful attempts diminished its majesty, sublimity, grandeur, and dignity, and made ‘it like the works of men, and not of God. If those men could with equal ease form our globe into a smooth surfaced ball, no doubt they would try their hands on it, and imagine they had greatly improved it. But it is not as easy to spoil God’s works, as it is to reproach and blaspheme his Word.

I pretend not to be wiser than others, much less to infallibility; but I must judge for myself, and I see no great danger of being too strongly attached to the Word of God, or any part of it, not even to what they call the old, obsolete Jewish Psalms. The danger is all on the other side. Often, too often, my carnal heart has started objections against the book of God; and had not the Lord made me frequently taste the goodness and sweetness of it, I might have been a Deist. And what good fruits have proceeded from those men’s innovations and polishings?

Now, who were the first offended with the scriptural Psalmody, and most forward to introduce the new? To my certain knowledge, in New York, (where it first began in the Presbyterian churches,) they were the carnal and worldly part of professors, who could find no spiritual delight in any part of Divine worship. And have their attempts been blessed? Have conversions been promoted? Have saints been more edified, united, and sanctified, by their improvements? Is the worship of God more spiritual, heavenly, and holy? Let the fruits declare it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-annan.html">Robert Annan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Adam Rankin, c. 1785 in ‘An Original Letter from Rev. Robert Annan’, Evangelical Repository, 13, no. 5 (October 1854), pp 274-75.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Should we hesitate to embrace a faithful witness for the cause of truth, and one, too, suffering in that cause? Surely not. It is not the cause of a party. The question between us and our antagonists is, in my opinion, come to this—Is the Testament of our Lord and Saviour Jesus Christ one Testament? Is it given by the inspiration of God, or not? Did holy men of God speak as moved by their own passions and local prejudices, or as moved by the Holy Ghost? If the book of Psalms be such as many represent it, and if it must be set aside from the peculiar use for which the Lord and Saviour Jesus Christ intended it, I see not but it is a thrust at the whole Bible, and implicitly dishonours and subverts the whole.

I believe the men have no such intention, they mean not so. But they appear to me to be under the influence of most dreadful and dangerous temptations; and to yield to them would be the greatest evil we could do to them, the greatest cruelty and injustice to themselves and their posterity, as well as unfaithfulness to the Lord. This has been long my opinion, and I yet see no cause to alter it. The cunning adversary of the church is never at rest. By various artifices and deceptions he endeavours to subvert the faith of Christians, and weaken their attachment to the Word of God. I cannot help ranking the present opposition to the pure scriptural Psalmody in the same class with Deism, Socinianism, Arianism, Arminianism, Universal Salvation, Antinomianism, and that it is a trial of the faith and patience of the saints. May the Lord enable us to stand fast, and to keep clean garments.

Conscious of much unworthiness, and that I am less than the least of all saints, yet I should shudder to chime in with the prevailing defamation, not to say blaspheming of that part of the Word of God, the book of Psalms, which indeed falls equally, though indirectly, on the whole of the Old Testament, and from that rebounds with equal force on the New Testament; for without faith in the one, I cannot see how there can be a true and saving faith in the other. The saying of the apostle respecting the law, is equally applicable here — “He that offends in one point, is guilty of all.” Whoever lifted up a tool on God’s altar, was guilty of polluting it. But what impure tools have proud, carnal, daring mortals, lifted against the Bible, with the pretext, as they say, of smoothing and polishing the rough stones thereof! But they have by their foolish and sinful attempts diminished its majesty, sublimity, grandeur, and dignity, and made ‘it like the works of men, and not of God. If those men could with equal ease form our globe into a smooth surfaced ball, no doubt they would try their hands on it, and imagine they had greatly improved it. But it is not as easy to spoil God’s works, as it is to reproach and blaspheme his Word.

I pretend not to be wiser than others, much less to infallibility; but I must judge for myself, and I see no great danger of being too strongly attached to the Word of God, or any part of it, not even to what they call the old, obsolete Jewish Psalms. The danger is all on the other side. Often, too often, my carnal heart has started objections against the book of God; and had not the Lord made me frequently taste the goodness and sweetness of it, I might have been a Deist. And what good fruits have proceeded from those men’s innovations and polishings?

Now, who were the first offended with the scriptural Psalmody, and most forward to introduce the new? To my certain knowledge, in New York, (where it first began in the Presbyterian churches,) they were the carnal and worldly part of professors, who could find no spiritual delight in any part of Divine worship. And have their attempts been blessed? Have conversions been promoted? Have saints been more edified, united, and sanctified, by their improvements? Is the worship of God more spiritual, heavenly, and holy? Let the fruits declare it.”

— Robert Annan, Letter to Adam Rankin, c. 1785 in ‘An Original Letter from Rev. Robert Annan’, Evangelical Repository, 13, no. 5 (October 1854), pp 274-75.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CShould+we+hesitate+to+embrace+a+faithful+witness+for+the+cause+of+truth%2C+and+one%2C+too%2C+suffering+in+that+cause%3F+Surely+not.+It+is+not+the+cause+of+a+party.+The+question+between+us+and+our+antagonists+is%2C+in+my+opinion%2C+come+to+this%E2%80%94Is+the+Testament+of+our+Lord+and+Saviour+Jesus+Christ+one+Testament%3F+Is+it+given+by+the+inspiration+of+God%2C+or+not%3F+Did+holy+men+of+God+speak+as+moved+by+their+own+passions+and+local+prejudices%2C+or+as+moved+by+the+Holy+Ghost%3F+If+the+book+of+Psalms+be+such+as+many+represent+it%2C+and+if+it+must+be+set+aside+from+the+peculiar+use+for+which+the+Lord+and+Saviour+Jesus+Christ+intended+it%2C+I+see+not+but+it+is+a+thrust+at+the+whole+Bible%2C+and+implicitly+dishonours+and+subverts+the+whole.%0A%0AI+believe+the+men+have+no+such+intention%2C+they+mean+not+so.+But+they+appear+to+me+to+be+under+the+influence+of+most+dreadful+and+dangerous+temptations%3B+and+to+yield+to+them+would+be+the+greatest+evil+we+could+do+to+them%2C+the+greatest+cruelty+and+injustice+to+themselves+and+their+posterity%2C+as+well+as+unfaithfulness+to+the+Lord.+This+has+been+long+my+opinion%2C+and+I+yet+see+no+cause+to+alter+it.+The+cunning+adversary+of+the+church+is+never+at+rest.+By+various+artifices+and+deceptions+he+endeavours+to+subvert+the+faith+of+Christians%2C+and+weaken+their+attachment+to+the+Word+of+God.+I+cannot+help+ranking+the+present+opposition+to+the+pure+scriptural+Psalmody+in+the+same+class+with+Deism%2C+Socinianism%2C+Arianism%2C+Arminianism%2C+Universal+Salvation%2C+Antinomianism%2C+and+that+it+is+a+trial+of+the+faith+and+patience+of+the+saints.+May+the+Lord+enable+us+to+stand+fast%2C+and+to+keep+clean+garments.%0A%0AConscious+of+much+unworthiness%2C+and+that+I+am+less+than+the+least+of+all+saints%2C+

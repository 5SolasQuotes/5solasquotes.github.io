<main class="wrap"><figure class="quote" id="q-743feab0ee" data-kw="">
<blockquote><p>Lastly, No place is so sanctified by the miraculous special presence of God, but that presence ceases, when the tokens of God’s residence cease; the Ark, the Mercy-seat, the places became as before.

For us to go a pilgrimage to Jerusalem, and to the Temple, is an abominable thing; how many bloody battles have since been sought there? these places where the presence of God was, when abused to the dishonour of God, they become worse and worse: whatever we use in holy uses, loses their holiness when abused. It’s boldness for us to tie the presence of God to any place, for God hath not tied himself to any place.

I cannot but wonder, how it’s possible for men to hold, that the Lord’s day, which God hath been pleased to set apart for himself, that its holiness can cease; for that they say, the Lord’s day is not holier longer than the service is in doing; yet that the Church, that God never appointed, should retain its holiness, that you must not tread there, but with your hat off, nor come there without bowing the knee. …

There are several persons to be reproved; those that take pilgrimages to particular places, because of that holiness they suppose in them. I might tell you of their lying Reliques: I will not trouble you with them: suppose them true, what is this to Institution and command of God? where have you a command for such a thing? I might take notice of those that put holiness in places of Burial; in the Church; think it holier than the Church-yard; and one part of the Church holier than another; private prayer, rather than join in public: for any to bow towards the place of the Communion Table, rather than to any other place of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The burning yet un-consumed bush, or, The holiness of places discussed held forth in two farewell-sermons at Christ-Church London, August 17th, 1662</cite>, (London, 1662), pp 33, 34.</span></figcaption>

</figure><figure class="quote" id="q-4467fa3875" data-kw="">
<blockquote><p>There was also presented to the Assembly, a new Paraphrase of the Psalms in English meter, which was well liked of and commended by some of the members of the Assembly; But because we conceived that the Psalm Book in all the three Kingdoms was a point of Uniformity much to be desired, we took the boldness (although we had no such express and particular commission) to oppose the present allowing thereof, till the Kirk of Scotland should be acquainted with it; and therefore have we now sent an essay thereof in some Psalms. …As we cannot but admire the good hand of God in the great things done here already, particularly; That the covenant (the foundation of the whole work) is taken, prelacy and the whole train thereof, is extirpated. The service book in many places is forsaken, plain and powerful preaching set up; as are most zealous of the belt of the Reformation; altars removed; the communion in some places given at the table with sitting; the great organs at Paul’s and Peter’s in Westminster taken down; images and many other monuments of idolatry defaced and abolished [spelling updated].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maitland-alex-henderson-samuel-rutherford-robert-baillie-george-gillespie.html">John Maitland, Alex Henderson, Samuel Rutherford, Robert Baillie, George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Letter from the Commissioners at London the General Assembly,” Worcester house, London, May 20</cite>, 1644. pp. 227–28.</span></figcaption>

<blockquote><p>With regard to “removing… monuments of idolatry,” establishment Anglicans had long affirmed and practiced this, interpreting the phrase as referring (only) to such Romanist monuments and not to the Anglican ceremonies, the latter being held to be not inherently unlawful.¹ ¹ So bishop Richard Cox (c. 1500–1581), who opposed John Knox at Frankfurt regarding the Anglican Liturgy, was a zealous and firm remover of Romanist monuments of superstition and idolatry: Wenig, “Reformation during the Episcopate of Richard Cox,” pp. 167 &amp; 170.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction”, “Larger Catechism</cite>, Question 108” in A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025), p. 73</span></figcaption>

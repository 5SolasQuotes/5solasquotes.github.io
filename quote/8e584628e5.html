<main class="wrap"><figure class="quote" id="q-8e584628e5" data-kw="">
<blockquote><p>On two occasions we are told that Jesus felt that occurrences which he witnessed were extraordinary and experienced the appropriate emotion of “wonder” regarding them (Mt. viii. l0; Lk. vii 9; Mk. vi. 6).¹ ¹ [Greek] Thaumazo: see Schmidt, Synonymik etc., iv. §165, pp. 184sq.: “it is perfectly generally ‘to wonder’ or ‘to admire’, and is distinguished from thambein precisely as the German sich wundern, or hewundern is from staunen: that is, what has seized on us in the case of thaumazein is the extraordinary nature of the thing while in the case of thambain it is the unexpectedness and suddenness of the occurrence.” Cf. Art. “Amazement” in Hasting’s DCG. I, pp. 47, 48.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’</cite>, (1912), p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d319205c37" data-kw="">
<blockquote><p>XVII… From this [Col. 1:2, “Grace be unto you, and peace, from God our Father and the Lord Jesus Christ.”] we gather the following axioms. … 2. The Son of God is equal and coequal with the Father in honor, worship, and glory, as well as in essence. Otherwise, the Apostle would not attribute the same glory to both the Father and the Son unless they share the same essence. Since God does not give His glory to another [Isa. 42:8] of a distinct essence, it is evident that the Father and the Son share the same essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-2838d2990a" data-kw="two wills dyothelite">
<blockquote><p>The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6, 7, 11); (2) two wills are ascribed to him (“not my will, but thine, be done,” Lk. 22:42). Nor does it follow that there are two willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.7.14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a> › <a href="../topics/the-person-of-christ/union-of-the-two-natures/two-wills.html">Two wills</a></span><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a> › <a href="../topics/the-person-of-christ/union-of-the-two-natures/hypostatic-union.html">Hypostatic union</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 13.7.14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20reasons%20are%3A%20%281%29%20the%20opposition%20of%20the%20two%20natures%20in%20Christ%20is%20frequent%20in%20Scripture%20%28Rom.%201%3A3%3B%201%20Pet.%203%3A18%3B%20Heb.%209%3A14%3B%20Jn.%201%3A14%3B%20Phil.%202%3A6%2C%207%2C%2011%29%3B%20%282%29%20two%20wills%20are%20ascribed%20to%20him%20%28%E2%80%9Cnot%20my%20will%2C%20but%20thine%2C%20be%20done%2C%E2%80%9D%20Lk.%2022%3A42%29.%20Nor%20does%20it%20follow%20that%20there%20are%20two%20willing%20because%20the%20will%20belongs%20to%20the%20nature%2C%20while%20willing%20belongs%20to%20the%20person%3B%20nor%20is%20it%20evident%20that%20the%20will%20follows%20personally%20forthwith%20because%20in%20God%20there%20are%20three%20persons%2C%20but%20only%20one%20will.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2013.7.14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2838d2990a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2838d2990a.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-d2e879a4bb" data-kw="">
<blockquote><p>Secondly, infirmities be either general, or personal; general, which appertain to the whole nature of man, and are to be found in every man that comes of Adam: as to be born unlearned, and subject to natural affections, as sorrow, anger, etc. Personal, are such as appertain to some particular men, and not to all, and arise of some private causes and particular judgments of God, as to be born a fool, to be sick of an ague, consumption, dropsy, pleuresy, and such like diseases. Now the first sort be in Christ, and not the second: for as He took not the person of any man, but only man’s nature, so was it sufficient for Him to take unto Him the infirmities of man’s nature, though He took not the private infirmities of any man’s person. And the reason why Christ would put on not only the substance and faculties of a true man, but also his infirmities, was that He might show Himself to be very man indeed, also that He might suffer for us both in body and soul, and that he might give us an example of patience in bearing all manner of evil for God’s glory and the good of our neighbor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (Cambridge, 1595), p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>It traces the central contours of the Christological debates, from the discussion between Luther and Zwingli in the 1520s to the Colloquy of Montbeliard in 1586… Cross shows that Luther’s Christology is thoroughly Medieval, and that innovations usually associated with Luther-in particular, that Christ’s human nature comes to share in divine attributes-should be ascribed instead to his younger contemporary Johannes Brenz. The discussion is highly sensitive to the differences between the various Luther groups-followers of Brenz, and the different factions aligned in varying ways with Melanchthon-and to the differences between all of these and the Reformed theologians. By locating the Christological discussions in their immediate Medieval background, Cross also provides a comprehensive account of the continuities and discontinuities between the two eras. In these ways, it is shown that the standard interpretations of the Reformation debates on the matter are almost wholly mistaken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communicatio Idiomatum: Reformation Christological Debates in Changing Paradigms in Historical &amp; Systematic Theology</cite></span></figcaption>

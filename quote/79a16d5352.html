<main class="wrap"><figure class="quote" id="q-79a16d5352" data-kw="">
<blockquote><p>Also this power is given to certain ends: and if it be used against those ends, so that either the ends or that means must be forsaken, it is easy to see that it is means and not the ends. For the means are not always the same, God having [a] store [of means] if any one fail. Especially the means is of positive morality and the ends [are] of natural morality: For when two duties come together, and both cannot be chosen, the choosing of the less (which must give place to the greater) is a sin: and positives are less (caeteris paribus [all things being equal]) than naturals: And the substantials of positives [are] more necessary than the circumstantials:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“Also this power is given to certain ends: and if it be used against those ends, so that either the ends or that means must be forsaken, it is easy to see that it is means and not the ends. For the means are not always the same, God having [a] store [of means] if any one fail. Especially the means is of positive morality and the ends [are] of natural morality: For when two duties come together, and both cannot be chosen, the choosing of the less (which must give place to the greater) is a sin: and positives are less (caeteris paribus [all things being equal]) than naturals: And the substantials of positives [are] more necessary than the circumstantials:”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’, pp. 83-84">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlso+this+power+is+given+to+certain+ends%3A+and+if+it+be+used+against+those+ends%2C+so+that+either+the+ends+or+that+means+must+be+forsaken%2C+it+is+easy+to+see+that+it+is+means+and+not+the+ends.+For+the+means+are+not+always+the+same%2C+God+having+%5Ba%5D+store+%5Bof+means%5D+if+any+one+fail.+Especially+the+means+is+of+positive+morality+and+the+ends+%5Bare%5D+of+natural+morality%3A+For+when+two+duties+come+together%2C+and+both+cannot+be+chosen%2C+the+choosing+of+the+less+%28which+must+give+place+to+the+greater%29+is+a+sin%3A+and+positives+are+less+%28caeteris+paribus+%5Ball+things+being+equal%5D%29+than+naturals%3A+And+the+substantials+of+positives+%5Bare%5D+more+necessary+than+the+circumstantials%3A%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98Objections+Answered%E2%80%99%2C+pp.+83-84&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F79a16d5352.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/79a16d5352.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=Also%20this%20power%20is%20given%20to,are%5D%20more%20necessary%20than%20the%20circumstantials&amp;text=Also%20this%20power%20is%20given%20to%20certain%20ends&amp;text=of%20positives%20%5Bare%5D%20more%20necessary%20than%20the%20circumstantials" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-a211eb1c2b" data-kw="">
<blockquote><p>3rd Caution. One and the same commandment in some things binds the conscience more straitly, and in doing some other things less: Gal. 6:10, ‘Do good to all men, but specially them that be of the household of faith.’ Hence it arises that though all sins be mortal and deserve eternal death, yet all are not equal, but some more grievous than others.</p></blockquote>

</figure><figure class="quote" id="q-21d7debf01" data-kw="">
<blockquote><p>Besides, arguments drawn from scandal in things neither unlawful nor (setting the reason of scandal aside) inexpedient, as they are subject to sundry frailties otherwise, so they are manifestly of no weight at all when they are counterpoised with the apparent danger of evil consequents on the other side. For in such cases there is commonly equal danger (if not rather something more) of scandal to be taken from the example the quite contrary way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop Sanderson’s Judgment concerning Submission to Usurpers</cite>, (d. 1663; London, 1678), pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<main class="wrap"><figure class="quote" id="q-fbc2a8d264" data-kw="same substance three persons">
<blockquote><p>These three are one God, the same in substance, equal in power and glory. We have seen that the Scriptures teach that there is but one true and living God. They teach with equal clearness that this one true and living God exists as three distinct Persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/loraine-boettner.html">Loraine Boettner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, §5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-059b4916c5" data-kw="essence persons">
<blockquote><p>We assert that the essence is one in the three persons, not as a whole in parts, since each person possesses the entire essence. Nor is it like a genus in species, as the persons are not species but individuals. Nor is it like a species in individuals, as the essence itself is singular in number and cannot be divided into multiple essences. Rather, the whole essence is present in each person in a peculiar manner that we cannot fully express with words or comprehend with thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis XII</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/one-essence.html">One Essence</a> › <a href="../topics/the-trinity/one-essence/unity-of-nature.html">Unity of nature</a></span></div>
<div class="actions"><button class="copy" data-copy="“We assert that the essence is one in the three persons, not as a whole in parts, since each person possesses the entire essence. Nor is it like a genus in species, as the persons are not species but individuals. Nor is it like a species in individuals, as the essence itself is singular in number and cannot be divided into multiple essences. Rather, the whole essence is present in each person in a peculiar manner that we cannot fully express with words or comprehend with thought.”

— Pierre Du Moulin, On the Trinity, Thesis XII">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+assert+that+the+essence+is+one+in+the+three+persons%2C+not+as+a+whole+in+parts%2C+since+each+person+possesses+the+entire+essence.+Nor+is+it+like+a+genus+in+species%2C+as+the+persons+are+not+species+but+individuals.+Nor+is+it+like+a+species+in+individuals%2C+as+the+essence+itself+is+singular+in+number+and+cannot+be+divided+into+multiple+essences.+Rather%2C+the+whole+essence+is+present+in+each+person+in+a+peculiar+manner+that+we+cannot+fully+express+with+words+or+comprehend+with+thought.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+On+the+Trinity%2C+Thesis+XII&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F059b4916c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/059b4916c5.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-54393b61ac" data-kw="unity works">
<blockquote><p>Indeed, there are three persons, who, though they share the same essence, differ in the manner of their existence. The Son is distinct from the Father, but not different in essence. The same applies to the Holy Spirit.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Indeed, there are three persons, who, though they share the same essence, differ in the manner of their existence. The Son is distinct from the Father, but not different in essence. The same applies to the Holy Spirit.”

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, XIII">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIndeed%2C%20there%20are%20three%20persons%2C%20who%2C%20though%20they%20share%20the%20same%20essence%2C%20differ%20in%20the%20manner%20of%20their%20existence.%20The%20Son%20is%20distinct%20from%20the%20Father%2C%20but%20not%20different%20in%20essence.%20The%20same%20applies%20to%20the%20Holy%20Spirit.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20XIII&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54393b61ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54393b61ac.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3292520bce" data-kw="one God Deuteronomy Trinity">
<blockquote><p>The first thing which we affirm to be delivered unto us by divine revelation as the object of our faith, is, that God is one. Deut. 6:4, “Hear, O Israel; The Lord our God is one Lord.” A most pregnant testimony; and yet, notwithstanding, as I shall elsewhere manifest, the Trinity itself, in that one divine essence, is here asserted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, I</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The first thing which we affirm to be delivered unto us by divine revelation as the object of our faith, is, that God is one. Deut. 6:4, “Hear, O Israel; The Lord our God is one Lord.” A most pregnant testimony; and yet, notwithstanding, as I shall elsewhere manifest, the Trinity itself, in that one divine essence, is here asserted.”

— John Owen, A Brief Declaration and Vindication of the Doctrine of the Trinity, I">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20first%20thing%20which%20we%20affirm%20to%20be%20delivered%20unto%20us%20by%20divine%20revelation%20as%20the%20object%20of%20our%20faith%2C%20is%2C%20that%20God%20is%20one.%20Deut.%206%3A4%2C%20%E2%80%9CHear%2C%20O%20Israel%3B%20The%20Lord%20our%20God%20is%20one%20Lord.%E2%80%9D%20A%20most%20pregnant%20testimony%3B%20and%20yet%2C%20notwithstanding%2C%20as%20I%20shall%20elsewhere%20manifest%2C%20the%20Trinity%20itself%2C%20in%20that%20one%20divine%20essence%2C%20is%20here%20asserted.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20A%20Brief%20Declaration%20and%20Vindication%20of%20the%20Doctrine%20of%20the%20Trinity%2C%20I&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3292520bce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3292520bce.html">Permalink</a><span class="src none">No free online copy linked</span></div>

<main class="wrap"><figure class="quote" id="q-63c4a4c1f1" data-kw="">
<blockquote><p>The oldest of the Conclusions, so far as is known, is that to Psalm 148 [only], which is found in the 1575 edition by Bassandyne, at the very end of the volume… Though the introduction of these compositions is involved in obscurity, it cannot be supposed that they were forced into the Psalm Book against the wishes of the church authorities… It is more conceivable that they were inserted quietly, on the printer’s own responsibility or that of other private parties; and their disappearance from most of the subsequent editions lends countenance to this conjecture. Even those for common metre are wanting in so important an edition of 1615. Very possibly those who had Episcopal leanings had most to do with their first introduction; but the absence of any trace of controversy on the subject warrants the inference that other parties acquiesced, so far at least as to make the use of them a matter of forebearance. It may also be inferred from the state of the psalm books that they were used only to a partial extent till after 1615.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/neil-livingston.html">Neil Livingston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Psalter of 1635</cite>, (1864) | ‘3. Conclusions’, pp. 35-37 in II – ‘Appendages to Metrical Psalms’ in Dissertation III, ‘The Literary Materials of the Psalter’, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-9af95198b7" data-kw="">
<blockquote><p>It is an undeniable historical fact that non-canonical songs were excluded from the Geneva services and that this sate of affairs was due to Calvin’s influence and desire… He took great pains to put together a psalter for use in Strasbourg, translating a number of the psalms himself. He included no hymns, and that in spite of the fact that the congregational singing of hymns was an established ordinance in Strasbourg. He borrowed some of the German tunes but none of the lyrics, and the choice must have been deliberate. There is also the fact that, throughout its long history of development, the Geneva Psalter never included a single hymn. The only possible exception to this would be the inclusion of a metrical version of the Apostle’s Creed in the first edition of Calvin’s Geneva Psalter (1542). The Creed, however, was in a different category from either hymns or biblical songs… In any event, the Creed was not present in the final and authoritative version of the psalter (1562). …it must be kept in mind that, ’till the middle of the seventeenth century it was the current belief of Roman Catholic and Protestant Christendom that the Apostle’s Creed was ‘Membratim articulatimque‘ composed by the Apostle’s in Jerusalem on the day of Pentecost…’ (Schaff, Creeds, vol. 1, p. 22) Calvin himself prefers to leave the question of authorship open… In his catechism Calvin says, ‘It is commonly called the Apostle’s Creed, because from the beginning of the church it came from the lips of the Apostles or was faithfully collected from their writings.’ (Theological Treatises, p. 92) The Apostles’ Creed was thus seen by Calvin as having Apostolic sanction, if not authority, and as deriving directly from the Apostolic age, if not from the hands of the Apostles themselves. It was in his view a creed that had the honor and respect attending its use in the Church for some 1,500 years. Should we then be surprised to find that Calvin included a metrical version of such a creed in his psalter? It is unfortunate that he did so, but we can certainly see reasons for his having done so, which ultimately have nothing to do with whether the Apostles’ Creed is inspired. Certainly there is a wide difference between the inclusion of such a creed in the psalter and the inclusion of contemporary hymns, which is something that Calvin never did…. the final and complete version of the Genevan Psalter (1562) did not contain a metrical version of the Apostles’ Creed. Whatever reasons Calvin had for including the creed in the first place, he evidently changed his mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Origin of Reformed Psalmody’ in Songs of Zion</cite>, pp. 179-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

les%E2%80%99+Creed+was+thus+seen+by+Calvin+as+having+Apostolic+sanction%2C+if+not+authority%2C+and+as+deriving+directly+from+the+Apostolic+age%2C+if+not+from+the+hands+of+the+Apostles+themselves.+It+was+in+his+view+a+creed+that+had+the+honor+and+respect+attending+its+use+in+the+Church+for+some+1%2C500+years.+Should+we+then+be+surprised+to+find+that+Calvin+included+a+metrical+version+of+such+a+creed+in+his+psalter%3F+It+is+unfortunate+that+he+did+so%2C+but+we+can+certainly+see+reasons+for+his+having+done+so%2C+which+ultimately+have+nothing+to+do+with+whether+the+Apostles%E2%80%99+Creed+is+inspired.+Certainly+there+is+a+wide+difference+between+the+inclusion+of+such+a+creed+in+the+psalter+and+the+inclusion+of+contemporary+hymns%2C+which+is+something+that+Calvin+never+did%E2%80%A6.+the+final+and+complete+version+of+the+Genevan+Psalter+%281562%29+did+not+contain+a+metrical+version+of+the+Apostles%E2%80%99+Creed.+Whatever+reasons+Calvin+had+for+including+the+creed+in+the+first+place%2C+he+evidently+changed+his+mind.%E2%80%9D%0A%0A%E2%80%94+Michael+Bushell%2C+%E2%80%98Calvin+%26+the+Origin+of+Reformed+Psalmody%E2%80%99+in+Songs+of+Zion%3A+A+Contemporary+Case+for+Exclusive+Psalmody%2C+pp.+179-81.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9af95198b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9af95198b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/singing-of-praise/the-history-of-psalm-singing/#:~:text=It%20is%20an%20undeniable%20historical%20fact,place%2C%20he%20evidently%20changed%20his%20mind&amp;text=It%20is%20an%20undeniable%20historical%20fact%20that%20non%2Dcanonical&amp;text=the%20first%20place%2C%20he%20evidently%20changed%20his%20mind" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

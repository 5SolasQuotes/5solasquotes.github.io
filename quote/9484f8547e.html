<main class="wrap"><figure class="quote" id="q-9484f8547e" data-kw="">
<blockquote><p>Now that a just harmony may be kept between these two different orders and administrations, two extremes must be avoided. [The first is] that they be not confounded, either (1) by giving the spiritual power, which is proper to the church, into the hand of the civil magistrate, as Erastus would have done in the matter of excommunication. If any magistrate should presume to thrust himself by his authority or otherwise into a work which properly belongs to a church officer, let him remember what befell Saul and Uzziah for so doing.

Or (2) by giving civil power to church officers, who are called to attend only to spiritual matters, and the things of God, and therefore may not be distracted from them by secular entanglements. I say, church officers, not church members; for they (not being limited as the officers are by God) are capable of two different employments, suiting with two different men in them, in different respects, as has been said. And as they may lawfully be employed about things of this life, so they are of all men fittest, being sanctified and dedicated to God to carry on all worldly and civil business to God’s ends, as we shall declare in due time. …

The second extreme to be avoided is that these two different orders and states, ecclesiastical and civil be not set in opposition as contraries, that one should destroy the other, but as coordinate states in the same place reaching forth help mutually each to other, for the welfare of both, according to God. So that both officers and members of churches be subject, in respect of the outward man, to the civil power of those who bear rule in the civil state according to God, and teach others so to do.

And that the civil magistrates and officers, in regard of the inward man, subject themselves spiritually to the power of Christ in church ordinances, and by their civil power preserve the same in outward peace and purity; and this will best be attained, when the pastor may say to the magistrate, as Gregory Nazianzen wrote to the magistrate of Nazianzum, “I know thou art a sheep of my flock, a holy sheep of a holy flock,” [and] again, “You rule with Christ, and administer to Christ; you have the sword from him: let this gift which you have received from him be kept pure for him.” And [it is attained] when the civil magistrate in his church-state answers Ambrose [according to] his description of a good emperor: “A good magistrate is within the church, not above it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse about Civil Government (1663) , ed. Stephen Wolfe in Ad Fontes: A Journal of Protestant Resourcement</cite></span></figcaption>

<blockquote><p>V. Religion should be cared for by all, chiefly be Magistrates and Ministers. For they are the Churches nursing Fathers, by preserving Schools and Churches, and by maintaining of Ministers, &amp;c.

IX. Religion may be defended by arms but not propagated by arms.

Examples of pious Kings, the Maccabees, Emperors as Constantine and Theodosius shew this.

X. Reformation of things amiss in Religon, belong to the prince or Magistrate.

After the examples of Moses, Joshua, David, Asa, Jehosaphat, Hezekiah, Josiah, Constantine, Theodosius, &amp;c.</p></blockquote>

<blockquote><p>Thirdly, consider the solemn Obligation that lies upon us, by a National Covenant, (famous through the Christian world, and we infamous for the breach of it,) to promote, and procure with our utmost endeavours the Reformation of the Land. God hath, I believe, most of your hands to shew for this, and darest thou who hast bound thy self in such a Covenant, give thy voice for an unworthy man to sit in Parliament, whom thy conscience, (if thou wouldst have patience to hear it,) will tell thee, he will never be the man that will help on that work with any Vote of his, yea, that is an enemy to it, and fears it more then desires it? if thou hast got the mastery of thy conscience, so far as to do this bold act, let me tell thee what thou doest; thou comest this day to declare in the face of all the Country, yea, before God, men, and Angels, that thou art a forsworne wretch; and if thou gettest this brand upon thy forehead once, go where thou wilt, thou dragest a chain after thee, that will bind thee over to the fearful expectation of God’s wrath; that (come it sooner or later) will take hold on thee.

And now tell me, hadst thou not better have been asleep in thy bed, yea, sick in thy bed, yea, dead in thy grave, then to have come hither to do so unhappy a days work? Oh, think when thou goest this day to give thy suffrage for any that thou didst see the Covenant with thy hand at it spread before thee; durst thou then venture, to blot out what there thou hast wrote, by a wicked and unworthy choice? Suppose one should put himself under an oath of friendship, to promote the good and welfare of another, to his utmost power, (as Jonathan to David) and this his friend, to whom he is thus engaged, falling sick, should trust him to bring a Physician to him, and he should fetch a murderer to poison him, or an Empiric which by his ignorance should kill him (which comes to all one) Oh, how would his oath rot upon his conscience?

This thou doest, only with this aggravation, thou doest it to a Nation, he to a private person; before therefore thou subscribest, spend one thought more upon the matter. Consider, thou standest at the greatest advantage of paying thy vows, and performing thy Covenant this day, that thou mayest in all thy life; possible, before the three years for a Parliament come about, thou mayest be summoned into another world, to give an account, how thou bestowedst thy voice now; or if alive, thou mayest be reserved to see a poor Nation helped to its ruin by thy hand and such as thou art.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Magistrate’s Pourtraiture drawn from the Word, and Preached in a Sermon at Stowe-Market in Suffolk, upon August, the 20. 1656. before the Election of Parliament-men for the same County</cite>, (London: Ralph Smith, 1656), pp 26-27.</span></figcaption>

</figure><figure class="quote" id="q-b899e85b7f" data-kw="">
<blockquote><p>For who in his right wits will run upon a man which he clearly sees hath the plague sore running upon him? What Christian in his right mind spiritually, having any fear of God in his heart, life in his soul, or tenderness in his conscience, will delightfully thrust himself into the company of swearers, drunkards, scorners, filthy talkers, profane jesters, or any fellows of such infamous rank? especially since the soul is a thousand times more capable of the contagion of sin, than the body of any infectious disease?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bolton.html">Robert Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some General Directions for a Comfortable Walking with God</cite>, … (London, 1626) 1625 was a plague year., p. 67</span></figcaption>

<blockquote><p>Although we are fully convinced that the establishment principle is biblical, William MacKray also helpfully points out that it really is just a matter of common sense. After all, the idea of a Christian nation that does not provide for the maintenance of Christian institutions is totally irrational. Can you imagine an atheist nation not providing for atheist institutions or a Muslim nation not maintaining Muslim institutions. Such an assumption is too foolish to need or deserve refutation:

I CANNOT conceive any doctrine more sound and reasonable than this — that, in a Christian land, provision ought authoritatively to be made, on the part of its government, for the diffusion of Christian knowledge and the maintenance, of Christian institutions.</p></blockquote>

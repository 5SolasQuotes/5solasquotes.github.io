<blockquote><p>…some private Christians, Acts 8:4, preached the Gospel, but when? In time of heavy persecution when they were scattered, vv. 1,4. [According to the inference of congregationalists:] Then all gifted Christians, tradesmen or what else, not separated by Christ and his Churches’ calling may now preach the Gospel, yea be the ordinary and only converters of souls and gatherers of the saints [as regular preachers or pastors]; it follows no ways.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf842d1c29" data-kw="">
<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 24, Question 20, pp. 547-48</span></figcaption>

<blockquote><p>19. But the election of Paul [who was likely unmarried at the time] and such other[s] ought not to move us but that in choosing the ministers of the Church we must follow the doctrine of the same apostle taught us in the epistle unto Timothy, where he will that those which be novices in religion should not be chosen, but they which have a good testimony. But it must be considered that the rules described unto Timothy were given unto men, from whom, seeing other men’s minds be hidden and that they be utterly ignorant what is in them, it behoves that they use the cautions described by the apostle, lest they err in their elections. But God rightly chooses his without those rules (Ps. 7:11; Jer. 11:20; Apoc. 2:23), “For He trieth the reigns and the hearts, and changeth the wills of men at his own pleasure.” Albeit some have said, that Paul in Judaism was of very honest conversation, as he himself testifies unto the Philippians (Phil. 2:6). And in the latter epistle to Timothy he writes that he had served God from his forefathers with a pure conscience. But I hold not with these men. For I will not diminish his fault in persecuting of the Church, seeing Paul did so greatly after a sort reproach himself with the same. Wherefore when I allow of the solution now brought, this comes to mind that the canons which the apostle delivered unto Timothy are not always kept even as touching men. For Ambrose, the Bishop of Milan, when he was yet a novice, and youngling in the faith, was placed in the See of the Church. For he was sent from the emperor to execute the office of Praetor. (Margin Note: The commandments of God so far as sometime one gives place to another) Here the adversaries vaunt against us, that it is lawful sometimes to deal against the holy Scriptures, and that the words of God are not most steadfast. But we must note that the precepts of God sometime have not their own strength, neither in very deed be precepts. For when two precepts meet together so as they cross one another, whereof the one is more excellent than the other, and God would have that chiefly to be done than the other which is of less excellency, and as touching the will of God, inferior, gives place unto the first and has not the [obliging] authority of a commandment [in that situation]: because God would not have it to be done in that place and at that time. Even as Christ taught as touching the drawing of an ox and an ass out of a pit on the Sabboth day (Lk. 14:5). By which means He excused his disciples who had plucked off the ears of the corn on the Sabboth day (Matt 12:1) and had rubbed out the grain. And He often times testified that He would have mercy and not sacrifice. (Ibid., v. 7). The Church of Milan therefore was greatly molested by the Arians: it had need of a bishop and specially of a teacher that should be of great authority. These things were perceived to be in Ambrose. Neither was there any other fit man presented. Whereby that Church was quit from the other precept which was of less excellency, wherein it was commanded to beware of novices, or those which were not fully instructed. And of this matter it seems to be enough to have spoken somewhat by the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, (1583), 4th Part, ch. 1, ‘Of Calling, and Especially unto the Ministry’</span></figcaption>

<blockquote><p>8. Vocation uneffectual is common to pagans. Vocation thoroughly effectual is of the same extent as justification, and (I think) election. Vocation which is effectual only to bring men to an outward profession of saving faith is larger than election and makes men such whom we are bound to baptize.</p></blockquote>

<blockquote><p>There are with us Doctors of Divinity who teach in schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3:10, under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their colleges, were young prophets, or sons of the prophets, as 1 Sam. 10:5; 2 Kings 2:7; 2 Kings 4:1; 1 Kings 20:35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Prov. 22:6; Eph. 6:4, if they aim at the ministery, prophecy in our presbyterial meetings, 1 Cor. 14:29.</p></blockquote>

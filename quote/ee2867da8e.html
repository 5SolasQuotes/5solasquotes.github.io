<main class="wrap"><figure class="quote" id="q-ee2867da8e" data-kw="">
<blockquote><p>This cathedral music introduces to the Church of God a rabble of church-officers which the Lord never appointed, and which never came into His heart, the choristers and singing-men, and that is a very great evil. It is not in the power of men, but it is the great prerogative of Jesus Christ to appoint officers in His church who has appointed none but pastors and teachers, elders and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-mather.html">Samuel Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Figures or Types of the Old Testament, by which Christ &amp; the Heavenly Things of the Gospel were Preached &amp; Shadowed to the People of God of Old: Explained &amp; Improved in Sundry Sermons (Dublin, 1683)</cite>, pp. 547-53 of ‘The Gospel of the Feast of Trumpets’; p. 440</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“This cathedral music introduces to the Church of God a rabble of church-officers which the Lord never appointed, and which never came into His heart, the choristers and singing-men, and that is a very great evil. It is not in the power of men, but it is the great prerogative of Jesus Christ to appoint officers in His church who has appointed none but pastors and teachers, elders and deacons.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0c7e74abf" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’</cite>, pp. 142-143</span></figcaption>

</figure><figure class="quote" id="q-4843d0e5f4" data-kw="">
<blockquote><p>A second characteristic of Puritan worship was its utter simplicity and sincerity. This unostentatious and modest form of worship found its appropriate domestic setting in meeting-houses… The Puritans refused to let the pealing organ blow To the full-voiced quire below In service high and anthems clear… in favour of the pedestrian metres of the Psalms so that all could memorize them and sing them in unison… their sense of holiness in approaching God was so strong that they could do without any theatrical or adventitious aids which would make tawdry the splendour of the Creator’s covenant mercies to his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship &amp; Theology in England, from Cranmer to Baxter and Fox, 1534-1690</cite>, pp. 530-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-7432244373" data-kw="">
<blockquote><p>But whereas some feign that she asked this because she had vowed her virginity unto God; this needs no long confutation, specially seeing we are by the history itself taught that she was betrothed to a man: neither was there at that time any such custom to vow virginity unto God. But let us return to our purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (d. 1562; 1583), Pt. 3, ch. 3, ‘Of Faith &amp; the Certainty Thereof’, section 7, p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-911b466ed0" data-kw="">
<blockquote><p>If Luther is willing to accept nothing except what is plainly set down in Scripture, why does he believe in the perpetual virginity of Mary? There is nothing to prove this in Scripture and Helvidius actually took it upon himself to prove the contrary, relying on no other authority than that of Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-more.html">Thomas More</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thomas More, ‘An Answer to Martin Luther’ in The Essential Thomas More</cite>, (Canada: Mentor-Omega Books, 1967), p. 112</span></figcaption>

</figure><figure class="quote" id="q-f119d0c2a8" data-kw="">
<blockquote><p>[Signification] 2. Infinite, without end or ceasing, where there is no time following. 2 Sam. 6:23, ‘Michal had no child until her death;’ that is, she never had any. Mt. 28:20, ‘I am with you always, until the end of the world;’ that is, forever. Ps. 110:1 &amp; 123:2. In which [second] of these two significations [the first was ‘unto a certain and appointed time’, Gen. 49:10; Rom. 11:25], we should understand, that in Mt. 1, verse last, ‘Until she had brought forth her first begotten son.’ As it is doubtful among divines: so is it not needful for us to know, being no article of our faith, nor any branch of the Moral Law; yet it is commonly received (as I take it) that Mary was a virgin before the birth, in the birth and ever after the birth; but not by the vow of perpetual virginity, whereof there is no ground in all Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-wilson.html">Thomas Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Dictionary</cite>, … (London, 1612), ‘Until’, pp. 512-3. Wilson (1563–1622) was an Anglican clergyman popular with the puritans.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-5d0cbfd433" data-kw="">
<blockquote><p>Whether she was a virgin before birth, during birth and after birth? It is affirmed. Whether she remained for the whole of life in that state of virginity? It is denied. It is permitted to be investigated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations</cite>, … (Utrecht, 1643), Part 1, 2nd Section, ‘Of Redemption’, Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’, I. ‘Of the Person of Christ the Mediator’, 1. ‘Of the Assumption &amp; Union of the Human Nature’, ‘Of Mary the Mother of Christ’, no page number. In Voet’s explanations of the Latin abbreviations, he explains “Disq” by saying that it can also mean ‘It is investigated’ as long as neither side is said to be determined. And it is probably able to be investigated and [publicly] disputed on either side.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

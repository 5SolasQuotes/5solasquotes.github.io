<blockquote><p>Second, it is asked whether their rites are as it were idolatry. That it seems so:

1. From the fact that it is said in Gal. 5:1, on the words, “Do not again be entangled with the yoke of bondage,” the Gloss says: “This bondage is not lighter than that of idolatry,” because the servitude of the legal observances is likened to idolatry in burden.

2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology</cite>, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 2, ‘Whether the Rite of the Jews is as it were Idolatry’</span></figcaption>

<blockquote><p>First, we need to keep in mind the Fregean point that a difference in sense does not entail a difference in reference. To use Frege’s famous example, the sense of the expression “the morning star” is different from the sense of the expression “the evening star.” But these two expressions refer to one and the same thing, viz. the planet Venus. Similarly, expressions like “the God of the Christians” and “the God of the Muslims” differ in sense, but it doesn’t follow from that alone that they don’t refer to the same God… Second, even a speaker’s erroneous beliefs don’t entail that he is not referring to the same thing that speakers with correct beliefs are referring to… Similarly, the fact that Muslims have what Christians regard as a number of erroneous beliefs about God does not by itself entail that Muslims and Christians are not referring to the same thing when they use the expression “God.</p></blockquote>

<blockquote><p>Whether a prince or magistrate may tolerate Jews in his city or province? Three things may be considered in the Jews. First, the sect and Jewish exercise. Second, usury. Third, hatred toward Christians. All these are evil and prohibited. The question is therefore whether a prince or magistrate may permit or tolerate these evils; and what may be a legitimate cause for permitting and tolerating them? I answer through the following conclusions: First Conclusion. A magistrate may permit the rites and exercises of the Jews if a sufficient cause is present. The Pope of Rome does this, as do many princes in their provinces. The cause may be threefold. First, that through Jewish rites the Christian truth may be shadowed forth and confirmed: St. Augustine, Of the City of God, bk. 18, ch. 46 and St. Thomas in pt. 2 of 2, quest. 10, art. 11, approve this cause. Second, that Jews who practice their rites and understand from the Christians among whom they dwell that those rites were merely shadows and figures of the Christian religion may more easily be converted to the Faith of Christ. St. Thomas, in the cited place, also approves this. Third, that Christian princes or magistrates, under the pretext of permission, may receive money and other gifts from the Jews to whom they permit the exercise. This is not lawful. For public sins, by which God is offended, cannot be permitted for the sake of temporal gain alone, which is hoped for from the permission. Second Conclusion. A magistrate may permit the usuries of the Jews if a sufficient cause is present. The Pope and other Christian princes also do this. The cause may be twofold. One, to prevent a greater evil. For if, as I said above, usuries were not permitted, many thefts, robberies, oppressions of the poor and similar inconveniences would occur. Therefore, to avoid these evils, usuries may be permitted as a lesser evil. The other, that Christian princes and magistrates who permit the usuries of the Jews may be participants in the profit. This is not lawful. For it is certain that usury is prohibited by natural and divine law; and the profit that is acquired through usury is mere theft. Just as, therefore, the Jews sin against justice by receiving usurious profit, so do the Christians who are participants in that profit. They are considered to be participants, however, when they permit usuries for the purpose of being able to receive profit therefrom. This conclusion must be limited in two ways: First, that common usuries may be permitted which do not exceed the profit permitted by law and custom, but not exorbitant usuries, of which I shall speak shortly. Second, that a Christian magistrate may not receive profit from usuries on account of the mere permission of usuries: although they may receive it under another title. And indeed under a double title: First, the title of punishment; because he may punish the Jews on account of usuries; and the profit that has been unjustly acquired from usuries he may either restore to its owners or convert to public utility. Then, the title of exaction; because he may exact an annual tribute or tax from the Jews, not by reason of the permission of usuries, but by reason of the granted habitation in a Christian place. Third Conclusion. A Christian magistrate or prince cannot with a good conscience permit or leave unpunished the hatred of Jews toward Christians. Note: Hatred is twofold: The one is internal; because since it is hidden, the magistrate cannot punish it. The other is external, which breaks out into open injury. This ought to be coerced by the magistrate. We say, therefore, that such hatred, when it is exercised by Jews against Christians, can in no way be permitted or tolerated, but must be severely punished: and the prince sins gravely if he does not punish those who commit offenses. The reason is that a prince is bound by his office to punish every public injury, if he is able, so that justice may be preserved: therefore, he is also bound to punish the injury which the Jews commit against Christians. This is, indeed, manifold: First, because they exact immoderate and intolerable usury from citizens, country folk, and the poor. Whatever they exact beyond the principal is theft. Therefore, they commit intolerable theft. Second, by exacting such usury, they harm the republic or the community greatly. For a republic cannot stand or flourish when the people are oppressed and exhausted by usury. Third, besides usury, another injury is added. For whatever is for sale in the market, the Jews snatch away from the Christians by offering a higher price to the sellers than other buyers are accustomed to offer; and afterwards, which is most iniquitous, Christians are forced to pay double the price to the Jews if they wish to buy what is necessary for feeding their families. Fourth, so that they may do all these things with impunity, they distribute gifts to the officials of princes so that they may be protected by them. Fifth, from this it happens that the people, who bear such injuries with difficulty, become prone to inciting sedition, both against the Jews themselves and against their defenders and patrons. Against the Jews, indeed, because they are thieves and plunderers; against the patrons, because they are partners of thieves and plunderers. If a prince or magistrate does not prevent or punish these great evils (to say nothing of the rest), he is a participant in the crime and is bound to restitution. He can, however, prevent them in three ways. First, if he expels the Jews entirely from his province or city. Second, if he does not indeed expel them, but forces them to agriculture, or to mechanical arts, or to exercise other works; and does not allow them to live in idleness and luxury, as they now live. Third, if he deprives them of all the money and wealth which they have received through usury. Would that these things were brought into practice. You will say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Whether a prince or magistrate may tolerate Jews in his city or province? Three things may be considered in the Jews. First, the sect and Jewish exercise. Second, usury. Third, hatred toward Christians. All these are evil and prohibited. The question is therefore whether a prince or magistrate may permit or tolerate these evils; and what may be a legitimate cause for permitting and tolerating them? I answer through the following conclusions: First Conclusion. A magistrate may permit the rites and exercises of the Jews if a sufficient cause is present. The Pope of Rome does this, as do many princes in their provinces. The cause may be threefold. First, that through Jewish rites the Christian truth may be shadowed forth and confirmed: St. Augustine, Of the City of God, bk. 18, ch. 46 and St. Thomas in pt. 2 of 2, quest. 10, art. 11, approve this cause. Second, that Jews who practice their rites and understand from the Christians among whom they dwell that those rites were merely shadows and figures of the Christian religion may more easily be converted to the Faith of Christ. St. Thomas, in the cited place, also approves this. Third, that Christian princes or magistrates, under the pretext of permission, may receive money and other gifts from the Jews to whom they permit the exercise. This is not lawful. For public sins, by which God is offended, cannot be permitted for the sake of temporal gain alone, which is hoped for from the permission. Second Conclusion. A magistrate may permit the usuries of the Jews if a sufficient cause is present. The Pope and other Christian princes also do this. The cause may be twofold. One, to prevent a greater evil. For if, as I said above, usuries were not permitted, many thefts, robberies, oppressions of the poor and similar inconveniences would occur. Therefore, to avoid these evils, usuries may be permitted as a lesser evil. The other, that Christian princes and magistrates who permit the usuries of the Jews may be participants in the profit. This is not lawful. For it is certain that usury is prohibited by natural and divine law; and the profit that is acquired through usury is mere theft. Just as, therefore, the Jews sin against justice by receiving usurious profit, so do the Christians who are participants in that profit. They are considered to be participants, however, when they permit usuries for the purpose of being able to receive profit therefrom. This conclusion must be limited in two ways: First, that common usuries may be permitted which do not exceed the profit permitted by law and custom, but not exorbitant usuries, of which I shall speak shortly. Second, that a Christian magistrate may not receive profit from usuries on account of the mere permission of usuries: although they may receive it under another title. And indeed under a double title: First, the title of punishment; because he may punish the Jews on account of usuries; and the profit that has been unjustly acquired from usuries he may either restore to its owners or convert to public utility. Then, the title of exaction; because he may exact an annual tribute or tax from the Jews, not by reason of the permission of usuries, but by reason of the granted habitation in a Christian place. Third Conclusion. A Christian magistrate or prince cannot with a good conscience permit or leave unpunished the hatred of Jews toward Christians. Note: Hatred is twofold: The one is internal; because since it is hidden, the magistrate cannot punish it. The other is external, which breaks out into open injury. This ought to be coerced by the magistrate. We say, therefore, that such hatred, when it is exercised by Jews against Christians, can in no way be permitted or tolerated, but must be severely punished: and the prince sins gravely if he does not punish those who commit offenses. The reason is that a prince is bound by his office to punish every public injury, if he is able, so that justice may be preserved: therefore, he is also bound to punish the injury which the Jews commit against Christians. This is, indeed, manifold: First, because they exact immoderate and intolerable usury from citizens, country folk, and the poor. Whatever they exact beyond the principal is theft. Therefore, they commit intolerable theft. Second, by exacting such usury, they harm the republic or the community greatly. For a republic cannot stand or flourish when the people are oppressed and exhausted by usury. Third, besides usury, another injury is added. For whatever is for sale in the market, the Jews snatch away from the Christians by offering a higher price to the sellers than other buyers are accustomed to offer; and afterwards, which is most iniquitous, Christians are forced to pay double the price to the Jews if they wish to buy what is necessary for feeding their families. Fourth, so that they may do all these things with impunity, they distribute gifts to the officials of princes so that they may be protected by them. Fifth, from this it happens that the people, who bear such injuries with difficulty, become prone to inciting sedition, both against the Jews themselves and against their defenders and patrons. Against the Jews, indeed, because they are thieves and plunderers; against the patrons, because they are partners of thieves and plunderers. If a prince or magistrate does not prevent or punish these great evils (to say nothing of the rest), he is a participant in the crime and is bound to restitution. He can, however, prevent them in three ways. First, if he expels the Jews entirely from his province or city. Second, if he does not indeed expel them, but forces them to agriculture, or to mechanical arts, or to exercise other works; and does not allow them to live in idleness and luxury, as they now live. Third, if he deprives them of all the money and wealth which they have received through usury. Would that these things were brought into practice. You will say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.”

— Martin Becanus, Manual of Controversies of this Time (Wurzburg, 1623), bk. 5, ch. 18, ‘Is a prince or magistrate able to tolerate Jews in his city or province?’ tr. AI by The Faith Received Becanus (1563–1624) was a Dutch-born, Roman Catholic, Jesuit priest, known as a theologian and controversialist.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+a+prince+or+magistrate+may+tolerate+Jews+in+his+city+or+province%3F+Three+things+may+be+considered+in+the+Jews.+First%2C+the+sect+and+Jewish+exercise.+Second%2C+usury.+Third%2C+hatred+toward+Christians.+All+these+are+evil+and+prohibited.+The+question+is+therefore+whether+a+prince+or+magistrate+may+permit+or+tolerate+these+evils%3B+and+what+may+be+a+legitimate+cause+for+permitting+and+tolerating+them%3F+I+answer+through+the+following+conclusions%3A+First+Conclusion.+A+magistrate+may+permit+the+rites+and+exercises+of+the+Jews+if+a+sufficient+cause+is+present.+The+Pope+of+Rome+does+this%2C+as+do+many+princes+in+their+provinces.+The+cause+may+be+threefold.+First%2C+that+through+Jewish+rites+the+Christian+truth+may+be+shadowed+forth+and+confirmed%3A+St.+Augustine%2C+Of+the+City+of+God%2C+bk.+18%2C+ch.+46+and+St.+Thomas+in+pt.+2+of+2%2C+quest.+10%2C+art.+11%2C+approve+this+cause.+Second%2C+that+Jews+who+practice+their+rites+and+understand+from+the+Christians+among+whom+they+dwell+that+those+rites+were+merely+shadows+and+figures+of+the+Christian+religion+may+more+easily+be+converted+to+the+Faith+of+Christ.+St.+Thomas%2C+in+the+cited+place%2C+also+approves+this.+Third%2C+that+Christian+princes+or+magistrates%2C+under+the+pretext+of+permission%2C+may+receive+money+and+other+gifts+from+the+Jews+to+whom+they+permit+the+exercise.+This+is+not+lawful.+For+public+sins%2C+by+which+God+is+offended%2C+cannot+be+permitted+for+the+sake+of+temporal+gain+alone%2C+which+is+hoped+for+from+the+permission.+Second+Conclusion.+A+magistrate+may+permit+the+usuries+of+the+Jews+if+a+sufficient+cause+is+present.+The+Pope+and+other+Christian+princes+also+do+this.+The+cause+may+be+twofold.+One%2C+to+prevent+a+greater+evil.+For+if%2C+as+I+said+above%2C+usuries+were+not+permitted%2C+many+thefts%2C+robberies%2C+oppressions+of+the+poor+and+similar+inconveniences+would+occur.+Therefore%2C+to+avoid+these+evils%2C+usuries+may+be+permitted+as+a+lesser+evil.+The+other%2C+that+Christian+princes+and+magistrates+who+permit+the+usuries+of+the+Jews+may+be+participants+in+the+profit.+This+is+not+lawful.+For+it+is+certain+that+usury+is+prohibited+by+natural+and+divine+law%3B+and+the+profit+that+is+acquired+through+usury+is+mere+theft.+Just+as%2C+therefore%2C+the+Jews+sin+against+justice+by+receiving+usurious+profit%2C+so+do+the+Christians+who+are+participants+in+that+profit.+They+are+considered+to+be+participants%2C+however%2C+when+they+permit+usuries+for+the+purpose+of+being+able+to+receive+profit+therefrom.+This+conclusion+must+be+limited+in+two+ways%3A+First%2C+that+common+usuries+may+be+permitted+which+do+not+exceed+the+profit+permitted+by+law+and+custom%2C+but+not+exorbitant+usuries%2C+of+which+I+shall+speak+shortly.+Second%2C+that+a+Christian+magistrate+may+not+receive+profit+from+usuries+on+account+of+the+mere+permission+of+usuries%3A+although+they+may+receive+it+under+another+title.+And+indeed+under+a+double+title%3A+First%2C+the+title+of+punishment%3B+because+he+may+punish+the+Jews+on+account+of+usuries%3B+and+the+profit+that+has+been+unjustly+acquired+from+usuries+he+may+either+restore+to+its+owners+or+convert+to+public+utility.+Then%2C+the+title+of+exaction%3B+because+he+may+exact+an+annual+tribute+or+tax+from+the+Jews%2C+not+by+reason+of+the+permission+of+usuries%2C+but+by+reason+of+the+granted+habitation+in+a+Christian+place.+Third+Conclusion.+A+Christian+magistrate+or+prince+cannot+with+a+good+conscience+permit+or+leave+unpunished+the+hatred+of+Jews+toward+Christians.+Note%3A+Hatred+is+twofold%3A+The+one+is+internal%3B+because+since+it+is+hidden%2C+the+magistrate+cannot+punish+it.+The+other+is+external%2C+which+breaks+out+into+open+injury.+This+ought+to+be+coerced+by+the+magistrate.+We+say%2C+therefore%2C+that+such+hatred%2C+when+it+is+exercised+by+Jews+against+Christians%2C+can+in+no+way+be+permitted+or+tolerated%2C+but+must+be+severely+punished%3A+and+the+prince+sins+gravely+if+he+does+not+punish+those+who+commit+offenses.+The+reason+is+that+a+prince+is+bound+by+his+office+to+punish+every+public+injury%2C+if+he+is+able%2C+so+that+justice+may+be+preserved%3A+therefore%2C+he+is+also+bound+to+punish+the+injury+which+the+Jews+commit+against+Christians.+This+is%2C+indeed%2C+manifold%3A+First%2C+because+they+exact+immoderate+and+intolerable+usury+from+citizens%2C+country+folk%2C+and+the+poor.+Whatever+they+exact+beyond+the+principal+is+theft.+Therefore%2C+they+commit+intolerable+theft.+Second%2C+by+exacting+such+usury%2C+they+harm+the+republic+or+the+community+greatly.+For+a+republic+cannot+stand+or+flourish+when+the+people+are+oppressed+and+exhausted+by+usury.+Third%2C+besides+usury%2C+another+injury+is+added.+For+whatever+is+for+sale+in+the+market%2C+the+Jews+snatch+away+from+the+Christians+by+offering+a+higher+price+to+the+sellers+than+other+buyers+are+accustomed+to+offer%3B+and+afterwards%2C+which+is+most+iniquitous%2C+Christians+are+forced+to+pay+double+the+price+to+the+Jews+if+they+wish+to+buy+what+is+necessary+for+feeding+their+families.+Fourth%2C+so+that+they+may+do+all+these+things+with+impunity%2C+they+distribute+gifts+to+the+officials+of+princes+so+that+they+may+be+protected+by+them.+Fifth%2C+from+this+it+happens+that+the+people%2C+who+bear+such+injuries+with+difficulty%2C+become+prone+to+inciting+sedition%2C+both+against+the+Jews+themselves+and+against+their+defenders+and+patrons.+Against+the+Jews%2C+indeed%2C+because+they+are+thieves+and+plunderers%3B+against+the+patrons%2C+because+they+are+partners+of+thieves+and+plunderers.+If+a+prince+or+magistrate+does+not+prevent+or+punish+these+great+evils+%28to+say+nothing+of+the+rest%29%2C+he+is+a+participant+in+the+crime+and+is+bound+to+restitution.+He+can%2C+however%2C+prevent+them+in+three+ways.+First%2C+if+he+expels+the+Jews+entirely+from+his+province+or+city.+Second%2C+if+he+does+not+indeed+expel+them%2C+but+forces+them+to+agriculture%2C+or+to+mechanical+arts%2C+or+to+exercise+other+works%3B+and+does+not+allow+them+to+live+in+idleness+and+luxury%2C+as+they+now+live.+Third%2C+if+he+deprives+them+of+all+the+money+and+wealth+which+they+have+received+through+usury.+Would+that+these+things+were+brought+into+practice.+You+will+say%2C+if+the+Jews+are+either+expelled+or+do+not+accept+usury%2C+two+inconveniences+will+follow%3A+First%2C+because+Christian+princes+in+time+of+necessity+will+not+have+money+for+war.+For+they+are+accustomed+to+seek+this+from+the+Jews.+Then%2C+the+subjects+of+the+princes%2C+who+are+in+need+of+money%2C+will+not+be+able+to+borrow.+I+respond%3A+The+contrary+follows%3A+First%2C+because+once+the+Jews+are+expelled%2C+the+citizens+will+be+able+to+contribute+more+support+than+the+Jews+are+accustomed+to.+For+whatever+the+Jews+contribute%2C+they+receive+from+the+citizens+through+unjust+usury.+And+not+only+this%2C+but+also+whatever+is+necessary+for+them+to+sustain+their+lives.+Therefore%2C+they+take+two+portions+from+the+citizens%3A+one%2C+which+they+give+to+the+prince%3B+the+other%2C+by+which+they+live.+Certainly%2C+if+the+Jews+were+expelled%2C+the+citizens+would+be+prepared+to+give+either+both+portions+to+their+prince%2C+or+at+least+no+less+than+they+give+to+the+Jews.+Next%2C+the+subjects+of+princes+are+in+greater+need+of+money+when+the+Jews+are+present+than+when+they+are+absent.+For+when+they+are+present+and+demanding+intolerable+usury%2C+they+are+completely+drained.+If+they+were+absent%2C+or+at+least+did+not+demand+such+immoderate+usury%2C+the+subjects+would+be+less+drained%2C+and+consequently+would+be+in+less+need+of+money.+Our+Adam+Contzen+has+written+extensively+on+this+subject+in+his+Politics.%E2%80%9D%0A%0A%E2%80%94+Martin+Becanus%2C+Manual+of+Controversies+of+this+Time+%28Wurzburg%2C+1623%29%2C+bk.+5%2C+ch.+18%2C+%E2%80%98Is+a+prince+or+magistrate+able+to+tolerate+Jews+in+his+city+or+province%3F%E2%80%99+tr.+AI+by+The+Faith+Received+Becanus+%281563%E2%80%931624%29+was+a+Dutch-born%2C+Roman+Catholic%2C+Jesuit+priest%2C+known+as+a+theologian+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ca8f987c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ca8f987c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Whether%20a%20prince%20or%20magistrate%20may,on%20this%20subject%20in%20his%20Politics&amp;text=Whether%20a%20prince%20or%20magistrate%20may%20tolerate%20Jews&amp;text=written%20extensively%20on%20this%20subject%20in%20his%20Politics" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>“46. Now there remains to speak somewhat particularly of Jews and heretics: for this kind of men are suffered almost in all cities, provinces and kingdoms, and they dwell together with Christians. Why the Jews should be suffered, Augustine among others brings certain reasons. He, Of the City of God, bk. 4, ch. 18, as also upon the 58th psalm and in other places, writes that therefore they be suffered because they before other men had the promise of salvation; neither are they past all hope, seeing that some of them many times, although few in number, do return unto Christ. ‘Blindness’ (says Paul unto the Romans) ‘fell partly upon Israel’ (Rom. 11:25): as though he would say not upon all. And to this the same apostle adds, ‘When the fulness of the gentiles is come in, then all Israel shall be saved.’ (Rom. 11:25-26) And lest peradventure thou shouldest think that these words are spoken allegorically, Paul writes them as a mystery. And to prove his saying he brings the prophecy of Isaiah the prophet, to wit, that ‘the iniquity shall be then taken away from Jacob.’ Furthermore, they be now called ‘enemies unto God for our sakes, but friends in respect of their fathers.’ The same Augustine, in his Questions upon the Gospel, bk. 2 and question 33 (if those be Augustine’s books) when he interprets the parable of the prodigal son, he says that that son does betoken the gentiles. For it is written, that he departed into a far country (Lk. 15:11); because the ethnics were so far departed from God as they worshipped idols publicly and in open profession. But the elder son, under whom is shadowed the Hebrew people, went not so far off. And although he were not within his father’s house, which is the church, yet nevertheless he abode in the field. For the Jews are occupied in the holy scriptures, which they understand not rightly, nor with such spiritual sense as the church of Christ does know them; but take them in an earthly and carnal manner, whereby not unaptly they be said to have their abode in the field. This elder son does not at the beginning enter into his father’s house, but in the latter days he shall also be called and come.

47. The same father also for the proof of this doctrine brings that which is written in the 59th psalm, as he reads it, ‘Do not kill them, lest they forget thy law, but scatter them in thy power.’ (v. 12) The Son of God (says he) prays unto the Father that the same nation might not be destroyed, but that it might wander every where in the world. Other provinces, when they were overcome of the Romans, followed the laws and rites of the Romans, so that at length they became Romans: but the Hebrews, notwithstanding they were overcome by the Romans, yet would they never yield unto their laws, rites and ceremonies. They still observe their own as much as they may; and being dispersed, they wander abroad. Neither have they utterly forgotten the law of God; not that the godly apply themselves to observe it, but do only read it and keep certain rites and ceremonies, whereby they are discerned from other nations. Verily it seems that God has put a sign upon them as He did upon Cain for killing his brother Abel, namely, that every man should not kill them. (Gen. 4:15) Neither is this scattering of them abroad in the world unprofitable unto the Christians, because (as it is written to the Romans) they are showed unto us as broken boughs. (Rom. 11:17) And for so much as we were grafted in their place, when as we see that they were so miserably cut off, we acknowledge the grace of God towards us: and by beholding of them be taught to take heed that for our infidelity’s sake, for the which they were broken off, we also be not cut off in like manner. Moreover, there is another commodity which comes unto us by the dispersing of them. Because our books are saved by them; I mean the holy Bible, which they carry everywhere about them and read it. And although because they be blinded they believe not, yet they confess that those writings are most true. Indeed they be in heart our deadly enemies; but yet by these books, which they have and reverence, they are a testimony to our religion. Wherefore I cannot marvel sufficiently at those which do so much hate the Jewish tongue and Bibles in Hebrew, as they desire to have them destroyed and burnt, seeing Augustine, On Christian Doctrine, thinks, that wheresoever we doubt of the Greek or Latin translation, we must flee unto the truth of the Hebrew. And Jerome in many places writes the same.

48. But they say that the holy books were abused and corrupted by the Hebrews. To this Jerome upon Isaiah, the sixth chapter, towards the end, answers thus: Either they did this before the coming of Christ and the preaching of the apostles, or else afterward. If a man will say that it was done of them before, then, seeing Christ and his apostles reprehended the most grievous wicked acts of the Jews, I marvel why they would say nothing of that sacrilege and so detestable a wicked act. Undoubtedly they would have reproved them for marring and corrupting of the scriptures. But if thou wilt affirm that the faults were brought in by them afterward: then will I say that it had behooved them to corrupt those places chiefly which do testify of Christ and of his religion; and which were alleged by the Lord Himself and his apostles in the New Testament. But those places remain sound; and the very same sentences which they cited do remain still in the Hebrew Bibles: for they were not so greatly careful for the words, and it is not likely, that they in other places have corrupted the holy scriptures. Yea, if a man diligently read over their books, he shall find in them a great many more testimonies, and those more plain and manifest, than our common translation has. Do they not read in the second psalm, ‘Kiss the son’: which our men have translated, ‘Take ye hold of discipline?’ Which words undoubtedly are referred unto Christ. But I do not mean at this present to bring all such like testimonies: it is sufficient if I prove with Jerome that the books of holy scriptures are not corrupted by the Hebrews. The which surely, if they would have done, yet had they missed of their purpose. For many of the most ancient books are found, and that in written hand, which have been kept a very long time by the Christians, which never came in their hands to abuse.

49. But let us return to discourse of that commodity, which Augustine has declared; There be very many (says he) which would peradventure think that the things which we affirm to be done of the ancient people and of the prophets were but vain and imagined by us, unless they saw the Jews yet alive, who with their books maintain that which we profess, whether they will or no. For although the Hebrews be blinded in their heart, and be against us with as much power as they can, yet we have themselves, together with their books, most evident testimonies of our religion. And doubtless, among all testimonies, that testimony is of greatest account, which is testified by the enemies. And of this kind of witnesses God has provided great store for his Church: for we not only have the Hebrew books to make on our side, but also the verses of the Sibyls, which were born in sundry countries. Neither must it be thought, that those verses were invented by our forefathers themselves: for in the time of Lactantius, Eusebius of Caesaria and Augustine, which alleged those verses, the books of the Sibyls were rife in every man’s hand. So as, if they had added any counterfeit verses unto them, the ethnics, which were then many in number and were full of eloquence, and deadly enemies unto our religion, would have reproved them as vain and lying. What then remains but that God would wonderfully defend his Church even by the testimonies of his adversaries? Now then, the Jews are tolerated among the Christians, partly for the promise’s sake, which they have of salvation to be given to their kindred, and partly because of the commodities, which I have now recited out of Augustine. Wherefore they be not only borne withal, but they have also synagogues where they openly read the books of the holy scripture and one with another do call upon the God of their fathers. In which thing nevertheless, the diligence of magistrates and bishops is to be required, who ought to provide that they do nothing else there, and by all means to beware that in their public prayers, exhortations and sermons they do not curse nor rail upon Christ our God. And this, if our magistrates and bishops do not look unto, they cannot escape a just accusation. But it is not lawful to grant unto the Turks any religious assemblies, for that they have not any particular promise of their salvation: neither would they read there either the Old Testament or the New, but only their most detestable Al Koran. Over this, the Jews should be prohibited to exercise false bargaining and usury among Christians, thereby to vex and afflict the poor Christians before our face: the which cannot be done without great indignity. But our princes exact a good, great tribute of them; and of those gains which come by usury and naughty bargaining, they obtain great prey: so far are they from forbidding them these evil arts. Furthermore (a thing no less hurtful), they provide not to have them taught, when as they ought to compel them to come often to godly Christian sermons: otherwise, while they be so negligently left, they become daily worse and worse. Whereby, either naughty fruit or in a manner none at all can be looked for by the conversation which they have among Christians. It must also be looked diligently to that they corrupt not Christians in seducing them to their Jewish religion. By reason of neglecting hereof, the heresy of the Marrans has much increased, specially in Spain. Moreover, it is meet that they may by some apparel or certain token be known from Christians, lest any unwittingly should be familiar with them no less than with the Christians. And these things shall suffice concerning this sort of infidels.</p></blockquote>

<div class="actions"><button class="copy" data-copy="““46. Now there remains to speak somewhat particularly of Jews and heretics: for this kind of men are suffered almost in all cities, provinces and kingdoms, and they dwell together with Christians. Why the Jews should be suffered, Augustine among others brings certain reasons. He, Of the City of God, bk. 4, ch. 18, as also upon the 58th psalm and in other places, writes that therefore they be suffered because they before other men had the promise of salvation; neither are they past all hope, seeing that some of them many times, although few in number, do return unto Christ. ‘Blindness’ (says Paul unto the Romans) ‘fell partly upon Israel’ (Rom. 11:25): as though he would say not upon all. And to this the same apostle adds, ‘When the fulness of the gentiles is come in, then all Israel shall be saved.’ (Rom. 11:25-26) And lest peradventure thou shouldest think that these words are spoken allegorically, Paul writes them as a mystery. And to prove his saying he brings the prophecy of Isaiah the prophet, to wit, that ‘the iniquity shall be then taken away from Jacob.’ Furthermore, they be now called ‘enemies unto God for our sakes, but friends in respect of their fathers.’ The same Augustine, in his Questions upon the Gospel, bk. 2 and question 33 (if those be Augustine’s books) when he interprets the parable of the prodigal son, he says that that son does betoken the gentiles. For it is written, that he departed into a far country (Lk. 15:11); because the ethnics were so far departed from God as they worshipped idols publicly and in open profession. But the elder son, under whom is shadowed the Hebrew people, went not so far off. And although he were not within his father’s house, which is the church, yet nevertheless he abode in the field. For the Jews are occupied in the holy scriptures, which they understand not rightly, nor with such spiritual sense as the church of Christ does know them; but take them in an earthly and carnal manner, whereby not unaptly they be said to have their abode in the field. This elder son does not at the beginning enter into his father’s house, but in the latter days he shall also be called and come.

47. The same father also for the proof of this doctrine brings that which is written in the 59th psalm, as he reads it, ‘Do not kill them, lest they forget thy law, but scatter them in thy power.’ (v. 12) The Son of God (says he) prays unto the Father that the same nation might not be destroyed, but that it might wander every where in the world. Other provinces, when they were overcome of the Romans, followed the laws and rites of the Romans, so that at length they became Romans: but the Hebrews, notwithstanding they were overcome by the Romans, yet would they never yield unto their laws, rites and ceremonies. They still observe their own as much as they may; and being dispersed, they wander abroad. Neither have they utterly forgotten the law of God; not that the godly apply themselves to observe it, but do only read it and keep certain rites and ceremonies, whereby they are discerned from other nations. Verily it seems that God has put a sign upon them as He did upon Cain for killing his brother Abel, namely, that every man should not kill them. (Gen. 4:15) Neither is this scattering of them abroad in the world unprofitable unto the Christians, because (as it is written to the Romans) they are showed unto us as broken boughs. (Rom. 11:17) And for so much as we were grafted in their place, when as we see that they were so miserably cut off, we acknowledge the grace of God towards us: and by beholding of them be taught to take heed that for our infidelity’s sake, for the which they were broken off, we also be not cut off in like manner. Moreover, there is another commodity which comes unto us by the dispersing of them. Because our books are saved by them; I mean the holy Bible, which they carry everywhere about them and read it. And although because they be blinded they believe not, yet they confess that those writings are most true. Indeed they be in heart our deadly enemies; but yet by these books, which they have and reverence, they are a testimony to our religion. Wherefore I cannot marvel sufficiently at those which do so much hate the Jewish tongue and Bibles in Hebrew, as they desire to have them destroyed and burnt, seeing Augustine, On Christian Doctrine, thinks, that wheresoever we doubt of the Greek or Latin translation, we must flee unto the truth of the Hebrew. And Jerome in many places writes the same.

48. But they say that the holy books were abused and corrupted by the Hebrews. To this Jerome upon Isaiah, the sixth chapter, towards the end, answers thus: Either they did this before the coming of Christ and the preaching of the apostles, or else afterward. If a man will say that it was done of them before, then, seeing Christ and his apostles reprehended the most grievous wicked acts of the Jews, I marvel why they would say nothing of that sacrilege and so detestable a wicked act. Undoubtedly they would have reproved them for marring and corrupting of the scriptures. But if thou wilt affirm that the faults were brought in by them afterward: then will I say that it had behooved them to corrupt those places chiefly which do testify of Christ and of his religion; and which were alleged by the Lord Himself and his apostles in the New Testament. But those places remain sound; and the very same sentences which they cited do remain still in the Hebrew Bibles: for they were not so greatly careful for the words, and it is not likely, that they in other places have corrupted the holy scriptures. Yea, if a man diligently read over their books, he shall find in them a great many more testimonies, and those more plain and manifest, than our common translation has. Do they not read in the second psalm, ‘Kiss the son’: which our men have translated, ‘Take ye hold of discipline?’ Which words undoubtedly are referred unto Christ. But I do not mean at this present to bring all such like testimonies: it is sufficient if I prove with Jerome that the books of holy scriptures are not corrupted by the Hebrews. The which surely, if they would have done, yet had they missed of their purpose. For many of the most ancient books are found, and that in written hand, which have been kept a very long time by the Christians, which never came in their hands to abuse.

49. But let us return to discourse of that commodity, which Augustine has declared; There be very many (says he) which would peradventure think that the things which we affirm to be done of the ancient people and of the prophets were but vain and imagined by us, unless they saw the Jews yet alive, who with their books maintain that which we profess, whether they will or no. For although the Hebrews be blinded in their heart, and be against us with as much power as they can, yet we have themselves, together with their books, most evident testimonies of our religion. And doubtless, among all testimonies, that testimony is of greatest account, which is testified by the enemies. And of this kind of witnesses God has provided great store for his Church: for we not only have the Hebrew books to make on our side, but also the verses of the Sibyls, which were born in sundry countries. Neither must it be thought, that those verses were invented by our forefathers themselves: for in the time of Lactantius, Eusebius of Caesaria and Augustine, which alleged those verses, the books of the Sibyls were rife in every man’s hand. So as, if they had added any counterfeit verses unto them, the ethnics, which were then many in number and were full of eloquence, and deadly enemies unto our religion, would have reproved them as vain and lying. What then remains but that God would wonderfully defend his Church even by the testimonies of his adversaries? Now then, the Jews are tolerated among the Christians, partly for the promise’s sake, which they have of salvation to be given to their kindred, and partly because of the commodities, which I have now recited out of Augustine. Wherefore they be not only borne withal, but they have also synagogues where they openly read the books of the holy scripture and one with another do call upon the God of their fathers. In which thing nevertheless, the diligence of magistrates and bishops is to be required, who ought to provide that they do nothing else there, and by all means to beware that in their public prayers, exhortations and sermons they do not curse nor rail upon Christ our God. And this, if our magistrates and bishops do not look unto, they cannot escape a just accusation. But it is not lawful to grant unto the Turks any religious assemblies, for that they have not any particular promise of their salvation: neither would they read there either the Old Testament or the New, but only their most detestable Al Koran. Over this, the Jews should be prohibited to exercise false bargaining and usury among Christians, thereby to vex and afflict the poor Christians before our face: the which cannot be done without great indignity. But our princes exact a good, great tribute of them; and of those gains which come by usury and naughty bargaining, they obtain great prey: so far are they from forbidding them these evil arts. Furthermore (a thing no less hurtful), they provide not to have them taught, when as they ought to compel them to come often to godly Christian sermons: otherwise, while they be so negligently left, they become daily worse and worse. Whereby, either naughty fruit or in a manner none at all can be looked for by the conversation which they have among Christians. It must also be looked diligently to that they corrupt not Christians in seducing them to their Jewish religion. By reason of neglecting hereof, the heresy of the Marrans has much increased, specially in Spain. Moreover, it is meet that they may by some apparel or certain token be known from Christians, lest any unwittingly should be familiar with them no less than with the Christians. And these things shall suffice concerning this sort of infidels.”

— Peter Martyr Vermigli, Common Places, II.2.26, … (d. 1562; London: Henrie Denham et al., 1583), pt. 2, ch. 4, ‘The First Precept, where is entreated of Idolatry, and sundry kinds of Idols’, ‘Of the Suffering of Jews &amp; Heretics’, pp. 328-30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%9C46.+Now+there+remains+to+speak+somewhat+particularly+of+Jews+and+heretics%3A+for+this+kind+of+men+are+suffered+almost+in+all+cities%2C+provinces+and+kingdoms%2C+and+they+dwell+together+with+Christians.+Why+the+Jews+should+be+suffered%2C+Augustine+among+others+brings+certain+reasons.+He%2C+Of+the+City+of+God%2C+bk.+4%2C+ch.+18%2C+as+also+upon+the+58th+psalm+and+in+other+places%2C+writes+that+therefore+they+be+suffered+because+they+before+other+men+had+the+promise+of+salvation%3B+neither+are+they+past+all+hope%2C+seeing+that+some+of+them+many+times%2C+although+few+in+number%2C+do+return+unto+Christ.+%E2%80%98Blindness%E2%80%99+%28says+Paul+unto+the+Romans%29+%E2%80%98fell+partly+upon+Israel%E2%80%99+%28Rom.+11%3A25%29%3A+as+though+he+would+say+not+upon+all.+And+to+this+the+same+apostle+adds%2C+%E2%80%98When+the+fulness+of+the+gentiles+is+come+in%2C+then+all+Israel+shall+be+saved.%E2%80%99+%28Rom.+11%3A25-26%29+And+lest+peradventure+thou+shouldest+think+that+these+words+are+spoken+allegorically%2C+Paul+writes+them+as+a+mystery.+And+to+prove+his+saying+he+brings+the+prophecy+of+Isaiah+the+prophet%2C+to+wit%2C+that+%E2%80%98the+iniquity+shall+be+then+taken+away+from+Jacob.%E2%80%99+Furthermore%2C+they+be+now+called+%E2%80%98enemies+unto+God+for+our+sakes%2C+but+friends+in+respect+of+their+fathers.%E2%80%99+The+same+Augustine%2C+in+his+Questions+upon+the+Gospel%2C+bk.+2+and+question+33+%28if+those+be+Augustine%E2%80%99s+books%29+when+he+interprets+the+parable+of+the+prodigal+son%2C+he+says+that+that+son+does+betoken+the+gentiles.+For+it+is+written%2C+that+he+departed+into+a+far+country+%28Lk.+15%3A11%29%3B+because+the+ethnics+were+so+far+departed+from+God+as+they+worshipped+idols+publicly+and+in+open+profession.+But+the+elder+son%2C+under+whom+is+shadowed+the+Hebrew+people%2C+went+not+so+far+off.+And+although+he+were+not+within+his+father%E2%80%99s+house%2C+which+is+the+church%2C+yet+nevertheless+he+abode+in+the+field.+For+the+Jews+are+occupied+in+the+holy+scriptures%2C+which+they+understand+not+rightly%2C+nor+with+such+spiritual+sense+as+the+church+of+Christ+does+know+them%3B+but+take+them+in+an+earthly+and+carnal+manner%2C+whereby+not+unaptly+they+be+said+to+have+their+abode+in+the+field.+This+elder+son+does+not+at+the+beginning+enter+into+his+father%E2%80%99s+house%2C+but+in+the+latter+days+he+shall+also+be+called+and+come.+47.+The+same+father+also+for+the+proof+of+this+doctrine+brings+that+which+is+written+in+the+59th+psalm%2C+as+he+reads+it%2C+%E2%80%98Do+not+kill+them%2C+lest+they+forget+thy+law%2C+but+scatter+them+in+thy+power.%E2%80%99+%28v.+12%29+The+Son+of+God+%28says+he%29+prays+unto+the+Father+that+the+same+nation+might+not+be+destroyed%2C+but+that+it+might+wander+every+where+in+the+world.+Other+provinces%2C+when+they+were+overcome+of+the+Romans%2C+followed+the+laws+and+rites+of+the+Romans%2C+so+that+at+length+they+became+Romans%3A+but+the+Hebrews%2C+notwithstanding+they+were+overcome+by+the+Romans%2C+yet+would+they+never+yield+unto+their+laws%2C+rites+and+ceremonies.+They+still+observe+their+own+as+much+as+they+may%3B+and+being+dispersed%2C+they+wander+abroad.+Neither+have+they+utterly+forgotten+the+law+of+God%3B+not+that+the+godly+apply+themselves+to+observe+it%2C+but+do+only+read+it+and+keep+certain+rites+and+ceremonies%2C+whereby+they+are+discerned+from+other+nations.+Verily+it+seems+that+God+has+put+a+sign+upon+them+as+He+did+upon+Cain+for+killing+his+brother+Abel%2C+namely%2C+that+every+man+should+not+kill+them.+%28Gen.+4%3A15%29+Neither+is+this+scattering+of+them+abroad+in+the+world+unprofitable+unto+the+Christians%2C+because+%28as+it+is+written+to+the+Romans%29+they+are+showed+unto+us+as+broken+boughs.+%28Rom.+11%3A17%29+And+for+so+much+as+we+were+grafted+in+their+place%2C+when+as+we+see+that+they+were+so+miserably+cut+off%2C+we+acknowledge+the+grace+of+God+towards+us%3A+and+by+beholding+of+them+be+taught+to+take+heed+that+for+our+infidelity%E2%80%99s+sake%2C+for+the+which+they+were+broken+off%2C+we+also+be+not+cut+off+in+like+manner.+Moreover%2C+there+is+another+commodity+which+comes+unto+us+by+the+dispersing+of+them.+Because+our+books+are+saved+by+them%3B+I+mean+the+holy+Bible%2C+which+they+carry+everywhere+about+them+and+read+it.+And+although+because+they+be+blinded+they+believe+not%2C+yet+they+confess+that+those+writings+are+most+true.+Indeed+they+be+in+heart+our+deadly+enemies%3B+but+yet+by+these+books%2C+which+they+have+and+reverence%2C+they+are+a+testimony+to+our+religion.+Wherefore+I+cannot+marvel+sufficiently+at+those+which+do+so+much+hate+the+Jewish+tongue+and+Bibles+in+Hebrew%2C+as+they+desire+to+have+them+destroyed+and+burnt%2C+seeing+Augustine%2C+On+Christian+Doctrine%2C+thinks%2C+that+wheresoever+we+doubt+of+the+Greek+or+Latin+translation%2C+we+must+flee+unto+the+truth+of+the+Hebrew.+And+Jerome+in+many+places+writes+the+same.+48.+But+they+say+that+the+holy+books+were+abused+and+corrupted+by+the+Hebrews.+To+this+Jerome+upon+Isaiah%2C+the+sixth+chapter%2C+towards+the+end%2C+answers+thus%3A+Either+they+did+this+before+the+coming+of+Christ+and+the+preaching+of+the+apostles%2C+or+else+afterward.+If+a+man+will+say+that+it+was+done+of+them+before%2C+then%2C+seeing+Christ+and+his+apostles+reprehended+the+most+grievous+wicked+acts+of+the+Jews%2C+I+marvel+why+they+would+say+nothing+of+that+sacrilege+and+so+detestable+a+wicked+act.+Undoubtedly+they+would+have+reproved+them+for+marring+and+corrupting+of+the+scriptures.+But+if+thou+wilt+affirm+that+the+faults+were+brought+in+by+them+afterward%3A+then+will+I+say+that+it+had+behooved+them+to+corrupt+those+places+chiefly+which+do+testify+of+Christ+and+of+his+religion%3B+and+which+were+alleged+by+the+Lord+Himself+and+his+apostles+in+the+New+Testament.+But+those+places+remain+sound%3B+and+the+very+same+sentences+which+they+cited+do+remain+still+in+the+Hebrew+Bibles%3A+for+they+were+not+so+greatly+careful+for+the+words%2C+and+it+is+not+likely%2C+that+they+in+other+places+have+corrupted+the+holy+scriptures.+Yea%2C+if+a+man+diligently+read+over+their+books%2C+he+shall+find+in+them+a+great+many+more+testimonies%2C+and+those+more+plain+and+manifest%2C+than+our+common+translation+has.+Do+they+not+read+in+the+second+psalm%2C+%E2%80%98Kiss+the+son%E2%80%99%3A+which+our+men+have+translated%2C+%E2%80%98Take+ye+hold+of+discipline%3F%E2%80%99+Which+words+undoubtedly+are+referred+unto+Christ.+But+I+do+not+mean+at+this+present+to+bring+all+such+like+testimonies%3A+it+is+sufficient+if+I+prove+with+Jerome+that+the+books+of+holy+scriptures+are+not+corrupted+by+the+Hebrews.+The+which+surely%2C+if+they+would+have+done%2C+yet+had+they+missed+of+their+purpose.+For+many+of+the+most+ancient+books+are+found%2C+and+that+in+written+hand%2C+which+have+been+kept+a+very+long+time+by+the+Christians%2C+which+never+came+in+their+hands+to+abuse.+49.+But+let+us+return+to+discourse+of+that+commodity%2C+which+Augustine+has+declared%3B+There+be+very+many+%28says+he%29+which+would+peradventure+think+that+the+things+which+we+affirm+to+be+done+of+the+ancient+people+and+of+the+prophets+were+but+vain+and+imagined+by+us%2C+unless+they+saw+the+Jews+yet+alive%2C+who+with+their+books+maintain+that+which+we+profess%2C+whether+they+will+or+no.+For+although+the+Hebrews+be+blinded+in+their+heart%2C+and+be+against+us+with+as+much+power+as+they+can%2C+yet+we+have+themselves%2C+together+with+their+books%2C+most+evident+testimonies+of+our+religion.+And+doubtless%2C+among+all+testimonies%2C+that+testimony+is+of+greatest+account%2C+which+is+testified+by+the+enemies.+And+of+this+kind+of+witnesses+God+has+provided+great+store+for+his+Church%3A+for+we+not+only+have+the+Hebrew+books+to+make+on+our+side%2C+but+also+the+verses+of+the+Sibyls%2C+which+were+born+in+sundry+countries.+Neither+must+it+be+thought%2C+that+those+verses+were+invented+by+our+forefathers+themselves%3A+for+in+the+time+of+Lactantius%2C+Eusebius+of+Caesaria+and+Augustine%2C+which+alleged+those+verses%2C+the+books+of+the+Sibyls+were+rife+in+every+man%E2%80%99s+hand.+So+as%2C+if+they+had+added+any+counterfeit+verses+unto+them%2C+the+ethnics%2C+which+were+then+many+in+number+and+were+full+of+eloquence%2C+and+deadly+enemies+unto+our+religion%2C+would+have+reproved+them+as+vain+and+lying.+What+then+remains+but+that+God+would+wonderfully+defend+his+Church+even+by+the+testimonies+of+his+adversaries%3F+Now+then%2C+the+Jews+are+tolerated+among+the+Christians%2C+partly+for+the+promise%E2%80%99s+sake%2C+which+they+have+of+salvation+to+be+given+to+their+kindred%2C+and+partly+because+of+the+commodities%2C+which+I+have+now+recited+out+of+Augustine.+Wherefore+they+be+not+only+borne+withal%2C+but+they+have+also+synagogues+where+they+openly+read+the+books+of+the+holy+scripture+and+one+with+another+do+call+upon+the+God+of+their+fathers.+In+which+thing+nevertheless%2C+the+diligence+of+magistrates+and+bishops+is+to+be+required%2C+who+ought+to+provide+that+they+do+nothing+else+there%2C+and+by+all+means+to+beware+that+in+their+public+prayers%2C+exhortations+and+sermons+they+do+not+curse+nor+rail+upon+Christ+our+God.+And+this%2C+if+our+magistrates+and+bishops+do+not+look+unto%2C+they+cannot+escape+a+just+accusation.+But+it+is+not+lawful+to+grant+unto+the+Turks+any+religious+assemblies%2C+for+that+they+have+not+any+particular+promise+of+their+salvation%3A+neither+would+they+read+there+either+the+Old+Testament+or+the+New%2C+but+only+their+most+detestable+Al+Koran.+Over+this%2C+the+Jews+should+be+prohibited+to+exercise+false+bargaining+and+usury+among+Christians%2C+thereby+to+vex+and+afflict+the+poor+Christians+before+our+face%3A+the+which+cannot+be+done+without+great+indignity.+But+our+princes+exact+a+good%2C+great+tribute+of+them%3B+and+of+those+gains+which+come+by+usury+and+naughty+bargaining%2C+they+obtain+great+prey%3A+so+far+are+they+from+forbidding+them+these+evil+arts.+Furthermore+%28a+thing+no+less+hurtful%29%2C+they+provide+not+to+have+them+taught%2C+when+as+they+ought+to+compel+them+to+come+often+to+godly+Christian+sermons%3A+otherwise%2C+while+they+be+so+negligently+left%2C+they+become+daily+worse+and+worse.+Whereby%2C+either+naughty+fruit+or+in+a+manner+none+at+all+can+be+looked+for+by+the+conversation+which+they+have+among+Christians.+It+must+also+be+looked+diligently+to+that+they+corrupt+not+Christians+in+seducing+them+to+their+Jewish+religion.+By+reason+of+neglecting+hereof%2C+the+heresy+of+the+Marrans+has+much+increased%2C+specially+in+Spain.+Moreover%2C+it+is+meet+that+they+may+by+some+apparel+or+certain+token+be+known+from+Christians%2C+lest+any+unwittingly+should+be+familiar+with+them+no+less+than+with+the+Christians.+And+these+things+shall+suffice+concerning+this+sort+of+infidels.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Common+Places%2C+II.2.26%2C+%E2%80%A6+%28d.+1562%3B+London%3A+Henrie+Denham+et+al.%2C+1583%29%2C+pt.+2%2C+ch.+4%2C+%E2%80%98The+First+Precept%2C+where+is+entreated+of+Idolatry%2C+and+sundry+kinds+of+Idols%E2%80%99%2C+%E2%80%98Of+the+Suffering+of+Jews+%26+Heretics%E2%80%99%2C+pp.+328-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9401c9b669.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9401c9b669.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=46.%20Now%20there%20remains%20to%20speak,suffice%20concerning%20this%20sort%20of%20infidels&amp;text=46.%20Now%20there%20remains%20to%20speak%20somewhat%20particularly&amp;text=things%20shall%20suffice%20concerning%20this%20sort%20of%20infidels" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

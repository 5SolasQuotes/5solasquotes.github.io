<blockquote><p>…our brethren of the episcopal way… Very many of the people that stick most resolutely to that party and those ways (of my acquaintance) are such as we cannot admit to communion with us, till they shall openly profess their repentance of their drunkenness, swearing, scorning at godliness, etc. which they are notoriously guilty of: These I will not stand to dispute with about ceremonies, they having greater matters first to dispatch.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33ebb59ee1" data-kw="">
<blockquote><p>At the Reformation of religion, some learned and godly men were of opinion that in detestation of the Popish superstition which had overspread and soiled all the worship of God, the best way was to as far from the Church of Rome as possibly might be: Others, no less learned and godly than they thought it better to depart no further from the Romish Church than she had departed from the right way, partly that they that would might step over from them to us the more easily; partly that our departure from them might appear to be made rather of necessity than of choice, and not for things which might be tolerated, but for things intolerable. Both aimed at one mark, but did not shoot after one compass; and the wiser sort and more pious pleased themselves and were not displeased with others in this difference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-burges.html">John Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer Rejoined to that much Applauded Pamphlet of a Nameless Author, bearing this Title: viz. A Reply to Dr. Morton’s General Defence of Three Nocent Ceremonies</cite>, … (London, Matthewes, 1631), Preface, p. 2</span></figcaption>

</figure><figure class="quote" id="q-a0e52f9b0e" data-kw="">
<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine., pp. 204-7</span></figcaption>

<blockquote><p>Out of all these rules, testimonies, [and Scriptural] examples [put forth by an opponent] nothing follows in favor of our [imposed] ceremonies because no sound rule, just testimony or allowed example is brought for any ceremony of mystical signification, by man instituted, and brought into the solemn ordinary worship of God, for the use of teaching…</p></blockquote>

<blockquote><p>The picture of a church much more concerned with carrying out its routine functions than with controversy is confirmed by W. R. Foster… Such studies, concentrating on the day to day life of the church and the extent of compromise, co-operation and continuity, undoubtedly provide a more accurate picture of the church as contemporaries saw it, and worked and worshipped in it, than sectarian histories which imply constant and bitter controversy at all levels. But it is worth suggesting that this tendency to concentrate on the positive elements of the church and on its routine functioning has gone too far; from too much emphasis on controversy the pendulum has swung so far that there is a tendency to ignore the controversy, that undoubtedly did exist. Foster’s “church before the covenants” seems so placid and united that the reader is left bewildered; the covenants evidently explode like a great storm suddenly appearing when the sky is clear and blue, and no attempt is made to explain the explosion. Controversial topics are played down or ignored; little is said about worship, almost nothing about theology. The new prayer book of 1637 which sparked off revolt is not mentioned in a book purporting to cover the period up to 1638; nor is the emergence of Arminianism in Scotland, undermining Calvinist orthodoxy and producing new tensions. Thus Foster’s book really only deals with some aspects of the church; what it does do, it does very well, but though it tells the truth it does not attempt to tell the whole truth.” – David Stevenson, “Scottish Church History, 1600-1660, a Select Critical Bibliography” (1982), p. 211 . On the Late-1600’s Articles Raffe, Alexander – pp. 180-188 of The Culture of Controversy: Religious Arguments in Scotland, 1660-1714 (Boydell Press, 2012) ToC McDougall: “Raffe outlined three tenets of partial conformity [for laymen]: avoidance of regular attendance at services given by conformist ministers; hearing sermons in parishes in other towns; and refusal to receive the sacraments from a conformist minister. This chapter will reveal a broader range of ways in which ministers and the laity could avoid conforming to Episcopacy without separating from the church entirely.</p></blockquote>

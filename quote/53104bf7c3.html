<main class="wrap"><figure class="quote" id="q-53104bf7c3" data-kw="">
<blockquote><p>9. That this instituted Church is to meet together all of them, even the whole Church for the administration of the holy ordinances of God, to public edification, 1 Cor. 14:27 [as the Independents would have it], is a manifest debarring of infants born within the visible Church from being members of that Church which Christ in his Gospel has instituted, etc., for they are neither capable of convening in one place every Lord’s Day, nor of public edification by prophesying, as is meant, 1 Cor. 14:23…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 3, ch. 6, p. 343</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“9. That this instituted Church is to meet together all of them, even the whole Church for the administration of the holy ordinances of God, to public edification, 1 Cor. 14:27 [as the Independents would have it], is a manifest debarring of infants born within the visible Church from being members of that Church which Christ in his Gospel has instituted, etc., for they are neither capable of convening in one place every Lord’s Day, nor of public edification by prophesying, as is meant, 1 Cor. 14:23…”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d31dbb339" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker: ‘…But these three [qualifications are] assigned by Mr. Rutherford [in order to be accepted as a member of the Church]: 1. To profess the Faith; 2. Eagerly to desire the Seals; 3. To desire Church-fellowship, counting it a disparagement not to be born again, if not admitted to the Sacraments, [yet all this] may agree to a drunkard [according to Hooker].’ Answer: …if the [drunkard] man be a born heathen, and shall come to get these three requisites, and profess as Magus did, he is to be received a member: but if he hath not these three requisites, for he lives in sorcery, as Magus and Elymas, and opposeth the Gospel, the openly lying profession is scandalous; such a profession Mr. Rutherford saith is not his requisites: If he be a pagan, and continue in habitual drunkenness, he may be holden out while he gives evidences to others of amendment, and then he may be admitted to the outer court, as a hearer; though a profession of faith, if not belied with worshipping of false gods, can hardly consist with paganism [and hence he is part of the visible Church in some way and should therefore be a member of a church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14, Ch. 15, pp. 67-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“Mr. [Thomas] Hooker: ‘…But these three [qualifications are] assigned by Mr. Rutherford [in order to be accepted as a member of the Church]: 1. To profess the Faith; 2. Eagerly to desire the Seals; 3. To desire Church-fellowship, counting it a disparagement not to be born again, if not admitted to the Sacraments, [yet all this] may agree to a drunkard [according to Hooker].’ Answer: …if the [drunkard] man be a born heathen, and shall come to get these three requisites, and profess as Magus did, he is to be received a member: but if he hath not these three requisites, for he lives in sorcery, as Magus and Elymas, and opposeth the Gospel, the openly lying profession is scandalous; such a profession Mr. Rutherford saith is not his requisites: If he be a pagan, and continue in habitual drunkenness, he may be holden out while he gives evidences to others of amendment, and then he may be admitted to the outer court, as a hearer; though a profession of faith, if not belied with worshipping of false gods, can hardly consist with paganism [and hence he is part of the visible Church in some way and should therefore be a member of a church].”

">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=Mr.%20%5BThomas%5D%20Hooker,be%20a%20member%20of%20a%20church&amp;text=Mr.%20%5BThomas%5D%20Hooker&amp;text=should%20therefore%20be%20a%20member%20of%20a%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-08da34f00d" data-kw="">
<blockquote><p>Eleventhly, [it is superstition] that he that is a member of one church may not communicate with any other but by the consent of the pastor and people of that one. Twelfthly, that he that is a member of a church may not remove his relation to another church (when his occasions and personal benefit require it and the public good of many is not hurt by it) without the consent of the pastor and people of that church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 58, p. 290</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“Eleventhly, [it is superstition] that he that is a member of one church may not communicate with any other but by the consent of the pastor and people of that one. Twelfthly, that he that is a member of a church may not remove his relation to another church (when his occasions and personal benefit require it and the public good of many is not hurt by it) without the consent of the pastor and people of that church.”

— Richard Baxter, The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 58, p. 290">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEleventhly%2C+%5Bit+is+superstition%5D+that+he+that+is+a+member+of+one+church+may+not+communicate+with+any+other+but+by+the+consent+of+the+pastor+and+people+of+that+one.+Twelfthly%2C+that+he+that+is+a+member+of+a+church+may+not+remove+his+relation+to+another+church+%28when+his+occasions+and+personal+benefit+require+it+and+the+public+good+of+many+is+not+hurt+by+it%29+without+the+consent+of+the+pastor+and+people+of+that+church.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%E2%80%A6+%28London%2C+1670%29%2C+pt.+1+%7C+Direction+58%2C+p.+290&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F08da34f00d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/08da34f00d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=Eleventhly%2C%20%5Bit%20is%20superstition%5D%20that%20he,pastor%20and%20people%20of%20that%20church&amp;text=Eleventhly%2C%20%5Bit%20is%20superstition%5D%20that%20he%20that%20is&amp;text=of%20the%20pastor%20and%20people%20of%20that%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b2f0f57736" data-kw="">
<blockquote><p>To worship God sometimes with those with whom we do not always is oft a duty and a special means to prevent, remove or greatly to lessen the sin of schism, and to promote that which is so desirable, catholic communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints</cite>, (London: Parkhurst, 1705) Tallents (1619–1708) was a non-conforming English presbyterian minister., pp. 103-4</span></figcaption>

</figure><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed</cite>, (London, 1645), pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

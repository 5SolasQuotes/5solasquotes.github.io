<blockquote><p>…the more strict Lutherans who (to render a union with us [Reformed] more difficult) extend fundamentals more widely than is just, turn almost every error into a heresy and make necessary those things which are indifferent so as more easily to prove that we differ on fundamentals.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab1ce17cc0" data-kw="">
<blockquote><p>For there be some errors in light things, not fundamental in religion, upon which a separation may happen, by the pride and pertinacy of some pastors, even of them that are orthodox: As the error of the Quartadecimani, who celebrated the feast of Easter precisely upon the fourteenth day of the moon of March; for which cause Victor, bishop of Rome, separated himself from their communion; wherein, although the error was on their side, yet the schism was on Victor’s side, and he was more guilty than they… For no doubt but that such separations commonly happen by the ambition of the pastors that lead the people, who groan under that yoke, and desire concord, grieving for the separation. Yea it may happen that both the Churches that forsake their mutual communion are both in the wrong. It may happen also, that the party that hath the truth on his side, is cause of the schism, by the harshness, or ambition, or want of charity of them that govern. As when two brothers are quarrelling, they are brothers nevertheless: So it is possible that two dissenting churches will be nevertheless members of the same body, in God’s account, whose wisdom is not obnoxious to our violence… I could wish also that a man should not be pronounced an heretic that is ignorant of some article of Faith by a simple and negative ignorance, such as is that of infants; not by an obstinate ignorance, which arms itself with reasons against the truth. Thus the apostles were at first ignorant of the resurrection, and were not heretics for that. I wish also that an error be not presently called an heresy, when it is about a light thing, not about the fundamentals of Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, … (London: White, 1662), bk. 1, ch. 7, pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-188d83d849" data-kw="">
<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors: Toleration, Erastianism, Independency &amp; Separation</cite>, … (d. 1667; Edinburgh: 1692), ‘Sermon preached before the synod at Glasgow, 1653’, pp. 246-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-d73f9ef76a" data-kw="">
<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side: 1. That a full agreement should be made in all the fundamental articles of Faith. 2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned. 3. That in matters ceremonial and of indifferency, there should be a mutual toleration. 4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches. 5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned. 6. That ambitious and needless disputes and brabblings should be inhibited on all sides. 7. That former reproaches and injuries should be put to oblivion. 8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quote on Dury</cite>, Samuel Hartlib, A Brief Relation of that which has been Lately attempted to Procure Ecclesiastical Peace amongst Protestants (London: I.R., 1641), pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-38b08187c6" data-kw="">
<blockquote><p>However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Elucidation of the Status of Controversies about the Church Militant</cite>, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1052</span></figcaption>

<div class="actions"><button class="copy" data-copy="“However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.”

— Louis Le Blanc, Elucidation of the Status of Controversies about the Church Militant, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1052">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+most+others+describe+the+visible+Church+as+the+assembly+of+those+who+profess+the+true+and+salutary+doctrine+of+Christ+and+legitimately+use+the+sacraments+instituted+by+Him%2C+and+also+observe+the+lawful+order+of+discipline.+Some+others+more+briefly+say+it+is+the+assembly+of+those+who+profess+the+true+religion%2C+along+with+their+children.+Thus%2C+the+Anglican+Confession%2C+Chapter+25%2C+Article+30.+Therefore%2C+they+do+not+want+any+heretical+churches+to+constitute+part+of+the+visible+Church%2C+but+exclude+from+it+those+who+are+properly+called+heretics%3B+nor+do+they+place+outside+it+all+who+err+in+matters+of+faith+and+sin+in+the+administration+of+the+sacraments+and+the+exercise+of+discipline%3B+but+only+those+who+deny+and+subvert+the+fundamental+teachings+concerning+faith%2C+discipline%2C+and+the+sacraments.+Therefore%2C+among+the+many+particular+churches+that+are+contained+within+the+communion+of+the+true+Church%2C+they+note+various+degrees+of+purity+and+perfection%3B+nor+do+they+immediately+deny+a+church+to+be+a+true+Church+of+Christ+if+it+is+not+in+all+respects+pure+in+doctrine+or+in+the+rest+of+worship%2C+rites%2C+and+the+sanctity+of+discipline%2C+and+if+it+has+some+errors+in+saving+faith%2C+some+abuses+in+the+use+of+sacraments%2C+some+superstitions+in+divine+worship%2C+and+some+allowance+of+scandals+in+the+sanctity+of+discipline%2C+provided+that+in+the+meantime+it+retains+the+fundamental+and+saving+doctrine+and+practice+of+faith+and+worship.+These+are+the+words+of+the+confession+or+declaration+of+the+Polish+Churches%2C+publicly+read+at+the+Thorunien+assembly+in+1645%2C+and+printed+and+published+the+following+year.+And+this+is+the+common+opinion+of+our+theologians%2C+as+can+be+seen+in+John+Calvin%2C+Institutes%2C+Book+4%2C+Chapter+1%2C+Section+12+and+following%2C+and+in+the+illustrious+Mestrezat+in+his+French+treatise+on+the+Church%2C+Book+2%2C+Chapter+4.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Elucidation+of+the+Status+of+Controversies+about+the+Church+Militant%2C+bk.+5%2C+ch.+1%2C+%E2%80%98On+the+Nature+and+Definition+of+the+Church%E2%80%99+in+Theological+Theses+Published+at+Various+Times+in+the+Academy+of+Sedan%2C+3rd+ed.%2C+tr.+by+AI+by+Colloquia+Scholastica+%281675%3B+London%2C+1683%29%2C+p.+1052&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F38b08187c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38b08187c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=However%2C%20most%20others%20describe%20the%20visible,the%20Church%2C%20Book%202%2C%20Chapter%204&amp;text=However%2C%20most%20others%20describe%20the%20visible%20Church%20as&amp;text=treatise%20on%20the%20Church%2C%20Book%202%2C%20Chapter%204" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

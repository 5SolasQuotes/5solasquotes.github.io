<main class="wrap"><figure class="quote" id="q-02bfdf5044" data-kw="">
<blockquote><p>…whatsoever is wanting [lacking] of that which is commanded, or remaining of that which is forbidden, is not able to put that assembly, which by faith is laid upon Christ, from the right and title of being the Church of Christ: for faith can admit no such thing which gives an utter overthrow and turning upside down of the truth. By this title of ‘the faithful,’ the apostle in his epistles notes out the Churches of God, it being all one with him to say, ‘To the faithful,’ or ‘To the saints,’ as ‘To the Church’ of such a place. Whatsoever wants unto this, or is more than enough that wants, or abounds to the disgrace or uncomeliness or to the hazard of continuance, and not to the present overthrow of the Church. Hereupon the people of Israel, which neglected for the space of forty years the holy sacrament of circumcision and the Passover also as it seems (one only time excepted), ceased not therefore to be the Churches of God and to have the Sanctuary among them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Letter of T. C. To Richard Harrison Concerning Separation’</cite>, (1584), pp. 7-8 in The Judgment of Mr. Cartwright &amp; Mr. Baxter Concerning Separation &amp; the Ceremonies (1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 54</span></figcaption>

</figure><figure class="quote" id="q-6610bf35b3" data-kw="">
<blockquote><p>…we also conceive that the visible Church described in the holy Scripture is not only a parochial or particular Church, but that there is also a national and universal Church, dispersed through a whole kingdom, yea through the whole world; which does in ecclesiastical communion make up one body catholic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: 1645), ch. 3, ‘Of an Institute Visible Church’, p. 25</span></figcaption>

</figure><figure class="quote" id="q-4feada3ec5" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, 3rd Question, ‘Besides the elect, are reprobates and infidels (whether secret or open) also true members of the church of Christ? We deny against the Romanists., p. 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-e8163bee18" data-kw="">
<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-wendelin.html">Francis Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, bk. 1, ch. 19, pp. 395-96 in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 402</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<blockquote><p>As for the divine commiseration of sinners, it shows that their death and damnation are not things primarily well-pleasing unto God: but it shows not that God must become an hypocrite and a dissembler if He have eternally decreed to permit them to incur death and damnation by their own default. For God’s mercy being actio sublevantis [an act of taking away] and not passio condolentis [a passion of suffering with], it ties Him not to do all He can for redeeming any man out of his misery; but his action is ordered and limited by his own free-will. It is the height and riches of God’s mercy which from everlasting has prepared for the elect only, and in time bestows upon them only that special and effectual grace which infallibly brings them unto glory. It is a lower degree of mercy (and yet true mercy too) which is showed to the non-elect or reprobate, in preparing for them and bestowing upon them such means of grace as by their own default are made ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, … (Cambridge, 1641), ‘Whether absolute reprobation oppugn the truth and sincerity of God’, pp. 357-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

0own%20default%20are%20made%20ineffectual" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afa1392f2c" data-kw="">
<blockquote><p>A second question is, How far the Law can draw a sinner to Christ? Antinomians tell us of a legal drawing and conversion, and of an evangelic drawing; the legal drawing they say is ours [that of the reformed]; the latter theirs. Assertion 1. The difference between the letter of the Law and the Gospel is not in the manner of working, for the letter of either Law or Gospel is alike ineffectual and fruitless to draw any to Christ. Christ preached the Gospel to hard-hearted Pharisees; it moved them not. Moses preached the Law and the curses thereof to the stiffnecked Jews and they were as little humbled. Sounds and syllables of ten hells, of twenty heavens and Gospels, without the Spirit’s working, are alike fruitless. And we grant the Law is a sleepy keeper of a captive sinner; he may either steal away from his keeper or if he be awed with his keeper, he is not kept from any spiritual, internal breach of the Law, nor moved thereby to sincere and spiritual walking. But the difference between Law and Gospel is not in the internal manner of working, but in two other things:

1. In the matter contained in Law and Gospel: because nature is refractory to violence and the Law can do nothing but curse sinners; therefore it can draw no man to Christ. The Gospel again contains sweet and glorious promises of giving a new heart to the elect, of admitting to the Prince of peace laden and broken-hearted mourners in Zion and in conferring on them a free imputed righteousness; and this is in itself a taking-way, but without the Gospel-spirit [it is] utterly ineffectual.

2. To the Gospel there is a Spirit added, which works as God does with an omnipotent pull; and this Spirit does also use the Law to prepare and humble; though this be by a higher power than goes along with the Law as the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pp. 272-318</span></figcaption>

<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>

</figure><figure class="quote" id="q-963b3cfced" data-kw="">
<blockquote><p>There is a twofold Word, or rather a double declaration of the same Word:

1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice.

2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subjection to Christ in all his Ordinances &amp; Appointments the best means to preserve our Liberty: together with a Treatise of Ineffectual Hearing the Word</cite>, ... (d. 1649; London: S.G., 1657), ‘Of Ineffectual Hearing’, pp. 89-90</span></figcaption>

%20of%20faith%20in%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Also one must bear in mind that God’s original wish was that all should be saved [1 Tim. 2:4] and come to His Kingdom. For it was not for punishment that He formed us but to share in his goodness, inasmuch as He is a good God. But inasmuch as He is a just God, his will is that sinners should suffer punishment. The first then is called God’s antecedent will and pleasure, and springs from Himself, while the second is called God’s consequent will and permission, and has its origin in us. And the latter is twofold: one part dealing with matters of guidance and training, and having in view our salvation, and the other being hopeless and leading to our utter punishment, as we said above. And this is the case with actions that are not left in our hands. But of actions that are in our hands, the good ones depend on his antecedent goodwill and pleasure, while the wicked ones depend neither on his antecedent, nor on His consequent will, but are a concession to free-will. For that which is the result of compulsion has neither reason nor virtue in it. God makes provision for all creation and makes all creation the instrument of his help and training, yea often even the demons themselves, as for example in the cases of Job and the swine [Mt. 8:30 ff.].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-of-damascus.html">John of Damascus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Orthodox Faith</cite>, bk. 2, ch. 29, ‘On Providence’ in NPNF2, vol. 9, pt. 2, p. 42 Damascus (c. 675 or 676 – 749) was Christian monk, apologist and theologian, known as the last of the Greek fathers. Damascus appears not to believe in an unconditional predestination underlying his antecedent/ consequent distinction, per ch. 30.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Also one must bear in mind that God’s original wish was that all should be saved [1 Tim. 2:4] and come to His Kingdom. For it was not for punishment that He formed us but to share in his goodness, inasmuch as He is a good God. But inasmuch as He is a just God, his will is that sinners should suffer punishment. The first then is called God’s antecedent will and pleasure, and springs from Himself, while the second is called God’s consequent will and permission, and has its origin in us. And the latter is twofold: one part dealing with matters of guidance and training, and having in view our salvation, and the other being hopeless and leading to our utter punishment, as we said above. And this is the case with actions that are not left in our hands. But of actions that are in our hands, the good ones depend on his antecedent goodwill and pleasure, while the wicked ones depend neither on his antecedent, nor on His consequent will, but are a concession to free-will. For that which is the result of compulsion has neither reason nor virtue in it. God makes provision for all creation and makes all creation the instrument of his help and training, yea often even the demons themselves, as for example in the cases of Job and the swine [Mt. 8:30 ff.].”

— John of Damascus, Exposition of the Orthodox Faith, bk. 2, ch. 29, ‘On Providence’ in NPNF2, vol. 9, pt. 2, p. 42 Damascus (c. 675 or 676 – 749) was Christian monk, apologist and theologian, known as the last of the Greek fathers. Damascus appears not to believe in an unconditional predestination underlying his antecedent/ consequent distinction, per ch. 30.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlso+one+must+bear+in+mind+that+God%E2%80%99s+original+wish+was+that+all+should+be+saved+%5B1+Tim.+2%3A4%5D+and+come+to+His+Kingdom.+For+it+was+not+for+punishment+that+He+formed+us+but+to+share+in+his+goodness%2C+inasmuch+as+He+is+a+good+God.+But+inasmuch+as+He+is+a+just+God%2C+his+will+is+that+sinners+should+suffer+punishment.+The+first+then+is+called+God%E2%80%99s+antecedent+will+and+pleasure%2C+and+springs+from+Himself%2C+while+the+second+is+called+God%E2%80%99s+consequent+will+and+permission%2C+and+has+its+origin+in+us.+And+the+latter+is+twofold%3A+one+part+dealing+with+matters+of+guidance+and+training%2C+and+having+in+view+our+salvation%2C+and+the+other+being+hopeless+and+leading+to+our+utter+punishment%2C+as+we+said+above.+And+this+is+the+case+with+actions+that+are+not+left+in+our+hands.+But+of+actions+that+are+in+our+hands%2C+the+good+ones+depend+on+his+antecedent+goodwill+and+pleasure%2C+while+the+wicked+ones+depend+neither+on+his+antecedent%2C+nor+on+His+consequent+will%2C+but+are+a+concession+to+free-will.+For+that+which+is+the+result+of+compulsion+has+neither+reason+nor+virtue+in+it.+God+makes+provision+for+all+creation+and+makes+all+creation+the+instrument+of+his+help+and+training%2C+yea+often+even+the+demons+themselves%2C+as+for+example+in+the+cases+of+Job+and+the+swine+%5BMt.+8%3A30+ff.%5D.%E2%80%9D%0A%0A%E2%80%94+John+of+Damascus%2C+Exposition+of+the+Orthodox+Faith%2C+bk.+2%2C+ch.+29%2C+%E2%80%98On+Providence%E2%80%99+in+NPNF2%2C+vol.+9%2C+pt.+2%2C+p.+42+Damascus+%28c.+675+or+676+%E2%80%93+749%29+was+Christian+monk%2C+a

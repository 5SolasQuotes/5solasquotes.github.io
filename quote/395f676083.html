<main class="wrap"><figure class="quote" id="q-395f676083" data-kw="">
<blockquote><p>I will address the following three questions: (1) To what extent would male head-covering ideology in Greek and Roman cultures be at loggerheads with the text of 1 Cor 11:4? (2) To what extent would wearing a veil for a man create tensions of shame and conflict in the church in Roman Corinth? And (3) what is the specific issue regarding male sartorial practice? I will first address the controversial and long-standing issue of whether the verse refers to veils, long hair, or both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preston-t-massey.html">Preston T. Massey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Long Hair as a Glory &amp; as a Covering: Removing an Ambiguity from 1 Cor 11:15’ Novum Testamentum, vol. 53, Fasc. 1 (2011), pp. 52-72</cite>, p. 503</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f1d9a78bd" data-kw="">
<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>

</figure><figure class="quote" id="q-c3d5b94713" data-kw="">
<blockquote><p>‘Doth not even nature itself teach you’. By nature is either meant, the law and light of nature, reason in man, common sense, or rather custom, which is second nature; and which, in this case, must be restrained to the Greeks and Jews; for though among the Grecians the men cut their hair, and did not suffer it to grow long, as also did the Jews, yet there were many nations who did not (Alex., ab. Alex. Genial. Dier., bk. 5, ch. 18. Servius in Virgil, Aeneid, bk. 10. prope finem), even at that time, observe such a rule or custom; but as the Jews and Greeks were the persons chiefly, if not solely, known to the Corinthians, the apostle signifies that the usages of these people might direct and inform them in this matter:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11 | v. 14</cite></span></figcaption>

</figure><figure class="quote" id="q-08672052eb" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (London, 1646)</cite>, pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-f5c66c7321" data-kw="">
<blockquote><p>Honor is but the expressing of the inward respect we bear to persons by outward signs, speeches and gestures; without the outward signification of it thus, no man can tell who is honored: and as is the custom of the nation, so we express this, whether by uncovering the head, bowing the body, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giles-firmin.html">Giles Firmin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Stablishing against Shaking: or a Discovery of the… Deluded People called, Quakers… (London, 1656), p. 22 Firmin was an English clergyman with Independent, puritan leanings.</cite></span></figcaption>

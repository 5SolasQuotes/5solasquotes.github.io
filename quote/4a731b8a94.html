<main class="wrap"><figure class="quote" id="q-4a731b8a94" data-kw="">
<blockquote><p>12. Finally, The inexpressible importance of spiritual comfort, appears chiefly in this, that it promoteth, in an eminent degree, universal holiness of heart and life.

It revives and invigorates the graces of the Christian. It excites and encourages a holy man, to trust cordially and constantly in Christ, for sanctification; to love Him, and God in him, with ardent affection; and so to love his manifested glory, as to perform every duty, in faith, from love, and for the glory of his holy name. He cannot love God supremely, nor delight in doing his will unless he himself be delighted and cheered, by trusting that God loveth him. No arguments will persuade a man, to commit his way to the Lord, or to cast his care upon him; if he do not believe, that the Lord careth for him. It is a sense of redeeming love, warm on the heart, that captivates the soul, conciliates the will, and engages the affections.

A comfortable persuasion of the love of Jesus to the soul, will be operative in it, as a torch in a sheaf: it will gradually destroy its remaining enmity against him. It will enlarge the heart with ardent love to him, and elevate the affections above the world. The soul, in order to be kept from lusting after earthly and carnal pleasures, must, by an appropriating faith, take pleasure in the Saviour, and in his love. Holy comfort imbitters sin to a man, and disposes him, with deep abhorrence of it, to strive against it. It tends greatly to melt, and to humble the heart for sin. The firmer a holy man’s comfort is, the softer his heart is. The more “his heart is fixed, trusting in the Lord, so as not to be afraid of evil tidings;” the more disposed he is, to fear the evil of sinning against him.

Spiritual comfort also, inclines and encourages the saints, ardently to follow after universal holiness of life, and constantly to long for the perfection of it. “The Spirit of the Lord God,” saith Messiah, “is upon me, because the Lord hath anointed me, … to comfort all that mourn; to appoint unto them that mourn in Zion, to give unto them beauty for ashes, the oil of joy for mourning, the garment of praise for the spirit of heaviness; that they might be called Trees of righteousness, The planting of the Lord, that he might be glorified.” It disposes believers, to frequency and impartiality in self-examination; and excites them, to diligent endeavours after increasing communion with God, in every duty. It is employed by the Holy Spirit, to render them active, resolute, and cheerful, in the spiritual performance of all their various duties. Godly sorrow, indeed, disposes them to be serious; but it is holy joy, that renders them active: it is “the oil of gladness,” that makes the wheels of their voluntary obedience, move forward with ease and speed. Some measure of holy comfort is necessary to the practice of evangelical holiness. Summer, in the natural world, is necessary as well as winter.

The very nature of the duties and exercises of the true Christian, is such, that they require comfort of heart, for the acceptable performance of them. A holy life commonly begins with comfort, and is maintained by it. The way to be kept from carelessness and formality, in spiritual exercises, is, so to trust in Christ for salvation, as to cease to despond; for the soul grows careless by desponding. The sorrow of the world, and the fear of hell, enervate and benumb all the faculties of the soul. A man can perform no spiritual obedience, without some degree of spiritual joy, as well as of true love. The former, is as much the fruit of the Spirit, as the latter.

The Christian cannot be encouraged to pray to God; except he be consoled with the hope, that God, for Christ’s sake, will graciously hear and answer his prayer. He cannot cordially praise God; unless he be enabled to trust, that God will glorify the perfections of his nature, and magnify the promises of his covenant, in his eternal salvation. It is in proportion as his heart is comforted, that he will be truly thankful to the Lord, for the smallest favour. It is holy consolation, that makes every act of grace, every instance of duty, every part of spiritual service, how secret soever it be, pleasant to a good man. In a word, it is this, that so exhilarates, and so constrains him, as to make all his affection run out to the Lord Jesus, and all his strength run out for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 67-70.</span></figcaption>

<blockquote><p>‘The love of God is the essential property or essence of God, whereby delighting Himself in it, He wishes it the good which He approves.’ To be distinguished are ‘the general love of God’, the object of which is creation generally, so that ‘no one either of men or even of demons may say that he is not loved by God’; God hates the sin in the godless, but loves the nature created by Him — and the ‘special love of God, by which He peculiarly pursues the separate elect.’</p></blockquote>

<blockquote><p>Now the means God has appointed for a man’s recovery are diverse: First, There are means by way of love and goodness: There are also means by way of chastisements and afflictions By way of Love; How winning and overcoming should that be? Love does surround you; it’s love that you live, that you breath; its love, you are preserved from hell and damnation; its love, that you have any support at all; therefore the goodness of God in all the creatures you enjoy, should lead you to repentance, Rom. 2[:4]. The sun that shines to you, the earth that brings forth fruit for you, the health and perfection of the senses, should melt you always into good.</p></blockquote>

<blockquote><p>8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ …

10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it.

11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ …

10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it.

11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.”

<blockquote><p>First, that we may put a difference between Christian and heathen virtues. For, howbeit the same virtues in kind and name are and may be found both in those that profess Christ and those also that are ignorant of the true God. Yet they are in them after a divers manner. For in heathen men they are the gifts of God, but not parts of regeneration and new birth. But in those that be true Christians they are indeed not only the gifts of God’s Spirit but also essential parts of regeneration. That we may better yet conceive this difference we must understand that the grace of God in man is twofold: restraining and renewing. Restraining [grace] is that which bridles and restrains the corruption of men’s hearts from breaking forth into outward actions, for the common good, that societies may be preserved and one man may live orderly with another. Renewing grace is that which not only restrains corruption but also mortifies sin and renews the heart daily more and more. The former of these is incident to heathen men and the virtues which they have. It serves only to repress the act of sin their outward actions. But in Christians, they are graces of God, not only bridling and restraining the affection, but renewing the heart, and mortifying all corruption. And though those virtues of the heathen be graces of God, yet they are but general and common to all. Whereas the virtues of Christians, are special graces of the Spirit, sanctifying and renewing the mind, will, and affections. For example, chastity in Joseph was a grace of God’s Spirit, renewing his heart. But chastity in Xenocrates was a common grace serving only to curb and restrain the corruption of his heart. And the like may be said of the justice of Abraham, a Christian, and of Aristides, a heathen.</p></blockquote>

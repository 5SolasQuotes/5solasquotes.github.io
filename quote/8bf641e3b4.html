<main class="wrap"><figure class="quote" id="q-8bf641e3b4" data-kw="">
<blockquote><p>3. Good works are necessary as a consequent that follows from its antecedent, not as an effect that follows from its cause. The Holy Spirit teaches this everywhere, because He denies that eternal life is attained by means of our good works. At the same time, He also teaches that it is impossible to see God without holiness, Heb. 12,14. 4. Eternal life will be given to those who are performing good works, but it is not given unto them because of their good works. This is evident from Mt 25,35, where it is said: ‘For I was hungry and you gave me food’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. van Asselt, Bell, Brink, Ferwerda – Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn) Ch. 16, ‘On Good Works’</cite>, p. 136</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-6a3ce0384e" data-kw="">
<blockquote><p>The Reformed–deny the necessity of good works for obtaining the right to eternal life. Indeed if done with this intention they say that in consequence they are actually evil and pernicious. But they declare that they are necessary by divine prescript for receiving possession of life, as conditions without which God refuses to bestow salvation upon us.” – trans. Heinrich Heppe, Reformed Dogmatics (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580 Vitringa, Sr., Campegius – ‘Of the Necessity of Good Works’, theses 20-24, pp. 358-73 in Ch. 17, ‘Of Sanctification, Good Works &amp; the Perseverance of the Saints’ in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 3 (d. 1722) Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘It is asked thirdly whether the endeavoring unto good works is necessary to salvation?’ in Theoretical and Practical Theology (Utrecht, 1724), Book 6, ch. 8, section 27</cite>, pp. 844-45</span></figcaption>

%20of%20the%20earlier%20tradition&amp;text=The%20Reformed%E2%80%93deny%20the%20necessity%20of%20good%20works%20for&amp;text=as%20codifiers%20and%20bibliographers%20of%20the%20earlier%20tradition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ac017145c5" data-kw="">
<blockquote><p>What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works? 1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake. 2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake. 3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance. 4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith. 5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith. 6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (London, 1606), ch. 32, ‘Of Good Works’</cite>, p. 376-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

%28to+prove%29+the+remission+of+sins%3A+because+each+of+them+depends+on+faith.+5.+Where+there+is+a+subject+there+is+his+propriety%2C+and+on+the+contrary+where+there+is+a+propriety+there+is+his+subject.+So+where+there+is+faith+there+be+works%2C+and+where+there+be+good+works+there+is+faith.+6.+Seeing+good+works+do+spring+from+faith%2C+whatsoever+is+attributed+to+them%2C+must+needs+be+ascribed+to+the+root+%28i.e.+faith%2C+whence+they+spring%29.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion+%28London%2C+1606%29%2C+ch.+32%2C+%E2%80%98Of+Good+Works%E2%80%99%2C+p.+376-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac017145c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac017145c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=What%20is%20to%20be%20observed%20in,root%20%28i.e.%20faith%2C%20whence%20they%20spring&amp;text=What%20is%20to%20be%20observed%20in%20the%20sayings&amp;text=to%20the%20root%20%28i.e.%20faith%2C%20whence%20they%20spring" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

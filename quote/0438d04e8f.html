<blockquote><p>§.23. Of the restraint of the benefit of Christ’s headship to them only that are of his body. That none but those who are of Christ’s body shall partake of the benefit of his office is clear by other like titles of restraint, as ‘his people’, and ‘his sheep’: but especially by denying to the world the benefit of his intercession, ‘I pray not for the world,’ says He. In this respect this position (out of the Church no salvation) is without exception true: for the body is the true, catholic, invisible Church: he that is not a member of this Church, but is out of it, has not Christ to be his head and Savior, whence then can he have salvation? The former point is not more comfortable to those that have assurance that they are members of this body, then this is terrible to those that give too great evidence they are no members thereof; as all they do that have not the spirit of Christ ruling in them, but rather rebel against Him: and bear no love to the saints, but rather hate them, and do them all the spight they can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Domestical Duties… (London: Haviland, 1622), 1st Treatise, §23</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d29908452" data-kw="">
<blockquote><p>Either you [a Romanist] mean that ‘there is no salvation to be had out of that universal Church, whose part (a minor corrupt part) acknowledges the Pope’s sovereignty’ or else ‘that there is no salvation to be had out of that universal Church which wholly acknowledges it’ or else ‘that there is no salvation to be had out of that part of the universal Church which acknowledges it’. In the first sense I grant your conclusion (if really you [Romanists] are part of the Church), There is no salvation to be had out of Christ’s universal Church, of which you are [a] small corrupted part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Successive Visibility of the Church of which the Protestants are the Soundest Members Defended... (London: 1660), ‘The Answer to the First Paper’</cite>, p. 11</span></figcaption>

<blockquote><p>…we must not imagine that there are many Churches in the world, neither is that body to be separated which can bear or suffer no kind of division. Writers call the Church catholic, which undoubtedly signifies universal, because it is but one, neither can there be any more… And particular or several churches are as towns or cities in a kingdom: the multitude of cities divides not a kingdom. Of particular churches† dispersed throughout all the world, as a body of many members, is gathered and compacted together the catholic and universal church, which is the fellowship of all the saints. Therefore most certain it is that there is but one only Church of God, not many, whereof the only monarch is Jesus Christ; to whom be glory. † [Bullinger likely has in mind national or regional Churches (as numerous on this webpage); see sermon 1, p. 10 (top) where he speaks “of all the particular churches throughout the whole world, and of all the visible parts and members thereof.” The “visible parts” of such particular churches, in distinction from members, likely referred to lower levels of the Church under national Churches. Bullinger also speaks in that place of discipline being brought on the obstinate, likely referring to excommunication (Bullinger, Questions of Religion Cast Abroad (1572), ch. 14, pp. 119-20), which for him likely would have been carried out regionally.] The unity and united society of this Church of God is so great that out of her fellowship is there no people found acceptable unto God, any true salvation or safety, any light or truth; for without the pale of God’s church are no wholesome pastures found, all are infected with poison. No religion pleases God out of the Church of God… Lactantius therefore most truly says: “It is only the catholic Church, which retains true religion. Here is the fountain of truth: this is the household of faith: this is the Temple of God; into which if one enter not, or out of which if any depart, he is excluded from the hope of salvation and life everlasting.” [Institutes, bk. 4, ch. 30 (Leiden, 1660), p. 450] For our Saviour first said, that out of the sheepfold life is not found.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2nd Sermon, ‘That there is One catholic Church; that without the Church there is no light or salvation; against schismatics; wherefore we depart from the upstart Church of Rome; that the Church of God is the house, vineyard and Kingdom of God; and the body, sheepfold and spouse of Christ; a mother and a virgin’ in The Decades ed. Thomas Harding (1549; Cambridge: Parker Society, 1850), vol. 4, 5th Decade, pp. 49-92</cite>, pp. 50-52</span></figcaption>

</figure><figure class="quote" id="q-747c9aeb40" data-kw="">
<blockquote><p>This book explores the Westminster Confession of Faith’s claim that ‘there is no ordinary possibility of salvation’ outside of the Church by asking what it means, whether it is biblical, and why it is important. The author concludes that the Westminster Confession rightly stresses the role of the Church in bringing people to salvation without making this claim absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ryan-mcgraw.html">Ryan McGraw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ark of Safety: Is There Salvation Outside of the Church? in Explorations in Reformed Confessional Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“This book explores the Westminster Confession of Faith’s claim that ‘there is no ordinary possibility of salvation’ outside of the Church by asking what it means, whether it is biblical, and why it is important. The author concludes that the Westminster Confession rightly stresses the role of the Church in bringing people to salvation without making this claim absolute.”

</figure><figure class="quote" id="q-e807e79f8e" data-kw="">
<blockquote><p>Thirdly, there is no light of truth to be found anywhere else able to guide unto faith and salvation, than in the true Church of God… As no light was to be found in all Egypt, but in the land of Goshen and among the Israelites only: so no saving doctrine that gives light to the eyes of the mind is to be found out of the Church; they that are [not] in this state, live in palpable darkeness… as John teaches, ‘We know that we are of God, and the whole world lyeth in wickedness.’… Therefore to be out of the Church, is to be in the state of damnation, yea to be in the very dungeon of Hell, and the kingdom of darkeness, and to be under the power of Satan, the prince of darkness; as there was no salvation out of the Church. Let every man therefore seek and endeavor with all care to join himself to the true Church of God, and to be a member of the body of Christ, that so we may attain to the light of knowledge, and the light of the eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth book of Moses, called Numbers... (London: Iaggard, 1618), ch. 8</cite>, p. 465</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thirdly, there is no light of truth to be found anywhere else able to guide unto faith and salvation, than in the true Church of God… As no light was to be found in all Egypt, but in the land of Goshen and among the Israelites only: so no saving doctrine that gives light to the eyes of the mind is to be found out of the Church; they that are [not] in this state, live in palpable darkeness… as John teaches, ‘We know that we are of God, and the whole world lyeth in wickedness.’… Therefore to be out of the Church, is to be in the state of damnation, yea to be in the very dungeon of Hell, and the kingdom of darkeness, and to be under the power of Satan, the prince of darkness; as there was no salvation out of the Church. Let every man therefore seek and endeavor with all care to join himself to the true Church of God, and to be a member of the body of Christ, that so we may attain to the light of knowledge, and the light of the eternal life.”

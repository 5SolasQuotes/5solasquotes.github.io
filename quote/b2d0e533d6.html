<main class="wrap"><figure class="quote" id="q-b2d0e533d6" data-kw="">
<blockquote><p>This difference between the Law and the Gospel is the height of knowledge in Christendom. Every person and all persons who assume or glory in the name of Christian should know and be able to state this difference. If this ability is lacking, one cannot tell a Christian from a heathen or a Jew; of such supreme importance is this differentiation. This is why St. Paul so strongly insists on a clean-cut and proper differentiating of these two doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon on Galatians”</cite>, (New Years, 1532) on Galatians 3:23–24. Source: WA 36.25 transl. in Ewald M. Plass, What Luther Says (Concordia Publishing House: St Louis, 1959), 2.732.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80dd9a5324" data-kw="">
<blockquote><p>We therefore disallow all such things as are repugnant to this foresaid doctrine, confirmed by the scriptures, and chiefly these special points: .. 3. That the church does so consist of the elect and of true saints that in it should be contained no hypocrites, and that in the Scriptures they should never be comprehended under the Church’s name. … 7. So to bind the church to certain places and persons, as to say there only with them is the church. 8. Not to acknowledge those for Christ’s churches, which, although they hold the grounds of faith, yet in ceremonies or in some part of doctrine do not altogether jump with us. 9. To make a separation from the churches upon any error or for the ill life of some men. 10. …and contrariwise, that those are not true churches which, although they keep fast the true doctrine, right sacraments and pure discipline, yet cannot show a continuance and succession of bishops never broken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Christian Religion</cite>, Ch. 25, section 40, ‘Errors’, p. 240-1</span></figcaption>

</figure><figure class="quote" id="q-d22d3196dc" data-kw="">
<blockquote><p>When error is admitted into the Church, it will be found that the stages of its progress are always three. It begins by asking toleration. Its friends say to the majority: You need not be afraid of us; we are few, and weak; only let us alone; we shall not disturb the faith of the others. The Church has her standards of doctrine; of course we shall never interfere with them; we only ask for ourselves to be spared interference with our private opinions. Indulged in this for a time, error goes on to assert equal rights. Truth and error are two balancing forces. The Church shall do nothing which looks like deciding between them; that would be partiality. It is bigotry to assert any superior right for the truth. We are to agree to differ, and any favoring of the truth, because it is truth, is partisanship. What the friends of truth and error hold in common is fundamental. Anything on which they differ is ipso facto non-essential. Anybody who makes account of such a thing is a disturber of the peace of the church. Truth and error are two co-ordinate powers, and the great secret of church-statesmanship is to preserve the balance between them. From this point error soon goes on to its natural end, which is to assert supremacy. Truth started with tolerating; it comes to be merely tolerated, and then only for a time. Error claims a preference for its judgments on all disputed points. It puts men into positions, not as at first in spite of their departure from the Church’s faith, but in consequence of it. Their recommendation is that they repudiate the faith, and position is given them to teach others to repudiate it, and to make them skillful in combating it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-porterfield-krauth.html">Charles Porterfield Krauth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conservative Reformation and Its Theology As Represented in the Augsburg Confession and In the History and Literature of the Evangelical Lutheran Church</cite>, (Philadelphia: J. B. Lippincott, 1871), 195–96..</span></figcaption>

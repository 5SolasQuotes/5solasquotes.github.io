<main class="wrap"><figure class="quote" id="q-f7f4fed4b1" data-kw="">
<blockquote><p>The great writers of all ages are cited [by Grotius] with a superfluous lavishness… as to give a historic catholicity to his doctrine by showing that the laws he is endeavoring to formulate have, in fact, been accepted in all times and by all men.” – Intro, p. 10 For a summary of some of Grotius’s distinctive points, some of which disagree with Rutherford, see the Intro, p. 11. Rutherford cites Grotius 42 times in Lex Rex. Selden, John – Of the Dominion, or, Ownership of the Sea, Two Books. In the First is showed that the Sea, by the Law of Nature, or Nations, is not common to all men, but capable of private dominion or propriety, as well as the land. In the Second is proved that the dominion of the British Sea, or that which encompasses the isle of Great Britain, is, and ever has been, a part or appendant of the empire of that island (London: 1652) ToC Selden (1584-1654) was an Erastian, English jurist, a scholar of England’s ancient laws and constitution, and a scholar of Jewish law. He was known as a polymath; John Milton hailed Selden in 1644 as “the chief of learned men reputed in this land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugo-grotius.html">Hugo Grotius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 2 of The Rights of War &amp; Peace, including the Law of Nature &amp; of Nations… ed. A.C. Campbell (1625; Dunne, 1901)</cite>, pp. 73-289</span></figcaption>

<blockquote><p>It is an indispensable duty to forgive; we are not bound to trust an enemy, but we are bound to forgive him… It is with going to law as it is with going to war; when the just rights of a nation are invaded, it is lawful to go to war; so when a man’s estate is trespassed upon by another, he may go to law to recover it. But the law must be used in the last place; when no entreaties or arbitrations will prevail, then the chancery must decide it. Yet this is no revenge, it is not so much to injure another, as to right one’s self, which may be, and yet we may live in charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s Prayer</cite></span></figcaption>

</figure><figure class="quote" id="q-3d2019ef10" data-kw="">
<blockquote><p>The Judicial Law concerning the punishments of likedness, for the substance, viz. that it should be punished remains under the Gospel, because it comes within the nature of the Moral Law, and was prescribed to the Jews, not quae [as] Jews or a people peculiarly taken into Covenant, but qua [as] men subject to the Law of nature as other nations were… The Judicial laws may be considered according to their substance and equity, or according to many accessories, circumstances, forms and manner of them. Now though the magistrate under the Gospel is not bound unto these laws simply, that is, to every circumstance and particular of them for form, manner, time and place; as for example, not to the same kinds and formality of punishments set down in those laws; for those forms are accessions of the law; and therefore out of the nature of persons, times, places, and constitution of commonwealths, mutable: Yet he is bound to the substance and equity of them, so as not to derogate from the right of those laws… Now though to the degrees and measures of punishment, the severity and utmost rigor the Magistrate is not now tied, yet to the thing in cases of idolatry, seduction, false prophesying, speaking lies in the name of the Lord he is bound, and in some cases of gross and high idolatry and blasphemy committed presumptuously, to inflict capital punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Casting Down of the Last &amp; Strongest Fold of Satan. Or, A Treatise Against Toleration &amp; Pretended Liberty of Conscience</cite>, pp. 50, 54-55</span></figcaption>

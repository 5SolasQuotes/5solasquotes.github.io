</figure><figure class="quote" id="q-80216905aa" data-kw="">
<blockquote><p>It is designated under another name as apostasy, that is, not common, but preeminent apostasy (Heb. 6:6). Likewise, the sin unto death (1 John 5:16–17), which in the idea is never forgiven, nor can be. But it is chiefly called blasphemy against the Spirit (Matt. 12:31–32; Mark 3:28–30; Luke 12:10). This is the denomination that is especially proper to it.</p></blockquote>

</figure><figure class="quote" id="q-bc42a56fe4" data-kw="">
<blockquote><p>John: Verse 16, If a man see his brother sin a sin that is not unto death (that is, which may be pardoned), let him ask (pardon in his behalf) and he shall give him life for them that sin not unto death: There is a sin unto death (after which, necessarily damnation follows, as the sin against the Holy Ghost): I say not that thou shouldest pray for it. Church: But is not every sin, a sin to death? John: 17. All unrighteousness is sin (and therefore deserves death), but there is a sin not unto death (namely that which is pardoned in Christ).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Epistle of John</cite>, ch. 5, pp. 26-27 in A Case of Conscience Resolved (Edinburgh, 1592)</span></figcaption>

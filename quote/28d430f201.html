<main class="wrap"><figure class="quote" id="q-28d430f201" data-kw="">
<blockquote><p>Use 1. In that God did choose to make the world in this space of time, who could as easily have made it, as well in one moment, as in six days; this should teach us to take time for meditation on his works. He that could in one instant, at one word have brought forth heaven full of stars, the air full of fowls, the water full of fishes, the earth full of beasts, creeping things, trees, etc. was pleased to make several days works of this wonderful creation, and to proceed distinctly and orderly in his work: teaching us by the manner of his working only by his Word without instruments, that he could have done all at once, which now He did at several times… …few of us could say that of all the time we have spent, ever sith-hence we had the use of our understandings, in a serious meditation on God’s works, to this end that we might glorify the Maker, would not make up one week, not one six days, not so long as the Lord was in bringing them forth. Is not this a shame for man, who was made of purpose to glorify God in his works, that he should not in all his life spend so much time in meditating on the works of God, notwithstanding his dulness and sloth of apprehension, as the Lord was pleased to take in making of them, notwithstanding his omnipotency, which could have made them all in less than one minute, as easily as in a thousand years!… And what if I should say, it were expedient herein to follow the same order in considering of the Lord’s works, as the Lord Himself did in their creation; that is, to bind ourselves to do the work of the Day in its day, namely on the same day wherein each work was done, to meditate on the work of that Day?… …the Lord has been pleased, not only to let us know how many days He spent in the creation of all the whole, but also particularly and distinctly to acquaint us with his several days’ works; telling us what He did the first Day, what he did the second Day, etc. I dare boldly say, it is expedient even to tie ourselves to set apart some time in those several days for a more special view of those several works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maynard.html">John Maynard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty &amp; Order of the Creation Together with Natural &amp; Allegorical Meditations on the Six Days Works of the Creation</cite>, … (d. 1665; London: T.M., 1668), ch. 2, pp. 36-40</span></figcaption>

<blockquote><p>The second thing which I observe from this word bereshith, ‘in the beginning’ (which signifies in this place the first being or moment of time) is this, That time itself is but an adjunct, or circumstance of things created, and had a beginning, and shall have an end with the mutable and moveable world. For proof of this we need seek no further but to the fifth verse, where it is said, ‘The evening and the morning were the first day,’ that is, time was produced by the Word of God, even the first day together with the things therein created; and so it follows of all the days of the first week, they are said to be made with the works created in them. And indeed in reason it must needs be so; because time is nothing else but the continuance of things created and the measure of the motions which are in the created world, a day is the measure of the sun’s course from East to West, and round about to the East again: An hour is the time in which the sun runs the four and twentieth part of his day’s motion: A week is the space of seven days, and a year the time which the sun goes his course through the twelve signs of the zodiak; and the whole time of the world consists of years, months and days. Now all these had a beginning, and have an end; yea, there was no day till light and darkness were made and distinguished; no month nor year till the sun and the moon were set in their course:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 3, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

mons%E2%80%A6+%28London%3A+Barlet%2C+1641%29%2C+Of+the+Creation+of+the+World%2C+ch.+3%2C+p.+42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6ed6e06048.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6ed6e06048.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=The%20second%20thing%20which%20I%20observe,moon%20were%20set%20in%20their%20course&amp;text=The%20second%20thing%20which%20I%20observe%20from%20this&amp;text=and%20the%20moon%20were%20set%20in%20their%20course" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

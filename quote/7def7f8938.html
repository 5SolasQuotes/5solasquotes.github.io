<main class="wrap"><figure class="quote" id="q-7def7f8938" data-kw="">
<blockquote><p>…for the truth is, even sins (if we speak accurately) are not scandalous actum secundo [in the following exercise of the act], in regard of our corruption: our sins may sad[den] the [righteous] angels, but they are not properly scandalous to [righteous] angels [because they do not tempt them to sin, though it may perhaps tempt devils to sin further]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, p. 91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c5553626f3" data-kw="">
<blockquote><p>There is no scandall taken, but (if it be known to be taken, and the thing at which it is taken be not necessary) it is also given. … 2. Giving and not granting that the scandal of them who were first offended at the ceremonies [c. 1618] was only passive, yet the using of them after scandal is known to rise out of them, must be an active scandal, because the keeping of a thing which is not necessary, after scandal rises out of it, is an active scandal, though the scandal which at first rose out of it, had been only passive…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, pp. 35-36</span></figcaption>

</figure><figure class="quote" id="q-79bff9e05f" data-kw="">
<blockquote><p>4. I perceive he [Gillespie’s opponent] would say that the scandal of non-conformity is a greater scandal than the scandal of conformity; He is bold to object [that] where one is offended with our practise of kneeling, twenty, I may say ten thousand, are offended with your refusal. O adventurous arithmetique! O huge hyperbole! O desultorious declamation! O roving rhetoric! O prodigal paradox! Yet I reply: 1. Though sundry (yet not ten thousand for one) are displeased by our refusal, who can show us that any are thereby scandalized, that is, made worse and induced to ruin? …

5. We know many are grieved and displeased with our non-conformity, yet that every one who is grieved is not by and by scandalized, the Bishop of Winchester [an opponent] teaches as well as we. ‘Many times’ says he, ‘men are grieved with that which is for their good, and earnestly set on that which is not expedient for them.’ But in good earnest, what do they mean who say they are scandalized or made worse by our non-conformity? For neither do we make them condemn our lawful deed as unlawful, nor yet do we animate them by our example to do that which in their consciences they judge unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 52-3</span></figcaption>

%20would%20say&amp;text=that%20which%20in%20their%20consciences%20they%20judge%20unlawful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9f643623cd" data-kw="">
<blockquote><p>Not just Paul, but the apostles and elders at the synod in Jerusalem, bindingly (Acts 15:28; 16:4) laid some of these beggarly, burdensome ceremonies on the whole regional Church (Acts 15:23, 41; 16:4), as “it seemed good to the Holy Ghost” (Acts 15:28), yet not for the formal reason of service to that law of bondage. Rather, the circumstances made it necessary (Acts 15:28), to prevent the greater scandal of erring (Jewish) unbelievers and weak Christians (who expected the observance of such carnal and false, material ordinances), and for the spread of the Gospel amongst them. In the case of Paul, he had his reasons for keeping the ceremonies in each instance, though they are not always told to us or onlookers. But each time his necessity (Acts 16:1–5; 18:21) was less than ministerial deprivation. Sometimes it was simply to prevent unnecessary conflict.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-fa1d17a117" data-kw="">
<blockquote><p>Let us then bring our hearts to holy resolutions, and set ourselves upon that which is good, and against that which is evil in ourselves or others, according to our callings, upon this encouragement, that Christ’s grace and power shall go along with us. What had become of that great work of reformation of religion in the latter-spring of the gospel, if men had not been armed with invincible courage… that the cause was Christ’s, and that He would not be wanting to his own cause. Luther igenuously confessed that he carried matters often inconsiderately, and with mixture of passion. But upon acknowledgement, God took not advantage of his errors, but the cause being God’s, and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>

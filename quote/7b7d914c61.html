<main class="wrap"><figure class="quote" id="q-7b7d914c61" data-kw="">
<blockquote><p>Though God never, in Scripture, commands that any lesser mistakes in religion, or a simple neglect of religious duties should be punished; yet he commands magistrates, suitably and seasonably, to punish, even to death, idolaters, particularly seducers to it, Deut. xiii. 2-15; 17:2-7; Ex. xxii. 20; blasphemers, Lev. xxiv. 15-16; insolent profaners of the Sabbath, Num. xv. 30-36. Where in all the New Testament, is there a single hint of repeal of such laws, any more than of those concerning murder (Gen. ix. 6; Num. xxxv. 30-31)? Where is a single hint, that Christ’s incarnation abolished these laws and proceed for magistrates a right and power to encourage and protect heretics, blasphemers, and idolaters, who openly and obstinately labour to offend God, and destroy and damn men?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The absurdity and perfidy of all authoritative toleration of gross heresy, blasphemy, idolatry, popery, in Britain. In two letters to a friend. In which the doctrine of the Westminster Confession of Faith relative to toleration of a false religion, and the power of the civil magistrate about sacred </cite>, (1780; Glasgow, 1803), pp 38-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“Though God never, in Scripture, commands that any lesser mistakes in religion, or a simple neglect of religious duties should be punished; yet he commands magistrates, suitably and seasonably, to punish, even to death, idolaters, particularly seducers to it, Deut. xiii. 2-15; 17:2-7; Ex. xxii. 20; blasphemers, Lev. xxiv. 15-16; insolent profaners of the Sabbath, Num. xv. 30-36. Where in all the New Testament, is there a single hint of repeal of such laws, any more than of those concerning murder (Gen. ix. 6; Num. xxxv. 30-31)? Where is a single hint, that Christ’s incarnation abolished these laws and proceed for magistrates a right and power to encourage and protect heretics, blasphemers, and idolaters, who openly and obstinately labour to offend God, and destroy and damn men?”

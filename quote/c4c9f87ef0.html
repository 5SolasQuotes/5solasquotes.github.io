<main class="wrap"><figure class="quote" id="q-c4c9f87ef0" data-kw="">
<blockquote><p>The prophet, in short, teaches us here what Paul has more clearly explained (Rom. 2:29), even this— that the letter is of no value before God, but that the spirit is what He requires: for Paul in these words means that the external sign is worthless, except accompanied by the reality within; for the literal circumcision mentioned by Paul is merely the external rite; in the same manner baptism with us may be called the letter, when there is no repentance and faith. But the spirit, or spiritual circumcision, is the denial of self; it is renovation, and in a word, that true conversion to God, of which the prophet speaks here. …It is yet certain that men do not bestow on themselves what God signifies by the sign of baptism; but He counsels them to seek from God the grace of his Spirit, that they might not in vain be sealed by the external rite of baptism, while destitute of its reality. When therefore the prophet bids the Israelites to take away the foreskin of their heart, it is the same as though he had said, that they were indeed liberal enough with regard to ceremonies and outward worship, but that these were empty masks unless preceded by a right disposition within.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, ch. 4, verse 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, Book XI, ch. II, Of the Efficacy of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-5304def06a" data-kw="">
<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>

</figure><figure class="quote" id="q-ac29eba9a3" data-kw="">
<blockquote><p>The folly and falsehood of baptismal regeneration have been already pointed out in the former lecture. All the arguments there aimed against the opus operatum apply here. The error most probably grew as superstition increased in the primitive Church, out of the unguarded use of the sacramental language by the early fathers, whose doctrine on this point was sounder. We know that baptism, in supposed imitation of Titus 3:5, was currently called regeneration as early as Justin Martyr and Irenaeus. It is easy to see how, as men’s ideas of sacred subjects became more gross, this figurative use of the word introduced the real error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Meaning of Baptism</span></figcaption>

<blockquote><p>…those who founded sects committed to erroneous doctrines proceeded in a way that is opposite to this, The point is clear in the case of Muhammad. He seduced the people by promises of carnal pleasure to which the concupiscence of the flesh goads us. His teaching also contained precepts that were in conformity with his promises, and he gave free rein to carnal pleasure. In all this, as is not unexpected, he was obeyed by carnal men. As for proofs of the truth of his doctrine, he brought forward only such as could be grasped by the natural ability of anyone with a very modest wisdom. Indeed, the truths that he taught he mingled with many fables and with doctrines of the greatest falsity. He did not bring forth any signs produced in a supernatural way, which alone fittingly gives witness to divine inspiration; for a visible action that can be only divine reveals an invisibly inspired teacher of truth. On the contrary, Muhammad said that he was sent in the power of his arms—which are signs not lacking even to robbers and tyrants. What is more, no wise men, men trained in things divine and human, believed in him from the beginning, Those who believed in him were brutal men and desert wanderers, utterly ignorant of all divine teaching, through whose numbers Muhammad forced others to become his followers by the violence of his arms. Nor do divine pronouncements on the part of preceding prophets offer him any witness. On the contrary, he perverts almost all the testimonies of the Old and New Testaments by making them into fabrications of his own, as can be seen by anyone who examines his law. It was, therefore, a shrewd decision on his part to forbid his followers to read the Old and New Testaments, lest these books convict him of falsity. It is thus clear that those who place any faith in his words believe foolishly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, I:6</span></figcaption>

<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God</cite>, bk. 11, ch. 26 in NPNF1 2.220</span></figcaption>

<blockquote><p>A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63) which was called in reaction against it. Thomas de Vio, also known as Cardinal Cajetan (1469-1534), produced a major commentary on the Summa Theologiae that would have a decisive influence upon the general understanding of Aquinas’s doctrines. Cajetan’s emphasis on continuity with Aquinas’s own positions was followed by later commentators such as Dominic Banez (1528-1604), and John Poinsot (1589-1644), who would come to be known as John of St. Thomas. This contrasted with the tendency of thinkers from the new Jesuit order, such as Luis de Molina (1535-1600) and Francisco Suarez (1548-1617), to combine Aquinas’s thought with various non-Thomistic elements. These different tendencies, roughly associated with Dominicans and Jesuits respectively, gave rise to sometimes heated doctrinal disputes, the most famous being the controversy over grace, free will, and divine foreknowledge. Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009)</span></figcaption>

rtes%E2%80%99+rationalism+and+the+empiricism+of+writers+like+Locke%2C+Berkeley%2C+and+Hume+begin+with+the+individual+conscious+subject+or+self%2C+develop+a+theory+about+how+that+self+can+know+anything%2C+and+then+determine+what+reality+in+general+must+be+like+in+line+with+their+respective+theories+of+knowledge.+One+result+of+this+subjectivist+method+was+to+make+objective+reality+and+common+sense+problematic+in+a+way+they+had+not+been+for+Aristotle+and+Aquinas%3B+skepticism+thus+came+to+seem+a+serious+threat%2C+and+idealism+%28the+view+that+the+material+world+is+an+illusion+and+that+mind+alone+is+real%29+came+to+seem+a+serious+option.+Another+consequence+was+that+even+when+some+sort+of+objective+reality+was+acknowledged%2C+doubts+were+raised+about+the+possibility+of+knowing+much+about+it+beyond+what+the+senses+could+tell+us+directly.+Accordingly%2C+grand+metaphysical+systems+of+the+sort+presented+by+Plato%2C+Aristotle%2C+and+Aquinas+were+called+into+question.+The+philosophy+of+Immanuel+Kant+%281724-1804%29+was+an+especially+influential+expression+of+hostility+to+traditional+metaphysics%2C+distinguishing+as+it+does+between+%E2%80%98phenomena%E2%80%99+%28the+world+as+it+appears+to+us%2C+of+which+we+can+have+knowledge%29+and+%E2%80%98noumena%E2%80%99+%28the+world+as+it+exists+in+itself%2C+which+we+cannot+know%29.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98The+Thomistic+tradition%2C+Part+I%E2%80%99+%282009%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69ab3a0edf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69ab3a0edf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-historys-reception-of-aquinas/#:~:text=A%20second%20period%20in%20the%20history,in%20itself%2C%20which%20we%20cannot%20know&amp;text=A%20second%20period%20in%20the%20history%20of%20Thomism&amp;text=it%20exists%20in%20itself%2C%20which%20we%20cannot%20know" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0edcc5e7a1" data-kw="">
<blockquote><p>It was a common practise amongst the young students of our universities in the time of the Dunses [after John Duns Scotus] (and is yet amongst too many, whom spots of Dunsery have stained), that if in disputation they were brought to an inconvenience, were it never so absurd, they would haue a distinction, though void of brain and sense, yet a distinction to maintain it. If a man will be perverse, it is no mastery to do it. But as a wise and learned man does say of them, that they are base wits which are so affected, whereas ingenuous minds and natures well-given will rather seek how true that is which they hold than how they may defend it, making greater price of verity than victory: so I may say (yea much more in matters of religion, of faith, of life eternal) a Christian wit and godly mind will search and weigh rather what should be said truly than what may be said probably or colourably at the least.</p></blockquote>

</figure><figure class="quote" id="q-021583a31f" data-kw="">
<blockquote><p>Let your theologians [O Stapleton] dispute as much as they will that it is the least of all sins, and less than any venial one: what else do they reveal to all but their singular ignorance? If it is so minimal that it ought to be considered less than even any venial sin, then it cannot even be a sin, because what is less than venial is not to be placed among sins, since no sin is less than venial. Do you think Thomas felt this, when he writes that original sin is greater extensively than actual sin, but intensively less, because the actual has more of the nature of the voluntary (Thomas, in pt. 1 of 2, q. 82, art. 2)? If that reason does not deceive, they did rightly who placed it below any venial sin whatsoever, since in the slightest sin there is more of the voluntary than in the original, unless we are understood to have willed in Adam.</p></blockquote>

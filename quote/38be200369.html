<main class="wrap"><figure class="quote" id="q-38be200369" data-kw="">
<blockquote><p>VI. Participation in Prayer How is the congregation to pray together in public worship?… The congregation prays by ‘one mouth speaking for all,’ by an elder leading the people to the throne of grace… What should the worshipper do while the solitary voice is praying aloud? He may allow his mind to pray the same thing silently. He may say in his heart following each petition, ‘Yes, Lord, that is my prayer as well,’ or add his own brief petitions which are suggested by the petitions being offered. And at the conclusion of the prayer he should join audibly in saying the ‘Amen’ as has been the practice of God’s people in both the Old Covenant and the New (Neh. 9:6; 1 Cor. 14:16). Jerome said that the ‘Amen’ following the prayers of the fourth century church was like a clap of thunder! This practice is much to be preferred over the common custom of interrupting or punctuating the prayers by audible ‘Amens’ (or grunts or groans or other such expressions such as, ‘Yes, Lord,’ or ‘Thank you, Jesus!’). Better to nod the head in silent agreement than to distract other worshippers or the one praying or to subject yourself to the temptation of attempting to appear more spiritual than others on the basis of the number or loudness of the audible responses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-schneider-iii.html">Michael Schneider III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Chapter 13, ‘Prayer Regulated by God’s Word’ in Worship in the Presence of God, ed. David Lachman &amp; Frank Smith (Greenville Seminary Press, 1992), pp. 240-1</span></figcaption>

38be200369.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/38be200369.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/saying-amen-after-prayers-in-worship/#:~:text=VI.%20Participation%20in%20Prayer%20How%20is,or%20loudness%20of%20the%20audible%20responses&amp;text=VI.%20Participation%20in%20Prayer%20How%20is%20the%20congregation&amp;text=the%20number%20or%20loudness%20of%20the%20audible%20responses" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-539838700a" data-kw="">
<blockquote><p>III. Let us consider the concluding word, Amen. It imports two things. (1.) Our desire to be heard, q.d. so be it, Rev. 22:20. ‘Amen. Even so come, Lord Jesus.’ And the believer uses this word properly as a testimony of his desire, when by faith he is enabled and emboldened to plead with God, that He would fulfill his requests, 2 Chron. 20:6,11. (2.) Our Confidence and assurance that we shall be heard; q.d. so certainly it shall be, Rev. 1:7. ‘Even so Amen.’ And the sincere Christian uses the word with great propriety in the conclusion of his prayers, in testimony of his assurance to be heard, when he is by faith emboldened quietly to rest upon the Lord, that He will fulfill the desires of his heart, 2 Chron. 14:11. I conclude all with a very few inferences. … 4. Lastly, Use not Amen superficially at the end of your prayers, but with earnestness and faith. As for those who think it superstition to say Amen, they are ignorant of the word of God; and I would recommend to them to consult their Bible and Catechism, in order to cure them of that senseless conceit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion, ‘The Conclusion of the Lord’s Prayer’, in his Works</cite>, vol. 2, pp. 642-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-ee7f641456" data-kw="">
<blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 303-304</span></figcaption>

<blockquote><p>Where these Forms are contended for by men, with respect unto their own use and practice only, as suitable to their experience, and judged by them a serving of God with the best that they have; I shall not take the least notice of them, nor of any dissent about them. But whereas a persuasion not only of their lawfulness but of their necessity is made use of unto other ends and purposes, wherein the peace and edification of believers is highly concerned, it is necessary we should make some inquiry thereinto.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c3a2cc06f5" data-kw="">
<blockquote><p>To use the Sacraments according unto the ordinance of God. So God commanded the Passover to be kept in the assembly of the people, and appointed certain sacrifices unto other feast days and Sabbaths. Also Act. 20. The first day of the week, when as the Disciples were come together to break bread, Paul preached, &amp;c. For as God will have true doctrine to be heard, so he will also have the lawful use of the sacraments to be seen in the public assemblies of the Church: because that he will have both these to be a note, whereby the Church may be known and discerned from other nations &amp; sects. The sacraments also, like as the word, are an instrument, or exercise to stir up and maintain faith and godliness in us. They are also a public profession of our faith and thankfulness unto God, and a part of the public worship of God in the church. And therefore the use of them is most especially agreeable unto the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A very profitable and necessary discourse concerning the observation and keeping of the Sabbath day serving as well to confute the superstition of the Jews, which obstinately urge the strict keeping of the seventh day, as also to overthrow the vain and godless reasons of others, that stiffly at this</cite>, trans. John Stockwood (London: John Harrison, 1584), unpaginated.</span></figcaption>

<blockquote><p>Question 6. Whether absolute and unlimited power of royalty be a ray and beam of divine majesty immediately derived from God? Answer. Not at all. Such a creature is not in the world of God’s creation. Royalists and flatterers of kings are parents to this prodigious birth. There is no shadow of power to do ill in God. An absolute power is essentially a power to do without or above law, and a power to do ill, to destroy; and so it cannot come from God as a moral power by institution, though it come from God by a flux of permissive providence; but so things unlawful and sinful come from God.</p></blockquote>

</figure><figure class="quote" id="q-f4d7b51843" data-kw="">
<blockquote><p>The Scriptures need to be read in the same spirit as the way in which they were written. You will never enter into Paul’s meaning until, by reading him with constant application and by giving yourself to constant meditation, you imbibe his spirit. Likewise, you will never understand David until by your own personal experience you have made the very sentiments of the Psalms your own.

This insight applies to all Scripture. There is the same gulf between attentive study and mere reading as there is between real friendship and mere acquaintance, or between deep companionship and a passing and chance encounter. Some part of your daily reading should also be committed to memory.

The reading should also stimulate the desire to pray which should interrupt the reading. Yet it is an interruption which in fact restores the mind to even more purified understanding. For reading serves the purpose for which it is done. If the reader truly seeks God in his reading, then everything that he reads tends to promote that end. The reader makes the mind surrender in the course of that reading and brings all that is understood under captivity to Christ (2 Corinthians 10:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of God and Spiritual Friendship</cite>, ed. James M. Houston (Basingstoke: Pickering &amp; Inglis, 1983), p. 12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>In the New Testament, Agabus the Prophet by the breath of God’s spirit, foretold of an universal famine over the whole world. Acts. 11.28. which fell out true in the reign of Claudius Caesar. These things it pleased God to reveal to his faithful servants, that in due time they might provide for themselves, least afterward to the disgrace of the name of Christians, they should be forced to seek for sustenance from the Paganish infidel. True it is that we read of some Astrologers, which have foretold both of plenty, and scarcity to come: among the rest Thales, as Diogenes Laettius recordeth, was accused that through giving himself wholly to the study of Philosophy, he neglected his family and private gain, whereupon having by natural causes foreseen that there should be the next year following a great scarcity of oil, he engrossed into his hands for that present year all the Olive Gardens, so that in the dearth he sold Oil at what price he list himself.

Whereby he shewed that Philosophy will serve for the enriching of a man, if he will so employ it. Notwithstanding this, and the like predictions of star-gazing diviners, howsoever they argue a possibility, yet no necessity of truth, having oft times been taken tardy. For God is not bound to these second causes, but eftsoons [sic] bringeth to pass many things besides, and contrary to the course of nature, so that there is much difference between the foretelling of the holy Prophets, and the conjectures of these Welkin Wizards, whose Prognostications of every year’s wars, diseases, heat, cold, drought, moisture, grounded upon no certainty, prove either manifest untruths, or conjectural guesses, most uncertain conclusions, most certain collusions. (So that one of their own late Prophets, as being guilty of their mockeries, hath very fitly prefixed before his yearly false oracles, I would say Almanacs, that speech of David, for the front verse of his calculations: Let God be true, and every man a liar.)

No doubt there is otherwise good use of the Ephemerides or Almanacs, by them to know the motion of the Moon, with set feasts, and other things of like kind: as for the rest of the contents, they are like unto them that make them, always certain in their uncertainty. Husbandmen also have their kind of observations, foretelling of tempests, &amp; winds through the whole year, the assurance whereof is (as we commonly speak) but Hit I miss I: sometimes true, very often false. For God being the Lord of nature, ruleth as himself pleaseth, without, yea, and against the rules of nature. To which power Salomon respecting, requesteth of God, that if in time of Famine, the people being assembled, should pray for plenty, it would please him so to cross or order those second causes, that the present plague might be removed. Which, if it should come rather by casual accidents, then by divine ordinance, should not need the use of prayers, were it never so extreme.

And what else meant God himself, Levit. 23.10. commanding his people of Israel, that the day after the Inning of the corn, they should bring a cease for an offering to the Lord, and shake it before him, and after that, it was lawful for them to eat bread of new wheat? And again in the feast of Pentecost, two loaves of their new corn, for a first fruits unto the Lord. vers. 17. In the Autumn also, the like use in the feast of Tabernacles: verse 39. then by all these ceremonies to teach them, that plenty ariseth not by man’s labour, sweat, or industry, but of God’s blessing only, and therefore he alone to be thanked, both for Harvest, and Vintage, and alone to be prayed unto, to preserve the corn, both on the ground, and in the barn, and withal to know how to use those blessings to Gods glory, and their own good. For this is the right use, saith Saint Paul, 1. Tim. 4.4. of God’s creatures, to sanctify them by prayer and thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-lavater.html">Ludwig Lavater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Christian sermons, made by Lodovike Lavatere, minister of Zurich in Helvetia, of famine and dearth of victuals</cite>, trans. William Barlow (London: Thomas Creed, 1596), pp 9-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

ths%2C+or+conjectural+guesses%2C+most+uncertain+conclusions%2C+most+certain+collusions.+%28So+that+one+of+their+own+late+Prophets%2C+as+being+guilty+of+their+mockeries%2C+hath+very+fitly+prefixed+before+his+yearly+false+oracles%2C+I+would+say+Almanacs%2C+that+speech+of+David%2C+for+the+front+verse+of+his+calculations%3A+Let+God+be+true%2C+and+every+man+a+liar.%29%0A%0ANo+doubt+there+is+otherwise+good+use+of+the+Ephemerides+or+Almanacs%2C+by+them+to+know+the+motion+of+the+Moon%2C+with+set+feasts%2C+and+other+things+of+like+kind%3A+as+for+the+rest+of+the+contents%2C+they+are+like+unto+them+that+make+them%2C+always+certain+in+their+uncertainty.+Husbandmen+also+have+their+kind+of+observations%2C+foretelling+of+tempests%2C+%26+winds+through+the+whole+year%2C+the+assurance+whereof+is+%28as+we+commonly+speak%29+but+Hit+I+miss+I%3A+sometimes+true%2C+very+often+false.+For+God+being+the+Lord+of+nature%2C+ruleth+as+himself+pleaseth%2C+without%2C+yea%2C+and+against+the+rules+of+nature.+To+which+power+Salomon+respecting%2C+requesteth+of+God%2C+that+if+in+time+of+Famine%2C+the+people+being+assembled%2C+should+pray+for+plenty%2C+it+would+please+him+so+to+cross+or+order+those+second+causes%2C+that+the+present+plague+might+be+removed.+Which%2C+if+it+should+come+rather+by+casual+accidents%2C+then+by+divine+ordinance%2C+should+not+need+the+use+of+prayers%2C+were+it+never+so+extreme.%0A%0AAnd+what+else+meant+God+himself%2C+Levit.+23.10.+commanding+his+people+of+Israel%2C+that+the+day+after+the+Inning+of+the+corn%2C+they+should+bring+a+cease+for+an+offering+to+the+Lord%2C+and+shake+it+before+him%2C+and+after+that%2C+it+was+lawful+for+them+to+eat+bread+of+new+wheat%3F+And+again+in+the+feast+of+Pentecost%2C+two+loaves+of+their+new+corn%2C+for+a+first+fruits+unto+the+Lord.+vers.+17.+In+the+Autumn+also%2C+the+like+use+in+the+feast+of+Tabernacles%3A+verse+39.+then+by+all+these+ceremonies+to+teach+them%2C+that+plenty+ariseth+not+by+man%E2%80%99s+labour%2C+sweat%2C+or+industry%2C+but+of+God%E2%80%99s+blessing+only%2C+and+therefore+he+alone+to+be+thanked%2C+both+for+Harvest%2C+and+Vintage%2C+and+alone+to+be+prayed+unto%2C+to+preserve+the+corn%2C+both+on+the+ground%2C+and+in+the+barn%2C+and+withal+to+know+how+to+use+those+blessings+to+Gods+glory%2C+and+their+own+good.+For+this+is+the+right+use%2C+saith+Saint+Paul%2C+1.+Tim.+4.4.+of+God%E2%80%99s+creatures%2C+to+sanctify+them+by+prayer+and+thanksgiving.%E2%80%9D%0A%0A%E2%80%94+Ludwig+Lavater%2C+Three+Christian+sermons%2C+made+by+Lodovike+Lavatere%2C+minister+of+Zurich+in+Helvetia%2C+of+famine+and+dearth+of+victuals%2C+trans.+William+Barlow+%28London%3A+Thomas+Creed%2C+1596%29%2C+pp+9-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8421969f23.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8421969f23.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/12/23/ludwig-lavater-on-famines-and-gods-use-of-secondary-causes/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

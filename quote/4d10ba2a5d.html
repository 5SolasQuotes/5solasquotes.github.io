<main class="wrap"><figure class="quote" id="q-4d10ba2a5d" data-kw="decree necessity">
<blockquote><p>Does the decree necessitate future things? We affirm. … The question is agitated between us and the Pelagians and semi-Pelagians (old and new) who, to establish the more easily the idol of free will, deny the necessity of things from the decree and foreknowledge (which the orthodox constantly maintain).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.4.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19470c5e06" data-kw="Author of sin">
<blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

</figure><figure class="quote" id="q-b7e4f428d6" data-kw="">
<blockquote><p>How may we attribute this same work to God, to Satan, and to man as author, without either excusing Satan as associated with God, or making God the author of evil? Easily, if we consider first the end, and then the manner, of acting. The Lord&#x27;s purpose is to exercise the patience of His servant by calamity; Satan endeavors to drive him to desperation; the Chaldeans strive to acquire gain from another&#x27;s property contrary to law and right. So great is the diversity of purpose that already strongly marks the deed. There is no less difference in the manner. The Lord permits Satan to afflict His servant; He hands the Chaldeans over to be impelled by Satan, having chosen them as His ministers for this task. Satan with his poison darts arouses the wicked minds of the Chaldeans to execute that evil deed. They dash madly into injustice, and they render all their members guilty and befoul them by the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.2</span></figcaption>

</figure><figure class="quote" id="q-14ba01d57f" data-kw="Hardening Justice">
<blockquote><p>God certainly does not in either case effect or infuse blindness or hardness into the sinner (cf. James 1:13–14), yet neither does he only not take away blindness and hardness, by not circumcising the heart (Jer. 6:10, 26; Acts 7:51), or by not conferring spiritual light to the mind, or softness and malleability to the heart (Matt. 13:14–15; Isa. 6:9–10), but in addition: (1) on account of preceding sins, in a just and holy way, he takes away or diminishes the remnants of wisdom and moral goodness that a sinner has, and also augments and aggravates his original blindness and hardness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §20</span></figcaption>

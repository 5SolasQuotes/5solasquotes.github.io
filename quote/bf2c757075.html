<blockquote><p>It is not at all to be doubted, but the end proposed by philosophy, was to renew and to reform mankind, and to reduce the course of their lives to a conformity with the precepts of wisdom and virtue. …

True religion, to be sure, has the same tendency: but it promotes its end with much greater force, and better success; because its principles are much more exalted, its precepts and instructions are of greater purity, and it is, besides, attended with a divine power, whereby it makes its way into the hearts of men, and purifies them with the greatest force and efficacy; and yet, at the same time, with the most wonderful pleasure and delight. And this is the regeneration of which we are speaking, and whereof we have already observed, that philosophy acknowledged it, even under the same name; but that it effected it, we absolutely deny. …

Philosophy, as we have already observed, perceiving that man was born to higher views than this world affords, attempted to raise him from his present dejection, secure his claim to heaven, and restore him to a conformity and likeness to God; but in vain. To redeem the sons of man, and restore them to what they had lost, it was necessary that the eternal Son of God should come down from heaven. Our fall was easily brought about, but our restauration was a work of the greatest difficulty, and only to be performed by the powerful hand of God; there are but few, whom the exalted Father of spirits has loved, and Christ has raised up to heaven.

He is the source whence the spirit of God flows down to us, he is the fountain of that new life and sanctified nature, by which we mount towards God, whereby we overcome the world, and, in consequence thereof, are admitted to heaven, And happy, to be sure, are those truly noble souls, whose fate it is to be thus born again, to be admitted into the choirs of the holy angels, and to be cloathed with those glorious robes that are whiter than snow: they will follow the lamb wherever he goes, and he will lead them to the crystal streams, and even to the fountain of life itself.</p></blockquote>

<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

l+fire.%E2%80%9D+%28Sentences%2C+bk.+4%2C+dist.+44%2C+q.+3%2C+art.+2%2C+quaestiuncula+2%29+Voet%3A+%E2%80%9CWhether+true+fire+is+given+in+Hell%2C+or+whether+it+is+only+metaphorical%3F+It+is+not+said+and+it+is+permitted+to+be+inquired+into.+Whether+it+is+corporal+or+rather+spiritual%3F+The+question+is+inept.+Whether+it+is+of+the+same+species+with+our+fire%3F+The+question+is+curious%E2%80%A6+Is+it+an+error+of+the+Faith+to+suppose+an+incorporeal+and+immaterial+infernal+fire%3F+The+question+is+absurd.%E2%80%9D+%28Syllabus%2C+sect.+2%2C+tract+6%2C+title+6%2C+subtitle+2%2C+%E2%80%98Of+Infernal+Fire%E2%80%99%29+.+Heaven+Agreements+Saints+do+Not+See+All+Things+on+Earth+through+God+Turretin+contends+against%2C+%E2%80%9Cas+the+papists+wish%E2%80%A6+the+imaginary+mirror+of+the+Trinity%2C+which+they+feign+%28as+if+saints%2C+seeing+all+things+in+the+essence+of+God+saw+all+things+done+here%29+%5Bto+support+the+intercession+of+the+saints%5D%E2%80%A6+It+displeased+not+a+few+of+the+distinguished+papists%3A+Lombard%2C+Thomas+Aquinas+%5BSumma%2C+suppl.+92%2C+art.+3%5D%E2%80%A6%E2%80%9D+%282.43%29+.+Saints+will+See+Punishment+of+the+Damned+Leigh%3A+%E2%80%9CAquinas+has+this+question%2C+Whether+the+blessed+which+are+in+the+Fatherland+see+the+punishment+of+the+damned%3F+and+resolves+they+shall%2C+because+it+makes+to+the+perfection+of+their+blessedness%2C+%E2%80%98Opposites+placed+next+to+each+other+shine+forth+more+brightly.%E2%80%99+They+shall+perfectly+see+the+punishment+of+the+wicked%2C+that+their+blessedness+may+the+more+content+them+and+they+may+give+more+abundant+thanks+to+God.%E2%80%9D+%28System+of+Divinity%2C+p.+872%29+.+The+Heaven+of+God%E2%80%99s+Throne+Room+will+Not+be+Renovated+with+Fire+Thomas%3A+%E2%80%9C%E2%80%A6the+higher+heavens+will+not+be+cleansed+by+that+fire%E2%80%A6+The+cleansing+of+the+world+will+be+for+the+purpose+of+removing+from+bodies+the+disposition+contrary+to+the+perfection+of+glory%E2%80%A6+Peter+explains+himself+to+which+heavens+he+refers%E2%80%A6+%E2%80%98the+heavens+first%2C+and+the+earth+through+water+perished%2C+which+now+by+the+same+word+are+kept+in+store%2C+reserved+unto+fire+unto+the+day+of+judgment%E2%80%99+%282+Pet+5%3A5%E2%80%937%29%E2%80%A6+Nor+did+the+empyrean+heaven+contract+any+stain%E2%80%A6%E2%80%9D+%28Summa%2C+suppl.%2C+q.+74%2C+art.+4%29+For+the+Reformed%3A+%E2%80%98On+the+Renovation%2C+New+Heavens+%26+Earth%E2%80%99.+.+Mixed+Deification+Thomas+affirmed+a+kind+of+deification+of+heavenly+saints+with+respect+to+the+light+of+glory+and+the+beatific+vision.+Yet+for+Thomas%2C+%E2%80%9Cthe+light+of+glory%2C+like+the+habit+of+grace%2C+is+something+created.+So+in+either+state%2C+pre-+or+post-mortem%2C+deification+is+something+created.%E2%80%9D+%28p.+32%29+This+is+in+contrast+to+deification+being+grounded+in+uncreated+grace%2C+per+the+Eastern+Orthodox%2C+which+entails+the+host+of+problems+often+associated+with+the+term.+See+Richard+Cross%2C+%E2%80%98Deification+in+Aquinas%E2%80%99.+Yet+many+of+the+Reformed+were+hesitant+or+contrary+to+accepting+Thomas%E2%80%99s+exact+method+and+paradigm+of+how+saints+see+God.+See+on+the+Beatific+Vision+below.+Yet%2C+Carl+Mosser+has+found+the+concept+and%2For+terminology+of+deification%2C+in+protestant+senses%2C+in+Martin+Luther%2C+Ulrich+Zwingli%2C+Martin+Bucer%2C+Henry+Bullinger%2C+John+Calvin%2C+Richard+Hooker+and+Jonathan+Edwards%3A+%E2%80%98Deification%3A+a+Truly+Ecumenical+Concept%E2%80%99+and+%E2%80%98Recovering+the+Reformation%E2%80%99s+Ecumenical+Vision+of+Redemption+as+Deification+and+Beatific+Vision%E2%80%99.+Using+the+term+of+deification+for+growing+more+and+more+into+the+image+of+God%2C+through+beholding+Him%2C+for+all+eternity%2C+is+not+to+no+purpose.+2+Pet.+1%3A4+says+%E2%80%9Cthat+by+these%2C%E2%80%9D+including+godliness%2C+all+graces+and+the+promises+of+God%2C+including+that+of+glorification%2C+%E2%80%9Cye+might+be+partakers+of+the+divine+nature%E2%80%9D.+Ps.+17%3A15%3A+%E2%80%9CAs+for+me%2C+I+will+behold+thy+face+in+righteousness%3A+I+shall+be+satisfied%2C+wh <blockquote><p>When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.”

— Gisbertus Voetius, Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+we+demand+the+use+of+reason+and+logic%2C+we+no+more+turn+them+into+the+foundations%2C+principles%2C+and+rules+of+faith+than+we+do+our+eyes%2C+ears%2C+and+tongues+without+which+we+can+neither+learn+nor+teach+our+religion%2C+nor+defend+it+against+opponents.+For+us+they+are%2C+therefore%2C+means+and+requirements+without+which+there+is+no+faith+or+theological+knowledge%2C+but+they+are+certainly+not+principles%2C+norms%2C+rules%2C+and+foundations.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Appendix+2%2C+%E2%80%98The+Use+of+Reason+In+Matters+of+Faith%E2%80%99+in+Introduction+to+Reformed+Scholasticism%2C+ed.+Joel+R.+Beeke+%26+Jay+T.+Collier%2C+trans.+Albert+Gootjes+%28Reformation+Heritage+Books%2C+2011%29%2C+p.+12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb2eaf7123.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb2eaf7123.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-use-of-reason-in-theology/#:~:text=When%20we%20demand%20the%20use%20of,not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations&amp;text=When%20we%20demand%20the%20use%20of%20reason%20and&amp;text=are%20certainly%20not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e54fea7c48" data-kw="">
<blockquote><p>…the difficulty to do good, proneness to evil, contrariety between the powers and faculties of the soul, and the rebellion of the meaner against the superior and better, are not the conditions of nature, as it was or might have been in itself before the entrance of sin, but that all these proceed from the putting of the powers of the soul, by the loss of grace, out of that course, which by the law of God and nature they were to hold. For does not the condition of man’s nature require that amongst things inquired after, thought of, and known, God should be the first? and amongst things desired and loved, nothing should be desired and loved more or before Him, nor otherwise than for Him? and is it not clear and evident, that if God be the first thing that is thought of, sought after, and loved, and that nothing be sought after or respected, but after and for God, that there will be no proneness to evil, difficultire to do good, contrariety between the powers of the soul, and rebellion of the meaner and inferior against the better and superior? surely there is none that can or will make question of it. Now it is confessed by the best learned amongst the Schoolmen, that howsoever it be not so in the course of our understanding, in this state wherein we are, yet according to the course of the nature of our understanding simply considered, it should be so, that God should be the first thing sought after and known by us. … By this which has ben said [including the quotes by Scotus and Bonaventure], it is evident that according to the course of nature not disordered, nor put out of course, the first thing that is inquired after, thought of and known, is God, and that He is the first good that is desired and loved, and that no other thing is desired or loved but after Him, and for Him. So that none of the things formerly mentioned can be found in the nature of man, unless it be put out of course. Whence grows the contrariety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.</p></blockquote>

ety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.”

— Richard Field, Other citations (work not named), Of the Church (Oxford: Turner, 1628), bk. 3, Answer to Berely, ch. 5, pp. 252-54 Field (1561–1616) was an English ecclesiological theologian associated with the work of Richard Hooker.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+difficulty+to+do+good%2C+proneness+to+evil%2C+contrariety+between+the+powers+and+faculties+of+the+soul%2C+and+the+rebellion+of+the+meaner+against+the+superior+and+better%2C+are+not+the+conditions+of+nature%2C+as+it+was+or+might+have+been+in+itself+before+the+entrance+of+sin%2C+but+that+all+these+proceed+from+the+putting+of+the+powers+of+the+soul%2C+by+the+loss+of+grace%2C+out+of+that+course%2C+which+by+the+law+of+God+and+nature+they+were+to+hold.+For+does+not+the+condition+of+man%E2%80%99s+nature+require+that+amongst+things+inquired+after%2C+thought+of%2C+and+known%2C+God+should+be+the+first%3F+and+amongst+things+desired+and+loved%2C+nothing+should+be+desired+and+loved+more+or+before+Him%2C+nor+otherwise+than+for+Him%3F+and+is+it+not+clear+and+evident%2C+that+if+God+be+the+first+thing+that+is+thought+of%2C+sought+after%2C+and+loved%2C+and+that+nothing+be+sought+after+or+respected%2C+but+after+and+for+God%2C+that+there+will+be+no+proneness+to+evil%2C+difficultire+to+do+good%2C+contrariety+between+the+powers+of+the+soul%2C+and+rebellion+of+the+meaner+and+inferior+against+the+better+and+superior%3F+surely+there+is+none+that+can+or+will+make+question+of+it.+Now+it+is+confessed+by+the+best+learned+amongst+the+Schoolmen%2C+that+howsoever+it+be+not+so+in+the+course+of+our+understanding%2C+in+this+state+wherein+we+are%2C+yet+according+to+the+course+of+the+nature+of+our+understanding+simply+considered%2C+it+should+be+so%2C+that+God+should+be+the+first+thing+sought+after+and+known+by+us.+%E2%80%A6+By+this+which+has+ben+said+%5Bincluding+the+quotes+by+Scotus+and+Bonaventure%5D%2C+it+is+evident+that+according+to+the+course+of+nature+not+disordered%2C+nor+put+out+of+course%2C+the+first+thing+that+is+inquired+after%2C+thought+of+and+known%2C+is+God%2C+and+that+He+is+the+first+good+that+is+desired+and+loved%2C+and+that+no+other+thing+is+desired+or+loved+but+after+Him%2C+and+for+Him.+So+that+none+of+the+things+formerly+mentioned+can+be+found+in+the+nature+of+man%2C+unless+it+be+put+out+of+course.+Whence+grows+the+contrariety+between+the+meaner+and+better%2C+superior+and+inferior+faculties+of+the+soul%2C+but+from+hence%2C+that+the+soul+in+this+state+of+her+aversion+from+God%2C+takes+the+beginning+of+all+her+knowledge+from+the+senses%2C+apprehends+particular+things+as+good+upon+the+first+view%2C+and+to+be+desired%2C+which+afterwards+upon+better+consideration%2C+in+respects+not+considered+at+the+first%2C+she+finds+are+not+good+nor+desirable%3F+And+whence+is+the+rebellion+of+the+inferior+against+the+superior%2C+but+from+hence%2C+that+the+superior+having+cast+off+the+dependance+it+formerly+had+upon+God+and+respect+unto+Him%2C+the+inferior+also+casts+off+the+respect+it+had+to+it%3F+%E2%80%98What+could+have+been+more+just+than+that+he+should+receive+retaliation+in+kind%3F+God+is+the+life+of+the+soul%2C+and+the+soul+is+the+life+of+the+body.+By+sinning+the+soul+willingly+lost+its+power+to+live%3B+let+it+unwillingly+lose+also+its+power+to+give+life.+Having+freely+driven+away+life%E2%80%94since+it+did+not+wish+to+live%E2%80%94let+it+not+be+able+to+bestow+life+on+whom%2C+or+in+what+measure%2C+it+may+wish.+The+soul+would+not+be+ruled+by+God%3B+let+it+be+unable+to+rule+the+body.+If+it+does+not+obey+its+superior%2C+why+should+it+command+its+inferior%3F+The+Creator+found+His+creature+rebellious+against+Himself%3B+let+the+soul+likewise+find+its+own+handmaid+%28the+body%29+rebellious+against+it.+Man+was+found+a+transgressor+of+the+divine+law%3B+let+him+find+another+law+in+his+members+opposing+the+law+of+his+mind+and+bringing+him+into+captivity+to+the+law+of+sin.+And+since+sin+sets+a+separation+between+us+and+God%2C+let+death+likewise+set+a+separation+between+our+body+and+ourselves.%E2%80%99+Bernard+of+Clairvaux%2C+Sermon+to+the+Knights+of+the+Temple%2C+ch.+11%2C+%E2%80%98Of+the+Sepulcher%E2%80%99+From+hence+likewise+is+that+danger+of+erring%2C+whereunto+man+is+subject%3B+for+apprehending+particular+things+first%2C+his+knowledge+is+imperfect+and+confused%3B+and+not+without+much+labor+and+danger+of+erring+does+he+come+to+the+distinct+knowledge+of+any+thing.+And+hence+also+flows+that+ignorance+that+is+found+in+men%3B+for+taking+the+beginning+of+all+the+knowledge+they+have+from+the+senses%2C+they+know+no+more+touching+anything+than+may+be+discerned+by+the+accidents+and+outward+effects+of+it%2C+and+so+never+come+to+know+anything+in+the+essence+of+it%2C+or+immediately+as+it+is+in+itself.+So+that+according+to+that+which+before+I+noted%2C+out+of+the+book+called+Destructorium+vitiorum%2C+as+a+man+may+know+in+the+dark%2C+the+length%2C+breadth+and+other+dimensions+of+a+thing%2C+but+not+whether+it+be+fair+or+foul%2C+white+or+black.+So+men+in+this+obscurity+of+discerning%2C+may+find+out+that+there+is+a+God%2C+and+that+He+is+the+beginning+and+cause+of+all+things%3A+but+they+cannot+know+how+fair%2C+how+good%2C+how+merciful%2C+and+how+glorious+He+is%2C+that+so+they+may+love+Him%2C+fear+Him%2C+honour+Him%2C+and+trust+in+Him+as+God%2C+unless+they+have+an+illumination+of+grace.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+Answer+to+Berely%2C+ch.+5%2C+pp.+252-54+Field+%281561%E2%80%931616%29+was+an+English+ecclesiological+theologian+associated+with+the+work+of+Richard+Hooker.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe54fea7c48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e54fea7c48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-epistemology/#:~:text=the%20difficulty%20to%20do%20good%2C%20proneness,they%20have%20an%20illumination%20of%20grace&amp;text=the%20difficulty%20to%20do%20good%2C%20proneness%20to%20evil&amp;text=God%2C%20unless%20they%20have%20an%20illumination%20of%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Most Illustrious COCCEIUS, in ad ultimum Mosis, § 74, says these words, “It comes here to be wondered at, even a new pestilence sprouting at this time, of those that induce the soul to doubt, whether they themselves be, see, hear, etc. Wretched mortals, who reason against their own sense, doubting themselves to be, and daring to profess themselves to be infidels and ἀθέους/atheists, at least while they are willing to doubt; thereon they are going to apply themselves to this, that they might question all things, with respect to which they are able to delay their confidence (which the Scripture calls reasonings and murmurings), and remove from themselves the knowledge of God and His ways.” Add what things are found in his Summa Theologiæ, chapter VIII, § 25, opera, tome 7, page 160.</p></blockquote>

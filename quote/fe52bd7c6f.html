<blockquote><p>Frame takes it for granted that “worldview” is a durable, if not permanent, concept. This assumption seems unwarranted. Worldview is itself a product of modern philosophy—of Hegel’s idealism, to be precise. Frame doesn’t see an antithesis between worldview and Christianity. But that tension needs to be explored. Worldview as a concept may not even survive the passing of the modern age. If not, then Christians need to be equipped for life after worldview.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9258de8cc" data-kw="">
<blockquote><p>1. Concerning metaphysics to be produced by the Reformed, long before me the most learned men from all sides have thought much; and who, if even the least leisure had been theirs from their affair, would here easily have borne off the prize. [William] Twisse pities the fate of Christianity that until now the students of our [reformed] academies have used no other instructors but Jesuits: and they hope to be able to aspire to the arduous progress of things where it lies open by natural light by such masters. Yet who would have been more fit than him to undertake this labor for the sake of the theological youth? Who would have more suitably cleansed that Augean stable of the Jesuits; and thus through natural reason would have paved for us the royal way to the innermost parts of sacred theology? lest the enemies of the Orthodox religion through first philosophy, defiled and polluted by them, should make a straight attack on pure and sacred theology. But that most famous man has departed; and what others would have not undeservedly demanded from him, he in vain desired in others. Must therefore so great a work be put off to the coming of Elijah or of Christ the Savior? Not indeed. Provision must especially be made for those who will one day propose the mysteries of God to the people. Provision must be made as quickly as possible, lest like the Israelites the students be perpetually compelled to borrow arms from the Philistines, the enemies of divine truth. I designate the writings of the Jesuits, which certainly are not traversed safely enough by studious youth, because they prepare the way to Pelagianism, Skepticism, Libertinism and many other things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-voet.html">Paul Voet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Philosophy Reformed</cite>, tr. by AI by Onku (Utrecht: Johann Waesberg, 1657) Latin, ch. 1 ch. 2, pt. 1, 2; ch. 1</span></figcaption>

<blockquote><p>…the difficulty to do good, proneness to evil, contrariety between the powers and faculties of the soul, and the rebellion of the meaner against the superior and better, are not the conditions of nature, as it was or might have been in itself before the entrance of sin, but that all these proceed from the putting of the powers of the soul, by the loss of grace, out of that course, which by the law of God and nature they were to hold. For does not the condition of man’s nature require that amongst things inquired after, thought of, and known, God should be the first? and amongst things desired and loved, nothing should be desired and loved more or before Him, nor otherwise than for Him? and is it not clear and evident, that if God be the first thing that is thought of, sought after, and loved, and that nothing be sought after or respected, but after and for God, that there will be no proneness to evil, difficultire to do good, contrariety between the powers of the soul, and rebellion of the meaner and inferior against the better and superior? surely there is none that can or will make question of it. Now it is confessed by the best learned amongst the Schoolmen, that howsoever it be not so in the course of our understanding, in this state wherein we are, yet according to the course of the nature of our understanding simply considered, it should be so, that God should be the first thing sought after and known by us. … By this which has ben said [including the quotes by Scotus and Bonaventure], it is evident that according to the course of nature not disordered, nor put out of course, the first thing that is inquired after, thought of and known, is God, and that He is the first good that is desired and loved, and that no other thing is desired or loved but after Him, and for Him. So that none of the things formerly mentioned can be found in the nature of man, unless it be put out of course. Whence grows the contrariety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.</p></blockquote>

rselves.%E2%80%99+Bernard+of+Clairvaux%2C+Sermon+to+the+Knights+of+the+Temple%2C+ch.+11%2C+%E2%80%98Of+the+Sepulcher%E2%80%99+From+hence+likewise+is+that+danger+of+erring%2C+whereunto+man+is+subject%3B+for+apprehending+particular+things+first%2C+his+knowledge+is+imperfect+and+confused%3B+and+not+without+much+labor+and+danger+of+erring+does+he+come+to+the+distinct+knowledge+of+any+thing.+And+hence+also+flows+that+ignorance+that+is+found+in+men%3B+for+taking+the+beginning+of+all+the+knowledge+they+have+from+the+senses%2C+they+know+no+more+touching+anything+than+may+be+discerned+by+the+accidents+and+outward+effects+of+it%2C+and+so+never+come+to+know+anything+in+the+essence+of+it%2C+or+immediately+as+it+is+in+itself.+So+that+according+to+that+which+before+I+noted%2C+out+of+the+book+called+Destructorium+vitiorum%2C+as+a+man+may+know+in+the+dark%2C+the+length%2C+breadth+and+other+dimensions+of+a+thing%2C+but+not+whether+it+be+fair+or+foul%2C+white+or+black.+So+men+in+this+obscurity+of+discerning%2C+may+find+out+that+there+is+a+God%2C+and+that+He+is+the+beginning+and+cause+of+all+things%3A+but+they+cannot+know+how+fair%2C+how+good%2C+how+merciful%2C+and+how+glorious+He+is%2C+that+so+they+may+love+Him%2C+fear+Him%2C+honour+Him%2C+and+trust+in+Him+as+God%2C+unless+they+have+an+illumination+of+grace.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Of+the+Church+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+Answer+to+Berely%2C+ch.+5%2C+pp.+252-54+Field+%281561%E2%80%931616%29+was+an+English+ecclesiological+theologian+associated+with+the+work+of+Richard+Hooker.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe54fea7c48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e54fea7c48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-epistemology/#:~:text=the%20difficulty%20to%20do%20good%2C%20proneness,they%20have%20an%20illumination%20of%20grace&amp;text=the%20difficulty%20to%20do%20good%2C%20proneness%20to%20evil&amp;text=God%2C%20unless%20they%20have%20an%20illumination%20of%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eda808d4d5" data-kw="">
<blockquote><p>Doth the plowman plow all day to sow? doth he open and break the clods of his ground? When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place? For his God doth instruct him to discretion, and doth teach him. For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod. Bread corn is bruised; because he will not ever be threshing it, nor break it with the wheel of his cart, nor bruise it with his horsemen. This also cometh forth from the Lord of hosts, which is wonderful in counsel, and excellent in working.</p></blockquote>

</figure><figure class="quote" id="q-badf2ca8b8" data-kw="">
<blockquote><p>Spiritual substance is distinguished from matter by the characteristic of self-motion, or motion ab intra [from inside]. Matter must be moved from without, by another material substance impinging upon it. But mind moves from within. Its motion is not from external impact, but is self-motion. Adam was created a spirit. The instant, therefore, that he was created, he had all the characteristics that distinguish spirit from matter. One of these, and one of the most important, is self-motion. But self-motion is self-determination, and self-determination is inclination. The Scripture asserts that Adam was created a ‘living soul.’ Life implies motion; and the motion in this case was not mechanical or material, but the motion of mind. Thus in creating a rational spirit, God creates a self-moving essence, and this is a self-determining will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (NY: Charles Scribner’s Sons, 1888), vol. 2, ch. 2, ‘Man’s Primitive State’, p. 100</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d9d9785a36" data-kw="">
<blockquote><p>10th Consideration: The present felicity into which all that die in Christ are presently admitted, should abundantly comfort Christians over the death of such as either carried a lively hope out of the world with them, or have left good grounds of such an hope behind them. Some there are that carried a lively hope to heaven with them, who could evidence to themselves and friends their interest in Christ and in the Covenant. Yea, though they had died in silence, yet their conversations would speak for them, and the tenor of their lives leave no ground of doubting touching their death: others dying in their infancy or youth, though they carried not such an actual hope with them, yet they have left good grounds of hope behind them. Parents now ponder these grounds; you have prayed for them, you have many times wrestled with the Lord on their behalf; you have taken hold of God’s Covenant for them, as well as for your selves, and dedicated them to the Lord, and they have not by any actions of theirs destroyed those grounds of your hope, but that you may with much probability conclude they are with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Token for Mourners, or, the advice of Christ to a distressed mother bewailing the death of her dear and only son</cite>, … (1674), p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

<blockquote><p>Howbeit, if I should be asked concerning the infants of Christians, which depart without this sacrament: mine answer should be, that we must have a good hope of them and stick fast to the Word of God; namely, to the covenant made with Abraham, wherein God promises Himself, not only that He would be a God unto him, but also unto his seed. Which promise, seeing it is not so general, as it comprehends all; therefore I dare not promise certain salvation particularly unto any that departs hence. For their be some children of the saints, which belong not unto predestination; such we read to be Esau, Ishmael, and others more, whose salvation is not hindered, in respect that they were not baptized. … I always except the children of the elect; for we doubt not to number them among the company of believers, though they as yet believed not by reason of their age: even as they which be born of infidels, are reckoned among the unbelievers, although of themselves they withstand not the faith. So as the children of the godly, departing without baptism, by reason of the covenant that God hath made with their parents, may be saved; if they appertain to the number of such as be predestinate. Also, I do except all others, if any there be, which by the secret council of God belong unto predestination.</p></blockquote>

</figure><figure class="quote" id="q-c8169f3d76" data-kw="">
<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Exercitations</cite>, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

n-of-infants-in-without-the-church/#:~:text=All%20infants%20of%20Christians%2C%20even%20before,the%20elect%20alone%2C%20which%20baptism%20seals&amp;text=All%20infants%20of%20Christians%2C%20even%20before%20baptism%20are&amp;text=prerogative%20of%20the%20elect%20alone%2C%20which%20baptism%20seals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-55aeaf294c" data-kw="">
<blockquote><p>And by the way I observe, you are apt to discourse of God’s infinite love towards them that perish amongst men, but of any such love towards them that perish amongst angels, not a word: yet it is as evident, that if any perish amongst angels, it is merely their own faults also: Nay, much more evident is this in the nation of angels than in the nation of men. For many thousand infants perish in original sin, for no personal original fault of their own, but for the transgression of Adam, and in that corruption which is naturally derived unto them from the loins of Adam, after that by his actual transgression he fell into the state of that corruption, which since from him is become hereditary unto us all. As for that miscarriage which makes all men obnoxious unto the wrath of God, and unto condemnation, we hold it impossible to be prevented. For original sin and Adam’s transgression is it, which you well know, cannot be prevented: Only God may have mercy on whom He will, even in despite of any actual miscarriage (which you dote upon as an only hinderer from grace) like as on the other side He hardens whom He will, in spite of all civil and moral good carriage found in the best of heathen men. This I speak according to the doctrine of Saint Paul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity</cite>, … (London: Thorp, 1631), sect. 2, sect. 3, ch. 18, p. 641</span></figcaption>

%20the%20way%20I%20observe,to%20the%20doctrine%20of%20Saint%20Paul&amp;text=And%20by%20the%20way%20I%20observe%2C%20you%20are&amp;text=speak%20according%20to%20the%20doctrine%20of%20Saint%20Paul" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>What is to be judged of the soul of a child so killed, having as yet not received the sacrament [of circumcision]? I answer that we, as touching his salvation or condemnation, can affirm nothing on either side. For if he pertained to the number of the elect so that he was predestinate to life, there is no cause but that he may be saved: forasmuch as grace is not bound unto sacraments. But if he were a vessel to that end made of God, to show forth in him His wrath, and so to be condemned, what can we complain on the severity of God, especially seeing we are all born the children of wrath and condemnation? Howbeit in my judgment we ought to hope well in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/common-places.html">Common Places</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Book 4 | ch. 7, ‘Of Sacraments in General’, ‘Of Circumcision’, p. 110</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“What is to be judged of the soul of a child so killed, having as yet not received the sacrament [of circumcision]? I answer that we, as touching his salvation or condemnation, can affirm nothing on either side. For if he pertained to the number of the elect so that he was predestinate to life, there is no cause but that he may be saved: forasmuch as grace is not bound unto sacraments. But if he were a vessel to that end made of God, to show forth in him His wrath, and so to be condemned, what can we complain on the severity of God, especially seeing we are all born the children of wrath and condemnation? Howbeit in my judgment we ought to hope well in him.”

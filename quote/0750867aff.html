<blockquote><p>83. Q. What [is the] eleventh motive [for Sabbath observance]?

A. Threats against profaners of it.

What promises cannot do on hard hearts, threats may do. For they are of force to affright men: and in a manner to force men to obedience. The Lord therefore being willing every way to try how men may be wrought upon, useth this remedy: and the rather he useth it, that judgement, and the execution thereof may be prevented. For this is the proper end of threatnings before hand, that after-judgements may be avoided: so as it regard of the end whereat they aim, they appear to be evidences of God’s favour. For these read Exod. 31.14, 15. Jer. 17.27. Ezek. 20.13, 21.

84 Q. What twelfth motive?

A. Judgments executed on such as violated it.

Execution of judgment hath a threefold end.

The first aimeth at him on whom the judgement is executed: by the sense and smart thereof to be drawn to repentance. Thus was Manasseh wrought upon by a fearful judgement executed on him, 2 Chron. 33. 12, 13.

The second aimeth at others, that if they on whom the judgement is executed be so hardened, as it move them not, yet others may be warranted thereby: For this end the judgements on impenitent sinners of old is set before Christians to admonish them. I. Cor. 10.6, etc. Heb. 3.12. Jude ver. 5, 6, etc.

The third aimeth at God: that if neither they on whom judgements are executed, nor others that see them or hear of them, be wrought upon, yet God may be justified. In which respect he is said to be known by the judgement which he executeth (Psal. 9. 16.) He thereby is known to be a mighty, a just, a wise God, a God that hateth iniquity. Read Dan. 9.7. and Neh. 9.32, 33. Now judgements being terrible to such as feel, and to such as see them, or hear of them, they must needs be a forcible motive to restrain men from profaning the Sabbath. Instances of fearful judgements executed for this sin are in Numb. 15.32. and 2 Chron. 36.21. Neh. 13.18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 40-1.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e7bfcd23f" data-kw="">
<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>

<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>

<blockquote><p>§8. Question 3. Is a man obliged by a contract which he made in ignorance or mistake of the matter? Answer: I have answered this before in the case of marriage, pt. 2, ch.

1. I add here, we must distinguish:

1. Between culpable and inculpable error;

2. Between an error about the principal matter and about some smaller accidents or circumstances;

3. Between a case where the law of the Land, or the common good interposes and where it does not.

1. If it be your own fault that you are mistaken, you are not wholly freed from the obligation: But if it was your gross fault, by negligence or vice, you are not at all freed. But if it were but such a frailty as almost all men are liable to, so that none but a person of extraordinary virtue or diligence could have avoided the mistake, then equity will proportionably make you an abatement or free you from the obligation. So far as you were obliged to understand the matter, so far you are obliged by the contract; especially when another is a loser by your error.

2. An inculpable error about the circumstances or smaller parts will not free you from an obligation in the principal matter: But an inculpable error in the essentials will.

3. Except when the law of the land or the common good, does otherwise overrule the case: For then you may be obliged by that accident. In diverse cases the rulers may judge it necessary, that the effect of the contract shall depend upon the bare words or writings, or actions; lest false pretenses of misunderstanding should exempt deceitful persons from their obligations and nothing should be a security to contractors. And then men’s private commodity must give place to the law and to the public good.

4. Natural infirmities must be numbered with faults, though they be not moral vices, as to the contracting of an obligation, if they be in a person capable of contracting. As if you have some special defect of memory, or ignorance of the matter which you are about! Another who is no way faulty by over-reaching you, must not be a loser by your weakness. For he that comes to the market, or contracts with another who knows not his infirmity, is to be supposed to understand what he does, unless the contrary be manifest: You should not meddle with matters which you understand not: Or if you do, you must be content to be a loser by your weakness.

5. Yet in such cases, another that has gained by the bargain, may be obliged by the laws of equity and charity, to remit the gain, and not to take advantage of your weakness: But he may so far hold you to it, as to secure himself from loss: except in cases where you become the object of his charity, and not of commutative justice only.</p></blockquote>

<blockquote><p>XIX…

I. The moral precepts are known by nature, and therefore eternal, and obligate all men: The rest are not so.

II. The moral precepts are the principal worship of God; the ceremonial and forensic are subordinate, but serve the moral precepts, and therefore yield to them.

III. The moral precepts obligate all rational creatures; the others obligate the Jews only.

IV. The ceremonial and forensic are typical; the moral are antitypical.

V. The moral are general; the ceremonial and forensic are special and determinate.</p></blockquote>

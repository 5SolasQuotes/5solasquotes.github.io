<main class="wrap"><figure class="quote" id="q-768377af7b" data-kw="">
<blockquote><p>XI. (7) Because the fathers acknowledged the necessity of infant baptism and approved its propriety by their practice. Justin Martyr mentions it (“Quaestiones et Responsiones ad Orthodoxos,” Q. 56 in Opera quae feruntur omnia [ed. J.C.T. de Otto, 1881], v. 3, Pt. 2, p. 81); cf. Origen (Commentariorum in Epistolam … ad Romanos 5.8 [PG 14.1037–42]), Cyprian (Letter 58, “To Fidus” [ANF 5:353–54]), Jerome (Against the Pelagians 3.18 [NPNF2, 6:482]), Cyril of Alexandria (Glaphyrorum in Leviticum [PG 69.558–62]). Augustine, often, where he relates that the Pelagians had not dared to deny the baptism of infants because they saw too clearly that this would place them in opposition to the whole church (The Literal Meaning of Genesis 10.23 [ACW 42:127]; On Original Sin 2.44 [40] [NPNF1, 5:253–54]; On Forgiveness of Sins and Baptism 1.35 [25*] [NPNF1, 5:30]). The same thing was confirmed also by many decrees of Synods: of Carthage, in the year 418* (Hefele, 2:458); of Mileve, in the year 402* (cf. Canon 5, Hefele, 2:429); of Gerunda in the year 517* (cf. Canon 5, Hefele, 4:105) and of others which Pamelius in his notes to Cyprian notices (“Epistola LXIV,” Opera [1682], pp. 158–60).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 19.20.11 (p. 418).</span></figcaption>

<blockquote><p>V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).</p></blockquote>

</figure><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-85a0b5f475" data-kw="">
<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 435 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLXIV.+On+the+other+hand%2C+if+someone+asks+about+adults+who+foster+and+profess+faith+but+are+not+yet+baptized%2C+who+are+called+catechumens%2C+and+also+about+those+who+have+been+excommunicated+from+the+Church+but+still+retain+faith+and+charity+in+their+hearts%2C+whether+they+are+part+of+the+Church+and+should+be+considered+true+members+of+it%2C+the+Romanist+doctors+simply+deny+it%2C+while+our+%5BReformed%5D+theologians+affirm+it.+However%2C+there+seems+to+be+agreement+in+reality%3B+for+such+individuals%2C+according+to+the+Romanists%2C+pertain%2C+as+they+say%2C+to+the+soul+of+the+Church+and+the+mystical+body+of+Christ+to+be+granted+salvation+by+Him.+Our+theologians+concede+that+such+individuals+are+not%2C+at+least+absolutely+and+perfectly%2C+part+of+the+visible+Church%2C+that+is%2C+they+do+not+pertain+to+the+external+society+of+the+Church%2C+nor+are+they+aggregated+to+any+particular+Church%2C+which+does+not+prejudice+their+salvation+according+to+both+sides.+See+Whitaker%2C+On+the+Church+against+Bellarmine.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+Nature+%26+Definition+of+the+Church%2C+p.+435+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F85a0b5f475.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/85a0b5f475.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/the-baptism-of-the-children-of-adherents/#:~:text=LXIV.%20On%20the%20other%20hand%2C%20if,Whitaker%2C%20On%20the%20Church%20against%20Bella

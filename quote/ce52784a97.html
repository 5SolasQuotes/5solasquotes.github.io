<blockquote><p>That Christians are ‘all one in Christ Jesus’ [Gal. 3:28], is a principle never surrendered…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a2af103e9" data-kw="">
<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>(1.) It is clear that the specific and essential form of a fundamental article is not taken from the authority of God speaking in the Word (seeing God’s authority is one and the same in all that He speaks), but from the influence that the knowledge of an article has to unite us to God in Christ, and bring us to salvation. (2.) And secondly, it will follow that this, Thou shalt not by the use of things indifferent kill him for whom Christ died, and the like is no less fundamental, by evident consequence, in respect it is spoken by God’s own authority, than articles of our faith. (3.) It follows that formalists ignorantly divide matters of God’s worship, into matters of faith, or points fundamental, and things indifferent, as if many scriptural truths were not to be found in God’s Word, such as the miracles of Moses, and Elias, the journeys of Paul, which are neither matters fundamental, nor yet things indifferent. (4.) Many things may be fundamental, by consequence, to one who can read the Word, and hear it read, which is not by consequence fundamental to a rude and ignorant man.</p></blockquote>

<blockquote><p>(5) Beware of having the persons of men in admiration, either for gifts or grace, or because of advantage, Judg. 5:16. This was it which occasioned the schisms in the Church of Corinth, admiring their teachers, they were puffed up for one against another, and one said, ‘I am of Paul, another, I of Apollo, others, I of Cephas, etc.’ even according as their humor and liking led them? take heed of being taken in the same snare. All flesh is grass, none infallible, and therefore none to be doted upon. Ne judicemus ex personis fidem, sed ex fide personas, said Tertullian. Let not your eyes be so dazzled with whatever eminency of parts or graces ye apprehend to be in any, as to set up their bare word for your oracle, or their example for your rule. This was it which drew many of the Jews (and Barnabas among the rest) into a sinful separation (Gal. 2:12-13) because they saw Peter a leading man, a prime and eminent apostle, going that way before them. And yet that pillar of the Church did therein halt, and walked not with a straight foot, and was to be blamed; and consequently to be not imitated, but shunned. It is dangerous to shape our course by another’s compass; as many a ship has been lost and run on banks by following their admiral’s lanthorn. Give eminent and godly men their due respect, but put them not in God’s room. It is divine rule, not human example we are to walk by. Follow no man further than he follows Christ, 1 Cor. 11:1… … (8) Enslave not yourselves to any person or party, so as to be over-desirous to please them or over-fearful of their censures. Is it not servile man-pleasing and cowardice to do so? and leads many to sinful compliance with dividing courses? When therefore any fervent self-conceited person or people would carry all down by their censoriousness and passions, it is high time for pastors and the aged, graver and maturer sort of Christians openly to rebuke them, to appear against them and stand their ground (as Paul did, Gal. 2:11) and not to comply with the misguided sort (though well-meaning) and their preposterous zeal, that by connivance or compliance ye may escape their censures and reproaches. He that thus saves his name, shall lose it, and perhaps on a worse account. Be not therefore cowed to silence or amen to their way, for fear of the scourge of tongues. Be valiant for the truth and against such ills, else fainting will feed their humor and invite them to be more insolent. Put on authority and Gospel-austerity to check their petulancy and untowardliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 180-82</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e2adefc78e" data-kw="">
<blockquote><p>That there is a divine influence of the Spirit granted to all men, is plain both from Scripture and from experience… To the general influence of the Spirit (or to common grace) we owe: 1. All the decorum, order, refinement, and virtue existing among men… 2. To the same divine agent is due specially that general fear of God, and the religious feeling which prevail among men…, 3. The Scriptures refer to this general influence of the Spirit those religious experiences, varied in character and degree, which so often occur where genuine conversion, or regeneration does not attend or follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (Eerdmans, 1997), vol. 2</cite>, pp. 654-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7c2afaf46" data-kw="">
<blockquote><p>He manifests the more grace and goodwill to our salvation, and that He is more ready to pardon than to punish, in that He waits so long on the sinner’s choice: Rom. 9:22, ‘What if God, willing to show his wrath, and to make his power known, endured with much long‑suffering the vessels of wrath filled to destruction?’ He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace; and if He should do that, the world would never be put upon choice and trial, and obedience would be a matter of necessity and constraint, not of willing acceptation; and men may as well quarrel at this as that He has not made them all angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 21, pp. 463-79, Two sermons on Eze. 18:23. HT: David Ponter. | Sermon 1:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-bd854850b1" data-kw="">
<blockquote><p>Upon the stage of this world, mercy acts in part and shows itself in more objects, and in more instances, than the judgment of God does; that must have its course and triumph in the next world; here all sinners share, more or less, in the mercy of God. “The Lord is good to all” (Ps. 145:9) “He makes his rain to fall, and his sun to shine upon the just and the unjust.” (Matt 5:45).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted by David Silversides, The Free Offer of the Gospel, p. 106, The Sermons of Matthew Mead (d. 1699; Soli Deo Gloria, 1991)</cite>, p. 338 ff.</span></figcaption>

</figure><figure class="quote" id="q-42a4d4d71e" data-kw="">
<blockquote><p>We distinguish and teach that in this sense they [reprobates] are made to be reconciliable by the death of Christ, by which Prosper says (Response to the Little Head of the Gauls, ch. 9): “Christ is the Savior of the whole world on account of his true undertaking of human nature and communion in the ruin of the first man.” Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: … 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism, pp. 421-422 c. 1638-1643 trans. T. Fentiman</cite></span></figcaption>

</figure><figure class="quote" id="q-ab17de5d36" data-kw="">
<blockquote><p>We are hence taught to acknowledge no love to be in God, which is not effectual in doing good to the creature; there is no lip-love, no raw well-wishing to the creature which God does not make good: we know but three sorts of love, that God has to the creature, all the three are like the fruitful womb; there is no miscarrying, no barrenness in the womb of divine love; 1. He loves all that He has made; so far as to give them a being, to conserve them in being so long as he pleases: He had a desire to have Sun, Moon, Stars, Earth, Heaven, Sea, Cloud, Air; He created them out of the womb of love, and out of goodness, and keeps them in being… 2. There is a second love and mercy, in God, by which he loves all Men and Angels; yea, even his enemies, makes the Sun to shine on the unjust man, as well as the just, and causes dew and rain to fall on the orchard and fields of the bloody and deceitful man, whom the Lord abhors; as Christ teaches us, (Matt. 5:43-48). Nor does God miscarry in this love, He desires the eternal being of damned angels and men; He sends the Gospel to many reprobates, and invites them to repentance and with longanimity and forbearance suffers pieces of froward dust to fill the measure of their iniquity, yet does not the Lord’s general love fall short of what He willeth to them. 3. There is a love of special election to glory; far less can God come short in the end of this love…</p></blockquote>

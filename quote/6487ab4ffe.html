<main class="wrap"><figure class="quote" id="q-6487ab4ffe" data-kw="">
<blockquote><p>When it comes to the punishments of little ones, believe me, I am tormented by great anxieties, nor do I find at all what to respond… Although I desire it, I ask it, I wish for it with ardent vows and expect that the Lord may take away my ignorance of this matter through you, yet if I am minimally deserving, I will ask for patience for myself from the Lord our God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sin &amp; its Distinctions’ (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 16-18 Holtzfus was a German reformed theologian, and a hypothetical universalist respecting the atonement. | Although, however, Augustine happily destroyed the alien opinion, he with difficulty found what he himself might construct. For so he says in Epistle 28 to Jerome:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/death-and-the-intermediate-state/purgatory-and-limbo.html">Purgatory and Limbo</a></span></div>

<main class="wrap"><figure class="quote" id="q-798c9ac4e0" data-kw="">
<blockquote><p>As for the last of them, which answers first in this 13th verse, he says that it is not sufficient for justification before God to have received the law, and simply to be hearers of it; but that must be observed and reduced to practice. This is incontestable truth. For the law has not been given as a matter of curiosity or contemplation as a philosophical science, but to be obeyed; and the greatest outrage against the law and the Legislator, is to hear it and not to take heed practice it. It will be in vain, therefore, for the Jew to say, I am a hearer of the law, I attend on its services, I belong to the covenant of God, who has given me his testimonies. On all these accounts, being a transgressor, as he is, he must be condemned. The presence of the article before the word law in both the clauses of this verse, which is wanting in the preceding verse, shows that the reference is to the Jews under the written law. The doers of the law shall be justified—By this we must understand an exact obedience to the law to be intended, which can defend itself against that declaration, ‘Cursed is every one that continueth not in all things which are written in the book of the law to do them.’ For it is not the same with the judgement of the law as with that of grace. The Gospel indeed requires of us a perfect obedience to its commands, yet it not only provides for believers’ pardon of the sins committed before their calling, but of those also which they afterwards commit. But the judgment of the law admits of no indulgence to those who are under it; it demands a full land perfect personal observance of all its requirements—a patient continuance in well-doing, without the least deviation, or the smallest spect of sin; and when it does not find this state of perfection, condemns the man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-haldane.html">Robert Haldane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Epistle to the Romans. A Geneva Series Commentary</cite>, (Edinburgh: The Banner of Truth, repr. 1996), 89 (On Romans 2:13).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6fc3268f2" data-kw="">
<blockquote><p>I. As in the chain of salvation justification follows calling (Rom. 8:30) and is everywhere set forth as the primary effect of faith, the topic concerning calling and faith begets the topic concerning justification. This must be handled with the greater care and accuracy as this saving doctrine is of the greatest importance in religion. It is called by Luther “the article of a standing and a falling church” (Articulus stantis, et cadentis Ecclesiae).1 By other Christians, it is termed the characteristic and basis of Christianity—not without reason—the principal rampart of the Christian religion. This being adulterated or subverted, it is impossible to retain purity of doctrine in other places. Hence Satan in every way has endeavored to corrupt this doctrine in all ages, as has been done especially in the papacy. For this reason, it is deservedly placed among the primary causes of our secession from the Roman church and of the Reformation. 1 Luther said things like this but in this form, the saying has been traced to the Reformed theologian J. H. Alsted (1618).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 16.1.1 (p. 633).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-4ecba57287" data-kw="">
<blockquote><p>What are the different opinions as to the relation between faith and love? 1st. The Romanists, in order to maintain their doctrine that faith alone is not saving, distinguish between a formed, or perfect, and an unformed faith. They acknowledge that faith is distinct from love, but maintain that love is essential to render faith meritorious and effectual as the instrument of our salvation. 2d. Some have regarded love as the root out of which faith springs. 3d. The true view is that love is the immediate and necessary effect of faith. Faith includes the spiritual apprehension of the beauty and excellence of the truth, and an act of the will embracing it and relying upon it. Yet these graces can not be analytically separated, since they mutually involve one another. There can be no love without faith, nor any faith without love. Faith apprehends the loveliness of the object, the heart spontaneously loves it. Thus “faith works by love,” since these affections are the source of those motives that control the will. The Romish doctrine is inconsistent with the essential principles of the gospel. Faith is not a work, nor can it have, when formed or unformed, any merit, it is essentially a self-emptying act, which saves by laying hold of the merits of Christ. It leads to works, and proves itself by its fruits, but in its relation to justification it is in its very nature a strong protest against the merits of all human works, Gal. 3:10, 11; Eph. 2:8, 9. The Protestant doctrine that love is the fruit of faith is established by what the Scriptures declare concerning faith, that it “sanctifies,” “works by love,” “overcomes the world,” Gal. 5:6; Acts 26:18; 1 John 5:4. This is accomplished thus—by faith we are united to Christ, Eph. 3:17, and so become partakers of his Spirit, 1 John 3:24, one of the fruits of the Spirit is love, Gal. 5:22, and love is the principle of all obedience, Rom. 13:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (New York: Robert Carter &amp; Brothers, 1863), 362–63 (emphasis added)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

+This+is+accomplished+thus%E2%80%94by+faith+we+are+united+to+Christ%2C+Eph.+3%3A17%2C+and+so+become+partakers+of+his+Spirit%2C+1+John+3%3A24%2C+one+of+the+fruits+of+the+Spirit+is+love%2C+Gal.+5%3A22%2C+and+love+is+the+principle+of+all+obedience%2C+Rom.+13%3A10.%E2%80%9D%0A%0A%E2%80%94+A.+A.+Hodge%2C+Outlines+of+Theology+%28New+York%3A+Robert+Carter+%26+Brothers%2C+1863%29%2C+362%E2%80%9363+%28emphasis+added%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ecba57287.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ecba57287.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/05/a-a-hodge-contra-rome-the-protestants-say-that-love-is-the-fruit-of-faith/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

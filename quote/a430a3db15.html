<blockquote><p>There are three main ends of Psalms: … 3. That all men might learn by heart the principles of religion, the Psalms (as Rivet saith) being a compendium of Scripture, affording all points necessary for doctrine and duty. Col. 3:16, ‘Let the word of Christ dwell in you richly in all wisdom; teaching, and admonishing one another in Psalms, and Hymns, and Spiritual Songs,’ etc. From which words follow also these Conclusions: 1. That Scripture psalms (even David’s Psalms, called in Hebrew by the name of Psalms, and Hymns, and Spiritual Songs) and no other, should be used in the Church; for no other are the word of Christ, and consequently cannot have that certainty, purity, authority and sufficiency that the Scripture psalms have.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-barton.html">William Barton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of Many Errors and some gross absurdities in the old translation of the Psalms in English metre; as also in some other translations lately published: showing how the Psalms ought to be translated, to be acceptable and edifying</cite>, A View of Many Errors and some gross absurdities in the old translation of the Psalms in English metre; as also in some other translations lately published: showing how the Psalms ought to be translated, to be acceptable and edifying… (London: Printed by W.D., 1656), ‘To the Courteous Reader’, no page number</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-43d87fcc7d" data-kw="">
<blockquote><p>I should be too tedious if I should stand to reckon up the manifold mercies that God hath bestowed on this our land, beyond all the world besides, our peace, and plenty, with the Gospel of Christ, our many, and great deliverances… God hath delivered us from the Spanish invasion, and the Gun-powder treason, and hath placed us in a wealthy land. ‘Be ye therefore filled with the Spirit’ (saith our prophet David) ‘speaking to yourselves in Psalms, and Hymns, and spiritual songs’: and here I might speak of the godly care of our Church, which hath ordained singing of Psalms, both before, and after sermon, and indeed are very fitting to be sung in order, for the better stirring up of our affections. And here I have a just cause to task them of the Separation, who will not admit of any set form of prayer, for that (as they say) is cursing of the Spirit; but why then should we have a set form of singing? For my part it shall ever have my allowance and I think that these their ex tempore prayers sounds as harshly in the ears of heaven, as diverse Psalms sung together in several tunes would in ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cheshire.html">Thomas Cheshire</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached in Saint Paul’s Church the Tenth of October</cite>, 1641… wherein are many memorable passages most worthy of serious observations in these times (London, 1641), pp. 10-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>It is universally conceded that the singing of the Psalms was an essential part of the Christian liturgy from the very beginning… … The introduction of uninspired hymns into the worship of the Church was a gradual process, and it was not until the fourth century that the practice became widespread… The paucity of extant hymns from the early centuries of the Church is rather striking and can only be explained as a result of the firm adherence of the Church as a whole to the inspired Psalms. Says [Phillip] Schaff [a standard Church historian]: ‘We have no complete religious song remaining from the period of persecution (i.e. from the first three centuries) except the song of Clement of Alexandria to the divine Logos–which, however, cannot be called a hymn and was probably never intended for public use; the ‘Morning Song’ and the ‘Evening Song’ in the Apostolic Constitutions [A.D. 380, which songs were for daily use, but were not in the public worship of the Church on the Lord’s Day], especially the former; and the so-called Gloria in Excelsis, which as an expression of the hymn of the heavenly hosts [the first versions of it only included Lk. 2:14, an inspired Bible song], still rings in all parts of the Christian world. Next in order comes Te Deum, in its original eastern form [having originated circa A.D. 387]. The Ter Sanctus [from Isa. 6:3, its later expanded form having originated circa 434-446] and several ancient liturgical prayers may also be regarded as poems. Excepting these hymns [most of which were responsive prayers based on inspired Bible songs and were of late origin] in rhythmic prose, the Greek church of the first six centuries produced nothing in this field which has had any permanent value or general use. It long adhered almost exclusively to the Psalms of David, who, as Chrysostom, says, was first, middle, and last in the assemblies of the Christians: and it had, in opposition to heretical predilections, even a decided aversion to the public use of uninspired songs.’¹ ¹ ‘The Greek and Latin Hymnology,’ British and Foreign Evangelical Review, no. 58, Oct., 1866, p. 680-1 …Extant accounts, for example, of searches made for the books of the Christians during times of persecution, make no mention of hymnals, whereas the canonical Scriptures, and especially copies of the Psalter, are frequently mentioned. Jerome mentions that he learned the psalms as a child and continued to sing them in his old age. … The evidence usually brought forward to establish the use of uninspired hymns in the worship of the early church is rather meager. The four earliest non-canonical witnesses to Christian worship practice are: [1.] 1 Clement (ca. A.D. 96); [2.] The Didache (ca. A.D. 80-100?); [3.] Ignatius’ Epistles, written en route to his martyrdom (ca. A.D. 108); and [4.] Pliny’s letter to Trajan (ca. A.D. 110) quoted by Eusebius. In chronological order the next liturgical text is that contained in Justin’s Apology (ca. A.D. 150-153). Of these Pliny’s letter is the only witness that bears in a direct way upon the question of the content of the hymns sung by early Christians and its interpretation is much debated. Ignatius in Ephesians IV describes the Christian worship service using a rather elaborate musical metaphor and supposed ‘hymnic’ passages have been ‘isolated’ in both the Didache and in the letters of Ignatius, but there is nothing in these sources that can with confidence be pointed to as a record of early Christian hymnody. Pliny’s letter thus becomes the only early witness of a positive nature to the hymnody of the early church… …he [Pliny, A.D. 111-112] says that the Christians were in the habit of meeting ‘before dawn on a stated day and singing alternately a hymn to Christ as to God.’ The meaning of the key term carmen (‘hymn’) in this clause has been much debated. On the basis of parallels with the Jewish Sabbath service, C.J. Kraemer and E.C. Ratcliff take it to refer to an Old Testament Psalm. J.B. Lightfoot remarks that the term carmen can be used of ‘any set form of words’ and does not have to presuppose a metrical composition at all. Along the same lines J. Stevenson renders the phrase in question as, ‘recite by turns a form of words.’ In support of this interpretation it is pointed out that the primary meaning of the verb used in the clause (dicere) is ‘to say’ or ‘to declare,’ not ‘to sing.’… The fact of the matter is that none of the current interpretations of Pliny’s letter requires that we see in it a reference to the singing of uninspired compositions, and there is nothing in the passage to preclude its being seen as a reference to the inspired Psalms… … The historical evidence that has come down to us [only some of which has been quoted above] thus presents a picture of widespread commitment to canonical psalmody, a commitment which only gradually deteriorated under the influence of heretical compositions… Attempts to marshal evidence from the post-Apostolic period to buttress attempts to show that uninspired hymns were common in the Apostolic church, are, and always will be, futile.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bushell.html">Michael Bushell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Songs of Zion: A Contemporary Case for Exclusive Psalmody</cite>, pp. 154-67.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is universally conceded that the singing of the Psalms was an essential part of the Christian liturgy from the very beginning… … The introduction of uninspired hymns into the worship of the Church was a gradual process, and it was not until the fourth century that the practice became widespread… The paucity of extant hymns from the early centuries of the Church is rather striking and can only be explained as a result of the firm adherence of the Church as a whole to the inspired Psalms. Says [Phillip] Schaff [a standard Church historian]: ‘We have no complete religious song remaining from the period of persecution (i.e. from the first three centuries) except the song of Clement of Alexandria to the divine Logos–which, however, cannot be called a hymn and was probably never intended for public use; the ‘Morning Song’ and the ‘Evening Song’ in the Apostolic Constitutions [A.D. 380, which songs were for daily use, but were not in the public worship of the Church on the Lord’s Day], especially the former; and the so-called Gloria in Excelsis, which as an expression of the hymn of the heavenly hosts [the first versions of it only included Lk. 2:14, an inspired Bible song], still rings in all parts of the Christian world. Next in order comes Te Deum, in its original eastern form [having originated circa A.D. 387]. The Ter Sanctus [from Isa. 6:3, its later expanded form having originated circa 434-446] and several ancient liturgical prayers may also be regarded as poems. Excepting these hymns [most of which were responsive prayers based on inspired Bible songs and were of late origin] in rhythmic prose, the Greek church of the first six centuries produced nothing in this field which has had any permanent value or general use. It long adhered almost exclusively to the Psalms of David, who, as Chrysostom, says, was first, middle, and last in the assemblies of the Christians: and it had, in opposition to heretical predi  refer to an Old Testament Psalm. J.B. Lightfoot remarks that the term carmen can be used of ‘any set form of words’ and does not have to presuppose a metrical composition at all. Along the same lines J. Stevenson renders the phrase in question as, ‘recite by turns a form of words.’ In support of this interpretation it is pointed out that the primary meaning of the verb used in the clause (dicere) is ‘to say’ or ‘to declare,’ not ‘to sing.’… The fact of the matter is that none of the current interpretations of Pliny’s letter requires that we see in it a reference to the singing of uninspired compositions, and there is nothing in the passage to preclude its being seen as a reference to the inspired Psalms… … The historical evidence that has come down to us [only some of which has been quoted above] thus presents a picture of widespread commitment to canonical psalmody, a commitment which only gradually deteriorated under the influence of heretical compositions… Attempts to marshal evidence from the post-Apostolic period to buttress attempts to show that uninspired hymns were common in the Apostolic church, are, and always will be, futile.”

— Michael Bushell, Songs of Zion: A Contemporary Case for Exclusive Psalmody, pp. 154-67.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+universally+conceded+that+the+singing+of+the+Psalms+was+an+essential+part+of+the+Christian+liturgy+from+the+very+beginning%E2%80%A6+%E2%80%A6+The+introduction+of+uninspired+hymns+into+the+worship+of+the+Church+was+a+gradual+process%2C+and+it+was+not+until+the+fourth+century+that+the+practice+became+widespread%E2%80%A6+The+paucity+of+extant+hymns+from+the+early+centuries+of+the+Church+is+rather+striking+and+can+only+be+explained+as+a+result+of+the+firm+adherence+of+the+Church+as+a+whole+to+the+inspired+Psalms.+Says+%5BPhillip%5D+Schaff+%5Ba+standard+Church+historian%5D%3A+%E2%80%98We+have+no+complete+religious+song+remaining+from+the+period+of+persecution+%28i.e.+from+the+first+three+centuries%29+except+the+song+of+Clement+of+Alexandria+to+the+divine+Logos%E2%80%93which%2C+however%2C+cannot+be+called+a+hymn+and+was+probably+never+intended+for+public+use%3B+the+%E2%80%98Morning+Song%E2%80%99+and+the+%E2%80%98Evening+Song%E2%80%99+in+the+Apostolic+Constitutions+%5BA.D.+380%2C+which+songs+were+for+daily+use%2C+but+were+not+in+the+public+worship+of+the+Church+on+the+Lord%E2%80%99s+Day%5D%2C+especially+the+former%3B+and+the+so-called+Gloria+in+Excelsis%2C+which+as+an+expression+of+the+hymn+of+the+heavenly+hosts+%5Bthe+first+versions+of+it+only+included+Lk.+2%3A14%2C+an+inspired+Bible+song%5D%2C+still+rings+in+all+parts+of+the+Christian+world.+Next+in+order+comes+Te+Deum%2C+in+its+original+eastern+form+%5Bhaving+originated+circa+A.D.+387%5D.+The+Ter+Sanctus+%5Bfrom+Isa.+6%3A3%2C+its+later+expanded+form+having+originated+circa+434-446%5D+and+several+ancient+liturgical+prayers+may+also+be+regarded+as+poems.+Excepting+these+hymns+%5Bmost+of+which+were+responsive+prayers+based+on+inspired+Bible+songs+and+were+of+late+origin%5D+in+rhythmic+prose%2C+the+Greek+church+of+the+first+six+centuries+produced+nothing+in+this+field+which+has+had+any+permanent+value+or+general+use.+It+long+adhered+almost+exclusively+to+the+Psalms+of+David%2C+who%2C+as+Chrysostom%2C+says%2C+was+first%2C+middle%2C+and+last+in+the+assemblies+of+the+Christians%3A+and+it+had%2C+in+opposition+to+heretical+predilections%2C+even+a+decided+aversion+to+the+public+use+of+uninspired+songs.%E2%80%99%C2%B9+%C2%B9+%E2%80%98The+Greek+and+Latin+Hymnology%2C%E2%80%99+British+and+Foreign+Evangelical+Review%2C+no.+58%2C+Oct.%2C+1866%2C+p.+680-1+%E2%80%A6Extant+accounts%2C+for+example%2C+of+searches+made+for+the+books+of+the+Christians+during+times+of+persecution%2C+make+no+mention+of+hymnals%2C+whereas+the+canonical+Scriptures%2C+and+especially+copies+of+the+Psalter%2C+are+frequently+mentioned.+Jerome+mentions+that+he+learned+the+psalms+as+a+child+and+continued+to+sing+them+in+his+old+age.+%E2%80%A6+The+evidence+usually+brought+forward+to+establish+the+use+of+uninspired+hymns+in+the+worship+of+the+early+church+is+rather+meager.+The+four+earliest+non-canonical+witnesses+to+Christian+worship+practice+are%3A+%5B1.%5D+1+Clement+%28ca.+A.D.+96%29%3B+%5B2.%5D+The+Didache+%28ca.+A.D.+80-100%3F%29%3B+%5B3.%5D+Ignatius%E2%80%99+Epistles%2C+written+en+route+to+his+martyrdom+%28ca.+A.D.+108%29%3B+and+%5B4.%5D+Pliny%E2%80%99s+letter+to+Trajan+%28ca.+A.D.+110%29+quoted+by+Eusebius.+In+chronological+order+the+next+liturgical+text+is+that+contained+in+Justin%E2%80%99s+Apology+%28ca.+A.D.+150-153%29.+Of+these+Pliny%E2%80%99s+letter+is+the+only+witness+that+bears+in+a+direct+way+upon+the+question+of+the+content+of+the+hymns+sung+by+early+Christians+and+its+interpretation+is+much+debated.+Ignatius+in+Ephesians+IV+describes+the+Christian+worship+service+using+a+rather+elaborate+musical+metaphor+and+supposed+%E2%80%98hymnic%E2%80%99+passages+have+been+%E2%80%98isolated%E2%80%99+in+both+the+Didache+and+in+the+letters+of+Ignatius%2C+but+there+is+nothing+in+these+sources+that+can+with+confidence+be+pointed+to+as+a+record+of+early+Christian+hymnody.+Pliny%E2%80%99s+letter+thus+becomes+the+only+early+witness+of+a+positive+nature+to+the+hymnody+of+the+early+church%E2%80%A6+%E2%80%A6he+%5BPliny%2C+A.D.+111-112%5D+says+that+the+Christians+were+in+the+habit+of+meeting+%E2%80%98before+dawn+on+a+stated+day+and+singing+alternately+a+hymn+to+Christ+as+to+God.%E2%80%99+The+meaning+of+the+key+term+carmen+%28%E2%80%98hymn%E2%80%99%29+in+this+clause+has+been+much+debated.+On+the+basis+of+parallels+with+the+Jewish+Sabbath+service%2C+C.J.+Kraemer+and+E.C.+Ratcliff+take+it+to+refer+to+an+Old+Testament+Psalm.+J.B.+Lightfoot+remarks+that+the+term+carmen+can+be+used+of+%E2%80%98any+set+form+of+words%E2%80%99+and+does+not+have+to+presuppose+a+metrical+composition+at+all.+Along+the+same+lines+J.+Stevenson+renders+the+phrase+in+question+as%2C+%E2%80%98recite+by+turns+a+form+of+words.%E2%80%99+In+support+of+this+interpretation+it+is+pointed+out+that+the+primary+meaning+of+the+verb+used+in+the+clause+%28dicere%29+is+%E2%80%98to+say%E2%80%99+or+%E2%80%98to+declare%2C%E2%80%99+not+%E2%80%98to+sing.%E2%80%99%E2%80%A6+The+fact+of+the+matter+is+that+none+of+the+current+interpretations+of+Pliny%E2%80%99s+letter+requires+that+we+see+in+it+a+reference+to+the+singing+of+uninspired+compositions%2C+and+there+is+nothing+in+the+passage+to+preclude+its+being+seen+as+a+reference+to+the+inspired+Psalms%E2%80%A6+%E2%80%A6+The+historical+evidence+that+has+come+down+to+us+%5Bonly+some+of+which+has+been+quoted+above%5D+thus+presents+a+picture+of+widespread+commitment+to+canonical+psalmody%2C+a+commitment+which+only+gradually+deteriorated+under+the+influence+of+heretical+compositions%E2%80%A6+Attempts+to+marshal+evidence+from+the+post-Apostolic+period+to+buttress+attempts+to+show+that+uninspired+hymns+were+common+in+the+Apostolic+church%2C+are%2C+and+always+will+be%2C+futile.%E2%80%9D%0A%0A%E2%80%94+Michael+Bushell%2C+Songs+of+Zion%3A+A+Contemporary+Case+for+Exclusive+Psalmody%2C+pp.+154-67.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%

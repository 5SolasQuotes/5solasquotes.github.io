<main class="wrap"><figure class="quote" id="q-b4eca58b25" data-kw="">
<blockquote><p>The undertaking of the Son of God to satisfy was effectuall before his actuall satisfying: As a man that makes a purchase may take possession and enjoy the thing purchased upon the mere bargain made, or earnest paid, before he have fully paid the sum. To this purpose most understand that in Rev. 13:8, ‘whose names were not written in the book of life, of the Lamb slain from the foundation of the world:’ But I doubt not but [John] Weemse’s interpretation is the plain truth; that the words ‘from the foundation of the world’ have reference to the writing of their names in the book of Life, and not to the slaying of the Lamb, as being thus to be read: ‘whose names were not written in the book of life of the slain Lamb, from the foundation of the world.’ It has the same sense with Rev. 17:8, which does expound this in leaving out the mention of the slaying of the Lamb.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 7, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-old-testament-economy/christ-in-the-old-testament.html">Christ in the Old Testament</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-270126ac19" data-kw="">
<blockquote><p>Whatever is required to a complete formal covenant between two distinct persons is to be affirmed concerning what has passed between God and Christ with respect unto the redemption of those that were from eternity given to Him; Articles of agreement (to speak after our nature) have been concluded, accepted and exactly kept unto by them both. On this account the Lord Christ is said to be a surety. He is not only fidejussor [a co-signer] but expromissor [an entire legal substitute]. He has so undertaken to answer for his elect, as that they were many of them set at liberty before the price of their redemption was actually paid, and that by virtue of this Covenant, wherein the Father did take the word of his Son Jesus Christ that the thing should in due time be performed. As to the efficacy of his death, He was slain from the foundation of the world. Believers that died in the beginning of time went to Heaven because the Son of God had promised to lay down his life to satisfy divine justice in their behalf.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Covenant of Redemption</cite>, … (Boston, 1693)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-old-testament-economy/christ-in-the-old-testament.html">Christ in the Old Testament</a></span></div>

</figure><figure class="quote" id="q-c056725f37" data-kw="">
<blockquote><p>Arminian:… For if this hold true, then the foresight of Christ’s incarnation and sufferings, etc. was no moral true cause of God’s will to pardon sin and save souls to those under the promise before the incarnation. Baxter:… Would you bring it to deny so evident a principle as this, that nothing can do nothing, nor cause nothing. It was not Christ’s body or actual suffering, not yet existent, that caused God’s will to pardon sinners. Nor had God’s will any proper cause: But seeing God willed one thing to be the means of another, He willed that Christ’s incarnation and death should in the fulness of time demonstrate his justice, and make it agreeable to the ends of his government to dispense with the Law of Innocency, and to pardon sin: And therefore (not Christ’s death itself, but) God’s decree of the death of Christ incarnate was the cause of the promise, and of the New Covenant made with Adam, and of the salvation of believers then. Which will or decree is called by some the interpellation or undertaking of the eternal Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, pp. 7-8</span></figcaption>

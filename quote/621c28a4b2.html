<blockquote><p>He therefore does injury to the scripture of the Old Testament with heretical impiety, who with an impious and sacrilegious face denies that it was inspired by the good, supreme, and very good God, – as Marcion does, as Manichæus does, and other pests of similar opinions.</p></blockquote>

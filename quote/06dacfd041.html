<blockquote><p>And so in all the commandments of God, we must understand the will of God to be either (Zanchi, Of the Nature of God, ch. 3):

1. Declarans [declaring]

2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints</cite>, … (London: Butter, 1622), pt. 1, pp. 15-16 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</span></figcaption>

<blockquote><p>XXI. God will have all men to be saved and He will have wicked men to be damned: that, is his antecedent will; this, his consequent: that, is sometimes frustrated of its end, this never; and its fitting that seeing his will cannot be fulfilled by us, it should be fulfilled upon us. They that will not satisfy his will by their obedience, shall satisfy his will in suffering just vengeance.</p></blockquote>

</figure><figure class="quote" id="q-db599deda4" data-kw="">
<blockquote><p>Question 1: Whether law [jus], and the decree of law, or the command [jussio] of God, is God Himself? Affirmed with a distinction. Answer: Concerning the decree, as it is regarded on the part of God, or actively: affirmed; as it is regarded on the part of the decreed thing, or passively or terminatively: denied. Concerning law [jus], which in Greek [is] δικαίωμα [ordinance / righteous requirement], Rom. 1:32, insofar as it is equivalent to the power of God: affirmed. Not otherwise than as we have established that God’s blessedness, glory, majesty do not really differ from Himself. The word ‘command’ [jussio], insofar as it denotes the same thing which the words ‘mandate,’ ‘precept,’ or ‘order’ [signify], properly signifies the effect of the divine will, but not the will of God itself; consequently the command or thing-commanded of God is not God Himself: in the way that the law of God is not God Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669), pp. 48-136 tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

t%20God%20Himself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bad5963280" data-kw="">
<blockquote><p>Election and rejection or reprobation, and in general the will of God, may be considered either quoad actum voluntis, ‘as touching the act of’ God ‘willing,’ or as touching the things willed. Of this distinction, this author [Samuel Hoard] takes no notice; It is fit for some and advantageous to fish in troubled waters. Now as touching the act of God willing, both Aquinas has proved that there can be no cause thereof and withal professes that never was any so mad as to say that merits can be the cause of predestination, quoad actum praedestinantis, ‘as touching the act of’ God ‘predestinating’. And Bradwardine has curiously disputed this way, that no will of God is conditional, to will quoad actum volentis; and [Johannes] Piscator against Vorstius has proved the same after his way; and by variety of demonstration this way may be convinced, as in part I have showed in this discourse, both on the part of election and on the part of reprobation. And both Dr. [Thomas] Jackson [an Arminian] in his book of Providence, professes that the distinction of Voluntas antecedens and consequens, or antecedent and consequent will in God, is to be understood quoad res volitas, ‘as touching the things willed’, as much as to say, non quoad actum volentis. And Gerardus Vossius [an Arminian], drawing the distinction of will antecedent and will consequent unto the distinction of will absolute and will conditional, applies it only quoad res volitas, and so interprets Fathers’ discourse[s] thereof; And of a conditional will gives this instance: God will have men to be saved in case they believe, where faith is clearly made the condition of salvation, a temporal thing, the condition of a temporal thing, not the condition of God’s will to save, it being no way fit that a temporal thing should be made the condition of a thing eternal, such as is God’s will to save. And this is more apparent by the reading of Vossius himself, History of Pelagianism, bk. 7, treating of God’s will to save all. Now if we speak thus of God’s will quoad res volitas, ‘as touching the things willed,’ these things willed being very different, we have reason to consider them distinctly also. Now these things are either grace or glory, commonly called salvation; and as touching grace, to wit, the grace of regeneration, the grace of faith and repentance, we willingly confess that God’s will to confer them is so absolute that He has determined to confer them according to the mere pleasure of his will, not according to man’s works (which is plain Pelagianism and condemned in the Synod of Palestine above 1200 years ago); and as He gives them to whom He will, so He denies them to whom He will, according to that Rom. 9:18, ‘He hath mercy on whom He will, and whom He will He hardneth.’ But as touching salvation or damnation, in which respect this author usually speaks of the absolute or conditional will of God, we utterly deny that God in the dispensation or administration, or execution of these proceeds or ever did decree to proceed according to the mere pleasure of his own will, but altogether according to their works. For albeit God has made no law according whereto He means to proceed in giving or denying grace, yet has He made a law according whereto He proceeds in bestowing salvation and inflicting damnation. And the law is this: ‘Whosever believeth shall be saved; whosoever believeth not shall bedamned.’ 2 Cor. 5:10, ‘We must all appear before the judgment seat of Christ, that every man may receive the things, which are done in his body according to that he hath done, whether good or evil.’ So that according to that sense wherein this author usually speaks of the absolute and conditional will of God, we utterly deny that God does absolutely elect any man to salvation or reject any man unto damnation, though He does absolutely elect some unto grace, that is to the grace of regeneration, to the grace of faith and repentance, and absolutely reject others therefrom. For as much as He bestows these graces on some and denies them unto others not according to their works, but according to the mere pleasure of his own will, but he does not inflict damnation or bestow salvation according to the mere pleasure of his will, but according unto man’s works. And as he carries himself in the execution of salvation and damnation, after the same manner He did from everlasting decree to carry Himself, namely to save no man of ripe years but by way of reward of their faith, repentance and good works, [and] so to damn none but for their infidelity, impenitency and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath</cite>, ... (d. 1646; Oxford, L.L., 1653), bk. 1, pt. 2, Discourse, 3rd Sort of Reasons, pp. 250-51</span></figcaption>

ives+this+instance%3A+God+will+have+men+to+be+saved+in+case+they+believe%2C+where+faith+is+clearly+made+the+condition+of+salvation%2C+a+temporal+thing%2C+the+condition+of+a+temporal+thing%2C+not+the+condition+of+God%E2%80%99s+will+to+save%2C+it+being+no+way+fit+that+a+temporal+thing+should+be+made+the+condition+of+a+thing+eternal%2C+such+as+is+God%E2%80%99s+will+to+save.+And+this+is+more+apparent+by+the+reading+of+Vossius+himself%2C+History+of+Pelagianism%2C+bk.+7%2C+treating+of+God%E2%80%99s+will+to+save+all.+Now+if+we+speak+thus+of+God%E2%80%99s+will+quoad+res+volitas%2C+%E2%80%98as+touching+the+things+willed%2C%E2%80%99+these+things+willed+being+very+different%2C+we+have+reason+to+consider+them+distinctly+also.+Now+these+things+are+either+grace+or+glory%2C+commonly+called+salvation%3B+and+as+touching+grace%2C+to+wit%2C+the+grace+of+regeneration%2C+the+grace+of+faith+and+repentance%2C+we+willingly+confess+that+God%E2%80%99s+will+to+confer+them+is+so+absolute+that+He+has+determined+to+confer+them+according+to+the+mere+pleasure+of+his+will%2C+not+according+to+man%E2%80%99s+works+%28which+is+plain+Pelagianism+and+condemned+in+the+Synod+of+Palestine+above+1200+years+ago%29%3B+and+as+He+gives+them+to+whom+He+will%2C+so+He+denies+them+to+whom+He+will%2C+according+to+that+Rom.+9%3A18%2C+%E2%80%98He+hath+mercy+on+whom+He+will%2C+and+whom+He+will+He+hardneth.%E2%80%99+But+as+touching+salvation+or+damnation%2C+in+which+respect+this+author+usually+speaks+of+the+absolute+or+conditional+will+of+God%2C+we+utterly+deny+that+God+in+the+dispensation+or+administration%2C+or+execution+of+these+proceeds+or+ever+did+decree+to+proceed+according+to+the+mere+pleasure+of+his+own+will%2C+but+altogether+according+to+their+works.+For+albeit+God+has+made+no+law+according+whereto+He+means+to+proceed+in+giving+or+denying+grace%2C+yet+has+He+made+a+law+according+whereto+He+proceeds+in+bestowing+salvation+and+inflicting+damnation.+And+the+law+is+this%3A+%E2%80%98Whosever+believeth+shall+be+saved%3B+whosoever+believeth+not+shall+bedamned.%E2%80%99+2+Cor.+5%3A10%2C+%E2%80%98We+must+all+appear+before+the+judgment+seat+of+Christ%2C+that+every+man+may+receive+the+things%2C+which+are+done+in+his+body+according+to+that+he+hath+done%2C+whether+good+or+evil.%E2%80%99+So+that+according+to+that+sense+wherein+this+author+usually+speaks+of+the+absolute+and+conditional+will+of+God%2C+we+utterly+deny+that+God+does+absolutely+elect+any+man+to+salvation+or+reject+any+man+unto+damnation%2C+though+He+does+absolutely+elect+some+unto+grace%2C+that+is+to+the+grace+of+regeneration%2C+to+the+grace+of+faith+and+repentance%2C+and+absolutely+reject+others+therefrom.+For+as+much+as+He+bestows+these+graces+on+some+and+denies+them+unto+others+not+according+to+their+works%2C+but+according+to+the+mere+pleasure+of+his+own+will%2C+but+he+does+not+inflict+damnation+or+bestow+salvation+according+to+the+mere+pleasure+of+his+will%2C+but+according+unto+man%E2%80%99s+works.+And+as+he+carries+himself+in+the+execution+of+salvation+and+damnation%2C+after+the+same+manner+He+did+from+everlasting+decree+to+carry+Himself%2C+namely+to+save+no+man+of+ripe+years+but+by+way+of+reward+of+their+faith%2C+repentance+and+good+works%2C+%5Band%5D+so+to+damn+none+but+for+their+infidelity%2C+impenitency+and+evil+works.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy+consistent+with+his+Absolute+Hatred+or+Reprobation+of+the+Vessels+of+Wrath...+%28d.+1646%3B+Oxford%2C+L.L.%2C+1653%29%2C+bk.+1%2C+pt.+2%2C+Discourse%2C+3rd+Sort+of+Reasons%2C+pp.+250-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbad5963280.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bad5963280.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Election%20and%20rejection%20or%20reprobation%2C%20and,their%20infidelity%2C%20impenitency%20and%20evil%20works&amp;te <blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ .

1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following.

2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing.

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>

2C+effectively+obtain+any+object+whatsoever%2C+and+yet+does+not+will+to+obtain+it+effectively%2C+but+only+to+desire+it+ineffectively%3B+then+rather+it+is+a+perfection+of+the+will%2C+and+a+dominion+over+itself+and+over+its+power.+It+is+confirmed%2C+since+to+will+not+to+produce+other+worlds+is+not+an+imperfection%2C+but+rather+a+perfection%3B+therefore+likewise+to+will+not+to+produce+effectively+free+actions%2C+but+only+to+supply+to+them+a+sufficient+concurrence%2C+will+not+be+an+imperfection.+To+the+confirmation+it+is+answered%3A+if+the+desired+thing+is+not+obtained+on+account+of+a+defect+of+power%2C+or+if+the+desired+thing+increases+in+some+way+the+happiness+of+the+desiring+will%3B+then+not+to+obtain+that+thing+can+of+itself+sadden+and+afflict.+But+to+God+neither+is+there+lacking+power+to+obtain%2C+nor+is+the+happiness+of+God+increased+in+anyway+by+the+obtaining+of+the+desired+thing.+3.+The+second+objection+is%2C+that%3A+A+conditional+volition+is+proper+to+a+will+which+cannot+obtain+that+good+without+the+condition+appended%3A+just+as+a+conditional+will+of+retaining+wares+in+a+storm+%5Bon+the+sea%5D+is+proper+to+a+will+which+cannot+avoid+shipwreck+unless+a+jettison+of+the+wares+be+made.+It+is+confirmed%2C+because+that+will+of+the+merchant+would+effectively+preserve+the+wares%2C+if+he+could+without+danger%2C+or+inconvenience%2C+and+difficulty.+But+God%2C+without+danger%2C+inconvenience%2C+and+difficulty%2C+could+have+saved+all+men%2C+if+He+willed.+Therefore+neither+by+a+conditional+will+does+He+will+their+salvation.+4.+It+is+answered%3A+By+denying+the+first+antecedent.+For+although+the+will+be+omnipotent%2C+and+can+without+an+appended+condition+obtain+such+a+good%2C+nonetheless+most+wisely+and+most+powerfully+it+uses+a+conditioned+volition%2C+when+another+greater+good%2C+incompatible%2C+is+loved+by+an+efficacious+volition%2C+which+depends+on+the+aforesaid+condition.+But+the+%5Bproposed%5D+greater+good+is+a+better+administration+of+the+universe%2C+and+a+more+illustrious+manifestation+of+divine+justice+together+with+mercy+requires+that+the+salvation+of+all+be+loved%2C+as+much+as+regards+God%2C+efficaciously%3B+nor+does+it+allow+that%2C+by+the+antecedent+will+of+God%2C+impediments+of+salvation+be+decreed+and+procured%3B+yet+at+the+same+time+it+requires+that+many+men+be+so+left+to+their+own+choice+that+they+be+permitted%2C+if+they+will%2C+to+resist+the+aforesaid+will+of+God.+Since+therefore+this+greater+good+efficaciously+willed+by+God+implies+a+contradiction+with+the+salvation+of+those+same+men+efficaciously+willed%2C+for+that+reason+God+most+wisely+and+most+powerfully+appends+a+condition+to+His+will%2C+depending+upon+the+choice+of+men.+For+this+volition+satisfies+the+natural+propensity+and+benevolence%2C+which+He+professes+toward+men%2C+even+the+reprobate%2C+without+dissimulation.+It+is+confirmed%3A+By+the+example+of+the+human+will+of+Christ+the+Lord%2C+to+whom+there+was+not+lacking+the+power+of+avoiding+death%2C+according+to+that+of+Mt.+26%3A+%E2%80%9CDo+you+think+that+I+cannot+ask+my+Father%2C+and+He+will+provide+for+Me+now+more+than+twelve+legions+of+angels%3F%E2%80%9D+and+Jn.+10%3A+%E2%80%9CI+lay+down+my+life%2C+that+I+may+take+it+again.+No+one+takes+it+from+Me%3B+but+I+lay+it+down+of+Myself.%E2%80%9D%0A%0A%E2%80%94+Diego+Ruiz+de+Montoya%2C+Commentaries+%26+Disputations+on+the+First+Part+of+St.+Thomas%2C+on+the+Will+of+God+%26+its+Proper+Acts%2C+%28Lugduni%3A+Prost%2C+1630%29%2C+Quest.+19%2C+On+the+Will+of+God%2C+Disputation+20%2C+%E2%80%98It+is+explained+whether+the+antecedent+will+is+conditional%2C+and+whether+it+is+formally+concerned+with+the+means%2C+insofar+as+they+are+means%E2%80%99+tr.+AI+by+The+Faith+Received+Ruiz+%281562-1632%29+was+a+Spanish+Jesuit+theologian+who+fundamentally+was+on+the+side+of+those+affirming+Middle+Knowledge+in+the+De+Auxiliis+controversy%2C+who+yet+sought+to+bridge+the+difference+with+a+formulation+which+came+to+be+critiqued+by+both+Jesuits+and+Dominicans.+Ruiz+was+a+favorite+of+John+Davenant.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e99793f4b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9e99793f4b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=Section%204%2C%20%E2%80%98On%20the%20imperfections%20which,I%20lay%20it%20down%20of%20Myself&amp;text=Section%204%2C%20%E2%80%98On%20the%20imperfections%20which%20an%20inefficacious&amp;text=Me%3B%20but%20I%20lay%20it%20down%20of%20Myself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-e899841436" data-kw="">
<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

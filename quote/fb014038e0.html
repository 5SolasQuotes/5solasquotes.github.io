<main class="wrap"><figure class="quote" id="q-fb014038e0" data-kw="">
<blockquote><p>I shall recommend to you Mr. [William] Perkins’ Exposition of this [Scripture] testimony (on Jude 19), comparing it with his comment to the same effect on the first chapter of the Epistle to the Galatians, the 2nd verse, and his doctrinal observation is this (I shall only abbreviate that descant he has enlarged): It is a great sin for a man to separate himself from the assembly of God’s people, Heb. 10:25. It is our duty to keep unity, Eph. 4:3. Upon this occasion he starts this question: Whether if there be errors in the Church, we may separate ourselves? His judicious resolution is this: Errors are either practical in manners or doctrinal in tenets. For vicious manners we may not separate; Lot did it not. The Jews might not do it from the scribes and Pharisees, because they sat in Moses’s chair. Though we may not separate from such corrupt persons in the public assemblies, yet we may in private conversation, 1 Cor. 5:11. If the Church err in doctrine, it is to be considered whether the error be in a point substantial, fundamental or not? if in a point substantial, fundamental, whether upon infirmity, or obstinacy? if of frailty, we may not separate, as in Corinth and Galatia. If a Church err in the foundation openly, obstinately, a separation may be made, 1 Tim. 4:5 (yet the error being in some, not in all, it remains a Church, as Corinth did). If the error be in smaller points, not fundamental, we may not separate: They which build upon the foundation of hay and stubble of erroneous opinon, may be saved, 1 Cor. 3:25. Mr. Perkins concludes that no man can separate from the Church of England with a good conscience, since it teaches, obeys, believes the doctrine of the prophets and apostles. In the most justifiable cause of separation he requires examination, conviction, censure (or condemnation). To separate without examination is not piety, but frenzy. No man can judge aright of that (says the Philosopher, Aristotle, bk. 1, Ethics) whereof he is ignorant. No man can well determine, what he does not well discuss. Qui ad pauca respicit de facili pronunciat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Church of England, in Point of Separation from it</cite>, (London: Leach, 1679), pp. 80-82 Thomas (d. 1689) was a Welsh Anglican bishop.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d9f6b797d" data-kw="">
<blockquote><p>…and so [these examples brought forward by the Protesters] do not at all touch our case of joint acting in arms for just and necessary defence of subjects of one nation, habitually and antecedently incorporated, and now in common hazard. And for these alleged [verses] from the New Testament, they are such as are alleged by Separatists for separation from Churches for the the sin of fellow-members (as that 2 Cor. 6:14-15, etc.), which yet we believe judicious Separatists themselves will judge to be impertinently applied to a separation in the case [of civil, military defense] now in hand.</p></blockquote>

</figure><figure class="quote" id="q-ca4866a32c" data-kw="">
<blockquote><p>And what shall I say in the conclusion, now I am near to my departure from this contentious world? but sound a retreat to all these unhappy militants, that will not let holiness prosper by the necessary advantage of peace. Cease your proud contendings, O vain-glorious militant clergy! Learn of the Prince of peace and the holy angels that preached Him, to give glory to God in the highest, who gives peace on earth, and well-pleasedness in (or towards) men. Did Christ or his apostles make such work for Christians as you do? The great Shepherd of the flock will take your pretences of order, orthodoxness (or truth) and piety for no excuse for your corrupting order, faith and practice by your tyranny, self-conceitedness and blind zeal and superstition; and for using his name against Himself, to the destroying of that love, and concord and unity which He has bequeathed to his Church; and for serving his enemy, and dividing his people, and hardening infidels and ungodly ones by these scandals. Return to the primitive simplicity, that we may return to unity, love and peace. Dream not of them upon your own corrupting terms. And read and read over again and again James 3, which does describe you, condemn you, and instruct you. If you say, ‘Physicion heal thyself: Who has wrote more of controversies?’ I answer, peruse what I have written and you will see it is of controversies, but against controversies, tending to end and reconcile. If anything be otherwise (except necessary defence of certain necessary faith or duty), I retract it and condemn it: Let it be as not written. I have meddled much with controversies in this book: but it is to end them. The God of Peace give wisdom and peaceable principles, minds and hearts to his servants, that (though I shall not live to see it) true love and piety may revive in the Christian world, by the endeavors of a healing ministry, and the shaming, restraint and reformation of the contentious clergy, whether tyrannical, dogmatical or superstitious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

</figure><figure class="quote" id="q-6c14a35922" data-kw="">
<blockquote><p>But there is one thing which is even worse than controversy, and that is false doctrine tolerated, allowed, and permitted without protest or molestation. It was controversy that won the battle of Protestant Reformation. If the views that some men hold were correct, it is plain we never ought to have had any Reformation at all! For the sake of peace we ought to have gone on worshiping the Virgin and bowing down to images and relics to this very day! Away with such trifling!</p></blockquote>

<blockquote><p>The French national synods of Gap (1603) and La Rochelle (1607) were prime examples of this. Philippe du Plessis-Mornay (1549-1623), the advisor to Henry of Navarre, used fundamental articles in his Traite de I’Eglise (1578) as a basis for suggesting an accord with the Church of England. James I responded to the French Reformed initiative by sending a letter to the Synod of Toniens (1614) expressing his own desire for union. The Synod went on to adopt a series of procedures designed to set up an international synod which would formulate procedures for establishing a common Reformed-Anglican-Lutheran statement of faith based on the fundamental articles… Mornay also used fundamental articles in his description of the true church. Philippe du Plessis-Mornay, Traite de l’Eglise, 2d ed. (La Rochelle, 1599), pp. 75-77; 172-75.” – Martin Klauber, “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 338 fn. 16 Beza, Theodore – Traicté des vrayes essencielles et visibles marques de la vraye Eglise catholique (1592) 108 pp. Martin Klauber: “Beza placed his discussion of fundamental articles within the framework of his treatise on the true marks of the Church. In his Traicte des vrayes essencielles et visibles marques de la vraye Eglise Catholique (1592), Beza defined the fundamental articles as being summarized in the Ten Commandments, the Apostles Creed, and the Lord’s Prayer. He argued further that such fundamental articles such as the Trinity and the two natures of Christ are essential marks of the true Church.” “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 336, fn. 7 Junius, Francis – Le paisible chrestien ou de la paix de l’Eglise catholique… sur les Pseaumes 122 et 133 (Leiden: 1593) 392 pp. no ToC . 1600’s Jurieu, Pierre The Authentic System of the Church &amp; a True Analysis of the Faith… (Dort, 1686) ToC Jurieu (1637-1713) was a French reformed minister and prolific author. Wikipedia: “The most famous of the controversies on this subject was that between [the Romanist, Jacques-Bénigne] Bossuet [1627-1704] and the Calvinist Jurieu. Jurieu’s book… ‘Le Vray Systeme’ was an attempt to demonstrate the right of the French Protestants to rank as members of the Church Universal… According to him all sects without exception are members of Body of Christ. For this nothing is necessary but “to belong to a general confederation, to confess Jesus Christ as Son of God, as Saviour of the world, and as Messias; and to receive the Old and New Testaments as the rule and Law of Christians”, (Système, p. 53). Yet among the various portions of the Church we must, he tells us, distinguish four classes: 1. Sects that have retained all the truths taught in the Scriptures; 2. Sects that, while retaining the more important truths, have mingled with them superstitions and errors; 3. Sects that have retained the fundamental truths, but have added doctrines incompatible with them; 4. Sects that have set the fundamental verities aside altogether. This last class are dead members of the mystical body (ibid., p. 52). Those who have retained the fundamental articles of the faith are, one and all, living parts of the Church. When he comes to define precisely which doctrines are, and which are not, fundamental, Jurieu bids us fall back on the rule of Vincent of Lérins [d. c. 445]: Quod semper, quod ubique, quod ab omnibus [that which is always, everywhere and from all]. Wherever all bodies of Christians still exist and possess some importance in the world, and agree in accepting a dogma, we have, in that agreement, a criterion that may be considered infallible. Among truths so guaranteed are the doctrine of the Trinity, the Divinity of Jesus Christ, the Redemption, the satisfaction, original sin, creation, grace, the immortality of the soul, the eternity of punishment (ibid, 236-237). This work was followed, in 1688, by another entitled “Traité de l’unité de l’Eglise et des articles fondamentaux”, written in reply to Nicole’s criticisms. In the same year appeared Bossuet’s “Histoire des Variations des Eglises protestantes”… In regard to the relation of the fundamental doctrines to salvation, Jurieu is in agreement with the English divines already quoted. “By fundamental points”, he says, “we understand certain general principles of the Christian religion, a distinct faith and belief in which are necessary to salvation” (Traité, p. 495).</p></blockquote>

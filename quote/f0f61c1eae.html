<main class="wrap"><figure class="quote" id="q-f0f61c1eae" data-kw="">
<blockquote><p>2. The apostles gave no positive commandment to keep Moses’s Law as apostles, nay nor to keep any part of it; they did not as apostles forbid, before this synod [at Jerusalem], that the gentiles should abstain from blood and things strangled, which were Mosaical laws before this synod, yet now they give a commandment to keep some Mosaical laws in the case of scandal; hence we must either judge that now [that] as apostles they command in positive commandments the keeping of Moses’s Law, contrary to what they say (for their not commanding to keep Moses’s Law [Acts 15:24] is a commanding not to keep it, observe this) or then their commandment here is but synodical and so far binding as the case of scandal stands in vigor, which certainly a synod may command, and one Church may enjoin, by way of counsel, to another, for otherwise as apostles forbidding scandal (which is spiritual homicide) they forbid also eating of blood in that case when it stood indifferent.

3. [In] The apostles saying, ‘to whom we gave no such commandment’ [v. 24], they clearly insinuate that their commandment as apostles de jure [by right], should have ended the controversy, but now for the edification and after-example of the churches they took a synodical way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, p. 364</span></figcaption>

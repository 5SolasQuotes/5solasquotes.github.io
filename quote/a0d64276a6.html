<blockquote><p>Christ, therefore, justifies no man without also sanctifying him. These blessings are conjoined by a perpetual and inseparable tie. Those whom he enlightens by his wisdom he redeems; whom he redeems he justifies; whom he justifies he sanctifies.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.16.1</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ab316be07" data-kw="">
<blockquote><p>1. Where persons are esteemed members of churches by external causes without their own consent, or by parochial cohabitation, they may remove from one church unto another by the removal of their habitation according unto their own discretion. For such cohabitation being the only formal cause of any relation to such a church in particular, upon the ceasing of that cause, the relation ceases of its own accord.

2. Where persons are members of churches by mutual confederation, or express personal consent, causeless departure from them is an evil liable unto many aggravations.

3. But whereas the principal end of all particular churches is edification, there may be many just and sufficient reasons why a person may remove himself from the constant communion of one church unto that of another. And of these reasons he himself is judge on whom it is incumbent to take care of his own edification above all other things. Nor ought the church to deny unto any such persons their liberty desired, peaceably and according unto order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, … (London, 1689), ch. 10, pp. 225-26 Owen was a congregationalist puritan.</span></figcaption>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7726fab6b7" data-kw="">
<blockquote><p>This man being pastor to a church in Salem in New England, though he had formerly bragged or boasted that of all the Churches of the world those of New England were the purest, and of all in New England that whereof he was the teacher; yet there he set up for so much strictness that he told his congregation if they would not separate from all the churches in New England, as well as from the churches of Old England, he would separate from them: But his congregation in Salem refusing to go in with his proposals, he separated from them, and would never have any communion with any person in it, nay, not with his own wife, that went into their assemblies; keeping a meeting at the same time in his own house, whereto resorted such as he had infected with his extravagancies: And though pains were taken upon this man, yet he went on in his ways, renouncing all the churches of New England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-93d8008fc2" data-kw="">
<blockquote><p>We do believe and own, that Jesus Christ is the only Head and King of his Church; and that he has instituted in his Church officers and ordinances, order and government, and not left it to the will of man, magistrate or Church to alter at their pleasure; and we believe this government is neither prelatical nor congregational, but presbyterian, which now, through the mercy of God, is established amongst us; and believe we have a better foundation for this our Church government, than the inclination of the people or laws of men, etc.</p></blockquote>

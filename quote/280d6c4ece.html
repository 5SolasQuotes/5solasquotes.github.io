<main class="wrap"><figure class="quote" id="q-280d6c4ece" data-kw="">
<blockquote><p>It seems difficult, dearest brethren, and it is considered as harsh that the Lord commanded in the Gospel: ‘If anyone wishes to come after me, let him deny himself.’ However, what He commands is not difficult, since He helps to effect what He commands. True, indeed, is what is said in the psalm: ‘According to the words of your lips I have kept the ways of the law,’ and also true is what He Himself said: ‘For my yoke is easy, and my burden light.’ Charity makes whatever is difficult in the precepts light. We know that this is true, for very often even earthly love, or wicked and wanton love, endures with patience things that are exceedingly difficult and burdensome in order to reach what it madly desires.

If a man loves money he is called avaricious, if he loves honour he is called ambitious, and if he loves beautiful bodies he is called lustful. Consider how much those men who love perishable goods labour in sailing the sea, in accomplishing an earthly journey, or in enduring heat and cold. They do not even feel what they are suffering, and they strive all the more when they are kept from the effort. For if a man has taken a position in military service, when he has begun to acquire temporal gains through the intolerable sufferings of warfare and countless deaths, if the military service is taken away he is afflicted and becomes exceedingly sad, because the labour itself is withdrawn.

I beseech you, brethren, if transitory possessions are sought in this fashion, how should eternal goods be sought? Therefore, dearly beloved, our whole attention should be directed to this, the choice of what we should love. There are, indeed, many lovers of the world, but through the goodness of God there do not also cease to be lovers of eternal life. For if there were only lovers of the world in this life, it would make us despair of eternal life. But wheat is also found among the chaff, and sometimes a rose is gathered among the thorns. Truly, there are many souls who not only patiently, but even willingly, accept many labours because of love for Christ.

Why, then, do you wonder if a man who loves Christ and wishes to follow Him in loving Him denies himself for his own benefit? Just as a man is lost through loving himself, so he is found by denying himself, Love of self was the ruin of the first man, for if he had not loved himself in the wrong order and had preferred God to himself, he would have been willing to be subject to God. However, he was not, but turned aside to neglect God’s will and to do his own. Truly, this is not to love; it is not to do one’s own will, but to prefer the will of God to perishable loves. Learn, then, to love yourself by not loving yourself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caesarius-of-arles.html">Caesarius of Arles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons: Volume II (81-186)</cite>, trans. Mary Magdeleine Mueller, The Fathers of the Church: A New Translation, vol. 47 (Washington D.C.: The Catholic University of America Press, 1964), 159.1-2, pp 366-67.</span></figcaption>

<blockquote><p>‘Behold, I stand at the door and knock, If any man will open…’ (Rev. 3:20). Alas, we cannot open the door, it is so locked and barred and bolted that it is impossible for us to open it. True, it is so, but yet there is a way to open, and that is to be opening when God would help us to open. When God offers to help you to open the door, then set upon opening the door, and whatever the bolts, bars and locks are, you shall be sure to have it open. Ah, but when does God offer to help us to open it? Then when His Spirit knocks, when in the motions of it He solicits us to open, then God offers His help to help us to open. Take that time and then set on the work and the door shall be opened. But if that time is neglected we may strive to open but cannot open, because then that power is gone that would have helped us to open. See Eccl. 9:12, ‘For man also knoweth not his time.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’</cite>, (d. 1620; 1640; RBO, 2018), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

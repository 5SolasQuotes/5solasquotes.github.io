<main class="wrap"><figure class="quote" id="q-51e13b3efd" data-kw="">
<blockquote><p>To the love of God belong what may be called his desires or wishes, etc. Now it is the absence of good which excites desire; but since God enjoys all good, it is plain that desire cannot properly apply to Him; yet it is frequently attributed to Him in scripture, and to this may be referred all those passages in which God is introduced speaking to this effect: “O that my people had hearkened unto me.” (Ps. 81:14; Isa. 48:14; Lk. 19:42) Therefore this desire in God denotes, that man’s obedience is highly pleasing to him, and that He will not pass it by unrewarded; at the same time it points out man’s duty, and his great wickedness in not discharging this duty. To this desire is opposed aversion, by which God is said to loathe sin, and to have no pleasure in the destruction of the creature. From what has been said, we clearly see what ideas we ought to have of the hope of God, of his joy, sorrow, jealousy, etc. Hope or expectation in God, intimates that the thing is due to Him. Thus when He said that He “looked that his vineyard should bring forth grapes,” (Isa. 5:2) He meant that the vineyard owed him fruit, and could not be fruitless without sin. God is said to rejoice when anything is pleasing to Him; and also when He performs anything which displays his glory, as when He does good to his people, or when He punishes the rebellious and ungodly. (Deut. 28:63; 30:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, (d. 1724), bk. 2, ch. 5, p. 87</span></figcaption>

e.com/on-the-affections-of-god/#:~:text=To%20the%20love%20of%20God%20belong,rebellious%20and%20ungodly.%20%28Deut.%2028%3A63%3B%2030%3A9&amp;text=To%20the%20love%20of%20God%20belong%20what%20may&amp;text=punishes%20the%20rebellious%20and%20ungodly.%20%28Deut.%2028%3A63%3B%2030%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a540be4c48" data-kw="">
<blockquote><p>The second part of the division, however, that between ‘proper’ and ‘figurative,’ is the point of distinction between the affections and all of the attributes discussed previously [life, intellect, will, righteousness, truth, pwer, glory, etc.]. For the affections of the divine will or, as they are sometimes called, divine virtues, are attributed to God, not properly, but figuratively… The affections are, therefore, either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. … …the [reformed] orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions… …This, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept… A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.433 433. [William] Ames, Marrow, I.iv.63… the point of the theological argument is that God act[s] but is not acted upon. The Reformed orthodox understanding of God, in accord with the greater part of the Christian tradition, assumes the divine immutability, and, typically, denies change and, certainly, acquired qualities to God. … The divine affections… are divine perfections that have some analogy to the dispositions or habits of the human will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, , ed. (Baker Academic, 2003), vol. 3, ch. 6.3, ‘The Divine Affections &amp; Virtues’, pp. 551-89; pp. 552-7</span></figcaption>

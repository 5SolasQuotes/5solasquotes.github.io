<blockquote><p>It will be asked, But how doth it appear that these or any other Judicial Laws of Moses do at all appertain to us, as rules to guide us in like cases? I shall wish him who scrupleth this, to read Piscator his Appendix to his Observations upon the 21, 22, 23. Chapters of Exodus, where he excellently disputeth this question, Whether the Christian Magistrate be bound to observe the Judicial laws of Moses, as well as the Jewish Magistrate was.

He answereth by the common distinction, he is obliged to those things in the Judicial law which are unchangeable, &amp; common to all Nations: but not to those things which are mutable, or proper to the Jewish Republic. But then he explaineth this distinction, that by things mutable, and proper to the Jews, he understandeth the emancipation of an Hebrew servant or handmaid in the seventh year, a man’s marrying his brother’s wife and raising up seed to his brother, the forgiving of debts at the Jubilee, marrying with one of the same Tribe, and if there be any other like to these; also Ceremonial trespasses, as touching a dead body, &amp;c.

But things immutable, and common to all Nations are the laws concerning Moral trespasses, Sins against the Moral law, as murder, adultery, theft, enticing away from God, blasphemy, striking of Parents. Now that the Christian Magistrate is bound to observe these Judicial laws of Moses which appoint the punishments of sins against the Moral law, he proveth by these reasons.

1. If it were not so, then it is free and arbitrary to the Magistrate to appoint what punishments himself pleaseth. But this is not arbitrary to him, for he is the Minister of God, Rom. 13. 4. and the judgement is the Lords, Deut. 1. 7. 2 Chron. 19. 6. And if the Magistrate be Keeper of both Tables, he must keep them in such manner as God hath delivered them to him.

2. Christ’s words, Mat. 5. 17. Think not that I am come to destroy the Law or the Prophets, I am not come to destroy, but to fulfil, are comprehensive of the Judicial law, it being a part of the law of Moses; Now he could not fulfil the Judicial law, except either by his practice, or by teaching others still to observe it; not by his own practice, for he would not condemn the Adulteress, Joh. 8. 11. nor divide the Inheritance, Luke 12. 13, 14. Therefore it must be by his doctrine for our observing it.

3. If Christ in his Sermon, Mat. 5. would teach that the Moral law belongeth to us Christians, in so much as he vindicateth it from the false glosses of the Scribes &amp; Pharisees; then he meant to hold forth the Judicial law concerning Moral trespasses as belonging to us also: for he vindicateth and interpreteth the Judicial law, as well as the Moral, Mat. 5. 38. An eye for an eye, &amp;c.

4. If God would have the Moral law transmitted from the Jewish people to the Christian people; then he would also have the Judicial law transmitted from the Jewish Magistrate to the Christian Magistrate: There being the same reason of immutability in the punishments, which is in the offences; Idolatry and Adultery displeaseth God now as much as then; and Theft displeaseth God now no more then before.

5. Whatsoever things were written aforetime, were written for our learning, Rom. 15. 4. and what shall the Christian Magistrate learn from those Judicial laws, but the will of God to be his rule in like cases? The Ceremonial law was written for our learning, that we might know the fulfilling of all those Types, but the Judicial law was not Typical.

6. Do all to the glory of God, 1 Cor. 10. 31. Mat. 5. 16. How shall Christian Magistrates glorify God more then by observing God’s own laws, as most just, and such as they cannot make better?

7. Whatsoever is not of faith is sin, Rom. 14. 23. Now when the Christian Magistrate punisheth sins against the Moral law, if he do this in faith and in assurance of pleasing God, he must have his assurance from the Word of God, for faith can build upon no other foundation: it is the Word which must assure the Conscience, God hath commanded such a thing, therefore it is my duty to do it, God hath not forbidden such a thing, therefore I am free to do it. But the will of God concerning Civil justice and punishments is nowhere so fully and clearly revealed as in the Judicial law of Moses. This therefore must be the surest prop and stay to the conscience of the Christian Magistrate.

These are not my reasons (if it be not a word or two added by way of explaining and strengthening) but the substance of Piscator’s reasons: …</p></blockquote>

<blockquote><p>Christ clearly asserts that He did not come ’to abolish the Law’ (Matt. 5:17). Therefore He approves the laws of Moses.” We respond. Christ is speaking about the moral Law, which was not given temporarily but is the eternal wisdom and norm of righteousness in God. Christ did not abolish this but fulfilled it perfectly, and even renews believers for its obedience by giving them His righteousness and Holy Spirit. Furthermore, the circumstances of the text show clearly that Christ is talking here about the moral Law. As far as the forensic laws of Moses are concerned, the apostle asserts (Eph. 2:15) that “Christ voided (καταργήσας) the law of commandments and ordinances,” not to mention the fact that in the same passage (v. 31) Christ disapproves of the certificate of divorce even though the law of Moses allowed it (Matt. 19:8).

Note here that some forensic laws had reference to a part of the ceremonial law and depended on it. For example, whoever had committed an accidental homicide was compelled to keep himself within a city of refuge until the death of the high priest. But because the Levitical priesthood was abrogated through the coming of the Messiah, who is the one and only high priest of the New Testament, it turns out that that forensic law was also abrogated. As a result, the words of Christ cannot refer to the forensic law of Moses.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

and+Joshua+J.+Hayes+%281613%3B+St+Louis+MO%3A+Concordia+Publishing+House%2C+2015%29%2C+XVI.3.4.+%C2%A7+41.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F11d9553f78.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/11d9553f78.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/08/10/johann-gerhard-on-matthew-517-and-the-jewish-judicial-laws/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>At the time of the Westminster Assembly, various Presbyterian ministers in London wrote a book defending the divine right of church government. This book was entitled, Jus Divinum. In relation to the view of the Westminster divines concerning the judicial law, Chris Coldwell has recently argued that ‘it would seem to exhibit the understanding of [Westminster Confession] 19.4 of at least a significant portion of the divines’ and is ‘possibly the closest thing to an authoritative explication of the divines’ meaning at 19.4 that may be found.’[1] Hence, the comments recorded in this volume with respect to the Mosaic judicials are highly significant:

We answer, the Laws of the Jewish Church, whether Ceremonial or Judicial, so far forth are in force, even at this day, as they were grounded upon common equity, the principles of reason and nature, and were serving to the maintenance of the Moral Law. … The Jewish Politie is only abrogated in regard of what was in it of particular right, not of common right, so far forth as there was in their Laws either a typicalness proper to their Church, or a peculiarness of respect to their state in that Land of Promise given unto them. Whatsoever was in their Laws of Moral concernment, or general equity is still obliging …[2]

Judging by the views expressed above, we can discern that the original intent of Westminster 19 is that whatever was uniquely Jewish in the Mosaic judicial law has been abrogated, but whatever is of common right in the Mosaic judicials remains valid.

[1] Chris Coldwell, ‘The Westminster Assembly and the judicial law: a chronological compilation and analysis’ in Confessional Presbyterian, v (2009), p. 46.</p></blockquote>

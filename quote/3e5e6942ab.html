<main class="wrap"><figure class="quote" id="q-3e5e6942ab" data-kw="">
<blockquote><p>It is quite possible that we may abstain from every thing that could be regarded as a violation of the letter of the Fourth Commandment, and that we may observe, also, with becoming decency, the duties which belong peculiarly to the Sabbath, and yet that there may be little, in all this, of the real sanctification of that holy day. Sanctifying the Sabbath does not consist merely in abstaining, however rigorously, from one class of employments, and giving ourselves, however laboriously, to another.

No doubt, the Sabbath cannot be sanctified where worldly employments are not given up, and religious exercises engaged in; but it is also true, that the Sabbath is kept holy only in so far as the great subjects which it is designed to present are entertained, and dwelt upon with satisfaction and delight; and did those subjects occupy the place in our hearts which they ought to occupy—did we feel it to be a delightful exercise to meditate with admiration and gratitude on God’s wonderful work of creation, and his still more wonderful work of redeeming love—did we see it to be a most precious privilege, that we are permitted to hold fellowship with him in his ordinances—and were the hope of at last “entering into his rest” the main source of our consolation and comfort amidst the various ills of our present sinful condition; then we would have in our own minds a rule to guide us in the sanctification of the Sabbath—even the longing desire of engaging in its sacred duties, because it is a delight to us, and because we expect, to find in it a “season of refreshing from the presence of the Lord.” Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3d6bf53113" data-kw="">
<blockquote><p>BY Formality. Where the Worship of God is set up, Men don’t readily lose the form, but it is a frequent thing to lose the power of Godliness. It is an easy thing to carry on Praying, to attend Public Worship, and to attend duties of Religion on the Sabbath: this may be done, though their hearts are violently set upon the World, and they be under great prevailings of evil affections: but it is very cross to nature to mortify corruptions, and to exercise themselves in self-denial; give their hearts to God, and to be rejoicing in the righteousness of Christ. Many times People that retain the name of living lose the life of Religion, Rev. 3.1. People are wont to grow lukewarm, Rev. 3.15. The spirit of Religion doth decay by degrees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of Gospel-ministers to preserve a people from corruption. Set forth, in a sermon preached at Brookfield, October 16. 1717. Being the day wherein the church was gathered, and Mr. Thomas Cheney, was ordained Pastor</cite>, (Boston: Samuel Phillips, 1718), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-18829d8add" data-kw="">
<blockquote><p>But inasmuch as the apostles, 1 Cor. xi. 1, who followed Christ, and delivered nothing but what they received from Christ, 1 Cor. xi. 23, xiv. 37, did observe this day as a Sabbath, 1 Cor. xvi. 1, 2; what can this argue but a divine institution of this day? The apostle Paul might have chosen any other day, for the people to assemble to hear the word, and receive the sacrament: but they assembled to receive the sacrament, and to hear the word, upon the first day of the week, which is our Lord’s day, Acts xx. 6, 7. Now the approved practice of the apostles, and of the church with them, recorded in Scripture, carries with it the force of a precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s daily walk in holy security and peace</cite>, (1627; Philadelphia, 1800), p. 86.</span></figcaption>

</figure><figure class="quote" id="q-e26a63fd4a" data-kw="">
<blockquote><p>Alas, even sabbath-time, the purest, the most refined part of time, a creation out of a creation, time consecrated by Divine sanction, how cheap and common is it in most men’s eyes, while many do sin away, and the most do idle away those hallowed hours!

Seneca was wont to jeer the Jews for their ill husbandry, in that they lost one day in seven, meaning their sabbath: truly it is too true of the most of christians, they lose one day in seven, whatever else; the sabbath for the most part is but a lost day; while some spend it totally upon their lusts, and the most, I had almost said the best, do fill up the void spaces and intervals of the sabbath from public worship, with idleness and vanity!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Correction, Instruction; or A Treatise of Afflictions</cite>, (1671; London: Religious Tract Society, 1836), p. 72.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The foregoing opinion [that the knowledge of God is self-evident] arose from their being accustomed from the beginning to hear and call upon the name of God. Now custom, especially if it dates from our childhood, acquires the force of nature, from which it happens that the mind holds those things with which it was imbued from childhood as firmly as though they were self-evident.</p></blockquote>

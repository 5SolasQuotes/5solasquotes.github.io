<blockquote><p>In brief therefore, here it is said, that in the unity of the Godhead there be three Persons; that is, though there be but one living and true God, yet there are three Persons, who are that one living and true God. Though the true God be but one in substance, yet he is three in subsistence; and so three in subsistence, as still to be but one in substance. And these three Persons, every one of which is God, and yet all three but one God, are really related to one another: as they are termed in the scripture, one is a Father, the other a Son, the other an Holy Ghost.

The first is Father to the second; the second is Son to the first; the third is neither Father nor Son, but the issue or Spirit of both. The first was a Father from eternity, as well as God; the second was God from eternity, as well as a Son; the third was both Holy Ghost and God from eternity, as well as either of them. The Father is the first person in the Deity; not begotten, nor proceeding, but begetting: the Son the second person; not begetting nor proceeding, but begotten: the Holy Ghost the third; not begotten, nor begetting, but proceeding. The first is called the Father, because he begot the second; the second is called the Son, because he is begotten of the Father; the third is called the Holy Ghost, because breathed both from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 60-61.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d789e3df17" data-kw="">
<blockquote><p>If any should wrangle for the expressions that are used by Divines in this Mystery; we confess that many of the Schoolmen have exceeded, and have taken too much liberty in this wonderful Mystery; yet, it is the thing that we especially should be established into, and from Scripture that is clear, that there is but One God, and yet Three, who being denominated in the concrete, must imply three different real Relations, or Subsistences, or Persons: and this Essence being infinite and communicable, there is no warrant to bound it to the rules and properties of created beings, who are but finite; and in that respect also incommunicable:

And we conceive that the names here given (and elsewhere in Scripture) will amount clearly to the equivalent of Essence and Persons, which are most obviously made use of in this matter: for, what is that, I am Alpha and Omega, who was, is, and is to come, but that same, Exod. 3. I AM THAT I AM, which denoteth His Being or Essence, as that which is ever a Being: and Idols, being differenced from the true. God by this, that they are by Nature no gods, Gal. 4.8. it implies on the contrary, that by Nature He is God, and so God in respect of His Essence: and therefore that God may be essentially considered, and in that respect of His Essence.

Again, these expressions, that the one is called the Father, and the other the Son, and yet both One God, do clearly hold forth that there are real relations in that Godhead, subsisting in a distinct manner; and so there must be Persons, as Heb. 1. the Son, is called the express Image of the Father’s Person, which plainly says, that the Father, considered as distinguished from the Son, is a Person, and subsists; and that the Son, as distinguished from the Father, and as so lively and expressly representing His Person, must be a Person also, having this from the Father: and what is said of the Father and Son, must also be true of the holy Ghost, who is God equal with both, yet different from Them both, as They differ from each other, though not in respect of that same incommunicable property, yet he who proceedeth, must differ from those from whom he proceeds, as he who is begotten, must differ from him that begat him.

For Their operations, we may find here, that in some things They concur jointly, yet some way differently. Some things again are attributed to one, which cannot be to another, as their personal properties; the Son is begotten, and not the Father or the Spirit: therefore He is allanerly [only] the Son: the Father begets; and the Spirit proceeds. These are called Their personal properties, and Their works ad intra, or amongst, or in reference to Themselves: of this kind is the incarnation of the Son, which can neither be said of the Father, nor of the holy Ghost.

Again, in things ad extra, or that relate to the Creatures simply, whether in making, or governing of the World, They jointly concur: the Father createth all, so doth the Son and holy Ghost; the Son, from the Father, by the holy Ghost; the holy Ghost, from the Father and the Son, as those expressions of God, sending His Son, the Son’s sending the Spirit from the Father, &amp;c. do declare, Joh. 14.26. and 16.7. Gal. 4.6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), pp 7-8.</span></figcaption>

</figure><figure class="quote" id="q-8af4e8b359" data-kw="eternal generation sunbeams">
<blockquote><p>The generation of the Son is not by derivation or transfusion, nor by an action that begins or ends, but by an eternal emanation, which has no parallel in nature, where generations occur in time. This generation is somewhat shadowed by the analogy of sunbeams continually flowing from the body of the sun. Just as the sun is not prior to its rays, nor is the begetter prior in time to the begotten, so the eternal Father eternally begets the Son, and no temporal priority is to be imagined here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXI</span></figcaption>

</figure><figure class="quote" id="q-c4f864304b" data-kw="">
<blockquote><p>Ob. The Son and holy Ghost are not without beginning, therefore they are not eternal.

Answ. This is not a beginning of time or continuance, but only of order and offspring: but the Sabellian here cavil, viz. Christ saith, He that seeth me, seeth the Father: and believest thou not that I am in the Father, and the Father in me? Joh. 14.9.10. therefore the Father and the Son are one person. Ans. Indeed he that seeth the Son seeth the Father, because the Son hath the same essence with the Father, and being manifested in the flesh, hath delivered to us the whole will of God, Joh. 1.18.

Ob. 2. That which is one in number, cannot without contradiction be said to be three in persons: but God is one in number, (Deut. 6.4.) ergo.

Ans. That unity doth signify God’s simple essence, not the manner by which that simple essence subsisteth. Therefore God absolutely according to his essence is one, because he is indivisible: and only in respect of inward relation, I meane the reason of subsisting, is three.

Ob. 3. If there be one being of the Father, another of the Son, and another of the holy Ghost: it followeth, that in God there are three divers beings, and consequently three divers persons.

Ans. The being of the Father doth not signify that essence by which he is absolutely God, but by which he is Father, that is, in that he otherwise subsisteth then doth the Son: therefore the being of the Father is one thing, and the being of the Son is another, and yet both of them have the same essence.

Ob. 4. If there be three Persons truly distinguished, and one only essence, then is there a quaternity in God.

Ans. Not so: for the essence differeth from Person only in reason: but the Persons differ each from other both in reason and in being.

Ob. 5. The Father begot his Son either existing or not existing, to say either of these is absurd.

Ans. We may well say, that the Father begat his Son already existing, because the Father was never without the Son, even as the sun was never without his light. Again, it may be as well said, that he begat him not existing, in that his generation, although it be eternal, yet in order goeth before existence, as the sun is before his light.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Ob. The Son and holy Ghost are not without beginning, therefore they are not eternal.

Answ. This is not a beginning of time or continuance, but only of order and offspring: but the Sabellian here cavil, viz. Christ saith, He that seeth me, seeth the Father: and believest thou not that I am in the Father, and the Father in me? Joh. 14.9.10. therefore the Father and the Son are one person. Ans. Indeed he that seeth the Son seeth the Father, because the Son hath the same essence with the Father, and being manifested in the flesh, hath delivered to us the whole will of God, Joh. 1.18.

Ob. 2. That which is one in number, cannot without contradiction be said to be three in persons: but God is one in number, (Deut. 6.4.) ergo.

Ans. That unity doth signify God’s simple essence, not the manner by which that simple essence subsisteth. Therefore God absolutely according to his essence is one, because he is indivisible: and only in respect of inward relation, I meane the reason of subsisting, is three.

Ob. 3. If there be one being of the Father, another of the Son, and another of the holy Ghost: it followeth, that in God there are three divers beings, and consequently three divers persons.

Ans. The being of the Father doth not signify that essence by which he is absolutely God, but by which he is Father, that is, in that he otherwise subsisteth then doth the Son: therefore the being of the Father is one thing, and the being of the Son is another, and yet both of them have the same essence.

Ob. 4. If there be three Persons truly distinguished, and one only essence, then is there a quaternity in God.

Ans. Not so: for the essence differeth from Person only in reason: but the Persons differ each from other both in reason and in being.

Ob. 5. The Father begot his Son either existing or not existing, to say either of these is absurd.

Ans. We may well say, that the Father begat his Son already existing, because the Father was never without the Son, even as the sun was never without his light. Again, it may be as well said, that he begat him not existing, in that his generation, although it be eternal, yet in order goeth before existence, as the sun is before his light.”

— Guillaume Bucanus, Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), pp 10-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COb.+The+Son+and+holy+Ghost+are+not+without+beginning%2C+therefore+they+are+not+eternal.%0A%0AAnsw.+This+is+not+a+beginning+of+time+or+continuance%2C+but+only+of+order+and+offspring%3A+but+the+Sabellian+here+cavil%2C+viz.+Christ+saith%2C+He+that+seeth+me%2C+seeth+the+Father%3A+and+believest+thou+not+that+I+am+in+the+Father%2C+and+the+Father+in+me%3F+Joh.+14.9.10.+therefore+the+Father+and+the+Son+are+one+person.+Ans.+Indeed+he+that+seeth+the+Son+seeth+the+Father%2C+because+the+Son+hath+the+same+essence+with+the+Father%2C+and+being+manifested+in+the+flesh%2C+hath+delivered+to+us+the+whole+will+of+God%2C+Joh.+1.18.%0A%0AOb.+2.+That+which+is+one+in+number%2C+cannot+without+contradiction+be+said+to+be+three+in+persons%3A+but+God+is+one+in+number%2C+%28Deut.+6.4.%29+ergo.%0A%0AAns.+That+unity+doth+signify+God%E2%80%99s+simple+essence%2C+not+the+manner+by+which+that+simple+essence+subsisteth.+Therefore+God+absolutely+according+to+his+essence+is+one%2C+because+he+is+indivisible%3A+and+only+in+respect+of+inward+relation%2C+I+meane+the+reason+of+subsisting%2C+is+three.%0A%0AOb.+3.+If+there+be+one+being+of+the+Father%2C+another+of+the+Son%2C+and+another+of+the+holy+Ghost%3A+it+followeth%2C+that+in+God+there+are+three+divers+beings%2C+and+consequently+three+divers+persons.%0A%0AAns.+The+being+of+the+Father+doth+not+signify+that+essence+by+which+he+is+absolutely+God%2C+but+by+which+he+is+Father%2C+that+is%2C+in+that+he+otherwise+subsisteth+then+doth+the+Son%3A+therefore+the+being+of+the+Father+is+one+thing%2C+and+the+being+of+the+Son+is+another%2C+and+yet+both+of+them+have+the+same+essence.%0A%0AOb.+4.+If+there+be+three+Persons+truly+distinguished%2C+and+one+only+essence%2C+then+is+there+a+quaternity+in+God.%0A%0AAns.+Not+so%3A+for+the+essence+differeth+from+Person+only+in+reason%3A+but+the+Persons+differ+each+from+other+both+in+reason+and+in+being.%0A%0AOb.+5.+The+Father+begot+his+Son+either+existing+or+not+existing%2C+to+say+either+of+these+is+absurd.%0A%0AAns.+We+may+well+say%2C+that+the+Father+begat+his+Son+already+existing%2C+because+the+Father+was+never+without+the+Son%2C+even+as+the+sun+was+never+without+his+light.+Again%2C+it+may+be+as+well+said%2C+that+he+begat+him+not+existing%2C+in+that+his+generation%2C+although+it+be+eternal%2C+yet+in+order+goeth+before+existence%2C+as+the+sun+is+before+his+light.%E2%80%9D%0A%0A%E2%80%94+Guillaume+Bucanus%2C+Institutions+of+Christian+religion+framed+out+of+God%E2%80%99s+word%2C+and+the+writings+of+the+best+divines%2C+methodically+handled+by+questions+and+answers%2C+fit+for+all+such+as+desire+to+know%2C+or+practise+the+will+of+God%2C+trans.+Robert+Hill+%28London%3A+George+Snowdon+and+Leonell+Snowdon%2C+1606%29%2C+pp+10-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4f864304b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c4f864304b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/03/09/guillaume-bucanus-answering-objections-to-the-trinity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f70e07d4bc" data-kw="">
<blockquote><p>If, then, the Holy Spirit is truly, and not in name only, called Divine both by Scripture and by our Fathers, what ground is left for those who oppose the glory of the Spirit? He is Divine, and absolutely good, and Omnipotent, and wise, and glorious, and eternal; He is everything of this kind that can be named to raise our thoughts to the grandeur of His being. The singleness of the subject of these properties testifies that He does not possess them in a measure only, as if we could imagine that He was one thing in His very substance, but became another by the presence of the aforesaid qualities.

That condition is peculiar to those beings who have been given a composite nature; whereas the Holy Spirit is single and simple in every respect equally. This is allowed by all; the man who denies it does not exist. If, then, there is but one simple and single definition of His being, the good which He possesses is not an acquired good; but, whatever He may be besides, He is Himself Goodness, and Wisdom, and Power, and Sanctification, and Righteousness, and Everlastingness, and Imperishability, and every name that is lofty, and elevating above other names.

What, then, is the state of mind that leads these men, who do not fear the fearful sentence passed upon the blasphemy against the Holy Ghost, to maintain that such a Being does not possess glory? For they clearly put that statement forward; that we ought not to believe that He should be glorified: though I know not for what reason they judge it to be expedient not to confess the true nature of that which is essentially glorious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 316-17.</span></figcaption>

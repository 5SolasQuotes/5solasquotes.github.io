<main class="wrap"><figure class="quote" id="q-0538bb6778" data-kw="">
<blockquote><p>Spanheim, [Pierre] Jurieu, [Jacques] Saurin, and others regarded [Amyraldianism] as an Arminian leaven [Gal. 5:9] which had destroyed the French Protestant Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit</cite>, p. 361, 363</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd89f9854c" data-kw="">
<blockquote><p>This proves, therefore — (1.) That Christ did not die simply to make the salvation of those for whom he died possible — i.e., to remove legal obstructions to their salvation — but that he died with the design and effect of actually securing their salvation and of endowing them gratuitously with an inalienable title to heaven. (2.) It proves, in the second place, that the vicarious sufferings of Christ must have been, in design and effect, personal and definite as to their object. Salvation must be applied to all those for whom it was purchased. Since not the possibility or opportunity for reconciliation, but actual reconciliation itself was purchased: since not only reconciliation, but a title to an eternal inheritance was purchased, it follows (a.) That “to all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same.” Conf. Faith, ch. 8 § 8. And (b.) That he who never receives the inheritance, and to whom the purchased grace is never applied, is not one of the persons for whom it was purchased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Confession of Faith, p. 151, commenting on WCF 8.5, “purchased not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him:”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-ff3099dde0" data-kw="">
<blockquote><p>2. Though Christ has purchased a peculiar people to Himself, to the purpose of salvation, yet others taste of this his goodness. The world, you know, was lost in merit, and ipso facto forfeited, with all its comforts, and appurtenances. The Lord Christ has restored it, and does keep it standing; and in the interim, the worst enjoy it in common with the best, and so far, far the better for Christ.</p></blockquote>

</figure><figure class="quote" id="q-a0dcc74242" data-kw="">
<blockquote><p>[Amyraldianism] was designed to take a middle ground between Augustinianism and Arminianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology, vol. 2</cite>, p. 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“[Amyraldianism] was designed to take a middle ground between Augustinianism and Arminianism.”

— Charles Hodge, Systematic Theology, vol. 2, p. 322">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BAmyraldianism%5D+was+designed+to+take+a+middle+ground+between+Augustinianism+and+Arminianism.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+2%2C+p.+322&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa0dcc74242.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a0dcc74242.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=%5BAmyraldianism%5D%20was%20designed%20to%20take%20a%20middle%20ground%20between%20Augustinianism%20and%20Arminianism." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-45df795f4a" data-kw="">
<blockquote><p>[Amyrauldianism] is not… an acceptable form of Calvinism, or even a tenable form of Calvinism. For one thing, it is a logically inconsistent form of Calvinism and therefore an unstable form of Calvinism… …it is impossible to contend that God intends the gift of his Son for all men alike and equally and at the same time intends that it shall not actually save all but only a select body which He Himself provides for it. The schematization of the order of decrees presented by the Amyraldians, in a word, necessarily implies a chronological relation of precedence and subsequence among the decrees, the assumption of which abolishes God, and this can be escaped only by altering the nature of the atonement. And therefore the nature of the atonement is altered by them, and Christianity is wounded at its very heart… A conditional substitution being an absurdity, because the condition is no condition to God, if you grant him even so much as the poor attribute of foreknowledge, they necessarily turn away from a substitutive atonement altogether…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Plan of Salvation (USA: Simpson Publishing Company, rep. 1989)</cite>, pp. 96-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

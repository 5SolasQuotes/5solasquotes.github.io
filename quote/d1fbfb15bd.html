<blockquote><p>Vers. 16. For where a Testament is, there must also of necessity be the death of the Testator.

The second part of the Chapter follows, wherein to take off the scandal of the Cross, he first proves the necessity of Christs death, by six Arguments, to vers. 25. Furthermore the sufficiency of his offering once upon the Cross, he proves it by five [six] Arguments, to the end.

Argum. 1. The New Covenant of Christ, is the New Testament of Christ: Therefore it was necessary that the death of the Testator Christ should intercede.

Vers. 17. For a Testament is of force after men are dead: otherwise it is of no strength at all while the Testator liveth.

Argum. 2. Confirming the former, unless Christ had died, the Covenant or Testament had not been firm, for even amongst men a Testament is not valid while the Testator is alive, but only after his death: For while he lives it may be changed, but not when he is dead: Therefore it was necessary that Christ should die.

Vers. 18. Whereupon, neither the first Testament was dedicated without blood.

Argum. 3. As the Old Testament was not dedicated unto God, without typical blood; so neither the New Testament can be dedicated or offered by way of satisfaction for sinful men, without the true blood of Christ, the true Mediator, the Antitype: Therefore it was necessary Christ should die.

Vers. 19. For when Moses had spoken every Precept to all the people, according to the Law, he took the blood of Calves, and of Goats, with water and Scarlet wool, and hyssop, and sprinkled both the book, and all the people,

20. Saying, This is the Blood of the Testament, which God hath enjoined unto you.

He explicates and proves this Argument out of the History, Exod. 24. concerning the dedication of the first Tabernacle by Blood, where Moses sprinkled the Book of the Covenant, and the people, with the blood of Calves and Goats, withal expounding the signification and use of the ceremony, that that Blood was the Blood of the Covenant, or a symbol of the Covenant typically made in those ceremonies, and truly to be fulfilled in the Blood of Christ.

Vers. 21. Moreover, he sprinkled with blood both the Tabernacle, and all the Vessels of the Ministry.

22. And almost all things are by the Law purged with blood; and without shedding of blood is no remission.

Argum. 4. As under the Law all things were purged either with blood, or washings, drawing virtue to purge from the Sacrifices, so that without typical shedding of blood, there was no remission of sins: So in the New Covenant, there can be no remission of sins, but by the shedding of the Blood of Christ: Therefore the Death of Christ was necessary. The Tabernacle, and the Holy Vessels, which were in themselves without pollution, are said to be sprinkled with blood, because in respect to us, were we not purified by the Blood of Christ, all things become polluted unto us: Therefore the use of the most holy things must be sanctified to us by Christ, otherwise to the impure all things are impure, in as much as in all things, unbelievers pollute themselves.

Vers. 23. It was therefore necessary that the patterns of things in the heavens should be purified with these, but the heavenly things themselves with better Sacrifices than these.

Argum. 5. If the types ought to be purged with typical blood, heavenly things, signified by those types, ought to be consecrated by better Sacrifices, i.e. with the Blood of the Mediator himself, who in his Virtue comprehends all Sacrifices; and by consequence the Death of Christ was necessary.

Vers. 24. For Christ is not entered into the holy places made with hands, which are the figures of the true, but into heaven it self, now to appear in the presence of God for us.

Argum. 6. Confirming the former, Christ is not entered into the typical Holy place, made with hands, but into heaven, signified by the holy place, that constantly appearing there, he might intercede for us: Therefore it behooved him to offer up a more excellent Sacrifice, viz. himself, as much as heaven exceeds the earthly Holy place; and by consequence his death was necessary.</p></blockquote>

<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>

<blockquote><p>Again, that these same men admit in God a certain antecedent will of the salvation of all, he himself also acknowledges. From which it follows that, with much greater right, it is admitted in Christ. Moreover, this antecedent will does not pertain only to this: that God, abstracting from the fall of man, is said to desire the salvation of all, insofar as they are men; but, generally, the antecedent will of God is directed toward that which is right, that which is just, that which is good in itself. Thus, because it is right for man to be converted, to do penance, not to despise the goodness of God, not to reject his graces, to approach the Sacraments—God is considered to will all these things by an antecedent will, although, when the individual circumstances are considered, he has not decreed to confer upon each individual efficacious graces by which they certainly arrive at salvation, without which they certainly fall away from salvation. Therefore God does not desire, by an antecedent will, the salvation of all men merely on this account, that he made all rational creatures for blessedness; but also because, since he diffuses very many graces, both external and internal, among the reprobate, which it is unjust for them to abuse, and since he wills that an entrance into his Church should likewise be open to them, he is considered, by an antecedent will, to will that all arrive at salvation, because he would will that they not remain obstinate in wickedness, and that they make good use of the helps offered to them; although, on the other hand, by a will of justice, when all the circumstances are considered, he judged it better to leave them to their wickedness, and not to grant efficacious aids, by which alone the depravity of the human heart is overcome. Hence it is evident that God wills, by an antecedent will, the salvation both of the demons and of reprobate men; nevertheless, in a very different way in the case of men than in that of demons. For since he now offers no helps of grace to demons, nor wills that an entrance into the Church, or the aid of the sacraments, be open to them, consequently neither does he will them to make good use of his grace, which he now grants none to them. But, on the contrary, since men are still on the way, he must be thought, by an antecedent will, to desire for them conversion and a sincere return to himself and a good use of his graces, from which he by no means bars them—none of which he provides toward demons. That antecedent will, moreover, often seems to have been in Christ, as when he wept over Jerusalem and lamented its coming calamities in these words: “Luke says, ‘He wept over it, saying, If you also had known, and indeed in this your day, the things which are for your peace! But now they are hidden from your eyes, because days will come upon you, and your enemies will surround you with a rampart,’ etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Again, that these same men admit in God a certain antecedent will of the salvation of all, he himself also acknowledges. From which it follows that, with much greater right, it is admitted in Christ. Moreover, this antecedent will does not pertain only to this: that God, abstracting from the fall of man, is said to desire the salvation of all, insofar as they are men; but, generally, the antecedent will of God is directed toward that which is right, that which is just, that which is good in itself. Thus, because it is right for man to be converted, to do penance, not to despise the goodness of God, not to reject his graces, to approach the Sacraments—God is considered to will all these things by an antecedent will, although, when the individual circumstances are considered, he has not decreed to confer upon each individual efficacious graces by which they certainly arrive at salvation, without which they certainly fall away from salvation. Therefore God does not desire, by an antecedent will, the salvation of all men merely on this account, that he made all rational creatures for blessedness; but also because, since he diffuses very many graces, both external and internal, among the reprobate, which it is unjust for them to abuse, and since he wills that an entrance into his Church should likewise be open to them, he is considered, by an antecedent will, to will that all arrive at salvation, because he would will that they not remain obstinate in wickedness, and that they make good use of the helps offered to them; although, on the other hand, by a will of justice, when all the circumstances are considered, he judged it better to leave them to their wickedness, and not to grant efficacious aids, by which alone the depravity of the human heart is overcome. Hence it is evident that God wills, by an antecedent will, the salvation both of the demons and of reprobate men; nevertheless, in a very different way in the case of men than in that of demons. For since he now offers no helps of grace to demons, nor wills that an entrance into the Church, or the aid of the sacraments, be open to them, consequently neither does he will them to make good use of his grace, which he now grants none to them. But, on the contrary, since men are still on the way, he must be thought, by an antecedent will, to desire for them conversion and a sincere return to himself and a good use of his graces, from which he by no means bars them—none of which he provides toward demons. That antecedent will, moreover, often seems to have been in Christ, as when he wept over Jerusalem and lamented its coming calamities in these words: “Luke says, ‘He wept over it, saying, If you also had known, and indeed in this your day, the things which are for your peace! But now they are hidden from your eyes, because days will come upon you, and your enemies will surround you with a rampart,’ etc.”

<blockquote><p>Let us then see what the kingdom of Christ is, which begins in the faithful in this world… The kingdom of Christ in this world is the administration of salvation, whereby Jesus Christ the king Himself, outwardly gathers to Himself through the Gospel and sacrament of baptism, a people or visible Church (in which many hypocrites are mingled) and calls them to salvation, and administers and gives Himself the same salvation to which He calls them, in those whom He accounts for his elect in this congregation…</p></blockquote>

<blockquote><p>I am not, therefore, my dear Sir, surprised or too much grieved to bear the complaints you make of darkness within and without. I never, since I knew the ways of God, admired an easy religion—a religion attended with no conflicts, strivings, wrestlings, swoonings, and strong outcries of felt darkness, unbelief, depravity, and bondage.

There is, indeed, ease, pleasure, and rest to be found in Christ; but it is in the way of much fighting and struggling against our hellish adversaries, who are sure to be at our right hand to resist us, whenever we make an earnest attempt to come to the blessed Saviour, whose power and grace they dread and hate; and when we have got within the glorious city of refuge, and begin to drink of strong consolation, Satan envies every drop of comfort, and will do his utmost to dash the cup of consolation out of our hands.

But by faith we stand, even that faith which against hope believeth in hope; and the strength of our faith lies in the intercession of our High Priest and Advocate within the vail. Behold him holding up your case, in all its circumstances, before the glorious eyes of the Father sitting upon the throne of glory, and saying, “Jehovah rebuke thee, Satan: is not this a brand plucked out of the fire?” It is your part to come in at the back of this great Intercessor, hiding yourself, as it were, amidst the dazzling brightness of his glory, consenting from the heart to his suit, and waiting for the breaking forth of an answer, in your darkened, feeble, and sorrowful soul.

And you must give him time and full liberty to carry on his work, by emptying you from vessel to vessel, sifting you as wheat, burning and melting you in the refining furnace, until seven times pass over you. At length you shall see. him inclining to you, bowing the heavens and coming down, to draw you out of many waters, and to de liver you from the hand of strange children, whose mouth speaketh vanity, and their right hand is a right hand of falsehood.</p></blockquote>

<blockquote><p>3. The Spirit dwells not in our flesh, that is, in our sinful and unrenewed part, for so is flesh taken, Rom. 7; who dreamed that grace dwells in original sin? or if by ‘flesh’ he mean the natural man, or the carnal man, or the outward man that is in our person; he then thinks this outward and natural man, or our body is turned in a spirit, or spiritual nature, so as we are made by justification spiritual as angels; and need no more ordinances, Word, seals, reading the written Scripture, than if we were glorified saints, as Saltmarsh speaks of the believers… If so, then believers, being more spiritual than angels, and so less literal and less carnal, because by imputed righteousness they are Christed and Godded, and so the body of sin destroyed by the the imputed righteousness of Christ, fully and completely, then… nor need they give attendance to reading, nor need they marry, nor can they die, nor sin, as our Saviour says, and that because they are spiritual; if then believers be more spiritual, as Del says, they need far less than angels the written Word, or the preaching of the Law, or any ordinances, nor should they marry, or die, nor can they sin, nor lie, nor whore, nor steal, nor kill, but be as the angels of Heaven. I cannot but profess my jealousy of all Familists, I much fear, when Del says believers are more spiritual than angels; and that the natural man must be made spiritual, which is done (says he) by the imputed righteousnesse of God, pp. 6-7, that he minds, with Mistress Hutchison [of New England], that these who are united to Christ have in this life new bodies, and two bodies, 1 Cor. 6:19. And that the souls of men are mortal, in regard of generation, like the beasts, Eccl. 3:8, but made immortal by the purchase of redemption. And that the Resurrection, Jn. 5:28, is not meant of the Resurrection of the body, but of our union here, and after this life with Christ. And so taught that abominable priest Antony Pocquius, and the Quintists with him (Calvin, An Instruction Against the Libertines, ch. 22, p. 458 [also ch. 23]), with Phyletus and Hymeneus, that the Resurrection of the dead was in this life, and that we are not saved in hope only in this life, but really and completely before we die; and the same perfection of life-eternal in this life is taught by Antinomians, to wit, by Towne and Saltmarsh, the colleague of Del. These must lie upon Antinomians, while they condemn their fathers, the Familists, upon whose principles they walk, which they have never yet done, nor have they denied the foul heresies that are in the story of the Rise, Reign, Ruin of Antinomians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 2 | ch. 84, ‘Master Dell &amp; Saltmarsh deny all outward reformation, all Scripture seals, Ordinances, with Familists, and flee to an Enthuastical Spirit and an internall Word only’, pp. 204-5</span></figcaption>

<blockquote><p>4. The text continues: ‘And these are the signs that will accompany those who believe: in my name they will cast out demons, they will speak new tongues, they will take snakes in their hands, and if they drink any deadly beverage, it will not will do them any harm. They will lay hands on the sick, and they will be healed.’ [Mk. 16:17] That, my brethren, you do not do; does that mean you do not believe? No, of course! These signs were necessary at the beginning of the Church. Faith, in order to grow, had to be nourished. We, too, when planting trees, pour water on them until we have found that they have resumed; but once their roots are fixed in the ground, we stop watering them. Hence Paul’s words: ‘Languages ​​are a sign, not for believers, but for unbelievers.’ (1 Cor 14:22)</p></blockquote>

</figure><figure class="quote" id="q-4f9f5bf5fb" data-kw="">
<blockquote><p>Moreover, God permits: (1) sometimes in express terms (Col. 2:16, 20–21; Gen. 2:16–17; Lev. 11:2–4), when he removes these or those things from among things prohibited; (2) sometimes only by nowhere prohibiting (cf. Rom. 14:14; Acts 10:15); (3) sometimes also in terms of commanding (Deut. 23:20; Gen. 1:28), just as in the same terms of commanding he sometimes expressly prohibits (Num. 22:20; John 13:27).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-mastricht.html">Peter Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 11, section 4, pp. 356-57</span></figcaption>

</figure><figure class="quote" id="q-4c849b76e2" data-kw="">
<blockquote><p>For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 1, pp. 69-72, pp. 71-72</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.”

— Peter Martyr Vermigli, ‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places… (London: Henrie Denham et al., 1583), pt. 1, pp. 69-72, pp. 71-72">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+these+things+%5BMk.+16%3A17-20%5D+are+not+absolutely+and+without+exception%2C+but+in+some+respect+the+tokens+of+faith+belonging+to+that+primitive+Church+until+the+gospel+were+made+more+manifest.+For+miracles+were+as+trumpets+and+open+criers+whereby+the+gospel+was+commended.+For+even+as+the+law+of+Moses+procured+to+itself+credit%2C+through+the+manifold+miracles+showed+upon+mount+Sinai+and+in+the+wilderness%2C+which+afterward+ceased+when+they+were+come+to+the+land+of+promise%3A+so+in+like+manner+miracles+are+now+also+taken+away%2C+seeing+the+gospel+is+spread+throughout+the+world.+And+therefore+the+promise+which+Christ+would+have+to+be+written+in+the+gospel+of+Mark+belonged+not+to+all+times%3B+whereof+it+is+not+our+part+either+to+complain+or+find+any+fault%2C+because+that+we+hear+that+the+Holy+Ghost+distributes+to+everyone+as+He+will%2C+who+nevertheless%2C+for+great+considerations+Him+moving%2C+does+not+impart+to+all+men+gifts+and+graces+alike.+For+if+they+should+happen+to+all+alike%2C+they+would+soon+grow+out+of+estimation%2C+whereas+God+has+determined+to+make+store+of+them.+Moreover%2C+He+would+that+charity+should+grow+and+increase%2C+which+is+then+exercised+when+one+man+does+help+another%2C+which+thing+would+not+have+taken+place+if+all+men+had+been+endued+with+like+gifts.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+%E2%80%98Whether+it+be+lawful+for+the+godly+to+desire+miracles%2C+and+why+there+be+none+in+this+our+age%E2%80%99+in+ch.+9.+%E2%80%98Of+Miracles%2C+%26+the+Definition+%26+Difference+of+Them%E2%80%99+in+The+Common+Places%E2%80%A6+%28London%3A+Henrie+Denham+et+al.%2C+1583%29%2C+pt.+1%2C+pp.+69-72%2C+ <blockquote><p>Argument 7. That opinion is not to be held which lays ground that Christ-Mediator is a temporary king, has under Him magistrates, even heathenish, who have nothing to do with a mediator, to bear a temporal sword for a supernatural and spiritual end, as Christ under-heirs, He himself being the first-heir of all such and so makes heathens within the verge of the Mediatorial Kingdom; as if Christ were as Mediator, a King to heathen and all and everyone of mankind, who must have magistrates, and so [it] makes the Kingdom of men as men, and the Kingdom of Grace commensurable, and of alike latitude and extension, and makes nature and grace of equal comprehension: But such is the former opinion; the proposition cannot be denied, except by Arminians, Socinians, Papists, who do maintain an universal redemption, a grace universal, a catholic Kingdom of Grace comprehensive of all and every man, of Pharaoh, Evil Merodach, Belshazzar, all the kings of Romans, Persians, Assyrians, Chaldeans, and of Turk[s], India, and such as worship the sun and moon, the Devil, and the work of men’s hands…</p></blockquote>

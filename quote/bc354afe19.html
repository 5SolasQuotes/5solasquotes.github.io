<main class="wrap"><figure class="quote" id="q-bc354afe19" data-kw="">
<blockquote><p>If one be a complete stranger to the Scholastics, he shall by no means be able to dispute with the Papists; nor with the Socinians, since these also draw their objections in great part from the Scholastics; and these would buy at great price, if from hatred of Scholastic Theology we all should determine to cast away the technical terms from Theology, a great number of which are actually owed to the Scholastics, and should bind the Theologian to make use only of terms found αὐτολεξεὶ, in express words, in Sacred Scripture. Therefore, thus the terms Trinity, Consubstantial, ὁμοουσίου/homoousios, Christ’s Satisfaction, etc., also should be banished.

But there are technical terms of this sort in Theology, just as there are numeric signs in Arithmetic, and individual letters in Algebra. No less absurdly would you require from a Theologian and Doctor in an Academy, that he send all Theological terms into eternal exile, than if you would require from a Preacher, that in the explanation of the sacred text he make use of no other word than what stands in the Sacred Books. Therefore, Scholastic Theology is to be called into use as far as it or its terms are able to be useful; but all abuse of it is to be avoided …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 26, p. 188.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a11e73fba7" data-kw="">
<blockquote><p>As a result, our faith and theology can be called completely rational, not in that it a priori demonstrates its truth necessarily with arguments in opposition to those who deny the basic assumptions of the Christian religion, but in that it demonstrates its conclusions from the authority of Scripture and with arguments derived from Scripture in opposition to those who accept something [aliquod] of the things that are revealed in a divine manner; and in that it at least refutes the arguments of those who accept nothing of it, namely those arguments by which they charge our faith with contradiction and absurdity, as Thomas [Aquinas] correctly distinguishes in his Summa theologiae, part I, quaestio 1, article 8 [‘Whether Sacred Doctrine is a Matter of Argument’]. Add to this that [reason], by directly attacking false theology, consequently and indirectly defends true theology, that is, by clearing away impediments and prejudices, and so paving the way to the truth. A similar defense of the fatih can be seen in Athenagoras, Justin Martyr, Clement of Alexandria, Origen, Tertullian, Arnobius, Lactantius, Augustine, Theodoret, Cyril of Alexandria, and so forth; in the medieval writers Thomas Against the Pagans and the other scholastics, if one with discretion and discernment takes the more solid excerpts; as well as Savonarola in The Triumph of the Cross; Raymond of Sabunde [d. 1436] in On Natural Theology; Cardinal Cusanus, Dionysius the Carthusian and others who wrote against the Muslims; and finally, more recent writers such as Louis Vives [d. 1540], Agostino Steuco [d. 1548], Charron [d. 1603], the scholastics who treat quaestiones and the commentators on Lombard and Thomas, but especially Du Plessis [Mornay] [1623] in his excellent treatise On the Truth of the Christian Religion. To this list we could add the adversaries of the Socinians whom we have already cited elsewhere [previously in the disputation].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, ‘The Use of Reason in Matters of Faith’, pp. 229-30</span></figcaption>

</figure><figure class="quote" id="q-a9258de8cc" data-kw="">
<blockquote><p>1. Concerning metaphysics to be produced by the Reformed, long before me the most learned men from all sides have thought much; and who, if even the least leisure had been theirs from their affair, would here easily have borne off the prize. [William] Twisse pities the fate of Christianity that until now the students of our [reformed] academies have used no other instructors but Jesuits: and they hope to be able to aspire to the arduous progress of things where it lies open by natural light by such masters. Yet who would have been more fit than him to undertake this labor for the sake of the theological youth? Who would have more suitably cleansed that Augean stable of the Jesuits; and thus through natural reason would have paved for us the royal way to the innermost parts of sacred theology? lest the enemies of the Orthodox religion through first philosophy, defiled and polluted by them, should make a straight attack on pure and sacred theology. But that most famous man has departed; and what others would have not undeservedly demanded from him, he in vain desired in others. Must therefore so great a work be put off to the coming of Elijah or of Christ the Savior? Not indeed. Provision must especially be made for those who will one day propose the mysteries of God to the people. Provision must be made as quickly as possible, lest like the Israelites the students be perpetually compelled to borrow arms from the Philistines, the enemies of divine truth. I designate the writings of the Jesuits, which certainly are not traversed safely enough by studious youth, because they prepare the way to Pelagianism, Skepticism, Libertinism and many other things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-voet.html">Paul Voet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Philosophy Reformed</cite>, tr. by AI by Onku (Utrecht: Johann Waesberg, 1657) Latin, ch. 1 ch. 2, pt. 1, 2; ch. 1</span></figcaption>

<blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>

<blockquote><p>XIV. Although the philosopher may be allowed to begin with a doubt in order to a safer investigation of natural things, yet this cannot be introduced into subjected of theology and faith. They are founded upon certain and indubitable principles and truths known per se, to doubt concerning which is impious (as concerning the existence of God) unless we wish to strip ourselves of conscience and the moral dependence on the Creator (which cannot be shaken off or for a moment rejected without crime) and thus to introduce philosophical doubt (epochen) into religion and render the whole of theology sceptical.</p></blockquote>

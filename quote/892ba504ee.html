<main class="wrap"><figure class="quote" id="q-892ba504ee" data-kw="">
<blockquote><p>The second sort of divines (Contra-Remonstrants) [that is, those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ddd2ba5cf" data-kw="">
<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology, Part I</cite>, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God</span></figcaption>

</figure><figure class="quote" id="q-9f715a8a9e" data-kw="">
<blockquote><p>God made man upright, gave him a righteous law, which, when broken, that all hopes might not be cut off, He sent his Son: Rom. 8:3, ‘God sending his own Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh,’ to be the foundation of a new covenant; offered you grace in Him, pardon of all your sins past, to help you in the course of obedience for time to come; moved you by powerful arguments, not by low and cheap considerations, but those of the greatest weight, the joys of heaven, the torments of hell; called upon you often by the ministry, knocked at your hearts as well as your ears by his Spirit; waited for your amendment for many years, tried you by mercies if they could melt you, by afflictions if they would reduce you to a sense of your duty. But all this will not do; yet you are still alive, and these means continued. What shall God do more? Now why are you not converted? Others are wrought upon by the same means and turned to the Lord, and have entered in by the strait gate, and framed their desire to walk in the narrow way. They have not offers more rich, or free, or particular. God has not told them of a hotter hell or a better heaven, or another or a more taking gospel. God speaks to you and them in the same terms, with the same grace and favor, and makes the door wide enough to get in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon</cite>, 2</span></figcaption>

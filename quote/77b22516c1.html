<blockquote><p>[About the Church of England:] She is the very eye of all the Churches, the peculiar of Christ, the refuge of the afflicted, the arsenal of the weak, the storehouse of the poor, the standard of better hope… [Diodati laments that] in the civil wars this illustrious fold of Christ should be torn in pieces, not by wild beasts indeed; and plundered, though not by robbers; but by the sheep themselves enraged against one another: A thing without example, and never heard of before in the Reformed Churches. We are all struck with horror when we hear of the battles that are fought by the people against their king; by brethren against brethren; by children against their parents; and by the flock of Christ against one another, and against the shepherds themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Westminster Assembly</cite>, Letter 12, p. 14, as quoted in Robert Burscough, A Vindication of a Discourse of Schism… (Exeter: Farley, 1701), Preface, p. vi</span></figcaption>

ank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-34b6d80a75" data-kw="">
<blockquote><p>X. If I say that God, pitying mankind, who through their own crime and the devil’s deceit have fallen into sin and destruction, sent His only-begotten Son. He became man for the sake of men, suffered and died, rose again, and ascended into heaven, obtaining remission of sins and eternal life for them. This great benefit of His Son, God makes known and proclaims to men through the preaching of the Gospel. Those who acknowledge and grieve over their sins, assent to the Gospel, believe in the Son, and trust in His merit and death, are reconciled to God, obtain remission of sins, and are transferred from a state of wrath and damnation to a state of glory and salvation, in which they will remain and surely become partakers of eternal glory, if, since they have believed and been reconciled to God, they strive to observe the divine commandments, do not live according to the flesh, and, with the help of divine grace, avoid committing sins against conscience. Thus, a man will be justified in this life and glorified in the future. If, I say, we use such words, taken from common usage and easily understood by anyone, there can be no disagreement among pious and gentle Christians about the doctrine. No one of them, unless afflicted by a vile and malicious urge to contend and quibble, will question this. But if I say, this is the principal efficient cause; this is the proximate principal cause; this is instrumental on the part of God, this on the part of man; this is merely a disposition; this is the formal cause itself; this is material, this necessary per se, this according to the hypothesis, if I start speaking this way, then it may easily happen that some will misunderstand or plainly not understand me, or interpret me differently than I intend; and thus, a controversy will arise over the use and application of such terms, which is purely scholastic and should not be given such importance that it disrupts the bond of Christian love and concord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-calixt.html">George Calixt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus</cite>, tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><figure class="quote" id="q-14b682a887" data-kw="">
<blockquote><p>Let us hear no more paraenetics for toleration or liberty of conscience: but as many as you will for a just and merciful accommodation… If you be the sons of peace, you shall be characterized by this shibboleth, you will call for accommodation, not for toleration; for one way, not for two. ‘Let there be no strife between us and you, for we be brethren: and is not the Canaanite and the Perizzite yet in the land?’ (Gen. 13:7-8) O let it not be told in Gath, nor published in the streets of Ashkelon, Let it not be said, that there can be no unity in the Church without prelacy. … It shall be no grief of heart to you afterward that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Act. 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’ Alas, how shall our divisions and contentions hinder the preaching and learning of Christ, and the edifying one another in love! Is Christ divided? says the apostle. There is but one Christ, yea the Head and the Body makes one Christ, so that you cannot divide the Body without dividing Christ. Is there so much as a seam in all Christ’s garment? Is it not woven throughout from the top to the bottom? Will you have one half of Israel to follow Tibni, and another half to follow Omri? O brethren, we shall be one in heaven, let us pack up differences in this place of our pilgrimage the best way we can. … Brethren, it is not impossible, pray for it, endeavor it, press hard toward the mark of accommodation. How much better is it that you be one with the other Reformed Churches, though somewhat straitened and bound up, than to be divided though at full liberty and elbow-room?” … I am persuaded if there were but a right understanding one of another’s intentions, the accommodation I speak of would not be difficult. Brethren, if you will not hearken to wholesome counsel, you shall be the more inexcusable… Therefore love the truth and peace, Yea, seek peace and pursue it. Consider what I say. The Lord guid your feet in the way of peace. And O that God would put it in your hearts to cry down toleration and to cry up accommodation!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty</cite>, (London, 1645) | A Paraenetic</span></figcaption>

<blockquote><p>6. Above all, see that you be followers of peace and unity, both in the Church and among your selves. Remember what I taught you on Heb. 12:14, he that is not a son of peace is not a son of God. All other sins destroy the Church consequentially, but division and separation demolish it directly. Building the Church is but an orderly joining of the materials; and what then is disjoining, but pulling down? Many doctrinal differences must be tolerated in a Church: And why? but for unity and peace? Therefore disunion and separation is utterly intolerable. Believe not those to be the Church’s friends that would cure and reform her by cutting her throat. Those that say, ‘No truth must be concealed for peace,’ have usually as little of the one as the other. Study Gal. 2:2; Rom. 14:1, etc. Acts 21:24, 26; 1 Tim 1:4 and 6:4; Tit. 3:8-9. I hope sad experience speaks this lesson to your very hearts, if I should say nothing. Do not your hearts bleed to look upon the state of England? and to think how few towns or cities there be (where is any forwardness in religion) that are not cut into shreds and crumbled as to dust by separations and divisions? To think what a wound we have hereby given to the very Christian name? How we have hardened the ignorant? Confirmed the Papists? And are ourselves become the scorn of our enemies and the grief of our friends? And how many of our dearest, best esteemed friends are fain to notorious pride or impiety? yea, some to be worse then open infidels? These are pillars of salt; see that you remember them. You are yet eminent for your unity, steadfastness, and godliness; hold fast that you have, that no man take your crown from you… If there be erroneous practices in the Church, keep yourselves innocent with moderation and peace: Do your best to reform them and rather remove your dwellings if you cannot live innocently, than rend the Church. It must be no small error that must force a separation… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Everlasting Rest</cite>, (London: White, 1650), ‘To my dearly beloved friends’</span></figcaption>

n… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.”

<blockquote><p>There is a great difference between inimical segregation, like sedition in a commonwealth; and a going severally upon weighty reasons and without breach of charity. And among other weighty reasons [for this,] this may be one: That all Christians of sound faith and good life, that are dissatisfied about some human injunctions and orders in a Church, may not for lack of tender regard towards them be utterly abandoned and exposed to be led aside into the errors of the wicked, as to heresy, apostasy or a course of irreligion. It is in the power of rulers to grant this indulgence to such dissenters, when it is not in the power of dissenters to change their judgments. And this is not to set up Church against Church, or according to an ancient manner of speaking, altar against altar, but only either occasional and temporary assemblies, or at the most but diverse churches distinguished by their several places of assembling, as one parish-church from another; and by diversity of external order, as the allowed congregations of foreigners in London from the parish churches. The same true religion for the substance thereof, is exercised; and the same holy ends are pursued in the one and the other. And there will be no opposition between them but what an unchristian enmity, proceeding from worldly lusts and interests, will produce. … After such [a] Comprehension [be] setled, the toleration of all tolerable dissenters within such limits as will secure public peace and safety, is more agreeable to the wisdom and clemency of rulers, and the charity of Christians, than the rigorous constraining of the said dissenters to what they cannot bear and the restraining of them from the liberty of serving God according to their consciences.</p></blockquote>

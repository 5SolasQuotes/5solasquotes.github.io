<main class="wrap"><figure class="quote" id="q-9e577bf8a5" data-kw="">
<blockquote><p>That opinion that the soul is by an immediate creation infused, how generally soever it is received, yet never was thought of force to render the way of marriage useless for procreation; God infuses not a soul by creation into any, but an organized body, an embryo fitted to receive it.</p></blockquote>

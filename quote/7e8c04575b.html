<main class="wrap"><figure class="quote" id="q-7e8c04575b" data-kw="">
<blockquote><p>Now from all this I would enforce this duty upon your consciences, to search the Scriptures if you think to have eternal life; search them if ye would know Christ, whom to know is life eternal; then again search them, for these are they that testify of him. Searching imports diligence,—much diligence,— ’tis a serious work; it is not a common seeking of an easy and common thing, but a search and scrutiny for some hidden thing, for some special thing.

It is not bare reading of the Scriptures that will answer this duty, except it be diligent and daily reading; and it is not that alone, except the spirit within meditate on them, and by meditation accomplish a diligent search. There is some hidden secret that you must search for that is enclosed within the covering of words and sentences. There is a mystery of wisdom that you must apply your hearts to search out, Eccl. 7.25. Jesus Christ is the treasure that is hid in this field. O a precious treasure of eternal life! …

If you would profit by the Scriptures, you must bring both your understanding and your affections to them, and depart not till they both return full. If you bring your understanding to seek the truth, you may find truth, but not truly; you may find it, but you are not found of it. You may lead truth captive, and enclose it in a prison of your mind, and encompass it about with a guard of corrupt affections, that it shall have no issue, no outgoing to the rest of your souls and ways, and no influence on them. You may know the truth, but you are not known of it, nor brought into captivity to the obedience of it.

The treasure that is hid in the Scriptures is Jesus Christ, whose entire and perfect name is, Way, Truth, and Life. He is a living truth and true life; therefore Christ is the adequate object of the soul, commensurable to all its faculties. He has truth in him to satisfy the mind; and has life and goodness in him to satiate the heart; therefore if thou wouldest find Jesus Christ, bring thy whole soul to seek him, as Paul expresseth it. He is true and faithful, and worthy of all acceptation, then bring thy judgment to find the light of truth, and thy affections to embrace the life of goodness that is in him.

Now, as much as ye find of him, so much have ye profited in the Scriptures. If you find commands there which you cannot obey, search again, and you may find strength under that command. Dig a little deeper, and you shall find Jesus the end of an impossible command. And when you have found him, you have found life and strength to obey, and you have found a propitiation and sacrifice for transgressing and not obeying. If you find curses in it, search again, and you shall find Jesus Christ under that, “made a curse for us”; you shall find him ‘the end of the law for righteousness to every one that believes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 50-51.</span></figcaption>

<blockquote><p>Shortly after that the people of Israel, I mean the tribes of Juda, Benjamin, and Levi, were, by the miraculous work of God, after the bondage of seventy years, set at liberty and brought again to Jerusalem; in which they did re-edify the temple, repair the walls, and begin to multiply, and so to grow to some strength within the city and land; they fall to their old nature, I mean to be ungrate and unthankful unto God. The people were slothful; and the priests, who should have provoked the people to the remembrance of those great benefits, were become even like to the rest. The Lord therefore did raise up his Prophet Malachi (who was the last before Christ) sharply to rebuke, and plainly to convict this horrible ingratitude of that unthankful nation, who so shamefully had forgotten those so great benefits recently bestowed upon them. And thus begins he his Prophecy: “I have loved you, sayeth the Lord,” in which words he speaks not of a common love, which in preserving and feeding all creatures is common to the reprobate, but of that love by the which he had sanctified and separated them from the rest of nations, to have his glory manifested. But because they (as all ungrate persons do) did not consider wherein this his love towards them more then towards others did stand, he brings them to the fountain, demanding this question: “Was not Esau brother to Jacob? saith the Lord, and nevertheless Jacob have I loved, and Esau I have hated.” And this he proves, not only by the diversity of the two countries which were given to their posterities, but also by that, that God continually showed himself loving to Jacob and to his posterity [which group of people included reprobates], reducing them again after long captivity; declaring himself, as it were, enemy to Edom, whose desolation he would never restore, but would destroy that which they should go about to build.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On Predestination” in The Works of John Knox</cite>, ed. David Laing (Edinburgh: J. Thin, 1895), 5:150-51</span></figcaption>

<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans… followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans… believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>

<blockquote><p>Hence the promises of the Gospel are indefinite, not universal, and in the Lord’s purpose and intention made with the Elect only, not with the Reprobate at all, for when God saith, if Judas, Cain, Pharaoh, believe they shall be saved, the Lords purpose being to deny to them the grace of believing, without which it is unpossible they can believe, the promise in God’s purpose is not made with them: He that so willeth what he promiseth upon a condition, which he that so willeth, only can do and work, and yet will not do or work the condition; he doth indeed not will to the party, what is so promised, if John send Peter to work in his garden upon condition, that if he work, he shall give him a talent a day, and in the mean while John only can give to Peter strength of legs, and arms, and body to work, can determine his consent to the work, and yet refuse to give strength, and to win his consent to the work; Sure he never willed either to give him a talent for his work, nor intended he should work at all.

Hence I argue, it is against the wisdom of God to intend and will that the Reprobate be redeemed, pardoned, saved, upon a condition, which he himself only can work by his grace, and absolutely and irresistibly will not work. Now in Scripture such a thing is argued not to be done, because the Scripture must be fulfilled; and the decree of God and his will fulfilled, as Christ’s bones upon this ground, could not be broken, and such a thing is done that the Scripture, and so the will and decree of God might be fulfilled, so that which is never done, is simply God’s will it shall never be done; that which is done is simply God’s will it must be; I mean either his permissive or approving will; and the will of God revealing, what is the duty of Reprobates though it never be done, argues it was not simply the will of God; hence that voluntas signi, in which God reveals what is our duty, and what we ought to do; not what is his decree, or what he either will, or ought to do, is not God’s will properly, but by a figure only, for commands, and promises, and threatnings revealed, argue not the will and purpose, decree or intention of God, which are properly his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself, or, A survey of our Saviour in his soul-suffering, his loveliness in his death, and the efficacy thereof</cite>, (London: Andrew Crooke, 1647), pp 415-16.</span></figcaption>

Hence I argue, it is against the wisdom of God to intend and will that the Reprobate be redeemed, pardoned, saved, upon a condition, which he himself only can work by his grace, and absolutely and irresistibly will not work. Now in Scripture such a thing is argued not to be done, because the Scripture must be fulfilled; and the decree of God and his will fulfilled, as Christ’s bones upon this ground, could not be broken, and such a thing is done that the Scripture, and so the will and decree of God might be fulfilled, so that which is never done, is simply God’s will it shall never be done; that which is done is simply God’s will it must be; I mean either his permissive or approving will; and the will of God revealing, what is the duty of Reprobates though it never be done, argues it was not simply the will of God; hence that voluntas signi, in which God reveals what is our duty, and what we ought to do; not what is his decree, or what he either will, or ought to do, is not God’s will properly, but by a figure only, for commands, and promises, and threatnings revealed, argue not the will and purpose, decree or intention of God, which are properly his will.”

— Samuel Rutherford, Christ dying and drawing sinners to himself, or, A survey of our Saviour in his soul-suffering, his loveliness in his death, and the efficacy thereof, (London: Andrew Crooke, 1647), pp 415-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+the+promises+of+the+Gospel+are+indefinite%2C+not+universal%2C+and+in+the+Lord%E2%80%99s+purpose+and+intention+made+with+the+Elect+only%2C+not+with+the+Reprobate+at+all%2C+for+when+God+saith%2C+if+Judas%2C+Cain%2C+Pharaoh%2C+believe+they+shall+be+saved%2C+the+Lords+purpose+being+to+deny+to+them+the+grace+of+believing%2C+without+which+it+is+unpossible+they+can+believe%2C+the+promise+in+God%E2%80%99s+purpose+is+not+made+with+them%3A+He+that+so+willeth+what+he+promiseth+upon+a+condition%2C+which+he+that+so+willeth%2C+only+can+do+and+work%2C+and+yet+will+not+do+or+work+the+condition%3B+he+doth+indeed+not+will+to+the+party%2C+what+is+so+promised%2C+if+John+send+Peter+to+work+in+his+garden+upon+condition%2C+that+if+he+work%2C+he+shall+give+him+a+talent+a+day%2C+and+in+the+mean+while+John+only+can+give+to+Peter+strength+of+legs%2C+and+arms%2C+and+body+to+work%2C+can+determine+his+consent+to+the+work%2C+and+yet+refuse+to+give+strength%2C+and+to+win+his+consent+to+the+work%3B+Sure+he+never+willed+either+to+give+him+a+talent+for+his+work%2C+nor+intended+he+should+work+at+all.%0A%0AHence+I+argue%2C+it+is+against+the+wisdom+of+God+to+intend+and+will+that+the+Reprobate+be+redeemed%2C+pardoned%2C+saved%2C+upon+a+condition%2C+which+he+himself+only+can+work+by+his+grace%2C+and+absolutely+and+irresistibly+will+not+work.+Now+in+Scripture+such+a+thing+is+argued+not+to+be+done%2C+because+the+Scripture+must+be+fulfilled%3B+and+the+decree+of+God+and+his+will+fulfilled%2C+as+Christ%E2%80%99s+bones+upon+this+ground%2C+could+not+be+broken%2C+and+such+a+thing+is+done+that+the+Scripture%2C+and+so+the+will+and+decree+of+God+might+be+fulfilled%2C+so+that+which+is+never+done%2C+is+simply+God%E2%80%99s+will+it+shall+never+be+done%3B+that+which+is+done+is+simply+God%E2%80%99s+will+it+must+be%3B+I+mean+either+his+permissive+or+approving+will%3B+and+the+will+of+God+revealing%2C+what+is+the+duty+of+Reprobates+though+it+never+be+done%2C+argues+it+was+not+simply+the+will+of+God%3B+hence+that+voluntas+signi%2C+in+which+God+reveals+what+is+our+duty%2C+and+what+we+ought+to+do%3B+not+what+is+his+decree%2C+or+what+he+either+will%2C+or+ought+to+do%2C+is+not+God%E2%80%99s+will+properly%2C+but+by+a+figure+only%2C+for+commands%2C+and+promises%2C+and+threatnings+revealed%2C+argue+not+the+will+and+purpose%2C+decree+or+intention+of+God%2C+which+are+properly+his+will.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+dying+and+drawing+sinners+to+himself%2C+or%2C+A+survey+of+our+Saviour+in+his+soul-suffering%2C+his+loveliness+in+his+death%2C+and+the+efficacy+thereof%2C+%28London%3A+Andrew+Crooke%2C+1647%29%2C+pp+415-16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb72348cc45.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b72348cc45.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/19/samuel-rutherford-does-god-intend-the-salvation-of-the-reprobate/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Fallen, sinful man stands in need of the utmost encouragement that divine condescension can extend unto, to prevail with him to receive and lay hold of the promise of grace and mercy by Jesus Christ. There is nothing that we are so prone unto, as to distrust the promises of God; nothing that we are with more difficulty won over unto, than to mix them with faith. To evidence this we may consider,— 1. That the first entrance of sinto the world was by a disbelief of the truth of God; yea, that very sin formally consisted in an apprehension that God, in his promises and threatenings, had a mind to deceive us, Gen. 3:4–6. And as sin thus laid its foundation by the craft of Satan, so it endeavours to carry on its building. It continually suggests to the hearts and minds of men that they shall certainly be deceived in trusting to God’s promises. For,— (1.) Secret thoughts there are in the hearts of men,—which are “deceitful above all things, and desperately wicked,”—that neither the promises nor threatenings of God are true, in the terms and sense wherein they are proposed unto them. They neither think that it shall be so bad with any as he threateneth, nor so well as he promiseth. Did men believe the threatenings of God as to the fearful and eternal ruin of sinners, it were not possible they should live in sin as they do, without any endeavour of amendment, so to flee from the wrath to come. Nor do they think in their hearts that it shall be with them that believe according as God hath promised. They say in their hearts, “The Lord will not do good, neither will he do evil,” Zeph. 1:12,—namely, as he hath either promised or threatened. (2.) Men think that there are still some reserves and latent conditions in the promises and threatenings of God, and that God knows it shall be otherwise than they seem to portend. By this imagination Satan deceived our first parents as to the truth of God in his threatening. He persuaded them that there was a reserve therein, that was directly contrary unto what the words of it declared; and that by transgressing of his command they should not die, but be wise and like himself. And still men suppose that the promises propose a fair ground, indeed, but that if they should go to build upon it, there is a mine under it, which would be sprung at one time or another, unto their ruin. They cannot apprehend that it shall be with them according unto and as the promise doth declare. If they should attempt to believe, yet one latent condition or other would defeat them of obtaining it; whereas, indeed, the whole and entire condition of enjoying the promise is faith alone. (3.) Whatever may be the truth of the promise, yet they cannot conceive that God intends them therein; whereas yet there is no declaration or intention of God, whereby our duty is to be regulated and whereon we shall be judged, but what is contained and expressed in the proposal of the promise itself. On these and the like grounds, the great contest in the world, between God and man, is whether God be true or a liar in his promise. It is not thus directly stated in the minds of men, for they have many other pretences why they do not believe; but this is that which it is resolved into. For “he that receiveth not the testimony of God, maketh him a liar.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-075824cdf1" data-kw="">
<blockquote><p>Goodwin’s argument makes as much against Christ and the apostles as against us, for they could never in all their sermons and writings so frequently bottom and found the faith on &lt;Greek&gt; ‘as it is written in the Prophets,’ ‘as David saith,’ ‘as Isaiah saith,’ and Hosea, ‘as Daniel saith,’ as Moses and Samuel, and all the Prophets bear witness, if they had had no other certainty, that the writings of the Prophets, that came to their hands, was the very word of God, but the credit, learning and authority of men, as Mr. [John] Goodwin says, for sure Christ and the apostles and evangelists had not the authentic and first copies of Moses and the prophets, but only copies written by men, who might mistake, printers and translators not being then, more than now, immediately inspired Prophets, but fallibly men, and obnoxious to failings, mistakes and ignorance of ancient Hebraisms and force of words; and if ye remove an unerring providence, who doubts but men might add a &lt;Hebrew&gt; or subtract, and so vitiate the fountain sense? and omit points, change consonants, which in the Hebrew and Greek, both might quite alter the sense: Nor can any say, ‘Christ and the Apostles being infallible, could well cite the prophets without a mistake, though the copies might have been vitiate and corrupt, 2. Because the very citing of these testimonies by Christ and his apostles, made them Scripture, and so of infallible authority; but our citing of them, (since both printers and translators are not immediately inspired, and we also might err) cannot adopt them into canonical and authentic Scripture, such as was first written by the immediately inspired prophets.’ I shall answer that first, this objection presumes that Christ and the apostles might, and did, find errors and mis-printings even in written Scripture, which might reduce the Church in after ages to an invincible ignorance in matters of faith, and yet they gave no notice to the Church thereof; or if there was no error de facto, then for so many hundred years, yet there are now substantial errors, and so foul that it may be we have no Word of God at all, amongst us, and God has no Church, no believer on earth, but we must all take the word of printers and translators, which is merely the word of man: And what is become of all the martyrs that suffered by the bloody woman Babel? They died for mere conjectures and opinions, for they had not the first original copies of Moses and the Prophets, yea Stephen the first martyr, who according to all our copies, Acts 7, adds five to Moses, his 70 souls, that went down to Egypt, in that glorious sermon that he has before his death, when he sealed the truth with his blood and died gloriously, and said, ‘Lord Jesus receive my spirit,’ died but upon the faith of men’s fallible skill in grammar, printing and writing; for he cites the writings of Moses to his enemies that stoned him, according to the copies that they then had, who would quickly have controlled him if he had cited false copies, and Stephen’s own testimony was controverter, and therefore except we say that Stephen and Christ and the apostles cited the testimonies of the prophets as they were then obvious to the eyes and reading of both the people of God and the enemies, and that not simply as their own words which they spake as immediately inspired, but as the testimony of the prophets, according to the then written copies, we must say they spake not ingeniously the truth of God, for it was against truth, candor, ingenuity, to Christ and the apostles to say, ‘as it is written in your Law,’ John 8:17, and so often ‘it is written,’ if they would not have the hearers to receive with certainty of faith and full assurance, free from all doubting and fear of humane fallibility, that what they cited as written, was undoubtedly the same very truth of God, and no other, which Moses and the prophets spoke and wrote; and if they would not have them to read, search and believe these same Scriptures, and to conceive that they drew arguments in the New Testament to prove and confirm their doctrine from that which was written by Moses and the prophets in the Old Testament, and would not have them to believe them, only because New Testament writers immediately inspired had so said.

6. If God will have us to try and examine all spirits, all doctrines, by the Scriptures written, then are we certainly assured that the books we now have of the Old and New Testament, are the very Word of God, though we cannot by any possibility have the first and original authentic copies of Moses and the prophets and apostles. Because 1. God would not bid us try, and then leave us no rule to try withal but our own natural light, which must lead us into darkness.

2. The visible Church should not be guilty of unbelief if the written Word were not among us, or then Christ and his apostles speaking to us, as is clear, John 15:22; Rom. 10:14-15; Mt. 11:21-22. The assumption is clear by the commended practice of the Bereans, who tried Paul’s doctrine by the Scriptures, Acts 17. See Rivetus, Whitaker, Calvin.

3. By the command of God, 1 Thess. 5:2; 1 John 4:1; ‘Try all things,’ ‘try the sprits.’

7. John would not call those blessed who read and hear, Rev. 1:5, nor would Paul recommend reading to Timothy, and continuance in the doctrine of the Scriptures, and so extol the necessity and utility of the Scripture and the indwelling of the word of God in us as he does, 1 Tim. 4:16; 2 Tim. 3:14-16; Col. 3:16, nor could the things written by John ch. 21, by Moses and the prophets, Luke 16:29-31, be holden forth as sufficient to bring souls to heaven, and to cause them eschew Hell, if it were true that we ‘have no certainty that the Scripture of the old and New Testament are the very word of God, but such as is made of men’s credit and learning.’

8. Yea and so what God spake immediately to Abraham, Moses and the prophets, could not be infallibly and by certainty of faith to them the Word of God; for if God spake to them in a language intelligible, they had no certainty of faith that the words that came from God did signify thus and thus; for sure, God, by immediate inspiration, taught them not grammar and significations of words, and those that read the Law written by God’s finger on two tables of stone, those who heard Moses and the prophets preach in their mother-tongue, even the Jews who read the original first Hebrew copy of Moses and the prophets, must have had no warrant that that was the Word of God, but the authority of father, mother and nurses, who first taught them their mother-tongue, for sure the prophets were not school-masters to teach them Hebrew; so by this learning there was never since the world was any certainty of faith, but such conjectural human and fallible opinions in all the matters of God as is resolved ultimately (says Mr. Goodwin) into men’s fallible and topic authority and skill of grammar, and all divine faith is perished out of the earth, except God by a supernatural power taught men first grammar, and then to believe, for which we have no warrant, so all our faith must be dreams. And since Mr. Goodwin acknowledges a supernatural power of the Spirit of grace to believe; what else does this Spirit cause us believe, but lies? or at best fancies resolved into human credit? which may be false for any certainty of knowledge that Libertines allow us? … May not reading, interpunction, a parenthesis, a letter, an accent, alter the sense of all fundamentals in the Decalogue? of the principles of the Gospel? and turn the Scripture in all points (which Mr. Doctour restricts to some few darker places, whose senses are off the way to heaven, and less necessary) in a field of problems, and turn all believing into digladiations of wits? all our comforts of the Scriptures into the reelings of a Windmill, and fancies of seven moons at once in the firmament? this is to put our faith and the first-fruits of the Spirit, and Heaven and Hell to the press. But though printers and pens of men may err, it follows not ‘that heresies should be tolerated,’ except we say, 1. that our faith is ultimately resolved upon characters, and the faith of printers. 2. We must say we have not the clear and infallible word of God, because the Scripture comes to our hand by fallible means, which is a great inconsequence, for though scribes, translators, grammarians, printers, may all err, it follows not that an erring providence of Him that has seven eyes, has not delivered to the Church, the Scriptures containing the infallible truth of God. Say that Baruch might err in writing the prophesy of Jeremiah, it follows not that the prophesy of Jeremiah, which we have, is not the infallible Word of God; if all translators and printers did their alone watch over the Church, it were something, and if there were not one with seven eyes to care for the Scripture. But for tradition, councils, popes, fathers, they are all fallible means, and so far forth to be believed as they bring Scripture with them.</p></blockquote>

inspired+prophets.%E2%80%99+I+shall+answer+that+first%2C+this+objection+presumes+that+Christ+and+the+apostles+might%2C+and+did%2C+find+errors+and+mis-printings+even+in+written+Scripture%2C+which+might+reduce+the+Church+in+after+ages+to+an+invincible+ignorance+in+matters+of+faith%2C+and+yet+they+gave+no+notice+to+the+Church+thereof%3B+or+if+there+was+no+error+de+facto%2C+then+for+so+many+hundred+years%2C+yet+there+are+now+substantial+errors%2C+and+so+foul+that+it+may+be+we+have+no+Word+of+God+at+all%2C+amongst+us%2C+and+God+has+no+Church%2C+no+believer+on+earth%2C+but+we+must+all+take+the+word+of+printers+and+translators%2C+which+is+merely+the+word+of+man%3A+And+what+is+become+of+all+the+martyrs+that+suffered+by+the+bloody+woman+Babel%3F+They+died+for+mere+conjectures+and+opinions%2C+for+they+had+not+the+first+original+copies+of+Moses+and+the+Prophets%2C+yea+Stephen+the+first+martyr%2C+who+according+to+all+our+copies%2C+Acts+7%2C+adds+five+to+Moses%2C+his+70+souls%2C+that+went+down+to+Egypt%2C+in+that+glorious+sermon+that+he+has+before+his+death%2C+when+he+sealed+the+truth+with+his+blood+and+died+gloriously%2C+and+said%2C+%E2%80%98Lord+Jesus+receive+my+spirit%2C%E2%80%99+died+but+upon+the+faith+of+men%E2%80%99s+fallible+skill+in+grammar%2C+printing+and+writing%3B+for+he+cites+the+writings+of+Moses+to+his+enemies+that+stoned+him%2C+according+to+the+copies+that+they+then+had%2C+who+would+quickly+have+controlled+him+if+he+had+cited+false+copies%2C+and+Stephen%E2%80%99s+own+testimony+was+controverter%2C+and+therefore+except+we+say+that+Stephen+and+Christ+and+the+apostles+cited+the+testimonies+of+the+prophets+as+they+were+then+obvious+to+the+eyes+and+reading+of+both+the+people+of+God+and+the+enemies%2C+and+that+not+simply+as+their+own+words+which+they+spake+as+immediately+inspired%2C+but+as+the+testimony+of+the+prophets%2C+according+to+the+then+written+copies%2C+we+must+say+they+spake+not+ingeniously+the+truth+of+God%2C+for+it+was+against+truth%2C+candor%2C+ingenuity%2C+to+Christ+and+the+apostles+to+say%2C+%E2%80%98as+it+is+written+in+your+Law%2C%E2%80%99+John+8%3A17%2C+and+so+often+%E2%80%98it+is+written%2C%E2%80%99+if+they+would+not+have+the+hearers+to+receive+with+certainty+of+faith+and+full+assurance%2C+free+from+all+doubting+and+fear+of+humane+fallibility%2C+that+what+they+cited+as+written%2C+was+undoubtedly+the+same+very+truth+of+God%2C+and+no+other%2C+which+Moses+and+the+prophets+spoke+and+wrote%3B+and+if+they+would+not+have+them+to+read%2C+search+and+believe+these+same+Scriptures%2C+and+to+conceive+that+they+drew+arguments+in+the+New+Testament+to+prove+and+confirm+their+doctrine+from+that+which+was+written+by+Moses+and+the+prophets+in+the+Old+Testament%2C+and+would+not+have+them+to+believe+them%2C+only+because+New+Testament+writers+immediately+inspired+had+so+said.+6.+If+God+will+have+us+to+try+and+examine+all+spirits%2C+all+doctrines%2C+by+the+Scriptures+written%2C+then+are+we+certainly+assured+that+the+books+we+now+have+of+the+Old+and+New+Testament%2C+are+the+very+Word+of+God%2C+though+we+cannot+by+any+possibility+have+the+first+and+original+authentic+copies+of+Moses+and+the+prophets+and+apostles.+Because+1.+God+would+not+bid+us+try%2C+and+then+leave+us+no+rule+to+try+withal+but+our+own+natural+light%2C+which+must+lead+us+into+darkness.+2.+The+visible+Church+should+not+be+guilty+of+unbelief+if+the+written+Word+were+not+among+us%2C+or+then+Christ+and+his+apostles+speaking+to+us%2C+as+is+clear%2C+John+15%3A22%3B+Rom.+10%3A14-15%3B+Mt.+11%3A21-22.+The+assumption+is+clear+by+the+commended+practice+of+the+Bereans%2C+who+tried+Paul%E2%80%99s+doctrine+by+the+Scriptures%2C+Acts+17.+See+Rivetus%2C+Whitaker%2C+Calvin.+3.+By+the+command+of+God%2C+1+Thess.+5%3A2%3B+1+John+4%3A1%3B+%E2%80%98Try+all+things%2C%E2%80%99+%E2%80%98try+the+sprits.%E2%80%99+7.+John+would+not+call+those+blessed+who+read+and+hear%2C+Rev.+1%3A5%2C+nor+would+Paul+recommend+reading+to+Timothy%2C+and+continuance+in+the+doctrine+of+the+Scriptures%2C+and+so+extol+the+necessity+and+utility+of+the+Scripture+and+the+indwelling+of+the+word+of+God+in+us+as+he+does%2C+1+Tim.+4%3A16%3B+2+Tim.+3%3A14-16%3B+Col.+3%3A16%2C+nor+could+the+things+written+by+John+ch.+21%2C+by+Moses+and+the+prophets%2C+Luke+16%3A29-31%2C+be+holden+forth+as+sufficient+to+bring+souls+to+heaven%2C+and+to+cause+them+eschew+Hell%2C+if+it+were+true+that+we+%E2%80%98have+no+certainty+that+the+Scripture+of+the+old+and+New+Testament+are+the+very+word+of+God%2C+but+such+as+is+made+of+men%E2%80%99s+credit+and+learning.%E2%80%99+8.+Yea+and+so+what+God+spake+immediately+to+Abraham%2C+Moses+and+the+prophets%2C+could+not+be+infallibly+and+by+certainty+of+faith+to+them+the+Word+of+God%3B+for+if+God+spake+to+them+in+a+language+intelligible%2C+they+had+no+certainty+of+faith+that+the+words+that+came+from+God+did+signify+thus+and+thus%3B+for+sure%2C+God%2C+by+immediate+inspiration%2C+taught+them+not+grammar+and+significations+of+words%2C+and+those+that+read+the+Law+written+by+God%E2%80%99s+finger+on+two+tables+of+stone%2C+those+who+heard+Moses+and+the+prophets+preach+in+their+mother-tongue%2C+even+the+Jews+who+read+the+original+first+Hebrew+copy+of+Moses+and+the+prophets%2C+must+have+had+no+warrant+that+that+was+the+Word+of+God%2C+but+the+authority+of+father%2C+mother+and+nurses%2C+who+first+taught+them+their+mother-tongue%2C+for+sure+the+prophets+were+not+school-masters+to+teach+them+Hebrew%3B+so+by+this+learning+there+was+never+since+the+world+was+any+certainty+of+faith%2C+but+such+conjectural+human+and+fallible+opinions+in+all+the+matters+of+God+as+is+resolved+ultimately+%28says+Mr.+Goodwin%29+into+men%E2%80%99s+fallible+and+topic+authority+and+skill+of+grammar%2C+and+all+divine+faith+is+perished+out+of+the+earth%2C+except+God+by+a+supernatural+power+taught+men+first+grammar%2C+and+then+to+believe%2C+for+which+we+have+no+warrant%2C+so+all+our+faith+must+be+dreams.+And+since+Mr.+Goodwin+acknowledges+a+supernatural+power+of+the+Spirit+of+grace+to+believe%3B+what+else+does+this+Spirit+cause+us+believe%2C+but+lies%3F+or+at+best+fancies+resolved+into+human+credit%3F+which+may+be+false+for+any+certainty+of+knowledge+that+Libertines+allow+us%3F+%E2%80%A6+May+not+reading%2C+interpunction%2C+a+parenthesis%2C+a+letter%2C+an+accent%2C+alter+the+sense+of+all+fundamentals+in+the+Decalogue%3F+of+the+principles+of+the+Gospel%3F+and+turn+the+Scripture+in+all+points+%28which+Mr.+Doctour+restricts+to+some+few+darker+places%2C+whose+senses+are+off+the+way+to+heaven%2C+and+less+necessary%29+in+a+field+of+problems%2C+and+turn+all+believing+into+digladiations+of+wits%3F+all+our+comforts+of+the+Scriptures+into+the+reelings+of+a+Windmill%2C+and+fancies+of+seven+moons+at+once+in+the+firmament%3F+this+is+to+put+our+faith+and+the+first-fruits+of+the+Spirit%2C+and+Heaven+and+Hell+to+the+press.+But+though+printers+and+pens+of+men+may+err%2C+it+follows+not+%E2%80%98that+heresies+should+be+tolerated%2C%E2%80%99+except+we+say%2C+1.+that+our+faith+is+ultimately+resolved+upon+characters%2C+and+the+faith+of+printers.+2.+We+must+say+we+have+not+the+clear+and+infallible+word+of+God%2C+because+the+Scripture+comes+to+our+hand+by+fallible+means%2C+which+is+a+great+inconsequence%2C+for+though+scribes%2C+translators%2C+grammarians%2C+printers%2C+may+all+err%2C+it+follows+not+that+an+erring+providence+of+Him+that+has+seven+eyes%2C+has+not+delivered+to+the+Church%2C+the+Scriptures+containing+the+infallible+truth+of+God.+Say+that+Baruch+might+err+in+writing+the+prophesy+of+Jeremiah%2C+it+follows+not+that+the+prophesy+of+Jeremiah%2C+which+we+have%2C+is+not+the+infallible+Word+of+God%3B+if+all+translators+and+printers+did+their+alone+watch+over+the+Church%2C+it+were+something%2C+and+if+there+were+not+one+with+seven+eyes+to+care+for+the+Scripture.+But+for+tradition%2C+councils%2C+popes%2C+fathers%2C+they+are+all+fallible+means%2C+and+so+far+forth+to+be+believed+as+they+bring+Scripture+with+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%2C+%281649%29%2C+pp.+333-38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F075824cdf1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/075824cdf1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/original-manuscripts/the-majority-text/#:~:text=Goodwin%E2%80%99s%20argument%20makes%20as%20much%20against,as%20they%20bring%20Scripture%20with%20them&amp;text=Goodwin%E2%80%99s%20argument%20makes%20as%20much%20against%20Christ%20and&amp;text=be%20believed%20as%20they%20bring%20Scripture%20with%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0bc8c102ca" data-kw="">
<blockquote><p>I propound it to you, whether some of you have not held out some other public worship than the reformed Churches hold, namely hymns and anointing the sick members of the Church with oil; as also, whether a little before your coming over into England, some members of the Church of Arnheim [Netherlands], did not propound the holy kiss, or the kiss of love, to be practiced by church-members; Nay whether by some persons in that Church, was it not begun to be used and practiced; And in this enumeration of the parts of public worship, I desire to know why you put in “etc.” and what is meant by “etc.” for that implies more parts than you enumerate. And we know, etc. is a dangerous and suspicious phrase ever since the late [Anglican] Canons and Oath, for under that “etc.” may be meant prophesying and hymns, and anointing with oil, and the kiss of love, and many other parts which the reformed Churches practice not, and so your public worship may be made up of many other parts than the worship of all other reformed Churches, and that there is great cause to speak thus, and doubt, appears, because I know not, nor cannot reckon up any other part of public worship used every Lord’s Day in the reformed Churches than the particulars mentioned by you without an etc. and therefore what you mean by under “etc.”</p></blockquote>

<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>

<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4b46af8579" data-kw="">
<blockquote><p>If it be asked, what warrant have poor sinners to lay hold on Christ, and grip to him, as made of God righteousness?

I answer, Our absolute necessity of him, is a ground to press us to go and seek help and relief: we see we are gone in ourselves, and therefore are we allowed to seek out for help elsewhere.

2 Christ’s a sufficient furniture, whereby he is a qualified mediator, fitted with all necessaries for our case &amp; condition, having laid down a price to the satisfaction of justice, is a sufficient invitation for us to look toward him for help, and to wait at that door.

3. His being appointed of the Father, to be mediator of the covenant, and particularly to lay down his life a ransom for sin; and Christs undertaking all his offices, and performing all the duties thereof, conform to the covenant of redemption, is a strong encouragement to poor sinners to come to Him; because He cannot deny himself, and he will be true to his trust.

4. The Father’s offering of him to us in the gospel, and Christ’s inviting us, who are weary, and heavy loaden; yea calling and commanding such to come to him, in his own, and in his Father’s name, under the pain of his and his Father’s wrath and everlasting displeasure; exhorting further and requesting upon terms of love, pressing earnestly by many motives, sending out his ambassadors to beseech, in his stead, poor sinners to be reconciled, and to turn in to him for life and salvation: yea upbraiding such as will not come to him: all these are a sufficient warrant for a poor necessitous sinner to lay hold on his offer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the way, and the truth, and the life. Or, A short discourse pointing forth the way of making use of Christ for justification and especially and more particularly for sanctification in all its parts, from Johan. XIV: vers. VI. Wherein several cases of conscience are briefly answered, chiefly </cite>, (Rotterdam: John Cairns, 1677), pp 58-59.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57b9d0e0cb" data-kw="">
<blockquote><p>Mr. Reynolds–The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se [valuable in itself], of sufficient value to all, nay, ten thousand worlds. There are two Adams, one a fountain of misery, and the other of mercy… To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.</p></blockquote>

</figure><figure class="quote" id="q-2d1bff91c4" data-kw="">
<blockquote><p>When the world was to be made, the Lord did speak the word, and it was created. But when it was to be redeemed; he gave his Son to be a price of ransom for us. And who would ever have thought (but that the Lord hath revealed this his unspeakable mercy in his word) that God, being of infinite Majesty and glory, and enjoying all self-contented happiness, would give his only begotten Son to die for his enemies.</p></blockquote>

</figure><figure class="quote" id="q-c608953fb1" data-kw="">
<blockquote><p>It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed… The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review</cite>, (1902), 13:1-37, p. 19</span></figcaption>

<blockquote><p>2. To die for all, and to be given for all, must in some places [in Scripture, such as 1 Tim. 2:4-6; 4:10; Heb. 2:9; 2 Cor. 5:14-15; Tit. 2:11] respect the sufficiency of the dignity in the death of Christ, but not always the efficacy of his death in the virtual extent of it, which none that I have read will maintain in this point of Christ’s dying for all.</p></blockquote>

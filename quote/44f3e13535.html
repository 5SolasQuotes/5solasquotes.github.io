<blockquote><p>3. But ordinarily no man ought to be excommunicate[d] for any sin whatsoever, unless impenitence be added to the sin. Because he is first to be admonished to repent, Mt. 18:15-16; Tit. 3:10; and repentance is the Gospel condition of pardon to believers. 4. A man is not to be excommunicated for every sin which he repents not of, because: 1. Else all men should be excommunicated. For there are in all men some errors about sin and duty, and so some sins which men cannot yet perceive to be sins. 2. And ministers are not infallible, and may take that for a sin which is no sin, and so should excommunicate the innocent. 3. And daily unavoidable infirmities, though repented of, yet awaken not the soul sometimes to a notable contrition; nor are they fit matter for the Church’s admonition. A man is not to be called openly to repentance before the Church for every idle word, or hour. 5. Therefore, to excommunication these two must concur: 1. A heinousness in the sin; 2. Impenitence after due admonition and patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Part 3, Question 94, ‘For what sins may a man be denied communion or [be] excommunicated? Whether for impenitence in every little sin? Or for great sin without impenitence?’ in A Christian Directory: a Sum of Practical Theology and Cases of Conscience (1673)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-3fbf2cbbd5" data-kw="">
<blockquote><p>The O. S. [Old School] Assembly in 1853 decided that in some cases the Session may dismiss a member without specifying the church with which he is to unite. But the reunited Church in 1871 urged upon Sessions the importance of giving to members who remove from them either letters of dismission and recommendation to a particular church, or, in case of uncertain destination, letters of credence. The O. S. Assembly in 1869 recommended that the Session should furnish any member removing from their bounds, whether in full communion or member by baptism only, with testimonials of his standing, which should be presented as soon as possible to some church of our connection, and that such person be advised to transfer his relation at the earliest opportunity… … May a member connect himself with another church on profession of faith? If the church with which he unites [by profession of faith] be one of another denomination, the Session may order his name to be struck from the roll of communicants, or may, by process of discipline, suspend him from church privileges. The N. S. [New School] Assembly in 1839 recommended that no other action should be taken than to strike his name from the roll. This action was reaffirmed by the Assemblies of 1879 and 1882, and was in 1884 embodied in the revised Book of Discipline. How are absent members to be treated? … When one has been absent for years and his residence unknown, the Session should make record of the fact, and declare that he has forfeited his good standing until he returns and accounts for his absence. The O. S. As- sembly in 1865 passed a similar order. That body had in 1856 required that the names of absentees, whose whereabouts are unknown, be placed on a reserved list, and not be reported among the communicants until they return and satisfy the Session. The Assembly of the reunited Church ratified the above in 1872 by declaring, “It may nevertheless be well for each church to record on a separate list the names of those who have been absent for more than two years from their church relations, and whose residence is unknown; and the names thus recorded may be omitted in the statistical returns of the church. The ‘Book of Discipline’ adopted in 1884 authorized the Session to erase the names of absentees after three years and place them on the reserved list.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-aspinwall-hodge.html">J. Aspinwall Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Presbyterian Law as Defined by the Church Courts? (1882; 1899), pp. 147, 151-52, 152-54 | “May a certificate of dismission be indefinite?</cite></span></figcaption>

</figure><figure class="quote" id="q-cf4cfa96e2" data-kw="">
<blockquote><p>For, though we do not take upon us a presbyterial or synodical Church power to inflict juridical Church censures upon them that deserve them, yet we think this in our capacity and discretive judgment is incumbent upon us; to wit, according as we know they would manifestly incur the sentence of excommunication, deposition, deprivation, suspension, or rebuke, according to the degrees of their offence after rejected admonitions; We may by our discountenance testify our dislike of their ways, not inflicting this as a censure, but signifying, hereby our sense of the moral obligation and equity of these censures when legally inflicted. For though none have the power of the keys but Church Officers; yet people have a discretive power over their own practice, anticipating that power when it cannot be in Christ’s method exerted.</p></blockquote>

<blockquote><p>Auxilius, a fresh young Bishop, having excommunicated a person of good account with his whole family for infringing the liberties of his Church, as he supposed, saint Augustine treats with him by letters to know what ground he had out of the Scriptures to excommunicate the son for the father’s, the wife for the husband’s, the servants for their master’s offense; and amongst others uses these words (Augustine Epistle 75): ‘Lo, I am ready to learn, an old man of a young, a bishop of so long continuance, from my colleague, not yet a year’s standing: what good reason we may yield to God or to men, if for another man’s sin we endanger innocent souls with a spiritual punishment. If you can give a reason for it, vouchsafe by writing to acquaint me with it, that I may be able likewise; if you cannot, what is it for you to do (such a thing) upon an unadvised motion of the mind, whereof being asked, you are not able to yield a just reason? Neither think that uniust anger cannot overtake us, because we are bishops; but let us rather remember we live dangerously amidst the snares of temptations, because we are men.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bilson.html">Thomas Bilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetual Government of Christ’s Church (London, 1593), ch. 9</cite>, p. 121</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Auxilius, a fresh young Bishop, having excommunicated a person of good account with his whole family for infringing the liberties of his Church, as he supposed, saint Augustine treats with him by letters to know what ground he had out of the Scriptures to excommunicate the son for the father’s, the wife for the husband’s, the servants for their master’s offense; and amongst others uses these words (Augustine Epistle 75): ‘Lo, I am ready to learn, an old man of a young, a bishop of so long continuance, from my colleague, not yet a year’s standing: what good reason we may yield to God or to men, if for another man’s sin we endanger innocent souls with a spiritual punishment. If you can give a reason for it, vouchsafe by writing to acquaint me with it, that I may be able likewise; if you cannot, what is it for you to do (such a thing) upon an unadvised motion of the mind, whereof being asked, you are not able to yield a just reason? Neither think that uniust anger cannot overtake us, because we are bishops; but let us rather remember we live dangerously amidst the snares of temptations, because we are men.&#x27;”

— Thomas Bilson, The Perpetual Government of Christ’s Church (London, 1593), ch. 9, p. 121">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAuxilius%2C+a+fresh+young+Bishop%2C+having+excommunicated+a+person+of+good+account+with+his+whole+family+for+infringing+the+liberties+of+his+Church%2C+as+he+supposed%2C+saint+Augustine+treats+with+him+by+letters+to+know+what+ground+he+had+out+of+the+Scriptures+to+excommunicate+the+son+for+the+father%E2%80%99s%2C+the+wife+for+the+husband%E2%80%99s%2C+the+servants+for+their+master%E2%80%99s+offense%3B+and+amongst+others+uses+these+words+%28Augustine+Epistle+75%29%3A+%E2%80%98Lo%2C+I+am+ready+to+learn%2C+an+old+man+of+a+young%2C+a+bishop+of+so+long+continuance%2C+from+my+colleague%2C+not+yet+a+year%E2%80%99s+standing%3A+what+good+reason+we+may+yield+to+God+or+to+men%2C+if+for+another+man%E2%80%99s+sin+we+endanger+innocent+souls+with+a+spiritual+punishment.+If+you+can+give+a+reason+for+it%2C+vouchsafe+by+writing+to+acquaint+me+with+it%2C+that+I+may+be+able+likewise%3B+if+you+cannot%2C+what+is+it+for+you+to+do+%28such+a+thing%29+upon+an+unadvised+motion+of+the+mind%2C+whereof+being+asked%2C+you+are+not+able+to+yield+a+just+reason%3F+Neither+think+that+uniust+anger+cannot+overtake+us%2C+because+we+are+bishops%3B+but+let+us+rather+remember+we+live+dangerously+amidst+the+snares+of+temptations%2C+because+we+are+men.%27%E2%80%9D%0A%0A%E2%80%94+Thomas+Bilson%2C+The+Perpetual+Government+of+Christ%E2%80%99s+Church+%28London%2C+1593%29%2C+ch.+9%2C+p.+121&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd9083cc8d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd9083cc8d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=Auxilius%2C%20a%20fresh%20young%20Bishop%2C%20having,of%20temptations%2C%20because%20we%20are%20men.%27" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-0b49af45fd" data-kw="">
<blockquote><p>The way of nature is to go into oneself for all; according to the fundamental maxim of unsanctified morality, &quot;That a man should trust in himself;&quot; which, according to the doctrine of faith, is mere foolishness … Now faith is the soul&#x27;s going out of itself for all—and this, nature, on the other hand, determines to be foolishness, 1 Cor. 1:18-23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State II</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-487086b46c" data-kw="">
<blockquote><p>Acceptance of the Lord Jesus Christ, as He is offered to us in the gospel of His redeeming work, is saving faith. Despairing of any salvation to be obtained by our own efforts, we simply trust in Him to save us; we say no longer, as we contemplate the Cross, merely &quot;He saved others&quot; or &quot;He saved the world&quot; or &quot;He saved the Church&quot;; but we say, every one of us, by the strange individualizing power of faith, &quot;He loved me and gave Himself for me.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Is Faith?</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a> › <a href="../topics/faith/faith-as-instrument/faith-receives-christ.html">Faith receives Christ</a></span><span class="t"><a href="../topics/faith/object-of-faith.html">Object of Faith</a> › <a href="../topics/faith/object-of-faith/christ-and-the-promises.html">Christ and the promises</a></span></div>
<div class="actions"><button class="copy" data-copy="“Acceptance of the Lord Jesus Christ, as He is offered to us in the gospel of His redeeming work, is saving faith. Despairing of any salvation to be obtained by our own efforts, we simply trust in Him to save us; we say no longer, as we contemplate the Cross, merely &quot;He saved others&quot; or &quot;He saved the world&quot; or &quot;He saved the Church&quot;; but we say, every one of us, by the strange individualizing power of faith, &quot;He loved me and gave Himself for me.&quot;”

</figure><figure class="quote" id="q-e9bc94792c" data-kw="">
<blockquote><p>Faith thus receiving and resting on Christ and his righteousness, is the alone instrument of justification; yet it is not alone in the person justified, but is ever accompanied with all other saving graces, and is no dead faith, but worketh by love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Faith thus receiving and resting on Christ and his righteousness, is the alone instrument of justification; yet it is not alone in the person justified, but is ever accompanied with all other saving graces, and is no dead faith, but worketh by love.”

</figure><figure class="quote" id="q-8c3b736334" data-kw="">
<blockquote><p>The special object of faith, therefore, is Christ, and the promise of salvation through Him. And the special definite act of faith which secures our salvation is the act of receiving and resting on Him as He is offered to us in the Gospel.</p></blockquote>

</figure><figure class="quote" id="q-040b5004ca" data-kw="">
<blockquote><p>As the act of healing through the eyes of the Israelites and the brazen serpent went together; so, in the act of justifying, these two, faith and Christ, have a mutual relation, and must always concur- faith as the action which apprehendeth, Christ as the object which is apprehended; so that neither the passion of Christ saveth without faith, nor doth faith help unless it be in Christ, its object.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Puritan Golden Treasury</cite>, p. 104</span></figcaption>

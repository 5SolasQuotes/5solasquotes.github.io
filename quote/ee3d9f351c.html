<blockquote><p>In the second place, to supply the defendant his penury, the Rejoynder brings abundance of instances, out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this: and therefore by prevention, replies: to say these are not human inventions, because they partly spring out of natural light, is as much as to say, they are not, because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross, and surplice; the cornered-cap, and tippet; the bishops’ rochet, and coap; with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willful invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time, lay aside right natural invention, and judgement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in Worship… (1633)</cite>, p. 495</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7550de74c" data-kw="">
<blockquote><p>For the more clear opening of the ensuing treatise it is necessary to speak somewhat of worship and adoration, and especially of these: 1. honor. 2. praise. 3. glory, 4. reverence. 5. veneration. 6. devotion. 7. religion. 8. service. 9. worship. 10. love. 11. obedience. 12. adoration. 1. Honor, is a testification of the excellency of any, Aristotle, Ethics, bk. 8, ch. 8; Aquinas, Honos est signum quoddam excellentiae. ‘Honour is a sign or expression of excellency in any,’ it does not import any superiority in the party whom we honor, as adoration does. [2.] Praise is a special honoring of any, consisting in words. [3.] Glory is formally the effect of honor, though it be taken, pro claritate, ‘for the celebrity’ or renownedness of any; yet glory seems to be founded upon celebrity, as its foundation. [4.] Reverence is a sort of veneration of a person for excellency connotating a sort of fear. [5.] Veneration is a sort of fear, and reverencing of a person: I see not well any difference between reverence and veneration, except that veneration seems to be some more, and comes nearer to adoration. [6.] Devotion is the promptitude, cheerfulness, or spiritual propension of the will to serve God; [7.] Religion is formally in this, when a man subjects himself to God, as to his supreme Lord, and thence arises to give him honor, as his God and absolute Lord. The two integral parts of religion are the subjection of the reasonable creature to God. 2. An exhibition of honour… [8.] Service is from the bond of subjection, to reverence God as an inferior or servant does his Lord and Master: A servant does properly do the will of his master for the gain or profit that redounds to his master… [9.] For worship formally is to give reverence to God for his excellency; in one and the same act we may both worship God and serve Him. Only service does include the obligation of a servant to a lord. As concerning [10.] love, faith and hope, they are internal worship, not properly adoration: Love as love does rather import an equality with the thing loved, and a desire of an union, rather than a submission. It is true, there is a perfection in that which we love, but not essentially to perfect the lover… Faith and hope may suppose a resting on a helper as a helper, and so are internal worship; if they be adoration formally may be a question… [11.] Obedience is founded, not formally upon God’s excellency, properly so called, but upon his jurisdiction and authority to command. [12.] Adoration is the subjection or prostration of soul or body to God in the due recognition and acknowledgement of his absolute supremacy. There is no need, that Vasquez [a Romanist] should deny that there is any internal adoration, for that adoration is only an external and bodily worship of God, can hardly be defended… as external adoration is an act by which we offer our bodies to God and subject the utter man to him, in sign of service and reverence to so supreme a Lord, so there is a heart-prostration and inward bowing of the soul answerable thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | Introduction, Section 6, ‘What Honor, Praise, Glory, Reverence, Veneration, Devotion, Service, Worship, etc. are’</cite>, p. 83</span></figcaption>

<blockquote><p>It is not in the adorer’s power that kneeling should be a sign of lesse worship, as referred to the image, and of greater, as referred to God; for the same material kissing and religious rostration which would immediatly be conveyed to Christ if He were in person present in the image and elements, is done to the image and elements; and religious kissing and religious kneeling signifies internal divine submission of heart to God, as the First Author of all and the last end, not by man’s will, but by divine institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646)</cite>, Ch. 1; p. 166</span></figcaption>

</figure><figure class="quote" id="q-a916fff20e" data-kw="">
<blockquote><p>What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures: 1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified. 2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (1606)</cite>, p. 416</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures: 1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified. 2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.”

— William Bucanus, Institutions of Christian Religion (1606), p. 416">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+ought+to+be+the+gesture+of+him+that+prays%3F+A+diverse+gesture+is+not+prescribed%2C+but+yet+is+described+in+the+Scriptures%3A+1.+The+Jews+in+time+past+did+pray+somtimes+standing%2C+but+sometimes+with+bowed+knees%2C+as+Solomon+and+Christ+Himself+kneeled+down+and+prayed%2C+as+also+Peter+and+Stephen%3B+Paul+also+used+bowing+of+the+knees%2C+Eph.+3%3A14%2C+%E2%80%9CFor+this+cause+%28says+he%29+I+bow+my+knees+unto+the+Father+of+our+Lord+Jesus+Christ%2C%E2%80%9D+by+which+gesture+a+lowly+subjection%2C+and+an+emptying+of+ourselves+before+God+is+signified.+2.+Moses+lifts+up+his+hands+towards+Heaven%2C+and+Paul+wills%2C+1+Tim.+2%3A8%2C+that+pure+hands+should+be+lifted+up+unto+God%3A+which+gesture+belongs+unto+children+who+do+reach+their+hand+to+the+parents+when+they+will+obtain+anything+or+are+suppliant+to+them.+But+this+ceremony+of+lifting+up+of+hands+does+admonish+us%2C+that+the+heart+and+senses+are+to+be+lifted+upon+high%2C+least+they+which+desire+to+be+heard+of+God+should+abide+in+their+dregs%2C+as+David+interprets+Ps.+86%3A4%3B+25%3A1%2C+%E2%80%9CUnto+Thee+O+Lord+I+lift+up+my+soul.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion+%281606%29%2C+p.+416&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa916fff20e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a916fff20e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/posture-in-prayer/#:~:text=What%20ought%20to%20be%20the%20gesture,Lord%20I%20lift%20up%20my%20soul&amp;text=What%20ought%20to%20be%20the%20gesture%20of%20him&amp;text=Thee%20O%20Lord%20I%20lift%20up%20my%20soul" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb344b1639" data-kw="">
<blockquote><p>36. ‘And kneeling down’. The inward affection is indeed the chiefest thing in prayer; yet the external signs, as kneeling, uncovering of the head, lifting up of the hands, have a double use; the first is, that we exercise all our members to the glory and worship of God; secondly, that by this exercise our sluggishness may be awakened, as it were. There is also a third use in solemn and public prayer, because the children of God do by this means make profession of their godliness, and one of them does provoke another unto the reverence of God. And, as the lifting up of the hands is a token of boldness (fiducia, confidence) and of an earnest desire, so, to testify our humility, we fall down upon our knees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts 20, verse 36</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-da285da9e2" data-kw="">
<blockquote><p>It is to be lamented that we, few in number, although we confess in all things the same Gospel, yet let ourselves be disunited by the Lord’s Supper, which ought to be the strongest bond of union.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e10e4d6844" data-kw="">
<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh: Higgins, 1659) | pt. 4, ch. 21, p. 426</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-1bbdab7c77" data-kw="">
<blockquote><p>As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Lawfulness of Hearing the Public Ministers</cite>, (1634) in The Lawfulness of Hearing the Public Ministers of the Church of England Proved, by Mr. Philip Nye &amp; Mr. John Robinson… (London, 1683), p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.”

— John Robinson, A Treatise of the Lawfulness of Hearing the Public Ministers in the Church of England (1634) in The Lawfulness of Hearing the Public Ministers of the Church of England Proved, by Mr. Philip Nye &amp; Mr. John Robinson… (London, 1683), p. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+they+that+affect+alienation+from+others+make+their+differences+as+great+and+the+adverse+opinion+or+practice+as+odious+as+they+can%2C+thereby+to+further+their+desired+victory+over+them+and+to+harden+themselves+and+their+side+against+them%3A+So+on+the+contrary%2C+they+who+desire+peace+and+accord+both+interpret+things+in+the+best+part+that+reasonably+they+can+and+seek+how+and+where+they+may+find+any+lawful+door+of+entry+into+accord+and+agreement+with+others.%E2%80%9D%0A%0A%E2%80%94+John+Robinson%2C+A+Treatise+of+the+Lawfulness+of+Hearing+the+Public+Ministers+in+the+Church+of+England+%281634%29+in+The+Lawfulness+of+Hearing+the+Public+Ministers+of+the+Church+of+England+Proved%2C+by+Mr.+Philip+Nye+%26+Mr.+John+Robinson%E2%80%A6+%28London%2C+1683%29%2C+p.+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1bbdab7c77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1bbdab7c77.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=As%20they%20that%20affect%20alienation%20from,into%20accord%20and%20agreement%20with%20others&amp;text=As%20they%20that%20affect%20alienation%20from%20others%20make&amp;text=of%20entry%20into%20accord%20and%20agreement%20with%20others" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 152 Lectures upon Psalm 51… (London: 1635), Lecture 48, on Ps. 51:4 (1626), p. 243</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

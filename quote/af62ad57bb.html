<blockquote><p>V. However, we maintain that man was never created in a state of pure nature so called, nor do we think he could have been so created. The reasons are: (1) because man was made in the image of God (Gen. 1:26) and thus morally good and upright (Ecc. 7:29). For since that image (as it is afterwards said) consisted principally of original righteousness, he cannot be said to have been created in a state of pure nature who was adorned with this from the beginning. (2) He was made to glorify and worship God (Prov. 16:4; Rom. 11:36), duties he could not perform unless endowed with the necessary gifts (viz., wisdom and holiness). VI. (3) Where two things immediately opposed belong to any subject, one or other of the two must necessarily be in it. Now righteousness and sin are predicated of man as their fit (dektikō) subject and are directly (amesōs) opposed to each other. Therefore one or the other must necessarily be in him; nor can there be a man who is not either righteous or a sinner. To no purpose is the example of infants brought forward, who can neither be called righteous (because they do not act justly), nor sinners (because they cannot sin). For although an infant cannot be called righteous or a sinner by actual righteousness or sin, still he can by habitual and congenital (as he is rightly called rational because he has reason in the first act [in actu primo], although not as yet having actually reasoned or being able to reason). VII. (4) That state of pure nature is a sheer figment; it never was, nor could be. Not in man’s perfect state because in it he should be entire and innocent; not in the state of sin because he is born a child of wrath; not in the state of grace because he is born again a child of God; not in the state of glory because then his holiness and happiness will be consummated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (P&amp;R Publishing, 1992–97), 5.9.5–7.</cite></span></figcaption>

<blockquote><p>13… And thus far there is the highest consensus among the Orthodox, although a certain dissensus intervenes in the explication of the material cause — some urging both the ἐνεργητική [energētikē, active] and the παθητική [pathētikē, passive] obedience, and conjoining satisfaction through obedience and through suffering; others seeking the material cause of our justification in satisfaction through suffering alone. 14. The foundation is safe among both parties. For both not only admit but also require the obedience of Christ perfectly rendered to the law for our justification; but they differ in the manner of explicating the matter. For some hold it to be the meritorious cause of our justification; others hold it to be the condition of the person and the causa sine qua non [indispensable cause] of meriting justification — namely, that it behoved us to have such a High Priest who was holy and undefiled, Heb. VII.26–27. Concerning which there is a certain dissensus of opinions, the unity of faith and charity being preserved, since both parties apprehend the whole Christ and Christ alone, and in Him whole and alone seek righteousness and life.</p></blockquote>

</figure><figure class="quote" id="q-760158cd1d" data-kw="">
<blockquote><p>True faith in the least degree, gives the soul a share in the first resurrection. It is of the vital principle which we receive when we are quickened. Now, be it never so weak a life we have, yet it is a life that shall never fail. It is of the seed of God, which abideth,—incorruptible seed, that dieth not. A believer is spirit,—is quickened from the dead; be he never so young, never so sick, never so weak, he is still alive, and the second death shall have no power over him. A little faith gives a whole Christ. He that hath the least faith hath as true an interest, though not so clear an interest, in the righteousness of Christ as the most steadfast believer. Others may be more holy than he, but not one in the world is more righteous than he; for he is righteous with the righteousness of Christ. He cannot but be low in sanctification, for a little faith will bring forth but little or low obedience; if the root be weak, the fruit will not be great. But he is beneath none in justification. The most imperfect faith will give present justification, because it interests the soul in a present Christ. The lowest degree of true faith gives the highest completeness of righteousness, Col. 2:10. You, who have but a weak faith, have yet a strong Christ. So that, though all the world should set itself against your little faith, it should not prevail. Sin cannot do it; Satan cannot do it;—hell cannot do it. Though you take but weak and faint hold on Christ, he takes sure, strong, and unconquerable hold on you. Have you not often wondered, that this spark of heavenly fire should be kept alive in the midst of the sea? It is everlasting; a spark that cannot be quenched,—a drop of that fountain that can never be wholly dried up. Jesus Christ takes special care of them that are weak in faith, Isa. 40:11. On what account soever they are sick, and weak, and unable, this good Shepherd takes care of them. He shall rule, and they shall abide, Mic. 5:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen, ed. William H. Goold, vol. 9 (Edinburgh: T&amp;T Clark, n.d.), 28–29.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>Thus [Paul] says also to the Romans (11:13): “Inasmuch as I am an apostle to the Gentiles, I magnify my ministry.” That is to say: “I want men to receive me, not as Paul of Tarsus but as Paul the apostle or ambassador of Jesus Christ.” He has to do this to maintain his authority, so that those who hear this may be more attentive and more willing to listen to him. For they are not listening to Paul; but in Paul they are listening to Christ Himself and to God the Father, who sends him forth. Just as men should devoutly honor the authority and majesty of God, so they should reverently receive and listen to His messengers, who bring His Word.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus [Paul] says also to the Romans (11:13): “Inasmuch as I am an apostle to the Gentiles, I magnify my ministry.” That is to say: “I want men to receive me, not as Paul of Tarsus but as Paul the apostle or ambassador of Jesus Christ.” He has to do this to maintain his authority, so that those who hear this may be more attentive and more willing to listen to him. For they are not listening to Paul; but in Paul they are listening to Christ Himself and to God the Father, who sends him forth. Just as men should devoutly honor the authority and majesty of God, so they should reverently receive and listen to His messengers, who bring His Word.”

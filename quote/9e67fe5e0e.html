<main class="wrap"><figure class="quote" id="q-9e67fe5e0e" data-kw="">
<blockquote><p>Now when God says expressly (as if He would make it impossible for any mortal to misconceive Him) that Christ is the Savior, the propitiation, the taster of death, not only for all men, but for every man, not only for the world, but for the whole world, and to prove He speaks of an intention to save them all without exception (if by the wickedness of their wills they do not frustrate his intention, as the greater part of men do, by not accepting his offer and not performing the conditions on which his offer is made), He professes He is not willing that any should perish, but [on the contrary] that all should come to repentance, 2 Pet. 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-pierce.html">Thomas Pierce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Philanthropy... (London: Royston, 1657), ch. 3</cite>, pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbbb3afe59" data-kw="">
<blockquote><p>Now the general satisfaction of Christ, which was the first act of his priestly office, prepares the way for God’s mercy, by making the sins of all mankind pardonable, the interposition of any bar from God’s justice notwithstanding, and so puts the sons of men only in a possibility of being justified, a thing denied to the nature of fallen angels, which the Son was not pleased to assume; but the special application of this satisfaction vouchsafed by Christ unto those persons only whom his Father has given Him out of the world, which is an appendant, or appertains to the second act of his priesthood, viz. his intercession, produces this potentia in actum, that is, procures an actual discharge from God’s anger; and makes justification, which before was a part of our possibility, to be a part of our present possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71</cite>, p. 569</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now the general satisfaction of Christ, which was the first act of his priestly office, prepares the way for God’s mercy, by making the sins of all mankind pardonable, the interposition of any bar from God’s justice notwithstanding, and so puts the sons of men only in a possibility of being justified, a thing denied to the nature of fallen angels, which the Son was not pleased to assume; but the special application of this satisfaction vouchsafed by Christ unto those persons only whom his Father has given Him out of the world, which is an appendant, or appertains to the second act of his priesthood, viz. his intercession, produces this potentia in actum, that is, procures an actual discharge from God’s anger; and makes justification, which before was a part of our possibility, to be a part of our present possession.”

</figure><figure class="quote" id="q-96c3e1b07a" data-kw="">

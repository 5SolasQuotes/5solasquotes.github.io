<main class="wrap"><figure class="quote" id="q-7cd0d7428e" data-kw="">
<blockquote><p>Now for to seek the Original of this evil any further back then the time of Arminius Professor at Leyden, were to disguise the fact. Some others before him it may be have had the same scruples, and the same troubles in their consciences upon those high points of Predestination and the Dependences of it; But the Church hath still continued in her peace and quiet; in such sort that the fountain and spring of the alteration which since his time some have endeavoured to introduce into the true and ancient Doctrine which you have always professed, and is received and authorized by the common consent of all the reformed Churches (howsoever some particular men have had an opinion a part touching the said points) ought to be attributed to Arminius and to none other. …

Contraria inter se posita magis elucescunt, we see then, before the time of Arminius what was the estate of these Provinces: union in the Church and Estate; good correspondence between the Magistrates; Christian love and charity among the people; the Sovereign Courts of Justice respected; the soldiers (the servants of your Lordships) in peace with all the world except your Enemies; all cheerfulness, all rejoicing, all acknowledgement of the blessing of GOD, which hath appeared miraculously in the defence of his cause, in the sight and notice of all the world in your prosperity; whereat the Enemies of this estate, have remained dismayed and amazed, and the friends of it greatly comforted.

For the present now that every one sees so clearly quantum dimiss a petitis praestant, let the Remonstrant take in good part the Remonstrance that followeth, and let him (if he please) serve himself thereof, Mature redeat repetatque relicta. But if the Doctrine of Arminius be so far spread and multiplied as there be no more time to give back, but that it behoveth to passe further to a decision, which of the two opinions is more conform and agreeing to the truth of the Word of God; or at the least what sort of Christian toleration may be permitted without scandal in the Church, who shall be a competent Judge in this matter?

To carry this authority to the temporal Magistrate, giving to Caesar that which belongs to Caesar, were to lean and incline too much of that side, and to take from God that which is God’s.

Wherefore to proceed with due regard as well towards them to whom God hath given authority over our bodies, as of those that have the cure and charge of our souls, that which in such occurrences is always practised, and whereunto within Christendom at all times men have had recourse. It is a National Synod; I say National, because the evil being passed from Province to Province, a Provincial Synod is not sufficient, but only for so much as it serveth for a preparative to the National Synod. This is the Remedy which is found good by the greatest part of the Provinces, and that which is recommended to you by the King my Master.

As for the Provinces, I will not play the busybody in aliena Republica, therein to Judge how much every Province in particular ought in such occasions to yield to the public. But whilst in this business men stand to dispute the right of Sovereignty of every Province apart, let them not forget the Oath by which they are consolidated and closed up into one body which is the Union of Utrecht grounded upon Religion.

And although they seek to evade and escape by shew of one Article which is, That every Province hath its power a part in matter of Religion, This ought to be understood soundly for the maintenance of the pure &amp; sincere Religion, and not for the authorisation and allowance of new and strange opinions; And principally in this Province where we are at this present, in the contemplation whereof it is to be presumed that Article was inserted for the better upholding of the Reformed Religion in his purity without being exposed to the will and pleasure of the other Provinces which at that time were not reduced to such an Union of the Church as they enjoy at this present.</p></blockquote>

<blockquote><p>Who would have thought that our church would ever have given entertainment to these Belgic semi-Pelagians, who have cast dirt upon the faces and raked up the ashes of all those great and pious souls whom God magnified, in using as his instruments to reform his church; to the least of which the whole troop of Arminians shall never make themselves equal, though they swell till they break?

What benefit did ever come to this church by attempting to prove that the chief part in the several degrees of our salvation is to be ascribed unto ourselves, rather than God? — which is the head and sum of all the controversies between them and us. And must not the introducing and fomenting of a doctrine so opposite to that truth our church hath quietly enjoyed ever since the first Reformation necessarily bring along with it schisms and dissensions, so long as any remain who love the truth, or esteem the gospel above preferment?

Neither let any deceive your wisdoms, by affirming that they are differences of an inferior nature that are at this day agitated between the Arminians and the orthodox divines of the reformed church. Be pleased but to cast an eye on the following instances, and you will find them hewing at the very root of Christianity. Consider seriously their denying of that fundamental article of original sin. Is this but a small escape in theology? — why, what need of the gospel, what need of Christ himself, if our nature be not guilty, depraved, corrupted? Neither are many of the rest of less importance. Surely these are not things “in quibus possimus dissentire salvâ pace ac charitate,” as Austin [Augustine] speaks, — “about which we may differ without loss of peace or charity.” One church cannot wrap in her communion Austin and Pelagius, Calvin and Arminius.

I have here only given you a taste, whereby you may judge of the rest of their fruit, — “mors in olla, mors in olla;” their doctrine of the final apostasy of the elect, of true believers, of a wavering hesitancy concerning our present grace and future glory, with divers others, I have wholly omitted: those I have produced are enough to make their abettors incapable of our church-communion. The sacred bond of peace compasseth only the unity of that Spirit; which leadeth into all truth.

We must not offer the right hand of fellowship, but rather proclaim ἱερὸν πόλεμον, “a holy war,” to such enemies of God’s providence, Christ’s merit, and the powerful operation of the Holy Spirit. Neither let any object, that all the Arminians do not openly profess all these errors I have recounted. Let ours, then, show wherein they differ from their masters. We see their own confessions; we know their arts, βάθη καὶ μεθοδείας τοῦ Σατανᾶ, — “the depths and crafts of Satan;” we know the several ways they have to introduce and insinuate their heterodoxies into the minds of men.

With some they appear only to dislike our doctrine of reprobation; with others, to claim an allowable liberty of the will: but yet, for the most part, — like the serpent, wherever she gets in her head, she will wriggle in her whole body, sting and all, — give but the least admission, and the whole poison must be swallowed. What was the intention of the maintainers of these strange assertions amongst us I know not, — whether the efficacy of error prevailed really with them or no, or whether it were the better to comply with Popery, and thereby to draw us back again unto Egypt; — but this I have heard, that it was affirmed on knowledge, in a former parliament, that the introduction of Arminianism amongst us was the issue of a Spanish consultation.

It is a strange story that learned Zanchius tells us, how, upon the death of the Cardinal of Lorraine there was found in his study a note of the names of divers German doctors and ministers, being Lutherans, to whom was paid an annual pension, by the assignment of the cardinal, that they might take pains to oppose the Calvinists; and so, by cherishing dissension, reduce the people again to Popery.

If there be any such amongst us, who, upon such poor inconsiderable motives, would be won to betray the gospel of Christ, God grant them repentance before it be too late! However, upon what grounds, with what intentions, for what ends soever, these tares have been sowed amongst us by envious men, the hope of all the piously learned in the kingdom is, that, by your effectual care and diligence, some means may be found to root them out.</p></blockquote>

<blockquote><p>Reader,

THERE are two rotten pillars on which the fabric of late Arminianism (an egg of the old Pelagianism, which we had well hoped had been long since chilled, but is sit upon and brooded by the wanton wits of our degenerate and apostate spirits) doth principally stand.

The one is, That God loveth all alike, Cain as well as Abel, Judas as the rest of the apostles.

The other is, That God giveth (nay is bound, “ex debito,” so to do) both Christ, the great gift of his eternal love, for all alike to work out their redemption, and “vires credendi,” power to believe in Christ to all alike to whom he gives the gospel; whereby that redemption may effectually be applied for their salvation, if they please to make right use of that which is so put into their power.

The former destroys the free and special grace of God, by making it universal; the latter gives cause to man of glorying in himself rather than in God, — God concurring no farther to the salvation of a believer than a reprobate. Christ died for both alike; — God giving power of accepting Christ to both alike, men themselves determining the whole matter by their free-will; Christ making both savable, themselves make them to be saved.

This cursed doctrine of theirs crosseth the main drift of the holy Scripture; which is to abase and pull down the pride of man, to make him even to despair of himself, and to advance and set up the glory of God’s free grace from the beginning to the end of man’s salvation. His hand hath laid the foundation of his spiritual house; his hand shall also finish it.

The reverend and learned author of this book hath received strength from God (like another Samson) to pull down this rotten house upon the head of those Philistines who would uphold it. Read it diligently, and I doubt not but you will say with me, there is such variety of choice matter running through every vein of each discourse here handled, and carried along with such strength of sound and deep judgment, and with such life and power of a heavenly spirit, and all expressed in such pithy and pregnant words of wisdom, that you will both delight in the reading and praise God for the writer. That both he and it may be more and more profitable shall be my hearty prayers. — The unworthiest of the ministers of the gospel,

Stanley Gower.</p></blockquote>

<blockquote><p>Saving grace is not in vain, but effectual, 1 Corinth. 15.10. 1 Tim. 1.14. And we are saved by the Grace of our Lord Jesus Christ, Acts 15.11. and no greater mercy can be wished to any, then the grace of our Lord Jesus, Rom. 16.20. 2 Cor. 13.14. Rev. 22.21. by which we are called, justified and glorified. If it be said that this grace is not that effectual saving grace, bestowed upon the Elect, but a general remote gracious power, by which we may acquire the saving grace proper to the Elect.

But so 1. that grace saving proper to the Elect by this means is in the power of all Pagans, and all must be gifted with a power to purchase that grace proper to the Elect: That must be strange conquishing, we must all be made our own efficacious Redeemers, and Christ is a Saviour by merit, not by efficacy; For if this saving grace be infused, it is either infused, we doing nothing to which they cannot stand: Or then it is acquired, and so we make the general grace saving and proper to the Elect, which everteth the nature of saving grace, and makes it the purchase of works. And they must say that Christ hath merited a general ineffectual power to some, and that he died to merit a special saving grace to others.

Let us have a warrant for this, that Christ both died equally to save all, and yet with two contrary intentions, to purchase a power of believing which should be effectual to some to save them, and ineffectual to others. If it be said that Christ died to merit the same general power to all, but some make it ineffectual, some not; This saith thus. 1. That Christ’s death might have its fruit and effect, though all perish. 2. That Christ dyed to merit a far off, lubrick and possible venture of heaven, such as was the case of the first Adam. 3. Christ dyed not to purchase a new heart more to one then to another, whereas 1 Pet. 1.18, 19. the blood the Lord shed is to Redeem us from our vain conversation, in a natural state as well as to save us from the wrath to come; Then must Christ have died to buy Pagans from Paganism and Idolatry: and that either absolutely, and then why should multitudes so die in their sins?

If conditionally, what can be the condition going before conversion, to wit, that we should be delivered from our vain conversation, so we be willing, before our conversion, to be delivered from our vain conversation. And shall not the Question recur concerning that condition? In a word they will have Christ’s death to buy Heaven, but not to buy faith, without which Heaven is impossible. Yea he no more bought to men a grace sweetly and strongly inclining the will to believe, then he bought such a grace to the damned devils. He purposed to give to all Pagans a power by which they should be made fit to perform all that the Gospel requires, and be fit to be made partakers of the inheritance of the Saints, Col. 1. And yet Paul gives thanks to God for that bestowed on the Colossians, and God must by this call all men to Christ, either mediately or immediately.

And say that God is prepared ever to give more and more as we use the former well, and that all by sufficient grace (saith Corvinus) are disposed to conversion, but that sufficiency is not habitual grace, but actual assistance conveying the Preached Word, which is to bring all to free-wills power, rejecting all infused power, and to make an influence of grace, which is in the power of free will to use or not to use, and to stand in two. 1. In a measure of heavenly Doctrine. 2. In the stirring upon the heart; Whence 1. Grace habitual so is denied; then the will needeth no healing. 2. Grace universal is limited to the Word Preached, then it is not universal; For Pagans hear not the Word Preached. 3. There is no other help given to free-will in every act, but 1. Information by the Word, that was the grace of Pelagius. 2. Some influence of God in every act: But that adds not new strength to the will. Shortly they say, Any man may know, understand and believe the Gospel, if the object be sufficiently proposed and revealed. And so the natural man can no more know and receive the things of the Gospel, then he can understand the Metaphysics, the Acromaticks of Aristotle: for these he cannot receive, but judgeth them folly; And so we are the same way blind, dead, stony-hearted to believe the Gospel, as we are to know and believe the mysteries of Aristotle’s Philosophy.

Lastly, this power of believing and coming to Christ cannot be in all men, since the Scripture saith of all men (even these within the Visible Church not excepted) that until the light of the Gospel savingly enlighten them, they sit in darkness and in the shadow of death, Isa. 9.1. Math. 4.15, 16. And No man can come to Christ without the Father’s drawing, and God teaching the heart, Joh. 6.44, 45. The natural man cannot understand the things of God, but judges them foolishness. 1 Cor. 2.14. His wisdom cannot be subject to the Law of God. Rom. 8.7. He cannot call the Lord, Jesus, except by the Spirit of Jesus, 1 Cor. 12.3. He is a withered branch being out of Christ, and can do nothing, Joh. 15.3.4.

It shall be clear to any, that the Holy Ghost denyeth any such power, as they af∣firm. It reckons not much to tell that Jesuits, as Martmez de Ripul. Suarez, Alphonsus Curiel, Duvallius, Lod. Molma, Did. Ruiz, Vasquez, Bellarmine, Phili. Samachaeus, Sorbonicus, Gulie. Estius, Dominica, Toletus Cardinalis, Pirerius, Salmeron, teach that, without saving grace, men may, and can first know moral truths, shining virtues, as heathens, be free of sin, as touching these virtues in their due circumstances. 2. Keep the Commandments and Law of Nature. 3. Dispose themselves for, and obtain the grace of Conversion by their own industry. 4. Be victorious over this or that weighty temptation singly taken. 5. That there is no intrinsical hurt of free-will, that it is wounded a little, because of the darkness of the mind, and languor of nature, but not dead to actions supernatural. 6. That we may love God as the Author of nature, and Creator sincerely; And Arminians teach that we may without the Spirit of God know all truth, quantum sufficit ad salutem, sufficiently to salvation, and so may will, love, and believe without the infused supernatural habit or grace, so their Apology.

And the Socinian Catechism, c. 6. pag. 212. and Socinus himself, Praelect. Theol. Cap. 4. Fol. 15, 16. Et de officio hominis Christi: Cap. 5. Smalcius on Joh. 1. Hom. 3. Give to us man whole, sound, sinless, as he came from the first Adam. 2. That man can do all that Cod commands him with little help of God. 3. It’s an error (saith Smalcius) that a man hath no strength in spiritual things, there is no need of the inward gift of the Spirit of God to believe (saith the Racovian Catechism) for we read not that such a gift in Scripture is bestowed upon any but upon believers: such as are born of Adam (saith Socinus) are all born in the same condition, and nothing is taken from such a man, which he naturally hath or was to have. Ostorodius Justi. Relig. Christ. cap. 21. Praedicatio sola Euangelij potest hominem abs{que} interná Spiritus illuminatione, &amp; operatione à peccatis convertere. The only Preaching of the Gospel without the inward illumination by the Holy Spirit, and his working is able to convert a man from sin. All which is Printed and taught, and many other abominable errors to us.

To this Objection against universal grace (as I judge unanswerable) Corvinus Answers, that all the places of Scripture brought to prove man’s inability to believe in Christ, and to worship him, conclude well that a man hath not strength of himself without Christ and his grace; but this is but to cloud the truth, and to mock the reader, for if all and every man (even the Infants of Pagans) be in Covenant through Christ, and be made able by a gifted grace common to all, within, and without the Church, by which they are able by degrees to do all that the Gospel requires, what avails it to discourage them, and to tell, they are not masters of a good thought, without grace; for they are no less masters of good thoughts and good words, and of good actions then Adam was; for they are not hearers of the Gospel by nature, but as gifted with universal grace, they are hearers, and before their conversion, and before they receive the Spirit of Regeneration, can please God, and prepare themselves for Regeneration:

Yea there is no animal and natural Pagan de facto existing in the world (by their way) who cannot receive the things of God, and cannot come to Christ, except he be drawn, for all Pagans and others are drawn, and by this it might have been said, Adam as wanting supernatural grace, and as a natural man (for the Image of God was supernatural grace to Adam, as Arminius and Corvinus teach) so, was not able to think a good thought, as 2 Cor. 3.5. nor able to receive the things of God, as the natural man, 1 Cor. 2.14. and Adam so was also dead in trespasses and sins, and must come to Christ the same way, to wit, drawn by the grace super-added to nature, as we fallen sinners do.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Saving grace is not in vain, but effectual, 1 Corinth. 15.10. 1 Tim. 1.14. And we are saved by the Grace of our Lord Jesus Christ, Acts 15.11. and no greater mercy can be wished to any, then the grace of our Lord Jesus, Rom. 16.20. 2 Cor. 13.14. Rev. 22.21. by which we are called, justified and glorified. If it be said that this grace is not that effectual saving grace, bestowed upon the Elect, but a general remote gracious power, by which we may acquire the saving grace proper to the Elect.

But so 1. that grace saving proper to the Elect by this means is in the power of all Pagans, and all must be gifted with a power to purchase that grace proper to the Elect: That must be strange conquishing, we must all be made our own efficacious Redeemers, and Christ is a Saviour by merit, not by efficacy; For if this saving grace be infused, it is either infused, we doing nothing to which they cannot stand: Or then it is acquired, and so we make the general grace saving and proper to the Elect, which everteth the nature of saving grace, and makes it the purchase of works. And they must say that Christ hath merited a general ineffectual power to some, and that he died to merit a special saving grace to others.

Let us have a warrant for this, that Christ both died equally to save all, and yet with two contrary intentions, to purchase a power of believing which should be effectual to some to save them, and ineffectual to others. If it be said that Christ died to merit the same general power to all, but some make it ineffectual, some not; This saith thus. 1. That Christ’s death might have its fruit and effect, though all perish. 2. That Christ dyed to merit a far off, lubrick and possible venture of heaven, such as was the case of the first Adam. 3. Christ dyed not to purchase a new heart more to one then to another, whereas 1 Pet. 1.18, 19. the blood the Lord shed is to Redeem us from our vain conversation, in a natural state as well as to save us from the wrath to come; Then must Christ have died to buy Pagans from Paganism and Idolatry: and that either absolutely, and then why should multitudes so die in their sins?

If conditionally, what can be the condition going before conversion, to wit, that we should be delivered from our vain conversation, so we be willing, before our conversion, to be delivered from our vain conversation. And shall not the Question recur concerning that condition? In a word they will have Christ’s death to buy Heaven, but not to buy faith, without which Heaven is impossible. Yea he no more bought to men a grace sweetly and strongly inclining the will to believe, then he bought such a grace to the damned devils. He purposed to give to all Pagans a power by which they should be made fit to perform all that the Gospel requires, and be fit to be made partakers of the inheritance of the Saints, Col. 1. And yet Paul gives thanks to God for that bestowed on the Colossians, and God must by this call all men to Christ, either mediately or immediately.

And say that God is prepared ever to give more and more as we use the former well, and that all by sufficient grace (saith Corvinus) are disposed to conversion, but that sufficiency is not habitual grace, but actual assistance conveying the Preached Word, which is to bring all to free-wills power, rejecting all infused power, and to make an influence of grace, which is in the power of free will to use or not to use, and to stand in two. 1. In a measure of heavenly Doctrine. 2. In the stirring upon the heart; Whence 1. Grace habitual so is denied; then the will needeth no healing. 2. Grace universal is limited to the Word Preached, then it is not universal; For Pagans hear not the Word Preached. 3. There is no other help given to free-will in every act, but 1. Information by the Word, that was the grace of Pelagius. 2. Some influence of God in every act: But that adds not new strength to the will. Shortly they say, Any man may know, understand and believe the Gospel, if the object be sufficiently proposed and revealed. And so the natural man can no more know and receive the things of the Gospel, then he can understand the Metaphysics, the Acromaticks of Aristotle: for these he cannot receive, but judgeth them folly; And so we are the same way blind, dead, stony-hearted to believe the Gospel, as we are to know and believe the mysteries of Aristotle’s Philosophy.

Lastly, this power of believing and coming to Christ cannot be in all men, since the Scripture saith of all men (even these within the Visible Church not excepted) that until the light of the Gospel savingly enlighten them, they sit in darkness and in the shadow of death, Isa. 9.1. Math. 4.15, 16. And No man can come to Christ without the Father’s drawing, and God teaching the heart, Joh. 6.44, 45. The natural man cannot understand the things of God, but judges them foolishness. 1 Cor. 2.14. His wisdom cannot be subject to the Law of God. Rom. 8.7. He cannot call the Lord, Jesus, except by the Spirit of Jesus, 1 Cor. 12.3. He is a withered branch being out of Christ, and can do nothing, Joh. 15.3.4.

It shall be clear to any, that the Holy Ghost denyeth any such power, as they af∣firm. It reckons not much to tell that Jesuits, as Martmez de Ripul. Suarez, Alphonsus Curiel, Duvallius, Lod. Molma, Did. Ruiz, Vasquez, Bellarmine, Phili. Samachaeus, Sorbonicus, Gulie. Estius, Dominica, Toletus Cardinalis, Pirerius, Salmeron, teach that, without saving grace, men may, and can first know moral truths, shining virtues, as heathens, be free of sin, as touching these virtues in their due circumstances. 2. Keep the Commandments and Law of Nature. 3. Dispose themselves for, and obtain the grace of Conversion by their own industry. 4. Be victorious over this or that weighty temptation singly taken. 5. That there is no intrinsical hurt of free-will, that it is wounded a little, because of the darkness of the mind, and languor of nature, but not dead to actions supernatural. 6. That we may love God as the Author of nature, and Creator sincerely; And Arminians teach that we may without the Spirit of God know all truth, quantum sufficit ad salutem, sufficiently to salvation, and so may will, love, and believe without the infused supernatural habit or grace, so their Apology.

+venture+of+heaven%2C+such+as+was+the+case+of+the+first+Adam.+3.+Christ+dyed+not+to+purchase+a+new+heart+more+to+one+then+to+another%2C+whereas+1+Pet.+1.18%2C+19.+the+blood+the+Lord+shed+is+to+Redeem+us+from+our+vain+conversation%2C+in+a+natural+state+as+well+as+to+save+us+from+the+wrath+to+come%3B+Then+must+Christ+have+died+to+buy+Pagans+from+Paganism+and+Idolatry%3A+and+that+either+absolutely%2C+and+then+why+should+multitudes+so+die+in+their+sins%3F%0A%0AIf+conditionally%2C+what+can+be+the+condition+going+before+conversion%2C+to+wit%2C+that+we+should+be+delivered+from+our+vain+conversation%2C+so+we+be+willing%2C+before+our+conversion%2C+to+be+delivered+from+our+vain+conversation.+And+shall+not+the+Question+recur+concerning+that+condition%3F+In+a+word+they+will+have+Christ%E2%80%99s+death+to+buy+Heaven%2C+but+not+to+buy+faith%2C+without+which+Heaven+is+impossible.+Yea+he+no+more+bought+to+men+a+grace+sweetly+and+strongly+inclining+the+will+to+believe%2C+then+he+bought+such+a+grace+to+the+damned+devils.+He+purposed+to+give+to+all+Pagans+a+power+by+which+they+should+be+made+fit+to+perform+all+that+the+Gospel+requires%2C+and+be+fit+to+be+made+partakers+of+the+inheritance+of+the+Saints%2C+Col.+1.+And+yet+Paul+gives+thanks+to+God+for+that+bestowed+on+the+Colossians%2C+and+God+must+by+this+call+all+men+to+Christ%2C+either+mediately+or+immediately.%0A%0AAnd+say+that+God+is+prepared+ever+to+give+more+and+more+as+we+use+the+former+well%2C+and+that+all+by+sufficient+grace+%28saith+Corvinus%29+are+disposed+to+conversion%2C+but+that+sufficiency+is+not+habitual+grace%2C+but+actual+assistance+conveying+the+Preached+Word%2C+which+is+to+bring+all+to+free-wills+power%2C+rejecting+all+infused+power%2C+and+to+make+an+influence+of+grace%2C+which+is+in+the+power+of+free+will+to+use+or+not+to+use%2C+and+to+stand+in+two.+1.+In+a+measure+of+heavenly+Doctrine.+2.+In+the+stirring+upon+the+heart%3B+Whence+1.+Grace+habitual+so+is+denied%3B+then+the+will+needeth+no+healing.+2.+Grace+universal+ n+first+know+moral+truths%2C+shining+virtues%2C+as+heathens%2C+be+free+of+sin%2C+as+touching+these+virtues+in+their+due+circumstances.+2.+Keep+the+Commandments+and+Law+of+Nature.+3.+Dispose+themselves+for%2C+and+obtain+the+grace+of+Conversion+by+their+own+industry.+4.+Be+victorious+over+this+or+that+weighty+temptation+singly+taken.+5.+That+there+is+no+intrinsical+hurt+of+free-will%2C+that+it+is+wounded+a+little%2C+because+of+the+darkness+of+the+mind%2C+and+languor+of+nature%2C+but+not+dead+to+actions+supernatural.+6.+That+we+may+love+God+as+the+Author+of+nature%2C+and+Creator+sincerely%3B+And+Arminians+teach+that+we+may+without+the+Spirit+of+God+know+all+truth%2C+quantum+sufficit+ad+salutem%2C+sufficiently+to+salvation%2C+and+so+may+will%2C+love%2C+and+believe+without+the+infused+supernatural+habit+or+grace%2C+so+their+Apology.%0A%0AAnd+the+Socinian+Catechism%2C+c.+6.+pag.+212.+and+Socinus+himself%2C+Praelect.+Theol.+Cap.+4.+Fol.+15%2C+16.+Et+de+officio+hominis+Christi%3A+Cap.+5.+Smalcius+on+Joh.+1.+Hom.+3.+Give+to+us+man+whole%2C+sound%2C+sinless%2C+as+he+came+from+the+first+Adam.+2.+That+man+can+do+all+that+Cod+commands+him+with+little+help+of+God.+3.+It%E2%80%99s+an+error+%28saith+Smalcius%29+that+a+man+hath+no+strength+in+spiritual+things%2C+there+is+no+need+of+the+inward+gift+of+the+Spirit+of+God+to+believe+%28saith+the+Racovian+Catechism%29+for+we+read+not+that+such+a+gift+in+Scripture+is+bestowed+upon+any+but+upon+believers%3A+such+as+are+born+of+Adam+%28saith+Socinus%29+are+all+born+in+the+same+condition%2C+and+nothing+is+taken+from+such+a+man%2C+which+he+naturally+hath+or+was+to+have.+Ostorodius+Justi.+Relig.+Christ.+cap.+21.+Praedicatio+sola+Euangelij+potest+hominem+abs%7Bque%7D+intern%C3%A1+Spiritus+illuminatione%2C+%26+operatione+%C3%A0+peccatis+convertere.+The+only+Preaching+of+the+Gospel+without+the+inward+illumination+by+the+Holy+Spirit%2C+and+his+working+is+able+to+convert+a+man+from+sin.+All+which+is+Printed+and+taught%2C+and+many+other+abominable+errors+to+us.%0A%0ATo+this+Objection+against+universal+grace+%28as+I+judge+unanswerable%29+Corvinus+Answers%2C+that+all+the+places+of+Scripture+brought+to+prove+man%E2%80%99s+inability+to+believe+in+Christ%2C+and+to+worship+him%2C+conclude+well+that+a+man+hath+not+strength+of+himself+without+Christ+and+his+grace%3B+but+this+is+but+to+cloud+the+truth%2C+and+to+mock+the+reader%2C+for+if+all+and+every+man+%28even+the+Infants+of+Pagans%29+be+in+Covenant+through+Christ%2C+and+be+made+able+by+a+gifted+grace+common+to+all%2C+within%2C+and+without+the+Church%2C+by+which+they+are+able+by+degrees+to+do+all+that+the+Gospel+requires%2C+what+avails+it+to+discourage+them%2C+and+to+tell%2C+they+are+not+masters+of+a+good+thought%2C+without+grace%3B+for+they+are+no+less+masters+of+good+thoughts+and+good+words%2C+and+of+good+actions+then+Adam+was%3B+for+they+are+not+hearers+of+the+Gospel+by+nature%2C+but+as+gifted+with+universal+grace%2C+they+are+hearers%2C+and+before+their+conversion%2C+and+before+they+receive+the+Spirit+of+Regeneration%2C+can+please+God%2C+and+prepare+themselves+for+Regeneration%3A%0A%0AYea+there+is+no+animal+and+natural+Pagan+de+facto+existing+in+the+world+%28by+their+way%29+who+cannot+receive+the+things+of+God%2C+and+cannot+come+to+Christ%2C+except+he+be+drawn%2C+for+all+Pagans+and+others+are+drawn%2C+and+by+this+it+might+have+been+said%2C+Adam+as+wanting+supernatural+grace%2C+and+as+a+natural+man+%28for+the+Image+of+God+was+supernatural+grace+to+Adam%2C+as+Arminius+and+Corvinus+teach%29+so%2C+was+not+able+to+think+a+good+thought%2C+as+2+Cor.+3.5.+nor+able+to+receive+the+things+of+God%2C+as+the+natural+man%2C+1+Cor.+2.14.+and+Adam+so+was+also+dead+in+trespasses+and+sins%2C+and+must+come+to+Christ+the+same+way%2C+to+wit%2C+drawn+by+the+grace+super-added+to+nature%2C+as+we+fallen+sinners+do.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+covenant+of+life+opened%2C+or%2C+A+treatise+of+the+covenant+of+grace%2C+%28Edinburgh%3A+Robert+Brown%2C+1655%29%2C+1.15%2C+pp+12 <blockquote><p>In his review of a sermon by his fellow New York Presbyterian, Gardiner Spring, the nineteenth-century American Reformed Presbyterian, Alexander McLeod, made the following interesting distinction between the original (liberal) Remonstrant Arminians and later evangelical Arminians:

However decidedly we are ourselves opposed to Arminian tenets, we would not think it becoming to class all men, who disagree with us upon the doctrine of election, among the venomous seed of the serpent. The judgment of men’s persons and state belongs to God.

We think it, therefore, at least indecorous in the preacher, to designate, not only such men as Episcopius and old John Goodwin, but also John Wesley and Adam Clarke, and the great body of respectable men, who are associated, in so many benevolent institutions, along with himself [Gardiner Spring] in this city [New York], as “the seed of the serpent spiting our their venom,” because they do not recognize his doctrine of election.

While, with all our talents, we oppose their doctrines, whereinsoever we think them erroneous, we esteem it altogether improper to hold up their persons in such an execrable light, and disgusting attitude, to public detestation – “the seed of the serpent spitting out venom.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ddfaddc4a" data-kw="">
<blockquote><p>He that being in health or [is] sick, shall contemn physic, let him be condemned of stubbornness and counted as an heretic: unto whom also afterwards, less benefit and duty is due from others; nay, he shall be counted unworthy [of] the fellowship of citizens. For he has tempted God and with the rebellious Jews required miracles, when as without miracles he might have had experience of the grace of God. Whosoever shall affirm that it is lawful for Christians in the time of the plague, without a lawful cause and consent of the rulers, to leave his city and church, he is worthy [of] the name of a schismatic… And he that shall hold every plague to be as an immediate punishment from God, is to be condemned of ignorance and to be despised as an evil speaker: as one that lays upon God his own rashness and blame of his own reckless negligence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, (London, 1583), bk. 2, ch. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-5483cd99bf" data-kw="">
<blockquote><p>Now we must treat of going aside; for so I had rather call it, than flying; though I think it the part of a wise-man to fly peril with reason. There are some therefore, which do without exception find fault with going aside for the plague, that they count it a very heinous offence, though they think that those which tarry ought not to use rashness. There are on the other side which hold that every man, so soon as the plague cometh, ought to provide for himself, having no regard, or but very small of the fellowship and duties which Christian Charity doth command. Now I for my part do dissent from both these and especially from the latter, as having most lawful causes:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Learned &amp; Pithy Treatise of the Plague, Wherein are Handled These Two Questions</cite>, (1580; London, 1665), p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-b5a3e459c4" data-kw="">
<blockquote><p>Wilt thou not be ruled by the laws, unless thou see the king? wilt thou not fear the infection of the plague unless thou see it? Use thy reason for thy soul as well as for thy body…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 399</span></figcaption>

</figure><figure class="quote" id="q-612767d253" data-kw="">
<blockquote><p>It is their [the magistrates’] duty therefore to remove all such things for which, as is before showed, the Lord sends the pestilence and other grievous diseases; they must follow the example of David in this place who humbled himself before the Lord, who prayed for himself and for the people, and built an altar and offered up sacrifice; that is, they must maintain God’s truth to the uttermost of their power; they must set forward the preaching of the Word; they must with good Hezekiah and Josiah remove all idolatry and superstition (2 Kings 18:4; 23:4); they must also with David labor to find out the cause of God’s punishment, and remove it as he did when famine was in his land (2 Sam. 21:1,9): for it is greatly to be feared that there be many which never consider what are, or may be, the causes of any calamity, nor seek any means how to pacify God. The magistrates also at such times must make good laws and see them faithfully executed. They must remove all disorders whereby God has been offended, they must punish and suppress the wicked which are indeed the very botches and sores, and contagion of the commonwealth. They must as David speaks of himself ‘destroy betimes all the workers of iniquity, and cut off the wicked from the city of the Lord’ (Ps. 101:8). They must also have a diligent care to remove such things which impoverish the country, as wicked gaming, luxuriousness in meat, drink and apparel, and such like. Such [consuming] caterpillars must be looked unto before all be consumed, for then it will be too late to spare when such devourers have swallowed up all after such manner, and then must men be put to many very wicked shifts to maintain their [immoral] bravery and to feed their greedy paunch, whereof we have lamentable experience at this day. For what is the cause of such robbing and spoiling both by land and sea, and of such horrible oppression and extortion everywhere but only this, that men having been long acquainted with bravery and dainty morsels, can hardly forego it, they had rather put a thousand wicked shifts in practice, yea they had rather hazard their lives everyday than that they would abate anything of their stately port, which under a show of wealth and great substance (although but being beggars indeed) they have long maintained, and from hence has sprung all kind[s] of cousonage and devilish deceit, whereby men overreach one another daily in their bargains and contracts. In times past they had good laws, even among the heathen people, to bridle all idle expenses and such as lavished their goods willfully. It were to be wished that such laws were now in use to take away the wonderful prodigality of this time. Usurers also, brokers, badgers and hucksters, and such like locusts that eat up the poor and cause the markets to be inhaunted [infrequented] should be bridled to the end [that] the poor may have things better cheap, and to the end [that] magistrates may perform these things and all other duties that belong unto them in time of war, pestilence and famine. … …The common treasure of cities also must sometimes serve for the relieving of the poor, which thing has been done in many famous cities, etc., it were far better that it should be so employed, than as it is many times upon feasting and vain shows… These things, therefore, if magistrates carefully perform, they shall offer an acceptable sacrifice to God, as David did at this time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cupper.html">William Cupper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 341-47 of Sermon 10 in Certain Sermons Concerning God’s Late Visitation in the City of London and other parts of the land, teaching all men to make use thereof, that mean to profit by God’s fatherly chastisements… (London, 1592)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

ing been long acquainted with bravery and dainty morsels, can hardly forego it, they had rather put a thousand wicked shifts in practice, yea they had rather hazard their lives everyday than that they would abate anything of their stately port, which under a show of wealth and great substance (although but being beggars indeed) they have long maintained, and from hence has sprung all kind[s] of cousonage and devilish deceit, whereby men overreach one another daily in their bargains and contracts. In times past they had good laws, even among the heathen people, to bridle all idle expenses and such as lavished their goods willfully. It were to be wished that such laws were now in use to take away the wonderful prodigality of this time. Usurers also, brokers, badgers and hucksters, and such like locusts that eat up the poor and cause the markets to be inhaunted [infrequented] should be bridled to the end [that] the poor may have things better cheap, and to the end [that] magistrates may perform these things and all other duties that belong unto them in time of war, pestilence and famine. … …The common treasure of cities also must sometimes serve for the relieving of the poor, which thing has been done in many famous cities, etc., it were far better that it should be so employed, than as it is many times upon feasting and vain shows… These things, therefore, if magistrates carefully perform, they shall offer an acceptable sacrifice to God, as David did at this time.”

e+when+such+devourers+have+swallowed+up+all+after+such+manner%2C+and+then+must+men+be+put+to+many+very+wicked+shifts+to+maintain+their+%5Bimmoral%5D+bravery+and+to+feed+their+greedy+paunch%2C+whereof+we+have+lamentable+experience+at+this+day.+For+what+is+the+cause+of+such+robbing+and+spoiling+both+by+land+and+sea%2C+and+of+such+horrible+oppression+and+extortion+everywhere+but+only+this%2C+that+men+having+been+long+acquainted+with+bravery+and+dainty+morsels%2C+can+hardly+forego+it%2C+they+had+rather+put+a+thousand+wicked+shifts+in+practice%2C+yea+they+had+rather+hazard+their+lives+everyday+than+that+they+would+abate+anything+of+their+stately+port%2C+which+under+a+show+of+wealth+and+great+substance+%28although+but+being+beggars+indeed%29+they+have+long+maintained%2C+and+from+hence+has+sprung+all+kind%5Bs%5D+of+cousonage+and+devilish+deceit%2C+whereby+men+overreach+one+another+daily+in+their+bargains+and+contracts.+In+times+past+they+had+good+laws%2C+even+among+the+heathen+people%2C+to+bridle+all+idle+expenses+and+such+as+lavished+their+goods+willfully.+It+were+to+be+wished+that+such+laws+were+now+in+use+to+take+away+the+wonderful+prodigality+of+this+time.+Usurers+also%2C+brokers%2C+badgers+and+hucksters%2C+and+such+like+locusts+that+eat+up+the+poor+and+cause+the+markets+to+be+inhaunted+%5Binfrequented%5D+should+be+bridled+to+the+end+%5Bthat%5D+the+poor+may+have+things+better+cheap%2C+and+to+the+end+%5Bthat%5D+magistrates+may+perform+these+things+and+all+other+duties+that+belong+unto+them+in+time+of+war%2C+pestilence+and+famine.+%E2%80%A6+%E2%80%A6The+common+treasure+of+cities+also+must+sometimes+serve+for+the+relieving+of+the+poor%2C+which+thing+has+been+done+in+many+famous+cities%2C+etc.%2C+it+were+far+better+that+it+should+be+so+employed%2C+than+as+it+is+many+times+upon+feasting+and+vain+shows%E2%80%A6+These+things%2C+therefore%2C+if+magistrates+carefully+perform%2C+they+shall+offer+an+acceptable+sacrifice+to+God%2C+as+David+did+at+this+time.%E2%80%9D%0A%0A%E2%80%94+William+Cupper%2C+pp.+341-47+of+Sermon+10+in+Certain+Sermons+Concerning+God%E2%80%99s+Late+Visitation+in+the+City+of+London+and+other+parts+of+the+land%2C+teaching+all+men+to+make+use+thereof%2C+that+mean+to+profit+by+God%E2%80%99s+fatherly+chastisements%E2%80%A6+%28London%2C+1592%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F612767d253.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/612767d253.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/historic-reformed-quotes-on-social-distancing-the-adaptation-of-the-church/#:~:text=It%20is%20their%20%5Bthe%20magistrates%E2%80%99%5D%20duty,as%20David%20did%20at%20this%20time&amp;text=It%20is%20their%20%5Bthe%20magistrates%E2%80%99%5D%20duty%20therefore%20to&amp;text=to%20God%2C%20as%20David%20did%20at%20this%20time" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

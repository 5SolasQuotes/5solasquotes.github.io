<main class="wrap"><figure class="quote" id="q-5cb0ccd1ba" data-kw="">
<blockquote><p>…Calvin protested [to the French king] “in truth before God” that Geneva has “never attempted to send persons into your kingdom.” Explaining matters further, the letter declared: “that never with our knowledge and permission has someone gone from here to preach except one individual who was requested from us for the city of London… So then, the Genevan ministers say they encouraged some people to exercise their gifts everywhere. There is, however, the clear implication that was all they did. The explanation would appear to wish to persuade the king that what he has heard of as Geneva sending ministers into his kingdom is actually a simple case of free preachers and godly men wandering of their own free will into the king’s territory… The answers to both concerns are, according to Calvin and Beza’s own Augustinian understanding of lying, plainly speech contra mentem. They did send preachers into France and they were involved in dissensions of precisely the kind about which the king was asking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Precepts: Beauty is a mode of being, by which that being is understood to participate in comeliness. It is uncreated or created. Uncreated beauty is only of God; created is the work of God and of artificial things, so far as they agree with his causal intellect and will.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-c7993e6b31" data-kw="">
<blockquote><p>Beauty and goodness in a thing are identical fundamentally; for they are based upon the same thing, namely, the form; and consequently goodness is praised as beauty. But they differ logically, for goodness properly relates to the appetite (goodness being what all things desire); and therefore it has the aspect of an end (the appetite being a kind of movement towards a thing). On the other hand, beauty relates to the cognitive faculty; for beautiful things are those which please when seen. Hence beauty consists in due proportion; for the senses delight in things duly proportioned, as in what is after their own kind—because even sense is a sort of reason, just as is every cognitive faculty. Now since knowledge is by assimilation, and similarity relates to form, beauty properly belongs to the nature of a formal cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1, q. 5, art. 4, reply to obj. 1</span></figcaption>

<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-e4c650ec92" data-kw="">
<blockquote><p>1. Tell them that you love them, aren’t ashamed of them, and that this is something that you have had to overcome. Tell them they can do the same.

2. Tell them that porn is bad for them spiritually, physically, and relationally. And then explain how.

3. Tell them that you are going to set up ‘speed bumps’ to help them when they’re tempted but it comes down to their desire to live with integrity. Those speed bumps are: a. Filters (on devices &amp; internet protocol) b. Screens only in shared spaces c. Weekly check-ups: ‘Have you looked at porn of any form this week?’

4. Ask them to identify the a) the times that are most tempted and b) the things that seem to trigger the desire to look at porn.

5. Show them ways to deal with stress that are productive: bible reading, prayer, running, pushups, developing a skill, etc.

6. Remind them again that you love them, porn makes you weak, and living a lie is hell. Let them know that you won’t look down on them if they stumble and they need to let you know so you can conquer together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pastor-michael-foster.html">Pastor Michael Foster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An answer over social media to someone asking for advice regarding a pre-teen with a porn addiction</cite></span></figcaption>

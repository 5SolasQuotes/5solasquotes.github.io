<main class="wrap"><figure class="quote" id="q-388637a961" data-kw="">
<blockquote><p>You know how many English Martyrs did sacrifice their lives in protesting against the sacrifice in the Mass, and though some black-mouthed Priests of late have called them Foxes-Martyrs, yet I will be bold to call them the Martyrs of the Lord Jesus, and the Martyrs of the Holy Ghost. I must beg time to prove what I say, it is a weighty truth, and we know not how soon we may be called to seal this truth with our dearest blood.

The Apostle proves it undeniably, by sundry arguments, in the Epistle to the Hebrews, in the 7. 8. 9. and 10th Chapters. I will pitch upon the tenth, because there you have the sum of all. There is no other Sacrifice which can take away sin, but the Sacrifice which Jesus Christ himself offered upon the Cross; read the tenth verse. By the which will we are sanctified through the offering: of what? of a wafer-cake? no, of the body of Jesus Christ: But how often must his body be offered? once for all, not as often as there is a Mass, but once for all. But who must offer the body of Christ? why, Christ himself, this Man, verse the 12th a Mass-Priest cannot offer up the body of Christ, for Christ is both Priest, and Sacrifice. But may not a Mass-Priest offer some other sacrifice for sins? No, there is but one sacrifice for sin, ver. 12. But this man after he had offered one sacrifice for sins, and that one sacrifice is to be but once offered; the Apostle repeats this, that we might not forget it, this sacrifice was offered once for all, verse 10. once for ever, verse 12. once for all sins, once for all times, it is of perpetual virtue and merit, once for ever: Is not that plain and full?

Oh but Christ is gone to heaven, and we are not yet perfected. Why vain man, Christ hath finished his work, and therefore is gone to heaven, he is sate down, ver. 12. and he hath done his work, or else he would not sit down, he hath not left any part of the Service to be perfected by a Mass-priest, and therefore do not expect to be perfected by any other offering in the Mass, or out of the Mass: read the 14. verse, For by one offering he hath perfected for ever them that are sanctified: Ye are sanctified by that one offering, verse 10. and perfected by it, verse 14. But who is the witness of this truth? why, the Holy Ghost, in the very next verse, the 15th. verse; Whereof the Holy Ghost also is a witness to us.

Judge now, whether they that did bear witness to this truth, be not Co-martyrs with the Holy Ghost, and therefore Co-heirs with Jesus Christ. You see what reason we have to Protest against that Babylonian sacrifice in the Mass. You have now received the knowledge of this truth, and if you sin willfully after you have received the knowledge of the truth, it is principally meant of this truth, there remains no more sacrifice for sin, because ye have wilfully and maliciously rejected the Only All-sufficient Sacrifice of Jesus Christ, trusting upon some other Sacrifice, that of the Mass, or the like, and done despite to the Spirit, by a most malignant contempt of the witness of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), pp 33-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e6f7e973a7" data-kw="">
<blockquote><p>In our national and social affairs a wholesome, timely, and needed reaction has begun to set in against the false catholicity that was undermining the public welfare. Patriotism and statesmanship have begun to deal at various points with the question whether we have not swung open somewhat too widely the doors of our national hospitality.

Our loud invitation—”Ho, every one!”—has gone beyond the limits of public safety. We are watching somewhat more closely the immigrants across the two great oceans. We begin to question whether we are equal to the entertainment, government and assimilation of such a mixed multitude, who fall a-lusting so soon and so grossly after liberties and indulgences that are so strange, intolerable and abhorrent to us.

We object to the emptying upon our shores of the poorhouses and prisons and slums and lazarettos of the Old World; we send back the imported refuse, and hold the importers responsible. Economists, and not demagogues of labour only, are writing on our statute-books restrictions upon the unlimited importation of foreign labour. Propositions are pending, or are awaiting introduction in our national Senate, against the free admission of anarchists and the deluded converts of Mormon emissaries.</p></blockquote>

<blockquote><p>Another question arises about the reality of real relation, namely whether there is a real distinction between the relation itself and its absolute foundation, on which see chapter 8 below. Quantity too gives some difficulty, namely whether it is merely a mode or modal accident of substance or not. For Scholastics, in order to explain how the sensible species of the Eucharist can be sustained miraculously in the absence of the substance of bread and wine, seem to have changed, and perhaps not a little, the original Aristotelian opinion. But this question seems rather to belong to theology than to philosophy.</p></blockquote>

<blockquote><p>Their [Rome’s] unbloody Sacrifice (as they style it) of a feigned transubstantiated body, is far worse then if they had such Sacrifices of beasts and fowls, as were under the Law. Those sacrifices, at that time, did set out the virtue of Christ’s death, and nourish their faith and hope in the benefits thereof. But the fore-said Popish sacrifice would take away the virtue and efficacy of Christ’s sacrifice, if it could be taken away.

For I demand, whether the sacrifice that they pretend to offer up, be the very same, that Christ himself offered upon the cross. If they say, the same, what need is there that it should be offered up again? Was not Christ’s once offering of it up sufficient? The Apostle doth assuredly intend as much by his frequent mention of this word once, which is exclusively to be taken: once for all, and not to be reiterated. If it be another sacrifice, then the sacrifice of Christ was not perfect.

For hereby the Apostle proveth the Priesthood of the Law to be unperfect; because another was to succeed in the room of it. Whereas some say, that their offering up of the body of Christ, is but by way of application; that seems to contradict their own position; for they teach that the fore-mentioned transubstantiated body, offered up by a Priest, is a true, real, propitiatory sacrifice for the quick and dead.

Besides, the end of Christ’s intercession, and the virtue thereof is made void by that which is avouched of the applicatory virtue of their sacrifice. For the continual application of Christ’s own sacrifice, is the end of Christ’s intercession. They think to evade all these absurdities by a distinction betwixt a bloody and unbloody sacrifice, saying, that the sacrifice which Christ himself offered up was a bloody sacrifice, but that which they offer up, unbloody. To this distinction I answer.

1. It’s without any warrant or ground from Scripture.

2. It being applied, according to their position, to one and the same thing (for they say that the body of Christ, which their Priest offereth up, is the very same that Christ offered upon the cross) it implieth contradictory terms, namely, that the same thing should be bloody and unbloody.

3. According to their own position, their sacrifice cannot be unbloody: for they hold that the wine is transubstantiated into blood, as well as the bread into a body, and both make one sacrifice. How can that be unbloody, which consists of blood? Yea, of blood poured out, as their wine is into the chalice, and out of the chalice into the Priests mouth.

4. If it be unbloody, it hath no virtue for the taking away of sin: For without shedding of blood is no remission.</p></blockquote>

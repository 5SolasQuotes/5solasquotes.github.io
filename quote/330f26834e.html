<main class="wrap"><figure class="quote" id="q-330f26834e" data-kw="">
<blockquote><p>Why is it right to defend ourselves against unlawful violence?

Self-defence against unlawful violence is always legitimate. It is more than legitimate: it is a moral obligation. Our life is not our own; it belongs to God, and therefore as stewards of God’s possessions we are under obligation to preserve our own life, and the lives of others, from destruction by criminal violence. The principle that necessary self-defence is legitimate is generally upheld by the civil laws of nations.

To claim that the “Golden Rule,” or the obligation to love our neighbour, means that it is wrong to kill in an effort at self-defence is to push loving our neighbour to an absurd and fanatical extreme. The Scripture commands a person to love his neighbour as himself: that is, love for one’s neighbour is to be kept in balance with a proper love for oneself. The person who will let himself be murdered by a criminal, without attempting self-defence, loves his neighbour too much, and does not love himself enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 369-70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06eb791890" data-kw="">
<blockquote><p>No adventitious circumstance can equitably be made a qualification for the enjoyment of political rights. Such for example as property, or the color of a man’s skin! These do not confer upon their possessors either peculiarity of claim or fitness for the exercise of political rights. Property does not make a man either wiser or better: nor does the color of his skin or the shade of his complexion. An aristocracy based on the principle of education and mental superiority would be perfect wisdom in comparison of an aristocracy based on the principle of property or of color! This is so intuitively evident that I am afraid the man who docs not admit it as a first principle in the science of government is not to be convinced by argument, nor reached by any conclusion however legitimately drawn from the principles of equity.

The pretence that property gives its possessor a greater interest in the welfare of a state, and therefore a right to greater weight and influence in the government, is too superficial to satisfy any one, except such as are in possession of the assumed qualification, or those whose prejudices are enlisted already in its favor. […]

It is impossible to establish the equity of imposing taxation upon a citizen, and at the same time deny him the right of elective suffrage; thus subjecting him to the operation of laws which he has no power, directly or indirectly, of making. The fact that a man is to be made the subject of a law, is a sufficient reason on grounds of equity why he should have a voice in making that law; unless he may be disqualified by vice or by incompetence. But keeping out of view such exceptions as are necessary to preserve equity, and secure the objects for which civil society has been instituted, justice requires that every man should have a right to say by what laws he is to be governed, irrespective of any adventitious circumstance. Property furnishes no security to society that political rights will be properly exercised. A poor but virtuous man may take a deeper interest in the welfare of the state than his rich but wicked neighbor; and will most certainly promote its welfare incomparably more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 247-9.</span></figcaption>

<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>

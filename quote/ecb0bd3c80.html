<main class="wrap"><figure class="quote" id="q-ecb0bd3c80" data-kw="">
<blockquote><p>As I understand it, Paul was making one of two distinctions: (1) women in general are to remain silent in church, with only a special group of them permitted to prophesy (being marked as a special group by a peculiar kind of covering for their heads); or (2) there was a distinct kind of prophesying practised by Christian women outside of the actual worship service. It is my opinion that the latter interpretation is preferable… Women who possessed this [non-continuing] gift [of prophecy] were to demonstrate their femininity either by putting on a special kind of covering, or by wearing their hair in a particular way… they were not to exercise the gift during the corporate worship of the church (14:34)… A woman has her long hair instead of a veil to serve as her proper covering. A man is to wear his hair shorter than women do, because he is to have his head uncovered. The passage is quite specific: long hair is the equivalent of covering, while short hair is the same as an uncovered head… In conclusion, the eleventh chapter of First Corinthians has absolutely nothing to do with hats. Men may wear hats if they so desire; they may not wear long hair… What is relevant is the respective length of men and women’s hair. That is the focus of Paul’s argumentation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gary-north.html">Gary North</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covering for the Woman’s Head’ Banner of Truth Magazine</cite>, (Oct. 1971), reprinted by Geoff Thomas (Oct. 2010).</span></figcaption>

<blockquote><p>‘with her head uncovered’. It may seem strange from whom the Corinthian women should take up this custom, since the Jewish women were not allowed to go into the streets, or into any open and public place, unveiled (Maimonides, Hilch. Ishot, ch. 24, sect. 12). It was a Jewish law, that they should go out nowhere bare-headed (Babylonian Talmud, Cethubot, fol. 72. 1): yea, it was reckoned scandalous and ignominious to do so. Hence it is said, שגלוי הראש גנאי להם, “that uncovering of the head is a reproach” to the daughters of Israel (Rabbi Solomon Jarchi on Numb. 5:19)… So that there it should seem that these Corinthians followed the examples of the heathens: but then, though it might be the custom of some nations for women to go abroad bare headed; yet at their solemnities, where and when they were admitted, for they were not everywhere and always, they used to attend with their heads veiled and covered (Alex., ab Alex. Genial. Dier., bk. 4, ch. 17)… ‘for that is even all one as if she were shaven’; to be without a veil, or some sort of covering on her head, according to the custom of the country, is the same thing as if her head was shaved;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11</cite>, v. 5</span></figcaption>

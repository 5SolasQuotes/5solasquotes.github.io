<blockquote><p>Every Man ought to perform the Duties incumbent upon him as a Member of Society, or as resulting from the various Relations he stands in to others. From divine Institutions and human Compacts, various Relations arise, such as, Husband and Wife, Parents and Children, Magistrates and Subjects, Fellow-Citizens, or Members of lesser Communities having an equal Right with ourselves; from which many Duties do result, according to the Rules of Justice, Goodness and Truth; of which many Authors have treated largely and well: all which are to be observed in Conformity to the divine Justice and Law. Render therefore to every one their Due. Fear to whom Fear, Honour to whom Honour, Tribute to whom Tribute, &amp;c. Whatsoever Things ye would that others should do unto you, do ye the same to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-clap.html">Thomas Clap</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An essay on the nature and foundation of moral virtue and obligation; being a short introduction to the study of ethics; for the use of students of Yale-College</cite>, (New Haven: B. Mecom, 1765), p. 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c42601cb2" data-kw="">
<blockquote><p>I. The first thing I have to show is the general excellence of freedom.

On this point some readers may think it needless to say anything: they imagine that all men know the value of freedom, and that to dwell on it is a mere waste of time. I do not agree with such people at all. I believe that myriads of Englishmen know nothing of the blessings which they enjoy in their own land: they have grown up from infancy to manhood in the midst of free institutions. They have not the least idea of the state of things in other countries: they are ignorant alike of those two worst forms of tyranny,—the crushing tyranny of a cruel military despot, and the intolerant tyranny of an unreasoning mob. In short, many Englishmen know nothing of the value of liberty, just because they have been born in the middle of it, and have never been for a moment without it.

I call then on every one who reads this paper to remember that liberty is one of the greatest temporal blessings that man can have on this side the grave. We live in a land where our bodies are free. So long as we hurt nobody’s person, or property, or character, no one can touch us: the poorest man’s house is his castle. We live in a land where our actions are free. So long as we support ourselves, we are free to choose what we will do, where we will go, and how we will spend our time. We live in a land where our consciences are free. So long as we hold quietly on our own way, and do not interfere with others, we are free to worship God as we please, and no man can compel us to take his way to heaven. We live in a land where no foreigner rules over us. Our laws are made and altered by Englishmen like ourselves, and our Governors dwell by our side, bone of our bone and flesh of our flesh.

In short, we have every kind of freedom to an extent which no other nation on earth can equal. We have personal freedom, civil freedom, religious freedom, and national freedom. We have free bodies, free consciences, free speech, free thought, free action, free Bibles, a free press, and free homes. How vast is this list of privileges! How endless the comforts which it contains! The full value of them can never perhaps be known. Well said the Jewish Rabbins in ancient days: ‘If the sea were ink and the world parchment, it would never serve to describe the praises of liberty.’

The want of this freedom has been the most fertile cause of misery to nations in every age of the world. What reader of the Bible can fail to remember the sorrows of the children of Israel, when they were bondmen under Pharaoh in Egypt, or under Philistines in Canaan? What student of history needs to be reminded of the woes inflicted on the Netherlands, Poland, Spain, and Italy by the hand of foreign oppressors, or the Inquisition? Who, even in our own time, has not heard of that enormous fountain of wretchedness, the slavery of the Negro race? No misery certainly is so great as the misery of slavery.

To win and preserve freedom has been the aim of many national struggles which have deluged the earth with blood. Liberty has been the cause in which myriads of Greeks, and Romans, and Germans, and Poles, and Swiss, and Englishmen, and Americans have willingly laid down their lives. No price has been thought too great to pay in order that nations might be free.

The champions of freedom in every age have been justly esteemed among the greatest benefactors of mankind. Such names as Moses and Gideon in Jewish history, such names as the Spartan Leonidas, the Roman Horatius, the German Martin Luther, the Swedish Gustavus Vasa, the Swiss William Tell, the Scotch Robert Bruce and John Knox, the English Alfred and Hampden and the Puritans, the American George Washington, are deservedly embalmed in history, and will never be forgotten. To be the mother of many patriots is the highest praise of a nation.

The enemies of freedom in every age have been rightly regarded as the pests and nuisances of their times. Such names as Pharaoh in Egypt, Dionysius at Syracuse, Nero at Rome, Charles IX. in France, bloody Mary in England, are names which will never be rescued from disgrace. The public opinion of mankind will never cease to condemn them, on the one ground that they would not let people be free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Religion: Being Plain Papers on the Daily Duties, Experience, Dangers, and Privileges of Professing Christians</cite>, (1878; Edinburgh: Banner of Truth, 2013), pp 200-02.</span></figcaption>

<blockquote><p>In George Smeaton’s preface to the 1871 edition of the elder Thomas McCrie’s classic defence of the establishment principle, Statement of the Difference the Free Church theologian explained the circumstances that had given rise to the publication of McCrie’s book:

THE celebrated Statement of the late Dr M’Crie, of which a reprint in full is here presented to the public, was drawn up with the express design of exhibiting the difference between the profession of the Reformed Church of Scotland and the theory of Voluntaryism. The latter term, indeed, was not yet in common use. The question discussed, however, was precisely the same. It was not the question as in former times: with what restrictions and with what regard to the church’s intrinsic freedom may magistrates competently exercise their power about religion? It was the absolute question: is any power whatever competent to the Christian Civil ruler in seeking to further the cause of Christ?

Dr M’Crie’s work discusses this point, and possesses the following peculiarities:— It is a masterly defence of the principle of Establishments as a scripture truth; and the most complete vindication ever given to the world of the position occupied by the Reformed Church of Scotland on the whole subject of national religion, and of the magistrate’s legitimate power in promoting it.

The occasion which called forth the treatise, was as follows. A change had been introduced into the testimony of the church of which Dr M’Crie was a minister, on the question of the Civil Ruler’s authority and duty in reference to religion. About the same period, that is, during the last decennium of the previous century, the leaven of Voluntaryism, or, the theory that it is not competent to the Christian ruler to exercise his authority and influence in behalf of religion in any form, — began to work within the pale both of the Burgher and Antiburgher sections of the Secession Church. To the latter only, as the Denomination to which Dr M’Crie belonged, do we deem it necessary to refer in this place.

In the Antiburgher Synod, or General Associate Synod, as it was termed, a motion was made in 1795 to take steps for preparing or compiling a new Historical and Doctrinal Testimony for the use of the Denomination. Various reasons prompted this proposal. It was deemed fitting to simplify the document heretofore used as a testimony; to put together in a readable form what had been said in several publications on their distinctive principles; and to bring down the testimony to the time then present. But above all it was thought desirable as the event too plainly proved, to find expression for the new opinions already widely diffused on the subject of the magistrate’s power in reference to religion; in other words, to make room for the Voluntary Theory.

For some years, the people were kept on the tip-toe of expectation for the new Display of the Secession Testimony, which was to supersede that previously in use, and to prove a great improvement upon it. When at length it appeared, after nine years spent in its preparation, it was found to say and unsay; some passages doing homage to the past attainments of the Reformed Church of Scotland, while others were all too plainly at variance with the previously recognised doctrine of the Secession Church, in reference to the lawfulness of the connection between church and state.

But, as is not unusual in such cases, the extent of the alteration was sought to be concealed. A radical change, or rather a revolution, had been made in the constitution of this section of the Secession Church. But the change was not for a time openly avowed. The Synod, abandoning the principles and position of the Secession Church, though still retaining the name, had, in fact become a Dissenting Denomination. It had broken with the Historic Church of Scotland. The connection was dissolved.

There was a certain mis-statement, therefore, in asserting that they continued, as Heretofore, to bear testimony to the doctrine, worship, discipline, and government of the Reformed Church of Scotland, (p. 15.) The Confession, received in 1647 with one explanation, was now received with many limitations, under colour of carrying out the course of action then initiated. They declared their liberty of signifying their adherence to it with the same or similar limitations, (p. 12.) The section, in particular, which described what was competent to the civil magistrate, was evacuated of its import under the plea that it taught compulsory measures in religion. It was perverted, too, from its proper meaning, as if it might be accepted in the sense of referring to the magistrate in his private capacity, (p. 198.)

Furthermore, the scheme of separating the narrative and doctrinal part of the new Testimony from each other; — that is, by binding the members of the church solely to the latter, — men’s minds were gradually led away from the facts, in support of which the Secession testimony had at first been raised. In short, the Historic basis was to a large extent removed. We frankly acknowledge that in the exhibition of doctrine, there is much precious statement of central truth, worthy of the best times of the Secession Church. But it cannot be denied that wherever reference is made, directly or indirectly, to the misleading negation of Voluntaryism, we encounter one-sided statements, vacillation, and defective exposition.

The Synod, on the 1st of May 1804, approved the testimony, and enacted that henceforth, for all who entered the denomination, it should be held as the bond or term of ministerial and Christian communion. Then followed, on the part of a small but influential minority, a determined opposition. Only six ministers refused to acquiesce in the change made on the constitution of the church. But their piety and ability, as well as their literary eminence, gave weight to the cause they represented.

Two of the number, Messrs Whytock of Dalkeith and Hog of Kelso, were soon removed from the scene of conflict, by death. The four who remained — Rev. Prof. Bruce of Whitburn, Rev. Mr Aitken of Kirriemuir, Rev. Mr Chalmers of Haddington, and Dr M’Crie — maintained the old testimony in all its integrity. But they suffered deposition at the hand of the majority.

Their testimony, however, was not to be suppressed. Forming themselves into a Presbytery, under the designation of the Constitutional Presbytery, they rendered the most important service to the entire Presbyterian church by their clear and scriptural testimony to national Christianity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In George Smeaton’s preface to the 1871 edition of the elder Thomas McCrie’s classic defence of the establishment principle, Statement of the Difference the Free Church theologian explained the circumstances that had given rise to the publication of McCrie’s book:

THE celebrated Statement of the late Dr M’Crie, of which a reprint in full is here presented to the public, was drawn up with the express design of exhibiting the difference between the profession of the Reformed Church of Scotland and the theory of Voluntaryism. The latter term, indeed, was not yet in common use. The question discussed, however, was precisely the same. It was not the question as in former times: with what restrictions and with what regard to the church’s intrinsic freedom may magistrates competently exercise their power about religion? It was the absolute question: is any power whatever competent to the Christian Civil ruler in seeking to further the cause of Christ?

Dr M’Crie’s work discusses this point, and possesses the following peculiarities:— It is a masterly defence of the principle of Establishments as a scripture truth; and the most complete vindication ever given to the world of the position occupied by the Reformed Church of Scotland on the whole subject of national religion, and of the magistrate’s legitimate power in promoting it.

The occasion which called forth the treatise, was as follows. A change had been introduced into the testimony of the church of which Dr M’Crie was a minister, on the question of the Civil Ruler’s authority and duty in reference to religion. About the same period, that is, during the last decennium of the previous century, the leaven of Voluntaryism, or, the theory that it is not competent to the Christian ruler to exercise his authority and influence in behalf of religion in any form, — began to work within the pale both of the Burgher and Antiburgher sections of the Secession Church. To the latter only, as the Denomination to which Dr M’Crie belonged, do we deem it necessary to refer in this place.

In the Antiburgher Synod, or General Associate Synod, as it was termed, a motion was made in 1795 to take steps for preparing or compiling a new Historical and Doctrinal Testimony for the use of the Denomination. Various reasons prompted this proposal. It was deemed fitting to simplify the document heretofore used as a testimony; to put together in a readable form what had been said in several publications on their distinctive principles; and to bring down the testimony to the time then present. But above all it was thought desirable as the event too plainly proved, to find expression for the new opinions already widely diffused on the subject of the magistrate’s power in reference to religion; in other words, to make room for the Voluntary Theory.

For some years, the people were kept on the tip-toe of expectation for the new Display of the Secession Testimony, which was to supersede that previously in use, and to prove a great improvement upon it. When at length it appeared, after nine years spent in its preparation, it was found to say and unsay; some passages doing homage to the past attainments of the Reformed Church of Scotland, while others were all too plainly at variance with the previously recognised doctrine of the Secession Church, in reference to the lawfulness of the connection between church and state.

But, as is not unusual in such cases, the extent of the alteration was sought to be concealed. A radical change, or rather a revolution, had been made in the constitution of this section of the Secession Church. But the change was not for a time openly avowed. The Synod, abandoning the principles and position of the Secession Church, though still retaining the name, had, in fact become a Dissenting Denomination. It had broken with the Historic Church of Scotland. The connection was dissolved.

There was a certain mis-statement, therefore, in asserting that they continued, as Heretofore, to bear testimony to the doctrine, worship, discipline, and government of the Reformed Church of Scotland, (p. 15.) The Confession, received in 1647 with one explanation, was now received with many limitations, under colour of carrying out the course of action then initiated. They declared their liberty of signifying their adherence to it with the same or similar limitations, (p. 12.) The section, in particular, which described what was competent to the civil magistrate, was evacuated of its import under the plea that it taught compulsory measures in religion. It was perverted, too, from its proper meaning, as if it might be accepted in the sense of referring to the magistrate in his private capacity, (p. 198.)

Furthermore, the scheme of separating the narrative and doctrinal part of the new Testimony from each other; — that is, by binding the members of the church solely to the latter, — men’s minds were gradually led away from the facts, in support of which the Secession testimony had at first been raised. In short, the Historic basis was to a large extent removed. We frankly acknowledge that in the exhibition of doctrine, there is much precious statement of central truth, worthy of the best times of the Secession Church. But it cannot be denied that wherever reference is made, directly or indirectly, to the misleading negation of Voluntaryism, we encounter one-sided statements, vacillation, and defective exposition.

The Synod, on the 1st of May 1804, approved the testimony, and enacted that henceforth, for all who entered the denomination, it should be held as the bond or term of ministerial and Christian communion. Then followed, on the part of a small but influential minority, a determined opposition. Only six ministers refused to acquiesce in the change made on the constitution of the church. But their piety and ability, as well as their literary eminence, gave weight to the cause they represented.

Two of the number, Messrs Whytock of Dalkeith and Hog of Kelso, were soon removed from the scene of conflict, by death. The four who remained — Rev. Prof. Bruce of Whitburn, Rev. Mr Aitken of Kirriemuir, Rev. Mr Chalmers of Haddington, and Dr M’Crie — maintained the old testimony in all its integrity. But they suffered deposition at the hand of the majority.

Their testimony, however, was not to be suppressed. Forming themselves into a Presbytery, under the designation of the Constitutional Presbytery, they rendered the most important service to the entire Presbyterian church by their clear and scriptural testimony to national Christianity.”

— George Smeaton, Statement of the Difference Between the Profession of the Reformed Church of Scotland, as Adopted by Seceders, and the Profession Contained in the New Testimony and other Acts, Lately Adopted by the General Associate Synod; Particularly, on the Power of Civil Magistrates Respecting Religion, Nationa, (1807; Edinburgh: C. F. Lyon, 1871), v-ix.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+George+Smeaton%E2%80%99s+preface+to+the+1871+edition+of+the+elder+Thomas+McCrie%E2%80%99s+classic+defence+of+the+establishment+principle%2C+Statement+of+the+Difference+the+Free+Church+theologian+explained+the+circumstances+that+had+given+rise+to+the+publication+of+McCrie%E2%80%99s+book%3A%0A%0ATHE+celebrated+Statement+of+the+late+Dr+M%E2%80%99Crie%2C+of+which+a+reprint+in+full+is+here+presented+to+the+public%2C+was+drawn+up+with+the+express+design+of+exhibiting+the+difference+between+the+profession+of+the+Reformed+Church+of+Scotland+and+the+theory+of+Voluntaryism.+The+latter+term%2C+indeed%2C+was+not+yet+in+common+use.+The+question+discussed%2C+however%2C+was+precisely+the+same.+It+was+not+the+question+as+in+former+times%3A+with+what+restrictions+and+with+what+regard+to+the+church%E2%80%99s+intrinsic+freedom+may+magistrates+competently+exercise+their+power+about+religion%3F+It+was+the+absolute+question%3A+is+any+power+whatever+competent+to+the+Christian+Civil+ruler+in+seeking+to+further+the+cause+of+Christ%3F%0A%0ADr+M%E2%80%99Crie%E2%80%99s+work+discusses+this+point%2C+and+possesses+the+following+peculiarities%3A%E2%80%94+It+is+a+masterly+defence+of+the+principle+of+Establishments+as+a+scripture+truth%3B+and+the+most+complete+vindication+ever+given+to+the+world+of+the+position+occupied+by+the+Reformed+Church+of+Scotland+on+the+whole+subject+of+national+religion%2C+and+of+the+magistrate%E2%80%99s+legitimate+power+in+promoting+it.%0A%0AThe+occasion+which+called+forth+the+treatise%2C+was+as+follows.+A+change+had+been+introduced+into+the+testimony+of+the+church+of+which+Dr+M%E2%80%99Crie+was+a+minister%2C+on+the+question+of+the+Civil+Ruler%E2%80%99s+authority+and+duty+in+reference+to+religion.+About+the+same+period%2C+that+is%2C+during+the+last+decennium+of+the+previous+century%2C+the+leaven+of+Voluntaryism%2C+or%2C+the+theory+that+it+is+not+competent+to+the+Christian+ruler+to+exercise+his+authority+and+influence+in+behalf+of+religion+in+any+form%2C+%E2%80%94+began+to+work+within+the+pale+both+of+the+Burgher+and+Antiburgher+sections+of+the+Secession+Church.+To+the+latter+only%2C+as+the+Denomination+to+which+Dr+M%E2%80%99Crie+belonged%2C+do+we+deem+it+necessary+to+refer+in+this+place.%0A%0AIn+the+Antiburgher+Synod%2C+or+General+Associate+Synod%2C+as+it+was+termed%2C+a+motion+was+made+in+1795+to+take+steps+for+preparing+or+compiling+a+new+Historical+and+Doctrinal+Testimony+for+the+use+of+the+Denomination.+Various+reasons+prompted+this+proposal.+It+was+deemed+fitting+to+simplify+the+document+heretofore+used+as+a+testimony%3B+to+put+together+in+a+readable+form+what+had+been+said+in+several+publications+on+their+distinctive+principles%3B+and+to+bring+down+the+testimony+to+the+time+then+present.+But+above+all+it+was+thought+desirable+as+the+event+too+plainly+proved%2C+to+find+expression+for+the+new+opinions+already+widely+diffused+on+the+subject+of+the+magistrate%E2%80%99s+power+in+reference+to+religion%3B+in+other+words%2C+to+make+room+for+the+Voluntary+Theory.%0A%0AFor+some+years%2C+the+people+were+kept+on+the+tip-toe+of+expectation+for+the+new+Display+of+the+Secession+Testimony%2C+which+was+to+supersede+that+previously+in+use%2C+and+to+prove+a+great+improvement+upon+it.+When+at+length+it+appeared%2C+after+nine+years+spent+in+its+preparation%2C+it+was+found+to+say+and+unsay%3B+some+passages+doing+homage+to+the+past+attainments+of+the+Reformed+Church+of+Scotland%2C+while+others+were+all+too+plainly+at+variance+with+the+previously+recognised+doctrine+of+the+Secession+Church%2C+in+reference+to+the+lawf <blockquote><p>Christ clearly asserts that He did not come ’to abolish the Law’ (Matt. 5:17). Therefore He approves the laws of Moses.” We respond. Christ is speaking about the moral Law, which was not given temporarily but is the eternal wisdom and norm of righteousness in God. Christ did not abolish this but fulfilled it perfectly, and even renews believers for its obedience by giving them His righteousness and Holy Spirit. Furthermore, the circumstances of the text show clearly that Christ is talking here about the moral Law. As far as the forensic laws of Moses are concerned, the apostle asserts (Eph. 2:15) that “Christ voided (καταργήσας) the law of commandments and ordinances,” not to mention the fact that in the same passage (v. 31) Christ disapproves of the certificate of divorce even though the law of Moses allowed it (Matt. 19:8).

Note here that some forensic laws had reference to a part of the ceremonial law and depended on it. For example, whoever had committed an accidental homicide was compelled to keep himself within a city of refuge until the death of the high priest. But because the Levitical priesthood was abrogated through the coming of the Messiah, who is the one and only high priest of the New Testament, it turns out that that forensic law was also abrogated. As a result, the words of Christ cannot refer to the forensic law of Moses.</p></blockquote>

<blockquote><p>B.—But which of the two do you think most conformable to nature; that vagrant and solitary life, or the social and unanimous assemblage of men?

M.—Undoubtedly the unanimous assemblage of men, whom

Utility herself, from whom, on earth,

Justice and equity derive their birth,

first collected into masses and taught,

Fenc’d by one wall, and by one key and bar,

From open’d gates to pour the tide of war.

B.—What! do you imagine that utility was the first and principal cause of human union?

M.—Why not? since the lesson inculcated by the greatest sages is, that men were made by nature for men.

B.—To certain individuals, indeed, utility seems to have great influence, both in the formation and in the maintenance of society. But, if I am not mistaken, their assemblage claims a much higher origin, and the bond of their union is of a much earlier and more venerable date. For, if every individual were to pay attention only to his own interest, there is ground for suspecting, I fear, that this very utility would rather dissolve than unite society.

M.—That observation may, perhaps, be true. But I should be glad to hear what is your other source of human association.

B.—It is a certain innate propensity, not only in men, but also in other animals of the gentler tribes, to associate readily, even without the allurements of utility, with beings of their own species. But of the brute creation it is not our present business to treat. Men we certainly find so deeply impressed, and so forcibly swayed by this natural principle, that, if any of them were to enjoy, in abundance, everything that is calculated either for the preservation and health of the body, or for the pleasure and amusement of the mind, he must, without human intercourse, experience life to be a burden.

This is such a notorious truth that even the persons who, from a love of science and a desire of investigating truth, have retired from the bustle of the world and lived recluse in sequestered retreats, have neither been able, for a length of time, to bear a perpetual exertion of mind, nor, upon discovering the necessity of relaxation, to remain immured in solitude, but readily produced the very result of their studies; and, as if they had laboured for the common good, added the fruit of their labours to the common stock. Hence it is my opinion, that if any person be so attached to solitude as to shun and fly the society of men, he is actuated rather by a disease of the mind than a principle of nature. Such, according to report, was Timon of Athens, and Bellerophon of Corinth,

A wretch, who, preying in corrosive pain

On his own vitals, roam’d the Aleian plain

With comfortless and solitary pace,

Shunning the commerce of the human race.

M.—Here our sentiments are not far from coincidence. But the term nature, adopted by you, is an expression, which, from habit, I often use rather than understand; and it is applied by others so variously, and to such a multitude of objects, that I am generally at a loss about the idea which it conveys.

B.—At present I certainly wish nothing else to be understood by it but the light infused into our minds by the divinity; for, since God created this dignified animal

Erect, of deeper reach of thought possess’d,

And fit to be the lord of all the rest,

he not only bestowed upon his body eyes, by whose guidance he might shun what is adverse, and pursue what is adapted to his condition, but also presented to his mind a kind of light, by which he might distinguish vice and infamy from virtue and honour. This power some call nature, some the law of nature: I certainly hold it to be divine, and am thoroughly persuaded that

Nature and wisdom’s voices are the same.

Of this law, too, we have from God a kind of abridgement, comprehending the whole in a few words, when he commands us to love him with all our heart, and our neighbours as ourselves. The sacred volumes, in all the books which relate to the formation of mortals, contain hardly anything else but an explanation of this law.

M.—Do you then conceive that human society derives its origin not from any orator or lawyer that collected the dispersed tribes of men, but from God himself?

B.—That is positively my opinion; and, in the words of Cicero, I think that nothing done upon earth is more acceptable to the sovereign Deity, that rules this world, than assemblages of men called states, and united upon principles of justice. The different members of these states politicians wish to have connected by ties similar to the coherence subsisting between all the limbs of our body, to be cemented by mutual good offices, to labour for the general interest, to repel dangers and secure advantages in common, and, by a reciprocation of benefits, to conciliate the affections of the whole community.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“B.—But which of the two do you think most conformable to nature; that vagrant and solitary life, or the social and unanimous assemblage of men?

M.—Undoubtedly the unanimous assemblage of men, whom

Utility herself, from whom, on earth,

Justice and equity derive their birth,

first collected into masses and taught,

Fenc’d by one wall, and by one key and bar,

From open’d gates to pour the tide of war.

B.—What! do you imagine that utility was the first and principal cause of human union?

M.—Why not? since the lesson inculcated by the greatest sages is, that men were made by nature for men.

B.—To certain individuals, indeed, utility seems to have great influence, both in the formation and in the maintenance of society. But, if I am not mistaken, their assemblage claims a much higher origin, and the bond of their union is of a much earlier and more venerable date. For, if every individual were to pay attention only to his own interest, there is ground for suspecting, I fear, that this very utility would rather dissolve than unite society.

M.—That observation may, perhaps, be true. But I should be glad to hear what is your other source of human association.

B.—It is a certain innate propensity, not only in men, but also in other animals of the gentler tribes, to associate readily, even without the allurements of utility, with beings of their own species. But of the brute creation it is not our present business to treat. Men we certainly find so deeply impressed, and so forcibly swayed by this natural principle, that, if any of them were to enjoy, in abundance, everything that is calculated either for the preservation and health of the body, or for the pleasure and amusement of the mind, he must, without human intercourse, experience life to be a burden.

This is such a notorious truth that even the persons who, from a love of science and a desire of investigating truth, have retired from the bustle of the world and lived recluse in sequestered retreats, have neither been able, for a length of time, to bear a perpetual exertion of mind, nor, upon discovering the necessity of relaxation, to remain immured in solitude, but readily produced the very result of their studies; and, as if they had laboured for the common good, added the fruit of their labours to the common stock. Hence it is my opinion, that if any person be so attached to solitude as to shun and fly the society of men, he is actuated rather by a disease of the mind than a principle of nature. Such, according to report, was Timon of Athens, and Bellerophon of Corinth,

A wretch, who, preying in corrosive pain

On his own vitals, roam’d the Aleian plain

With comfortless and solitary pace,

Shunning the commerce of the human race.

M.—Here our sentiments are not far from coincidence. But the term nature, adopted by you, is an expression, which, from habit, I often use rather than understand; and it is applied by others so variously, and to such a multitude of objects, that I am generally at a loss about the idea which it conveys.

B.—At present I certainly wish nothing else to be understood by it but the light infused into our minds by the divinity; for, since God created this dignified animal

Erect, of deeper reach of thought possess’d,

And fit to be the lord of all the rest,

he not only bestowed upon his body eyes, by whose guidance he might shun what is adverse, and pursue what is adapted to his condition, but also presented to his mind a kind of light, by which he might distinguish vice and infamy from virtue and honour. This power some call nature, some the law of nature: I certainly hold it to be divine, and am thoroughly persuaded that

Nature and wisdom’s voices are the same.

Of this law, too, we have from God a kind of abridgement, comprehending the whole in a few words, when he commands us to love him with all our heart, and our neighbours as ourselves. The sacred volumes, in all the books which relate to the formation of mortals, contain hardly anything else but an explanation of this law.

M.—Do you then conceive that human society derives its origin not from any orator or lawyer that collected the dispersed tribes of men, but from God himself?

B.—That is positively my opinion; and, in the words of Cicero, I think that nothing done upon earth is more acceptable to the sovereign Deity, that rules this world, than assemblages of men called states, and united upon principles of justice. The different members of these states politicians wish to have connected by ties similar to the coherence subsisting between all the limbs of our body, to be cemented by mutual good offices, to labour for the general interest, to repel dangers and secure advantages in common, and, by a reciprocation of benefits, to conciliate the affections of the whole community.”

— George Buchanan, De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 7-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CB.%E2%80%94But+which+of+the+two+do+you+think+most+conformable+to+nature%3B+that+vagrant+and+solitary+life%2C+or+the+social+and+unanimous+assemblage+of+men%3F%0A%0AM.%E2%80%94Undoubtedly+the+unanimous+assemblage+of+men%2C+whom%0A%0AUtility+herself%2C+from+whom%2C+on+earth%2C%0A%0AJustice+and+equity+derive+their+birth%2C%0A%0Afirst+collected+into+masses+and+taught%2C%0A%0AFenc%E2%80%99d+by+one+wall%2C+and+by+one+key+and+bar%2C%0A%0AFrom+open%E2%80%99d+gates+to+pour+the+tide+of+war.%0A%0AB.%E2%80%94What%21+do+you+imagine+that+utility+was+the+first+and+principal+cause+of+human+union%3F%0A%0AM.%E2%80%94Why+not%3F+since+the+lesson+inculcated+by+the+greatest+sages+is%2C+that+men+were+made+by+nature+for+men.%0A%0AB.%E2%80%94To+certain+individuals%2C+indeed%2C+utility+seems+to+have+great+influence%2C+both+in+the+formation+and+in+the+maintenance+of+society.+But%2C+if+I+am+not+mistaken%2C+their+assemblage+claims+a+much+higher+origin%2C+and+the+bond+of+their+union+is+of+a+much+earlier+and+more+venerable+date.+For%2C+if+every+individual+were+to+pay+attention+only+to+his+own+interest%2C+there+is+ground+for+suspecting%2C+I+fear%2C+that+this+very+utility+would+rather+dissolve+than+unite+society.%0A%0AM.%E2%80%94That+observation+may%2C+perhaps%2C+be+true.+But+I+should+be+glad+to+hear+what+is+your+other+source+of+human+association.%0A%0AB.%E2%80%94It+is+a+certain+innate+propensity%2C+not+only+in+men%2C+but+also+in+other+animals+of+the+gentler+tribes%2C+to+associate+readily%2C+even+without+the+allurements+of+utility%2C+with+beings+of+their+own+species.+But+of+the+brute+creation+it+is+not+our+present+business+to+treat.+Men+we+certainly+find+so+deeply+impressed%2C+and+so+forcibly+swayed+by+this+natural+principle%2C+that%2C+if+any+of+them+were+to+enjoy%2C+in+abundance%2C+everything+that+is+calculated+either+for+the+preservation+and+health+of+the+body%2C+or+for+the+pleasure+and+amusement+of+the+mind%2C+he+must%2C+without+human+intercourse%2C+experience+life+to+be+a+burden.%0A%0AThis+is+such+a+notorious+truth+that+even+the+persons+who%2C+from+a+love+of+science+and+a+desire+of+investigating+truth%2C+have+retired+from+the+bustle+of+the+world+and+lived+recluse+in+sequestered+retreats%2C+have+neither+been+able%2C+for+a+length+of+time%2C+to+bear+a+perpetual+exertion+of+mind%2C+nor%2C+upon+discovering+the+necessity+of+relaxation%2C+to+remain+immured+in+solitude%2C+but+readily+produced+the+very+result+of+their+studies%3B+and%2C+as+if+they+had+laboured+for+the+common+good%2C+added+the+fruit+of+their+labours+to+the+common+stock.+Hence+it+is+my+opinion%2C+that+if+any+person+be+so+attached+to+solitude+as+to+shun+and+fly+the+society+of+men%2C+he+is+actuated+rather+by+a+disease+of+the+mind+than+a+principle+of+nature.+Such%2C+according+to+report%2C+was+Timon+of+Athens%2C+and+Bellerophon+of+Corinth%2C%0A%0AA+wretch%2C+who%2C+preying+in+corrosive+pain%0A%0AOn+his+own+vitals%2C+roam%E2%80%99d+the+Aleian+plain%0A%0AWith+comfortless+and+solitary+pace%2C%0A%0AShunning+the+commerce+of+the+human+race.%0A%0AM.%E2%80%94Here+our+sentiments+are+not+far+from+coincidence.+But+the+term+nature%2C+adopted+by+you%2C+is+an+expression%2C+which%2C+from+habit%2C+I+often+use+rather+than+understand%3B+and+it+is+applied+by+others+so+variously%2C+and+to+such+a+multitude+of+objects%2C+that+I+am+generally+at+a+loss+about+the+idea+which+it+conveys.%0A%0AB.%E2%80%94At+present+I+certainly+wish+nothing+else+to+be+understood+by+it+but+the+light+infused+into+our+minds+by+the+divinity%3B+for%2C+since+God+created+this+dignified+animal%0A%0AErect%2C+of+deeper+reach+of+thought+possess%E2%80%99d%2C%0A%0AAnd+fit+to+be+the+lord+of+all+the+rest%2C%0A%0Ahe+not+only+bestowed+upon+his+body+eyes%2C+by+whose+guidance+he+might+shun+what+is+adverse%2C+and+pursue+what+is+adapted+to+his+condition%2C+but+also+presented+to+his+mind+a+kind+of+light%2C+by+which+he+might+distinguish+vice+and+infamy+from+virtue+and+honour.+This+power+some+call+nature%2C+some+the+law+of+nature%3A+I+certainly+hold+it+to+be+divine%2C+and+am+thoroughly+persuaded+that%0A%0ANature+and+wisdom%E2%80%99s+voices+are+the+same.%0A%0AOf+this+law%2C+too%2C+we+have+from+God+a+kind+of+abridgement%2C+comprehending+the+whole+in+a+few+words%2C+when+he+commands+us+to+love+him+with+all+our+heart%2C+and+our+neighbours+as+ourselves.+The+sacred+volumes%2C+in+all+the+books+which+relate+to+the+formation+of+mortals%2C+contain+hardly+anything+else+but+an+explanation+of+this+law.%0A%0AM.%E2%80%94Do+you+then+conceive+that+human+society+derives+its+origin+not+from+any+orator+or+lawyer+that+collected+the+dispersed+tribes+of+men%2C+but+from+God+himself%3F%0A%0AB.%E2%80%94That+is+positively+my+opinion%3B+and%2C+in+the+words+of+Cicero%2C+I+think+that+nothing+done+upon+earth+is+more+acceptable+to+the+sovereign+Deity%2C+that+rules+this+world%2C+than+assemblages+of+men+called+states%2C+and+united+upon+principles+of+justice.+The+different+members+of+these+states+politicians+wish+to+have+connected+by+ties+similar+to+the+coherence+subsisting+between+all+the+limbs+of+our+body%2C+to+be+cemented+by+mutual+good+offices%2C+to+labour+for+the+general+interest%2C+to+repel+dangers+and+secure+advantages+in+common%2C+and%2C+by+a+reciprocation+of+benefits%2C+to+conciliate+the+affections+of+the+whole+community.%E2%80%9D%0A%0A%E2%80%94+George+Buchanan%2C+De+Jure+Regni+Apud+Scotos%3B+A+Dialogue+Concerning+the+Rights+of+the+Crown+in+Scotland%2C+trans.+Robert+MacFarlan+%281579%3B+Colorado+Springs%3A+Portage+Publications%2C+2016%29%2C+pp+7-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcce625523d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cce625523d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.co

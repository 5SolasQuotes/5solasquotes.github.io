<main class="wrap"><figure class="quote" id="q-671e565ce4" data-kw="">
<blockquote><p>Vers. 13. (For not the hearers of the Law are just before God, but the doers of the Law shall be justified.) Reas. 3. Especially intended against the Jews, who according to the rule of Righteousness, cannot be accounted for Righteous before God, even they that are hearers of the Law, unless they perform perfect obedience to the Law, which because neither Jew nor Gentile can do, by consequence neither can they be exempted from deserved condemnation; but on the contrary, especially the Jews, which are hearers of the Law, and do not keep it, are most worthy of judgement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Pauls epistles, together with an explanation of those other epistles of the apostles, St. James, Peter, John &amp; Jude</cite>, (London, 1659), 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“Vers. 13. (For not the hearers of the Law are just before God, but the doers of the Law shall be justified.) Reas. 3. Especially intended against the Jews, who according to the rule of Righteousness, cannot be accounted for Righteous before God, even they that are hearers of the Law, unless they perform perfect obedience to the Law, which because neither Jew nor Gentile can do, by consequence neither can they be exempted from deserved condemnation; but on the contrary, especially the Jews, which are hearers of the Law, and do not keep it, are most worthy of judgement.”

— David Dickson, An exposition of all St. Pauls epistles, together with an explanation of those other epistles of the apostles, St. James, Peter, John &amp; Jude (London, 1659), 5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVers.+13.+%28For+not+the+hearers+of+the+Law+are+just+before+God%2C+but+the+doers+of+the+Law+shall+be+justified.%29+Reas.+3.+Especially+intended+against+the+Jews%2C+who+according+to+the+rule+of+Righteousness%2C+cannot+be+accounted+for+Righteous+before+God%2C+even+they+that+are+hearers+of+the+Law%2C+unless+they+perform+perfect+obedience+to+the+Law%2C+which+because+neither+Jew+nor+Gentile+can+do%2C+by+consequence+neither+can+they+be+exempted+from+deserved+condemnation%3B+but+on+the+contrary%2C+especially+the+Jews%2C+which+are+hearers+of+the+Law%2C+and+do+not+keep+it%2C+are+most+worthy+of+judgement.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Pauls+epistles%2C+together+with+an+explanation+of+those+other+epistles+of+the+apostles%2C+St.+James%2C+Peter%2C+John+%26+Jude+%28London%2C+1659%29%2C+5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F671e565ce4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/671e565ce4.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/10/david-dickson-on-romans-213/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

</figure><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</span></figcaption>

</figure><figure class="quote" id="q-a5bb8001c3" data-kw="">
<blockquote><p>If this marriage be made up between Christ and you, then you have put away all lovers besides Christ; the right hand will be cut off, the right eye will be put out; you will be divorced from all other husbands, particularly from the law; you must be dead to the law, that you may be married to another husband, even to Christ. But you will say, What is it to be dead to the law? I answer, It is not to lay it aside as the rule of obedience; for the law shall still be the rule and standard of the believer’s obedience, life, and conversation: but to be dead to the law, is to be sensible that the law cannot save us as a covenant of works. It is to disclaim all hopes of being justified by the law, or by our works or obedience to it. I see Christ, the glorious husband, hath brought in an everlasting righteousness, answering the law fully: this is the garment I must put on, and cast off my filthy rags.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Best Match</cite>, (Bell and Bain LTD, 1991), 1.122.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-766b45942f" data-kw="">
<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.”

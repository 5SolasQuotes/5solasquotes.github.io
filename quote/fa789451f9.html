<main class="wrap"><figure class="quote" id="q-fa789451f9" data-kw="">
<blockquote><p>As it is of the law of nature that, in general, a due proportion of time be set apart for the worship of God; so, in his Word, by a positive, moral, and perpetual commandment, binding all men in all ages, he hath particularly appointed one day in seven for a Sabbath, to be kept holy unto him:a which, from the beginning of the world to the resurrection of Christ, was the last day of the week; and, from the resurrection of Christ, was changed into the first day of the week,b which in Scripture is called the Lord’s day,c and is to be continued to the end of the world, as the Christian Sabbath.d a. Exod 20:8, 10-11; Isa 56:2, 4, 6-7. • b. Gen 2:2-3; Acts 20:7; 1 Cor 16:1-2. • c. Rev 1:10. • d. Exod 20:8, 10 with Mat 5:17-18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 21.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c29931d9c8" data-kw="">
<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1</span></figcaption>

</figure><figure class="quote" id="q-925b271fd6" data-kw="">
<blockquote><p>“But some dare say, either because of the love of novelties or in order to appear ingenious, that the earth moves, and contend that neither the eight sphere nor the sun moves while they assign other movement to the celestial spheres and place the earth among the stars. The joke is not new. There is a book by Archimedes called De Numeratione Arenae, in which he reports that Aristarchus of Samos defended this paradox, that the sun remains fixed and the earth turns around the sun. And although clever workers investigate many questions to give expression to their ingenuity, the young should know that it is not good to defend such absurd opinions publicly, nor is it honest or a good example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Bruce T. Moran, ‘The Universe of Philip Melanchthon: Criticism and Use of the Copernican Theory’ Comitatus 4</cite>, (1973), pp. 13-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

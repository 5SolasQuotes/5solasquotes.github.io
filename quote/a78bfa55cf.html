<main class="wrap"><figure class="quote" id="q-a78bfa55cf" data-kw="">
<blockquote><p>By the term ‘prophecy’, however, I do not understand the gift of foretelling the future, but as in 1 Cor. 14:3, the science of interpreting Scripture, so that a prophet is an interpreter of the will of God. For Paul, in the passage which I have quoted, assigns to prophets teaching for edification, exhortation, and consolation, and enumerates, as it were, these departments. Let, therefore, ‘prophecy’ in this passage be understood as meaning: interpretation made suitable to present use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Thess. 5, verse 20</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-3d2aa61fa7" data-kw="">
<blockquote><p>That they [spiritual gifts] are not communicated unto any by a sudden afflatus or extraordinary infusion, as were the gifts of miracles and tongues, which were bestowed on the apostles and many of the first converts. That dispensation of the Spirit is long since ceased, and where it is now pretended unto by any, it may justly be suspected as an enthusiastic delusion; for as the end of those gifts, which in their own nature exceed the whole power of all our faculties, is ceased, so is their communication, and the manner of it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen ed. William H. Goold (NY: Robert Carter, 1852)</cite>, 4:518</span></figcaption>

</figure><figure class="quote" id="q-1fdd8974d8" data-kw="">
<blockquote><p>The durability of the view that Reformation and post-Reformation ‘prophecy’ was mediate revelation as an application of Scripture to providence by the leading of the Spirit is seen most clearly where Westminster theology took hold and had its greatest success…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/garnet-milne.html">Garnet Milne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ch. 6, ‘Prophecy and the Scots’ (2007) 37 pp. in The Westminster Confession of Faith &amp; the Cessation of Special Revelation: the Majority Puritan Viewpoint on Whether Extra-Biblical Prophecy is Still Possible, pp. 219-56</cite>, pp. 219-56 Buy</span></figcaption>

— Garnet Milne, Ch. 6, ‘Prophecy and the Scots’ (2007) 37 pp. in The Westminster Confession of Faith &amp; the Cessation of Special Revelation: the Majority Puritan Viewpoint on Whether Extra-Biblical Prophecy is Still Possible, pp. 219-56, pp. 219-56 Buy">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+durability+of+the+view+that+Reformation+and+post-Reformation+%E2%80%98prophecy%E2%80%99+was+mediate+revelation+as+an+application+of+Scripture+to+providence+by+the+leading+of+the+Spirit+is+seen+most+clearly+where+Westminster+theology+took+hold+and+had+its+greatest+success%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Garnet+Milne%2C+Ch.+6%2C+%E2%80%98Prophecy+and+the+Scots%E2%80%99+%282007%29+37+pp.+in+The+Westminster+Confession+of+Faith+%26+the+Cessation+of+Special+Revelation%3A+the+Majority+Puritan+Viewpoint+on+Whether+Extra-Biblical+Prophecy+is+Still+Possible%2C+pp.+219-56%2C+pp.+219-56+Buy&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1fdd8974d8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1fdd8974d8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/cessationism/#:~:text=The%20durability%20of%20the%20view%20that,hold%20and%20had%20its%20greatest%20success&amp;text=The%20durability%20of%20the%20view%20that%20Reformation%20and&amp;text=theology%20took%20hold%20and%20had%20its%20greatest%20success" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f130a1ffdf" data-kw="">
<blockquote><p>One hopes that reviews like this will become a thing of the past, as neo-Calvinist anxieties about the Protestant retrieval of 17th century Reformed thought subside. Retrieval has increasingly revealed that, despite the diversity in the doctrinal development of the 17th century, the distinctives of neo-Calvinism have no place in that diversity, nor could they arise logically from that diversity. Reformed theology, from Calvin to the 19th century, was thoroughly “dualistic” – affirming distinctions between natural/supernatural, nature/grace, reason/faith, temporal/eternal, earth/heaven, and secular/sacred. Reformed theology did not reject these medieval categories as popish errors, let alone as paganistic. They incorporated them in their theological systems, modifying them as they saw fit, and these became essential to their system’s coherence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-wolfe.html">Stephen Wolfe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Correcting Theologians: A Response to Brian Mattson’ (2023)</cite></span></figcaption>

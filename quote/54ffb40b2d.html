<main class="wrap"><figure class="quote" id="q-54ffb40b2d" data-kw="">
<blockquote><p>Now these members combining themselves into one body as they are such, do make or rather are actually a true visible church, one integral body, not continued but by aggregation… Further, this integral body for the well-being of it in exercising those operations which belong unto it and whereunto it serves, must become as we say organical, having members of diverse ranks, some as head, mouth and eyes, the pastor, teachers, and elders, some as hands, the deacons and helpers: whereupon arises another relation and form of accidental perfection, in state of government: which is complete or incomplete, freely exercising the power granted by Christ to his church, or else restrained or defective therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), p. 33</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8aa7884766" data-kw="">
<blockquote><p>There is a twofold ministerial power:

1. Potestas ordinis, which consists merely in preaching the Word and administring the sacraments.

2. Jurisdictionis, whereby they govern in the Church, by binding the impenitent and losing the penitent.¹ ¹ …’Discipline’ is used sometimes largely, so as it extends to all rule and order, appointed or left for the right managing of the things of God, or strictly for the censures of the Church. So there may be a true Church without discipline. The Helvetians and those of Switzerland have no suspension [from the Table or Church] at all, but what offences other Churches suspend for the civil magistrate punishes other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 6, ch. 3, ‘Of Ecclesiastical Jurisdiction &amp; Government’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-a938100c5b" data-kw="">
<blockquote><p>Objection: But is not this an approven distinction, that persons are within the Covenant, either externally, professedly, visibly, or internally, really, or according to the intention of God? Therefore, such as are externally within the Covenant, are not really and indeed within the Covenant of Grace. Answer: The adverb really relates to the real fruit of the fulfilled covenant, and so such as are only externally within the covenant are not really within the covenant, for God never directed, nor intended to bestow the blessing covenanted, nor grace to perform the condition of the covenant upon them. But they are really covenanted and engaged by their consented profession to fulfill the covenant. And as the commands and threatenings of the covenant of grace lay on a real obligation upon such as are only externally in covenant, either to obey or suffer, so the promise of the covenant imposes an engagement and obligation upon such to believe the promise; but sometimes we say the promises of the covenant of grace are not really made to the reprobate within the visible church, because God intends and decrees to, and for them, neither the blessing promised, nor the saving grace to fulfill the condition or to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh: Anderson, 1655), pt. 1, ch. 13; pp. 92-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-9f537cdcf5" data-kw="">
<blockquote><p>The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>

</figure><figure class="quote" id="q-73a9ff7cc5" data-kw="invisible church">
<blockquote><p>That the statement of this most vexed question may be rightly exhibited, the origin of the controversy must be inquired into. The Romanists suppose that the church was called invisible by us in order to satisfy the question asked of us by them—where our church was before Luther. Since we could not show that our church was perpetually visible in the world, we excogitated this distinction—that the visible church is one thing, the invisible another. But they interpret our opinion falsely. For even if our church had been as large and conspicuous formerly as it is now, still we would say that the catholic church is nonetheless invisible. Is the true church rightly said to be invisible? We affirm against the Romanists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.7.1</span></figcaption>

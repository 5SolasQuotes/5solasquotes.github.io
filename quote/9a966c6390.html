<main class="wrap"><figure class="quote" id="q-9a966c6390" data-kw="">
<blockquote><p>And these were the Halcionian days which Ambrose himself declares and magnifies, even when Maximus had suppressed the Arrians, En tempus acceptabile! quo non hiemalibus perfidiae caligantis pruinas annus riget, nec altis nivis, etc. ibid. Reader was not that time more strange than ours? that Ambrose must be so loyal as to save his prince and country from a usurper; and yet so pious as to be persecuted by his prince, and he and his brethren saved by that same usurper, and openly give praise to God for the great felicity of the Church which it received by that same usurper whom he so resisted?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy</cite>, … (London: Simmons, 1681) | pt. 2, ch. 22, p. 210</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18f4a949e3" data-kw="">
<blockquote><p>For the words themselves, ‘Honor the King’, I have already spoken at large of the duty contained herein: Know we only, that by the King here, is meant Caesar, who was a heathen emperor, one that intruded himself, ruled tyrannously, and was an idolater… … Under this honor is understood, the inward reverence in heart to be declared outwardly by obedience to all their godly commandments, cheerfulness in payments, prayer and thanksgiving, etc. Now if all this be due to a wicked King, as here, and now to be performed of us, if we had a wicked king, what then is to be done of us to such a king as God has bestowed on us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Tim., 2:17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>…though those names [given us, Anglican ministers, such as “priest,” “parson,” “vicar” and “curate,” etc.] were of themselves of an Antichristian [Romanist] original and use, yet if they be imposed upon any such as take no pleasure in them, we see not how they can any way pollute them and their offices more than Joseph and Daniel were polluted by heathenish and idolatrous names that were given them (Gen. 41:45; Dan. 1:7), or than private Christians are made the worse by the odious terms (1 Cor. 1:12–13) of Precisians, Puritans and Martinists, or than our [Separatist] brethren themselves are by the names of Brownists and Barrowists, which they so usually are called by and so much dislike.</p></blockquote>

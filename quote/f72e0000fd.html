<blockquote><p>9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>

<blockquote><p>Let us then see what the kingdom of Christ is, which begins in the faithful in this world… The kingdom of Christ in this world is the administration of salvation, whereby Jesus Christ the king Himself, outwardly gathers to Himself through the Gospel and sacrament of baptism, a people or visible Church (in which many hypocrites are mingled) and calls them to salvation, and administers and gives Himself the same salvation to which He calls them, in those whom He accounts for his elect in this congregation…</p></blockquote>

</figure><figure class="quote" id="q-3d88089415" data-kw="">
<blockquote><p>II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, He is the Savior of the elect only. Jn. 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Mt. 20:28, Jn. 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning He died efficaciously for all his sheep. Jn. 10:15. And in these all and alone there is a certain special universality, as is in Ambrose, bk. 1, Of the Calling of the Gentiles, ch. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Polemical Theology (1627), pt. 6, section 1, article 2</cite>, pp. 679-80 tr. by AI by Onku</span></figcaption>

</figure><figure class="quote" id="q-df67b8b58e" data-kw="">
<blockquote><p>XXX. Liberation from this guilt and its exercise was never promised to all and every mortal, nor offered, nor conferred; and in paradise itself there was immediately distinguished the seed of the woman and of the serpent, partly in the first promise, partly in its manifestation in the house of Adam, in which God began the distinction observed through all ages. XXXI. The Liberator, and Depulsor partly of adhering guilt, partly of inhering corruption, is the one Christ Son of God, destined from eternity to all the elect and to them alone, promised from the fall, afterward prefigured by types partly personal, partly real, finally exhibited, and to the same partly applied, partly to be applied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-f8f191fe0f" data-kw="">
<blockquote><p>All the Reformed agree in this, that there is such a great value and price in the death of Christ, from the infinite dignity of the person, that it could be sufficient for saving each and every person, but because neither the Father nor the Son willed that death to be destined for redeeming each and every person, it cannot be fittingly said that Christ died for each and every person…</p></blockquote>

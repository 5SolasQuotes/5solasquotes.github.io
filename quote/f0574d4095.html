<main class="wrap"><figure class="quote" id="q-f0574d4095" data-kw="">
<blockquote><p>…2 Chron. 29 [vv. 29-30], out of which no more can be drawn but that the people worshipped while the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72</span></figcaption>

</figure><figure class="quote" id="q-6250c7f226" data-kw="">
<blockquote><p>The reason of this assertion [by opponents] is given to be this, that a bodily gesture being necessary, God not determining man upon any one, leaves him at plain liberty. Answer: Whether we be left at plain liberty in all things which being in the general necessary, and are not particularly determined in God’s Word; it shall be treated of elsewhere in this Dispute. In the meantime, whatsoever liberty God leaves man in bodily gestures, he leaves him no liberty of an unlawful and idolatrous gesture, such as kneeling in the instant of receiving a sacrament, when not only we have the outward sign purposely before us, and our minds and senses fastened upon it, for discerning the signification thereof and the analogy betwixt it and the thing signified, but also look upon it as an image of Christ or as a vicarious sign standing there in Christ’s stead. The indifferency of such a gesture in such a mediate worship should have been proved before such a rule (as this here given us for a reason) had been applied to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-7003ce0543" data-kw="">
<blockquote><p>One can observe a variety of physical bearing in the prayers of the saints. Moses fell upon his face (Deuteronomy 9:18); David was stretched upon the ground and clothed in sackcloth when he prayed for his infant son (2 Samuel 12:16). Job was seated in ashes and dust (Job 42:6); the Israelites were standing (Nehemiah 9:5); Ezra and Paul were kneeling down (Ezra 9:5 and Acts 20:36). Solomon prayed on bended knees and with hands outstretched (2 Chronicles 6:13); Christ with eyes lifted up towards heaven (John 17:1), while the tex-collector prayed with his eyes cast down to the earth (Luke 18:13). And while men pray with their heads uncovered, women do so with covered head, according to the apostle’s instruction (1 Corinthians 11:4).† † The annotation on the verse in the Dutch Statenvertaling, of which Walaeus possibly was the author, states that the uncovering of the head at that time was a sign of power and sovereignty, whereas today those who are in authority shall keep their heads covered and those who are subject to them shall uncover their heads: ‘But in this matter one must always regard the use in different times and countries and what is correct and build up… A comparison of all these things with each other makes it clear that a certain amount of freedom was given for various gestures, but that at the same time we should adopt the kind of postures that are best suited to every nation’s own customs and that promote rather than hinder the attentiveness of our soul. We should avoid every form of vanity in those postures, but also carelessness and pride; and the gestures should convey, without pretense and in a most suitable manner, the inner disposition and ardent longing of those who are praying. Yet the saints most frequently employed the bending of the knees,‡ and so that gesture was sometimes used in the absolute sense for the prayer itself, as one can see from Romans 11:4 and 14:11, and likewise in Ephesians 3:14. And in the same vein the apsotle links the stretching forth of lifting up of hands to the injunction that they should prayer everywhere (1 Timothy 2:8). ‡ In 1610 the consistory of Middelburg–where Walaeus served as a pastor from 1605 to 1619–admonished the people to humble themselves bodily during the public prayers by kneeling and folding their hands… According to Van Deursen that was rather common at the time…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synopsis of True Theology</cite>, (1625; Brill, 2016), vol. 2, Disputation 36, ‘On the Religious Practice of Invocation’, pp. 431, 433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“One can observe a variety of physical bearing in the prayers of the saints. Moses fell upon his face (Deuteronomy 9:18); David was stretched upon the ground and clothed in sackcloth when he prayed for his infant son (2 Samuel 12:16). Job was seated in ashes and dust (Job 42:6); the Israelites were standing (Nehemiah 9:5); Ezra and Paul were kneeling down (Ezra 9:5 and Acts 20:36). Solomon prayed on bended knees and with hands outstretched (2 Chronicles 6:13); Christ with eyes lifted up towards heaven (John 17:1), while the tex-collector prayed with his eyes cast down to the earth (Luke 18:13). And while men pray with their heads uncovered, women do so with covered head, according to the apostle’s instruction (1 Corinthians 11:4).† † The annotation on the verse in the Dutch Statenvertaling, of which Walaeus possibly was the author, states that the uncovering of the head at that time was a sign of power and sovereignty, whereas today those who are in authority shall keep their heads covered and those who are subject to them shall uncover their heads: ‘But in this matter one must always regard the use in different times and countries and what is correct and build up… A comparison of all these things with each other makes it clear that a certain amount of freedom was given for various gestures, but that at the same time we should adopt the kind of postures that are best suited to every nation’s own customs and that promote rather than hinder the attentiveness of our soul. We should avoid every form of vanity in those postures, but also carelessness and pride; and the gestures should convey, without pretense and in a most suitable manner, the inner disposition and ardent longing of those who are praying. Yet the saints most frequently employed the bending of the knees,‡ and so that gesture was sometimes used in the absolute sense for the prayer itself, as one can see from Romans 11:4 and 14:11, and likewise in Ephesians 3:14. And in the same vein the apsotle links the stretching forth of lifting up of hands to the injunction that they should prayer everywhere (1 Timothy 2:8). ‡ In 1610 the consistory of Middelburg–where Walaeus served as a pastor from 1605 to 1619–admonished the people to humble themselves bodily during the public prayers by kneeling and folding their hands… According to Van Deursen that was rather common at the time…”

— Antonius Walaeus, The Synopsis of True Theology (1625; Brill, 2016), vol. 2, Disputation 36, ‘On the Religious Practice of Invocation’, pp. 431, 433">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COne+can+observe+a+variety+of+physical+bearing+in+the+prayers+of+the+saints.+Moses+fell+upon+his+face+%28Deuteronomy+9%3A18%29%3B+David+was+stretched+upon+the+ground+and+clothed+in+sackcloth+when+he+prayed+for+his+infant+son+%282+Samuel+12%3A16%29.+Job+was+seated+in+ashes+and+dust+%28Job+42%3A6%29%3B+the+Israelites+were+standing+%28Nehemiah+9%3A5%29%3B+Ezra+and+Paul+were+kneeling+down+%28Ezra+9%3A5+and+Acts+20%3A36%29.+Solomon+prayed+on+bended+knees+and+with+hands+outstretched+%282+Chronicles+6%3A13%29%3B+Christ+with+eyes+lifted+up+towards+heaven+%28John+17%3A1%29%2C+while+the+tex-collector+prayed+with+his+eyes+cast+down+to+the+earth+%28Luke+18%3A13%29.+And+while+men+pray+with+their+heads+uncovered%2C+women+do+so+with+covered+head%2C+according+to+the+apostle%E2%80%99s+instruction+%281+Corinthians+11%3A4%29.%E2%80%A0+%E2%80%A0+The+annotation+on+the+verse+in+the+Dutch+Statenvertaling%2C+of+which+Walaeus+possibly+was+the+author%2C+states+that+the+uncovering+of+the+head+at+that+time+was+a+sign+of+power+and+sovereignty%2C+whereas+today+those+who+are+in+authority+shall+keep+their+heads+covered+and+those+who+are+subject+to+them+shall+uncover+their+heads%3A+%E2%80%98But+in+this+matter+one+must+always+regard+the+use+in+different+times+and+countries+and+what+is+correct+and+build+up%E2%80%A6+A+comparison+of+all+these+things+with+each+other+makes+it+clear+that+a+certain+amount+of+freedom+was+given+for+various+gestures%2C+but+that+at+the+same+time+we+should+adopt+the+kind+of+postures+that+are+best+suited+to+every+nation%E2%80%99s+own+customs+and+that+promote+rather+than+hinder+the+attentiveness+of+our+soul.+We+should+avoid+every+form+of+vanity+in+those+postures%2C+but+also+carelessness+and+pride%3B+and+the+gestures+should+convey%2C+without+pretense+and+in+a+most+suitable+manner%2C+the+inner+disposition+and+ardent+longing+of+those+who+are+praying.+Yet+the+saints+most+frequently+employed+the+bending+of+the+knees%2C%E2%80%A1+and+so+that+gesture+was+sometimes+used+in+the+absolute+sense+for+the+prayer+itself%2C+as+one+can+see+from+Romans+11%3A4+and+14%3A11%2C+and+likewise+in+Ephesians+3%3A14.+And+in+the+same+vein+the+apsotle+links+the+stretching+forth+of+lifting+up+of+hands+to+the+injunction+that+they+should+prayer+everywhere+%281+Timothy+2%3A8%29.+%E2%80%A1+In+1610+the+consistory+of+Middelburg%E2%80%93where+Walaeus+served+as+a+pastor+from+1605+to+1619%E2%80%93admonished+the+people+to+humble+themselves+bodily+during+the+public+prayers+by+kneeling+and+folding+their+hands%E2%80%A6+According+to+Van+Deursen+that+was+rather+common+at+the+time%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Antonius+Walaeus%2C+The+Synopsis+of+True+Theology+%281625%3B+Brill%2C+2016%29%2C+vol.+2%2C+Disputation+36%2C+%E2%80%98On+the+Religious+Practice+of+Invocation%E2%80%99%2C+pp.+431%2C+433&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7003ce0543.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7003ce0543.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/posture-in-prayer/#:~:text=One%20can%20observe%20a%20variety%20of,was%20rather%20common%20at%20the%20time&amp;text=One%20can%20observe%20a%20variety%20of%20physical%20bearing&amp;text=Deursen%20that%20was%20rather%20common%20at%20the%20time" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

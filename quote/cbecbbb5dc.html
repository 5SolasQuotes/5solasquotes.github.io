<main class="wrap"><figure class="quote" id="q-cbecbbb5dc" data-kw="">
<blockquote><p>Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ, vol. 1, Edinburgh, 1868</cite>, p. 243</span></figcaption>

lank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cc8ab07d5" data-kw="">
<blockquote><p>There be some that call in question the warrant and authority of classical presbyteries, of provincial synods and national assemblies, as they are used and maintained in the Church of Scotland. I mean not the praelatical faction, whom we set aside, but even some who are as anti-episcopal as we are. The scrupulosity of such (at least of many such) herein [of the Independents] does (we conceive) proceed not from any perverseness of mind, but only from certain mistakings, which better information may remove.</p></blockquote>

</figure><figure class="quote" id="q-f29f5b7daa" data-kw="">
<blockquote><p>…nor can it be said that church-censures are spiritual punishments and so work on the spirit and have instructing, rebuking and exhorting going before, but the sword is a bodily punishment, and has not instructing going before. For I answer [that] though these two punishments differ, yet they agree that formally both are alike compulsory of the conscience, and neither of them act upon the spirit by teaching and instructing as the Word does, so as excommunication of a heretic should have instructing and convincing going before, so should also the Magistrate presuppose, before he strike with the sword, that the false teacher has been instructed and convinced, and so he does formally punish him with the sword for his pertinacious perverting of souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 2</cite>, p. 48</span></figcaption>

</figure><figure class="quote" id="q-78047d539a" data-kw="">
<blockquote><p>It shall be bound in heaven, and loosed in heaven: not that Christ has hereby obliged himself to confirm all church-censures, right or wrong; but such as are duly passed according to the Word, clave non errante [the key not erring]–the key turning the right way, such are sealed in heaven; that is, the word of the gospel, in the mouth of faithful ministers, is to be looked upon, not as the word of man, but as the word of God, and to be received accordingly, 1 Thess. 2:13.</p></blockquote>

</figure><figure class="quote" id="q-f871071d58" data-kw="">
<blockquote><p>The apostles would make no laws at all of things indifferent except in the case of scandal… If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find pre-existent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the least circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>

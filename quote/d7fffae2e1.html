<main class="wrap"><figure class="quote" id="q-d7fffae2e1" data-kw="">
<blockquote><p>[T]o symbolize with Idolaters in their acts of worship, is a thing unlawful to Christians. We know that the Masse is the greatest idol that ever was in the world; and that the act of kneeling was brought in at the Popish communion to worship that Idol: we ought not therefore to symbolize with them in that act of worship; for it is not lawful for us to follow the corruption of an Ordinance, when we have Christ’s imitable practise made known to us:

It is not lawful to mix the acts of God’s true worship, with the chief act of an Idol-worship, such as is Kneeling at the Mass; For the meaning and purpose of kneeling, is Adoration; the object of adoration is the Body and blood of Christ, supposed to be in the Elements: but if we believe no such real presence as they have fancied, then we make void the object of adoration, and consequently the act intended towards it is disannulled also.

But if any doth incline to kneeling, because it hath been a custom hitherto used; he may upon the same ground practise all other Popish idolatries and superstitions. But if you will say, that you think Christ ought to be worshipped there, and that you cannot come to his table with too much reverence; You must understand, that Christ doth not intend to be worshipped there, but to be received; and that you must not be led by your own thinking, but by the manifestation of his will in matters of worship; nor can any one gesture be accounted reverence to him more then another, otherwise then as he doth appoint it to be in his worship.

The standing at the first Passover in Egypt, was a reverence; The sitting at the table with Christ, was in his disciples a reverence to him; nay, and their suffering of him to wash their feet, as their servant, was a reverence due to him as their master, because it was his will to have it so. It is neither circumcision nor uncircumcision, but the doing of God’s will, that maketh us acceptable unto him.

Now it is contrary to his will, that we should follow another example of worship then that which his Apostles have given us: It is contrary to his will, that we in his worship should symbolize with Idolaters, and that we should seem to collude with them in their act of Idol-worship, when we know that the Lord will not be adored, but received in his Supper; and it is no reverence at all, but a very irreverent and unbeseeming behaviour, to put forth an act proper to adoration, when he doth call us to put forth an act of communion and fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t</cite>, (London: John Bellamy, 1647), pp 40-41.</span></figcaption>

<blockquote><p>For since false teachers and heretics in regard of the spiritualness of their sin are the worst of evil doers, and such as work abomination in the Israel of God, and there is no particular laws in the New Testament for bodily coercing of Sorcerers, Adulterers, Thieves, Traitors, false witnesses, who but speak lies against the good name of their neighbour, not against the name of God, nor against Sodomites, defilers of their bodies with beasts, perjured persons, Covenant breakers, liars &amp;.c. What reason in nature can there be to punish the one, and not the other? for it may with as good colour of reason be said, that all the Laws in the old Testament, for drawing of the sword against Sodomites, Adulterers and such like, were typical and temporary, and are done away now in Christ, for Christ will have these converted in as spiritual a way by the only power of the word of God as the other and no where in any express law in the New Testament doth God command to use the bloody sword against them, more than against blasphemers.</p></blockquote>

<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>

<blockquote><p>The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1898 | This quote was compiled by Andy Webb</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.”

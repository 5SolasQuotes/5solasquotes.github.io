<main class="wrap"><figure class="quote" id="q-a1ab3ad138" data-kw="">
<blockquote><p>V. Particular churches how they may be known, whether they be true churches or not.

And hereby we believe every particular church may be discerned, whether it be a true church gathered in the Lord, even by those things whereupon the Lord hath willed them to be built, namely upon the preaching of the gospel, the administration of the sacraments instituted of Christ and the keeping of his commandments. Therefore those churches we acknowledge for the true churches of Christ, in which first the pure doctrine of the gospel is preached, heard and allowed of, and that so allowed of, that there is no place nor hearing for the contrary.

For these both are properties of the flock or sheep of Christ, namely to hear the voice of their shepherd and to reject the strangers voice. In those also, where the sacraments instituted of Christ (as much as in them lieth) are lawfully, that is according to Christ’s own institution administered and received, and so where other sacraments devised by men are not allowed of.

In those lastly, where the discipline of Christ taketh place, that is, where a care is taken through love, that both privately and publicly, by admonitions, corrections and, when need requireth, by excommunications the commandments of Christ may be observed. And so that men may live soberly, justly, and godly to the glory of God and edification of their neighbours.

For, wheresoever ungodliness and all looseness of life is in public practise and open offences are not reproved according to the discipline of Christ, there we believe that it is possible that many good and godly men may be, but we believe this is not a godly and christian congregation; the Lord himself saying: ‘In this men shall know that ye are my disciples, if ye have love one to another’. But what love can there be, where no care is taken that according to Christ’s doctrine brethren, which offend, may be corrected, may repent, may be gained unto the Lord and saved?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXIV.V, 1: 395-97.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>

<blockquote><p>That whosoever, after the sentence of deposition pronounced against them, do either exercise any part of their ministerial calling in the places they formerly served in, or do possess, meddle or intromit with the stipends or other benefits whatsoever belonging to these kirks they served, they shall be proceeded against with excommunication: And, if any suspended minister, during his suspension, either exercise any part of their ministerial calling, or intromit with the stipend, that he be deposed, and after deposition continuing in any of those faults, that eh be processed with excommunication.</p></blockquote>

</figure><figure class="quote" id="q-7593d8dc08" data-kw="">
<blockquote><p>Though I differ from my reverend Brethren who have taken the oaths, yet I look upon myself as obliged to receive their testimony concerning the principles they adhere to; and few of them I know do approve the incorporating Union, and far less do any of them approve Erastian prelacy, supremacy and the English-Popish ceremonies. I owe them the charity or justice to believe that they sincerely disown these evils. Touching strainings for extracting perjury, scandal, error, heresy, and other such abominable crimes, from the different sentiments and practices of ministers, who otherwise are one in principle; such measures, I say, tend natively to confound all Christian societies, and are, amongst the inventions of Satan, mostly reserved till these last and perilous days, wherein our lot is fallen. No sound divine, nor any other fair antagonist (for what I know did ever charge his adversary with controverted consequences, as his direct and received opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

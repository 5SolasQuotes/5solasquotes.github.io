<main class="wrap"><figure class="quote" id="q-8ad5600263" data-kw="">
<blockquote><p>Now to shut up all touching this point of man’s liberty in resisting the grace of God, the sum of all is this: Before true conversion all unregenerate persons do resist the gracious means and preparations to their conversion, the reprobate finally, the elect for a time, till grace become victorious in their perfect sanctification. In this their first conversion or regeneration the elect are no way active either to work it or to hinder it. After their conversion in the doing of all good works, immanent or transient, they resist not so far as they are spiritual; they cannot but resist so far as they are carnal. And though in time of temptation and spiritual desertion the flesh do not only resist but also prevail, to the hinderance of many particular gracious actions, yet for those main and principal acts of faith, repentance, love of God, hatred of evil, etc. the Spirit is infallibly victorious both to do them after the first conversion and also finally to persevere in doing of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627)</cite>, pp. 154-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

ne · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-956899ff18" data-kw="">
<blockquote><p>We have already advertised that this opinion is falsely laid upon us: That God does draw a man unresistibly [being unable to resist]. We only say that the elect, although they may resist a long time, yet at length they obey God calling, and their voluntary conversion is wrought certainly and infallibly, and that it cannot come to pass that they should never be converted, or being converted, that they should finally fall away and the grace of God should be at length extinguished, and be finally overcome by the resistance of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism… (1619; London, 1635)</cite>, p. 492</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-7567078cbd" data-kw="">
<blockquote><p>It is an absolute decree of the Divine will published in the Gospel, That whosoever repenteth, believeth, persevereth, shall be saved: From hence is derived that mixt conditionall decree, If Cain, if Judas, if any other repent and believe, they shall be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | Because of God’s foreknowledge of all future actions of all human beings, as well as his absolute power to cause them to do any good which would lead to blessedness or leave them in their sin leading to destruction, all of God’s decrees are either absolute or mixed conditionals. Moreover, all decrees are either revealed or hidden. The decree regarding a person’s election is hidden; on the other hand, the decree that God will save any person that believes is revealed. Decrees that come in the form of a condition— such as “If Esau believes, he will be saved”— are not pure conditionals, as noted above, but are said to be mixed because they are grounded upon God’s absolute, effectual, and revealed will that he has bound himself to, namely, that he will save any who repent and believe. According to an eternal and inviolable divine ordination, there is an indissoluble connection between faith and salvation. Davenant explains:</cite>, pp. 151-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

— John Davenant, On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | Because of God’s foreknowledge of all future actions of all human beings, as well as his absolute power to cause them to do any good which would lead to blessedness or leave them in their sin leading to destruction, all of God’s decrees are either absolute or mixed conditionals. Moreover, all decrees are either revealed or hidden. The decree regarding a person’s election is hidden; on the other hand, the decree that God will save any person that believes is revealed. Decrees that come in the form of a condition— such as “If Esau believes, he will be saved”— are not pure conditionals, as noted above, but are said to be mixed because they are grounded upon God’s absolute, effectual, and revealed will that he has bound himself to, namely, that he will save any who repent and believe. According to an eternal and inviolable divine ordination, there is an indissoluble connection between faith and salvation. Davenant explains:, pp. 151-52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+an+absolute+decree+of+the+Divine+will+published+in+the+Gospel%2C+That+whosoever+repenteth%2C+believeth%2C+persevereth%2C+shall+be+saved%3A+From+hence+is+derived+that+mixt+conditionall+decree%2C+If+Cain%2C+if+Judas%2C+if+any+other+repent+and+believe%2C+they+shall+be+saved.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+On+John+Davenant+%26+Aquinas+%7C+Michael+Lynch%2C+John+Davenant%E2%80%99s+Hypothetical+Universalism%3A+a+Defense+of+Catholic+%26+Reformed+Orthodoxy+%28Oxford+Univ.+Press%2C+2021%29+%7C+Because+of+God%E2%80%99s+foreknowledge+of+all+future+actions+of+all+human+beings%2C+as+well+as+his+absolute+power+to+cause+them+to+do+any+good+which+would+lead+to+blessedness+or+leave+them+in+their+sin+leading+to+destruction%2C+all+of+God%E2%80%99s+decrees+are+either+absolute+or+mixed+conditionals.+Moreover%2C+all+decrees+are+either+revealed+or+hidden.+The+decree+regarding+a+person%E2%80%99s+election+is+hidden%3B+on+the+other+hand%2C+the+decree+that+God+will+save+any+person+that+believes+is+revealed.+Decrees+that+come+in+the+form+of+a+condition%E2%80%94+such+as+%E2%80%9CIf+Esau+believes%2C+he+will+be+saved%E2%80%9D%E2%80%94+are+not+pure+conditionals%2C+as+noted+above%2C+but+are+said+to+be+mixed+because+they+are+grounded+upon+God%E2%80%99s+absolute%2C+effectual%2C+and+revealed+will+that+he+has+bound+himself+to%2C+namely%2C+that+he+will+save+any+who+repent+and+believe.+According+to+an+eternal+and+inviolable+divine+ordination%2C+there+is+an+indissoluble+connection+between+faith+and+salvation.+Davenant+explains%3A%2C+pp.+151-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7567078cbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7567078cbd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=It%20is%20an%20absolute%20decree%20of,and%20believe%2C%20they%20shall%20be%20saved&amp;text=It%20is%20an%20absolute%20decree%20of%20the%20Divine&amp;text=other%20repent%20and%20believe%2C%20they%20shall%20be%20saved" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9948254dea" data-kw="">
<blockquote><p>Reply Obj. 1: A thing moved by another is forced if moved against its natural inclination; but if it is moved by another giving to it the proper natural inclination, it is not forced; as when a heavy body is made to move downwards by that which produced it, then it is not forced. In like manner God, while moving the will, does not force it, because He gives the will its own natural inclination. Reply Obj. 2: To be moved voluntarily, is to be moved from within, that is, by an interior principle: yet this interior principle may be caused by an exterior principle; and so to be moved from within is not repugnant to being moved by another. Reply Obj. 3: If the will were so moved by another as in no way to be moved from within itself, the act of the will would not be imputed for reward or blame. But since its being moved by another does not prevent its being moved from within itself, as we have stated (ad 2), it does not thereby forfeit the motive for merit or demerit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 105, art. 4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-fa41277d16" data-kw="">
<blockquote><p>The communication of grace effectual, producing infallibly the good things proposed and promised in the minds and hearts of men, belonged not unto that covenant. If, therefore, there be no more in the making of the new covenant but only the adding of more forcible outward means and motives, more suitable unto our reasons, and meet to work on our affections, it differs only in some unassignable degrees from the former. But this is directly contrary unto the promise in the prophet, that it shall not be according unto it, or of the same kind.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0f7d0d440a" data-kw="">
<blockquote><p>7. We are all so very much in the dark as to the clear and distinct apprehension of the true nature of original, inherent pravity or sin that we must needs be as much ignorant of the true nature of that inherent sanctity or righteousness which is its contrary, or cure. Learned [Matthew Flacius] Illiricus thought it was a substance, which he has in his Clavis pleaded for at large. Others call it a habit, others a nature, or natural inclination and a privation of a natural inclination to God: others call it an indisposition of the mind and will to holy truth and goodness, and an ill disposition of them to error and evil. Others call it only the inordinate lust of the sensitive faculties, with a debility of reason and will to resist it. And whilst the nature of the soul itself and its faculties are so much unknown to itself, the nature of original pravity and righteousness must needs be very much unknown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: 1673), Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’</cite>, p. 819</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ab3fa7fc2b" data-kw="">
<blockquote><p>That original sin is derived to us, and inheres deeply fixed within us, is more than clear enough; but how it was propagated from Adam to his posterity ought to be believed rather than investigated, and can be investigated more easily than it can be understood, and is better understood than it is explained. It is not so much our concern now to care how we fell into this evil, as to be freed from it; just as Augustine relates of the one who had fallen into a well: to someone admiring how he could have fallen into the well, he said, “You think about how to free me from here, not ask how I fell in here.</p></blockquote>

</figure><figure class="quote" id="q-dc0406b35f" data-kw="imputation">
<blockquote><p>However although this mode of general propagation is evident and is sufficient for establishing the truth of the traduction of sin; whence since Julian sought through what chinks sin could have entered, since he does not sin who is born; he does not sin who begat; he does not sin who made—Augustine answers, “Why does he seek a concealed crack, when he has a wide open gate? By one man.… What does he seek further; what clearer; what more impressive?” (On Marriage and Concupiscence 2.28 [NPNF1, 5:302; PL 44.464]). Still because the importunity of our opponents is wont to attack this mode violently as impossible (because sin can neither pass by the soul, which is created by God and is not drawn from the body, nor by the body which is brute and incapable of sin), let us see what can be said here more particularly to untie the knot which they think cannot be loosed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.12</span></figcaption>

</figure><figure class="quote" id="q-efc3c1fb98" data-kw="">
<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin… (d. 1595; Legat, 1600), bk. 1, ch. 7</cite>, pp. 25-26 trans. AI Latin</span></figcaption>

dam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.”

herwise%2C+you+affirm%2C+this+privation+left+in+nature+by+sin+could+not+make+us+sinners.+Therefore%2C+we+are+not+only+bound+by+a+habitual+iniquity%2C+but+we+have+sinned+with+an+actual+will+in+Adam%3B+and+this+will+is+primarily+to+be+considered+in+original+sin%2C+without+which+we+could+neither+be+nor+be+held+as+sinners.+What+you+%5BBellarmine%5D+interpose+concerning+a+pact+or+precept+pertains+nothing+to+the+matter%3B+for+whether+Adam+received+this+justice+on+this+law+and+condition%2C+that+he+should+either+preserve+or+lose+it+for+himself+and+his+own%2C+or+whether+no+such+convention+intervened+between+God+and+Adam%2C+since+he+was+the+parent+and+origin+of+the+nature+and+of+the+human+race%2C+it+was+necessary+that+in+him+we+either+stand+or+fall.+Although%2C+that+God+threatened+him+with+death+if+he+should+move+his+hand+to+the+forbidden+tree%2C+from+this+it+sufficiently+appears+that+he+had+been+forewarned+of+the+danger+into+which+he+would+cast+himself+headlong+if+he+should+sin%2C+of+which+nothing+was+to+be+feared+if+he+should+remain+in+his+duty.+And+hither+is+wont+to+be+brought+what+we+read+in+the+prophet%3A+%E2%80%9CBut+they+like+Adam+have+transgressed+the+covenant%E2%80%9D+%28Hos.+6%3A7%29.+Nor+is+it+to+be+thought+that+Adam+was+ignorant+either+of+the+reward%2C+if+he+should+not+sin%2C+or+of+the+punishment%2C+if+he+should+dare+to+sin.+Unless+this+had+been+foretold+to+him%2C+he+would+have+had+some+excuse%2C+although+not+a+sufficient+one%3B+now%2C+having+been+taught+before+of+the+event%2C+since+he+did+not+have+faith+nor+take+care+for+himself%2C+he+is+to+be+thought+to+have+deservedly+fallen+into+this+calamity.+Although%2C+however%2C+there+had+been+no+word+on+this+matter%2C+yet+what+unhappiness+he+willingly+brings+upon+himself%2C+God+has+justly+inflicted+upon+all+his+posterity.+But+in+what+way%3F+Because+His+will+is+the+norm+of+right+and+of+justice.+You+will+never+otherwise+understand+it+to+have+been+just+that+we+are+all+born+miserable+on+account+of+the+temerity%2C+or+infidelity%2C+or+ambition%2C+or+whatever+fault+of+the+first+man.+For+that+you+say+his+will+was+ours%2C+and+we+willed+in+him%2C+I+confess+to+be+true%2C+but+the+reason+for+this+truth+is+none+other+than+the+will+of+the+creator.+For+what+cause+will+you+bring+%5Bon+your+view%5D+why+all+children+do+not+in+the+same+way+atone+for+the+faults+of+their+parents%3F+You+will+say+that+Adam+is+to+be+considered+as+the+seed+and+principle+of+nature%2C+and+his+sin+was+the+sin+of+nature+itself%3B+the+sins+of+others+are+personal%3B+therefore+his+is+transfused+with+nature%2C+not+those+of+others.+I+hear%2C+and+I+do+not+object.+But+why+Adam+by+sinning+destroyed+not+only+his+person+but+nature%2C+when+other+men+harm+their+own+persons+but+do+not+make+nature+worse%2C+assign+a+cause%2C+if+you+can%2C+other+than+the+most+just+will+of+God.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Treatise+on+Original+Sin%E2%80%A6+%28d.+1595%3B+Legat%2C+1600%29%2C+bk.+1%2C+ch.+7%2C+pp.+25-26+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc3c1fb98.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc3c1fb98.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-covenant-of-works/#:~:text=For%20you%20%5Ba%20Romanist%5D%20say%20that,the%20most%20just%20will%20of%20God&amp;text=For%20you%20%5Ba%20Romanist%5D%20say%20that%20that%20privation&amp;text=other%20than%20the%20most%20just%20will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-605a0ea47d" data-kw="saints know one another">
<blockquote><p>Will the saints in the other world know one another? We affirm. As in the Scriptures nothing is taught expressly and distinctly on this question, so nothing is set forth to be necessarily believed concerning it. In the meanwhile, the more common opinion is the affirmative, which asserts that the saints will know each other. In our opinion, this is also the more probable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.11.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a> › <a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory/fellowship.html">Fellowship</a></span></div>

<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

<blockquote><p>Will there be degrees of glory? And will the glory in heaven be equal or unequal and unlike? The Romanists assert the inequality of glory from the inequality of merits which they are accustomed to place under it as a foundation. Among the orthodox the question is problematic; yet the more common opinion asserts degrees of glory without founding them upon merit of works, but upon the free gift of God.</p></blockquote>

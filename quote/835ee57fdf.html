<main class="wrap"><figure class="quote" id="q-835ee57fdf" data-kw="">
<blockquote><p>Where the Lord does not dwell, peace will not inhabit. How frequently may we observe, in their family connexions, discord and enmity between man and wife, unkind parents, disobedient children, tyrannical masters, and treacherous servants? Thus they live, “hateful in themselves, and hating one another.” If they have what the world accounts prosperity, their hard master, Satan, so works upon their evil dispositions, that they can derive no real comfort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-newton.html">John Newton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Opposition to Messiah in vain in Richard Cecil (ed.), The works of the Rev. John Newton</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31d09e463d" data-kw="">
<blockquote><p>Now why should we once name or make mention of that third kind of traditions, which do either shake the foundations of the salvation by Christ, either overthrow the things that are built upon that foundation. Such as are the supremacy of the bishop of Rome, the praying to saints, prayer for the dead, the making and the worshipping of idols, the magistral and doctoral determinations (as they call them) of free will, of merit, of pardons and of such other filthiness, the which things seeing they could never be established so long as the authority of the heavenly doctrine stood unshaken in his full force, so are they over impudent which do think that these things may be established either by the false forged title of the Church or by the prescription and length of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the most renowned Prince Louis</cite>, [I] of Bourbon [d. 1569], Prince of Conde [in France]… in A Confession of Faith made by Common Consent of diverse Reformed Churches beyond the Seas: with an Exhortation to the Reformation of the Church. Perused &amp; allowed according to the Queen’s Majesty’s injunctions (London: Wykes, 1568)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

he%20prescription%20and%20length%20of%20time&amp;text=Now%20why%20should%20we%20once%20name%20or%20make&amp;text=or%20by%20the%20prescription%20and%20length%20of%20time" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d136827407" data-kw="">
<blockquote><p>First of all, we have to realize that the ministry of the Word is something full of hard work and trouble. Just as a mother carries a fetus in her womb with great effort, losing her appetite for food and appealing to others for help, and just as she gives birth in great pain and then feeds and educates her child with enormous effort, so the trials laid on the backs of ministers of the Word are infinite, and those who risk their reputations in order to win others for Christ have to suffer great trouble (as we are taught by the example of Elijah).

The innate depravity of our mind and nature does not accept that we are children of God. The world is against them, because it does not let people escape from its clutches. What grieves ministers the most is that those for whose salvation they sacrifice everything are often not only ungrateful to them for their efforts but even hostile to them. But just as a mother’s love conquers everything and turns sorrow and trouble into joy, sustaining her through the birth process and the education of her children, so ministers should burn with unquenched love for Christ and the church, so that however hard the going may be, nothing will overpower the joy and delight that they get from fulfilling their ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

lasquotes.github.io%2Fquote%2Fd136827407.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d136827407.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/05/06/rudolf-gwalther-on-the-gospel-ministers-sorrows-and-joys/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ac4705b8fe" data-kw="">
<blockquote><p>For the erecting of a Church within a presbyterian Church, I must say that it is a novation with a witness. Our friends express much zeal for the obligation of our covenants (which I acknowledge is inviolable) and therefore I would recommend to their serious views that article of our National Covenant, whereby we abjure all novations contrary to our received standards. Sure I am, our old covenanters were not of their mind. I know no precedent for their way amongst us save this one, of which I think they will not be very fond, namely, that of the Public Resolutioners, who were the first that ever pretended to set up distinct judicatories in this Church: The Protesters sat with them in judicatories without any hesitation, and pressed to continue, and to act a faithful part as it might please the Lord to guide them, they were the separatists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

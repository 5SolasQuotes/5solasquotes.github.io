<main class="wrap"><figure class="quote" id="q-e5b56e01c6" data-kw="">
<blockquote><p>[The Gospel] serves, likewise, the highly important purpose of discovering to sinners their warrant to trust in Christ Jesus for complete salvation. In the blessed gospel, Christ, and God in Christ, are freely offered to sinful men, and men are graciously invited as sinners to receive the offer and to entrust the whole affair of their salvation to Christ and to God in Him (Isa. 55:1–4; John 6:32). By the gospel, they are informed that the Lord Jesus offers Himself with all the inestimable blessings of the everlasting covenant to them and that He graciously invites and urges them as sinners to accept Him as their all-sufficient Savior “and to place the confidence of their hearts in Him for salvation from sin and wrath. Were they to not know that a divine warrant is thereby afforded them to receive and trust in the Savior for their salvation, it would be as great presumption in any of them as it would be in a fallen angel to attempt trusting that He would save him. But by the declarations, offers, calls, and promises of the word of grace, an ample warrant is afforded them as sinners of mankind to trust in the divine Savior and so to take possession of His great salvation. And it is by the gospel, accompanied by the illuminating grace of the Holy Spirit, that their warrant is revealed, that their full right of access to the compassionate Savior is disclosed to them, and that He manifests Himself to be so near them as to be within their reach (Rom. 10:6–8). Oh, how great is the importance and utility of the gracious offers and invitations of the blessed gospel to convinced and despondent sinners! By these, under the illuminating influences of the adorable Spirit, they see that it is lawful and warrantable for them to come as sinners and to entrust, with humble and strong confidence, the eternal salvation of their souls to the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 108–9.</span></figcaption>

<blockquote><p>I answer that, The will is a rational appetite. Now every appetite is only of something good. The reason of this is that the appetite is nothing else than an inclination of a person desirous of a thing towards that thing. Now every inclination is to something like and suitable to the thing inclined. Since, therefore, everything, inasmuch as it is being and substance, is a good, it must needs be that every inclination is to something good. And hence it is that the Philosopher says (Ethic. i, 1) that the good is that which all desire. But it must be noted that, since every inclination results from a form, the natural appetite results from a form existing in the nature of things: while the sensitive appetite, as also the intellective or rational appetite, which we call the will, follows from an apprehended form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 of 2 | quest. 8, art. 1, Whether the will is of good only?</span></figcaption>

<blockquote><p>God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man. Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit. The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works, which was entered into with Adam, and renewed on Mount Sinai. These two covenants indeed agree with each other in various particulars:—of both, God is the author; in both there are the same contracting parties; in both is promised eternal life and happiness: but they differ also in many respects; in the covenant of works God is considered as Creator and Lord, in the covenant of grace as Redeemer and Father; in the first there were was no mediator, in the second Christ is the Mediator; in the one God dealt with man as upright, in the other he deals with man as a sinner; the former depended on man’s own obedience, the latter depends on the obedience of Christ; in the former was promised life, namely, a state consisting of all good things; in the latter is promised salvation, which, along with life, includes also deliverance from sin and death; in the first God required works, saying, Do this and live; in the second he requires faith, saying, Believe, and thou shall be saved. The covenant of grace does indeed require works of righteousness, but not that we may merit eternal life by them; nor does the imperfection of Christian obedience, provided it be sincere, stand in the way of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 281–82.</span></figcaption>

hor%3B+in+both+there+are+the+same+contracting+parties%3B+in+both+is+promised+eternal+life+and+happiness%3A+but+they+differ+also+in+many+respects%3B+in+the+covenant+of+works+God+is+considered+as+Creator+and+Lord%2C+in+the+covenant+of+grace+as+Redeemer+and+Father%3B+in+the+first+there+were+was+no+mediator%2C+in+the+second+Christ+is+the+Mediator%3B+in+the+one+God+dealt+with+man+as+upright%2C+in+the+other+he+deals+with+man+as+a+sinner%3B+the+former+depended+on+man%E2%80%99s+own+obedience%2C+the+latter+depends+on+the+obedience+of+Christ%3B+in+the+former+was+promised+life%2C+namely%2C+a+state+consisting+of+all+good+things%3B+in+the+latter+is+promised+salvation%2C+which%2C+along+with+life%2C+includes+also+deliverance+from+sin+and+death%3B+in+the+first+God+required+works%2C+saying%2C+Do+this+and+live%3B+in+the+second+he+requires+faith%2C+saying%2C+Believe%2C+and+thou+shall+be+saved.+The+covenant+of+grace+does+indeed+require+works+of+righteousness%2C+but+not+that+we+may+merit+eternal+life+by+them%3B+nor+does+the+imperfection+of+Christian+obedience%2C+provided+it+be+sincere%2C+stand+in+the+way+of+our+salvation.%E2%80%9D%0A%0A%E2%80%94+Benedict+Pictet%2C+Christian+Theology%2C+trans.+Frederick+Reyroux+%28Philadelphia%3A+Presbyterian+Board+of+Publication%2C+n.d.%29%2C+281%E2%80%9382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce0d0714fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce0d0714fd.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/pictet-on-the-similarities-and-differences-between-the-covenants-of-grace-and-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject. I think that the word world, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>

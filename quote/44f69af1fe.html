<main class="wrap"><figure class="quote" id="q-44f69af1fe" data-kw="">
<blockquote><p>By these things it is plain, that by those friends and sheep for which Christ died, are not understood those, only, who love God and follow Christ, but all those whom God loveth, and whose salvation he decreed for whom Christ died when they did not yet love God, and when they were enemies to him.

And therefore they are called enemies, Rom. 5.10 because they did not love God, but yet even then they were highly loved by God, and were appointed to salvation in Christ: For in a divers respect they were both friends and enemies, sheep and goats: Friends because God loved them, enemies because they did not yet love God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 25.5, p. 176.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“By these things it is plain, that by those friends and sheep for which Christ died, are not understood those, only, who love God and follow Christ, but all those whom God loveth, and whose salvation he decreed for whom Christ died when they did not yet love God, and when they were enemies to him.

And therefore they are called enemies, Rom. 5.10 because they did not love God, but yet even then they were highly loved by God, and were appointed to salvation in Christ: For in a divers respect they were both friends and enemies, sheep and goats: Friends because God loved them, enemies because they did not yet love God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04e73746c9" data-kw="">
<blockquote><p>There is such a fulness in the satisfaction of Christ, as is sufficient for the salvation of the whole world, were the whole world to believe in Him.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-685533d1c4" data-kw="necessity satisfaction debt">
<blockquote><p>The satisfaction here discussed is not taken widely for a simple and indiscriminate reparation of injury (as when one purges and excuses himself to him who has suffered injury). Rather it is taken strictly for the payment of a debt, with which is paid what another owes and with which he satisfies the creditor or judge who requires the debt or punishment. Was it necessary for Christ to make satisfaction to divine justice for us? We affirm against the Socinians.</p></blockquote>

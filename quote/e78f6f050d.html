<main class="wrap"><figure class="quote" id="q-e78f6f050d" data-kw="">
<blockquote><p>[W]e ought certainly to hold, that in this precept, ‘Thou shalt not lust’, are prohibited our corrupt inclination and evil motions of the mind, which we should not acknowledge to be sins, unless the law had showed them unto us. Aristotle, Pigghius and such other like, for that they were ignorant of the law of God, contend that these are not precepts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, (d. 1562; London, 1568), Ch. 7, p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45aba695e3" data-kw="">
<blockquote><p>…and the ignorance of any questions which may be cleared by God’s Word, is vincible and culpable, for the Law says, ‘The ignorance of these things which we are obliged to know is culpable, and excuses not.’ (Reg. juris Culpabilis est ignorantia rerum quas scire tenemur.) But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no, whether Titus committed murder, or no, and in this there is sometimes invincible ignorance when all diligence morally possible is given to come to the knowledge of the fact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644) | pt. 1, ch. 3, Section 3, Question 4, p. 45</span></figcaption>

</figure><figure class="quote" id="q-0c47a84260" data-kw="">
<blockquote><p>Secondly, God put into the soul these faculties, understanding, will, sense and appetite, which are naturally carried to things that are obvious and known, and not to things that are unknown and far removed. … Fifthly, God has put into every man, for his own preservation, a love of himself, which love is naturally good; but does then begin to be morally good, when it does accord[ing] to and help forward the love of God.</p></blockquote>

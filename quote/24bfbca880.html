<main class="wrap"><figure class="quote" id="q-24bfbca880" data-kw="">
<blockquote><p>God has implanted two accounts [rationes] in the first matter, namely, causal or obediential principles whereby all things are naturally apt to obey God, such that whatever might please him would come to be from them. He has also implanted seedlike principles—that is, active principles whereby natural effects are brought about; and he is sometimes said to act contrary to these in the miracles that he performs. But properly speaking, even then he does not act contrary to them, but alongside them, or above them. He acts above them when he brings about an effect to which nature can in no way reach, like the form of glory for the glorified bodies. He acts alongside them when he produces without the service of natural causes an effect that nature can bring about, like when in John 2 he converts water into wine. But he does not act contrary to them, since he does not make it that an active natural cause, while remaining the same in species, has a different essential effect, such as that a fire, while remaining a fire, might cool something, just as it cannot simultaneously be the same thing and different. But he can indeed destroy one nature and make another, remove one form from matter and induce another; for in this way fire acts contrary to the nature of air when it corrupts it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, bk. 1, dist. 42, Power of God, quest. 2, art. 2, ‘Whether God can do things that by nature are impossible’, reply to obj. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b08de97c2c" data-kw="">
<blockquote><p>In Christ’s conception there were two miracles: one that a woman conceived God, and another that a virgin begot a child. As to the first, then, the Blessed Virgin was involved in the conception only according to an obediential potency, and yet one much more remote than was the man’s rib as that from which the woman was formed. Now, in such matters the act and the potency toward the act are given together, as far as this may be said to be possible. But as to the second miracle, the Virgin did have a passive potency, although a natural one, which could be brought into act by a natural agent. Whence, as to the first he [Lombard] says, ‘a power receptive of the Word of God’; but as to the second he says, ‘but at the same time a power to beget the Word of God’. For the power of the Holy Spirit brings both potencies into act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 3, quest. 2, art. 1, Whether the Virgin actively contributed anything toward Christ’s conception, Reply to obj. 1, bk. 3,</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</a></div>
</figure><figure class="quote" id="q-4d9204281e" data-kw="">
<blockquote><p>We ought to take care, on the other hand, lest, by proving that it is not the lack of members, senses, or faculties that accounts for man’s inability to act in a spiritual manner, we should set forth that weakness as something small, and that man may remove it by some endeavor of his own…</p></blockquote>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, 1</span></figcaption>

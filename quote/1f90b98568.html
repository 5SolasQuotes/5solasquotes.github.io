<blockquote><p>The rest of the Sabbath (which is as strictly enjoined as abstinence at a fast, yet) might be lawfully broken for the preservation of a man’s life, as we see in Elijah’s travel (1 King. 19. 8.) five or six Sabbaths together; yea for the preservation of the life of a beast, Luke 14. 5. yea for the preservation of the health of a beast, Luke 13. 15. For, God delights more in mercy, than in any external works even of His own service, Mat. 12. 7.</p></blockquote>

<blockquote><p>Reason 2. Because nothing is required of them unfitting or burdensome, but that once every week, in convenient time and place, every one would contribute according to that measure wherewith God had blessed him: And the manner is plain, whereby the collection might be made publicly every Lord’s Day, and yet every one should lay it by himself, i. e. no man knowing the sum: We may imagine that they imitated the example of the ancient Church, a bored Chest being placed in the entrance to the house where they met for the Worship of God.</p></blockquote>

<blockquote><p>VIII. Did David, as the psalmist of Israel, write all the psalms?

No. He wrote probably more than one half of them. Yet they are called by his name (David, Heb. 4:7. Rom. 11:9) because he was employed more extensively than any other, in this part of the word of God, as the amanuensis of the Holy Ghost.

IX. What name was originally given to that part of the Holy Scriptures which is thus called David?

It was called “Tehillim,” that is, hymns or praises, because it was given as the matter of divine praise to the church of God in every future age. It is also called “Psalms,” because many of these “spiritual songs” were, at the temple worship, sung with the psaltery. Parts of the book have other names, as Mizmor, Shir (46, title), Tehillah (145, title), Tephilah (17,86,102, titles), Prayers, Shir-hammacholoth (120-134) – Odes of Ascension. They are also called, in the Septuagint, Psalmoi.

X. When were the Tehillim, or Psalms written and formed into a book?

They were written in a manner similar to the other parts of Scripture Heb. 1:1, during a period of nearly one thousand years, and were collected into one book, probably by “Ezra the priest, a scribe of the law of the God of heaven.” They stood in their present numerical order in the days of the apostles. Acts 13:33.

XI. Were other songs, beside those contained in the Book of Psalms, composed during that period?

Yes, many. Such as the Song of Deborah Judg. 5:12, the song of the well Num. 21:17, 18, the 1005 songs of Solomon, and others.

XII. Were not these then given as the matter of her praise, or are they not commanded to be sung by the church in all future ages?

No. As we read of different books in Scripture, such as the book of Gad, of Nathan, of Jehu, of Jasher, and the Epistle from Laodicea, which were not collected into the sacred canon, by the Holy Ghost, so we thus know, that by the same divine sovereignty, the songs thus noticed, or even recorded, were ephemeral as matter of praise; while the songs contained in the “Sepher Tehillim,” or Book of Psalms, and collected and placed in one book by the Spirit, are a part of “the word of God, which liveth and abideth forever,” selected by infinite wisdom, and given expressly as the matter of praise to the church until the end of time. The same principle applies to any isolated and occasional hymns or songs, which may be found in the New Testament.

XIII. Were any attempts made to add to the Book of Psalms, after it was completed?

Yes. The 151st psalm was fabricated, and attempted to be added to the then perfect book, nearly three hundred years before “the Christian era.” Septuagint, Psa. 151st.

XIV. Is such an attempt authorized by God?

No. It arises from the depravity of our nature, and the opposition of our wills to the divine will, and consequently forms a part of what the Holy Ghost calls “will worship,” which has a show of wisdom. Col. 2:23.

XV. Is, then, this book called the Book of Psalms, by the Holy Ghost?

It is so called, both by Jesus Christ and by the Spirit. Luke 20:42; Acts 1:20; Heb. 4:7.

XVI. Was it given to the Jewish church to be the matter of praise to God?

Yes. 1 Chron. 16:7; 25:1, 5; Psa. 81:1; . Neh. 12:8, 46; Psa. 137:3, 4; Ezra 3:10.

XVII. Was the Jewish church in reality different from the Christian?

No. They are the same church, under different dispensations. Acts 7:38; Heb. 4:2; Gal. 4:3, 4.

XVIII. When Christ came “to fulfil all righteousness,” and by his evangelists and apostles to complete the oracles of God, did he, or they, praise Jehovah by singing psalms?

Yes, both did. Matt. 26:30; Mark 14:26; Acts 16:25; Psa. 22:2; Heb. 2:13.

XIX. Did they deliver, by inspiration, any other “psalms, hymns, or spiritual songs,” than those contained “in David”? Heb. 4:7.

No. One such psalm or song would be a treasure for the edification of the saints, if “the Psalms” had been simply Jewish; and yet it would not afford a precedent or warrant for uninspired men to make human hymns, and sing them as praise to God. Isa. 1:12. Hos. 13:2.

XX. What is a human hymn, psalm, or spiritual song?

One, of which the arrangement and composition are made by uninspired men, and not by the authority and wisdom of God, even although the sentiment be taken from, and agree with, some portion of Scripture. It has “a show of wisdom;” yet it is only man’s opinion which will be opposed and contradicted by the opinion of some other man metrically expressed, in language, to his mind, equally scriptural. Consequently, “of making many ‘hymn’ books there is no end.” We have now more than one for each Sabbath in the year, all supplanting “the Lord’s song,” (songs), and in their turn supplanted by the poetical skill and caprice of other men. Such compositions, as matter of praise, are, moreover, purely “will worship.” Isa. 1:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-blaikie.html">Alexander Blaikie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism of Praise</cite>, (1849; Boston: S. K. Whipple and Co, 1854), pp 8-11.</span></figcaption>

3A2%3B+Gal.+4%3A3%2C+4.%0A%0AXVIII.+When+Christ+came+%E2%80%9Cto+fulfil+all+righteousness%2C%E2%80%9D+and+by+his+evangelists+and+apostles+to+complete+the+oracles+of+God%2C+did+he%2C+or+they%2C+praise+Jehovah+by+singing+psalms%3F%0A%0AYes%2C+both+did.+Matt.+26%3A30%3B+Mark+14%3A26%3B+Acts+16%3A25%3B+Psa.+22%3A2%3B+Heb.+2%3A13.%0A%0AXIX.+Did+they+deliver%2C+by+inspiration%2C+any+other+%E2%80%9Cpsalms%2C+hymns%2C+or+spiritual+songs%2C%E2%80%9D+than+those+contained+%E2%80%9Cin+David%E2%80%9D%3F+Heb.+4%3A7.%0A%0ANo.+One+such+psalm+or+song+would+be+a+treasure+for+the+edification+of+the+saints%2C+if+%E2%80%9Cthe+Psalms%E2%80%9D+had+been+simply+Jewish%3B+and+yet+it+would+not+afford+a+precedent+or+warrant+for+uninspired+men+to+make+human+hymns%2C+and+sing+them+as+praise+to+God.+Isa.+1%3A12.+Hos.+13%3A2.%0A%0AXX.+What+is+a+human+hymn%2C+psalm%2C+or+spiritual+song%3F%0A%0AOne%2C+of+which+the+arrangement+and+composition+are+made+by+uninspired+men%2C+and+not+by+the+authority+and+wisdom+of+God%2C+even+although+the+sentiment+be+taken+from%2C+and+agree+with%2C+some+portion+of+Scripture.+It+has+%E2%80%9Ca+show+of+wisdom%3B%E2%80%9D+yet+it+is+only+man%E2%80%99s+opinion+which+will+be+opposed+and+contradicted+by+the+opinion+of+some+other+man+metrically+expressed%2C+in+language%2C+to+his+mind%2C+equally+scriptural.+Consequently%2C+%E2%80%9Cof+making+many+%E2%80%98hymn%E2%80%99+books+there+is+no+end.%E2%80%9D+We+have+now+more+than+one+for+each+Sabbath+in+the+year%2C+all+supplanting+%E2%80%9Cthe+Lord%E2%80%99s+song%2C%E2%80%9D+%28songs%29%2C+and+in+their+turn+supplanted+by+the+poetical+skill+and+caprice+of+other+men.+Such+compositions%2C+as+matter+of+praise%2C+are%2C+moreover%2C+purely+%E2%80%9Cwill+worship.%E2%80%9D+Isa.+1%3A12.%E2%80%9D%0A%0A%E2%80%94+Alexander+Blaikie%2C+A+Catechism+of+Praise%2C+%281849%3B+Boston%3A+S.+K.+Whipple+and+Co%2C+1854%29%2C+pp+8-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06eedf8df6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X <blockquote><p>Q. Was this [Lord’s] day set apart thereunto from the beginning?

A. No: for from the first Creation, till the Resurrection of Christ, the last day of the week, commonly called Saturday, was the day that was appointed thereunto; and that which the people of God constantly observed.

Q. And why so?

A. Because upon that day, God ceased from the work of Creation.

Q. How came this day to be changed?

A. By Divine Authority.

Q. How doth that appear?

A. First, by the practice of our Saviour Christ, and his Apostles; which should be a sufficient rule unto us, especially the Apostles having added a commandment thereunto. Secondly, there is no reason why it should be called the Lord’s day, but in regard of the special dedication thereof to the Lord’s service. For otherwise all the days of the week are the Lord’s days, and he is to be served and worshipped in them.

Q. What was the cause why the day was changed?

A. Because it might serve for a thankful memorial of Christ’s Resurrection: for as God rested from his labour on the last day of the week; so Christ ceased from his labour and Afflictions on this day: as the one therefore was specially sanctified in regard of the Creation of the world; so was the other, in respect of the restauration and Redemption thereof, which is a greater work then the Creation it self.

Q. Cannot this day then be altered?

A. No, not by the power of any creature in heaven or earth.

Q. But doth not this Commandment directly require the seventh day from the Creation?

A. No, but the seventh day in general.

Q. But doth not the reason annexed (where the Lord is said in six days to make heaven and earth, and to rest the seventh, and therefore to hallow it), confirm so much?

A. No, not necessarily: for it doth not thence follow, that we should rest the same day the Lord rested, but that we should rest from our works the seventh day, as he rested from his: which seventh, as under the Law he appointed to be Saturday; so nothing hindreth, but that by his special appointment, under the Gospel, it may be Sunday, and yet the substance of the Commandment nothing altered.

Q. Why doth not the New Testament specially mention this change?

A. Because there was no question moved about the same, in the Apostles times.</p></blockquote>

<blockquote><p>Thirdly the difficulty of reclaiming the Country people on the Sundays either from the Sports or from their Work. The Synod beginning to consider of means to cut off these abuses, Festus Hommius amongst other things complained, that through the negligence of the Remonstrants it came that Catechizing was so much decayed; which words of his, it is thought, will be an occasion of some choler, though for the present they passed uncontrolled. Many delivered their opinions how the forementioned hindrances of Afternoon Sermons and Catechizing might be removed.

First, by imploring the help of the States General, that it would please them by their authority to prohibit that ordinary profanation of the Sabbath by working or playing; secondly, by requiring the like help of the particular magistrate in every town and village; thirdly, by taking away those combinations; fourthly, by providing of sufficient school-masters in every village who should not only teach grammar, but instruct youths in the principles of religion; fifthly, that the pastors should not omit afternoon sermons by reason of the negligence of their auditors, but should perform them, though they brought to the church none but their own family, that the pastors and deacons and seniors [elders] should deal with their friends and acquaintance and bring them to church with them; sixthly, that if any pastor neglected to perform this duty, he should be subject to ecclesiastical censure; seventhly, that the deputies [delegates] of other nations should be requested to make overture of their customs in this behalf; lastly, that diligent inquiry should be made throughout all the Classes, whether catechizing and afternoon sermons were observed.</p></blockquote>

First, by imploring the help of the States General, that it would please them by their authority to prohibit that ordinary profanation of the Sabbath by working or playing; secondly, by requiring the like help of the particular magistrate in every town and village; thirdly, by taking away those combinations; fourthly, by providing of sufficient school-masters in every village who should not only teach grammar, but instruct youths in the principles of religion; fifthly, that the pastors should not omit afternoon sermons by reason of the negligence of their auditors, but should perform them, though they brought to the church none but their own family, that the pastors and deacons and seniors [elders] should deal with their friends and acquaintance and bring them to church with them; sixthly, that if any pastor neglected to perform this duty, he should be subject to ecclesiastical censure; seventhly, that the deputies [delegates] of other nations should be requested to make overture of their customs in this behalf; lastly, that diligent inquiry should be made throughout all the Classes, whether catechizing and afternoon sermons were observed.”

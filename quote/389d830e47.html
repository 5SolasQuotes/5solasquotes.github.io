<main class="wrap"><figure class="quote" id="q-389d830e47" data-kw="">
<blockquote><p>They who write on this subject with judgment and understanding, use to distinguish three sorts of modes of men’s actions that are found in religion, viz. circumstances, rites and ceremonies. Circumstances are modifications of actions, as time, place, person; or, a circumstance is any thing that accompanies an action which is not of its essence, but is used with it, relates to it, and is an accident, or adjunct of it: and it may be such, either with respect to the pysical or moral being of the action: Circumstances use to be sorted in these memorial verses: ‘Quis, quid, ubi, quibus auxiliis, cur, quomodo, quando.’ And ‘forma, figura, locus, tempus, stirps, patria, nomen.’ Circumstance is a word of larger extent than rite, and that than ceremony; a rite is the manner of going about any action (chiefly that which is public or solemn) confirmed by law or custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), section 12, p. 276</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e1d13a20e" data-kw="">
<blockquote><p>Let God be ‘praised in the dance with timbrel and harp,’ according to the usage of the Old-Testament church very early (Ex. 15:20), where we find God praised with timbrels and dances. Those who from this urge the use of [instrumental] music in religious worship must by the same rule introduce dancing, for they went together, as in David’s dancing before the ark, and Judg. 21:21. But, whereas many scriptures in the New Testament keep up singing as a gospel-ordinance, none provide for the keeping up of [instrumental] music and dancing; the gospel-canon for psalmody is to sing with the spirit and with the understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 149, verse 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-51d687d320" data-kw="">
<blockquote><p>‘Why then’ (say they) ‘have we cast out all the significant ceremonies of Popery?’ Not for their significancy barely, but for their weight and measure. They are not to them only as outward garnishments of worship, but as proper worship, efficacious and meritorious. Their number stifles devotion and fills it with shows without substance. A cup of water refreshes, but a whole well of water chokes. Yea, an hundred sermons weekly would not edify; they would eat out our conscience in our particular callings. Much more would an hundred ceremonies eat out the substance of our general callings, when a few may much refresh and profit, if judgment overpower fancy and affection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15, p. 207 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-9aa70974fb" data-kw="">
<blockquote><p>Sacred things applied to civil business do not therefore become civil, for who will say that prayer at the beginning of a Parliament is a civil act, though it were used in the Upper and Lower House, and applied to that civil meeting as it ought to be? And why then shall application of civil decency unto sacred buisiness make it alter the nature or name of it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (Amsterdam: Thorp, 1633), ch. 1, section 16, ‘Concerning an Argument Against our Ceremonies, out of 1 Cor. 14’, pp. 73-74</span></figcaption>

</figure><figure class="quote" id="q-bf71ee8906" data-kw="">
<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, pp. 46-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

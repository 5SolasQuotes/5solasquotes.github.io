<blockquote><p>David Scott argues that the establishment principle implies state maintained education and vice-versa. If you accept the validity of one, then you must accept the validity of the other. His point about Voluntaryism being linked to free-market capitalism is interesting and it is a connection that I have made myself. It is hoped that subsequent posts of extracts from the writings of objective historians will serve to further confirm Scott’s thesis:

Those opposed to a public provision for the maintenance of religious ordinances, have generally, if not unanimously, conceded the duty of a government to provide for the education of children by the establishment of common schools. So far, there is no ground of difference. But I confess an inability to reconcile the admission of the duty of the magistrate to provide a system of common school education at the public expense, and yet bitterly oppose a similar provision for the support of religion. If the former is right, the latter cannot be wrong.

Religion and education are so intrinsically connected in principle and aim, that they cannot consistently be distinguished in regard to the obligation of the government. It is right to do both; but inconsistent to admit the obligation in the one case, and deny it in the other. The public mind is, however, evidently undergoing a change on this subject, but I fear for the worse. As far as Romanists are concerned, opposition to the common school system is well understood by intelligent Protestants. But many of the latter seem disposed to put the education of the children and youth of the community on the same footing with that of religion. In fact their aim is to bring the one, as they had done the other, under the application of the voluntary or free trade system. Their consistency is portentous to the welfare of the commonwealth! The movement is backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The public support of religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Although some of Richard Sibbes’s comments in his book on Josiah’s Reformation lend too much weight to an Erastian position, nevertheless, he accurately distinguishes between the civil magistrate’s lawful authority circa sacra (concerning religious matters) and the church’s authority in sacris (in intrinsically sacred matters):

[A]s a chief right, the ordering of the matters of religion belongs to the care of the prince. But there are two things in religion: first, intrinsecal [sic], within the church, as to preach, administer the sacraments, and ordain ministers. These he ought not to do. But for those things that are without it, these belong to him. If any of those that are placed in church or commonwealth do not their duty, it is fitting for him to correct. He ought to set all a-going without, and to remove abuses, but not to meddle with the things within the church aforesaid, as to execute the same, but to oversee and govern their execution, and those persons whose proper office it is to execute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Josiah’s Reformation. Laid open in four sermons</cite>, (London, 1637) in Works of Richard Sibbes, ed. A. B. Grosart (1862-3; 7 vols, Edinburgh, 1983), vi, 88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-edb3caa851" data-kw="">
<blockquote><p>They [Papists] do not only say… that one born in an heretical country may deny his country, but that by heresy a man, nay, a king, is deprived of all his jurisdiction, whether natural, civil or politic… One of their own bishops says, “As soon as a Christian king becomes heretical, forthwith the people are freed from subjection.” A cardinal says, “As long as the prince continues excommunicated (as he must do ever, if he be not a Romanist, for the Pope excommunicates ipso facto all heretics) the subject is freed from the oath of subjection,” but by whom? By the Pope, says a Jesuit, who upon just cause has power to absolve from oaths both himself, (as Gregory the 12th did when he sware that if he were chosen Pope he would give it over) and all others. If he be personally excommunicated, then, says their lawyer, subjects are freed from their allegiance and all his heretical assistants are to be rooted out, and their land to be exposed to be possessed of (strangers) Catholics. Nay, says another lawyer, if he be not excommunicated, yet if his heresy be publicly known, there needs no pronunciation of the sentence of excommunication, so that (says the Jesuit) subjects may lawfully deny him obediencer? How so? For the evidence of the crime, (says their whole school, and make it a matter of certainty and faith) does infer a sentence of condemnations because (as the more common opinion does define it) there must we understand the Pope’s will to have him excommunicated, whom upon the knowledge of his fault he would excommunicate. Nay, suppose that a Protestant prince have a just quarrel: yet, no war can be lawfully denounced or waged by the Queen (being excommunicated by name) though otherwise in itself it were most just: because her power is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, ch. 49, ‘Concerning Magistrates’, ‘What are the Assertions of Papists in this Point?’, p. 901-902</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-ac832da950" data-kw="">
<blockquote><p>For the first, we lay hold on all the arguments that prove the Word preached to be the only means of converting the soul, begetting of faith and that carnal weapons are not able, yea nor were they ever appointed of God to doing down strong holds, nor can they make a willing people: and Lactantius said well, ‘What is left to us, if another’s lust 〈◊〉 th•t by force, which we must do willingly?’ (Lactantius, Institutes, bk. 5, ch. 14) And that of Tertullian: ‘It is of the law or right of man and of his natural power what every man worships, what he thinks he should worship, nor does the religion of one either do good or do evil to another man, nor is it religion to compel religion, which ought to be received by will, not by force: since sacrifices (of worship) are required of a willing mind.’ (Tertullian ad Scapul••) In which I observe:

1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27.

2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London: R.I. for Andrew Crook, 1649), ch. 4, pp. 50-51</span></figcaption>

1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27.

2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.”

<blockquote><p>The second duty is obedience, to be performed by all persons, and in all things possible (the contrary whereof God commands not), though hard and unequal… and this obedience must be to all governors, to the king as superior, and to the rest appointed by him, and to these, whether Christian or heathen, good or bad, merciful or cruel, for there is no power but of God (Rom. 13:1). The third is piety, that subjects pray for their governors, yea though they were infidels, or wicked: Thus did Daniel, thus did the ancient Christians for the heathen emperors, for their long life and safety… … Use 2. Hence it appears that the Pope with his limbs are the great rebels of the world; for not only pulling their necks as ecclesiastical persons from the yoke of the emperor and their sons’ reigns, but especially for seeking to overrule, depose and destroy the kings and kingdoms of the earth. Use 3. Learn they duty. Thy calling is to be subject… Pay all subsidies, tares, customs, etc…. and surely, if we must willingly pay to a heathen, much more to a Christian, religious, merciful, and renowned king.</p></blockquote>

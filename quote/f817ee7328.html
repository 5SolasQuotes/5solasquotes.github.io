<blockquote><p>But here appeareth a manifest reason why they gave particular commandment concerning things offered to idols, blood, and that which was strangled. They were, indeed, of themselves things indifferent; yet such as had some special thing in them more than other rites of the law. We know how straitly the Lord commandeth to eschew those things which are contrary to the external profession of faith, and wherein there is any appearance or suspicion of idolatry. Therefore, lest there should any blot of superstition remain in the Gentiles, and lest the Jews should see anything in them which did not agree with the pure worship of God, no marvel if, to avoid offense, they be commanded to abstain from things offered to idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts 15</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse, wherein is Proved that Prelatical Jurisdiction is Not of Divine Institution, but forbidden by Christ Himself (1640), ch. 7. Prynne was a prominent Erastian.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-c8c44b1c87" data-kw="">
<blockquote><p>Secondly: neither is there any contradiction in these words, of themselves: for to know which are the canonical books may be held to be a substantial point and belonging to the faith, and yet not simply necessary to salvation: he knows little if he cannot distinguish between a simple and absolute necessity, and a necessity not absolute: as some things are absolutely necessary to salvation without the which a man cannot be saved: as Heb. 10:36… But in another sense the apostles write, Acts 15:28, “It seemed good, etc. to lay no more burden upon you than these necessary things”: yet was it not simply necessary to abstain from blood and things strangled, but convenient and profitable for that time because of offence: so to know which books are canonical, though it be not simply necessary to salvation, if a man hold the foundation: yet is it necessary, as a profitable mean for the increase of faith: and though it be not so substantial as the foundation of faith, yet is it substantial, as many necessary parts in an house are beside the foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Retection, or Discovery of a False Detection Containing a True Defence of Two Books, entitled, Synopsis Papismi, and Tetrastylon Papisticum (1603)</cite>, pp. 70-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-8980e17339" data-kw="">
<blockquote><p>Question 16: What if a man or wife know that the other in hatred does really intend by poison or other murder, to take away their life? May they not depart? Answer: They may not do it upon a groundless or rash surmise, nor upon a danger which by other lawful means may be avoided (as by vigilancy, or the magistrate, or especially by love and duty). But in plain danger, which is not otherwise like[ly] to be avoided, I doubt not, but it may be done and ought. For it is a duty to preserve our own lives as well as our neighbours: And when marriage is contracted for mutual help, it is naturally implied that they shall have no power to deprive one another of life (however some barbarous nations have given men power of the lives of their wives). And killing is the grossest kind of desertion, and a greater injury and violation of the marriage-covenant than adultery, and may be prevented by avoiding the murderer’s presence, if that way be necessary. None of the ends of marriage can be attained where the hatred is so great.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’</cite>, p. 538</span></figcaption>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7fe5663de2" data-kw="">
<blockquote><p>I wonder [in response to an opponent] more in what capacity the magistrate can have to do with commanding and governing men, if not as they converse morally with men, and in their families, as fathers and sons, as masters and servants, and as Christians who both in private and public may perform duties to one another, or oppress one another; else the judge could not punish the rebellious son, the wicked servant, or the murdering father and the oppressing master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline penned by Mr. Thomas Hooker… (London, 1658), bk. 4, ch. 12</cite>, p. 488</span></figcaption>

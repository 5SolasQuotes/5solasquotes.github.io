<main class="wrap"><figure class="quote" id="q-6508f8c201" data-kw="">
<blockquote><p>And here consider, if we look upon the Moral Law in that notion as it was given to Adam in Paradise, I mean as it was a Covenant of Works, or as the Covenant thereof was Works; so that whosoever would receive life and salvation, must perform perfect obedience to the same, according as it is written, He that doth these things shall live in them. And again, Moses describes the righteousness which is of the Law, That the man which doth these things shall live by them: in this sense as it was given to Adam in Paradise to justify or save men, the Doctrine of Faith doth make void the Moral Law.

I will not stand disputing, whether the Law, as given by Moses, could have given life and righteousness; or whether God did primarily intend in publishing this Law by Moses on Mount Sinai, to send man to fetch his life out of the Law; this we know, that whatever strength there is in the Law ex se. Yet by reason of sin it is weakened, and it is impossible that life and salvation should come to man by it, as the case now stands: it was long since concluded. That by the Works of the Law, there shall no flesh be justified in his sight. And Paul confesseth, We are become dead to the Law by the body of Christ: And again, I through the Law am dead to the Law: We constantly teach, That every Christian by the Gospel, is freed from expecting life by any obedience to the Law.

Again, if we look upon the Moral Law in its execration, and as it is enabled with a power to curse men to hell for their sins; I say, as it is a sentencing, killing, and death-ministring Letter, the Gospel hath made it void unto believers; it hath no power to fasten the curse of heaven upon the person of any believer; though all their sins are cursed sins, even such as deserve the grand curses of the Law, yet no curse for sin can come from the Law upon them; the curse of the Law seized on Christ to the utmost, that the blessing might befall them: Further, if we shall look upon the Law in its strictness and rigour, as it hath a power to challenge and exact a punctual and personal obedience to it self, without which, it allows no man favour with God, or life from God, then it is also made void by the Doctrine of Faith, the right and strictness of the Law is fulfilled in us by our surety, its not expected that it should be fulfilled by us in our own persons.

Besides, if we shall consider the Moral Law in its coactive or coercive power, as it doth by fears and terrors wrought in the conscience, urge and constrain an obedience to it self, making men and women servile and slavish in all acts of duty; thus is it made void to beleevers under the Gospel: I do not conceive that the Spirit of bondage, or the Spirit of fear, or the Spirit of unwillingness, lays so upon a believer, that he must be forced to do required service; nay, rather he is a Law unto himself, willingly performing what is right and required, Luke 1. 74. Rom. 8. 15. 1 Tim. 1. 9. 2 Tim. 1. 7. 1 Joh. 5. 3. For this is the Love of God, that we keep his Commandments; and his Commandments are not grievous. To conclude, if we shall consider the Law Moral in its irritation, as it hath in it an accidental or occasional secret sin-provoking, enraging, or exasperating power, whereby it stirs up in men an earnestness to the commission of sin; thus is it made void to the believer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sedgwick.html">John Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antinomianism Anatomized. Or, A Glass for the Lawless: Who deny the Ruling use of the Moral Law unto Christians under the Gospel</cite>, (London: Samuel Gellibrand, 1643), pp 9-10.</span></figcaption>

<blockquote><p>I am Jehovah.” This name expresses, fundamentally, self-existence, and therefore conveys the idea that he to whom it belongs is the author of all finite being. The people to whom the law is given are hereby reminded that they are the creatures of God, living, moving, having their being in him, and that this absolute physical dependence involves an absolute moral dependence also.

This name serves to show that this law was not given to the Hebrews, as Hebrews, but as men, and, consequently, that it belongs not to those elements of the Mosaic institute which are provisional and temporary, but to those which are permanent and eternal. The sum of this law is love; and love to God is absolutely essential to the perfection and happiness of men. The law has been dispensed under many different forms, but in its essence it is as immutable as the nature of God and the relation of creature to creator.</p></blockquote>

</figure><figure class="quote" id="q-09eadf03f7" data-kw="">
<blockquote><p>Therefore Paul separates the spiritual people of the new covenant from the Law when he says that this people is not the child of Hagar, who had a husband, but of Sarah, the free woman, who does not know the Law. In this way he sets the people of faith far above and beyond the Law. But if it is above and beyond the Law, then it is justified, not by the Law and works but solely by its spiritual birth, that is, by faith. For spiritual birth is nothing other than faith. Now just as the people of grace neither has the Law nor can have it, so the people of the Law neither has grace nor can have it; for it is impossible for Law and grace to exist together. Either we must be justified by faith and lose the righteousness of the Law, or we must be justified by the Law and lose grace and the righteousness of faith. It is a bitter and tragic loss when we keep the Law and lose grace. On the other hand, it is a fortunate and saving loss when we keep grace and lose the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 445.</span></figcaption>

<blockquote><p>Just as Abraham, when God allied Himself with him, was obligated to ‘walk before his face’, so Israel as a people was similarly admonished by God’s covenant to a new obedience. The entire law, which the covenant of grace at Mount Sinai took into its service, is intended to prompt Israel as a people to ‘walk’ in the way of the covenant. It is but an explication of the one statement to Abraham: ‘Walk before me, and be blameless [Gen. 17:1], and therefore no more a cancellation of the covenant of grace and the foundation of a covenant of works than this word spoken to Abraham. The law of Moses, accordingly, is not antithetical to grace but subservient to it and was also thus understood and praised in every age by Israel’s pious men and women. But detached from the covenant of grace, it indeed became a letter that kills, a ministry of condemnation. Another reason why in the time of the Old Testament the covenant of grace took the law into its service was that it might arouse the consciousness of sin, increase the felt need for salvation, and reinforce the expectation of an even richer revelation of God’s grace. It is from that perspective that Paul views especially the Old Testament dispensation of the covenant of grace. He writes that Israel as a minor, placed under the care of the law, had to be led to Christ (Rom. 10:4; Gal. 3:23f.; 4:1f.) and that in that connection sin would be increased and the uselessness of works for justification and the necessity of faith would be understood (Rom. 4:15; 5:20; 7:7f.; 8:3; Gal. 3:19). On the one hand, therefore, the law was subservient to the covenant of grace; it was not a covenant of works in disguise and did not intend that humans would obtain justification by their own works. On the other hand, its purpose was to lay the groundwork for a higher and better dispensation of that same covenant of grace to come in the fullness of time. The impossibility of keeping the Sinaitic covenant and of meeting the demands of the law made another and better dispensation of the covenant of grace necessary.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Just as Abraham, when God allied Himself with him, was obligated to ‘walk before his face’, so Israel as a people was similarly admonished by God’s covenant to a new obedience. The entire law, which the covenant of grace at Mount Sinai took into its service, is intended to prompt Israel as a people to ‘walk’ in the way of the covenant. It is but an explication of the one statement to Abraham: ‘Walk before me, and be blameless [Gen. 17:1], and therefore no more a cancellation of the covenant of grace and the foundation of a covenant of works than this word spoken to Abraham. The law of Moses, accordingly, is not antithetical to grace but subservient to it and was also thus understood and praised in every age by Israel’s pious men and women. But detached from the covenant of grace, it indeed became a letter that kills, a ministry of condemnation. Another reason why in the time of the Old Testament the covenant of grace took the law into its service was that it might arouse the consciousness of sin, increase the felt need for salvation, and reinforce the expectation of an even richer revelation of God’s grace. It is from that perspective that Paul views especially the Old Testament dispensation of the covenant of grace. He writes that Israel as a minor, placed under the care of the law, had to be led to Christ (Rom. 10:4; Gal. 3:23f.; 4:1f.) and that in that connection sin would be increased and the uselessness of works for justification and the necessity of faith would be understood (Rom. 4:15; 5:20; 7:7f.; 8:3; Gal. 3:19). On the one hand, therefore, the law was subservient to the covenant of grace; it was not a covenant of works in disguise and did not intend that humans would obtain justification by their own works. On the other hand, its purpose was to lay the groundwork for a higher and better dispensation of that same covenant of grace to come in the fullness of time. The impossibility of keeping the Sinaitic covenant and of meeting the demands of the law made another and better dispensation of the covenant of grace necessary.”

— Herman Bavinck, Reformed Dogmatics: God and Creation, vol. 3, pt. 2, ch. 5, ‘The Covenant in Old Testament Salvation History’, p. 222">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJust+as+Abraham%2C+when+God+allied+Himself+with+him%2C+was+obligated+to+%E2%80%98walk+before+his+face%E2%80%99%2C+so+Israel+as+a+people+was+similarly+admonished+by+God%E2%80%99s+covenant+to+a+new+obedience.+The+entire+law%2C+which+the+covenant+of+grace+at+Mount+Sinai+took+into+its+service%2C+is+intended+to+prompt+Israel+as+a+people+to+%E2%80%98walk%E2%80%99+in+the+way+of+the+covenant.+It+is+but+an+explication+of+the+one+statement+to+Abraham%3A+%E2%80%98Walk+before+me%2C+and+be+blameless+%5BGen.+17%3A1%5D%2C+and+therefore+no+more+a+cancellation+of+the+covenant+of+grace+and+the+foundation+of+a+covenant+of+works+than+this+word+spoken+to+Abraham.+The+law+of+Moses%2C+accordingly%2C+is+not+antithetical+to+grace+but+subservient+to+it+and+was+also+thus+understood+and+praised+in+every+age+by+Israel%E2%80%99s+pious+men+and+women.+But+detached+from+the+covenant+of+grace%2C+it+indeed+became+a+letter+that+kills%2C+a+ministry+of+condemnation.+Another+reason+why+in+the+time+of+the+Old+Testament+the+covenant+of+grace+took+the+law+into+its+service+was+that+it+might+arouse+the+consciousness+of+sin%2C+increase+the+felt+need+for+salvation%2C+and+reinforce+the+expectation+of+an+even+richer+revelation+of+God%E2%80%99s+grace.+It+is+from+that+perspective+that+Paul+views+especially+the+Old+Testament+dispensation+of+the+covenant+of+grace.+He+writes+that+Israel+as+a+minor%2C+placed+under+the+care+of+the+law%2C+had+to+be+led+to+Christ+%28Rom.+10%3A4%3B+Gal.+3%3A23f.%3B+4%3A1f.%29+and+that+in+that+connection+sin+would+be+increased+and+the+uselessness+of+works+for+justification+and+the+necessity+of+faith+would+be+understood+%28Rom.+4%3A15%3B+5%3A20%3B+7%3A7f.%3B+8%3A3%3B+Gal.+3%3A19%29.+On+the+one+hand%2C+therefore%2C+the+law+was+subservient+to+the+covenant+of+grace%3B+it+was+not+a+covenant+of+works+in+disguise+and+did+not+intend+that+humans+would+obtain+justification+by+their+own+works.+On+the+other+hand%2C+its+purpose+was+to+lay+the+groundwork+for+a+higher+and+better+dispensation+of+that+same+covenant+of+grace+to+come+in+the+fullness+of+time.+The+impossibility+of+keeping+the+Sinaitic+covenant+and+of+meeting+the+demands+of+the+law+made+another+and+better+dispensation+of+the+covenant+of+grace+necessary.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+vol.+3%2C+pt.+2%2C+ch.+5%2C+%E2%80%98The+Covenant+in+Old+Testament+Salvation+History%E2%80%99%2C+p.+222&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc30af86216.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c30af86216.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/#:~:text=Just%20as%20Abraham%2C%20when%20God%20allied,of%20the%20covenant%20of%20grace%20necessary&amp;text=Just%20as%20Abraham%2C%20when%20God%20allied%20Himself%20with&amp;text=better%20dispensation%20of%20the%20covenant%20of%20grace%20necessary" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-2d11376a04" data-kw="">
<blockquote><p>Union in the Church of Christ is a thing which ought to be highly prized by us. For so much was it prized by Christ, that He gave his own life to procure it, and did beat down all his own ordinances which stood in the way of it: ‘He even abolished in his flesh the Law of commandments contained in ordinances, for to make of twain one new man.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58630b2678" data-kw="">
<blockquote><p>Upon the Sabbath, [the 15th] when we were convened in the muir to hear sermon, they called a council of war and called the whole ministers, and told them, if they did not preach, name and sir-name, against the indulgence, they should preach none. They [the ministers] thought it very hard to be kept within guard, and to be commanded what to preach. They told them, they were to receive their commission from Jesus Christ what to preach, and not from them. When we heard of it, we came [to the council meeting] — for they never called us if we came not of ourselves. We told them that it was the height of supremacy to give instructions to ministers what to preach; we would hear no such doctrine. With this confusion this day was well spent, and when they saw us own them (the ministers) and that they could not prevail, they slipped their way; and so they went and preached, and every man went to hear him whom they liked best. At this debate there was one minister left us, and never returned again [to the camp], but was a-coming upon the Monday when we were broken; for he declared to me, when he was let out without the guard, that he thought they were set to take their lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., p. 466</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

lasquotes.github.io%2Fquote%2F58630b2678.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58630b2678.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-covenanter-robert-hamilton-d-1701-leading-father-of-the-united-societies-later-reformed-presbyterians/#:~:text=Upon%20the%20Sabbath%2C%20%5Bthe%2015th%5D%20when,were%20set%20to%20take%20their%20lives&amp;text=Upon%20the%20Sabbath%2C%20%5Bthe%2015th%5D%20when%20we%20were&amp;text=thought%20they%20were%20set%20to%20take%20their%20lives" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-a3129fa969" data-kw="">
<blockquote><p>Yea and the injunctions and statutes do permit and give leave to speak against all abuses in all things (but with these exceptions), that we speak not reproachfully, willfully and obstinately, but in humility as we ought, and as being under correction and judgment of magistrates if we speak amiss; read the statute and you shall find such like words; yea and experience will teach you that of late and also long ago both at Paul’s Cross and in the Court some preachers have boldly condemned abuses in the state, and speaking under correction of the magistrate, have not only been suffered but commended of the Queen Majesty herself.</p></blockquote>

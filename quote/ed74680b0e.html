<main class="wrap"><figure class="quote" id="q-ed74680b0e" data-kw="">
<blockquote><p>This is the great secret of their religion, the original spring that sets all their endeavors in motion. They are a covenanted people, i.e. linked and confederated together to advance and propagate their faction and discipline, which they upon all occasions blasphemously call the kingdom of Jesus Christ. … …they confine the name of the godly only to themselves, as Papists do the name of catholic to them: And I have heard some of them say that it was not possible the power of godliness should prevail but under presbytery: If it be so, the world is much mistaken…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-monro.html">Alexander Monro</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterian Inquisition, as it was lately Practiced against the Professors of the College of Edinburgh, August &amp; September</cite>, 1690… (London: Hindmarsh, 1691), pp. 14-15 Monro was an episcopalian.</span></figcaption>

</figure><figure class="quote" id="q-e9b601c8d0" data-kw="">
<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

%20%5Bm%5D%20Micah%206%3A8&amp;text=The%20duties%20required%20in%20the%20first%20commandment%20are&amp;text=l%5D%20Jer.%2031%3A18.%20Ps.%20119%3A136.%20%5Bm%5D%20Micah%206%3A8" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1ee1a05ede" data-kw="">
<blockquote><p>Christ Jesus has so far forth set down and stablished a perfect platform of Church-government in all morals, not only both for the inward, but also for the outward and external government of his House, that He has left no liberty or latitude to magistrates or Churches whatsoever to choose and settle such an orderly form of Church-government or discipline, as is most suitable to their particular civil-government, laws, manners and customs, so this form be not repugnant to the Word of God.</p></blockquote>

</figure><figure class="quote" id="q-beaf4df64b" data-kw="">
<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>

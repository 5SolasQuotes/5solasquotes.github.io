<main class="wrap"><figure class="quote" id="q-d403a142c2" data-kw="">
<blockquote><p>The Word is that through which the Holy Spirit commences and confirms faith in us, and for this reason, should go before the sacraments. The sacraments are means through which the Holy Spirit confirms faith already called into exercise, and for this reason ought to follow the Word. The reason of this difference is that the sacraments do not exert any influence unless they be understood. There is no desire for that which is unknown. There must, therefore, necessarily be some explanation of the sacraments out of the Word before they are observed. The case is different, however, in regard to the infants of the church: for in them the Holy Spirit neither begins, nor confirms faith by means of the Word; but by an inward working; and that because they are also included in the covenant and promise of God, being born in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism, following his commentary on Q&amp;A #7</cite>, 352 (on Heidelberg 67)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82f50666e6" data-kw="">
<blockquote><p>It is by means of the gospel that the Holy Spirit continues to apply Christ, with His righteousness and fullness, to the hearts of believers for increasing their sanctification and consolation. They are said in Scripture to be sanctified “through thy truth” (John 17:17–19), to be clean through the word that Christ has spoken to them (John 15:3), and to have their hearts purified by faith (Acts 15:9). The apostle Paul presented this prayer for the saints at Ephesus: “That Christ may dwell in your hearts by faith…that ye might be filled with all the fulness of God” (Eph. 3:17, 19). And he informed them that they were “built upon the foundation of the apostles and prophets” (Eph. 2:20). It is in proportion, then, as the saints are enabled to believe with application to themselves the offers and promises of the gospel and to trust in Jesus Christ for salvation that they advance in holiness and comfort. And it is “in the unity of the faith, and of the knowledge of the Son of God” that they all come “unto a perfect man, unto the measure of the stature of the fullness of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 110-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-18a8af8811" data-kw="">
<blockquote><p>No amount of mere external evidence can produce genuine faith. The Israelites, who had seen a long succession of wonders in the land of Egypt, who had passed through the divided waters of the Red Sea, who were daily receiving by miracle food from heaven, who had trembled at the manifestations of the Divine majesty on Mount Sinai, within sight of that mountain made a golden calf their god. The men who saw the miracles of Christ performed almost daily in their presence, cried out, ‘Crucify him! Crucify him!’ Hence our Saviour said, that those who hear not ‘Moses and the prophets, neither will they be persuaded, though one rose from the dead.’ We may confidently conclude, therefore, that those who now believe not the gospel, would not be persuaded had they seen all the miracles which Christ performed. It is important that the attention of the doubting should be directed to the fact, that their want of faith is to be attributed to their own moral state, and not to any deficiency in the evidence of the truth. ‘If the gospel be hid,’ says the apostle, ‘it is hid to them that are lost: in whom the god of this world hath blinded the minds of them which believe not, lest the light of the glorious gospel of Christ, who is the image of God, should shine unto them’ (2 Cor. 4:3, 4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Way of Life</cite>, (East Peoria: Banner of Truth, repr. 2020), 2–3.</span></figcaption>

</figure><figure class="quote" id="q-ab89a2523d" data-kw="">
<blockquote><p>Those who so cry up the Spirit as to cry down ordinances and the ministry do not have the Spirit of God. In the NT, when vision and inspiration were in use, the Spirit did not teach men immediately, but referred them to an outward ministry. A famous instance you have hereof in the Ethiopian eunuch who, reading in his chariot the prophecy of Isaiah, the Spirit did not interpret to him the meaning hereof but bid Philip go and expound it. So, when Christ revealed himself to Paul, He did not teach him Himself, but bid him go to Damascus and there it should be told him what he should do. We have the like example in Cornelius. The Spirit did not teach him immediate, but bid him send for Peter, and he should tell him what he ought to do. By these examples we see how the Lord has honored the ministry. And, therefore, those who cry up the Spirit so as to cry down the ministry, as expecting to have the immediate teaching of the Spirit, doubtless have not the Spirit of God. . . . Those who pretend to the Spirit, and yet boast of the effects of the Spirit, in future revelations rather than in present motions to holy duties, are deceived by a satanic delusion. There are many in these days who will take upon them to tell you future contingent events, but this can be nothing else but a delusion of the devil, because the gifts of the Spirit in foretelling future events is now ceased and does not remain the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The works of Christoper Love</cite>, 1, 115-116.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-d88e972086" data-kw="eternal procession Filioque">

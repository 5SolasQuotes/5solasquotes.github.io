<main class="wrap"><figure class="quote" id="q-372d8141f2" data-kw="">
<blockquote><p>But as for those doctrines which treat of the eternal decrees of God, which set out the particular objects of predestination, and explain how the two natures are united in the Person of Jesus Christ, which unfold the mystery of the Trinity, and describe how the Holy Spirit acts upon the hearts of the faithful, and other points of the like abstruse nature, I will maintain that though learned men may say a great many fine things upon these subjects, which may appear very agreeable to reason, yet are they not to be weighed in the same balance with those truths which are clearly revealed in the Word of God. And therefore we ought only so far to assent to them, as to be ready to give them up, and renounce them whenever it appears, and is plainly proved, that they are false; for otherwise we lay a foundation for division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-d-huisseau.html">Isaac D’Huisseau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Re-Union of Christians: or, The Means to Re-Unite All Christians in One Confession of Faith (1670; London : Henry Mortlock, 1708) 148 pp. ToC | D’Huisseau says on</cite>, p. 110:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05d2f61e81" data-kw="">
<blockquote><p>38. Although therefore in some assembly, either in doctrine, or in the administration of the sacraments, the worship of God, and morals, some vice may creep in, nevertheless the assembly does not cease to be in the Church of God, as long as it retains the foundation, which is Christ. Just as Paul does not take away the name of the Church of God from the Corinthians and Galatians, even though false doctrines had begun to be spread among them, and some lived dissolutely. Nor is the Church to be denied immediately because of the neglect or cessation of ecclesiastical discipline.</p></blockquote>

</figure><figure class="quote" id="q-036ad76265" data-kw="">
<blockquote><p>Although in matters fundamental there is no fear that godly able men wil err, yet let charity be stretched to the full latitude of it, and reverence of men in place raised to the uttermost height; yet if they will meddle with such things as are doubtful and controversal amongst godly and peaceable men, and force them upon others, that confidence of theirs that shall put them out of fear of erring, shall be to me a ground of great fear that they will err.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened… (London: Robert Davvlman, 1653)</cite>, ch. 9; p. 65</span></figcaption>

<blockquote><p>On the Reformed side, the concept of fundamental articles appears as early as 1593 in the irenic or ecumenical theology of Francis Junius–as a response to the question of agreement between the Reformed side and the Lutherans despite significant theological differences: Junius argued that the ‘fundamentals’ or ‘fundamental articles’ are those teachings without which the Christian faith cannot be present–among which is the doctrine of God, the immutable object of faith. (Eirenicum, I, Opuscula, p. 440)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0fe9d8c161" data-kw="">
<blockquote><p>We have already said that James does not speak here of the cause of justification, or of the manner how men obtain righteousness, and this is plain to every one; but that his object was only to shew that good works are always connected with faith; and, therefore, since he declares that Abraham was justified by works, he is speaking of the proof he gave of his justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, James 2:21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/justified-before-god-and-before-men.html">Justified before God and before men</a></span><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/romans-and-james-reconciled.html">Romans and James reconciled</a></span></div>

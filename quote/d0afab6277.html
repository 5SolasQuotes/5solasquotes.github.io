<main class="wrap"><figure class="quote" id="q-d0afab6277" data-kw="">
<blockquote><p>Christ took the seed of Abraham, he took it not of Angels

So that be became like to his brethren in all things

Sin only except, thus plainly Paul tells,

Where came he by this flesh, which amongst us he brings?

Had he feathers as well as flesh, and came down with wings?

Christ came to be a mediator, it was requisite that he

Should be partaker of the godhead, and of our humanity.

Christ preached the word, and sowed forth good seeds,

The Apostles travailed, and took great pains,

But Beelzebub bestirred him, and up came the weeds

Which shortly spring up in fantastical brains.

Such Devilish deceivers the Devil entertains.

Many entered in John’s time which would not confess:

That our Saviour Jesus Christ was come in the flesh.

It seemed most meet to God’s high providence

And also most necessary for our redemption,

That where the first man in our nature committed disobedience.

The second Man Christ should make satisfaction.

Repair and recompense in the same nature and parson

And pay the pain of sin this was not omitted

In the flesh of man wherein it was committed.</p></blockquote>

</figure><figure class="quote" id="q-a6d6a91339" data-kw="">
<blockquote><p>III. The law of the decalogue or ten commandments is a declaration of the law of nature and a picture of the image of God.

We also believe that this law is a declaration of the law of nature, which was written in the hearts of the first men perfectly, of others imperfectly and but in part, and therefore by this law is condemned whatsoever is not agreeable to that image of God, whereunto man was created, and is commanded whatsoever is agreeable to the same.

For God would shew by that law what man was in his first estate and what he was made in the second estate and what manner one he ought to be and further what he should afterwards be in the third estate in part, and what perfectly in the fourth by Christ. So that the law is nothing else but a true and lively picture of the image of God, to which man was created, whereby we are instructed what we were, what we are, what we ought to be and indeed what we shall be, if we trust in Christ.</p></blockquote>

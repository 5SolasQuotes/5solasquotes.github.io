<main class="wrap"><figure class="quote" id="q-b785edd7ad" data-kw="">
<blockquote><p>My Dove that Dwells in the Holes of the Rock; We need not to go far off to seek the Exposition of these Words, for CHRIST is the Rock upon which the Kirk is builded. Matthew 16. 28. Upon this Rock will I Build my Church, says CHRIST. And Psalms 18. 2. The LORD is my Rock and Fortress. And GOD is also the Secret Place of the Stairs, where the Kirk hides her from the Storm. So David calls GOD his Secret Place, his Hiding Place. Psalms 32. 7. Thou art a Secret Place to me from Distress, Thou wilt Preserve me, Psalms 91.

And because in all this Song we must ever hold up the Line and String of the Allegory of Marriage, and consider the Kirk as the Spouse of CHRIST: The Rock is CHRIST in whom the Kirk dwells by Faith, and CHRIST dwells in her Heart, Ephesians 3. 17. Abide in Me, and I in you John 15. 4: Abide in Me as Branches Imped into the Vine: Now the Imp is ingrafted in a cutted Stock; CHRIST was Hagged, Hewed and Cutted on the Cross, the Stock wherein we are Ingrafted.

So that the Holes of the Rock, may well be exponed (as Bernard says) to be the Wounds of CHRIST: So that the Meaning is, O O My Dove that by Faith has thy abode in the Wounds and the Holes made in the Hands and Sides of Crucified JESUS: Or, O my Dove that believes and that by Faith has thy abode in the Wounds and abides in CHRIST as an Imp ingrafted in a Tree, in CHRIST when Dead; and so Man flee into CHRIST all Wounded, and Holled for thy Sin, flee into CHRIST thy Rock; and so into GOD: Psalms 18. 2.

Hence we see what a Saviour the Kirk believes in; a Saviour that’s GOD and Man, as Man to be a Sufferer, and as GOD to be a Supporter, which there was great Necessity of these Two Natures; GOD would not seek Payment of our Debt off His Son as GOD; for by the Law He could not answer, for He was the Creditor, and so could not be the Debtor: And therefore, for the better Understanding of this, I would have you with me to consider, how our Nature, and GOD’s Nature works to others hands in the Work of our Redemption. A Sinner cannot Dwell in CHRIST as GOD only.

There is no Holes nor Chambers for a Sinner to Dwell in GOD; and therefore CHRIST behoved to be Man, that we might find fair Chambers in the Wounds of JESUS, wherein the Doves of JESUS might Dwell; And if He had been only Man, He could not have been an House upon a Rock, and so could not have born the Weight of all the Doves: For there be some Questions in the Work of our Redemption that only Man can answer. Man has sinned, and Man must Die, says GOD’s Justice, be it so says CHRIST. Man sinned, and I the Man CHRIST shall Die. (2.) Man took on the Debt, therefore an other cannot pay for him; Be it so says CHRIST, I the Man shall pay the Ransom. (3.) Man behoved to make amends, because Man did the Fault: Let it be so said CHRIST, I the Man CHRIST shall make amends again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ and the doves’ heavenly salutations, with their pleasant conference together: or A sermon before the communion in Anwoth. Anno 1630. By that flour of the Church, Mr. Samuel Rutherford</cite>, (n.p., [1660]), pp 5-6.</span></figcaption>

<blockquote><p>And for that gesture of stretching out and lifting up hands in prayer (see Ezra 9:5; Ps. 44:20 &amp; 63:4 &amp; 141:2; 1 Tim. 2.8, which was also the preacher of those who were in much sorrow, Jer. 4:31), it is an exercise of the body, witnessing much earnestness and resignation to God, as depending only upon Him. And so it implies that our whole man (even the outward man, whereof the hands are a part, as well as the inward) should be employed in prayer; that we should be fervent and earnest in prayer, not setting about it as a work in the by; that in prayer we should resign and give up ourselves to God, to be at his disposal, without murmuring or disputing; and that we should have all out hope and expectation fixed upon Him in our prayers.</p></blockquote>

<blockquote><p>Tilen sets out the expediency of holy-days for imprinting in the minds of people the sense and knowledge of the benefits of redemption. Answer:

1. There is no mean so good for this purpose as catechizing and preaching, out of season and in season.

2. What could he say unto them who have attained his end without his mean? I find people better instructed and made more sensible of those benefits where the feasts are not kept, than where they are.

3. Think they their people sufficiently instructed in the grounds of religion when they hear of the nativity, passion, etc. What course will they take for instructing them in other principles of faith? Why do they not keep one way, and institute a holy-day for every particular head of catechism? But Bishop Lindsey thinks yet to let us see a greater expediency for observing holy-days. Certainely says he, nothing is so powerful to abolish profaneness and to root out superstition of men’s hearts, as the exercise of divine worship in preaching, praying and thanksgiving, chiefly then when the superstitious conceits of merit and necessity are most pregnant in the heads of people, as doubtless they are when the set times of solemnities return; for then it is meet to lance the oposterne when it is ripe. Answer: This is a very bad cure and is not only to heal the wound of the people slightly [Jer. 6:14], but to make it the more inveterate and festered. I might object that little or nothing is preached or spoken by him and his companions at the revolution of those festivities against the superstitious keeping of them; but though they should speake as much as can be against this superstition, their lancing being in word only, and not in deed, the recidivation will prove worse than the disease. The best lancing of the oposterne were not to observe them at all, or to preach against them, which are tried to work this effect more powerfully than the bishop’s cure has done: for all know, that there is none so free of this superstition as those who observe not the holy-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 2, ‘Against those of our Opposites who plead for the Ceremonies as things Expedient’, pp. 13-14</span></figcaption>

ecidivation+will+prove+worse+than+the+disease.+The+best+lancing+of+the+oposterne+were+not+to+observe+them+at+all%2C+or+to+preach+against+them%2C+which+are+tried+to+work+this+effect+more+powerfully+than+the+bishop%E2%80%99s+cure+has+done%3A+for+all+know%2C+that+there+is+none+so+free+of+this+superstition+as+those+who+observe+not+the+holy-days.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+pt.+2%2C+ch.+2%2C+%E2%80%98Against+those+of+our+Opposites+who+plead+for+the+Ceremonies+as+things+Expedient%E2%80%99%2C+pp.+13-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa7ba0c7d85.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a7ba0c7d85.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christian-living/religious-holidays/#:~:text=Tilen%20sets%20out%20the%20expediency%20of,those%20who%20observe%20not%20the%20holy%2Ddays&amp;text=Tilen%20sets%20out%20the%20expediency%20of%20holy%2Ddays%20for&amp;text=superstition%20as%20those%20who%20observe%20not%20the%20holy%2Ddays" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>To worship is to give to anyone the honor due unto him: So the rendering unto God that love, that fear, that service, that honor which is due unto him is the worshipping of God, that’s the Scripture definition, Ps. 29:2, ‘Give unto the Lord the honor due unto his name;’ then follows by way of exposition, ‘Worship the Lord in the beauty of holiness,’ that is, in his holy Temple, in his beautiful sanctuary, or in the comely honor of his sanctuary. So that worship is the tendering of honor to the Lord, in a way honorable to Him, namely according to his own will and laws of worship: which is intimated by coming to worship Him in his beautiful sanctuary, where all things about the service of God were exactly prescribed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London [1643]), Job 1:13-14, pp. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-aba9d7468c" data-kw="">
<blockquote><p>In this sort may Christians honor the cross: for who makes any question but in our wars against the Jews or Mahumetists, we may bear our ensigns or arms crossed, for public testifying to the infidels that we are Christians, and our adversaries are miscreants and void of faith. So may the cross be engrave[n] on money to show that it is the coin or stamp of a Christian prince. So may the cross be placed on the gates of cities, castles or houses, to deliver apparently that the inhabitants in such places do make profession of Christianity. So was it long since ordained that the instruments of contracts or bargaining made by public notaries should be sealed and signed with the cross, as it is read in lib. de Cod. And in such like politic considerations, we reject not the use of the material cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise on the Virtue of the Cross &amp; the True Manner How to Honour It</cite>, (London, 1599), ‘How the Cross Ought to be Honored’, no page number. de La Faye (1540-1615) served with Theodore Beza in Geneva as a reformed professor of philosophy and theology.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

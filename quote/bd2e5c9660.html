<main class="wrap"><figure class="quote" id="q-bd2e5c9660" data-kw="">
<blockquote><p>CHAPTER 31: THE MEANS BY WHICH OBTAIN DIVINE BLESSING Let us cleave then to His blessing, and consider what are the means of possessing it. Let us think over the things which have taken place from the beginning. For what reason was our father Abraham blessed? Was it not because he wrought righteousness and truth through faith? Isaac, with perfect confidence, as if knowing what was to happen, cheerfully yielded himself as a sacrifice. Jacob, through reason of his brother, went forth with humility from his own land, and came to Laban and served him; and there was given to him the scepter of the twelve tribes of Israel. CH 32: WE ARE JUSTIFIED NOT BY OUR OWN WORKS, BUT BY FAITH Whosoever will candidly consider each particular, will recognize the greatness of the gifts which were given by him. For from him have sprung the priests and all the Levites who minister at the altar of God. From him also [was descended] our Lord Jesus Christ according to the flesh. From him [arose] kings, princes, and rulers of the race of Judah. Nor are his other tribes in small glory, inasmuch as God had promised, “Thy seed shall be as the stars of heaven.” All these, therefore, were highly honored, and made great, not for their own sake, or for their own works, or for the righteousness which they wrought, but through the operation of His will. And we, too, being called by His will in Christ Jesus, are not justified by ourselves, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but by that faith through which, from the beginning, Almighty God has justified all men; to whom be glory for ever and ever. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>c. 94–97AD</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a0c39a651" data-kw="">
<blockquote><p>Because we are justified solely because of the righteousness of Christ, our role in justification is not to obey but to have faith in Christ… When we seek to justify ourselves by human effort of any kind, we undermine the sufficiency of Christ’s atoning work. Only justification by faith alone preserves the honor and glory of what Jesus did on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-harvey.html">Jay Harvey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Don’t Call it a Comeback</cite>, p. 100</span></figcaption>

</figure><figure class="quote" id="q-6f6fc665e9" data-kw="">
<blockquote><p>The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>

— John Calvin, Institutes of the Christian Religion, 3.18.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20passages%20in%20which%20it%20is%20said%20that%20God%20will%20reward%20every%20man%20according%20to%20his%20works%20are%20easily%20disposed%20of.%20For%20that%20mode%20of%20expression%20indicates%20not%20the%20cause%20but%20the%20order%20of%20sequence.%20%E2%80%A6%20Hence%20it%20appears%2C%20that%20working%20is%20not%20at%20all%20opposed%20to%20grace%2C%20but%20refers%20to%20pursuit%2C%20and%2C%20therefore%2C%20it%20follows%20not%20that%20believers%20are%20the%20authors%20of%20their%20own%20salvation%2C%20or%20that%20it%20is%20the%20result%20of%20their%20works.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.18.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f6fc665e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f6fc665e9.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-35afe7c913" data-kw="">
<blockquote><p>Which [Scriptural phrases] all signify one thing: that is, his suffering in the flesh. For nowhere in the Scriptures of God is our righteousness particularly attributed to any other action of Christ. Neither can it be collected to consist in any other action, except out of the general word of ‘obedience’. Neither is there any necessity (if the matter be well weighed) to add anything to the sufferings of Christ in the matter of our righteousness. Yea moreover, it would appear by diverse grounds of the truth of God that nothing can or may be added thereunto in the matter of our righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Tending to Clear the Doctrine of Justification</cite>, ch. 24 in A Treatise tending to Clear the Doctrine of Justification (Middelburgh: Richard Schilders, 1616), pp. 93-110, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-8f093ce78a" data-kw="">
<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 13, n.p.</span></figcaption>

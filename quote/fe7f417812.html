<main class="wrap"><figure class="quote" id="q-fe7f417812" data-kw="">
<blockquote><p>Here we see the cause why Christ called Judas a Devil: for he said. Have I not chosen you twelve, and one of you is a devil. He became to be a devil and a traitor by nourishing a wicked and a covetous heart. And here we are taught that the ministers of the word, if they make no conscience of sin, by the just judgement of God do prove devils incarnate: this example of Judas doth manifest the same: and the reason is plain, for the more knowledge a man hath, the more wicked he is if he want grace. They are like in this case unto a man that hath meat and drink enough, but no stomach to digest meat: whereby the more he eateth, the more it turneth to his hurt.

This I speak not to deface the callings of ministers; but that those which preach God’s word, should not do it with impenitent hearts, living in their own sins. For it is a fearful thing for a man to speak unto the people of the pardon of their sin, and yet himself not to apprehend the same by faith. A lump of wax if you keep it from heat, or from the fire it keeps his own form still, but if it be held to the fire, it melts and runs abroad: so ministers who by reason of their callings come near God, if they be lumps of iniquity and live in their sins, they shall find that the corruptions of their hearts will melt abroad as wax at the fire. And therefore every one that is designed to this calling, must first purge himself of his own sins, or else God’s judgements shall fall upon him, as they did on Judas that betrayed Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 307.</span></figcaption>

<blockquote><p>4. It is from the unsuitableness that is betwixt the things of Christ and the temper of a sinner. Christ’s yoke does no way fit a carnal heart… It is the base love of this present world that makes the call of the Gospel so unsuccessful and ineffectual; you may see it in that parable, Mt. 22:5: They make light of the tenders of Christ, and what is the reason? why the farm and the oxen, and the merchandise were in the case; these must not be left for Christ where lust has the casting voice. O how sad is this! if Christ should offer you riches and honors, you would come; and yet for heaven and glory you will not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good of Early Obedience</cite>, ... (London: Ponder, 1683), ch. 10, pp. 264-65</span></figcaption>

</figure><figure class="quote" id="q-2cd55e2e8e" data-kw="">
<blockquote><p>Mark further, the end of the law is conviction. And the end of our conviction is that the promise of mercy may be given to them that believe. Here is notable comfort, with encouragement to all good duties. Does the law as it were in the name of God arrest you? Does it accuse and convince you of manifold sins? Does it arraign you at the bar of God’s judgment, and fill your soul with terror? Do you by the testimonies of the law and your own conscience see and feel yourself to be a most miserable and wretched sinner? Well. It may be you think that all this is a preparation to your damnation, but it is not. For it is contrariwise a preparation to your salvation. For the law with a loud voice in your heart proclaims you a sinner and threatens you with perdition, but the end of all this is that Jesus Christ may become a savior unto you, so be it you will come unto Him and believe in Him. For He saves no sheep but “the lost sheep,” and “He calls not just men, but sinners to repentance.” Let us therefore with all our hearts come unto Christ and believe in Him, and that by the faith of Christ, that is, with a faith joined with hope, love, and new obedience. Then shall the promise of pardon and life everlasting be given to us. Upon this ground, persons in despair and grievous offenders may see a plain way to help and succor themselves. For the work of the law concluding us under sin, by the mercy of God, tends to our salvation if we will use the good means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 201–02.</span></figcaption>

</figure><figure class="quote" id="q-e424c5b52a" data-kw="">
<blockquote><p>‘You will not come unto Me that ye may have life,’ you will have none of my counsel, you will not return, you are a stiff-necked people, obstinate and rebellious, whence the common assistances of Gods Spirit proves ineffectual and if God did not glorify free-grace any further, none, not the elect would return unto God, for although common grace given unto all is sufficient to leave all men without excuse, their non-improvement being their sin, yet none are thereby effectually engaged to turn unto God in faith, no not the elect, who, while unregenerate, are as sinfully obstinate as any;</p></blockquote>

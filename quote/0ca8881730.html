<blockquote><p>Yea, Dr. Ursinus, in his Judicium de Disciplina Ecclesiastica et Excommunicatione, exhibited to the Prince Elector Palatine Frederick III (who had required him to give his judgment concerning Erastus’ theses), does once and again observe, that all the reformed churches and divines, as well as those that did not practice excommunication as those who did practice it, agree, notwithstanding, in this principle, that excommunication ought to be in the church; which is a mighty advantage against Erastianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment Concerning Ecclesiastical Discipline &amp; Excommunication 1569 17</cite>, pp. in Works, vol. 3, pp. 801-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d902ff6ba" data-kw="">
<blockquote><p>…it appears to me that no objection can be made to admitting into the consistory officers of justice and chiefs of police, provided they sit in it in the capacity of magistrates. But always let there be a due distinction observed between the two functions and conditions. To exclude persons that belong to the civil government from all superintendence in the spiritual administration, seems to me contrary to reason. What is essential is that when fitting persons shall have been elected to such an office, there should be no blending of their functions, nor the power of the sword confounded with what ought to be carefully kept distinct from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters, #620</cite>, (1562)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-1d7699be7b" data-kw="">
<blockquote><p>1st Assertion: The magistrate as the magistrate is to procure that there be preachers and Church-officers to dispense Word, sacraments and discipline, for:

1. His end is, that people under him may lead a quiet and a peaceable life in godliness and honesty, 1 Tim. 2:2. And the Magistrate attains his end as a Magistrate, if there be simple exercise of religion in the quiet and peaceable way, that may consist with the subjects indemnity, and immunity, from rapine, injuries, and violence. … 4th Assertion. The magistrate de jure is obliged not only to permit, but also to procure the free exercise of the ministry in dispensing Word, sacraments and discipline, and owe his accumulative power, to convene synods, to add his sanction to the lawful and necessary constitutions and ordination of worthy, and to the deposition of unworthy officers in the Church, because:

1. He is a nurse-father in the Church, Isa. 49:23.

2. And by office, as a public father, to procure the good of the souls of the subjects in his coactive [coercive] way, that we may lead a quiet and peaceable life in all godliness and honesty, 1 Tim. 2:2.

3. He is not only to permit, but also positively to procure all peace, in the exercise of all lawful and profitable trades and arts; therefore, far more that glory may dwell in the land, and that the peace thereof may be as a river, Isa. 48:18, by the presence of Christ walking in the midst of the golden candlesticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 24, pp. 543 &amp; 552</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

/quote/1d7699be7b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=1st%20Assertion%3A%20The%20magistrate%20as%20the,the%20midst%20of%20the%20golden%20candlesticks&amp;text=1st%20Assertion%3A%20The%20magistrate%20as%20the%20magistrate%20is&amp;text=walking%20in%20the%20midst%20of%20the%20golden%20candlesticks" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bb1b33fbe2" data-kw="">
<blockquote><p>The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27).¹ ¹ See ‘On the Ethics of Paying Specific Taxes designated to a Corrupt Purpose or Imposed by a Usurped Authority or Usurper’ and ‘On the Ethics of Paying the Scottish Cess Near &amp; During the Killing Times’ at ‘On Paying Taxes’ (RBO). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged [Scottish ministers] censured the indulged with?² Did Jesus compromise his authority or the exercise of his ministry? ² Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, p. 151 in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-0879226770" data-kw="">
<blockquote><p>The controversy which has been moved concerning the civil magistrate’s vice-gerentship, and the holding of his office of, and under, and for Jesus Christ, as He is Mediator, has a necessary coherence with, and dependence upon, another controversy concerning a twofold kingdom of Jesus Christ… It is a distinction which Mr. Hussey [an Erastian] cannot endure, and no marvel, for it overturns the foundation of his opinion. He looks upon it as an absurd assertion, p. 25, ‘Shall He have one kingdom as Mediator, and another as God?’ He quarrels all that I have said of the twofold kingdom of Christ, and will not admit that Christ, as Mediator, is King of the church only, p. 25-27, 35-37. … He holds that Christ, as Mediator, has placed the Christian magistrate under Him, and as his vice-gerent, and has given him commission to govern the church, which, if he or any man can prove from the word of God, it will go far in the decision of the Erastian controversy… Mr. [Thomas] Coleman [c.1597-1646] in his Re-Examination, p. 19, was fearful to set his foot upon so slippery ground. He was loath to adventure upon this assertion, that magistracy is derived from Christ, as Mediator, by a commission of deputation and vice-gerentship… Wherefore he made a retreat and held him at this: ‘That magistracy is given to Christ to be serviceable in his kingdom.’ But out steps Mr. Hussey and boldly avers a great deal more. I much mistake if he shall not be made either to make a retreat, as Mr. Coleman did, or to do worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The controversy which has been moved concerning the civil magistrate’s vice-gerentship, and the holding of his office of, and under, and for Jesus Christ, as He is Mediator, has a necessary coherence with, and dependence upon, another controversy concerning a twofold kingdom of Jesus Christ… It is a distinction which Mr. Hussey [an Erastian] cannot endure, and no marvel, for it overturns the foundation of his opinion. He looks upon it as an absurd assertion, p. 25, ‘Shall He have one kingdom as Mediator, and another as God?’ He quarrels all that I have said of the twofold kingdom of Christ, and will not admit that Christ, as Mediator, is King of the church only, p. 25-27, 35-37. … He holds that Christ, as Mediator, has placed the Christian magistrate under Him, and as his vice-gerent, and has given him commission to govern the church, which, if he or any man can prove from the word of God, it will go far in the decision of the Erastian controversy… Mr. [Thomas] Coleman [c.1597-1646] in his Re-Examination, p. 19, was fearful to set his foot upon so slippery ground. He was loath to adventure upon this assertion, that magistracy is derived from Christ, as Mediator, by a commission of deputation and vice-gerentship… Wherefore he made a retreat and held him at this: ‘That magistracy is given to Christ to be serviceable in his kingdom.’ But out steps Mr. Hussey and boldly avers a great deal more. I much mistake if he shall not be made either to make a retreat, as Mr. Coleman did, or to do worse.”

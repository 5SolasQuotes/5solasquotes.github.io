<main class="wrap"><figure class="quote" id="q-78181b61e5" data-kw="">
<blockquote><p>XVI. Seventh, the will of God is universally effective. For whatever he wills, and just as he wills, he brings into effect in its own time and in its own way. Nor is there anything, if he wills it, that does not occur, or that does not occur as he wills it. “For our God is in the heavens; he does whatever he wills.” And Revelation 4:2 says, “By your will they exist and were created.” But (what must be noted) it always occurs just as he wills: if he wills the outcome of a thing, it always occurs; if he wills that it only be our duty, that we should will it ourselves, then it is so. But one must also distinguish between his effecting will and his effective will. The effecting will is only toward things that are good, both physically and morally. The effective will also concerns moral evils, insofar as first, in the eternal decree he determined their futurity, although he did not will to effect the evil itself to come to pass as such, and second, he also wills the substrate of sin, although he does not will its lawlessness and defect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 15, section 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

rmed Books Online</a></div>

<blockquote><p>2. The theory of Edwards breaks down. (1) It does not explain guilt; it does not rid God of being the author of sin. (2) It does not explain the moral value attached to character. (3) This theory explains self-expression, but not self-determination. Now, just a view must show how we first determine and then habitually express ourselves. In these determinations is found the moral significance of these expressions. Otherwise my nature would be no more than the nature of a plant. Will supposes conscience and intelligence–these minister to it; the moral law–this is its standard. 3. …There was also the possibility of determining otherwise–a power of perverting our nature, of determining it in another direction. The power, therefore, of determining itself in one or the other direction… … In the moral sphere, and especially in relation to single acts, this freedom is now seen in man. It is neither necessity nor a contempt of the principle of law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Freedom of the Will’ appended to ‘Lecture 10’ in Theological Lectures, in Collected Writings</cite>, vol. 1, pp. 250-251</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

formed Books Online</a></div>
</figure><figure class="quote" id="q-fda0824654" data-kw="">
<blockquote><p>What in [John] Milton’s opinion, was the causal basis of Adam’s disobedience? In a recent study Leon Howard… arrived at the following conclusions: ‘God is the remote first cause, who moves in so mysterious a way that human reason can find a force for teaching only in those more proximate causes with which he works. Adam, impelled by a ‘deficience’ of nature within him [the ‘proegumenic’ cause], was the principal cause of ‘all our woe.’ Eve provided the occasion [the ‘procatarctic’ cause] of his first disobedience. And Satan was the instrument by which the catastrophe was brought about.’ …It is useful… to know how Milton’s immediate predecessors and contemporaries regarded the problem, and to consult some sixteenth- and seventeenth century conceptions of the causes of man’s first apostasy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-m-steadman.html">John M. Steadman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“‘Man’s First Disobedience’: The Causal Structure of the Fall” in Journal of the History of Ideas</cite>, vol. 21, no. 2 (Apr. – Jun., 1960), pp. 180-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-fall/the-first-sin.html">The First Sin</a></span></div>

</figure><figure class="quote" id="q-913bd8d02a" data-kw="">
<blockquote><p>Or, by way of further elaboration, in the case of an event, ‘a’, God can will ‘a’ or will ‘not-a’–but he can also ‘not will ‘a” without any necessity of willing ‘not-a’ and, indeed, he can ‘not will ‘a” and in the same moment ‘not will ‘not-a”. This distinction may be yet another example of the Scotist influence found in seventeenth-century Reformed thought.</p></blockquote>

</figure><figure class="quote" id="q-552e96d443" data-kw="">
<blockquote><p>So that upon supposition of God’s will to permit Adam to fall, it was necessary that Adam should fall; necessary, I say, that he should fall: But how? Not necessarily, but contingently, and freely: and no other necessity is at this day found in man for the performing of any particular sinful act, but such as is joined with liberty; and that in such sort, as that the necessity is only Secundum quid [that which follows]; the liberty is Simpliciter [essential]: so called, I say, in respect of any particular act.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-17175373e9" data-kw="">
<blockquote><p>The following demonstration is rested on no narrow basis. Its two postulates, like two posterns, admit us into the edifice, but they are not its foundations. The whole economy of redemption, and the whole course of history are the broad substructions on which the argument is based and built up; and the author humbly submits that it cannot be overturned, or the conclusion arrived at set aside, without dislocating and shaking the structure of both revelation and providence. The same line of proof which establishes that Christ is the promised Messiah, conversely applied, establishes that the Roman system is the predicted Apostasy. In the life of Christ we behold the converse of what the Antichrist must be; and in the prophecy of the Antichrist we are shown the converse of what Christ must be, and was. And when we place the Papacy between the two, and compare it with each, we find, on the one hand, that it is the perfect converse of Christ as seen in His life; and, on the other, that it is the perfect image of the Antichrist, as shown in the prophecy of him. We conclude, therefore, that if Jesus of Nazareth be the Christ, the Roman Papacy is the Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-wylie.html">J.A. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Papacy is the Antichrist: a Demonstration, Wylie was a Professor of Church History in the old Free Church of Scotland</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3bf11b7dc" data-kw="">
<blockquote><p>Certainly, that succession is a goodly ornament—if, with the succession of persons, there be also a succession of doctrine and conformity of virtue. But there are many chairs in which those who sit hold a contrary doctrine to their predecessors. Thus, the scribes and Pharisees were sitting in the chair of Moses and had the personal succession; nevertheless, Jesus Christ commanded His disciples to beware of the leaven of their doctrine and reproached them for transgressing the law of God by their tradition (Matt. 15). Thus, the bishops of the churches of Antioch, Rome, and Alexandria boast themselves to be successors of Saint Peter, yet are dissenting and separate in communion. The bishops of Constantinople trace their succession from the Apostle Saint Andrew, as Nicephorus attempts to prove in the eighth book of his Chronology, chapter 6. Yet these bishops, by the judgment of the Roman Church, are schismatics and heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, bk. 1, ch. 32</span></figcaption>

</figure><figure class="quote" id="q-373f952ee3" data-kw="">
<blockquote><p>From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 4.26.4</span></figcaption>

</figure><figure class="quote" id="q-535aa9bb74" data-kw="">
<blockquote><p>Accordingly, he hesitates not to strip Christ in order that he may deck his Pope with the spoils. The Pope, he says, came a light into the world. Blasphemous mouth! will you apply to that fetid monster of yours sacred terms applicable to none but the Son of God?</p></blockquote>

</figure><figure class="quote" id="q-2fb22158c4" data-kw="">
<blockquote><p>For petra (rock) is not derived from Peter, but Peter from petra; just as Christ is not called so from the Christian, but the Christian from Christ. For on this very account the Lord said, On this rock will I build my Church, because Peter had said, You are the Christ, the Son of the living God. On this rock, therefore, He said, which you have confessed, I will build my Church. For the Rock (Petra) was Christ; and on this foundation was Peter himself also built. For other foundation can no man lay than that is laid, which is Christ Jesus. The Church, therefore, which is founded in Christ received from Him the keys of the kingdom of heaven in the person of Peter, that is to say, the power of binding and loosing sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tractates on the Gospel of John</cite>, tract. 124, §5</span></figcaption>

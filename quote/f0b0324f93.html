<main class="wrap"><figure class="quote" id="q-f0b0324f93" data-kw="">
<blockquote><p>XXIV. Then seventh, concerning remedies which we should oppose to any attacks or arts of the demons, it is asked whether spiritual things are sufficient here—prayers, battle, the apostolic armor [Eph. 6]—or whether some sort of external things must be added: holy water, the utterance of the name of Jesus, the use of relics, the sign of the cross, any consecrated things, a figure of the cross (made, that is, of wax), blessed images, and especially exorcism. The papists, in support of their superstitious exorcisms, affirm this. The orthodox deny it: (1) because Scripture commends to us nothing beyond the spiritual things which we mentioned (Eph. 6:11). Indeed, (2) it also expressly rejects all other things (2 Cor. 10:4). Moreover, (3) neither can any bodily things act upon spirits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 8, ‘The Evil Angels’, section 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

</figure><figure class="quote" id="q-369168cb1d" data-kw="">
<blockquote><p>When Rainer Decker was researching a sensational seventeenth-century German witchcraft trial, he discovered, much to his surprise, that in this case the papacy functioned as a force of skepticism and restraint. His curiosity piqued, he tried unsuccessfully to gain access to a secret Vatican archive housing the records of the Roman Inquisition that had been sealed to outsiders from its sixteenth-century beginnings. In 1996 Decker was one of the first of a small group of scholars allowed access… Witchcraft and the Papacy is based on these newly available materials and traces the role of the papacy in witchcraft prosecutions from medieval times to the eighteenth century. Decker found that although the medieval church did lay the foundation for witch hunts of the sixteenth to eighteenth centuries, the postmedieval papacy, and the Roman and Spanish Inquisitions, played the same kind of skeptical, restraining role during the height of the witch-hunting frenzy in Germany and elsewhere in Europe… Witchcraft and the Papacy overturns a large body of scholarship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rainer-decker.html">Rainer Decker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Witchcraft &amp; the Papacy: An Account Drawing on the Formerly Secret Records of the Roman Inquisition Ref</cite>, (Univ. of Virginia Press, 2008) 262 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

%20sensational%20seventeenth%2Dcentury&amp;text=the%20Papacy%20overturns%20a%20large%20body%20of%20scholarship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-77ada8fc04" data-kw="">
<blockquote><p>The fifth and last [unlawful] remedy is exorcism, which is an adjuring and commanding the devil in the name of God to depart from the possessed party and to cease to molest him anymore. This means was used by our Savior Christ Himself, and after Him by His apostles and other believers in the time of the primitive church when the gift of working miracles was in force. But in these days (as I said before) that gift is ceased, and also the promise of power annexed to the use of adjuration, and therefore the means thereof must needs cease. And for an ordinary man now to command the devil in such sort is mere presumption and a practice of sorcery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft</cite>, … (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’, pp. 245-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e977de2a40" data-kw="">
<blockquote><p>In MPD [or Dissociative Identity Disorder], we have a phenomenon that was traditionally categorized as demonic possession. Accordingly, people exhibiting the behavior now associated with MPD described it, not as a fragmentation of a single mind into multiple ones, but as the entrance from without of a distinct and alien mind… Many well-known cases of alleged MPD–such as that of ‘Sybil,’ made famous in the film of that title–have been shown to have been exaggerations or even hoaxes. ‘Sybil’ herself has admitted that her ‘disorder’ was more or less her own invention, that she was coxed into believing that she had multiple personalities by therapists eager to prove that MPD was real, and that under their encouragement and in an emotionally fragile state she had manufactured and acted out various ‘personalities’ to confirm their diagnosis. Many other MPD patients, emotionally disturbed people to start with, acknowledge that they see themselves less as literally ‘fragmenting’ into different personalities than as fantasizing and acting out different roles–again, often under the influence of overzealous therapists. The behavior of ‘split-brain’ patients is no less subject to interpretation, interpretation that can reflect the enthusiastic theorizing of the researcher as much as the objective facts. To begin with, the two hemispheres of the brains of such patients are not completely disconnected–there are other connections between the halves that remain undisturbed, and thus there are no grounds for insisting that the halves must be associated with different ‘minds’. Furthermore, under ordinary conditions, such patients behave more or less normally, or at least no in any way that suggests that more than a single mind occupies their bodies. It is only in contrived experimental contexts that they can be made to exhibit remarkable behavior, and even then that behavior is by no means obviously best interpreted as involving a ‘division’ of the mind. Many researchers hold instead that such behavior, when examined carefully, amounts to little more than a variation on the awkwardness, failure of co-ordination, or general cognitive malfunctioning that can result from any serious injury to brain…</p></blockquote>

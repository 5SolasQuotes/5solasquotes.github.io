<main class="wrap"><figure class="quote" id="q-2a92f20bdc" data-kw="">
<blockquote><p>Now that we may bring this nearer to ourselves; many among us complain, how they be wronged in their dealings with men; they are evil spoken of, slandered, railed upon, (they say) and many other ways abused. And they think they receive very hard measure at men’s hands hereby; they marvel at it, and complain, that none are used as they be: but what blindness is it, that covereth their eyes? For do not all that live with them, know, at least, their own consciences can tell them, that they have dealt even so with other, and thereby have given cause to be so dealt withal, again? But oh blind self-love, that cannot see that, which all other do see I mean, which thinks that tolerable in one’s self, which yet he accuseth and condemneth in another, and seeth not the just judgment of God upon himself by other men’s wronging him, which he himself by his just deserts, hath brought upon his own head. …

And for us who are now warned, if we have had our part in this sin, that with the common sort we have smitten others with our tongue, or wronged, or intended evil any way against them, learn we with great regard, to put a speedy end thereto by repentance; lest God awake and prevent us by some such like judgment again, as we have caused to other, and to this end put we these two lessons in practice, neither in heart, word or deed, offer we any hard or unequal measure to any man: and if any offer it to us, if it be possible, that it may be without our great hurt, let us quietly and meekly pass by it, and make no great matter of it, for the time shall come wherein we shall wish we had done so, and not have laid that so near our heart, which might more easily have been passed by of us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the whole book of Judges. Preached first and delivered in sundry lectures; since collected, and diligently perused, and now published. For the benefit generally of all such as desire to grow in faith and repentance, and especially of them, who would more clearly understand and make</cite>, (London: Thomas Man, 1615), pp 21-22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f724b599d3" data-kw="">
<blockquote><p>77. It is certain that we must attempt nothing in all our actions whereof we are not certain that it pleases God: whatsoever is done otherwise, does make us guilty before God. The apostle says, ‘Blessed is he that condemneth not himself in that which he alloweth.’ Whereupon it comes to pass that he that judges and condemns anything, and yet admits it, or puts it in practice, he is damned [condemned], because he does it not of faith.

78. Conscience has that virtue and power that if some work being of it own nature indifferent, if the conscience be good, it makes the work also to be good: and contrariwise, if the conscience be evil, it makes the work also evil.

79. But yet nevertheless it cannot be that any work, being evil in its own nature, may by our conscience be made good. For whatsoever conscience thou hast, yet when thou doest forswear thyself, or when thou committest adultery, thou doest grievously sin. Wherefore the force of conscience has power only in things indifferent, and also in those actions, which of their own nature are good.

80. And amongst these things, somewhat may seem to be against a man’s conscience, or unlawful two ways. First, uncertainly and doubtfully, without full assent, persuasion or resolution; namely, when a man doubts or is uncertain, whether something be lawful, or not. Secondly, determinately and absolutely with a resolved persuasion, to wit, when a man is certainly persuaded that something is simply lawful, albeit by error of conscience, or upon false and erroneous grounds.

81. If anything appears to be unlawful unto a man uncertainly and doubtfully, he is to abstain from doing of it of himself, so long as he is at his owne free choice and liberty, till his doubts be removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, … (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, p. 86 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>

</figure><figure class="quote" id="q-7f19e7c24c" data-kw="">
<blockquote><p>You are going to receive your king in communion. And when your king comes into your soul, it must be very tranquil and still. Your thoughts must be marked with the deepest peace. But you were treated most unjustly and you cannot bear to put aside your anger.

Why, then, do you do even greater wrong and more serious harm to yourself? Whatever your enemy may do to you, he will not treat you as badly as you treat yourself if you refuse to be reconciled to him and if you keep trampling underfoot the laws of God.

Did your foe outrage you? Tell me, is that why you outrage God? To refuse to be reconciled to the enemy who has caused you pain is not the act of a man who is taking revenge on his foe. It is the act of a man who is outraging God, who gave us these laws. Therefore, do not look back on the foe who is your fellow servant; do not look back on how deeply he has harmed you.

Rather, put God before your mind and the fear of him which you should feel. Force yourself to be reconciled to the enemy whose countless evil acts have caused you pain. Then, consider that the greater the violence you will endure in your own soul, the greater will be the honour you will enjoy from God, who gave these commandments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incomprehensible Nature of God</cite>, (c. 386-98), trans. Paul W. Harkins, The Fathers of the Church: A New Translation, Volume 72 (Washington D.C.: The Catholic University of America Press, 1982), 6.39-40, p. 183.</span></figcaption>

<blockquote><p>1st Distinction. There be odds betwixt a free willing people executing the sentence of the Church, and mere executioners and lictors [those who execute judicial sentences]. 2nd Distinction. There is a doubting of conscience-speculative, through ignorance of some circumstance of the fact; and a doubt of conscience practical through ignorance of something, which one is obliged to know, and so there is also a speculative and a practical certainty of a thing. 3rd Distinction. There is one certainty required in questione juris, in ‘a question of law’, and another in questione facti, in ‘question of fact’. 4th Distinction. There is, and may be an ignorance-invincible which a man cannot help, in a question of fact; but Papists and schoolmen err who maintain an invincible ignorance in questione juris, in ‘a question of law’, and in this they lay imperfection on God’s Word. 5th Distinction. There is a moral diligence given for knowledge of a thing which suffices to make the ignorance excusable, and there is a moral diligence not sufficient. 6th Distinction. There is a sentence manifestly unjust as the condemning of Christ by witnesses belying one another, and a sentence doubtsomely false. … 3rd Conclusion. There is not required the like certainty of conscience-practical in a question of fact, that is required in a question of law:

1. Because in a question of law all ignorance is moral and culpably evil to any who undertakes actions upon conscience of obedience to others; for to all within the visible Church the Word of God is exactly perfect for faith and manners, and everyone is obliged to know all conclusions of law that are determinable by God’s Word.

2. Every one in his actions is to do out of a plerophory, and a full persuasion, of heart, that what he does pleases God, Rom. 14:14, ‘I know and am persuaded by the Lord Jesus that nothing is unclean of itself.’

3. We are to do nothing but what is lawful and what in our consciences we are persuaded is lawful, and are to know what is sin and what is no sin. All soldiers in war and lictors, and these who execute the sentence of excommunication, are to know what are the just causes of war and what crimes by God’s Law deserve death and what not, as what homicide, sorcery, parricide, incest and the like sins deserve by God’s Law, and what not: because every one is obliged to know morally what concerns his conscience, that he be not guilty before God; the executioner who beheaded John Baptist sinned, because he was obliged to know this [much]: a prophet who rebukes incest in a king ought not to be put to death; therefore [the conclusion follows]; it was unlawful for the men of Judah to come and make war with Jeroboam and the ten tribes because God forbade that war, 1 Kings 12:23-24. 4th Conclusion. It is not enough that some say: if the question be negatively-just, then soldiers and executioners and people may execute the sentence; that is, if they see no unlawfulness in the fact, I mean unlawfulness in materia juris, in ‘a matter of law’. Hence some say subjects and common soldiers not admitted to the secrets of the council of war may fight lawfully when there is this negative-justice in the war; but foreign soldiers who are conduced [brought in], may not do so, for the [Scriptural] law says he is not free of a fault who intermeddles with matters which belong not to him, to the hurt of others; so teaches Suarez, D. Bannes and Dr. Duvallius; Yet the command of the prince can remove no doubt of conscience; also that the cause of the war in the matter of law, so far as it is agreeable to God’s Word, is not manifest to executioners, is there culpable ignorance no less than the ignorance of a sentence manifestly unjust; Ergo [Therefore], the practice of these who execute a sentence negatively-only-just, is not lawful. I prove the antecedent: [1.] because the practical ignorance of what we do which is not warranted by God’s Word, is always culpable, whether the cause be clear or dark: for no obscurity of God’s Law does excuse our ignorant practice when the Word of God can sufficiently resolve us.

2. It is not enough that our moral actions in their lawfulness be just-negatively; because actions moral which are beside the Word of God (praeter dei verbum) to us, who hold God’s Word [to be] perfect in faith and manners, are also, contra dei verbum, against the Word of God, and so unlawful.

3. Because actions-moral, having no warrant but the sole will and commandment of superiors, are undertaken upon the sole faith that what superiors command, if it seem not to us unjust, though it be in itself unjust, may lawfully be done. Now we condemn this in schoolmen and Popish causuists, that the commandment of superiors (as says Gregory de Valent., Bannes, Suarez, Silvester, Navarre) may take away and remove all doubting of conscience and make the action lawful. Whereas Navarre, Corduba, Sylvester [and] Adrian hold that an action done without a due practical-certainty is unlawful. If he should diligently (says Suarez) search for the truth, and cannot find it, yet the doubter may practice, so he practically persuade himself, he does it out of a good mind; and whereas the Jesuit says that it is his negligence in not seeking the truth, he answers, his negligence which is by past cannot have influence in his present action, to make it unlawful, because it is past and gone. But I answer: it is physically past, but it is morally present to infect the action, as habitual ignorance makes the acts of unbelief morally worse or ill. And to these we may add that he who does with such a doubt:

1. He sins, because he does not in faith;

2. He exposes himself to the hazard of sinning and of joining with an unjust sentence.

3. It is the corrupt doctrine of Papists, who muzzle up the people in ignorance and discharge them to read God’s Word, and so maintain (because of the obscurity and imperfection of God’s Word, which is not able to determine all questions) that there is an ignorance of many lawful duties which is invincible and to be excused as no ways sinful and which vitiates not our moral actions; so Thomas, Bonaventura, Richard, Gabriele, Occam, Antoninus, Adrianus, Almaine, Suarez, though Occam and Almain may be expounded favorably. 5th Conclusion. Soldiers, lictors, servants [and] people under the eldership are not mere instruments moved only by superiors, as schoolmen say:

1. Because they are moral agents and are no less to obey in faith than superiors are to command in faith, and they are to obey their superiors only in the Lord.

2. They are to give all diligence that they be not accessory to unjust sentences, lest they partake of other men’s sins. What Aquinas, Greg. de Valent. and And. Duvallius says against this, is not to be stood upon. 6th Conclusion. But in questione facti, in matters of fact, there is not required that certainty of conscience. But that we may more clearly understand the conclusion, a question of fact is taken three ways:

1. For a fact expressly set down in God’s Word, as that Moses led the people through the wilderness, that Cain slew his brother Abel, these are questions de facto [in fact], not questiones facti [questions of fact], and must be believed as Almaine and Occam say well, with that same certainty by which we believe God’s Word.

2. A question of fact is [sometimes] taken for a question [which is actually mixed]: the subject whereof is a matter of fact, but the attribute is a matter of law: as if Christ, in saying He was the Son of God, did blaspheme; if the Lord’s priests, in giving David showbread, did commit treason against King Saul; there is some question there made circa factum, about the fact, but it is formally a question of law. For these questions may be cleared by God’s Word, and the ignorance of any questions which may be cleared by God’s Word is vincible [able to be overcome] and culpable, for the law says [that,] ‘The ignorance of these things which we are obliged to know is culpable’, and excuses not. But thirdly, a question of fact is properly a question whether this Corinthian committed incest or no [1 Cor. 5], whether Titus committed murder or no; and in this there is sometimes invincible ignorance when all diligence morally-possible is given, to come to the knowledge of the fact. Now we know here [that] the question of law must be proved by the law; all are obliged in conscience to know what sins deserve death and excommunication. But whether this man John, Anna, Marie has committed such sins, is a question of fact and cannot be proved by the law or the Word of God, for the Law is not anent singulars or particulars; this is proved by sense and the testimony of witnesses, and therefore the certainty-practical of conscience here is human and fallible, not divine and infallible. Now, though soldiers, lictors or people join to the execution of a sentence, and have their doubtings anent the fidelity of the witnesses, yet when all diligence morally possible is given to try the matter, they may well be said to do in faith, though they have not certainty of faith concerning the fact, because there cannot be certainty of divine faith in facts; men’s confession, sense [and] the testimony of witnesses cannot breed divine faith: yea here the judge himself may condemn the innocent, and yet the sentence of the judge may be most just because the witnesses are liars, and the judge gives out that sentence in faith, because God’s Word has commanded him to proceed secundum allegata &amp; probata [according to what is alleged and proved]: he must give sentence under two or three witnesses. Yea, though the judge saw with his eyes the guilty commit the fact, yet he cannot by God’s Law condemn him, but upon the testimony of witnesses. For the wise Lord sees what confusion and tyranny should follow if one might be both index, actor and testis, the judge, the accuser, and the witness. And when the judge gives out a sentence to absolve the guilty and condemn the innocent, his sentence is judicially and formally just, and materially and by accident, and contrary to his intention only, unjust; If the judge in that case should say (as Master Weemes observes well) [that] ‘such a proposition is true, when he knows it to be false, and being posed and urged in conscience, is this an innocent man or no?’ If he should answer and say [that] he is not, [or] should he then answer contrary to his knowledge? But as a judge he must answer: he is not innocent, because witnesses, being with all possible diligence examined, have condemned him; and it is no inconvenience here to say that the judge has one conscience as a man and another contrary conscience as a judge in the question of fact; for God has tied his conscience as a judge to the fidelity of witnesses, known not to be false. I desire the reader to see anent this more in Bonaventura, Richardus, Occam, Antoninus, Adrian and our countryman John Weems [Exposition of the Laws of Moses (1632), vol. 2, ch. 17, ‘Whether a Judge is Bound to Give Sentence According to Things Proved &amp; Alleged, or According to his Own Private Knowledge’, pp. 66-70] and Henricus. Now because souldiers, lictors and people are not judges, if they know the fact in law deserves such and such punishments, where the sentence is not manifestly false and unjust, but in the matter of law just, though erroneous in the matter of fact, all possible diligence being used by the judges, they are to execute that sentence upon the testimony of the judges, though they be not personally present at the proceedings of the judges and eldership, which may be proved many ways:

1. By the confession of our [congregationalist] brethren, if any of the congregation be absent by sickness, childbirth-pain, trading over sea, imprisonment, the congregation does justly put away from amongst them the incestuous Corinthian, and they who are absent are to repute the party excommunicate[d], as a heathen; as their own practice is at censures in the weekday, the largest half of the congregation is absent, yet the absent upon the testimony of the Church hold valid what is done by the Church.

2. Other sister-Churches, who ought not [necessarily] to be present at Church-censures, as our [congregationalist] Brethren teach, are to repute the excommunicate[d] cast out by a sister Church-independent (as they say) as a heathen, because being bound in Heaven: here, is he not bound in a Church-visible, one mile distant from the Church excommunicating? Yet this is no tyranny of conscience.

3. Women are to execute the sentence and to eschew the company of the party excommunicated, yet are they not to be present as judges to usurp authority over the men. This [John] Robinson grants.

4. This should evert all judicatories of peace and war, so many thousands, Acts 2, could not be present at every act of censure and that daily, nor are acts of discipline necessarily tied to the Lord’s Day. They are (I grant) acts of divine worship, but the whole multitude of women and children are deprived of the liberty that God has given them for six days to the works of their calling, if they must be personally present at all the acts of discipline, to cognosce of all scandals, and to here and receive testimonies against elders under two or three witnesses, which is the office of Timothy, this way the overseeing of the manners of the people, which also our Brethren lay upon the whole people, takes up the great part of the pastor’s office and the whole office of ruling elders. And if we lay upon the people the work and all the acts of the office, how can we not lay upon them the office itself?

1. It were not lawful for one to be king over more people than he could in his own personal presence judge, contrary to God’s Word, that teaches us to obey these who are sent by the supreme magistrate, as we obey the king, 1 Pet. 2:13-14. Therefore, these who are sent by him are lawful judges, and yet the king judges by them and in them.

2. This error is founded upon a worse error, to wit, that the supreme magistrate had no power of life and death in Israel without consent of the people, but certainly there are as specious and plausible reasons, if not more specious, for the peoples’ government in all civil matters than there can be for their Church-power of judging in the Church-matters and [the] government thereof. Yet there is no ground for it.

1. Because the rulers only could not be charged to execute judgement in the morning, to deliver the oppressed, to execute judgement for the fatherless and the widow; nor can there be a promise made to establish the king’s throne for obeying that commandment, as God’s Word teaches, if the people have as great, yea, greater power in judging than the rulers have by this our Brethren’s argument. They say all the believers at Corinth, 1 Cor. 5, could not be commanded to cast out the incestuous person, nor could they all be taxed for omitting that duty, if they had not power to excommunicate.

3. If from the people’s witnessing and hearing of judgment in the gate we conclude [that] the people were judges with the rulers, there was never a time when there was no king in Israel and no judge to put evil doers to shame, but every man did what seemed good in his own eyes, contrary to Scripture because all are a generation of kings and princes no less than the ruler himself, as Anabaptists teach. By the doctrine of our brethren, I deny not but he that gathered sticks on the Sabbath was brought, Num. 15:33, to Moses and to Aaron and to all the congregation, but the congregation signifies not the common multitude. For [verse] 35, Moses received the sentence from God and pronounced it, and the congregation stoned him to death; and Num. 27:1, The daughters of Zelophehad stood before Moses, Eleazar and before the princes as judges, and before all the congregation as witnesses, not as judges: but vv. 6-7, Moses gave out the judicial sentence from the Lord’s mouth. And 1 Kings 21:12, Naboth stood in presence of the people to be judged, but the nobles and princes were his judges, because, v. 8, Jezabel wrote to the nobles and princes that v. 10, they should carry out Naboth and stone him, to wit, judicially, and v. 11, the nobles and princes did as Jezabel had sent unto them. And Jeremiah, ch. 26, pleaded his cause before the princes and people, for v. 10, the princes [text in Hebrew] set down (judicially) in the entry of the new gate of the Lord’s House: nothing can be gathered from the place to prove that the people judged, but because Jeremiah spake to the princes and the people, who, verse 24, were in a fury and rage against Jeremiah, if Ahikam had not saved him from their violence.”

— Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, ... (1644), Ch. 3, Section 3, Question 4, ‘Whether or No is there a Necessity of the Personal Presence of the Whole Church in All the Acts of Church-Censures?’, pp. 41-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1st+Distinction.+There+be+odds+betwixt+a+free+willing+people+executing+the+sentence+of+the+Church%2C+and+mere+executioners+and+lictors+%5Bthose+who+execute+judicial+sentences%5D.+2nd+Distinction.+There+is+a+doubting+of+conscience-speculative%2C+through+ignorance+of+some+circumstance+of+the+fact%3B+and+a+doubt+of+conscience+practical+through+ignorance+of+something%2C+which+one+is+obliged+to+know%2C+and+so+there+is+also+a+speculative+and+a+practical+certainty+of+a+thing.+3rd+Distinction.+There+is+one+certainty+required+in+questione+juris%2C+in+%E2%80%98a+question+of+law%E2%80%99%2C+and+another+in+questione+facti%2C+in+%E2%80%98question+of+fact%E2%80%99.+4th+Distinction.+There+is%2C+and+may+be+an+ignorance-invincible+which+a+man+cannot+help%2C+in+a+question+of+fact%3B+but+Papists+and+schoolmen+err+who+maintain+an+invincible+ignorance+in+questione+juris%2C+in+%E2%80%98a+question+of+law%E2%80%99%2C+and+in+this+they+lay+imperfection+on+God%E2%80%99s+Word.+5th+Distinction.+There+is+a+moral+diligence+given+for+knowledge+of+a+thing+which+suffices+to+make+the+ignorance+excusable%2C+and+there+is+a+moral+diligence+not+sufficient.+6th+Distinction.+There+is+a+sentence+manifestly+unjust+as+the+condemning+of+Christ+by+witnesses+belying+one+another%2C+and+a+sentence+doubtsomely+false.+%E2%80%A6+3rd+Conclusion.+There+is+not+required+the+like+certainty+of+conscience-practical+in+a+question+of+fact%2C+that+is+required+in+a+question+of+law%3A+1.+Because+in+a+question+of+law+all+ignorance+is+moral+and+culpably+evil+to+any+who+undertakes+actions+upon+conscience+of+obedience+to+others%3B+for+to+all+within+the+visible+Church+the+Word+of+God+is+exactly+perfect+for+faith+and+manners%2C+and+everyone+is+obliged+to+know+all+conclusions+of+law+that+are+determinable+by+God%E2%80%99s+Word.+2.+Every+one+in+his+actions+is+to+do+out+of+a+plerophory%2C+and+a+full+persuasion%2C+of+heart%2C+that+what+he+does+pleases+God%2C+Rom.+14%3A14%2C+%E2%80%98I+know+and+am+persuaded+by+the+Lord+Jesus+that+nothing+is+unclean+of+itself.%E2%80%99+3.+We+are+to+do+nothing+but+what+is+lawful+and+what+in+our+consciences+we+are+persuaded+is+lawful%2C+and+are+to+know+what+is+sin+and+what+is+no+sin.+All+soldiers+in+war+and+lictors%2C+and+these+who+execute+the+sentence+of+excommunication%2C+are+to+know+what+are+the+just+causes+of+war+and+what+crimes+by+God%E2%80%99s+Law+deserve+death+and+what+not%2C+as+what+homicide%2C+sorcery%2C+parricide%2C+incest+and+the+like+sins+deserve+by+God%E2%80%99s+Law%2C+and+what+not%3A+because+every+one+is+obliged+to+know+morally+what+concerns+his+conscience%2C+that+he+be+not+guilty+before+God%3B+the+executioner+who+beheaded+John+Baptist+sinned%2C+because+he+was+obliged+to+know+this+%5Bmuch%5D%3A+a+prophet+who+rebukes+incest+in+a+king+ought+not+to+be+put+to+death%3B+therefore+%5Bthe+conclusion+follows%5D%3B+it+was+unlawful+for+the+men+of+Judah+to+come+and+make+war+with+Jeroboam+and+the+ten+tribes+because+God+forbade+that+war%2C+1+Kings+12%3A23-24.+4th+Conclusion.+It+is+not+enough+that+some+say%3A+if+the+question+be+negatively-just%2C+then+soldiers+and+executioners+and+people+may+execute+the+sentence%3B+that+is%2C+if+they+see+no+unlawfulness+in+the+fact%2C+I+mean+unlawfulness+in+materia+juris%2C+in+%E2%80%98a+matter+of+law%E2%80%99.+Hence+some+say+subjects+and+common+soldiers+not+admitted+to+the+secrets+of+the+council+of+war+may+fight+lawfully+when+there+is+this+negative-justice+in+the+war%3B+but+foreign+soldiers+who+are+conduced+%5Bbrought+in%5D%2C+may+not+do+so%2C+for+the+%5BScriptural%5D+law+says+he+is+not+free+of+a+fault+who+intermeddles+with+matters+which+belong+not+to+him%2C+to+the+hurt+of+others%3B+so+teaches+Suarez%2C+D.+Bannes+and+Dr.+Duvallius%3B+Yet+the+command+of+the+prince+can+remove+no+doubt+of+conscience%3B+also+that+the+cause+of+the+war+in+the+matter+of+law%2C+so+far+as+it+is+agreeable+to+God%E2%80%99s+Word%2C+is+not+manifest+to+executioners%2C+is+there+culpable+ignorance+no+less+than+the+ignorance+of+a+sentence+manifestly+unjust%3B+Ergo+%5BTherefore%5D%2C+the+practice+of+these+who+execute+a+sentence+negatively-only-just%2C+is+not+lawful.+I+prove+the+antecedent%3A+%5B1.%5D+because+the+practical+ignorance+of+what+we+do+which+is+not+warranted+by+God%E2%80%99s+Word%2C+is+always+culpable%2C+whether+the+cause+be+clear+or+dark%3A+for+no+obscurity+of+God%E2%80%99s+Law+does+excuse+our+ignorant+practice+when+the+Word+of+God+can+sufficiently+resolve+us.+2.+It+is+not+enough+that+our+moral+actions+in+their+lawfulness+be+just-negatively%3B+because+actions+moral+which+are+beside+the+Word+of+God+%28praeter+dei+verbum%29+to+us%2C+who+hold+God%E2%80%99s+Word+%5Bto+be%5D+perfect+in+faith+and+manners%2C+are+also%2C+contra+dei+verbum%2C+against+the+Word+of+God%2C+and+so+unlawful.+3.+Because+actions-moral%2C+having+no+warrant+but+the+sole+will+and+commandment+of+superiors%2C+are+undertaken+upon+the+sole+faith+that+what+superiors+command%2C+if+it+seem+not+to+us+unjust%2C+though+it+be+in+itself+unjust%2C+may+lawfully+be+done.+Now+we+condemn+this+in+schoolmen+and+Popish+causuists%2C+that+the+commandment+of+superiors+%28as+says+Gregory+de+Valent.%2C+Bannes%2C+Suarez%2C+Silvester%2C+Navarre%29+may+take+away+and+remove+all+doubting+of+conscience+and+make+the+action+lawful.+Whereas+Navarre%2C+Corduba%2C+Sylvester+%5Band%5D+Adrian+hold+that+an+action+done+without+a+due+practical-certainty+is+unlawful.+If+he+should+diligently+%28says+Suarez%29+search+for+the+truth%2C+and+cannot+find+it%2C+yet+the+doubter+may+practice%2C+so+he+practically+persuade+himself%2C+he+does+it+out+of+a+good+mind%3B+and+whereas+the+Jesuit+says+that+it+is+his+negligence+in+not+seeking+the+truth%2C+he+answers%2C+his+negligence+which+is+by+past+cannot+have+influence+in+his+present+action%2C+to+make+it+unlawful%2C+because+it+is+past+and+gone.+But+I+answer%3A+it+is+physically+past%2C+but+it+is+morally+present+to+infect+the+action%2C+as+habitual+ignorance+makes+the+acts+of+unbelief+morally+worse+or+ill.+And+to+these+we+may+add+that+he+who+does+with+such+a+doubt%3A+1.+He+sins%2C+because+he+does+not+in+faith%3B+2.+He+exposes+himself+to+the+hazard+of+sinning+and+of+joining+with+an+unjust+sentence.+3.+It+is+the+corrupt+doctrine+of+Papists%2C+who+muzzle+up+the+people+in+ignorance+and+discharge+them+to+read+God%E2%80%99s+Word%2C+and+so+maintain+%28because+of+the+obscurity+and+imperfection+of+God%E2%80%99s+Word%2C+which+is+not+able+to+determine+all+questions%29+that+there+is+an+ignorance+of+many+lawful+duties+which+is+invincible+and+to+be+excused+as+no+ways+sinful+and+which+vitiates+not+our+moral+actions%3B+so+Thomas%2C+Bonaventura%2C+Richard%2C+Gabriele%2C+Occam%2C+Antoninus%2C+Adrianus%2C+Almaine%2C+Suarez%2C+though+Occam+and+Almain+may+be+expounded+favorably.+5th+Conclusion.+Soldiers%2C+lictors%2C+servants+%5Band%5D+people+under+the+eldership+are+not+mere+instruments+moved+only+by+superiors%2C+as+schoolmen+say%3A+1.+Because+they+are+moral+agents+and+are+no+less+to+obey+in+faith+than+superiors+are+to+command+in+faith%2C+and+they+are+to+obey+their+superiors+only+in+the+Lord.+2.+They+are+to+give+all+diligence+that+they+be+not+accessory+to+unjust+sentences%2C+lest+they+partake+of+other+men%E2%80%99s+sins.+What+Aquinas%2C+Greg.+de+Valent.+and+And.+Duvallius+says+against+this%2C+is+not+to+be+stood+upon.+6th+Conclusion.+But+in+questione+facti%2C+in+matters+of+fact%2C+there+is+not+required+that+certainty+of+conscience.+But+that+we+may+more+clearly+understand+the+conclusion%2C+a+question+of+fact+is+taken+three+ways%3A+1.+For+a+fact+expressly+set+down+in+God%E2%80%99s+Word%2C+as+that+Moses+led+the+people+through+the+wilderness%2C+that+Cain+slew+his+brother+Abel%2C+these+are+questions+de+facto+%5Bin+fact%5D%2C+not+questiones+facti+%5Bquestions+of+fact%5D%2C+and+must+be+believed+as+Almaine+and+Occam+say+well%2C+with+that+same+certainty+by+which+we+believe+God%E2%80%99s+Word.+2.+A+question+of+fact+is+%5Bsometimes%5D+taken+for+a+question+%5Bwhich+is+actually+mixed%5D%3A+the+subject+whereof+is+a+matter+of+fact%2C+but+the+attribute+is+a+matter+of+law%3A+as+if+Christ%2C+in+saying+He+was+the+Son+of+God%2C+did+blaspheme%3B+if+the+Lord%E2%80%99s+priests%2C+in+giving+David+showbread%2C+did+commit+treason+against+King+Saul%3B+there+is+some+question+there+made+circa+factum%2C+about+the+fact%2C+but+it+is+formally+a+question+of+law.+For+these+questions+may+be+cleared+by+God%E2%80%99s+Word%2C+and+the+ignorance+of+any+questions+which+may+be+cleared+by+God%E2%80%99s+Word+is+vincible+%5Bable+to+be+overcome%5D+and+culpable%2C+for+the+law+says+%5Bthat%2C%5D+%E2%80%98The+ignorance+of+these+things+which+we+are+obliged+to+know+is+culpable%E2%80%99%2C+and+excuses+not.+But+thirdly%2C+a+question+of+fact+is+properly+a+question+whether+this+Corinthian+committed+incest+or+no+%5B1+Cor.+5%5D%2C+whether+Titus+committed+murder+or+no%3B+and+in+this+there+is+sometimes+invincible+ignorance+when+all+diligence+morally-possible+is+given%2C+to+come+to+the+knowledge+of+the+fact.+Now+we+know+here+%5Bthat%5D+the+question+of+law+must+be+proved+by+the+law%3B+all+are+obliged+in+conscience+to+know+what+sins+deserve+death+and+excommunication.+But+whether+this+man+John%2C+Anna%2C+Marie+has+committed+such+sins%2C+is+a+question+of+fact+and+cannot+be+proved+by+the+law+or+the+Word+of+God%2C+for+the+Law+is+not+anent+singulars+or+particulars%3B+this+is+proved+by+sense+and+the+testimony+of+witnesses%2C+and+therefore+the+certainty-practical+of+conscience+here+is+human+and+fallible%2C+not+divine+and+infallible.+Now%2C+though+soldiers%2C+lictors+or+people+join+to+the+execution+of+a+sentence%2C+and+have+their+doubtings+anent+the+fidelity+of+the+witnesses%2C+yet+when+all+diligence+morally+possible+is+given+to+try+the+matter%2C+they+may+well+be+said+to+do+in+faith%2C+though+they+have+not+certainty+of+faith+concerning+the+fact%2C+because+there+cannot+be+certainty+of+divine+faith+in+facts%3B+men%E2%80%99s+confession%2C+sense+%5Band%5D+the+testimony+of+witnesses+cannot+breed+divine+faith%3A+yea+here+the+judge+himself+may+condemn+the+innocent%2C+and+yet+the+sentence+of+the+judge+may+be+most+just+because+the+witnesses+are+liars%2C+and+the+judge+gives+out+that+sentence+in+faith%2C+because+God%E2%80%99s+Word+has+commanded+him+to+proceed+secundum+allegata+%26+probata+%5Baccording+to+what+is+alleged+and+proved%5D%3A+he+must+give+sentence+under+two+or+three+witnesses.+Yea%2C+though+the+judge+saw+with+his+eyes+the+guilty+commit+the+fact%2C+yet+he+cannot+by+God%E2%80%99s+Law+condemn+him%2C+but+upon+the+testimony+of+witnesses.+For+the+wise+Lord+sees+what+confusion+and+tyranny+should+follow+if+one+might+be+both+index%2C+actor+and+testis%2C+the+judge%2C+the+accuser%2C+and+the+witness.+And+when+the+judge+gives+out+a+sentence+to+absolve+the+guilty+and+condemn+the+innocent%2C+his+sentence+is+judicially+and+formally+just%2C+and+materially+and+by+accident%2C+and+contrary+to+his+intention+only%2C+unjust%3B+If+the+judge+in+that+case+should+say+%28as+Master+Weemes+observes+well%29+%5Bthat%5D+%E2%80%98such+a+proposition+is+true%2C+when+he+knows+it+to+be+false%2C+and+being+posed+and+urged+in+conscience%2C+is+this+an+innocent+man+or+no%3F%E2%80%99+If+he+should+answer+and+say+%5Bthat%5D+he+is+not%2C+%5Bor%5D+should+he+then+answer+contrary+to+his+knowledge%3F+But+as+a+judge+he+must+answer%3A+he+is+not+innocent%2C+because+witnesses%2C+being+with+all+possible+diligence+examined%2C+have+condemned+him%3B+and+it+is+no+inconvenience+here+to+say+that+the+judge+has+one+conscience+as+a+man+and+another+contrary+conscience+as+a+judge+in+the+question+of+fact%3B+for+God+has+tied+his+conscience+as+a+judge+to+the+fidelity+of+witnesses%2C+known+not+to+be+false.+I+desire+the+reader+to+see+anent+this+more+in+Bonaventura%2C+Richardus%2C+Occam%2C+Antoninus%2C+Adrian+and+our+countryman+John+Weems+%5BExposition+of+the+Laws+of+Moses+%281632%29%2C+vol.+2%2C+ch.+17%2C+%E2%80%98Whether+a+Judge+is+Bound+to+Give+Sentence+According+to+Things+Proved+%26+Alleged%2C+or+According+to+his+Own+Private+Knowledge%E2%80%99%2C+pp.+66-70%5D+and+Henricus.+Now+because+souldiers%2C+lictors+and+people+are+not+judges%2C+if+they+know+the+fact+in+law+deserves+such+and+such+punishments%2C+where+the+sentence+is+not+manifestly+false+and+unjust%2C+but+in+the+matter+of+law+just%2C+though+erroneous+in+the+matter+of+fact%2C+all+possible+diligence+being+used+by+the+judges%2C+they+are+to+execute+that+sentence+upon+the+testimony+of+the+judges%2C+though+they+be+not+personally+present+at+the+proceedings+of+the+judges+and+eldership%2C+which+may+be+proved+many+ways%3A+1.+By+the+confession+of+our+%5Bcongregationalist%5D+brethren%2C+if+any+of+the+congregation+be+absent+by+sickness%2C+childbirth-pain%2C+trading+over+sea%2C+imprisonment%2C+the+congregation+does+justly+put+away+from+amongst+them+the+incestuous+Corinthian%2C+and+they+who+are+absent+are+to+repute+the+party+excommunicate%5Bd%5D%2C+as+a+heathen%3B+as+their+own+practice+is+at+censures+in+the+weekday%2C+the+largest+half+of+the+congregation+is+absent%2C+yet+the+absent+upon+the+testimony+of+the+Church+hold+valid+what+is+done+by+the+Church.+2.+Other+sister-Churches%2C+who+ought+not+%5Bnecessarily%5D+to+be+present+at+Church-censures%2C+as+our+%5Bcongregationalist%5D+Brethren+teach%2C+are+to+repute+the+excommunicate%5Bd%5D+cast+out+by+a+sister+Church-independent+%28as+they+say%29+as+a+heathen%2C+because+being+bound+in+Heaven%3A+here%2C+is+he+not+bound+in+a+Church-visible%2C+one+mile+distant+from+the+Church+excommunicating%3F+Yet+this+is+no+tyranny+of+conscience.+3.+Women+are+to+execute+the+sentence+and+to+eschew+the+company+of+the+party+excommunicated%2C+yet+are+they+not+to+be+present+as+judges+to+usurp+authority+over+the+men.+This+%5BJohn%5D+Robinson+grants.+4.+This+should+evert+all+judicatories+of+peace+and+war%2C+so+many+thousands%2C+Acts+2%2C+could+not+be+present+at+every+act+of+censure+and+that+daily%2C+nor+are+acts+of+discipline+necessarily+tied+to+the+Lord%E2%80%99s+Day.+They+are+%28I+grant%29+acts+of+divine+worship%2C+but+the+whole+multitude+of+women+and+children+are+deprived+of+the+liberty+that+God+has+given+them+for+six+days+to+the+works+of+their+calling%2C+if+they+must+be+personally+present+at+all+the+acts+of+discipline%2C+to+cognosce+of+all+scandals%2C+and+to+here+and+receive+testimonies+against+elders+under+two+or+three+witnesses%2C+which+is+the+office+of+Timothy%2C+this+way+the+overseeing+of+the+manners+of+the+people%2C+which+also+our+Brethren+lay+upon+the+whole+people%2C+takes+up+the+great+part+of+the+pastor%E2%80%99s+office+and+the+whole+office+of+ruling+elders.+And+if+we+lay+upon+the+people+the+work+and+all+the+acts+of+the+office%2C+how+can+we+not+lay+upon+them+the+office+itself%3F+5.+All+Israel%2C+gathered+to+war+from+Dan+to+Beersheba%2C+could+not%2C+by+virtue+of+duty+and+obligation%2C+be+present+personally+at+the+determination+of+lawful+war%3A+Nay%2C+if+they+were+all+present+as+judges%2C+as+Mr.+Ainsworth+would+have+them%2C+there+%5Bwould%5D+be+no+governors+and+feeders+in+Israel%2C+but+all+the+governed+are+feeders%2C+and+so+no+magistrate+and+ruler%2C+as+Anabaptists+teach+here%3A+1.+It+were+not+lawful+for+one+to+be+king+over+more+people+than+he+could+in+his+own+personal+presence+judge%2C+contrary+to+God%E2%80%99s+Word%2C+that+teaches+us+to+obey+these+who+are+sent+by+the+supreme+magistrate%2C+as+we+obey+the+king%2C+1+Pet.+2%3A13-14.+Therefore%2C+these+who+are+sent+by+him+are+lawful+judges%2C+and+yet+the+king+judges+by+them+and+in+them.+2.+This+error+is+founded+upon+a+worse+error%2C+to+wit%2C+that+the+supreme+magistrate+had+no+power+of+life+and+death+in+Israel+without+consent+of+the+people%2C+but+certainly+there+are+as+specious+and+plausible+reasons%2C+if+not+more+specious%2C+for+the+peoples%E2%80%99+government+in+all+civil+matters+than+there+can+be+for+their+Church-power+of+judging+in+the+Church-matters+and+%5Bthe%5D+government+thereof.+Yet+there+is+no+ground+for+it.+1.+Because+the+rulers+only+could+not+be+charged+to+execute+judgement+in+the+morning%2C+to+deliver+the+oppressed%2C+to+execute+judgement+for+the+fatherless+and+the+widow%3B+nor+can+there+be+a+promise+made+to+establish+the+king%E2%80%99s+throne+for+obeying+that+commandment%2C+as+God%E2%80%99s+Word+teaches%2C+if+the+people+have+as+great%2C+yea%2C+greater+power+in+judging+than+the+rulers+have+by+this+our+Brethren%E2%80%99s+argument.+They+say+all+the+believers+at+Corinth%2C+1+Cor.+5%2C+could+not+be+commanded+to+cast+out+the+incestuous+person%2C+nor+could+they+all+be+taxed+for+omitting+that+duty%2C+if+they+had+not+power+to+excommunicate.+2.+Neither+can+the+Spirit+of+God+complaint+that+the+judges+builded+Zion+with+blood%2C+and+the+heads+of+the+house+of+Jacob+and+princes+of+the+house+of+Israel+did+abhor+judgement+and+pervert+equity%2C+as+the+prophets+say%2C+nor+could+they+be+condemned+as+roaring+lions+and+ravening+wolves%2C+as+the+prophet+says%3A+for+the+judge+might+well+be+faultless+when+the+poor+were+crushed+in+the+gate+and+judgment+turned+into+gall+and+wormwood%2C+because+they+cannot+help+the+matter%3A+the+people+are+the+greatest+part+in+carrying+matters+in+judgment.+2.+We+see+David%E2%80%99s+practice+in+condemning+the+Amalakite+out+of+his+own+confession%2C+not+asking+the+people%E2%80%99s+consent%2C+and+in+condemning+to+death+Baanah+and+Rehab%2C+for+killing+Ishbosheth.+Solomon+gave+sentence+against+Adonijah%2C+Joab+%5Band%5D+Shimei+without+consent+of+the+people%3B+David+pardoned+Shimei+contrary+to+the+counsel+of+Zerviah%E2%80%99s+sons.+3.+If+from+the+people%E2%80%99s+witnessing+and+hearing+of+judgment+in+the+gate+we+conclude+%5Bthat%5D+the+people+were+judges+with+the+rulers%2C+there+was+never+a+time+when+there+was+no+king+in+Israel+and+no+judge+to+put+evil+doers+to+shame%2C+but+every+man+did+what+seemed+good+in+his+own+eyes%2C+contrary+to+Scripture+because+all+are+a+generation+of+kings+and+princes+no+less+than+the+ruler+himself%2C+as+Anabaptists+teach.+By+the+doctrine+of+our+brethren%2C+I+deny+not+but+he+that+gathered+sticks+on+the+Sabbath+was+brought%2C+Num.+15%3A33%2C+to+Moses+and+to+Aaron+and+to+all+the+congregation%2C+but+the+congregation+signifies+not+the+common+multitude.+For+%5Bverse%5D+35%2C+Moses+received+the+sentence+from+God+and+pronounced+it%2C+and+the+congregation+stoned+him+to+death%3B+and+Num.+27%3A1%2C+The+daughters+of+Zelophehad+stood+before+Moses%2C+Eleazar+and+before+the+princes+as+judges%2C+and+before+all+the+congregation+as+witnesses%2C+not+as+judges%3A+but+vv.+6-7%2C+Moses+gave+out+the+judicial+sentence+from+the+Lord%E2%80%99s+mouth.+And+1+Kings+21%3A12%2C+Naboth+stood+in+presence+of+the+people+to+be+judged%2C+but+the+nobles+and+princes+were+his+judges%2C+because%2C+v.+8%2C+Jezabel+wrote+to+the+nobles+and+princes+that+v.+10%2C+they+should+carry+out+Naboth+and+stone+him%2C+to+wit%2C+judicially%2C+and+v.+11%2C+the+nobles+and+princes+did+as+Jezabel+had+sent+unto+them.+And+Jeremiah%2C+ch.+26%2C+pleaded+his+cause+before+the+princes+and+people%2C+for+v.+10%2C+the+princes+%5Btext+in+Hebrew%5D+set+down+%28judicially%29+in+the+entry+of+the+new+gate+of+the+Lord%E2%80%99s+House%3A+nothing+can+be+gathered+from+the+place+to+prove+that+the+people+judged%2C+but+because+Jeremiah+spake+to+the+princes+and+the+people%2C+who%2C+verse+24%2C+were+in+a+fury+and+rage+against+Jeremiah%2C+if+Ahikam+had+not+saved+him+from+their+violence.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+...+%281644%29%2C+Ch.+3%2C+Section+3%2C+Question+4%2C+%E2%80%98Whether+or+No+is+there+a+Necessity+of+the+Personal+Presence+of+the+Whole+Church+in+All+the+Acts+of+Church-Censures%3F%E2%80%99%2C+pp.+41-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe20a76224e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e20a76224e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=1st%20Distinction.%20There%20be%20odds%20betwixt,not%20saved%20him%20from%20their%20violence&amp;text=1st%20Distinction.%20There%20be%20odds%20betwixt%20a%20free&amp;text=Ahikam%20had%20not%20saved%20him%20from%20their%20violence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We do observe beautiful things through our senses, but the property by which they are beautiful is not perceivable through the senses. Animals have perceptions and representations of beautiful things, but they do not know the beautiful. They know only the useful and the pleasant. For that reason, the perception and recognition of the beautiful, also in sensory things, belongs to the higher faculty of knowing, to reason… Beauty is something that the beholding of which delights a person. Something is good insofar as it, when it is recognized by us, is desirable to our will. But beauty is what stimulates not our desire in a narrow sense, but our pleasure.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-45d4a14433" data-kw="">
<blockquote><p>24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments.

26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. …

29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter.

30. Universal calling to salvation neither was, nor is, nor will be.

31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span><span class="t"><a href="../topics/application-of-redemption-in-general/order-of-salvation.html">Order of Salvation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14f9d5ee14" data-kw="">
<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Use of Reason in Matters of Faith’ in Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, pp. 226-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-5ce1756f65" data-kw="">
<blockquote><p>Warfield, following the Scottish Reformation, made the case that all humans can use reason to know God. This isn’t a statement about the noetic effects of the fall but a statement about reason. Reason makes God known. Reason is that by which we understand anything at all. It is not simply a first principle because we use reason even to form first principles. Reason is transcendental, meaning it cannot be questioned because it makes questioning possible. We use reason to form beliefs about nature, and we use reason to form beliefs about scripture. Humans are fallen having a darkened mind meaning they have rejected reason and for that they are without excuse. Reason and argument are still there to reveal their condition in unbelief and its consequences. Warfield is speaking of reason as the laws of thought (right reason), Kuyper of man’s reasoning process. Warfield’s definition is more basic. It is the failure to correctly define reason that allowed the challenges of Hume and Kant to the knowledge of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/owen-anderson.html">Owen Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Natural Theology &amp; the Clarity of General Revelation’</cite>, (2022)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>nature; a term having three primary meanings in scholastic theology and in Protestant orthodox usage: (1) essence; (2) a particular kind or species of essence in its actual existence; (3) the entire physical universe and its phenomenon… In the third sense, natura simply refers to the order of nature and is used in such terms as lex naturalis (q.v.), natural law, or theologia naturalis (q.v.), natural theology–the law implicit in the order of the phenomenal world and the knowledge of God obtainable from examination of the physical universe.</p></blockquote>

<blockquote><p>Paley’s argument presupposes that teleology is extrinsic; Aquinas follows Aristotle in holding that it is immanent to the natural order. Paley therefore focuses on complex phenomena, especially biological phenomena, as uniquely indicative of teleology; Aquinas takes all natural phenomena, however simple or complex and whether organic or inorganic, to manifest teleology. Paley is presenting a cumulative and probabilistic “argument to the best explanation”; Aquinas is putting forward a metaphysical demonstration… But Paley is at least seriously threatened by it [Darwinian evolution], while the Fifth Way is not threatened by it at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147, p. 82</span></figcaption>

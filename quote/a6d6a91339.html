<blockquote><p>III. The law of the decalogue or ten commandments is a declaration of the law of nature and a picture of the image of God.

We also believe that this law is a declaration of the law of nature, which was written in the hearts of the first men perfectly, of others imperfectly and but in part, and therefore by this law is condemned whatsoever is not agreeable to that image of God, whereunto man was created, and is commanded whatsoever is agreeable to the same.

For God would shew by that law what man was in his first estate and what he was made in the second estate and what manner one he ought to be and further what he should afterwards be in the third estate in part, and what perfectly in the fourth by Christ. So that the law is nothing else but a true and lively picture of the image of God, to which man was created, whereby we are instructed what we were, what we are, what we ought to be and indeed what we shall be, if we trust in Christ.</p></blockquote>

<blockquote><p>It cannot be denied that there is in our nature a strong tendency to formalism in religion. Formalism is, indeed, a compromise between conscience and the love of the world. The mind does not readily rest in infidelity; and does not love God or holiness. The resultant of these two forces is often the adoption and strenuous advocacy of a form of religion, which is enough like the truth to appease the conscience, yet which has not life enough to conquer worldly-mindedness. And if this form of godliness can be decorated with a splendid and captivating drapery, which appeals to the imagination, and gratifies the taste, its reception is all the more welcome, and its power the more absolute.

This tendency to exalt and rest in whatever appeals to the senses, is manifested in every part of the world, and in all ages of time. It stands boldly forth in all those systems of religion which man has devised for himself And even a true religion has not unfrequently so degenerated, as to be given up to its sway. Thus it was that that system of truth given by God as the forerunner of Christianity had so yielded to this principle, that its most prominent advocates were chargeable with having a form of godliness, but denying the power of it.

And the Church of Christ, simple and spiritual as it is, has not escaped this malign influence. Her history tells too plainly that altars and crosses, vestments and genuflections, penances and pilgrimages, have usurped the place of, and driven into exile the humble and loving service of the heart. And thus men painfully earn a name to live while they are dead. And just in proportion as the spirit of Christianity has been suppressed the power of forms has augmented. The form of the cross is most frequently found where the doctrines of the cross are least known.

It is not strange, therefore, that our Lord so shaped his dispensation of truth as to come in violent conflict with this dangerous tendency of our nature. We are prepared to hear his declaration to the woman of Samaria, “Believe me, the hour cometh when ye shall neither in this mountain nor yet in Jerusalem worship the Father. But the hour Cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth.” And in precise accordance with the truest wisdom, philosophical as well as religious, our Saviour established a system, which above all others the world has ever seen, was simple in its form.

There must necessarily be a form of truth; for we are not purely spiritual beings. There must be an organized manifestation of our faith. Hence religion must have its sacred times and places, its ordinances and decent observances. But while this demand of our nature is fully met in the promulgation of the truth as it is in Jesus, care is taken that it shall not have unlimited sway. We have a visible organization of the Church, with its ordinations; baptism and the supper; and its government by bishops and elders.

But lest these few and simple ordinances should assume too high a place in our esteem and confidence, we are reminded, both by precept and example, that they are but channels of grace, and not its authors—that to the worthy receiver alone, they become means of salvation. In short, that they have no inherent efficacy, and no indispensable connection with spiritual life, and that if need be, we can worship God acceptably without any or all of them. The external and the internal are combined, but each is kept in its proper place. “He that believeth and is baptised shall be saved.” “If thou shalt believe in thy heart, and confess with thy mouth, the Lord Jesus, thou shalt be saved.” “For with the heart, man believeth unto righteousness, and with the mouth, confession is made unto salvation.”

In the Christian system form is the handmaid of spirit, and ministers to its ends, and is only valuable as it does so. When, therefore, the form assumes the prominent place, and becomes the end when the majestic temple with its heaven-piercing pinnacles, and cloudlike dome, its splendid paraphernalia, and its imposing ritual, draw the eyes and the heart away from the truth to themselves, they become not only useless but prejudicial. They become at once usurpers of the place and rebels against the authority of the king of truth.</p></blockquote>

</figure><figure class="quote" id="q-928c8e93dd" data-kw="">
<blockquote><p>Hence, although these do not now require a grace more joyous for the present, they nevertheless need a more powerful grace; and what grace is more powerful than the only-begotten Son of God, equal to the Father and co-eternal, made man for them, and, without any sin of His own, either original or actual, crucified by men who were sinners? And although He rose again on the third day, never to die any more, He yet bore death for men and gave life to the dead, so that redeemed by His blood, having received so great and such a pledge, they could say, “If God be for us, who is against us? He who spared not His own Son, but delivered Him up for us all, how has He not with Him also given to us all things?”

God therefore took upon Him our nature—that is, the rational soul and flesh of the man Christ—by an undertaking singularly marvellous, or marvellously singular; so that with no preceding merits of His own righteousness He might in such wise be the Son of God from the beginning, in which He had begun to be man, that He, and the Word which is without beginning, might be one person. For there is no one blinded by such ignorance of this matter and the Faith as to dare to say that, although born of the Holy Spirit and the Virgin Mary the Son of man, yet of His own free will by righteous living and by doing good works, without sin, He deserved to be the Son of God; in opposition to the gospel, which says, “The Word was made flesh.” For where was this made flesh except in the Virginal womb, whence was the beginning of the man Christ?

And, moreover, when the Virgin asked how that should come to pass which was told her by the angel, the angel answered, “The Holy Ghost shall come over on to thee and the power of the Highest shall overshadow thee, therefore that holy thing that shall be born of thee shall be called the Son of God.” “Therefore,” he said; not because of works of which certainly of a yet unborn infant there are none; but “therefore,” because “the Holy Ghost shall come over on to thee, and the power of the Highest shall overshadow thee, that holy thing which shall be born of thee shall be called the Son of God.”

That nativity, absolutely gratuitous, conjoined, in the unity of the person, man to God, flesh to the Word! Good works followed that nativity; good works did not merit it. For it was in no wise to be feared that the human nature taken up by God the Word in that ineffable manner into a unity of person, would sin by free choice of will, since that taking up itself was such that the nature of man so taken up by God would admit into itself no movement of an evil will. Through this Mediator God makes known that He makes those whom He redeemed by His blood from evil, everlastingly good; and Him He in such wise assumed that He never would be evil, and, not being made out of evil, would always be good.</p></blockquote>

<blockquote><p>WHEN the Son of God became the Son of man, he so became the Son of man as still to remain the Son of God. He did not lay aside his Divine nature to assume the human; but he assumed the human nature into the Divine, not as it was corrupted by sin, but as it was at first created by God. For as it was corrupted by sin, it was corrupted with the worst of evils, and therefore, as such, both unworthy and uncapable of being united to God, the best of goods. Who therefore assuming the human nature into the unity of his Divine Person, assumed only what was worthy and capable of such assumption, to wit, the perfect nature of man as it was in its first creation, not as it was in its sinful corruption. And so he that was perfectly God as well as perfectly man, was a perfect man also as well as a perfect God.

Because it was the perfect nature of man which he assumed from his mother in time, as it was the perfect nature of God which he received of his Father from eternity. And therefore as he in the truth of the Divine nature was begotten like unto the Father in all things, his personal properties only excepted; so in the truth of the human nature he was made like unto us in all things, our sinful infirmities only excepted. He was in all things but sin like unto us; but in sin he was altogether unlike us. For we both in flesh and spirit are naturally full of sin, but he was clearly void of sin both in his flesh and spirit.

For he came to be a Lamb without spot, who by sacrifice of himself once made should take away the sins of the world: whereas had he been guilty of sin in himself, he could never have taken it away from us. … As God, he was infinitely contrary unto sin; and as man, he was perfectly void of it: yea he was therefore as man perfectly void of sin, because as God he was infinitely contrary to it; it being impossible that such things as are infinitely contrary to one another should be ever united together.</p></blockquote>

<blockquote><p>Q. Can you prove directly by the Scriptures, that Christ, after the union of the man-hood with the God-head, is true God?

A. Yea verily: for first, the Scripture, (as he is Christ the Messias) absolutely calleth him God, and giveth unto him the name of Jehovah. 1. Tim. 3. 16. Joh. 20. 28. Act. 20. 28. Rom. 9. 5. 1. Joh. 5. 20. Esa. 9. 6. Jerem. 23. 2. Secondly, the proper works of God are attributed unto him; as the creation and government of the world. Joh. 1. 3. &amp; 5. 17. Coloss. 1. 16. Hebr. 1. 2. 3. The searching of hearts. Mat. 9. 4. Mark. 2. 8. &amp;c. Thirdly, the Essential Attributes of the Divine nature are given to him, he is said to be eternal. Joh. 1. 1. &amp; 17. 5. Micah. 5. 2. Almighty, in all places, the King of Kings, &amp;c. Joh. 3. 31. Math. 18. 20. Apocal. 19. 16. Fourthly, the Scriptures assign Divine honour unto him. Psalm. 72. 11. Rom. 15. 12. Esa. 11. 10. Joh. 14. 1. Act. 7. 59.

Q. But is not the God-head, and man-hood at least mingled and confounded.

A. No, by no means. For then he should be neither God, nor man; for things mingled do not retain the name of their simples; as honey, and oil mixed together, can neither be called honey nor oil. Further, the properties of the two natures are such, as cannot be mingled and confounded. For neither can the Human nature, (remaining a true human nature) partake, or communicate of the properties and perfections of the Deity, or the Deity of the defects of the Humanity. So that as the God-head cannot hunger, thirst, or be shut up and circumscribed within the bounds of a place: no more can the Humanity be infinite, or in more places then one. So that though the human nature be no person of it self, and hath no subsistence, but in the person of the Deity, yet it continueth still distinct in substance, properties, and actions, from the Deity; and both natures so united, make but one Christ.

Q. Why was it necessary that Christ should be both God and man in one person?

A. It was necessary he should be man, because he could not suffer as he was God; and it makes most for the glory of God’s Justice, to exact satisfaction from that nature that had sinned. Secondly, it was necessary he should be God also, that he might be able to bear and overcome all that was to be inflicted upon him for our sins. Thirdly, it was necessary also that the human nature should (in manner aforesaid) be united to the person of the Deity, that the obedience which he performed, might be of infinite merit, as being the obedience of God.

Q. What further fruit have we by this conjunction?

A. That whereas God hath no shape comprehensible, either to the eye of the body, or of the soul; and the mind of man cannot rest but in a representation of some thing, that his mind and understanding can in some sort reach unto. If it consider God in the second person in the Trinity, as he hath taken our nature, and whereby God is (after a sort) revealed in the flesh, he hath whereupon (in some sort) to stay his mind.</p></blockquote>

and+hath+no+subsistence%2C+but+in+the+person+of+the+Deity%2C+yet+it+continueth+still+distinct+in+substance%2C+properties%2C+and+actions%2C+from+the+Deity%3B+and+both+natures+so+united%2C+make+but+one+Christ.%0A%0AQ.+Why+was+it+necessary+that+Christ+should+be+both+God+and+man+in+one+person%3F%0A%0AA.+It+was+necessary+he+should+be+man%2C+because+he+could+not+suffer+as+he+was+God%3B+and+it+makes+most+for+the+glory+of+God%E2%80%99s+Justice%2C+to+exact+satisfaction+from+that+nature+that+had+sinned.+Secondly%2C+it+was+necessary+he+should+be+God+also%2C+that+he+might+be+able+to+bear+and+overcome+all+that+was+to+be+inflicted+upon+him+for+our+sins.+Thirdly%2C+it+was+necessary+also+that+the+human+nature+should+%28in+manner+aforesaid%29+be+united+to+the+person+of+the+Deity%2C+that+the+obedience+which+he+performed%2C+might+be+of+infinite+merit%2C+as+being+the+obedience+of+God.%0A%0AQ.+What+further+fruit+have+we+by+this+conjunction%3F%0A%0AA.+That+whereas+God+hath+no+shape+comprehensible%2C+either+to+the+eye+of+the+body%2C+or+of+the+soul%3B+and+the+mind+of+man+cannot+rest+but+in+a+representation+of+some+thing%2C+that+his+mind+and+understanding+can+in+some+sort+reach+unto.+If+it+consider+God+in+the+second+person+in+the+Trinity%2C+as+he+hath+taken+our+nature%2C+and+whereby+God+is+%28after+a+sort%29+revealed+in+the+flesh%2C+he+hath+whereupon+%28in+some+sort%29+to+stay+his+mind.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+treatise+of+Christian+religion.+Or%2C+the+whole+body+and+substance+of+divinity%2C+%282nd+edn%2C+London%3A+Thomas+Man%2C+1616%29%2C+pp+172-73.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd39a59fb42.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d39a59fb42.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/01/02/thomas-cartwright-on-the-hypostatic-union/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

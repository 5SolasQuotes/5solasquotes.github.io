</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69c3303193" data-kw="">
<blockquote><p>But as this peace among Protestant Churches is very much to be wished and prayed for, so I despair to see so glorious a work take effect, except the differing parties would resolve to stand to the rules following: 1. That the respective parties which agree in the chief points of religion do not make any of those points they differ in, fundamental, as if the fortune of religion depended upon it, or as if those different points were so many different religions. 2. That the differing parties do not damn one another for those differences, there being nothing that has done religion more hurt than men’s damning one another for things which Christ and his apostles have affixed no damnation to. 3. That notwithstanding the little differences that are among them, they make one Church and endeavour after the welfare and prosperity of it, and join together in public prayer and in the sacrament of the eucharist, which is the badge and symbol of fraternity and amity. 4. That one party be not presently jealous and suspicious of the other, as if the opinion which one party espouses were embraced or maintained in a humor or for worldly ends, but that they charitably believe it’s conscience that puts them upon it, at least till either the party espousing that opinion confesses that conscience is not at the bottom of it or that it appear by undeniable evidences that a worldly or sinister design is the foundation of it. 5. That the differing parties do not multiply the controversies which are amongst them, make them neither more numerous nor greater than really they are, and that they do not interpret an accidental unwary expression that may drop from the pen or mouth of one party as a new controversy. 6. That one party do not charge the other with consequences which they do not own, nor with doctrines and positions which they detest from their hearts. 7. That each party defending or proving their opinion do it with great modesty, without provoking or exasperating or approbrious language and revilings or bitter reflections on the other. 8. That of these differing parties none do vie with the other except it be in living up to the precepts of the Gospel, particularly those of patience, long-suffering and charity. These rules I apprehend to be the foundation of peace and concord of Protestant Churches that differ in points of no great concernment; and were these maxims once put in practice, the particular controversies might soon be compromised. To this purpose is that saying of the apostle: ‘Nevertheless, whereto we have already attained, let’s walk by the same rule, let’s mind the same things; and if any be otherwise minded, God will even reveal that unto you,’ Phil. 3:15-16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697)</cite>, pp. 34-37</span></figcaption>

 it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-38d5a0ab65" data-kw="">
<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>

<blockquote><p>Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical... (London: 1610) | 2nd Likelihood</cite>, p. 48</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Those, though otherwise never so godly, that separate from true Churches, like Novatus and Lucifer, for a stricter course of discipline; like Donatus for some bad ones in the Church, as they supposed; like Andius for some lesser corruptions and abuses, they be schismatics. This is the judgment of ancient Churches, for which see at large, Mornay, On the Church, p. 35. But our late Separatists do divide themselves from us upon like grounds: for a more strict discipline with Novatus and Lucifer; for that good and bad are mixed together, with Donatus; and from lesser corruptions among us with Andius. Therefore are these also schismatics.”

<blockquote><p>It is true indeed, the apostle in his epistle to the Galatians, is very severe against some false teachers; which yet does not weaken, but really confirm the necessity of this forbearance and toleration. For those teachers were themselves against tolerating others, and would have the ceremonies of the Law imposed upon all Christians, as things necessary to salvation; by which means the Christian faith would have been greatly corrupted. And at the same time that he so sharply inveighs against these teachers, he is very large in recommending charity and forbearance, even in so freat a diversity of opinions as this was; and commands that “they who were overtaken in a fault, should be restored in the spirit of meekness;” (Gal. 5:13-15) and that “they should bear one another’s burdens.” (Gal. 6:1-2) And at last, when he had told them that the essence of Christianity did not consist in circumcision, or uncircumcision, i.e. in observing or omitting the ceremonies of the Law, but “in the new creature,” i.e. in true and real holiness; he adds these words, wherein he most affectionately desires, as well as commands, a mutual forbearance among persons who differ in things not fundamental; “and as many as walk according to this rule,” i.e. that agree in the essentials of Christianity, and form their lives according to this rule, “Peace be upon them, and mercy, and upon the Israel of God.” (Gal. 6:15-16)… And if we turn out thoughts to the following circumstances, we shall plainly perceive of how great weight these things are to recommend the like forbearance among Christians in these days: 1. The apostles were infallible, and if they would not attempt to compose these differences by exerting their authority, but chose to recommend forbearance on both sides, how much more should we take the like course, who have not the least pretences to infallibility? 2. The dispute was not about a trifle, but a very weighty affair, even the difference between the Law and the Gospel; a thing that did not consist in mere speculation, but had a great influence both upon practice and worship. Alas! How many trivial controversies in comparison of this do sour the minds of Christians in these days? 3. Both sides were furnished with very considerable arguments, the one a Law given by God, the other the defense of Christian liberty. 4. St. Paul himself, who so strenuously urged this forbearance, had before such a flaming zeal for the Law, that he was even mad for it. 5. Lastly, these precepts of forbearance were given after the vision from Heaven to Peter, and after the apostolic synod; so that these controversies had been sufficiently determined already, by this vision, and by the decree of the apostles. Whoever therefore shall seriously consider these circumstances, and weigh them impartially, can’t surely but conclude that these apostolical precepts of forbearance, if they had any weight in their times, ought to have much more in our times, and in the present controversies.</p></blockquote>

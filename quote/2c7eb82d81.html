<blockquote><p>Respect the sacramental table to which you have approached, the bread of which you have partaken, the cup in which you have communicated, being consecrated by the sufferings of Christ.5 5. Note that this allusion implies that Communion in both Kinds was given separately, as in the Anglican Church, not by intinction, as in the present Orthodox Eastern Church. Gregory Nazianzen | “Select Orations of Saint Gregory Nazianzen,” in S. Cyril of Jerusalem, S. Gregory Nazianzen, ed. Philip Schaff and Henry Wace, trans. Charles Gordon Browne and James Edward Swallow, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), 40.31 (p. 371). The first mention of intinction in the West, is at Carthage in the fifth century. We know it was practised in the seventh century and by the twelfth it had become general, to give place to the withdrawal of the chalice altogether in the West. Henry R. Percival | “The Canons of the 318 Holy Fathers Assembled in the City of Nice, in Bithynia,” in The Seven Ecumenical Councils, ed. Philip Schaff and Henry Wace, vol. 14, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Charles Scribner’s Sons, 1900), 31. All forms of intinction had virtually disappeared in the W. by c. 1200. The third form (dipping the Host into the consecrated wine) has been sporadically revived in modern times in the Anglican Communion as a method both of reservation and of giving Communion to the sick. F. L. Cross and Elizabeth A. Livingstone | eds., The Oxford Dictionary of the Christian Church (Oxford; New York: Oxford University Press, 2005), s.v. “Intinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds., S. Cyril of Jerusalem, S. Gregory Nazianzen, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-118969d3d1" data-kw="institution">
<blockquote><p>The other sacrament of the New Testament is the holy Supper, in which, by the distribution and reception of broken bread and poured-out wine, is declared and sealed to believers the communion of the body of Christ broken for them on the cross and of his blood shed for them unto eternal life. The more illustrious and of greater moment to the consolation of believers this mystery of the Christian religion is, with so much the greater violence has Satan always endeavored to obscure and corrupt it in order to deprive the church of this inestimable treasure. Hence it has happened that in no part of religion have such prolix and animated disputations been raised up, so that at length the Romanists seem to have constituted the sum of theology in this article, nor is there anything in theology or philosophy which they have not brought to bear upon this and compelled to serve their purpose. Various names by which it is usually expressed: (1) the Lord’s Supper (1 Cor. 11:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.21.1</span></figcaption>

</figure><figure class="quote" id="q-4e9e9a1064" data-kw="">
<blockquote><p>2nd, from the significancy of the symbol; since bread, as the principal natural nourishment of our bodies, represents his flesh, which, as living bread, he gave for the life of the world.–– John 6:51 . But the kind of bread, whether leavened or unleavened, is not specified in the command, nor is it rendered essential by the nature of the service. Christ used unleavened bread because it was present at the Passover. The early Christians celebrated the Communion at a common meal, with the bread of common life, which was leavened. The Romish Church has used unleavened bread ever since the eighth century, and commands the use of the same as the only proper kind, but does not make it essential (“Cat. Conc. Trident.,” Pt. 2, ch. 4:, &amp;&amp; 13 and 14). The Greek Church insists upon the use of leavened bread. The Lutherans Church uses unleavened bread. The Reformed Church, including the Church of England, regards the use of leavened bread, as the food of common life, to be most proper, since bread in the Supper is the symbol of spiritual nourishment. The use of sweet cake, practiced in some of our churches is provincial and arbitrary, and is without any support in Scripture, tradition, or good taste.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quotes was compiled by Andy Webb</cite></span></figcaption>

d%2C%20from%20the%20significancy%20of%20the%20symbol%3B%20since&amp;text=any%20support%20in%20Scripture%2C%20tradition%2C%20or%20good%20taste" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In the mean while Satan, using every exertion to subvert entirely the church erected at Geneva, which had been shaken to its very foundation, found in a short time some idle characters, who, for the purpose of concealing the great iniquity of the decree under the pretext of religion, determined that unleavened bread should be substituted for common, formerly used at the Lord’s table, with a view to afford an opportunity for fomenting new dissensions. And the great enemy of the Church would have succeeded in this plan, had not Calvin seriously admonished some good men, so displeased with the change as to consider it their duty to refrain from taking the Lord’s Supper, not to contend about a subject in itself indifferent. The use of unleavened bread commenced in the manner now stated, nor did Calvin on his future restoration think it worth while to make any opposition to the practice, though he [Calvin] did not attempt to conceal his approval of the use of common bread.</p></blockquote>

<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.”

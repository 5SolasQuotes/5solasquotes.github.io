<main class="wrap"><figure class="quote" id="q-ea17e97a15" data-kw="">
<blockquote><p>The word here usually translated Offence, is not meant so much, sin in it self, as commonly they are called Offences, as they are indeed against both God and man. But the word offence is here taken for a peculiar effect or fruit that follows on the evil behaviour of men; and therefore is well translated Scandals, it being the Greek word here used, and it properly signifies that crooked piece of wood, to the which the bait in a Trap is fastened, which while the Mouse or other thing doth gnaw or move, it pulls the Trap on it self. It is also any block that is cast in one’s way, whereby one may be endangered to stumble and fall, and so figuratively it is used in Scripture for every public and open evil and sin, whither word or deed which while others do endeavour to follow by his example and authority, that did it or spake it, being allured, as with a bait, they entangle themselves in the Devil’s trap or snare; or thereby they are made to stand still or fall in the right way. And therefore this word is interpreted, by a departing as may appear by comparing, Math. 13.21. With Luke, 8.13. For that which in the one place is called a Scandalizing, in the other is called a Falling away: And Rom. 14.13. It is directly called a stumbling-block, whence a Scandal may be defined to be any word or deed, giving occasion to any of falling into sin, or of falling away from the received truth or practice of Piety, or doth cause a negligence in the same.

Now these Scandals are of two sorts. First, given. Second, taken. Scandals given, are all wicked sayings, and deeds, repugning the love of God and of our neighbour, and whereby the former effects are occasioned, and these are either in matters of Doctrine, or in life and manners. Thus all false and erroneous Doctrines, as of Jews, Turks, Infidels, and Papists, are great means whereby many are with-held from the right way to Salvation; but especially the Papists are hereby a great scandal unto the Jews who live among them; for they seeing Idols so usual in their Churches and Practices, which they justly abhor; they are made thereby to loath Christian Religion. Again, all prophane and irreligious speeches of God and his worship, are of this kind, as Mal. 3.14. All blasphemous contumelies and reproaches of the truth of Paul’s Doctrine was Scandalized, Rom. 3. at the beginning, Rom. 6. and Rom. 7. And our Doctrine of Justification, Free-will, with other necessary truths, are so perverted by the Papists to their followers, that thereby great offense is given to the ignorant.

So for wicked actions, they are Scandals, for thereby other are encouraged to evil, or made not so much to fear them (Math. 16.17.) Thus the incest of the Corinth. 1 Cor. 5. For the Scandal of the contagion is called a Leaven. And so scandals given are by all sorts of wicked men professing Christ but especially by such who being forward and zealous in Religion, do either grow unsound, decaying or dissolute. The neglect also of good things, whither private, or such as belong to publique callings, whether Civil or Ecclesiastical. As the Magistrate’s Scandal is, when he doth not his duty in punishing wickedness and cherishing the good; the scandal of Ministers is, when they are negligent and careless in their Ministry: and here chiefly, Nonresidency and unsufficiency are grievous scandals; for hereby men are exceedingly weakened in the course of Piety, by the example of such as are counted wise and learned, and so such as whose example might safely be followed. And thus were the Pharisees a great Scandal to the common people of the Jews, as Christ charges them. Math. 23 They would not let the people enter into Heaven:

There are also Scandals given, not only in doing things unlawful in themselves, but in things indifferent, which are not evil in themselves. Thus Peter was a great Scandal, by his eating and living as the Jews, so that Barnabas was stumbled by it; and this Paul teaches plainly. Rom. 14.13, 14, 15, 16. 1 Cor. 8. and 9. chap. For though the nature and use of these things be always lawful in themselves, yet it may be offended in the external usage of them; for thereby another may be hindered, either from the truth or Piety, as is seen, 1 Cor. 6.12.

The second sort of Scandals, are such as are taken, not given. That is, that are of such nature of themselves as might incite to Piety, and might confirm in truth, but yet are abused to the contrary. And thus every word or action, good in it self, may be the matter of Scandal, being taken to be evil, whither it be done slanderously out of malice, or out of weakness through ignorance. And that these are not to be blamed, it may appear, for even the most holy things are within this compass: All these Scandals may be referred to three chief heads. First, the word of God. Second, the works of God. Third, the godly, their sayings and doings. For the first, the word of God is a Scandal, in either part of it, whither the Law or the Gospel. The Law is to many a Scandal, either through ignorance or wilfulness. Thus the Jews were Scandalized through a carnal zeal they bare to the Lord; thus Rom. 9. The Law is a Scandal to out corruption, which while the Law restrains, it rages more and takes occasion to work Concupiscence and death. Thus also the impossibility of the Law is a great Scandal to ignorant men, they not conceiving how it should be just with God to command things impossible, to corrupt nature.</p></blockquote>

<blockquote><p>…it is further confirmed by that great scandal whereby Peter compelled the Gentiles to judaize, Gal. 2:14. ‘He constrained them,’ says Perkins (Commentary on Gal. 2:14), ‘by the authority of his example, whereby he caused them to think that the observation of the Ceremonial Law was necessary.’ It was then the quality of his action which made the scandal active, because that which he did was inductive to sin; but we are not to think that Peter had an intention to draw the Gentiles to sin. (tome 1, an. 55, n. 39)</p></blockquote>

</figure><figure class="quote" id="q-fa1d17a117" data-kw="">
<blockquote><p>Let us then bring our hearts to holy resolutions, and set ourselves upon that which is good, and against that which is evil in ourselves or others, according to our callings, upon this encouragement, that Christ’s grace and power shall go along with us. What had become of that great work of reformation of religion in the latter-spring of the gospel, if men had not been armed with invincible courage… that the cause was Christ’s, and that He would not be wanting to his own cause. Luther igenuously confessed that he carried matters often inconsiderately, and with mixture of passion. But upon acknowledgement, God took not advantage of his errors, but the cause being God’s, and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>

<blockquote><p>There is no scandall taken, but (if it be known to be taken, and the thing at which it is taken be not necessary) it is also given. … 2. Giving and not granting that the scandal of them who were first offended at the ceremonies [c. 1618] was only passive, yet the using of them after scandal is known to rise out of them, must be an active scandal, because the keeping of a thing which is not necessary, after scandal rises out of it, is an active scandal, though the scandal which at first rose out of it, had been only passive…</p></blockquote>

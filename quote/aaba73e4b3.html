<main class="wrap"><figure class="quote" id="q-aaba73e4b3" data-kw="">
<blockquote><p>By nature we are all inclined to superstitions, and once we let them into our lives they soon take us over. Just as plants that have put down deep roots and become very strong cannot be uprooted at the whim of the gardener, so human minds that have been steeped in superstition retain the after-effects, and even if they have been taught better, they still incline in that direction. There are plenty of examples of this evil in the reformed churches. If a residue of papal leaven remains in them, it is almost impossible to get it out, no matter how hard you try.

There is nothing more important or more necessary than to uproot everything that needs to be thrown out, because otherwise those who try to do it later will be hindered by the example and authority of their predecessors and will get nothing but envy and hatred for their godly pains, as we can see in many places today. Particularly mistaken are those who put up with many things in the hope that better times will come, as if those times will somehow appear of their own accord. What is false and erroneous is also harmful and therefore should not be tolerated for a moment by anyone with the power to remove it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 69.</span></figcaption>

<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

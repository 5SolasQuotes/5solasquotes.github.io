<main class="wrap"><figure class="quote" id="q-f61e6e499f" data-kw="">
<blockquote><p>Doctrine. For we do take the same to be the pure doctrine of the Church, which comes from Christ, conveyed unto us by the apostles, which appointed us nothing of their own choice, but did faithfully prefer unto all nations the discipline which they received of Christ: in which is not heard the voice of any man, but of the only begotten of God, the true and only shepherd and teacher… The pure preaching of Christ’s Gospel does aright bear the first sign and token of the true Church… and so where the Gospel of Christ our Savior is taught, there is declared to be the Christian Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion</cite>, (1560; London, 1563) | ‘Of the Church’, fol. 259.b</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-60822eb805" data-kw="Councils">
<blockquote><p>Wherefore, though our opponents should name councils of thousands of bishops it will little avail them; nor will they induce us to believe that they are, as they maintain, guided by the Holy Spirit, until they make it credible that they assemble in the name of Christ: since it is as possible for wicked and dishonest to conspire against Christ, as for good and honest bishops to meet together in his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.2</span></figcaption>

</figure><figure class="quote" id="q-7c9d5dcde2" data-kw="">
<blockquote><p>…to speak somewhat of doctrine. I doubt not but you know how necessary a thing the knowledge of Christ’s doctrine is. For if the mind be stirred up with lively teachng, to put full confidence in Christ, and is after this confidence fully inflamed with the love of religion, honesty, and goodness, it is almost necessary all kinds of vices to reign there where no voice instructed with godly sentences is heard, Christ must needs be unknown there, where his benefits with all his acts lie unspoken of… You amongst all men are chosen for great causes, your honour is to restore Christ’s doctrine, and to appoint such as will and shall be able to teach the gospel, to amend the ceremonies, and to put a difference between the ministers of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-sturm.html">Johannes Sturm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Epistle that Johan Sturmius</cite>, … sent to the Cardinals and Prelates that were chosen and appointed by the Bishop of Rome, to search out the Abuses of the Church (London, 1538), no page number Sturm (1507–1589) was a German educator and Protestant reformer.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

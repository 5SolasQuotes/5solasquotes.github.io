<main class="wrap"><figure class="quote" id="q-e5458d921c" data-kw="">
<blockquote><p>Q. What is summarily required in this [Fourth] Commandment?

A. The setting apart of a special day, every week, wherein we are to separate our selves from our worldly businesses, and ordinary callings concerning this life, that we may wholly attend to the service and worship of God alone.

Q. What need is there of one whole day in a week, to serve God in, seeing we may serve him every day?

A. To the end, that we should not plunge our selves so deeply into the affairs of the world, as that we should not recover our selves; the wisdom of God hath thought it good, that one day in seven, there should be an intermission from them; that we might wholly separate our selves to the service of God, and with the more freedom of spirit perform the same.

Secondly, for that a whole day is needful, for the performance of all the parts of God’s worship; as hearing of public Prayer, and the Word preached, Catechizing, administration of the Sacraments, exercise of holy Discipline, &amp; consideration of the glory of God in the creatures. Thirdly, If Adam in his perfection had need of this help, much more have we, who are so grievously corrupted.

Q. Is there any one special day of the week, set apart by God himself?

A. Yea.

Q. What day is that?

A. The first day in the week, called the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 108-09.</span></figcaption>

<blockquote><p>One whole day in seven is of necessity to be kept holy. This the Scripture calleth by excellency the Sabbath Day, without a difference, as it were the elder brother to all the rest of the days of the week, which is called Sabbaths in the plural.

The parts of the sanctifying of this day are two: one, to rest from worldly businesses, and from those works and duties of our calling, which at other times are not only lawful, but expedient and necessary to be done. The particular works that we are thus to abstain from, are of two kinds: First, great as well as small, and small as well as great. A greater and more excellent work can hardly be imagined, then the building of God’s own House, the material and outward Tabernacle, yet even That the Lord by a strict &amp; precise caution doth specially forbid upon this day, Exod. 31. 13. Yet, saith he, ye shall observe my Sabbaths: Not setting your hand in that day unto this work, though it be most holy.

Those holy women that had Odours, Ointments, and all things in a readiness, yet in a religious observation of God’s Ordinance, forbear on the Sabbath to embalm the precious body of our Lord and Saviour Christ, and are commended by the Holy Ghost for it. They rested, saith LUKE, the Sabbath Day, according to the Commandment. Again, how small a thing is it to gather a few sticks! But when one presumed to do this, and with an high hand in profanation of the Sabbath, we know what his doom was from the mouth of God himself, Numb. 15. 32, 33, 34, 35, 36.

In the second place come things both necessary and delightful, of profit, and of pleasure. In seed time and in harvest the fittest seasons for all worldly commodities, thou shalt keep Sabbath, saith the Holy Ghost, Exodus 34. 21. Of this kind are travailing and journeying upon that Day; whereof the Law is given, Exodus 16. 29. Tarry every man in his place: Let no man go out of his place the seventh Day.

Likewise Fairs, Markets, and all kind of buying and selling: for which cause Nehemiah that godly Magistrate, When the gates of Jerusalem began to bee dark before the Sabbath, commanded to shut the gates, and charged that they should not be opened till after the Sabbath, and set some of his servants at the gates, that there should be no burden brought in upon the Sabbath Day.

Sporting also, banqueting, and such like, which distract our minds from God’s Service, are then to be avoided, which is that the Lord calleth, Not to do our own delight upon that Day, Esay 58. 13. The doing of which things, or of any of them, is contrary to this outward sanctifying of the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Sacred Divinity Briefly &amp; Methodically Propounded: More Largely &amp; Clearly Handled and Explained</cite>, (London: William Stansby, [1625]), 1.8, pp 169-70.</span></figcaption>

<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;”

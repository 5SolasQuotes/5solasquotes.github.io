<main class="wrap"><figure class="quote" id="q-4bef7517da" data-kw="">
<blockquote><p>He commanded the lepers cleansed to go to the priests, and offer their due, and his disciples to hear the scribes and pharisees in moses’s chair, etc. And yet: 1. The high priests were not of Aaron‘s line according to institution. 2. They bought the office of heathen Romans. 3. They had it not for life, according to institution. 4. Doctrine, worship, discipline and manners were heinously corrupted, so that the hearers were to beware of the leaven of their doctrine and not to imitate their lives. 4. They were bitter enemies of Christ and persecutors: yet Christ never bid his disciples to separate from anything but their errors; but says, ‘They shall cast you out of the synagogues.’ And doubtless Christ committed no sin; nor can we be so holy as He.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, pp. 14-15</span></figcaption>

<blockquote><p>The foregoing opinion [that the knowledge of God is self-evident] arose from their being accustomed from the beginning to hear and call upon the name of God. Now custom, especially if it dates from our childhood, acquires the force of nature, from which it happens that the mind holds those things with which it was imbued from childhood as firmly as though they were self-evident.</p></blockquote>

</figure><figure class="quote" id="q-7126d39207" data-kw="">
<blockquote><p>If I were with [the Cameronian minister] Mr. [James] Renwick, I would put him to call to mind the saying which at his parting I said to him, while he was requiring of me some memorable token, ‘Be not righteous over much, neither make thyself over wise; why shouldest thou destroy thyself?’ Now you understand not this; but remember that this I said to you, that sometime it shall be useful. Now it is time to live according to that word. Oh what need has he now of that admonition! If I were present with them that do adhere to Mr. Renwick, these that refuse to hear ministers, I would show them how great a sin schism is; and that the wrath of God is not far off from them who make and cherish separation. I with tears in the name of Jesus would beg that, leaving schism, they might live with their brethren in peace, love and unanimity. To decline union in every truth is nothing but pride and lordliness… if there be any that in his conscience thinks other ministers ought not to be heard, he errs in simplicity, and it is necessary that most quickly he leave that error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant: The Story of James Renwick (Blue Banner Productions, 2009)</cite>, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

kly%20he%20leave%20that%20error" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6bb519db25" data-kw="">
<blockquote><p>The presbyterians deny not but private men may preach in some cases. None that fear God do desire any to bury their talent, nor would hinder men from doing the work of God. But they would have bona bene [good things done well], God’s work done in God’s order. On these conditions we [congregationalists of Baxter’s stripe] allow private men to preach. 1. If they do it but ex charitate [out of charity], and pretend not to the ministerial office. 2. And if they do it occasionally, and not as men separated to that work as their calling (for then they become ministers indeed while they disclaim it in name). 3. If they do it not needlessly, to a proud ostentation of their parts, but only when abler men, or ministers, are not to be had or else [are] on some urgent weighty cause. 4. If they make not themselves the judges of their own fitness, but expect the approbation of the judicious, faithful, concordant ministers that know them. 5. If they undertake no more than they can perform, and suppose not themselves fitter than they are, and so run not beyond their knowledge, nor dishonor not the work of God. 6. If they thrust not themselves into any church to preach without a call, nor ordinarily without the pastor’s consent. 7. If they do it not unseasonably when by offending they are likely to do more hurt than good. 8. If in the manner, season and continuance they submit to the guidance of the pastors of the Church (if it be more than ordinary teaching, and not such as every able master of a family may there do). With these cautions we grant that private men may preach; many episcopal divines grant it: and the presbyterians ordinarily permit it in their expectants that are trained up for the ministry… And, says Dr. Fulke, Demetrius himself does seem to allow that when no bishop was present, a layman might preach: Eusebius, Ecclesiastical History, bk. 6, ch. 19 [sect. 15-18]. But that every proud unworthy man and every seducing heretick should preach, yea and thrust himself into other men’s charges, or that any should preach besides the forementioned rules, this we deny, and take it for a dangerous usurpation. But are we not agreed [with the presbyterians] in this? Hear and judge: Mr. [John] Cotton so downright denies ordinary private men to prophesy, interpreting 1 Cor. 14:31 of extraordinarily gifted prophets (of which see his Keys, pp. 20-21) that Mr. [Thomas] Goodwin and Mr. [Philip] Nye thought meet to signify some dissent, ‘Preface’, p. 6. And yet they grant, that this must be performed by private men: 1. Only occasionally, not in an ordinary course. 2. By men of such abilities as are fit for office. 3. And not assuming this of themselves, but judged such by those that have the power, and so allowed and designed to it. And, 4. So as their doctrine be subjected (for the judging of it) in an especial manner to the teaching elders of that church. And I think that this is enough to signify that here we shall have no cause of a breach with them [presbyterians]. Mr. [John] Norton speaks to the same purpose, pp. 123-25, and joins with Mr. Cotton in denying prophesy to private men and expounding 1 Cor. 14 of extraordinarily gifted prophets only: In this therefore doctrinally we agree [with the presbyterians].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing: I. A Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians, instanced in Ten seeming Differences… (1655 / 1667; London: 1691), ch. 10, difference 8</cite>, pp. 38-39</span></figcaption>

ing heretick should preach, yea and thrust himself into other men’s charges, or that any should preach besides the forementioned rules, this we deny, and take it for a dangerous usurpation. But are we not agreed [with the presbyterians] in this? Hear and judge: Mr. [John] Cotton so downright denies ordinary private men to prophesy, interpreting 1 Cor. 14:31 of extraordinarily gifted prophets (of which see his Keys, pp. 20-21) that Mr. [Thomas] Goodwin and Mr. [Philip] Nye thought meet to signify some dissent, ‘Preface’, p. 6. And yet they grant, that this must be performed by private men: 1. Only occasionally, not in an ordinary course. 2. By men of such abilities as are fit for office. 3. And not assuming this of themselves, but judged such by those that have the power, and so allowed and designed to it. And, 4. So as their doctrine be subjected (for the judging of it) in an especial manner to the teaching elders of that church. And I think that this is enough to signify that here we shall have no cause of a breach with them [presbyterians]. Mr. [John] Norton speaks to the same purpose, pp. 123-25, and joins with Mr. Cotton in denying prophesy to private men and expounding 1 Cor. 14 of extraordinarily gifted prophets only: In this therefore doctrinally we agree [with the presbyterians].”

— Richard Baxter, Church Concord, containing: I. A Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians, instanced in Ten seeming Differences… (1655 / 1667; London: 1691), ch. 10, difference 8, pp. 38-39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+presbyterians+deny+not+but+private+men+may+preach+in+some+cases.+None+that+fear+God+do+desire+any+to+bury+their+talent%2C+nor+would+hinder+men+from+doing+the+work+of+God.+But+they+would+have+bona+bene+%5Bgood+things+done+well%5D%2C+God%E2%80%99s+work+done+in+God%E2%80%99s+order.+On+these+conditions+we+%5Bcongregationalists+of+Baxter%E2%80%99s+stripe%5D+allow+private+men+to+preach.+1.+If+they+do+it+but+ex+charitate+%5Bout+of+charity%5D%2C+and+pretend+not+to+the+ministerial+office.+2.+And+if+they+do+it+occasionally%2C+and+not+as+men+separated+to+that+work+as+their+calling+%28for+then+they+become+ministers+indeed+while+they+disclaim+it+in+name%29.+3.+If+they+do+it+not+needlessly%2C+to+a+proud+ostentation+of+their+parts%2C+but+only+when+abler+men%2C+or+ministers%2C+are+not+to+be+had+or+else+%5Bare%5D+on+some+urgent+weighty+cause.+4.+If+they+make+not+themselves+the+judges+of+their+own+fitness%2C+but+expect+the+approbation+of+the+judicious%2C+faithful%2C+concordant+ministers+that+know+them.+5.+If+they+undertake+no+more+than+they+can+perform%2C+and+suppose+not+themselves+fitter+than+they+are%2C+and+so+run+not+beyond+their+knowledge%2C+nor+dishonor+not+the+work+of+God.+6.+If+they+thrust+not+themselves+into+any+church+to+preach+without+a+call%2C+nor+ordinarily+without+the+pastor%E2%80%99s+consent.+7.+If+they+do+it+not+unseasonably+when+by+offending+they+are+likely+to+do+more+hurt+than+good.+8.+If+in+the+manner%2C+season+and+continuance+they+submit+to+the+guidance+of+the+pastors+of+the+Church+%28if+it+be+more+than+ordinary+teaching%2C+and+not+such+as+every+able+master+of+a+family+may+there+do%29.+With+these+cautions+we+grant+that+private+men+may+preach%3B+many+episcopal+divines+grant+it%3A+and+the+presbyterians+ordinarily+permit+it+in+their+expectants+that+are+trained+up+for+the+ministry%E2%80%A6+And%2C+says+Dr.+Fulke%2C+Demetrius+himself+does+seem+to+allow+that+when+no+bishop+was+present%2C+a+layman+might+preach%3A+Eusebius%2C+Ecclesiastical+History%2C+bk.+6%2C+ch.+19+%5Bsect.+15-18%5D.+But+that+every+proud+unworthy+man+and+every+seducing+heretick+should+preach%2C+yea+and+thrust+himself+into+other+men%E2%80%99s+charges%2C+or+that+any+should+preach+besides+the+forementioned+rules%2C+this+we+deny%2C+and+take+it+for+a+dangerous+usurpation.+But+are+we+not+agreed+%5Bwith+the+presbyterians%5D+in+this%3F+Hear+and+judge%3A+Mr.+%5BJohn%5D+Cotton+so+downright+denies+ordinary+private+men+to+prophesy%2C+interpreting+1+Cor.+14%3A31+of+extraordinarily+gifted+prophets+%28of+which+see+his+Keys%2C+pp.+20-21%29+that+Mr.+%5BThomas%5D+Goodwin+and+Mr.+%5BPhilip%5D+Nye+thought+meet+to+signify+some+dissent%2C+%E2%80%98Preface%E2%80%99%2C+p.+6.+And+yet+they+grant%2C+that+this+must+be+performed+by+private+men%3A+1.+Only+occasionally%2C+not+in+an+ordinary+course.+2.+By+men+of+such+abilities+as+are+fit+for+office.+3.+And+not+assuming+this+of+themselves%2C+but+judged+such+by+those+that+have+the+power%2C+and+so+allowed+and+designed+to+it.+And%2C+4.+So+as+their+doctrine+be+subjected+%28for+the+judging+of+it%29+in+an+especial+manner+to+the+teaching+elders+of+that+church.+And+I+think+that+this+is+enough+to+signify+that+here+we+shall+have+no+cause+of+a+breach+with+them+%5Bpresbyterians%5D.+Mr.+%5BJohn%5D+Norton+speaks+to+the+same+purpose%2C+pp.+123-25%2C+and+joins+with+Mr.+Cotton+in+denying+prophesy+to+private+men+and+expounding+1+Cor.+14+of+extraordinarily+gifted+prophets+only%3A+In+this+therefore+doctrinally+we+agree+%5Bwith+the+presbyterians%5D.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Church+Concord%2C+containing%3A+I.+A+Dissuasive+from+Unnecessary+Division+%26+Separation%2C+%26+the+Real+Concord+of+the+Moderate+Independents+with+the+Presbyterians%2C+instanced+in+Ten+seeming+Differences%E2%80%A6+%281655+%2F+1667%3B+London%3A+1691%29%2C+ch.+10%2C+difference+8%2C+pp.+38-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bb519db25.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bb519db25.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/preaching#:~:text=The%20presbyterians%20deny%20not%20but%20private,doctrinally%20we%20agree%20%5Bwith%20the%20presbyterians&amp;text=The%20presbyterians%20deny%20not%20but%20private%20men%20may&amp;text=this%20therefore%20doctrinally%20we%20agree%20%5Bwith%20the%20presbyterians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

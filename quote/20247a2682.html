<blockquote><p>What language, then, could affirm more explicitly than that here employed, that the atonement of Christ is specific and limited — that it is neither universal nor indefinite, but restricted to the elect, who shall be saved from wrath through him. The sacrifice of Christ derived infinite value from the dignity of his person; it must, therefore, have been intrinsically sufficient to expiate the sins of the whole human race had it been so intended; but, in the designation of the Father, and in the intention of Christ himself, it was limited to a definite number, who shall ultimately obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Journal of Reformed Theology</cite>, vol. 6, issue 1 (Jan., 2012), pp. 24-34 Ref | Abstract: “This paper defends the received account—that the Westminster Assembly maintained that all salvific actions of God are particular in intention—against a revisionist argument that it allowed that some salvific actions of God may be universal in intention.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90d8795383" data-kw="">
<blockquote><p>John Cameron [the teacher of Amyraut] set the tendency in motion which in different lands has tried to mediate between the consistent scheme of the Reformed Faith and the Arminianism which was set aside by the findings of the Synod of Dordt… The issues of his mongrel compromising teaching were far reaching. The church of his adoption felt the effects of his teaching to such an extent as that the Theology of the later Huguenots was to a large extent revolutionised. Their influence in turn told on Richard Baxter and on all the varieties of teaching that can be traced back to his type of doctrine. It affected the thinking of New England; and as a return tide on its way back over the Atlantic it determined the teaching of the English Edwardians, both Independent and Baptist. The force of the current that was thus changing the older Calvinism beat at last on the Reformed teaching of Scotland in circles other than those of the Neonomians. It found more channels than one in which to flow. New England Revivalism did its share of the work; and the influence of modern Calvinism in English Nonconformity also contributed its quota. Along with the disintegrating work of the New Light movement, which was of home [i.e., Scottish] growth and which spoke of an uneasy spirit of dissatisfaction with long accepted truth and of a restlessness that was in quest of something new, the various streams of influence that derived remotely from Cameron are responsible for the collapse of the Confessional orthodoxy which had for ages found a home in his native country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macleod.html">John Macleod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scottish Theology</cite>, pp. 61-62</span></figcaption>

<blockquote><p>‘Who has made us fit.’ Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (Jn. 10), for his Church only (Eph. 1), not for the world (Jn. 17). And therefore when the Scripture says Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the elect: for all, that is, for the elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the gentiles also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (1617), on Col. 1:12, p. 99</span></figcaption>

<blockquote><p>we affirm, that, according to the same Scripture, these precious fruits do belong to all the elect, and to them alone: but, as for the incredulous and impious, so long as they remain such, we exclude them from these benefits… As for the wicked, and such as want [lack] justifying faith, why should they partake so much happiness, who please not God?… Who belong not to Christ, who are not heirs, neither have right to, or in that life, how can Christ or his benefits belong to them?… For, if infidels belong not to Christ, they are none of Christ’s: We conclude strongly from the correlative, that Christ and his benefits belong not to the wicked: and as they are not Christs, so neither is Christ theirs. And how, I pray, should Christ belong to them whom He will, in the Last Judgment, pronounce before all the world, to be strangers from Himself, from his benefits, from his Kingdom?… But, you will say, ‘Christ died for all, therefore rose again for all.’ The answer is double: One is, as often as the Gospel extends the fruits of the works and benefits of Christ to all, this is to be understood of all those that believe in Christ: for, this is the perpetual and constant voice of the Gospel… Therefore, the Gospel debars from the benefits of Christ, all infidels; not only by a plain exclusion, but also by that condition of faith and repentance… So then, Christ is said to die for all, to wit, all that do or shall believe in Him; for whom alone He prayed, and in whom alone He finds the faith of his death: but as for infidels and reprobates, for whom Christ prayed not, whom He never acknowledged for his own, upon whom the wrath of God abides forever, to extend, I say on these the benefits of Christ, what is it else but against his own command to give that which is holy unto dogs, and to cast pearls before swine? These [things] we could solidly defend by authority of Scripture and orthodox Fathers… There is another answer usual in the schools, by which we may gratify the contentious, that Christ absolutely died for all, if you consider the amplitude and sufficiency of his price and merit: for, it is out of controversy, that the death of the Son of God is of that value, that it suffices to expiate the sins, not only of one, but of millions of worlds, if so be they had faith to apply this physic to their sins. But the question is properly of the efficacy and participation itself of these fruits, when we demand if Christ died for all: because, to die for another, is properly to die in the stead and place of another, so that he is freed from death, and saved alive; as when David, weeping, cried out, ‘I wish I had died for thee, O Absalom’; that is, I wish I had died in thy stead, that thou mightest have lived. But we utterly deny that this participation of Christ’s merits is common to all unbelievers, as well as to those that believe; or that this is promised or exhibited in the Gospel: for, in this regard, we conclude that Christ did not die properly for all, even for unbelievers and reprobates. But here some unlucky patrons of infidels, taking it ill that we do not divide the pearls equally amongst sheep and swine, cry out, that we deny the blood of Christ… But first, we protest against such bitter calumnies, making our appeal to the unanimous consent of the orthodoxal Church, and the perpetual voice of the Gospel, that we deny not, but honor the blood of Christ, when we say, it is poured out, not for those that slight it, and tread Christ under their feet; but for those who by faith are justified through it… They contend that Christ died for all. Who denies this? for this is the Scripture phrase. They add that He died for all and singular. Neither do we simply deny this; to wit, in that sense which we showed a little before: although we do not find the Scripture speak so. They go on: that He died for all and singular alike; for the elect and reprobate, for Cain and David, for Judas and Peter, for the damned, as well as for those that are saved, without any respect of faith or infidelity. This is hard. They proceed, finally, that He died for all and singular, not only in respect of sufficiency, but also in regard of the efficacy of the price. But what is this? to wit, that Christ by his death has truly delivered from death, purged from sin, sanctified, and reconciled to God all absolutely, even those who are not saved, but have been damned ever since Cain, and are damned, and furthermore are to be damned; all those, they say, He has received into his favor. This is that impious monster, by which they conclude another, no less impious and false: to wit, that wicked men, whosoever have perished, do, or shall perish, that they have perished, do, and shall perish not for their sins (for they were expiated by the blood of Christ), but only for their incredulity [unbelief]…. but how monstrous are these to Christian ears?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all</cite>, …’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645) Pareus (d. 1622), pp. 807-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

n the schools, by which we may gratify the contentious, that Christ absolutely died for all, if you consider the amplitude and sufficiency of his price and merit: for, it is out of controversy, that the death of the Son of God is of that value, that it suffices to expiate the sins, not only of one, but of millions of worlds, if so be they had faith to apply this physic to their sins. But the question is properly of the efficacy and participation itself of these fruits, when we demand if Christ died for all: because, to die for another, is properly to die in the stead and place of another, so that he is freed from death, and saved alive; as when David, weeping, cried out, ‘I wish I had died for thee, O Absalom’; that is, I wish I had died in thy stead, that thou mightest have lived. But we utterly deny that this participation of Christ’s merits is common to all unbelievers, as well as to those that believe; or that this is promised or exhibited in the Gospel: for, in this regard, we conclude that Christ did not die properly for all, even for unbelievers and reprobates. But here some unlucky patrons of infidels, taking it ill that we do not divide the pearls equally amongst sheep and swine, cry out, that we deny the blood of Christ… But first, we protest against such bitter calumnies, making our appeal to the unanimous consent of the orthodoxal Church, and the perpetual voice of the Gospel, that we deny not, but honor the blood of Christ, when we say, it is poured out, not for those that slight it, and tread Christ under their feet; but for those who by faith are justified through it… They contend that Christ died for all. Who denies this? for this is the Scripture phrase. They add that He died for all and singular. Neither do we simply deny this; to wit, in that sense which we showed a little before: although we do not find the Scripture speak so. They go on: that He died for all and singular alike; for the elect and reprobate, for Cain and David, for Judas and Peter, for the damned, as well as for those that are saved, without any respect of faith or infidelity. This is hard. They proceed, finally, that He died for all and singular, not only in respect of sufficiency, but also in regard of the efficacy of the price. But what is this? to wit, that Christ by his death has truly delivered from death, purged from sin, sanctified, and reconciled to God all absolutely, even those who are not saved, but have been damned ever since Cain, and are damned, and furthermore are to be damned; all those, they say, He has received into his favor. This is that impious monster, by which they conclude another, no less impious and false: to wit, that wicked men, whosoever have perished, do, or shall perish, that they have perished, do, and shall perish not for their sins (for they were expiated by the blood of Christ), but only for their incredulity [unbelief]…. but how monstrous are these to Christian ears?”

— David Pareus, ‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all…’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645) Pareus (d. 1622), pp. 807-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cwe+affirm%2C+that%2C+according+to+the+same+Scripture%2C+these+precious+fruits+do+belong+to+all+the+elect%2C+and+to+them+alone%3A+but%2C+as+for+the+incredulous+and+impious%2C+so+long+as+they+remain+such%2C+we+exclude+them+from+these+benefits%E2%80%A6+As+for+the+wicked%2C+and+such+as+want+%5Black%5D+justifying+faith%2C+why+should+they+partake+so+much+happiness%2C+who+please+not+God%3F%E2%80%A6+Who+belong+not+to+Christ%2C+who+are+not+heirs%2C+neither+have+right+to%2C+or+in+that+life%2C+how+can+Christ+or+his+benefits+belong+to+them%3F%E2%80%A6+For%2C+if+infidels+belong+not+to+Christ%2C+they+are+none+of+Christ%E2%80%99s%3A+We+conclude+strongly+from+the+correlative%2C+that+Christ+and+his+benefits+belong+not+to+the+wicked%3A+and+as+they+are+not+Christs%2C+so+neither+is+Christ+theirs.+And+how%2C+I+pray%2C+should+Christ+belong+to+them+whom+He+will%2C+in+the+Last+Judgment%2C+pronounce+before+all+the+world%2C+to+be+strangers+from+Himself%2C+from+his+benefits%2C+from+his+Kingdom%3F%E2%80%A6+But%2C+you+will+say%2C+%E2%80%98Christ+died+for+all%2C+therefore+rose+again+for+all.%E2%80%99+The+answer+is+double%3A+One+is%2C+as+often+as+the+Gospel+extends+the+fruits+of+the+works+and+benefits+of+Christ+to+all%2C+this+is+to+be+understood+of+all+those+that+believe+in+Christ%3A+for%2C+this+is+the+perpetual+and+constant+voice+of+the+Gospel%E2%80%A6+Therefore%2C+the+Gospel+debars+from+the+benefits+of+Christ%2C+all+infidels%3B+not+only+by+a+plain+exclusion%2C+but+also+by+that+condition+of+faith+and+repentance%E2%80%A6+So+then%2C+Christ+is+said+to+die+for+all%2C+to+wit%2C+all+that+do+or+shall+believe+in+Him%3B+for+whom+alone+He+prayed%2C+and+in+whom+alone+He+finds+the+faith+of+his+death%3A+but+as+for+infidels+and+reprobates%2C+for+whom+Christ+prayed+not%2C+whom+He+never+acknowledged+for+his+own%2C+upon+whom+the+wrath+of+God+abides+forever%2C+to+extend%2C+I+say+on+these+the+benefits+of+Christ%2C+what+is+it+else+but+against+his+own+command+to+give+that+which+is+holy+unto+dogs%2C+and+to+cast+pearls+before+swine%3F+These+%5Bthings%5D+we+could+solidly+defend+by+authority+of+Scripture+and+orthodox+Fathers%E2%80%A6+There+is+another+answer+usual+in+the+schools%2C+by+which+we+may+gratify+the+contentious%2C+that+Christ+absolutely+died+for+all%2C+if+you+consider+the+amplitude+and+sufficiency+of+his+price+and+merit%3A+for%2C+it+is+out+of+controversy%2C+that+the+death+of+the+Son+of+God+is+of+that+value%2C+that+it+suffices+to+expiate+the+sins%2C+not+only+of+one%2C+but+of+millions+of+worlds%2C+if+so+be+they+had+faith+to+apply+this+physic+to+their+sins.+But+the+question+is+properly+of+the+efficacy+and+participation+itself+of+these+fruits%2C+when+we+demand+if+Christ+died+for+all%3A+because%2C+to+die+for+another%2C+is+properly+to+die+in+the+stead+and+place+of+another%2C+so+that+he+is+freed+from+death%2C+and+saved+alive%3B+as+when+David%2C+weeping%2C+cried+out%2C+%E2%80%98I+wish+I+had+died+for+thee%2C+O+Absalom%E2%80%99%3B+that+is%2C+I+wish+I+had+died+in+thy+stead%2C+that+thou+mightest+have+lived.+But+we+utterly+deny+that+this+participation+of+Christ%E2%80%99s+merits+is+common+to+all+unbelievers%2C+as+well+as+to+those+that+believe%3B+or+that+this+is+promised+or+exhibited+in+the+Gospel%3A+for%2C+in+this+regard%2C+we+conclude+that+Christ+did+not+die+properly+for+all%2C+even+for+unbelievers+and+reprobates.+But+here+some+unlucky+patrons+of+infidels%2C+taking+it+ill+that+we+do+not+divide+the+pearls+equally+amongst+sheep+and+swine%2C+cry+out%2C+that+we+deny+the+blood+of+Christ%E2%80%A6+But+first%2C+we+protest+against+such+bitter+calumnies%2C+making+our+appeal+to+the+unanimous+consent+of+the+orthodoxal+Church%2C+and+the+perpetual+voice+of+the+Gospel%2C+that+we+deny+not%2C+but+honor+the+blood+of+Christ%2C+when+we+say%2C+it+is+poured+out%2C+not+for+those+that+slight+it%2C+and+tread+Christ+under+their+feet%3B+but+for+those+who+by+faith+are+justified+through+it%E2%80%A6+They+contend+that+Christ+died+for+all.+Who+denies+this%3F+for+this+is+the+Scripture+phrase.+They+add+that+He+died+for+all+and+singular.+Neither+do+we+simply+deny+this%3B+to+wit%2C+in+that+sense+which+we+showed+a+little+before%3A+although+we+do+not+find+the+Scripture+speak+so.+They+go+on%3A+that+He+died+for+all+and+singular+alike%3B+for+the+elect+and+reprobate%2C+for+Cain+and+David%2C+for+Judas+and+Peter%2C+for+the+damned%2C+as+well+as+for+those+that+are+saved%2C+without+any+respect+of+faith+or+infidelity.+This+is+hard.+They+proceed%2C+finally%2C+that+He+died+for+all+and+singular%2C+not+only+in+respect+of+sufficiency%2C+but+also+in+regard+of+the+efficacy+of+the+price.+But+what+is+this%3F+to+wit%2C+that+Christ+by+his+death+has+truly+delivered+from+death%2C+purged+from+sin%2C+sanctified%2C+and+reconciled+to+God+all+absolutely%2C+even+those+who+are+not+saved%2C+but+have+been+damned+ever+since+Cain%2C+and+are+damned%2C+and+furthermore+are+to+be+damned%3B+all+those%2C+they+say%2C+He+has+received+into+his+favor.+This+is+that+impious+monster%2C+by+which+they+conclude+another%2C+no+less+impious+and+false%3A+to+wit%2C+that+wicked+men%2C+whosoever+have+perished%2C+do%2C+or+shall+perish%2C+that+they+have+perished%2C+do%2C+and+shall+perish+not+for+their+sins+%28for+they+were+expiated+by+the+blood+of+Christ%29%2C+but+only+for+their+incredulity+%5Bunbelief%5D%E2%80%A6.+but+how+monstrous+are+these+to+Christian+ears%3F%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+%E2%80%98A+Piece+of+a+Speech+concerning+that+Question%2C+To+whom+properly+do+the+benefits+of+Christ%E2%80%99s+sufferings+and+death+belong%3F+And+how+Christ+is+said+to+die+for+all%E2%80%A6%E2%80%99+in+Zachary+Ursinus%2C+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29+Pareus+%28d.+1622%29%2C+pp.+807-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4cb1cf30b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4cb1cf30b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=we%20affirm%2C%20that%2C%20according%20to%20the,monstrous%20are%20these%20to%20Christian%20ears&amp;text=we%20affirm%2C%20that%2C%20according%20to%20the%20same%20Scripture&amp;text=but%20how%20monstrous%20are%20these%20to%20Christian%20ears" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Together with his brother-in-law, Pierre du Moulin, professor of theology at Sedan, and Spanheim, first professor at Geneva and thereafter at Leiden, he [Rivet] sharpened his theological knife in order to combat Amyraut. For this purpose, he also used an abstract of Amyraut’s ideas, which he had composed in 1635 at The Hague. It contained fifty theses and was followed by his comments on them, divided into ten chapters, and then a conclusion (Synopsis doctrinae de natura et gratia, excerpta ex Mosis Amyraldis… in Riveti Opera Theologica, 3:830-851).” – van Asselt in Theology of the French Reformed Churches, p. 270 Maresius, Samuel – A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) 913 pp. ToC Daille’s Apology is above. Table of Contents Dedication Prolegomena Epistle of Blondel to Maresius Response of Maresius Exercitation 1. The First Part of the Apology [of John Daille], in which is viewed: Jn. 3:16 is weighed, then 1 Tim. 2:3, in which kinds of individuals ought to be understood; The Objections of the Apology to the contrary are satisfied; 2 Pet. 3:9 is weighed, to the effect that Calvin in no way favors universalism; also Eze. 33:11, in which the common explanation is vindicated; refutations to the contrary are opposed 1 Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58 Exercitation 3. Proceeds to other places for universal redemption, the judgment of the Arminians on this head; the disparity of the affection of Christ towards the elect and reprobates to die for both (2 Cor. 5:14-15; Rom. 14:8-9; Mt. 18:11; Mk. 11:17; Lk. 5; 1 Tim. 1:15; Lk. 9:56, and many others are viewed) to placate the Father through the blood of Christ; Tit. 2:11, the testimony of Gomarus is elucidated and vindicated. What of this dogma the reformed churches and schools of Belgium judge. The judgment of Twisse on Molina. The judgment of the Rev. Apologist, by which he differs from Remonstrantism, and by which inconvenient things he draws away from them. The Janists, on the view of the Apology and some on Blondel 102 Exercitation 4. The Second Part of the Apology, in which is viewed: Whether God wills all them to be saved to whom his Word is externally announced: the first reason for the affirmative is weighed and refuted: on the end and means: the command made to Abraham; the precept of the Law ought to save; it ought to work repentance and belief. That command to Pharaoh, also God having willed the slaying of his Son, or his will to save the reprobate hearers of the Gospel: various places of Scripture having been brought on that, and similar ones customarily brought by Remonstrants and Jesuits are weighed; and the genuine sense of them is profusely expounded 147 Exercitation 5 proceeds in an examination of the first argument; Prov. 1:5 &amp; Lk. 7:30 are weighed; the twofold counsel of God is taken up; in what way that is resisted, out of Acts 7:51; on that most vexed place, Mt. 23:37 which is discussed by many; the reasons by which the Apologist seeks to prove that God always intends that to be that which He commands to men, are clearly refuted; the whole conclusion of the first argument 217 Exercitation 6. The refutation of the Second Argument of the Apologist from the divine promisses; it concides with the first; the third from divine calling; the fourth from the parable of the marriage feast; the fifth from the invitation to the perishing unto repentance and faith; places specially brought to that effect are disected, namely Isa. 55:1-3; Jn. 7:37; Prov. 9:4-6; Mt. 11:18-19; on the Galatians out of Gal. 3:1; the place Jn. 6:32, Christ is really offered to the unbelieving, and whether that of the minister is to be distinguished from God; the sixth argument from that which is incumbent upon ministers from the command of God; the means unto salvation, of what kind and how far they are admitted with respect to reprobates; the end of pastors in preaching the gospel; whether reprobates are called through that which is falling out [accidens] 253 Exercitation 7. The remaining arguments of the revered man are dissected; the seventh from the foolishness of the unruly; it is falsely supposed that they are minimally called; the penitence of demons and the damned; what and in what way it is offered to reprobates. Eighth, on times assigned to sinners. Ninth, in what way we may hold to the first thing of the Gospel, whether the hearing or the preaching; Tenth, ‘Do this and you will live’. The Principles in which we come together. So to proceed onto the Arminian disputation, the judgment of Cameron 323 Exercitation 8. The second member of the second part of the Apology, on the universality of the death of Christ. What of Cameron on that? The first argument of the apology is disected out of Rom. 14:15 &amp; 1 Cor. 8:10-11. The second taken out of 1 Pet. 2:1, and so proceeding to sieze it from the Remonstrants, and sufficiently refute them from [Daniel] Chamier. Gomarus and Calvin on this place. Third, out of Heb. 10:29. A sacramental sanctification is there denoted, so it is proved by multitudes. The fourth and fifth grasp at a false supposition [sophisma] of the Remonstrants, that whatever one holds to believe, that is true. The absurd supposition of the Apologist, whether he implicates a contradiction? This sophism is accurately refuted 361 Exercitation 9. The sixth argument from absurdities and the play-acted Catechism, which, through the Jesuit and Remonstrant slander, is attributed to our reformed Apologist. Repentance, whether it is prior to faith? The seventh dissected, and it is showed in what way unbelief is the cause of damnation. The eighth and ninth are of the same sort with the seventh. The tenth is far more absurd, from the salvation of believers. The eleventh, of the same scaly stuff. The twelvth, out of which the Apologist wills for no one to believe that Jesus is the Christ, except that he would believe that He died for him. The thirteenth and fourteenth contain a seventh Cocceianism 430 Exercitation 10. Of the salvation of adults which are destitute of the Word, and of Christ’s death for them. The doctrine of the Apologist fights in many ways with the Synod of Alencon: many places of Scripture are examined, having been brought forth by it, out of Acts 17:26-27; 14:16-17; Rom. 2:4; 1:18-21. The same reason from the examples. Whether to that end the knowledge of God is from Himself manifested to pagans, so that through it they may repent and be saved? It is proved that God has intended their inexcusability, and this from the distinct end of the thing, from the end of God, as the event of it shows from this having been intended. Christ did not die for the ethnics without the Word. God does not will their premature infants, having been snatched away in death, to have been saved, nor did Christ redeem them 493 Brief Strictures upon the Most Verbose Vindications of John Daille, recently opposing the first three of the preceeding exercitations, for the defense of their errors on Universal Grace &amp; Redemption 568 ToC of the Exercitations 908 Omissions that ought to be Adjoined 914 Errata 915 Grebenitz, Elias – A Theological Tract on the Denial of Universal, Divine Grace (Frankfurt, 1665) 87 pp. Grebenitz (1627-1689) was a reformed professor of logic, metaphysics and theology at Frankfurt, Germany. Burman, Francis – 17. ‘Of the Subject of the Covenant of Grace. Where is Treated of its Latitude &amp; of Universal Grace’, pp. 499-506 in A Synopsis of Theology, and especially of the Economy of the Covenant of God, from the beginning of ages to the consummation of all things, vol. 1 (Utrecht, 1671) Burman (1628-79) . 1700’s Vitringa, Sr., Campegius – Ch. 19, ‘Of the Covenant of Grace, which has an Eternal Superstructure &amp; Various Dispensations of it’, ‘Of the Extent of the Covenant of Grace’, pp. 247-249 in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 4 (d. 1722) Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition, the former from a federalist, the latter from a nonfederalist perspective.</p></blockquote>

adiction? This sophism is accurately refuted 361 Exercitation 9. The sixth argument from absurdities and the play-acted Catechism, which, through the Jesuit and Remonstrant slander, is attributed to our reformed Apologist. Repentance, whether it is prior to faith? The seventh dissected, and it is showed in what way unbelief is the cause of damnation. The eighth and ninth are of the same sort with the seventh. The tenth is far more absurd, from the salvation of believers. The eleventh, of the same scaly stuff. The twelvth, out of which the Apologist wills for no one to believe that Jesus is the Christ, except that he would believe that He died for him. The thirteenth and fourteenth contain a seventh Cocceianism 430 Exercitation 10. Of the salvation of adults which are destitute of the Word, and of Christ’s death for them. The doctrine of the Apologist fights in many ways with the Synod of Alencon: many places of Scripture are examined, having been brought forth by it, out of Acts 17:26-27; 14:16-17; Rom. 2:4; 1:18-21. The same reason from the examples. Whether to that end the knowledge of God is from Himself manifested to pagans, so that through it they may repent and be saved? It is proved that God has intended their inexcusability, and this from the distinct end of the thing, from the end of God, as the event of it shows from this having been intended. Christ did not die for the ethnics without the Word. God does not will their premature infants, having been snatched away in death, to have been saved, nor did Christ redeem them 493 Brief Strictures upon the Most Verbose Vindications of John Daille, recently opposing the first three of the preceeding exercitations, for the defense of their errors on Universal Grace &amp; Redemption 568 ToC of the Exercitations 908 Omissions that ought to be Adjoined 914 Errata 915 Grebenitz, Elias – A Theological Tract on the Denial of Universal, Divine Grace (Frankfurt, 1665) 87 pp. Grebenitz (1627-1689) was a reformed professor of

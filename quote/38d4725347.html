<main class="wrap"><figure class="quote" id="q-38d4725347" data-kw="">
<blockquote><p>Thirdly, while you are preaching that opinion which your zeal is so much for, you are omitting far greater and more necessary truths. Fourthly, mercy is to be preferred before sacrifice: What if the present uttering some truth would cost many thousand men’s lives? Were not that an untimely and unmerciful word? And is it not as bad if (but accidentally) it tend to the ruin of the Church and the hurt of souls? It were easy to instance in unseasonable and imprudent words of truth spoken to princes, which have raised persecutions of long continuance and ruined Churches, silenced ministers and caused the death of multitudes of men. … It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good, and not to hurt them. And the Devil, who is the Destroyer, so he may but do men hurt, will be content to make use even of truth to do it; though usually he only pretends truth to cover his lies: And this angel of Light has his ministers of light and righteousness, who are known by their fruits; whilst the pretenses of light and righteousness are used to Satan’s ends and not to Christ’s, to hurt and destroy and to hinder Christ’s Kingdom, and not to save and to do good: as the wolf is known by his bloody jaws, even in his sheep’s clothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions</cite>, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 208-9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-63ffae41b2" data-kw="">
<blockquote><p>Answer: To distribute in a civil and natural way requires not a man full of the Holy Ghost, but to distribute in simplicity and with the grace of heavenly cheerfulness, Rom. 12:8, and with the qualities of a complete deacon, 1 Tim. 3:[9,] 12-14, requires the Holy Ghost [Acts 6:3-5], though they may be good deacons who are not full of the Holy Ghost; but such [persons full of the Holy Ghost] were chosen:

1. Because this was to be a rule to all deacons to the world’s end, and the rule should be as straight and perfect as can be;

2. Because there were choice of such men as those in the apostolic Church, and [there is] reason that God be served with the best of his own;

3. The Holy Ghost is required for sanctification, as well as for gifts of preaching, Luke 1:15; Mt. 10:20.

4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman, who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>The admission of ministers to their offices must consist in consent of the people and kirk whereto they shall be appointed, and in approbation of the learned ministers appointed for their examination. … Other ceremony than the public approbation of the people, and declaration of the chief minister, that the person there presented is appointed to serve that kirk, we cannot approve; for albeit the apostles used the imposition of hands, yet seeing the miracle is ceased, the using of the ceremony we judge is not necessary.</p></blockquote>

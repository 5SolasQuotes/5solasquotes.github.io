<blockquote><p>First in general; It is demanded how a man should and ought to forgive an injury? Answer: In forgiveness there be four things: The first is forgiveness of revenge, that is of requiting evil for evil, either by thought word or deed. This must always be practiced. For vengeance is not ours, but the Lord’s, and great reason then that we should ever-more forgive in regard of revenge and hatred. This the apostle teaches, when he says, 1 Cor. 13:5, Love is not provoked, it never thinks, much less speaks or does, evil. The second is forgiveness of private punishment; which is, when men return punishment for injuries done in way of requital; and this must always take place with us, because as vengeance itself, so also punishment in way of revenge is God’s alone. The third is, forgiveness of judgment, when we judge an injury done to be an injury. This judgment we are not bound to forgive unto men. For we may with good conscience judge a sin and a wrong to be as they are. And yet notwithstanding, if a man make satisfaction for the wrong done, then there ought to be forgiveness, even in regard of judgement. The fourth is forgiveness of satisfaction. This we are not alway[s] bound to remit, but we may with good conscience, alway[s] require satisfaction where hurt is done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Legat: Univ. of Cambridge, 1606), bk. 3, ch. 3, question 1, ‘How may a man carry himself in respect of injuries and offences done unto him?’, pp. 492-3</span></figcaption>

1107dad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51c1107dad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=First%20in%20general%3B%20It%20is%20demanded,require%20satisfaction%20where%20hurt%20is%20done&amp;text=First%20in%20general%3B%20It%20is%20demanded%20how%20a&amp;text=conscience%2C%20alway%5Bs%5D%20require%20satisfaction%20where%20hurt%20is%20done" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We do observe beautiful things through our senses, but the property by which they are beautiful is not perceivable through the senses. Animals have perceptions and representations of beautiful things, but they do not know the beautiful. They know only the useful and the pleasant. For that reason, the perception and recognition of the beautiful, also in sensory things, belongs to the higher faculty of knowing, to reason… Beauty is something that the beholding of which delights a person. Something is good insofar as it, when it is recognized by us, is desirable to our will. But beauty is what stimulates not our desire in a narrow sense, but our pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921), p. 164</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-9a6c66249f" data-kw="">
<blockquote><p>This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect:

1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them.

2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments</cite>, (d. 1626; 1675) 5th Commandment, ch. 2, p. 321</span></figcaption>

<blockquote><p>Calvin and Beza employed various measures in order to send the preachers they trained into France in a way that would ensure their safety and minimize the likelihood of detection and capture. They sent them into France under assumed names, carrying false identities, forged papers, clandestine meetings. They took obscure mountain passages in order to avoid the authorities along the border.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 96</span></figcaption>

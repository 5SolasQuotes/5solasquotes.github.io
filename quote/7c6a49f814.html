<blockquote><p>6. I have perused over all the Articles or Decrees of the Synod of Dort, and unfeignedly honor them, as containing sound and moderate doctrine, and heartily lament that some late divines have to the great detriment of the Church and truth, forsaken the moderate way of that Synod, and laid the weight of the Anti-Arminian cause so much upon higher points not owned by them. And there is nothing that I have observed in it all that my judgment does contradict, if I be allowed these few expositions following: Where it is said, article 1, sect. 12, De hac aeterna electione, electi suo tempore variis licet gradibus, et dispari mensura, certiores redduntur, non arcana, etc. [“The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, etc.”], I understand it as showing only what way the elect do attain assurance, who more or less do attain it, and not as affirming that all the elect do more or less attain a certainty of their election. For as I think that doctrine uncomfortable to many poor Christians, so I think it cannot he proved of all the elect.

2. In the 3rd Article, sect. 12, it’s plain by the annexed words that persuasionem moralem [“by moral suasion”] they mean external suasion, and do not determine whether the name of suasion be agreeable or not to the internal work of the Spirit, which for my part I am certain is beyond my reach to know and, I am confident, [is] beyond the reach of all men on earth, even those that most pretend to know it. But that this grace of the Spirit is necessary to sanctify both the understanding and will, and that it is an act of omnipotency, and infallibly effectual (commonly called ‘irresistible’) on all the elect, I am ready against all Pelagians to defend.

3. Where it is said, sect. 15, that, Qui illam non accipit, is aut haec spiritualia omnino non curat, et in suo sibi placet: aut securus se habere inaniter gloriatur, quod non habet [‘Whoever is not made partaker thereof, is either altogether regardless of these spiritual gifts and satisfied with his own condition, or is in no apprehension of danger and vainly boasts the possession of that which he has not’]: I understand it as spoken of the ordinary sort of graceless unregenerate men, and not of all; for I doubt not but it’s possible for a wicked man to know that he is wicked, and be afraid of Hell, yea, and to despair. I am loth to think desparation is a mark of grace, and that none are graceless but the secure and confident.

4. In the 5th Article, sections 9-10, where it is said that believers may be, and are certain of their perseverance, according to the measure of their faith, I understand that word, ‘are certain pro mensura fidei’:

1. As supposing the certainty of their sincerity; for a man must be certain that he has grace, before he can be certain to persevere in it.

2. As supposing a certain understanding of the truth of the doctrine that all true believers shall infallibly persevere: for none can be certain to persevere merely as a believer, that is not first certain that all believers shall persevere.

3. I suppose therefore that this is not spoken of all believers, but of some, for:

1. All are not certain that they are sincere.

2. All are not certain that the doctrine of infallible perseverance is true; for to conclude that all the Lutheran Churches that deny this, and all the Arminians and Anabaptists that deny it, and all the ancient fathers and Churches that denied it, besides Musculus and others of our own, were certainly graceless and unbelievers, were not only inconsistent with the faith and charity, but with the reason of a Christian; and [this is] no less than an inhumane charge.

5. Where it is said, sect. 11, that God per Spiritum Sanctum perseverantiae certudinem in iisdem rursus excitat [‘by the Holy Spirit again inspires them with the comfortable assurance of persevering’], I understand it as true of some, but not of all; for I dare not pronounce damnation on all that die unassured of their sincerity, much less on all that are unassured of perseverance.

6. To the 13th section, I doubt not but the meaning is that certainty of perseverance does not of itself, and of its own nature beget carelessness or negligence; and so I believe it’s true. Nay, I think that love and gratitude are ordained to be the master ruling graces in the Kingdom of Christ (under faith); and that fear is but to supply the defects of our yet-imperfect love. And therefore the more any man loves, the more he will obey: and the more he is assured of God’s love, the greater advantage he has to love Him again. But yet I doubt not, but the remnants of our corruption, by the strength of temptation, may make assurance an occasion, or accidental cause of negligence and actual sin: which I suppose this section does not deny. These are all the limiting expositions which I desire liberty to make use of, and with which I do, as is aforesaid, profess my consent to the Canons or Decrees of the Synod of Dort. And how far any of these are from favoring Arminianism, they that will see, need not to be ignorant. Yea, in the very article of perseverance, which some were pleased to quarrel with me about, I subscribe to the Synod: Yea, in the article of the extent of redemption, wherein I am most suspected and accused (and was fain to use a limiting exposition in my consent to our Assembly’s Confession of Faith) I do subscribe to the Synod of Dort, without any exception, limitation or exposition of any word as doubtful and obscure. I do also freely consent to the rejections, with the liberty of three or four the like explications, which I will not mention, lest I seem quarelsome, or be further tedious, because they are about smaller matters than those I have mentioned, and no way touching the quick of the controverted articles, and I am persuaded that my sense of them is the same with the Synod’s. And because it is, this Synod [was] purposely called against Arminianism, that is the best discovery what is to be accounted Arminian or Anti-Arminian doctrine, as I think, by consenting to it: I do clear myself from that calumny with all men of conscience and reason that know it, so I shall think that those who go as much on the other hand, and differ from the Synod one way, as much as the Arminians did the other way, remain censurable as well as they, till somebody shall convince me that there is but one extreme, in this case, and that a man may hold what he will without danger, so he be but sure it go far enough from Arminianism. A man that holds to the moderation of the Synod of Dort, need not say that Christ did not die or satisfy for all men, nor need he trouble himself with presumptuous determinations about many mysteries in the decrees of God, which many volumes are guilty of; Nor does he need to aver the necessity of immediate, physical, efficient predetermination by God (as the First Cause) of every second cause natural and free, as without which they cannot act: Nor need he say, that God so predetermines to the act which is sin, and not to the sinfulness of the act: Nor need he subscribe to all that Dr. [William] Twisse or Mr. [Samuel] Rutherford, or such like, have written on these points. Nay, as this Synod, so our own [Westminster] Assembly gave an example of modesty in these points, to them that will follow it, not only silencing many things which others make the pillars of Anti-Arminianism, but expressing that the will is endued by God with that natural liberty, that is neither forced, nor by any absolute necessity of nature determined to do good or evil, and therefore they never tell you that God as the First Cause must of natural necessity determine man’s will by physical, immediate premotion, before it can act either good or evil: But they reserve the honor of determining man’s will to special grace, renewing the will, and by almighty power determining it to that which is good, ch. 10, sect. 1 and ch. 9, sect. 1.</p></blockquote>

be+to+the+Synod+of+Dort%2C+without+any+exception%2C+limitation+or+exposition+of+any+word+as+doubtful+and+obscure.+I+do+also+freely+consent+to+the+rejections%2C+with+the+liberty+of+three+or+four+the+like+explications%2C+which+I+will+not+mention%2C+lest+I+seem+quarelsome%2C+or+be+further+tedious%2C+because+they+are+about+smaller+matters+than+those+I+have+mentioned%2C+and+no+way+touching+the+quick+of+the+controverted+articles%2C+and+I+am+persuaded+that+my+sense+of+them+is+the+same+with+the+Synod%E2%80%99s.+And+because+it+is%2C+this+Synod+%5Bwas%5D+purposely+called+against+Arminianism%2C+that+is+the+best+discovery+what+is+to+be+accounted+Arminian+or+Anti-Arminian+doctrine%2C+as+I+think%2C+by+consenting+to+it%3A+I+do+clear+myself+from+that+calumny+with+all+men+of+conscience+and+reason+that+know+it%2C+so+I+shall+think+that+those+who+go+as+much+on+the+other+hand%2C+and+differ+from+the+Synod+one+way%2C+as+much+as+the+Arminians+did+the+other+way%2C+remain+censurable+as+well+as+they%2C+till+somebody+shall+convince+me+that+there+is+but+one+extreme%2C+in+this+case%2C+and+that+a+man+may+hold+what+he+will+without+danger%2C+so+he+be+but+sure+it+go+far+enough+from+Arminianism.+A+man+that+holds+to+the+moderation+of+the+Synod+of+Dort%2C+need+not+say+that+Christ+did+not+die+or+satisfy+for+all+men%2C+nor+need+he+trouble+himself+with+presumptuous+determinations+about+many+mysteries+in+the+decrees+of+God%2C+which+many+volumes+are+guilty+of%3B+Nor+does+he+need+to+aver+the+necessity+of+immediate%2C+physical%2C+efficient+predetermination+by+God+%28as+the+First+Cause%29+of+every+second+cause+natural+and+free%2C+as+without+which+they+cannot+act%3A+Nor+need+he+say%2C+that+God+so+predetermines+to+the+act+which+is+sin%2C+and+not+to+the+sinfulness+of+the+act%3A+Nor+need+he+subscribe+to+all+that+Dr.+%5BWilliam%5D+Twisse+or+Mr.+%5BSamuel%5D+Rutherford%2C+or+such+like%2C+have+written+on+these+points.+Nay%2C+as+this+Synod%2C+so+our+own+%5BWestminster%5D+Assembly+gave+an+example+of+modesty+in+these+points%2C+to+them+that+will+follow+it%2C+not+only+silencing+many+things+which+others+make+the+pillars+of+Anti-Arminianism%2C+but+expressing+that+the+will+is+endued+by+God+with+that+natural+liberty%2C+that+is+neither+forced%2C+nor+by+any+absolute+necessity+of+nature+determined+to+do+good+or+evil%2C+and+therefore+they+never+tell+you+that+God+as+the+First+Cause+must+of+natural+necessity+determine+man%E2%80%99s+will+by+physical%2C+immediate+premotion%2C+before+it+can+act+either+good+or+evil%3A+But+they+reserve+the+honor+of+determining+man%E2%80%99s+will+to+special+grace%2C+renewing+the+will%2C+and+by+almighty+power+determining+it+to+that+which+is+good%2C+ch.+10%2C+sect.+1+and+ch.+9%2C+sect.+1.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Confession+of+his+Faith%2C+on+the+Canons+of+Dort%2C+%28London%3A+R.W.%2C+1655%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c6a49f814.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c6a49f814.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=6.%20I%20have%20perused%20over%20all,1%20and%20ch.%209%2C%20sect.%201&amp;text=6.%20I%20have%20perused%20over%20all%20the%20Articles&amp;text=10%2C%20sect.%201%20and%20ch.%209%2C%20sect.%201" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>A catechism is a brief doctrine, framed for youth and the ruder sort, containing in it the sum of the doctrine of the law and gospel, or of Christian religion… Catechumeni in the primitive Church, were those who learned the catechism: that is to say, such as were now of the Church, and were instructed in Christian doctrine… This catechising doctrine has ever been in the Church. For in the Old Testament God Himself in brief-wise delivered the doctrine of the Law and Gospel, the Decalogue and the promises, as when He says, ‘Walk before Me, and be thou perfect.’ Likewise, ‘In thy seed shall all nations of the earth be blessed.’ Now these things God would that Abraham and his posterity should teach their children, and their whole family: and therefore this doctrine was framed fit for the capacity of children, and the ruder sort… In the New Testament, in the apostles’ time, there was likewise a catechising doctrine: as the author of the epistle to the Hebrews reports [Heb. 6:1-2]: ‘Therefore, leaving the doctrine of the beginning of Christ, let us be led forward unto perfection, not laying again the foundation of repentance:’ that is the beginning of Christian doctrine, which comprehends repentance and faith. These first beginnings or principles of Christian doctrine are called in the same place the doctrine of baptisms, because they that were of some years before they came to Christ, were first instructed, before they were baptised. It is called also the doctrine of laying on of hands, because the catechism was required at their hands (that they should be able to answer in it) on whom hands were laid, that is to say, of the children of Christians, who were baptised in their infancy. The parts of these rudiments of Christian doctrine, which they call catechism, are the Law and the Gospel, or (as it is said in the place aforenamed unto the Hebrews) repentance and faith in Christ. Similarly the fathers also write brief sums of doctrine… Now it behoves that the youth be by and by instructed in this doctrine, and do know the foundation: 1. Because of the commandment of God, ‘Thou shalt tell them unto thy children.’… 3. Because we are to hold the foundation, upon which we may build…</p></blockquote>

<blockquote><p>So far then as the Council proveth the determination and commandment that it giveth by the plain word of God, so soon do we reverence and embrace the same. But if men, under the name of a Council, pretend to forge unto us new articles of our faith, or to make constitutions repugnant to the word of God, then utterly we must refuse the same, as the doctrine of devils, which draweth our souls from the voice of our only God, to follow the doctrine and constitutions of men.</p></blockquote>

<blockquote><p>We are the rather induced to take this upon us (that is, to give some determination to the matters in difference) by finding upon a full conference that we have had with the learned men of several persuasions that the mischiefs under which both Church and State do at present suffer, do not result from any formed doctrine or conclusion which either party maintains or avows, but from the passion and appetite, and interest of particular persons, which contract greater prejudice to each other by those affections than would naturally arise from their opinions.</p></blockquote>

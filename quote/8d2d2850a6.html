<main class="wrap"><figure class="quote" id="q-8d2d2850a6" data-kw="">
<blockquote><p>Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 10, ‘Bellarmine’s Arguments…’, p. 391</span></figcaption>

<blockquote><p>How have we used the mercies which are taken from us? Yea God Himself will judge us according to our works! He will not justify us, if we have been unfaithful in our little, and have been such as Satan and his instruments, the accusers of the brethren, do report us. But if we have been faithful we may expect his double justification: 1 By pardon He will justify us from our sins. 2. By plea and righteous sentence He will justify us against the false accusations of our enemies. And that’s enough. How small a thing should it seem to us, to be judged of man, who must stand or fall to the final sentence of the Almighty God?</p></blockquote>

</figure><figure class="quote" id="q-3403251ace" data-kw="">
<blockquote><p>I find ground to assert a twofold justification. First, a general and first-justification (which most places before-mentioned speak of), when a person passes from an unjustified to a justified estate. This is owned by all, and therefore I shall say no more of it. Secondly, a particular, renewed, repeated and after-justification, when any particular act is approved by God and a person is accounted righteous in reference unto that. This kind of justification must needs be understood in that place where this phrase is first used, Gen. 15:6, ‘Abraham believed God, and He counted it to him for righteousness.’ Here it relates to his faith in that particular promise of God, concerning an heir to be born of his own body, and the numerousness of his seed by him, verses 4-5; and so must be meant of God’s approbation of that particular act of faith as a righteous act, or his accounting him righteous in that particular act… ‘Tis but as he [Paul] gathers and infers the general from one particular, that if Abraham were justified by faith and not by such [legal] works, whereof he might glory, then all others are justified so too, he being the father of all that believe, verse 11. i.e. an eminent example or pattern of the justification of believers. I say, it must needs be understood of a particular justification, with reference to that particular act, and not of his first and general justification; for he [Abraham] was a justified person long before that, as appears in that when he was called out of his own country, Gen. 12:1, 3, he obeyed that call, verse 4, and so became the friend of God [Jm. 2:23], who blessed him, [Gen. 12] verses 2-3, and appeared unto him, verse 7, by which, and all the following story, it is evident, that he was a good, righteous and holy man long before those words were spoken of him, ch. 15:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clark.html">Samuel Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture-Justification, or a Discourse of Justification, according to the Evidence of Scripture-Light</cite>, (London: S. Bridge, 1698) | 15. ‘Concerning the Kinds of Justification’, p. 81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-e5387e69f8" data-kw="">
<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae</cite>, On Theodore Beza</span></figcaption>

eed+we+here+contend+much+which+of+the+two+precedes+in+order%2C+since+in+one+and+the+same+moment+Christ%E2%80%A6+justifies+us%2C+and+by+his+Spirit+begins+to+sanctify+us.%E2%80%99+and+%28p.+237%2C+sect.+23%2C+Praeterea+quum+%28or+p.+185%29%29%3A+%E2%80%98When+I+had+said+what+is+quite+true%2C+that%2C+provided+it+is+allowed+that+we+must+first+of+all+be+made+partakers+of+Christ+Himself%2C+that+in+Him+we+may+be+justified+and+sanctified%2C+we+need+not+labor+much+to+find+which+of+these+two+precedes+in+order.+lIllyricus+brings+forward+against+me+Calvin%2C+who+says+%28Antidote+to+the+Council+of+Trent%2C+sess.+6%2C+sect.+Neque+tamen+interea%2C+tome+8%2C+p.+241%29+that%2C+%E2%80%98as+soon+as+any+one+is+justified%2C+renewal+also+necessarily+follows.%E2%80%99+But+Calvin+here+refuting+the+decisions+of+the+Council+of+Trent%2C+by+which+justification+is+confounded+with+the+gift+of+sanctification%2C+is+not+disputing+about+the+order+or+series+of+these+two%2C+but+of+their+connection%3B+and+therefore+says%2C+that+%E2%80%98if+anyone+is+justified+renewal+also+follows%2C+i.e.%2C+that+it+is+necessarily+concluded+that%2C+if+any+one+be+justified%2C+he+may+also+be+said+to+be+sanctified.+But%2C+I+pray+you%2C+if+I+say%2C+%E2%80%98If+anyone+lives%2C+it+follows+that+he+is+endowed+with+a+soul%2C%E2%80%99+will+it+be+rightly+concluded+from+thence+that+I+make+the+being+endowed+with+a+soul+something+posterior+to+life%3F%E2%80%99+and+%28p.+238+%28or+p.+186%29+around+the+end%2C+sect.+Ego+vero+inhabitationem%29+%E2%80%98I+say+that+we+are+simultaneously+justified+and+renewed+in+Christ%2C+united+and+applied+to+us+by+faith%3B+and+I+think+that+we+need+not+trouble+ourselves+in+anyway+to+determine+whether+this+one+or+that+precedes+in+order%2C+since+we+never+receive+the+one+without+the+other%2C+etc.%E2%80%99+Would+that+this+moderation+were+religiously+followed%2C+not+only+by+the+more+rigid+Protestants%2C+but+also+by+very+many+other+theologians+of+both+parties%2C+who+now-a-days+excite+so+many+and+so+great+disturbanees+in+the+Church+about+the+mode+and+order+of+the+divine+operations.%E2%80%9D%0A%0A%E2%80%94+Agnostic%2C+On+Theodore+Beza+%7C+William+Forbes%2C+Considerationes+Modestae+et+Pacificae+Controversiarum+de+Justificatione...+4th+ed.+%28d.+1634%3B+1658%3B+Oxford%3A+Parker%2C+1850%29%2C+vol.+1%2C+bk.+2%2C+ch.+4%2C+pp.+171-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe5387e69f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5387e69f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=10.%20What%20all%20the%20more%20rigid,and%20order%20of%20the%20divine%20operations&amp;text=10.%20What%20all%20the%20more%20rigid%20Protestants%20affirm&amp;text=the%20mode%20and%20order%20of%20the%20divine%20operations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

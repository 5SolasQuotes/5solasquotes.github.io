<main class="wrap"><figure class="quote" id="q-25f7b99c98" data-kw="">
<blockquote><p>Must you defy your mother, because you see your brethren fighting? Their dissension is her grief: Must she lose some sons, because some others quarrel? Do not so wrong yourself in afflicting her. Will you love Christ the less because his coat is divided? Yea, let me boldly say, The hem is torn a little, the garment is whole; or rather it is fretted a little, not torn; or rather the fringe, not the hem. Behold, here is one Christ, one Creed, one Baptism, one heaven, one way to it; in sum, one religion, one foundation, and (take away the tumultuous spirits of some rigorous Lutherans) one heart. Our differences are those of Paul and Barnabas, not those of Peter and Magus: if they be some, it is well they are no more; if many, that they are not capital. Show me that Church that has not complained of distraction; yea that family, yea that fraternity, yea that man that always agrees with himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistles, the Second Volume (London: 1608) | 3rd Decade, Epistle 5. To Mr. W.L… our dissensions are no sufficient ground of his suspension…</cite>, pp. 55-65</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac4752d8cf" data-kw="">
<blockquote><p>We will call then the true and pure Churches all those wherein we find the Word of God and sacraments purely and lawfully administered, that is to say (as Cyprian says) according to the institution of the Lord. And we nothing doubt to communicate with them, and that God is there president, howsoever in some certain points of doctrine there have been some error, and in the outward policy some abuse and corruption, and impurity in manners: for it behooves that always we resort thither, when the chief points of the foundation of our salvation be there truly taught, seeing we are men, and the Churches are compounded of men…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter [in controversy with Romanism] (London: Barker, 1579)</cite>, ch. 2, n.p.</span></figcaption>

<blockquote><p>so there will readily still be different sentiments and apprehensions as to some lesser and lower truths further removed from the fundamentals of religion (where about all are agreed) and so proportionably as to practices among even truly godly men; it not being to be supposed that while saints sojourn and are militant here on earth, the intellectuals of all of them will be of the same size, or cast into the same mold, that their light will be of the same clearness, and that they will be all of equal mortification… So it speaks the necessity of mutual Christian forbearance, compassion and sympathy.</p></blockquote>

</figure><figure class="quote" id="q-2ac0a9a91f" data-kw="">
<blockquote><p>…whatsoever a man holds, though his conscience be never so much taken with it, yet if it cannot stand with the power of godliness, but destroys it, if this man be in a Christian society after all means used to reduce him, if he still perseveres in it, he is, notwithstanding his conscience, to be cast out of the society of the saints; This is not a little matter, if a man has any conscience in him, it cannot but be a dreadful thing to him: If poison be got into a glass, and you cannot wash it out, the poison and glass too is to be thrown into the sink: Such a man as this is, with the conscience that he has, is to be thrown upon the dunghill. If a man by his wickedness cuts himself off from the mystical body of Christ, the Church may cut him off from his visible, he has forfeited his Church-priviledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened… (London: Robert Davvlman, 1653)</cite>, ch. 6, p. 34</span></figcaption>

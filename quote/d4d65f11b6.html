<main class="wrap"><figure class="quote" id="q-d4d65f11b6" data-kw="">
<blockquote><p>The Witness newspaper of Edinburgh, which Hugh Miller edited, wrote the following words of praise for the Presbyterian Church in Ireland’s the Revd James Morgan of Belfast. It did so out of appreciation for his support for the non-intrusionists during the Ten Years’ conflict:

Mr Morgan is universally respected and esteemed in the Presbyterian Church of Ireland, as a roost faithful, conscientious, and minister, and as possessing a large measure of the meekness of wisdom. Though his talents and character give great weight to all he says, he does not usually take a very prominent part in public matters, except where the interests of religion, and the salvation of souls are very directly and immediately concerned. We value very highly the distinct and explicit testimony of such a man to this great truth, that this is a contest involving the weal or woe of Scotland, and in which her religion and liberty are at stake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-witness.html">The Witness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 23 March 1842.</span></figcaption>

<blockquote><p>We do not mean, however, properly speaking, that it is faith itself that justifies us — for faith is only the instrument by which we embrace Christ, our righteousness. But Jesus Christ is our righteousness in making available to us all his merits and all the holy works he has done for us and in our place. And faith is the instrument that keeps us in communion with him and with all his benefits. When those benefits are made ours they are more than enough to absolve us of our sins.</p></blockquote>

</figure><figure class="quote" id="q-1de1276527" data-kw="">
<blockquote><p>Obj. 4. Further, In the Old Law God was praised with musical instruments and human song, according to Ps. 32:2, 3: “Give praise to the Lord on the harp, sing to Him with the psaltery, the instrument of ten strings. Sing to Him a new canticle.” But the Church does not make use of musical instruments, such as harps and psalteries, in the divine praises, for fear of seeming to imitate the Jews. Therefore in like manner neither should song be used in the divine praises. On the contrary, Blessed Ambrose established singing in the Church of Milan, as Augustine relates (Conf. ix.). Reply Obj. 4. As the Philosopher says (Polit. viii.), Teaching should not be accompanied with a flute or any artificial instrument such as the harp or anything else of this kind: but only with such things as make good hearers. For suchlike musical instruments move the soul to pleasure rather than create a good disposition within it. In the Old Testament instruments of this description were employed, both because the people were more coarse and carnal—so that they needed to be aroused by such instruments as also by earthly promises—and because these material instruments were figures of something else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, trans. Fathers of the English Dominican Province (Bellingham, WA: Logos Bible Software, 2009), 2a.2ae.91.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-f97e3e7708" data-kw="">
<blockquote><p>Not but that much of God’s Will is also contained in the Law of Nature; or may by the mere use of reason be learned from creatures, and providences: But yet this is nothing against the Scripture’s sufficiency and perfection: For besides all the superadded positives, the Scripture also contains all that which we call the Law of Nature; and it is there to be found more legible and discernable than in the best of our obscure, deceitful, corrupted hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), , thesis 3, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ae5a421f4" data-kw="Rule of faith">
<blockquote><p>For unless scripture be a whole and perfect rule, it cannot be a rule at all; because there ought to be the exactest agreement between the rule and the thing to which it is applied. If, therefore, our faith be longer or broader than the scripture, then the scripture is not its rule; because a rule should be adequate to the thing measured by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 6, ch. 16</span></figcaption>

</figure><figure class="quote" id="q-a09c007962" data-kw="Augustine canonical scriptures">
<blockquote><p>Augustine, De Natura et Gratia, c. 91, writes thus: “I owe an absolute assent only to the canonical scriptures.” What value, may I ask, did this father set upon traditions, when he declared that he owed an absolute assent to nothing but the canonical scriptures?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 6, ch. 17</span></figcaption>

</figure><figure class="quote" id="q-01df301672" data-kw="">
<blockquote><p>None can deny natural arguments to be a part of the Word of God, as is clear, Rom. 1:19; 1 Cor. 15:36–37; 1 Cor. 11:14. Yea, Christ, Mt. 7:12, teaches that this principle of nature, ‘whatsoever ye would men should do to you, do ye so to them,’ is the Law and the prophets, because it is a great part of the Law and the prophets, and therefore they say in effect ‘As it written in the Scripture,’ when they say ‘as it is written in man’s heart by nature.’ 2. Principles of nature are made Scripture by the penmen of the Holy Ghost, and do bind as the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London: 1646), ch. 1; p. 106</span></figcaption>

</figure><figure class="quote" id="q-8141366f7a" data-kw="">
<blockquote><p>Likewise we reject human traditions, even if they be adorned with high-sounding titles, as though they were divine and apostolical, delivered to the Church by the living voice of the apostles, and, as it were, through the hands of apostolical men to succeeding bishops which, when compared with the Scriptures, disagree with them; and by their disagreement show that they are not Apostolic at all. … it would be wicked to assert that the apostles by a living voice delivered anything contrary to their writings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

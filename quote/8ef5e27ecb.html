<blockquote><p>…the ordinary power of working them is ceased: for it was only given to the apostles in the primitive Church, as a means to confirm the doctrine of the Gospel to unbelievers, that never heard of Christ before. So Paul says, ‘Strange tongues’ (that is, the gift of speaking strange languages, without ordinary teaching) ‘are for a sign, not to them that believe, but to them that believe not,’ 1 Cor. 14:22. And for the same end were all extraordinary gifts then given. Howbeit the Papists stand stiffly in defending the continuance of these gifts.</p></blockquote>

</figure><figure class="quote" id="q-b57b819614" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: …

144. That there are revelations and visions in these times, yea to some they are more ordinary, and shall be to the people of God, generally within a while.

145. That the gift of miracles is not ceased in these times, but that some of the sectaries have wrought miracles, and miracles have accompanied them in their baptism, etc. and the people of God shall have power of miracles shortly.

146. That anointing the sick with oil by the Elders praying over them, with laying on of hands [James 5], is a Church-ordinance for Church-members that are sick, for their recovery.

147. ‘Tis ordinary for Christians now in these days, with Paul to be rapt up to the third Heavens, and to hear words unutterable, and they cannot well have assurance of being Christians, that have not found and had experience of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or a Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time, Vented &amp; Acted in England in these Four Last Years</cite>, … (London, 1646), pp. 15, 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

0of%20the%20Errors%2C%20Heresies%2C%20Blasphemies%2C%20is&amp;text=have%20not%20found%20and%20had%20experience%20of%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. The text continues: ‘And these are the signs that will accompany those who believe: in my name they will cast out demons, they will speak new tongues, they will take snakes in their hands, and if they drink any deadly beverage, it will not will do them any harm. They will lay hands on the sick, and they will be healed.’ [Mk. 16:17] That, my brethren, you do not do; does that mean you do not believe? No, of course! These signs were necessary at the beginning of the Church. Faith, in order to grow, had to be nourished. We, too, when planting trees, pour water on them until we have found that they have resumed; but once their roots are fixed in the ground, we stop watering them. Hence Paul’s words: ‘Languages ​​are a sign, not for believers, but for unbelievers.’ (1 Cor 14:22)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homily 29 on the Gospels, on the Ascension, May 24</cite>, 591</span></figcaption>

</figure><figure class="quote" id="q-3e43ae1689" data-kw="">
<blockquote><p>Assertion 1. There is now no gift of prophesy, either for the bringing forth of any truth not formerly delivered, nor any gift to warrant one in a particular simply condemned in the Word, as to take another’s goods, life, station, etc. so as to be warranted merely by such a revelation in things otherwise unlawful, as it is like prophetical men of old in some of their practices were, which to us are no precedent for our warrant;</p></blockquote>

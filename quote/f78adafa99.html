<main class="wrap"><figure class="quote" id="q-f78adafa99" data-kw="">
<blockquote><p>THERE is nothing more miserable, than Life’s inconstancy. Its longest Date is but a Span. It is obnoxious to many thousand accidents, that snatch it away, when we least think on it. It is more brittle, than Glass; and at best but our way to Death,

AND can we thus reflect upon the Vanity of this Life, and not be disgusted? Can we help despising the pleasures of it, and lifting our Hearts above Time, fix them on the Life Eternal?

THE World passes away, and we in it: Its Delusions, that have so often surprised us, scatter and vanish, proportionably to the growth of our Experience. They only have attained a fixed and settled State, who have resigned themselves to GOD, and the Contemplation of Eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-allix.html">Pierre Allix</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epictetus Christianus; or, Maxims of True Christianity</cite>, trans. Paul Lorrain (London: Brab. Aylmer, 1688), p. 75.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3812c4716e" data-kw="">
<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land… they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sharp.html">James Sharp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Representation of the Rise, Progress &amp; State of the Present Divisions of the Church of Scotland</cite>, (London, 1657), p. 33</span></figcaption>

</figure><figure class="quote" id="q-7c8310d78a" data-kw="">
<blockquote><p>In general, it is certain that God intended to declare hereby that the work which Moses had to do, —the tabernacle he was to erect, and the worship thereof, —was not, either in the whole, or in any part of it, or any thing that belonged unto it, a matter of his own invention or contrivance, nor what he set upon by chance; but an exact representation of what God had instructed him in and showed unto him. This was the foundation of all the worship of God under the old testament, and the security of the worshippers. Hence, at the finishing of this work, it is eight times repeated in one chapter, that all things were done “as the LORD commanded Moses.” And herein was that truth fully consecrated unto the perpetual use of the church in all ages, that the will and command of God are the sole reason, rule, and measure, of all religious worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, (Edinburg: The Banner of Truth Trust, 1991), 22:44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-8bd0c2eb1e" data-kw="">
<blockquote><p>‘Doth not even nature itself’ He [Paul] again sets forth nature as the mistress of decorum, and what was at that time in common use by universal consent and custom—even among the Greeks—he speaks of as being natural, for it was not always reckoned a disgrace for men to have long hair. Historical records bear, that in all countries in ancient times, that is, in the first ages, men wore long hair. Hence also the poets in speaking of the ancients, are accustomed to apply to them the common epithet of unshorn. It was not until a late period that barbers began to be employed at Rome—about the time of Africanus the elder. And at the time when Paul wrote these things, the practice of having the hair shorn had not yet come into use in the provinces of Gaul or Germany. Nay more, it would have been reckoned an unseemly thing for men, no less than for women, to be shorn or shaven; but as in Greece [Corinth] it was reckoned an unbecoming thing for a man to allow his hair to grow long, so that those who did were remarked as effeminate, he [Paul] reckons as nature a custom that had come to be confirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, | v. 12</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9e56ad1130" data-kw="">
<blockquote><p>Dying is not only unavoidable, but it is a new trial. None can tell what dying is. Many know what it is to be sick, to be in great pain, to faint and fall into a swoon, which is a little image of death; as also the Heathen poet called sleep death’s elder brother: but none knows what dying is. It was a very sensible word a dying Christian in this city spoke to myself, when visiting him a few hours before his death, “No man can tell another what dying is. I feel I am dying; but I cannot tell you what it is.”

Death is a path that you never trode before; you never walked in it hitherto; you may have thought yourselves to have gone a good way in the valley of the shadow of death, but you never walked through it. Paul died daily, 1 Cor. xv. 31; he was in deaths often, 2 Cor. xi. 23.: yet he was a living man then, when he said so; and he died but once. All new trials require new supplies of grace; and the trial of death is quite new. When we are tempted one day, we may know what temptation is thereby, and be thereby fitted for the next: but no past experience can teach us fully what dying is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 212-13.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97ee38d870" data-kw="">
<blockquote><p>Q What remedy or redemption is there against sin and death?

A. Jesus Christ the eternal Son of God, who in man’s nature suffered the death of the cross and perfectly fulfilled that Law for all them that do receive him.

</figure><figure class="quote" id="q-f6197b3b85" data-kw="">
<blockquote><p>If CHRIST had not been our Rock, there had been no Dwelling in him, he would not have keeped Wind and Weather off us: Therefore the Divine Nature was a Pillar on which the Human Nature did hang, and this is the Cause why CHRIST-man leans to the Divine Nature, as his Warrant in all that he does. For if ye will consider in this Work, there is Three Bargains, or Covenants to speak so.

First, GOD and Man bargained together, ye shall believe, that’s your Part. I shall give you Life Eternal, that’s my Part says GOD. Now Man dare not promise this of himself without CHRIST’s Bond to Relieve him, that is to Enable him throw his Grace to believe.

Secondly, GOD Bargains with his Son, Isaiah 53. 10. Son, if Thou shall lay down Thy Life, Thou shall see Thy Seed, and Prolong Thy Days, and have many fair Children, Psalms 2. Ye shall have the Heathen to Serve You. Heb. 1. I will be Your Father, and Ye shall be My Son. CHRIST is content, but he cannot do this alone; he must borrow Flesh and Blood from Man, and in it Suffer.

Thirdly, The Man CHRIST Bargains with the Divine Nature. The Human Nature says, I Love Man, and I will Die for him: The Divine Nature says, now I shall hold Thee up under Thy Sufferings, and Thou shall overcome Death. The Man Christ without the Back-bond (to speak so) durst not for Ten Thousand Worlds have ventured to Yoke in the Fields with the Justice of GOD, and Death, and Hell, and Sin, and the Devil, except he had the Divine Nature in a Personal Union to bear him up under his Sufferings: Therefore CHRIST when he looks upon his Sufferings, looks also upon his Warrant, Isaiah 56. I gave My Back to the Smiters, and My Checks to them that pulled off the Hair. These be the Words of the Man CHRIST.

Now because it might have been said a Man will Suffer all that his alone; But here he looks to his Warrant, Verse 7. and says, I have my Warrant with Me, The LORD GOD will help Me, I shall not be confounded. I have GODs Warrant who is united to Me in a Personal Union to bear Me up. Even Sick-like CHRIST goes down to the Grave, Psalms 16. 10. Thou wilt not leave My Soul in Hell, (or the Grave,) neither wilt Thou suffer Thy Holy One to see Corruption.

As if Christ would say, I am sure LORD Thou will be as Good as Thy Word, and make Good Thy Bargain, and will Warrant Me against Death: See then how it goes; The Man Christ takes Man by the Hand to bring him out from under GOD’s Wrath. So Beloved, Be Glad in such a Saviour, come all into the Rock, for God, Christ, and Man, all these Three are linked together as in a Chain, and Christ in the middle link of the Chain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ and the doves’ heavenly salutations, with their pleasant conference together: or A sermon before the communion in Anwoth. Anno 1630. By that flour of the Church, Mr. Samuel Rutherford</cite>, (n.p., [1660]), pp 6-8.</span></figcaption>

</figure><figure class="quote" id="q-dd1fec55c9" data-kw="">
<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Predestination &amp; Justification</cite>, tr. Frank A. James (Kirksville, Missouri: Sixteenth Century Essays &amp; Studies, 2003), vol. 8, p. 62</span></figcaption>

<blockquote><p>The righteousness with which we are here justified before God, is not our conformity with the law, nor our good works, nor our faith; but it is the satisfaction which Christ rendered to the law in our stead; or the punishment which he endured in our behalf; and therefore the entire humiliation of Christ, from the moment of his conception to his glorification, including his assumption of humanity, his subjection to the law, his poverty, reproach, weakness, sufferings, death, &amp;c., all of which he did willingly; yea, whatever he did and suffered to which he was not bound, as being righteous, and the Son of God, is all included in the satisfaction which he made for us, and in the righteousness which God graciously imputes to us, and all believers. This satisfaction is equivalent to the fulfilling of the law, or to the endurance of eternal punishment for sin, to one or the other of which the law binds all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. G. W. Williard (Elm Street Printing Company, 1888), 327</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“The righteousness with which we are here justified before God, is not our conformity with the law, nor our good works, nor our faith; but it is the satisfaction which Christ rendered to the law in our stead; or the punishment which he endured in our behalf; and therefore the entire humiliation of Christ, from the moment of his conception to his glorification, including his assumption of humanity, his subjection to the law, his poverty, reproach, weakness, sufferings, death, &amp;c., all of which he did willingly; yea, whatever he did and suffered to which he was not bound, as being righteous, and the Son of God, is all included in the satisfaction which he made for us, and in the righteousness which God graciously imputes to us, and all believers. This satisfaction is equivalent to the fulfilling of the law, or to the endurance of eternal punishment for sin, to one or the other of which the law binds all.”

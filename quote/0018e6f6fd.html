<main class="wrap"><figure class="quote" id="q-0018e6f6fd" data-kw="">
<blockquote><p>The reason why these books were separated from canonical authority is not a secret. Some of them were written after the time of the prophets, when the people of Israel no longer had prophets such as the old ones had been; and they were written by men who did not have divine testimonies like the prophets for the certainty and authority of their doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on the Holy Scripture, Sec. VI</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8c754bfe5" data-kw="">
<blockquote><p>We receive and embrace all the canonical Scriptures, both of the Old and New Testament, giving thanks to our God, who hath raised up unto us that light which we might ever have before our eyes, lest either by the subtlety of man, or by the snares of the devil, we should be carried away to errors and lies. Also that these be the heavenly voices, whereby God hath opened unto us His will: and that only in them man&#x27;s heart can have settled rest; that in them be abundantly and fully comprehended all things, whatsoever be needful for our salvation, as Origen, Augustine, Chrysostom, and Cyrillus have taught: that they be the very might and strength of God to attain to salvation: that they be the foundations of the Prophets and Apostles, whereupon is built the Church of God: that they be the very sure and infallible rule, whereby may be tried, whether the Church do stagger, or err, and whereunto all ecclesiastical doctrine ought to be called to account: and that against these Scriptures neither law, nor ordinance, nor any custom ought to be heard: no, though Paul his own self, or an angel from heaven, should come and teach the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a> › <a href="../topics/holy-scripture/canon/new-testament-canon.html">New Testament canon</a></span></div>

</figure><figure class="quote" id="q-2c33b914f5" data-kw="jewish canon">
<blockquote><p>The reasons are various. (1) The Jewish church, to which the oracles of God were committed (Rom. 3:2), never considered them as canonical, but held the same canon with us (as is admitted by Josephus, Against Apion 1.39–41 [Loeb, 1:178–79], Becanus, Manuale controversiarum 1.1 [1750], pp. 11–12) and Stapelton, “De Principiis fidei doctrinalibus controversia,” Cont. 5.7* in Opera [1620], 1:322–23). This they could not have done without the most grievous sin (and it was never charged upon them either by Christ or his apostles) if these books no less than the others had been committed to them. Nor should the canon of the Jews be distinguished here from that of Christians because Christians neither can nor ought to receive other books of the Old Testament as canonical than those which they received from the Jews, their book-servants “who carry the books of us students” (as Augustine calls them, “On Psalm 40 [41]” [NPNF1, 8:132; PL 36.463]). (2) They are never quoted as canonical by Christ and the apostles like the others. And Christ, by dividing all the books of the Old Testament into three classes (the law, the Psalms and the prophets, Lk. 24:44), clearly approves of the canon of the Jews and excludes from it those books which are not embraced in these classes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.9.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a> › <a href="../topics/holy-scripture/canon/old-testament-canon.html">Old Testament canon</a></span><span class="t"><a href="../topics/holy-scripture/canon.html">Canon</a> › <a href="../topics/holy-scripture/canon/the-apocrypha.html">The Apocrypha</a></span></div>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f85f6affea" data-kw="">
<blockquote><p>Speaking at a meeting near the end of the American Civil War at Clifton Street Presbyterian Church, Belfast, the Revd Daniel Gunn Brown condemned chattel slavery:

There was, he said, the greatest possible difference between man as a rational being, free to improve his own faculties and to pursue his own lawful business, and man as a chattel, a mere thing or article of trade, a slave bought and sold, in the market for filthy lucre, at the caprice of will of his master.

There was the greatest possible difference, he said, between man as God and nature formed him, and man as slavery had debased him. God had ordained all men to dwell on the face of the earth together. God was the only Lord over man’s conscience and man’s liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-gunn-brown.html">Daniel Gunn Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 22 April 1865.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-0df971ffcb" data-kw="">
<blockquote><p>Persons who are justly condemned to slavery [penal servitude], as a punishment of their dishonesty or other crimes, may be lawfully bought for slaves: and prisoners may be bought from conquerors, if it be in order to preserve their lives.

But to make war upon neighbours, or encourage others to it, in order to procure slaves, – or to trade in buying slaves, – is altogether unmerciful, and shocking to right reason and humanity, – natively entailing upon these merchants the blood of the souls and bodies of their fellow-creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compendious view of natural and revealed religion</cite>, (1782; Fearn: Christian Focus Publications, 2002), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-8ad5e62da7" data-kw="">
<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. …

9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’…

10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition…

11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, ... (Edinburgh, 1681), Title 2, ‘Of Liberty’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

— James Dalrymple, The Institutions of the Law of Scotland, ... (Edinburgh, 1681), Title 2, ‘Of Liberty’, p. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Liberty+is+that+natural+power+which+man+has+of+his+own+person%2C+whence+a+free+man+is+said+to+be+suae+potestatis%2C+%E2%80%98in+his+own+power%E2%80%99%2C+and+it+is+defined+in+the+law+to+be+a+natural+faculty+to+do+that+which+every+man+pleases%2C+unless+he+be+hindered+by+law+or+force.+%E2%80%A6+5.+Though+liberty+be+the+most+precious+right%2C+yet+it+is+not+absolute%2C+but+limited%3B+First%2C+by+the+Will+of+God%2C+and+our+obediential+obligations+to+Him%2C+and+to+men+by+his+ordinance%3B+and+so+though+man+has+power+of+his+own+person%2C+yet+has+he+no+power+of+his+own+life%2C+or+his+members%2C+to+dispose+of+them+at+his+pleasure%2C+either+by+taking+away+of+his+life+or+amputation%2C+or+hurting+of+any+member+by+himself%2C+or+by+giving+power+to+any+other+so+to+do%2C+unless+it+be+necessary+for+preserving+the+whole%2C+but+he+is+naturally+obliged+to+God+to+maintain+his+life%3A+So+likewise+men+may+be+restrained%2C+or+constrained+by+others%2C+without+encroachment+upon+the+law+of+liberty%2C+in+the+pursuance+of+other+obediential+obligations%3B+as+a+husband+has+power+to+restrain+his+wife%2C+from+her+liberty+of+going+where+she+will%2C+and+may+keep+her+within+the+bounds+of+conjugal+society%3B+so+may+parents+restrain+their+children%2C+and+also+constrain+them+to+the+performance+of+moral+duties%2C+and+that+without+any+engagement+or+law%3B+we+may+also+without+any+injury%2C+restrain+a+furious+person%2C+or+one+who+is+inferring+violence+to+himself%2C+in+his+life+or+limbs%2C+because+this+is+not+against+any+act+of+his+lawful+liberty%2C+and+is+done+as+a+duty+in+us+of+love+and+mercy%3A+But+in+matters+of+utility+and+profit%2C+where+the+natural+liberty+is+not+hemmed+in+with+an+obligation%2C+there%2C+unless+by+his+own+delinquence+or+consent%2C+man+cannot+justly+be+restrained%2C+much+less+constrained+upon+pretense+of+his+utility+or+profit%3B+for+liberty%2C+as+far+preferable+to+profit%2C+and+in+the+matter+of+utility%2C+every+man+is+left+to+his+own+choice%2C+and+cannot+without+injury+to+God+and+Man%2C+be+hindered+to+do+what+he+pleases%2C+or+be+compelled+to+do+what+he+pleases+not%2C+in+things+wherein+he+is+free%2C+6.+Liberty+may+be+diminished+or+taken+away+by+our+delinquence+in+the+way+of+punishment%2C+for+seeing+it+is+a+right+in+our+own+power%3B+as+goods+and+debts+may+be+forfaulted+by+our+delinquence%2C+so+may+our+liberty%2C+in+whole+or+in+part.+7.+Thirdly%2C+our+engagements+do+commonly+import+a+diminution+of+our+personal+liberty%2C+but+much+more%2C+of+that+natural+liberty+of+things+without+us%3B+whence+it+is+that+the+law+allows+personal+execution+or+restraint%2C+and+incarceration+of+the+debitor%E2%80%99s+person%2C+until+he+do+all+the+deeds+that+are+in+his+power+for+the+satisfaction+of+his+Creditor.+%E2%80%A6%0A%0A9.+Fifthly%2C+liberty+is+wholly+taken+off+by+bondage%2C+slavery+or+servitude%2C+which+is+diametrically+opposite+to+liberty%3B+for+as+liberty+is+that+power+by+which+men+are+sui+juris+%5Bin+his+own+power%5D%2C+so+by+servitude+they+became+alieni+juris%2C+%E2%80%98in+the+power+of+another%E2%80%99%E2%80%A6%0A%0A10.+Bondage+was+introduced+by+the+law+of+nations%2C+and+it+is+among+the+positive+laws+of+nations%2C+settled+by+common+consuetude+%5Bcustom%5D%2C+and+it+took+first+place+in+these+who+were+taken+in+war%2C+who+being+under+the+power+of+their+enemies%E2%80%99+sword%2C+did+lose+their+liberty+in+lieu+%5Bin+place%5D+of+their+life+%5Binstead+of+being+killed%5D%3B+such+also+were+these+who+sold+their+liberty+and+gave+it+up%2C+and+were+content+to+be+perpetual+slaves%2C+as+were+the+Jewish+bondmen%2C+whose+ears+were+pierced+with+an+aul+%5BEx.+21%5D%2C+as+the+solemnity+of+their+perpetual+and+willing+servitude%2C+the+offspring+of+servants+remained+in+their+servile+condition%E2%80%A6%0A%0A11.+Bondage%2C+though+contrair+to+the+nature+of+liberty%2C+yet+it+is+lawful%3B+liberty+being+a+right+alienable%2C+and+in+our+disposal%2C+so+that+the+natural+law+constitutes+us+free%2C+but+puts+no+necessity+on+us%2C+so+to+continue%3B+and+therefore+servitude+is+both+approven+in+the+Old+Testament%3B+and+in+the+New%2C+it+is+cleared+against+that+obvious+objection%2C+that+being+made+free+by+Christ%2C+we+should+not+become+the+servants+of+men%2C+to+which+the+Apostle+answers%2C+%E2%80%98Art+thou+called%2C+being+a+servant+%28or+slave%29%3F+continue+so%2C+for+nevertheless+thou+art+Christ%E2%80%99s+freeman%E2%80%99+%5B1+Cor.+7%5D%3A+But+yet+Christian+lenity+and+mercy%2C+has+almost+taken+away+bondage%2C+except+amongst+the+Spaniards%2C+Portugals+%5Bwho+were+Romanist%5D+and+other+Christian+nations+bordering+upon+the+Turks+%5BMuslims%5D%2C+where%2C+because+the+Turks+do+extremely+exercise+slavery%2C+especially+upon+Christians%2C+their+neighbors+do+the+like%2C+that+they+may+have+slaves+to+exchange+with+slaves%3A+little+of+slavery+remains+elsewhere+among+Christians%2C+except+the+ascriptitii+%5Bnaturalized+foreigners%5D%2C+who+are+not+absolutely+slaves%E2%80%A6+but+in+Scotland+there+is+no+such+thing.%E2%80%9D%0A%0A%E2%80%94+James+Dalrymple%2C+The+Institutions+of+the+Law+of+Scotland%2C+...+%28Edinburgh%2C+1681%29%2C+Title+2%2C+%E2%80%98Of+Liberty%E2%80%99%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ad5e62da7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ad5e62da7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=1.%20Liberty%20is%20that%20natural%20power,Scotland%20there%20is%20no%20such%20thing&amp;text=1.%20Liberty%20is%20that%20natural%20power%20which%20man&amp;text=but%20in%20Scotland%20there%20is%20no%20such%20thing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Now that the prophet was ordered to offer them wine, and that they refused, a question here arises: Was their continency in this respect laudable? They seemed thus to prefer Jonadab [their forefather] to God, for they knew that Jeremiah, who offered them wine, was sent by God. But the Rechabites, no doubt, modestly excused themselves, when they said that it was not right for them to drink wine, because they had been forbidden by their father. It was not then their purpose to give more honor to their father than to God or to his prophet, but they simply answered for the sake of excusing themselves, that they had abstained from wine for three hundred years, that is, that the whole family had done so. This, then, is the solution of the question. But what the Papists do in bringing against us the Rechabites, first to support their tyrannical laws, and secondly, in order to torment miserable consciences at their pleasure, is frivolous in the extreme. As I have already said, the advice of Jonadab is not commended, as though he had rightly forbidden his sons to drink wine; but only his sons are spoken of as having reverently and humbly obeyed the command of their dead father. Then this passage gives no countenance to the Papists, as though the object of it was to bind the consciences of the faithful to their laws; for what is here spoken of is that the Rechabites proved by their obedience how base and wicked was the obduracy of the people, as they showed less reverence and honor to God than these did to a man that was dead. But the Papists, however, dwell much on another point, — that whatever has been handed down from the fathers ought to be observed; and thus they reason, “The authority of the whole Church is greater than that of a private man; now the Rechabites are commended for having followed the command of a private individual, much more then ought we to obey the laws of the Church.</p></blockquote>

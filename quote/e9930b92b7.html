<main class="wrap"><figure class="quote" id="q-e9930b92b7" data-kw="">
<blockquote><p>The sealing of God’s promises has respect either unto the faith of the Covenant [objectively], or unto the faith of them that are in the Covenant [subjectively]. In infants, the sealing of God’s promise is made properly, in respect of the faith of the Covenant, but in them that are of ripe years, in respect of their faith in the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, …, Distinction 4, in ‘Defense of the End of a Sacrament’, p. 330</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>From this it follows that the children of believers are baptized not in order that they who were previously strangers to the church may then for the first time become children of God, but rather that, because by the blessing of the promise they already belonged to the body of Christ, they are received into the church with this solemn sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Book 4, ch. 13, section 22, trans. Battles, see also Beveridge.</span></figcaption>

</figure><figure class="quote" id="q-a56c78153d" data-kw="">
<blockquote><p>Concerning your determination about the effect of baptism (unless there were great necessity of defending yourself), I would not advise you to set that foot controversy on foot. Though it be the opinion of Antiquity, and to me appears more probable than the contrary, yet at this time when the Arminians draw so close one to another, it is not convenient to be at open controversies amonst ourselves.</p></blockquote>

</figure><figure class="quote" id="q-24eb039105" data-kw="">
<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, p. 6</span></figcaption>

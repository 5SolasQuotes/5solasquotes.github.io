<main class="wrap"><figure class="quote" id="q-92ef00dce0" data-kw="">
<blockquote><p>…we must deal with four preliminary issues: first, whether there is contingency in things; second, given that there is, we need to determine the first cause of contingency; third, we must show how the primary basis of contingency can be found in God; and fourth, we need to clarify certain propositions that arise in this discussion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Nature &amp; Cause of Contingency’ in John Duns Scotus: Selected Writings on Ethics ed. &amp; trans. Thomas Williams (Oxford, 2017), pp. 86-95 from Reportatio IA, dd. 39-40, qq. 1-3, nn. 24-59</cite>, p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“…we must deal with four preliminary issues: first, whether there is contingency in things; second, given that there is, we need to determine the first cause of contingency; third, we must show how the primary basis of contingency can be found in God; and fourth, we need to clarify certain propositions that arise in this discussion.”

— John Duns Scotus, ‘The Nature &amp; Cause of Contingency’ in John Duns Scotus: Selected Writings on Ethics ed. &amp; trans. Thomas Williams (Oxford, 2017), pp. 86-95 from Reportatio IA, dd. 39-40, qq. 1-3, nn. 24-59, p. 86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+must+deal+with+four+preliminary+issues%3A+first%2C+whether+there+is+contingency+in+things%3B+second%2C+given+that+there+is%2C+we+need+to+determine+the+first+cause+of+contingency%3B+third%2C+we+must+show+how+the+primary+basis+of+contingency+can+be+found+in+God%3B+and+fourth%2C+we+need+to+clarify+certain+propositions+that+arise+in+this+discussion.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+%E2%80%98The+Nature+%26+Cause+of+Contingency%E2%80%99+in+John+Duns+Scotus%3A+Selected+Writings+on+Ethics+ed.+%26+trans.+Thomas+Williams+%28Oxford%2C+2017%29%2C+pp.+86-95+from+Reportatio+IA%2C+dd.+39-40%2C+qq.+1-3%2C+nn.+24-59%2C+p.+86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92ef00dce0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/92ef00dce0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=%E2%80%A6we%20must%20deal%20with%20four%20preliminary,propositions%20that%20arise%20in%20this%20discussion." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.2</span></figcaption>

</figure><figure class="quote" id="q-7e9ce0bb64" data-kw="">
<blockquote><p>The language of synchronic contingency [something can be contingent in different ways at the same time, and that alternatives can be contingent possibilities at the same time]… What makes the language interesting is its application to the particular case of the concurrent willing of two rational beings [God and a human person] involved in the actualization of one effect–a case in which both of the beings could will otherwise, but given that both wills taken together are the necessary and sufficient conditions for the actualization of the effect, both must be understood as freely concurrring to a single effect. That is interesting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Will &amp; Human Choice: Freedom, Contingency &amp; Necessity in Early Modern Reformed Thought Excerpt</cite>, pp. 314-315</span></figcaption>

<blockquote><p>The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death, if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, The Marrow of Modern Divinity</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09d701cb0b" data-kw="">
<blockquote><p>See hence the errors of those who imagine that it was a covenant of works which God entered into with Israel at Mount Sinai. Indeed, if the promise had followed after the commandments of the law; and if God had said, Keep these commandments, and, upon your so doing, I will be the Lord your God; in this, case it had been a pure covenant of works: whether perfect or sincere obedience had been the condition, it is all one; still the reward would have been in a way of pactional debt as in the first covenant.

But, as you heard the order of the covenant of works, or the connection betwixt the precept and promise, as it was laid in that covenant, it is now inverted: for now God first promises, in a way of sovereign grace, to be the Lord our God and Redeemer, which is the substance and sum of the new covenant; and having made such a grant of grace, to be received by faith, without, or before any works of obedience can be performed by us, be immediately subjoins the law of nature in ten words, showing us what is good, and what the Lord our God requires of us, not as a condition of his own gracious grant, but as a testimony of our love and gratitude to him, who promises, of his free and sovereign grace, to be the Lord our God.

So that, I say, it was God’s covenant of grace that was promulgated at Mount Sinai, and the law was added to it because of transgression, and graffed upon it as a rule of obedience. And whatever covenants or engagements to duty we read of, whether national or personal, still they went upon the foundation of grace laid in God’s covenant of grace; and in so far as Israel, or any else, go off from this foundation in their engagements to duty, in so far they pervert the design of the promise and law annexed to it, and turn back to a covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treasure of Gospel-Grace Digged out of Mount Sinai, or, The Sinner s Claim of Right Cleared from God’s Covenant with Israel at Sinai. A Sermon Preached on a Sacramental Occasion at Kinglassie’ in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

</figure><figure class="quote" id="q-726355ccc6" data-kw="">
<blockquote><p>I read, Gal. iii. 19, for what end God published the law 430 years after the promise was made to Abraham, and find it was added because of transgression, it was put to, not set up by itself alone as a distinct covenant, but added as an appendix to the covenant of grace; whence it is plain, that God added the Sinai law to the promise, with evangelical ends and purposes. […] The law was added because of transgression, that is, to restrain sin in the world, and to convince sinners under guilt, of the necessity of another righteousness than their own, even that of Christ, and for the same ends God added it to the promise. […]

It is plain to me, that in the publication of the law on Sinai, God did not in the least intend to give them so much as a direction how to obtain justification by their most punctual obedience to its precepts, that being to fallen man utterly impossible; and beside, had he promulgated the law to that end and purpose, he had not added it, but directly opposed it to the promise; which it is manifested he did not; Gal. iii. 21. “Is the law then against the promise of God? God forbid.” And verse 18 makes it appear, that had it been set up to that end and purpose, it had utterly disannulled the promise; for if the inheritance be of the law, it is no more by promise.

What then can be clearer, than that the law at Sinai was published with gracious gospel-ends and purposes, to lead men to Christ, which Adam’s covenant had no respect or reference to? And therefore it can never be a pure Adam’s covenant, as you falsely call it, neither is it capable of becoming a pure covenant of works to any man, but by his own fault, in rejecting the righteousness of Christ, and seeking justification by the works of the law, as the mistaken carnal Jews did, Rom. x. 3. and other legal justiciaries now do. And upon this account it is that Paul, who so highly praises the law in its subserviency to Christ, thunders so dreadfully against it, as it is thus set by ignorant mistaken souls in direct opposition to Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis et Faederis: or, A Reply to Mr Philip Cary’s Solemn Call</cite>, in The Works of John Flavel (6 vols, Edinburgh, 1968), vi, 335-36.</span></figcaption>

</figure><figure class="quote" id="q-8c2bdfc123" data-kw="">
<blockquote><p>I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall.

II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise.

III. They had a double use.

      1. That man’s obedience might be tried, by using of the one, and abstaining from the other.

      2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy.

IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification.

V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event.

VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite></span></figcaption>

<blockquote><p>3. In the special matter of the Covenants [they differ], and that both in respect of the promise and stipulation. … In that, life eternal and most blessed is promised, but only animal, to be enjoyed in Paradise, or continuance in that good estate wherein he was set at first of the rich bounty of God: but in the other, translation out of ignominy and death into eternal happiness and glory in Heaven.</p></blockquote>

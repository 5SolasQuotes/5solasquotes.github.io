<blockquote><p>22. The heretic is not to be confused with the schismatic: nor is every schismatic to be counted among the number of heretics. For although heretics often become schismatics, and conversely schismatics often become heretics, nevertheless the heretic and the schismatic differ. For first, heretics, corrupting the sincerity of faith with false doctrines, do not always separate themselves from the Church: but schismatics, sometimes even retaining the purity of faith without the stain of heresy, break the bond of brotherly society out of ambition for honor or some function in which they do not want another to be preferred over them, or out of hatred and impatience of divine order and ecclesiastical discipline, or under the pretext of scandals which are committed everywhere. 23. Heretics properly strike against the truth of the doctrines of faith, as heretics: but schismatics against charity, as schismatics: 24. Those who at the same time stumble in the truth of faith and charity, and obstinately defending the error of faith separate themselves from the Church of God, they are at the same time heretics and schismatics. 25. Very often it happens in practice that some orthodox individuals think differently from others, without strife or schism: as Jerome and Augustine. 26. Schismatics either separate themselves entirely from the Church, or in part also from this or that Church in the name of particular offenses.</p></blockquote>

<blockquote><p>The French national synods of Gap (1603) and La Rochelle (1607) were prime examples of this. Philippe du Plessis-Mornay (1549-1623), the advisor to Henry of Navarre, used fundamental articles in his Traite de I’Eglise (1578) as a basis for suggesting an accord with the Church of England. James I responded to the French Reformed initiative by sending a letter to the Synod of Toniens (1614) expressing his own desire for union. The Synod went on to adopt a series of procedures designed to set up an international synod which would formulate procedures for establishing a common Reformed-Anglican-Lutheran statement of faith based on the fundamental articles… Mornay also used fundamental articles in his description of the true church. Philippe du Plessis-Mornay, Traite de l’Eglise, 2d ed. (La Rochelle, 1599), pp. 75-77; 172-75.” – Martin Klauber, “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 338 fn. 16 Beza, Theodore – Traicté des vrayes essencielles et visibles marques de la vraye Eglise catholique (1592) 108 pp. Martin Klauber: “Beza placed his discussion of fundamental articles within the framework of his treatise on the true marks of the Church. In his Traicte des vrayes essencielles et visibles marques de la vraye Eglise Catholique (1592), Beza defined the fundamental articles as being summarized in the Ten Commandments, the Apostles Creed, and the Lord’s Prayer. He argued further that such fundamental articles such as the Trinity and the two natures of Christ are essential marks of the true Church.” “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 336, fn. 7 Junius, Francis – Le paisible chrestien ou de la paix de l’Eglise catholique… sur les Pseaumes 122 et 133 (Leiden: 1593) 392 pp. no ToC . 1600’s Jurieu, Pierre The Authentic System of the Church &amp; a True Analysis of the Faith… (Dort, 1686) ToC Jurieu (1637-1713) was a French reformed minister and prolific author. Wikipedia: “The most famous of the controversies on this subject was that between [the Romanist, Jacques-Bénigne] Bossuet [1627-1704] and the Calvinist Jurieu. Jurieu’s book… ‘Le Vray Systeme’ was an attempt to demonstrate the right of the French Protestants to rank as members of the Church Universal… According to him all sects without exception are members of Body of Christ. For this nothing is necessary but “to belong to a general confederation, to confess Jesus Christ as Son of God, as Saviour of the world, and as Messias; and to receive the Old and New Testaments as the rule and Law of Christians”, (Système, p. 53). Yet among the various portions of the Church we must, he tells us, distinguish four classes: 1. Sects that have retained all the truths taught in the Scriptures; 2. Sects that, while retaining the more important truths, have mingled with them superstitions and errors; 3. Sects that have retained the fundamental truths, but have added doctrines incompatible with them; 4. Sects that have set the fundamental verities aside altogether. This last class are dead members of the mystical body (ibid., p. 52). Those who have retained the fundamental articles of the faith are, one and all, living parts of the Church. When he comes to define precisely which doctrines are, and which are not, fundamental, Jurieu bids us fall back on the rule of Vincent of Lérins [d. c. 445]: Quod semper, quod ubique, quod ab omnibus [that which is always, everywhere and from all]. Wherever all bodies of Christians still exist and possess some importance in the world, and agree in accepting a dogma, we have, in that agreement, a criterion that may be considered infallible. Among truths so guaranteed are the doctrine of the Trinity, the Divinity of Jesus Christ, the Redemption, the satisfaction, original sin, creation, grace, the immortality of the soul, the eternity of punishment (ibid, 236-237). This work was followed, in 1688, by another entitled “Traité de l’unité de l’Eglise et des articles fondamentaux”, written in reply to Nicole’s criticisms. In the same year appeared Bossuet’s “Histoire des Variations des Eglises protestantes”… In regard to the relation of the fundamental doctrines to salvation, Jurieu is in agreement with the English divines already quoted. “By fundamental points”, he says, “we understand certain general principles of the Christian religion, a distinct faith and belief in which are necessary to salvation” (Traité, p. 495).</p></blockquote>

<blockquote><p>Conclusion 2. That a real and approved holiness is a sure-note that the error which they hold is not a damning, destroying error. I say, though the holiness of those men that maintain an opinion, be not a sure note that the opinion they maintain is a truth, yet it is a certain evidence that it is not an undoing and destructive error. Christ says that the elect shall not be deceived, Mt. 24:24, that is, though they may be carried aside with some sinful, yet they shall not be drawn away with undoing errors. And we have all the harmony of Scripture for that: He tells us that they who do his will, shall know his doctrine, that we shall all be taught of God, that we shall hear his voice, and shall not follow the voice of strangers, and that we have received an anointing of the holy One, whereby we know all things. All which places are to be understood of necessary truths, not accessory; of truths that are essential and fundamental, not circumstantial: and it proves fully to us that God will never give up his holy ones to undoing errors. That’s the second answer; that holiness is a sure note, that the opinions which they hold (though an error) yet it is not a damning and destroying error.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Conclusion 2. That a real and approved holiness is a sure-note that the error which they hold is not a damning, destroying error. I say, though the holiness of those men that maintain an opinion, be not a sure note that the opinion they maintain is a truth, yet it is a certain evidence that it is not an undoing and destructive error. Christ says that the elect shall not be deceived, Mt. 24:24, that is, though they may be carried aside with some sinful, yet they shall not be drawn away with undoing errors. And we have all the harmony of Scripture for that: He tells us that they who do his will, shall know his doctrine, that we shall all be taught of God, that we shall hear his voice, and shall not follow the voice of strangers, and that we have received an anointing of the holy One, whereby we know all things. All which places are to be understood of necessary truths, not accessory; of truths that are essential and fundamental, not circumstantial: and it proves fully to us that God will never give up his holy ones to undoing errors. That’s the second answer; that holiness is a sure note, that the opinions which they hold (though an error) yet it is not a damning and destroying error.”

— Samuel Bolton, The Arraignment of Error... (1646), p. 166">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConclusion+2.+That+a+real+and+approved+holiness+is+a+sure-note+that+the+error+which+they+hold+is+not+a+damning%2C+destroying+error.+I+say%2C+though+the+holiness+of+those+men+that+maintain+an+opinion%2C+be+not+a+sure+note+that+the+opinion+they+maintain+is+a+truth%2C+yet+it+is+a+certain+evidence+that+it+is+not+an+undoing+and+destructive+error.+Christ+says+that+the+elect+shall+not+be+deceived%2C+Mt.+24%3A24%2C+that+is%2C+though+they+may+be+carried+aside+with+some+sinful%2C+yet+they+shall+not+be+drawn+away+with+undoing+errors.+And+we+have+all+the+harmony+of+Scripture+for+that%3A+He+tells+us+that+they+who+do+his+will%2C+shall+know+his+doctrine%2C+that+we+shall+all+be+taught+of+God%2C+that+we+shall+hear+his+voice%2C+and+shall+not+follow+the+voice+of+strangers%2C+and+that+we+have+received+an+anointing+of+the+holy+One%2C+whereby+we+know+all+things.+All+which+places+are+to+be+understood+of+necessary+truths%2C+not+accessory%3B+of+truths+that+are+essential+and+fundamental%2C+not+circumstantial%3A+and+it+proves+fully+to+us+that+God+will+never+give+up+his+holy+ones+to+undoing+errors.+That%E2%80%99s+the+second+answer%3B+that+holiness+is+a+sure+note%2C+that+the+opinions+which+they+hold+%28though+an+error%29+yet+it+is+not+a+damning+and+destroying+error.%E2%80%9D%0A%0A%E2%80%94+Samuel+Bolton%2C+The+Arraignment+of+Error...+%281646%29%2C+p.+166&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F15e78e36c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/15e78e36c0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=Conclusion%202.%20That%20a%20real%20and,not%20a%20damning%20and%20destroying%20error&amp;text=Conclusion%202.%20That%20a%20real%20and%20approved%20holiness&amp;text=it%20is%20not%20a%20damning%20and%

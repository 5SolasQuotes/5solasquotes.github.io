<main class="wrap"><figure class="quote" id="q-a025d0efd8" data-kw="">
<blockquote><p>he is led up to the throne of Saint Mark, to succeed him in piety, no less than in office; in the latter indeed at a great distance from him, in the former, which is the genuine right of succession, following him closely. For unity in doctrine deserves unity in office; and a rival teacher sets up a rival throne; the one is a successor in reality, the other but in name. For it is not the intruder, but he whose rights are intruded upon, who is the successor, not the lawbreaker, but the lawfully appointed, not the man of contrary opinions, but the man of the same faith; if this is not what we mean by successor, he succeeds in the same sense as disease to health, darkness to light, storm to calm, and frenzy to sound sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oration 21: On Athanasius</cite>, §8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a008e7ae24" data-kw="">
<blockquote><p>Certainly Peter, the first of the apostles, himself a member of the holy and universal Church, Paul, Andrew, John,--what were they but heads of particular communities? And yet all were members under one Head. And (to bind all together in a short girth of speech) the saints before the law, the saints under the law, the saints under grace, all these making up the Lord&#x27;s Body, were constituted as members of the Church, and not one of them has wished himself to be called universal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 5, ep. 18 (to John of Constantinople)</span></figcaption>

</figure><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>

<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, p. 32-33</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-184206b48c" data-kw="">
<blockquote><p>I believe indeed that these men do auoid offenses, to wit, offenses of the world, that they would not be any offense unto tyrants and antichrists… But these be not the offenses which Christ taught to be avoided when He says of the scribes and Pharisees, ‘Let them alone, they are blind, and leaders of the blind.’ What offenses then be dissallowed?… Yea, and the weaker brethren newly conuerted unto the Gospel… But we ought (say they) to bear with the weak ones, and sometimes to frame ourselues unto them… Wherefore somewhat must be done for their weakeness’s sake: as Paul in his epistle to the Romans faithfully gave advise. We grant that somewhat must be consented to for their sakes that be so weak: howbeit… Yea, we must not always bear with the weak ones in those indifferent things, except in the meantime, while they may be the better and more perfectly taught. But when they once understand the thing, and yet nevertheless stick fast in their opinion, their weakeness is not to be nourished. Moreover, we must not so much bear with them, as by our example we should hurt others and also many members of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-vermigli.html">Peter Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, (), bk. 2, ch. 4, sect. 32-33, p. 321</span></figcaption>

 online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5a2fdbda56" data-kw="">
<blockquote><p>The partial conformist Paul, when he offered animal sacrifices, or arranged such for others (Acts 21:23–26; Num. 6:13–14) after Christ’s death, was, under a certain degree of necessity for a greater good (Acts 21:20–23), fulfilling the good in this deficient, yet lawful worship to God, without approving the deficiencies as best. Note these deficiencies in the material worship were in some ways contrary to Gospel principles (Acts 15:10, 28; Gal. 3:19, 23, 24–25; 4:1–3, 5–7, 9, 24, 30–31; 5:1, 7; Col. 2:14, 17, 20, 22; Tit. 1:14; Heb. 7:16, 27; 8:7–8, 10; 9:9–11, 28; 10:1–2, 10–11; 13:9) and the authorities would not remove them. Many may have accused Paul, knowing his convictions and what he had previously preached (Acts 21:21, albeit in a different context with a different kind of people for different formal reasons, e.g. Gal. 2–4 &amp; Col. 2:8–23), of compromising, conforming, backsliding and having temporizing motives for his own ease, avoiding suffering and of breaking the solemn, Gospel covenant. Ought not one to separate from such a scandalous Christian minister, who, for a time and in the circumstances, materially conformed at the permitted, yet restricting indulgence of the tyrannous authorities over God’s Church (as the rest of the story manifests, Acts 21:26–33)? God forbid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), “A True Principle”, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-0856337c3f" data-kw="">
<blockquote><p>That to scandalize, is not merely to displease or grieve another: For many a man is displeased through his folly and vice, by that which tends to his good: and many a man is tempted (that is, scandalized) by that which pleases him… The most censorious and humorous sort of men have got a notion, that what ever offends or displeases them is scandalous! And they think that no man must do any thing which grieves or displeases them, lest he be guilty of scandal: And by this trick who ever can purchase impatiency and peevishness enough to be always displeased with the actions of others, shall rule the world. But the truth is, the ordinary way of scandalizing these men is by pleasing them. §. 4. I will give you one instance of scandal in Scripture, which may help this sort of people better to understand it. Gal. 2:10-16, Peter there gives true scandal to the Jews and Gentiles: He walked not uprightly according to the truth of the Gospel, but laid a stumbling block before the Jews and Gentiles: And this was not by displeasing the Jews, but by pleasing them… Peter knew the contrary, but for fear of them of the circumcision, lest they should be offended at him as a sinner, he withdrew and separated himself. This scandal tended to harden the Jews… and to seduce the Gentiles into a conceit… and Barnabas was carried away with the dissimulation… We scandalize them [Baxter’s opponents] and others even by pleasing them, and by avoiding that which they falsely called scandalous. And if we would not scandalize them, we must do that which is just, and not by our practice hide the sound doctrine which is contrary to their separating error. … And this [scandalizing] is done more seldom by committing open disgraceful sins and doing that which will make the doer evil spoken of: For by that means others are the more assisted against the temptation of imitating him: But scandal is most commonly found in those actions, which are under least reproach among men, or which have the most plausible appearance of good in them, when they are evil! For these are apter to deceive and overthrow another. §6. 3. And it is also apparent, that it is no sinful scandalizing to do a duty or necessary action which I have not power to forbear, though I know that another will be offended, or fall by it into sin. If God have made it my duty, even at this time, I must not disobey Him and omit my duty because another will make it an occasion of his sin. It must be either a sinful or an indifferent action that is scandal, or something that is in my own power to do or to forbear… § 7. III. …Those that are careless of the consequent of their actions, and contemn the souls of other men, and will go their own way, come of it what will, and say ‘Let other men look to themselves,’ are the commonest sort of scandalizers; and are as culpable as a servant that would leave hot water or fire when the children are like[ly] to fall into it; or that would leave straw or gunpowder near the fire, or would leave open the doors, though not of purpose to let in the thieves. §8. 2. Scandal is that which tends to another’s fall, either directly or indirectly, immediately or remotely! The former may easily be foreseen; but the latter requires a large foreseeing comparing understanding: Yet this kind of scandal also must be avoided; and wise-men that would not undo men’s souls while they think no harm, must look far before them and foresee what is like[ly] to be the consequent of their actions at the greatest distance and at many removes. 3. Scandals also are Aptitudinal or Actual: Many things are apt to tempt and occasion the ruin of another which yet never attain so bad an end, because God disappoints them: But that is no thanks to them that give the scandal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, Ch. 12, ‘Directions Against Scandal as Given’; p. 81</span></figcaption>

<div class="actions"><button class="copy" data-copy="“That to scandalize, is not merely to displease or grieve another: For many a man is displeased through his folly and vice, by that which tends to his good: and many a man is tempted (that is, scandalized) by that which pleases him… The most censorious and humorous sort of men have got a notion, that what ever offends or displeases them is scandalous! And they think that no man must do any thing which grieves or displeases them, lest he be guilty of scandal: And by this trick who ever can purchase impatiency and peevishness enough to be always displeased with the actions of others, shall rule the world. But the truth is, the ordinary way of scandalizing these men is by pleasing them. §. 4. I will give you one instance of scandal in Scripture, which may help this sort of people better to understand it. Gal. 2:10-16, Peter there gives true scandal to the Jews and Gentiles: He walked not uprightly according to the truth of the Gospel, but laid a stumbling block before the Jews and Gentiles: And this was not by displeasing the Jews, but by pleasing them… Peter knew the contrary, but for fear of them of the circumcision, lest they should be offended at him as a sinner, he withdrew and separated himself. This scandal tended to harden the Jews… and to seduce the Gentiles into a conceit… and Barnabas was carried away with the dissimulation… We scandalize them [Baxter’s opponents] and others even by pleasing them, and by avoiding that which they falsely called scandalous. And if we would not scandalize them, we must do that which is just, and not by our practice hide the sound doctrine which is contrary to their separating error. … And this [scandalizing] is done more seldom by committing open disgraceful sins and doing that which will make the doer evil spoken of: For by that means others are the more assisted against the temptation of imitating him: But scandal is most commonly found in those actions, which are under least reproach among men, or which have the most plausible appearance of good in them, when they are evil! For these are apter to deceive and overthrow another. §6. 3. And it is also apparent, that it is no sinful scandalizing to do a duty or necessary action which I have not power to forbear, though I know that another will be offended, or fall by it into sin. If God have made it my duty, even at this time, I must not disobey Him and omit my duty because another will make it an occasion of his sin. It must be either a sinful or an indifferent action that is scandal, or something that is in my own power to do or to forbear… § 7. III. …Those that are careless of the consequent of their actions, and contemn the souls of other men, and will go their own way, come of it what will, and say ‘Let other men look to themselves,’ are the commonest sort of scandalizers; and are as culpable as a servant that would leave hot water or fire when the children are like[ly] to fall into it; or that would leave straw or gunpowder near the fire, or would leave open the doors, though not of purpose to let in the thieves. §8. 2. Scandal is that which tends to another’s fall, either directly or indirectly, immediately or remotely! The former may easily be foreseen; but the latter requires a large foreseeing comparing understanding: Yet this kind of scandal also must be avoided; and wise-men that would not undo men’s souls while they think no harm, must look far before them and foresee what is like[ly] to be the consequent of their actions at the greatest distance and at many removes. 3. Scandals also are Aptitudinal or Actual: Many things are apt to tempt and occasion the ruin of another which yet never attain so bad an end, because God disappoints them: But that is no thanks to them that give the scandal.”

— Richard Baxter, A Christian Directory: a Sum of Practical Theology and Cases of Conscience, Ch. 12, ‘Directions Against Scandal as Given’; p. 81">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+to+scandalize%2C+is+not+merely+to+displease+or+grieve+another%3A+For+many+a+man+is+displeased+through+his+folly+and+vice%2C+by+that+which+tends+to+his+good%3A+and+many+a+man+is+tempted+%28that+is%2C+scandalized%29+by+that+which+pleases+him%E2%80%A6+The+most+censorious+and+humorous+sort+of+men+have+got+a+notion%2C+that+what+ever+offends+or+displeases+them+is+scandalous%21+And+they+think+that+no+man+must+do+any+thing+which+grieves+or+displeases+them%2C+lest+he+be+guilty+of+scandal%3A+And+by+this+trick+who+ever+can+purchase+impatiency+and+peevishness+enough+to+be+always+displeased+with+the+actions+of+others%2C+shall+rule+the+world.+But+the+truth+is%2C+the+ordinary+way+of+scandalizing+these+men+is+by+pleasing+them.+%C2%A7.+4.+I+will+give+you+one+instance+of+scandal+in+Scripture%2C+which+may+help+this+sort+of+people+better+to+understand+it.+Gal.+2%3A10-16%2C+Peter+there+gives+true+scandal+to+the+Jews+and+Gentiles%3A+He+walked+not+uprightly+according+to+the+truth+of+the+Gospel%2C+but+laid+a+stumbling+block+before+the+Jews+and+Gentiles%3A+And+this+was+not+by+displeasing+the+Jews%2C+but+by+pleasing+them%E2%80%A6+Peter+knew+the+contrary%2C+but+for+fear+of+them+of+the+circumcision%2C+lest+they+should+be+offended+at+him+as+a+sinner%2C+he+withdrew+and+separated+himself.+This+scandal+tended+to+harden+the+Jews%E2%80%A6+and+to+seduce+the+Gentiles+into+a+conceit%E2%80%A6+and+Barnabas+was+carried+away+with+the+dissimulation%E2%80%A6+We+scandalize+them+%5BBaxter%E2%80%99s+opponents%5D+and+others+even+by+pleasing+them%2C+and+by+avoiding+that+which+they+falsely+called+scandalous.+And+if+we+would+not+scandalize+them%2C+we+must+do+that+which+is+just%2C+and+not+by+our+practice+hide+the+sound+doctrine+which+is+contrary+to+their+separating+error.+%E2%80%A6+And+this+%5Bscandalizing%5D+is+done+more+seldom+by+committing+open+disgraceful+sins+and+doing+that+which+will+make+the+doer+evil+spoken+of%3A+For+by+that+means+others+are+the+more+assisted+against+the+temptation+of+imitating+him%3A+But+scandal+is+most+commonly+found+in+those+actions%2C+which+are+under+least+reproach+among+men%2C+or+which+have+the+most+plausible+appearance+of+good+in+them%2C+when+they+are+evil%21+For+these+are+apter+to+deceive+and+overthrow+another.+%C2%A76.+3.+And+it+is+also+apparent%2C+that+it+is+no+sinful+scandalizing+to+do+a+duty+or+necessary+action+which+I+have+not+power+to+forbear%2C+though+I+know+that+another+will+be+offended%2C+or+fall+by+it+into+sin.+If+God+have+made+it+my+duty%2C+even+at+this+time%2C+I+must+not+disobey+Him+and+omit+my+duty+because+another+will+make+it+an+occasion+of+his+sin.+It+must+be+either+a+sinful+or+an+indifferent+action+that+is+scandal%2C+or+something+that+is+in+my+own+power+to+do+or+to+forbear%E2%80%A6+%C2%A7+7.+III.+%E2%80%A6Those+that+are+careless+of+the+consequent+of+their+actions%2C+and+contemn+the+souls+of+other+men%2C+and+will+go+their+own+way%2C+come+of+it+what+will%2C+and+say+%E2%80%98Let+other+men+look+to+themselves%2C%E2%80%99+are+the+commonest+sort+of+scandalizers%3B+and+are+as+culpable+as+a+servant+that+would+leave+hot+water+or+fire+when+the+children+are+like%5Bly%5D+to+fall+into+it%3B+or+that+would+leave+straw+or+gunpowder+near+the+fire%2C+or+would+leave+open+the+doors%2C+though+not+of+purpose+to+let+in+the+thieves.+%C2%A78.+2.+Scandal+is+that+which+tends+to+another%E2%80%99s+fall%2C+either+directly+or+indirectly%2C+immediately+or+remotely%21+The+former+may+easily+be+foreseen%3B+but+the+latter+requires+a+large+foreseeing+comparing+understanding%3A+Yet+this+kind+of+scandal+also+must+be+avoided%3B+and+wise-men+that+would+not+undo+men%E2%80%99s+souls+while+they+think+no+harm%2C+must+look+far+before+them+and+foresee+what+is+like%5Bly%5D+to+be+the+consequent+of+their+actions+at+the+greatest+distance+and+at+many+removes.+3.+Scandals+also+are+Aptitudinal+or+Actual%3A+Many+things+are+apt+to+tempt+and+occasion+the+ruin+of+another+which+yet+never+attain+so+bad+an+end%2C+because+God+disappoints+them%3A+But+that+is+no+thanks+to+them+that+give+the+scandal.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%3A+a+Sum+of+Practical+Theology+and+Cases+of+Conscience%2C+Ch.+12%2C+%E2%80%98Directions+Against+Scandal+as+Given%E2%80%99%3B+p.+81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0856337c3f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0856337c3f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=That%20to%20scandalize%2C%20is%20not%20merely,to%20them%20that%20give%20the%20scandal&amp;text=That%20to%20scandalize%2C%20is%20not%20merely%20to%20displease&amp;text=no%20thanks%20to%20them%20that%20give%20the%20scandal" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Let us then bring our hearts to holy resolutions, and set ourselves upon that which is good, and against that which is evil in ourselves or others, according to our callings, upon this encouragement, that Christ’s grace and power shall go along with us. What had become of that great work of reformation of religion in the latter-spring of the gospel, if men had not been armed with invincible courage… that the cause was Christ’s, and that He would not be wanting to his own cause. Luther igenuously confessed that he carried matters often inconsiderately, and with mixture of passion. But upon acknowledgement, God took not advantage of his errors, but the cause being God’s, and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>

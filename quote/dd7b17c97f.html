<main class="wrap"><figure class="quote" id="q-dd7b17c97f" data-kw="">
<blockquote><p>Verse 17… ‘Why did ye not eat?’ They ought to eat this he-goat, Lev. 6:16, which, when they were not able on account of grief, they supposed was to be burned ([Cornelius] Lapide). … Verse 19… ‘How was I able to eat, etc.?’… that is to say, I was not, therefore, worthy or fit, who should eat. See Dt. 12:7; 26:14; Hos. 9:4 ([Henry] Ainsworth). Therefore, it was to be burned, as was done with the rest (Bonfrerius)… Some maintain that Aaron justifies himself (thus Lyra, Bonfrerius). This does not satisfy; for Moses blames this. It was rather a mitigation of the crime, than a just defense ([Andrew] Willet)… Verse 20: ‘And when Moses heard that, he was content’; ‘He received satisfaction’ Hebrew: ‘it was good, etc.’ Moses received the excuse as just (Menochius, Lapide, Ainsworth). For often the letter of the Law yields to necessities: 2 Chron. 30:18, etc.; Mt. 12:3, 4 (Ainsworth). [Others deny this:] Rather in human compassion he tolerates the infirmities of Aaron (Willet out of [Martin Cellarius] Borrhaus [d. 1564]). Because Aaron had recognized the defect, and because he was unwilling to add affliction to the afflicted (Lyra); and he discerned that the evil was lesser (Willet out of Calvin).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 6 (VA: Master Poole Publishing, 2011), pp. 152-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

0not%20to&amp;text=that%20which%20is%20set%20down%20in%20the%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress.

2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do.

3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England, pp. 6-7, 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

rship,and%20less%20convenient%20for%20the%20mode&amp;text=My%20partaking%20in%20any%20divine%20worship%20which%20is&amp;text=material%20points%20and%20less%20convenient%20for%20the%20mode" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-749f5e1772" data-kw="">
<blockquote><p>Remember that whatever duty you seem obliged to perform, the obligation still supposes that it is not naturally impossible to you, and therefore you are bound to do it as well as you can. And when other men’s force or your natural disability hinders you from doing it as you would, you are not therefore disobliged from doing it at all: but the total omission is worse than the defective performance of it, as the defective performance is worse than doing it more perfectly.ª And in such a case the defects which are utterly involuntary are none of yours imputatively at all, but his that hinders you (unless as some other sin might cause that). ª See Mr. [Joseph] Truman’s book of Natural and Moral Impotency. As if I were in a country where I could have liberty to read and pray, but not to preach, or to preach only once a month and no more: It is my duty to do so much as I can do, as being much better than nothing, and not to forbear all because I cannot do all. Objection: But you must forbear no part of your duty. Answer: True, but nothing is my duty which is naturally impossible for me to do. Either I can do it, or I cannot: If I can, I must (supposing it a duty in all other respects); but if I cannot, I am not bound to it. … Direction 14. Remember that no material duty is formally a duty at all times: that which is a duty in its season is no duty out of season. Affirmative precepts bind not to all times (except only to habits [inward dispositions] or the secret intention of our ultimate end, so far as is sufficient to animate and actuate the means while we are waking and have the use of reason.. Praying and preaching, that are very great duties, may be so unseasonably performed as to be sins: If forbearing a prayer or sermon or sacrament one day or month be rationally like to procure your help or liberty to do it afterward, when that once or few times doing it were like to hinder you from doing it anymore, it would be your duty then to forbear it for that time (unless in some extraordinary case): For even for the life of an ox or an ass, and for mercy to men’s bodies, the rest and holy work of a Sabbath might be interrupted: much more for the souls of many. Again I warn you, as you must not pretend the interest of the end against a peremptory absolute command of God, so must you not easily conclude a command to be absolute and peremptory to that which certainly contradicts the end: nor easily take that for a duty which certainly is no means to that good which is the end of duty or which is against it. Though yet no seeming aptitude as a means must make that seem a duty which the prohibition of God has made a sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: White, 1673), pt. 3, ch. 2, sect. 24, direction 13, pp. 685-86</span></figcaption>

+sins%3A+If+forbearing+a+prayer+or+sermon+or+sacrament+one+day+or+month+be+rationally+like+to+procure+your+help+or+liberty+to+do+it+afterward%2C+when+that+once+or+few+times+doing+it+were+like+to+hinder+you+from+doing+it+anymore%2C+it+would+be+your+duty+then+to+forbear+it+for+that+time+%28unless+in+some+extraordinary+case%29%3A+For+even+for+the+life+of+an+ox+or+an+ass%2C+and+for+mercy+to+men%E2%80%99s+bodies%2C+the+rest+and+holy+work+of+a+Sabbath+might+be+interrupted%3A+much+more+for+the+souls+of+many.+Again+I+warn+you%2C+as+you+must+not+pretend+the+interest+of+the+end+against+a+peremptory+absolute+command+of+God%2C+so+must+you+not+easily+conclude+a+command+to+be+absolute+and+peremptory+to+that+which+certainly+contradicts+the+end%3A+nor+easily+take+that+for+a+duty+which+certainly+is+no+means+to+that+good+which+is+the+end+of+duty+or+which+is+against+it.+Though+yet+no+seeming+aptitude+as+a+means+must+make+that+seem+a+duty+which+the+prohibition+of+God+has+made+a+sin.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%3A+White%2C+1673%29%2C+pt.+3%2C+ch.+2%2C+sect.+24%2C+direction+13%2C+pp.+685-86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F749f5e1772.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/749f5e1772.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Remember%20that%20whatever%20duty%20you%20seem,of%20God%20has%20made%20a%20sin&amp;text=Remember%20that%20whatever%20duty%20you%20seem%20obliged%20to&amp;text=the%20prohibition%20of%20God%20has%20made%20a%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a79e38bdde" data-kw="">
<blockquote><p>If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.</p></blockquote>

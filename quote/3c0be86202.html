<blockquote><p>Answer 1: Here be the white-shifts of Mr. Sanderson, Paybodie, Downham, who place loyalty above charity. We owe to our brother love, but to the ruler (say they) love and justice. [Answer] 2. It is true, these duties which we owe to others by way of justice are more obligatory than these which we owe only by way of charity, caeteris paribus [all things being equal], when duties of the law of Nature, and moral Law, are compared together, then indeed the duties which we owe, both by the tie of justice and charity, are more obligatory, than the duties that we owe only by the tie of charity. As for example: My father is in danger before my eyes to be drowned in one deep water; and before my eyes also, my neighbor and friend is in danger of the like kind; the two ties and bands of justice and charity, both by the fifth and sixth Commandments are more obligatory, hic &amp; nunc [here and now], and do more strictly oblige that I run to succor, and preserve the life of my father, than the life of my neighbor; for the obligation to my neighbor, is only charity, by the obligation of the sixth Commandment, which obligation ceases, hic &amp; nunc, at this time when my father’s life is in hazard; and thus far the doctor’s argument goes for strong, as schoolmen, casuists, and divines teach. But it is not to a purpose for the Doctor’s; For all offices and duties generally, and universally, of whatever kind which we owe by way of justice, are not more obligatory than duties which we owe only by way of charity, as when duties of a positive commandment of God, enjoined by our superiors, and duties which we owe by charity only are compared together, then the Doctor’s major proposition is not clear of itself, as they dream, nor do casuists or [William] Ames, or divines say with them, but truth, and all our divines say against them. Let us suppose that the King, and convocation, and assembly of priests and prophets of Israel make a canon according to God’s Word. That no manner of man presume to eat showbread, save the priests only. All men owe obedience to this, both because it is God’s express Law, and by the band of justice, the elders and assembly of the ancients have forbidden it. But if our Doctor’s argument stand strong, David at the point and hazard of famishing for hunger, sinned in eating showbread, yet Christ acquits him of all sin, and says, Mt. 12:5, he and his followers are [in Greek] blameless. Now David was under a duty by mercy, and love to his own life, and the lives of his followers, to eat showbread, and he was under the band of justice, by the law of the ancients of Israel, and God’s law, not to eat. Therefore in some cases, when our superiors’ commandments are only positive laws, they are not more obligatory, than duties of charity only commanded in the law of nature. I clear it further thus: I see my neighbor in danger before my eyes of drowning, and my father commands me to go and labor, or sow his farm in that time while I am to preserve the life of my neighbor in present danger, to lose his life in a great water. By the Doctor’s maxim, I am under the higher obligatory tie of justice to obey my father, who commands a thing both lawful and necessary by virtue of the higher commandment, to wit, the First of the Second Table, than I am obliged by the sixth Commandment, and of charity only, to give present succor and help to my dying neighbor; so I must let my neighbor die in the waters, to give a duty of justice to my father, of far less necessity. I would not commit my conscience to such casuists, as are the doctors of Aberdeen. But if the doctors would see with some new light of reason; it is clear that not only the tie of justice makes the precept more obligatory, but also the weightiness of the thing commanded; Yea, and if the positive commandments of the Lord our God, who of justice and kingly sovereignty has right to ask obedience of us above all earthly superiors do yield and cede as less obligatory, than commandments of love only, that are commanded in the law of nature, what do our Doctors clatter and fable to us of a right of justice that mortal rulers have to command in things indifferent, from which the destruction of souls does arise? For these commandments of rulers, (kneel religiously before bread, the vice-gerent image of Christ crucified) (keep human holy-days), cross the air with your thumb above a baptized infant’s face) at best, are but positive commandments, not warranted by God’s Word. But shall they be more obligatory by a supposed band of justice that prelates have over us to command, such toys than this divine law of God and Nature, Rom. 14. For indifferent days, meats, surplice, destroy not him for whom Christ died? All the casuists, and schoolmen, Navarra, Sylvester, Sanchez, Raphael de la Torre, Meratius, Duvallius, Thomas, Scotus, Bonaventura, Suarez, Vasquez, Grego. de Valentia, Albertus, Richardus, Biel, Corduba, Angelus, Adrianus, Alphonsus, Becanus, yea, and all the host of our divines cry with Scripture that mercy and the precepts of love, and of the Law of nature, are more obligatory than sacrifice, burnt offerings, and God’s own positive laws, yea, and that positive laws lose their obligatory power, and cease to be laws, when the laws of nature and necessary duties of mercy and love (as not to murder our brother) (not to scandalize) stands in their way. I might weary the reader here with citations, and bewilder myself also, but it is a point of divinity denied by none at all. [Answer] 3. What we owe of Justice to our superiors, is indeed both a moral debt of obedience, and a debt of justice, and law which rulers may seek by their place, and ex jure, as Aristotle says, but this right is limited; Rulers have no right to seek absolute obedience, but only in the Lord, not against charity. And though the place of rulers be authoritative, yet their commanding power, as touching the matter of what they enjoin is only ministerial, and they cannot but in God’s place exact, that which is God’s due, and seeing God Himself, if he should immediately in his own person command, He would not urge a positive commandment, far less the commandment of light and vain ceremonies, against and beyond the precept of love, not to destroy a soul for whom Christ died. Therefore, superiors under God, who borrow all their right from God, cannot have a higher right than God has. [Answer] 4. The comparison [of the Doctors] of a man who owes money to a creditor, and owes money to the poor, is close off the way, for he is obliged to pay the creditor first, but the case here is far otherwise; The debt of practicing indifferent feathers and straws, such as kneeling, crossing, wearing surplice, is neither like the debt owing to the poor, nor to the creditor; For nature’s law, and God’s Word, 1 Cor. 10:18-19, makes the non-practice, non-murdering obedience to God, when the practice of indifferent things, is a soul-stumbling to the weak, and the practicing is but at its best obedience to a positive Law, and ought to stoop, and go off the way and disappear when nature’s Law (murder not) does come in its way. When the Doctors put loyalty above charity, they suppose obedience to commandments commanding scandalizing of souls to be loyalty to superiors, which is questioned, it being treason to the Sovereign of heaven and earth to destroy his image; it is tatherfken as loyalty by our Doctors, but not proven to be loyalty, and so a vain question here, whether loyalty be above charity or not.</p></blockquote>

charity%2C+as+when+duties+of+a+positive+commandment+of+God%2C+enjoined+by+our+superiors%2C+and+duties+which+we+owe+by+charity+only+are+compared+together%2C+then+the+Doctor%E2%80%99s+major+proposition+is+not+clear+of+itself%2C+as+they+dream%2C+nor+do+casuists+or+%5BWilliam%5D+Ames%2C+or+divines+say+with+them%2C+but+truth%2C+and+all+our+divines+say+against+them.+Let+us+suppose+that+the+King%2C+and+convocation%2C+and+assembly+of+priests+and+prophets+of+Israel+make+a+canon+according+to+God%E2%80%99s+Word.+That+no+manner+of+man+presume+to+eat+showbread%2C+save+the+priests+only.+All+men+owe+obedience+to+this%2C+both+because+it+is+God%E2%80%99s+express+Law%2C+and+by+the+band+of+justice%2C+the+elders+and+assembly+of+the+ancients+have+forbidden+it.+But+if+our+Doctor%E2%80%99s+argument+stand+strong%2C+David+at+the+point+and+hazard+of+famishing+for+hunger%2C+sinned+in+eating+showbread%2C+yet+Christ+acquits+him+of+all+sin%2C+and+says%2C+Mt.+12%3A5%2C+he+and+his+followers+are+%5Bin+Greek%5D+blameless.+Now+David+was+under+a+duty+by+mercy%2C+and+love+to+his+own+life%2C+and+the+lives+of+his+followers%2C+to+eat+showbread%2C+and+he+was+under+the+band+of+justice%2C+by+the+law+of+the+ancients+of+Israel%2C+and+God%E2%80%99s+law%2C+not+to+eat.+Therefore+in+some+cases%2C+when+our+superiors%E2%80%99+commandments+are+only+positive+laws%2C+they+are+not+more+obligatory%2C+than+duties+of+charity+only+commanded+in+the+law+of+nature.+I+clear+it+further+thus%3A+I+see+my+neighbor+in+danger+before+my+eyes+of+drowning%2C+and+my+father+commands+me+to+go+and+labor%2C+or+sow+his+farm+in+that+time+while+I+am+to+preserve+the+life+of+my+neighbor+in+present+danger%2C+to+lose+his+life+in+a+great+water.+By+the+Doctor%E2%80%99s+maxim%2C+I+am+under+the+higher+obligatory+tie+of+justice+to+obey+my+father%2C+who+commands+a+thing+both+lawful+and+necessary+by+virtue+of+the+higher+commandment%2C+to+wit%2C+the+First+of+the+Second+Table%2C+than+I+am+obliged+by+the+sixth+Commandment%2C+and+of+charity+only%2C+to+give+present+succor+and+help+to+my+dying+neighbor%3B+so+I+must+let+my+neighbor+die+in+the+waters%2C+to+give+a+duty+of+justice+to+my+father%2C+of+far+less+necessity.+I+would+not+commit+my+conscience+to+such+casuists%2C+as+are+the+doctors+of+Aberdeen.+But+if+the+doctors+would+see+with+some+new+light+of+reason%3B+it+is+clear+that+not+only+the+tie+of+justice+makes+the+precept+more+obligatory%2C+but+also+the+weightiness+of+the+thing+commanded%3B+Yea%2C+and+if+the+positive+commandments+of+the+Lord+our+God%2C+who+of+justice+and+kingly+sovereignty+has+right+to+ask+obedience+of+us+above+all+earthly+superiors+do+yield+and+cede+as+less+obligatory%2C+than+commandments+of+love+only%2C+that+are+commanded+in+the+law+of+nature%2C+what+do+our+Doctors+clatter+and+fable+to+us+of+a+right+of+justice+that+mortal+rulers+have+to+command+in+things+indifferent%2C+from+which+the+destruction+of+souls+does+arise%3F+For+these+commandments+of+rulers%2C+%28kneel+religiously+before+bread%2C+the+vice-gerent+image+of+Christ+crucified%29+%28keep+human+holy-days%29%2C+cross+the+air+with+your+thumb+above+a+baptized+infant%E2%80%99s+face%29+at+best%2C+are+but+positive+commandments%2C+not+warranted+by+God%E2%80%99s+Word.+But+shall+they+be+more+obligatory+by+a+supposed+band+of+justice+that+prelates+have+over+us+to+command%2C+such+toys+than+this+divine+law+of+God+and+Nature%2C+Rom.+14.+For+indifferent+days%2C+meats%2C+surplice%2C+destroy+not+him+for+whom+Christ+died%3F+All+the+casuists%2C+and+schoolmen%2C+Navarra%2C+Sylvester%2C+Sanchez%2C+Raphael+de+la+Torre%2C+Meratius%2C+Duvallius%2C+Thomas%2C+Scotus%2C+Bonaventura%2C+Suarez%2C+Vasquez%2C+Grego.+de+Valentia%2C+Albertus%2C+Richardus%2C+Biel%2C+Corduba%2C+Angelus%2C+Adrianus%2C+Alphonsus%2C+Becanus%2C+yea%2C+and+all+the+host+of+our+divines+cry+with+Scripture+that+mercy+and+the+precepts+of+love%2C+and+of+the+Law+of+nature%2C+are+more+obligatory+than+sacrifice%2C+burnt+offerings%2C+and+God%E2%80%99s+own+positive+laws%2C+yea%2C+and+that+positive+laws+lose+their+obligatory+power%2C+and+cease+to+be+laws%2C+when+the+laws+of+nature+and+necessary+duties+of+mercy+and+love+%28as+not+to+murder+our+brother%29+%28not+to+scandalize%29+stands+in+their+way.+I+might+weary+the+reader+here+with+citations%2C+and+bewilder+myself+also%2C+but+it+is+a+point+of+divinity+denied+by+none+at+all.+%5BAnswer%5D+3.+What+we+owe+of+Justice+to+our+superiors%2C+is+indeed+both+a+moral+debt+of+obedience%2C+and+a+debt+of+justice%2C+and+law+which+rulers+may+seek+by+their+place%2C+and+ex+jure%2C+as+Aristotle+says%2C+but+this+right+is+limited%3B+Rulers+have+no+right+to+seek+absolute+obedience%2C+but+only+in+the+Lord%2C+not+against+charity.+And+though+the+place+of+rulers+be+authoritative%2C+yet+their+commanding+power%2C+as+touching+the+matter+of+what+they+enjoin+is+only+ministerial%2C+and+they+cannot+but+in+God%E2%80%99s+place+exact%2C+that+which+is+God%E2%80%99s+due%2C+and+seeing+God+Himself%2C+if+he+should+immediately+in+his+own+person+command%2C+He+would+not+urge+a+positive+commandment%2C+far+less+the+commandment+of+light+and+vain+ceremonies%2C+against+and+beyond+the+precept+of+love%2C+not+to+destroy+a+soul+for+whom+Christ+died.+Therefore%2C+superiors+under+God%2C+who+borrow+all+their+right+from+God%2C+cannot+have+a+higher+right+than+God+has.+%5BAnswer%5D+4.+The+comparison+%5Bof+the+Doctors%5D+of+a+man+who+owes+money+to+a+creditor%2C+and+owes+money+to+the+poor%2C+is+close+off+the+way%2C+for+he+is+obliged+to+pay+the+creditor+first%2C+but+the+case+here+is+far+otherwise%3B+The+debt+of+practicing+indifferent+feathers+and+straws%2C+such+as+kneeling%2C+crossing%2C+wearing+surplice%2C+is+neither+like+the+debt+owing+to+the+poor%2C+nor+to+the+creditor%3B+For+nature%E2%80%99s+law%2C+and+God%E2%80%99s+Word%2C+1+Cor.+10%3A18-19%2C+makes+the+non-practice%2C+non-murdering+obedience+to+God%2C+when+the+practice+of+indifferent+things%2C+is+a+soul-stumbling+to+the+weak%2C+and+the+practicing+is+but+at+its+best+obedience+to+a+positive+Law%2C+and+ought+to+stoop%2C+and+go+off+the+way+and+disappear+when+nature%E2%80%99s+Law+%28murder+not%29+does+come+in+its+way.+When+the+Doctors+put+loyalty+above+charity%2C+they+suppose+obedience+to+commandments+commanding+scandalizing+of+souls+to+be+loyalty+to+superiors%2C+which+is+questioned%2C+it+being+treason+to+the+Sovereign+of+heaven+and+earth+to+destroy+his+image%3B+it+is+tatherfken+as+loyalty+by+our+Doctors%2C+but+not+proven+to+be+loyalty%2C+and+so+a+vain+question+here%2C+whether+loyalty+be+above+charity+or+not.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+Appendix%2C+%E2%80%98An+Introduction+to+the+Doctrine+of+Scandal%E2%80%99+%7C+Question+4%2C+p.+49-53%2C+this+is+in+the+context+of+civil+and%2For+episcopally+imposed+ceremonies+going+under+the+name+of+indifferent+matters%2C+though+they+scandalize+the+godly.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3c0be86202.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3c0be86202.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relations-between-the-1st-2nd-tables-of-the-law/#:~:text=Answer%201%3A%20Here%20be%20the%20white%2Dshifts,loyalty%20be%20above%20charity%20or%20not&amp;text=Answer%201%3A%20Here%20be%20the%20white%2Dshifts%20of%20Mr&amp;text=here%2C%20whether%20loyalty%20be%20above%20charity%20or%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. As regards the outward administration of the Supper it can only be dispensed by an orderly occupant of the preaching office, in company with whom, chiefly for distributing the cup, there may also be other servants of the Church, elders and deacons, at his side to help him. Polan (VI, 56): ‘Ministers of the Church, and these include pastors, and presbyters or elders (seniores) added to the pastors for the government of the Church and deacons lawfully called, ought to preside at the administration of the Eucharist, no others. If the pastors alone can carry through the administration, as in small gatherings, then the help of others is not required, as Tertullian writes (De corona 3): ‘We do not take the sacrament of the Eucharist from the hands of others than those presiding.’ But if the gatherings are large and the pastors are not sufficient to perform the administration of the Supper alone, they may co-opt elders and deacons to help them, especially in the distribution of the cup.’ Heidegger (XXV, 73): ‘The first to administer was the same as he who instituted it; those who followed them, the pastors and the rulers of the Church (rectores) did and do administer it. No more than baptism or the preaching of God’s Word can it be administered by private persons or by any private person at a banquet.&#x27;</p></blockquote>

<blockquote><p>Regarding laymen, suppose the Lord’s Supper is not administered in every way it ought to be (as through much of Church history). A layman ought not then to conform to and participate in such an inconvenient and actively scandalous ceremony. This may preclude one from receiving the Supper for many years or most of one’s life. Yet in the time of Hannah, were not the Israelites still bound to receive the sacrificial meals in 1 Sam. 2:12–17, though the corrupt priests had greatly marred them, adjoining the threat of physical coercion; and were not the Israelites in some measure to be blamed for withdrawing from and abhorring the offering of the Lord?</p></blockquote>

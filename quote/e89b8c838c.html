<main class="wrap"><figure class="quote" id="q-e89b8c838c" data-kw="">
<blockquote><p>Rather the question is Are the fathers to be considered as judges, capable of deciding controversies of faith by their infallible authority? … We do not use them as judges whose opinion is to be acquiesced in absolutely and without examination and as the standard of truth in doctrines of faith or in the interpretation of the Scriptures.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Answer before the Diet of Worms</cite>, 18 April 1521</span></figcaption>

</figure><figure class="quote" id="q-8317e796d9" data-kw="">
<blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote>

</figure><figure class="quote" id="q-16910d1a50" data-kw="">

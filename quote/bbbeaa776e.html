<main class="wrap"><figure class="quote" id="q-bbbeaa776e" data-kw="inadequate conceptions">
<blockquote><p>What we cannot take in by one adequate conception as being finite, we divide into various inadequate conceptions so as to obtain some knowledge of him (which is not a proof of error in the intellect, but only of imperfection). Thus omnipotence is the divine essence itself apprehended as free from every obstacle in acting; eternity is the essence of God as without limit in duration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.5.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/knowledge-of-god.html">Knowledge of God</a> › <a href="../topics/existence-and-knowledge-of-god/knowledge-of-god/incomprehensibility.html">Incomprehensibility</a></span><span class="t"><a href="../topics/existence-and-knowledge-of-god/knowledge-of-god.html">Knowledge of God</a> › <a href="../topics/existence-and-knowledge-of-god/knowledge-of-god/archetype-and-ectype.html">Archetype and ectype</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a243bfa1f6" data-kw="repentance anthropopathism">

</figure><figure class="quote" id="q-acf12c4772" data-kw="revelation nature Scripture">
<blockquote><p>God has condescended to reveal himself to us both in nature and in the Scriptures. First, that we may know that he is (with respect to existence) against the atheist. Second, that we may know what he is (with respect to his nature and attributes) against the heathen. Third, that we may know who he is (with respect to the persons) against the Jews and heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.1.1–2</span></figcaption>

</figure><figure class="quote" id="q-434f3c8a49" data-kw="eternal life vision">
<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-debfb648a2" data-kw="">
<blockquote><p>…no doubt it was this party headed by Mr. Hamilton, who, as they violently pushed forward the country people to a rising, so by their indiscretion and want of conduct, evidently ruined the west country army, and effectually hindered the fair prospect there once was, that they might have been a mean of delivering the church and nation from the burdens they were under; and the upshot of all was, divisions came in, joint measures were not taken. A great many left them when they saw whither matters were going, and far more never joined them; and such as continued together could never do any thing of consequence: and when they came to be attacked, the high-flyers withdrew first, and left the poor country men to the mercy of the king’s army.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-3051b669e2" data-kw="">
<blockquote><p>…the decision of a Convention of Estates, or Parliament, in June to levy a ‘cess’, or tax, for the express purpose of raising additional troops to suppress the field-meetings. To Hamilton in particular, opposition to this tax became a test of orthodoxy, on a par with opposition to the indulgence. There is considerable evidence that in the summer and autumn of 1678 both he and Kersland sought to influence the younger field-preachers to adopt an increasingly militant tone in their preaching, and to condemn both those who payed the ‘cess’ and the ministers who had accepted the Indulgence. It is also clear that during this period both Hamilton and Kersland became increasingly associated with Richard Cameron… Throughout the 1670’s it had been customary for the leading field-preachers, such as John Welsh, to be accompanied by armed bodyguards as they moved around the country. This was seen as a necessary precaution for their own safety… Having attached himself to Cameron, Hamilton concluded that Cameron too should enjoy the same protection. He therefore gathered a body of men… whom he engaged to accompany Cameron around the country… Hamilton himself assumed the command of this group. A show of military order was observed, though neither Hamilton himself, nor, it apprears, any of those whom he led, had any military experience. However, it satisfied Hamilton’s fondness for demonstration and for display, and it was, of course, fully consistent with the militant approach which he advocated.</p></blockquote>

</figure><figure class="quote" id="q-a3129fa969" data-kw="">
<blockquote><p>Yea and the injunctions and statutes do permit and give leave to speak against all abuses in all things (but with these exceptions), that we speak not reproachfully, willfully and obstinately, but in humility as we ought, and as being under correction and judgment of magistrates if we speak amiss; read the statute and you shall find such like words; yea and experience will teach you that of late and also long ago both at Paul’s Cross and in the Court some preachers have boldly condemned abuses in the state, and speaking under correction of the magistrate, have not only been suffered but commended of the Queen Majesty herself.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0029f6e50b" data-kw="">
<blockquote><p>To be short, by little and little they have surcharged the poor Church with the yoke of Judicial [Judaical?] Ceremonies, contrary to the express commandment of the Apostle: Why tempt ye God to put a yoke on the neck of the Disciples, which neither we nor our fathers were able to bear.

Our Saviour Jesus Christ, who is the body and truth of all the shadows and figures of the Mosaical Law, hath put away by his own proper blood all those ordinances, and hath fixed them to his crosse, according to the saying of the Apostle, He hath blotted out the handwriting of ordinances which was against us, and took it away, nailing it to his crosse. The Church of Rome hath not been content to repatch the vail of Ceremonies which Christ Jesus hath torn by his death: but which is more she hath thereto sowed all sorts of pieces and patches, which she hath borrowed of ancient Paganism.

And indeed it is of the ancient Pagans that she hath learned to join the spiritual power with the temporal: for Jesus Christ did not exercise on earth any power or jurisdiction temporal, insomuch as he refused to divide the inheritance between two brothers. But the heathen Emperors did join both the powers together, qualifying themselves, for the most part, Emperors and Sovereign Pontiffs. So the Popes boast of both the swords, holding that Jesus Christ hath given them both the earthly and the heavenly Empire. To manifest that this is the Beast to which the Dragon viz. the Ethnic Empire gave his throne. Rev. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-drelincourt.html">Charles Drelincourt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The root of Romish rites and ceremonies showing that the Church of Rome hath borrowed most part of her ceremonies of the Jews &amp; ancient pagans, and that from this spring proceeded the Jubilee</cite>, (London, 1630), p. 7.</span></figcaption>

<blockquote><p>7. If we may make images and crosses alike in shape, but dislike in use, in God’s worship, we may bring in golden calves to the temples [church buildings], and the image of Dagon, and the Sidonian gods, and altars such as Josiah destroyed, so at their first molding we imprint on them chaste and innocent religious intentions and signification, and make them alike in shape, but dislike in use to heathen worship. But sure the calf of Egypt and the calf that Aaron made, though like in shape, yet were dislike in use.</p></blockquote>

</figure><figure class="quote" id="q-8af35392ec" data-kw="">
<blockquote><p>And here, that we may not be drawn aside by the prevalence of vulgar error, it should be understood that ceremonies are not, therefore, unlawful, because they are significant. For the holy kiss, respecting which mention is made in Rom. 16:16, was a sign by which they wished to signify the fraternal love and union of all Christians. And even the learned Peter Martyr, is so far from rejecting ceremonies because they are significant, that he says, ‘they are the more laudable, if, in the way of sermons, they admonish us of some duty.’ (on 1 Cor. 11)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, tr. Josiah Allport (1634; 1846), Determination 20, ‘The English Church is fully competent to bind to the observance of ceremonies’, p. 331 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-529047fc76" data-kw="">
<blockquote><p>For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.</p></blockquote>

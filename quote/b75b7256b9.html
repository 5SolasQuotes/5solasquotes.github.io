<main class="wrap"><figure class="quote" id="q-b75b7256b9" data-kw="virgin birth Holy Spirit">
<blockquote><p>The conception is that by which Christ was invisibly formed in the womb of the blessed virgin, without the concurrence of man, but by the power and overshadowing of the Holy Spirit alone: “That which is conceived in her is of the Holy Ghost” (Mt. 1:20). In this a twofold principle must be remarked: an active—the Holy Spirit; a passive—the blessed virgin. The active principle was not a man (as in ordinary generation) because the conception should be such as to permit the virginity of the blessed virgin to remain pure and inviolate. It was also one by which Christ should be free from all taint of sin, which is usually propagated and contracted by ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.11.2–3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c02781e8f" data-kw="communicatio idiomatum">
<blockquote><p>The communication of attributes (concerning which we now dispute) is an effect of the union by which the properties of both natures became common to the person. Hence the phraseology (or the manner of speaking) arises by which what is proper to one nature is predicated of the person denominated from the other. With respect to the person the effects again are threefold: (1) a communication of attributes and of the properties of each nature to the person; (2) communication of office and of effects, by which the mediatorial works bearing upon our salvation are ascribed to the person acting according to both natures; (3) communication of honor and of worship due to the God-man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.8.2–3</span></figcaption>

</figure><figure class="quote" id="q-6b2d9a44b2" data-kw="local ascension against ubiquity">
<blockquote><p>Did Christ ascend properly by a local movement from the lower places to the supreme heaven of the blessed; or metaphorically by disappearance? We affirm the former and deny the latter against the Lutherans. This question is introduced on account of the Lutherans and those who ascribe ubiquity to the body of Christ.</p></blockquote>

</figure><figure class="quote" id="q-26919745da" data-kw="sinless without immaculate Mary">
<blockquote><p>Thus there is no necessity to have recourse to the immaculate conception of Mary. For although there is no creature of whatever power possessed who can bring a clean thing out of an unclean (Job 14:4), still the power of God is not thus to be measured (with whom nothing is impossible and who calls those things which are not).</p></blockquote>

</figure><figure class="quote" id="q-2838d2990a" data-kw="two wills dyothelite">
<blockquote><p>The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6, 7, 11); (2) two wills are ascribed to him (“not my will, but thine, be done,” Lk. 22:42). Nor does it follow that there are two willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will.</p></blockquote>

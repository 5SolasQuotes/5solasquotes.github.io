<blockquote><p>she would not have needed the redemption and salvation which is through Christ, which is unfitting, that Christ is not the Savior of all men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 11-13 Latin | He, however, is speaking not of original, but of actual sin, which is acknowledged, among others, by Dominicus à Soto, bk. 3, Of Nature &amp; Grace, ch. 4, and Petavius, Dogmatic Theology, tome 4, pt. 2, bk. 14, ch. 1, §14. Wherefore Lombard’s annotator in bk. 3, dist. 3, ch. 2, and Boyvin in Theology of Scotus, pt. 2, On the Incarnation, ch. 3, quest. 1, p. 286, in vain extend these words to original sin. Thomas, indeed, in Summa, pt. 3, quest. 27, art. 2, teaches that Mary “incurred the stain of original fault,” otherwise:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>7. The virginity of Mary after her child-bearing, to wit, that as it is most certain, that before her child-bearing, she was unknown of man; so also she remained a virgin after the same unto her dying day, is religiously believed: yet there is nothing expressly found concerning this point in the holy Scriptures, neither doth it belong any-wise unto the mystery of our salvation.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

<blockquote><p>[Signification] 2. Infinite, without end or ceasing, where there is no time following. 2 Sam. 6:23, ‘Michal had no child until her death;’ that is, she never had any. Mt. 28:20, ‘I am with you always, until the end of the world;’ that is, forever. Ps. 110:1 &amp; 123:2. In which [second] of these two significations [the first was ‘unto a certain and appointed time’, Gen. 49:10; Rom. 11:25], we should understand, that in Mt. 1, verse last, ‘Until she had brought forth her first begotten son.’ As it is doubtful among divines: so is it not needful for us to know, being no article of our faith, nor any branch of the Moral Law; yet it is commonly received (as I take it) that Mary was a virgin before the birth, in the birth and ever after the birth; but not by the vow of perpetual virginity, whereof there is no ground in all Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-wilson.html">Thomas Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Dictionary</cite>, … (London, 1612), ‘Until’, pp. 512-3. Wilson (1563–1622) was an Anglican clergyman popular with the puritans.</span></figcaption>

it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5466316c74" data-kw="">
<blockquote><p>Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-marck.html">Johannes Marckius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium Theologiae Christianae</cite>, … (Groningen, 1690), XVIII, section 11 as quoted by Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer (1950; Wipf &amp; Stock, 2007), ch. 17, section 10, pp. 422-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.”

y%E2%80%99s%20virginity%20did%20not%20flow%20from,because%20he%20sensed%20a%20gracious%20miracle&amp;text=Mary%E2%80%99s%20virginity%20did%20not%20flow%20from%20a%20vow&amp;text=of%20Jesus%2C%20because%20he%20sensed%20a%20gracious%20miracle" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-d60f1b749f" data-kw="">
<blockquote><p>The Symbolum Quicunque [Athanasian Creed] is a remarkably clear and precise summary of the doctrinal decisions of the first four œcumenical Councils (from A.D. 325 to A.D. 451), and the Augustinian speculations on the Trinity and the Incarnation. Its brief sentences are artistically arranged and rhythmically expressed. It is a musical creed or dogmatic psalm…The first part (ver. 3–28) sets forth the orthodox doctrine of the Holy Trinity, not in the less definite Athanasian or Nicæno-Constantinopolitan, but in its strictest Augustinian form, to the exclusion of every kind of subordination of essence…The second part (ver. 29–44) contains a succinct statement of the orthodox doctrine concerning the person of Christ, as settled by the general Councils of Ephesus 431 and Chalcedon 451, and in this respect it is a valuable supplement to the Apostles’ and Nicene Creeds. It asserts that Christ had a rational soul (νοῦς, πνεῦμα), in opposition to the Apollinarian heresy, which limited the extent of his humanity to a mere body with an animal soul inhabited by the divine Logos. It also teaches the proper relation between the divine and human nature of Christ, and excludes the Nestorian and Eutychian or Monophysite heresies, in essential agreement with the Chalcedonian Symbol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creeds of Christendom</cite>, (New York: Harper &amp; Brothers, Publishers, 1878), 1.37, 39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b037663d9" data-kw="">

</figure><figure class="quote" id="q-a7f66a60b5" data-kw="">
<blockquote><p>We, all and every one of us underwritten, protest, that after long and due examination of our own consciences in matters of true and false religion, are now thoroughly resolved in the truth, by the Word and Spirit of God. And, therefore, we believe with our hearts, confess with our mouths, subscribe with our hands, and constantly affirm, before God and the whole world, that this only is the true Christian faith and religion, pleasing God and bringing salvation to man, which is now, by the mercy of God, revealed to the world by the preaching of the blessed Evangel, and is received, believed, and defended by many and sundry notable kirks and realms, but chiefely by the Kirk of Scotland, the king’s Majesty, and three Estates of this realm, as God’s eternal truth, and only ground of our salvation; as more particularly is expressed in the confession of our faith, stablished, and publicly confirmed, by sundry acts of Parliaments and now, of a long time has been openly professed by the king’s Majesty, and whole body of his realm, both in burgh and land. To the which Confession and form of religion we willingly agree in our consciences, in all points, as unto God’s undoubted truth and verity, grounded only upon his written Word. And, therefore, we abhor and detest all contrary religion and doctrine, but chiefly, all kind of Papistry, in general and particular heads, even as they are now damned and confuted by the Word of God, and Kirk of Scotland… We, therefore, willing to take away all suspicion of hypocrisy, and of such double dealing with God and his Kirk, protest, and call the Searcher of all hearts to witness, that our minds and hearts do fully agree with this our confession, promise, oath, and subscription, so that we are not moved for any worldly respect, but are persuaded only in our consciences, through the knowledge and love of God’s true religion, printed in our hearts by the Holy Spirit, as we shall answer to Him in the day when the secrets of all hearts shall be disclosed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Kirk of Scotland</cite>, vol. 3, pp. 501-5</span></figcaption>

</figure><figure class="quote" id="q-4f39da9927" data-kw="">
<blockquote><p>The Estates of Parliament, now presently convened in this second session of the second triennial parliament, by virtue of an act of the Committee of Estates, who had power and authority from the last parliament for convening the parliament, having seriously considered the Catechisms, viz. the Larger and Shorter ones, with the Confession of Faith, with three acts of approbation thereof by the Commissioners of the General Assembly, presented unto them by the Commissioners of the said General Assembly; do ratify and approve the said Catechisms, Confession of Faith, and Acts of Approbation of the same, produced as it is; and ordains them to be recorded, published, and practiced.</p></blockquote>

<blockquote><p>Article 1… the Sieur de la Milletiere… a fellow who would not submit himself unto their judgment and authority, and who has told the world that for these two last years he had no other intention than to incorporate himself into the communion of the Church of Rome, and to form a party against all the Reformed Churches, impugning with might and main the common confessions of all Protestants, perpetually accusing them of contemning the Catholic, that is, his Romish Church, and of schism from it, and propounding to them for the Rule of their Faith the Acts and Canons of the Council of Trent… But the said de la Milletiere having given it under his own hand in writing that he would submit himself unto the judgment of this synod; when as the commissioners, whom he himself had nominated, brought in their report… the Synod did once more refuse him, especially, because that he had fully opened his intentions, and in formal words declared that by that writing subscribed with his own hand, he never promised to submit his doctrine, but himself and person to the judgment of the Assembly; who taking, as in truth they could not but take this distinction, such an one as it was, in any other sense than a notorious scorn of their just and charitable endeavours for his eternal welfare; They told him plainly, that neither they nor any of their commissioners would waste a moment more of their precious time about him, and adjured him… to give Glory unto God, and to relinquish his most impious designs; and added farther, that they did as the National Synod of Alanson had done before them, declare, that for diverse years past he was not to be reputed a member of our Reformed Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick, Synodicon (London, 1692), 3rd National Synod of Charenton, ch. 15, pp. 476-77</span></figcaption>

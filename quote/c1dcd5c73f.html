<blockquote><p>5. Was original righteousness natural to man? The opinion of the papists XLIV. It is asked, fifth, whether original righteousness was natural to man. The Pelagianizing papists—so that they may obtain: (1) that concupiscence, whose second acts only does original righteousness control, and whose first act it does not take away, is not itself sin, and accordingly, if it does not stand in the way, man can be perfect here and now; (2) that man was created in purely natural things, that is, by nature, neither just nor unjust; (3) that the natural things of man survived whole after the fall—admit indeed an original righteousness, but one that is supernatural to man, added to nature, so that it may check the natural discord of the flesh and spirit. Meanwhile, they do not deny that it arose with man, and that it would have helped him even in natural things. And the opinion of the Reformed with their reasons The Reformed, although they do not acknowledge that original righteousness (as Flacius [a radical Lutheran] desired) is the very nature of man, yet do acknowledge that it is natural to man, insofar as it was owed to his integral nature in such a way that it could not be morally whole without it. For if (1) it were supernatural, then its opposite, that is, carnal concupiscence or the discord of flesh and spirit, would be natural to man, and thus good and from God, which is contrary to the Scriptures (Rom. 7:7–8; 1 John 2:16). (2) Thus the rebellion of the flesh against the spirit would be natural to man, without any previous demerit, by the condition of nature that was conferred by God, and accordingly, God would be the author of sin. Then (3) blessedness was the natural end of man, and accordingly, so also was righteousness and holiness, without which he could not have achieved blessedness (Rev. 21:27; 1 Cor. 15:50). Objections The arguments of the papists for the most part coincide with the Socinian arguments against original righteousness. For they allege: (1) that there is a natural contrariety of flesh and spirit, of body and soul, and thus original righteousness was not natural. I respond, We previously denied against the Socinians that this obtained in the state of integrity, where a most perfect harmony thrived until the point of sin. (2) That the gifts conferred upon the first man are called honor and glory (Ps. 8:5), which without a doubt are extrinsic and accessory to man, not natural. I respond: (a) The psalmist calls “honor and glory” not only original righteousness, but also the rule of man over the earthly creatures. Then also (b) in a sound sense, original righteousness is honor and glory (Rom. 3:23), insofar as it is the foundation of all honor and glory, and in that sense it was not something extrinsic to man, but something especially intrinsic. Bellarmine has certain other arguments (vol. 4, bk. 1), but they are of no significance; if anyone desires to know more, he may consult his antagonists: Ames, Pareus, and others.85 85. Bellarmine, De controversiis Christianae Fidei in Opera Omnia (Paris: L. Vivès, 1870–91), 5:169–213; William Ames, Bellarminus Enervatus, 4 vols. (Amsterdam: Joannes Janssonius, 1628–29), 4: 5–12; e.g. David Pareus, Quaestiones controversae theologicae…adversus Bellarminum (Schönfeld, 1612); idem, Rob. Bellarmini de justificatione impii libri explicati et castigati studio Davidis Parei (Heidelberg: Jonah Rosa, 1615).</p></blockquote>

<blockquote><p>If we say we have no sin, we deceive ourselves, and the truth is not in us.” “It is no more I that do it, but sin that dwelleth in me.” “There is no condemnation to them that are in Christ Jesus, who walk after the Spirit.” “Who can understand his errors? Cleanse thou me from secret faults.” (1 John 1:8. Rom. 7:18; 8:1. Ps. 19:13.) The common distinction of sin into mortal and venial may be referred to this division. For although every sin in its own nature is mortal, by which we mean, that it deserves eternal death, yet reigning sin may be properly so called, inasmuch as he who perseveres in it will at length be overtaken by destruction. But it becomes venial sin that is, it does not call for eternal death, when it does not reign in the regenerate who resist it by the grace of God; and this takes place, not because it merits pardon in itself, or does not deserve punishment, but because it is freely forgiven those that believe on account of the satisfaction of Christ, and is not imputed to them unto condemnation, as it is said: “There is no condemnation to them that are in Christ Jesus.” (Rom. 8:1) When thus understood, the distinction of mortal and venial sin may be retained; but not when it is understood in the sense in which the Romish priests use it, as if that were mortal sin which deserves eternal death on account of its greatness, and that venial which does not deserve eternal death on account of its smallness, but merely some temporal punishment. Hence we would prefer, in the place of mortal and venial sin, the distinction which we have made of sin into reigning, and not reigning, and that for the following reasons:

1. Because the terms mortal and venial are ambiguous and obscure. All sins are mortal in their own nature. The apostle John also calls the sin against the Holy Ghost mortal, or unto death.

2. Because the Scriptures do not use these terms, especially venial sin.

3. Because of the errors of the Papists, who call those sins venial which are small and do not deserve eternal death, whilst the Scriptures declare: “Cursed be he that confirmeth not all the words of this law to do them.” “Whosoever shall offend in one point, is guilty of all.” “The wages of sin is death.” “Whoso shall break one of these commandments, and shall teach men so, he shall be called the least in the kingdom of God.” (Deut. 27:26; James 2:10; Rom. 6:23; Matt. 5:19) In a word, every sin in its own nature is mortal, and deserves eternal death. But it becomes venial, that is, it does not work eternal death in the regenerate, because their sins have been freely pardoned for the sake of Christ.</p></blockquote>

<blockquote><p>We say, therefore, that temptation which proceeds from an external principle, if it finds nothing in us which inclines to evil or delights in it, cannot have the nature of sin. Thus the Devil could tempt Christ, and present various objects to his eyes and imagination, but he had no power in him, who lacked all vicious inclination. The case is different with our inclination and internal movements, which when the Devil moves, indeed even if they are not moved by the Devil, are nevertheless sins, as we have proved.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1ac53f2eb7" data-kw="perichoresis coinherence">
<blockquote><p>Here belongs the word emperichōrēseōs which the fathers frequently used … to describe the intimate mutual union of the persons … when “the Son is said to be in the Father, and the Father in the Son” (Jn. 10:38; 14:11). … so as to designate thus that union by which the divine persons embrace each other and permeate each other. So that although always remaining distinct, yet they are never separated from each other, but always coexist; wherever one is, there the other also really is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/coinherence.html">Coinherence</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 3.23.13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere%20belongs%20the%20word%20emperich%C5%8Dr%C4%93se%C5%8Ds%20which%20the%20fathers%20frequently%20used%20%E2%80%A6%20to%20describe%20the%20intimate%20mutual%20union%20of%20the%20persons%20%E2%80%A6%20when%20%E2%80%9Cthe%20Son%20is%20said%20to%20be%20in%20the%20Father%2C%20and%20the%20Father%20in%20the%20Son%E2%80%9D%20%28Jn.%2010%3A38%3B%2014%3A11%29.%20%E2%80%A6%20so%20as%20to%20designate%20thus%20that%20union%20by%20which%20the%20divine%20persons%20embrace%20each%20other%20and%20permeate%20each%20other.%20So%20that%20although%20always%20remaining%20distinct%2C%20yet%20they%20are%20never%20separated%20from%20each%20other%2C%20but%20always%20coexist%3B%20wherever%20one%20is%2C%20there%20the%20other%20also%20really%20is.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.23.13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ac53f2eb7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ac53f2eb7.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74c3572d0d" data-kw="unity three persons">
<blockquote><p>While he proclaims his unity, he distinctly sets it before us as existing in three persons. These we must hold, unless the bare and empty name of Deity merely is to flutter in our brain without any genuine knowledge. Moreover, lest any one should dream of a threefold God, or think that the simple essence is divided by the three Persons, we must here seek a brief and easy definition which may effectually guard us from error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/one-essence.html">One Essence</a> › <a href="../topics/the-trinity/one-essence/unity-of-nature.html">Unity of nature</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/distinct-persons.html">Distinct persons</a></span></div>

</figure><figure class="quote" id="q-f8184d8b29" data-kw="person subsistence Calvin">
<blockquote><p>Calvin defining a person to be a “subsistence in the essence of God by which (related to others) he is distinguished by an incommunicable property”—having followed here Justin and John of Damascus who called it a mode of subsisting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/person-and-subsistence.html">Person and subsistence</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/personal-properties.html">Personal properties</a></span></div>

</figure><figure class="quote" id="q-3276ad4d8b" data-kw="another Comforter">
<blockquote><p>Christ clearly teaches that the Spirit is a person distinct from the Father and the Son, besides the formula of baptism, by saying: &quot;The Father will give you another Comforter&quot; (John 14:16). Therefore, we condemn the Macedonians who deny the divinity of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXVI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a> › <a href="../topics/the-trinity/the-holy-spirit/personality.html">Personality</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/distinct-persons.html">Distinct persons</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christ clearly teaches that the Spirit is a person distinct from the Father and the Son, besides the formula of baptism, by saying: &quot;The Father will give you another Comforter&quot; (John 14:16). Therefore, we condemn the Macedonians who deny the divinity of the Spirit.”

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, XXVI">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist%20clearly%20teaches%20that%20the%20Spirit%20is%20a%20person%20distinct%20from%20the%20Father%20and%20the%20Son%2C%20besides%20the%20formula%20of%20baptism%2C%20by%20saying%3A%20%22The%20Father%20will%20give%20you%20another%20Comforter%22%20%28John%2014%3A16%29.%20Therefore%2C%20we%20condemn%20the%20Macedonians%20who%20deny%20the%20divinity%20of%20the%20Spirit.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20XXVI&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3276ad4d8b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3276ad4d8b.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-82dcf6a70a" data-kw="Spirit personality agent">
<blockquote><p>He is an intelligent, voluntary, divine agent; he knoweth, he worketh as he will: which things, if, in their frequent repetition, they are not sufficient to evince an intelligent agent, a personal subsistence, that hath being, life, and will, we must confess that the Scripture was written on purpose to lead us into mistakes and misapprehensions of what we are, under penalty of eternal ruin, rightly to apprehend and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, Of the Holy Ghost</span></figcaption>

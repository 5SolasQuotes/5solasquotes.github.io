<main class="wrap"><figure class="quote" id="q-e1a8e069d5" data-kw="">
<blockquote><p>…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures. Also we make a distinction of images, that some of them be true, and some of them false. Among the true, those be reckoned, which doo represent those things, which either be, or haue béene, or hereafter shall be. But those are called false, which represent those things that neither be, have been, nor yet ever shall be: as are the chymaeras and centaurs. There be also some images filthy and some honest, according as those things be which are expressed by them. Also they may be distinguished according to the circumstance of the place, because some be set in a holy place and some in places prophane. Again, others there be which are appointed in respect of worship and religion: but others are erected as ornaments, and only for the remembrance of a thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (London: Henrie Denham et al., 1583), pt. 2, ch. 5. ‘The Second Precept, which concerns Images, their Beginning, Antiquity &amp; Cause’</cite>, p. 335</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb2401ee82" data-kw="">
<blockquote><p>But as far as images are concerned, whether painted or sculpted, though we do not reject their use when sacred material or histories are represented, nevertheless we do not admit them in holy places without hesitation. Nor do we do we judge it prudent especially that sculpted images be set up in Temples, not because it is impious in and of itself, or because we think it not allowed, but rather because of the sad appearance of the Churches we see in Temples of the Papists, which took its origin from the use of Images and pictures… For this reason, though I completely concede that the use of images in which sacred things and histories are represented in temples is a matter of indifference (adiaphoron), nevertheless since people easily abuse thme when they are seen in sacred places, I think they do wisely who eliminate all these things from temples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4</cite>, pp. 469-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-51cebe7f05" data-kw="">
<blockquote><p>Concerning the humanity of our blessed Savior, that being a creature he might be depicted, I mean it was naturally capable of it: it was the great instrument of many actions, it conversed with mankind above thirty years together, it was the subject of great changes, and the matter of a long story, and the conduit of many excellent instructions, and therefore might without all question be described as well as Caesar’s or Meletius, Marc Anthony or the kings of the gentiles. It might be done: and the question being here only of the making or having of it, abstractedly from all other appendages or collateral considerations, I need say no more of it under this title; but that it is neither impious nor unreasonable of itself to have or to make the picture or image of Christ’s humanity, or rather of his human body. For against this there is neither reason nor religion; and if it be made accidentally unlawful, that is not of present consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience… (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook.</cite>, p. 334</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>…it is added by the Rejoinder that Beza says of some that retain the cross, they may use their own liberty. But in the next words he adds: ‘If they have any just causes of retaining this sign in their churches.’ So that he limits that liberty unto such causes as he was not privy to; nay [not for any use] to such as they at Geneva found to be clean contrary. As for us, we have many necessary reasons why we do no way tolerate that sign, and their causes (alleged in the 8th Epistle) were not peculiar to any time or place, but pertain as well to England as to Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>

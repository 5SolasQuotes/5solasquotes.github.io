<main class="wrap"><figure class="quote" id="q-e709407332" data-kw="">
<blockquote><p>[I]n the Pagan Feasts it was expressly forbidden to labour, and those that wrought were punished. But it was permitted to play, to dance, and to commit all sorts of insolencies. This is the true Image of the Popish Feasts: For a poor man that worketh in his shop to relieve his languishing family is sure to be severely punished, though the Law of God say, six days shalt thou labour. But they enter unpunished into Taverns brothels and other shameless places.

They believe not that the Feast day of a Saint is well celebrated, unless they make good cheer. It is then that the Priests &amp; people make merry; and that they commit the greatest excess of gluttony and drunkenness. There is not a man so miserable that will not spare somewhat to feast his friends on the feast day of his parish. Polydor Virgil acknowledgeth that this custom is come from the ancient Romans, de rerum inuent. lib. 5. c. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-drelincourt.html">Charles Drelincourt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The root of Romish rites and ceremonies showing that the Church of Rome hath borrowed most part of her ceremonies of the Jews &amp; ancient pagans, and that from this spring proceeded the Jubilee</cite>, (London, 1630), pp 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83733c712e" data-kw="">
<blockquote><p>Augustine reminds us that divine omnipotence does not mean that God can do what is contradictory or at odds with his perfection:

He cannot will and not will at the same time. For justice cannot wish to do what is unjust; wisdom cannot wish what is foolish; truth cannot wish what is false. Whence we are reminded that the omnipotent God cannot do not only what the Apostle states: ‘He cannot disown himself,’ but many other things as well. Behold, I say this and I do not dare to say it in accordance with His truth, because I do not dare to deny that the omnipotent God cannot die, cannot be changed, cannot be deceived, cannot become wretched, cannot be overcome. Far be it that the Omnipotent One should be able to do these things and other things of this sort. And for that very reason not only does truth show that He is omnipotent because he cannot do these things, but truth also concludes that he who can do such things is not omnipotent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Liturgical Seasons</cite>, trans. Mary Sarah Muldowney in The Fathers of the Church, 38: 134 (Sermon 214).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-15e6da6b8b" data-kw="">
<blockquote><p>Thirteenthly, [it is superstition] that it is simply unlawful to use a form of prayer or to read a prayer on a book. Fourteenthly, that if a school-master impose a form upon a scholar, or a parent on a child, it makes it become unlawful.</p></blockquote>

</figure><figure class="quote" id="q-308b743cae" data-kw="">
<blockquote><p>Objection 2: There is much error mixed with the few truths they preach, as Popery, Arminianism, etc. There are also invective reflections, yea railings against the people of God. Answer 1: What is morally good will bear the mixture of a great deal of evil, and yet retain its goodness still: the goodness being from God, who is a greater good than Satan or sin is an evil. Answer 2: We cannot expect from men of ordinary gifts that truth be preached without the mixture of errors more or less: We know but in part, therefore are to prove all things, and hold fast that which it good, Heb. 5:14. A saint, as other creatures, though weak and newly born, has a raft of what is food suitable and what sincere. Answer 3: As for those intemperate expressions and reflections on the people of God: I confess it is sad, but were there not such against Paul and his party? (Phil. 1:15) Yet notwithstanding they are to be heard even by the same persons they enveighed against, for the truth’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2, pp. 12-13</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8b000e1563" data-kw="">
<blockquote><p>When discussing how the covenants of works and grace differ, John Cameron argued that the promised reward of the first covenant was eternal earthly life, as opposed to eternal heavenly life. Although we dissent from this opinion, we post it out of historical interest:

9 Thesis. …

5 They differ in the Promise; In the Covenant of Nature, eternal and blessed life is promised, but yet animal life, to be lived in Paradise: but in the Covenant of Grace a heavenly and spiritual life is promised.

6 They differ in the manner of Sanction or ratification. In the Covenant of Nature there was no Mediator; hence the Covenant of Nature was promised before it was published. But the Covenant of Grace was first promised, and long after was published and ratified in the blood of the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), pp 357-58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-65f75de493" data-kw="">
<blockquote><p>Thus, from the beginning, our Lord God was not content with announcing to Adam the grace by which He had purposed to save His Church through His Son; He willed to add sacrifices, as living figures of the future sacrifice of Jesus Christ, to strengthen the faith of the children of God in the redemption which they were awaiting (Heb 11:4).

Then afterwards, renewing this covenant of grace and of mercy to Abraham, He added thereto the sacrament of circumcision (Gen 17:10, 11), and many other ceremonies (Exod 12); these were Sacraments representing to them what Jesus Christ would accomplish in HIs time, that is to say, all the mystery of their salvation; the Apostle declares this amply in the Epistle to the Hebrews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.30, pp 45-46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-b0b9a3104d" data-kw="">
<blockquote><p>For here I observe, that men of learning in other respects have stumbled, who, when explaining the nature of those Sacraments, too incautiously blend things belonging to a quite different covenant. Nothing is here to be brought in which does not belong to the covenant of works, the promises of that covenant, and the duties of man under the same; all which are most distinct from the covenant of grace. Here we are to say nothing of Christ, nothing of justifying faith in him, nothing of our ceasing from our own works as impure, nor any thing of that rest after the miseries of this life. All these belong to another covenant. I do not, however, deny, that the unsearchable wisdom of God did appoint and order these symbols in such a manner that the remembrance of them, after the fall, might be able to instruct man in many things relating to the covenant of grace and its mediator. As that, according to Paul, the first Adam himself was a type of the second; Eve, curiously formed out of Adam’s rib while asleep, was a type of the church, as it were, taken from Christ in virtue of his death; and that the first marriage represented that great mystery which regards Christ and the church. These things, however, were neither known nor thought of in a state of nature; nor to be mentioned in a discourse on the Sacraments of the covenant of works. Having premised these things, let us now inquire into each particular with all the care possible, beginning with Paradise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank 2 vol (Edinburgh: T. Tegg &amp; Son, 1837), 1.81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b0b9a3104d.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/08/witsius-sharply-distinguished-between-the-covenants-of-works-and-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-93528f6b17" data-kw="">
<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ, his Last Discovery of Himself</cite>, ... (London: R.I., 1656), Christ’s Willingness to Save Sinners, 2nd Sermon, pp. 168-69</span></figcaption>

<blockquote><p>712. It has also been said that God invites the sinner to the possession of these goods under the condition of faith which we described in chapter 14. This is the proposition of the covenant of grace.

713. But we have warned that God does not weigh this condition as being brought about by the sinner’s own power. Indeed, the sinner is a slave to sin, and inept to any spiritual good on his own.</p></blockquote>

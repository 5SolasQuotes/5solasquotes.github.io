<blockquote><p>Nebuchadnezzar… was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven… And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation. And all the inhabitants of the earth are reputed as nothing: and He doeth according to his will in the army of heaven, and among the inhabitants of the earth… At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-42a4d4d71e" data-kw="">
<blockquote><p>We distinguish and teach that in this sense they [reprobates] are made to be reconciliable by the death of Christ, by which Prosper says (Response to the Little Head of the Gauls, ch. 9): “Christ is the Savior of the whole world on account of his true undertaking of human nature and communion in the ruin of the first man.” Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: … 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, pp. 421-422 c. 1638-1643 trans. T. Fentiman</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-bdf68e8002" data-kw="">
<blockquote><p>Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other.” [Historical Theology, vol. 2, p. 333] And it is but natural that this should be so. If Christ was to save an elect race, gradually called out of the world of humanity in the course of centuries, it became necessary for God to exercise forbearance, to check the course of evil, to promote the development of the natural powers of man, to keep alive within the hearts of men a desire for civil righteousness, for external morality and good order in society, and to shower untold blessings upon mankind in general. Dr. [Charles] Hodge expresses it thus: ‘It is very plain that any plan designed to secure the salvation of an elect portion of a race propagated by generation and living in association, as is the case with mankind, cannot secure its end without greatly affecting, for better or for worse, the character and destiny of all the rest of the race not elected.’ He quotes Dr. [Robert] Candlish to the effect that ‘the entire history of the human race, from the apostasy to the final judgment, is a dispensation of forbearance in respect to the reprobate, in which many blessings, physical and moral, affecting their characters and destinies forever, accrue even to the heathen, and many more to the educated and refined citizens of Christian communities. These come to them through the mediation of Christ, and coming to them now, must have been designed for them from the beginning.’ [The Atonement, pp. 358 ff.] These general blessings of mankind, indirectly resulting from the atoning work of Christ, were not only foreseen by God, but designed by Him as blessings for all concerned. It is perfectly true, of course, that the design of God in the work of Christ pertained primarily and directly, not to the temporal well-being of men in general, but to the redemption of the elect; but secondarily and indirectly it also included the natural blessings bestowed on mankind indiscriminately. All that the natural man receives other than curse and death is an indirect result of the redemptive work of Christ. [Cf Turretin, Opera, Locus XIV, Q. XIV, par. XI; Witsius, De Verbonden, B. II, Kap. 9, s. 4; Cunningham, Hist. Theol. II, p. 332; Symington, Atonement and Intercession, p. 255; Bavinck, Geref. Dogm. III, p. 535; Vos, Ger. Dogm. III, p. 150.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1950) | “C. COMMON GRACE AND THE ATONING WORK OF CHRIST. | Reformed theologians generally hesitate to say that Christ by His atoning blood merited these blessings for the impenitent and reprobate. At the same time they do believe that important natural benefits accrue to the whole human race from the death of Christ, and that in these benefits the unbelieving, the impenitent, and the reprobate also share. In every covenant transaction recorded in Scripture it appears that the covenant of grace carries with it not only spiritual but also material blessings, and those material blessings are generally of such a kind that they are naturally shared also by unbelievers. Says [William] Cunningham:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>VII. (2) The question [at hand to be discussed] is not whether God is born by a general love and philanthropy (philanthropia) towards men as his creatures, and also bestows upon them various temporal benefits pertaining to the things of this life (ta biotika). We do not deny that God has never left Himself without witness (amartyron) with regard to this (Acts 14:17). And we readily grant that there is no one who does not owe some gratitude to God and who, whatever he is or can do, is not bound to give thanks to his Creator. But the question concerns the special and saving love which tends to spiritual benefits, and by which God willed to have mercy upon them to salvation. We think this is particular to the elect alone, not universal and common to all.</p></blockquote>

<blockquote><p>I suppose no sober man will now pretend to any such extraordinary gift, which ceased in the church long since, as the gift of tongues, and other effects of the Spirit extraordinary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ford.html">Thomas Ford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalmes</cite>, (London, 1659), 16. Spelling and punctuation modernized.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59f4555384" data-kw="">
<blockquote><p>Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, trans. Fathers of the English Dominican Province (Benziger Bros., 1947), 2nd part of 2nd part, Question 176, ‘Of the Grace of Tongues’, Article 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-2fcae9d028" data-kw="">
<blockquote><p>In the earliest times, “the Holy Ghost fell upon them that believed: and they spake with tongues,” which they had not learned, “as the Spirit gave them utterance.” These were signs adapted to the time. For there behooved to be that betokening of the Holy Spirit in all tongues, to show that the Gospel of God was to run through all tongues over the whole earth. That thing was done for a betokening, and it passed away. In the laying on of hands now, that persons may receive the Holy Ghost, do we look that they should speak with tongues? Or when we laid the hand on these infants, did each one of you look to see whether they would speak with tongues, and, when he saw that they did not speak with tongues, was any of you so wrong-minded as to say, These have not received the Holy Ghost; for, had they received, they would speak with tongues as was the case in those times? If then the witness of the presence of the Holy Ghost be not now given through these miracles, by what is it given, by what does one get to know that he has received the Holy Ghost? Let him question his own heart. If he love his brother, the Spirit of God dwelleth in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the First Epistle of John, Homily 6, on 1 Jn. 3:19-4:3</cite>, section 10 in NPNF1, 7:497-98</span></figcaption>

earliest%20times%2C%20%E2%80%9Cthe%20Holy%20Ghost%20fell&amp;text=brother%2C%20the%20Spirit%20of%20God%20dwelleth%20in%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c212e3221" data-kw="">
<blockquote><p>By this term [‘prophets’ in this passage] he means (in my opinion) not those who were endowed with the gift of prophesying, but those who were endowed with a peculiar gift, not merely for interpreting Scripture, but also for applying it wisely for present use. My reason for thinking so is this, that he prefers prophecy to all other gifts, on the ground of its yielding more edification — a commendation that would not be applicable to the predicting of future events. Farther, when he describes the office of prophet, or at least treats of what he ought principally to do, he says that he must devote himself to consolation, exhortation, and doctrine. Now these are things that are distinct from prophesyings. Let us, then, by ‘prophets’ in this passage understand, first of all, eminent interpreters of Scripture, and farther, persons who are endowed with no common wisdom and dexterity in taking a right view of the present necessity of the Church, that they may speak suitably to it, and in this way be, in a manner, ambassadors to communicate the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 12, verse 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-d434bbd922" data-kw="">
<blockquote><p>Promises made to the Faithful and their Prerogatives l. The life, of which the promise is added to the observation of the law, is not only earthly and temporal, but also heavenly and eternal. 2. The faithful even before the birth of Christ had the same Mediator and Savior as we have, and the same spirit of adoption. Rejection of the error of those: l. Who teach that the recompense of the legal covenant was such that its function was only natural and temporal. 2. Who teach that the Fathers of the Old Testament lacked the pledge of the Holy Spirit.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-87feb594f3" data-kw="">
<blockquote><p>28. So great is the peace and comfort of many parishes where the public ministers and all the religious people live together in love and amity that it loudly tells us how much better that is than to study to render each other odious, or vile and excommunicable.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e20ef78ad3" data-kw="">
<blockquote><p>He [Owen] intimates that it is not in our power to close with some and not withal. This is his first error. Though man give us no such power, God does: as it is in my power to believe all that one speaks truly and well, and not that which he speaks amiss. I am not bound to own all that any preacher or priest shall say in the church. God put it in the disciples’ power to beware of the leaven of the Pharisees [Mt. 16:6], and yet to hear them [Mt. 23:1-3]. Proving all things [1 Thess. 5:21] is not approving all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 25</span></figcaption>

</figure><figure class="quote" id="q-7b93b1b030" data-kw="">
<blockquote><p>Will any object unto us the profaneness of the ministers, rudeness and disorder of the ministration of God’s worship, we yield it is too visibly true; but more vile administrators, or irregular administrations cannot be than were the sons of Eli in their service, who made the people to loathe the offerings of the Lord, and were rebuked, and described by Samuel in 1 Sam. 2:12-17… O horrid uncleanness, most heaven-daring villany! Yet I find not that any God-fearing-Israelite forsook the sanctuary, or durst forbear their sacrifice; nor did Samuel (who reproved, and denounced God’s judgment against this profaneness) ever advise or direct the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-d4ccec039d" data-kw="">
<blockquote><p>If any, through necessity, be hindered from being present at the beginning, they ought not, when they come into the congregation, to betake themselves to their private devotions, but reverently to compose themselves to join with the assembly in that ordinance of God which is then in hand.</p></blockquote>

</figure><figure class="quote" id="q-00823314c2" data-kw="">
<blockquote><p>Such as the worship is in Popery, where they teach and do many things contrary to the principles of faith, placing holiness and the worship of God in their own inventions, and seeking remission of sins, and the merit of eternal life in every beggarly superstitious observation and ceremony. But if by false manner of worship you understand every error, fault and corruption in matters of religion, which though they be evil and to be condemned, yet overthrow not the faith, nor the very essence of God’s true worship, but be in circumstances, or in parts that may be maimed, and yet the life remain: then I deny the proposition as most erroneous, false and heretical…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists... (London, 1590) Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher. | ‘Brownist Position’</cite>, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>2. The second assembly is a classis [presbytery] of many pastors and elders from sundry congregations who have power of excommunication, (1) in respect [case] that the person excommunicated does keep company with many consociated [associated] churches and so as a leaven may infect many (1 Cor. 5:4; Matt 26:59; John 11:47; Acts 20:17,18); (2) and for this cause, one pastor of a single congregation, is not able to ordain a pastor (because it wants example in the Word of God). Therefore a college of presbyters, or a presbytery of pastors and elders, who have power larger than a session, even to excommunicate and ordain pastors, is necessary in the church, which ordains Timothy to be a pastor, and so may deprive and excommunicate him (1 Tim. 4:14, Acts 20:17,18,28,29). … In church censures we proceed thus: In private faults if a brother offend a brother, he is admonished alone by the offended. If that gain him not, he is admonished before two or three; if that prevail not, the matter is brought before the church, which has power of the keys; if he obey not the church, he is excommunicated (Matt 18:15-20). … 3. Our third censure is the greater excommunication, which is done by the whole congregation, as all other censures, but in diverse ways: (1) by the presbytery or eldership judicially and authoritatively, (2) by Paul his pastoral spirit (1 Cor. 5:4), the minister in the church’s name pronouncing the sentence (1 Tim. 1:20), (3) and by the people…</p></blockquote>

nd+the+Power+of+Censures%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2649e160f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2649e160f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church/independent-churches-do-not-have-the-authority-for-greater-excommunication/#:~:text=2.%20The%20second%20assembly%20is%20a,1%3A20%29%2C%20%283%29%20and%20by%20the%20people&amp;text=2.%20The%20second%20assembly%20is%20a%20classis%20%5Bpresbytery&amp;text=1%20Tim.%201%3A20%29%2C%20%283%29%20and%20by%20the%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6894577b59" data-kw="">
<blockquote><p>…we know no external lawful calling that kings have now, or their family, to the crown, but only the call of the people. All other calls to us are now invisible and unknown; and God would not command us to obey kings and leave us in the dark that we shall not know who is the king.” Lex Rex, p. 33 (rt col, bot). ² Cameron, Dictionary, p. 745. Rutherford: “Any tyrant stands in titulo [in the title], so long as the people and the estates who make him king have not recalled their grant; so as neither David, nor any single man, though six hundred with him [1 Sam. 23:13; 30:9], may un-king him or detract obedience from him as king…” Lex Rex, p. 59 (lt col, top)… As Rutherford argued during the Westminster era in Lex Rex (1644), that magnum opus of puritan political thought, the power of governing is retained in root in the commonality of the people³ and conferred on governors by the community’s consent. Hence by natural law the community’s consent is more fundamental than changeable positive laws and constitutions. ³ Lex Rex, pp. 1–2, 6, 29, 34, 123–24. … As the puritan political tradition was summed up and delineated by Rutherford, while a material tyrant with grounds for deposition may continue for a long time, he formally remains the valid, civil, God-recognized ruler, continuing to bear God’s authority in all lawful things, until the consent of the community (which had been given to him, legitimizing him as their ruler) is removed from him, normally by the publicly recognized and accepted civil procedure (that is, by the official bodies and in due order).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Civil Authority, Dethronement &amp; Cameronianism” in “Editor’s Extended Introduction”</cite>, 3. “Principled Partial Conformity in Government: The Church of Scotland under Erastianism &amp; Episcopacy (1660–1688)” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 95-103 | “Not till 1679 (with increasing sanctions on the non-conformists) did a minority of these covenanters split away from the rest, coming to believe Charles II had lost his valid civil authority due to his despotism… The Cameronians, contrary to the principles and ethos of the Scottish Reformation and the Westminster era covenanters,¹ and nearly all reformed theology before them, in a public declaration in 1680 at Sanquhar with around twenty men,² “disowned” Charles II as king… | … Rutherford:, pp. 96-100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

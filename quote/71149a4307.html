<blockquote><p>Vers. 11. But when Peter was come to Antioch, I withstood him to the face, because he was to be blamed.

Sign 5. Of his heavenly and divine Doctrine, namely, in the Article of shunning the Ceremonial Yoke of Moses, That Paul openly reprehends Peter himself turning off from this Doctrine, and brings him into the way again, which that it may better appear, the things that follow are observable.

By the decree of the Synod at Jerusalem, Act. 15. the necessity of the Ceremonial Law amongst the Jews is abrogated, and liberty is left to the Jews of using ceremonies for a time, all observation of the Levitical ceremonies, amongst the Gentiles, is expelled from the Christian Churches, as from those to whom the Law of Ceremonies was never designed, nor given: They are only commanded to abstain from some meats, lest they use their liberty to the scandal of the weaker Jews, and that by force of the Moral Law, which in matters simply indifferent, doth circumscribe the use of liberty with the bounds of scandal.

Peter the Apostle going down to Antioch, by the sentence of the Synod at Jerusalem, useth his liberty, and eats meat with his Brethren, the Gentiles; some who held the Ceremonies of Moses went down in the meanwhile to Antioch from James: Here Peter ought not to counterfeit his Christian Liberty, which the day before he professed, but to remain in fellowship with the Christian Gentiles, and to defend his fact by the authority of the Synod[.]

But Peter fearing lest he should incur the hatred of the Jews, which came down from James, with-draweth himself from the Table of the Christian Gentiles, and eateth no more with them; others imitate the example of Peter: The evil spreads abroad to the drawing Barnabas into the same dissimulation: by this example scandal was given to the Jews to the confirming of them in Judaism, and not put away the yoke of Moses (already broken and dissolved by the Authority of God in the Synod.)

Scandal also is given to the Christian Gentiles, who are compelled by the example of so great an Apostle, either to take upon them the yoke of Ceremonies, or renounce the society of the Apostle; what could Paul do in this case? certainly as it became him, he resisted Peter to his face, and reproved him publicly. …

Vers. 14. But when I saw that they walked not uprightly according to the Truth of the Gospel, I said unto Peter before them all, If thou, being a Jew, livest after the manner of Gentiles, and not as do the Jews: why compellest thou the Gentiles to live as do the Jews?

Reason 3. For which, Paul rightly reproves Peter, because when he had preached that a man is justified by Faith alone, without the works of the Law; by this he confirms the false Doctrine of those, that taught Moses Law necessarily to be observed to salvation: which was to halt in his course towards the mark of Evangelical Truth, or to take a very ill course, for the preservation of the Doctrine of Grace pure; which fact was a most manifest sign that his Doctrine, which he had taught to the Churches of Galatia concerning justification by the Grace of Christ, and freedom from the yoke of Ceremonies, was so heavenly and divine, that thereby he had convinced Peter himself of error, when he did not do things consentaneous to his doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 95.</span></figcaption>

<blockquote><p>All these upon my own knowledge were the true causes why so great a number of those persons who were counted most religious, fell in with the parliament in England; insomuch that the generality of the stricter diligent sort of preachers joined with them, though not in meddling with arms, yet in judgment, and in flying to their garrisons; and almost all those afterwards called presbyterians were before conformists: Very few of all that learned and pious synod at Westminster were nonconformists before, and yet were for the parliament, supposing that the interest of religion lay on that side. Yet did they still keep up an honorable esteem of all that they thought religious on the other side, such as Bishop Davenant, Bishop Hall, Bishop Morton, Archbishop Ussher, etc.</p></blockquote>

</figure><figure class="quote" id="q-ab6f29151c" data-kw="">
<blockquote><p>But I hope the parliament will observe this great principle you were first acted by, and still are in all your Church-way, and will see how dangerous the tolerating of your way will be; for though you should for present hold nothing much different from the established rule, yet being allowed what may you not come to; according to this principle, how shall any State be sure of you long what you will hold: What if you should bring in community of goods, baptizing in rivers, the holy kiss into your assemblies at the beginning and ending of your ordinances, anointing sick persons with oil? It is but according to your principle: And we see you make so much of this principle and are so in love with it, that you wish it next to your first principle, enacted as the most sacred Law of all other[s], to live and walk by it in Christian States and Churches throughout the world;</p></blockquote>

<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>

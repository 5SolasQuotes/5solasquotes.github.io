<main class="wrap"><figure class="quote" id="q-c31f616f03" data-kw="">
<blockquote><p>Therefore, in maintaining the doctrine of providence, 1st we affirm, that the eternal mind has an absolute and perfect knowledge of all things in general, and every single one in particular; nor does he see only those that are actually present, as they appear in their order upon the stage of the world; but at one view comprehends all that are past, as well as to come, as if they were all actually present before him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. XIII, p. 139.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6962706faa" data-kw="">
<blockquote><p>5. Whereas ye [David Dickson and Alexander Henderson] alledge, that if some members of this Kirk had not cared more kindly in this time of common danger than others have done, the whole body had been ere now dangerously, if not desperately, diseased. We answer that we most heartily wish, any disease of this Church, to be timeously prevented and cured. But withal we wish this to bee done without a rupture, and such a dangerous division: chiefly seeing our Church is not infected with any such errors, nor is in such dangers as may give just occasion of so fearful a division: which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius Bishop of Alexandria, in his Epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-aberdeen-doctors.html">Aberdeen Doctors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplies of the Ministers &amp; Professors of Aberdeen to Second Answers of some Reverend Brethren, concerning the Late</cite>, [National] Covenant (Aberdeen: Raban, 1638), p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

" href="https://reformedbooksonline.com/against-separatism/#:~:text=5.%20Whereas%20ye%20%5BDavid%20Dickson%20and,suffers%20martyrdom%20for%20the%20whole%20Kirk&amp;text=5.%20Whereas%20ye%20%5BDavid%20Dickson%20and%20Alexander%20Henderson&amp;text=a%20man%20suffers%20martyrdom%20for%20the%20whole%20Kirk" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-13cadfdfe6" data-kw="">
<blockquote><p>To conclude this, separation from Churches, from which Christ does not separate, is schismatical; now it’s clear in the Scripture that Christ owns churches where faith is sound for the substance, and their worship, Gospel-worship, though there be many defects and sinful mixtures among them. And what I have said concerning the schismaticalness of separation because of the sinful mixtures of those who are wicked in practice, is as true concerning separation from them who are erroneous in judgment; if the errors of those from whom the separation is made, be not fundamental, and hinder communion with Christ the head. And much more clear (if clearer can be) is the schismaticalness of those who separate from and renounce all communion with those churches which are not of their own manner of constitution and modelled according to the platform of their own particular church-order. To refrain fellowship and communion with such Churches who profess Christ their Lord, whose faith is sound, whose worship is Gospel-worship, whose lives are holy, because they come not into that particular way of church-order which we have pitched upon, is a schismatical rending of the Church of Christ to pieces… Herein likewise those separatists among ourselves are heinously faulty who censure and condemn all other churches, though their faith, worship and conversation be never so scriptural, merely because they are not gathered into church order according to their own patterns. In Scripture, Churches are commended and dignified, according as their fundamental faith was sound and their lives holy; not according to the regularity of their first manner of gathering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, ... (London: Maxey, 1654), on verse 19, Observations, p. 593</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-330d3e89f1" data-kw="">
<blockquote><p>And therefore when they that separate do plead that they agree with us in the fundamentals of Faith, they do not excuse, but aggravate their schism in violating the unity of that Church which is sound in the Faith. (St. Augustine, Contra Faustus, bk. 20, ch. 2) For ’tis not diversity of Faith, but the breach of unity that makes a schismatic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Character of a Separatist</cite>, … (London, 1677) Long (1621–1707) was a conformed Anglican clergyman and royalist. | Picture &amp; Character of a Separatist, pp. 25-26</span></figcaption>

<main class="wrap"><figure class="quote" id="q-19e85ccd5a" data-kw="">
<blockquote><p>…that I might clear the truth, that is (as they call it) the Calvinists’ doctrine, of those reproaches which are cast upon it: and that I might mitigate and appease the minds of some of our brethren, which have been more offended at it then was fit. For I do willingly acknowledge and teach universal redemption and grace, so far as it is possible by the word. My mind is to pursue after peace, which is departing from us: and I would have all men so interpret my fact. I allege the testimonies of the ancient everywhere… I hold it necessary, that there should be had an example of consent and concord in that doctrine which is expounded in holy books, and is propagated to all posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606) | ‘To the Reader’</span></figcaption>

<blockquote><p>The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-r-nicole.html">Roger R. Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Standing Forth: Collected Writings of Roger Nicole</cite>, (Mentor, 2018), p. 326</span></figcaption>

<blockquote><p>When [Amyraldianism] urges that the Bible teaches that both by divine decree and in history Christ’s death, represented by it as unrestricted regarding its referents, was intended to save all men without exception (the doctrine of universal atonement), Amyraldianism must necessarily join forces with Arminian universalism which… shares this aspect of its vision and turn away altogether from a real substitutionary atonement…</p></blockquote>

— Robert L. Reymond, A New Systematic Theology of the Christian Faith (Nashville, TN: Thomas Nelson, 1998), p. 478; The italics are Reymond’s.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+%5BAmyraldianism%5D+urges+that+the+Bible+teaches+that+both+by+divine+decree+and+in+history+Christ%E2%80%99s+death%2C+represented+by+it+as+unrestricted+regarding+its+referents%2C+was+intended+to+save+all+men+without+exception+%28the+doctrine+of+universal+atonement%29%2C+Amyraldianism+must+necessarily+join+forces+with+Arminian+universalism+which%E2%80%A6+shares+this+aspect+of+its+vision+and+turn+away+altogether+from+a+real+substitutionary+atonement%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Robert+L.+Reymond%2C+A+New+Systematic+Theology+of+the+Christian+Faith+%28Nashville%2C+TN%3A+Thomas+Nelson%2C+1998%29%2C+p.+478%3B+The+italics+are+Reymond%E2%80%99s.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb0ca35f61.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb0ca35f61.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=When%20%5BAmyraldianism%5D%20urges%20that%20the%20Bible,altogether%20from%20a%20real%20substitutionary%20atonement&amp;text=When%20%5BAmyraldianism%5D%20urges%20that%20the%20Bible%20teaches%20that&amp;text=turn%20away%20altogether%20from%20a%20real%20substitutionary%20atonement" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9b0138fa84" data-kw="">
<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. For first lets weigh well the words of Christ: ‘I never knew you: depart from Me ye workers of iniquity.’ (Mt. 7:25) Now to know with God is to acknowledge; and therefore, whom Christ never knew, He never acknowledged for his. And those whom He has not sometime acknowledged, He never bought or redeemed with the price of his blood. And therefore well says Gregory: ‘Not to know with God is to reject.’ Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14) Very well therefore says Prosper (bk. 1, Response for Augustine, Objection 9): ‘As it is not sufficient for the renewing of men, that Christ Jesus was born man, unless they be renewed also in the same spirit, whereof He was born: so it is not sufficient for man’s redemption that Christ Jesus was crucified, unless we die together and be buried with Him in baptism.’ Of these premises therefore I frame this assumption: But all are not reconciled unto God, neither do all receive remission of sins: for then all men were blessed (Ps. 32:1); and it were not possible for them to perish: which thing to affirm of all and every one, is very gross. Thirdly, Christ gave Himself that He might sanctify unto Himself a people peculiar (Tit. 2:14), that is, as a precious treasure and his own gotten good selected and chosen from among other: therefore it was not Christ’s purpose to give Himself for a ransom for all and every one alike. Fourthly, for whom redemption it [was] ordained, to them all is given on God’s part the making of them sons by Christ: but the making of sons, or adoption is not granted to all and every one, even on God’s part… Fifthly: None are truly redeemed on God’s part, but they who are freed from sin, both according to the power that it has to cause damnation, and also according to the power that it has to reign in them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606) | 4th Crimination, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

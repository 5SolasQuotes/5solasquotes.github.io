<blockquote><p>1. That fathers command their sons;

2. The noble the ignoble;

3. The elder the younger;

4. The masters the servants;

5. The stronger the weaker;

6. The wise the ignorant.</p></blockquote>

</figure><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 211-13, 218-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.”

— Joseph Hall, 3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 211-13, 218-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+human+laws+cannot+bind+the+conscience%3A+It+is+God+only%2C+1+John+3%3A21%2C+who%2C+as+He+is+greater+than+the+conscience%2C+so+has+power+to+bind+or+loose+it%3A+Isa.+31%3A22.+It+is+He+that+is+the+only+Lawgiver+to+the+conscience%3A+Jam.+4%3A12.+Princes+and+Churches+may+make+laws+for+the+outward+man%2C+but+they+can+no+more+bind+the+heart+than+they+can+make+it%3B+%E2%80%A6+The+laws+of+men+therefore+do+not%2C+ought+not%2C+cannot+bind+your+conscience%2C+as+of+themselves%3B+but%2C+if+they+be+just%2C+they+bind+you+in+conscience+to+obedience%3A+%E2%80%A6+As+then+we+are+wont+to+say+in+relation+of+our+actions+to+the+laws+of+God%2C+that+some+things+are+forbidden+because+they+are+sinful%2C+and+some+things+are+sinful+because+they+are+forbidden%2C+so+it+holds+also+in+the+laws+of+men%3A+some+things+are+forbidden+because+they+are+justly+offensive+and+some+other+things+are+only+therefore+offensive+because+they+are+forbidden%3B+In+the+former+of+these+we+must+yield+our+careful+obedience+out+of+respect+even+to+the+duty+itself%3B+in+the+latter%2C+out+of+respect+to+the+will+of+the+lawgiver%3B+yet+so%2C+as+that+if+our+own+important+occasions+shall+enforce+us+to+transgress+a+penal+law%2C+without+any+affront+of+authority+or+scandal+to+others%2C+our+submission+to+the+penalty+frees+us+from+a+sinful+disobedience.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+3rd+Decade%2C+Case+6%2C+%E2%80%98Whether+the+Laws+of+Men+do+Bind+the+Conscience%2C+%26+How+Far+we+are+Tied+to+Their+Obedience%3F%E2%80%99+in+Cases+of+Conscience+Practically+Resolved+Containing+a+Decision+of+the+Principal+Cases+of+Conscience+of+Daily+Concernment+%26+Continual+Use+Amongst+Men%3A+Very+Necessary+for+their+Information+%26+Direction+in+These+Evil+Times+%28London%2C+1654%29%2C+pp.+211-13%2C+218-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd118d349d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d118d349d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=Thus%20human%20laws%20cannot%20bind%20the,frees%20us%20from%20a%20sinful%20disobedience&amp;text=Thus%20human%20laws%20cannot%20bind%20the%20conscience%3A%20It&amp;text=the%20penalty%20frees%20us%20from%20a%20sinful%20disobedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-afd1f73699" data-kw="">
<blockquote><p>Of the forensic laws of Moses, those are perpetual which are of common right, or which have something moral. However, those have been abrogated which are of particular right, that is, such laws as were specially for the Mosaic constitution, and which have something ceremonial attached.</p></blockquote>

</figure><figure class="quote" id="q-4d11c8f399" data-kw="">
<blockquote><p>I confess that we being free in Christ, are not bound to the Civil Laws of Moses in every circumstance; yet seeing no laws can be more honest, just and wholesome, than those which God Himself gave, who is eternal Wisdom and Goodness, I see not why Christians, in things which no less appertain to them, ought not to follow the Law of God, rather than of any men…</p></blockquote>

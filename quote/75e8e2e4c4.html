</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-71644a8bf2" data-kw="">
<blockquote><p>But although a king may remove an unprofitable and hurtful bishop, yet cannot a bishop (on the other side) depose a king if he have offended. (Mt. 14:4; Prelates of the Church have no authority to depose kings and princes, Lk. 13:32) John indeed reproved Herod, but he displaced him not of his kingdom. Ambrose and Innocentius excommunicated emperors, but they proceeded no further. Yea, and Christ called Herod a wolf, but He took not away his kingdom from him, and He paid tribute unto Tiberius, a most wicked prince. (Mt. 17:27) Neither was He at any time author to any man to shake off his yoke. Wherefore let Popes take heed: by what right they remove at their own pleasure kings and emperors out of their places. This did neither any of the prophets, nor the apostles, nor yet Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, Book 4, ch. 13, section 12, p. 232</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-11e69be364" data-kw="">
<blockquote><p>But if once the government of Christ were set up among us, we know not what would impede it by the sword of God alone [i.e. the Word of God], without any secular violence, to banish out of the land those spirits of error, in all meekness, humility and love, by the force of truth convincing and satisfying the minds of the seduced. Episcopal courts were never fitted for the reclaiming of minds. Their prisons, their fines, their pillories, their nose-slitting, ear-croppings and cheek-burnings did but hold down the flame to break out in season with the greater rage. But the reformed presbytery does proceed in a spiritual method eminently fitted for the gaining of hearts; they go on with the offending party with all respect: they deal with him in all gentleness from weeks to months, from months sometimes to years, before they come near to any censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissuasive from the Errors of the Time</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-a516deab45" data-kw="">
<blockquote><p>The General Court of Election… 1. It was ordered and agreed… that an engagement by oath should be taken of all the officers of this Body now to be elected, as likewise for the time to come… ‘To the execution of this office, I judge myself bound before God to walk faithfully and this I profess in ye presence of God.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-9d7e6837e2" data-kw="">
<blockquote><p>Answer [of Rutherford]: It is a calumnious consequence: pastors and teachers will not be judged by the magistrate in things merely ecclesistical, to stand to his ecclesiastical decision, as if his lips, ex officio, should preserve knowledge; Therefore, pastors and doctors do exempt themselves from the lawful power of the magistrate in his civil judging by the sword; it is as if they would say, Churchmen refuse to submit to an usurped and unlawful power of the magistrate; Therefore, they refuse to submit to their lawful power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government and Excommunication</cite>, … (London, 1646), ch. 27, p. 615</span></figcaption>

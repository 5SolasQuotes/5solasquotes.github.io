<blockquote><p>13. In the same way too it cannot be concluded that because the outward calling of the rejected is ineffectual it is therefore not seriously meant by God. Outward calling is always per se [of itself, in principle] a real calling to salvation, since everyone who follows it up thereby gains righteousness in Christ and eternal life: only, in the case of the godless, it is ineffectual because of their hardness of heart. Similarly, the calling from God’s side is always seriously intended, since God promises grace even to the rejected upon condition of faith, and makes faith for them a duty. But of course God omits to give faith to the rejected, because He is not bound to do so in the case of any man… From this it follows that even the calling of the godless is on God’s side ‘sincere and serious’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, tr. G.T. Thompson (1861; 1950; Wipf &amp; Stock, 2007), p. 517</span></figcaption>

<blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 47 | quest. 2, ‘Whether anyone can act against the will of the sign’</span></figcaption>

</figure><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works</cite>, vol. 2, pp. 358-61</span></figcaption>

</figure><figure class="quote" id="q-4033150b6b" data-kw="">
<blockquote><p>1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26)… Neither will it salve the business, to say, there is a voluntas signi [will of sign] in all this; for what is voluntas signi, if it be not signum voluntatis [asign of the will]? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart? When God makes his great gospel supper, and says, ‘Come, for all things are ready;’ he is not, he cannot be like him with the evil eye, who says, Eat and drink, but his heart is not with thee, (Prov.xxiii.6.7.) No, God’s heart goes along with every offer of grace; he never calls, but in a serious manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Edward Polhill</cite>, (1622-1694) on Matthew 23:37’ in “The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill (Morgan, PA.: Soli Deo Gloria Publications, 1998), pp. 208-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-906ec32c7c" data-kw="">
<blockquote><p>This comes in here as a token of God’s displeasure at those who married strange wives; He threatens to withdraw from them his Spirit, whom they had grieved by such marriages, contrary to their convictions: fleshly lusts are often punished with spiritual judgments, the sorest of all judgments. Or as another occasion of the great wickedness of the old world; the Spirit of the Lord, being provoked by their resistance of his motions, ceased to strive with them, and then all religion was soon lost among them. This He warns them of before, that they might not further vex his Holy Spirit, but by their prayers might stay Him with them. Observe in this verse, I. God’s resolution not always to strive with man by his Spirit. The Spirit then strove by Noah’s preaching (1 Pt. 3:19–20) and by inward checks, but it was in vain with the most of men; therefore, says God, He shall not always strive. Note, 1. The blessed Spirit strives with sinners, by the convictions and admonitions of conscience, to turn them from sin to God. If the Spirit be resisted, quenched, and striven against, though He strive long, he will not strive always, Hos. 4:17. Those are ripening apace for ruin whom the Spirit of grace has left off striving with. II. The reason of this resolution: For that he also is flesh, that is, incurably corrupt, and carnal, and sensual, so that it is labor lost to strive with him. Can the Ethiopian change his skin? He also, that is, All, one as well as another, they have all sunk into the mire of flesh. Note, 1. It is the corrupt nature, and the inclination of the soul towards the flesh, that oppose the Spirit’s strivings and render them ineffectual. When a sinner has long adhered to that interest, and sided with the flesh against the Spirit, the Spirit justly withdraws his agency, and strives no more. None lose the Spirit’s strivings but those that have first forfeited them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 6:3</span></figcaption>

— Matthew Henry, Commentary on the Bible, on Gen., 6:3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+comes+in+here+as+a+token+of+God%E2%80%99s+displeasure+at+those+who+married+strange+wives%3B+He+threatens+to+withdraw+from+them+his+Spirit%2C+whom+they+had+grieved+by+such+marriages%2C+contrary+to+their+convictions%3A+fleshly+lusts+are+often+punished+with+spiritual+judgments%2C+the+sorest+of+all+judgments.+Or+as+another+occasion+of+the+great+wickedness+of+the+old+world%3B+the+Spirit+of+the+Lord%2C+being+provoked+by+their+resistance+of+his+motions%2C+ceased+to+strive+with+them%2C+and+then+all+religion+was+soon+lost+among+them.+This+He+warns+them+of+before%2C+that+they+might+not+further+vex+his+Holy+Spirit%2C+but+by+their+prayers+might+stay+Him+with+them.+Observe+in+this+verse%2C+I.+God%E2%80%99s+resolution+not+always+to+strive+with+man+by+his+Spirit.+The+Spirit+then+strove+by+Noah%E2%80%99s+preaching+%281+Pt.+3%3A19%E2%80%9320%29+and+by+inward+checks%2C+but+it+was+in+vain+with+the+most+of+men%3B+therefore%2C+says+God%2C+He+shall+not+always+strive.+Note%2C+1.+The+blessed+Spirit+strives+with+sinners%2C+by+the+convictions+and+admonitions+of+conscience%2C+to+turn+them+from+sin+to+God.+If+the+Spirit+be+resisted%2C+quenched%2C+and+striven+against%2C+though+He+strive+long%2C+he+will+not+strive+always%2C+Hos.+4%3A17.+Those+are+ripening+apace+for+ruin+whom+the+Spirit+of+grace+has+left+off+striving+with.+II.+The+reason+of+this+resolution%3A+For+that+he+also+is+flesh%2C+that+is%2C+incurably+corrupt%2C+and+carnal%2C+and+sensual%2C+so+that+it+is+labor+lost+to+strive+with+him.+Can+the+Ethiopian+change+his+skin%3F+He+also%2C+that+is%2C+All%2C+one+as+well+as+another%2C+they+have+all+sunk+into+the+mire+of+flesh.+Note%2C+1.+It+is+the+corrupt+nature%2C+and+the+inclination+of+the+soul+towards+the+flesh%2C+that+oppose+the+Spirit%E2%80%99s+strivings+and+render+them+ineffectual.+When+a+sinner+has+long+adhered+to+that+interest%2C+and+sided+with+the+flesh+ag

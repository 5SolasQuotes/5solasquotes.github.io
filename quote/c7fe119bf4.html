<blockquote><p>673. Eze. 18:23; 33:11, ‘God will not the death.’ ‘He has no pleasure in the death of the wicked.’ Rom. 9:18, ‘He has mercy on whom He will, and whom He will he hardens.’ God will not the death of a sinner by his antecedent will, but by his consequent will, or his justice; because he justly punishes him who rejects the grace of God offered unto Him. He hardens therefore permissively, not affectively. 674. Eze. 18:23, ‘I will not the death of him that dies. Ch. 3:18, ‘Thou shalt die the death.’ God as our Father will not by the Gospel, but as He is our judge and revenger, He will by the Law, that a sinner shall die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible… (London: Miller, 1662) | Ezekiel</cite></span></figcaption>

<blockquote><p>But Damascene makes the emphasis on the mode of willing. For he distinguishes in God an antecedent will and a consequent will. And the antecedent will is the will with respect to that for which God makes man, and it is irrefragably of goods. The consequent will, however, is the will, not that which follows merits, but that which wills some things according to the foreknowledge of merits. The first, namely the antecedent, is called by the masters the conditional will or the will by which God wills, as far as it depends on Him. The second, however, namely the consequent, is called absolute. The difference, however, between this will and that is not according to a diversity of affection or mode of willing that is in God, but according to the reason of connoting and understanding. For as God is said to will the salvation of all, as far as it depends on Him and antecedently, there is connoted in all men an orderability to salvation, both on the part of the nature given and on the part of the grace offered. For God gave a nature according to which they could know Him and, once known, seek Him, and once sought, find Him, and once found, adhere to Him, and through this obtain salvation. He similarly offered grace, when he sent and offered his Son, whose price sufficed for the salvation of all. He also bestowed and showed the laws and mandates of salvation. He Himself is also present to all who inquire and is near to all who call upon Him. Therefore, to will antecedently to save man is to do what is ordered to salvation and not to be lacking to the one who wills to arrive. Whence, to will antecedently to save does not connote salvation, but orderability to salvation. To will, however, consequently or absolutely to save is to will to give salvation to him whom he foreknows will arrive at salvation through his help and grace, and it connotes the event of salvation. And thus it is not to be said that God wills all men to be saved. The masters agree more with this response, although both are good. According to this, therefore, it must be answered that God wills all men to be saved, as far as it depends on Him or by his antecedent will, but not by his absolute or consequent will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences (d. 1274), bk. 1 | dist. 46, Question 1, ‘Whether God wills all men to be saved by the will of his good-pleasure? [No]’</cite></span></figcaption>

</figure><figure class="quote" id="q-dd4ecb3709" data-kw="">
<blockquote><p>In the next place you [Thomas Jackson, an Arminian] touch upon a distinction much talked of, and as much advanced by some as cried down by others. Yet both Scotus and Durandus give a tolerable, and Aquinas with the Dominicans after him, an orthodox interpretation thereof, though neither suitable to the mind of [John] Damascene, commonly reputed the father of it. Yet look what in this kind is wanting in them is supplied by [Gregory] Arminiensis, who gives both an orthodox construction thereof, and that also in conformity to the opinion of Damascene, of whose text he gives a very sound and orthodox interpretation and the more orthodox the more opposite to their constructions who, with great cry of words draw it to the countenancing of their Arminian tenets without cause. Love, you say, is the fruit of God’s antecedent will, wrath and severity are the proper effects of his consequent will. Fruit and effect you make all one (as with good reason you may). Now what, I pray you, is this effect which you call love? You seem to intimate that they are the effects of creation, as when you say, ‘Every particular faculty of soul or body is a pledge undoubted of God’s love.’ Yet faculties of souls and bodies are found in beasts, but God’s antecedent will in Damascene is referred wholly unto men. Neither does Damascene at all refer it to the work of creation, but makes it to be that whereby God will have all to be saved. Liberty of will is proper to man in distinction from beasts, but who sees not that this indifferently makes him obnoxious unto damnation as well as capable of salvation? Then when you say wrath and severity is the effect of God’s consequent will, what do you mean by ‘wrath’? Is it either a resolution to take vengeance, or the execution of vengeance itself? I think you take it for the execution of vengeance itself. Now there is an execution of reward also properly opposite unto this which, whether it be the same love you speak of, it became you to express so much, or whether you conceive it to be different, yet it were fit you should take notice of it and acknowledge that this is a fruit of God’s consequent will as well as wrath; that as effectually presupposing obedience, as this disobedience: and that love in rewarding is every way as infallibly consequent to the obeying of God’s will revealed as wrath is of our neglecting and despising it. A full explication of this distinction you promise in good time; how well you perform it we may in good time consider with God’s help. Next you enter upon another form of the same distinction (as you pretend) and you suffer it to fly with one wing, for you talk of God’s absolute will (which you seem to confound with God’s antecedent will), but as touching the member congruously opposite, you leave us to seek for that. But as it is we are to consider it: God’s absolute will was (you say) to have men capable of Heaven and Hell, of joys and miseries immortal. This cannot be understood of God’s consequent will; for this absolute will is indifferent to end in the bestowing of reward or punishment, and is immediately terminated only in making man capable of either; but his consequent will is not so indifferent. For the only effect thereof you mention to be wrath and severity, and this presupposes rather than causes capableness. Neither can this absolute will be the antecedent will of God according to Damascene’s meaning. For the antecedent will in Damascene is only referred to the will of God, whereby He wills man’s salvation: but this absolute will is (you say) to have men capable of Heaven and Hell. To help this, you tell us that this absolute will (whose possible objects are two) is in the first place set on man’s eternal joy. But you do not proceed to show on what it is set in the next place, as if by such like incongruities you desired rather to confound your reader [rather] than to satisfy him. Yet by the tenor of your discourse you leave it to us to guess that in the second place, to wit upon the despising of God’s love, it is set upon a man’s damnation. So that by this your doctrine, both God’s antecedent will and consequent will is all one, and that is God’s absolute will. But no such thing is found in Damascene, from whom, such as you are, do usually take this distinction of will antecedent in God and will consequent: And indeed you do well to make one as absolute as another; for like as wrath, the fruit of this will of God in the second place (as you imply) has not its course but upon presupposition of disobedience; so in like manner, the proper opposite to wrath on the other side, the fruit of this will of God in the first place, has not its course but upon presupposition of obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity… (Amsterdam: Thorp, 1631)</cite>, pp. 677-80</span></figcaption>

3F+Is+it+either+a+resolution+to+take+vengeance%2C+or+the+execution+of+vengeance+itself%3F+I+think+you+take+it+for+the+execution+of+vengeance+itself.+Now+there+is+an+execution+of+reward+also+properly+opposite+unto+this+which%2C+whether+it+be+the+same+love+you+speak+of%2C+it+became+you+to+express+so+much%2C+or+whether+you+conceive+it+to+be+different%2C+yet+it+were+fit+you+should+take+notice+of+it+and+acknowledge+that+this+is+a+fruit+of+God%E2%80%99s+consequent+will+as+well+as+wrath%3B+that+as+effectually+presupposing+obedience%2C+as+this+disobedience%3A+and+that+love+in+rewarding+is+every+way+as+infallibly+consequent+to+the+obeying+of+God%E2%80%99s+will+revealed+as+wrath+is+of+our+neglecting+and+despising+it.+A+full+explication+of+this+distinction+you+promise+in+good+time%3B+how+well+you+perform+it+we+may+in+good+time+consider+with+God%E2%80%99s+help.+Next+you+enter+upon+another+form+of+the+same+distinction+%28as+you+pretend%29+and+you+suffer+it+to+fly+with+one+wing%2C+for+you+talk+of+God%E2%80%99s+absolute+will+%28which+you+seem+to+confound+with+God%E2%80%99s+antecedent+will%29%2C+but+as+touching+the+member+congruously+opposite%2C+you+leave+us+to+seek+for+that.+But+as+it+is+we+are+to+consider+it%3A+God%E2%80%99s+absolute+will+was+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell%2C+of+joys+and+miseries+immortal.+This+cannot+be+understood+of+God%E2%80%99s+consequent+will%3B+for+this+absolute+will+is+indifferent+to+end+in+the+bestowing+of+reward+or+punishment%2C+and+is+immediately+terminated+only+in+making+man+capable+of+either%3B+but+his+consequent+will+is+not+so+indifferent.+For+the+only+effect+thereof+you+mention+to+be+wrath+and+severity%2C+and+this+presupposes+rather+than+causes+capableness.+Neither+can+this+absolute+will+be+the+antecedent+will+of+God+according+to+Damascene%E2%80%99s+meaning.+For+the+antecedent+will+in+Damascene+is+only+referred+to+the+will+of+God%2C+whereby+He+wills+man%E2%80%99s+salvation%3A+but+this+absolute+will+is+%28you+say%29+to+have+men+capable+of+Heaven+and+Hell.+To+help+this%2C+you+tell+us+that+this+absolute+will+%28whose+possible+objects+are+two%29+is+in+the+first+place+set+on+man%E2%80%99s+eternal+joy.+But+you+do+not+proceed+to+show+on+what+it+is+set+in+the+next+place%2C+as+if+by+such+like+incongruities+you+desired+rather+to+confound+your+reader+%5Brather%5D+than+to+satisfy+him.+Yet+by+the+tenor+of+your+discourse+you+leave+it+to+us+to+guess+that+in+the+second+place%2C+to+wit+upon+the+despising+of+God%E2%80%99s+love%2C+it+is+set+upon+a+man%E2%80%99s+damnation.+So+that+by+this+your+doctrine%2C+both+God%E2%80%99s+antecedent+will+and+consequent+will+is+all+one%2C+and+that+is+God%E2%80%99s+absolute+will.+But+no+such+thing+is+found+in+Damascene%2C+from+whom%2C+such+as+you+are%2C+do+usually+take+this+distinction+of+will+antecedent+in+God+and+will+consequent%3A+And+indeed+you+do+well+to+make+one+as+absolute+as+another%3B+for+like+as+wrath%2C+the+fruit+of+this+will+of+God+in+the+second+place+%28as+you+imply%29+has+not+its+course+but+upon+presupposition+of+disobedience%3B+so+in+like+manner%2C+the+proper+opposite+to+wrath+on+the+other+side%2C+the+fruit+of+this+will+of+God+in+the+first+place%2C+has+not+its+course+but+upon+presupposition+of+obedience.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+Discovery+of+Dr.+Jackson%E2%80%99s+Vanity%E2%80%A6+%28Amsterdam%3A+Thorp%2C+1631%29%2C+pp.+677-80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd4ecb3709.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd4ecb3709.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=In%20the%20next%20place%20you%20%5BThomas,course%20but%20upon%20presupposition%20of%20obedience&amp;text=In%20the%20next%20place%20you%20%5BThomas%20Jackson%2C%20an&amp;text=not%20its%20course%20but%20upon%20presupposition%20of%20obedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.</p></blockquote>

<blockquote><p>We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.</p></blockquote>

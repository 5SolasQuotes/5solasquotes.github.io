<blockquote><p>We must not expect such unwritten Revelations as were vouchsafed to Abraham, because the whole Counsel of God, his Royal Will and Pleasure do now stand upon record as his perfect Law, full Testimony, Complete and Supreme Testament, nothing is to be added to it, or taken from it.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c849b76e2" data-kw="">
<blockquote><p>For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>

</figure><figure class="quote" id="q-d791504558" data-kw="">
<blockquote><p>2. A Christian that is thus established, is fortified against spirit, word, or writing, or all suggestions that may perplex his mind.

[1.] Against pretended revelations, called here spirit.

(1.) Because having his mind thus settled, he may boldly defy all revelations pretended to the contrary: Gal. i. 8, ‘Though we, or an angel from heaven, preach any other gospel than we have preached, let him be accursed.’ Any doctrine, if diverse, or different from, or besides the written word, much more contrary to it, a Christian may reject it, and account it cursed doctrine; therefore neither church, nor angel, nor spirit is to be heard against it.

(2.) Because a Christian is upon better terms, having the written word, than if God dealt with him by way of revelations: 2 Peter i. 19, 25‘We have βεβαιότερον λόγον, a more sure word of prophecy;’ comparing it with the voice from heaven, of which he spake before; not as if there could be any uncertainty in the Lord’s voice speaking from heaven, but because a transient voice is more easily mistaken or forgotten than an authentic standing record; as Samuel thought Eli called him, when it was the Lord. It is quoad nos; though God gave evidence of the truth of such revelations as he made, yet we have more accommodate means. Our Lord intimateth such a thing: Luke xvi. 31, ‘If they hear not Moses and the prophets, neither will they be persuaded though one rose from the dead.’ This is the surest ground for faith to rest upon of any that ever hath been or can be given to sinners, subject to forgetfulness, jealousies, and mistakes.

(3.) Because it is not rational to expect new revelation, now the canon and rule of faith is closed up: Heb. ii. 1, 2, ‘Therefore we ought to give the more earnest heed to the things which we have heard, lest at any time we should let them slip,’ &amp;c.; Mat. xxviii. 20, ‘Teaching them to observe all things, whatsoever I have commanded you;’ John xvii. 29, ‘Neither pray I for these alone, but for them which shall believe on me through their word.’

(4.) Because if any such be pretended, it must be tried by the word: Isa. viii. 20, ‘To the law and to the testimony; if they speak not according to this word, it is because they have no light in them;’ so 1 John iv. 1, ‘Beloved, believe not every spirit, but try the spirits whether they are of God, because many false prophets are gone abroad into the world.’

(5.) Because they that despise ordinary means, and pretend to vision, revelation, or inspiration, are usually such as are given up by God to a vertiginous spirit, and cast into the dungeon of error, for the punishment of other sins: Micah ii. 11, ‘If a man walking in the spirit of falsehood do lie, he shall be the prophet of this people;’ God will permit those that are both deceivers and deceived themselves to come amongst them for a plague to them. Sleidan giveth sad instances of some given up to this fantastical frenzy, that killed their own relations on pretence of inspiration, and of others that murdered fifty thousand in one day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 24-5.</span></figcaption>

<blockquote><p>Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.”

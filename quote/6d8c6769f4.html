<main class="wrap"><figure class="quote" id="q-6d8c6769f4" data-kw="">
<blockquote><p>Yet it is a good observation of [an]other [Aquinas and Rupertus], that John [the Baptist] is not crier, but the voice of the crier: for it is Christ who cries in preachers; He speaks by the mouth of all his holy prophets: He cries, ‘O ye foolish, how long will ye love foolishness?’ He cries, ‘Repent for the kingdom of God is at hand.’ He cries, ‘Come unto Me all ye that are wearied and laden, and I will refresh you.’ To day then if ye will hear his voice, harden not your hearts, but suffer the words of exhortation and doctrine: be moved at his cry, lest He despise your call. As He says in the first of the Proverbs (v. 23): Because I have called, and ye have refused, I have stretched out mine hand, and none would regard: therefore they shall call upon Me, but I will not answer: they shall seek Me early, but they shall not find Me. Think on this all ye that forget God, ye that suffer Christ to stand and knock, and cry at the door of your hearts, and yet you will not let Him in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-boys.html">John Boys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Dominical [Lordly] Epistles &amp; Gospels used in our English Liturgy... (d. 1625; 1638) | 4th Sunday in Advent</cite>, p. 109</span></figcaption>

<blockquote><p>2. He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle[-dove]; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?”… Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God in Christ, A God of Love’, a sermon on 1 Jn. 4:16, in The Whole Works of the late Rev. Ebenezer Erskine (d. 1754), vol. 1</cite>, pp. 280-81</span></figcaption>

<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

<blockquote><p>Whereby He signifies that He has long ago looked that they should repent from the bottom of their heart and receive his grace into their heart. Moreover this place does plainly teach us that we cannot rightly receive Christ before He first offer Himself to be received of us. ‘I will enter in unto him and will sup with him, etc.’ The gentleness and mercy of the Lord is marvelous, which so willingly pardons so great injuries done unto Him by his servant, that forgetting all injuries, He does of his own accord offer pardon, and in sign of perfect reconciliation, He will gently come and sup with him. For men are wont by such tokens to renew friendship that is broken between them. But those whom Christ vouchsafes to be partakers of his table (as He vouchsafes all the faithful) He feeds their minds with spiritual dainties, whereby they shall be nourished unto eternal life, namely with righteousness freely given, quietness of conscience, and unspeakable joy, where with the godly are fed by the Holy Ghost, whereof also He has given a most excellent pledge, the holy comunion of his body and blood, which when we receive by faith, we have Him everlastingly dwelling with us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prælections upon the Sacred &amp; Holy Revelation of St. John (1573), ch. 3, on verse 20</cite>, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>55. Nor can it [unregenerate choice] apprehend offered grace, unless it first receives through regeneration the faculty of apprehending. 56. In receiving this faculty of apprehending grace and assenting to the promise, it conducts itself merely passively, because then the choice is only the subject in which God works, in which he imprints new qualities and inclinations (Ezk. 11:19; 36:26; Eccl. 17:14; Job 33:3-6; Jn. 1:13). 57. But in the very apprehension of grace, or the act of apprehending, it conducts itself both passively and actively; for the choice acts, but having been acted upon by the Holy Spirit (Ezk. 36:27). 58. For one thing is δύναμις, the faculty of apprehending; another is ἐνέργεια, the act of apprehending or the apprehension itself. 59. After the choice has been regenerated, it indeed wills and does good, and perseveres in it, but only insofar as God effects and confirms these things in it (Phil. 1:6, 2:13; 1 Cor. 4:7; Jn. 15:5; 1 Cor. 12:3, 1:8).</p></blockquote>

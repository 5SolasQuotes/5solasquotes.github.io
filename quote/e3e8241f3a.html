<main class="wrap"><figure class="quote" id="q-e3e8241f3a" data-kw="">
<blockquote><p>But how great a nearness there is between both these kinds of Sacraments, Paul seemeth hereby to teach, in that he putteth the names of the one, for the names of the other, and maketh them common to both. For in the. 10. chapter of the first epistle to the Corinth. he affirmeth, that the Elders were baptised, and had one and the same spiritual meat, and one and the same spiritual drink, which we now have. And on the other side, to the Colossians, he calleth our Baptism, Circumcision.

For he saith: that we are circumcised in Christ, but yet with a circumcision not made with hands, by putting of the body of the sins of the flesh. In which place he ascribeth unto circumcision, the putting of sins. But they think that this maketh against us, which is red in the viii chapter to the Hebrews, where it is written: In that that he saith now, he hath abolished that which was before. But that which is abolished and waxen old, is even at hand to vanish away. Of these words they conclude, that the old testament is utterly abolished.

Which thing (say they) could not be possible, if the substance thereof were one, and the same with the substance of the new. But these men ought to have considered, that the substance of the old Testament is not abolished. Indeed ceremonies are abolished as touching the outward signs: howbeit the signification of then abideth the self same that it was. Judicial precepts also, although in our days they be not all had in use, yet the sum and principal scope of them, is still retained, namely, that sins should be punished, and justice preserved in commonwealths. But the sense and observation of moral precepts, remaineth still perfect &amp; whole: although they no more either accuse, or condemn the conscience, to the destruction of the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romanes wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Ep</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 82.</span></figcaption>

</figure><figure class="quote" id="q-1ba29d2092" data-kw="">
<blockquote><p>It signifies not merely that there is an external sanctity arising from their not being conceived and born like heathen children (regarding whom there is a strong presumption that they will drink in impiety with their mother’s milk) but also that there is good reason to hope that they may really be sanctified from their tender years so that when they reach the years of understanding, they will through God’s blessing upon the instructions of their parents discern and love the truth, and that, on the other hand, if they should die in infancy, then, as holy persons and members of Christ, they shall be saved. All this we believe on the ground of the promise given to Abraham, and through him to all believers, that Jehovah would be the God—that is, the sanctifier and the justifier—not of him only but also of his seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio catecheseos Heidelbergensis</cite>, in Opera, vol. 7. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

pener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-df89eeafae" data-kw="">
<blockquote><p>Thus, some would have baptism to be regeneration itself, and that there is no other evangelical regeneration but that alone, with the profession which is made thereon. Every one who is baptized is thereby regenerated. The sign and figure of grace, they would have to be the grace itself. Nothing can be invented more pernicious unto the souls of men; for all sorts of persons may be brought to a ruinous security about their spiritual condition by it, and diverted from endeavours after that real internal work, in the change of their hearts and natures, without which none shall see God. This is to put that into it which God never placed there. Some suppose it to be such a distinguishing, or rather separating ordinance, that the administration of it in such a way or at such a season, is the fundamental rule of all church fellowship and communion; whereas God never designed it unto any such end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, (Edinburg: The Banner of Truth Trust, 1991), 22:39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<main class="wrap"><figure class="quote" id="q-6e45157e3d" data-kw="">
<blockquote><p>Good works are destitute of all claim to merit yet, when good works are wanting, faith is also wanting. Good works are necessary to give evidence of grace; to express gratitude; to strengthen assurance; to edify the brethren; to adorn the profession of Christianity; to silence adversaries; to promote the Divine glory; and to prepare for the fruition of God in heaven (Rom. vi. 4; iii. 31; Titus iii. 1-8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the Church, and Terms of Communion: Together with the Terms of Communion of the Reformed Presbyterian Church in</cite>, Ireland. To which is Appended the Cameronian Dream (Belfast: W. &amp; G. Baird, 1879), p. 40.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><figure class="quote" id="q-3966afb32c" data-kw="">
<blockquote><p>X. That our own regeneration can and ought to be known with certainty a posteriori from ourselves, or from those things which we feel in ourselves, 2 Cor. 13:5 with Rom. 8:5, 9, 11, 15–16. But that of other adults is known with the interposed judgment of charity, that is, with hypothetical certainty only, not absolute. Therefore the certainty of faith or of experience does not have place here, unless God has peculiarly revealed it to someone.

XI. That its [regeneration’s] primordial or infantile acts or effects in the second moment seem not rarely to be both more numerous and more perfect, at least more sensible and with greater commotion, than those which are elicited in adolescence or in adult age. Problems:

      1. Whether they are more perfect in themselves, or more sensible, with sensible commotion, devotion, sweetness, and taste?

      2. Whence is this? Whether also from the novelty of the thing, or the nearness of the opposite (namely, of the state and acts of corruption), so that contraries placed next to each other may more easily shine forth—as immediately after disease health is more vehemently felt, after darkness light? Whether God wishes to affect and attract the tender infancy of His own with tastes and sweetness of sensible devotion more than adult age?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

nk" rel="noopener">Share on X</a><a class="perma" href="../quote/3966afb32c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/assurance/#:~:text=X.%20That%20our%20own%20regeneration%20can,sensible%20devotion%20more%20than%20adult%20age&amp;text=X.%20That%20our%20own%20regeneration%20can%20and%20ought&amp;text=sweetness%20of%20sensible%20devotion%20more%20than%20adult%20age" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-389fd2ec20" data-kw="">
<blockquote><p>Controversy VI: Can man be certain of his present justice or the divine grace received in Christ? Thesis: The certainty of justice or justification in Christ is not a human conjecture but an infallible confidence that excludes final and total doubt and is based both on the promise of grace, which is universal for all believers, and on the special application and infallible testimony of the Holy Spirit. [Romanist] Antithesis: No one in this life can affirm with certainty and infallibility that their sins have been forgiven without a special revelation. This is a vain confidence and a presumptuous heresy. Thesis:

1. Scripture teaches that the justified have peace (Romans 5) and are persuaded of God’s grace (Romans 8; 2 Timothy 3 and 4).

2. The testimony of the Holy Spirit in our hearts is infallible (John 16; Romans 8; Galatians 4), being the seal and guarantee with which believers are confirmed and sealed (2 Corinthians 1; Ephesians 1 and 4).

3. True faith confidently trusts and expels doubt or unease from the heart (Romans 4; James 1; Ephesians 2; Hebrews 10 and 11).

4. Through the study of external piety, as an infallible argument, we know that we have true faith (2 Peter 1; 1 John 3 and 4).

5. The promises of grace are universal for believers (John 3; Romans 10) and are conditioned on faith and repentance. Therefore, these promises apply to all who find that condition in themselves.

6. The Church Fathers teach the same. Augustine: “It is not arrogance but faith to proclaim what you have received.” Bernard: “Believe that your sins are forgiven. This is the testimony the Holy Spirit gives in our hearts, saying: ‘Your sins are forgiven.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>

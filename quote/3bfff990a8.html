<main class="wrap"><figure class="quote" id="q-3bfff990a8" data-kw="">
<blockquote><p>But what arrogance, you will say, to boast that the Church is with you alone, and to deny it to all the world besides! We, indeed, Sadolet, deny not that those over which you preside are Churches of Christ, but we maintain that the Roman Pontiff, with his whole herd of pseudo-bishops, who have seized upon the pastor’s office, are ravening wolves, whose only study has hitherto been to scatter and trample upon the kingdom of Christ, filling it with ruin and devastation.

Nor are we the first to make the complaint. With what vehemence does Bernard thunder against Eugenius and all the bishops of his own age? Yet how much more tolerable was its condition then than now? For iniquity has reached its height, and now those shadowy prelates, by whom you think the Church stands or perishes, and by whom we say that she has been cruelly torn and mutilated, and brought to the very brink of destruction, can bear neither their vices nor the cure of them.

Destroyed the Church would have been, had not God, with singular goodness, prevented. For in all places where the tyranny of the Roman Pontiff prevails, you scarcely see as many stray and tattered vestiges as will enable you to perceive that there Churches lie half-buried. Nor should you think this absurd, since Paul tells you (2 Thess. ii. 4) that antichrist would have his seat in no other place than in the midst of God’s sanctuary. Ought not this single warning to put us on our guard against tricks and devices which may be practised in the name of the church?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Cardinal Sadolet’s Letter (1539) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 50-51.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17175373e9" data-kw="">
<blockquote><p>The following demonstration is rested on no narrow basis. Its two postulates, like two posterns, admit us into the edifice, but they are not its foundations. The whole economy of redemption, and the whole course of history are the broad substructions on which the argument is based and built up; and the author humbly submits that it cannot be overturned, or the conclusion arrived at set aside, without dislocating and shaking the structure of both revelation and providence. The same line of proof which establishes that Christ is the promised Messiah, conversely applied, establishes that the Roman system is the predicted Apostasy. In the life of Christ we behold the converse of what the Antichrist must be; and in the prophecy of the Antichrist we are shown the converse of what Christ must be, and was. And when we place the Papacy between the two, and compare it with each, we find, on the one hand, that it is the perfect converse of Christ as seen in His life; and, on the other, that it is the perfect image of the Antichrist, as shown in the prophecy of him. We conclude, therefore, that if Jesus of Nazareth be the Christ, the Roman Papacy is the Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-wylie.html">J.A. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Papacy is the Antichrist</cite></span></figcaption>

<blockquote><p>The Reformed Catholics hold that there is in the Church one, and that an infallible rule for understanding the holy Scripture and conserving of unity in matters of Faith. And that rule is: ‘The evidence of its own meaning as inherent in itself, discernible or intelligible by men prepared and instructed, by competent teaching and study, and the necessary help of God’s grace and Spirit.’ This is that rule.</p></blockquote>

</figure><figure class="quote" id="q-fb72240770" data-kw="">
<blockquote><p>7th Distinction. It is one thing to hate a fundamental point, as that Christ is consubstantial with the Father, as the Arians do, and another thing by consequence to subvert a fundamental point, as Papists by consequence deny Christ to be true man while they hold the wonder of Transubstantiation, yet doe not they hate this conclusion formally, that Christ is true man.</p></blockquote>

</figure><figure class="quote" id="q-2fb22158c4" data-kw="">
<blockquote><p>For petra (rock) is not derived from Peter, but Peter from petra; just as Christ is not called so from the Christian, but the Christian from Christ. For on this very account the Lord said, On this rock will I build my Church, because Peter had said, You are the Christ, the Son of the living God. On this rock, therefore, He said, which you have confessed, I will build my Church. For the Rock (Petra) was Christ; and on this foundation was Peter himself also built. For other foundation can no man lay than that is laid, which is Christ Jesus. The Church, therefore, which is founded in Christ received from Him the keys of the kingdom of heaven in the person of Peter, that is to say, the power of binding and loosing sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tractates on the Gospel of John</cite>, tract. 124, §5</span></figcaption>

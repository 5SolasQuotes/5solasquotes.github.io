<main class="wrap"><figure class="quote" id="q-49f3ff8527" data-kw="">
<blockquote><p>Idolatry is not to picture any historical thing, but to worship or adore an image. This indeed they have not made who have sometimes in our Bibles conjoined pictured histories with the narratives… For instance, at Ex. 3:2-3 a picture of the bramble bush is certainly represented, in which Jehovah appeared, but there is no likeness or image of Jehovah, who appeared in the bramble bush. The bramble bush is indeed one thing, God appearing in the bramble bush another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mound of the Council of Trent</cite>, … where is a Historical-Theological Anatomy of the Council of Trent... (Zurich: Gessner, 1690), vol. 2, ‘Of Sacred Images’, p. 897 top</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83366dc9c8" data-kw="">
<blockquote><p>The reasons the man adds of this his assertion contain the grand plea of all idolaters, heathenish and antichristian: &quot;Whatever is given to them,&quot; saith he, &quot;who are in that subordination is given to God.&quot; So said the Pagans of old, so say the Papists at this day; all redounds to the glory of God, when they worship stocks and stones, because he appoints them so to do. And so said the Israelites when they worshipped the golden calf: &quot;It is a feast to Jehovah.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, ch. 19</span></figcaption>

</figure><figure class="quote" id="q-7054c58739" data-kw="">
<blockquote><p>…there is, in fact, a wide range of attitudes toward icons that have defied every attempt at schematic classification. Thus, the mere presence of icons is, by itself, never a proof of icon worship: the place of the icon, its character as a relic, the (holy) persons it represents, or even the name it was given, are always points to consider.</p></blockquote>

</figure><figure class="quote" id="q-b26669486a" data-kw="Mary">
<blockquote><p>As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.</p></blockquote>

</figure><figure class="quote" id="q-214740dbc7" data-kw="">
<blockquote><p>…we must conclude that the florilegium of the Council of 815 does not advance beyond the iconoclastic theology of the earlier period… its authors made no original contributions, and merely re-used materials or repeated arguments current among the iconoclasts of 754. The most that can be said is that the iconoclasts of 815 added 12 (or 28) patristic references to the florilegium of 754, none of which, however, can be regarded as constituting an innovation or substantial addition to the iconoclastic armory.</p></blockquote>

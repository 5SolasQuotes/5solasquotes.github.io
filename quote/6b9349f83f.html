<main class="wrap"><figure class="quote" id="q-6b9349f83f" data-kw="sufficiency">
<blockquote><p>The question is not whether all those things are taught in Scripture word for word (autolexei), or immediately and expressly. We acknowledge that many things are to be deduced by legitimate inference and to be considered as the word of God. But the question is whether they are so contained in Scripture, be they expressly in it or derivable from it by legitimate inference, that there is no need of another and an unwritten (agraphō) rule of faith from which to derive matters of religion and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/apostolic-tradition.html">Apostolic tradition</a></span><span class="t"><a href="../topics/holy-scripture/necessity-of-scripture.html">Necessity of Scripture</a> › <a href="../topics/holy-scripture/necessity-of-scripture/necessity-of-verbal-revelation.html">Necessity of verbal revelation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0df9e898c7" data-kw="">
<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on The Heart, p. 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-57765b3c9f" data-kw="">
<blockquote><p>The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.</p></blockquote>

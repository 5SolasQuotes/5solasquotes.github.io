<main class="wrap"><figure class="quote" id="q-909814f5f4" data-kw="">
<blockquote><p>Therefore, the Gospel debars from the benefits of Christ all infidels, not only by a plain exclusion, but also by that condition of faith and repentance, under which, either expresly or tacitly, God promises to men the benefits of Christ, and which is never to be found in those that persevere in sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all</cite>, …’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645), p. 808</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

— David Pareus, ‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all…’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645), p. 808">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+the+Gospel+debars+from+the+benefits+of+Christ+all+infidels%2C+not+only+by+a+plain+exclusion%2C+but+also+by+that+condition+of+faith+and+repentance%2C+under+which%2C+either+expresly+or+tacitly%2C+God+promises+to+men+the+benefits+of+Christ%2C+and+which+is+never+to+be+found+in+those+that+persevere+in+sin.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+%E2%80%98A+Piece+of+a+Speech+concerning+that+Question%2C+To+whom+properly+do+the+benefits+of+Christ%E2%80%99s+sufferings+and+death+belong%3F+And+how+Christ+is+said+to+die+for+all%E2%80%A6%E2%80%99+in+Zachary+Ursinus%2C+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29%2C+p.+808&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F909814f5f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/909814f5f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=Therefore%2C%20the%20Gospel%20debars%20from%20the,in%20those%20that%20persevere%20in%20sin&amp;text=Therefore%2C%20the%20Gospel%20debars%20from%20the%20benefits%20of&amp;text=be%20found%20in%20those%20that%20persevere%20in%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-e54e001d1d" data-kw="">
<blockquote><p>The Popish Prelate [John Maxwell] (ch. 7, p. 87) objects against us… 2. The maxim of the law is, Surrogatus gaudet privilegus ejus cui surrogatur, et qui succedit in locum, succedit in jus. The person surrogated has all the privileges that he has in whose place he succeeds; he who succeeds to the place succeeds to the rights; the adopted son, or the bastard who is legitimated and comes in the place of the lawful born son, comes also in the privileges of the lawful born son. … Answer: 1. He that is surrogated in the place of another, due to him by a positive law of man, he has law to all the privileges that he has in whose place he is surrrogated, that is true. He who comes in the place of a mayor of a city, of a captain in an army, of a pilot in a ship, or of a pope, has all the privileges and rights that his predecessors had by law. Jus succedit juri, persona jure predita personce jure preditce. So the law, so far as my reading can reach, who profess myself a divine; but that he who succeeds to the place of a father by nature, should enjoy all the natural rights and privileges of the person to whom he succeeds, I believe the law never dreamed it; for then the adopted son, coming in place of the natural son, has right to the natural affection of the father. If any should adopt Maxwell the prelate, should he love him as the pursuivant of Crail (Maxwell’s father) loved him, I conceive not. Has the adopted son his life, his being, the figure bodily, the manners of the son in whose place he is adopted; or doth he naturally resemble the father as the natural son does? The Prelate did not read this law in any approved jurist… A natural son is not made a son by the consent of parents, but he is a son by generation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. 63-64</span></figcaption>

</figure><figure class="quote" id="q-6d89d98014" data-kw="">
<blockquote><p>It ought to be the primary goal of every Christian to put aside confidence in works and grow stronger in the belief that we are saved by faith alone. Through this faith the Christian should increase in knowledge not of works but of Christ Jesus and the benefits of his death and resurrection.</p></blockquote>

— Martin Luther, The Freedom of a Christian">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+ought+to+be+the+primary+goal+of+every+Christian+to+put+aside+confidence+in+works+and+grow+stronger+in+the+belief+that+we+are+saved+by+faith+alone.+Through+this+faith+the+Christian+should+increase+in+knowledge+not+of+works+but+of+Christ+Jesus+and+the+benefits+of+his+death+and+resurrection.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+The+Freedom+of+a+Christian&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d89d98014.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d89d98014.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c52c042edb" data-kw="">
<blockquote><p>Some would suppose our union to Christ, and consequently, by virtue of that, our justification by Christ, to be before actual faith, even in adult persons, and consequently without it; they insist upon a priority in nature and time, and build positions upon that distinction that will not hold… They who hold justification before faith are afraid lest they should be betrayed into a justification by works, if they should hold otherwise; and therefore choose rather to plead for a justification before faith, and without faith, lest they should seem to be justified by anything in and from themselves; but how contrary is this to Scripture, ‘He that believeth not, is condemned’? (Jn. 3:18) But he that believes not, is justified, is nowhere written in my Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance</cite>, ... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

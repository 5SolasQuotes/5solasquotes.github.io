<main class="wrap"><figure class="quote" id="q-3a8d2ee79e" data-kw="">
<blockquote><p>4. ‘Tis no argument that an operation that appears on the minds of a people, is not the work of the Spirit of God, that many that are the subject of it, have great impressions on their imaginations. That persons have many impressions on their imaginations, don’t prove that they have nothing else. It is easy to be accounted for, that there should be much of this nature amongst a people, where a great multitude, of all kinds of constitutions, have their minds engaged with intense thought and strong affection about those things that are invisible; yea, it would be strange if there should not. Such is our nature that we can’t think of things invisible, without a degree of imagination. I dare appeal to any man, of the greatest powers of mind, whether or no he is able to fix his thoughts on God or Christ, or the things of another world, without imaginary ideas attending his meditations? And the more engaged the mind is, and the more intense the contemplation and affection, still the more lively and strong will the imaginary idea ordinarily be; especially when the contemplation and affection of the mind is attended with anything of surprise; as when the view a person has is very new, and takes strong hold of the passions, either fear or joy; and when the change of the state and views of the mind is sudden, from a contrary extreme, as from that which was extremely dreadful, to that which is extremely ravishing and delightful: and it is no wonder that many persons don’t well distinguish between that which is imaginary, and that which is intellectual and spiritual; and that they are apt to lay too much weight on the imaginary part, and are most ready to speak of that in the account they give of their experiences, especially persons of less understanding and capacity of distinction. As God has given us such a faculty as the imagination, and has so made us that we can’t think of things spiritual and invisible without some exercise of this faculty, so it appears to me that such is our state and nature that this faculty is really subservient and helpful to the other faculties of the mind when a proper use is made of it; though oftentimes when the imagination is too strong, and the other faculties weak, it overbears ’em, and much disturbs them in their exercise. It appears to me manifest in many instances I have been acquainted with, that God has really made use of this faculty to truly divine purposes; especially in some that are more ignorant: God seems to condescend to their circumstances, and deal with them as babes; as of old he instructed his church while in a state of ignorance and minority by types and outward representations. I can see nothing unreasonable in such a supposition. Let others that have much occasion to deal with souls in spiritual concerns, judge whether experience don’t confirm it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Distinguishing Marks of a Work of the Spirit of God</cite>, (WJE Online, 1741), pp. 235-36</span></figcaption>

<blockquote><p>…God was immediately present in and with the ark, the temple, the holy mountain, the bush, the cloud and the fire which came from heaven, speaking and manifesting Himself to his people by his own immediate voice and miraculous extraordinary presence: So that worshipping before these things had the same reason which makes the 24 elders in heaven worship before the throne. For in these things God did immediately manifest his presence, as well as in heaven. Though there be a difference in the degrees of the immediate manifestation of his presence in earth and in heaven, yet magne et minus non variant speciem [greater and less do not vary the species]. Now God is present in the sacrament, not extraordinarily, but in the way of an ordinary dispensation, not immediately but mediately. [While pictures of the ark, temple and Mt. Sinai might be lawfully made, because those things only extraordinarily revealed God’s presence at extraordinary times, and apart from that they did not but only revealed God’s presence in an ordinary manner (as like the sacraments, which pictures may be made of), yet there were no times at which the burning bush and the pillar and cloud of fire did not extraordinarily reveal God’s presence.] Yet to no better purpose they [formalist opponents] tell us that when God spake Abraham fell on his face. And when the fire came down at Elijah’s prayer, the people fell on their faces. What is this to the purpose? And how shall kneeling in a mediate and ordinary worship [such as in receiving the Supper] be warranted by kneeling in the hearing of God’s own immediate voice, or in seeing the miraculous signs of his extraordinary presence?… Moreover it is objected out of Lev. 9:24; 2 Chron. 7:3; Mic. 6:6; 2 Chron. 29:28-30, that all the people fell on their faces before the legal sacrifices when the fire consumed the burnt-offering. Whereunto it may be answered that the fire which came from God and consumed the burnt offerings was one of the miraculous signs of God’s extraordinary and immediate presence… But if we will particularly consider all these places, we find in the first two, that beside the fire, the glory of the Lord did also appear in a more miraculous and extraordinary manner, Lev. 9:23, ‘The glory of the Lord appeared to all the people,’ 2 Chron. 7:1, 12, ‘The glory of the Lord filled the house.’</p></blockquote>

B+Mic.+6%3A6%3B+2+Chron.+29%3A28-30%2C+that+all+the+people+fell+on+their+faces+before+the+legal+sacrifices+when+the+fire+consumed+the+burnt-offering.+Whereunto+it+may+be+answered+that+the+fire+which+came+from+God+and+consumed+the+burnt+offerings+was+one+of+the+miraculous+signs+of+God%E2%80%99s+extraordinary+and+immediate+presence%E2%80%A6+But+if+we+will+particularly+consider+all+these+places%2C+we+find+in+the+first+two%2C+that+beside+the+fire%2C+the+glory+of+the+Lord+did+also+appear+in+a+more+miraculous+and+extraordinary+manner%2C+Lev.+9%3A23%2C+%E2%80%98The+glory+of+the+Lord+appeared+to+all+the+people%2C%E2%80%99+2+Chron.+7%3A1%2C+12%2C+%E2%80%98The+glory+of+the+Lord+filled+the+house.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+pt.+3%2C+ch.+4%2C+p.+69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa58b92034.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa58b92034.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=God%20was%20immediately%20present%20in%20and,of%20the%20Lord%20filled%20the%20house&amp;text=God%20was%20immediately%20present%20in%20and%20with%20the&amp;text=The%20glory%20of%20the%20Lord%20filled%20the%20house" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal Son in whom dwells the fullness of the God head, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine Majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>

</figure><figure class="quote" id="q-1f6cae8dbe" data-kw="">
<blockquote><p>In the assault on the trustworthiness of the Scriptures, with which the Presbyterian Church has been vexed for the last few years, two closely related but separable assertions have been made prominent. One of these concerned the gift of Scripture, or in other words the doctrine of Biblical inspiration. The other concerned the transmission of Scripture, or in other words the doctrine of Biblical preservation. In the course of the discussion attention has been chiefly concentrated upon the former topic. But the assailants of the trustworthiness of the Scriptures have no more sharply denied the plenary inspiration of the Bible as God gave it to men than they have denied the safe preservation of this Bible as God gave it to men. Their contention has ever been twofold: that God never gave an errorless Bible, and if he did, that errorless Bible is no longer in the possession of men. The air has been thick with satirical references to autographic copies which no man has ever seen, which are hopelessly lost, which can never be recovered. And the defenders of the trustworthiness of Scripture have been sarcastically asked what the use is of contending so strenuously for the plenary inspiration of autographs which have thus forever passed away.

The answer is very obvious that such a contention would be undoubtedly very foolish indeed; but that no one ever made such a foolish contention. It has not been those that have been defending the doctrine of the plenary inspiration of the autographs who have asserted the hopeless loss of this plenarily inspired text. The denial of the plenary inspiration of the autographs and of the safe preservation of the inspired text have rather gone hand in hand. The defenders of the trustworthiness of the Scriptures have constantly asserted, together, that God gave the Bible as the errorless record of his will to men, and that he has, in his superabounding grace, preserved it for them to this hour – yea, and will preserve it for them to the end of time. […] that not only was the inspired Word, as it came from God, without error, but that it remains so; that the Church still has this inspired Word and still has it without error. […] it is as truly heresy to affirm that the inerrant Bible has been lost to men as it is to declare that there never was an inerrant Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession and the original autographs in Selected shorter writings of Benjamin B. Warfield</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-4caaa5bee8" data-kw="">
<blockquote><p>So far then as the Council proveth the determination and commandment that it giveth by the plain word of God, so soon do we reverence and embrace the same. But if men, under the name of a Council, pretend to forge unto us new articles of our faith, or to make constitutions repugnant to the word of God, then utterly we must refuse the same, as the doctrine of devils, which draweth our souls from the voice of our only God, to follow the doctrine and constitutions of men.</p></blockquote>

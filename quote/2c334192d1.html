<main class="wrap"><figure class="quote" id="q-2c334192d1" data-kw="">
<blockquote><p>Why thus it is, God in the beginning authorized marriage to be betwixt man and woman, and appointed how it should be transacted, to wit, by the mutual consent, or cleaving together of each party: and enacted other rules concerning it, as touching proximity of blood, etc. And now by virtue of this his ordinance, whatever couple do accordingly contract, are joined together by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right &amp; Original of the Civil Magistrate From God</cite>, … (London, 1658), section 4 Gee (1613–1660) was an English presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5f5cc9242" data-kw="">
<blockquote><p>…to return to our main subject, that of matrimony, we see what kind of treaty there was about it, Gen. 34:6, 12, what the contract, Gen. 24:50-51, 57-58, what the solemnizing of it, Gen. 24:67, were in those early days. We read not of any formality in joining of man and woman. Mutual consent made marriage. ‘Wilt thou go with this man?’ And she said, ‘I will go.’ Then when she was come to his house, he took her, and she became his wife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work</cite>, … (London: Wilkin, 1693), Of the Excellency &amp; Perfection of the Holy Scriptures, ch. 5, p. 227</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-ad4c6f2e3d" data-kw="">
<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-perre-du-moulin.html">Jr. Perre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Peace &amp; Contentment of Mind (London: 1657), ch. 9, ‘Of Good Conscience’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-c6f6b764a9" data-kw="">
<blockquote><p>As touching matrimonial benediction… through divine institution, it has a necessary use, as we have said. And though the Dr. to make it appear that a pastor’s performing of the same is a thing indifferent, alleges that in Scripture there is nothing commanded thereanent. Yet plain it is from Scripture itself that matrimonial benediction ought to be given by a pastor, for God has commanded his ministers to bless his people (Num. 6), which by just analogy belongs to the ministers of the Gospel; neither is there any ground for making herein a difference betwixt them and the ministers of the Law, but we must conceive the commandment to t•…e both alike to the blessing of God’s people. Unto which ministerial duty of blessing, because no such limits can be set as may exclude matrimonial blessing, therefore they are bound to the performance of it also. And if further we consider that the duty of blessing was performed by the minister of the Lord, even before the law of Moses (Heb. 6:7), we are yet more confirmed to think that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty, belonging to the Lord’s ministers forever. Wherefore, notwithstanding of any abuse of matrimonial benediction among Papists, yet forasmuch as it has a necessary use in the Church and may not (as the controverted ceremonies may) be well spared…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, pp. 24-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

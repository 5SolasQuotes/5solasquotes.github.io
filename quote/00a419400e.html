<main class="wrap"><figure class="quote" id="q-00a419400e" data-kw="">
<blockquote><p>I rather think, with the learned Cappellus, that this apostolical prescript or canon of good order was founded upon some civil custom then obtaining among the Corinthians and elsewhere; from whence he concludes that according to the difference of several countries, such an habit and deportment is to be used in divine service which is commonly used to express reverence and decency in conversation. … (He, that will see the different customs of nations in this matter, both in and out of sacred uses, may consult Grotius and Cappellus at large on the place.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/france.html">Samuel Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Late Treatise, entitled, The Protestant Reconciler</cite>, (London, 1683), section 8, pp. 110-12 (on Louis Cappel)</span></figcaption>

</figure><figure class="quote" id="q-c03c3aae9e" data-kw="">
<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, … (1636), Of the Communicants’ gesture in the act of receiving, eating and drinking’, 4th Part, ch. 5, ‘Kneeling in the act of receiving the sacramental elements of the supper is idolatry’, pp. 104-6</span></figcaption>

he] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.”

through+all+the+tables+of+the+world%3B+his+actions%2C+which+were+divine+and+holy%2C+are+reiterat%5Bed%5D.+In+Gratian%E2%80%99s+decree+%28De+consecrat.+dist.+1%2C+ch.+68%29+we+have+a+superstitious+direction+of+Pope+Anastasius%2C+that+when+the+Gospel+is+read+in+the+Church%2C+those+that+are+present+shall+not+sit%2C+but+stand%2C+venerabiliter+curvi%2C+bowing+reverently%2C+hearken+and+adore.+Wherefore+more+at+the+hearing+of+the+Gospel+than+the+%5Breading+of+the%5D+Epistle%5Bs%5D%2C+which+is+also+Evangelical%3F+Yet+you+see%2C+howbeit+that+standing+with+bowing+be+more+than+to+have+the+head+uncovered%2C+it+was+but+veneration.+And%2C+whereas+he+says%2C+Et+fideliter+adorent%2C+the+gloss+has%2C+id+est+venerentur%2C+because+the+word+%E2%80%98adoring%E2%80%99+is+taken+there+in+a+large+sense%2C+as+ye+may+see+%5Bin%5D+sundry+places+above+cited%2C+not+for+that+which+is+in+a+strict+sense+called+adoration.+Adoration+in+strict+sense+is+kneeling+or+prostration.+Whereas+Matthew+says%2C+ch.+8%2C+of+the+leprous+man%2C+that+he+worshipped+Christ%2C+or+adored+Christ%2C+as+the+Latin+translation+has+according+to+the+original%2C+Mk.+1%3A40%2C+He+kneeled+down+to+Him%2C+and+Luke+5%3A12%2C+that+he+fell+in+his+face.+Suchlike%2C+where+it+is+said+of+the+Cananitish+woman%2C+Mt.+15%3A25%2C+that+she+worshipped%2C+or+adored+Him%3A+et+adoravit+eum%2C+Mk.+7%3A25%2C+it+is+said+that+she+fell+at+his+feet.+The+Greek+word+%5BGreek%5D%2C+signifies+to+fall+down+like+a+dog+o%E2%80%A2%E2%80%A2whelp+at+the+feet+of+another%2C+as+our+Lord.+Further%2C+our+heads+are+not+other+way+uncovered+in+the+act+of+receiving+than+in+the+rest+of+the+time+of+the+celebration+when+we+are+not+near+the+elements.+And+thirdly%2C+the+uncovering+of+our+head+is+compatible+with+the+variety+of+actions+in+time+of+celebration%3A+praying%2C+singing%2C+the+words+of+the+institution%2C+and+chapters+read%2C+but+adoration+directed%2C+as+they+pretend+to+God%2C+cannot+be+without+presenting+our+petitions+and+thanks+to+God%2C+which+requires+a+several+part+of+the+action+by+itself.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Re-examination+of+the+Five+Articles+enacted+at+Perth%2C+anno+1618%E2%80%A6+%281636%29%2C+Of+the+Communicants%E2%80%99+gesture+in+the+act+of+receiving%2C+eating+and+drinking%E2%80%99%2C+4th+Part%2C+ch.+5%2C+%E2%80%98Kneeling+in+the+act+of+receiving+the+sacramental+elements+of+the+supper+is+idolatry%E2%80%99%2C+pp.+104-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd014bbafa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd014bbafa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=Margin%20Note%3A%5D%20The%20uncovering%20of%20the,part%20of%20the%20action%20by%20itself&amp;text=Margin%20Note%3A%5D%20The%20uncovering%20of%20the%20head%20not&amp;text=a%20several%20part%20of%20the%20action%20by%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

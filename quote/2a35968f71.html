<blockquote><p>Secondly, as this sacrament being a communion admonishes that we are all one in Christ: so it teaches that it is to be received of many together in the church, not of one alone, and therefore it overthrows the private masses of the church of Rome, where one partakes all and the rest of the Church nothing at all. There is a flat opposition between these two: so that the communion cannot be a private mass, and private mass cannot be a communion. That which is ordained and prepared for many, delivered unto many, and received of many, cannot stand with the mass, where the priest prepares for himself, not for the people: he speaks to himself, not to the church: he receives himself alone, not with his brethren: all which are directly contrary to the apostles rule, ‘Tarry one for another.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), bk. 3, ‘Of the Lord’s Supper’, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a16dd689d4" data-kw="">
<blockquote><p>If any good Christian visited with long sickness and known to the pastor, by reason of his present infirmity [be] unable to resort to the church for receiving of the holy Communion, or being sick shall declare to the pastor upon his conscience that he thinks his sickness to be deadly, and shall earnestly desire to receive the same in his house: The minister shall not deny to him so great a comfort, lawful warning being given to him upon the night before, and that there be three or four [persons] of good religion and conversation, free of lawful impediments, present with the sick person to communicate with him, who must also provide a convenient place in his house and all things necessary for the reverend administration thereof, according to the order prescribed in the Church.</p></blockquote>

<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments:

1. Christ only administered the Supper in the assembly of the disciples.

2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33).

3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections:

1. Christ performed it in private houses. Reply: But the Church gathered there.

2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments:

1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either.

2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread.

3. There is no example or institution of it in the Word of God. Objections:

1. It is the body of Christ. Reply: No. The body of Christ is not bread.

2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 17, ‘The Sacraments’, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-2a2fa673ee" data-kw="">
<blockquote><p>In the time of Justin the Deacon some did carry that which was left of the Communion, at what time the Lord’s Supper was celebrated, to them which were absent by reason of their disease, from the public assembly or unto strangers, and outlandish bishops into their inn. And as Eusebius reports (Church History, Ch. 5, bk. 24), the bishop of Rome was wont to do so, but without superstition, and for no other end but for a token of concord and consent in doctrine and in the whole profession: but because we say that we must not so much enquire whether those fragments were sent, or but whether they were well sent. And that custom has degenerated into superstition, whereby at this day the host is carried to them alone which are about to die, and that for certain gain and advantage, as also in a vain persuasion of a certain necessary provision for their journey, that custom of carrying the Supper to the absent, is worthily taken away in our Churches. Cyprian in the administration of this sacrament, ‘We ought to do no other thing than that which Christ did.&#x27;</p></blockquote>

<blockquote><p>First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“First ‘private’ signifies that which is done privily in a clanculary [clandestine] manner by stealth, without authority contrary to God’s Word by Jesuits, seminary priests, schismatical teachers, and the like; in which sort, if any of our [antagonist] brethren mean, they prove nothing against us, for our [Anglican] Church generally condemns such conventicles, whether of heretics, or schismatics. Secondly, private baptism signifies in the meaning of the [Prayer] Book, that which is administered by a lawful minister at home, where the child is born, a competent number being assembled, the child being weak, the church or chapel far distant, the season of the year oversharp, the way very inconvenient, all which, or the like occasions, are matters of circumstance; the lawfulness of baptism is no way frustrated, nor made void, nor against God’s Word, nor a private action. For as one well notes, ‘Sacraments though they be in private places administered, yet are public actions.’ ([Andrew Willet] Synopsis Papismi, p. 490)”

— William Cotton, ch. 10, ‘Private Communion’ in Answer to the Reasons for Refusal of Subscription in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605), p. 194 Cotton was an Anglican bishop.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+%E2%80%98private%E2%80%99+signifies+that+which+is+done+privily+in+a+clanculary+%5Bclandestine%5D+manner+by+stealth%2C+without+authority+contrary+to+God%E2%80%99s+Word+by+Jesuits%2C+seminary+priests%2C+schismatical+teachers%2C+and+the+like%3B+in+which+sort%2C+if+any+of+our+%5Bantagonist%5D+brethren+mean%2C+they+prove+nothing+against+us%2C+for+our+%5BAnglican%5D+Church+generally+condemns+such+conventicles%2C+whether+of+heretics%2C+or+schismatics.+Secondly%2C+private+baptism+signifies+in+the+meaning+of+the+%5BPrayer%5D+Book%2C+that+which+is+administered+by+a+lawful+minister+at+home%2C+where+the+child+is+born%2C+a+competent+number+being+assembled%2C+the+child+being+weak%2C+the+church+or+chapel+far+distant%2C+the+season+of+the+year+oversharp%2C+the+way+very+inconvenient%2C+all+which%2C+or+the+like+occasions%2C+are+matters+of+circumstance%3B+the+lawfulness+of+baptism+is+no+way+frustrated%2C+nor+made+void%2C+nor+against+God%E2%80%99s+Word%2C+nor+a+private+action.+For+as+one+well+notes%2C+%E2%80%98Sacraments+though+they+be+in+private+places+administered%2C+yet+are+public+actions.%E2%80%99+%28%5BAndrew+Willet%5D+Synopsis+Papismi%2C+p.+490%29%E2%80%9D%0A%0A%E2%80%94+William+Cotton%2C+ch.+10%2C+%E2%80%98Private+Communion%E2%80%99+in+Answer+to+the+Reasons+for+Refusal+of+Subscription+in+Reasons+for+Refusal+of+Subscription+to+the+Book+of+Common+Prayer+under+the+hands+of+certain+Ministers+of+Devon+and+Cornwall...+as+they+were+exhibited+by+them+to+the+Right+Reverend+Father+in+God+William+Coton%E2%80%A6+with+an+Answer...+%28L

<main class="wrap"><figure class="quote" id="q-5dd59c9ee0" data-kw="">
<blockquote><p>In 1646, when the Presbyterians had fully regained the ascendancy, the Scottish Parliament passed an act, requiring every parish to have a schoolmaster, and ordaining, that if in any case, heritors or land-holders neglected raising means for his support, the Presbytery should nominate twelve men, to make the assessment upon their property. Indeed, strange as it may appear, the period between 1638 and 1660, seems almost entitled to be called the golden age of popular education in Scotland. In the universal diffusion of religious instruction, it was decidedly so. ‘For,’ says Kirkton, a very respectable Church historian of the times, ‘every parish had a minister, every village a school, every family almost had a Bible—yea, in most of the country, all the children of age could read, and were provided with Bibles either by their parents, or ministers.

I have lived many years in a parish, where I never heard an oath — and you would not, for a great part of the country, have lodged in a family, where the Lord was not worshipped by reading, singing, and prayer. ‘Nobody,’ he quaintly adds, ‘complained more of our church government, than our taverners, whose ordinary lament was, that their trade was hopeless—people were become so sober.’ It was thus, by planting the school by the side of the kirk, that the Reformed clergy raised the people of Scotland, both from feudal bondage and spiritual thraldom; and most grateful was the return which they every where received. During that period, school teaching was a regular profession — as much so as that of the ministry, and men were educated for it. Piety no less than learning and aptness to teach, was regarded as an essential qualification in a school-master. The parish school was the nursery of the kirk, and the master was expected to co-operate with the minister, in all his plans and efforts for the spiritual good of the rising generation. To command the best talents and to place the teacher on the highest vantage ground, in the discharge of his duties, a house was provided for his family, and he received a liberal and permanent support. In the sacredness of his office, the pastor was above him; but in talents and scholarship, it was thought that the school-master stood upon nearly the same level.</p></blockquote>

<blockquote><p>Thirdly, the Scripture intimates this difference between ministry and magistracy, that the work of the ministry and the administrations thereof are performed in the name of Jesus Christ, as Mediator and King of the Church: the work of the magistracy not so… Now let our opposites show (if they can) where they find in Scripture that the Christian magistrate is to rule in the name of Christ, to judge in the name of Christ, to make laws in the name of Christ, to make war or peace in the name of Christ, to punish evil-doers with the temporal sword in the name of Christ. Of the ministry I did show that in the name of the Lord Jesus Christ we do assemble ourselves together, Mt. 18:20, in his name do we preach, Lk. 24:47; Acts 4:17-18; 5:28,44; 9:27, in his name do we baptize, Acts 2:38, 8:16; 19:5, in his name do we excommunicate, 1 Cor. 5:5… … A minister of Christ does both preach and baptize in the name of Christ, as Mediator, that is, vice Christi [in the place of Christ], in Christ’s stead, and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our comission to preach and baptize… So that to preach and baptize epi to onomati Iesou Christou (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38) comprehends a formal commission, power and auhority, given and derived from Christ. … The ministers of Christ do act in the name of Christ, that is, in the name, authority, room and place of Christ: We are ambassadors for Christ, and we preach in Christ’s stead, 2 Cor. 5:20. This… makes good my argument. Why did he [Mr. Hussey, an Erastian] not show us the like concerning magistracy? I suppose he would, if he could…</p></blockquote>

<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>

e First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.”

— Theodore Beza, The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops, [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43, pp. ToC">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+bishop+ordained+of+God%2C+or+set+up+by+the+law+of+God%2C+does+declare+nothing+else+but+their+calling%2C+which+by+an+other+more+special+name%2C+are+called+pastors%2C+whom+%28says+Luke+%5Bin+Acts+20%5D%29+the+holy+Ghost+has+appointed+bishops+to+feed+the+Church+of+God.+And+either+of+these+names+of+pastor+or+of+bishop+is+proper+to+them+in+the+New+Testament%2C+whereby+the+apostle+does+distinguish+them+from+apostles%2C+prophets%2C+and+evangelists%2C+which+were+callings+to+endure+for+a+time%2C+Eph.+4%3A11%2C+and+from+deacons%2C+1+Tim.+3+and+Phil.+1%3A1%2C+for+otherwise+they+are+everywhere+called+elders%E2%80%A6+But+they+are+called+bishops+in+regard+of+the+sheep+committed+unto+them%2C+as+though+a+man+should+call+them+watchmen+of+%5Bor%3F%5D+overseers.+These+now+were+one+alone%2C+as+where+any+church+had+but+one+pastor%2C+or+more+if+the+church+had+more+than+one.+And+the+meeting+of+them+together+jointly+with+their+elders%2C+whom+Paul+calls+%E2%80%98governors%E2%80%99+%5B1+Cor.+12%5D%2C+of+the+other+common+name+called%2C+was+the+eldership.+Their+duty+was+to+attend+on+the+word+and+prayer%2C+both+publicly+and+privately%2C+and+in+common+to+governe+the+Church%2C+as+appears+by+many+places+of+Scripture.+%E2%80%A6+Of+the+Bishop+that+is+of+Man+The+bishop+that+is+of+man%2C+that+is+to+say%2C+brought+into+the+Church+by+the+alone+wisdom+of+man%2C+besides+the+express+Word+of+God%2C+is+a+certain+power+given+to+one+certain+pastor+above+his+other+fellows%2C+yet+limited+with+certain+orders+or+rules+provided+against+tyranny.+They+which+did+bear+this+office+of+bishop%2C+are+called+bishops+in+regard+of+their+fellow+elders+and+the+whole+clergy%2C+as+watchmen+set+over+the+clergy.+That+this+calling+was+not+brought+in+by+the+Word%2C+it+is+manifest+by+that%2C+that+there+is+not+to+be+found+in+the+New+Testament+so+much+as+one+syllable%2C+whereby+there+may+be+the+least+surmise+of+any+such+thing.+For+although+we+doubt+not%2C+but+all+things+ought+to+be+done+orderly+in+the+Lord%E2%80%99s+house%2C+and+therefore+that+some+one+should+be+president+in+every+assembly%E2%80%A6+%E2%80%A6+The+Answer+to+the+First+Question+Where+as+Satan%E2%80%99s+bishop+has+been+the+overthrow+of+the+Church+and+all+Christian+kingdoms%2C+whose+head+is+the+Roman+Antichrist%2C+it+is+to+be+looked+unto+of+all+hands%2C+especially+of+all+godly+princes%2C+that+they+at+once+abolish+it%2C+if+they+mind+the+reformation+of+the+Church+and+their+own+safety.+As+for+the+bishop+ordained+by+man+and+brought+into+the+Church+by+little+and+little%2C+whereby+Satan+made+him+a+way+for+greater+things%2C+it+had+been+tolerable%E2%80%A6+experience+of+so+many+ages+does+teach+us+too+well%2C+that+unless+this+root+also+be+plucked+up%2C+it+will+come+to+pass+that+the+same+fruit+will+sprout+and+bud+forth+again.+Finally%2C+seeing+the+Lord+has+so+often+decided+this+controversy+of+superiority+among+his+own+disciples%2C+that+He+shut+it+clean+out%2C+seeing+the+rule+both+for+doctrine+and+good+order+of+the+Church+is+to+be+sought+for+out+of+the+very+writings+of+the+apostles%3A+and+it+is+manifested%2C+the+churches+then+prospered%2C+when+all+this+authority+of+one+man+over+the+rest%2C+yet+was+not%2C+but+as+that+grew+up%2C+so+all+things+fell+to+decay.+Finally%2C+seeing+where+the+remnants+of+this+government+by+a+few+are+not+clean+taken+away%2C+the+work+of+the+Lord%2C+is+openly+hindered%3A+Our+judgement+is+that+after+the+chasing+away+of+this+device+of+man%2C+the+churches+shall+be+well+provided+for%2C+if+they+may+be+repaired+according+to+the+writings+of+the+apostles.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Judgment+of+a+Most+Reverend+%26+Learned+Man+from+Beyond+the+Seas+Concerning+a+Threefold+Order+of+Bishops%2C+%5Bof+God%2C+of+Man%2C+of+the+Devil%5D%2C+with+a+Declaration+of+Certain+Other+Weighty+Points+Concerning+the+Discipline+%26+Government+of+the+Church+%28%5BLondon%2C+1585%5D%29+43%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F323e74c17f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/323e74c17f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=A%20bishop%20ordained%20of%20God%2C%20or,to%20the%20writings%20of%20the%20apostles&amp;text=A%20bishop%20ordained%20of%20God%2C%20or%20set%20up&amp;text=repaired%20according%20to%20the%20writings%20of%20the%20apostles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Here he argued that when schism threatened the unity of a church a presbytery could appoint a temporary bishop, similar to the post-reformation superintendents. This type of bishop would be subject to the jurisdiction of a provincial or national synod, acting in a capacity akin to that of a constant moderator… For Baillie this temporary office was not ‘wicked in itself or contrair to the word of God;’ indeed, Baillie could not cite any ‘classic divine of the Reformed churches’ who maintained that such an episcopate was unlawful… Temporary bishops were only instituted by ecclesiastical canon, implying that scriptural and patristic sources did not explicitly condemn such practice.</p></blockquote>

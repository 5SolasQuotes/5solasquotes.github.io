<main class="wrap"><figure class="quote" id="q-88bdb36d65" data-kw="">
<blockquote><p>SECTION VII: THE rest of mankind, God was pleased, according to the unsearchable counsel of his own will, whereby he extendeth or withholdeth mercy as he pleaseth, for the glory of his sovereign power over his creatures, to pass by, and to ordain them to dishonour and wrath for their sin, to the praise of his glorious justice.

This section teaches the following propositions: 1. That as God has sovereignly destinated certain persons, called the elect, through grace to salvation, so he has sovereignly decreed to withhold his grace from the rest; and that this withholding rests upon the unsearchable counsel of his own will, and is for the glory of his sovereign power.

2. That God has consequently determined to treat all those left in their sins with exact justice according to their own deserts, to the praise of his justice, which demands the punishment of all unexpiated sin. This decree of reprobation, as it is called, is the aspect which God’s eternal purpose presents in its relation to that portion of the human family which shall be finally condemned for their sins. Reprobation consists of two elements, the negative and the positive. In its negative aspect God does not elect the reprobate, but “passes over” him; in this God is absolutely sovereign, resting upon His good pleasure alone, since those passed over are no worse than those elected. Positively, reprobation is not sovereign, but purely judicial, since God has determined to treat the reprobate according to what they deserve. This doctrine, instead of being inconsistent with the principles of absolute justice, necessarily follows from the application of those principles to the case in hand.

(1) All men alike are “by nature the children of wrath,” and justly obnoxious to the penalty of the law antecedently to the gift of Christ to be their Saviour. It is because they are in this condition that vicarious satisfaction of divine justice was absolutely necessary in order to the salvation of any, otherwise, the apostle says, “Christ is dead in vain.” Hence if any are to be saved, justice itself demands that their salvation shall be recognized as not their right, but a sovereign concession on the part of God. None have a natural right to salvation. And the salvation of one cannot give a right to salvation to another. (2) Salvation is declared to be in its very essence a matter of grace; and if of grace, the selection of its subjects is inalienably a matter of divine discretion (Lam. 3:22; Rom. 4:4; 11:6; Eph. 1:5-7; John 3:16; 1 John 3:16; 4:10).

This doctrine as above stated is true, – (1) Because it is necessarily involved in the scriptural doctrine of election taught in the preceding sections. (2) It is expressly taught in Scripture: “Therefore hath he mercy on whom he will have mercy, and whom he will he hardeneth” (Rom. 9:18; 1 Pet. 2:8; Rev. 13:8; Jude 4). (3) God asserts the right involved as his righteous prerogative: “Thou wilt say then unto me, Why doth he yet find fault? Who art thou that repliest against God? Hath not the potter power over the clay, of the same lump to make one vessel unto honour, and another unto dishonour? What if God, willing to shew his wrath, and to make his power known, endured with much long-suffering the vessels of wrath fitted to destruction: and that he might make known the riches of his glory on the vessels of mercy, which he had afore prepared unto glory?” (Rom. 9:19-23).</p></blockquote>

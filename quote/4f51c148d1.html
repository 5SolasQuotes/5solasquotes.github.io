<main class="wrap"><figure class="quote" id="q-4f51c148d1" data-kw="">
<blockquote><p>The charges I have still to mention are of minor importance. The first of them is the assertion, so often and confidently propounded of late, that the Confession represents the creation of the world as having taken place in six ‘natural or literal days,’ which almost all orthodox divines now grant that it did not. But the whole ground for the assertion is furnished by the words ‘natural or literal’ which the objectors themselves insert or assume. The authors of the Confession, as Dr. A. A. Hodge has well observed (Commentary on the Confession of Faith, p. 82), simply repeat the statements of Scripture in almost identical terms, and any interpretation that is fairly applicable to such passages of Scripture as Gen. 2:3 and Exodus 20:2, is equally applicable to the words of the Confession. It is quite true, as he has shown, that since the Confession was composed, many facts of science previously unknown have been brought to light respecting the changes through which our globe and probably the stellar universe had passed before the establishment of the present order of things, and that new arguments have thus been furnished against interpreting the days mentioned in the above passages of Scripture as literal days. But it is a mistake to suppose that this method of interpreting the days in these passages originated in modern times, and was altogether unknown to the men who framed our Confession. To prove it a mistake it is not necessary to have recourse to the ingenious conjecture that some of the Cambridge men in the Assembly may have been acquainted with the manuscript work of Dean [John] Colet [d. 1519], preserved in their archives, and only given to the public in our own time, in which the figurative interpretation of the days of creation is maintained.¹ ¹ Colet’s Letters to Radulpluis oit the Mosaic Account of the Creation, with translation and notes by J. H. Lupton. 1876 [pp. 3-28]. There is no lack of evidence, in works published before the meeting of the Assembly, and familiar to several of its members, to show that the figurative interpretation had long before Dean Colet’s time commended itself to several eminent scholars and divines with whose works members of the Assembly were acquainted. If there was one Jewish scholar with whose writings such men as Lightfoot, Selden, Gataker, Seaman, and Coleman were more familiar than another, it was Philo of Alexandria [d. c. 50]; and Philo has not hesitated to characterise it as ‘rustic simplicity, to imagine that the world was created in six days, or, indeed, in any clearly defined space of time.’ Augustine,² the great Latin doctor, with whose works several of the Westminster divines were far better acquainted than most of their successors, in his Literal Commentary on Genesis, maintains that the days of the creation-week were far different from (longe dispares), and again, very unlike to (multum impares) those that now are in the earth. ² Migne’s edition of Augustine, De Genesi ad literam, iv.27. Procopius [d. 565], a Greek writer not unknown to some of the Westminster divines, teaches that the number of six days was assumed not as a mark of actual time, but as a manner of teaching the order of creation; while in certain commentaries in that age, attributed to the Venerable Bede [d. 735], and largely read in England, though now deemed spurious, a similar opinion is said to be found.³ ³ Most of these testimonies are referred to, and the opinion they express is admitted to be probabilis [probable], in the sense his sect used that term, by Sixtus Senensis [a Romanist, d. 1569] in his Bibliotheca Sancta, p. 422. The figurative interpretation therefore of the six days of creation is no make-shift of hard-pressed theologians in the nineteenth century. It was held by respectable scholars and divines, from early times, and was known to the framers of our Confession; and had they meant deliberately to exclude it they would have written not six days, but six natural or literal days.</p></blockquote>

<blockquote><p>Although Christ is to be adored wherever He is present, it does not follow that everything in which He is present is to be adored. Christ dwells in all believers and yet believers are not to be adored with Christ… We are not bound to adore God with an external adoration wherever He is present; but only where He is present with rays of his glorious majesty and where He wishes to be adored. Otherwise as God is in all creatures (in stones, in trees and in animals), He would have to be adored in them. Thus we are commanded to adore God in the heavens, where He manifests Himself gloriously. The Israelites were bound to adore Him at the ark, which was teh symbol of his presence…. The essential and internal glory of God (which consists in the eminence of his perfections) differs from the accidental and external glory (which is placed in some sensible, miraculous and extraordinary effect; as was seen in the bush, the ark and other like symbols of God’s presence). Although the internal and essential glory is the foundation of external adoration, still it does not bind to the exercise of actual adoration unless it is connected with the external glory (i.e., with some miraculous and extraordinary effect which makes an impression on the senses). Otherwise, as God is everywhere with his essential glory and in all his creatures, He would have to be adored there (which is absurd). … The distinctions between the absolute, ultimate, intransitive, direct and formal worship (which is exhibited to Christ in the Eucharist); and the transitive, indirect, relative, and concomitant worship (given to the species of the Eucharist), cannot remove the crime of idolatry. (1) They are unknown to the Scriptures, which recognize no religious worship excepting one alone, which is absolute and direct…</p></blockquote>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>

<blockquote><p>Therefore the aforesaid names signify the divine substance, but in an imperfect manner, even as creatures represent it imperfectly. So when we say, God is good, the meaning is not, God is the cause of goodness, or God is not evil; but the meaning is, Whatever good we attribute to creatures, pre-exists in God, and in a more excellent and higher way. Hence it does not follow that God is good, because He causes goodness; but rather, on the contrary, He causes goodness in things because He is good; according to what Augustine says (De Doctr. Christ. i, 32), Because He is good, we are.</p></blockquote>

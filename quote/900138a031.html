<blockquote><p>Mark well how many parsonages or vicarages are there in the realm, which at the least have a plow-land a-piece. Then note the lands of bishops, abbots, priors, nuns, knights of St John’s, cathedral churches, colleges, chauntries, and free-chapels. For though the house fall in decay, and the ordinance of the founder be lost, yet will not they lose the lands. What cometh once in, may never more out. They make a free-chapel of it; so that he which enjoyeth it shall do nought therefore. Besides all this, how many chaplains do gentlemen find at their own cost, in their houses? How many sing for souls, by testaments? Then the proving of testaments, the prizing of goods, the bishop of Canterbury’s prerogative; is that not much through the realm in a year? Four offering days, and priuy tithes. There is no servant, but that he shall pay somewhat of his wages. None shall receive the body of Christ at Easter, be he never so poor a beggar, or never so young a lad or maid, but they must pay somewhat for it. …What get they also by confessions? Yea, and many enjoin penance, to give a certain [sum] for to have so many masses said, and desire to provide a chaplain themselves; soul-masses, dirges, month-minds, year-minds, All-souls-day, and trentals. The mother church, and the high altar, must have somewhat in every testament. Offerings at priests’ first masses. Item, no man is professed, of whatsoever religion it be, but he must bring somewhat. The hallowing, or rather conjuring of churches, chapels, altars, super-altars, chalice, vestments, and bells. Then book, bell, candlestick, organs, chalice, vestments, copes, altar-cloths, surplices, towels, basins, ewers, ship, censer, and all manner ornament, must be found them freely; they will not give a mite thereunto. Last of all, what swarms of begging friars are there! The parson sheareth, the vicar shaveth, the parish priest polleth, the friar scrapeth, and the pardoner pareth; we lack but a butcher to pull off the skin.</p></blockquote>

<blockquote><p>We see then how that the tithes which were contained in the law were especially for the people of Israel. And yet notwithstanding the tithes were very common amongst the Heathen, even for kings, princes and noblemen. We see likewise by profane histories, that they were also exacted, and that in some countries they exacted more than in other some… But be as be may, this word ‘Tithe’, or ‘Tenth’, has been a common and ordinary amongst all nations. And all Princes and great men as I have already said, sithens [since] the Gospel was received, have bestowed part of the tithes towards the maintenance of the Ministers of the word, as is very great reason, according to the saying of Saint Paul, “That they which ministered at the Altar in the old Testament were maintained, that they which at this day sacrifice unto God after a more excellent manner,” (1 Cor. 9:9-13) that is, which win souls unto Him, to make of them sacrifices unto his majesty, that they should also be as well provided for and maintained: and although God has not qualified how nor by what manner of revenue they should be maintained, yet is there a law for it. Now then, sith [since] God has been known through the preaching of the Gospel, a Christian order and law has been made for the giving and bestowing of one part of tithes [as opposed to other uses, such as giving to the poor, etc.]. And herein we may see the deceit of the Pope and of his shavelings [def: contemptuous epithet for a tonsured ecclesiastic, i.e. monk]: for, when they handle the law of tithes in their Canons, they take it as if it were transferred to them after that Jesus Christ had put an end unto the priesthood of Levi. All these are very leasings [lies], falsifying the holy scripture, and wickedly corrupting the same. For we see to the contrary, as has been before showed, that it is long ago sithence [since], that it was not known what the paying of tithes was by virtue of the law of Moses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Third Sermon of Melchisedech</cite>, pp. 64-68 on Gen. 14:20-24 in Sermons on Melchizedek &amp; Abraham, Justification, Faith &amp; Obedience (1592; rep. Old Paths Publications: 2000)</span></figcaption>

<blockquote><p>The dress of the Ministers in the English Church at Geneva [under John Knox] is a matter which is perplexing, for there is no evidence available indicating precisely what was the custom. … [John] Paullain [1517–1565, an English reformer], in his ‘Ad lectorem candidum’ (Lit. sac., P, Q) [‘To the Bright Reader’, in Liturgia Sacra, seu Ritus Ministerii in Ecclesia Peregrinorum… 1551/4], on the other hand, states quite definitely that vestments are not worn in his congregation. He urges that the New Testament does not prescribe a Minister’s apparel, and that a shepherd is not known to his sheep by his garb but by his call to them, and he thinks it sufficient that a Minister should be dressed modestly and soberly, with an absence of all pomp and arrogance. Further, he regards vestments as an incitement to superstition because of the Roman custom of blessing the garments. Thus he thought that in this as in other matters the Reformed Church should be content with the utmost simplicity. In England the Puritan party objected strenuously to all vestments. As early as 1562 request was made to Convocation ‘that the use of copes and surplices… be taken away; so that all ministers in their ministry use a grave, comely, and side-garment, as commonly they do in preaching’ and ‘that the ministers of the word and sacraments be not compelled to wear such gowns and caps, as the enemies of Christ’s gospel have chosen to be the special array of their priesthood’ ([John] Strype, Annals, Oxford ed., 1824, vol. i., pt. ii. 501). And in the same period we find the bishops enforcing the cassock and gown and forbidding the Puritan custom of preaching in what Bishop Duppa called ‘a riding or ambulatory Cloake’ (Rit. Com. Rep. ii. 577). The objections in these passages are against all gowns… Certainly [Myles] Coverdale [1488–1569] objected to all gowns, as we see by his letter to Farel in 1556: ‘Our affairs are not altered for the better, but alas! are sadly deteriorated. For it is now settled and determines… that out of doors must be worn the square cap, bands, a long gown and tippet; while the white surplice and cope are to be retained in divine service’ (Parker Soc. Zurich Letters, p. 121, Let. 50). … This brief review of the early evidence in Strasburg, Frankfort [Germany], Geneva, England and Scotland, shows that there appears to have been no practice that was agreed upon by all who followed the Calvinistic Reformation, and as regards the English Church of Geneva no accurate conjecture can be made. It is probable that the Ministers there adopted Calvin’s practice and wore the black gown, with cassock, bands, and scarf; but there can be no certainty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-maxwell.html">William Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix G, ‘The Dress of the Ministers’ in John Knox’s Genevan Service Book</cite>, 1556; The Liturgical Portions of the Genevan Service Book Used by John Knox While a Minister of the English Congregation of Marian Exiles at Geneva, 1556-1559 (Edinburgh: Oliver &amp; Boyd, 1931), pp. 210-13</span></figcaption>

<blockquote><p>It is true that the Lord occasionally manifested his presence by certain signs, so that He was said to be seen face to face; but all the signs He ever employed were in apt accordance with the scheme of doctrine, and, at the same time, gave plain intimation of his incomprehensible essence. For the cloud, and smoke, and flame, though they were symbols of heavenly glory (Dt. 4:11), curbed men’s minds as with a bridle, that they might not attempt to penetrate farther… The Holy Spirit appeared under the form of a dove, but as it instantly vanished, who does not see that in this symbol of a moment, the faithful were admonished to regard the Spirit as invisible, to be contented with his power and grace, and not call for any external figure? God sometimes appeared in the form of a man, but this was in anticipation of the future revelation in Christ, and, therefore, did not give the Jews the least pretext for setting up a symbol of Deity under the human form. The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-845e49be1c" data-kw="">
<blockquote><p>But piety, though it hold the first place among essential qualifications here, is not all that is necessary. It is not every pious man, nay, not every fervently pious man, that is qualified to be a minister, and far less an able minister. Another essential requisite to form the character of such a minister, is, 2. Talents. By which I mean, not that every able minister must, of necessity, be a man of genius; but that he must be a man of good sense; of native discernment and discretion; in other words, of a sound respectable natural understanding. When our blessed Lord was about to send forth his first ministers, he said unto them; Be ye wise as serpents, as well as harmless as doves.

And, truly, there is no employment under heaven, in which wisdom, practical wisdom, is so important, or rather, so imperiously and indispensably demanded, as in the ministry of reconciliation. A man of a weak and childish mind, though he were pious as Gabriel, can never make an able minister, and he ought never to be invested with the office at all: for with respect to a large portion of its duties, he is utterly unqualified to perform them; and he is in constant danger of rendering both himself and his office contemptible.

No reasonable man would require proof to convince him, that good sense is essential to form an able physician, an able advocate at the bar, or an able ambassador at a foreign court. Nor would any prudent man entrust his property, his life, or the interests of his country, to one who did not bear this character. And can it be necessary to employ argument, to show that interests, in comparison with which, worldly property, the health of the body, and even the temporal prosperity of nations, are all little things, ought not to be committed to any other than a man of sound and respectable understanding? Alas! if ecclesiastical judicatories had not frequently acted, as if this were far from being a settled point, it were almost an insult to my audience to speak of it as a subject admitting of a question.

Though a minister concentrated in himself all the piety, and all the learning, of the Christian church; yet if he had not at least a decent stock of good sense, for directing and applying his other qualifications, he would be worse than useless. Upon good sense depends all that is dignified, prudent, conciliatory, and respectable in private deportment; and all that is judicious, seasonable, and calculated to edify, in public ministration.

The methods to be employed for winning souls, are so many and various, according to the taste, prejudices, habits, and stations of men: a constant regard to time, place, circumstances, and character, is so essential, if we desire to profit those whom we address: and some tolerable medium of deportment, between moroseness and levity, reserve and tattling, bigotry and latitudinarianism, lukewarmness and enthusiasm, is so indispensable to public usefulness, that the man who lacks a respectable share of discernment and prudence, had better, far better, be in any other profession than that of a minister. An able minister he cannot possibly be. Neither will any thing short of a sound judgment, a native perception of what is fit and proper, or otherwise, preserve any man who is set to teach and to rule in the church, without a miracle, from those perversions of scripture; those ludicrous absurdities; and those effusions of drivelling childishness, which are calculated to bring the ministry and the bible into contempt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of the Church to Take Measures for Providing An Able and Faithful Ministry: A Sermon, Delivered at Princeton, August 12, 1812, at the Inauguration of the Rev. Archibald Alexander, D.D. As Professor of Didactic and Polemic Theology, in the Theological Seminary of the Presbyterian Church</cite>, (New York: Whiting and Watson, 1812), pp 18-21.</span></figcaption>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [prelate] Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches and Gregory de Valentia, as I show[ed] before… …when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo [therefore], it [the Church’s judgment] cannot remove my doubting and beget faith…

7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

<blockquote><p>Paul gives rules and directions to Timothy (1 Tim. 5:1,19 and Titus 2) as to pastors, not as to believers, concerning the manner of receiving [Church] complaints, nor is there in Scripture precept, promise or practice of believers to receive complaints, we are surer than our Brethren [the congregationalists]; and it’s safer to expound this [phrase], ‘Tell the Church’ [Mt. 18:17], that is, ‘Tell Timothy and the Elders’ than, ‘Tell the church, that is, tell any member of the church at Corinth,’ i.e. tell any woman or servant [your formal complaint], for they are as essentially members as Timothy or any of the Elders, [Point] 2. and [these laypersons] must join their consent to censures because members must hear the scandals because they must tacitly consent before censures be dispensed; it follows not [however] that members must be told [of such formal complaints as an authoritative court, in the sense of Mt. 18:17], for [only] the tacit consent of women [to such Church censures of others] is requisite, for they may be scandalized or edified by the good or evil dispensing of censures as well as men.</p></blockquote>

<blockquote><p>For we also say that the church is the interpreter of scripture, and that this gift of interpretation resides only in the church: but we deny that it pertains to particular persons, or is tied to any particular see or succession of men.</p></blockquote>

</figure><figure class="quote" id="q-602d94bbb6" data-kw="">
<blockquote><p>The fifth mark is “the continued succession of bishops without any interruption, from the apostles even to our times.” But here (in the first place), we must distinguish succession: one is personal and local, as to persons and places; another is doctrinal, as to faith. We do not deny that the latter is a mark and thus it coincides with ours. But the former (of which we treat here) cannot be a mark. (a) It is merely contingent and aside from the nature of the church, unless it is founded on unity of sound doctrine and true faith (Eph. 4:4, 5, 11, 12). Nay, since the church is ambulatory and not tied down to this or that place, such also is its succession. (b) It is not proper because it belongs also to false teachers. Annas and Caiaphas succeeded Aaron in the priesthood; the scribes and Pharisees succeeded the fathers and the interpreters of the law; Arians succeeded the orthodox; the Greek church (which the Romanists consider schismatical and heretical) glories in an uninterrupted succession of bishops from the apostles. Bellarmine himself confesses that “the church cannot necessarily be inferred to be where a succession is” (“De Notis Ecclesiae,” 4.8 Opera [1857], 2:118). (c) A local and personal succession can be without a succession of doctrine. Therefore it cannot be a mark of the church because it cannot be a true church which does not have the apostolic doctrine. For the church is not to be sought in walls and temples, but in doctrines. The church is where true faith is.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-773bdeeacd" data-kw="">
<blockquote><p>16. ‘Thine eyes beheld my shapelessness, etc.’ The embryo, when first conceived in the womb, has no form; and David speaks of God’s having known him when he was yet a shapeless mass, τὸ κύημα, as the Greeks term it; for τὸ εμβρυον is the name given to the fetus from the time of conception to birth inclusive. The argument is from the greater to the less. If he was known to God before he had grown to certain definite shape, much less could he now elude his observation… The other is the more natural meaning, that the different parts of the human body are formed in a succession of time; for in the first germ there is no arrangement of parts, or proportion of members, but it is developed, and takes its peculiar form progressively… that though the members were formed in the course of days, or gradually, none of them had existed; no order or distinctness of parts having been there at first, but a formless substance. And thus our admiration is directed to the providence of God in gradually giving shape and beauty to a confused mass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 139:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

oks Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6cb2b4fae1" data-kw="">
<blockquote><p>A leading theory is that the increased risk for depression stems from an altered stress response among birth control pill users. Studies indicate that women on the pill have a blunted cortisol response: In acute stress tasks, they have a slow rise and a gradual fall of cortisol rather than the classic spike that signifies a healthy stress response. Despite the cortisol differences, these women report feeling at least as much stress as non–pill takers… women on the pill also tend to show differences in their inflammatory stress response, which occurs just before the cortisol spike.</p></blockquote>

</figure><figure class="quote" id="q-16c407d07f" data-kw="">
<blockquote><p>Whether it was a natural conception or a miraculous one? The latter is affirmed. Whether the flesh of Christ was conceived and formed in an instant? It is denied. Whether it was first conceived and formed and then united? It is denied with a distinction. …. Whether the soul of Christ was infused in the first instantiating of the conception of the body, or rather after? The latter is affirmed. Whether and in what way the embryo, or that body not yet animated, was able to be said to be the body of Christ? It is explained. Whether the flesh of Christ had its beginning from Adam? It is affirmed with a distinction. … Whether in the instantiating of the conception or of the union Christ was sactified by grace? It is distinguished. Whether in the same instantiating it had the use of free choice and reason? It is denied. Whether in the same instantiating, He was able to merit? It is denied. Whether from the first moment of conception Christ enjoyed the beatific vision? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, … (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Conception &amp; Gestation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

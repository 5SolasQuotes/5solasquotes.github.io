<main class="wrap"><figure class="quote" id="q-780939a2cf" data-kw="">
<blockquote><p>God continues to forgive the sins of those that are justified, and although they can never fall from the state of justification, yet they may, by their sins, fall under God’s fatherly displeasure; and in that condition they usually do not have the light of his countenance restored to them, until they humble themselves, beg pardon, and renew their faith and repentance (Matt. 6:12; 1 John 1:7, 9; John 10:28; Ps. 89:31–33; Ps. 32:5; Ps. 51; Matt. 26:75).</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.5</figcaption>

</figure><figure class="quote" id="q-2f9aeee0f2" data-kw="">
<blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote>
<figcaption>— <a href="../authors/john-gerstner.html">John Gerstner</a>, <cite>Theology for Everyman</cite>, ch. 6</figcaption>

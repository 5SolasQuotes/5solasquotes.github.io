<main class="wrap"><figure class="quote" id="q-4a36ab43db" data-kw="">
<blockquote><p>And all the prophets saw this, that Christ was to become the greatest thief, murderer, adulterer, robber, desecrator, blasphemer, etc., there has ever been anywhere in the world. He is not acting in His own Person now. Now He is not the Son of God, born of the Virgin. But He is a sinner, who has and bears the sin of Paul, the former blasphemer, persecutor, and assaulter; of Peter, who denied Christ; of David, who was an adulterer and a murderer, and who caused the Gentiles to blaspheme the name of the Lord (Rom. 2:24). In short, He has and bears all the sins of all men in His body—not in the sense that He has committed them but in the sense that He took these sins, committed by us, upon His own body, in order to make satisfaction for them with His own blood. Therefore this general Law of Moses included Him, although He was innocent so far as His own Person was concerned; for it found Him among sinners and thieves. Thus a magistrate regards someone as a criminal and punishes him if he catches him among thieves, even though the man has never committed anything evil or worthy of death. Christ was not only found among sinners; but of His own free will and by the will of the Father He wanted to be an associate of sinners, having assumed the flesh and blood of those who were sinners and thieves and who were immersed in all sorts of sin. Therefore when the Law found Him among thieves, it condemned and executed Him as a thief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 277–278.</cite></span></figcaption>

<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>

</figure><figure class="quote" id="q-764e523b54" data-kw="">
<blockquote><p>It is one thing to speak of the merit of the person, another of the merit of the work; and again, one thing to speak of eternal life as it is an inheritance, another as it is a reward, wages, a prize. For from the fact that someone is a son of God by grace, he merits ex condigno the inheritance of eternal life without any other pact, but by the merit of the person, not by the merit of the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-58b74ea70b" data-kw="">
<blockquote><p>Proposition 2. The faith which Paul speaks of is not the same with that which James speaks of. What kind of faith that is which Paul speaks of appears by the description which he himself gives us of it, Gal. 5. He is there speaking of justification, verse 4, and of the righteousness of faith, verse 5. And then tells us what kind of faith it is, verse 6, a faith working by love, a faith which shows itself to be a living faith by the fruit it brings forth… Faith is never opposed in Scripture to Gospel-works; because it is inclusive of ’em, and they can’t be divided, but always go together. This is faith in Paul’s sense: the tree with it’s fruit hanging on it: a living, working, fruit-bearing faith. But now the faith that James speaks of [in ch. 2], is such a faith as is alone, verse 17, without works, verse 20, and therefore is dead, verse 17. … Proposition 4. They both speak of the same justification. This is undeniably evident, because they both produce the same Scripture for the proof of their distinct positions, or assertions. James proves that Abram was justified by works because by his offering up Isaac, that Scripture was fulfilled which says, ‘Abram believed God, and it was counted to him for righteousness,’ verse 23. And Paul proves that Abram was justified by faith, and not by works, because the Scripture saith, Abram believed God, and it was counted to him for righteousness, Rom. 4:2-3… But the same Scripture proves that Abram was justified both by faith and by works; and therefore faith, and such works as are the fruit of faith are all one in Scripture-account. They are materially the same, though there may be some formal difference between ’em. And therefore, to be justified by faith, according to Paul, and by works according to James, are all one… (2) This justification he [James] speaks of was before God: For he produces that passage of Scripture for the proof of what he asserts, which all acknowledge does refer to a man’s justification before God, viz. that Abraham believed God, and it was counted to him for righteousness, verse 23. … (1) ‘Tis only the Works of the Law, that the apostle Paul opposes and rejects in this point of justification. This has been fully proved already, ch. 9, §2. (2) The Hebrew Word [Hebrew] signifies to be righteous, as well as to justify, as was showed at first setting out. (3) To justify is to account righteous, and treat as such. (4) The Scripture does expresly define being righteous by doing righteousness, and that with a special remark and observable caution prefixed, 1 Jn. 3:7, ‘Little children, let no man deceive you: He that does righteousness is righteous, even as He is righteous.’… (5) Abraham’s obedience, and Phineas’s zeal, were reckoned to them for righteousness, Jm. 2:21, 23; Ps. 106:31, and Abel by his sacrifice obtained witness that he was righteous, Heb. 11:4… (6) Whatsoever is required to pardon is required to justification; for though the formal, precise notion of justification does not consist in pardon, yet pardon is included in it taken largely, as being the inseparable adjunct and undivided companion thereof (as has been showed, ch. 4, §5). But repentance, confession, forgiveness of others, and the like, are required to pardon… (7) The Scripture frequently uses the Word [Faith] in a large Sense, so as to comprehend Obedience too, as was show’d, ch. 11. §. 2. (8) We are expresly said, to be justified by Works. To all which I add by way of Antidote. §5. (9) The admitting of gospel-works or holiness to have an interest in justification, and to be an ingredient thereof, is not inconsistent with, nor derogatory to free-grace… (10) And lastly, this doctrine has no bad influence upon practice, but is less subject to abuse in this respect than the other… … §9… I shall extract the spirits and quintessence of all in the following description of justification with the Scriptures, that proves every part of it: Justification is an act (Rom. 8:33) of God’s (Rom. 3:24) free-grace, whereby for the sake of Christ (1 Cor. 6:11), that is, for the merit of his obedience (Rom. 5:19), or, upon consideration of Christ’s righteousness (Rom. 5:18), or his blood (Rom. 5:9), that is, his suffering the punishment (Isa. 53:11) due to us for our sins, He at present counts (Rom. 4:3) righteous all true believers (Acts 13:39; Rom. 5:1), who are endued with living (Jm. 2:20), working faith (Gal. 5:6; Jm. 2:24), and deals with ’em as such, by discharging (Gal. 3:13) ’em from the curse of the Law, and eternal condemnation (Rom. 5:9; 8:33-34) (which is pardon in the most proper and famous sense) and bestowing upon ’em those privileges and benefits which belong to righteous persons, viz. reconciliation (Rom. 5:1), and adoption (Tit. 3:7), and then at last will solemnly declare and pronounce (Rom. 5:18) ’em righteous at the Day of Judgment, and bestow upon ’em eternal life (Acts 3:19; Mt. 12:36-37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clark.html">Samuel Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture-Justification, or a Discourse of Justification, according to the Evidence of Scripture-Light (London: S. Bridge, 1698) | 14. ‘Concerning Justification by Works’</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Proposition 2. The faith which Paul speaks of is not the same with that which James speaks of. What kind of faith that is which Paul speaks of appears by the description which he himself gives us of it, Gal. 5. He is there speaking of justification, verse 4, and of the righteousness of faith, verse 5. And then tells us what kind of faith it is, verse 6, a faith working by love, a faith which shows itself to be a living faith by the fruit it brings forth… Faith is never opposed in Scripture to Gospel-works; because it is inclusive of ’em, and they can’t be divided, but always go together. This is faith in Paul’s sense: the tree with it’s fruit hanging on it: a living, working, fruit-bearing faith. But now the faith that James speaks of [in ch. 2], is such a faith as is alone, verse 17, without works, verse 20, and therefore is dead, verse 17. … Proposition 4. They both speak of the same justification. This is undeniably evident, because they both produce the same Scripture for the proof of their distinct positions, or assertions. James proves that Abram was justified by works because by his offering up Isaac, that Scripture was fulfilled which says, ‘Abram believed God, and it was counted to him for righteousness,’ verse 23. And Paul proves that Abram was justified by faith, and not by works, because the Scripture saith, Abram believed God, and it was counted to him for righteousness, Rom. 4:2-3… But the same Scripture proves that Abram was justified both by faith and by works; and therefore faith, and such works as are the fruit of faith are all one in Scripture-account. They are materially the same, though there may be some formal difference between ’em. And therefore, to be justified by faith, according to Paul, and by works according to James, are all one… (2) This justification he [James] speaks of was before God: For he produces that passage of Scripture for the proof of what he asserts, which all acknowledge does refer to a man’s justification before God, viz. that Abraham believed God, and it was counted to him for righteousness, verse 23. … (1) ‘Tis only the Works of the Law, that the apostle Paul opposes and rejects in this point of justification. This has been fully proved already, ch. 9, §2. (2) The Hebrew Word [Hebrew] signifies to be righteous, as well as to justify, as was showed at first setting out. (3) To justify is to account righteous, and treat as such. (4) The Scripture does expresly define being righteous by doing righteousness, and that with a special remark and observable caution prefixed, 1 Jn. 3:7, ‘Little children, let no man deceive you: He that does righteousness is righteous, even as He is righteous.’… (5) Abraham’s obedience, and Phineas’s zeal, were reckoned to them for righteousness, Jm. 2:21, 23; Ps. 106:31, and Abel by his sacrifice obtained witness that he was righteous, Heb. 11:4… (6) Whatsoever is required to pardon is required to justification; for though the formal, precise notion of justification does not consist in pardon, yet pardon is included in it taken largely, as being the inseparable adjunct and undivided companion thereof (as has been showed, ch. 4, §5). But repentance, confession, forgiveness of others, and the like, are required to pardon… (7) The Scripture frequently uses the Word [Faith] in a large Sense, so as to comprehend Obedience too, as was show’d, ch. 11. §. 2. (8) We are expresly said, to be justified by Works. To all which I add by way of Antidote. §5. (9) The admitting of gospel-works or holiness to have an interest in justification, and to be an ingredient thereof, is not inconsistent with, nor derogatory to free-grace… (10) And lastly, this doctrine has no bad influence upon practice, but is less subject to abuse in this respect than the other… … §9… I shall extract the spirits and quintessence of all in the following description of justification with the Scriptures, that proves every part of it: Justification is an act (Rom. 8:33) of God’s (Rom. 3:24) free-grace, whereby for the sake of Christ (1 Cor. 6:11), that is, for the merit of his obedience (Rom. 5:19), or, upon consideration of Christ’s righteousness (Rom. 5:18), or his blood (Rom. 5:9), that is, his suffering the punishment (Isa. 53:11) due to us for our sins, He at present counts (Rom. 4:3) righteous all true believers (Acts 13:39; Rom. 5:1), who are endued with living (Jm. 2:20), working faith (Gal. 5:6; Jm. 2:24), and deals with ’em as such, by discharging (Gal. 3:13) ’em from the curse of the Law, and eternal condemnation (Rom. 5:9; 8:33-34) (which is pardon in the most proper and famous sense) and bestowing upon ’em those privileges and benefits which belong to righteous persons, viz. reconciliation (Rom. 5:1), and adoption (Tit. 3:7), and then at last will solemnly declare and pronounce (Rom. 5:18) ’em righteous at the Day of Judgment, and bestow upon ’em eternal life (Acts 3:19; Mt. 12:36-37).”

— Samuel Clark, Scripture-Justification, or a Discourse of Justification, according to the Evidence of Scripture-Light (London: S. Bridge, 1698) | 14. ‘Concerning Justification by Works’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CProposition+2.+The+faith+which+Paul+speaks+of+is+not+the+same+with+that+which+James+speaks+of.+What+kind+of+faith+that+is+which+Paul+speaks+of+appears+by+the+description+which+he+himself+gives+us+of+it%2C+Gal.+5.+He+is+there+speaking+of+justification%2C+verse+4%2C+and+of+the+righteousness+of+faith%2C+verse+5.+And+then+tells+us+what+kind+of+faith+it+is%2C+verse+6%2C+a+faith+working+by+love%2C+a+faith+which+shows+itself+to+be+a+living+faith+by+the+fruit+it+brings+forth%E2%80%A6+Faith+is+never+opposed+in+Scripture+to+Gospel-works%3B+because+it+is+inclusive+of+%E2%80%99em%2C+and+they+can%E2%80%99t+be+divided%2C+but+always+go+together.+This+is+faith+in+Paul%E2%80%99s+sense%3A+the+tree+with+it%E2%80%99s+fruit+hanging+on+it%3A+a+living%2C+working%2C+fruit-bearing+faith.+But+now+the+faith+that+James+speaks+of+%5Bin+ch.+2%5D%2C+is+such+a+faith+as+is+alone%2C+verse+17%2C+without+works%2C+verse+20%2C+and+therefore+is+dead%2C+verse+17.+%E2%80%A6+Proposition+4.+They+both+speak+of+the+same+justification.+This+is+undeniably+evident%2C+because+they+both+produce+the+same+Scripture+for+the+proof+of+their+distinct+positions%2C+or+assertions.+James+proves+that+Abram+was+justified+by+works+because+by+his+offering+up+Isaac%2C+that+Scripture+was+fulfilled+which+says%2C+%E2%80%98Abram+believed+God%2C+and+it+was+counted+to+him+for+righteousness%2C%E2%80%99+verse+23.+And+Paul+proves+that+Abram+was+justified+by+faith%2C+and+not+by+works%2C+because+the+Scripture+saith%2C+Abram+believed+God%2C+and+it+was+counted+to+him+for+righteousness%2C+Rom.+4%3A2-3%E2%80%A6+But+the+same+Scripture+proves+that+Abram+was+justified+both+by+faith+and+by+works%3B+and+therefore+faith%2C+and+such+works+as+are+the+fruit+of+faith+are+all+one+in+Scripture-account.+They+are+materially+the+same%2C+though+there+may+be+some+formal+difference+between+%E2%80%99em.+And+therefore%2C+to+be+justified+by+faith%2C+according+to+Paul%2C+and+by+works+according+to+James%2C+are+all+one%E2%80%A6+%282%29+This+justification+he+%5BJames%5D+speaks+of+was+before+God%3A+For+he+produces+that+passage+of+Scripture+for+the+proof+of+what+he+asserts%2C+which+all+acknowledge+does+refer+to+a+man%E2%80%99s+justification+before+God%2C+viz.+that+Abraham+believed+God%2C+and+it+was+counted+to+him+for+righteousness%2C+verse+23.+%E2%80%A6+%281%29+%E2%80%98Tis+only+the+Works+of+the+Law%2C+that+the+apostle+Paul+opposes+and+rejects+in+this+point+of+justification.+This+has+been+fully+proved+already%2C+ch.+9%2C+%C2%A72.+%282%29+The+Hebrew+Word+%5BHebrew%5D+signifies+to+be+righteous%2C+as+well+as+to+justify%2C+as+was+showed+at+first+setting+out.+%283%29+To+justify+is+to+account+righteous%2C+and+treat+as+such.+%284%29+The+Scripture+does+expresly+define+being+righteous+by+doing+righteousness%2C+and+that+with+a+special+remark+and+observable+caution+prefixed%2C+1+Jn.+3%3A7%2C+%E2%80%98Little+children%2C+let+no+man+deceive+you%3A+He+that+does+righteousness+is+righteous%2C+even+as+He+is+righteous.%E2%80%99%E2%80%A6+%285%29+Abraham%E2%80%99s+obedience%2C+and+Phineas%E2%80%99s+zeal%2C+were+reckoned+to+them+for+righteousness%2C+Jm.+2%3A21%2C+23%3B+Ps.+106%3A31%2C+and+Abel+by+his+sacrifice+obtained+witness+that+he+was+righteous%2C+Heb.+11%3A4%E2%80%A6+%286%29+Whatsoever+is+required+to+pardon+is+required+to+justification%3B+for+though+the+formal%2C+precise+notion+of+justification+does+not+consist+in+pardon%2C+yet+pardon+is+included+in+it+taken+largely%2C+as+being+the+inseparable+adjunct+and+undivided+companion+thereof+%28as+has+been+showed%2C+ch.+4%2C+%C2%A75%29.+But+repentance%2C+confession%2C+forgiveness+of+others%2C+and+the+like%2C+are+required+to+pardon%E2%80%A6+%287%29+The+Scripture+frequently+uses+the+Word+%5BFaith%5D+in+a+large+Sense%2C+so+as+to+comprehend+Obedience+too%2C+as+was+show%E2%80%99d%2C+ch.+11.+%C2%A7.+2.+%288%29+We+are+expresly+said%2C+to+be+justified+by+Works.+To+all+which+I+add+by+way+of+Antidote.+%C2%A75.+%289%29+The+admitting+of+gospel-works+or+holiness+to+have+an+interest+in+justification%2C+and+to+be+an+ingredient+thereof%2C+is+not+inconsistent+with%2C+nor+derogatory+to+free-grace%E2%80%A6+%2810%29+And+lastly%2C+this+doctrine+has+no+bad+influence+upon+practice%2C+but+is+less+subject+to+abuse+in+this+respect+than+the+other%E2%80%A6+%E2%80%A6+%C2%A79%E2%80%A6+I+shall+extract+the+spirits+and+quintessence+of+all+in+the+following+description+of+justification+with+the+Scriptures%2C+that+proves+every+part+of+it%3A+Justification+is+an+act+%28Rom.+8%3A33%29+of+God%E2%80%99s+%28Rom.+3%3A24%29+free-grace%2C+whereby+for+the+sake+of+Christ+%281+Cor.+6%3A11%29%2C+that+is%2C+for+the+merit+of+his+obedience+%28Rom.+5%3A19%29%2C+or%2C+upon+consideration+of+Christ%E2%80%99s+righteousness+%28Rom.+5%3A18%29%2C+or+his+blood+%28Rom.+5%3A9%29%2C+that+is%2C+his+suffering+the+punishment+%28Isa.+53%3A11%29+due+to+us+for+our+sins%2C+He+at+present+counts+%28Rom.+4%3A3%29+righteous+all+true+believers+%28Acts+13%3A39%3B+Rom.+5%3A1%29%2C+who+are+endued+with+living+%28Jm.+2%3A20%29%2C+working+faith+%28Gal.+5%3A6%3B+Jm.+2%3A24%29%2C+and+deals+with+%E2%80%99em+as+such%2C+by+discharging+%28Gal.+3%3A13%29+%E2%80%99em+from+the+curse+of+the+Law%2C+and+eternal+condemnation+%28Rom.+5%3A9%3B+8%3A33-34%29+%28which+is+pardon+in+the+most+proper+and+famous+sense%29+and+bestowing+upon+%E2%80%99em+those+privileges+and+benefits+which+belong+to+righteous+persons%2C+viz.+reconciliation+%28Rom.+5%3A1%29%2C+and+adoption+%28Tit.+3%3A7%29%2C+and+then+at+last+will+solemnly+declare+and+pronounce+%28Rom.+5%3A18%29+%E2%80%99em+righteous+at+the+Day+of+Judgment%2C+and+bestow+upon+%E2%80%99em+eternal+life+%28Acts+3%3A19%3B+Mt.+12%3A36-37%29.%E2%80%9D%0A%0A%E2%80%94+Samuel+Clark%2C+Scripture-Justification%2C+or+a+Discourse+of+Justification%2C+according+to+the+Evidence+of+Scripture-Light+%28London%3A+S.+Bridge%2C+1698%29+%7C+14.+%E2%80%98Concerning+Justification+by+Works%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58b74ea70b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58b74ea70b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Proposition%202.%20The%20faith%20which%20Paul,eternal%20life%20%28Acts%203%3A19%3B%20Mt.%2012%3A36%2D37&amp;text=Proposition%202.%20The%20faith%20which%20Paul%20speaks%20of&amp;text=upon%20%E2%80%99em%20eternal%20life%20%28Acts%203%3A19%3B%20Mt.%2012%3A36%2D37" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

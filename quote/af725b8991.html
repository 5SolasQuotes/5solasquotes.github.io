<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession, the former, known specifically as the Reformed, have always tried to reconcile with those of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups. II. Although these latter ones [the Lutherans] have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues. III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book “Northern Olive Branch,” and George Calixtus, professor of theology at the University of Helmstedt, in his book “Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’ in Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683)</cite>, pp. 950-57 Latin</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7677c611c5" data-kw="">
<blockquote><p>Even now, however, the proper apple of discord was only the doctrine of the Supper. The party of Flacius was of one mind on the question of predestination with those who subsequently were denominated the ‘Reformed’; and the Flacians employed predestination as a weapon to fight against the Melanchthonians, who long maintained themselves in the electorate of Saxony [which was dominated by the strict Lutherans]. Nor till a later time, during the strife about Crypto-Calvinism, did this electorate succeed in detaching itself from the moderate party in the empire. In a word, about the time of the origin of the Formula of Concord between 1570-1580, there were only two different parties; the one consisting of people who would let themselves be reasoned with on the doctrine of the Supper; and the other of such as would hear no reason on the subject. Those who were weary of the vexatious strifes, as Hesse, Anhalt and other States of the empire, joined the party led by the inhabitants of the [reformed] Palatinate, and, finally, did not accept the Formula of Concord [1570/1580]. The others shut themselves off, and formed a body that took for its shibboleth the unaltered Confession of Augsburg. It was after the Formula of Concord that the evangelicals [in Germany] clearly separated into two churches; that is, one part went its own ways and abandoned the other, which then, by rejecting the Formula of Concord but retaining the Confession of Augsburg, was gradually consolidated in the empire into churches which for the first time testified by a great historical act at Dort that they belonged to the Reformed Church, that meanwhile had arisen outside of Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed in the Sixteenth Century” in Presbyterian &amp; Reformed Review, vol. 5, no. 19 (July, 1894), pp. 415-33</cite>, p. 423</span></figcaption>

</figure><figure class="quote" id="q-4fbf76523b" data-kw="">
<blockquote><p>XIII. What chiefly prevents the Reformed from uniting with the Roman Church, while they are ready to reconcile with those who follow the Augsburg Confession, is that in the public and external worship of those singularly devoted to the Augsburg Confession, there is nothing that could gravely scandalize the Reformed and prevent them from attending in good conscience. Conversely, there is nothing in the Reformed worship that could reasonably offend the conscience of other Protestants or be a stumbling block to them. In neither case is anything publicly adored that is not believed and professed by both to be God. But the public and external worship of the Roman Church primarily consists of practices that the Reformed cannot, in good conscience, either perform or approve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’</cite>, p. 952 Latin</span></figcaption>

"_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb27eb3ed6" data-kw="">
<blockquote><p>Till far on in the second half of the century of the Reformation there were, properly speaking, only Evangelicals or Protestants; and the names Lutherans, Zwinglians, Calvinists were by all authorities of that time entirely repudiated. (Zanchius in a letter complains of people applying to themselves such names.)… in Frankfort [Germany] those who held the views of the Swiss, by the advice of Dathen, let their children be baptized by the city clergy who held Lutheran opinions; and when Calvin in September, 1556, was called as arbitrator to Frankfort, the wine of honor was poured out to him. Moreover, the states of the empire that were inclined to the Swiss doctrine were not excluded, in the year 1555, in the compact entitled ‘the Religious Peace;’ and there was then in Germany only one Protestant Church which in that Peace received on the basis of the Augsburg Confession toleration, or rather equal authorization… The doctrine of predestination was nto then matter of dispute. (…Calvin writes in 1560 to Zerkint of Bern, that up to this year no one had taken exception to the doctrine of predestination (v. Op. Omnia, Strassburg edition, Vol. xvii, 238)…</p></blockquote>

<blockquote><p>XI… Nor do we notice here the more rigid judgments of some of those who take their name from the great Luther, who, carried away by sinister prejudices, are accustomed to attack us. For however harshly they may have treated us, we do not cease to honor them with brotherly affection. And if, their prejudices and private affections being laid aside, they would seriously examine the thing itself by the law of love, truth and Christian prudence, they would not be so much averse to a pious syncretism and reconciliation with us, or at least a mutual toleration, to which not a few of the more moderate among them are not indisposed.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c60ca635c8" data-kw="">
<blockquote><p>Q. 37: What is required touching singing of psalms in the church? That they be such as are parts of the Word of God, formed by the Holy Ghost into psalms or songs, which many may conveniently sing together, exhorting and admonishing themselves mutually with grace in their hearts (Matt. 26:30; Eph. 5:19; Col. 3:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, A Catechism of the Rev. John Robinson; Leiden. Being an Appendix to the Foundation of Christian Religion, Gathered into Six Principles, by Rev. William Perkins, p. 434. Robinson (c.1576-1625) was a Pilgrim and separatist minister, leader of the Congregationalist settlers who journeyed to Plymouth Colony, New England.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Q. 37: What is required touching singing of psalms in the church? That they be such as are parts of the Word of God, formed by the Holy Ghost into psalms or songs, which many may conveniently sing together, exhorting and admonishing themselves mutually with grace in their hearts (Matt. 26:30; Eph. 5:19; Col. 3:16).”

— John Robinson, Works, vol. 3, A Catechism of the Rev. John Robinson; Leiden. Being an Appendix to the Foundation of Christian Religion, Gathered into Six Principles, by Rev. William Perkins, p. 434. Robinson (c.1576-1625) was a Pilgrim and separatist minister, leader of the Congregationalist settlers who journeyed to Plymouth Colony, New England.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ.+37%3A+What+is+required+touching+singing+of+psalms+in+the+church%3F+That+they+be+such+as+are+parts+of+the+Word+of+God%2C+formed+by+the+Holy+Ghost+into+psalms+or+songs%2C+which+many+may+conveniently+sing+together%2C+exhorting+and+admonishing+themselves+mutually+with+grace+in+their+hearts+%28Matt.+26%3A30%3B+Eph.+5%3A19%3B+Col.+3%3A16%29.%E2%80%9D%0A%0A%E2%80%94+John+Robinson%2C+Works%2C+vol.+3%2C+A+Catechism+of+the+Rev.+John+Robinson%3B+Leiden.+Being+an+Appendix+to+the+Foundation+of+Christian+Religion%2C+Gathered+into+Six+Principles%2C+by+Rev.+William+Perkins%2C+p.+434.+Robinson+%28c.1576-1625%29+was+a+Pilgrim+and+separatist+minister%2C+leader+of+the+Congregationalist+settlers+who+journeyed+to+Plymouth+Colony%2C+New+England.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc60ca635c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c60ca635c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Q.%2037%3A%20What%20is%20required%20touching,Matt.%2026%3A30%3B%20Eph.%205%3A19%3B%20Col.%203%3A16&amp;text=Q.%2037%3A%20What%20is%20required%20touching%20singing%20of&amp;text=their%20hearts%20%28Matt.%2026%3A30%3B%20Eph.%205%3A19%3B%20Col.%203%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f75f98945" data-kw="">
<blockquote><p>He would have us cheerful, he commandeth us to rejoice evermore; and, is any merry, ‘let him sing’ (James 5:13), but one of the songs of ‘Sion’ [Ps. 137:3]: only let no corrupt communication proceed out of your mouths; but that which is good to the use of edifying, that it may minister grace to the hearers. Sing Psalms, Hymns, &amp; spiritual Songs, singing with a grace in your hearts to the Lord (Col. 3:16). To such songs the spirit of grace commeth flying: the bees come to aromatical and sweet things, the swine will to the mire: to obscene and meritricious songs and discourses, the devil’s swarm, let them only use and love them, who love their company.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover</cite>, (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ., p. 38-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“He would have us cheerful, he commandeth us to rejoice evermore; and, is any merry, ‘let him sing’ (James 5:13), but one of the songs of ‘Sion’ [Ps. 137:3]: only let no corrupt communication proceed out of your mouths; but that which is good to the use of edifying, that it may minister grace to the hearers. Sing Psalms, Hymns, &amp; spiritual Songs, singing with a grace in your hearts to the Lord (Col. 3:16). To such songs the spirit of grace commeth flying: the bees come to aromatical and sweet things, the swine will to the mire: to obscene and meritricious songs and discourses, the devil’s swarm, let them only use and love them, who love their company.”

</figure><figure class="quote" id="q-aafb2b9365" data-kw="">
<blockquote><p>Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Delivered in the Cathedral Church of Canterbury, concerning church-music</cite>, (London, 1663), p. 15. This sermon was given shortly after the Restoration and Great Ejection of 1662, in order to defend in Reading’s church, the cathedral church in Canterbury, that instruments were lawful in public worship, contra the dissenting puritans. Cathedral churches usually had more ornate music than parish churches.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…”

20most%20bitter%2Dspirited%20antagonist%20ingenuously%20say%2C%20%E2%80%98Is&amp;text=for%20the%20abuse%20of%20music%2C%20we%20abominate%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-70334928a3" data-kw="">
<blockquote><p>‘Dost thou wish’, he [the apostle] says, ‘to be cheerful, dost thou wish to employ the day? I give thee spiritual drink;’ for drunkenness even cuts off the articulate sound of our tongue; it makes us lisp and stammer, and distorts the eyes, and the whole frame together. Learn to sing psalms, and thou shalt see the delightfulness of the employment. For they who sing psalms are filled with the Holy Spirit, as they who sing satanic songs are filled with an unclean spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Epistle to the Ephesians in A Library of Fathers of the Holy Catholic Church</cite>, … Trans. members of the English Church (Oxford, 1845), Sermon 19, vv. 18-21, p. 302</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

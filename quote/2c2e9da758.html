<main class="wrap"><figure class="quote" id="q-2c2e9da758" data-kw="election separation">
<blockquote><p>Election is the separation of some from others: “Many are called,” said Christ, “but few chosen” (Mt. 20:16); and Paul, “The election hath obtained it, and the rest were blinded” (Rom. 11:7). Hence Paul uses the verb heileto to designate election, which implies the separation of some from others: “God from the beginning hath taken out and separated you to salvation through sanctification of the Spirit and belief of the truth” (2 Thess. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/election-and-the-gospel-offer.html">Election and the Gospel Offer</a> › <a href="../topics/election/election-and-the-gospel-offer/universal-call-and-particular-election.html">Universal call and particular election</a></span><span class="t"><a href="../topics/reprobation/preterition.html">Preterition</a> › <a href="../topics/reprobation/preterition/passing-over-the-non-elect.html">Passing over the non-elect</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7866d59a5" data-kw="believe and be saved offer">
<blockquote><p>In the same sense, I properly infer that all sinners would be saved if they would believe—not from any conditional decree, but from this most certain general truth which God has sanctioned by his absolute decree (viz., that faith is the infallible means of salvation). For as he has appointed faith as the only way of bringing men to salvation, hence arises the truth of this hypothetical proposition—if a sinner believes he will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.11</span></figcaption>

</figure><figure class="quote" id="q-643aef881b" data-kw="preceptive will gospel offer">
<blockquote><p>Conditional promises and threatenings do not favor conditional decrees because they do not pertain to the decreeing will, but to the preceptive will and are appendages to the divine commands, added to stimulate and excite men. … Hence such promises and threats show only the necessary connection of the condition with the thing conditioned, but involve no futurition of the thing.</p></blockquote>

</figure><figure class="quote" id="q-8f658aea28" data-kw="decreed faith with salvation">

<main class="wrap"><figure class="quote" id="q-ba378cd46f" data-kw="">
<blockquote><p>4. Concerning the tenth Proposition (which will be most questioned), I desire it may be observed: 1. That we meddle not with the term ‘excommunication.’ 2. And therefore they that say we meddle with the thing, must define excommunication, and show that the work that we here agree on does reach that definition. 3. Which if they do, then they will make excommunication to be no more than this application of Christ’s doctrine to a particular person and case, which every minister of the Gospel may perform: For we mention in our Agreement no more. 4. I am sure that delivering up to Satan, and the great anathematizing excommunication is commonly taken to go much further and contain more than we here conclude on. 5. Yet observe that we here suppose the fact and faultiness proved beyond doubt: and when we speak of ministers applicatory requiring the avoidance of such persons, if any think we wrongfully authorize him to do this without the presbytery, congregation, or bishop; remember that we speak not here of examining witnesses, much less giving them their oaths, or the like preparation for discovery of the guilt. How far people or any others may have a hand in this we do not determine. 6. Nor do we determine whether it must needs be more ministers than one that must agree in this before the public application: yet afterward we have limited ourselves in this for unity, peace and avoiding of rash applications.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) | An Explication of Some Passages in the Propositions</cite>, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-cf4cfa96e2" data-kw="">
<blockquote><p>For, though we do not take upon us a presbyterial or synodical Church power to inflict juridical Church censures upon them that deserve them, yet we think this in our capacity and discretive judgment is incumbent upon us; to wit, according as we know they would manifestly incur the sentence of excommunication, deposition, deprivation, suspension, or rebuke, according to the degrees of their offence after rejected admonitions; We may by our discountenance testify our dislike of their ways, not inflicting this as a censure, but signifying, hereby our sense of the moral obligation and equity of these censures when legally inflicted. For though none have the power of the keys but Church Officers; yet people have a discretive power over their own practice, anticipating that power when it cannot be in Christ’s method exerted.</p></blockquote>

</figure><figure class="quote" id="q-a1d616dcca" data-kw="">
<blockquote><p>Lawyer: But you did not answer [the verse], ‘from such turn away, and with such not to eat, etc.’ Minister: The answer is obvious: 1. It is the duty of the Church to cast out wicked impenitent men; and this Christ commands them; but He never bids particular Christians to separate from the Church where some such are because the Church omits its duty: For then you should separate from duty, from God’s worship and holy communion on pretence of separating from sinners. 2. But for family and private converse, every Christian is judge himself, and must refuse all familiarity with scandalous Christians which encourages them in sin or seems to own it. God commands no man to do that which is not in his power; to put a scandalous impenitent man from the Church, is in the Church’s power, and so that command belongs to them; it is not in your power, and therefore belongs not to you save to admonish men and tell the Church; but to put men from your table and familiarity is in your power and belongs to you. Suppose the king write to the city of London to put all rebels out of their company and converse; it’s easy to understand that every one must do it only in his own place. Every single man cannot turn such out of the common-council: The city rulers must do that, and till it be done, single men may not deny obedience to the governours: But all may turn them out of their houses, shops and familiarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’</cite>, pp. 231-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

<main class="wrap"><figure class="quote" id="q-25ccb04829" data-kw="">
<blockquote><p>In November 2023, Defendant Santa Ana City Council adopted a resolution denying the application of Plaintiff Anchor Stone Christian Church for permission to use its property, located at 2398 Daimler Street, Santa Ana, California (the “Property”), for religious assembly. Following the denial of its application, Anchor Stone commenced this action against Defendants City of Santa Ana and its City Council (jointly, the “City”). Presently before the Court is Anchor Stone’s motion for a preliminary injunction. In support of its Motion, Anchor Stone argues that (1) the City’s zoning rules violate the Equal Terms Provision of the Religious Land Use and Institutionalized Persons Act (“RLUIPA”), 42 U.S.C. §§ 2000cc et seq.; (2) the City’s denial of Anchor Stone’s conditional use permit application violated the Substantial Burden Provision of RLUIPA; and (3) the City’s denial of Anchor Stone’s conditional use permit application violated the Free Exercise Clause of the First Amendment. After reviewing the papers filed in support and in opposition,2 and after carefully considering the argument of counsel at the hearing on the Motion, the Court concludes that Anchor Stone has established that it is likely to succeed on the merits of its claims and that it has satisfied the other requirements for preliminary injunctive relief. Accordingly, Anchor Stone’s instant Motion is GRANTED. The City is preliminarily ENJOINED and RESTRAINED from preventing Anchor Stone from holding services on the Property and from preventing Anchor Stone from undertaking its planned renovations of the Property.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anchor-stone-christian-church-v-city-of-santa-ana-and-santa-ana-city-council.html">Anchor Stone Christian Church v City of Santa Ana and Santa Ana City Council</a></span><span class="wk"><span class="lbl">Work:</span> <cite>April 7</cite>, 2025</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bb81ef7f7" data-kw="">
<blockquote><p>To these appertains the doing and execution of civil and temporal affairs, so as their subiects may live in peace. By reason whereof the taxes and subsidies are due unto them and to them appertain to use the sword which God has given them, for the preservation as well of the countries which be committed to them, as also for the defence and maintenance of good laws, and punishment of the evil and wicked doers. Secondly, the duty and office of the magistrates is not to regard simply the peace and concord of subiects, but principally for this end, that the peace and concord may tend to the honor and glory of God, that all men may live not only in a certain civil honesty, but also with piety and true worship of God, as witnesses saint Paul. For this cause especially it appertains to the magistrate that the laws which he uses and executes may be conformable to the will of God: and principally to give order that the religion be perfect and holy, and that all the Church be ordered according to the Word of God, forbidding and punishing, as the case requires, all those which trouble the Church or concerning the discipline thereof [Beza’s larger context makes clear he is speaking in the context of a Christian nation].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief &amp; Pithy Sum of the Christian Faith</cite>, (London, 1562), 42. ‘Of the Civil &amp; Christian Magistrate &amp; to what End his Office Tends’, pp. 124-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

ernment/#:~:text=To%20these%20appertains%20the%20doing%20and,the%20context%20of%20a%20Christian%20nation&amp;text=To%20these%20appertains%20the%20doing%20and%20execution%20of&amp;text=speaking%20in%20the%20context%20of%20a%20Christian%20nation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74b996f70a" data-kw="">
<blockquote><p>Since we have need of civil laws and the power of punishing, it will be wisest not to contemn those given by Moses; but seriously rather to consider what the meaning of God was in them, what he chiefly required, and how much it might be to the good of every nation, if they would borrow thence their manner of governing the commonwealth; yet freely all things and with the Spirit of Christ. For what Solon or Plato, or Aristotle, what lawyers or Caesars could make better laws than God? And it is no light argument, that many magistrates at this day do not enough acknowledge the Kingdom of Christ, though they would seem most Christian, in that they govern their States by laws so diverse from those of Moses.</p></blockquote>

</figure><figure class="quote" id="q-f817ee7328" data-kw="">
<blockquote><p>But here appeareth a manifest reason why they gave particular commandment concerning things offered to idols, blood, and that which was strangled. They were, indeed, of themselves things indifferent; yet such as had some special thing in them more than other rites of the law. We know how straitly the Lord commandeth to eschew those things which are contrary to the external profession of faith, and wherein there is any appearance or suspicion of idolatry. Therefore, lest there should any blot of superstition remain in the Gentiles, and lest the Jews should see anything in them which did not agree with the pure worship of God, no marvel if, to avoid offense, they be commanded to abstain from things offered to idols.</p></blockquote>

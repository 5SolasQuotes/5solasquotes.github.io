<blockquote><p>And in all deceivableness of unrighteousness, among them that perish, because they received not the love of the truth, that they might be saved (2 Thessalonians 2:10 Geneva Bible)

It is not enough to receive the truth in the light of it, but we must also receive it in the love of it, or it will do us no good. To make the truth operative:—(1.) Knowledge is necessary, and also faith, and then love. Knowledge, for ‘without knowledge the heart is not good,’ Prov. xix. 2. Nothing can come to the heart but by the mind; the will is ὄρεξις μετὰ λόγον—a choice or desire, guided by reason, and the gospel doth not work as a charm, whether it be or be not understood. No; the purport or drift of it must be known, or how can it have any effect upon us?

Next to knowledge, to make it work, there must be faith. When we apprehend a thing, we must judge of it, whether it be true or false; how else can it make any challenge, or lay claim to our respect? 1 Thes. ii. 13, ‘Ye received it not as the word of men, but (as it is in truth) the word of God, which worketh effectually in you, as it doth in all them that believe.’ Faith doth enliven our actions about religion; to hear of God, and Christ, and heaven, doth not stir us unless we believe these things.

Well, next to faith there must be love, for apprehension and dijudication [sic] are acts of the understanding only, but love belongeth to the will, and we must believe with all the heart, Acts viii. 37. There may be knowledge without faith, as an heathen may understand the Christian religion, though he believe it not, profess it not. And there may be faith without love, for there is a ‘dead faith,’ James ii. 20, which rests in cold opinions, without any affection to the truth believed.

Love pierceth deeper into the truth, and maketh it pierce deeper into us. As a red-hot iron, though never so blunt, will run farther into an inch board than a cold tool, though never so sharp. And love maketh it more operative; there is notitia per visum, et notitia per gustum — a knowledge by sight, and a knowledge by taste. A man may guess at the goodness of wine by the colour, but more by the taste; that is a more refreshing apprehension; and Augustine prayeth, Fac me, Domine, gustare per amorem quod gusto per cognitionem — Lord, make me taste that by love which I taste by knowledge.

Surely we are never sound in Christianity till all the light that we receive be turned into love. These great things are revealed and represented to our faith, not to please our minds by knowing them, but to quicken our love. Faith alone is but as sight, and faith with love is as taste. Now, it is more easy to dispute a man out of his belief that only seeth, than it is him that tasteth, and knoweth the grace of God in truth.

This is the true reason of the steadfastness of weak and unlearned Christians; though they have not such distinct conceptions and reasonings as many learned men have, yet their faith is turned into love, and a man is better held by the heart than by the head. And though they cannot dispute for Christ (as one of the martyrs said), they can die for Christ. But alas! many receive the truth in the light thereof, but few receive it in the love of it, and so lie open to deceit.</p></blockquote>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks:

1. It is more for controversies and speculations than for practical holiness.

2. It is selfish and kindled by an overvaluing their own conceits or ways.

3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church.

4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like.

5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f64231e22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-zeal/#:~:text=5.%20A%20peaceable%20spirit%20must%20have,grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace&amp;text=5.%20A%20peaceable%20spirit%20must%20have%20a%20high&amp;text=is%20a%20grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Whiggism is not circumscribed and confined to any one or two of the Religions now professed in the World, but diffuses it self among all. We have known Jews, Turks, nay, some Papists, (which I own to be a great Rarity) very great Lovers of the Constitution and Liberty; and were there rational Grounds to expect, that any Numbers of them could be so, I should be against using Severities and Distinctions upon Account of Religion.

For a Papist is not dangerous, nor ought to be ill used by any body, because he prays to Saints, believes Purgatory, or the real Presence in the Eucharist, and pays Divine Worship to an Image or Picture (which are the common Topics of our Writers of Controversy against the Papists;) but because Popery sets up a foreign Jurisdiction paramount to our Laws.

So that a real Papist can neither be a true Governor of a Protestant Country, nor a true Subject, and besides, is the most Priest-Ridden Creature in the World: and (when uppermost) can bear with no body that differs from him in Opinion; little considering, that whosoever is against Liberty of Mind, is, in effect, against Liberty of Body too.</p></blockquote>

<blockquote><p>Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.</p></blockquote>

<blockquote><p>The first consideration which I shall offer, as a reason why you should not be found in the way of evil instruction, is, that that there is great danger that you will embrace the errors with which you thus become acquainted. This danger results partly from the fact that men naturally love darkness rather than light. Of this fact the history of the world furnishes abundant proof; else how will you account for it, not only that men in all ages have misinterpreted the voice of God speaking to them in his works and ways, and that they have worshipped everything as God but Jehovah himself, but also that so many have shut their eyes against the broad light of revelation, and have either denied its divine authority, or else perverted it to sanction the most gross and fatal errors.

Taking for granted then this fact, it amounts to nothing less than a predisposition in the human heart to the reception of error. Suppose your bodily system was exactly predisposed to some contagious disease, would not that fact greatly increase your clanger, on being brought into contact with the elements of infection? Or suppose an individual had a strong thirst for intoxicating liquors, would not this invest with additional danger all opportunities for indulging in the use of them? Is it not equally manifest that that natural aversion to the reception of God’s truth, of which I have spoken, must be peculiarly favourable to the influence of evil instruction?

But this danger farther arises from the love of novelty, and the pride of opinion. There is something exceedingly grateful to many youthful minds, in the reflection that they have turned off from the beaten track; —that they have escaped from vulgar prejudices, and broken away from the trammels of education, and that they are giving the world a fine example of independent thought. But this spirit finds but little aliment in the way of truth; for that is a highway, and the simple and unlettered walk in it; and the way to be distinguished from the vulgar herd, is to leave this plain path, and broach some wild or wicked speculation. More or less of this spirit no doubt belongs to human nature; and though you may not hitherto have been sensible of its operation, yet if you venture into the way of evil instruction, there is great danger that you will find, not only that this spirit exists, but that it exerts a powerful influence in opening your mind to the reception of error.

Moreover, you are in danger of embracing the errors which you accustom yourselves to hear defended, from the fact that familiarity with error, as with vice, has a tendency to make you insensible of its deformity. This tendency results partly from the power of habit, and partly from the deceitful nature of sin; and it exists universally, though it must be acknowledged that it is often counteracted by the influence of circumstances. The process by which it discovers itself, needs only to be described, to be recognised by everyone as a reality. The youth who has been educated to reverence the Bible as God’s word, when he first hears it assailed by infidel cavils and scoffs, shudders at the impiety, and perhaps wonders that God suffers such a wretch to live.

He hears the same thing the second time, but with less horror than before. He hears it again and again, and at length ceases to be affected by the impiety. At no distant period, he gathers bravery enough to smile at what once made him tremble; to assent to that, which once drew from him expressions of abhorrence. At a more remote point in the process, he cordially takes the infidel by the hand, and greets him as a brother; thus, perhaps, in a little period, having travelled the whole distance from a firm belief to a total rejection of the Bible. Say, my young friends, whether all this is not perfectly natural, and easily accounted for on the principle that familiarity with error blinds the mind to its inherent odiousness. Venture not then in the way of evil instruction, lest, through the operation of the same principle, you should be the subjects of the same disastrous change.

Another consideration which renders it probable that you will embrace the errors which you hear defended, is, that, from your age and inexperience, you cannot be supposed to he properly furnished for an encounter with error. The man who, when properly armed, might stand his ground against a company of ruffians, would, if stripped of his armour, fall into their hands at the first onset. In like manner, the man who has been long accustomed to study his Bible, might find little difficulty, and be in little danger, in meeting the cavils of the enemies of truth; while he who is comparatively unacquainted with the word of God, might be easily entangled and drawn away by their sophistry.

Taking it for granted then that you have not that deep and thorough knowledge of the Bible which might more naturally be looked for in advanced life, you cannot but perceive that you are in great danger, from this circumstance, of receiving the errors which are defended in your hearing. Cavils which might be satisfactorily answered in many ways, and the fallacy of which a more thorough knowledge of the word of God might enable you instantly to detect, assume, from your ignorance, the weight of arguments; and there is danger that you will soon come to conclude that what you cannot answer, is unanswerable.

But the consideration which crowns the evidence of your danger on this subject, is, that multitudes of youth, from hearing evil instruction, actually have embraced the errors with which they have thus been made familiar. Yes, I could point you to many a young person, who thought himself safe when he ventured on this forbidden ground, and felt confident that his belief of the truth was never to be shaken, who can now speak boldly in defence of the most dangerous errors, and even pour contempt on the revelation of God. Tell me, my young friends, what there is in your circumstances which promises that the same experiment will result more favourably in respect to you. Rely on it, that ground which your curiosity may tempt you to explore, is beset with snares; if you venture among them, take heed lest they prove to you the snares of death.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The first consideration which I shall offer, as a reason why you should not be found in the way of evil instruction, is, that that there is great danger that you will embrace the errors with which you thus become acquainted. This danger results partly from the fact that men naturally love darkness rather than light. Of this fact the history of the world furnishes abundant proof; else how will you account for it, not only that men in all ages have misinterpreted the voice of God speaking to them in his works and ways, and that they have worshipped everything as God but Jehovah himself, but also that so many have shut their eyes against the broad light of revelation, and have either denied its divine authority, or else perverted it to sanction the most gross and fatal errors.

Taking for granted then this fact, it amounts to nothing less than a predisposition in the human heart to the reception of error. Suppose your bodily system was exactly predisposed to some contagious disease, would not that fact greatly increase your clanger, on being brought into contact with the elements of infection? Or suppose an individual had a strong thirst for intoxicating liquors, would not this invest with additional danger all opportunities for indulging in the use of them? Is it not equally manifest that that natural aversion to the reception of God’s truth, of which I have spoken, must be peculiarly favourable to the influence of evil instruction?

But this danger farther arises from the love of novelty, and the pride of opinion. There is something exceedingly grateful to many youthful minds, in the reflection that they have turned off from the beaten track; —that they have escaped from vulgar prejudices, and broken away from the trammels of education, and that they are giving the world a fine example of independent thought. But this spirit finds but little aliment in the way of truth; for that is a highway, and the simple and unlettered walk in it; and the way to be distinguished from the vulgar herd, is to leave this plain path, and broach some wild or wicked speculation. More or less of this spirit no doubt belongs to human nature; and though you may not hitherto have been sensible of its operation, yet if you venture into the way of evil instruction, there is great danger that you will find, not only that this spirit exists, but that it exerts a powerful influence in opening your mind to the reception of error.

Moreover, you are in danger of embracing the errors which you accustom yourselves to hear defended, from the fact that familiarity with error, as with vice, has a tendency to make you insensible of its deformity. This tendency results partly from the power of habit, and partly from the deceitful nature of sin; and it exists universally, though it must be acknowledged that it is often counteracted by the influence of circumstances. The process by which it discovers itself, needs only to be described, to be recognised by everyone as a reality. The youth who has been educated to reverence the Bible as God’s word, when he first hears it assailed by infidel cavils and scoffs, shudders at the impiety, and perhaps wonders that God suffers such a wretch to live.

He hears the same thing the second time, but with less horror than before. He hears it again and again, and at length ceases to be affected by the impiety. At no distant period, he gathers bravery enough to smile at what once made him tremble; to assent to that, which once drew from him expressions of abhorrence. At a more remote point in the process, he cordially takes the infidel by the hand, and greets him as a brother; thus, perhaps, in a little period, having travelled the whole distance from a firm belief to a total rejection of the Bible. Say, my young friends, whether all this is not perfectly natural, and easily accounted for on the principle that familiarity with error blinds the mind to its inherent odiousness. Venture not then in the way of evil instruction, lest, through the operation of the same principle, you should be the subjects of the same disastrous change.

Another consideration which renders it probable that you will embrace the errors which you hear defended, is, that, from your age and inexperience, you cannot be supposed to he properly furnished for an encounter with error. The man who, when properly armed, might stand his ground against a company of ruffians, would, if stripped of his armour, fall into their hands at the first onset. In like manner, the man who has been long accustomed to study his Bible, might find little difficulty, and be in little danger, in meeting the cavils of the enemies of truth; while he who is comparatively unacquainted with the word of God, might be easily entangled and drawn away by their sophistry.

Taking it for granted then that you have not that deep and thorough knowledge of the Bible which might more naturally be looked for in advanced life, you cannot but perceive that you are in great danger, from this circumstance, of receiving the errors which are defended in your hearing. Cavils which might be satisfactorily answered in many ways, and the fallacy of which a more thorough knowledge of the word of God might enable you instantly to detect, assume, from your ignorance, the weight of arguments; and there is danger that you will soon come to conclude that what you cannot answer, is unanswerable.

But the consideration which crowns the evidence of your danger on this subject, is, that multitudes of youth, from hearing evil instruction, actually have embraced the errors with which they have thus been made familiar. Yes, I could point you to many a young person, who thought himself safe when he ventured on this forbidden ground, and felt confident that his belief of the truth was never to be shaken, who can now speak boldly in defence of the most dangerous errors, and even pour contempt on the revelation of God. Tell me, my young friends, what there is in your circumstances which promises that the same experiment will result more favourably in respect to you. Rely on it, that ground which your curiosity may tempt you to explore, is beset with snares; if you venture among them, take heed lest they prove to you the snares of death.”

— William Sprague, Letter to Young People (3rd edn, New York: D. Appleton &amp; Co., 1835), pp 83-87.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+first+consideration+which+I+shall+offer%2C+as+a+reason+why+you+should+not+be+found+in+the+way+of+evil+instruction%2C+is%2C+that+that+there+is+great+danger+that+you+will+embrace+the+errors+with+which+you+thus+become+acquainted.+This+danger+results+partly+from+the+fact+that+men+naturally+love+darkness+rather+than+light.+Of+this+fact+the+history+of+the+world+furnishes+abundant+proof%3B+else+how+will+you+account+for+it%2C+not+only+that+men+in+all+ages+have+misinterpreted+the+voice+of+God+speaking+to+them+in+his+works+and+ways%2C+and+that+they+have+worshipped+everything+as+God+but+Jehovah+himself%2C+but+also+that+so+many+have+shut+their+eyes+against+the+broad+light+of+revelation%2C+and+have+either+denied+its+divine+authority%2C+or+else+perverted+it+to+sanction+the+most+gross+and+fatal+errors.%0A%0ATaking+for+granted+then+this+fact%2C+it+amounts+to+nothing+less+than+a+predisposition+in+the+human+heart+to+the+reception+of+error.+Suppose+your+bodily+system+was+exactly+predisposed+to+some+contagious+disease%2C+would+not+that+fact+greatly+increase+your+clanger%2C+on+being+brought+into+contact+with+the+elements+of+infection%3F+Or+suppose+an+individual+had+a+strong+thirst+for+intoxicating+liquors%2C+would+not+this+invest+with+additional+danger+all+opportunities+for+indulging+in+the+use+of+them%3F+Is+it+not+equally+manifest+that+that+natural+aversion+to+the+reception+of+God%E2%80%99s+truth%2C+of+which+I+have+spoken%2C+must+be+peculiarly+favourable+to+the+influence+of+evil+instruction%3F%0A%0ABut+this+danger+farther+arises+from+the+love+of+novelty%2C+and+the+pride+of+opinion.+There+is+something+exceedingly+grateful+to+many+youthful+minds%2C+in+the+reflection+that+they+have+turned+off+from+the+beaten+track%3B+%E2%80%94that+they+have+escaped+from+vulgar+prejudices%2C+and+broken+away+from+the+trammels+of+education%2C+and+that+they+are+giving+the+world+a+fine+example+of+independent+thought.+But+this+spirit+finds+but+little+aliment+in+the+way+of+truth%3B+for+that+is+a+highway%2C+and+the+simple+and+unlettered+walk+in+it%3B+and+the+way+to+be+distinguished+from+the+vulgar+herd%2C+is+to+leave+this+plain+path%2C+and+broach+some+wild+or+wicked+speculation.+More+or+less+of+this+spirit+no+doubt+belongs+to+human+nature%3B+and+though+you+may+not+hitherto+have+been+sensible+of+its+operation%2C+yet+if+you+venture+into+the+way+of+evil+instruction%2C+there+is+great+danger+that+you+will+find%2C+not+only+that+this+spirit+exists%2C+but+that+it+exerts+a+powerful+influence+in+opening+your+mind+to+the+reception+of+error.%0A%0AMoreover%2C+you+are+in+danger+of+embracing+the+errors+which+you+accustom+yourselves+to+hear+defended%2C+from+the+fact+that+familiarity+with+error%2C+as+with+vice%2C+has+a+tendency+to+make+you+insensible+of+its+deformity.+This+tendency+results+partly+from+the+power+of+habit%2C+and+partly+from+the+deceitful+nature+of+sin%3B+and+it+exists+universally%2C+though+it+must+be+acknowledged+that+it+is+often+counteracted+by+the+influence+of+circumstances.+The+process+by+which+it+discovers+itself%2C+needs+only+to+be+described%2C+to+be+recognised+by+everyone+as+a+reality.+The+youth+who+has+been+educated+to+reverence+the+Bible+as+God%E2%80%99s+word%2C+when+he+first+hears+it+assailed+by+infidel+cavils+and+scoffs%2C+shudders+at+the+impiety%2C+and+perhaps+wonders+that+God+suffers+such+a+wretch+to+live.%0A%0AHe+hears+the+same+thing+the+second+time%2C+but+with+less+horror+than+before.+He+hears+it+again+and+again%2C+and+at+length+ceases+to+be+affected+by+the+impiety.+At+no+distant+period%2C+he+gathers+bravery+enough+to+smile+at+what+once+made+him+tremble%3B+to+assent+to+that%2C+which+once+drew+from+him+expressions+of+abhorrence.+At+a+more+remote+point+in+the+process%2C+he+cordially+takes+the+infidel+by+the+hand%2C+and+greets+him+as+a+brother%3B+thus%2C+perhaps%2C+in+a+little+period%2C+having+travelled+the+whole+distance+from+a+firm+belief+to+a+total+rejection+of+the+Bible.+Say%2C+my+young+friends%2C+whether+all+this+is+not+perfectly+natural%2C+and+easily+accounted+for+on+the+principle+that+familiarity+with+error+blinds+the+mind+to+its+inherent+odiousness.+Venture+not+then+in+the+way+of+evil+instruction%2C+lest%2C+through+the+operation+of+the+same+principle%2C+you+should+be+the+subjects+of+the+same+disastrous+change.%0A%0AAnother+consideration+which+renders+it+probable+that+you+will+embrace+the+errors+which+you+hear+defended%2C+is%2C+that%2C+from+your+age+and+inexperience%2C+you+cannot+be+supposed+to+he+properly+furnished+for+an+encounter+with+error.+The+man+who%2C+when+properly+armed%2C+might+stand+his+ground+against+a+company+of+ruffians%2C+would%2C+if+stripped+of+his+armour%2C+fall+into+their+hands+at+the+first+onset.+In+like+manner%2C+the+man+who+has+been+long+accustomed+to+study+his+Bible%2C+might+find+little+difficulty%2C+and+be+in+little+danger%2C+in+meeting+the+cavils+of+the+enemies+of+truth%3B+while+he+who+is+comparatively+unacquainted+with+the+word+of+God%2C+might+be+easily+entangled+and+drawn+away+by+their+sophistry.%0A%0ATaking+it+for+granted+then+that+you+have+not+that+deep+and+thorough+knowledge+of+the+Bible+which+might+more+naturally+be+looked+for+in+advanced+life%2C+you+cannot+but+perceive+that+you+are+in+great+danger%2C+from+this+circumstance%2C+of+receiving+the+errors+which+are+defended+in+your+hearing.+Cavils+which+might+be+satisfactorily+answered+in+many+ways%2C+and+the+fallacy+of+which+a+more+thorough+knowledge+of+the+word+of+God+might+enable+you+instantly+to+detect%2C+assume%2C+from+your+ignorance%2C+the+weight+of+arguments%3B+and+there+is+danger+that+you+will+soon+come+to+conclude+that+what+you+cannot+answer%2C+is+unanswerable.%0A%0ABut+the+consideration+which+crowns+the+evidence+of+your+danger+on+this+subject%2C+is%2C+that+multitudes+of+youth%2C+from+hearing+evil+instruction%2C+actually+have+embraced+the+errors+with+which+they+have+thus+been+made+familiar.+Yes%2C+I+could+point+you+to+many+a+young+person%2C+who+thought+himself+safe+when+he+ventured+on+this+forbidden+ground%2C+and+felt+confident+that+his+belief+of+the+truth+was+never+to+be+shaken%2C+who+can+now+speak+boldly+in+defence+of+the+most+dangerous+errors%2C+and+even+pour+contempt+on+the+revelation+of+God.+Tell+me%2C+my+young+friends%2C+what+there+is+in+your+circumstances+which+promises+that+the+same+experiment+will+result+more+favourably+in+respect+to+you.+Rely+on+it%2C+that+ground+which+your+curiosity+may+tempt+you+to+explore%2C+is+beset+with+snares%3B+if+you+venture+among+them%2C+take+heed+lest+they+prove+to+you+the+snares+of+death.%E2%80%9D%0A%0A%E2%80%94+William+Sprague%2C+Letter+to+Young+People+%283rd+edn%2C+New+York%3A+D.+Appleton+%26+Co.%2C+1835%29%2C+pp+83-87.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0dc1e97a32.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0dc1e97a32.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/10/13/william-buell-sprague-on-the-danger-of-evil-instruction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

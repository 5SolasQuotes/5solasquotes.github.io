<main class="wrap"><figure class="quote" id="q-5317afc25e" data-kw="">
<blockquote><p>Our Military Strength is, under God, the appointed means, or in the ordinary way of Providence, is the proper and only means for our preservation; therefore it is a duty to encourage Soldiers. God can work miracles, but when ordinary means may be had, he will not work miracles. When Israel came out of Egypt, God did take the Battle into his own hand. So frighted as they were with Egypt’s following of them in a better posture for War then they, so low as their spirits were brought by hard bondage, God did miraculously fight for them, and destroy Pharaoh; but when it is otherwise with the People of God, that they have time to furnish themselves, the Lord doth direct us to use them and they are the only means of our preservation, they are the only walls and bulwarks of God’s Heritage here.

God’s vineyard hath no other walls, but only our Soldiery, that and our Poverty. We have no walled towns, as they have in other places, our Forts and Castles are contemptible. We have not any bank of money to hire soldiers; our strength by Sea is small, &amp; for friendship &amp; favour in the world with any that should help us is not much, or our friends lie too far off to help us in time of need; so that we have nothing left us but only this, First that hedge which God made about Job, 2. As to means it is only that wall of Bones (as one calls it) better then a wall of Stones, our Soldiers, which, howsoever it may seem weak to some, yet as when God made the fear of Jacob and his Family fall on the Nations, not one of them durst to rise up to disturb Jacob and his Family. The resolution that appeared in Simeon and Levi, together with the fear of God, begat such an awe and dread of that little Family on the Country round about they knew they were resolute men, and would fell their lives dear; this as a means had a great influence upon all round about, that none did dare pursue Jacob; but this hath been our defence.

Soldiers have been the Wall, the Strength, the Glory of this little Commonwealth; the name of our military Skill, our readiness &amp; expertness in military exercises, is that for which we have been named abroad in other countries, both among Dutch and French. What the Governor of Manadus saw in that little time when he was here, gave us no small credit in Holland. What made the Indians live quietly by us so long? they had hatred to us many years before it broke out. What was the reason it did not break out? they saw we had skill, that Skill in Military Discipline which they understood not: that was an awe and dread to them, and is at this day, that they dare not meet us on equal terms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-nowell.html">Samuel Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abraham in arms; or The first religious general with his army engaging in a war for which he had wisely prepared, and by which, not only an eminent victory was obtained, but a blessing gained also. Delivered in an artillery-election-sermon, June, 3. 1678</cite>, (Boston MA: John Foster, 1678), pp 11-12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d48920bfb9" data-kw="">
<blockquote><p>A fourth Argument is drawn from the names which the Scripture giveth to Heretics and Sectaries, holding forth the extreme danger of tolerating and letting them alone. They are called ravening wolves, Matth. 7. 15. and grievous wolves not sparing the flock, Act. 20. 29. thieves and robbers, John 10. 8. Their word eateth as a canker, 2 Tim. 2. 17. and is as a little leaven leavening the whole lump, Gal. 5. 9. They are troublers of Israel, Act. 15. 24. Gal. 5. 12. Shall the troublers of the State be punished, and the troublers of Israel go free? Shall Physicians cut off the member that hath a Gangrene in it, because it endangereth the whole body, and shall the great State physicians suffer the Gangrene to spread in the Church?

Shall men’s bodies, goods, and purses, be so far cared for, that thieves and robbers must not be suffered, but justice done upon them; and shall those have immunity who steal away souls from Christ, and rob us of the pearl of truth? Nay shall the poor sheep be so much looked to, that the wolf must not be spared; and shall we suffer the soul-destroying wolves to enter, yea abide peaceably among the dear-bought flock of Jesus Christ?</p></blockquote>

</figure><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>

<blockquote><p>One difference between Libertarian Theology (American Theonomy) and Reformed political theology (Scottish Theonomy) is that the former thinks that the magistrate should not suppress acts of gross immorality, unless it can be proved that the state has been commanded to punish that particular sin (that is why they often conclude that adultery should be punished, but pornography should not be). The Westminster divines, however, would have viewed Libertarian Theology as a system calculated to call down God’s wrath. They recognised that God’s natural-moral law is binding upon society; hence the Kuyperian-inspired attempt to limit the magistrate to punishing a very select range of vices would have been considered contrary to their world-view. In the petition to the Houses of Parliament cited below, we clearly see that they believed the civil ruler was to suppress all public vice lest the wrath of God fall upon the nation:

To the Right honourable the Lords assembled in Parliament.

The humble Message &amp; peticion of the Assembly of Divines.

The Assembly of Divines, in all humility &amp; in discharge of their duty to God &amp; to this Honourable House, do inform your Lordships of the sad Compl[ain]ts brought unto them from many Godly &amp; Reverend Divines in &amp; about London, touching the dayly increase &amp; growth of all manner of outrageous and intollerable abominations, such as are drunkennes, swearing, uncleanenes, &amp; other crying sins in very many places of this Kingdome, for want of Godly and zealous Magistrates to represse the same, which cannot but highly provoke the Lord to more wrath against this Kingdome in this Day of his wrath already broken out upon his people, and render fruitlesse all your pious endeavours for Reformation &amp; the Weale of the Kingdome, unless it bee effectually &amp; speedily cured.

The Assembly therefore humbly prayeth that according to your great wisdome and zeale for the Publique, there may bee a speedy appointing &amp; setling of some able godly prudent Magistrates that may reside in all places of the Kingdome, where your wisdome shall find it necessary, to give a speedy stopp to those high provocacions of Almighty God &amp; the most dangerous supplanters of all our hopes of Good from the Parliament or the Assembly. […]</p></blockquote>

<blockquote><p>Now as man’s will, so the will of Christ has two several kinds of operation: the one natural or necessary, whereby it desires simply whatsoever is good in itself and shuns as generally all things which hurt; the other deliberate, when we therefore embrace things as good because the eye of understanding judges them good to that end which we simply desire. Thus in itself we desire health, physic, only for health’s sake. And in this sort, special reason oftentimes causes the will by choice to prefer one good thing before another, to leave one for another’s sake, to forgo meaner for the attainment of higher desires, which our Savior likewise did. These different inclinations of the will considered, the reason is easy how in Christ there might grow desires seeming, but being not indeed opposite, either the one of them unto the other, or either of them to the will of God. For let the manner of his speech be weighed: ‘My soul is now troubled, and what should I say? Father, save Me out of this hour? But yet for this very cause I am come into this hour.’ His purpose herein was most effectually to propose to the view of the whole world two contrary objects, the like whereunto in force and efficacy were never presented in that manner to any but only to the soul of Christ. There was presented before his eyes in that fearful hour on the one side God’s heavy indignation and wrath towards mankind as yet unappeased, death as yet in full strength, Hell as yet never mastered by any that came within the confines and bounds thereof, somewhat also peradventure more than is either possible or needful for the wit of man to find out; finally, Himself flesh and blood left alone to enter into conflict with all these. On the other side: a world to be saved by One, a pacification of wrath through the dignity of that sacrifice which should be offered, a conquest over death through the power of that Deity which would not suffer the tabernacle thereof to see corruption, and an utter disappointment of all the forces of infernal powers through the purity of that soul which they should have in their hands and not be able to touch. Let no man marvel that in this case the soul of Christ was much troubled. For what could such apprehensions breed, but (as their nature is) inexplicable passions of mind, desires abhorring what they embrace and embracing what they abhor? In which agony, how should the tongue go about to express what the soul endured? When the griefs of Job were exceeding great, his words accordingly to open them were many; howbeit, still unto his seeming they were undiscovered: ‘Though my talk’ (says Job) ‘be this day in bitterness, yet my plague is greater than my groaning.’ But here to what purpose should words serve, when nature has more to declare than groans and strong cries, more than streams of bloody sweats, more than his doubled and tripled prayers can express, who thrice putting forth his hand to receive that cup, besides which, there was no other cause of his coming into the world, He thrice pulls it back again and as often even with tears of blood craves, ‘If it be possible, O Father, or if not, even what thine own good pleasure is;’ for whose sake the passion that has in it a bitter and a bloody conflict, even with wrath and death, and Hell, is most welcome. Whereas therefore we find in God a will resolved that Christ shall suffer; and in the human will of Christ two actual desires, the one avoiding and the other accepting death: Is that desire which first declares itself by prayer against that wherewith He concludes prayer, or either of them, against his mind to whom prayer in this case seeks? We may judge of these diversities in the will by the like in the understanding. For as the intellectual part does not cross itself by conceiving man to be just and unjust, when it means not the same man, nor by imagining the same man learned and unlearned, if learned in one skill and in another kind of learning unskilful, because the parts of every true opposition do always both concern the same subject and have reference to the same thing, since otherwise they are but in show opposite and not in truth: So the will about one and the same thing may in contrary respects have contrary inclinations and that without contrariety. The minister of justice may, for publike example to others, virtuously will the execution of that party whose pardon another for consanguinity’s sake as virtuously may desire. Consider death in itself and nature teaches Christ to shun it. Consider death as a mean to procure the salvation of the world and mercy works in Christ all willingness of mind towards it. Therefore in these two desires there can be no repugnant opposition. Again, compare them with the will of God, and if any opposition be, it must be only between his appointment of Christ’s death and the former desire which wishes deliverance from death. But neither is this desire opposite to the will of God. The will of God was that Christ should suffer the pains of death. Not so his will, as if the torment of innocency did in itself please and delight God; but such was his will in regard of the end whereunto it was necessary that Christ should suffer. The death of Christ in itself therefore, God wills not, which to the end we might thereby obtain life, He both allows and appoints. In like manner, the Son of Man endures willingly to that purpose those grievous pains which simply not to have shunned had been against nature, and by consequent against God. I take it therefore to be an error that Christ either knew not what Himself was to suffer, or else had forgotten the things He knew. The root of which error was an over-restrained consideration of prayer, as though it had no other lawful use but only to serve for a chosen mean whereby the will resolves to seek that which the understanding certainly knows it shall obtain: Whereas prayers, in truth, both unto are, and his were, as well sometime a presentation of mere desires as a mean of procuring desired effects at the hands of God. We are therefore taught by his example that the presence of dolorous and dreadful objects, even in minds most perfect, may as clouds overcast all sensible joy; that no assurance touching future victories can make present conflicts so sweet and easy, but nature will shun and shrink from them; nature will desire ease and deliverance from oppressive burdens that the contrary determination of God is oftentimes against the effect of this desire, yet not against the affection itself, because it is naturally in us; that in such case our prayers cannot serve us as means to obtain the thing we desire; that notwithstanding, they are unto God most acceptable sacrifices because they testify we desire nothing but at his hands, and our desires we submit with contentment to be overruled by his will; and in general they are not repugnant unto the natural will of God which wishes to the works of his own hands, in that they are his own handiwork, all happiness, although perhaps for some special cause in our own particular, a contrary determination have seemed more convenient. Finally, that thus to propose our desires which cannot take such effects as we specify shall notwithstanding otherwise procure us his heavenly grace, even as this very prayer of Christ obtained angels to be sent Him as comforters in his agony. And according to this example, we are not afraid to present unto God our prayers for those things, which that He will perform unto us, we have no sure, nor certain knowledge… Such prayers of the Church to be delivered from all adversity are no more repugnant to any reasonable disposition of men’s minds towards death, much less to that blessed patience and meek contentment which saints by heavenly inspiration have to endure (what cross or calamity soever it pleases God to lay upon them) than our Lord and Savior’s own prayer before his passion was repugnant unto his most gracious resolution to die for the sins of the whole world.</p></blockquote>

r+into+conflict+with+all+these.+On+the+other+side%3A+a+world+to+be+saved+by+One%2C+a+pacification+of+wrath+through+the+dignity+of+that+sacrifice+which+should+be+offered%2C+a+conquest+over+death+through+the+power+of+that+Deity+which+would+not+suffer+the+tabernacle+thereof+to+see+corruption%2C+and+an+utter+disappointment+of+all+the+forces+of+infernal+powers+through+the+purity+of+that+soul+which+they+should+have+in+their+hands+and+not+be+able+to+touch.+Let+no+man+marvel+that+in+this+case+the+soul+of+Christ+was+much+troubled.+For+what+could+such+apprehensions+breed%2C+but+%28as+their+nature+is%29+inexplicable+passions+of+mind%2C+desires+abhorring+what+they+embrace+and+embracing+what+they+abhor%3F+In+which+agony%2C+how+should+the+tongue+go+about+to+express+what+the+soul+endured%3F+When+the+griefs+of+Job+were+exceeding+great%2C+his+words+accordingly+to+open+them+were+many%3B+howbeit%2C+still+unto+his+seeming+they+were+undiscovered%3A+%E2%80%98Though+my+talk%E2%80%99+%28says+Job%29+%E2%80%98be+this+day+in+bitterness%2C+yet+my+plague+is+greater+than+my+groaning.%E2%80%99+But+here+to+what+purpose+should+words+serve%2C+when+nature+has+more+to+declare+than+groans+and+strong+cries%2C+more+than+streams+of+bloody+sweats%2C+more+than+his+doubled+and+tripled+prayers+can+express%2C+who+thrice+putting+forth+his+hand+to+receive+that+cup%2C+besides+which%2C+there+was+no+other+cause+of+his+coming+into+the+world%2C+He+thrice+pulls+it+back+again+and+as+often+even+with+tears+of+blood+craves%2C+%E2%80%98If+it+be+possible%2C+O+Father%2C+or+if+not%2C+even+what+thine+own+good+pleasure+is%3B%E2%80%99+for+whose+sake+the+passion+that+has+in+it+a+bitter+and+a+bloody+conflict%2C+even+with+wrath+and+death%2C+and+Hell%2C+is+most+welcome.+Whereas+therefore+we+find+in+God+a+will+resolved+that+Christ+shall+suffer%3B+and+in+the+human+will+of+Christ+two+actual+desires%2C+the+one+avoiding+and+the+other+accepting+death%3A+Is+that+desire+which+first+declares+itself+by+prayer+against+that+wherewith+He+concludes+prayer%2C+or+either+of+them%2C+against+his+mind+to+whom+prayer+in+this+case+seeks%3F+We+may+judge+of+these+diversities+in+the+will+by+the+like+in+the+understanding.+For+as+the+intellectual+part+does+not+cross+itself+by+conceiving+man+to+be+just+and+unjust%2C+when+it+means+not+the+same+man%2C+nor+by+imagining+the+same+man+learned+and+unlearned%2C+if+learned+in+one+skill+and+in+another+kind+of+learning+unskilful%2C+because+the+parts+of+every+true+opposition+do+always+both+concern+the+same+subject+and+have+reference+to+the+same+thing%2C+since+otherwise+they+are+but+in+show+opposite+and+not+in+truth%3A+So+the+will+about+one+and+the+same+thing+may+in+contrary+respects+have+contrary+inclinations+and+that+without+contrariety.+The+minister+of+justice+may%2C+for+publike+example+to+others%2C+virtuously+will+the+execution+of+that+party+whose+pardon+another+for+consanguinity%E2%80%99s+sake+as+virtuously+may+desire.+Consider+death+in+itself+and+nature+teaches+Christ+to+shun+it.+Consider+death+as+a+mean+to+procure+the+salvation+of+the+world+and+mercy+works+in+Christ+all+willingness+of+mind+towards+it.+Therefore+in+these+two+desires+there+can+be+no+repugnant+opposition.+Again%2C+compare+them+with+the+will+of+God%2C+and+if+any+opposition+be%2C+it+must+be+only+between+his+appointment+of+Christ%E2%80%99s+death+and+the+former+desire+which+wishes+deliverance+from+death.+But+neither+is+this+desire+opposite+to+the+will+of+God.+The+will+of+God+was+that+Christ+should+suffer+the+pains+of+death.+Not+so+his+will%2C+as+if+the+torment+of+innocency+did+in+itself+please+and+delight+God%3B+but+such+was+his+will+in+regard+of+the+end+whereunto+it+was+necessary+that+Christ+should+suffer.+The+death+of+Christ+in+itself+therefore%2C+God+wills+not%2C+which+to+the+end+we+might+thereby+obtain+life%2C+He+both+allows+and+appoints.+In+like+manner%2C+the+Son+of+Man+endures+willingly+to+that+purpose+those+grievous+pains+which+simply+not+to+have+shunned+had+been+against+nature%2C+and+by+consequent+against+God.+I+take+it+therefore+to+be+an+error+that+Christ+either+knew+not+what+Himself+was+to+suffer%2C+or+else+had+forgotten+the+things+He+knew.+The+root+of+which+error+was+an+over-restrained+consideration+of+prayer%2C+as+though+it+had+no+other+lawful+use+but+only+to+serve+for+a+chosen+mean+whereby+the+will+resolves+to+seek+that+which+the+understanding+certainly+knows+it+shall+obtain%3A+Whereas+prayers%2C+in+truth%2C+both+unto+are%2C+and+his+were%2C+as+well+sometime+a+presentation+of+mere+desires+as+a+mean+of+procuring+desired+effects+at+the+hands+of+God.+We+are+therefore+taught+by+his+example+that+the+presence+of+dolorous+and+dreadful+objects%2C+even+in+minds+most+perfect%2C+may+as+clouds+overcast+all+sensible+joy%3B+that+no+assurance+touching+future+victories+can+make+present+conflicts+so+sweet+and+easy%2C+but+nature+will+shun+and+shrink+from+them%3B+nature+will+desire+ease+and+deliverance+from+oppressive+burdens+that+the+contrary+determination+of+God+is+oftentimes+against+the+effect+of+this+desire%2C+yet+not+against+the+affection+itself%2C+because+it+is+naturally+in+us%3B+that+in+such+case+our+prayers+cannot+serve+us+as+means+to+obtain+the+thing+we+desire%3B+that+notwithstanding%2C+they+are+unto+God+most+acceptable+sacrifices+because+they+testify+we+desire+nothing+but+at+his+hands%2C+and+our+desires+we+submit+with+contentment+to+be+overruled+by+his+will%3B+and+in+general+they+are+not+repugnant+unto+the+natural+will+of+God+which+wishes+to+the+works+of+his+own+hands%2C+in+that+they+are+his+own+handiwork%2C+all+happiness%2C+although+perhaps+for+some+special+cause+in+our+own+particular%2C+a+contrary+determination+have+seemed+more+convenient.+Finally%2C+that+thus+to+propose+our+desires+which+cannot+take+such+effects+as+we+specify+shall+notwithstanding+otherwise+procure+us+his+heavenly+grace%2C+even+as+this+very+prayer+of+Christ+obtained+angels+to+be+sent+Him+as+comforters+in+his+agony.+And+according+to+this+example%2C+we+are+not+afraid+to+present+unto+God+our+prayers+for+thos </figure><figure class="quote" id="q-c16e5bdc40" data-kw="">
<blockquote><p>But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.</p></blockquote>

e%20image%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bef93b245e" data-kw="">
<blockquote><p>The plant’s roots sinking into the ground is a movement that does arise from within the plant in a sense, since it results from the plant’s natural self-perfective powers qua plant. However, though the power and inclination are in the plant, the end toward which the power is inclined is in no sense present within the plant, nor even represented within it… Now, in a non-human animal, the ends toward which its powers are inclined are represented within it. For an animal can perceive a thing toward which it is naturally inclined, such as the food it eats… the food is in the animal qua perceived… …an animal has a kind of knowledge of the end it is pursuing. However, we still wouldn’t say that an animal knows what it is doing, and thus wouldn’t hold it morally responsible for what it does… For while the animal knows the end it pursues, it doesn’t know that it knows it. It doesn’t know the end as an end, for it does not have the concept of an end, nor indeed any concepts at all. Hence it also lacks the concept of being a means to an end… This lack of concepts entails a certain inflexibility in the animal’s behavior. Like a plant, an animal cannot do otherwise than whatever it in fact does… Because of this… Aquinas says that a non-human animal acts voluntarily only in an imperfect sense… Now, a rational substance is a substance with an intellect, and to have an intellect is precisely to have the capactiy to conceptualize what one knows. A human being qua rational animal not only knows the food that he tries to eat, but knows it as food of a certain kind (an apple, say) and as something that would be good for him to eat given his need for nutrition. He also knows that biting into it straightaway would be one possible means of eating it, and that this has certain advantages and disadvantages compared to other means… What all of this makes possible, as Aquinas emphasizes, is deliberation. Since a rational being posesses universal concepts, he can identify particular ends and means as instances of general kinds. He can make comparisons between these different possible ends and different possible means to the ends. He can arrive at judgments about which ends and means are best, and also make judgments about those judgments themselves. Hence, when he decides to eat the apple, he knows what he is doing in a way that… a non-human animal does not know what it is doing.</p></blockquote>

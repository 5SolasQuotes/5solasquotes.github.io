<main class="wrap"><figure class="quote" id="q-cb6bd53f98" data-kw="">
<blockquote><p>It is thus that the work of redemption is every where in Scripture spoken of as the most glorious of all God’s works—that which creation itself is employed to illustrate—nay, as that for which the worlds were made; for it is expressly declared of Christ, as the Eternal Word incarnate, the Mediator between God and sinners, that he is “appointed heir of all things;” that “all things were made by him, and for him;” and that he has, accordingly, been made “head over all things for the Church, which is his body, the fulness of him that filleth all in all:” and, as the final result of this his glorious undertaking, his people are taught to look for “new heavens and new earth, wherein dwelleth righteousness.”

And such being the light in which the Scriptures represent Christ’s mediatorial work, may it not be said of him, with reference to this new creation, as it was with respect to the first, that having finished his work, “he rested and was refreshed?” And might we not have concluded, that the accomplishment of that work would be commemorated, as the other formerly was? And so it has been.

It was on the first day of the week that Christ’s humiliation ended: then he rose, never more to be affected with sorrow, suffering, and death; and then was he “declared to be the Son of God with power,” having “finished transgression, made an end of sin, made reconciliation for iniquity, and brought in an everlasting righteousness,”—and by his own resurrection secured the resurrection of all his people, and their final exaltation with himself to “glory, honour, and immortality.” And accordingly, the first day of the week was thenceforth observed by the apostles, and by the Churches which they planted, as the day of their solemn assemblies, when they met together for social worship, and for the observance of those ordinances which Christ appointed for the establishment of his Church—the edification of his spiritual body.

On that day (the day of Pentecost) the Holy Ghost was poured out on the apostles, to qualify them for the great work on which they were about to enter. On that day the disciples, the Church at large, came together to break bread, in commemoration of the Saviour’s death. On the same day the apostle enjoined the Christians of Corinth to lay by them in store for their poorer brethren, as God had prospered them. And there can be no doubt that to the same day the apostle John refers in the Book of Revelation, when he says, “I was in the Spirit on the Lord’s Day.”

It is thus, I conceive, that the ultimate design of the Sabbath was fully explained only by the resurrection of Christ. It was undoubtedly a glorious purpose which it served, even under the old economy, as a permanent commemoration of the power, and wisdom, and beneficence, of God in the creation of the world. But it was destined to commemorate a more glorious creation still, even the accomplishment of that mighty undertaking whereby Christ redeemed his Church.

And if such be the grand subjects which the return of the Lord’s Day is intended to present to our devout meditation; if it represents to us the Redeemer as now entered on his rest, seeing of the travail of his soul, and being therewith satisfied; and if, moreover, it is an emblem, and a pledge, and the means also of giving us a foretaste of that “rest which remaineth for the people of God;” then have we not still more powerful motives than the Old Testament Church had, and are we not under a still stronger obligation than they were, to esteem this day “a delight, holy of the Lord, and honourable,”—devoting it to his honour and service,—seeking to hold closer fellowship with him than it is possible to do amidst the ordinary avocations of life,” — “not doing thereon our own ways, not finding our own pleasure, nor speaking our own words?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aaba73e4b3" data-kw="">
<blockquote><p>By nature we are all inclined to superstitions, and once we let them into our lives they soon take us over. Just as plants that have put down deep roots and become very strong cannot be uprooted at the whim of the gardener, so human minds that have been steeped in superstition retain the after-effects, and even if they have been taught better, they still incline in that direction. There are plenty of examples of this evil in the reformed churches. If a residue of papal leaven remains in them, it is almost impossible to get it out, no matter how hard you try.

There is nothing more important or more necessary than to uproot everything that needs to be thrown out, because otherwise those who try to do it later will be hindered by the example and authority of their predecessors and will get nothing but envy and hatred for their godly pains, as we can see in many places today. Particularly mistaken are those who put up with many things in the hope that better times will come, as if those times will somehow appear of their own accord. What is false and erroneous is also harmful and therefore should not be tolerated for a moment by anyone with the power to remove it.</p></blockquote>

</figure><figure class="quote" id="q-3904a79ece" data-kw="">
<blockquote><p>Consecrating of churches is taken two ways:

1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches:

1. That the end being sacred, to wit, the habitual worshipping of God in that place.

2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple.

2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place.

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>

</figure><figure class="quote" id="q-09ade8ee7b" data-kw="">
<blockquote><p>The Reformed, however openly they embrace the fact that it is lawul to have a concept of God, and even more, that it is most necessary–unless we want to be atheists!–nevertheless say that a concept of God under the form of a man, or of any corporeal entity at all, is altogether unlawful, because: (1) the Savior in John 4:24 commands us to have a concept of God that agrees with the nature of God, that defines God as a Spirit, and that therefore leads to the result that God is worshipped and adored in spirit, that is, spiritually, without any such forms, and in truth, meaning in thoughts that are true and that agree with the concept… Balduin [a Lutheran] objects: (1) that since whenever we have a concept of God, and we therefore conceive a certain image of God… I respond, Balduin presupposes that having a concept and conceiving an image are synonymous, when in fact they are worlds apart. For under what likeness or image will you conceive of a spirit as it exists in itself?</p></blockquote>

</figure><figure class="quote" id="q-9c953dba82" data-kw="">
<blockquote><p>This accusation [of incoherency against classical theism] is plausible so long as one is compelled to hold either that the divine Word subtracted something from Himself in assuming a human nature or added something to Himself. But contrary to widespread recent opinion, subtraction and addition are not the only options. Thomas Aquinas, among others, repudiates both these approaches, expounding instead a doctrine of terminative assumption. Termination eludes the liabilities of subtraction and addition by requiring neither privation of being nor passive potency in the divine Word in order to account for his becoming man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dolezal.html">James Dolezal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’Neither Subtraction, Nor Addition: The Word’s Terminative Assumption of a Human Nature’ Nova et Vetera, vol. 20, no. 1 (Winter, 2022) 23 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-17e49246e4" data-kw="">
<blockquote><p>Objection 1 [of Saltmarsh, an Antinomian]: ‘Christ is not ours by any act of our own, but by an infinite act of God’s imputing his righteousness. Therefore, Christ is not ours by faith.’ [Rutherford’s] Answer: Christ is not ours, by any act of our own, as by a ransom, a meritorious and principal cause. [This is] True, therefore [Saltmarsh concludes], [Christ is] not [ours] by faith, as a condition knowing, apprehending, feeling, applying, receiving, [and] opening the everlasting doors, that the King of glory may enter in. It’s false [that is, Saltmarsh’s inference]. So bread is ours only by an omnipotent act of Him that causes the earth to bring forth, as by the first principal and effectual cause: Therefore [Saltmarsh would conclude], bread is not our’s in a civil way, by plowing, sowing, earing, and in a spiritual way, by laying hold by faith on the Covenant, in which the world, the things of this life, are made ours (1 Cor. 3:21); this is a lax and vain consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of Spiritual Antichrist, Pt. 2, ch. 61, ‘How Faith Justifies…’</cite>, p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

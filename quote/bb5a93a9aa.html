<main class="wrap"><figure class="quote" id="q-bb5a93a9aa" data-kw="">
<blockquote><p>I am quite aware that when a man expresses such opinions as those I have just brought forward there are many ready to say, “He is no Churchman.” I hear such accusations unmoved. The day of judgment will show who were the true friends of the Church of England and who were not. I have learned in the last thirty-two years that if a clergyman leads a quiet life, lets alone the unconverted part of the world, and preaches so as to offend none and edify none, he will be called by many “a good Churchman.” And I have also learned that if a man studies the Articles and Homilies, labors continually for the conversion of souls, adheres closely to the great principles of the Reformation, bears a faithful testimony against popery, and preaches as Jewell and Latimer used to preach, he will probably be thought a firebrand and “troubler of Israel,” and called no Churchman at all! But I can see plainly that they are not the best Churchmen who talk most loudly about Churchmanship. I remember that none cried “Treason” so loudly as Athaliah (2 Kings 11:14). Yet she was a traitor herself. I have observed that many who once talked most about Churchmanship have ended by forsaking the Church of England and going over to Rome. Let men say what they will. They are the truest friends of the Church of England who labor most for the preservation of truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Fallibility of Ministers’ in Knots Untied</cite></span></figcaption>

</figure><figure class="quote" id="q-188d83d849" data-kw="">
<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors: Toleration, Erastianism, Independency &amp; Separation… (d. 1667; Edinburgh: 1692), ‘Sermon preached before the synod at Glasgow, 1653’</cite>, pp. 246-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

— James Fergusson, A Brief Refutation of the Errors: Toleration, Erastianism, Independency &amp; Separation… (d. 1667; Edinburgh: 1692), ‘Sermon preached before the synod at Glasgow, 1653’, pp. 246-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+principle%2C+whereby+they+maintain+the+lawfulness+of+gathering+churches+out+of+Churches%2C+acknowledged+by+themselves+to+be+true+Churches.+A+most+dividing+principle%2C+insofar+as+it+gives+way+for+every+man+to+separate+from+his+own%2C+and+to+join+himself+with+another+church+supposed+purer%2C+with+contempt+of+the+former+congregation.+To+gather+churches+out+of+Churches%2C+is+the+way+to+destroy%2C+but+not+to+heal+diseased+Churches%3B+It+is+to+destroy+many+churches+for+making+up+of+one%2C+as+if+one+going+about+the+cure+of+a+natural+body+should+cut+off+and+take+out+all+the+sound+members+and+leave+the+rotten+and+diseased+members+either+to+cure+one+another+or+to+perish.+A+strange+and+desperate+way+of+cure.%E2%80%9D%0A%0A%E2%80%94+James+Fergusson%2C+A+Brief+Refutation+of+the+Errors%3A+Toleration%2C+Erastianism%2C+Independency+%26+Separation%E2%80%A6+%28d.+1667%3B+Edinburgh%3A+1692%29%2C+%E2%80%98Sermon+preached+before+the+synod+at+Glasgow%2C+1653%E2%80%99%2C+pp.+246-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F188d83d849.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/188d83d849.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=That%20principle%2C%20whereby%20they%20maintain%20the,strange%20and%20desperate%20way%20of%20cure&amp;text=That%20principle%2C%20whereby%20they%20maintain%20the%20lawfulness%20of&amp;text=perish.%20A%20strange%20and%20desperate%20way%20of%20cure" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8ac99ed5c7" data-kw="">
<blockquote><p>And secondly, whereas they allege that we let the wicked continue in our Church without separation, whereas we should cut them off when we find them to be hypocrites. I answer: We doe separate, as much as in us lies, for we labor to have them separated from us, and also we labor to separate ourselves from them. First, we labor their separation from us, desiring their removal, bewailing their wickedness, and our condition that live in Mesech and Kedar, and reproving them for their sins; and if that will not serve, complaining against them to those that are in authority, that they may bee excommunicated, and withal we are instant with God by prayer to stir up the hearts of such as are in authority to execute his ordinances upon them: we do what we can to separate them from us, and it comes sometime to pass, that many are so separated from us; but if they should not, that indeed were the Churches sin, and a foul sin too; yet it destroyes not the true being of our Church. Secondly, if we cannot get them separated from us, yet we separate ourselves from them, and that is the separation that the Scripture so much beats upon in private persons, as we are more conscionable, so we doe more separate from them, from their wills, affections and courses; yea, we must separate as much as conveniently we may from their persons, at least from their sins, which for our parts we are persuaded to be the chief separation that the Scripture intends. Yea, but this is a secret separation, say they, under hand, not openly known. Nay, this is a notorious and known separation: For first, it is ingenuously professed on our part, to the moving of their after-hatred and despite against us; we disclaiming them that are lewd, swearing and profane wretches, and that openly, not caring who know it; and likewise it is known on their part, they upbraiding us therefore very reproachfully, with the names of Puritans, Precisions, holy Brethren, and such like, because we will not accompany with them; if this be not an holy and a plain separation, what is?… Yea, but say they, ye should separate from them in the assemblies, from the Word and the sacraments? I answer: Rather the wicked should separate from us in these things: where the assembly and business are naught in themselves, as at playhouses and such like, there the good must separate: but where the assembly and business is good in itself, there the bad must separate; and the reason is good, for it is none of theirs, and the good must tarry and be present, for it is their own right; and it is sin to refuse God’s ordinances for the pollution of others, 1 Sam. 2:17, 24… yet our holiness being true in us, and openly professed and practiced, it shall be enough to make us a true visible Church, yea, and an holy congregation in God’s acceptation, and in the charitable estimation of our brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church… (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 1</cite>, Lecture 12; pp. 208-9</span></figcaption>

he%20charitable%20estimation%20of%20our%20brethren" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1bbdab7c77" data-kw="">
<blockquote><p>As they that affect alienation from others make their differences as great and the adverse opinion or practice as odious as they can, thereby to further their desired victory over them and to harden themselves and their side against them: So on the contrary, they who desire peace and accord both interpret things in the best part that reasonably they can and seek how and where they may find any lawful door of entry into accord and agreement with others.</p></blockquote>

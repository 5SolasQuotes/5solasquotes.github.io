<main class="wrap"><figure class="quote" id="q-d23ac3fbc5" data-kw="">
<blockquote><p>SIN is Treason against the King of Heaven: ‘Tis copying from the fallen Angels. It is the only Object of GOD’S Aversion. He punished it without remedy, in those Cursed Spirits. And who can cast up the Accounts of them, Sin sends to Eternal Destruction?

IF Death could be separated from the Curse of GOD; If it did consist in a total Annihilation; Wicked Men ought to wish for it, as a Cure of the Reproaches and Disquiets of their own Consciences. But alas! it is quite another thing.

LET us therefore fear Sin more than Death it self; Or rather; Let the Waters of the Deluge, the Flames of Sodom, and all other Exemplary Judgments upon hardened Sinners, display to us the horrors of Sin, and the Everlasting Punishment reserved for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-allix.html">Pierre Allix</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epictetus Christianus; or, Maxims of True Christianity</cite>, trans. Paul Lorrain (London: Brab. Aylmer, 1688), p. 82.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03f9ca2838" data-kw="">
<blockquote><p>BUT THE KNIGHTS OF CHRIST may safely do battle in the battles of their Lord, fearing neither the sin of smiting the enemy nor the danger of their own downfall, inasmuch as death for Christ, inflicted or endured, bears no taint of sin, but deserves abundant glory. In the first case one gains for Christ, and in the second one gains Christ himself, who freely accepts the death of the foe in vengeance, and yet more freely gives himself in consolation to his fallen knight.

The knight of Christ, I say, may strike with confidence and succumb more confidently. When he strikes, he does service to Christ, and to himself when he succumbs. Nor does he bear the sword in vain. He is God’s minister in the punishment of evil doers and the praise of well doers. Surely, if he kills an evil doer, he is not a man-killer, but, if I may so put it, an evil-killer. Clearly he is reckoned the avenger of Christ against evildoers, and the defender of Christians. Should he be killed himself, we know he has not perished, but has come safely home. The death which he inflicts is Christ’s gain, and that which he suffers, his own.

At the death of the pagan, the Christian exults because Christ is exalted; in the death of the Christian the King’s liberality is conspicuous when the knight is ushered home to be rewarded. In the one case a just person shall rejoice at regarding vindication; in the other man shall say, Truly there is a reward for the just; truly it is God who judges the earth. Yet this is not to say that the pagans are to be slaughtered when there is any other way of preventing them from harassing and persecuting the faithful; but only that now it seems better to destroy them than to allow the rod of sinners to continue to be raised over the lot of the righteous, lest perchance the righteous set their hand to iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Praise of the New Knighthood: A Treatise on the Knights Templar and the Holy Places of Jerusalem</cite>, trans. M. Conrad Greenia (c. 1130; Piscataway NJ: Gorgias Press, 2010), 3.4, pp 39-40.</span></figcaption>

</figure><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 15</span></figcaption>

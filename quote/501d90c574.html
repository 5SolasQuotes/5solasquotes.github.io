<blockquote><p>1. Some brethren of the Classical [presbytrian] way may possibly object [to joining an accommodated church-association such as Baxter’s], that joining with us in this way may seem to signify a dislike of the resolutions of the [Westminster?] Assembly, or a consent to the undoing of what they have done. Answer: There is no ground for this scruple: For we do not disclaim or condemn the judgment or way of any party, by taking up at present with what all are agreed in. A present forbearance of the use of full Classical government is no rejecting it. We did in this county seek for authority from the parliament many years ago for the establishing of the presbyterian government, and all our endeavors were frustrated. And many brethren that make this objection do preach themselves without the exercise of the presbyterian government. For because they live not in London, Lancashire, Shropshire, where that government was authorized by parliament, therefore they will not use it: And so some of them for many years have forborne all administration of the Lord’s Supper, and others administer it without any exercise of discipline: And may not we as lawfully exercise so much as all are agreed in, as they may forbear all? Objection: But why may not you as well set up the Classical government punctually, as do what you do? Answer: We are not all of one mind; and those of us that are for the Classical government do not think those parts of it which we here omit and forbear to be of so great necessity or moment as for the present use of it to disjoin and divide from all our brethren of a different judgment. We take ourselves bound to do much for the unity and peace of the churches: Besides, being many of us at a loss in several controverted points of discipline, we think the amicable union and association of brethren where all things may be frequently and plainly debated will be the likeliest way to satisfy and rectify us in those controverted points. In the meantime, you may join with us in going so far as we can go unanimously, without disclaiming, yea or forbearing your own way. For I think the constant exercise of the presbyterian government may well consist with our Propositions and associations: part of it being indeed above, but not contrary to our Agreement, and therefore may be done by those that will overgo us, without dividing from us. … And whereas it may be objected that we do allow a single minister to name offenders and to charge it on the people’s consciences to avoid communion with them, which only a presbytery is authorized to do, I answer:

1. We desire each church may have a presbytery, and then we are agreed.

2. The brethren of the Classical Way do allow a single pastor to pronounce the sentence of excommunication itself, so be it he have the advice and consent of a presbytery. And to avoid all possibility of breach upon this ground, we have agreed to take the advice of the Association of ministers before we require the people to avoid communion with any. Only we resolve not to do this all on the same reasons and principles: One may think it of flat necessity in a regimental way: Another may think it of necessity in a way of union: Another may think it convenient to avoid miscarriages and rash censures in so weighty a case: Another may think it fit to be yielded to for peace with those brethren that judge it necessary, seeing it is unquestionably lawful to take advice in cases of such weight. And why must we needs agree in our reasons as long as we agree in our practice?

3. It is only a preaching power that we exercise, applying Christ’s doctrine to particular persons and cases: supposing the evidence of the fact and guilt to be beyond question, we do but apply the word to the person hereupon… Have not pastors a charge of particular souls, but only of people in general? Is not the Old Testament and New full of examples to warrant us in this? Take heed of crying down duty, under pretense of questioning authority. … I will say no more to any objections that may possibly be made by my brethren of the Classical Way, because I find by experience it is needless (if others be as those with us), for they are the forwardest men to our union and Association of any others (here). The Lord grant the like spirit of unity and condescension in other parts. … Brethren! Would you have unity and peace or no? If you would, must not you condescend as far as may be to others, as well as others to you? Let it be the property of the Pope to accept of no peace with any Church that will not wholly come up to his will and way. And you know that this is the great point which you must yield in or you cannot have union with the contrary minded… Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches. 5. In the mean time, I pray you observe, that you may join with us in this without contradicting or deserting your own principles… The public welfare and unity of the churches is to be preferred before the pleasing, yea or edifying of any single member. What confusion will follow the plucking up of Christ’s and the magistrate’s and the churches’ bounds?</p></blockquote>

<blockquote><p>Should there be a gathering destitute of bread and wine, as perchance among the Indians, who for bread use the baked marrow of a certain tree, or a fixed root, or rice, or such other things, the gathering may–if, I say, there is no bread of corn–safely use what it is accustomed to use in place of bread. It is not so much the outward form and kind of corn that ought to be regarded, as the nourishment and what chiefly nourishes. The same must be said if wine is lacking. Something else might be applied, in place of wine, as scarcely any nation is discoverable, which has not some beverage which it uses to restore the spirits in place of wine.</p></blockquote>

<blockquote><p>2. How names are to be given to places, we cannot better learn than of those ancient founders of names, the holy Patriarchs: As Abraham Gen. 22:14 calls the mountain Jehovah-jireh, ‘The Lord hath seen.’ So Jacob gives holy names to the place where he met the angels, Gen. 32:2, and where he wrestled with the angel, v. 31. They, as we see, gave holy and reverent names unto places, not made peculiar for God’s service, but only for civil use for the places to be called and known by: how much more ought churches and houses of God to be called by his name? We therefore conclude that churches ought not to be erected in saints’ names, to worship them thereby and make them our patrons, mediators, and presenters of our prayers [as Romanists]: for this were great idolatry: Even like as the heathen called their temples by the names of their idols, Venus, Jupiter, Diana and the like: Yet we refuse not to call our churches by the names of saints, as they have been called of old, because we are not inventors of names; and terms inured by continual custom can hardly be left. We use them only as civil terms to distinguish places by: if any otherwise use them, for any religious purpose, they do amiss. And yet we deny not but that the names of holy men may be safely remembered by thanksgiving unto God for such excellent instruments, and setting before our eyes their good example. And concerning the names which have been superstitiously given in times past unto churches and other places (though it were to be wished that they never had been so given) yet now we use them (setting apart all superstition) as civil names of difference, as St. Luke [the author of Acts] describes the ship of Alexandria wherein they were carried, whose badge (says he) was Castor &amp; Pollux, Acts 28:11. In a civil matter of description, he refuses not to use the names of the heathen gods. Augustine also gives a good rule concerning such names. He speaks of the names of days, which were called after the names of heathenish idols, as the fourth day in the week, which we call Wednesday, was then called and is yet in the Latin tongue,Dies Mercurij, Mercury, his day. ‘Sic dicitur, a paganis, &amp; a multis Christianis, sed nolumus vt dicant, et vtinam corrigātur: melius de ore Christiano ritus loquendi ecclesiasticus procedit.’ So it is called of the heathen, and of many Christians, but I would not have them called so, and I wish they were amended: for a Christian kind of speaking best becomes a Christian. Sed si quem forte cōsuetudo traxerit, etc. sciat illos omnes homines fuisse. ‘But if custom prevail with a man so to speak, let him understand that all they were but men,’ whom the heathen take for gods. So say we, it were to be wished that we had names void of all show of superstition: but seeing for our speaking we must be ruled by custom, let us know that those saints by whose names places are called, are no gods, nor God’s fellows, nor patrons or mediators for us, nor any way to be worshipped: But they are the fellow servants of all.</p></blockquote>

<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>

f+the+world%3B+why+as+though+living+in+this+world+are+ye+subject+to+ordinances%3F%E2%80%99+%28or+canons%29+%E2%80%98touch+not%2C+taste+not%2C+handle+not%E2%80%99+%28no+not+God%E2%80%99s+ordinances%2C+sacraments%2C+creatures+but+in+such+vestiments%2C+gestures%2C+postures%29+%E2%80%98which+all+are+to+perish+with+the+using%3B+which+things+have+indeed+a+show+of+wisdom+in+will-worship+and+punishing+of+the+body.%E2%80%99+1+Cor.+4%3A5-6%3A+%E2%80%98Have+we+not+power+to+eat+and+to+drink%3F+Have+we+not+power+to+lead+about+a+sister%2C+wife%2C+as+well+as+other+apostles%2C+and+as+the+brethren+of+the+Lord+and+Cephas%3F%E2%80%99+compared+with+verses+19+to+24.+Rom.+14%3A2-3%3A+%E2%80%98For+one+believeth+that+he+may+eat+all+things+another+who+is+weak+eateth+herbs%3B+Let+not+him+that+eateth+despise+him+that+eateth+not%3B+and+let+not+him+which+eateth+not%2C+judge+him+that+eateth%3B+For+God+hath+received+him.+Who+art+thou+that+judgest+another+man%E2%80%99s+servant%3F+To+his+own+master+he+standeth+and+falleth.+But+why+dost+thou+judge+thy+brother%E2%80%99+%28or+refrain+him+in+the+use+of+things+indifferent%29+%E2%80%98or+why+dost+thou+set+at+nought+thy+brother%3F+We+shall+all+stand+before+the+judgement+seat+of+Christ%3F+etc.+Let+us+not+therefore+iudge+one+another+any+more%2C+but+judge+this+rather+that+no+man+put+a+stumbling+block+or+an+occasion+to+fall+in+his+brother%E2%80%99s+way%2C+etc.%E2%80%99+to+wit%2C+by+any+restraints%2C+canons%2C+inhibitions%2C+censures%2C+in+or+concerning+things+or+ceremonies+that+are+but+indifferent%2C+and+not+absolutely+necessary+by+God%E2%80%99s+prescription%2C+or+the+nature+of+the+things+themselves.+Therefore+to+prohibit+any+ministers+of+the+gospel+who+are+able+and+faithfull+to+preach+the+Word%2C+or+to+excommunicate+or+cast+them%2C+or+any+other+consciencious+Christians+out+of+the+Church%2C+or+debar+them+from+the+sacrament%2C+because+they+cannot+wear+a+surplice%2C+kneel+at+the+Lord%E2%80%99s+Table+or+Supper%2C+or+conform+to+every+punctilio+in+the+Liturgy+or+Canons%2C+and+to+deny+them+their+Christian+Liberty+in+the+free+use+or+forbearing+of+ceremonies+which+are+only+decent+and+indifferent%2C+indirectly+repugnant+to+Christian+Liberty%2C+the+Gospel+of+Christ%2C+and+to+Acts+4%3A18-20%3B+ch.+5%3A27-29%2C+41-42%3B+1+Thess.+2%3A14-16%3B+3+John+9-10%3B+Rev.+13%3A16-17%3B+1+Cor.+7%3A8-9%2C+25-28%2C+35-40%3B+Gal.+5%3A13-14.%E2%80%9D%0A%0A%E2%80%94+William+Prynne%2C+A+Brief%2C+Pithy+Discourse+upon+1+Corinthians+14%3A40%E2%80%A6+%28London%2C+1661%29%2C+pp.+8-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29427d960a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29427d960a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=It%20is%20wont%20to%20be%20excepted,Cor.%207%3A8%2D9%2C%2025%2D28%2C%2035%2D40%3B%20Gal.%205%3A13%2D14&amp;text=It%20is%20wont%20to%20be%20excepted%20against%20this&amp;text=13%3A16%2D17%3B%201%20Cor.%207%3A8%2D9%2C%2025%2D28%2C%2035%2D40%3B%20Gal.%205%3A13%2D14" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

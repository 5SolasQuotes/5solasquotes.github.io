<main class="wrap"><figure class="quote" id="q-36d9630f15" data-kw="">
<blockquote><p>Q. 63. What are the special privileges of the visible church? A. The visible church hath the privilege of being under God’s special care and government;[y] of being protected and preserved in all ages, notwithstanding the opposition of all enemies;[x] and of enjoying the communion of saints, the ordinary means of salvation,[a] and offers of grace by Christ to all the members of it in the ministry of the gospel, testifying, that whosoever believes in him shall be saved,[b] and excluding none that will come unto him.[c]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/application-of-redemption-in-general/order-of-salvation.html">Order of Salvation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45d4a14433" data-kw="">
<blockquote><p>24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments. 26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. … 29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Sr. Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), ‘Miscellaneous Theological Disputation’, trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</cite></span></figcaption>

</figure><figure class="quote" id="q-cee5266c74" data-kw="">
<blockquote><p>Q. 73. How doth faith justify a sinner in the sight of God? A. Faith justifies a sinner in the sight of God, not because of those other graces which do always accompany it, or of good works that are the fruits of it,[q] nor as if the grace of faith, or any act thereof; were imputed to him for his justification;[r] but only as it is an instrument by which he receiveth and applieth Christ and his righteousness.[s] [q] Gal. 3:11. Rom. 3:28. [r] Rom. 4:5 compared with Rom. 10:10. [s] John 1:12. Phil. 3:9. Gal. 2:16“ . By Faith we Spiritually Receive Christ, &amp; hence his Righteousness, &amp; upon this are Justified Witsius, Herman – Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the Unhappy names of Antinomians and Neonomians (Glasgow, 1807) ch. 5, sections 8-9, pp. 64-66 ch. 10, sections 4-13, pp. 111-18 . . Adoption Adoption Derives from Spiritual Union to Christ, which comes by Faith Bible Verse John 1:12 “But as many as received Him, to them gave He power to become the sons of God, even to them that believe on his name;</p></blockquote>

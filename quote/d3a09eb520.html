<blockquote><p>Janus” in the title of the article refers to a two-faced Greek god, which H. Hoeksema antagonistically characterized the Sincere Free Offer with. Clark responds to this charge. Roberts, Maurice – The Free Offer of the Gospel, 2005, the text of a 19 min. sermon Silversides, David The Free Offer Of The Gospel: Is It Biblical And Reformed? no date, 15 paragraphs The Meaning of Matt 23:17, 2005, 9 paragraphs, from his book The Free Offer: Biblical &amp; Reformed, p. 50-52 Watts, Malcom – The Necessity and Justification for the Free Offer of the Gospel, 2009, 63 paragraphs Maclean, Donald ‘James Durham (1622-58) &amp; the Free Offer of the Gospel’ 2010 28 pp. in Puritan Reformed Journal, vol. 2, #1, Jan., 2010, p. 92 ff. Dr. Maclean: “It is impossible to avoid the conclusion that Durham (1622-1658) teaches that God desires the salvation of all men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Janus, the Well-Meant Offer of the Gospel and Westminster Theology”, in The Pattern of Sound Doctrine: Systematic Theology at the Westminster Seminaries; Essays in Honor of Robert B. Strimple, edited by David VanDrunen</cite></span></figcaption>

<blockquote><p>2. And he beseeches them, per miserationes, by the mercifulness of God, rather than per misericordiam Dei, the mercy of God: for this shows only the merciful inclination of God in Himself, the other betokens his actual compassion extended to others; [Francis] Tolet.</p></blockquote>

</figure><figure class="quote" id="q-43f63abc46" data-kw="">
<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36. 535. Leigh, Treatise, II.xiii (p. 100). 536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 572</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-fdc9092a55" data-kw="">
<blockquote><p>7. From these things it is plain that God, when He pursues with a hatred of displeasure an elect person whom He previously loved with a love of complacency, is not changed, even though perhaps the act of complacency, considered as it adds a respect of reason to such an object, is now in no way in Him. For: First, when such an act is removed, God is not physically and really changed, because nothing departs from Him beyond a mere respect of reason, as Suárez and Vázquez demonstrate by irrefutable arguments in the places cited. Secondly, neither is He changed morally, because He does not change his purpose, but on the contrary, remains [steadfast] in his purpose, or rather in his natural inclination, by which from eternity He was, now is, and always will be, inclined to love virtue and to detest vices or sins. He also remains [steadfast] in his purpose of leading those whom He chose and justified to eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Venial &amp; Mortal Sin (1633; 1649), pt. 1, sect. 6, ‘God can love those whom He previously hated, and hate those whom He previously loved, without any change, whether physical or moral, in his will’ tr. Michael Lynch Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-ef43ff0e01" data-kw="">
<blockquote><p>The promise of the gospel is that whosoever believes in Christ crucified shall not perish, but have eternal life. This promise, together with the command to repent and believe, ought to be declared and published to all nations, and to all persons promiscuously and without distinction, to whom God out of His good pleasure sends the gospel.</p></blockquote>

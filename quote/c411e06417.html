<blockquote><p>A correct and comprehensive scheme of federal theology, in fact, commends itself very powerfully to every logical mind by the readiness with which it may be brought to bear on the exposure of the various aberrations that have manifested themselves on the doctrine of the Atonement. Take, for instance, Dr [Ralph] Wardlaw’s erroneous views, and place them in the light of the federal theology: they are immediately robbed of all their plausibility.

Dr Wardlaw held the notion of a universal, unlimited, or indefinite atonement, undertaken literally for all men, and accomplishing as much for every human being as for any. And being a believer in the doctrines of election and of the necessity of the Spirit’s regenerating grace, he held that the sovereign purpose of God comes in afterwards, in the order of nature, to determine to whom the Atonement shall be rendered actually fruitful of saving results. This, of course, is to acknowledge, in some sense, intentionally at least, a covenant of grace. But it is a covenant conditioning not Christ’s work, but merely the Spirit’s.

Of such a covenant, however, the Scriptures contain not a single trace. The covenant which we deduce, by a large and satisfactory induction of particulars from Holy Scripture, is a covenant with Christ, concerning Christ’s own work,—its nature, its objects, its beneficiaries, its rewards. And it is a covenant with the Spirit, only because it is a covenant with the Christ—the immeasurably Anointed One of God, anointed of the Holy Ghost, and endued with power to give the Spirit to as many as the Father hath given Him. To dislocate here, is to derange everything. To place Christ and His work outside this covenant, in order to give His redemption the aspect of larger graciousness and indefinite relations to all men universally, is to pervert the entire doctrine of the Covenant,— to turn aside, at its very fountain-head, that river the streams whereof make glad the city of God.

Moreover, under pretence of enlarging the aspects of Grace, it achieves most effectually a precisely opposite result. For, to bring in a covenant of grace in order to limit the application and circumscribe the effectual results of an atonement in its own nature and accomplished merit unlimited, is surely one of the most perverted and perverting schemes that could be adopted. To introduce a covenant of any kind as an instrument of limitation of a mercy, and of the actual blessings of a mercy, already in the field without limit, is surely too offensive to expect acceptance with thoughtful and generous minds—unless indeed very overwhelming evidence can be presented of its being verily the Divine method, clearly and unmistakably revealed to us.

But to introduce a covenant of grace, as an instrument for the limitation of grace, is at once an insult to the human understanding and a travesty of the Divine wisdom. In any such view of its action and intent, it must assuredly cease to be called a covenant of grace. The grace is all in the prior arrangement or achievement, which it has been agreed on this scheme to call the Atonement; and the covenant is a covenant circumscribing the grace into limits narrower than its own. It is, therefore, a covenant, not of grace, but of alarming judgment.

Nay, more: it is a covenant of reasonless, arbitrary, and capricious judgment. For it is utterly vain to call in, in arrest of this condemnatory criticism, any reference to the sovereignty of God. The Divine sovereignty is legitimately referred to at the earlier stage, as arranging a real Covenant of Grace—grace true and pure and simple—taking action from the first to provide and accept and apply a definite and complete atonement for the full and free and sure salvation of the lost and guilty.

Sovereignty is in its true place there and then: and its action there and then may be defended against all cavils whatsoever by the answers which the Spirit of God has provided against them: “May I not do what I will with my own?” “Who art thou, O man, that repliest against God?” For, from that point of view, and at that stage in the order of nature, sinners are contemplated as sinners simply,—in the eye of Divine justice guilty and righteously exposed to the wrath of God, helpless to relieve themselves from it, and with nothing as yet achieved by Heaven for their relief.

And the question, Why is not atonement provided for all? is answered by the question, Why is atonement provided for any? To fall back on the Divine sovereignty here is perfectly legitimate, and indeed inevitable. But to fall back on the Divine sovereignty at a later stage, as Dr Wardlaw’s capricious scheme of doctrine does, is utterly useless and unwarrantable. For if the sovereignty of God is called in at the later stage, at which a universal and unlimited atonement is seen, so to speak, to have already taken the field, then sinners must be viewed, not as simply sinners now, but as sinners whose sin has been atoned for —whatever, on this scheme, that may mean.

And a covenant coming into play at such a stage, to exclude, in point of fact, vast multitudes from all beneficial effects of an atonement, which, in its own nature, had as beneficial bearings on them as on any and all of those who are ultimately to be saved,—a covenant such as this, it is utter folly to call a covenant of grace. It is not a covenant of grace in any sense, but a covenant of judgment; and not a covenant of sovereignty, but of arbitrary and reasonless and terrific judgment.

The objection, therefore, in deference to which a definite, effectual, and sure atonement is disparaged and set aside in favour of one that is indefinite and unlimited,—and from all the benefits of which, whatever these may be, an imaginary covenant interposes to exclude vast numbers of its beneficiaries,—reappears against the erroneous doctrine itself in a form the most aggravated and offensive, with relevancy which it is impossible to deny, and with a force which it is impossible to rebut.</p></blockquote>

<blockquote><p>III. …But what can man do for this? His demerit is infinite (by the previous thesis). But the moral value of human actions is only finite, for the act cannot exceed the dignity of its principle. Moreover, in personal offenses, such as this one, there ought to be order and proportion between the one making satisfaction and the one to whom it is made, but this is far less between God and man than between a king and the vilest slave. IV. …Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here. Hence fall:

1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…</p></blockquote>

2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…”

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’, tr. by AI by Onku (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+%E2%80%A6But+what+can+man+do+for+this%3F+His+demerit+is+infinite+%28by+the+previous+thesis%29.+But+the+moral+value+of+human+actions+is+only+finite%2C+for+the+act+cannot+exceed+the+dignity+of+its+principle.+Moreover%2C+in+personal+offenses%2C+such+as+this+one%2C+there+ought+to+be+order+and+proportion+between+the+one+making+satisfaction+and+the+one+to+whom+it+is+made%2C+but+this+is+far+less+between+God+and+man+than+between+a+king+and+the+vilest+slave.+IV.+%E2%80%A6Indeed%2C+so+far+is+gratuitous+remission+of+sins+from+being+opposed+to+this+satisfaction%2C+that+it+cannot+but+have+a+place+in+that+satisfaction+%28such+as+this+one+is%29+where+another+pays+and+something+else+is+paid+than+he+who+was+and+what+was+in+the+obligation%2C+and+more+so+when+he+to+whom+satisfaction+ought+to+be+made+can+reject+all+satisfaction%2C+and+especially+when+he+himself+appoints+the+sponsor+and+in+him+reconciles+himself+with+his+enemies%2C+all+of+which+obtain+here.+Hence+fall%3A+1.+The+mimicry+of+the+Socinians+arguing+against+the+satisfaction+of+Christ+from+the+gratuitous+remission+made+to+us%2C+and+refuting+our+arguments+for+it+%28see+Socinus%2C+De+Servatore%2C+part+3%2C+ch.+2%2C+and+Praelections+ch.+117%2C+%C2%A75%3B+Volkelius+and+Gitichius+ibid.%29.+2.+Their+argument+from+Eph+4%3A32+that+we+ought+to+forgive+our+brothers+as+God+has+forgiven+us.+Right%21+Gratuitous+remission+has+come+about+for+us%2C+but+on+account+of+Christ%E2%80%99s+satisfaction+%E2%80%9Cin+Christ%E2%80%9D+%28as+the+Apostle+adds+there%29%2C+through+whose+blood+we+have+remission+of+sins+from+the+riches+of+divine+grace+%28Eph+1%3A7%29.+Indeed%2C+what+is+clearer+for+the+possibility+of+composing+most+strict+satisfaction+and+gratuitous+remission+than+the+example+of+Paul+entreating+remission+for+Onesimus+and+offering+his+own+payment+%28Philem+10%2C12%2C18-19%29%3F+3.+Nor+is+the+transfer+of+our+obligation+to+Christ+repugnant+to+divine+justice+%28as+Socinus+argues%2C+part+3%2C+ch.+3%29.+It+is+indeed+essential+to+sin+that+it+be+set+in+order+through+punishment%2C+but+it+is+not+essential+that+it+be+vindicated+in+the+very+one+who+sinned.+For+God+is+placated+provided+that+esteem+is+restored+to+him+and+his+laws+satisfied+%28for+in+these+he+was+injured%2C+by+Thesis+1%29.+But+this+is+done+through+Jesus+Christ%3B+indeed%2C+it+can+be+done+through+him+alone%2C+because+he+alone+has+order+and+proportion+with+God.+4.+Nor+does+it+oppose+the+truth+of+%5BGod%E2%80%99s%5D+threats+%28as+Socinus+ibid.%29%2C+since+that+too+is+preserved+provided+that+someone+sponsors+for+those+who+sinned.+They+indeed+have+this+from+transgression%2C+that+they+are+under+obligation+to+punishments%2C+but+it+is+not+required+that+the+transgression+actually+be+vindicated+in+them%2C+as+was+just+said.+V.+%E2%80%A6its+power+and+value+flowed+from+the+divine.+Christ+our+Lord+freely%2C+willingly+and+lawfully+undertook+this+sponsorship+%28Ps+40%3A8%2C+Heb+10%3A9%29%2C+for+he+was+Lord+of+his+life+and+had+the+power+of+laying+it+down+%28John+10%3A18%29.+It+was+also+of+his+dignity%2C+that+he+was+most+apt+for+satisfying+the+rigor+of+justice.+VI.+%E2%80%A6The+price+offered+is+the+whole+Christ%2C+%E1%BC%91%CE%B1%CF%85%CF%84%E1%BD%B8%CE%BD+%E1%BC%94%CE%B4%CF%89%CE%BA%CE%B5%CE%BD+%5Bhe+gave+himself%5D%2C+etc.+For+between+the+person+who+would+make+satisfaction+and+the+one+to+whom+it+would+be+made%2C+there+ought+to+be+proportion+and+order%2C+since+the+nature+of+the+latter+demands+the+rigor+of+justice+%28by+Theses+2+and+3%29.+For+this+reason%2C+Christ%2C+a+divine+person%2C+submitted+himself+to+the+whole+Trinity%2C+becoming+obedient+unto+death+%28Phil+2%3A8%29%E2%80%A6+It+was+necessary+for+Christ+to+bear+these+punishments+for+us+in+this+way%2C+since+he+took+our+guilt+upon+himself+and+was+made+our+sponsor.+I+deny%2C+therefore%2C+that+Christ+was+able+to+make+satisfaction+by+a+single+drop+of+blood%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98Theological+Disputation+on+the+Satisfaction+of+Christ%E2%80%99%2C+tr.+by+AI+by+Onku+%28Utrecht%2C+1650%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb155ef1e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb155ef1e3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=But%20what%20can%20man%20do%20for,by%20a%20single%20drop%20of%20blood&amp;text=But%20what%20can%20man%20do%20for%20this%3F%20His&amp;text=make%20satisfaction%20by%20a%20single%20drop%20of%20blood" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f34c6a4968" data-kw="">
<blockquote><p>XXIII. While Christ’s passion is minimized by the foregoing errors, those who teach that he died for all human beings (pro omnibus et singulis) broaden the object of his passion more than is allowable. Of course, if we take into consideration the magnitude and worthiness of the merit, we admit that it would suffice for the redemption of ten worlds; but if we take the plan of God and the intention of Christ into consideration, then it is false to say that Christ died for every person. For this reason others say that his death was sufficient for all, but not effective for all; that is, the merit of Christ, because of his worthiness, is sufficient for all, but it is not effective for all in its application, because Christ did not die with the intention that his death be applied to all. Why should He die for those for whom He would not pray?</p></blockquote>

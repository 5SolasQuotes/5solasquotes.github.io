<main class="wrap"><figure class="quote" id="q-23e0b21102" data-kw="">
<blockquote><p>It is a very wretched condition which the Prophet describes, that a free people should be oppressed by such cruel tyranny as to have all their property valued, and an inventory taken of their houses, possessions, families, and servants.

How grievous this slavery is, many persons formerly unaccustomed to it actually know by experience in our times, when their property is valued to the very last farthing, and a valuation is made not only of their undoubted incomes but also of their expected gains, and not only their money and possessions, but even their names are placed on record, while new methods of taxation are contrived, not only on food but on the smallest articles, so that tyrants seize on a large portion of those things which are indispensably necessary to the wretched populace; and yet those calamities do not restrain men from insolence, licentiousness, and rebellion.

What then will happen when they shall be free and at full liberty? Will they not, forgetful of all their distresses, and unmindful of God’s kindness, abandon themselves more freely than before to every kind of indulgence and licentiousness? It is not without good reason, therefore, that the Prophet places before the eyes of the people that wretched condition, that they may not, when delivered from it, giveway to their unlawful passions, but may acknowledge their deliverer and may love him with all their heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), viii, 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f8c05f3f4" data-kw="">
<blockquote><p>For besides the moral precepts (in which all mankind are concerned) we have an account of the laws of the Israelites by which they were to be governed in their own land: And though it be true, that these judicial laws were given to the Hebrews, and that they were concerned in them, and that other nations must be governed by the laws of their several countries, yet, certain it is, that the justice and the equity, on which these laws are founded, and which they recommend, are worthy the consideration and imitation too of other nations. And if inquisitive persons think it worth their while to look into the laws of Sparta, and Athens, of Rome and other kingdoms and commonwealths, certainly they must judge the laws of Moses, which came from God Himself, are well worthy their looking into, and their serious consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-kidder.html">Richard Kidder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Five Books of Moses</cite>, vol. 1, p. 272</span></figcaption>

</figure><figure class="quote" id="q-e46c98e15d" data-kw="">
<blockquote><p>Can there be any more willing to help us than Christ? whose whole head was sick, and whose heart was heavy for our sakes? yea, in whose body, from the sole of the foot to the crown of the head, was nothing but wounds and swellings, and sores? but alas this was nothing to that He suffered for our sakes. He was compassed about with fears and horrors, till his sweat was drops of blood, and his bones bruised in the flesh: he was whipped, and scourged, and chastised with sorrows, till He cried out in the bitterness of his soul: ‘O Lord, if it be possible let this cup pass from Me.’ The heavy hand of God was so grievous upon Him, that it bruised his very bones and rent his reigns asunder: he could find no health in his flesh, but was wounded, yea, wounded to the death, even the most bitter death upon the cross. His tender fingers were nailed to the cross, his face was wrinkled with weeping and wailing, his sides embrued and gored with his own blood. spurting and gushing fresh from his ribs, the shadow of death was upon his eyes. O what grief could be like to this, or what condemnation could be so heavy, since there was no wickedness in his hands? since He was the brightness of his father’s glory, and the son of righteousness that shined in the world: as to see his days at an end, to see such throbing, sighs, and careful thoughts (without cause of his) so deeply engraven in the tables of his breast. But was this all? No my brethren, since his excellency was such above all creatures, that the world was not worthy to give Him breath, it was a greater grief unto Him, to see Himself made a worm and not a man, a shame of men, and contempt of the people; to see his life shut up in shame and reproaches, how could it but shake his bones out of joint, and make his heart melt in midst of his bowels: who was ever so full of woe? and whoever been brought so low into the dust of death? upon whom did the malice of Satan ever get so great a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sinful Man’s Search’</cite>, (London, 1592) on Job, 8:5-7</span></figcaption>

<blockquote><p>I answer that, The existence of God can be proved in five ways… The second way is from the nature of the efficient cause. In the world of sense we find there is an order of efficient causes. There is no case known (neither is it, indeed, possible) in which a thing is found to be the efficient cause of itself; for so it would be prior to itself, which is impossible. Now in efficient causes it is not possible to go on to infinity, because in all efficient causes following in order, the first is the cause of the intermediate cause, and the intermediate is the cause of the ultimate cause, whether the intermediate cause be several, or only one. Now to take away the cause is to take away the effect. Therefore, if there be no first cause among efficient causes, there will be no ultimate, nor any intermediate cause. But if in efficient causes it is possible to go on to infinity, there will be no first efficient cause, neither will there be an ultimate effect, nor any intermediate efficient causes; all of which is plainly false. Therefore it is necessary to admit a first efficient cause, to which everyone gives the name of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-749bb3c55a" data-kw="">
<blockquote><p>Although I, by divine testimony, and by the truth and merit of the thing itself, and by invincible reasons am persuaded that God exists, and I think it to be a most grievous and destructive sin to suspend judgment concerning it; yet because you suspend judgment concerning the existence of God, you hold in contempt all the authority of divine testimony, in which you certainly sin most grievously: yet, about to deal with you according to your capacity; having set aside divine testimony, likewise also the merit of the truth, I will convince you with invincible natural reasons; then what you can allege to the contrary, I will dispatch: You assent, for example, that you exist, he will grant it; nor will he be able, if he wished ever so much, to suspend judgment on this with the Cartesians. You assent that you are not from yourself, but from another, and this one similarly; he will grant it, and this willy-nilly. I will proceed therefore: One of these therefore will have to be chosen by you: [1] That in this series of causes one must ascend either to infinity; [2] Or that things in this series are mutually causes and effects of each other, with circular efficacy; by which e.g. the father produced you; the grandfather the father; the great-grandfather the grandfather; the great-great-grandfather the great-grandfather, etc. and you finally the great-great-grandfather: [3] Or that at some point in this series one must stop at some first, which is that very thing, which we wish to be designated by the Word God. If he chooses the first; I will say that he contradicts himself in this reasoning, inasmuch as thus, he himself cannot exist, which however he has already acknowledged before, willy-nilly: he cannot, I say, exist; because that infinite series of causes, which is presupposed to have to precede his production, and existence, would never have been completed, so that the next to produce, could have succeeded: If he chooses the second, the circular series, by which e.g. the great-great-grandfather through the great-grandfather, the grandfather, the father produced himself; but he himself the great-great-grandfather; I will say that he also thus contradicts himself, inasmuch as by this reasoning he states, that he is at the same time and is not, for inasmuch as he was produced by the great-great-grandfather, he certainly was not: but inasmuch as he produced the great-great-grandfather; he certainly was: Therefore there remains nothing, but that the third be acknowledged in this subordination, that there is some first, which produced all things, and was produced by none, and that this is infinitely perfect, hence I will proceed to demonstrate, that nothing is believed to finish or limit its own perfection; nor is there anything else for this first which may finish it: necessarily that thing remains infinite.</p></blockquote>

<blockquote><p>I answer that, The existence of God can be proved in five ways… The fourth way is taken from the gradation to be found in things. Among beings there are some more and some less good, true, noble and the like. But more and less are predicated of different things, according as they resemble in their different ways something which is the maximum, as a thing is said to be hotter according as it more nearly resembles that which is hottest; so that there is something which is truest, something best, something noblest and, consequently, something which is uttermost being; for those things that are greatest in truth are greatest in being, as it is written [by Aristotle] in Metaphysics, 2[.1]. Now the maximum in any genus is the cause of all in that genus; as fire, which is the maximum heat, is the cause of all hot things. Therefore there must also be something which is to all beings the cause of their being, goodness, and every other perfection; and this we call God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“I answer that, The existence of God can be proved in five ways… The fourth way is taken from the gradation to be found in things. Among beings there are some more and some less good, true, noble and the like. But more and less are predicated of different things, according as they resemble in their different ways something which is the maximum, as a thing is said to be hotter according as it more nearly resembles that which is hottest; so that there is something which is truest, something best, something noblest and, consequently, something which is uttermost being; for those things that are greatest in truth are greatest in being, as it is written [by Aristotle] in Metaphysics, 2[.1]. Now the maximum in any genus is the cause of all in that genus; as fire, which is the maximum heat, is the cause of all hot things. Therefore there must also be something which is to all beings the cause of their being, goodness, and every other perfection; and this we call God.”

<blockquote><p>for it is already in itself a wicked error to attribute any image to God… He may not be represented by any visible effigy… Let the Papists dispute as they please, that images are not to be removed because they are useful for the people’s instruction…</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 32, p. 188</span></figcaption>

</figure><figure class="quote" id="q-0629595fba" data-kw="">
<blockquote><p>Q. Is it unlawful to make an image of the Trinity, or of any Person in the Godhead? It is utterly unlawful, and a great dishonor to figure the incorruptible God by the shape of a base and corruptible man or bird, or other creature. Dt. 4:15-18; Rom. 1:23; Acts 17:24, 29; Isa. 40:15, 18-19; Hab. 2:8. It abuses our understandings: the party thinks there is some good in an image, else he would not make it; and that’s a lie: He lies that shows me a toad and says it is the picture of an angel; so, etc. All the pictures of Christ in the flesh, as that on Christ on the cross and resurrection are lies, false in their representations and false in the conceit of any good by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Principle[s] of Faith &amp; Good Conscience Digested into a Catechetical Form</cite>, … (Oxford: Hall, 1665), ch. 30, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-1d68760fc2" data-kw="">
<blockquote><p>But especially take heed of that which is true superstition indeed, by which here I mean the making of any new parts of religion to ourselves and fathering them upon God, who never made them. Of this there are two sorts, positive and negative: When we falsely say, ‘This is a duty commanded by God,’ or when we falsely say, ‘This is a sin forbidden by God.’ Take heed of both. I do not speak here of doing or not doing the same things upon any other account (as human duties, or mere conveniences or the like), but as they are falsely pretended to be divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 58, ‘Take heed of Superstition, and observe well the circular course of zealous superstition</cite>, …’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 278-95, p. 282</span></figcaption>

</figure><figure class="quote" id="q-1adee36587" data-kw="">
<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, p. 197</span></figcaption>

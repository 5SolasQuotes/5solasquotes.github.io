<main class="wrap"><figure class="quote" id="q-67f95840cd" data-kw="">
<blockquote><p>[L]et us consider what the knowledge of God is; it is a most pure act by which he doth at one instant know himself in himself, and all things without himself, not only necessary, and contingent, but which shall never be, after a most perfect, exquisite, and infallible manner.

Out of this description, we may gather two things. 1. That there is no Succession in God’s knowledge, it is uno intuitu, our knowledge is … from the effect to the cause; it is not so in God. 2. Things that are not have an objective being in his knowledge, Rom. 4. 17. He calls things that are not as if they were; even these non entia have an Idea in his knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 12-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/immutability.html">Immutability</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2218b9f05f" data-kw="">
<blockquote><p>I answer that, Power is twofold—namely, passive, which exists not at all in God; and active, which we must assign to Him in the highest degree. For it is manifest that everything, according as it is in act and is perfect, is the active principle of something: whereas everything is passive according as it is deficient and imperfect. Now it was shown above (I:3:2; I:4:1 and I:4:2), that God is pure act, simply and in all ways perfect, nor in Him does any imperfection find place. Whence it most fittingly belongs to Him to be an active principle, and in no way whatsoever to be passive. On the other hand, the notion of active principle is consistent with active power. For active power is the principle of acting upon something else; whereas passive power is the principle of being acted upon by something else, as the Philosopher says (Metaph. v, 17). It remains, therefore, that in God there is active power in the highest degree. Reply to Objection 1. Active power is not contrary to act, but is founded upon it, for everything acts according as it is actual: but passive power is contrary to act; for a thing is passive according as it is potential. Whence this potentiality is not in God, but only active power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, Question 25, ‘The Power of God’ | Article 1</span></figcaption>

<blockquote><p>God is unchangeable in his essence, nature, and perfections. Immutability and eternity are linked together; and indeed true eternity is true immutability, whence eternity is defined the possession of an immutable life. It is the essential property of God, not to have any change in his being, or any alteration by any thing without him or within him.</p></blockquote>

</figure><figure class="quote" id="q-26ebf9e579" data-kw="">
<blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>

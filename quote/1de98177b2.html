<blockquote><p>43. There are, however, exceptions. First, all those works are permitted which are part of honorable conduct. At all times we ought to live and act honestly and decently, and especially on the day dedicated to divine worship. All things which look simply to this are clearly allowed. Second, those things are permitted which are imposed upon us by special necessity, Matt. 12:11. We should eliminate all those things which men make or pretend to make necessary. But there are still those which in the providence of God are unexpected, necessary, and unavoidable, e.g., when a necessity allowed by the Scripture is present as a sufficient cause for doing ordinary work. Third, all work is permitted which directly affects the worship and glory of God, Matt. 12:5; John 5:8,9. For such work which of its own nature is servile passes into the nature of a holy work and is not properly our work but God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 2, ch. 15, ‘The Time of Worship’, section 43, p. 299</span></figcaption>

<blockquote><p>Wherein the wickedness of this exceeds, in that men commonly no day in the week follow so much their own ways, and delights of their own heart, as on that day, which is appointed to learn them how to cease from their owne ways, works, and delights. For a great number (and those not the worst of all) take that day to be ordeind only for ease of their body and to be a day of recreation after their travels and labors that hae been the six days before, and use it accordingly: whereas, the Lord has appointed it to the exercise of Word and prayer, that being unburdened of their worldly affairs, they might with free hearts and minds attend upon the Word, prayer, and meditation…. Thus the right use and end of the Sabbath is clean altered, and not that only, but changed into a practice most contrary to the institution thereof. For being appointed to be… the market day of the soul, to make provision for the days following…</p></blockquote>

gnated as a holiday. Scholes’ judicious treatment of the Puritan attitude toward recreation is refreshing as well as accurate; cf. also pp. 302-331. Compare Hugh Martin, Puritanism and Richard Baxter (London, 1954), pp. 101-106. 7 Bridenbaugh, Vexed, p. 115. 8 Baxter, Divine Appointment, p. 444. 9 Ibid., p. 445.</p></blockquote>

<blockquote><p>The precept of the Sabbath observance is moral in one respect, insofar as it commands man to give some time to the things of God, according to Ps. 45:11: ‘Be still and see that I am God.’ In this respect it is placed among the precepts of the decalogue: but not as to the fixing of the time, in which respect it is a ceremonial precept.</p></blockquote>

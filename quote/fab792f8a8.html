<main class="wrap"><figure class="quote" id="q-fab792f8a8" data-kw="">
<blockquote><p>You [the opponent] suggest that nonconformists think they may quit the communion of the Church if [the Church is defective] in their opinion, nor in the truth in every point… [McWard responds:]… in [the] name of all true nonconformists… it is not every real difference in profession or practice that they hold to be a sufficient cause; Nor do they judge that, even the cause being sufficient, the separation should be always carried to the extremity; but the sound and clear rule which they propose for Christian practice in this matter is that where the controverted difference is such as would render a conjunction therein either sinful or contagious [Mt. 16:6; 1 Cor. 5:6; 15:33; Rev. 18:4], then a just and proportionate separation, precisely and with all tenderness, commensurate to the exigence, is the safer course.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-mcward.html">Robert McWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contagiousness | The True Non-Conformist... (Amsterdam, 1671), Dialogue 1, pp. 6-7 McWard was a resisting Scottish covenanter, and a disciple of Samuel Rutherford. | Separation from Contagious Corruptions</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>This regeneration and inchoate obedience, being wrought in the faithful by the Spirit of God, though it do not wolly extirpate and root out sin, yet it keeps it so under, that it reign not in them: and it so renews them that they labour to resist sin, and to live according to the Law of God: which obedience though it be in itself imperfect, yet is it accepted of God by faith in Christ, in whose perfect righteousness, whatsoever is imperfect in our obedience, is perfected, and our imperfections pardoned; [So Erasmus] Marbach.</p></blockquote>

</figure><figure class="quote" id="q-c00382ea43" data-kw="">
<blockquote><p>14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (London, 1642), ch. 11</cite>, pp. 162-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-510eb4232c" data-kw="">
<blockquote><p>For the persons and duties of men may be accepted with God, when they walk and act in sincerity according to their light, though in many things, and those of no small importance, sundry irregularities are found, both in what they do, and in the manner of doing it. Where persons walk before God in their integrity, and practice nothing contrary to their light and conviction in his worship, God is merciful unto them, although they order not everything according to the rule and measure of the Word. So was it with them who came to the Passover in the days of Hezekiah: they had not cleansed themselves, but did eat the Passover otherwise than it was written, 2 Chron. 30:18; for whom the good king made the solemn prayer suited to their occasion: ‘The good Lord pardon every one that prepareth his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary; and the Lord hearkened unto Hezekiah and healed the people,’ vv. 18-20. Here was a duty for the substance of it appointed of God, but in the manner of its performance there was a failure: they did it not according to what was written, which is the sole rule of all religious duties. This God was displeased withal, yet graciously passed by the offence, and accepted them whose hearts were upright in what they did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer (London: 1682), ch. 11</cite>, pp. 232-33</span></figcaption>

<blockquote><p>Come friends, there is no end, nor much hope in disputing against fixed prejudice and wrong confident conceits, how clear soever the light be against it. Hold your judgment and I shall hold mine till God irresistibly reconcile us; and if you cannot forgive me, I can forgive you, but not own the guilt of your mistakes and the effects; I have too much already of my own. I had rather you accused me than [my own] conscience [accuse me] for wilful contracting¹ anymore. The Lord save us from our enemies, but more especially from our friends and all their temptations, and above all, from ourselves.</p></blockquote>

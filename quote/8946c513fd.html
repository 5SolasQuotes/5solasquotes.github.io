<blockquote><p>Our help is in Him who delivered them from the subtlety and cruelty of that fox James VI. Though now dead we may justly call him so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Hosea 13:9-10 (1680)′ in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite>, ed. James Kerr (Edinburgh, 1880), p. 413.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80d066d2da" data-kw="">
<blockquote><p>The British Baptists held to a high view of the magistrate and followed largely in the Magisterial Protestant tradition in terms of constitutional monarchy, the two kingdoms, and, to varying degree, the magistrate’s care of religion… the English Baptist theologian John Gill exemplifes this political perspective. Judging from his statements about the duties of a magistrate, that include securing right religious worship in the commonwealth and enforcing virtue using the two tables of the Decalogue, it is apparent that Gill would not have agreed with Jeferson’s wall of separation, nor with the Baptists who followed him. The “frst care of government” is of divine things. Though the Second London Confession does not stipulate the magistrate’s responsibility for care of religion, it does not argue against it, and so Gill is not in violation of this doctrinal standard for maintaining this view held by the Magisterial Reformers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ian-clary.html">Ian Clary</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The First Care of Government’</cite>, (2024), pp. 4-23, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-59aa811627" data-kw="">
<blockquote><p>The human nature of Christ being thus formed in the womb by a creating act of the Holy Spirit, was in the instant of its conception sanctified, and filled with grace according to the measure of its receptivity… And this work of sanctification, or the original infusion of all grace into the human nature of Christ, was the immediate work of the Holy Spirit; which was necessary unto Him: for let the natural faculties of the soul, the mind, will, and affections, be created pure, innocent, undefiled,— as they cannot be otherwise immediately created of God,— yet there is not enough to enable any rational creature to live to God; much less was it all that was in Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3, ch. 4, p.168</span></figcaption>

</figure><figure class="quote" id="q-61ab4fa8b4" data-kw="">
<blockquote><p>I know the most received opinion is that the soul is created by God, and so becomes defiled with sin by the union of it to the body; as when a man falls into the dirt and is soiled and bedaubed, or as water clean in itself receives filth from an unclean vessell into which it is put… For my own part [his traducianism was stated before this passage on the same page] I cannot conceive either how sin should first be in the body before the soul is united to it, or how the soul should receive infection from the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hieron.html">Samuel Hieron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Penitential Psalm Opened in 30 Several Lectures Thereon</cite>, (Cambrdige: Legge, 1617), on Ps. 51, p. 144 Hieron (1572-1617) was an English puritan within the establishment.</span></figcaption>

</figure><figure class="quote" id="q-d2bbf9aba6" data-kw="">
<blockquote><p>If we take care of our bodily safety, by flying the company of such as have the plague, yea if we take care of the safety of our beasts, and would not to our knowledge suffer a scabbed or rotten sheep to infect the rest, shall we not much more take care of our own and neighbors’ souls, by avoiding and warning others to avoid the fellowship of the ungodly, whereby spiritual infection comes.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a89d9556be" data-kw="">
<blockquote><p>The essence of goodness consists in this, that it is in some way desirable. Hence the Philosopher says (Ethic. i): Goodness is what all desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 5, art. 1, Whether goodness differs really from being?</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82db385220" data-kw="">
<blockquote><p>Mercy is, God willing, to succor the creature in misery. Mercy in God is either essential: namely that which is in Him by necessity of nature, and had been in Him though He had never willed the manifestation thereof by showing mercy to any; this is God’s sufficiency to show mercy. Or, Relative, namely, that which is in Him with respect to the creature, and is his will to manifest mercy to whom He pleases; Ex. 33:19; Rom. 9:18. Mercy is increated, viz. the attribute of God: or created, viz. a transient act of God in time, or the effects of such transient acts: so vocation is said to be an act of mercy, Rom. 11:30, 32; 1 Pet. 2:10. Remission of sin, Lk. 1:78; Mt. 18:33; Salvation, Jud. 21. Increated mercy is God’s will to show mercy. Created mercy is God’s actual showing mercy according to his will. The effects of mercy are either special: proper to the elect, as flowing from special grace, Rom. 9:23. The elect are called (and by effectual calling so made) vessels of mercy. Or common, extended to those who are not elected, Lk. 6:35-36. Unto the beasts of the field, Ps. 104:27; Yea, over all his works, Ps. 145:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist... (London: 1654), ch. 1, Of the Divine Essence</cite>, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-d47c0917fd" data-kw="">
<blockquote><p>In the first place I say that the deity which the Papists worship, under that highest and most glorious name of God, is imaginary and fictitious. For it is agreed among all that the true God is supremely and perfectly just and merciful. But neither is that justice perfect which rests in human satisfactions, nor is that mercy perfect which only supplies what is lacking to the merits of men. Let the Papists go, then, and boast that they worship the true God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>

</figure><figure class="quote" id="q-2a75a0e624" data-kw="">
<blockquote><p>That answer was the answer of God; it implies divine perfection in him who gave it. To what sufferer would the favor of a creature be sufficient? Who but God can say, “My grace is sufficient for thee?” To Paul it was sufficient. It gave him perfect peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 12:8–9</span></figcaption>

</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

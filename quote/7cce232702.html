<main class="wrap"><figure class="quote" id="q-7cce232702" data-kw="">
<blockquote><p>FIRST, I would consider Christ’s coming into the world, or his taking upon him our nature to put himself in a capacity to purchase redemption for us.—Christ became incarnate, or, which is the same thing, became man, to put himself in a capacity for working out our redemption: for though Christ, as God, was infinitely sufficient for the work, yet to his being in an immediate capacity for it, it was needful that he should not only be God but man.

If Christ had remained only in the divine nature, he would not have been in a capacity to have purchased our salvation; not from any imperfection of the divine nature, but by reason of its absolute and infinite perfection: for Christ, merely as God, was not capable either of that obedience or suffering that was needful. The divine nature is not capable of suffering: for it is infinitely above all suffering. Neither is it capable of obedience to that law that was given to man. It is as impossible that one who is only God, should obey the law that was given to man, as it is that he should suffer man’s punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), p. 138.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-a9db13165e" data-kw="">
<blockquote><p>The other two are ordinary office-bearers, pastors and teachers; I say two, though the disjunctive particle “some,” be not cast in between them; for they are distinguished, Rom. 12:7, 8, and the exercise of their respective offices is distinguished also, 1 Cor. 12:8; so that by pastors are meant those who, besides their ability to open up the text of Scripture in some measure, are chiefly gifted with the word of wisdom, wisely and powerfully to apply the word for working upon the affections, as the matter requires; and the teacher is he who is gifted with the word of knowledge, or ability to open up the mind of God in Scripture, establishing truth, and confuting error, without insisting much upon particular application; which office, because of the church’s poverty, is confined to the schools, and the ordinary exercise of it before the people left upon the pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 4:11.</span></figcaption>

<blockquote><p>The good quiet conscience is that that rightly excuses in Christ Jesus, upon privity of performing the conditions of remission, faith and repentance, this that Solomon calls a continual feast (Prov. 15:15), the jewel of a Christian, and as one well terms it, Heaven upon earth.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ebe102409" data-kw="">
<blockquote><p>…the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to Justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2nd pt., ch. 5, p. 349 of A Treatise of the Covenant of Grace (London, 1645)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

0doubt%20touching%20the%20precedency%20of,sin%3A%20which%20may%20be%20called%20repentance." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d54f60b6ea" data-kw="">
<blockquote><p>Therefore secondly, we say that there are other graces coexistent with faith in the person justified. A solitary faith is not a saving and justifying faith: Faith, if it has not works, is dead, being alone. Faith that is alone saves not, though faith alone save. As the act of seeing is by the eye only, without the ear, or other senses; the eye only sees; the ear sees not, nor the taste, nor the smell, nor the feeling; yet the eye could not see if you should take away the other senses from the body. So it’s faith only that justifies without other graces or good works; yet faith without them, or separated from them, cannot justify: because indeed it cannot be without them in the person or subject where it is. So that faith is without other graces and works in its office, but not in its existence. And you may as soon part light and heat in the sun, as sanctification from justification in a believer. For faith is not only a fruit of the Spirit with other graces, but also the seed and nursery of other graces, because faith in Christ is the root-grace… It would be a strange soul that should give a faculty of seeing and no other faculty or sense: as strange a state of grace would that be that should give an act of saving and justifying faith and give no other grace besides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ the Lord our Righteousness… (London, 1669)</cite>, pp. 155-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>CIV… Chamier concedes that a person is justified and sins are forgiven before they believe. But this contradicts the entire Scripture, which consistently teaches that God’s wrath remains on those who do not believe, and faith and repentance are the conditions under which forgiveness of sins is promised to us, without which it cannot be obtained.</p></blockquote>

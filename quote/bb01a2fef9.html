<main class="wrap"><figure class="quote" id="q-bb01a2fef9" data-kw="">
<blockquote><p>Concerning ceremonial festivals of man’s making, our practice cannot be objected, because we observe none. We take occasion of hearing and praying upon any day when occasion is offered. We say (with [Rudolph] Hospinian [d. 1626], [in Latin] Of Christian Festivals, ch. 2 [1611/74]) ‘Not the day, but the Word of God… puts us in mind of the nativity, resurrection and ascension of Christ.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, vol. 2 (1633; rep. Puritan Reprints, 2010), Section 32, ‘Concerning the Lord’s Day, Temples and Ceremonial Festivals’, p. 359</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba4f4a651c" data-kw="">
<blockquote><p>The most of the persons whom the Papists now keep holy days for were very religious godly people: And the zealous religious people of that age did think that the honoring of the memories of the martyrs was a great means to invite the infidels to Christianity and to encourage the weak to stick to Christ: and therefore they kept the days of their martyrdom in thanksgiving to God and in honor of them. The wicked of that age hated and persecuted both the martyrs and them that honored them. In the next age, religion being uppermost in the world, the wicked did turn hypocrites and keep holy days for the honor of their names whom their forefathers murdered. At last when it was observed that the Papists who burned the living saints were the greatest honorers of the dead, the most religious people turned quite to dislike and reject those very days which their predecessors had set up in thanksgiving to God for the doctrine, example and constancy of the martyrs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, ‘Take heed of superstition, and observe well the circular course of zealous superstition…’, p. 280</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

opener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1519ed2764" data-kw="">
<blockquote><p>When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 4:10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-112e47dff1" data-kw="">
<blockquote><p>I would to God that every [so-called] Holy-day whatsoever beside the Lord’s Day, were abolished. That zeal which brought them in, was without all warrant of the Word, and merely followed corrupt reason, forsooth to drive out the Holy days of the Pagans, as one nail drives out another. Those Holy days, have been so tainted with superstition that I wonder we tremble not at their very names.</p></blockquote>

<blockquote><p>Also in case of removal of our habitations, or change of our family relations, or other the like reasons, it is lawful to remove from one church to another (without any unjust censuring of that which we remove from): And if the first church will not consent (after due means for their satisfaction) we may remove without their consent.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7eebfd8b2" data-kw="">
<blockquote><p>1st Conclusion. An adjoining to a visible Church either formally to be a member thereof, or materially, confessing the Faith of the true visible Church, God offering occasion, is necessary to all: 1. Because we are to be ready to give a confession of the hope that is in us, to every one who asks, 1 Pet. 3:15. 2 Because he who denies Christ before men, him also will Christ deny before the Father and before the holy angels, Mt. 10:33.

3. Yet if some die without the Church, having faith in Christ, and want opportunity to confess Him before men, as repenting in the hour of death, their salvation is sure, and they are within the invisible Church: so is that to be taken, extra Ecclesiam nulla salus, none can be saved who are every way without the Church, both visible and invisible; as all perished who were not in Noah’s Ark. 2nd Conclusion. When God offers opportunity, all are obliged to join themselves to a true visible Church:

1. Because God has promised his presence to the Churches as his Son walks in the midst of the golden candlesticks, Rev. 2:2.

2. Because faith comes by hearing a sent preacher, Rom. 10:4.

3. Separation from the true visible Church is condemned, Heb. 10:24; Jude v. 19; 1 Jn. 2:19.

4. Good men esteem it a rich favour of God to lay hold on the skirt of a Jew, Zech. 8:23, and to have any communion, even as a door keeper in God’s House, and have desired it exceedingly and complained of the want thereof, Ps. 84:10. v. 1-2; Ps. 27:4; Ps. 42:1-4; Ps. 63:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London: 1644), pt. 1, p. 79</span></figcaption>

<blockquote><p>For Rom. 4:11, Abraham is there called the father of all them that believe, whether they were members of a particular visible Church or not. And for ought we find in the holy story, there might be some believers even in Abraham’s own time that were neither members of Abraham’s family, nor yet under the government or guidance of any particular church. If a son or bond-servant of Ephron the Hittite, or of any other Amorite or Canaanite were then brought unto the knowledge of the true God, and to wait for the promise, why might not the infant of such an one have then been circumcised, though not living in a visible Church? … 3. Those that for the present live not under the discipline and a particular Church, and yet make profession of true religion with the true visible Churches, and bring their children to them to be baptised, making solemn promise to bring up their children in the faith that is professed in those Churches; of which sort there are a great number in these Low-countries [the Netherlands], because none here are compelled to the sacraments, nor to subjection under the discipline: These in special are the persons that in our question are ‘without’ [the Church in a certain sense]. These parents, though in regard of that Church where they received their own baptism, and in regard of that Church whereunto they bring their infants to be baptized, they profess and practice some imperfect communion therewith, and therefore in some sense may be said to be of such Churches; yet because for the present they live not within the pale of any ecclesiastical government, neither are subject unto the discipline, either of one or other Church, in this regard are such here commonly said to be ‘without’. Now how Mr. Davenport will deduct and infer from the place alleged [1 Cor. 5:12] that these kind of parents are not to have the privilege of Christians, so far that their infants may be baptized, that cannot I comprehend: this remains to be manifested by him. Those only, according to the order of these Reformed Churches, are admitted for complete members of the Church, who bringing testimony of their good conversation, after examination and profession of their agreement with us in the same faith and religion, and after solemn covenant and promise of submission unto that discipline and government exercised amongst them, have their names published before the whole congregation the Lord’s-Day following, and when no just exception comes against them, are then received and confirmed for members of such particular churches. But that the children of these only are to be baptized, that is not made to appear from the sentence of Paul, 1 Cor. 5:12. For this third sort of persons without, though their fault be great in not joining unto some particular church when opportunity permits, though some through ignorance and error, and some for their carnal case and other sinister respects, do abstain from joining themselves unto the church: yet even among these also some have more knowledge of the truth and are more frequent in attending upon the public worship of God, and are otherwise more unblameable in their conversation than some of those…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paget.html">John Paget</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Unjust Complaints of William Best &amp; of such Other as have Subscribed Thereunto. Also an Answer to Mr. John Davenport</cite>, [a congregationalist]… his Allegations of Scripture Against the Baptizing of Some Kind of Infants (Amsterdam, 1635), ‘An Answer to the Allegations of Scripture brought by Mr. Davenport, Against the Baptizing of such Infants whose Parents Appear to be Christians…’, p. 141 ff. Paget (c.1574–1638 or 1640) was an English puritan and presbyterian minister in Amsterdam, firmly opposed to the English separatistic and Independent churches that had magnetized to Amsterdam.</span></figcaption>

<blockquote><p>11. As he that swears and keeps his allegiance to the king is a subject and member of the kingdom, though he be no member of any corporation; so, though he disown a thousand fellow subjects; yea, though he deny the authority of constable, justice, judge; so he that is devoted to Christ truly in the baptismal covenant, is a Christian, and a member of the universal Church, though he were of no particular church, or did disown a thousand members, or any particular officer of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, p. 23</span></figcaption>

<div class="actions"><button class="copy" data-copy="“11. As he that swears and keeps his allegiance to the king is a subject and member of the kingdom, though he be no member of any corporation; so, though he disown a thousand fellow subjects; yea, though he deny the authority of constable, justice, judge; so he that is devoted to Christ truly in the baptismal covenant, is a Christian, and a member of the universal Church, though he were of no particular church, or did disown a thousand members, or any particular officer of the Church.”

<blockquote><p>Ch. 8, Of their Dismissing of Members from one church to another, or otherwise. 1. No person once thus admitted (as aforesaid) into any of their churches ought to remove thence without the consent of the said church first sought and obtained. For if he do, they hold that he breaks covenant with God and the Church and like Ananias and Sapphira lies against the Holy Ghost. Answer to 9th Position, p. 73; Apology of the Churches in New England for Church Covenant, p. 39; R.M. to E.B., p. 6. Inasmuch as they conceive their covenant binds them not to depart without consent. Ibid.

2. Therefore when any would remove, they require that he first give notice thereof to their church wherewith he is in covenant and lay before them (how many soever they be) in a public meeting both his reasons for which he desires to remove and also to what other church he would remove, and consult with them about both. Answer to 9th Position, p. 74; Apology, p. 20.

3. If upon examination they approve both of his reasons why and of the place whither he would go, then they consent, and giving him letters of dismission and recommendation to that other church, they send him away with their prayers and blessing. Ibid.

4. If contrarily they approve not, either the one or the other, they dissuade him from his purpose; if they prevail not, they will not hold him by violence (for that they cannot), yet they will neither give their consent, nor give him their letters of recommendation (though he were otherwise never so well deserving), nor send him away with their benediction as otherwise they would. Ibid. Yea, he shall depart little better than an excommunicate, as a covenant breaker with God and man, and as one that is wise in his own conceit and refuses to hearken to counsel. Ibid.</p></blockquote>

— William Perkins, An Exposition of the Symbol or Creed of the Apostles… (Cambridge: Legatt, 1595), p. 169">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6and+thus+conceiving+Him+by+faith%2C+He+remaining+without+change%2C+we+shall+be+changed+into+Him+and+made+bone+of+his+bone+and+flesh+of+his+flesh.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+of+the+Symbol+or+Creed+of+the+Apostles%E2%80%A6+%28Cambridge%3A+Legatt%2C+1595%29%2C+p.+169&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89d5f5cec5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89d5f5cec5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-being-born-again-as-subsequent-to-faith-in-receiving-christ-the-fullness-of-life-by-faith/#:~:text=and%20thus%20conceiving%20Him%20by%20faith,bone%20and%20flesh%20of%20his%20flesh&amp;text=and%20thus%20conceiving%20Him%20by%20faith%2C%20He%20remaining&amp;text=of%20his%20bone%20and%20flesh%20of%20his%20flesh" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec223b0914" data-kw="">
<blockquote><p>Assertion 1: In the first moment of our conversion, called actus primus conversionis, we are mere patients. 1. Because the infusion of the new heart, Eze. 36:26, the pouring of the Spirit of Grace and supplication on the family of David, Zech. 12:10, and of the Spirit on the thirsty ground, Isa. 44:3, is a work of creation, Eph. 2:10; Ps. 51:10, a quickening of the dead, Eph. 2:1-4; Jn. 5:25; 2 Cor. 4:6, and the wilderness is not here a co-agent for the causing roses to blossom out of the earth. 2. The effect is not wholly denied of the collateral cause and ascribed wholly to another. If Peter and John draw a ship between them, with joint strength, you cannot say the one drew the ship, not the other: But Christ said flesh and blood makes no revelations of Christ, but his Father only, Mt. 16:17; 11:25-27; Jm. 1:18; Jn. 1:18. Then neither blood, nor the will of man contribute any active influence to the first framing of the new birth; nor can clay divide the glory of regeneration with the God of grace who makes all things new. … Assertion 3. The Person of the Holy Ghost is not united to the soul of a believer, nor are there two persons here united or made one Spirit by union of person with person; but the Person is said to come to the saints and to dwell with them, and to be in them, Jn. 14:16-17; and God has sent the Spirit of his Son in our hearts, crying ‘Abba Father’; not that the Holy Ghost, in proper Person, does in us formally and immediately believe, pray, love, repent, etc. we being mere patients in understanding, will, affections, memory, as Libertines teach. But the Holy Ghost comes to the saints and dwells in them, in the spiritual gifts and saving graces, and supernatural qualities created in us by the Holy Spirit and acted, excited and moved as supernatural and heavenly habits to act with the vital influence of our understanding, will and affections. I prove the former part: 1. Because such a union of the Person of the Holy Ghost in us, believing, loving, joying, praying and immediately in us, were that blasphemous deifying and Goding of the saints, so as believing, loving, praying were not our works, but the immediate acts of the Holy Ghost, and either the faint manner of believing, or the cold slacked loving, and praying of saints, or their not believing, and sinful omission of the acts of faith, love, praying, rejoicing, could not be more imputed to saints as their sinful defects and transgressions (but must be laid on the Holy Ghost’s score) than we can impute the splitting of a ship to the ship itself and not to the negligent and willful pilot who of purpose dashed the vessel on a rock; but we must not in reason blame the ship, but the pilot; for the loss of the ship is the only and proper fault of the man that stirred the ship, and the ship is innocent and harmless timber: Now what sin can be in the saints in these supernatural acts, if the Holy Ghost immediately in his own Person stir the helm, and only, without us, act these in us? We might with as good reason say the shop that a man works in does make the portrait, which is a great untruth, since the artificer in the shop does it▪ as say that the saints do pray, believe, rejoice, if the Holy Ghost immediately do all these in them, as in a shop. … 3. The third [erroneous] way is that free-will is said to believe, repent, love God, by a mere extrinsical denomination, because it carries that grace which formally and only does perform all these supernatural actions; so grace does all and free-will is a mere patient that confers no vital subordinate and active influence in these acts; as we say, the apothecaries’ glass heals the wound, because the oil in the glass works the cure, when the glass does actively contribute nothing to the cure; or the ass makes rich, when it carries the gold that enriches only; this sense Antinomians hold forth and make us mere patients and blocks in the way to heaven, and this sense Jesuits, especially Martinez de Ripald, falsely charges upon Luther and Calvin; and the Council of Trent, inspired with the same lying spirit, says the same. 4. The fourth [and correct] sense is that grace and free-will does work so as grace is the principal, first inspiring and fountain cause: 1. It being a new supernatural disposition and habit in the soul, Jn. 14:23; 1 Jn. 2:27; 3:9; Jn. 4:14; Isa. 44:3-4; Eze. 36:26-27; Dt. 30.6; a good treasure or stock of grace, Mt. 12:35; Lk. 6:45. And also actually it determines, sweetly inclines and stirs the will to these acts; yet so as free-will moves actively, freely, and confers a radical, vital and subordinate influence and is not a mere patient in all these, as Antinomians dream, Ps. 119:32. ‘I will run the way of thy commandments, when thou shall enlarge my heart,’ Jn. 14:12, ‘he that believeth in Me, the works that I do, he shall do, and greater than these,’ Mt. 12:50, ‘He that does the will of my heavenly Father, the same is my brother,’ etc. 1 Cor. 9:24, ‘So run that ye may obtain,’ Rev. 2:2, ‘I know thy works and thy labour,’ 1 Thess. 1:3, ‘Remembering without ceasing your work of faith and labor of love, and patience of hope:’ 1. We are not dead in supernatural works, and mere blocks, Rom. 6:11, ‘We are alive unto God in Jesus Christ,’ Eph. 2:1, ‘He hath quickened us,’ Rev. 2:3, ‘For my name’s sake thou hast laboured, and had not fainted,’ 1 Cor. 15:58, ‘Be ye steadfast, unmoveable, always abundant in the work of the Lord.’ There is activity in the Spirit to lust against the flesh, Gal. 5:17; Rom. 7:15. Nor is the blessedness of the saints only passive in receiving: though to be justified and receive Christ’s righteousness be the fountain blessedness, Ps. 32:1; Rom. 4:6-7; Gal. 3:13. But the Scripture speaks of a true and solid blessedness in action, Ps. 119:1, ‘Blessed are the undefiled in the way,’ Isa. 56:2, ‘Blessed is the man that doth this,’ Jm. 1:12, ‘Blessed is the man that endureth temptation,’ Ps. 119:2, ‘Blessed are they that keep his testimonies,’ Ps. 106:3, ‘Blessed are they that keep judgment, Rev. 22:14, ‘Blessed are they that do his commandments, Mt. 5, ‘Blessed are they that mourn, that hunger and thirst;‘ Then there must be a part of blessedness in sanctification, as in justification; though the one be the cause, the other the effect.</p></blockquote>

+and+saving+graces%2C+and+supernatural+qualities+created+in+us+by+the+Holy+Spirit+and+acted%2C+excited+and+moved+as+supernatural+and+heavenly+habits+to+act+with+the+vital+influence+of+our+understanding%2C+will+and+affections.+I+prove+the+former+part%3A+1.+Because+such+a+union+of+the+Person+of+the+Holy+Ghost+in+us%2C+believing%2C+loving%2C+joying%2C+praying+and+immediately+in+us%2C+were+that+blasphemous+deifying+and+Goding+of+the+saints%2C+so+as+believing%2C+loving%2C+praying+were+not+our+works%2C+but+the+immediate+acts+of+the+Holy+Ghost%2C+and+either+the+faint+manner+of+believing%2C+or+the+cold+slacked+loving%2C+and+praying+of+saints%2C+or+their+not+believing%2C+and+sinful+omission+of+the+acts+of+faith%2C+love%2C+praying%2C+rejoicing%2C+could+not+be+more+imputed+to+saints+as+their+sinful+defects+and+transgressions+%28but+must+be+laid+on+the+Holy+Ghost%E2%80%99s+score%29+than+we+can+impute+the+splitting+of+a+ship+to+the+ship+itself+and+not+to+the+negligent+and+willful+pilot+who+of+purpose+dashed+the+vessel+on+a+rock%3B+but+we+must+not+in+reason+blame+the+ship%2C+but+the+pilot%3B+for+the+loss+of+the+ship+is+the+only+and+proper+fault+of+the+man+that+stirred+the+ship%2C+and+the+ship+is+innocent+and+harmless+timber%3A+Now+what+sin+can+be+in+the+saints+in+these+supernatural+acts%2C+if+the+Holy+Ghost+immediately+in+his+own+Person+stir+the+helm%2C+and+only%2C+without+us%2C+act+these+in+us%3F+We+might+with+as+good+reason+say+the+shop+that+a+man+works+in+does+make+the+portrait%2C+which+is+a+great+untruth%2C+since+the+artificer+in+the+shop+does+it%E2%96%AA+as+say+that+the+saints+do+pray%2C+believe%2C+rejoice%2C+if+the+Holy+Ghost+immediately+do+all+these+in+them%2C+as+in+a+shop.+%E2%80%A6+3.+The+third+%5Berroneous%5D+way+is+that+free-will+is+said+to+believe%2C+repent%2C+love+God%2C+by+a+mere+extrinsical+denomination%2C+because+it+carries+that+grace+which+formally+and+only+does+perform+all+these+supernatural+actions%3B+so+grace+does+all+and+free-will+is+a+mere+patient+that+confers+no+vital+subordinate+and+active+influence+in+these+acts%3B+as+we+say%2C+the+apothecaries%E2%80%99+glass+heals+the+wound%2C+because+the+oil+in+the+glass+works+the+cure%2C+when+the+glass+does+actively+contribute+nothing+to+the+cure%3B+or+the+ass+makes+rich%2C+when+it+carries+the+gold+that+enriches+only%3B+this+sense+Antinomians+hold+forth+and+make+us+mere+patients+and+blocks+in+the+way+to+heaven%2C+and+this+sense+Jesuits%2C+especially+Martinez+de+Ripald%2C+falsely+charges+upon+Luther+and+Calvin%3B+and+the+Council+of+Trent%2C+inspired+with+the+same+lying+spirit%2C+says+the+same.+4.+The+fourth+%5Band+correct%5D+sense+is+that+grace+and+free-will+does+work+so+as+grace+is+the+principal%2C+first+inspiring+and+fountain+cause%3A+1.+It+being+a+new+supernatural+disposition+and+habit+in+the+soul%2C+Jn.+14%3A23%3B+1+Jn.+2%3A27%3B+3%3A9%3B+Jn.+4%3A14%3B+Isa.+44%3A3-4%3B+Eze.+36%3A26-27%3B+Dt.+30.6%3B+a+good+treasure+or+stock+of+grace%2C+Mt.+12%3A35%3B+Lk.+6%3A45.+And+also+actually+it+determines%2C+sweetly+inclines+and+stirs+the+will+to+these+acts%3B+yet+so+as+free-will+moves+actively%2C+freely%2C+and+confers+a+radical%2C+vital+and+subordinate+influence+and+is+not+a+mere+patient+in+all+these%2C+as+Antinomians+dream%2C+Ps.+119%3A32.+%E2%80%98I+will+run+the+way+of+thy+commandments%2C+when+thou+shall+enlarge+my+heart%2C%E2%80%99+Jn.+14%3A12%2C+%E2%80%98he+that+believeth+in+Me%2C+the+works+that+I+do%2C+he+shall+do%2C+and+greater+than+these%2C%E2%80%99+Mt.+12%3A50%2C+%E2%80%98He+that+does+the+will+of+my+heavenly+Father%2C+the+same+is+my+brother%2C%E2%80%99+etc.+1+Cor.+9%3A24%2C+%E2%80%98So+run+that+ye+may+obtain%2C%E2%80%99+Rev.+2%3A2%2C+%E2%80%98I+know+thy+works+and+thy+labour%2C%E2%80%99+1+Thess.+1%3A3%2C+%E2%80%98Remembering+without+ceasing+your+work+of+faith+and+labor+of+love%2C+and+patience+of+hope%3A%E2%80%99+1.+We+are+not+dead+in+supernatural+works%2C+and+mere+blocks%2C+Rom.+6%3A11%2C+%E2%80%98We+are+alive+unto+God+in+Jesus+Christ%2C%E2%80%99+Eph.+2%3A1%2C+%E2%80%98He+hath+quickened+us%2C%E2%80%99+Rev.+2%3A3%2C+%E2%80%98For+my+name%E2%80%99s+sake+thou+hast+laboured%2C+and+had+not+fainted%2C%E2%80%99+1+Cor.+15%3A58%2C+%E2%80%98Be+ye+steadfast%2C+unmoveable%2C+always+abundant+in+the+work+of+the+Lord.%E2%80%99+There+is+activity+in+the+Spirit+to+lust+against+the+flesh%2C+Gal.+5%3A17%3B+Rom.+7%3A15.+Nor+is+the+blessedness+of+the+saints+only+passive+in+receiving%3A+though+to+be+justified+and+receive+Christ%E2%80%99s+righteousness+be+the+fountain+blessedness%2C+Ps.+32%3A1%3B+Rom.+4%3A6-7%3B+Gal.+3%3A13.+But+the+Scripture+speaks+of+a+true+and+solid+blessedness+in+action%2C+Ps.+119%3A1%2C+%E2%80%98Blessed+are+the+undefiled+in+the+way%2C%E2%80%99+Isa.+56%3A2%2C+%E2%80%98Blessed+is+the+man+that+doth+this%2C%E2%80%99+Jm.+1%3A12%2C+%E2%80%98Blessed+is+the+man+that+endureth+temptation%2C%E2%80%99+Ps.+119%3A2%2C+%E2%80%98Blessed+are+they+that+keep+his+testimonies%2C%E2%80%99+Ps.+106%3A3%2C+%E2%80%98Blessed+are+they+that+keep+judgment%2C+Rev.+22%3A14%2C+%E2%80%98Blessed+are+they+that+do+his+commandments%2C+Mt.+5%2C+%E2%80%98Blessed+are+they+that+mourn%2C+that+hunger+and+thirst%3B%E2%80%98+Then+there+must+be+a+part+of+blessedness+in+sanctification%2C+as+in+justification%3B+though+the+one+be+the+cause%2C+the+other+the+effect.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%E2%80%A6+%28London%2C+1647%29%2C+pp.+464-65+%26+470-71&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fec223b0914.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ec223b0914.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=Assertion%201%3A%20In%20the%20first%20moment,the%20cause%2C%20the%20other%20the%20effect&amp;text=Assertion%201%3A%20In%20the%20first%20moment%20of%20our&amp;text=one%20be%20the%20cause%2C%20the%20other%20the%20effect" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>He says not: ‘ye are the children of God because ye are circumcised, because ye have heard the law and have done the works thereof’ (as the Jews do imagine, and the false apostles teach): but ‘by faith in Jesus Christ’ [Gal. 3:26]. The law then makes us not the children of God, and much less men’s traditions. It cannot beget us into a new nature or a new birth: but it sets before us that old birth whereby we were born to the kingdom of the Devil: And so it prepares us to a new birth which is by faith in Jesus Christ and not by the law, as Paul plainly witnesses: ‘For ye are all the children of God by faith, etc.&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-32aa7ad0f8" data-kw="">
<blockquote><p>Princes therefore may not suffer bishops to usurp the power of suspending and depriving at their pleasure [as that belongs to presbyteries], and whensoever they commit any such tyranny in smiting of their fellow servants, it is the part of princes to cause these things to be redressed, and for this end graciously to receive the grievances of oppressed ministers. The Arians of old beeing assembled in a Council at Antioch [A.D. 341] (Canon 11), decreed that if any ecclesiastical person should, without the advice and the letters of the bishops of the province, and chiefly of the Metropolitan, go to the emperour to put up any grievance unto him, he should be cast out, not only from the holy communion, but from his proper dignity which he had in the Church. Whereupon Osiander has this observation (Hist. Eccl., Century 4, bk. 2, ch. 48, p. 242): ‘This canon also was composed against holy Athanasius: for Athanasius being expelled by the Arians, had fled to the Emperour Constantine the younger, and had from him obtained a return to his own Church. Now this canon is very unjust, which forbids that a bishop or any other minister of the Church, being unjustly oppressed, flee to his godly civil magistrate: since it was lawful to the apostle paul to appeal to the Roman Emperor, wicked Nero, as the acts of the apostles witness. But it may be seen in this place, that bishops were very soon seeking dominion, yea tyranny over the Church and over their colleges [ecclesiastical assemblies].&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, bk. 8, Digression 4</cite>, pp. 194-5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4e8419ac74" data-kw="">
<blockquote><p>And it is most false that we join with Jesuits. 1. We teach no more against tyrants, in exercitio [in the exercise], than Grotius, Barclay, and Winzetus, in the matter of deposing kings; and in this, royalists conspire with Jesuits. 2. We deny that the Pope may loose subjects from the oath of fidelity when a king turns heretical. 3. That people, at the Pope’s commandment, are to dethrone kings for heresy; so do the prelates and their fellows, the papists, teach; so Gregory VII practised; so Aquinas taught, (2 of 2 q. 12, art. 2), Antonin. [sum. part 3, t. 22, ch. 3, sect. 7), “Thou hast put all things under the Pope’s feet,” oves, id est, Christianos; boves. Judceos et hereticos ; pecora, Paganos; so Navar. (bk. 1, ch. 13); Pagans have no jurisdiction. Jaco. Symanca, (de Catho. Instit., tit. 45, n. 25). “Catholica uxor heretico viro debitum reddere non tenetur.” Item, Constat, haereticum privatum esse omnidominio, naturali, civili, politico, naturali quod habet in filios, nam propter hceresin patris ejjiciuntur jilii sui juris, civili, quod habct in servos, ab eo enim scrvi liberantur, politico, quod rerum domini habcnt in sxtbditos, ita Bannes, (22. q. 12, art. 10); Gregor. de valent., 2 of 2, dis. 1, q. 12, p. 2, lod. Mol. to. 1, de just, et jur. tract. 2, dis. 29, v. 3).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | Question 41</cite>, p. 207</span></figcaption>

ooksonline.com/difference-of-religion-does-not-make-void-the-magistrates-authority/#:~:text=And%20it%20is%20most%20false%20that,tract.%202%2C%20dis.%2029%2C%20v.%203&amp;text=And%20it%20is%20most%20false%20that%20we%20join&amp;text=et%20jur.%20tract.%202%2C%20dis.%2029%2C%20v.%203" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0661567c68" data-kw="">
<blockquote><p>Now as to this sort of dependence which ministers have upon the magistrate, in the actual discharge of their office, for clearing thereof, distinguish next between the exercise of the ministry simply and in itself considered, and the circumstances of that exercise: Or distinguish subordination into that which is absolute and that which is only secundum quid, or in some certain respects. Now, as by this indulgence your ministers do not depend upon the prince essentially and derivatively as to their office and authority, and matter of their embassage; so neither simply and absolutely for the exercise of it (both these they have and hold immediately of Christ alone), but only and merely in regard of the circumstance and adjunct of the peaceableness and legal immunity of the public exercise of it in such and such places of his realm: Even as the exercise of the protestant religion, being authorized by law, depends upon him; and as the exercise of your ministry within any family depends upon the master of the family. And yourselves in your papers upon this subject acknowledge this kind of subordination and dependence (viz. in respect of the public, free, peaceable exercise of the ministry) to be not unlawful. To this [William] Apollonius also accords, [Jus majestatis circa sacra, 1642] part last [pp. 249–51], §2, ch. 3. Neither is it to be thought that this does subject the ministry, but the man; not the function, but the person, to the civil power, except it be (as some of yourselves say) in obliquo, indirectly and objectively, even as the other matters of God are, being objects about which his imperative and coercive power is conversant… [The indulged] consequently are Christ’s ambassadors and sent-servants still, even as you are; only they have the peaceableness and civil freedom of the public exercise of their function from the ruler: a thing they were and are bound to pray for, 1 Tim. 2:1–2, that under him they ‘may lead a quiet and peaceable life in all godliness and honesty;’ and consequently, or by parity of reason, in the exercise of their ministry. And if this may and should be prayed for, as it is his duty to grant it, so it cannot be their crime to accept it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead (London, 1681)</cite>, pp. 89–91</span></figcaption>

<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Please enjoy Aaron’s Rod (reprint, Sprinkle) p. 2. Gillespie is arguing against an Erastian:</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.”

eing%20unquestionably%20true%20of%20the&amp;text=it%2C%20and%20that%20it%20were%20more%20consulted%20with" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>

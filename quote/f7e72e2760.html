<blockquote><p>But perhaps there will not be wanting those who will furnish the [example of] the authority of the Turkish [Islamic] emperor over his subjects. I should wish these to have their answer in a single word: an empire of that description does not deserve to be called either kingly or human, but wholly barbarous, tyrannical, uncivilized and detestable, especially because whereas the other monarchies and empires, to however many faults they may have been subject, were still instruments suitable for the preservation of human society, it is obvious that on the contrary this Turkish tyranny is an awful scourge of God by means of which God in accordance with his just judgment threatens this world with its final ruin and overthrow.

Therefore, if there are men to be found today who are counsellors to kings so that these may fashion an example and an image of their rule from that source, I proclaim with a clear and loud voice that those Turks should be deemed the public enemies of humankind and should be cast out in banishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), pp 147-48.</span></figcaption>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<blockquote><p>For the Papists, they are not tolerated in Holland; The Jews are not only tolerated, but have the public exercise of their religion and their synagogues, viz. at Amsterdam. … It is a question propounded by Helvicus, An Judaei à Magistratu Christiano tolerandi, et quomodo tractandi? Whether the Jews be to be tolerated by the Christian magistrate, and how they are to be handled? (System Controvers. Theolog. quae Christianis cum Judaeis intercedunt, Elench. Jud. 8 et ult. Profecto excusari Magistratus Christianus non potest, si impune eorum blasphemias horrendas in Christum, et S.S. Trinitatem, totamque religionem Christianam, diutiùs oculo connivente toleret. [Certainly, the Christian magistrate cannot excuse himself if he should tolerate, with his eye winking, their horrible blasphemies against Christ, the most holy Trinity, and the whole Christian religion, with impunity, for a longer time.”] Idem, ibid. Amongst Gregory’s Epistles, there is one De Judaeis non persequendis [That the Jews are not to be persecuted].) He says it is a perplex[ed] question by reason of the different judgments. He propounds: First, diverse arguments of those which hold they are altogether to be cast out of a Christian commonwealth by reason of those horrible blasphemies which daily, both in their ordinary prayers and in their speeches they belch out against Christ, the Virgin Mary, our Faith, and all Christians in general, and for other reasons which he there alleges. Secondly, He urges other arguments to prove that the Jews are not to be cast out, but tolerated under the Christian magistrate, because by that means many of them may be converted by continual converse with the Christians, and the Scripture seems evidently to confirm that, Hos. 3:4; Zeph. 3:7; Lk. 21:24; Rom. 11:25-26, and because they may be serviceable to them against the pagans and for other reasons. He himself goes the middle way and lays down his opinion in certain propositions: First, It is better for Jews to live amongst Christians than under Turks or infidels. Secondly, The blasphemies of Jews are not to be tolerated, but to be prohibited and most severely punished by Christians. Thirdly, the Jews are to be esteemed among Christians as the servants of servants, that is so to be handled that they are exiles and cast off by God Himself. They are not to have any public office. They are not to practice that unjust usury for which they are so infamous amongst Christians. They are to have also (said he) some outward mark in their garments, by which they may be distinguished from others, and [are] to be forced to hear sermons. Many other cautions does he give in the receiving of them. As for the toleration of the Jews, whosoever they be that suffer the exercise of their religion with the blasphemies they commonly use against Christ, make themselves guilty of all their wickedness, which the Lord keep this land from, as well as from the abomination of the Mass. The Pope can tolerate the blasphemy of the Jews and the filthiness of all the courtesans and stews, and take a yearly rent of them for it, and for no respect will allow the exercise of our most holy religion either in his own dominions or wheresoever he may prevail against us. Traverse Answer to a Popish Treatise written to the Lords of the Council.</p></blockquote>

<blockquote><p>Now the vanity and falsehood of this religion may be proved thus: —

First, By the newness of it; for it is but of late years begun, and there was never any prophecy that did allow of such a prophet, or of the doctrine of such a one; and therefore he cometh in his own name, and so, consequently, not to be received.

Secondly, He did no miracle at his coming, and therefore no reason that any should believe in him. He spake unto the Saracens of himself, non sum miraculis, aut indiciis ad vos missus: I am not sent unto you with miracles and signs. There was no divine power shewed in all his practice.

Thirdly, It is manifest that Mahomet was a false prophet, because he said, that within three days after his death he should ascend into heaven, which was notoriously false, as before appeareth.

Fourthly, The religion of Mahomet is fleshly, consisting in natural delights and corporal pleasures, which shew that man, and not the divine Spirit of God, is the author thereof; for it is permitted the Saracens by that his law to have four wives (though these be of nigh kin), yea, five, marrying them virgins; and to take besides as many of them which they have bought and taken captives, as their ability will serve to maintain.

The paradise likewise promised to his followers is this, namely, they shall have garments of silk, with all sorts of colours; bracelets of gold and amber; parlours and banqueting-houses upon floods and rivers; vessels of gold and silver, angels serving them, bringing in gold, milk, silver, wine; lodgings furnished, cushions, pillows, and down-beds; most beautiful women to accompany them, maidens and virgins with twinkling eyes; gardens and orchards, with arbours, fountains, springs, and all manner of pleasant fruit; rivers of milk, honey, and spiced wine; all manner of sweet odours, perfumes, and fragrant scents; and, to be short, whatsoever the flesh shall desire to eat.

Thus fleshly people have a fleshly religion, and a fleshly paradise to inhabit. But like prophet, like people, and like religion; for Mahomet himself was such a fleshly fellow, as that though modest ears are loath to hear, yet because the filthiness of this prophet may not be concealed, I must utter it. He committed buggery with an ass; Bonfinius writeth it. Again, he committed adultery with another man’s wife, that upon displeasure was from her husband; and when he perceived the murmur of the people, he feigned that he had received a paper from heaven, wherein it was permitted him so to do, to the end he might beget prophets and worthy men.

Again, Mahomet (as Caelius reporteth), had forty wives; and further, he gloried of himself, that it was given him from above to exceed ten men (saith Cleonard), fifty men (saith Antoninus), in carnal lust and venery. Avicenna, one of Mahomet’s own sect, is himself brought in disliking of this religion, for this reason, because Mahomet (saith he) hath given us a law, which sheweth the perfection of felicity to consist in those things which concern the body; whereas the wise and sages of old had a greater desire to express the felicity of the soul than of the body. As for the bodily felicity, though it were granted them, yet they regarded not, neither esteemed it, in comparison of the felicity which the soul requireth. His paradise and doctrine is such, as there seemeth small difference between epicurism, atheism, and Mahometanism.

Fifth, Mahomet’s law is a tyrannical law; for he made it death to dispute of it; and if any man speak against it (saith he), Proditore occidatur, let him be traitorously put to death. And again, Sine audientia occidatur; let him be put to death without coming to his answer. Qua samctione (saith Sabellicus) palam, fecit nihil sinceri in ea lege esse, &amp;c. By which decree he manifested, that there is nothing sincere in that law, &amp;c. Moreover, he wrote in the Arabian tongue, and taught his followers, that his religion, A gladio ccepit, per gladium tenetur, et in gladio terminatur, began by the sword, is holden by the sword, and is finished or ended in the sword; which sheweth that the sword and arm of flesh is all the author and protector that his religion hath. Again, Mahomet made this law amongst them, saying. He that slayeth his enemy, or is slain of his enemy, let him enter and possess paradise. He spake like a man with a carnal spirit; teaching revenge to the uttermost, and promising paradise to such but not proof of a divine Spirit appeareth in him.

Sixth, As Mahomet’s religion is defended by force of sword and fraud, insomuch as he made it death to call it into question; so likewise did it begin, as by the force of sword, so likewise by notable fraud, and was established through wiles, deceit, subtilty, and lies. For, first, he having the falling-sickness, persuaded his wife and others that it was the power of God, and the presence of the angel Gabriel, that caused him to fall down. Sergius the heretical monk was at hand, and bare false witness to the same (saith Zonaras). He told them that the same dove which he taught to feed at his ear, was sometimes an angel, and sometimes the Holy Ghost. He had three companions all of a confederacy, to devise and face out lies with him. When he perceived that men gave ear to him, he feigned that the angel Gabriel had carried him to Jerusalem, and thence to have lifted him up to heaven, and there to have learned his law.

He made the Saracens believe, that before God made the world, there was written in the throne of God, There is no God, but the God of Mahomet. When he had framed his Alcoran, and bound it up fair, he caused secretly a wild ass to be taken, and the book to be bound about his neck; and as he preached unto the people, upon a sudden he stood amazed, as if some great secrecy was revealed to him from above, and brake out, and told the people. Behold, God hath sent you a law from heaven; go to such a desert, there you shall find an ass, and a book tied about his neck. The people ran in great haste, they found it so as he had said; they take the ass, they bring the book, they honour the prophet.

Touching divorced and separated wives, he told the Saracens he had received a paper from heaven. He used soothsaying and divination, the which at Fessa, a city of Mauritania, unto this day is called Zarragia. He persuaded his followers, that at the end of the world he should be transformed into the form of a mighty ram, full of locks and long fleeces of wool; and that all that held of his law, should be as fleas shrouding themselves in his fleeces, and that he would jump into heaven, and so convey them all thither. These, and such like were his flights, to beguile a foolish, rude, and barbarous country people; the foolery, pride, and vanity of whose religion, I trust every one doth sufficiently perceive.

Seventhly, Mahomet’s religion is no true religion, but a mere device of his own, and of three others his false conspirators; for he hath patched together his Alcoran of the doctrine of heathens, Indians, and Arabians; of superstitious Jews, of Rechabites, of false Christians and heretics, as Nestorius, Sabellians, Manichees, Arians, Cerinthians, Macedonians, Eunomians, and Nicolaites, of illusions and inventions of their own; and lastly, for further credit, he borrowed some out of the Old and New Testament. But God will not thus be served; for he delivered his mind of old unto Israel, and he is not changed, but continueth the same God still. ‘Ye shall not,’ saith God, ‘do every man what seemeth him good in his own eyes. Whatsoever I command you, take heed you do it; thou shalt put nothing thereto, nor take aught therefrom,’ Deut. xii.

Satan being conjured to deliver the truth of the Alcoran of Mahomet, said that therein were comprised twelve thousand lies, and the rest was truth; by all likelihood very little. And therefore conclude, that there is no evidence to prove Mahomet a true prophet; many prove him to be a false prophet, and blasphemous, and presumptuous; and his religion to be a wicked, carnal, absurd, and false religion, proceeding from a proud spirit, and human, subtle, and corrupt invention, and even from the devil, the crafty father of lies, a murderer and man-killer from the beginning. And so much hereof may suffice.</p></blockquote>

+most+beautiful+women+to+accompany+them%2C+maidens+and+virgins+with+twinkling+eyes%3B+gardens+and+orchards%2C+with+arbours%2C+fountains%2C+springs%2C+and+all+manner+of+pleasant+fruit%3B+rivers+of+milk%2C+honey%2C+and+spiced+wine%3B+all+manner+of+sweet+odours%2C+perfumes%2C+and+fragrant+scents%3B+and%2C+to+be+short%2C+whatsoever+the+flesh+shall+desire+to+eat.%0A%0AThus+fleshly+people+have+a+fleshly+religion%2C+and+a+fleshly+paradise+to+inhabit.+But+like+prophet%2C+like+people%2C+and+like+religion%3B+for+Mahomet+himself+was+such+a+fleshly+fellow%2C+as+that+though+modest+ears+are+loath+to+hear%2C+yet+because+the+filthiness+of+this+prophet+may+not+be+concealed%2C+I+must+utter+it.+He+committed+buggery+with+an+ass%3B+Bonfinius+writeth+it.+Again%2C+he+committed+adultery+with+another+man%E2%80%99s+wife%2C+that+upon+displeasure+was+from+her+husband%3B+and+when+he+perceived+the+murmur+of+the+people%2C+he+feigned+that+he+had+received+a+paper+from+heaven%2C+wherein+it+was+permitted+him+so+to+do%2C+to+the+end+he+might+beget+prophets+and+worthy+men.%0A%0AAgain%2C+Mahomet+%28as+Caelius+reporteth%29%2C+had+forty+wives%3B+and+further%2C+he+gloried+of+himself%2C+that+it+was+given+him+from+above+to+exceed+ten+men+%28saith+Cleonard%29%2C+fifty+men+%28saith+Antoninus%29%2C+in+carnal+lust+and+venery.+Avicenna%2C+one+of+Mahomet%E2%80%99s+own+sect%2C+is+himself+brought+in+disliking+of+this+religion%2C+for+this+reason%2C+because+Mahomet+%28saith+he%29+hath+given+us+a+law%2C+which+sheweth+the+perfection+of+felicity+to+consist+in+those+things+which+concern+the+body%3B+whereas+the+wise+and+sages+of+old+had+a+greater+desire+to+express+the+felicity+of+the+soul+than+of+the+body.+As+for+the+bodily+felicity%2C+though+it+were+granted+them%2C+yet+they+regarded+not%2C+neither+esteemed+it%2C+in+comparison+of+the+felicity+which+the+soul+requireth.+His+paradise+and+doctrine+is+such%2C+as+there+seemeth+small+difference+between+epicurism%2C+atheism%2C+and+Mahometanism.%0A%0AFifth%2C+Mahomet%E2%80%99s+law+is+a+tyrannical+law%3B+for+he+made+it+death+to+dispute+of+it%3B+and+if+any+man+speak+against+it+%28saith+he%29%2C+Proditore+occidatur%2C+let+him+be+traitorously+put+to+death.+And+again%2C+Sine+audientia+occidatur%3B+let+him+be+put+to+death+without+coming+to+his+answer.+Qua+samctione+%28saith+Sabellicus%29+palam%2C+fecit+nihil+sinceri+in+ea+lege+esse%2C+%26c.+By+which+decree+he+manifested%2C+that+there+is+nothing+sincere+in+that+law%2C+%26c.+Moreover%2C+he+wrote+in+the+Arabian+tongue%2C+and+taught+his+followers%2C+that+his+religion%2C+A+gladio+ccepit%2C+per+gladium+tenetur%2C+et+in+gladio+terminatur%2C+began+by+the+sword%2C+is+holden+by+the+sword%2C+and+is+finished+or+ended+in+the+sword%3B+which+sheweth+that+the+sword+and+arm+of+flesh+is+all+the+author+and+protector+that+his+religion+hath.+Again%2C+Mahomet+made+this+law+amongst+them%2C+saying.+He+that+slayeth+his+enemy%2C+or+is+slain+of+his+enemy%2C+let+him+enter+and+possess+paradise.+He+spake+like+a+man+with+a+carnal+spirit%3B+teaching+revenge+to+the+uttermost%2C+and+promising+paradise+to+such+but+not+proof+of+a+divine+Spirit+appeareth+in+him.%0A%0ASixth%2C+As+Mahomet%E2%80%99s+religion+is+defended+by+force+of+sword+and+fraud%2C+insomuch+as+he+made+it+death+to+call+it+into+question%3B+so+likewise+did+it+begin%2C+as+by+the+force+of+sword%2C+so+likewise+by+notable+fraud%2C+and+was+established+through+wiles%2C+deceit%2C+subtilty%2C+and+lies.+For%2C+first%2C+he+having+the+falling-sickness%2C+persuaded+his+wife+and+others+that+it+was+the+power+of+God%2C+and+the+presence+of+the+angel+Gabriel%2C+that+caused+him+to+fall+down.+Sergius+the+heretical+monk+was+at+hand%2C+and+bare+false+witness+to+the+same+%28saith+Zonaras%29.+He+told+them+that+the+same+dove+which+he+taught+to+feed+at+his+ear%2C+was+sometimes+an+angel%2C+and+sometimes+the+Holy+Ghost.+He+had+three+companions+all+of+a+confederacy%2C+to+devise+and+face+out+lies+with+him.+When+he+perceived+that+men+gave+ear+to+him%2C+he+feigned+that+the+angel+Gabriel+had+carried+him+to+Jerusalem%2C+and+thence+to+have+lifted+him+up+to+heaven%2C+and+there+to+have+learned+his+law.%0A%0AHe+made+the+Saracens+believe%2C+that+before+God+made+the+world%2C+there+was+written+in+the+throne+of+God%2C+There+is+no+God%2C+but+the+God+of+Mahomet.+When+he+had+framed+his+Alcoran%2C+and+bound+it+up+fair%2C+he+caused+secretly+a+wild+ass+to+be+taken%2C+and+the+book+to+be+bound+about+his+neck%3B+and+as+he+preached+unto+the+people%2C+upon+a+sudden+he+stood+amazed%2C+as+if+some+great+secrecy+was+revealed+to+him+from+above%2C+and+brake+out%2C+and+told+the+people.+Behold%2C+God+hath+sent+you+a+law+from+heaven%3B+go+to+such+a+desert%2C+there+you+shall+find+an+ass%2C+and+a+book+tied+about+his+neck.+The+people+ran+in+great+haste%2C+they+found+it+so+as+he+had+said%3B+they+take+the+ass%2C+they+bring+the+book%2C+they+honour+the+prophet.%0A%0ATouching+divorced+and+separated+wives%2C+he+told+the+Saracens+he+had+received+a+paper+from+heaven.+He+used+soothsaying+and+divination%2C+the+which+at+Fessa%2C+a+city+of+Mauritania%2C+unto+this+day+is+called+Zarragia.+He+persuaded+his+followers%2C+that+at+the+end+of+the+world+he+should+be+transformed+into+the+form+of+a+mighty+ram%2C+full+of+locks+and+long+fleeces+of+wool%3B+and+that+all+that+held+of+his+law%2C+should+be+as+fleas+shrouding+themselves+in+his+fleeces%2C+and+that+he+would+jump+into+heaven%2C+and+so+convey+them+all+thither.+These%2C+and+such+like+were+his+flights%2C+to+beguile+a+foolish%2C+rude%2C+and+barbarous+country+people%3B+the+foolery%2C+pride%2C+and+vanity+of+whose+religion%2C+I+trust+every+one+doth+sufficiently+perceive.%0A%0ASeventhly%2C+Mahomet%E2%80%99s+religion+is+no+true+religion%2C+but+a+mere+device+of+his+own%2C+and+of+three+others+his+false+conspirators%3B+for+he+hath+patched+together+his+Alcoran+of+the+doctrine+of+heathens%2C+Indians%2C+and+Arabians%3B+of+superstitious+Jews%2C+of+Rechabites%2C+of+false+Christians+and+heretics%2C+as+Nestorius%2C+Sabellians%2C+Manichees%2C+Arians%2C+Cerinthians%2C+Macedonians%2C+Eunomians%2C+and+Nicolaites%2C+of+illusions+and+inventions+of+their+own%3B+and+lastly%2C+for+further+credit%2C+he+borrowed+some+out+of+the+Old+and+New+Testament.+But+God+will+not+thus+be+served%3B+for+he+delivered+his+mind+of+old+unto+Israel%2C+and+he+is+not+changed%2C+but+continueth+the+same+God+still.+%E2%80%98Ye+shall+not%2C%E2%80%99+saith+God%2C+%E2%80%98do+every+man+what+seemeth+him+good+in+his+own+eyes.+Whatsoever+I+command+you%2C+take+heed+you+do+it%3B+thou+shalt+put+nothing+thereto%2C+nor+take+aught+therefrom%2C%E2%80%99+Deut.+xii.%0A%0ASatan+being+conjured+to+deliver+the+truth+of+the+Alcoran+of+Mahomet%2C+said+that+therein+were+comprised+twelve+thousand+lies%2C+and+the+rest+was+truth%3B+by+all+likelihood+very+little.+And+therefore+conclude%2C+that+there+is+no+evidence+to+prove+Mahomet+a+true+prophet%3B+many+prove+him+to+be+a+false+prophet%2C+and+blasphemous%2C+and+presumptuous%3B+and+his+religion+to+be+a+wicked%2C+carnal%2C+absurd%2C+and+false+religion%2C+proceeding+from+a+proud+spirit%2C+and+human%2C+subtle%2C+and+corrupt+invention%2C+and+even+from+the+devil%2C+the+crafty+father+of+lies%2C+a+murderer+and+man-killer+from+the+beginning.+And+so+much+hereof+may+suffice.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+God%E2%80%99s+Arrow+Against+Atheism+and+Irreligion%2C+%281593%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A+409-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72e665b024.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72e665b024.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/28/henry-smith-seven-reasons-why-islam-is-a-false-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Fourth, it is asked whether they are to be compelled to the Faith by threats and certain penalties. That they are not, it seems: a. For it is said in the Council of Toledo: “The holy synod has ordered concerning the Jews.” And this same thing Gregory says: henceforth to force no one into believing. For just as a man, obeying the serpent by his own will of choice, perished, so, when the grace of God calls him, each one is saved by believing through the conversion of his own mind. Therefore they are not to be driven by force, but rather to be given themselves. Gregory. It remains, therefore, that they are not to be compelled to the faith. b. Likewise, Augustine says: “We can do something unwillingly, yet we cannot believe unless of our own will one is to be led to the faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c2ea72c458" data-kw="">
<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (covetousness as idolatry)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b7ba306fb" data-kw="">
<blockquote><p>This is one part of atheism and self-idolatry, to magnify ourselves, with the forgetfulness and to the injury of our Creator.… In ascribing the glory of what we do or have to ourselves, to our own wisdom, power, virtue, etc.… He regards Babylon as his heaven and himself as his idol, as if he were all and God nothing.… So much as we sacrifice to our own credit, to the dexterity of our hands, or the sagacity of our wit, we detract from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (self-idolatry)</span></figcaption>

</figure><figure class="quote" id="q-19caa75f31" data-kw="Author of sin">
<blockquote><p>Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.</p></blockquote>

</figure><figure class="quote" id="q-858e5287fa" data-kw="Author of sin">
<blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 27 (on providence)</span></figcaption>

</figure><figure class="quote" id="q-19470c5e06" data-kw="Author of sin">
<blockquote><p>Yet we are able to reconcile them easily enough, if we distinguish within sin its material element, namely, the habit or act that is the substrate of the wickedness, with which, inasmuch as it is physically good, God is not able not to concur as the efficient cause, without casting aside his own independence (Acts 17:28; Rom. 11:36), and its formal element, lawlessness (1 John 3:4), through which the act or habit is sin, whose author he cannot be, because the one set above all law cannot transgress the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

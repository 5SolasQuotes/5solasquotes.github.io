<main class="wrap"><figure class="quote" id="q-df48ea1b24" data-kw="">
<blockquote><p>But they differ, in that the pastor labors in the word of exhortation, that is, by the gift of wisdom applies the word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labors in the word of doctrine, that is, without such applications as the pastor uses; by simple teaching he preserves the truth and sound interpretation of the Scriptures, against all heresy and error. The ruling elder doth neither of these, but labors in the government and policy of the church only. The Apostle has distinguished these three sorts of elders, 1 Tim. 5.17, “Let elders that rule well be counted worthy of double honor, especially they who labor in the word and doctrine.” Where, as [Theodore] Beza notes, he distinguished the word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7,8, he distinguishes teaching from exhortation; and 1 Cor. 12:8, puts “the word of wisdom,” and “the word of knowledge,” for two different things. Now, besides those elders which labor in the word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the word nor doctrine, but in ruling well. Hence it appears how truly the Book of Policy, ch. 2, says, That there are four ordinary, perpetual, and necessary offices in the church, the office of the pastor, the doctor, the elder, and the deacon; and that no other office, which is not one of these four, ought to be received, or suffered in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, ch. 2:</span></figcaption>

<blockquote><p>Mr. Hooker [wrote]: ”An eminently gifted man in an island, where no pastors are, is no less (says Mr. Rutherford) tied in conscience in the extraordinary employment of his calling than if he were formally ordained and chosen their pastor. In some extraordinary cases a gift and Christian love ties even as much to onerousness [difficulty] in using means to save as the office itself.’ See what I add in that place,’ (Mr. Hooker says) ‘then this gifted man in an island, in using his general calling as a Christian, destroys his particular [calling] as a merchant, and turn[s] minister. 2. This is to confound the general and particular calling.’ [Rutherford’s] Answer: Not at all, for in this case, the extraordinary necessity of gaining souls, when other pastors cannot be had, and ordination and election by that means are invincibly wanting hic &amp; nunc [hear and now], turns his Christian calling in place and room of the particular calling of a pastor; and so Mr. Rutherford said well, that in some extraordinary case like this, ‘The naked relation of jurisdiction adds nothing to [the] care and onerousness in point of labor by preaching the Gospel.&#x27;</p></blockquote>

<blockquote><p>7. A calling to the ministry is either such as wants the essentials, as gifts in any messenger, and the Churches’ consent, or these who occupy the room of the Church, the Church consenting, such a minister is to be reputed for no minister. Or. 2. An entry to a calling, or a calling, where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas who entered by favor and money, and contrary to the Law was High-Priest but for a year: yet was a true High-Priest, and prophesied as the High-Priest.

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud, the ordinance of God is conferred upon him and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>

</figure><figure class="quote" id="q-2d7bd346a7" data-kw="">
<blockquote><p>Notwithstanding of all the multiplicity of Popish orders, yet Peter Lombard (pt. 4, distinction 4) treading the vestiges of the primitive simplicity, did observe that the apostles left only two sacred orders to be perpetual in the Church, the order of deacons and the order of elders. The administration of deacons is exercised about things bodily. The administration of elders about things spiritual. The former about the goods: the latter about the government of the Church. Now elders are of three sorts: 1. Preaching Elders, or Pastors, 2. Teaching Elders or Doctors, 3. Ruling Elders. All these are elders, because they have voice in presbyteries and all assemblies of the Church, and the government of the Church is incumbent to them all: nor only to the pastor and elder, but to the doctor also. The bishop of Dune, in his Examen conjurationis Scoticae [‘Examination of the Scottish Conjuration’], p. 35, alleges that our Church of Scotland did never yet determine whether doctors and deacons have right of voicing in the consistories and assemblies of the Church. But had he read our book of Policy, he might have found that it excludes deacons from being members of presbyteries and assemblies, ch. 8, but admits doctors into the same, ch. 5. The doctor being an elder, as said is, should assist the pastor in the government of the Kirk and concur with the elders, his brethren, in all assemblies, by reason the interpretation of the Word, which is [the] only judge in ecclesiastical matters, is committed to his charge. But they differ in that the pastor labors in the Word of exhortation, that is, by the gift of wisdom, applies the Word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labours in the Word of doctrine, that is, without such applications as the pastor uses, by simple teaching he preserves the truth and sound interpretation of the Scriptures against all heresy and error. The ruling elder does neither of these, but labours in the government and policy of the Church only. The apostle has distinguished these three sorts of elders, 1 Tim. 5:17, ‘Let elders that rule well be counted worthy of double honour, especially they who labour in the Word and doctrine,’ where, as Beza notes, he distinguishes the Word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7-8, he distinguishes teaching from exhortation: and 1 Cor. 12:8 puts the Word of wisdom and the word of knowledge for two different things. Now beside those elders which labour in the Word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the Word nor doctrine, but in ruling well.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Notwithstanding of all the multiplicity of Popish orders, yet Peter Lombard (pt. 4, distinction 4) treading the vestiges of the primitive simplicity, did observe that the apostles left only two sacred orders to be perpetual in the Church, the order of deacons and the order of elders. The administration of deacons is exercised about things bodily. The administration of elders about things spiritual. The former about the goods: the latter about the government of the Church. Now elders are of three sorts: 1. Preaching Elders, or Pastors, 2. Teaching Elders or Doctors, 3. Ruling Elders. All these are elders, because they have voice in presbyteries and all assemblies of the Church, and the government of the Church is incumbent to them all: nor only to the pastor and elder, but to the doctor also. The bishop of Dune, in his Examen conjurationis Scoticae [‘Examination of the Scottish Conjuration’], p. 35, alleges that our Church of Scotland did never yet determine whether doctors and deacons have right of voicing in the consistories and assemblies of the Church. But had he read our book of Policy, he might have found that it excludes deacons from being members of presbyteries and assemblies, ch. 8, but admits doctors into the same, ch. 5. The doctor being an elder, as said is, should assist the pastor in the government of the Kirk and concur with the elders, his brethren, in all assemblies, by reason the interpretation of the Word, which is [the] only judge in ecclesiastical matters, is committed to his charge. But they differ in that the pastor labors in the Word of exhortation, that is, by the gift of wisdom, applies the Word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labours in the Word of doctrine, that is, without such applications as the pastor uses, by simple teaching he preserves the truth and sound interpretation of the Scriptures against all heresy and error. The ruling elder does neither of these, but labours in the government and policy of the Church only. The apostle has distinguished these three sorts of elders, 1 Tim. 5:17, ‘Let elders that rule well be counted worthy of double honour, especially they who labour in the Word and doctrine,’ where, as Beza notes, he distinguishes the Word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7-8, he distinguishes teaching from exhortation: and 1 Cor. 12:8 puts the Word of wisdom and the word of knowledge for two different things. Now beside those elders which labour in the Word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the Word nor doctrine, but in ruling well.”

— Geroge Gillespie, An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders…. (Edinburgh: Bryson, 1641), ch. 2, pp. 8-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNotwithstanding+of+all+the+multiplicity+of+Popish+orders%2C+yet+Peter+Lombard+%28pt.+4%2C+distinction+4%29+treading+the+vestiges+of+the+primitive+simplicity%2C+did+observe+that+the+apostles+left+only+two+sacred+orders+to+be+perpetual+in+the+Church%2C+the+order+of+deacons+and+the+order+of+elders.+The+administration+of+deacons+is+exercised+about+things+bodily.+The+administration+of+elders+about+things+spiritual.+The+former+about+the+goods%3A+the+latter+about+the+government+of+the+Church.+Now+elders+are+of+three+sorts%3A+1.+Preaching+Elders%2C+or+Pastors%2C+2.+Teaching+Elders+or+Doctors%2C+3.+Ruling+Elders.+All+these+are+elders%2C+because+they+have+voice+in+presbyteries+and+all+assemblies+of+the+Church%2C+and+the+government+of+the+Church+is+incumbent+to+them+all%3A+nor+only+to+the+pastor+and+elder%2C+but+to+the+doctor+also.+The+bishop+of+Dune%2C+in+his+Examen+conjurationis+Scoticae+%5B%E2%80%98Examination+of+the+Scottish+Conjuration%E2%80%99%5D%2C+p.+35%2C+alleges+that+our+Church+of+Scotland+did+never+yet+determine+whether+doctors+and+deacons+have+right+of+voicing+in+the+consistories+and+assemblies+of+the+Church.+But+had+he+read+our+book+of+Policy%2C+he+might+have+found+that+it+excludes+deacons+from+being+members+of+presbyteries+and+assemblies%2C+ch.+8%2C+but+admits+doctors+into+the+same%2C+ch.+5.+The+doctor+being+an+elder%2C+as+said+is%2C+should+assist+the+pastor+in+the+government+of+the+Kirk+and+concur+with+the+elders%2C+his+brethren%2C+in+all+assemblies%2C+by+reason+the+interpretation+of+the+Word%2C+which+is+%5Bthe%5D+only+judge+in+ecclesiastical+matters%2C+is+committed+to+his+charge.+But+they+differ+in+that+the+pastor+labors+in+the+Word+of+exhortation%2C+that+is%2C+by+the+gift+of+wisdom%2C+applies+the+Word+to+the+manners+of+his+flock%2C+an

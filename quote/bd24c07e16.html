<main class="wrap"><figure class="quote" id="q-bd24c07e16" data-kw="">
<blockquote><p>But we must remember that our new obedience, which is the fruit of our redemption, standeth in the study of piety, that is, in the truth of our desires, uprightness of our will, and purpose, sincerity of our care and endeavours, rather then in the perfect performance, the Lord in his children accepting the will for the deed.

By which desire, will, and endeavour, though we do not perfectly fulfil the law, yet we may be truly said to keep it. And if we have this unfained desire, sincere purpose, and upright endeavour to please God in the duties of piety and charity; we shall be accepted of God, according to the covenant of grace, as true worshippers of God in holiness &amp; righteousness. This caution is carefully to be remembered; otherwise, the greatest part of true Christians might seem to be excluded out of the covenant of grace, and out of the number of them that are redeemed by CHRIST.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), p. 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa41277d16" data-kw="">
<blockquote><p>The communication of grace effectual, producing infallibly the good things proposed and promised in the minds and hearts of men, belonged not unto that covenant. If, therefore, there be no more in the making of the new covenant but only the adding of more forcible outward means and motives, more suitable unto our reasons, and meet to work on our affections, it differs only in some unassignable degrees from the former. But this is directly contrary unto the promise in the prophet, that it shall not be according unto it, or of the same kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 178</span></figcaption>

</figure><figure class="quote" id="q-184a168527" data-kw="">
<blockquote><p>The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ [Rev. 3:20] it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians</cite>, (London: Parker, 1679), ch. 4, pp. 48-49</span></figcaption>

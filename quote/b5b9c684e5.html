<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>

<blockquote><p>25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>

<blockquote><p>Some that live in countries where none in twenty miles openly use the New one, come to Richard Baxter for counsel; he desires them to bring one of the contrary judgment and judge when they hear both: He tells them that: 1. They should keep up the New Translation as far as they can in God’s public worship, while the hurt will not be greater than the benefit. 2. That when they have no public church or worship to join with, but what uses the Old one, they should rather join with such than none, as also when they cannot have the New one without more hurt than benefit. 3. And that while they can have the New one, they should not renounce communion with the churches that use the Old one, as separating from it as unlawful, but only disown the faults of the Old one, while they disown not the communion of the churches in the use of it. The other says: 1. That it is a cursed thing to offer God a worse [worship] while we have better. 2. That we are sworn [by the SL&amp;C] against it.¹ ¹ [The SL&amp;C does not mention the KJV, but the argument is that the KJV is held (by them) to be part of the reformation, or the reforming process, that the SL&amp;C binds to.] 3. That it is false worship and obeying man before God. 4. That we [the ones who only use the New translation] do but keep our possession, which they would put us out of, and it’s they that separate from us, and not we from them. 5. That we keep to God’s Word, which is the only rule. And therefore communion with the Old Translation is unlawful, and we should rather suffer death. Baxter answers: I. (1) That it is a cursed thing to give God no public worship because we cannot have the New Translation, and to live like atheists if we cannot have what we would. None is worse than the Old. Family worship without church worship is worse than an Old Translation. (2) And that it is not we that offer God the worse before the better; it is they that exclude the better, which we protest against, having not our choice. II. That he that sware [1.] to give over all church worship unless he have the New Translation, swore wickedly like an atheist; and he that swore [2.] to communicate with no church that used the Old Translation, swore wickedly like a schismatic; and he that swore [3.] that God’s providence should never return him to a necessity of using the Old,¹ swore blasphemously, as if he could have governed the world against God. ¹ [Note that such conditions are not in the SL&amp;C. See also ‘All Vows are Qualified’ and ‘Vows can Never Bind Beyond God’s Law’.] III. That all worship is so far false as it is faulty; That to forsake all public worship when we cannot have the better translation is to be righteous, unrighteously, over much [Eccl. 7:16], and too little [righteous], and to disobey both God and man. IV. Keep your possession as long as you can without more hurt than good. I am not one that ever strove to take it from you. But do your brethren in prison enjoy public worship? You’ll say, ‘They do better. It’s easier bearing their imprisonment, poverty and death than your own.’ But what shall ten parts of the kingdom do that must have the Old Translation or none? You’ll say, ‘I suppose, they may give over all church worship as impossible and take up with family worship.’ But stay: 1. Must you not first prove the Old so bad as that no-church worship is better? Have you proved this? 2. Will not your reason prove that we must also separate from you? Have not weak ministers as bad faults as a weak translation? 3. What’s become then of your saying, ‘We had possession’? Have they possession of better that have none at all? Or will you be without all, because you had once possession of better? And will it excuse your ungodliness that you can lay the blame on them that dispossessed you? Or if they be schismatics for so using you, does it follow that you are none, if you persuade all to separate from all God’s Church worship rather than join where the Old Translation is used? V. God’s Word is the rule, but only a general rule for words, modes and circumstances. To love God and our neighbour and the unity of the Church are his greatest commands. Go learn what these mean. To violate these and forsake all Church worship, if you cannot have the best translation, is not to keep to the rule, but most grossly to violate it in the greatest commands against many Scripture admonitions which vehemently urge you to love and unity.</p></blockquote>

bad+as+that+no-church+worship+is+better%3F+Have+you+proved+this%3F+2.+Will+not+your+reason+prove+that+we+must+also+separate+from+you%3F+Have+not+weak+ministers+as+bad+faults+as+a+weak+translation%3F+3.+What%E2%80%99s+become+then+of+your+saying%2C+%E2%80%98We+had+possession%E2%80%99%3F+Have+they+possession+of+better+that+have+none+at+all%3F+Or+will+you+be+without+all%2C+because+you+had+once+possession+of+better%3F+And+will+it+excuse+your+ungodliness+that+you+can+lay+the+blame+on+them+that+dispossessed+you%3F+Or+if+they+be+schismatics+for+so+using+you%2C+does+it+follow+that+you+are+none%2C+if+you+persuade+all+to+separate+from+all+God%E2%80%99s+Church+worship+rather+than+join+where+the+Old+Translation+is+used%3F+V.+God%E2%80%99s+Word+is+the+rule%2C+but+only+a+general+rule+for+words%2C+modes+and+circumstances.+To+love+God+and+our+neighbour+and+the+unity+of+the+Church+are+his+greatest+commands.+Go+learn+what+these+mean.+To+violate+these+and+forsake+all+Church+worship%2C+if+you+cannot+have+the+best+translation%2C+is+not+to+keep+to+the+rule%2C+but+most+grossly+to+violate+it+in+the+greatest+commands+against+many+Scripture+admonitions+which+vehemently+urge+you+to+love+and+unity.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reformation+%26+Conformity+%7C+Catholic+Communion+Doubly+Defended+by+Dr.+Owen%E2%80%99s+Vindicator+%26+Richard+Baxter%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+5%2C+%E2%80%98A+comparison+of+the+use+of+a+faulty+translation+of+the+Scripture+and+a+faulty+liturgy%E2%80%99+%7C+Seeking+Reformation%2C+Occasional+Conformity+%26+Covenanting&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cc1d43156.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8cc1d43156.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Some%20that%20live%20in%20countries%20where,urge%20you%20to%20love%20and%20unity&amp;text=Some%20that%20live%20in%20countries%20where%20none%2 </figure><figure class="quote" id="q-c240066799" data-kw="">
<blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>

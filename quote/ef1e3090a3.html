<main class="wrap"><figure class="quote" id="q-ef1e3090a3" data-kw="">
<blockquote><p>Whoever has this weak faith can truly affirm that they believe all their sins are forgivable: And that they desire their condemnation, but they dare not yet affirm without doubt that they have been forgiven; nevertheless, divine mercy does not fail or forsake them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, pp. 142-45, 171-75 Latin | And therefore, faith should be defined not only in general and in its highest degrees, but also its various degrees and measures should be declared; so that those who are weak can truly and correctly learn about their state. These are the same author’s words, which he extensively confirms in the treatise titled The Mustard Seed; where after asserting that firm faith is that which causes full apprehension and persuasion of God’s mercy in Christ and that this is not granted to all; therefore, there is a lower degree of faith, which is true faith, although weak and small, he adds the following words:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

owing+words%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef1e3090a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef1e3090a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/assurance/#:~:text=Whoever%20has%20this%20weak%20faith%20can,does%20not%20fail%20or%20forsake%20them&amp;text=Whoever%20has%20this%20weak%20faith%20can%20truly%20affirm&amp;text=divine%20mercy%20does%20not%20fail%20or%20forsake%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6cfb5c7e5" data-kw="">
<blockquote><p>Assurance of the love of God never produces self-complacency or pride; but always humility, self-abasement, wonder, gratitude, and praise. The believer sees that the mysterious fountain of this love is in the divine mind; it is not in himself, who is ungodly and a sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, rev. ed., 1886, ch. 5, Remarks</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span><span class="t"><a href="../topics/the-christian-life/humility-and-meekness.html">Humility and Meekness</a> › <a href="../topics/the-christian-life/humility-and-meekness/humility.html">Humility</a></span></div>
<div class="actions"><button class="copy" data-copy="“Assurance of the love of God never produces self-complacency or pride; but always humility, self-abasement, wonder, gratitude, and praise. The believer sees that the mysterious fountain of this love is in the divine mind; it is not in himself, who is ungodly and a sinner.”

</figure><figure class="quote" id="q-980d9f5504" data-kw="">
<blockquote><p>VIII. You will say, ‘How may I know that I am in a state of grace, since it is so important to discern this?’ Surely the apostle did not warn in vain that we should take care not to seem to have received the grace of God in vain (2 Cor 6:1). But they have received it in vain, who, seeming to have received it, either experience or show no power of it, or even fall away from that which they seemed to have received (Heb 12:15). Therefore you will know in this way that you are what you profess: 1. If you know through faith that you are in Christ, the fount and origin of grace (Rom 5:1 – Therefore, since we have been justified by faith, we have peace with God through our Lord Jesus Christ, 8:1 – There is therefore now no condemnation for those who are in Christ Jesus). 2. From a sense of reconciliation with God in your soul, whence also we approach the throne of grace with confidence (Rom 4:16, Luke 1:30 – you have found favor with God, Acts 7:46). 3. From the testimony of the Holy Spirit certifying the soul of it (Rom 8:16, Eph 4:30). 4. Finally from the holiness of life agreeing with the state of grace. For grace is a sanctifying grace, and is so incompatible with sin that the kingdom of grace and of sin cannot abide in the same seat, nor can anyone be at the same time under grace and under sin (Rom 6:14 – For sin will have no dominion over you, since you are not under law but under grace, v.22 – But now that you have been set free from sin and have become slaves of God, the fruit you get leads to sanctification). Jude v. 4 – ungodly people, who pervert the grace of our God into sensuality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, (Leiden: Johann Elsevir, 1664) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-fe9c151488" data-kw="">
<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope; but an infallible assurance of faith founded upon the divine truth of the promises of salvation, the inward evidence of those graces unto which these promises are made, the testimony of the Spirit of adoption witnessing with our spirits that we are the children of God, which Spirit is the earnest of our inheritance, whereby we are sealed to the day of redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.2</span></figcaption>

</figure><figure class="quote" id="q-6ec4f2af8a" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as, by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God’s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light: yet are they never utterly destitute of that seed of God, and life of faith, that love of Christ and the brethren, that sincerity of heart, and conscience of duty, out of which, by the operation of the Spirit, this assurance may, in due time, be revived; and by the which, in the meantime, they are supported from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.4</span></figcaption>

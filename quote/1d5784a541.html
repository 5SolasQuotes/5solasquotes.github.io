<main class="wrap"><figure class="quote" id="q-1d5784a541" data-kw="">
<blockquote><p>Quest. Here a question may be started, If there be such perfection in the knowledge of God, then he knows sin?

Resp. The Schools distinguish of a double knowledge in God. There is, 1. Scientia simplicis intelligentiae, a knowledge of pure intelligence, and thus he knows evil by a contrary good, as the light discovers the darkness. So we say, Rectum est index sui &amp; obliqui, The straight rule shews the crooked. 2. There is a knowledge of approbation. Thus God doth not know sin; for he hates it, he punisheth it. Christ was made sin, yet he knew no sin; he did know it so as to hate it, not so as to act or approve it.

I pass to the Reasons.

1. Reason. From his creation; God is the Father of lights, therefore must needs see. It is his own Argument, He that planted the ear, shall he not hear? he that formed the eye, shall he not see? He that makes a Watch, knows all the pins and wheels in it, and though these wheels move cross one to another, he knows the true and perfect motion of the Watch, and the spring that sets these wheels a going; He that formed the eye, shall he not see? Man may be compared to a spiritual Watch. The affections are the wheels; the heart is the spring; the motion of this Watch is false; the heart is deceitful; but God that made this watch knows the true motion of it (be it never so false) and the spring that sets the wheels a going. God knows us better then we know our selves: He is as Ezekiel’s wheels full of eyes, and as Augustin saith, he is totus oculus, all eye.

2. Reason. From his ubiquity. He is Omniscient, because Omnipresent, Ier. 23. 24. Do not I fill heaven and earth? He is no where included, and yet no where excluded; His circumference is every where: God hath an eye in Councils, in Armies, he makes an Heart anatomy; he sees what men’s designs are, and whither they are driving. If hatred wears the livery of Friendship, if Ambition comes masqued with humility, if Religion be made a stirrup to get into the saddle of preferment, God sees it; And though they dig into hell, thence shall my hand take them, Amos 9. 2. God can unlock hell; Plato saith of the King of Lydia, he had a Ring, when he turned the head of it to the palm of his hand, he could see every one, but himself walk invisible.

Thus God observes all our actings, but himself is not seen, as the Apostle argues, 1 Tim. 6. 16. Therefore the Schoolmen say well, Deus est in loco repletivè. Man may be circumscribed, the Angels may be defined, but God is in every place by way of repletion. His Centre is every where, and his eye is ever in his Centre.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of public humiliation</cite>, (London: Ralph Smith, 1654), pp 13-16.</span></figcaption>

<blockquote><p>But though He wills all creatures as means and for his own sake, He wills some more than others to the degree they are more direct and suitable means for his glorification. God is a Father to all his creatures, but He is that especially to his children. His affection for everything He created is not as deep as his affection for his church, and that in turn is not as great as his love for Christ, the Son of his good pleasure. We speak of a general, a special, and a very special providence; in the same way we make as many distinctions in the will of God (as it relates to his creatures) as there are creatures. For the free will of God is as richly variegated as that whole world is. Hence, it must not be conceived as an indifferent power, a blind force, but as a rich and powerful divine energy, the wellspring of the abundant life that creation spreads out before our eyes. In that world, however, there is one thing that creates a special difficulty for the doctrine of the will of God, and that is the fact of evil, both evil as guilt and evil as punishment, in an ethical as well as a physical sense. Though evil is ever so much under God’s control, it cannot in the same sense and in the same way be the object of his will as the good. Hence, with a view to these two very different, in fact diametrically opposed, objects we must again make a distinction in that will of God, as Scripture itself shows. There is a big difference between the will of God that prescribes what we must do (Matt. 7:21; 12:50; John 4:34; 7:17; Rom. 12:2), and the will of God that tells us what He does and will do (Ps. 115:3; Dan. 4:17, 25,32,35; Rom. 9:18-19; Eph. 1:5,9,11; Rev. 4:11). The petition that God’s will may be done (Matt. 6:10) is very different in tenor from the childlike and resigned prayer: “Your will be done” (Matt. 26:42; Acts 21:14). Over and over in history we see the will of God assert itself in two ways. God commands Abraham to sacrifice his son, yet he does not let it happen (Gen. 22). He wants Pharaoh to let his people Israel go, yet hardens his heart so that he does not do it (Exod. 4:21). He has the prophet tell Hezekiah that he will die; still He adds fifteen years to his life (Isa. 38:1,5). He prohibits us from condemning the innocent, yet Jesus is delivered up according to the definite plan and foreknowledge of God (Acts 2:23; 3:18; 4:28). God does not will sin; He is far from iniquity. He forbids it and punishes it severely, yet it exists and is subject to his rule (Ex. 4:21; Josh. 11:20; 1 Sam. 2:25; 2 Sam. 16:10; Acts 2:23; 4:28; Rom. 1:24,26; 2 Thess. 2:11; etc.). He wills the salvation of all (Eze. 18:23,32; 33:11; 1 Tim. 2:4; 2 Pet. 3:9), yet has mercy on whom He wills and hardens whom He wills (Rom. 9:18).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But though He wills all creatures as means and for his own sake, He wills some more than others to the degree they are more direct and suitable means for his glorification. God is a Father to all his creatures, but He is that especially to his children. His affection for everything He created is not as deep as his affection for his church, and that in turn is not as great as his love for Christ, the Son of his good pleasure. We speak of a general, a special, and a very special providence; in the same way we make as many distinctions in the will of God (as it relates to his creatures) as there are creatures. For the free will of God is as richly variegated as that whole world is. Hence, it must not be conceived as an indifferent power, a blind force, but as a rich and powerful divine energy, the wellspring of the abundant life that creation spreads out before our eyes. In that world, however, there is one thing that creates a special difficulty for the doctrine of the will of God, and that is the fact of evil, both evil as guilt and evil as punishment, in an ethical as well as a physical sense. Though evil is ever so much under God’s control, it cannot in the same sense and in the same way be the object of his will as the good. Hence, with a view to these two very different, in fact diametrically opposed, objects we must again make a distinction in that will of God, as Scripture itself shows. There is a big difference between the will of God that prescribes what we must do (Matt. 7:21; 12:50; John 4:34; 7:17; Rom. 12:2), and the will of God that tells us what He does and will do (Ps. 115:3; Dan. 4:17, 25,32,35; Rom. 9:18-19; Eph. 1:5,9,11; Rev. 4:11). The petition that God’s will may be done (Matt. 6:10) is very different in tenor from the childlike and resigned prayer: “Your will be done” (Matt. 26:42; Acts 21:14). Over and over in history we see the will of God assert itself in two ways. God commands Abraham to sacrifice his son, yet he does not let it happen (Gen. 22). He wants Pharaoh to let his people Israel go, yet hardens his heart so that he does not do it (Exod. 4:21). He has the prophet tell Hezekiah that he will die; still He adds fifteen years to his life (Isa. 38:1,5). He prohibits us from condemning the innocent, yet Jesus is delivered up according to the definite plan and foreknowledge of God (Acts 2:23; 3:18; 4:28). God does not will sin; He is far from iniquity. He forbids it and punishes it severely, yet it exists and is subject to his rule (Ex. 4:21; Josh. 11:20; 1 Sam. 2:25; 2 Sam. 16:10; Acts 2:23; 4:28; Rom. 1:24,26; 2 Thess. 2:11; etc.). He wills the salvation of all (Eze. 18:23,32; 33:11; 1 Tim. 2:4; 2 Pet. 3:9), yet has mercy on whom He wills and hardens whom He wills (Rom. 9:18).”

— Herman Bavinck, Reformed Dogmatics: God and Creation, (Backer Academic, 2004), 2:241">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+though+He+wills+all+creatures+as+means+and+for+his+own+sake%2C+He+wills+some+more+than+others+to+the+degree+they+are+more+direct+and+suitable+means+for+his+glorification.+God+is+a+Father+to+all+his+creatures%2C+but+He+is+that+especially+to+his+children.+His+affection+for+everything+He+created+is+not+as+deep+as+his+affection+for+his+church%2C+and+that+in+turn+is+not+as+great+as+his+love+for+Christ%2C+the+Son+of+his+good+pleasure.+We+speak+of+a+general%2C+a+special%2C+and+a+very+special+providence%3B+in+the+same+way+we+make+as+many+distinctions+in+the+will+of+God+%28as+it+relates+to+his+creatures%29+as+there+are+creatures.+For+the+free+will+of+God+is+as+richly+variegated+as+that+whole+world+is.+Hence%2C+it+must+not+be+conceived+as+an+indifferent+power%2C+a+blind+force%2C+but+as+a+rich+and+powerful+divine+energy%2C+the+wellspring+of+the+abundant+life+that+creation+spreads+out+before+our+eyes.+In+that+world%2C+however%2C+there+is+one+thing+that+creates+a+special+difficulty+for+the+doctrine+of+the+will+of+God%2C+and+that+is+the+fact+of+evil%2C+both+evil+as+guilt+and+evil+as+punishment%2C+in+an+ethical+as+well+as+a+physical+sense.+Though+evil+is+ever+so+much+under+God%E2%80%99s+control%2C+it+cannot+in+the+same+sense+and+in+the+same+way+be+the+object+of+his+will+as+the+good.+Hence%2C+with+a+view+to+these+two+very+different%2C+in+fact+diametrically+opposed%2C+objects+we+must+again+make+a+distinction+in+that+will+of+God%2C+as+Scripture+itself+shows.+There+is+a+big+difference+between+the+will+of+God+that+prescribes+what+we+must+do+%28Matt.+7%3A21%3B+12%3A50%3B+John+4%3A34%3B+7%3A17%3B+Rom.+12%3A2%29%2C+and+the+will+of+God+that+tells+us+what+He+does+and+will+do+%28Ps.+115%3A3%3B+Dan.+4%3A17%2C+25%2C32%2C35%3B+Rom.+9%3A18-19%3B+Eph.+1%3A5%2C9%2C11%3B+Rev.+4%3A11%29.+The+petition+that+God%E2%80%99s+will+may+be+done+%28Matt.+6%3A10%29+is+very+different+in+tenor+from+the+childlike+and+resigned+prayer%3A+%E2%80%9CYour+will+be+done%E2%80%9D+%28Matt.+26%3A42%3B+Acts+21%3A14%29.+Over+and+over+in+history+we+see+the+will+of+God+assert+itself+in+two+ways.+God+commands+Abraham+to+sacrifice+his+son%2C+yet+he+does+not+let+it+happen+%28Gen.+22%29.+He+wants+Pharaoh+to+let+his+people+Israel+go%2C+yet+hardens+his+heart+so+that+he+does+not+do+it+%28Exod.+4%3A21%29.+He+has+the+prophet+tell+Hezekiah+that+he+will+die%3B+still+He+adds+fifteen+years+to+his+life+%28Isa.+38%3A1%2C5%29.+He+prohibits+us+from+condemning+the+innocent%2C+yet+Jesus+is+delivered+up+according+to+the+definite+plan+and+foreknowledge+of+God+%28Acts+2%3A23%3B+3%3A18%3B+4%3A28%29.+God+does+not+will+sin%3B+He+is+far+from+iniquity.+He+forbids+it+and+punishes+it+severely%2C+yet+it+exists+and+is+subject+to+his+rule+%28Ex.+4%3A21%3B+Josh.+11%3A20%3B+1+Sam.+2%3A25%3B+2+Sam.+16%3A10%3B+Acts+2%3A23%3B+4%3A28%3B+Rom.+1%3A24%2C26%3B+2+Thess.+2%3A11%3B+etc.%29.+He+wills+the+salvation+of+all+%28Eze.+18%3A23%2C32%3B+33%3A11%3B+1+Tim.+2%3A4%3B+2+Pet.+3%3A9%29%2C+yet+has+mercy+on+whom+He+wills+and+hardens+whom+He+wills+%28Rom.+9%3A18%29.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+%28Backer+Academic%2C+2004%29%2C+2%3A241&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F617cfcd054.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/617cfcd054.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=But%20though%20He%20wills%20all%20creatures,hardens%20whom%20He%20wills%20%28Rom.%209%3A18&amp;text=But%20though%20He%20wills%20all%20creatures%20as%20means&amp;text=wills%20and%20hardens%20whom%20He%20wills%20%28Rom.%209%3A18" rel="noopener" target="_blank">Read it online · Reformed Books Online</a>

<blockquote><p>Vers. 4. According as he hath chosen us in him, before the foundation of the world, that we should be holy, and without blame before him in love.

Argum. 1. … God actually in time, freely bestows all these spiritual blessings upon us in Christ, even as before time he of his grace chose us in him, that at length we might obtain these benefits: Therefore we ought to bless him: All the words of this Argument also are proofs of his free and gracious election: For,

(1.) Our election was of God unto life, before others our companions, who were in the same condition, whom God leaving and passing by chose us: Therefore we are chosen out of grace.

(2.) He chose us in Christ, as in the head who was first chosen, as in the common Parent, root and fountain of the elect. After whom we in the consideration of dignity, and order, and in whom we, as his body, members, and off-spring, are afterwards chosen in the order of nature: Therefore our election is free, there being no cause of it in us, which is to be sought for in God alone.

(3.) He chose us before the foundation of the world, that is, from eternity, before the world was, much more before any works of ours were; He chose us before any matter of the created world was existent, much more before any matter of our works or workings could be existent: for he elected us in order of nature before he decreed that the world should be. For the decree of the creation of the world, was subservient as a means to bring to pass the already decreed salvation of the elect: Therefore he chose us of grace, and not for fore-seen works.

He chose us that we might be holy] (4.) He did not choose us because we were holy, or because he fore-saw that we would be holy, but he chose us without any consideration of any holiness at all in us, nay he chose us as not having holiness; to the end, that being chosen, we should be made holy, and should become unblameable in his sight, that is, that being consecrated to God, we should be by degrees truly and sincerely sanctified, and should at last be presented fully and perfectly holy in heaven: Yea further, that being unblameable without spot, without wrinkle, not only of sin, but also of all misery, we should at length appear together before him blessed and glorious: Therefore our election is not from faith fore-seen, or works fore-seen, but of mere grace, which as it is the cause of election, so of all holiness, and happiness, which follows election.

In love] Love or charity is merely free, in which as he hath chosen us, that we should be made holy and unblameable, so also that in that his love we should perfect this our happiness; which love God will then fully put forth, when he shall fully consummate our holiness and happiness. And so the charity or love of God is both the cause of election, and the completing or perfecting of those good things which follow election, and by consequence election is not only of grace, but is for the perfect possession of free happiness in the sight of God.

Vers. 5. Having predestinated us unto the adoption of children by Jesus Christ to himself, according to the good pleasure of his will.

Arg. 3. Thus God of his grace hath blessed us in time, so also of grace he hath predestinated us to the inheritance of Sons, which was to be obtained by Christ in his own person, according to the good pleasure of his will: Therefore we should celebrate his grace. The parts of this reason prove the same, that the whole reason it self doth.

Having predestinated us] (1.) As our election before time was free, so is our predestination also before ages unto life eternal, and to fit means, which should be effectual to bring us to that end: Therefore predestination is free, in that it doth not only assign the end and persons, but also appoints the means by which we must attain that end.

Unto the adoption of children] (2.) Here also the Apostle manifests the grace of God. We are predestinated, not because we are fore-seen as Sons, but that being not as yet Sons, we should by Grace attain the Adoption of Sons. Now the Adoption of Sons includes these four things. (1) An effectual Calling, or Faith to embrace the offered communion with Christ the only begotten Son. (2) A towardliness and good disposition of Sons, or the renovation of our nature, that we might love God as our Father. (3) The dignity and honour of Sons. (4) The Riches or Inheritance of Sons, even to the glorifying of our Bodies, Rom. 8.23. Therefore both our Predestination and Adoption is free, and not for any work of ours.

By Christ] (3) And this doth make much for the advancement of Grace: Wee are predestinated that wee may obtain the Adoption of Children by Jesus Christ, who is the first-begotten, and only-begotten Son, that by his merit and efficacy we might obtain all the fore-said degrees of Adoption: Therefore our predestination is from mere Grace.

To himself] (4) That Grace might appear, he shews the end of Adoption. God hath predestinated us that we should obtain the Adoption of Children by Christ to himself, or to his use, viz. to the honour of him that predestinateth, or of Christ by whom he communicates to us Grace, and the Glory of the Sons of God: Therefore our predestination is free, for otherwise honour would not accrue to God or Christ by our Adoption.

According to the good pleasure of his Will] (5) Here he excludes all causes besides God, and makes the Grace of God the only cause. For he predestinated us according to the good pleasure of his Will: Therefore only God’s Grace, only his Will, only his good pleasure is the cause of our predestination, and not any work of ours.</p></blockquote>

<blockquote><p>The conclusion reached in this paper is that there are more similarities than disparities between Aquinas and Calvin on the doctrine of predestination. Some degree of continuity ought to be expected given that both men interpret the Apostle Paul’s teaching on predestination through the lens of Augustine to one degree or another. In some respects, Thomas reflects a more faithful reading of Augustine than Calvin since he recognizes the role of merit in the soteric process and leans in the direction of a single predestinarian view. However, Calvin does more justice to Augustine’s emphasis on human depravity and the necessity of saving grace to rescue man from destruction. As it pertains to this doctrine, the theology of Thomas… It would be a serious misrepresentation to classify his position as Semi-Pelagian… A comparison of views between these theological titans reveals several notable areas of incongruity. First, Thomas sees predestination as a part of God’s providence and focuses on causality while Calvin posits predestination, not providence, as determinative of our final end and approaches it soteriologically. Second, Thomas follows Augustine and argues that the attainment of glory is realized in conjunction with acquired merit through grace and the gift of perseverance. Calvin, on the other hand, is irreconcilably opposed to the role of human merit both prior to and subsequent to justification. Third, our election in Christ is vital for Calvin while Thomas hardly speaks to this at all. Fourth, Thomas by and large embraces a doctrine of negative or passive reprobation whereby God permits the reprobate to fall away leading to damnation. Calvin advocates double predestination, arguing that God actively wills the destruction of the reprobate irrespective of works. Fifth, while Thomas identifies no practical end for this doctrine, it serves as a ground of assurance in Calvin’s theology. While these differences are not inconsequential, areas of agreement should be given greater weight. Both share the same outlook on the cause, extent, and end of election, namely, God’s unmerited favor toward a select number of individuals freely chosen for eternal life for the purpose of manifesting his goodness in their redemption. Thomas and Calvin mutually affirm the total inability of man to please God without special grace, unconditional election, the limited efficacy of Christ’s atonement, efficacious grace, and the perseverance of the elect. One might deduce from these propositions a Thomistic version of TULIP. In the final analysis, Thomas and Calvin locate the source and means of salvation squarely in God’s sovereign grace. Man can neither initiate his salvation nor realize its consummation apart from grace. Individuals possess eternal life only because God has foreordained them to this end according to his good pleasure.</p></blockquote>

not inconsequential, areas of agreement should be given greater weight. Both share the same outlook on the cause, extent, and end of election, namely, God’s unmerited favor toward a select number of individuals freely chosen for eternal life for the purpose of manifesting his goodness in their redemption. Thomas and Calvin mutually affirm the total inability of man to please God without special grace, unconditional election, the limited efficacy of Christ’s atonement, efficacious grace, and the perseverance of the elect. One might deduce from these propositions a Thomistic version of TULIP. In the final analysis, Thomas and Calvin locate the source and means of salvation squarely in God’s sovereign grace. Man can neither initiate his salvation nor realize its consummation apart from grace. Individuals possess eternal life only because God has foreordained them to this end according to his good pleasure.”

— Francis B. Cavalli, ‘Aquinas &amp; Calvin on Predestination, [Yes]’ in Reformed Faith &amp; Practice, vol. 1, issue 2 (2016)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+conclusion+reached+in+this+paper+is+that+there+are+more+similarities+than+disparities+between+Aquinas+and+Calvin+on+the+doctrine+of+predestination.+Some+degree+of+continuity+ought+to+be+expected+given+that+both+men+interpret+the+Apostle+Paul%E2%80%99s+teaching+on+predestination+through+the+lens+of+Augustine+to+one+degree+or+another.+In+some+respects%2C+Thomas+reflects+a+more+faithful+reading+of+Augustine+than+Calvin+since+he+recognizes+the+role+of+merit+in+the+soteric+process+and+leans+in+the+direction+of+a+single+predestinarian+view.+However%2C+Calvin+does+more+justice+to+Augustine%E2%80%99s+emphasis+on+human+depravity+and+the+necessity+of+saving+grace+to+rescue+man+from+destruction.+As+it+pertains+to+this+doctrine%2C+the+theology+of+Thomas%E2%80%A6+It+would+be+a+serious+misrepresentation+to+classify+his+position+as+Semi-Pelagian%E2%80%A6+A+comparison+of+views+between+these+theological+titans+reveals+several+notable+areas+of+incongruity.+First%2C+Thomas+sees+predestination+as+a+part+of+God%E2%80%99s+providence+and+focuses+on+causality+while+Calvin+posits+predestination%2C+not+providence%2C+as+determinative+of+our+final+end+and+approaches+it+soteriologically.+Second%2C+Thomas+follows+Augustine+and+argues+that+the+attainment+of+glory+is+realized+in+conjunction+with+acquired+merit+through+grace+and+the+gift+of+perseverance.+Calvin%2C+on+the+other+hand%2C+is+irreconcilably+opposed+to+the+role+of+human+merit+both+prior+to+and+subsequent+to+justification.+Third%2C+our+election+in+Christ+is+vital+for+Calvin+while+Thomas+hardly+speaks+to+this+at+all.+Fourth%2C+Thomas+by+and+large+embraces+a+doctrine+of+negative+or+passive+reprobation+whereby+God+permits+the+reprobate+to+fall+away+leading+to+damnation.+Calvin+advocates+double+predestination%2C+arguing+that+God+actively+ </figure><figure class="quote" id="q-c6dcd2f981" data-kw="">
<blockquote><p>Subservient to God’s election of some is each covenant. The covenant of works to humble them, not only upon the consideration of their sins, whereby they have merited eternal death; but especially upon consideration how their natural corruption is so far from being mastered and corrected by the Law, as that on the contrary it is irritated and exasperated so much the more.

Then the covenant of grace to comfort them, considering how the condition of life is adduced and tempered, being from exact and strict obedience changed into faith and repentance; but chiefly upon consideration that the word of this covenant is a word of power mastering their corruption, and enabling to perform faith, repentance, and Evangelical obedience in an acceptable manner unto the Lord.

Subservient to the purpose of reprobation may be the Law, only written in men’s hearts, which very obscurely, intimateth (if at all) any covenant made of everlasting life between God and man. Where the word is revealed, that in general comprehending both Law and Gospel, is subservient thereunto in the way of instruction and exhortation, and the like, thereby taking away all excuse.</p></blockquote>

nants/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1cc93b4dab" data-kw="">
<blockquote><p>But they say that the “definition of predestination is opposed to the advantage of preaching,”—as if, indeed, it were opposed to the preaching of the apostle! Did not that teacher of the heathen so often, in faith and truth, both commend predestination, and not cease to preach the word of God?

Because he said, “It is God that worketh in you both to will and to do for His good pleasure,” did he not also exhort that we should both will and do what is pleasing to God? or because he said, “He who hath begun a good work in you shall carry it on even unto the day of Christ Jesus,” did he on that account cease to persuade men to begin and to persevere unto the end?

Doubtless, our Lord Himself commanded men to believe, and said, “Believe in God, believe also in me:” and yet His opinion is not therefore false, nor is His definition idle when He says, “No man cometh unto me”—that is, no man believeth in me—“except it has been given him of my Father.” Nor, again, because this definition is true, is the former precept vain. Why, therefore, do we think the definition of predestination useless to preaching, to precept, to exhortation, to rebuke,—all which things the divine Scripture repeats frequently,—seeing that the same Scripture commends this doctrine?</p></blockquote>

<blockquote><p>2. That the only moving and efficient cause of election and predestination unto life is the mere good pleasure and grace of God, not the consideration of any foreseen faith, perseverance, good works, good will, good endeavors, or any other quality or condition whatsoever in the persons elected.

3. That though sin be the only cause of damnation, yet the sole and primary cause of reprobation or non-election (that is, why God does pass by this man rather than another, why He rejected Esau, when He elected Jacob) is the mere freewill and pleasure of God: not the confideration or foresight of any actual sin, infidelity, or final impenitency in the persons rejected.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9b6ce3afc7" data-kw="">
<blockquote><p>The covenants of a church are her glory; God’s covenant of grace and promise, and their covenants of duty and gratitude, Rom. ix. 4, it is said of the Old Testament church “To them belonged the adoption, the glory, and the covenants.” God’s covenant of grace and promise is the glory of a church. It was the misery of the poor Gentiles under the Old Testament, before the coming of Christ, that they were “strangers to the covenants of promise.” This is the church’s charter for all her immunities and privileges, visible or invisible, for the life that now is, and that which is to come: and it is “an everlasting covenant, well ordered in all things and sure:” and him that takes hold of this covenant, “even him will God bring to his holy mountain, and make joyful in his house of prayer,” Is. Ivi.

Now, this covenant hangs upon Christ, the nail fastened in a sure place; for God has “given him for a covenant unto the people;” it was made with him as a second Adam, and with his seed in him; he has fulfilled the condition of it, by the holiness of his nature, the obedience of his life, and the satisfaction made by his death; his fulfilling the commands and demands of the broken covenant of works, is the very condition of the covenant of grace, and by virtue of his doing so the cry comes out. Is. Iv. 1, “Ho, every one that thirsteth, come ye to the waters; he that hath no money, let him come; come, buy wine and milk without money, and without price.” The covenant, and all the blessings and promises of it, hang upon this blessed nail; they are all in him, and “in him yea and amen.”

Again, our covenants for duty, obedience, and gratitude, they hang upon this blessed nail. These are the glory of a church and land, as they were unto the church of Israel. God avouched them to be his peculiar people, and they avouched him, by solemn covenant, to be their God; on which account they are called Hephzibah, and Beulah; a people married to the Lord. This was the glory of this land, and of the three nations, though perfidiously broken, burnt, and buried. Blessed be God there is some small degree of a resurrection of these solemn covenants, by what has been lately transacted in this place.

But now, I say the glory of all our covenants, and engagements into personal or public reformation and obedience, must needs hang upon this nail fastened in a sure place. When men engage to duty in a legal way, in the strength of their own covenants, vows, promises, and resolutions, without fastening faith’s gripes upon the nail in a sure place, for righteousness and strength, they do only make to themselves ropes of sand, that will fall asunder as fast as they can make them. Christ only is “the strength of Israel;” all our funds of grace lie in him, “in whom it has pleased the Father that all fulness should dwell.”

And whatever duty we engage to should be in the strength of promised grace for assistance, and in the faith of his righteousness and intercession for acceptance: Is. xlv. 24, “Surely, shall one say, In the Lord have I righteousness and strength. I will go (says David) in the strength of the Lord God: I will make mention of thy righteousness, even of thine only.” And it is in this way that his commandments are not grievous, his yoke easy, and his burden light.</p></blockquote>

<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>

<blockquote><p>Nor is it sufficient to say, in the third place, that the relation is that of suretyship and substitution. This undoubtedly is a great step in advance. Only let the ground thus taken up be secured. Let the inquiry be pressed to the uttermost; let it be exhausted.

All truly scientific investigation searches on and on, till it arrives at somewhat of which no further explanation can be given or is required. Theology as a science meets this canon, and then claims a right to rest. Let us then still inquire.

Christ undertakes the work of Calvary, the death of the cross, for His people, because He stands towards them in the relation of a surety — a surety on their behalf to the offended Lawgiver and Judge. Be it so: but what shall justify His occupying that relation? What renders it fit, proper, righteous, that He should be accepted as standing in that relation towards them, and in that relation suffering for them? To this also it is not difficult to reply. He is their surety, because He is their substitute. He acts on their behalf, because He stands in their room. One only question now remains; and there can be no possibility, as there should be no inducement, to evade it. The relation of a substitute justifies the suretyship; what shall justify the substitution?

It is to this at last that the question must really be narrowed. The exact hinge and whole stress of the inquiry is here. And we can attain no satisfaction on this point, no sufficient answer to this question, and therefore no satisfactory conclusion to our whole line of investigation, till the doctrine of the everlasting Covenant oneness comes into view. That is the great underlying relation. That is the grand primary conjunction between the Redeemer and the redeemed, which alone bears up, and justifies, and accounts for all else in respect of relation which can be predicated as true concerning them. “Both He that sanctifieth and they that are sanctified are All Of One: for Which cause He is not ashamed to call them brethren” (Heb. ii. 11).

His substitution is a good reason for His suretyship. Covenant oneness is, if possible, a still better reason for His substitution. For now is the vicariousness of His sacrifice not merely brought to light, but vindicated. It is not merely true that He suffers for us; it is also true that we suffer in Him. And the latter of these propositions justifies the truth and righteousness of the former. He is substituted for us, because He is one With us —identified with us, and we with Him.</p></blockquote>

<blockquote><p>(1.) The life which he now led was a life of faith with respect unto things spiritual and eternal. For he had for the foundation and object hereof, [1.] The promise of the blessed Seed, and the spiritual blessing of all nations in him, as a confirmation of the first fundamental promise to the church, concerning the Seed of the woman that was to break the serpent’s head. And [2] God entered expressly into covenant with him, confirming it with the seal of circumcision, wherein he obliged himself to be his God, his God almighty, or all-sufficient, for his temporal and eternal good. To suppose that Abraham saw nothing in this promise and covenant but only things confined unto this life, nothing of spiritual grace or mercy, nothing of eternal reward or glory, is so contrary to the analogy of faith, to express testimony of Scripture, so destructive of all the foundations of religion, so unworthy of the nature and properties of God, rendering his title of “the father of the faithful,” and his example in believing, so useless, as that it is a wonder men of any tolerable sobriety should indulge to such an imagination.</p></blockquote>

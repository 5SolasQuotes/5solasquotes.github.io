<main class="wrap"><figure class="quote" id="q-f03e333876" data-kw="">
<blockquote><p>Objection: But we are bound by the canons of the Church which are still in force. Answer: 1. Scripture is the Church’s sufficient rule, and the perfect Law of God. 2. Those things that Scripture has left to occasional determination, no councils must make standing laws for to bind at all times. For if such laws had been fit, God would have made them. 3. It is the present guides of the Church that are upon the place, and see the occasions, that must determine such circumstantials as are of mutable determination. And former Church-governors can no more take away the power of the present, than they can deprive them of their office; it being essential to the office of every pastor to be a guide or ruler of his flock. 4. If you think that all Church canons (yea though it be General Councils) bind, then you are bound to contradictories: for one Council has oft crossed another. And Papists themselves disclaim many things enjoined by canons. The 16th canon of the 4th Council of Carthage requires ministers not to read the books of heathens: Does this bind now? Many the like might be mentioned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

</figure><figure class="quote" id="q-ad3beebfd8" data-kw="">
<blockquote><p>Rutherford, in the following year, joined in [Charles] Herle’s crusade against Congregationalism with his famous work, ‘The Due Right of Prebyteries’ (1644). In reply to Herle, [Richard] Mather and William Tompson published, ‘A Modest &amp; Brotherly Answer To Mr. Charles Herle’ (1644). Also, refuting both Herle and Rutherford, Mather wrote another work, ‘A Reply to Mr. Rutherford’ (1647). It should be remembered that Rutherford’s The Due Right of Prebyteries (1644) itself was his critical review of both Mather’s ‘Church Government and Church Covenant Discussed’ (1643) and [John] Cotton’s ‘The Way Of The Churches Of Christ In New-England’, whose manuscript was widely circulated in England even a few years before its publication in 1645. By 1644, Rutherford was already involved in another round of debate, which was set off by John Cotton. Particularly, Cotton’s ‘The Keys Of The Kingdom Of Heaven’ (1644) was so influential in England that John Owen, a Presbyterian, became convinced that Cotton was right and, finally, supported the Congregational form of church government.¹ ¹ See John Owen’s Preface in A Defence of Mr. John Cotton from the Imputation of Self-Contradiction Charged on Him by Mr. Daniel Cawdrey (Oxford: H. Hall for T. Robinson, 1658)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, or a Peaceable Plea for the Government of the Church of Scotland… (London, 1644) ToC | Sang Ahn, Covenant in Conflict</cite>, pp. 61:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-9f4237cccc" data-kw="">

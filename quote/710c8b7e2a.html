<blockquote><p>c. The eternal generation of the Son. The personal property of the Son is that He is eternally begotten of the Father (briefly called “filiation”), and shares with the Father in the spiration of the Spirit. The doctrine of the generation of the Son is suggested by the Biblical representation of the first and second persons of the Trinity as standing in the relation of Father and Son to each other. Not only do the names “Father” and “Son” suggest the generation of the latter by the former, but the Son is also repeatedly called “the only-begotten,” John 1:14, 18; 3:16, 18; Heb. 11:17; 1 John 4:9. Several particulars deserve emphasis in connection with the generation of the Son: (1) It is a necessary act of God. Origen, one of the very first to speak of the generation of the Son, regarded it as an act dependent on the Father’s will and therefore free. Others at various times expressed the same opinion. But it was clearly seen by Athanasius and others that a generation dependent on the optional will of the Father would make the existence of the Son contingent and thus rob Him of His deity. Then the Son would not be equal to and homoousios with the Father, for the Father exists necessarily, and cannot be conceived of as non-existent. The generation of the Son must be regarded as a necessary and perfectly natural act of God. This does not mean that it is not related to the Father’s will in any sense of the word. It is an act of the Father’s necessary will, which merely means that His concomitant will takes perfect delight in it. (2) It is an eternal act of the Father. This naturally follows from the preceding. If the generation of the Son is a necessary act of the Father, so that it is impossible to conceive of Him as not generating, it naturally shares in the eternity of the Father. This does not mean, however, that it is an act that was completed in the far distant past, but rather that it is a timeless act, the act of an eternal present, an act always continuing and yet ever completed. Its eternity follows not only from the eternity of God, but also from the divine immutability and from the true deity of the Son. In addition to this it can be inferred from all those passages of Scripture which teach either the pre-existence of the Son or His equality with the Father, Mic. 5:2; John 1:14, 18; 3:16; 5:17, 18, 30, 36; Acts 13:33; John 17:5; Col. 1:16; Heb. 1:3. The statement of Ps. 2:7, “Thou art my Son; this day have I begotten thee,” is generally quoted to prove the generation of the Son, but, according to some, with rather doubtful propriety, cf. Acts 13:33; Heb. 1:5. They surmise that these words refer to the raising up of Jesus as Messianic King, and to the recognition of Him as Son of God in an official sense, and should probably be linked up with the promise found in 2 Sam. 7:14, just as they are in Heb. 1:5. (3) It is a generation of the personal subsistence rather than of the divine essence of the Son. Some have spoken as if the Father generated the essence of the Son, but this is equivalent to saying that He generated His own essence, for the essence of both the Father and the Son is exactly the same. It is better to say that the Father generates the personal subsistence of the Son, but thereby also communicates to Him the divine essence in its entirety. But in doing this we should guard against the idea that the Father first generated a second person, and then communicated the divine essence to this person, for that would lead to the conclusion that the Son was not generated out of the divine essence, but created out of nothing. In the work of generation there was a communication of essence; it was one indivisible act. And in virtue of this communication the Son also has life in Himself. This is in agreement with the statement of Jesus, “For as the Father hath life in Himself, even so gave He to the Son also to have life in Himself,” John 5:26. (4) It is a generation that must be conceived of as spiritual and divine. In opposition to the Arians, who insisted that the generation of the Son necessarily implied separation or division in the divine Being, the Church Fathers stressed the fact that this generation must not be conceived in a physical and creaturely way, but should be regarded as spiritual and divine, excluding all idea of division or change. It brings distinctio and distributio, but no diversitas and divisio in the divine Being. (Bavinck) The most striking analogy of it is found in man’s thinking and speaking, and the Bible itself seems to point to this, when it speaks of the Son as the Logos. (5) The following definition may be given of the generation of the Son: It is that eternal and necessary act of the first person in the Trinity, whereby He, within the divine Being, is the ground of a second personal subsistence like His own, and puts this second person in possession of the whole divine essence, without any division, alienation, or change</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74c3572d0d" data-kw="unity three persons">
<blockquote><p>While he proclaims his unity, he distinctly sets it before us as existing in three persons. These we must hold, unless the bare and empty name of Deity merely is to flutter in our brain without any genuine knowledge. Moreover, lest any one should dream of a threefold God, or think that the simple essence is divided by the three Persons, we must here seek a brief and easy definition which may effectually guard us from error.</p></blockquote>

<blockquote><p>Every cause is a principle of some sort. So one must first explain the notion of principle so that the notion of cause may be understood. A principle is defined as that from which something in some way proceeds. That which proceeds is called the ‘principiate’, or what has been ‘principled’. Between principle and principled there must be some connection. If this connection is merely external and without any inflowing of the principle to the principled, the principle is better referred to as a ‘beginning’. If, on the other hand, the connection is internal and consists in a positive inflowing of one to the other, the first is properly called a principle. Dawn is the principle of a day in the sense of beginning, and likewise the point in respect of a line. Parents with respect to their children, on the contrary, are properly called principles. The positive inflowing between principle and principled can be either logical or real. An inflowing is logical if the principle is the reason that the principled is known. In this way the premises of a syllogism are principles with respect to the conclusion (of science). The inflowing is real or ontological if the principle gives being to the principled.¹ ¹ Among philosophers an ontological principle is the same as a cause. Theologians however distinguish between a principle that is a cause and one that is not a cause. A principle that is not a cause communicates its own proper being such that the nature of the giver and of the receiver is numerically the same. Thus in the Sacred Trinity the Father is the principle of the Son but is not the cause of the Son. A principle is called a cause only if it communicates an existence or being-ness that is numerically distinct from itself. A cause is defined as a principle that, by its positive inflowing, determines the existence of something else…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Every cause is a principle of some sort. So one must first explain the notion of principle so that the notion of cause may be understood. A principle is defined as that from which something in some way proceeds. That which proceeds is called the ‘principiate’, or what has been ‘principled’. Between principle and principled there must be some connection. If this connection is merely external and without any inflowing of the principle to the principled, the principle is better referred to as a ‘beginning’. If, on the other hand, the connection is internal and consists in a positive inflowing of one to the other, the first is properly called a principle. Dawn is the principle of a day in the sense of beginning, and likewise the point in respect of a line. Parents with respect to their children, on the contrary, are properly called principles. The positive inflowing between principle and principled can be either logical or real. An inflowing is logical if the principle is the reason that the principled is known. In this way the premises of a syllogism are principles with respect to the conclusion (of science). The inflowing is real or ontological if the principle gives being to the principled.¹ ¹ Among philosophers an ontological principle is the same as a cause. Theologians however distinguish between a principle that is a cause and one that is not a cause. A principle that is not a cause communicates its own proper being such that the nature of the giver and of the receiver is numerically the same. Thus in the Sacred Trinity the Father is the principle of the Son but is not the cause of the Son. A principle is called a cause only if it communicates an existence or being-ness that is numerically distinct from itself. A cause is defined as a principle that, by its positive inflowing, determines the existence of something else…”

— Allan B. Wolter, Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 4, p. 38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEvery+cause+is+a+principle+of+some+sort.+So+one+must+first+explain+the+notion+of+principle+so+that+the+notion+of+cause+may+be+understood.+A+principle+is+defined+as+that+from+which+something+in+some+way+proceeds.+That+which+proceeds+is+called+the+%E2%80%98principiate%E2%80%99%2C+or+what+has+been+%E2%80%98principled%E2%80%99.+Between+principle+and+principled+there+must+be+some+connection.+If+this+connection+is+merely+external+and+without+any+inflowing+of+the+principle+to+the+principled%2C+the+principle+is+better+referred+to+as+a+%E2%80%98beginning%E2%80%99.+If%2C+on+the+other+hand%2C+the+connection+is+internal+and+consists+in+a+positive+inflowing+of+one+to+the+other%2C+the+first+is+properly+called+a+principle.+Dawn+is+the+principle+of+a+day+in+the+sense+of+beginning%2C+and+likewise+the+point+in+respect+of+a+line.+Parents+with+respect+to+their+children%2C+on+the+contrary%2C+are+properly+called+principles.+The+positive+inflowing+between+principle+and+principled+can+be+either+logical+or+real.+An+inflowing+is+logical+if+the+principle+is+the+reason+that+the+principled+is+known.+In+this+way+the+premises+of+a+syllogism+are+principles+with+respect+to+the+conclusion+%28of+science%29.+The+inflowing+is+real+or+ontological+if+the+principle+gives+being+to+the+principled.%C2%B9+%C2%B9+Among+philosophers+an+ontological+principle+is+the+same+as+a+cause.+Theologians+however+distinguish+between+a+principle+that+is+a+cause+and+one+that+is+not+a+cause.+A+principle+that+is+not+a+cause+communicates+its+own+proper+being+such+that+the+nature+of+the+giver+and+of+the+receiver+is+numerically+the+same.+Thus+in+the+Sacred+Trinity+the+Father+is+the+principle+of+the+Son+but+is+not+the+cause+of+the+Son.+A+principle+is+called+a+cause+only+if+it+communicates+an+existence+or+being-ness+that+is+numerically+distinct+from+itself <blockquote><p>The passages that the Apostle to the Hebrews applies to Christ are not obscure praises of the supreme God: &quot;You, Lord, laid the foundation of the earth in the beginning, and the heavens are the work of your hands.&quot; Also, &quot;Let all God&#x27;s angels worship him.&quot; John begins his Gospel with a splendid proclamation of Christ&#x27;s divinity: &quot;In the beginning was the Word, and the Word was with God, and the Word was God.&quot; This phrase, &quot;the Word was God, and was with God,&quot; clearly argues both the divinity of Christ and the distinction of persons.</p></blockquote>

<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>

</figure><figure class="quote" id="q-ac344361c5" data-kw="">
<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Question 31, section III, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hughes-oliphant-old.html">Hughes Oliphant Old</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Worship in Guides to the Reformed Tradition</cite>, (John Knox Press, 1984), p. 153</span></figcaption>

<blockquote><p>5. The Efficient Cause, I mean the first and Principal Efficient of true worship, is the Holy Ghost, by whom we are moved and stirred up to worship and honor God. 6. For the Spirit is He which gives us faith itself from whence flows worship, and excites us to do the works of piety, both internal and external. He works in us both the will and the deed, after the good pleasure of his will, as the apostle speaks. 7. The Secondary and Less Principal Efficient Cause of worship, are we ourselves, who adore and honor God. 8. The Material Cause is the work itself commanded by God, whereby we serve Him, adoring Him with the greatest reverence we possibly may: for no creature has any right of instituting the worship of God. 9. Hereupon is excluded all will-worship, and the figment of good intention, to wit, when men do evil, that good may come thereof, or when they themselves do invent works, which they obtrude unto God for worship, not works evil in themselves, but yet not commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13. 10. For it is not sufficient, for worship that some work be not evil, or not forbidden, but it ought to be commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13. 11. The Formal Cause is faith. For good works and just actions do not only flow from faith as from the Efficient Cause; even as all human actions proceed from the soul: but also those works have their being from faith, as from a form, whereby they are godly, holy and therefore acceptable unto God. 12. The Final Cause is the glory of God, whereunto must be referred all the whole worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 10, ‘Of the Worship of God…’, pp. 65-66 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>

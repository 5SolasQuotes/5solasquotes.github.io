<main class="wrap"><figure class="quote" id="q-67b307e1e3" data-kw="">
<blockquote><p>The condition of the covenant, the terms of that life, agreed to by the representative, is implied in that he was the last Adam, namely, to go through with what the first Adam had stuck in. Adam, in the covenant of works, stumbled in the course of his obedience, and fell; and by his fall was quite disabled to begin it anew: he thereby came under the penalty of that covenant also, but was utterly unable to discharge it.

So the last Adam comes in the room of the first, not as the first Adam stood in his integrity; for in that case there was no place for a second Adam; but as he lay a broken man under the first bargain. Arid coming in his room in this case, his business was to satisfy the demands of the first covenant, in behalf of his seed. These demands were now run up high, quite beyond what they were to innocent Adam: the penalty was become payable, as well as the principal sum. Wherefore the first covenant being ingrossed in the second, is declared broken; and the principal and penalty being summed up together, the clearing of the whole is laid upon the last or second Adam, as the condition of the second covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 384.</span></figcaption>

k">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a9fc46282" data-kw="">
<blockquote><p>Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law</p></blockquote>

</figure><figure class="quote" id="q-9ab7020e99" data-kw="">
<blockquote><p>Christ is directly intended and pointed out by the law. If ye consider the whole administration of Moses, that is, the law and covenant of works, though it was preached after the fall, yet it was never preached alone without the gospel, and so consider the whole administration of God’s mind and ordinances, Christ is principally aimed at; for, I. The doctrine Moses delivered in mount Sinai contained a covenant of grace. If you look to the preface of the ten commandments, it is even the chief gospel-promise, and article of the covenant.

For, how could God come in terms with men after sin, but in terms of grace; and in no other terms can man stand before God, nor God be his God. And likewise, seeing the gospel was preached in paradise, and afterwards to Abraham, God could not be false in his promise made to Abraham, neither could the promulgation of the law that followed make that null which went before. Gal. iii. 17. What meant all the ceremonial law? It shadowed out Jesus Christ the only sacrifice and propitiation. And this is the sum of the gospel-salvation to penitents believing in Christ, and looking through the sacrifices unto him, and thus David’s righteousness was the imputation of righteousness, and not inherent holiness, Psal. xxxii. 1, 2; Rom. iv. 5.

But, 2. It uses to be a question, whether the law delivered upon mount Sinai was a covenant of works or not; some say that the law which was delivered upon mount Sinai was indeed a covenant of works, though they confess it was preached with the covenant of grace, and not delivered to them to stand by it, or of intention to get righteousness by it, but to be subservient to the covenant of grace. Others speak absolutely, that the law upon mount Sinai was a covenant of grace.

We conceive this is but a contention about words; the matter is clear in itself, (1.) That neither is now the gospel preached without the law, as ye may see in Christ’s sermon upon the mount, and his sermon to the young man, Matt. v. vi. vii.; Mark x. 17; nor yet was then the law preached without the gospel, as ye may see in Exod. xx.; the preface to the commandments, and the second commandment, contain much of the gospel in them, — Deut. xxx. 6, 7, &amp;c., compared with Rom. x. 6, &amp;c., where Paul notes both the righteousness of faith and of the works of the law.

(1.) Those who say the law on mount Sinai was a covenant of works, do not assert that God gave it to be a covenant of works, out of intention that men should seek salvation thereby; but they make it only a schoolmaster to lead us unto Christ and to discover our sinful condition: and those who say it was a covenant of grace, consider it in relation to God’s end of sending it, and as it takes in all the administration and doctrine of Moses.

So there needs be no difficulty here. The matter seems clear, that the covenant of works was preached by Moses, and so it was by Paul, Rom. x., Gal. iii.; and that neither Paul nor Moses preached the covenant of works, but as a broken covenant; not as such that men could stand unto, or be saved by. No man can preach the gospel, unless he preach the covenant of works, not because both concur to the justification of a sinner, but because the knowledge of a man’s own lost condition under the one presses him to flee to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Sermons upon the Most Important Subjects of Practical Religion</cite>, (1760) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 3: 282-83.</span></figcaption>

<blockquote><p>In the natural path of everlasting life the first beginning is that ability of doing good, which God in the day of man’s creation endued him with; from hence obedience unto the will of his Creator, absolute righteousness and integrity in all his actions; and last of all the justice of God rewarding the worthiness of his deserts with the crown of eternal glory. Had Adam continued in his first estate, this had been the way of life unto him and all his posterity.</p></blockquote>

<blockquote><p>1. Christ is a doer and fulfiller of the covenant of works most exactly in all points, both the command, and the curse and penalty of the Covenant, is satisfied by him; this is works, and this was the condition required upon his part, Heb. 10. 7, “Then said I, lo I come, in the volume of the book it is written of me, to do your will, O God.” Gal. 3. 13, “Christ has redeemed us from the curse of the Law, being made a curse for us.”

2. Christ as a doer and obedient fulfiller of the Law, has a reward in justice by the promise of this covenant: For (I humbly conceive) he had his reward of debt, and merit, having paid a condign price to the justice of God; therefore his reward is due to him, by commutative Justice, Phil. 2. 7, 8, “But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of man; And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the Cross; wherefore God also hath highly exalted him,” and is craved by him, Joh. 17. 4, 5, “I have glorified you on earth, I have finished the work which you gaves me to do. And now, O Father, glorify me with your own self.</p></blockquote>

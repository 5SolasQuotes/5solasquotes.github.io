<main class="wrap"><figure class="quote" id="q-4eb556b15c" data-kw="">
<blockquote><p>Goodness and badness, then, are not on a metaphysical par. Goodness is primary, since it is to be understood in terms of the presence of some feature. Badness is derivative, since it amounts to nothing more than the absence of some feature, and in particular the absence of goodness of some kind or other. Goodness is a kind of actuality, and badness a kind of unrealized potentiality. To be bad in some respect is, ultimately, to lack something rather than to have something, just as to be blind is simply to lack sight rather than to have some positive feature… But if, as the principle of proportionate causality holds, whatever is in an effect must in some way be in its cause, wouldn’t it follow that all badness or evil too must be in God? That does not follow. The reason is that, as we have seen, badness of any sort is the absence of something, rather than a positive reality in its own right. Hence, while it is perfectly true to say that there is evil in the world, what this amounts to on analysis is simply that certain good things are absent from the world. Thus, making a world with evil in it is not a matter of making two kinds of thing, good things and bad things. Rather, it is only a matter of making good things, but also refraining from making some of the good things that could have been there. Suppose I begin to draw a triangle on a piece of paper, but after drawing two sides and starting to draw the third, I stop before the side is finished. The triangle, being defective, manifests a certain kind of badness. But the badness is not some extra thing I have put into it after drawing the triangle. Rather, the badness amounts to the absence of something I refrained from putting there. It is in that sense that God creates a world with evil in it. Evil is not some thing that God has put into the world alongside all the good things He has put there. Rather, evil is the absence of certain good things He refrained from putting there. Now, what the principle of proportionate causality entails is that whatever things, whatever positive features, are in an effect must in some way be in its total cause. But since that is not the sort of thing evil is, the principle does not entail that evil must in any way be in God. Yet wouldn’t God’s failure to create all the good He could have created constitute a defect in Him? No. Would my failure to finish drawing the triangle in my example indicate the presence of a defect in me? Not at all, since I might have a very good reason for not finishing it. For example, it may have occurred to me that there was no more effective way to make a certain philosophical point during the course of a lecture than by drawing an incomplete triangle and then going on to use it as an example. The good effect of generating philosophical understanding in my listeners would outweigh the trivial instance of badness represented by the imperfect triangle. Considered in isolation, the incomplete triangle is bad, but the overall situation consisting of the triangle together with the lecture, the audience members’ coming to understand a certain philosophical point, and so forth is good, and it is a good that would not have been possible without allowing into it this element of badness. Similarly, God’s refraining from causing all the particular good things he could have caused is consistent with his being perfectly good insofar as the overall creation is good in ways it could not have been had certain localized instances of badness not been permitted to exist. To take just one example, courage could not exist unless people faced real danger of suffering harm and yet did the right thing anyway. But courage is good and suffering harm bad. Hence, a world with that particular good in it could not exist unless that particular sort of badness also existed in it. Hence, just as even God cannot cause a round square to exist, neither can He cause a world to exist in which there is courage but where no one faces any real danger of suffering harm. Hence, God’s being perfectly good is consistent with the world He causes having badness in it as well as goodness.</p></blockquote>

<blockquote><p>The atheist says that if God exists, He would, being all-powerful and all-good, prevent the suffering we see around us; yet suffering persists; therefore God does not exist… there is much that could be said.² But Aquinas, as he so often does, gets to the nub of the matter. The first premise of the atheist’s argument is simply false, or at least unjustifiable — that is to say, there is no reason whatever to think that an all-powerful and all-good God would prevent the suffering we see around us — for it is ‘part of the infinite goodness of God, that He should allow evil to exist, and out of it to produce good.’² ¹ See Brian Davies, The Reality of God and the Problem of Evil (Continuum, 2006) for an excellent recent full length treatment. ² Summa Theologiae, I, q. 2, a. 3, ad 1… If God can bring out of the evils that we actually experience a good that is far greater than what would have existed without them, then of course He would allow those evils. But God is infinite in power, knowledge, and all the rest — Pure Actuality, Being Itself, Goodness Itself, and so forth, as we have seen — and, since human beings have immortal souls, so that our lives in the here-and-now are but a trivial blink of the eye compared to the eternity we are to enter, there is no limit to the good result that might be made in the next life out of even the worst evils we suffer in this one. For even the worst evils we suffer are finite. Therefore there is every reason to think that God can and will bring out of the sufferings of this life a good that so overshadows them that this life will be seen in retrospect to have been worth it. …Suppose your child is trying to learn how to play the violin. This will require much practice, and thus a sacrifice of time that could be spent playing. It will also require hours of frustration and boredom, some pain and discomfort… and possibly humiliation when at recitals and the like he makes serious mistakes… He may often want to give it up, and keeping him from doing so may require not only encouragement but also occasional punishments for failures to practice every day. On bad days he might almost hate you for what you’re putting him through. But eventually he becomes very good indeed, and the frustration he once felt disappears entirely. He might even forget about it almost completely, and if he is a normal, sane human being he certainly will never hold it against you or think the suffering he once thought was unbearable is even worth thinking about now. Indeed, if anything, his accomplishment will have the value for him that it does precisely because he had to suffer for it. In hindsight, he might well say that he wouldn’t have had it any other way. Of course, I am not claiming that the relatively minor suffering in question is comparable to the death of a child, or bone cancer, or Auschwitz. But then, neither could the relatively minor joy of being a great violinist compare to the beatific vision. Indeed, even the greatest horror we can imagine in this life pales in insignificance before the beatific vision. To quote St. Paul once again, “the sufferings of this present time are not worth comparing with the glory that is to be revealed to us.” (Rom. 8:18, RSV)… Reason itself, as I have argued, shows us that there is a First Cause who is Being Itself, Goodness Itself, all-powerful, allknowing, and all the rest, and it also shows us that we have immortal souls. Hence reason tells us that there is a God who created us for a destiny beyond this life and who is fully capable of guaranteeing that the good we attain in the next life outweighs the evil we suffer in this one to such an extent that the latter, however awful from our present point of view, will come to seem “not worth comparing” to the former, and indeed if anything will even be seen to have been worth having gone through from the point of view of eternity. And therefore, reason itself tells us that there is simply no reason to believe that even the worst possible sufferings of this life constitute any evidence whatsoever against the existence of God. Nevertheless, since we are finite beings, it can be very hard to keep this in mind when faced with severe suffering. The arguments of philosophers and theologians, however logically impeccable, seem cruelly abstract and cold when compared to the agony of the parents of a raped and murdered child. But then, reason is abstract and cold. Atheists are always telling us how we need soberly to follow it where it leads us, even if it were to break our hearts by telling us that there is no hope for cosmic justice, no hope for seeing lost loved ones ever again, no hope for a life beyond this one… Thomas Aquinas reassures us that in fact no matter how bad things get in this life, reason assures us that God can set it right… In any event, it is precisely because of the abstraction and coldness of reason that a kind of faith is needed where evil is concerned… faith in God in the face of evil is nothing less than the will to follow reason’s lead when emotion might incline us to doubt… Yet reason says that that pain is part of an overall plan which we cannot yet fathom, but one in which God can bring out of that pain a good compared to which it will pale in insignificance. Hence reason tells us: have faith in God. We will not always be able to understand what that plan is, or how this or that particular instance of suffering fits into it. We have some general clues here and there — for instance, the fact that certain goods, like patience, forgiveness, and self-sacrifice, cannot be had without certain evils. But we don’t know the details. And yet, why should we expect to know them? If there is a God of the sort the arguments I’ve described point to, and if the soul’s ultimate destiny surpasses the cares of this life in the way its immortality implies, then these matters are so far beyond our ordinary experience that it would be extremely surprising if we could fully understand them…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The atheist says that if God exists, He would, being all-powerful and all-good, prevent the suffering we see around us; yet suffering persists; therefore God does not exist… there is much that could be said.² But Aquinas, as he so often does, gets to the nub of the matter. The first premise of the atheist’s argument is simply false, or at least unjustifiable — that is to say, there is no reason whatever to think that an all-powerful and all-good God would prevent the suffering we see around us — for it is ‘part of the infinite goodness of God, that He should allow evil to exist, and out of it to produce good.’² ¹ See Brian Davies, The Reality of God and the Problem of Evil (Continuum, 2006) for an excellent recent full length treatment. ² Summa Theologiae, I, q. 2, a. 3, ad 1… If God can bring out of the evils that we actually experience a good that is far greater than what would have existed without them, then of course He would allow those evils. But God is infinite in power, knowledge, and all the rest — Pure Actuality, Being Itself, Goodness Itself, and so forth, as we have seen — and, since human beings have immortal souls, so that our lives in the here-and-now are but a trivial blink of the eye compared to the eternity we are to enter, there is no limit to the good result that might be made in the next life out of even the worst evils we suffer in this one. For even the worst evils we suffer are finite. Therefore there is every reason to think that God can and will bring out of the sufferings of this life a good that so overshadows them that this life will be seen in retrospect to have been worth it. …Suppose your child is trying to learn how to play the violin. This will require much practice, and thus a sacrifice of time that could be spent playing. It will also require hours of frustration and boredom, some pain and discomfort… and possibly humiliation when at recitals and the like he makes serious mistakes… He may often want to give it up, and keeping him from doing so may require not only encouragement but also occasional punishments for failures to practice every day. On bad days he might almost hate you for what you’re putting him through. But eventually he becomes very good indeed, and the frustration he once felt disappears entirely. He might even forget about it almost completely, and if he is a normal, sane human being he certainly will never hold it against you or think the suffering he once thought was unbearable is even worth thinking about now. Indeed, if anything, his accomplishment will have the value for him that it does precisely because he had to suffer for it. In hindsight, he might well say that he wouldn’t have had it any other way. Of course, I am not claiming that the relatively minor suffering in question is comparable to the death of a child, or bone cancer, or Auschwitz. But then, neither could the relatively minor joy of being a great violinist compare to the beatific vision. Indeed, even the greatest horror we can imagine in this life pales in insignificance before the beatific vision. To quote St. Paul once again, “the sufferings of this present time are not worth comparing with the glory that is to be revealed to us.” (Rom. 8:18, RSV)… Reason itself, as I have argued, shows us that there is a First Cause who is Being Itself, Goodness Itself, all-powerful, allknowing, and all the rest, and it also shows us that we have immortal souls. Hence reason tells us that there is a God who created us for a destiny beyond this life and who is fully capable of guaranteeing that the good we attain in the next life outweighs the evil we suffer in this one to such an extent that the latter, however awful from our present point of view, will come to seem “not worth comparing” to the former, and indeed if anything will even be seen to have been worth having gone through from the point of view of eternity. And therefore, reason itself tells us that there is simply no reason to believe that even the worst possible sufferings of this life constitute any evidence whatsoever against the existence of God. Nevertheless, since we are finite beings, it can be very hard to keep this in mind when faced with severe suffering. The arguments of philosophers and theologians, however logically impeccable, seem cruelly abstract and cold when compared to the agony of the parents of a raped and murdered child. But then, reason is abstract and cold. Atheists are always telling us how we need soberly to follow it where it leads us, even if it were to break our hearts by telling us that there is no hope for cosmic justice, no hope for seeing lost loved ones ever again, no hope for a life beyond this one… Thomas Aquinas reassures us that in fact no matter how bad things get in this life, reason assures us that God can set it right… In any event, it is precisely because of the abstraction and coldness of reason that a kind of faith is needed where evil is concerned… faith in God in the face of evil is nothing less than the will to follow reason’s lead when emotion might incline us to doubt… Yet reason says that that pain is part of an overall plan which we cannot yet fathom, but one in which God can bring out of that pain a good compared to which it will pale in insignificance. Hence reason tells us: have faith in God. We will not always be able to understand what that plan is, or how this or that particular instance of suffering fits into it. We have some general clues here and there — for instance, the fact that certain goods, like patience, forgiveness, and self-sacrifice, cannot be had without certain evils. But we don’t know the details. And yet, why should we expect to know them? If there is a God of the sort the arguments I’ve described point to, and if the soul’s ultimate destiny surpasses the cares of this life in the way its immortality implies, then these matters are so far beyond our ordinary experience that it would be extremely surprising if we could fully understand them…”

— Edward Feser, The Last Superstition: a Refutation of the New Atheism (St. Augustine’s Press, 2008), ch. 4, ‘Scholastic Aptitude’, ‘Faith, Reason &amp; Evil’, pp. 161-64">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+atheist+says+that+if+God+exists%2C+He+would%2C+being+all-powerful+and+all-good%2C+prevent+the+suffering+we+see+around+us%3B+yet+suffering+persists%3B+therefore+God+does+not+exist%E2%80%A6+there+is+much+that+could+be+said.%C2%B2+But+Aquinas%2C+as+he+so+often+does%2C+gets+to+the+nub+of+the+matter.+The+first+premise+of+the+atheist%E2%80%99s+argument+is+simply+false%2C+or+at+least+unjustifiable+%E2%80%94+that+is+to+say%2C+there+is+no+reason+whatever+to+think+that+an+all-powerful+and+all-good+God+would+prevent+the+suffering+we+see+around+us+%E2%80%94+for+it+is+%E2%80%98part+of+the+infinite+goodness+of+God%2C+that+He+should+allow+evil+to+exist%2C+and+out+of+it+to+produce+good.%E2%80%99%C2%B2+%C2%B9+See+Brian+Davies%2C+The+Reality+of+God+and+the+Problem+of+Evil+%28Continuum%2C+2006%29+for+an+excellent+recent+full+length+treatment.+%C2%B2+Summa+Theologiae%2C+I%2C+q.+2%2C+a.+3%2C+ad+1%E2%80%A6+If+God+can+bring+out+of+the+evils+that+we+actually+experience+a+good+that+is+far+greater+than+what+would+have+existed+without+them%2C+then+of+course+He+would+allow+those+evils.+But+God+is+infinite+in+power%2C+knowledge%2C+and+all+the+rest+%E2%80%94+Pure+Actuality%2C+Being+Itself%2C+Goodness+Itself%2C+and+so+forth%2C+as+we+have+seen+%E2%80%94+and%2C+since+human+beings+have+immortal+souls%2C+so+that+our+lives+in+the+here-and-now+are+but+a+trivial+blink+of+the+eye+compared+to+the+eternity+we+are+to+enter%2C+there+is+no+limit+to+the+good+result+that+might+be+made+in+the+next+life+out+of+even+the+worst+evils+we+suffer+in+this+one.+For+even+the+worst+evils+we+suffer+are+finite.+Therefore+there+is+every+reason+to+think+that+God+can+and+will+bring+out+of+the+sufferings+of+this+life+a+good+that+so+overshadows+them+that+this+life+will+be+seen+in+retrospect+to+have+been+worth+it.+%E2%80%A6Suppose+your+child+is+trying+to+learn+how+to+play+the+violin.+This+will+require+much+practice%2C+and+thus+a+sacrifice+of+time+that+could+be+spent+playing.+It+will+also+require+hours+of+frustration+and+boredom%2C+some+pain+and+discomfort%E2%80%A6+and+possibly+humiliation+when+at+recitals+and+the+like+he+makes+serious+mistakes%E2%80%A6+He+may+often+want+to+give+it+up%2C+and+keeping+him+from+doing+so+may+require+not+only+encouragement+but+also+occasional+punishments+for+failures+to+practice+every+day.+On+bad+days+he+might+almost+hate+you+for+what+you%E2%80%99re+putting+him+through.+But+eventually+he+becomes+very+good+indeed%2C+and+the+frustration+he+once+felt+disappears+entirely.+He+might+even+forget+about+it+almost+completely%2C+and+if+he+is+a+normal%2C+sane+human+being+he+certainly+will+never+hold+it+against+you+or+think+the+suffering+he+once+thought+was+unbearable+is+even+worth+thinking+about+now.+Indeed%2C+if+anything%2C+his+accomplishment+will+have+the+value+for+him+that+it+does+precisely+because+he+had+to+suffer+for+it.+In+hindsight%2C+he+might+well+say+that+he+wouldn%E2%80%99t+have+had+it+any+other+way.+Of+course%2C+I+am+not+claiming+that+the+relatively+minor+suffering+in+question+is+comparable+to+the+death+of+a+child%2C+or+bone+cancer%2C+or+Auschwitz.+But+then%2C+neither+could+the+relatively+minor+joy+of+being+a+great+violinist+compare+to+the+beatific+vision.+Indeed%2C+even+the+greatest+horror+we+can+imagine+in+this+life+pales+in+insignificance+before+the+beatific+vision.+To+quote+St.+Paul+once+again%2C+%E2%80%9Cthe+sufferings+of+this+present+time+are+not+worth+comparing+with+the+glory+that+is+to+be+revealed+to+us.%E2%80%9D+%28Rom.+8%3A18%2C+RSV%29%E2%80%A6+Reason+itself%2C+as+I+have+argued%2C+shows+us+that+there+is+a+First+Cause+who+is+Being+Itself%2C+Goodness+Itself%2C+all-powerful%2C+allknowing%2C+and+all+the+rest%2C+and+it+also+shows+us+that+we+have+immortal+souls.+Hence+reason+tells+us+that+there+is+a+God+who+created+us+for+a+destiny+beyond+this+life+and+who+is+fully+capable+of+guaranteeing+that+the+good+we+attain+in+the+next+life+outweighs+the+evil+we+suffer+in+this+one+to+such+an+extent+that+the+latter%2C+however+awful+from+our+present+point+of+view%2C+will+come+to+seem+%E2%80%9Cnot+worth+comparing%E2%80%9D+to+the+former%2C+and+indeed+if+anything+will+even+be+seen+to+have+been+worth+having+gone+through+from+the+point+of+view+of+eternity.+And+therefore%2C+reason+itself+tells+us+that+there+is+simply+no+reason+to+believe+that+even+the+worst+possible+sufferings+of+this+life+constitute+any+evidence+whatsoever+against+the+existence+of+God.+Nevertheless%2C+since+we+are+finite+beings%2C+it+can+be+very+hard+to+keep+this+in+mind+when+faced+with+severe+suffering.+The+arguments+of+philosophers+and+theologians%2C+however+logically+impeccable%2C+seem+cruelly+abstract+and+cold+when+compared+to+the+agony+of+the+parents+of+a+raped+and+murdered+child.+But+then%2C+reason+is+abstract+and+cold.+Atheists+are+always+telling+us+how+we+need+soberly+to+follow+it+where+it+leads+us%2C+even+if+it+were+to+break+our+hearts+by+telling+us+that+there+is+no+hope+for+cosmic+justice%2C+no+hope+for+seeing+lost+loved+ones+ever+again%2C+no+hope+for+a+life+beyond+this+one%E2%80%A6+Thomas+Aquinas+reassures+us+that+in+fact+no+matter+how+bad+things+get+in+this+life%2C+reason+assures+us+that+God+can+set+it+right%E2%80%A6+In+any+event%2C+it+is+precisely+because+of+the+abstraction+and+coldness+of+reason+that+a+kind+of+faith+is+needed+where+evil+is+concerned%E2%80%A6+faith+in+God+in+the+face+of+evil+is+nothing+less+than+the+will+to+follow+reason%E2%80%99s+lead+when+emotion+might+incline+us+to+doubt%E2%80%A6+Yet+reason+says+that+that+pain+is+part+of+an+overall+plan+which+we+cannot+yet+fathom%2C+but+one+in+which+God+can+bring+out+of+that+pain+a+good+compared+to+which+it+will+pale+in+insignificance.+Hence+reason+tells+us%3A+have+faith+in+God.+We+will+not+always+be+able+to+understand+what+that+plan+is%2C+or+how+this+or+that+particular+instance+of+suffering+fits+into+it.+We+have+some+general+clues+here+and+there+%E2%80%94+for+instance%2C+the+fact+that+certain+goods%2C+like+patience%2C+forgiveness%2C+and+self-sacrifice%2C+cannot+be+had+without+certain+evils.+But+we+don%E2%80%99t+know+the+details.+And+yet%2C+why+should+we+expect+to+know+them%3F+If+there+is+a+God+of+the+sort+the+arguments+I%E2%80%99ve+described+point+to%2C+and+if+the+soul%E2%80%99s+ultimate+destiny+surpasses+the+cares+of+this+life+in+the+way+its+immortality+implies%2C+then+these+matters+are+so+far+beyond+our+ordinary+experience+that+it+would+be+extremely+surprising+if+we+could+fully+understand+them%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+The+Last+Superstition%3A+a+Refutation+of+the+New+Atheism+%28St.+Augustine%E2%80%99s+Press%2C+2008%29%2C+ch.+4%2C+%E2%80%98Scholastic+Aptitude%E2%80%99%2C+%E2%80%98Faith%2C+Reason+%26+Evil%E2%80%99%2C+pp.+161-64&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F624fa6ec18.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/624fa6ec18.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/god-is-not-the-author-of-evil/#:~:text=The%20atheist%20says%20that%20if%20God,if%20we%20could%20fully%20understand%20them&amp;text=The%20atheist%20says%20that%20if%20God%20exists%2C%20He&amp;text=extremely%20surprising%20if%20we%20could%20fully%20understand%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>

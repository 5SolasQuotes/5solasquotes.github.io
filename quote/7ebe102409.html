<blockquote><p>…the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to Justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, 2nd pt., ch. 5, p. 349 of A Treatise of the Covenant of Grace (London, 1645)</span></figcaption>

<blockquote><p>Wherefore we are not to imagine that faith is infused either before or without other graces, or that the soul is not at the same time and as soon disposed to love and fear God as to believe in Him, or to humility, to patience, to charity, to repentance, as for faith. The seed of all these graces is sown at once; and for their habits they are coeval stems of one common root of inherent sanctity: though yet some of them shoot up faster and bear fruit sooner than other. Those that do so are the two principal graces of faith and repentance: the actions of both which seem to appear first in the regenerate: which of them show first, I will not now dispute; but certain it is that the regenerate soul works here most lively and stirring, and after the infusion of spirituall life the pulse beats strongest in those arteries. The reason whereof I take it is, the singular use of these two graces arising from the manner of our conversion: which being wrought by the sight of sin and misery on the one side, and the representation of grace and mercy on the other, of necessity draws the newly-regenerate soul by strong motions immediately to conceive sorrow for, and detestation of its sinful misery, and also to a vehement desiring and looking after the promise of grace, which may bring it deliverance from an estate so damnable. But in this point of the priority of one grace before another, we may not be too bold nor curious: for as the working of the Holy Ghost is secret and wonderful, in making us wild gourds partakers of the sap and sweetness of the true vine: so is it not possibly observable in all or the most, where, and in what branch this sap first buds forth into blossoms and fruit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 11-12</span></figcaption>

<blockquote><p>For we all acknowledge and clearly profess, that God infuses a righteousness of this kind in the very act of justifying; but we deny that the sentence of God in justifying has respectto this as to the cause by which man is constituted justified.</p></blockquote>

</figure><figure class="quote" id="q-e54df171fc" data-kw="">
<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 34, ‘Of Repentance’, p. 245</span></figcaption>

<blockquote><p>4. For to your first demand, ‘Is this free grace?’ I shall crave leave to return you a counter-demand: Suppose a king be content at the suit either of the parties themselves or some friend of theirs, to grant his gracious pardon to a company of notorious rebels that had risen against him, set up some base desperate rogue in his room, done him all the despight and mischeif they were able to do; and being apprehended, arraigned and condemned to such death as by their wicked demerits they had most justly deserved, upon condition that they aknowledge their offence and their sorrow for it, with purpose and promise of living loyally for time to come; whether you would deem this to be free grace, or no? …refer it to any indifferent reader whatsoever to determine, whether he were not a most ungracious wretch, that having his pardon on such terms granted and signed him, should in regard of those conditions, deny it to be of free grace: and whether they do not blaspheme God’s free-grace that deny it to be free grace, if it be propounded on terms of belief, repentance and amendement of life. Sir, whatsoever you say of us, take heed how you tell Christ that He does not freely save you if He will not save you unless you believe.</p></blockquote>

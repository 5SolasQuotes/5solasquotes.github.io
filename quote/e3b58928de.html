<main class="wrap"><figure class="quote" id="q-e3b58928de" data-kw="">
<blockquote><p>If Mr. Baxter go on with his intentions about a tract concerning universal redemption, perhaps we may have these things cleared; and yet, we must tell him beforehand, that if he draw forth nothing on that subject but what is done by Amyraldus, and like things to them, he will give little satisfaction to learned and stable men upon the issue of his undertaking. I shall not presume to take another man’s task out of his hand, especially one’s who is so every way able to go through with it; else I durst undertake to demonstrate that treatise of Amyraldus, mentioned by Mr. Baxter, to be full of weak and sophistical argumentations, absurd contradictions, vain strife of words, and, in sum, to be as birthless a tympanous endeavour as ever so learned a man was engaged in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 10 (Edinburgh: T&amp;T Clark, n.d.), 478–79.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07510bafa9" data-kw="">
<blockquote><p>Sive secundum nostram rationem distinguamus illud decretum in plura, sive dicamus esse unicum, non est multum curandum: Certum enim est apud omnes, Deum omnia et singula voluisse unico simplicissimo acta suae voluntatis: Est enim ipsius voluntas, et voluntatis operatio idem quod sua essentia simplex et individua si aliquis contenderet esse etiam nostro modo intelligendi esse unicum actum simplicissimum voluntatis, ego non curabo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-vasquez.html">Gabriel Vasquez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, Summa, pt. 1, quest. 14, art. 13, disp. 65 as quoted in a margin note in Richard Baxter, Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 14 Baxter comments: “and is not this a short end of many controversies?”</span></figcaption>

</figure><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

<blockquote><p>Who teach: That there is in this life no fruit and no consciousness of the unchangeable election to glory, nor any certainty, except that which depends on a changeable and uncertain condition. For not only is it absurd to speak of an uncertain certainty, but also contrary to the experience of the saints, who by virtue of the consciousness of their election rejoice with the apostle and praise this favor of God (Eph. 1).</p></blockquote>

<blockquote><p>The Fifth Age is of the Church reverting, and Antichrist raging, until this present age when Reformation was aimed at and begun in the West, Antichristian pride was detected and the number of true believers did increase. Then Satan was let loose again, the thousand years of his binding, from the days of Constantine, being expired: then persecutions were frequent; Antichrist foamed and opened his mouth wide to devour the sheep of Jesus. But he who preserved the Woman in the wilderness is the stronger, so that the gates of Hell were not able nor shall be able to prevail against her; yea by the breath of his mouth and preaching of the Word her enemies are scattered, Antichrist is revealed and true Christians are multiplied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-petrie.html">Alexander Petrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendious History of the Catholic Church from the year 600 untill the year 1600, showing her Deformation &amp; Reformation: together with the rise, reign, rage, and begin-fall of the Roman Antichrist... (Hague: Adrian Vlack, 1657), Preface</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

<blockquote><p>‘And bound him;’ From the open slaughtering of the saints, as he had done by the heathen emperors; or, from molesting and mischiefing of God’s people, otherwise he is not bound one hour, Job 1:6-12 1 Peter 5:8. And how his vicegerent the beast has bestirred him during the thousand years, who knows not? ‘A thousand years;’ Hos explicate fateor trepide me aggredi, says [David] Pareus. He begins the thousand at the destruction of the temple, A.D. 73, and so it ends in Pope Hildebrand, who stepped into that chair of pestilence, A. D. 1073. Others begin it at the birth of Christ, and end in Sylvester II. Others at Christ’s passion, and end in Benedict IX. But they do best, in my opinion, that begin at Constantine and end in Boniface VIII, who is of his own said to have entered like a fox, reigned as a lion, and died as a dog. He excommunicated the French king, and published this decree, that the Bishop of Rome ought to be judged of none, although he should carry innumerable souls with him to hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Rev. 2, verse 2</cite></span></figcaption>

<blockquote><p>For his heart would have served him too seduce all nations, and to hold them still in the pestilent errors of idolatry, yea and in all kind of horrible misdeeds. But God has plucked them out of the power of darkness, and removed them into the kingdom of his dear beloved Son, Col. …13, till the thousand years be fulfilled. That is to say, till Antichrist be come. And after that he must be let loose. This thing came to pass after that the dominion as well of Mahumet as of the Romish bishop was so increased in strength that they became terrible to all kings and princes of the earth, for as much as they were able, not only to grieve them when they listed, but also to cast them from their seats, and to tread them quite under foot, until they submitted their necks to false religion and rightless laws: which thing is done yet still at this day, according as Paul foretold. 2. Thess. 2. b. 11.</p></blockquote>

</figure><figure class="quote" id="q-6d5fca2ad6" data-kw="">
<blockquote><p>Those who make it fully past, begin at four periods, 1. some at Christs birth, and end at Pope Sylvester II, a magician. 2. Some at His death, and end at Benedict III, suffocated by the devil. 3. Others, at the destruction of Jerusalem, and so end it in Gregory VII, or Hildebrand. 4. Most begin it at Constantine’s reign, making this contemporary with that of Satan’s being cast from heaven, ch. 12. This is also ended, anno 1300, in Boniface VIII, when the wars against the Waldenses began. [John] Prideaux, De mille annis Apoc. does thus sum those of that opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the book of the Revelation… (Edinburgh: Higgins, 1658), ch. 20, Lecture 4</cite>, p. 723</span></figcaption>

</figure><figure class="quote" id="q-af4aa8dc1b" data-kw="">
<blockquote><p>II. Where these thousand yeers have their beginning and ending. Such as understand the thousand yeers definitely are diversly minded about their beginning, as by and by I will show. I suppose it best to take their beginning from the angel’s descension: because otherwise the determination of the thousand yeers, so often repeated, should be uncertain and vain: I say, in case they should have an indeterminated beginning elsewhere: Now the descension of the angel was in the incarnation of the Son of God, as before we showed. Notwithstanding Satan was not bound presently upon his nativity: because the Son of God did not immediatly exercise his power in his childhood. But the true beginning is understood from the cause why the dragon should be bound: which was that he should deceive the nations no more: to wit, by keeping them in paganism and turning them from the Gospel of Christ. Therefore when the Dragon began to desist from deceiving the nations, then he was bound. Now he desisted from seducing the nations any longer, not presently, at the beginning of the ministry, or resurrection of Christ, or of the preaching of the apostles (although the angel did then begin to cast the great chain upon the dragon) but especially after the dispersion of the Jews and the destruction of the Jewish temple, and worship by the Romans: for before that time, the beginnings of the gentiles’ conversion to Christ were but small: because the dragon never ceased to hinder the gentiles from the Gospel of Christ by means of the turbulent Jews, as the history of the Acts of the Apostles testifies. But afterward, Jerusalem being destroyed, the Jews were rejected and dissipated, and in their room the Gentiles were called and added to the Church, as Paul teaches, Acts 13:46; Rom. 11:11, etc. Then at length it appeared that Satan was bound, because he was not able to seduce the nations any longer or uphold paganism. But that was in the year of our Lord 73. This year therefore we make the beginning of the thousand years of Satan’s binding. From hence unto the year of our Lord 1073 are a thousand years, at which time Pope Gregory VII, a Celtiberian monk, and diabolical juggler, poisoning Alexander II, invaded the Papacy by most wicked arts: who sitting on the papal chair, the devill began again to be loosed and to rage tumultuously, filling the Christian world in a horrible manner with wars and slaughters by the means of this his cursed instrument…. … Thus I have laid down my judgement, agreeing with other most learned interpreters before me, as Bullinger, Junius, etc. not that I do tie any man unto it, but leave it to consideration: but they who begin the thousand years from Christ’s nativity, as Aretius, or from his resurrection, as Chytraeus [a Lutheran]: or from the time of universal Christianism under Constantine the Great, as Brightman, Napier, etc. although they differ a little in the terms, yet all have this common with us, that the first thousand years from Christ’s birth is to be ascribed to Satan’s imprisonment and that the dragon is now long ago loosed out of prison.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Divine Revelation of the Apostle &amp; Evangelist John… tr. Elias Arnold (d. 1622; Amsterdam: C.P., 1644), ch. 20, pp. 508 &amp; 510</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>
<div class="actions"><button class="copy" data-copy="“II. Where these thousand yeers have their beginning and ending. Such as understand the thousand yeers definitely are diversly minded about their beginning, as by and by I will show. I suppose it best to take their beginning from the angel’s descension: because otherwise the determination of the thousand yeers, so often repeated, should be uncertain and vain: I say, in case they should have an indeterminated beginning elsewhere: Now the descension of the angel was in the incarnation of the Son of God, as before we showed. Notwithstanding Satan was not bound presently upon his nativity: because the Son of God did not immediatly exercise his power in his childhood. But the true beginning is understood from the cause why the dragon should be bound: which was that he should deceive the nations no more: to wit, by keeping them in paganism and turning them from the Gospel of Christ. Therefore when the Dragon began to desist from deceiving the nations, then he was bound. Now he desisted from seducing the nations any longer, not presently, at the beginning of the ministry, or resurrection of Christ, or of the preaching of the apostles (although the angel did then begin to cast the great chain upon the dragon) but especially after the dispersion of the Jews and the destruction of the Jewish temple, and worship by the Romans: for before that time, the beginnings of the gentiles’ conversion to Christ were but small: because the dragon never ceased to hinder the gentiles from the Gospel of Christ by means of the turbulent Jews, as the history of the Acts of the Apostles testifies. But afterward, Jerusalem being destroyed, the Jews were rejected and dissipated, and in their room the Gentiles were called and added to the Church, as Paul teaches, Acts 13:46; Rom. 11:11, etc. Then at length it appeared that Satan was bound, because he was not able to seduce the nations any longer or uphold paganism. But that was in the year of our Lord 73. This year therefore we make the beginning of the thousand years of Satan’s binding. From hence unto the year of our Lord 1073 are a thousand years, at which time Pope Gregory VII, a Celtiberian monk, and diabolical juggler, poisoning Alexander II, invaded the Papacy by most wicked arts: who sitting on the papal chair, the devill began again to be loosed and to rage tumultuously, filling the Christian world in a horrible manner with wars and slaughters by the means of this his cursed instrument…. … Thus I have laid down my judgement, agreeing with other most learned interpreters before me, as Bullinger, Junius, etc. not that I do tie any man unto it, but leave it to consideration: but they who begin the thousand years from Christ’s nativity, as Aretius, or from his resurrection, as Chytraeus [a Lutheran]: or from the time of universal Christianism under Constantine the Great, as Brightman, Napier, etc. although they differ a little in the terms, yet all have this common with us, that the first thousand years from Christ’s birth is to be ascribed to Satan’s imprisonment and that the dragon is now long ago loosed out of prison.”

— David Pareus, A Commentary upon the Divine Revelation of the Apostle &amp; Evangelist John… tr. Elias Arnold (d. 1622; Amsterdam: C.P., 1644), ch. 20, pp. 508 &amp; 510">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+Where+these+thousand+yeers+have+their+beginning+and+ending.+Such+as+understand+the+thousand+yeers+definitely+are+diversly+minded+about+their+beginning%2C+as+by+and+by+I+will+show.+I+suppose+it+best+to+take+their+beginning+from+the+angel%E2%80%99s+descension%3A+because+otherwise+the+determination+of+the+thousand+yeers%2C+so+often+repeated%2C+should+be+uncertain+and+vain%3A+I+say%2C+in+case+they+should+have+an+indeterminated+beginning+elsewhere%3A+Now+the+descension+of+the+angel+was+in+the+incarnation+of+the+Son+of+God%2C+as+before+we+showed.+Notwithstanding+Satan+was+not+bound+presently+upon+his+nativity%3A+because+the+Son+of+God+did+not+immediatly+exercise+his+power+in+his+childhood.+But+the+true+beginning+is+understood+from+the+cause+why+the+dragon+should+be+bound%3A+which+was+that+he+should+deceive+the+nations+no+more%3A+to+wit%2C+by+keeping+them+in+paganism+and+turning+them+from+the+Gospel+of+Christ.+Therefore+when+the+Dragon+began+to+desist+from+deceiving+the+nations%2C+then+he+was+bound.+Now+he+desisted+from+seducing+the+nations+any+longer%2C+not+presently%2C+at+the+beginning+of+the+ministry%2C+or+resurrection+of+Christ%2C+or+of+the+preaching+of+the+apostles+%28although+the+angel+did+then+begin+to+cast+the+great+chain+upon+the+dragon%29+but+especially+after+the+dispersion+of+the+Jews+and+the+destruction+of+the+Jewish+temple%2C+and+worship+by+the+Romans%3A+for+before+that+time%2C+the+beginnings+of+the+gentiles%E2%80%99+conversion+to+Christ+were+but+small%3A+because+the+dragon+never+ceased+to+hinder+the+gentiles+from+the+Gospel+of+Christ+by+means+of+the+turbulent+Jews%2C+as+the+history+of+the+Acts+of+the+Apostles+testifies.+But+afterward%2C+Jerusalem+being+destroyed%2C+the+Jews+were+rejected+and+dissipated%2C+and+in+their+room+the+Gentiles+were+called+and+added+to+the+Church%2C+as+Paul+teaches%2C+Acts+13%3A46%3B+Rom.+11%3A11%2C+etc.+Then+at+length+it+appeared+that+Satan+was+bound%2C+because+he+was+not+able+to+seduce+the+nations+any+longer+or+uphold+paganism.+But+that+was+in+the+year+of+our+Lord+73.+This+year+therefore+we+make+the+beginning+of+the+thousand+years+of+Satan%E2%80%99s+binding.+From+hence+unto+the+year+of+our+Lord+1073+are+a+thousand+years%2C+at+which+time+Pope+Gregory+VII%2C+a+Celtiberian+monk%2C+and+diabolical+juggler%2C+poisoning+Alexander+II%2C+invaded+the+Papacy+by+most+wicked+arts%3A+who+sitting+on+the+papal+chair%2C+the+devill+began+again+to+be+loosed+and+to+rage+tumultuously%2C+filling+the+Christian+world+in+a+horrible+manner+with+wars+and+slaughters+by+the+means+of+this+his+cursed+instrument%E2%80%A6.+%E2%80%A6+Thus+I+have+laid+down+my+judgement%2C+agreeing+with+other+most+learned+interpreters+before+me%2C+as+Bullinger%2C+Junius%2C+etc.+not+that+I+do+tie+any+man+unto+it%2C+but+leave+it+to+consideration%3A+but+they+who+begin+the+thousand+years+from+Christ%E2%80%99s+nativity%2C+as+Aretius%2C+or+from+his+resurrection%2C+as+Chytraeus+%5Ba+Lutheran%5D%3A+or+from+the+time+of+universal+Christianism+under+Constantine+the+Great%2C+as+Brightman%2C+Napier%2C+etc.+although+they+differ+a+little+in+the+terms%2C+yet+all+have+this+common+with+us%2C+that+the+first+thousand+years+from+Christ%E2%80%99s+birth+is+to+be+ascribed+to+Satan%E2%80%99s+imprisonment+and+that+the+dragon+is+now+long+ago+loosed+out+of+prison.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+A+Commentary+upon+the+Divine+Revelation+of+the+Apostle+%26+Evangelist+John%E2%80%A6+tr.+Elias+Arnold+%28d.+1622%3B+Amsterdam%3A+C.P.%2C+1644%29%2C+ch.+20%2C+pp.+508+%26+510&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf4aa8dc1b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af4aa8dc1b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/esc

<blockquote><p>That man was the first Adam, who was as a certain common mass or lump, wherein was contained all mankind: which lump being corrupted, we cannot be brought forth into this world, but with corruption and uncleanness. And although Eve transgressed before the man, yet the beginning of sinning is ascribed unto Adam: for that succession is attributed unto men, and not unto women… But this is now the scope of the apostle, to teach out of what thing as from the ground and beginning sin was by propagation traduced into mankind. … For in every sin are two things to be considered. The action or wicked affection, which is as it were the matter: and the offense or obligation to punishment, which they call reatus, that is, guiltiness. And original sin herein differs from those sins which they call actuall, for that in them [actual sins] the matter abides not still. For so soon as a man has either committed adultery, or spoken blasphemy, those actions straightway as soon as the thing is done cease to be, neither are any more extant. Only there remains the offence against God and guiltiness. Wherefore seeing by faith and repentance the obligation unto punishement, or offence against God is remitted, we will easily grant that the whole sin is abolished. But in original sin the consideration is far otherwise: for the matter thereof passes not away. For every one of us has experience in himself, that corruption of nature remains in us: seing that yet also we continually fall into sins, and are both in body and mind untoward to things pertaining to God: which sin yet unto the faithful are not imputed. For the guiltiness and offense against God is in baptism through faith in Christ forgiven, although the matter of sin do still remain. Which matter, although in holy men it be broken and weakened, yet we shall not be perfectly rid thereof, till we be dead. And forasmuch as men-regenerate beget children, not by that they are regenerate, but by nature and the flesh, thereof it comes that the children also of the believers are born obnoxious unto original sin. For into them is poured the same vitiate and corrupt nature that is in the parents: when as yet on the other side, forgivenees or imputation, which are apprehended by faith, cannot be poured into them. For the better explication hereof, Augustine brings two similitudes: One is of grains of corn: which although they are sown into the ground being purged of their leaves, stalks, chaff and ears, yet they spring up again with all these things: which hereof comes to pass, for that that cleansing comes not to those grains by nature, but by the art and industry of men. And forasmuch as the corn springs not of these principles of art and industry, but of nature, it must needs be that when they are sprung up, they follow the order not of human industry but of their own nature. The second similitude is of a man, y• is circumcised: who notwithstanding begets a son with his foreskin. And this hereof comes, for that circumcision was not in the father by nature, but by a certain force added from without. And seing that children are not procreated by that outward force, but by an inward strength of nature, it is of necessity that when they are begotten they follow the order of nature. And therfore we bring forth no other children, but such as we are ourselues. Wherefore seeing we have in us the contagiousness of original sin, they undoubtedly also cannot be without it. But we cannot communicate unto our children the remission and forgiveness of that sin. For, that is to be hoped for at God’s hands only. … Now seeing I have declared what the apostle means by sin, and by which one man, it entered into the world, there remains to consider by what means it was spread abroad. This is a matter obscure and very hard, and therefore I do not think to stand long about it. But forasmuch as the word of God most plainly teaches that such a sin there is, and that it descends into our posterity, although we understand not the manner and way, how it is poured into them, yet we ought to give place unto the truth and not to be too much careful or to trouble ourselues more than needs touching the way and manner, which is hard to be known, and may with out danger be unknown. Howbeit I think it not amiss to declare those ways and means which I have observed amongst the ecclestical writers: whose opinions touching this matter are four in number. The first is of those which thought that we receive of our parents the souls together with the bodies, that even as God by human seed creates the body, so also of the same creates He the soul… Whose arguments… I judge indeed probable: but yet not of necessity… [The second view is not labeled and might be another form of traducianism.] The third way is that God therfore creates the soul with such a sin or defect, for that it shall be the soul of a man now damned, and set under the curse. Such a soul say they, God creates as is required to such a man… this fond device is of every man rejected: lest we should seem to make God absolutely the author of sins. The fourth maner is by the consents of many men received, and seems very likely to be true: namely, that the soul is not created with some [sin], but straightway draws unto it sin so soon as ever it is adjoined unto the body derived from Adam… … ‘For that all men have sinned.’ This might have seemed very sharp and hard, that for the sin only of the first man all men should die. But Paul shows that this is justly done, because all men have sinned. About this particle ᾧ [which is neuter or masculine] which properly signifies in quo, that is, ‘in which,’ and is englished, ‘For that,’ is no small controversy how it ought to be taken. Some will haue it to be referred unto ‘sin’ [previously in Rom. 5:12, namely Adam’s first actual sin, which interpretation lends itself to an immediate imputation]. But the Greek word ἁμαρτία [sin] which went before it, seems to be against that. For it is [in] the feminine gender. Howbeit, it may be that Paul had a respect unto the other word παράπτωμα [offense, in v. 15 ff.], which is [in] the neuter gender, which word he afterward oftentimes uses, although it be counted a fault in speach to refer the relative to things coming after… …[Vermigli discusses the translation “in whom”.] But touching this matter, I will not much contend. For I think that ᾧ is a particle-causal, so that the sense is, Therefore has death gone over all men, because all men have sinned. For Chrisostom says: That when Adam fell, all other men also, which did not eat of the fruit were touched. And he thinks that Paul, as a wise physician, having the disease set before him, abides not in those things which be circumstances about it, or do follow it, but comes to the principal ground and first cause thereof. Therefore do all men die, because all men have sinned. Neither ought we to think that here is meant that all men do sin by some certain action: for that can have no place in children. But it is all one as if he had said, Now they are bondslaves unto sin, and are counted guilty thereof… By those things also which are written unto the Hebrews may be declared, how we have sinned in the fall of Adam. For there we read that Levi paid tenths in the loins of Abraham. After the selfsame manner also may here be understood that we were polluted in the loins and in the mass of Adam… …These things… in very deed… wholly confirm our sentence: wherein we say that Paul in this place takes sin most amply, so that it comprehends both the root, and all the fruits thereof. But I marvel how these men [who advocate for orginal sin being propagated from children’s imitation of their parents] go about to pluck away original vice from the nature of sin. For sin according to the common definition, they say, is whatsoever is spoken, done or thought against the Law of God, and this can have no place in children. But they consider not that in this definition is not all sin uniuersally contained. And therefore we before signified that sin is otherwise to be defined: so that that is said to be sin which any manner of way is against the Law and will of God… But to this we answered before: that the guiltyness indeed is forgiven unto the believers, howbeit the corrupt substance remains: which, if Christ were not a helper unto us, should of his own nature condemn us. For seeing it turns us away from the rule of the Law of God, it ought to be taken to be in very deed sin… ‘Where no law is, sin is not imputed.’ …This imputation or reputation is to be referred unto men, which were so miserable and blind that of themselves they could not so much as know sins, so far were they of that they could beware of sins, so utterly obscure was at that time the light of nature: but God imputed those sins unto them, and that not unworthily: for that blindness happened through their own default. And that God imputed those sins unto them, He Himself many ways declared. For He both by the flood destroyed the whole world, and complained unto Noah that all flesh had corrupted their way, and that the heart of man was prone unto sin even from his childhood. He reproved Cain of murder: and took vengeance upon the Sodomites… ‘That death reigned’ …And he therefore added that ‘death reigned from Adam even to Moses,’ to declare that there was sin in the world. For death and sin follow one the other inseperably: and sin and death infer and bring in one the other. Hereby are confuted those which contend that infants are without sin: and say that for that cause they die, for that by reason of the sin of Adam they are under the condition of mortality, being otherwise themselves innocent and clean from sin.</p></blockquote>

faith+in+Christ+forgiven%2C+although+the+matter+of+sin+do+still+remain.+Which+matter%2C+although+in+holy+men+it+be+broken+and+weakened%2C+yet+we+shall+not+be+perfectly+rid+thereof%2C+till+we+be+dead.+And+forasmuch+as+men-regenerate+beget+children%2C+not+by+that+they+are+regenerate%2C+but+by+nature+and+the+flesh%2C+thereof+it+comes+that+the+children+also+of+the+believers+are+born+obnoxious+unto+original+sin.+For+into+them+is+poured+the+same+vitiate+and+corrupt+nature+that+is+in+the+parents%3A+when+as+yet+on+the+other+side%2C+forgivenees+or+imputation%2C+which+are+apprehended+by+faith%2C+cannot+be+poured+into+them.+For+the+better+explication+hereof%2C+Augustine+brings+two+similitudes%3A+One+is+of+grains+of+corn%3A+which+although+they+are+sown+into+the+ground+being+purged+of+their+leaves%2C+stalks%2C+chaff+and+ears%2C+yet+they+spring+up+again+with+all+these+things%3A+which+hereof+comes+to+pass%2C+for+that+that+cleansing+comes+not+to+those+grains+by+nature%2C+but+by+the+art+and+industry+of+men.+And+forasmuch+as+the+corn+springs+not+of+these+principles+of+art+and+industry%2C+but+of+nature%2C+it+must+needs+be+that+when+they+are+sprung+up%2C+they+follow+the+order+not+of+human+industry+but+of+their+own+nature.+The+second+similitude+is+of+a+man%2C+y%E2%80%A2+is+circumcised%3A+who+notwithstanding+begets+a+son+with+his+foreskin.+And+this+hereof+comes%2C+for+that+circumcision+was+not+in+the+father+by+nature%2C+but+by+a+certain+force+added+from+without.+And+seing+that+children+are+not+procreated+by+that+outward+force%2C+but+by+an+inward+strength+of+nature%2C+it+is+of+necessity+that+when+they+are+begotten+they+follow+the+order+of+nature.+And+therfore+we+bring+forth+no+other+children%2C+but+such+as+we+are+ourselues.+Wherefore+seeing+we+have+in+us+the+contagiousness+of+original+sin%2C+they+undoubtedly+also+cannot+be+without+it.+But+we+cannot+communicate+unto+our+children+the+remission+and+forgiveness+of+that+sin.+For%2C+that+is+to+be+hoped+for+at+God%E2%80%99s+hands+only.+%E2%80%A6 +Paul+shows+that+this+is+justly+done%2C+because+all+men+have+sinned.+About+this+particle+%E1%BE%A7+%5Bwhich+is+neuter+or+masculine%5D+which+properly+signifies+in+quo%2C+that+is%2C+%E2%80%98in+which%2C%E2%80%99+and+is+englished%2C+%E2%80%98For+that%2C%E2%80%99+is+no+small+controversy+how+it+ought+to+be+taken.+Some+will+haue+it+to+be+referred+unto+%E2%80%98sin%E2%80%99+%5Bpreviously+in+Rom.+5%3A12%2C+namely+Adam%E2%80%99s+first+actual+sin%2C+which+interpretation+lends+itself+to+an+immediate+imputation%5D.+But+the+Greek+word+%E1%BC%81%CE%BC%CE%B1%CF%81%CF%84%CE%AF%CE%B1+%5Bsin%5D+which+went+before+it%2C+seems+to+be+against+that.+For+it+is+%5Bin%5D+the+feminine+gender.+Howbeit%2C+it+may+be+that+Paul+had+a+respect+unto+the+other+word+%CF%80%CE%B1%CF%81%CE%AC%CF%80%CF%84%CF%89%CE%BC%CE%B1+%5Boffense%2C+in+v.+15+ff.%5D%2C+which+is+%5Bin%5D+the+neuter+gender%2C+which+word+he+afterward+oftentimes+uses%2C+although+it+be+counted+a+fault+in+speach+to+refer+the+relative+to+things+coming+after%E2%80%A6+%E2%80%A6%5BVermigli+discusses+the+translation+%E2%80%9Cin+whom%E2%80%9D.%5D+But+touching+this+matter%2C+I+will+not+much+contend.+For+I+think+that+%E1%BE%A7+is+a+particle-causal%2C+so+that+the+sense+is%2C+Therefore+has+death+gone+over+all+men%2C+because+all+men+have+sinned.+For+Chrisostom+says%3A+That+when+Adam+fell%2C+all+other+men+also%2C+which+did+not+eat+of+the+fruit+were+touched.+And+he+thinks+that+Paul%2C+as+a+wise+physician%2C+having+the+disease+set+before+him%2C+abides+not+in+those+things+which+be+circumstances+about+it%2C+or+do+follow+it%2C+but+comes+to+the+principal+ground+and+first+cause+thereof.+Therefore+do+all+men+die%2C+because+all+men+have+sinned.+Neither+ought+we+to+think+that+here+is+meant+that+all+men+do+sin+by+some+certain+action%3A+for+that+can+have+no+place+in+children.+But+it+is+all+one+as+if+he+had+said%2C+Now+they+are+bondslaves+unto+sin%2C+and+are+counted+guilty+thereof%E2%80%A6+By+those+things+also+which+are+written+unto+the+Hebrews+may+be+declared%2C+how+we+have+sinned+in+the+fall+of+Adam.+For+there+we+read+that+Levi+paid+tenths+in+the+loins+of+Abraham.+After+the+selfsame+manner+also+may+here+be+understood+that+we+were+polluted+in+the+loins+and+in+the+mass+of+Adam%E2%80%A6+%E2%80%A6These+things%E2%80%A6+in+very+deed%E2%80%A6+wholly+confirm+our+sentence%3A+wherein+we+say+that+Paul+in+this+place+takes+sin+most+amply%2C+so+that+it+comprehends+both+the+root%2C+and+all+the+fruits+thereof.+But+I+marvel+how+these+men+%5Bwho+advocate+for+orginal+sin+being+propagated+from+children%E2%80%99s+imitation+of+their+parents%5D+go+about+to+pluck+away+original+vice+from+the+nature+of+sin.+For+sin+according+to+the+common+definition%2C+they+say%2C+is+whatsoever+is+spoken%2C+done+or+thought+against+the+Law+of+God%2C+and+this+can+have+no+place+in+children.+But+they+consider+not+that+in+this+definition+is+not+all+sin+uniuersally+contained.+And+therefore+we+before+signified+that+sin+is+otherwise+to+be+defined%3A+so+that+that+is+said+to+be+sin+which+any+manner+of+way+is+against+the+Law+and+will+of+God%E2%80%A6+But+to+this+we+answered+before%3A+that+the+guiltyness+indeed+is+forgiven+unto+the+believers%2C+howbeit+the+corrupt+substance+remains%3A+which%2C+if+Christ+were+not+a+helper+unto+us%2C+should+of+his+own+nature+condemn+us.+For+seeing+it+turns+us+away+from+the+rule+of+the+Law+of+God%2C+it+ought+to+be+taken+to+be+in+very+deed+sin%E2%80%A6+%E2%80%98Where+no+law+is%2C+sin+is+not+imputed.%E2%80%99+%E2%80%A6This+imputation+or+reputation+is+to+be+referred+unto+men%2C+which+were+so+miserable+and+blind+that+of+themselves+they+could+not+so+much+as+know+sins%2C+so+far+were+they+of+that+they+could+beware+of+sins%2C+so+utterly+obscure+was+at+that+time+the+light+of+nature%3A+but+God+imputed+those+sins+unto+them%2C+and+that+not+unworthily%3A+for+that+blindness+happened+through+their+own+default.+And+that+God+imputed+those+sins+unto+them%2C+He+Himself+many+ways+declared.+For+He+both+by+the+flood+destroyed+the+whole+world%2C+and+complained+unto+Noah+that+all+flesh+had+corrupted+their+way%2C+and+that+the+heart+of+man+was+prone+unto+sin+even+from+his+childhood.+He+reproved+Cain+of+murder%3A+and+took+vengeance+upon+the+Sodomites%E2%80%A6+%E2%80%98That+death+reigned%E2%80%99+%E2%80%A6And+he+therefore+added+that+%E2%80%98death+reigned+from+Adam+even+to+Moses%2C%E2%80%99+to+declare+that+there+was+sin+in+the+world.+For+death+and+sin+follow+one+the+other+inseperably%3A+and+sin+and+death+infer+and+bring+in+one+the+other.+Hereby+are+confuted+those+which+contend+that+infants+are+without+sin%3A+and+say+that+for+that+cause+they+die%2C+for+that+by+reason+of+the+sin+of+Adam+they+are+under+the+condition+of+mortality%2C+being+otherwise+themselves+innocent+and+clean+from+sin.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Most+Learned+%26+Fruitful+Commentaries+of+Dr.+Peter+Martyr+Vermilius...+%28d.+1562%3B+London%3A+1568%29%2C+Commentary+on+Romans%2C+ch.+5+%7C+On+Rom.+5%3A12%2C+pp.+110-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F158d671e11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/158d671e11.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-mediate-imputation-of-adams-original-sin/#:~:text=That%20man%20was%20the%20first%20Adam,themselves%20innocent%20and%20clean%20from%20sin&amp;text=That%20man%20was%20the%20first%20Adam%2C%20who%20was&amp;text=being%20otherwise%20themselves%20innocent%20and%20clean%20from%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

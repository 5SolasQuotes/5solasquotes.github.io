<main class="wrap"><figure class="quote" id="q-c0a787b362" data-kw="">
<blockquote><p>If it be further demanded, whether in case that death follows, it be to be understood of any child, how little time soever the mother has gone with it? I answer with Simlerus that we must distinguish between a child formed and unformed, if the child were an embryo, not yet perfected, although it perished, the party, by whose stroke, was not to be put to death, but for such only as was come to perfection, so likewise Augustine and Jerome in Decretis, Causa 32, Question 2, Ch. Mosis, and the words of the text, ‘life for life’, seem to make for it, that a man’s life must not be paid but for one living and perfected, and the Septuagint make this plain by rendering, ‘not death’, [Hebrew], ‘not formed’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, … (London, 1653), Exodus, ch. 21, p. 558</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-020abbb182" data-kw="">
<blockquote><p>It hence also follows that the conception of Christ in the womb, being the effect of a creating act, was not accomplished successively and in process of time, but was perfected in an instant; for although the creating acts of infinite power, where the works effected have distinct parts, may have a process or duration of time allotted unto them, as the world was created in six days, yet every part of it that was the object of an especial creating act was instantaneously produced. So was the forming of the body of Christ, with the infusion of a rational soul to quicken it, though it increased afterwards in the womb unto the birth. And as it is probable that this conception was immediate upon the angelical salutation, so it was necessary that nothing of the human nature of Christ should exist of itself antecedently unto its union with the Son of God: for in the very instant of its formation, and therein, was the “Word made flesh,” John 1:14; and the Son of God was “made of a woman,” Gal. 4:4; so that the whole essence of his nature was created in the same instant. Thus far the Scriptures go before, and herein it is necessary to assert the forming of the body and soul of Christ by the Holy Spirit. The curious inquiries of some of the schoolmen and others are to be left unto themselves, or rather, to be condemned in them; for what was farther in this miraculous operation of the Holy Ghost, it seems purposely to be hid from us in that expression, [Greek] ‘The power of the Most High shall overshadow thee.’ Under the secret, glorious covert hereof we may learn to adore that holy work here, which we hope to rejoice in and bless God for unto eternity. And I suppose, also, that there is in the word an allusion unto the expression of the original acting of the Holy Spirit towards the newly-produced mass of the old creation, whereof we spake before. Then it is said of Him that he was [Hebrew], as it were ‘hovering’ and ‘moving’ over it for the formation and production of all things living; for both the words include in them an allusion unto a covering like that of a fowl over its eggs, communicating, by its cognate warmth and heat, a principle of life unto their seminal virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3, pp. 165-66</span></figcaption>

</figure><figure class="quote" id="q-a971aaef88" data-kw="">
<blockquote><p>Others (Rodr., Sum., Tome 1, ch. 5, de Abort.) more probably hold that if the case be utterly desperate, and it be certain that both mother and child must undoubtedly perish if some speedy remedy be not had, it may then be lawful to make use of such receits [receiving treatments] as may possibly give some hopes to save the mother, though not without some peril of the child. But all this while the intentions and indeavours must be no other than preservatory, however it pleases God to order the events: Shortly, no man that purposely procures an abortion, as such, can wash his hands from blood; No woman that willfully acts, or suffers it (however the secrecy may exempt her from the danger of human laws) can think to avoid those judgments of the righteous God, which he has charged upon murderers. … But withal, let me advise you, (with Martinus Vivaldus, Mart. Alphons. Vivald., Expli. Bull Crue.) that what I have herein written against the procurers of abortions may not be extended to the practice of those discrete physicians and chirurgeans [surgeons], who, being called to for their aid in difficult and hopeless child-births, prescribe to the woman in travail such receits as may be like to hasten her delivery (whether the child be alive or dead); forasmuch as the conception is now at the full maturity and the endeavor of these artists is not to force an abortment, but to bring forward a natural birth to the preservation of the mother, or the child, or both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 2nd Decade, Case 3, ‘Whether may it be Lawful, in Case of Extremity, to Procure the Abortion of the Child, for the Preservation of the Mother?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 96-7, 100</span></figcaption>

<blockquote><p>…the Bible never provides an implicit or explicit condemnation of birth control. Does the Bible condone or endorse birth control anywhere? There are no biblical passages that model or encourage birth control.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-a-grisanti.html">Michael A. Grisanti</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Birth Control &amp; the Christian: Recent Discussion &amp; Basic Suggestions’ in Masters Seminary Journal</cite>, 23/1 (Spring 2012), pp. 85–112, p. 109</span></figcaption>

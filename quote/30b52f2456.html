<main class="wrap"><figure class="quote" id="q-30b52f2456" data-kw="">
<blockquote><p>Nor is it of importance to inquire curiously at what time the soul was united to the body, the Logos (Logos) to the flesh. It is enough for us to believe that the human nature from the time it began to be never existed apart from the Logos (Logo), but was assumed by and hypostatically united to him. And if the soul could not be poured into the body unless already organized and completely formed (a point on which physicians are not agreed among themselves), it does not follow that the Logos (Logon) could not at once unite the flesh to himself, since his work could not be constrained either with the soul present or absent. Nor is it more absurd for the body of Christ (not as yet animated) to be united to the Logos (Logo), then for the same (when lifeless in the sepulcher) to remain conjoined with the same (as theologians acknowledge was done in the death of Christ).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 13th Topic, ‘Person &amp; State of Christ’, 11th Question, ‘The Conception &amp; Nativity of Christ…’, section 14, p. 343</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-4edbeabcb2" data-kw="">
<blockquote><p>Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing.</p></blockquote>

</figure><figure class="quote" id="q-0f4bb630d4" data-kw="">
<blockquote><p>What the period of embryonism is, and what the beginning of animation, neither Hippocrates, nor Galen, nor Aristotle know; but He knows who knows all things. For the precise definition of that matter is endured neither by the diversity of the seed itself from time to time, nor by the different disposition of the uterus or of the whole mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | But the foundation is slippery. For it is not certain to us from that passage that the reason for that law is a certain period of formation. From the same passage one could conclude that the fetus is animated on the seventh or fourteenth day, namely because the members are then conformed, although the perfect formation is extended to the fortieth or eightieth day, since even that is not simply necessary for the soul to be received. But he will prove it from the fact that the graver impurity is terminated on the eighth day, if she had borne a male, but on the fifteenth, if a female. Hurtado in the cited disputation, section 112, says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“What the period of embryonism is, and what the beginning of animation, neither Hippocrates, nor Galen, nor Aristotle know; but He knows who knows all things. For the precise definition of that matter is endured neither by the diversity of the seed itself from time to time, nor by the different disposition of the uterus or of the whole mother.”

t+is+therefore+expedient+to+know+when+it+is+animated.+%7C+But+the+foundation+is+slippery.+For+it+is+not+certain+to+us+from+that+passage+that+the+reason+for+that+law+is+a+certain+period+of+formation.+From+the+same+passage+one+could+conclude+that+the+fetus+is+animated+on+the+seventh+or+fourteenth+day%2C+namely+because+the+members+are+then+conformed%2C+although+the+perfect+formation+is+extended+to+the+fortieth+or+eightieth+day%2C+since+even+that+is+not+simply+necessary+for+the+soul+to+be+received.+But+he+will+prove+it+from+the+fact+that+the+graver+impurity+is+terminated+on+the+eighth+day%2C+if+she+had+borne+a+male%2C+but+on+the+fifteenth%2C+if+a+female.+Hurtado+in+the+cited+disputation%2C+section+112%2C+says%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0f4bb630d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0f4bb630d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=What%20the%20period%20of%20embryonism%20is,uterus%20or%20of%20the%20whole%20mother&amp;text=What%20the%20period%20of%20embryonism%20is%2C%20and%20what&amp;text=of%20the%20uterus%20or%20of%20the%20whole%20mother" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6e3c03ef1c" data-kw="">
<blockquote><p>The rational soul is infused around the third day from the conception of the seed, understand if the conception proceeds to life and is not frustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | Others who deny that the soul is infused immediately from conception do not agree among themselves at what point of time or with how many days having passed, the intellective soul is united to the body. Valles in his Controversies, bk. 2, ch. 9 at the end says that females are never formed before the fortieth day, but males are formed in thirty or thirty-five days. The Coimbrans in their commentary on Aristotle’s On the Soul, bk. 2, article 2, section 2 say that the more common opinion, which they also follow, is that in males the conformation of the body is completed, and consequently the soul infused, around the fortieth day, in females around the eightieth. Feyens in his treatise, On the Formation of the Fetus, question 8, conclusion 2, says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

s+infused+immediately+from+conception+do+not+agree+among+themselves+at+what+point+of+time+or+with+how+many+days+having+passed%2C+the+intellective+soul+is+united+to+the+body.+Valles+in+his+Controversies%2C+bk.+2%2C+ch.+9+at+the+end+says+that+females+are+never+formed+before+the+fortieth+day%2C+but+males+are+formed+in+thirty+or+thirty-five+days.+The+Coimbrans+in+their+commentary+on+Aristotle%E2%80%99s+On+the+Soul%2C+bk.+2%2C+article+2%2C+section+2+say+that+the+more+common+opinion%2C+which+they+also+follow%2C+is+that+in+males+the+conformation+of+the+body+is+completed%2C+and+consequently+the+soul+infused%2C+around+the+fortieth+day%2C+in+females+around+the+eightieth.+Feyens+in+his+treatise%2C+On+the+Formation+of+the+Fetus%2C+question+8%2C+conclusion+2%2C+says%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e3c03ef1c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e3c03ef1c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=The%20rational%20soul%20is%20infused%20around,to%20life%20and%20is%20not%20frustrated&amp;text=The%20rational%20soul%20is%20infused%20around%20the%20third&amp;text=conception%20proceeds%20to%20life%20and%20is%20not%20frustrated" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

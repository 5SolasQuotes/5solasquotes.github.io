<blockquote><p>Fifth, the various absurdities by which the opposite opinion is pressed [the opinion that there is no such thing as natural law]. For if nothing is just by nature, but that only which can be made to minister to human advantage, it follows that men are born for themselves and not for the glory of God or for the good of society (of which there is by nature in them an earnest desire), which the wiser heathen themselves acknowledge could not be said.

(2) All things would be equally lawful: to hate God as well as to love him; to kill parents as well as to honour them; and each one’s own will would be to him for a reason and a law, so that he might do whatever he pleased (whether this does not pave the way to atheism, anyone can readily understand).

(3) This moral right and government of God being taken away, all the foundations of right will be removed; all the laws of men which could have flowed from no other source, and thus all government, honesty and order in human society will perish and the world be turned into mere confusion and villainy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.16.</span></figcaption>

<blockquote><p>There was some Priests in it, and some Civil men, and they judged together in the LORD’s Matters; The Matters of the LORD belonged to them, to wit, The Priests. And the Kings Matters belonged to the others: But all was to judge according to the Word of GOD. We shall say this one word more, there is one Great Thing Folk stumbles at in that Paper that Kings ought to Rule or Judge according to the Judicial Law; and that these Laws Kings ought to Rule by, ought to be according to the Word of GOD, And think ye this a Great Wrong? The People of GOD was ruled Two Hundred Years and upwards by this Law only, and can any be fitter to be a Law-Giver than GOD? Have we Laws, have we them from Men or of GOD? If of Men, then they had them from Men or of GOD? Then the GOD of Nature, or the GOD that Created All is far better to Teach Laws than Man that is under GOD. We say stumble not that it is said, the Laws of GOD ought to be the Laws of the Land; For it will never be well with you (especially the Mein of the Land) till the Laws of GOD be the Laws of the Land; Then we will not be fashed [sic] with Great Ones to Oppress: For when they have Laws to make, they never do [any] thing but Oppress the Poor. But when the Law of GOD speaks, it will give Right to the Poor as well as to the Great. So the Law of GOD should be our Law. Where the Law of GOD is received where Christians are; Let Christians go to the Law which GOD has found out; And let Heathens and Turks go to the Law that Nature finds out.</p></blockquote>

<blockquote><p>XIII. The glory of God, the good of souls, the happiness of Christian societies, are irresistible motives to quicken the magistrate to act (against such dangerous persons as we have described according to the law of judgement, and their different demerits) in Faith and Love:

      1. In Faith; for the Christian magistrate does not act like himself, if he does not perform acts of civil-justice in faith. And it is clear that if there be no moral equity in any of the judicial laws in the Old Testament (and there are none at all extant in the New) [then] the Christian magistrate cannot perform any act of Civil-justice in faith. But it is indeed too evident to be denied that all divine laws which concern the punishment of moral transgressions are of perpetual obligation, and therefore still remain in force according to their substance and general equity, abstracted from special circumstances, typical accessories and the old forms of Mosaical polity, for:

      1. These divine laws are not expired in their own nature.

      2. They are not repealed by God.

      3. The authority of the Lawgiver is the same under both administrations, old and new; the consciences of Christians as well as Jews are subject to his sovereign and perpetual jurisdiction.

      4. The matter of the laws is moral, and very agreeable to the dictates of nature, as does appear by the several laws and decrees of heathens: Dan. 3:29; Ezra. 7:23,25-27; Ezra 10:3,5,8 compared with Num. 15:30-31; Lev. 24:15-16; Deut. 13:8-9; Zech. 13:3,6. Seducing, poisoning, slaying of souls is by the law of Nature and Nations the worst of injuries.

      5. The reason of these divine laws is immutable, and that reason is sometimes expressed and declared: But it is not necessary that there should be any express ratification of every moral law in the New Testament which is plainly delivered in the Old.

      6. These divine laws are independent on the will of man, and therefore indispensable man’s authority.</p></blockquote>

</figure><figure class="quote" id="q-f4be480ae6" data-kw="">
<blockquote><p>The Covenant of Grace before Christ’s coming was administered under the Law. And here of the LAWS of GOD. Rom. 7.12. Wherefore the Law is holy, and the Commandment holy, just and good.

Princ. The Will of God revealed in his Law, was Holy Just and Good.

1. God hath revealed his Will. 1. By his Law ingraven in Man’s Heart. 2. By the Law Written, which is either Moral, or Mosaical; and This Ceremonial and Judicial. 2. An Abstract of these Laws. 1. Of the Ceremonial in Sacred Persons, and Sacred Things, and Sacred Times. 2. Of the Judicial, being reducible to the Commandments, which do make up 3. The Moral. 3. [sic] The use of these Laws severally. 4. The Excellency of them: Holy, Just, Good. 5. Duration of them. The Ceremonial, to the Death of Christ; The Judicial, to the destruction of Jerusalem; The Moral, to the end of the World.</p></blockquote>

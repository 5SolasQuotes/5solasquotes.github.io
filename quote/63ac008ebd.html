<main class="wrap"><figure class="quote" id="q-63ac008ebd" data-kw="">
<blockquote><p>…from whence it will appear that a believing master may present his servant and children to baptism, though it does not follow that a believing master may or will present those of his servants or children that are adult or of years without their consent, yet he may by his authority require them to it as an external duty; he cannot compel them to any duty, or restrain them from any vice without their consent, yet he may correct them, and incline their will to any outward duty by his authority, and having wrought upon them to consent and submit, the commissioner may baptize them that come so presented: the master of a family is a king, a prophet, and a priest, if by any of these offices he can prevail with his houshold, he may bring them to the performance of their duties… …though it be the master or husband’s duty to move his family, yet he cannot always prevail; and special direction concerning the wife is given to suffer her in regard of the bond of matrimony and that under some limited and restrained terms in hope of her conversion [1 Cor. 7]; yet nothing is said concerning servants but that he may either force them or be rid of them if they continue infidels in that sense, that is refuse to list themselves among disciples; the public worship of some God being the bond of all human society, Ps. 101:6, ‘He that walketh in a perfect way, he shall serve me:’ he that keeps any servant that will not be baptized, is not a good Christian; it is true, all men of discretion ought to consent to every duty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hussey.html">William Hussey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Mr. Tombes</cite>, [a Baptist], his Sceptical Examination of Infants’-Baptism… (London, 1646), pp. 44-45 Page 43 starts the context. Hussey was the Erastian minister who debated Gillespie on the Mediatorial Kingdom of Christ. Not every particular in the larger context is endorsed.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6, pp. 139-140</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<main class="wrap"><figure class="quote" id="q-8e206bc254" data-kw="">
<blockquote><p>Peter Lombard has some interesting things to say about Cornelius in Acts 10 (when discussing Augustine’s comments on the same subject): “Note carefully how he says that there cannot be salvation without faith in Christ, and yet Cornelius’ prayers were heard before he believed in Christ. This may be understood in this sense: namely, before he knew that Christ, in whom he believed under a mystery, had become incarnate.” [1] In other words, Cornelius was not an unbeliever but one trusting in the coming Messiah. Before coming into contact with the apostle Peter, however, he was one that had not yet realised that Jesus of Nazareth was the incarnate Christ owing to a lack of information.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sentences</cite>, trans. Giulio Silano (1150; 4 vols, Toronto, 2007), III, d. 25, c. 4, a. 3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ac70eebd0" data-kw="">
<blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>

</figure><figure class="quote" id="q-ebb8e21ffd" data-kw="">
<blockquote><p>14. What is the legitimate office of reason in the sphere of religion? 1st. Reason is the primary revelation God has made to man, necessarily presupposed in every subsequent revelation of whatever kind. 2d. Hence Reason, including the moral and emotional nature, and experience, must be the organ by means of which alone all subsequent revelations can be apprehended and received. A revelation addressed to the irrational would be as inconsequent as light to the blind. This is the usus organicus [organic use] of reason. 3d. Hence no subsequent revelation can contradict reason acting legitimately within its own sphere. For then (1) God would contradict Himself, and (2) faith would be impossible. To believe is to assent to a thing as true, but to see that it contradicts reason, is to see that it is not true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, 2nd ed., enlarged, (Bible Institute Colportage Association, 1878), ch. 3, ‘The Sources of Theology’, p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<main class="wrap"><figure class="quote" id="q-8f658aea28" data-kw="decreed faith with salvation">
<blockquote><p>So far from God having decreed salvation to them under such a condition, on the contrary (by the very same decree by which he decreed salvation to them) he also decreed faith and perseverance to them and all the other means necessary for salvation.</p></blockquote>

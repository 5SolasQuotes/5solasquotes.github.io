<main class="wrap"><figure class="quote" id="q-a974238fb8" data-kw="">
<blockquote><p>Besides, he is just as well as merciful; and it is necessary from the justice of God, as will be observed hereafter, that the bodies of the wicked be raised, not merely to be tormented, but that his justice might be glorified in the righteous punishment of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-399eaf4d68" data-kw="">
<blockquote><p>Obj. 1. The resurrection of Christ, according to what has been said, can neither be an argument in favor of the resurrection of the wicked, nor the cause of it, inasmuch as they are not members of Christ. Therefore the wicked will not rise. Ans. The wicked will not rise on account of the resurrection of Christ, but for other causes, viz: on account of the just judgment of God, for which they will be raised from the dead, that they may be eternally punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 45 (benefits of Christ&#x27;s resurrection)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/the-states-of-christ/state-of-exaltation.html">State of Exaltation</a> › <a href="../topics/the-states-of-christ/state-of-exaltation/resurrection-of-christ.html">Resurrection of Christ</a></span></div>

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 45 (benefits of Christ&#x27;s resurrection)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObj.%201.%20The%20resurrection%20of%20Christ%2C%20according%20to%20what%20has%20been%20said%2C%20can%20neither%20be%20an%20argument%20in%20favor%20of%20the%20resurrection%20of%20the%20wicked%2C%20nor%20the%20cause%20of%20it%2C%20inasmuch%20as%20they%20are%20not%20members%20of%20Christ.%20Therefore%20the%20wicked%20will%20not%20rise.%20Ans.%20The%20wicked%20will%20not%20rise%20on%20account%20of%20the%20resurrection%20of%20Christ%2C%20but%20for%20other%20causes%2C%20viz%3A%20on%20account%20of%20the%20just%20judgment%20of%20God%2C%20for%20which%20they%20will%20be%20raised%20from%20the%20dead%2C%20that%20they%20may%20be%20eternally%20punished.%E2%80%9D%0A%0A%E2%80%94%20Zacharias%20Ursinus%2C%20Commentary%20on%20the%20Heidelberg%20Catechism%2C%20Q.%2045%20%28benefits%20of%20Christ%27s%20resurrection%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F399eaf4d68.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/399eaf4d68.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 2, ch. 4, sec. 1 (on Rom. 5:12–21)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement/particular-redemption.html">Particular redemption</a></span></div>
<div class="actions"><button class="copy" data-copy="“This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.”

</figure><figure class="quote" id="q-bde91c87e8" data-kw="">
<blockquote><p>The wicked shall be raised by the power of Christ as a just Judge. The divine power that shut them up in the grave as in a prison, will bring them out, in order to their receiving the last sentence, to enter into the prison of hell. But the godly shall be raised by virtue of the Spirit of Christ, that bond of union betwixt Christ and those blessed bodies; so that it shall be to them as a pleasant awakening out of sleep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, Of Benefits at the Resurrection (Heb. 11:35)</span></figcaption>

</figure><figure class="quote" id="q-af53ab3b82" data-kw="">
<blockquote><p>Obj. The resurrection of Christ is declared by the Apostle to be the cause of our resurrection, and our resurrection is the effect, or benefit of Christ&#x27;s resurrection. But this cause does not extend to the wicked. Therefore they will not rise. Ans. Although the wicked will not rise because of the resurrection of Christ, yet they shall, nevertheless, be raised on account of the just judgment of God. by which they shall be consigned to everlasting punishment. For there may be many and different causes, (if not in number, at least in kind,) especially in different subjects, of one and the same effect. The cause of the resurrection of the godly is, therefore, the resurrection of Christ as of the head. But the resurrection of Christ is not the cause of the resurrection of the wicked, because they are not members of Christ, but the justice of God, and the truth of his threatening Briefly; the wicked shall rise from the dead, not because Christ rose, but on account of the justice of God, that they may be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 57 (resurrection of the body)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7399b051a7" data-kw="">
<blockquote><p>Of course, some Reformed teachers, e.g., Gomarus, Walaeus, Ludwig Crocius, assumed a ‘conditioned or middle knowledge’ on God’s part which was related to a ‘conditional proposition as to its object’ (as Heidegger Corp. Theol. III, 22 remarks) ‘in respect of bad actions, in which divine providence concurs not effectively but permissively and on the supposition of a conditional or permissive decree’. Alsted too (97) says that ‘there is a middle knowledge, by which He knows that if this exists that will exist.’ For the rest the distinction of a scientia media was decisively rejected by all dogmaticians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Ernst Bizer (1950; Eugene, OR: Wipf &amp; Stock, 2007), ch. 5, ‘The Attributes of God’, sect. 17, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1e8359159" data-kw="">
<blockquote><p>In the Reformed view, both Catholic Counter-Reformation (L. Molina) and Remonstrant theology (Arminius) had modified this ‘will-based-theology’ [of Augustine and the Reformed] by their adaptation of middle knowledge (scientia media), resulting in a ‘knowledge-based-theology’ in which there is no room for real contingency (Maccovius 1641b, 103-4; Bac 2010). For Maccovius and most of seventeenth-century Reformed theologians, the main problem of the concept of middle knowledge is that it undermines the fundamental distinction between Creator and creature. Middle knowledge, used to describe a category of divine knowledge structurally or logically antecedent to God’s will, implies a necessity of the objects of divine knowledge (Maccovius 1641a, 25-26). Because middle knowledge postulates objects extra Deum [outside God] that precede his will, a logical contradiction is involved: objects outside God always presuppose the divine will. Finally. if God’s middle knowledge also contains his decree, then this would imply that it is impossible for God to choose an alternative (Maccovius 1641a, 25). Middle knowledge, then, approximates Stoic fate (fatum Stoicum), a natural or absolute necessity so inherent in the essential nature of things that even God is made dependent, like Homer’s Jupiter [who was constrained by nature] (Maccovius 1641b, 253).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-j-van-asselt.html">Willem J. van Asselt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Christ, Predestination, and Covenant in Post-Reformation Reformed Theology’</cite>, 2. ‘Predestination…’, pp. 218-9 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom">
<blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</span></figcaption>

</figure><figure class="quote" id="q-e9cfb29190" data-kw="">
<blockquote><p>While Rutherford in questions one to seven of his ‘Disuisitiones metaphysicae’ quoted Bradwardine without expressing any criticism, Leydekker distanced himself from what he considered to be Bradwardine’s voluntarism. According to Leydekker, Bradwardine grounded impossibility in the will of God. Leydekker preferred instead to view the power of God, not His will, as the foundation of possibility and impossibility… Voetius had been more cautious about ascribing a voluntarist position to Bradwardine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bradwardine.html">Thomas Bradwardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Cause of God</span></figcaption>

</figure><figure class="quote" id="q-d1758a69a1" data-kw="intuitive knowledge">
<blockquote><p>God knows all things by one intuitive act. As there is no succession in his being, so there is no succession in his knowledge. He knows things that are successive, before their existence and succession, by one single act of intuition. By one cast of his eye, all things future are present to him in regard of his eternity and omnipresence.</p></blockquote>

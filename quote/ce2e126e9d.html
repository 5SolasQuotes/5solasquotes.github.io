<main class="wrap"><figure class="quote" id="q-ce2e126e9d" data-kw="">
<blockquote><p>The famousest divines in the Church of God, even Luther, Zwingli, Melancthon, Calvin, Perkins, Sibbes and abundance of nonconformists of greatest name in England did ordinarily use a form of prayer of their own before their sermons in the pulpit, and some of them in their families too. Now these men did it not through idleness or through temporizing, but because some of them found it best for the people to have oft the same words: and some of them found such a weakness of memory that they judged it the best improvement of their own gifts. Now besides the first composure of these prayers (which perhaps was done 20 years before) none of these men did use their own gifts, any more than if they had used a form composed by another. For the memory and utterance is the same of both. … And in some ordinances as baptism and the Lord’s Supper, etc. the same things must be daily prayed for: And he that thinks he must not frequently speak the same things, will quite corrupt the ordinance of Christ. And he that will imagine that he must have always new words will at last have new things or worse than nothing. If then it be meet to use often the same words, why may not a weak minister use the better words of others when he has none merely of his own that are so fit? Nay is it not the duty of such to do it? Every man is bound to do God’s service in the best manner that he can: ‘Cursed be the deceiver that hath a better in his flock, and bringeth that which is corrupt.’ But to utter prayers and praise to God in a full, methodical and congruous manner, and in words suitable to the majesty of the worship of God, is better (to the people and to the honor of religion) than to do it in a more confused, disorderly, broken manner, with barrenness and incongruity of speech. But this l […]st is the best that many honest ministers can do by their own gifts, when they may do it in the former better manner, by making use of the words and gifts of others. Therefore it is a duty for such men so far to use others’ gifts of inventing words before their own. And among us there is no man forbidden in the pulpit to use his own gifts to the utmost and pray without any set form of his own or other men’s. And I would at last desire any of the objectors but to name that text of Scripture which directly or indirectly commands every minister to use his gift of inventing words and method, or his gift of extemporary prayer, every time that he prays to God: Or which forbids to use the gifts of others though better than his own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 32, pp. 183-85</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38be200369" data-kw="">
<blockquote><p>VI. Participation in Prayer How is the congregation to pray together in public worship?… The congregation prays by ‘one mouth speaking for all,’ by an elder leading the people to the throne of grace… What should the worshipper do while the solitary voice is praying aloud? He may allow his mind to pray the same thing silently. He may say in his heart following each petition, ‘Yes, Lord, that is my prayer as well,’ or add his own brief petitions which are suggested by the petitions being offered. And at the conclusion of the prayer he should join audibly in saying the ‘Amen’ as has been the practice of God’s people in both the Old Covenant and the New (Neh. 9:6; 1 Cor. 14:16). Jerome said that the ‘Amen’ following the prayers of the fourth century church was like a clap of thunder! This practice is much to be preferred over the common custom of interrupting or punctuating the prayers by audible ‘Amens’ (or grunts or groans or other such expressions such as, ‘Yes, Lord,’ or ‘Thank you, Jesus!’). Better to nod the head in silent agreement than to distract other worshippers or the one praying or to subject yourself to the temptation of attempting to appear more spiritual than others on the basis of the number or loudness of the audible responses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-schneider-iii.html">Michael Schneider III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Chapter 13, ‘Prayer Regulated by God’s Word’ in Worship in the Presence of God, ed. David Lachman &amp; Frank Smith (Greenville Seminary Press, 1992), pp. 240-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

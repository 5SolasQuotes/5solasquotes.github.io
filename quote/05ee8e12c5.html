<main class="wrap"><figure class="quote" id="q-05ee8e12c5" data-kw="">
<blockquote><p>Note now the order: first God gives me light to see the goodness and righteousness of the law, and mine own sin and unrighteousness; out of which knowledge springs repentance. Now repentance teaches me not that the law is good, and I evil; but a light that the Spirit of God has given me, out of which light repentances springs. The the same Spirit works in mine heart trust and confidence, to believe the mercy of God and his truth, that He will do as He has promised; which belief saves me. And immediately out of that trust springs love toward the law of God again. And whatsoever a man works of any other love than this, it pleases not God, nor is that love godly. Now love does not receive this mercy, but faith only, out of which faith love springs; by which love I pour out again upon my neighbor that goodness which I have received of God by faith. Hereof ye see that I cannot be justified without repentance; and yet repentance justifies me not. And hereof ye see that I cannot have a faith to be justified and saved, except love spring thereof immediately; and yet love justifies me not before God. … Hereof ye see what faith it is that justifies us. The faith in Christ’s blood, of a repenting heart toward the law, does justify us only; and not all manner [of] faiths.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, ... Parker Society (d. 1536; Cambridge Univ. Press, 1850) | Answer to 4th Book, pp. 195-96</span></figcaption>

<blockquote><p>II. As soon as a principle of new life is infused into the adult person by the Spirit of Grace, immediately spiritual acting of every kind springs up from that principle, actions so pervading and exciting one another, and so mingled in their exercise that they can scarcely be distinguished in practice; and as difficult is it to determine which is first in time, which last. Surely it is not possible but that the soul, quickened by the Spirit, should in that supernatural light wherewith it is illuminated, both see itself defiled and undone with innumerable sins, and see Christ full of grace, truth and salvation. Such a view cannot but cause both, that with shame and sorrow it be displeased with itself, and with ardent desire be carried out unto Christ. Hence arises the receiving and accepting of Christ, that it may be delivered from the fiithiness and guilt of its sins. Now it cannot receive Him for justification except at the same time it receive him for sanctification: nor receive Him as a Priest to expiate sin, unless it also receive him as a King to whom it may submit in order to obedience. Hence it follows that that act of faith whereby we receive Christ for righteousness cannot be exercised without either a previous, or at least a concomitant repentance, and a purpose of a new life. If therefore faith go before justification, as we have lately asserted; the same must be said of repentance, springing up together with it from the same principle of spiritual life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, (1696; Glasgow, 1807), ch. 11, ‘Whether repentance precedes the remission of sins? [Yes]’, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-b2f7a3f3a4" data-kw="">
<blockquote><p>Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on Rev. 3, verse 20</span></figcaption>

</figure><figure class="quote" id="q-4866fffea8" data-kw="">
<blockquote><p>3rd Exception: They [Papists] say, we are indeed to believe our salvation on God’s part: but we must needs doubt in regard of ourselves: because the promises of remission of sins are given upon condition of man’s faith and repentance. Now we cannot (say they) be assured that we have true faith and repentance, because we may lie in secret sins, and so want that indeed which we suppose ourselves to have. Answer: I say again, he that does truly repent and believe, does by God’s grace know that he does repent and believe: for else Paul would never have said, ‘Prove yourselves whether you be in the faith or not:’ and the same apostle says, 2 Cor. 12, ‘We have not received the spirit of the world, but the Spirit which is of God, that we might know the things which are given of God:’ which things are not only life everlasting, but justification, sanctification, and such like. And as for secret sins, they cannot make our repentance void: for he that truly repents of his known sins, repents also of such as be unknown, and receives the pardon of them all. God requires not an express or special repentance of unknown sins; but accepts it as sufficient, if we repent of them generally: as David says, Ps. 19. ‘Who knows the errors of this life: forgive me my secret sins.’ And whereas they add that faith and repentance must be sufficient, I answer that the sufficiency of our faith and repentance stands in the truth and not in the measure or perfection thereof; and the truth of both where they are, is certainly discerned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, 1598), 3rd Point, Certainty of Salvation, ‘Our Reasons to the Contrary’, pp. 56-57</span></figcaption>

<blockquote><p>There is a great difference between vocation and justification. Vocation precedes, justification follows. Justification praesupponit aliquid [presupposes something], viz. faith and repentance; Effectual Calling ponit haec, non autem praesupponit [posits this, but does not presuppose it]. (Conference between Cameron and Tilen)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 512</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ceb1e5e39c" data-kw="">
<blockquote><p>Because the essence and attributes of the Godhead are never understood by the human mind immediately, adequately, as they are in themselves and therefore also not in a perfect manner, but only by way of negation, causality, and eminence.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>Aquinas’s argument is thus immune to the sorts of objections [David] Hume pressed upon design arguments, to the effect that the designer would have to work through corporeal organs the way human designers do, and would manifest complexity which itself requires explanation… They [Paley’s defenders] do not, and cannot deny that the designer at least could in principle be the sort Hume describes. But the Humean objections do not even get off the ground against Aquinas’s divine intelligence, who, being pure act, is necessarily absolutely simple and incorporeal.</p></blockquote>

</figure><figure class="quote" id="q-f1d8e2c61a" data-kw="">
<blockquote><p>[1.] A twofold revelation of God is given to wayfarers [persons in this life], one in the sphere of nature, another in the sphere of grace. 2. Revelation in the sphere of nature is either Objective in the works of creation, or Subjective in the consciences of men. 3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel and doctrine concerning Christ the Savior and faith in Him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>

</figure><figure class="quote" id="q-5c737ab3c4" data-kw="">
<blockquote><p>I here consider Francis Turretin’s approach to Natural Theology through an analysis of his response to Five important questions. First of all, what, according to Turretin, Natural Theology is and isn’t (as well as the contents of Natural Theology). Secondly, whether humans (fallen or regenerated) are able to engage in Natural Theology, and how. Thirdly, the relationship between Natural theology and the articles of faith. Fourthly, the uses and limitations of natural theology. Fifthly, the effect of Natural Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Francis Turretin and Natural Theology’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>
<div class="actions"><button class="copy" data-copy="“I here consider Francis Turretin’s approach to Natural Theology through an analysis of his response to Five important questions. First of all, what, according to Turretin, Natural Theology is and isn’t (as well as the contents of Natural Theology). Secondly, whether humans (fallen or regenerated) are able to engage in Natural Theology, and how. Thirdly, the relationship between Natural theology and the articles of faith. Fourthly, the uses and limitations of natural theology. Fifthly, the effect of Natural Theology.”

</figure><figure class="quote" id="q-b2347eb607" data-kw="">
<blockquote><p>For just as it is self-evident to us that a whole is greater than its part, so is it most evident to those who see the very essence of God that God exists, since his essence is his existence. But because we are unable to see his essence, we come to know his existence not in himself, but in his effects. … Therefore, man must come by reasoning to know God in the likenesses to him which he discovers in God’s effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles, bk. 1</cite>, ch. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

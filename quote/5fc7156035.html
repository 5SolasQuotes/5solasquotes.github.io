<main class="wrap"><figure class="quote" id="q-5fc7156035" data-kw="">
<blockquote><p>Why then do we die for another’s sin? Why is the sin of Adam imputed to us?… What? that the punishment is greater than the sin? For when we sinned in Adam only, in potentia, ‘in power’ and possibility, yet we are punished in actu, ‘in act’: And that seems most cruel, that Adam, which sinned in act is saved [by the promise of the Redeemer, it is held], and for the same sin many are damned, who sinned in Adam only in power and possibility. I answer: [1.] The place in Ezekiel must be taken thus: The innocent son shall not bear the punishment of his father’s sin: So when God says in the Law, that He will visit the iniquity of fathers upon the children, He speaks of children which walk in their father’s steps, and are partakers of the same fault: But the sons of Adam cannot be said to be innocent, as they which not only sinned in Adam, as in the stock and root of mankind, but also themselves are born stained with the same depravation, and prone to the same sin. Secondly, I say that that place in Ezekiel makes nothing to the present matter: for he speaks of the sins of the fathers, whose sins are personal, and who in sinning do not sustain the persons of their children. … Adam receiued gifts, which as he had for himself, so he should have conveyed them to his posterity, which seeing he lost, it justly comes to pass that his posterity should be deprived of those gifts. But my grandfather or great-grandfather received no supernatural gifts from God, which by an hereditary right they should derive to their posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1620), ch. 9, pp. 59-61</span></figcaption>

<blockquote><p>II. And if anyone would exactly view the manner and circumstances of Adam’s sin, he shall find that in every man, the character, and no obscure image, of that first sin, is deeply impressed: for there is engrafted in every man curiosity and desire of knowing those things which pertain nothing to him: and also a distrustful hesitation, and doubting of the Word of God: And as Adam laid the fault upon his wife, and his wife upon the Serpent, so is it natural to every man to cover his fault with another’s fault: Also flight and trembling at the meeting of God, lying, dissembling, and a sense of indecent nakedness are in all men by nature, and are derived into posterity from that fountain; and to these things we are not taught, but made, not instructed, but infected: to these things we do not only not need a master, but contrary to the teaching of masters, and to discipline, all stayes and bars being broken, we return to them, nature being conqueror.</p></blockquote>

<blockquote><p>Adam while he lived committed many sins, yet I think that only that first sin of Adam was imputed to his posterity, because only by this sin he violated that covenant which was made with him, as with the author of mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1620), pp. 57-73 | 9. ‘How the sin of Adam may belong to his posterity, and how many ways it may pass to his offspring. First of the imputation, and whether the sins of the grandfather, and great-grandfathers are imputed to their posterity’, p. 61</span></figcaption>

</figure><figure class="quote" id="q-efc3c1fb98" data-kw="">
<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … (d. 1595; Legat, 1600), bk. 1, ch. 7, pp. 25-26 trans. AI Latin</span></figcaption>

<blockquote><p>Those, then, who hold the Calvinistic view of the state of the case with respect to the moral character and condition of men, may not unreasonably be asked whether they can give any other account of the origin, or any explanation of the cause, of this fearful state of things. Now, in the history of the discussions which have taken place upon this subject, we can trace four pretty distinct courses which have been taken by theologians who all admitted the total native depravity of mankind: First, some have refused to attempt any explanation of the state of the case, beyond the general statement that Scripture represents it as in some way or other connected with, and resulting from, the fall of Adam, and have denied, expressly or by plain implication, the common Calvinistic doctrine of imputation. A second class, comprehending the great body of Calvinistic divines, have regarded it as, in some measure and to some extent, explained by the principle of its being a penal infliction upon men, resulting from the imputation to them of the guilt of Adam’s first sin. A third class, while refusing to admit in words the doctrine of imputation, as commonly stated by orthodox divines, have yet put forth such views of the connection between Adam and his posterity, and of the bearing of his first sin upon them, as embody the sum and substance of all, or almost all, that the avowed defenders of the doctrine of imputation intend by it. And, lastly, there is a fourth class, who, while professing in words to hold the doctrine of the imputation of Adam’s sin, yet practically and substantially neutralize it or explain it away, especially by means of a distinction they have devised between immediate or antecedent, and mediate or consequent imputation—denying the former, which is the only true and proper imputation, and admitting only the latter. It is quite plain that it is only the first two of these four divisions of theological opinion that can be regarded as important, or even real and substantial. For, on the one hand, those who belong to the third class… may yet be really ranked under the second class, because they admit the whole substance of what the doctrine of imputation is usually understood to include or involve; while, on the other hand, those who belong to the fourth class, admitting imputation in words, but denying it in reality and substance, belong properly to the first class.</p></blockquote>

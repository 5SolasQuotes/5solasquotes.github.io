<blockquote><p>[John Brown of] Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>

%982,Saul%20for%20them%3F%20%281%20Sam.%208%3A9&amp;text=John%20Brown%20of%5D%20Wamphray%20argues%2C%20%E2%80%982.%20If%20the&amp;text=enthroned%20king%20Saul%20for%20them%3F%20%281%20Sam.%208%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c1a1f211d5" data-kw="">
<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But:

1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth.

2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men…

3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>

<blockquote><p>But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.</p></blockquote>

+directly+command+going+to+Church+as+a+worship+to+God%2C+so+as+his+commands+have+influence+on+the+conscience+as+the+pastor%E2%80%99s+commands+have%2C+but+he+commands+going+to+church+and+hearing+so+as+the+omission+of+hearing+hurts+the+society+where+of+God+has+made+him+a+civil+and+politic+head.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%E2%80%A6+%281649%29%2C+Ch.+4%2C+pp.+51-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb51e8267d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb51e8267d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=But%20the%20sword%20is%20a%20means,him%20a%20civil%20and%20politic%20head&amp;text=But%20the%20sword%20is%20a%20means%20negatively%20to&amp;text=has%20made%20him%20a%20civil%20and%20politic%20head" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XXVII. Self-interest, self-Government and family-government are all antecedent to publick government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>

</figure><figure class="quote" id="q-896bf0dbf5" data-kw="">
<blockquote><p>There is no community but is major [has authority] in this, that it can appoint its own tutors; and though it cannot be without all rulers [due to the inclinations of nature], yet it may well be without this or that prince and ruler, and, therefore, may resume its power, which it gave conditionally to the ruler for its own safety and good; and in so far as this condition is violated, and power turned to the destruction of the commonwealth, it is to be esteemed as not given; and though the people be not a politic judge in their own cause, yet in case of manifest oppression, nature can teach them to oppose defensive violence against offensive. A community in its politic body is also above any ruler, and may judge what is manifestly destructive to itself.</p></blockquote>

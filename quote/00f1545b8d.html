<blockquote><p>At other times, He parleys and works with them, and makes gracious overtures and offers of the gospel to them. He opens a door of hope and woos and beseeches them to throw down their rebellious arms and come to Christ for life. He reveals how Christ is in a present disposition to embrace their first motion towards mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor</cite>, (†1679), 1:116-17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43f63abc46" data-kw="">
<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36.

535. Leigh, Treatise, II.xiii (p. 100).

536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>

<blockquote><p>Further, The inclination of thy heart towards fruitless and unprofitable creatures does fore-preach to thee the inclination of the heart of God towards thee in the Judgment: If thou hast either cow or any other beast that is now unprofitable to thee, though thou mayst suffer them for some time to be with thee, as God suffers sinners in the world, yet all this while thy heart is not with them, but thou wilt take thy time to clear thy hands of them. Why, just so shall thy judgment be as God says, ‘Though Moses and Samuel stood before Me,’ that is, to pray Me to spare this people, ‘yet my heart could not be towards them; therefore cast them out of my sight and let them go forth.’ Jer. 15:1; Eze. 14:13-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurrection of the Dead, and Eternal Judgment</cite>, ... (London: Smith, 1665), p. 119</span></figcaption>

<blockquote><p>The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout (Soli Deo Gloria, 1992), 1:122-23</span></figcaption>

ildren of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).”

+unjust%E2%80%9D+%28Mat.+5%3A45%29.+The+goodness+which+is+of+a+special+or+particular+nature+as+it+relates+to+God%E2%80%99s+children+is+thus+expressed%3A+%E2%80%98Truly+God+is+good+to+Israel%2C+even+to+such+as+arc+of+a+clean+heart%E2%80%9D+%28Psa.+73%3A1%29%3B+%E2%80%9CThe+LORD+is+good+unto+them+that+wait+for+Him%2C+to+the+soul+that+seeketh+Him%E2%80%9D+%28Lam.+3%3A25%29.+This+goodness+of+God+is+the+reason+why+a+believer%2C+even+after+many+backslidings%2C+is+motivated+by+renewal+to+return+unto+the+Lord.+%E2%80%9CThe+children+of+Israel+shall+return%E2%80%A6+and+shall+fear+the+LORD+and+His+goodness%E2%80%9D+%28Hosea+3%3A5%29%3B+%E2%80%9CBut+I+have+trusted+in+Thy+mercy%E2%80%9D+%28Psa.+13%3A5%29.+This+is+why+they+call+the+Lord+%E2%80%9Cthe+God+of+my+mercy%E2%80%9D+%28Psa.+59%3A10%2C+17%29.+In+this+goodness+they+rejoice+and+this+goodness+they+magnify.+%E2%80%9CI+will+sing+of+the+mercies+of+the+LORD+for+ever%E2%80%9D+%28Psa.+89%3A1%29%3B+%E2%80%9CPraise+ye+the+LORD.+O+give+thanks+unto+the+LORD%3B+for+He+is+good%3A+for+His+mercy+endureth+for+ever%E2%80%9D+%28Psa.+106%3A1%29.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%E2%80%99s+Reasonable+Service%2C+trans.+Bartel+Elshout+%28Soli+Deo+Gloria%2C+1992%29%2C+1%3A122-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca36a5eaa5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca36a5eaa5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20goodness%20of%20God%2C%20on%20the,mercy%20endureth%20for%20ever%E2%80%9D%20%28Psa.%20106%3A1&amp;text=The%20goodness%20of%20God%2C%20on%20the%20contrary%2C%20is&amp;text=for%20His%20mercy%20endureth%20for%20ever%E2%80%9D%20%28Psa.%20106%3A1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

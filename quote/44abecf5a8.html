<main class="wrap"><figure class="quote" id="q-44abecf5a8" data-kw="">
<blockquote><p>The typical reformed view and practice was that the material church buildings of Romanists, when cleansed, may be repurposed for good uses (1 Tim. 4:4–5). On the more exceptional cases where a Romanist building had been so notoriously idolatrous and scandalous, the scandal not removing with the removal of the idolatry, the reformed typically destroyed the building wholly, not allowing it to be further used. The Separatists, as seen here, were generally for destroying all the buildings that had been used by Romanists, not thinking it lawful to repurpose the material goods. See [also] ‘On Church Buildings &amp; Architecture’ (RBO)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; 1644; RBO, 2025), p. 295 fn. 727</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-b69904f602" data-kw="">
<blockquote><p>When Moses beheld the bush burning with fire, and yet no whit consumed, he wondered at the sight, and said, ‘I will now turn aside and see this great sight, why the bush is not burnt.’ But when God thereupon called unto him out of the midst of the bush, and said, ‘Draw not night hither,’ and told him who He was; Moses trembled, hid his face, and durst not behold God. Yet although being thus warned, we dare not draw so nigh; what doth hinder but we may stand aloof off, and wonder at this great sight? ‘Our God is a consuming fire;’ (Heb. 12:29) says the apostle: and a question we find propounded in the prophet, ‘Who among us shall dwell with the devouring fire? Who among us shall dwell with the everlasting burnings?’… With what astonishment then may we behold our dust and ashes assumed into the undivided unity of God’s own person; and admitted dwell here, as an inmate under the same roof? And yet in the midst of those everlasting burning, the bush to remain unconsumed, and to continue fresh, and green for evermore. Yea, how should not we with Abraham rejoice to see this day, wherein not only our nature in the person of our Lord Jesus is found to dwell for ever in those everlasting burnings; but, in and by Him, our own persons also are brought so night thereunto, that God does set his sanctuary among us, and dwell with us; and (which is much more) makes us ourselves to be the house and habitation, wherein He is pleased to dwell by his Spirit…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery of the Incarnation in The Whole Works</cite>, … (1631), vol. 4, pp. 585-86</span></figcaption>

02.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b69904f602.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=When%20Moses%20beheld%20the%20bush%20burning,pleased%20to%20dwell%20by%20his%20Spirit&amp;text=When%20Moses%20beheld%20the%20bush%20burning%20with%20fire&amp;text=He%20is%20pleased%20to%20dwell%20by%20his%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-95e9714745" data-kw="">
<blockquote><p>Of the nature of painting that represents the Historie of the Bible There are many things are more clearly set forth in a picture then in a discourse. The fabrick of the Tabernacle, the architecture of the Temple; the dimensions, stories, and divers rooms of Noahs Ark, are more perceptible by us in a painting to the eye, then is the verbal description the Scripture gives us of it. A man verily may behold the situation and length of the Land of Canaan better in a Chorographick Map, then in the History of Josuah: But that which is the more evident and easie, is not neverthelesse the more excellent. These paintings are not divine, as are the words of the Scripture. A visible representation of Solomon’s Temple is meerly a humane figure; but the verball representation of the same Temple exhibited in Scripture terms is a divine work. The picture of a man crucified, is it as divine as the words of the Scripture describing the passion of Christ? or rather, is it comparable to a Sermon, in which Jesus Christ is drawn out before our eyes, and crucified among us? Gal. 3.1. Where is it authorized by God to plant Faith in our hearts? In many narrations a picture verily may serve for an help to the understanding of the Historie: but it can never be either instrument or object of our Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Observations upon the Decalogue</cite>, … (London, 1652), 2nd Commandment. D’Espagne (1591-1659) was a French, reformed minister who lived for a significant amount of time in London., pp. 51-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

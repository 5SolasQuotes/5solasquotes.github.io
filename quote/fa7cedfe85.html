</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d6c0d32c6" data-kw="">
<blockquote><p>Scripture, moreover, has a, third rule for modifying the use of earthly blessings. We have already adverted to it when considering the offices of charity. For it declares that they have all been given us by the kindness of God, and appointed for our use under the condition of being regarded as trusts, of which one day we must give an account. We must, therefore, administer them as if we constantly heard the words sounding in our ears, ‘Give an account of your stewardship.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559), bk. 3, ch. 10, sect. 5, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-12db482fb9" data-kw="">
<blockquote><p>…but after showing us that we have degenerated from our true origin, viz., the law of our Creator, adds, that Christ, through whom we have returned to favor with God, is set before us as a model, the image of which our lives should express. What do you require more effectual than this? Nay, what do you require beyond this? If the Lord adopts us for his sons on the condition that our life be a representation of Christ, the bond of our adoption—then, unless we dedicate and devote ourselves to righteousness, we not only, with the utmost perfidy, revolt from our Creator, but also abjure the Savior Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559), bk. 3, ch. 6, sect. 3, p. 255</span></figcaption>

</figure><figure class="quote" id="q-1a1933b3bb" data-kw="">
<blockquote><p>Yea if the Covenant of the Gospel, that is, of life and salvation by Christ, be as absolute, without any condition on man’s part, as that with Noah concerning the not drowning of the whole world again (Gen. 9:9-10), then it is all one whether men receive it, and believe it, or no: the promise of life and salvation, and the covenant made with Christ concerning it, shall be made good unto them, as well as that made with Noah, shall be made good unto men, whether they know it and heare it, and believe it or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mistake or Misconstruction Removed</cite>, (Whereby little difference is pretended to have been acknowledged between the Antinomians &amp; us)… (London: Clifton, 1646), p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

</figure><figure class="quote" id="q-82ba630419" data-kw="">
<blockquote><p>Q. But why do you call it [Christ’s satisfaction] our legal righteousness? A. Because thereby the Law of God owns itself fully paid, and acquiesces 〈◊〉 it, as in full reparations, and amends made unto it for the injury and dishonour received by the sin of man. Q. And may we plead this against 〈◊〉 the challenges and accusations of the law. A. Yes. (Rom. 8:33-34) Q. And is this our legal righteousness required in the first Covenant, that of Works, which is thus imputed upon our account, wholly without us, in our Redeemer? A. Yes. Q. But is our evangelical righteousness required in the second Covenant without us, as our legal righteousness required in the Old is? A. No, for though Christ performed the conditions of the Law, and satisfied for our non-performance, yet it is ourselves that must perform the conditions of the Gospel. It is not Christ but we that must repent and believe. (Acts 20:21) Q. But there are some that tell us that Christ has also performed for us the conditions of the Gospel; that He has believed perfectly, and repented perfectly, and that all is ours: what ought we to think of this opinion? A. If we judge of it in its clear consequence, it is both absurd and blasphemous; as if Christ had a Saviour to believe in for pardon and life, or sin to repent of, and sorrow for, and mortify. Q. How is this opinion absurd? A. As it supposes a perfect Savior to stand in need of a Savior. (Heb. 7:26-27) Q. How is it blasphemous? A. As it makes Christ the Son of God a sinner, who is God and man. (Jn. 9:24-25; Phil. 2:6-7) Q. How does the Gospel justify? A. As it is the Law of Faith that publishes and declares to us upon what terms we shall be justified. (Rom. 3:27) Q. And is the Gospel our great charter, and God’s warrant under his broad seal, that he that believes shall not be condemned? A. Yes. (Jn. 3:18) Q. How does faith justify? A. By virtue of the Law promulgated and published as it is our evangelical righteousness, or our keeping the Gospel-Law, which suspends justification upon believing. Q. Does faith pretend to no merit or virtue of its own? A. No, but professedly avows its dependance upon the merit of Christ’s satisfaction, and lays hold on it as our legal righteousness. Q. Nor can it show any other title to be itself our evangelical righteousness, but only God’s sanction [Law, or Decree establishing it] who chose this act of believing to the honour of being the justifying act, because it so highly honours Christ? A. No. Q. May this be illustrated to us by some apt resemblance? A. Yes, the act of believing is as the silver; but God’s authority in the Gospel-sanction is the king’s coin, or image stamped upon it, which gives it all its value as to justification. Q. Without this stamp, could it never have been current? A. No. Q. And if God had set this stamp on any other grace, as love: would that then have been current, and have justified us as faith does now? A. Yes. Q. How does God justify? A. God justifies in a proper sense two ways: First, as a Legislator. Secondly, as a Judge. Q. How does God justify as a Legislator? A. He justifies as a Legislator, enacting by his sovereign authority that sweet and gracious Law of the New Covenant, by virtue of whose tenor every sinner that believes is justified from the guilt of sin, from which he could not be justified by the Law of Moses, Acts 13:39. Q. How does God justify as a Judge? A. 2. As a Judge, He may in three respects…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-81d4dc5743" data-kw="">
<blockquote><p>When we say it’s a rule, it must be extended to that end for which it is a rule; for as the Scripture is not a rule to Physicians or Mathematicians in their proper arts, so neither doth it particularly tend to this, or that individual action for all essentials it is a rule, and a general rule for circumstantials.

Nor doth this detract from the perfection of the Scripture, that it doth not command every circumstance because then a thing is imperfect, when it wants some perfection that is due to it: It is not an imperfection in the body, that it’s not every where, because this is not requisite to the body, so neither is it to be expected from the Scripture, that all circumstantials must be by name commanded; It’s true, the Church must take heed that under the name of circumstances she doth not bring in worship, which hath been always the subtilty of Satan. Thus Altar-worship, and Image-worship were made but circumstances in men’s books by distinctions, but in their practise as much as God’s own instituted worship. …

This rule doth extend, first, to matters of faith.

A sound faith is the soul of Religion, its like the Sun in the firmament, like the eye in the body; and commonly ubi male creditur, ibi nec bene vivitur, An ill faith and ill life go together: Hence Hymeneus and Philetus, as they made shipwreck of their faith, so they did also of a good conscience, 1 Tim. 2. 17. There is no building of any confessions of faith, but the materials must be fetched from this mountain. Error and Heresy have no such enemy as the Scripture. …

Secondly, to worship and discipline. An orthodox Church without good discipline and pure worship, is like a field of Come without hedges. What a comely Church should we have, if Scripture Orders were lookt too? In worship, all that is done without God’s Word, is doing we know not what, John 4. 22. You worship you know not what.

And by what ground they receive one voluntary worship, they might receive more. The Pope once resolved that he with his Cardinals should at a set time ride on Asses partly to shew their humility, and partly to imitate Christ’s riding on an Ass to Jerusalem; But the Cardinals refused it as too absurd, yet they might on the same ground have received that as a custom, as all their other rabble of worship.

So for discipline and order, a profane man should be as rare in the Church, as a blazing star, If any one be an Idolater, a reviler, no not to eat with such an one, 1 Cor. v. 11. And again, If any walk disorderly, withdraw from such an one. I know different judgements improve these places to different opinions, but I press that which all agree in; I acknowledge that governours are more to be encouraged in this work, because the ignorance and profaneness of people cannot endure to see a brazen serpent broken down. You worthy Patriots, you have endeavoured to bury Moses his Body, left it should be worshipped and how doth the Devil withstand you?</p></blockquote>

<blockquote><p>In the next place, let me charge you to hold fast the old doctrine of the Church of England about the sanctity and right observance of the Sabbath Day. I name this point because our old English Sunday appears to me to be in great danger. We live in perilous times. Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting every one do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his campaign against the Lord’s Day than he has done since the Reformation.

You may see what I mean in the persistent attempts frequently made to throw open places of amusement, aquariums, libraries, theatres, museums, picture galleries, and the like, under the plausible pretence of ‘affording recreation to the working-classes’! All such attempts, I maintain, ought to be firmly and vigilantly resisted. They are the first steps towards a Continental Sunday, and a general flood of Sabbath desecration, Sunday shop-opening, and Sunday delivery of letters in London. I would not have you give way to such attempts. ‘No surrender!’ should be our cry. Let us fight to the last plank for the old English Sunday. Give up the outworks, and the citadel will soon fall.

That laymen of high position and education, noblemen, philosophers, and scientific lecturers, should assist the attempt to break down the standard of Sunday observance, is matter for deep regret. I can only suppose that they do it in ignorance. If they would only study hearts and consciences and death-bed feelings half as much as they study political economy, or stones and plants and beasts and geology and astronomy and light and chemistry and the secrets of earth and air and sea, I believe they would not act as they do. I pity and pray for them. ‘They know not what they do.’

But how any clergyman holding office in the Church of England, and reading the Fourth Commandment every Sunday to his congregation, can lend his aid to movements which must infallibly prevent the Sabbath being kept holy, if they succeed, is one of those mysteries of the nineteenth century which pass my understanding. I am amazed, pained, troubled, grieved, and astonished. The good that the best clergyman does at his very best in a fallen world is small. But he that expects to do good by introducing a Continental Sunday into his parish, exhibits, in my judgment, however excellent his intentions, great ignorance of human nature. He is cutting off his right hand, and destroying his own usefulness.

Whatever may be the bad habits of the working-classes in large parishes, they will never be cured by organizing modes of breaking the Fourth Commandment. We should call that statesman a poor lawgiver who sanctioned petty larceny in order to prevent burglary; and I call that clergyman an unwise man, who, in order to stop drunkenness and its concomitants, is prepared to throw overboard the Sabbath Day. Surely to sacrifice one commandment in order to prevent the breach of another, is neither Christianity nor common-sense. It is, in my opinion, ‘doing evil that good may come.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hold Fast. The Fourth Triennial Charge to the Diocese of Liverpool, November 4, 1890 in Charges and Addresses</cite></span></figcaption>

<blockquote><p>If you did aright consider that you are no more worthy of the least blessing of God than the vilest creature in the world, and that not your goodness, but God’s goodness is the cause that you excel others, there would be no place left for over-weening conceits of your self, but you would conclude (as the truth is) that the better you are gifted, the more you are indebted, and the more talents you have, the more thanks you owe unto God, and the more service unto his people. And thus much for the first remedy against pride, which is, to try our selves and our actions by the true touchstone of God’s word.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If you did aright consider that you are no more worthy of the least blessing of God than the vilest creature in the world, and that not your goodness, but God’s goodness is the cause that you excel others, there would be no place left for over-weening conceits of your self, but you would conclude (as the truth is) that the better you are gifted, the more you are indebted, and the more talents you have, the more thanks you owe unto God, and the more service unto his people. And thus much for the first remedy against pride, which is, to try our selves and our actions by the true touchstone of God’s word.”

— John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal, (London: William Welbie, 1611), p. 28.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+you+did+aright+consider+that+you+are+no+more+worthy+of+the+least+blessing+of+God+than+the+vilest+creature+in+the+world%2C+and+that+not+your+goodness%2C+but+God%E2%80%99s+goodness+is+the+cause+that+you+excel+others%2C+there+would+be+no+place+left+for+over-weening+conceits+of+your+self%2C+but+you+would+conclude+%28as+the+truth+is%29+that+the+better+you+are+gifted%2C+the+more+you+are+indebted%2C+and+the+more+talents+you+have%2C+the+more+thanks+you+owe+unto+God%2C+and+the+more+service+unto+his+people.+And+thus+much+for+the+first+remedy+against+pride%2C+which+is%2C+to+try+our+selves+and+our+actions+by+the+true+touchstone+of+God%E2%80%99s+word.%E2%80%9D%0A%0A%E2%80%94+John+Dod%2C+Four+godly+and+fruitful+sermons+two+preached+at+Drayton+in+Oxford-shire%2C+at+a+fast%2C+enjoined+by+authority%2C+by+occasion+of+the+pestilence+then+dangerously+dispersed.+Likewise+two+other+sermons+on+the+twelfth+Psalm.+Whereunto+is+annexed+a+brief+tract+of+zeal%2C+%28London%3A+William+Welbie%2C+1611%29%2C+p.+28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27b62fa696.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27b62fa696.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/16/john-dod-an-antidote-to-pride/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-900138a031" data-kw="">
<blockquote><p>Mark well how many parsonages or vicarages are there in the realm, which at the least have a plow-land a-piece. Then note the lands of bishops, abbots, priors, nuns, knights of St John’s, cathedral churches, colleges, chauntries, and free-chapels. For though the house fall in decay, and the ordinance of the founder be lost, yet will not they lose the lands. What cometh once in, may never more out. They make a free-chapel of it; so that he which enjoyeth it shall do nought therefore. Besides all this, how many chaplains do gentlemen find at their own cost, in their houses? How many sing for souls, by testaments? Then the proving of testaments, the prizing of goods, the bishop of Canterbury’s prerogative; is that not much through the realm in a year? Four offering days, and priuy tithes. There is no servant, but that he shall pay somewhat of his wages. None shall receive the body of Christ at Easter, be he never so poor a beggar, or never so young a lad or maid, but they must pay somewhat for it. …What get they also by confessions? Yea, and many enjoin penance, to give a certain [sum] for to have so many masses said, and desire to provide a chaplain themselves; soul-masses, dirges, month-minds, year-minds, All-souls-day, and trentals. The mother church, and the high altar, must have somewhat in every testament. Offerings at priests’ first masses. Item, no man is professed, of whatsoever religion it be, but he must bring somewhat. The hallowing, or rather conjuring of churches, chapels, altars, super-altars, chalice, vestments, and bells. Then book, bell, candlestick, organs, chalice, vestments, copes, altar-cloths, surplices, towels, basins, ewers, ship, censer, and all manner ornament, must be found them freely; they will not give a mite thereunto. Last of all, what swarms of begging friars are there! The parson sheareth, the vicar shaveth, the parish priest polleth, the friar scrapeth, and the pardoner pareth; we lack but a butcher to pull off the skin.</p></blockquote>

<blockquote><p>As penitent sinners of various kinds were ordered to sit in the church ”bare-heidit all the tyme of the sermons,’¹ it would appear that the members of the congregation kept their hats on during that time. This is also implied by Knox’s statement that the Earl of Huntly pulled down his bonnet over his eyes when the preacher denounced certain vices.² In 1637, George Gillespie says: ‘A man coming into one of our churches in time of public worship, if he see the hearers covered, he knows, by this customable sign, that sermon is begun.”‘³ Thomas Kirk, an Englishman, who visited Dundee in 1677, says: “We heard a sermon at the greatest church; they first sing a psalm, and then the minister begins his prayer, and as soon as he has taken his text they all put on their hats.’† By the beginning of the eighteenth century many Scottish Presbyterians uncovered their heads during sermon.° The custom survived in the Scottish Church at Rotterdam until at least the last quarter of the nineteenth century. At one time the ministers of Scotland may have kept their hats on while preaching, as French and Dutch Protestant preachers did.ª ¹ Booke of the Universall Kirk, 2:692. ² Laing’s Knox, 2:362. ³ Dispute Against the English-Popish Ceremonies, 1637, part 3, p. 86. † Kirk and Thoresby’s Tours in Scotland, p. 19. — In England, during part of the seventeenth century, it was customary for the people to sit in church with their hats on, and to take them off when they sang the Psalms (Brand’s Popular Antiquities, Bohn’s ed., 2:323). Some lifted them at the name of Jesus [according to the Anglican custom] (Marsden’s Early Puritans, 1853, p. 347). ° An Examination of Three Prelatical Pamphlets, 1703, p. 18. ª “He [i.e. Alix] was bold and brisk in the pulpit, and when he read his text, he cocked his hatt; but Claud, when he put on his hat, slipped it on, and drew down the sides of it” (Wodrow’s Analecta, 2:273). ‘The ministers’ of the Church of Holland ‘are covered in the time of sermon’ (Lieut. -Col. Erskine to Wodrow in 1728, Edinburgh Christian Instructor, xxvii, 265). This custom was approved by at least one eminent English [Independent] Puritan. “Mr. [Philip] Nye told us his private judgement, that in preaching he thinks the minister should be covered, and the people discovered; but in the sacrament, the minister should be discovered, as a servant, and the guests all covered.” (Laing’s Baillie’s Letters, 2:149).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ab070bda2a" data-kw="">
<blockquote><p>Highly prize and frequent All the Means of Grace in Public and Private God’s Ordinances are his Sacred Channels wherein alone in ordinary, his streams of grace do flow. How did David exult in the enjoyment of them! How did he lament in the want of them! Christians ought to observe all Christ’s Commandments and Ordinances.

They must not forsake the Assembling of themselves together, as the manner of some is, O blessed is that people that know the joyful sound! The New Covenant, and the Administrations thereof are to continue till the end of this world: and therefore they ought still to be attended upon by all God’s New Covenant People.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-904eca776e" data-kw="">
<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>

m%20either%20commanding%20or%20entreating" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ce0d0714fd" data-kw="">
<blockquote><p>God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man. Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit. The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works, which was entered into with Adam, and renewed on Mount Sinai. These two covenants indeed agree with each other in various particulars:—of both, God is the author; in both there are the same contracting parties; in both is promised eternal life and happiness: but they differ also in many respects; in the covenant of works God is considered as Creator and Lord, in the covenant of grace as Redeemer and Father; in the first there were was no mediator, in the second Christ is the Mediator; in the one God dealt with man as upright, in the other he deals with man as a sinner; the former depended on man’s own obedience, the latter depends on the obedience of Christ; in the former was promised life, namely, a state consisting of all good things; in the latter is promised salvation, which, along with life, includes also deliverance from sin and death; in the first God required works, saying, Do this and live; in the second he requires faith, saying, Believe, and thou shall be saved. The covenant of grace does indeed require works of righteousness, but not that we may merit eternal life by them; nor does the imperfection of Christian obedience, provided it be sincere, stand in the way of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 281–82.</span></figcaption>

</figure><figure class="quote" id="q-14e906f598" data-kw="">
<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>

<blockquote><p>‘Come.’ As before: and again in the next branch; and yet again, in the third verse [of Isa. 55], so oft repeated, as to show God’s forwardness to invite and willingness to impart: so closely to tax men’s natural backwardness to those things, that most nearly and deeply concern his own good. See the like, Eze. 32:18, 30-32…</p></blockquote>

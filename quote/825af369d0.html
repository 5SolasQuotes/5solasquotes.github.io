<main class="wrap"><figure class="quote" id="q-825af369d0" data-kw="">
<blockquote><p>The second means for healing divisions in the church is to have… some fundamental doctrines wherein all agree: this is the basis of unity and concord in the church. The ancients call it the rule of faith, seed of doctrine, the catholic faith, the character of the church, that which is common to small and great (Irenaeus, [Against Heresies] bk. 1, ch. 3; Nazianzen, Orations 14, 40; Augustine, Enchiridion, ch. 7; Tertullian, Of the Prescription, ch. 13–14; Of the Veiling of Virgins, ch. 1; Athanasian Creed; Irenaeus, bk. 1, ch. 1 [Preface]; Augustine, Epistle 57; see [Robert] Parker, Of the Descent [1611], bk. 4, §3. 1 Cor. 3:10–11; 2 Tim. 1:13; Col. 1:23; Eph. 4:13; 1 Tim. 3:16; Gal. 1:6; Rom. 6:17; 12:6; 2 Tim. 1:13–14; 1 Cor. 2:2; 1 Tim. 6:3; Tit. 1:1; Phil. 1:27; Rev. 14:1)… 2. Where there is this agreement in fundamentals, there ought to be mutual and fraternal affections, notwithstanding differences in other things; no reproaches, no exasperations, no individuous consequences, no odious imputations, no uncharitable digladiations; but an owning of one another as brethren and discussing and ventilating of the points in difference with the spirit of love and meekness, saying to one another, as Abraham to Lot, ‘Let there be no strife between thee and me, for we are brethren.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works</cite>, … (London: Holdsworth, 1826), sermon 14, “Brotherly Reconciliation” (1657/1659), pp. 155-57</span></figcaption>

<blockquote><p>Mr. de Cluse in his prophesy [preaching amongst the Brownists] labored to prove separation from a true Church for any corruption, obstinately stood in this doctrine, was by another in prophesying there showed to be absolutely contrary to the place, Rev. 2:24; which how unsoundly it was concluded by our teacher was then observed by many… If these things be so, and be not redressed by the 〈◊〉 of this prophesy we must (according to Mr. de Cluse’s doctrine) make a new separation. How oft do the [Brownist] Brethren except one against another’s prophesying, by which, much heart-burning and strife is kindled between them? These things being well considered, I pray you well to mind whether this new way of prophesying on the Lord’s Day can be for the edification of the Church or not.</p></blockquote>

ne</a></div>
</figure><figure class="quote" id="q-8ed0b72981" data-kw="">
<blockquote><p>Thus we see where at this day we may find the true Church of God. Now I come to the third question; and that is: At what time a man may with good conscience make separation from a Church. Answer: So long as a Church makes no separation from Christ, we must make no separation from it: and when it separates from Christ, we may also separate from it;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed, on the Church in A Golden Chain</cite>, (1595), on the Church in A Golden Chain (Cambridge, 1600), p. 497</span></figcaption>

— William Perkins, An Exposition of the Creed (1595), on the Church in A Golden Chain (Cambridge, 1600), p. 497">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+we+see+where+at+this+day+we+may+find+the+true+Church+of+God.+Now+I+come+to+the+third+question%3B+and+that+is%3A+At+what+time+a+man+may+with+good+conscience+make+separation+from+a+Church.+Answer%3A+So+long+as+a+Church+makes+no+separation+from+Christ%2C+we+must+make+no+separation+from+it%3A+and+when+it+separates+from+Christ%2C+we+may+also+separate+from+it%3B%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+of+the+Creed+%281595%29%2C+on+the+Church+in+A+Golden+Chain+%28Cambridge%2C+1600%29%2C+p.+497&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ed0b72981.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ed0b72981.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Thus%20we%20see%20where%20at%20this,we%20may%20also%20separate%20from%20it&amp;text=Thus%20we%20see%20where%20at%20this%20day%20we&amp;text=from%20Christ%2C%20we%20may%20also%20separate%20from%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2e1456b782" data-kw="">
<blockquote><p>religious differences should be managed religiously; that is, piously and charitably. This may be; it is possible; for it is prescribed and pressed: ‘Let us not therefore judge one another any more.’ (Rom.14:13) ‘But why dost thou judge thy brother? Or why dost thou set at nought thy brought?’ (Rom. 14:10) and ‘Let us therefore follow after the things which make for peace.’ (Rom. 14:19) And this should be: for charity is a grace of an universal extent; we owe it to all, – to the weak, to the ignorant, to the peevish, to the proud, to the good, and to the bad: ‘Owe no man any thing, but to love one another.’ (Rom. 13:8) And it is of that necessary connection with other saving graces, that we can neither have faith nor hope, unless we have charity; yea, ‘the greatest of these is charity’ (1 Cor. 13:13). And herein the true church of Christ hath ever excelled. The fathers of old, in their dealing with the Donatists, would account them their brethren, when they could not prevail with them for a reciprocation. And it is a golden saying of Bernard: ‘I will cleave to you against your will; I will cleave to you even against my own will: when ye are moved, I will be quiet; I will give place to anger, that I may not give place to the devil.’ And there is great reason for such a temper: for every difference in religion creates not a different religion: while men do hold the Head, they must needs be of the body. Where the same substantial doctrine is avowed, accidental variety is very tolerable, especially where the peace of God’s Church is not infringed. It was worthy bishop [Edward] Reynolds’s conclusion: ‘Where the same straight road to heaven is kept, a small difference of paths hinders not travelers from coming to the same inn at night.’ So neither should they bitterly contest about the next way, who steadily own the same Guide, the same rule, the same end; only, every one has not so clear an eye, nor such opportunity to know the more obscure points pertaining to the Christian religion, which others have. Therefore in these things Luther’s motto is best: ‘Where there is anything of Christ, there is love:’ and this love ‘will cover,’ not one or two, but ‘the multitude of sins’ and infirmities (1 Peter 4:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Various Puritans, The Morning Exercises at Cripplegate</cite>, ... vol. 4 (of 6), ed. James Nichols, 5th ed. (1659-1689; London: Tegg, 1844), pp. 222-23</span></figcaption>

<blockquote><p>8. The Church can fail in respect of its faith or its morals. Regarding morals there is no doubt and regarding faith it is certain. The apostles erred in the doctrine of Christ’s resurrection and Christ’s kingdom, which are both articles of faith.

9. It is also possible that the Church errs in its foundation, but it does not err tenaciously or until the end. This is evident in the apostles, who erred in the fundamental doctrine concerning the resurrection.</p></blockquote>

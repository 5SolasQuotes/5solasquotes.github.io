<main class="wrap"><figure class="quote" id="q-fc2f003d25" data-kw="">
<blockquote><p>[A]ll ceremonies and observances instituted by the invention of man to form part of the worship of God are so many sacrileges against Him. For, in the same way as it belongs to Him alone to make the promise, so also to Him alone to choose the seal and to affix it to His promises (Gal 1:8, 9; 1 Cor 11:23-25).

That is why all those who have had the presumption to make new Sacraments or who have added to those which He has established in His Church by His written Word, or have subtracted from them, have falsified the seals of His majesty. As for ourselves, we are satisfied in our Churches with those which God has appointed by His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.33, p. 47.</span></figcaption>

<blockquote><p>…for when we see the strictness of the institution, and how far we come short of it, we are ready to doubt that we do too little, less than God requires… the true soul can comfort itself in the sincerity of its desires; for though God accounts nothing little that springs from an upright heart… Though they cannot be perfect in their services, yet they will make a right choice, serve God after his own manner; not make it up in the pomp, what is wanting in the power of religion, as many do; but look principally to the inward part, to the truth of religion.</p></blockquote>

<blockquote><p>Objection 2: There is much error mixed with the few truths they preach, as Popery, Arminianism, etc. There are also invective reflections, yea railings against the people of God. Answer 1: What is morally good will bear the mixture of a great deal of evil, and yet retain its goodness still: the goodness being from God, who is a greater good than Satan or sin is an evil. Answer 2: We cannot expect from men of ordinary gifts that truth be preached without the mixture of errors more or less: We know but in part, therefore are to prove all things, and hold fast that which it good, Heb. 5:14. A saint, as other creatures, though weak and newly born, has a raft of what is food suitable and what sincere. Answer 3: As for those intemperate expressions and reflections on the people of God: I confess it is sad, but were there not such against Paul and his party? (Phil. 1:15) Yet notwithstanding they are to be heard even by the same persons they enveighed against, for the truth’s sake.</p></blockquote>

<blockquote><p>After his [Saul’s] death, the crown was set upon David‘s head. Whose constant pious life, and holy devotions (in Hymns, Psalms, and Spiritual Songs) are left, as the best patterns, directions, and encouragements to all posterity. And we are sure enough, that he himself, after his own use of them (to shew the difference betwixt His end, and Saul‘s) was happily assured to be one of the Heavenly Quire above, and there Crowned again with an immortal Crown of Glory. David is an ancient Pattern, a Royal Prophet, and Grand Guide to such, as are willing to fight the Battles of the Lord, in their Pilgrimage towards the true Land of Promise…</p></blockquote>

</figure><figure class="quote" id="q-d0a7982aac" data-kw="">
<blockquote><p>In the substantials of worship, Unity is necessary; there all are bound to go by the same rule, and to do to the uttermost they are able, the same thing.

But the circumstantials of worship have a two-fold consideration: They are either such, as though but circumstances to some other worship, yet have also in themselves some divine worship, some spiritual efficacy, something in them to commend our service unto God, or to cause some presence of God with us, or to work us nearer to God, by an efficacy beyond what they have in them of their own natures.

As for instance, Time is a circumstance, but the Lords day hath a worship in it commending our service to God, and an efficacy to bring God to us, and raise us to God: this not from any natural efficacy of the time, but from God’s institution. Now in such circumstances as these, there ought to be uniformity; for these have institutions for their rule, and are not at man’s liberty to be altered as he thinks best in prudence; But there are other circumstances which are only natural or civil, subservient to worship in a natural or civil way; They are conversant about worship, but have nothing of worship in them, but are merely natural or civil helps to it. When we worship God, we do something as men as well as worshippers; hence we have need of some natural or civil helps. As for instance, when we meet to worship God, we being men as well as Christians, must have a convenience of place, to keep us from the weather, to know whether to resort; and of time to know when.

There must be order: Many cannot speak at once to edification; modest and grave carriage is required of us, as a society of men, meeting about matters of weight. In these circumstances, and other of the like nature, there is no worship at all, there is no spiritual efficacy, there are only natural or civil helps to us, while we are worshipping; therefore for these circumstances, human prudence is sufficient to order them.

The right understanding of this takes away a great prejudice that many have against such as desire to keep to Divine Institutions, not only in Substantials, but in the Circumstantials of worship; they think it an unreasonable thing, that divine Institution should be required for every circumstance in worship; this hath bred a great quarrel in the church: and well may it be thought unreasonable, if we required Institutions for circumstances in worship, which are but natural or civil helps, and have no worship at all in them, for that indeed were endless, and a mere vanity. Certainly, Institutions are to be required only in things that are raised beyond what is in them naturally, in tendring my respects to God by them, or expecting to draw my heart nearer to God, or God nearer to me in the use of them. The contention about Uniformity is much increased for want of a right understanding of this difference in the circumstantials of worship; did we understand one another in this, we might soon have Peace as concerning this thing.

In these latter sorts of circumstances, we must also distinguish. There are some that must of necessity be determined, as time and place; it is therefore necessary, there should be an uniformity in these, in all the members of every society respectively, that they agree to meet in the same place, at the same time, natural necessity requires this: but natural necessity requires not the binding of several Churches to Uniformity in things of this kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the lovers of truth and peace heart-divisions opened in the causes and evils of them: with cautions that we may not be hurt by them, and endeavours to heal them (London: Robert Dawlman, 1653), pp 14-15.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— Jeremiah Burroughs, Letter to the lovers of truth and peace heart-divisions opened in the causes and evils of them: with cautions that we may not be hurt by them, and endeavours to heal them (London: Robert Dawlman, 1653), pp 14-15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+substantials+of+worship%2C+Unity+is+necessary%3B+there+all+are+bound+to+go+by+the+same+rule%2C+and+to+do+to+the+uttermost+they+are+able%2C+the+same+thing.%0A%0ABut+the+circumstantials+of+worship+have+a+two-fold+consideration%3A+They+are+either+such%2C+as+though+but+circumstances+to+some+other+worship%2C+yet+have+also+in+themselves+some+divine+worship%2C+some+spiritual+efficacy%2C+something+in+them+to+commend+our+service+unto+God%2C+or+to+cause+some+presence+of+God+with+us%2C+or+to+work+us+nearer+to+God%2C+by+an+efficacy+beyond+what+they+have+in+them+of+their+own+natures.%0A%0AAs+for+instance%2C+Time+is+a+circumstance%2C+but+the+Lords+day+hath+a+worship+in+it+commending+our+service+to+God%2C+and+an+efficacy+to+bring+God+to+us%2C+and+raise+us+to+God%3A+this+not+from+any+natural+efficacy+of+the+time%2C+but+from+God%E2%80%99s+institution.+Now+in+such+circumstances+as+these%2C+there+ought+to+be+uniformity%3B+for+these+have+institutions+for+their+rule%2C+and+are+not+at+man%E2%80%99s+liberty+to+be+altered+as+he+thinks+best+in+prudence%3B+But+there+are+other+circumstances+which+are+only+natural+or+civil%2C+subservient+to+worship+in+a+natural+or+civil+way%3B+They+are+conversant+about+worship%2C+but+have+nothing+of+worship+in+them%2C+but+are+merely+natural+or+civil+helps+to+it.+When+we+worship+God%2C+we+do+something+as+men+as+well+as+worshippers%3B+hence+we+have+need+of+some+natural+or+civil+helps.+As+for+instance%2C+when+we+meet+to+worship+God%2C+we+being+men+as+well+as+Christians%2C+must+have+a+convenience+of+place%2C+to+keep+us+from+the+weather%2C+to+know+whether+to+resort%3B+and+of+time+to+know+when.%0A%0AThere+must+be+order%3A+Many+cannot+speak+at+once+to+edification%3B+modest+and+grave+carriage+is+required+of+us%2C+as+a+society+of+men%2C+meeting+about+matters+of+weight.+In+these+circumstances%2C+and+other+of+the+like+nature%2C+there+is+no+worship+at+all%2C+there+is+no+spiritual+efficacy%2C+there+are+only+natural+or+civil+helps+to+us%2C+while+we+are+worshipping%3B+therefore+for+these+circumstances%2C+human+prudence+is+sufficient+to+order+them.%0A%0AThe+right+understanding+of+this+takes+away+a+great+prejudice+that+many+have+against+such+as+desire+to+keep+to+Divine+Institutions%2C+not+only+in+Substantials%2C+but+in+the+Circumstantials+of+worship%3B+they+think+it+an+unreasonable+thing%2C+that+divine+Institution+should+be+required+for+every+circumstance+in+worship%3B+this+hath+bred+a+great+quarrel+in+the+church%3A+and+well+may+it+be+thought+unreasonable%2C+if+we+required+Institutions+for+circumstances+in+worship%2C+which+are+but+natural+or+civil+helps%2C+and+have+no+worship+at+all+in+them%2C+for+that+indeed+were+endless%2C+and+a+mere+vanity.+Certainly%2C+Institutions+are+to+be+required+only+in+things+that+are+raised+beyond+what+is+in+them+naturally%2C+in+tendring+my+respects+to+God+by+them%2C+or+expecting+to+draw+my+heart+nearer+to+God%2C+or+God+nearer+to+me+in+the+use+of+them.+The+contention+about+Uniformity+is+much+increased+for+want+of+a+right+understanding+of+this+difference+in+the+circumstantials+of+worship%3B+did+we+understand+one+another+in+this%2C+we+might+soon+have+Peace+as+concerning+this+thing.%0A%0AIn+these+latter+sorts+of+circumstances%2C+we+must+also+distinguish.+There+are+some+that+must+of+necessity+be+determined%2C+as+time+and+place%3B+it+is+therefore+necessary%2C+there+should+be+an+uniformity+in+these%2C+in+all+the+members+of+every+society+respectively%2C+that+they+agree+to+meet+in+the+same+place%2C+at+the+same+time%2C+natural+necessity+requires+this%3A+but+natural+necessity+requires+not+the+binding+of+several+Churches+to+Uniformity+in+things+of+this+kind.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Letter+to+the+lovers+of+truth+and+peace+heart-divisions+opened+in+the+causes+and+evils+of+them%3A+with+cautions+that+we+may+not+be+hurt+by+them%2C+and+endeavours+to+heal+them+%28London%3A+Robert+Dawlman%2C+1653%29%2C+pp+14-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd0a7982aac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d0a7982aac.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2025/01/12/jeremiah-burroughs-on-the-two-fold-consideration-of-the-circumstantials-of-worship/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

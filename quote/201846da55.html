<main class="wrap"><figure class="quote" id="q-201846da55" data-kw="">
<blockquote><p>7. The virginity of Mary after her child-bearing, to wit, that as it is most certain, that before her child-bearing, she was unknown of man; so also she remained a virgin after the same unto her dying day, is religiously believed: yet there is nothing expressly found concerning this point in the holy Scriptures, neither doth it belong any-wise unto the mystery of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed in the University of Geneva, by certain Students of Divinity there, under Mr. Theodore Beza and Mr. Anthony Faius</cite>, … (Edinburgh, 1591), Ch. 42, ‘Principles Concerning the Nativity, Circumcision and Baptism of Christ’, p. 109</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“7. The virginity of Mary after her child-bearing, to wit, that as it is most certain, that before her child-bearing, she was unknown of man; so also she remained a virgin after the same unto her dying day, is religiously believed: yet there is nothing expressly found concerning this point in the holy Scriptures, neither doth it belong any-wise unto the mystery of our salvation.”

— Theodore Beza, Propositions &amp; Principles of Divinity Propounded and Disputed in the University of Geneva, by certain Students of Divinity there, under Mr. Theodore Beza and Mr. Anthony Faius… (Edinburgh, 1591), Ch. 42, ‘Principles Concerning the Nativity, Circumcision and Baptism of Christ’, p. 109">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+The+virginity+of+Mary+after+her+child-bearing%2C+to+wit%2C+that+as+it+is+most+certain%2C+that+before+her+child-bearing%2C+she+was+unknown+of+man%3B+so+also+she+remained+a+virgin+after+the+same+unto+her+dying+day%2C+is+religiously+believed%3A+yet+there+is+nothing+expressly+found+concerning+this+point+in+the+holy+Scriptures%2C+neither+doth+it+belong+any-wise+unto+the+mystery+of+our+salvation.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Propositions+%26+Principles+of+Divinity+Propounded+and+Disputed+in+the+University+of+Geneva%2C+by+certain+Students+of+Divinity+there%2C+under+Mr.+Theodore+Beza+and+Mr.+Anthony+Faius%E2%80%A6+%28Edinburgh%2C+1591%29%2C+Ch.+42%2C+%E2%80%98Principles+Concerning+the+Nativity%2C+Circumcision+and+Baptism+of+Christ%E2%80%99%2C+p.+109&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F201846da55.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/201846da55.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-perpetual-virginity-of-mary/#:~:text=7.%20The%20virginity%20of%20Mary%20after,unto%20the%20mystery%20of%20our%20salvation&amp;text=7.%20The%20virginity%20of%20Mary%20after%20her%20child%2Dbearing&amp;text=belong%20any%2Dwise%20unto%20the%20mystery%20of%20our%20salvation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955), 22:23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-77a05bc9a3" data-kw="">
<blockquote><p>Fifthly, we do not with Helvidius oppugne the perpetual virginity of the blessed Virgin, nor in all respects equal marriage with virginity; nor was he to be condemned, if in regard of merit of eternal life, he equaled marriage with virginity.</p></blockquote>

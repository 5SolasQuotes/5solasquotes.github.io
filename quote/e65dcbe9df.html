<main class="wrap"><figure class="quote" id="q-e65dcbe9df" data-kw="">
<blockquote><p>When writing privately to his English friend, William Wilberforce, Thomas Chalmers explained how the majority of evangelical ministers within the Church of Scotland now diverged from the views of the Covenanters against the toleration of popery and were now advocating that Romanists be admitted to parliament (so-called Catholic Emancipation):

I promised to write you on a subject the interest of which has for the time gone by. I have based with a most approving eye to the part you take respecting the Catholics of Ireland and I simply wanted to let you know, that the evangelical party in our Church are fast hastening towards the same enlightened spirit of Christian and liberal policy in regard to them.

There are still a few extremely old clergymen amongst us who have not yet got the better, and never will of the sore recollections of their Covenanting forefathers. But with the exception of them and of some others who take the opposite side of the question from political motives, I do think that the Church of Scotland would like the removal of the existing disabilities. What a piece of kingly munificence would it have been, had his majesty been enabled to carry the deed of emancipation to Ireland along with him. ….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Wilberforce, 25 June 1821 (David M. Rubenstein Rare Book &amp; Manuscript Library, Duke University, Durham NC, William Wilberforce Letters, RL.01381).</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/guardian-angels.html">Guardian angels</a></span></div>

</figure><figure class="quote" id="q-9f2a62812d" data-kw="">
<blockquote><p>Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 7-8</span></figcaption>

<blockquote><p>mere hieroglyphics, to represent the constant tender love and watchfulness of God over the ark of his covenant and the people that kept it, and had nothing of the nature of images in them.” (Works 14.446) Durham seems even more uncomfortable over the problem posed by the cherubim. He would like to ban representations of angels altogether, but he hesitates to take too firm a stand: ‘From this ground also it would seem, that painting of angels might be condemned, as a thing impossible, they being spirits which no corporeal thing can represent, beside that the representing of them has some hazard with it: and for those cherubims that were made by God’s direction under the Old Testament, they were rather some emblem of the nature and service of angels, as being full of zeal, and always (as it were) upon wing read to obey God’s will, than any likeness of themselves.’ (Law Unsealed, pp. 68–69) The bronze serpent made by Moses is clearly a happier example. The worship of this “Nehushtan” by later generations demonstrates how easily even lawful images may be abused. (Cf. ibid., p. 69; Boston, Works 2.151; Watson, Body of Divinity, pp. 388-89)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-125c99f4f5" data-kw="">
<blockquote><p>The gospel method of sanctification, as well as of justification, lies so far out of the ken of natural reason, that if all the rationalists in the world, philosophers and divines, had consulted together…” Thomas Boston, Preface to The Marrow of Modern Divinity, to lay down a plan for repairing the lost image of God in man, they had never hit upon that which the divine wisdom has pitched upon, viz: that sinners should be sanctified in Jesus Christ (1 Cor 1:2), by faith in him (Acts 26:18); nay, being laid before them, they would have rejected it with disdain, as foolishness (1 Cor 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Boston’s Preface” in The Marrow of Modern Divinity (Ross-Shire, UK: Christian Focus, 2009), 31. (HT: Joshua Waulk)</cite></span></figcaption>

</figure><figure class="quote" id="q-0bc84a0fa8" data-kw="">
<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:14</span></figcaption>

<blockquote><p>7th Problem: Whether unregenerate or regenerate man sanctifies himself, or actively concurs to it? I respond: concerning the former, negatively; concerning the latter, affirmatively, if indeed sanctification in the moment and in the second act is understood, that is, its excitation and ἐνέργεια [energeia, energy/activity], or continuation. And thus the sayings 2 Cor. 7:1; 1 Jn. 3:3 are to be understood.</p></blockquote>

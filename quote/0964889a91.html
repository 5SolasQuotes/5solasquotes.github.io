<main class="wrap"><figure class="quote" id="q-0964889a91" data-kw="">
<blockquote><p>In the preface to a printed version of James Begg’s speech before the General Assembly of the Free Church of Scotland in 1868 on the subject of Irish disestablishment, he attributed Ulster’s prosperity partly to its Protestantism and warned of the evils of the British government disowning Protestantism in Ireland:

The vast importance of the subject to which it relates can scarcely be over-estimated, and although a singular amount of delusion is abroad in regard to it, it is hoped that wiser counsels may yet prevail. That any one who, having read history, has travelled over Ireland, and had an opportunity of comparing that fertile but unhappy country with other lands, can have any serious doubt as to the leading cause of its social degradation, seems incredible. Other causes, no doubt, there are, but let any one compare Belfast with Galway, Protestant Ulster with the Popish south and west of Ireland, and it seems impossible to deny that the same cause which has degraded Mexico and Spain, Austria and Italy, has visibly stamped its impress on Ireland. …

That the question of Ireland involves peculiar difficulties, especially when considered cursorily, and from a Scotch point of view, without regard to the broad issues raised, may be readily admitted. But these difficulties are not new; and what is now proposed is that the Government should, instead of reforming, not only disendow but disestablish or disown Protestantism in Ireland; in other words, virtually hand over that unhappy country to the management of the Romish priests. How such a man as Dr [Thomas] Chalmers would have acted in present circumstances cannot be doubtful; and a mere change of position cannot affect unalterable principles, founded on the Word of God.

At the present moment parties are manifestly acting in concert whose objects are totally different, and never, perhaps, was the political craft of Rome more conspicuous than in getting so many opposite classes to do her work, and that too upon pretence of seeking to destroy her influence.

The questions now raised, however, should be considered apart from individuals or parties, and we commend the following facts and considerations to the Christian people of Britain, who must think and act for themselves. They have now, to an extent greater than has probably existed since the Reformation, the power of influencing the proceedings of statesmen and of parliaments.

No such crisis as the present has occurred since the Revolution; no more important parliament than that about to assemble has been convened in modern times. And we trust the result will prove that the Protestant spirit of the country is still unbroken, and that whilst fully prepared for every measure of true reform, the Parliament of Britain will resist revolution, and maintain to the uttermost that truth and righteousness by which alone a nation can be exalted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 3, 4.</span></figcaption>

<blockquote><p>After the defeat [of Argyle’s expedition, 1685], two of the ministers who came over with Argyle’s party sought to join with the Society. The Society rejected them because they had left the country during a time of need, joined with Indulged ministers in worship, spoken out against the Society, associated with Argyle’s expedition, and had not supported [Donald] Cargill and [Richard] Cameron. In their defense, the two ministers compared their associations abroad with Renwick’s foreign ordination and expressed concerns regarding the Society’s testimonies and declarations. The two ministers would not abstain from fellowship with the Indulged, but ‘declared their willingness to lay things in present controversy aside, until they should be determined by a competent judicatory [which the Society People were not].’ (Shields, Faithful Contendings, pp. 168-182) The Society members, finding these terms unacceptable, decided not to join with these two ministers. Some left with the two ministers resulting in yet another painful division. (Ibid., 169)… [Patrick] Walker also listed James Nisbet as one who could attest to the conflicts that took place among the Society members during this time. James memoir describes how he saw first hand the divisions that resulted from the Argyle affair: ‘But, alas! I got my comforts a little lowered this day upon the reason following: There came to that meeting some of the worthy gentlemen who came home this year with the Earl of Argyle on his expedition; they and some other of our Christian friends looked shy and cold upon one another upon the account of some difference in judgment and opinion that was among them. [This] was matter of sorrow of heart to me now, but much more so afterwards, when I saw the woeful consequences thereof; for I quickly observed that these differences of opinion occasioned much alienation of affection, even among those who were otherwise truly religious. Likewise, it served much to eat out the vitals of religion in the waste of much precious time, which was spent in debating and contending, which might otherwise have been very usefully spent in seeking after and in pursuit of the one thing needful, the better part, which could not have been taken from them.’ (Nisbet, Private Life, pp. 114-15)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (2000) Moore is very sympathetic with the Cameronians., p. 117</span></figcaption>

<blockquote><p>…they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one when they are necessarily called to give a testimony against the other; Yea, the duty and care they owe to the preservation of the government constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt national Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honoured amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government itself;</p></blockquote>

</figure><figure class="quote" id="q-b971b9c2fa" data-kw="">
<blockquote><p>But, in reality, this reconciliation will prove a total defection from the protestant religion; for the church of Rome neither will nor can part with any thing that shall change its antichristian state and idolatrous worship. The whole of their pretension is but a decoy to get us into their power; where we shall be made to understand both where we are and where we have been also.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>A Brief and Impartial Account of the Nature of the Protestant Religion</cite></figcaption>
<div class="meta"><span class="t">True and False Church</span><span class="t">Rome: The Church</span></div>

</figure><figure class="quote" id="q-8cc42432c9" data-kw="">
<blockquote><p>Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.13</figcaption>
<div class="meta"><span class="t">Concupiscence</span><span class="t">Rome: Sin and Free Will</span></div>

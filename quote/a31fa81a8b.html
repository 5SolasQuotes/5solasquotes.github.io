<blockquote><p>God wills not only Himself, but other things apart from Himself. This is clear from the comparison which we made above (A. 1). For natural things have a natural inclination not only towards their own proper good, to acquire it if not possessed, and, if possessed, to rest therein; but also to spread abroad their own good among others, so far as possible. Hence we see that every agent, in so far as it is perfect and in act, produces its like. It pertains, therefore, to the nature of the will to communicate as far as possible to others the good possessed; and especially does this pertain to the divine will, from which all perfection is derived in some kind of likeness. Hence, if natural things, in so far as they are perfect, communicate their good to others, much more does it appertain to the divine will to communicate by likeness its own good to others as much as possible. Thus, then, He wills both Himself to be, and other things to be; but Himself as the end, and other things as ordained to that end, inasmuch as it befits the divine goodness that other things should be partakers therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 19 | art. 2, Whether God wills things apart from Himself?, I answer that</span></figcaption>

<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>

<blockquote><p>[Margin:] (What mercy is in God: Miseri cordia est voluntas Dei qua ad succurrendum miseris et propensus [Mercy is the will of God by which He is inclined to succor the miserable.]; [Johannes] Sharpius. The mercy of God some call the property or attribute of his nature, inclining Him to relieve the misery of his creature; some the essence of God showing mercy. [William] Sclater on the 117th Psalm: Ira dicitur esse in Deo non ut turbidus motus animi sed simplex voluntas ad ultionem.) But mercy in God is his very essence whereby He is infinitely disposed to help succour and comfort such as be in any miserable condition. Those expressions in Scripture: ‘In their afflictions He was afflicted’; and ‘Mine heart is turned within Me, my repentings are kindled together,’ are borrowed phrases, as from the turning of the bowels in men at the sight of an object of pity. And yet in men this is not mercy itself but a companion of pity. Yet because by it our mercy is made known, we call it by the name of ‘mercy’. We call rolling of bowels mercy, and mercy rolling of bowels, which yet is but a companion of it, and that in men only and not in God. Mercy may be without it, and in God always is; because God has no bowels to be turned, God is one most simple essence, and has no qualities. And therefore when we say God is merciful, we speak of Him metaphorically, as when we say God is angry. Anger is a turbulency of spirit, but there is no such thing in God. The effects of that which is called anger in God are often put for anger: as when we see the punishment and scourges on the backs of wicked men we conclude that God is angry. In like manner when we see the [hurtful] rod taken of and cast into the fire (which is an effect of mercy) we say God is merciful. But mercy in God signifies two things: First, an inclination in his heavenly Majesty to show mercy. Secondly, the effects of his supposed affection, which is his helping of the miserable creature, or a making out of God to such as have need of help and pity. The affection of mercy in men is known by that grief that accompanies it (Tanquam a nobis notiori vertus ipsa nomen traxit), but such a companion of mercy cannot be in God. O mercy is a glorious attribute of God, He is a very sea of mercy, He is never dry. Amongst men he that is fullest of pity is but a drop of it. Their pity falls infinitely short of what is in God. And this mercy of God is either general to all his creatures or special unto mankind or more special and peculiar: that whereby He is said to be merciful to his elect unto eternal life and [gives] freedom from the wrath to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-larkham.html">Thomas Larkham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Attributes of God Unfolded &amp; Applied</cite>, ... (London: Eglesfield, 1656) Larkham (1602–1669) was an English puritan clergyman and settler in New England., pp. 103-4</span></figcaption>

<blockquote><p>Question 13. But how may it appear that He is willing to receive me? Answer: Make trial of Him thyself. If thou didst but know his heart to poor sinners, you would not question it. Believe what He says in the gospel; there thou shalt find that He is a willing Savior; for therein thou hast: First, his most serious invitations, Mt. 11:28, “Come unto Me, ye that are weary and heavy laden.” Isa. 55:1, “Ho! every one that thirsteth come ye to the waters.</p></blockquote>

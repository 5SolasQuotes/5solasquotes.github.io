<main class="wrap"><figure class="quote" id="q-9f715a8a9e" data-kw="">
<blockquote><p>God made man upright, gave him a righteous law, which, when broken, that all hopes might not be cut off, He sent his Son: Rom. 8:3, ‘God sending his own Son in the likeness of sinful flesh, and for sin, condemned sin in the flesh,’ to be the foundation of a new covenant; offered you grace in Him, pardon of all your sins past, to help you in the course of obedience for time to come; moved you by powerful arguments, not by low and cheap considerations, but those of the greatest weight, the joys of heaven, the torments of hell; called upon you often by the ministry, knocked at your hearts as well as your ears by his Spirit; waited for your amendment for many years, tried you by mercies if they could melt you, by afflictions if they would reduce you to a sense of your duty. But all this will not do; yet you are still alive, and these means continued. What shall God do more? Now why are you not converted? Others are wrought upon by the same means and turned to the Lord, and have entered in by the strait gate, and framed their desire to walk in the narrow way. They have not offers more rich, or free, or particular. God has not told them of a hotter hell or a better heaven, or another or a more taking gospel. God speaks to you and them in the same terms, with the same grace and favor, and makes the door wide enough to get in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 2</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0e9e3932e" data-kw="">
<blockquote><p>Those that care not to please God, yet care for the outward favors of God [such as Esau], and are ready to murmur if they want [lack] them; as if God were bound to them and they [were] free. And yet so merciful is God, that He has second blessings for those that love Him not, and gives them all they care for. That one blessing of special love is for none but Israel; but those of common kindness are for them that can sell their birthright. This blessing was more than Esau could be worthy of…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments (d. 1656; Old Paths Gospel Press), vol. 1</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-42a4d4d71e" data-kw="">
<blockquote><p>We distinguish and teach that in this sense they [reprobates] are made to be reconciliable by the death of Christ, by which Prosper says (Response to the Little Head of the Gauls, ch. 9): “Christ is the Savior of the whole world on account of his true undertaking of human nature and communion in the ruin of the first man.” Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: … 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism, pp. 421-422 c. 1638-1643 trans. T. Fentiman</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-829edfe447" data-kw="">
<blockquote><p>5. Although through this call salvation becomes the possession of only a few, as everyone must admit, it nevertheless retains its great value and significance also for those who reject it… Frequently, even for those who harden themselves in their unbelief, it is a source of various blessings. The enlightenment of the mind, a taste of the heavenly gift, partaking of the Holy Spirit, enjoyment of the Word of God, the experience of the powers of the age to come–these have sometimes even come to those who later fell away and held the Son of God in contempt (Heb. 6:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, 4:37-38</span></figcaption>

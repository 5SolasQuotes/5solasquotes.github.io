<main class="wrap"><figure class="quote" id="q-a5d26390b3" data-kw="">
<blockquote><p>Now, you have heard what usury is, and of what it is derived; you shall hear the unlawfulness of it.

First, It is against the law of charity, because charity biddeth us to give every man his own, and to require no more than our own; but usury requireth more than our own, and gives not to other their own. Charity rejoiceth to communicate her goods to other, and usury rejoiceth to gather other men’s goods to herself.

Secondly, It is against the law of nations; for every nation hath some law against usury, and some restraints against usurers, as you shall hear when we speak of the punishment.

Thirdly, As it is against the law of nations, so it is against the law of nature; that is, the natural compassion which should be amongst men. You see a river when it goeth by an empty place, it will not pass until it hath filled that empty place, and then it goeth forward to another empty place, and filleth it; and so to another place, and filleth it; always filling the places which are empty. So should we; the rich should fill the poor, the full should fill the hungry, they which abound should fill them which want; for the rich are but God’s almoners, and their riches are committed to them of God, to distribute and do good, as God doth himself.

As the water is charitable after a sort, so is the air; for it goeth into empty places too, and filleth them as the water doth. Nature cannot abide that any place should be empty; and therefore the air, though it be a light body, and so naturally ascendeth upward, yet rather than any place in the earth should be empty, the air will descend (as it were) from his throne, and go into caves, into dens, and into dungeons, to fill them.

If the rich were so good to their empty brethren as the air and water are to other empty things; as there is no empty place in the world, so there should be no empty person in the world; that is, the rich in Israel would fill the poor in Israel. But the rich make the poor to fill them; for usurers feed upon the poor, even as great fishes devour the small. Therefore he which said, ‘Let there not be a beggar in Israel, Deut. xv.4, said too, Let there not be an usurer in Israel. For if there be usurers in Israel there will be beggars in Israel; for usurers make beggars, even as lawyers make quarrellers.

Fourthly, It is against the law of God. First, It is forbidden in Exod. xxii. 25, where it is said, ‘If thou lend money unto my people, that is, to the poor with thee, thou shalt not oppress them with usury.’ Here is usury called oppression; therefore if oppression be a sin, usury is a sin too. Secondly, It is forbidden, Lev. xxv. 37, where it is said, ‘Thou shalt not give thy money to usury, nor lend thy victuals for increase.” Here you may see that men may be usurers of victuals and other things, as well as of money. Thirdly, It is forbidden in Deut. xxiii. 19, where it is said, ‘Thou shalt not lend unto thy brother upon usury.’

And lest you should say that he meaneth but one kind of usury, he sheweth that he meaneth all kinds of usury; for after, in the 19th verse he saith, ‘As usury of money, usury of victuals, usury of corn, or usury of anything that is given to usury;’ because some are no usurers of money, but some are usurers of victuals, some are usurers of cloth, some are usurers of corn, some are usurers of wine, some are usurers of oil, and some of one thing, and some of another; and none would be counted usurers but they which lend money unto usury; therefore God forbiddeth so precisely usury of anything, shewing that all usury is unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Examination of Usury. In Two Sermons</cite>, (1591) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 1: 91-92.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1a450251e5" data-kw="">
<blockquote><p>Who does not see, that this is a common case, among those on whom God has bestowed the riches of this world? The more they are indebted to their great benefactor, the more do they forget him. The more he causes their cup to run over, the more presumptuous, hardened, and ungrateful do they appear.

This is so plainly the fact, that if a man were to ask, where shall I find the best friends of my God? Where shall I find the heart that glows with the warmest sensibility for the common blessings of divine providence? We must for the most part direct him to the humble dwellings of the poor, and often to those who subsist upon the slender charity of their fellow men.

Read what the pious Asaph has said of the rich in the seventy-third Psalm. “Their eyes stand out with fatness; they have more than heart can wish. — They set their mouth against the heavens and their tongue walketh through the earth. They say, how doth God know? And, is there knowledge in the Most High? Behold these are the ungodly, who prosper in the world: they increase in riches.” We know that this is not true of all: we know that there are many who, like Abraham, abound in the good things of this life — and at the same time are rich in faith and heirs of the kingdom. Still it cannot be denied that men who increase in wealth, often increase in pride and self-sufficiency, and forget their dependence on God.</p></blockquote>

<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)…

3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery…

4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>

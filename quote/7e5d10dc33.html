<blockquote><p>Although the question of whether or not the penalty for restitution was of perpetual obligation was debated among the early Reformed, the Puritan William Ames argued that the Mosaic Law against theft remains valid – even though it is not repeated in the New Testament:

That is less which is objected, that the Law of Moses concerning the punishment of theft, is no where found to be repeated, and confirmed in the new Testament, and therefore that it was merely political and judicial. For they themselves grant, which are of the contrary opinion those Laws of Moses to be universal and perpetual, which have a universal and perpetual cause and reason, and not a particular belonging to the Jews; and they can bring no special reason, but it is a ridiculous one of the kindred, and affinity of the Israelites among themselves: which reason can take no place in strangers, who notwithstanding were not punished capitally for a simple theft; and if that reason did avail against the capital punishment of thieves among the Israelites, it would have availed also against the capital punishment of other faults.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the power and cases thereof</cite>, (London, 1643), pp 263-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4cd6764ff" data-kw="">
<blockquote><p>Seventhly, are any of the Reformed Churches or any Churches or persons of the whole world so injurious to magistrates as their principles [that of the New England Independents, such as John Cotton] force them to be, who spoil Christian kings and parliaments of their whole legislative power? They will have us to believe, as good divinity, that it is not only unlawful for Church-assemblies to make ecclesiastic canons, but that it is alike unlawful for any prince or State to make a civil law, that the placing of a legislative power in kings or parliaments, is to usurp the property and prerogative of God. These principles cannot be very favorable to the State, which at one stroke annihilate all the acts of Parliament that now are in force, either in this or any other kingdom, and make it impossible (if they were believed) to have any more in any place of the earth, to the world’s end. Look back upon what I have cited from the chief of the Brownists’ writings. I grant the New English polishers of Brownism do not express their tenets in terms so hugely gross; yet see how near they come to them in substance, when they tell us that no magistrate may make any Laws about the bodies, lands, goods, liberties of the subject, which are not according to the laws and rules of Scripture, Scripture being given to men for a perfect rule, as well in matters of civil justice, as of devotion and holiness; and if so, then they must make it as unlawful and contrary to the Scripture’s perfection, for any man to make laws in matters of righteousness and of the State, as in matters of holiness and of the Church. That beside things in themselves good or evil, which Scripture determines by its laws expressly, things of an indifferent nature, whereupon the most of civil laws are made, must be regulated according to the Scripture rules of piety, charity, and conscience, so far that the expediency and reason of the law must ever carry and convince the conscience of the subject: that no man is obliged to the obedience of a civil Law in a thing never so indifferent by the authority of the lawgiver, but every man whose conscience is not convinced of the piety and charity of that Law, is free from all obedience and subjection thereto: Thus far Mr. Cotton.¹ ¹ Cotton’s Model of Power in The Bloody Tenet, p. 140. “The magistrate in making laws about civil and indifferent things in the commonwealth; First, he has no power given him of God to make what laws he pleases, either in restraining from or constraining to the use of indifferent things; because that which is indifferent in its nature, may sometimes be inexpedient in its use, and consequently unlawful: it is a prerogative proper to God to require obedience of the sons of men, because of his authority and will. It is an evil speech in some, that in some things the will of the law, not the reason of it, must be the rule of conscience to walk by: and that princes may forbid men to seek any other reason but their authority, yea when they command men frivola &amp; dura; and therefore it is the duty of the magistrate in all laws about indifferent things, to show the reasons, not only the will; to show the expediency as well as the indifferency of things of that nature; and because the judgement of expedient and inexpedient things, is often difficult and diverse, it is meet that such laws should not proceed without due consideration of the rules of expediency set down in the Word, which are these three: First, the rule of piety, that they may make for the glory of God, 1 Cor. 10:31. Secondly, the rule of charity, that no scandal come thereby to any weak brother, 1 Cor. 8:13. Thirdly, the rule of charity, that no man be forced to submit against his conscience, Rom. 14:14,23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London: 1645), pp. 127-28</span></figcaption>

<blockquote><p>The judicial law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles, and the typical signification of the kingdom of Christ. However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments for crimes, these same judicial laws all remain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scriptorum Theologicorum Heidelbergensium Tomus Primus, continens Locos Communes</cite>, (Amstelodami, Apud Joannem Janssonium, 1646), Locorum Theologicorum, Pars Prior, Locus VI, pp 100–13. Quoted in Johannes Piscator, Disputations on the Judicial Laws of Moses, trans. Adam J. Brink, ed. Joel McDurmon (1646; Powder Springs GA: American Vision Press, 2015), p. 59n.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>That this Author saith, God commanded those that transgressed his holy Law with an high hand, and presumptuously to be killed, lest they should live and profane his holy things; I defend not: But sure Erastus erreth, who will have all such to be killed by the Magistrate under the New Testament, because they were killed in the Old: Then are we to stone men that gathereth sticks on the Lord’s Day; the child that is stubborn to his Parents, the Virgins, daughters of Ministers that committeth fornication are to be put to death. Why, but then the whole judicial Law of God shall oblige us Christians as Carolosladius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them, so it was mysterious teach of us, how God hated such and such sins, and mysteries of that kind are gone with the other shadows. But we read not (saith Erastus) where Christ hath changed those Laws in the New Testament. It is true, Christ hath not said in particular, I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated until the evening; nor hath he said particularly of every carnal Ordinance and judicial Law, it is abolished. Be we conceive, the whole bulk of the judicial Law, as judicial, and as it concerned the Republick of the Jews only, is abolished, though the moral equity of all those be not abolished; also some punishments were merely symbolical, to teach the detestation of such a vice, as the boaring with an aul the ear of him that loved his Master, and desired still to serve him, and the making of him his perpetual servant. I should think the punishing with death the man that gathered sticks on the Sabbath was such; and in all this, the punishing of a sin against the Moral Law by the Magistrate, is Moral and perpetual; but the punishing of every sin against the Moral Law, tali modo, so and so, with death, which spitting on the face: I much doubt if these punishments in particular, and in their positive determination to the people of the Jews, be moral and perpetual: As he that would marry a captive woman of another Religion, is to cause her first pare her nails, and wash herself, and give her a month, or less time to lament the death of her Parents, which was a Judicial, not a Ceremonial Law; that this should be perpetual, because Christ in particular hath not abolished it, to me seems most unjust; for as Paul saith, He that is Circumcised becomes a debtor to the whole Law, sure to all the Ceremonies of Moses his Law: So I argue, à pari, from the like, He that will keep one judicial Law, because judicial and given by Moses, becometh debtor to keep the whole judicial Law, under pain of God’s eternal wrath.</p></blockquote>

<blockquote><p>(8) Human flourishing is a greater and more foundational natural, teleological purpose and good than sex organs and contra-acting them in some way. Hence, so contra-acting, which is not inherently wrong, is right when it results in greater human flourishing, which could not occur (or would not best occur) except through this means.</p></blockquote>

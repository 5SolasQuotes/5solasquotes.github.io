<main class="wrap"><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bac27814f" data-kw="">
<blockquote><p>Truly, such vain displays of pride and arrogance make a mockery of the holy God when the Roman Pontiff is seen acting in the place of God, sitting in the temple of God as God, showing himself to be God. It seems incredible that anyone but an insane man should behave in such an unlikely manner, taking both the name and authority of God upon himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/the-pope-as-antichrist.html">The pope as Antichrist</a></span></div>

</figure><figure class="quote" id="q-bffd5fb0a7" data-kw="">
<blockquote><p>Thus, when the Pope usurps the triple office of Christ, he destroys Christ’s gospel by his own traditions, also destroying Christ’s redemption by his own indulgences, purgatory, masses, and rewards; all this while verbally professing Jesus to be the Christ. Notwithstanding his profession, he must be regarded as having denied Christ, together with the Father, by his very deeds and works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 58</span></figcaption>

</figure><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>

</figure><figure class="quote" id="q-dc860b657c" data-kw="">
<blockquote><p>If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</span></figcaption>

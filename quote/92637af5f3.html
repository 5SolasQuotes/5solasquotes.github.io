<blockquote><p>7. Q. If for the reasons given, then, the only way to eternal life is the crucified Jesus, truly God and truly human, does it not necessarily follow that all other religions or faiths, which present other ways and means to eternal life, are false? A. Only the Christian religion and faith is the true faith; all others are false. For only Christians recognize God as one true God, who is perfectly just and perfectly merciful and thus the true God. He is perfectly just in that He does not leave sin unpunished but punished each and every sin with unspeakable hellish torment in His Son on the wood of the cross, whereby not a half but a full and just payment for our sins was made. He is perfectly merciful in that He makes us pay absolutely nothing but out of sheer mercy gave us the Son for our payment, without any merit on our part, while we were yet sinners. By contrast, all other religions and faiths do not recognize God as perfectly just and merciful. Think once of the Jews, the Turks, or the Papists, who know by nature that God is just and will not leave sin unpunished. Yet, when their consciences bother them, they come and offer a gift upon the altar, hoping thereby to buy off God for sins that deserve eternal damnation. That is just like a thief or murderer who, in trying to buy off the judge with money or a gift, shows that he does not consider the judge to be just; otherwise he would not expect to be able to bribe him. Since, then, religions other than Christianity cannot bring to the judgment seat of God a full payment (which only Christ can do) but only a few trifling merits and tattered works, not even a thousandth the size of the sin they wish to pay with them, it is certain that these other religions do not regard God as perfectly just. By the same token, they do not regard him as perfectly merciful either, for they think that they have already made half the payment with their offerings and worship. But God is not half-just and half-merciful; He is completely so and wishes to be regarded and recognized as such. Therefore, all other religions, however many there are, in fact rob God of His perfect justice and mercy, because they worship not the true God but an idol that they themselves have conjured up and that is neither perfectly just nor perfectly merciful—in short, not the true God. 8. Q. Just as there is only one way to salvation, the crucified Christ, there is also only one doctrine of salvation that freely and graciously offers us Christ and all His benefits for our possession. What is this doctrine? A. The gospel. Because it contains promises of salvation, it is called the gospel of salvation, a word of salvation, and a power of God unto salvation (Rom. 1[:16]). Of course the law leads us by the hand, as it were, to this doctrine. For after we are convicted of our unrighteousness and smitten with the awareness of eternal death, the law teaches us not to seek salvation in ourselves but to accept by faith the salvation offered us outside of ourselves in the gospel. St. Paul speaks of this in Rom. 10[:4]: “The end of the law is Christ for righteousness to every believer.” Also, “The law was our tutor to bring us to Christ” (Gal. 3[:24]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation: An Aid to Interpreting the Heidelberg Catechism</cite>, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 7–8.</span></figcaption>

<blockquote><p>§1. Question 1: Must I always do as I would be done by? Or has this rule any exceptions? Answer: The rule intends no more but that your just self-denial and love to others be duly exercised in your dealings with all. And: 1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them. 2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, (London, 1673), pt. 4, ch. 19, title 2, p. 114</span></figcaption>

<blockquote><p>We adults, who are imbued with the noxious doctrine of the papists, which we absorbed into our very bones and marrow, acquired an opinion of Christ altogether different from the one that Paul sets forth here. No matter how much we declared with our mouths that Christ had redeemed us from the tyranny and slavery of the Law, actually we felt in our hearts that He was a lawgiver, a tyrant, and a judge more fearful than Moses himself. Even today, in the great light of the truth, we cannot completely banish this wicked opinion from our minds. So stubbornly do things to which we have been accustomed since youth cling to us! You young people, who are still unspoiled and have never been infected by this wicked notion, have less difficulty in teaching purely about Christ than we adults have in banishing these blasphemous illusions about Him from our minds. Yet you have not altogether escaped the wiles of the devil. For even if you have not yet been imbued with this wicked idea of Christ as a lawgiver, you still have the same source of this idea in you, namely, the flesh, the reason, and the wickedness of our nature, which cannot think of Christ in any other way than as a lawgiver. Therefore you must contend with all your might, in order that you may learn to acknowledge and regard Christ as Paul portrays Him in this passage [Gal. 4:4-5]. But if, in addition to the wickedness of our nature, there come wicked teachers—of whom the world is full today, both the old and the new variety—they lend support to the wickedness of our nature; and the evil is doubled. For when wicked instruction is applied to a nature that is already corrupted in itself, it is impossible not to develop a false Christ. As I have said, reason invents him on its own; and then bad instruction makes him grow and impresses him on our minds so strongly that he cannot be eliminated without great labor and effort.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.1</span></figcaption>

</figure><figure class="quote" id="q-e0985778de" data-kw="">
<blockquote><p>The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis et Foederis</cite>, [Vindications of the Law and Covenant]: or a Reply to Mr. Philip Cary’s Solemn Call in Works, vol. 6, p. 323</span></figcaption>

</figure><figure class="quote" id="q-c30af86216" data-kw="">
<blockquote><p>Just as Abraham, when God allied Himself with him, was obligated to ‘walk before his face’, so Israel as a people was similarly admonished by God’s covenant to a new obedience. The entire law, which the covenant of grace at Mount Sinai took into its service, is intended to prompt Israel as a people to ‘walk’ in the way of the covenant. It is but an explication of the one statement to Abraham: ‘Walk before me, and be blameless [Gen. 17:1], and therefore no more a cancellation of the covenant of grace and the foundation of a covenant of works than this word spoken to Abraham. The law of Moses, accordingly, is not antithetical to grace but subservient to it and was also thus understood and praised in every age by Israel’s pious men and women. But detached from the covenant of grace, it indeed became a letter that kills, a ministry of condemnation. Another reason why in the time of the Old Testament the covenant of grace took the law into its service was that it might arouse the consciousness of sin, increase the felt need for salvation, and reinforce the expectation of an even richer revelation of God’s grace. It is from that perspective that Paul views especially the Old Testament dispensation of the covenant of grace. He writes that Israel as a minor, placed under the care of the law, had to be led to Christ (Rom. 10:4; Gal. 3:23f.; 4:1f.) and that in that connection sin would be increased and the uselessness of works for justification and the necessity of faith would be understood (Rom. 4:15; 5:20; 7:7f.; 8:3; Gal. 3:19). On the one hand, therefore, the law was subservient to the covenant of grace; it was not a covenant of works in disguise and did not intend that humans would obtain justification by their own works. On the other hand, its purpose was to lay the groundwork for a higher and better dispensation of that same covenant of grace to come in the fullness of time. The impossibility of keeping the Sinaitic covenant and of meeting the demands of the law made another and better dispensation of the covenant of grace necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 3, pt. 2, ch. 5, ‘The Covenant in Old Testament Salvation History’, p. 222</span></figcaption>

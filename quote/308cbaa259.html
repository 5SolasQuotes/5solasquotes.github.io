<main class="wrap"><figure class="quote" id="q-308cbaa259" data-kw="">
<blockquote><p>In a speech delivered at Glasgow on ‘The Dangers of Scotland’, James Begg called for a renewal of the Scottish covenants:

In conclusion, he [Begg] spoke of the duties of the young men in the matters to which he had been attending. For one thing, they were to be patriots. In fact, he would say it was high time they were considering the renewal of the Covenants of Scotland. This struggle was only beginning – the dark cloud was only appearing in the immediate distance; but he had no doubt, unless Scotland was to be given over to ruin and destruction, she would, as the struggles grew nearer, band herself together, and assert her power as of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Glasgow Herald</cite>, 11 December 1877.</span></figcaption>

</figure><figure class="quote" id="q-d8dcde1da6" data-kw="">
<blockquote><p>When I consider the original institution of the Sabbath, of which we have so explicit an account at the close of the Mosaic narrative of the creation; when I find the observance of this day enjoined in one of the precepts of the moral law; when I find, throughout the Psalms and the Prophets, this solemn injunction implicitly repeated; when I hear our blessed Lord expressly speaking of the existence of this day after the abolition of the Jewish economy; when I hear the apostle John, long after our Lord’s resurrection and ascension into heaven, speaking with peculiar emphasis, of a particular day as the Lord’s Day; when I find the apostles by their example setting apart one day in seven for religious purposes; when I can trace the existence and observance of Sabbatical Institutions from the creation down to the present hour; and when to these considerations, I add the natural fitness and propriety of such a day, and consider how indispensable it is to the existence of religion among men: I am compelled to believe that the Sabbath is of Divine origin and perpetual obligation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gardiner-spring.html">Gardiner Spring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath a Blessing to Mankind</cite>, in Tracts of the American Tract Society. General Series. Volume 1 (n.d.), no. 37, p. 1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-8ff51caef2" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice, a white garment], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Reply, pt. 2</cite>, ch. 8, pp. 262–63</span></figcaption>

</figure><figure class="quote" id="q-33a1038d43" data-kw="">
<blockquote><p>…as to the preaching of the Word, we grant that the people are not obliged to give blind and implicit obedience to what is delivered by the ministers, as if they ought to receive as the Word of God whatsoever is delivered by them, but that they have power and ought by the judgment of discretion to search the Scriptures whether the things delivered by the ministers be so, to try the spirits whether they be of God or not, to prove all things and hold fast that which is good, Acts 17:11; 1 Jn. 4:1; 1 Thess. 5:18; and the like judgment of discretion we grant to them in relation to other parts of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-wood.html">James Wood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Stone Pretended to be out of the Mountain, Tried &amp; found to be a Counterfeit</cite>, … (Edinburgh: Andro Andrews, 1654), pt. 2, sect. 1, p. 202</span></figcaption>

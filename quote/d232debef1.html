<blockquote><p>Holy Scripture contains all things necessary for our salvation, and that clearly; and therefore nothing beyond its open testimony is to be admitted in religion as necessary either to believe or to do.</p></blockquote>
<figcaption>— <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a>, <cite>On the Sufficiency of Scripture</cite>, Proposition 1</figcaption>
<div class="meta"><span class="t">Sufficiency</span><span class="t">Perspicuity</span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d04c21ab00" data-kw="Grace">
<blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote>
<figcaption>— <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</figcaption>
<div class="meta"><span class="t">Nature of Union</span></div>

</figure><figure class="quote" id="q-a94e564bfc" data-kw="Mary Queen of Heaven King">
<blockquote><p>We acknowledge the Blessed virgin to be the most excellent member of this spouse; and that, in this sense, she reigns with Christ, and with all the faithful. But that Christ administers his kingdom through her, as through the Queen of heaven, or that he has constituted her to have Dominion over all creatures with Royal power, since this is not proved from scripture; but is only fashioned by the most audacious men, she will never receive it; … nor can we defer it to her.</p></blockquote>
<figcaption>— <a href="../authors/andre-rivet.html">André Rivet</a>, <cite>Apology for the Most Holy Virgin Mary</cite>, Bk. 2, ch. 2</figcaption>

</figure><figure class="quote" id="q-38e6700b84" data-kw="">
<blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote>
<figcaption>— <a href="../authors/william-whitaker.html">William Whitaker</a>, <cite>A Disputation on Holy Scripture</cite>, Question III, ch. 10</figcaption>
<div class="meta"><span class="t">Sufficiency</span><span class="t">Necessity of Scripture</span></div>

</figure><figure class="quote" id="q-7b5f26575e" data-kw="">
<blockquote><p>In this we are even more justified, because the nature and requirements of a rule fit as exactly as possible with Scripture alone. First, the rule of living for God, without doubt, ought to be prescribed by God alone (Deut. 12:32; Matt. 15:9). For a rule cannot be prescribed by any other than by the one whom the rule concerns. Now, Scripture alone has been prescribed by God as the rule for us (2 Tim. 3:16; 2 Peter 1:21), and due to the sublimity of the matter it could not be revealed and prescribed by anyone but God.</p></blockquote>
<figcaption>— <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a>, <cite>Theoretical-Practical Theology</cite>, vol. 1: Prolegomena, Part 1, Book 1, ch. 2, §V</figcaption>
<div class="meta"><span class="t">Sufficiency</span><span class="t">Divine Authority</span></div>

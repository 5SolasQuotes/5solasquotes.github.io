<main class="wrap"><figure class="quote" id="q-e7d422be2a" data-kw="">
<blockquote><p>Is the whole of Christ’s salvation offered in the gospel to sinners? Then salvation from the law as a covenant of works is tendered to them. In the declarations and offers of the blessed gospel, the consummate righteousness of Jesus Christ, which has not only answered all the demands of the law as a covenant but has magnified the law and made it honorable (Isa. 42:21), is presented to them. In the gospel they are also invited to receive the gift of that glorious righteousness, against which the utmost rigor of the violated law can offer no objection because it is the righteousness of Him who is God as well as man. When they are enabled to accept the gift of it and to rely with humble confidence on it for all their title to justification and eternal life, it is imputed to them; and they are so justified in the sight of God as to be set free from all the demands of the law in its covenant form. And when by means of the gospel they are thus delivered from the dominion of the law as a covenant, they are, in consequence, saved from the dominion of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 103.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e560c5d9a6" data-kw="">
<blockquote><p>If he knows not the difference between the law and the gospel, he will be apt, especially in the affair of justification, to confound the one with the other. The consequence will be that in his painful experience, bondage will be mixed with liberty of spirit, fear with hope, sorrow with joy, and death with life. If he cannot so distinguish the gospel from the law as to expect all his salvation from the grace of the gospel and nothing of it from the works of the law, he will easily be induced to connect his own works with the righteousness of Jesus Christ in the affair of his justification. This was the great error of the Judaizing teachers in the churches of Galatia. They mingled the law with the gospel in the business of justification, and thereby they so corrupted the gospel as to alter the very nature of it and make it another gospel. They taught that except men were circumcised and kept the law of Moses, they could not be justified or saved (Acts 15:1-5). They informed the people that while the righteousness of Christ received by faith was necessary, their own works of obedience were also requisite in connection with it to entitle them to justification before God. This is a fundamental error and such a one that, if even an angel from heaven would publish it, he should be accursed. Accordingly, the apostle boldly affirmed to the Galatians, and he deliberately and earnestly repeated his declaration that though he himself or even an angel from heaven were to preach any other gospel to them than that which he had preached unto them, he should be accursed (Gal. 1:8-9). To mingle, then, the law with the gospel or to teach men to join the works of the law to the perfect righteousness of Jesus Christ as the ground of a sinner’s title to justification in the sight of God is, according to our apostle, to preach “another gospel” (Gal. 1:6). As this is a great error, so it is a very dangerous error. If a man attempts to add any works of his own to the consummate righteousness of Jesus Christ as the ground of his justification before God, Christ profits him nothing. The obedience and death of Christ have “become of no effect” to him. “Behold, I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing. For I testify again to every man that is circumcised, that he is a debtor to do the whole law. Christ is become of no effect unto you, whosoever of you are justified by the law; ye are fallen from grace” (Gal. 5:2-4). If a man tries to connect his own performances with the righteousness of Jesus Christ for the pardon of his sins and the acceptance of his person as righteous in the sight of God, he deprives himself of all benefit from that perfect righteousness. If he relies on his own works of obedience for even the smallest part of his title to eternal life, “he is a debtor to do the whole law” in its covenant form, and he fixes himself under the dreadful curse of it. Christ will profit him nothing unless he relies on His infinitely glorious righteousness only for all his title to justification and eternal life. A sinner depends on the righteousness of Christ for justification to no good purpose if he does not rely on it only, and neither in whole nor in part on his own obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 127–28.</span></figcaption>

<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>

<blockquote><p>Would ye then obtain justification in Christ? You must previously possess Christ. But you cannot possess him without being made a partaker of his sanctification: for Christ cannot be divided. Since the Lord, therefore, does not grant us the enjoyment of these blessings without bestowing himself, he bestows both at once but never the one without the other. Thus it appears how true it is that we are justified not without, and yet not by works, since in the participation of Christ, by which we are justified, is contained not less sanctification than justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.16.1</span></figcaption>

<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified.

2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>

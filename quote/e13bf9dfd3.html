<main class="wrap"><figure class="quote" id="q-e13bf9dfd3" data-kw="">
<blockquote><p>Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship [WCF 1.6]; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections; the rending of the garments signified the rending of the heart by sorrow; standing with a religious suspect [respect] to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For ‘which of you’, says our Master, ‘having a servant ploughing, or feeding cattle, will say unto him by and by, when he is come from the field, Go and sit down to meat?’ (Lk. 17:7) All these signs have their significations from nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 85</span></figcaption>

</figure><figure class="quote" id="q-f4c9a982ea" data-kw="">
<blockquote><p>13. It [prayer] is likewise held forth by several expressions, pointing forth the posture and gesture of the body, such as ‘spreading forth of the hands’ (Ex. 9:29), ‘stretching out of the hands,’ (Job 11:13) ‘lifting up of the hands’ (Ex. 17:11; 1 Tim. 2:8; Ps. 28:2 and 63:4), ‘bowing the knee’ (Eph. 3:14), and ‘falling down’ (Dt. 9:18), mainly to point forth thereby the frame of the soul, and of the whole man, in prayer, to wit, that we should approach in humility, self-loathing, prostrating ourselves before the Lord, and in faith, earnestness, single dependence, hope, etc.</p></blockquote>

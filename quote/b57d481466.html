<main class="wrap"><figure class="quote" id="q-b57d481466" data-kw="">
<blockquote><p>Another issue concerned substantial forms. Here, Voetius and others defended a neo-Aristotelian concept because they found it to be more compatible with the Physica Mosaica [Mosaic physics] than early modern alternatives. The substantial forms could not only explain the classification of ‘kinds’ in the biblical creation account, but also constituted the internal principles of activity in secondary causes. In contrast, the Cartesian mechanistic worldview with its rejection of substantial form seemed to create more difficulties than it might solve. In particular, it implied a denial of genuine secondary causality, leading either to occasionalism or Spinozistic pantheism, as Voetius noted with remarkable foresight (Van Ruler 1995; Goudriaan 2006, 113-33; Beck 2007, 65-69).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-beck.html">Andreas Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘God, Creation &amp; Providence in Post-Reformation Reformed Theology’, p. 206 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

ormed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9258de8cc" data-kw="">
<blockquote><p>1. Concerning metaphysics to be produced by the Reformed, long before me the most learned men from all sides have thought much; and who, if even the least leisure had been theirs from their affair, would here easily have borne off the prize. [William] Twisse pities the fate of Christianity that until now the students of our [reformed] academies have used no other instructors but Jesuits: and they hope to be able to aspire to the arduous progress of things where it lies open by natural light by such masters. Yet who would have been more fit than him to undertake this labor for the sake of the theological youth? Who would have more suitably cleansed that Augean stable of the Jesuits; and thus through natural reason would have paved for us the royal way to the innermost parts of sacred theology? lest the enemies of the Orthodox religion through first philosophy, defiled and polluted by them, should make a straight attack on pure and sacred theology. But that most famous man has departed; and what others would have not undeservedly demanded from him, he in vain desired in others. Must therefore so great a work be put off to the coming of Elijah or of Christ the Savior? Not indeed. Provision must especially be made for those who will one day propose the mysteries of God to the people. Provision must be made as quickly as possible, lest like the Israelites the students be perpetually compelled to borrow arms from the Philistines, the enemies of divine truth. I designate the writings of the Jesuits, which certainly are not traversed safely enough by studious youth, because they prepare the way to Pelagianism, Skepticism, Libertinism and many other things.</p></blockquote>

<blockquote><p>his [Descartes’] warning… that the main questions about God and the soul’s distinction from the body are among those that should be demonstrated by philosophy rather than theology (Descartes, Meditations on First Philosophy in The Philosophical Writings of Descartes, vol. 2, tr. John Cottingham, et al., Cambridge Univ. Press, 1984, p. 3)… In the branch of philosophy called first philosophy or metaphysics, he accomplished little, only explaining and defending two questions about God’s existence and the soul’s distinction from the body. For apart from those questions belonging to pneumatics and natural theology, he was so caught up in explaining them and defending them against objections that he revealed too clearly his weakness in understanding and judging metaphysical formalities and abstractions. I will not even [describe] how he went about proposing such lofty and difficult philosophical ideas in a methodical, precise, clear, and evident way, or how he dealt with similar things and hypotheses taken or assumed without proof, or the non-principles on which he built his own ideas. Finally, there are the contradictions, confusions, and evasions he typically resorted to when attacked by opponents, like a man who has fallen into water grasping at anything.</p></blockquote>

<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Epistemological Metaphysics’</cite></span></figcaption>

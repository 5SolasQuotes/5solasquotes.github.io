<main class="wrap"><figure class="quote" id="q-542411a48a" data-kw="degrees">
<blockquote><p>Hence it appears that the question does not concern the equality of sins or gradual inequality, but their essential demerit. The question is not whether all sins are equal to each other (the paradox of the ancient Stoics and falsely charged upon us by our opponents). If all sins agree in being mortal, it does not follow that they are equal in all things because they can differ from each other as to degree of demerit, so as to deserve a greater or lesser punishment. Rather the question is only whether they are equally mortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a> › <a href="../topics/sin/degrees-of-sin/great-and-small.html">Great and small</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c7ba3e091" data-kw="">

</figure><figure class="quote" id="q-376e0c9c24" data-kw="">
<blockquote><p>These, whatsoever the Papists say to the contrary, as soon as ever they do but begin to heave and stir in our breasts, are truly sins; and do, in their measure, pollute and defile the soul: for the soul of man is like a clear mirror, upon which if you only breathe, you sully it, and leave a dimness upon it; so, truly, the very first breathings of an evil thought and desire in our souls, do sully their beauty, and dim their lustre, and render the image of God less conspicuous in them than it was before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, The Tenth Commandment</span></figcaption>

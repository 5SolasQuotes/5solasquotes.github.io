<main class="wrap"><figure class="quote" id="q-b4ae17b616" data-kw="Canon Church can err">
<blockquote><p>If then we grant that that church, which was the whole and sole church at that particular time, could have rejected canonical books, then it is evident that the church may err, which the papists will not be willing to allow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 1, ch. 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/reading-by-the-laity.html">Reading by the laity</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-3e0ab16df0" data-kw="Seat of infallibility">
<blockquote><p>They are not yet agreed among themselves on the seat of this infallibility, nor is it known as yet with whom it ought to be—with the pope or with a council. Some claim this privilege for a council, as is done by all those who believe the pope to be fallible and who on that account wish the council to be above him (as it was decreed in the councils of Constance and Basil and is constantly believed by the French church). Others ascribe it to the pope, as those who maintain that he is superior to a council (as the Council of Trent determined and with it the canonists and Scholastics).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/infallibility.html">Infallibility</a></span></div>

</figure><figure class="quote" id="q-7fe5a20427" data-kw="Church can err">
<blockquote><p>The purest churches under heaven are subject to mixture and error; and some have so degenerated as to become no churches of Christ, but synagogues of Satan; nevertheless Christ always has had, and ever shall have a kingdom in this world, to the end thereof, of such as believe in him, and make profession of his name.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The purest churches under heaven are subject to mixture and error; and some have so degenerated as to become no churches of Christ, but synagogues of Satan; nevertheless Christ always has had, and ever shall have a kingdom in this world, to the end thereof, of such as believe in him, and make profession of his name.”

</figure><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

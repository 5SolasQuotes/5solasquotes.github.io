<main class="wrap"><figure class="quote" id="q-941ab42d00" data-kw="">
<blockquote><p>Mr. Wotton in his papers which he dispersed in this city, and which he acknowledged to be his own when I [Walker] brought them to his face before Mr. Gataker and eight other grave ministers, does deny the imputation of the whole obedience of Christ, to the Law of God; both active and passive, both jointly and severally. He affirms that there is no end or use whatsoever of the imputation of Christ his righteousness for justification. He renounces the law in whole and part, performed by ourselves, or any other in our stead for our justification… he sets up faith, even the act of believing for righteousness, affirms that it is said to be imputed in a proper sense without a trope, and serves for all purposes in our justification under the Gospel, as perfect righteousness of works performed to the whole law did for man’s justification in the first covenant. He denies the punishment of our sins in Christ, and the satisfaction which in Him our head &amp; surety was made to God’s justice for purchase of our pardon… These and such like speeches I condemned for Socinian heresy and blasphemy, as Beza, Paraeus and Lubertus had done before me, and for this Mr. Gataker did deride me, when I gave in my charge against Mr. Wotton 27 years ago, and now [Gataker] blames it in me as falsehood and dishonesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Relation of the Chief Passages Between Mr. Anthony Wotton &amp; Mr. George Walker in the Years 1611-1615, Written by George Walker for the Vindicating of Himself from Some Imputations Laid on Him by Mr. Thomas Gataker in his Defense of Mr. Wotton (1642) 36 pp.</cite>, pp. 1-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c88e043db4" data-kw="">
<blockquote><p>It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>

</figure><figure class="quote" id="q-db353f1eb7" data-kw="">
<blockquote><p>Proposition 15. We are justified: [1.] in Christ virtually, as in the public head, when He rose again and was justified in the Spirit. 2. In Christ, as his merits are the cause of our justification.</p></blockquote>

</figure><figure class="quote" id="q-e2f2c4ad9c" data-kw="">
<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified. 2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>

</figure><figure class="quote" id="q-31ccf53a7e" data-kw="">
<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

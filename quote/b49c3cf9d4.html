<main class="wrap"><figure class="quote" id="q-b49c3cf9d4" data-kw="">
<blockquote><p>“It is God that justifieth;” and, therefore, the continuation of our justification is his act also. And this, on his part, depends on the immutability of his counsel; the unchangeableness of the everlasting covenant, which is “ordered in all things, and sure;” the faithfulness of his promises; the efficacy of his grace; his complacency in the propitiation of Christ; with the power of his intercession, and the irrevocable grant of the Holy Ghost unto them that do believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-as-a-one-time-act.html">Justification as a one-time act</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9345adddab" data-kw="">
<blockquote><p>Through Him, who—because he died—there is for us NO CONDEMNATION from Divine justice—and through Him, who—because he lives, there is for US NO SEPARATION from Divine love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No Condemnation in Christ Jesus</cite>, “No Separation from Christ Jesus”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/fruits-of-justification.html">Fruits of Justification</a> › <a href="../topics/justification/fruits-of-justification/freedom-from-condemnation.html">Freedom from condemnation</a></span><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span></div>
<div class="actions"><button class="copy" data-copy="“Through Him, who—because he died—there is for us NO CONDEMNATION from Divine justice—and through Him, who—because he lives, there is for US NO SEPARATION from Divine love.”

— Octavius Winslow, No Condemnation in Christ Jesus, “No Separation from Christ Jesus”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThrough+Him%2C+who%E2%80%94because+he+died%E2%80%94there+is+for+us+NO+CONDEMNATION+from+Divine+justice%E2%80%94and+through+Him%2C+who%E2%80%94because+he+lives%2C+there+is+for+US+NO+SEPARATION+from+Divine+love.%E2%80%9D%0A%0A%E2%80%94+Octavius+Winslow%2C+No+Condemnation+in+Christ+Jesus%2C+%E2%80%9CNo+Separation+from+Christ+Jesus%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9345adddab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9345adddab.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-9964da864b" data-kw="">
<blockquote><p>And this life is by faith in Christ, as “he loved us, and gave himself for us;” that is, as he was a propitiation for our sins. This, then, is the only way, means, and cause, on our part, of the preservation of this life, of the continuance of our justification; and herein are we “kept by the power of God through faith unto salvation.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a> › <a href="../topics/perseverance-of-the-saints/grounds-of-perseverance/the-spirits-indwelling.html">The Spirit&#x27;s indwelling</a></span></div>
<div class="actions"><button class="copy" data-copy="“And this life is by faith in Christ, as “he loved us, and gave himself for us;” that is, as he was a propitiation for our sins. This, then, is the only way, means, and cause, on our part, of the preservation of this life, of the continuance of our justification; and herein are we “kept by the power of God through faith unto salvation.””

— John Owen, The Doctrine of Justification by Faith, ch. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd%20this%20life%20is%20by%20faith%20in%20Christ%2C%20as%20%E2%80%9Che%20loved%20us%2C%20and%20gave%20himself%20for%20us%3B%E2%80%9D%20that%20is%2C%20as%20he%20was%20a%20propitiation%20for%20our%20sins.%20This%2C%20then%2C%20is%20the%20only%20way%2C%20means%2C%20and%20cause%2C%20on%20our%20part%2C%20of%20the%20preservation%20of%20this%20life%2C%20of%20the%20continuance%20of%20our%20justification%3B%20and%20herein%20are%20we%20%E2%80%9Ckept%20by%20the%20power%20of%20God%20through%20faith%20unto%20salvation.%E2%80%9D%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20The%20Doctrine%20of%20Justification%20by%20Faith%2C%20ch.%205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9964da864b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9964da864b.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/just/just.ix.html" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-69d8e13fee" data-kw="">
<blockquote><p>But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, — that is, the pardon of our sins and acceptance with God, — we say it is faith alone; for “The just shall live by faith,” Rom. i. 17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/sola-fide.html">Sola fide</a></span></div>
<div class="actions"><button class="copy" data-copy="“But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, — that is, the pardon of our sins and acceptance with God, — we say it is faith alone; for “The just shall live by faith,” Rom. i. 17.”

— John Owen, The Doctrine of Justification by Faith, ch. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%20if%20it%20be%20inquired%20what%20it%20is%20whereby%20we%20immediately%20concur%20in%20a%20way%20of%20duty%20unto%20the%20continuation%20of%20our%20justified%20estate%2C%20%E2%80%94%20that%20is%2C%20the%20pardon%20of%20our%20sins%20and%20acceptance%20with%20God%2C%20%E2%80%94%20we%20say%20it%20is%20faith%20alone%3B%20for%20%E2%80%9CThe%20just%20shall%20live%20by%20faith%2C%E2%80%9D%20Rom.%20i.%2017.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20The%20Doctrine%20of%20Justification%20by%20Faith%2C%20ch.%205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69d8e13fee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69d8e13fee.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/just/just.ix.html" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-a52597727f" data-kw="">
<blockquote><p>For my part I cannot understand that the continuation of our justification has any other dependencies than has our justification itself. As faith alone is required unto the one, so faith alone is required unto the other, although its operations and effects in the discharge of its duty and office in justification, and the continuation of it, are diverse; nor can it otherwise be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

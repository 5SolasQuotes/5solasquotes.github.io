<main class="wrap"><figure class="quote" id="q-61738ba6be" data-kw="">
<blockquote><p>The Third Head, Touching the Abolishing of Idolatry

As we require Christ Jesus to be truly preached, and his holy Sacraments to be rightly ministered; so can we not cease to require Idolatry, with all monuments and places of the same, as Abbeys, monkeries, friaries, nuneries, chapels, chantries, cathedral kirks, channounreis, colleges, others then presently are parish Kirks or Schools, to be utterly suppressed in all bounds and places of this Realm (except only the Palaces, mansions, and dwelling places adjacent thereto, with orchards and yards of the same): As also that Idolatrie may be removed from the presence of all persons of what estate or condition that ever there be, within this Realm.

For that your Honours be assuredly persuaded, that where Idolatry is maintained or permitted where it may be suppressed, that there shall God’s wrath reign, not only upon the blind and obstinant idolater, but also upon the negligent sufferers [of the same;] especially if God have armed their hands with power to suppress such abominations.

By Idolatry we understand, the Mass, Invocation of Saints, Adoration of Images, and the keeping and renting of the same: and finally all honouring of God, not contained in his holy Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 188-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-4591854bf6" data-kw="">
<blockquote><p>If I have observed the sun when it shines, or the moon moving in brightness, so that my heart has been secretly enticed, and my mouth has kissed my hand; this also would be an iniquity deserving of judgment, for I would have denied God who is above. (Job 31:26-8)

26, and 27 Let me be accursed, if beholding the glittering face of the Sun, or looking upon the Moon shining in her brightness, I have, being deceived, so much as privily in my heart, much less openly, consented unto idolaters, and after the manner of their superstitious custom, by moving, and putting my hand to my mouth, yielded any worship unto those bodies. 28 For this is a most heinous sin, as by which I had flatly denied that God, who is above the sun and the very stars them selves, and therefore deserved most horrible and fearful punishments.</p></blockquote>

</figure><figure class="quote" id="q-3a80add179" data-kw="">
<blockquote><p>We acknowledge the scriptures of God contained in the Old and New Testament to contain the whole doctrine of faith and good manners, our Covenant rejects all traditions contrary, without and beside the word of God, and so it rejects all religious observances, all human ceremonies, all religious symbolical signs, all new means of worshipping God, all images, positive rites which have any influence in God’s worship as will-worship, and impious additions to God’s word, Jer. 7:7; 2 Sam. 7:7; Deut. 12:32; Deut. 4:2; Lev. 10:2; Heb. 1:13; Heb. 7:14; 1 Chron. 15:13; 1 Kings 12:32; Matt 15:14; Rev. 22:18, whereas they lack warrant from God’s word. All actions of divine worship, all religious means of worship, all actions of moral conversation must be warranted by, according as it is written…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1af501b990" data-kw="">
<blockquote><p>2. As we desire not presbyterial government to be reproached for such judging, so neither are prelatical acts of synods for debarring from the holy ministry men of an holy and unblameable conversation, and for the grace of God in them, and their knowledge and utterance, able and fit to preach the Gospel, upon this account, because they are unpeaceable and hold up debates, that is, because they will not be satisfied with the public resolutions for taking into places in the Church, Parliament, Army, Committee of Estates, all the malignant party in the land, or will not promise silence in their matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658) | Epistle to the Reader</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-834e490251" data-kw="">
<blockquote><p>Hamilton seems to have felt that the tyranny of the times called for more positive action on the part of those who adhered to the [non-conforming, field-preaching] Presbyterian cause, and he is said to have tried, during the summer of 1678, to stir up some of the people in the west into an armed rising against the government [previously the battles had all been defensive]. Whether this allegation is well-founded cannot conclusively be proved… Feelings on the subject [of the Indulgence] ran high, and Cameron and Hamilton were accused of spreading dissension and disunity among the people and of causing disaffection towards ministers who did not share their radical opinions.</p></blockquote>

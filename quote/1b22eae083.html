<blockquote><p>The nations are under obligation to diffuse abroad the religion of Jesus, by providing for an education of youth founded upon its principles, and co-operating with the church of God in extending the kingdom of Christ. Their wisdom should be tasked in devising and arranging means; their authority exercised in giving them sanction; and their resources expended in giving them support. The rulers of nations should be friendly to Christianity, and endeavour by every means suited to its genius, and with assiduous parental care, to rear this tender celestial plant. This will give dignity to their thrones, stability and energy to their government, and diffuse peace and felicity among their people, and will prove efficiently conservative of all that is good; for literature, arts, science, refinement, and wealth, apart from religion, afford no security against national corruption and ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-symington.html">Andrew Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The headship of Christ over the nations. Being no. vi of a course of lectures on the Second Reformation</cite>, (Paisley, 1841), p. 21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Yet it is still a greater wonder to me, why they compel a man to remain unmarried after being separated from his wife by divorce, and why they will not permit him to remarry. For if Christ permits divorce on the ground of unchastity and compels no one to remain unmarried, and if Paul would rather have us marry than burn [I Cor. 7:9], then he certainly seems to permit a man to marry another woman in the place of the one who has been put away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Babylonian Captivity of the Church</cite>, (1520) in Luther’s Works, trans. A. T. Steinhauser, ed. A. R. Wentz (55 vols, Philadelphia, 1959), xxxvi, 105-06.</span></figcaption>

</figure><figure class="quote" id="q-7ac7d44bca" data-kw="">
<blockquote><p>This extract from Thomas Houston is relevant to much of the raving fanaticism surrounding debates about health-care in the United States. On the one hand, it condemns the liberals who want to provide health-care for the poor, but who say nothing against and even actively promote the murder of the unborn. Conversely, it condemns the conservatives who prefer a few lousy tax-dollars to the lives and well-being of other people. They even take this to the point of condoning the iniquitous health-insurance industry, which allows greedy men to oppress others in a lust for profit. (I am not saying that taxes should not eventually be lower, but they should be reduced via abolishing standing armies and other state-funded evil. Another practical step would be to ensure that people are receiving just wages, so that they can fairly contribute to the common good. Moreover, the best way to ultimately reduce the tax-rate is for the nation to observe the first table of the law. This will result in increased prosperity, so that social services can be provided at much lower expense than at present. Ultimately, however, the plans of the liberals and conservatives will be brought to nothing, as they are both at enmity with Christ. See Deuteronomy 28, Psalm 2.) Neither the liberal or conservative viewpoints bears any resemblance to our Reformed orthodoxy. Instead, Dr Houston sets forth a more biblical and compassionate viewpoint:

Christians are everywhere awakening to a consciousness that the spirit of our holy religion is eminently practical, and that it has yet to reap some of its noblest triumphs, in removing the evils, moral and physical, that afflict the population of Christian countries, and banishing all that is inhuman from the earth. The value of human life is felt and acknowledged, wherever pure and undefiled religion prevails, and all proper means, often at great expense, are employed to defend and preserve it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The races: the evils connected with horse-racing and the steeple-chase and their demoralizing effects</cite>, (1853) in Works doctrinal and practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh, 1876), iv, 370.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help to True Happiness</cite>, (London, 1618), pt. 1, question 3, p. 24</span></figcaption>

<blockquote><p>And hereunto divines and casuists give their concurrence; among them one that is resolute both for monarchy and lineal succession [of royalty], thus expresses his judgment, both for seeking of right and justice from a usurper (whom he calls a tyrant, in regard of an unjust title, not in respect of tyranical oppression [only]) and for obeying his commands. First, that subjects may lawfully seek justice of him…¹ ¹ ‘Dicendum est, licite subditos ab eo (qui•y rannus jure et titulo est) jus petere, quia quamvis jus et titulum non habeat, respublica tamen tacite consemit in hoc ut civibus ipsi tyranno, facto, non jure subditis, jus dicat, ac si esset competens judex et legitimus superior’… Juan Azor, Moral Institutions [d. 1603; Hierat, 1608], pt. 2, bk. 11, ch. 5 [col. 1675]. ‘Non peceat subditus tyranni, qui dominium et jurisdictionem alicujus di•ionis usurpavit, petendo ab eo justitiae administrationem, etc. Si quidem dat operem ut qui pe••at jurisdictionem usurpando, non peccet etiam justitiae administrationem praetermittendo;’ Martin de Azpilcueta Navarro, Manual de Confessores [c. 1557], ch. 1•, n. 41.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-347ef5d07d" data-kw="">
<blockquote><p>Love of necessity involves feeling, and if there be no feeling in God, there can be no love. That He produces happiness is no proof of love. The earth does that unconsciously and without design. … He may be cold, insensible, indifferent, or even unconscious; He ceases to be God in the sense of the Bible, and in the sense in which we need a God, unless He can love as well as know and act. … We must adhere to the truth in its Scriptural form, or we lose it altogether. We must believe that God is love in the sense in which that word comes home to every human heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 5, § 13, “The Goodness of God” (“Love”)</span></figcaption>

</figure><figure class="quote" id="q-a376ed379c" data-kw="">
<blockquote><p>If you are troubled about the Father&#x27;s love, understand that you can no more trouble and burden him than by your unkindness in not believing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion with God</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“If you are troubled about the Father&#x27;s love, understand that you can no more trouble and burden him than by your unkindness in not believing it.”

— John Owen, Communion with God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+you+are+troubled+about+the+Father%27s+love%2C+understand+that+you+can+no+more+trouble+and+burden+him+than+by+your+unkindness+in+not+believing+it.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Communion+with+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa376ed379c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a376ed379c.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/communion" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

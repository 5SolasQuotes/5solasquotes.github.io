<main class="wrap"><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665; 2024) at Translationes Lyncei</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-23cb3ef646" data-kw="">
<blockquote><p>A guiding presupposition [of Matthew Barrett’s The Reformation as Renewal] is that the intellectual life of the second half of the thirteenth century was ‘characterized by a Thomistic atmosphere’ and that the later medieval theologians progressively fell away from the classical positions affirmed by Aquinas. Indeed, according to Barrett it was this degeneration away from Thomism in the later middle ages that was a significant catalyst for the Reformation. As soon as this presupposition is outlined, however, it is possible to see that Barrett’s account has, at the very best, an outdated view of later medieval thought. This kind of ‘decline’ narrative has not been maintained by experts in the thought of the period for many years, despite its persistence among historians whose direct acquaintance with scholastic texts ends with the death of Aquinas. The reason is that, outside the Dominican order (and, for that matter, inside it too at least until the middle of the fifteenth century), there never was a ‘Thomistic atmosphere.’ Why it was ever believed that there was one is not clear to me. But it is true to say that we do not pervasively find the kind of narrative Barrett reproduces until after Leo XIII’s Aeterni patris of 1879, and it is hard to avoid the conclusion that this encyclical itself had something to do with bringing about the anachronistic centering of Aquinas in our medieval intellectual history. This was no doubt an unintended consequence of Leo’s action, since it is clear enough that Leo’s motivation had to do with an appraisal of Aquinas’s intellectual weight, not of his influence on later medieval theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Accidental Reformation?’ in Hanover Review</cite>, 3.1 (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1 | ch. 7, ‘That the truth of reason is not in opposition to the truth of the Christian faith’</span></figcaption>

<blockquote><p>…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, ch. 11, ‘The Form of the Body’ in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pp. 493-523 See especially, ‘Hylemorphic Dualism’, pp. 505-10., p. 508</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

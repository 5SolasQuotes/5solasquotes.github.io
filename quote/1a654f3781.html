<main class="wrap"><figure class="quote" id="q-1a654f3781" data-kw="">
<blockquote><p>We thought it meet to subjoin the full proof of every word from the Scripture, that it might be past controversy with all believers… I think scarce two syllables can be found that are not expressly in the words of Scripture, which contain any matter that is liable to controversy.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d87f1f662" data-kw="">
<blockquote><p>The student of Christian doctrine, because he strives after exactness of phrase, because he is conscious of the inadequacy of any one human formula to exhaust the truth, will be filled with sympathy for every genuine endeavour towards the embodiment of right opinion. Partial views attract and exist in virtue of the fragment of truth—be it great or small—which they include; and it is the work of the theologian to seize this no less than to detect the first spring of error. It is easier and, in one sense, it is more impressive to make a peremptory and exclusive statement, and to refuse to allow any place beside it to divergent expositions; but this show of clearness and power is dearly purchased at the cost of the ennobling conviction that the whole truth is far greater than our individual minds. He who believes that every judgement on the highest matters different from his own is simply a heresy must have a mean idea of the faith; and while the qualifications, the reserve, the lingering sympathies of the real student make him in many cases a poor controversialist, it may be said that a mere controversialist cannot be a real theologian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-f-westcott.html">B.F. Westcott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lessons from Work</cite>, pp. 84–85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-af7c1eb3c4" data-kw="">
<blockquote><p>Do not all divines say, There are some things in Scripture wherein the elephant may swim, some things where the lamb may wade? Matters of discipline are acknowledged by all not to be revealed with such clearness but that truly conscientious, upright, diligent men may not be able in many things to see the mind of Christ in them. And to what end has Christ done this think you?</p></blockquote>

</figure><figure class="quote" id="q-cbc91cf570" data-kw="">
<blockquote><p>1. What is schism from the Church of England? Sure it is not a denying its doctrine, or holding anything contrary thereunto; he that holds perversum Dogma [a perverse dogma] only, is an heretic, no schismatic, as St. Jerome teaches (on Titus 3). Mr. [Matthew] Newcomen, a learned presbyterian, as I observed in my last, lets the Separatists know that their agreeing with us and the Reformed Churches in doctrines that are fundamental, their holding one Head and one Faith, does not excuse them from being guilty of breach of unity, so long as they hold not one Body, one baptism. For he cites Beza, another learned presbyterian (Annotations on 1 Cor. 1:10). So that you may be willing to subscribe to the 39 Articles, and yet be schismatics from the Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-fullwood.html">Francis Fullwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Schism Fully Opened &amp; Applied to Gathered Churches</cite>, ... (London: 1672), ch. 8, pp. 44-45</span></figcaption>

</figure><figure class="quote" id="q-55acd10433" data-kw="">
<blockquote><p>I will not say but sometimes it may be meet to discover the least error, and it may be by circumstances so aggreged that it may be needful judicially to take notice of it, as when it’s involved with offence and ready to breed schism or scandal, or in such like cases (in which respect there are some things mentioned in the decree, Acts 15, which are not very material in themselves, as the eating of things strangled) yet, we say, it is not simply and always necessary for ministers to press at the convincing of all who maintain something different from truth, or which is supposed to be so by them, if it be of things extra-fundamental, or, which have not direct or palpable influence upon the violating of faith, or corrupting of manners, much less to censure for the maintaining of it. For, it is not of such that these epistles speak: and we see, Rom. 14, and in the epistles to the Corinthians, in the debate about meats and eating of things sacrificed to idols, and such like, wherein though there was still a right side and a wrong, yet does he rather press the forbearing of these debates, than the dipping into them, not astricting men always to follow this or that, providing it be done without breach of unity and charity. Hence it is that although there be somethings he will give no forbearance unto, but authoritatively and ministerially he decides in them, yet in the same epistles there is something amongst the saints that he seeks rather to heal, and to obtain mutual forbearance in, than peremptorily to decide. See Rom. 14:1; Cor. 8:2-3, etc.; Phil. 2:3. … …there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, (1659), ch. 8, ‘When Some Errors are to be Foreborn’, pp. 202-3 &amp; 205-206</span></figcaption>

ot+to+be+forborne%2C+and+this+also+may+be+at+one+time%2C+and+in+one+Church+more+necessary+to+be+adverted+to+than+in+another%2C+because+consequents+of+schism%2C+faction%2C+division%2C+etc.+may+sometimes+follow+on+the+meanest+%5Bthe+least%5D+errors.+And+seeing+these+are+always+enemies+to+edification%2C+even+when+they+arise+from+the+least+ground%2C+they+are+never+absolutely+to+be+foreborne%3B+for+to+say%2C+I+am+of+Paul%2C+and+I+am+of+Apollos%2C+and+for+one+to+think+such+a+man+a+better+preacher+than+another%2C+seems+to+be+no+great+matter%3B+yet+when+it+begins+to+rent+%5Btear%5D+them%2C+and+to+make+factions+in+Corinth%2C+it+is+not+to+be+forborne%2C+but+to+be+reproved%3A+And+in+the+former+difference+of+meats%2C+the+apostle+condemns+always+the+offence+and+schism+that+followed+on+it%2C+although+he+did+not+peremptorily+decide+anything+as+to+men%E2%80%99s+practices%2C+or+censure+for+the+opinion+itself%E2%80%A6+Thus+the+differences+and+errors+concerning+Church-government+by+bishops%2C+and+in+the+Congregational+way%2C+may%2C+we+conceive%2C+in+themselves+be+forborne+in+persons+where+they+are+not+vented+to+the+shaking+and+drawing+away+of+others%3B+but+if+pressed+in+practice%2C+to+the+renting+of+a+Church%2C+and+preferred+or+equalled+to+the+true+government+that+is+established+by+the+Word%2C+in+that+case+they+are+not+to+be+foreborn%2C+because+then+truth+is+to+be+vindicated%2C+and+obstructions+to+edification+in+the+renting+or+distracting+of+a+Church+to+be+removed%2C+and+at+one+time+more+than+at+another%2C+as+such+an+offence+does+waken+a+schism%2C+and+disturb+order+and+union+in+one+Church+or+at+one+time+more+than+another%3A+hence+we+see%2C+Acts+15%2C+some+things+are+put+in+that+decree+in+reference+to+that+time%2C+only+for+preventing+of+schism+and+scandal%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+Treatise+on+Scandal+%281659%29%2C+ch.+8%2C+%E2%80%98When+Some+Errors+are+to+be+Foreborn%E2%80%99%2C+pp.+202-3+%26+205-206&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55acd10433.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55acd10433.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=I%20will%20not%20say%20but%20sometimes,for%20preventing%20of%20schism%20and%20scandal&amp;text=I%20will%20not%20say%20but%20sometimes%20it%20may&amp;text=time%2C%20only%20for%20preventing%20of%20schism%20and%20scandal" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

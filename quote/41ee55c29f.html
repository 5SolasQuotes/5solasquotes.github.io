</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3472fb0e3b" data-kw="">
<blockquote><p>When Thomas Cranmer drew up his Articles of Religion in 1553, there were Forty-Two of them, not the eventual Thirty-Nine, and its final two articles condemned those who sought to restore the doctrines of millennialism and universal restoration. However, when the Articles were revised, they were omitted for reasons not entirely clear. As a result, there is nothing in the Articles of Religion that requires a belief in eternal conscious torment without the hope of repentance, which is something that later universalists would come to point out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

</figure><figure class="quote" id="q-a5de33dcb5" data-kw="">
<blockquote><p>While belief in annihilationism was rare before the nineteenth century, it eventually rose exceedingly, although it was still less common than universalism… the fact that universalism was a popular belief among educated Victorians in general… In a world without lawful torture, constant public executions, and severed heads on display across London Bridge, people began to question the portrayals of hell as an eternal torture-chamber that were ubiquitous in the Middle Ages. Thus, there were dozens of universalist Anglican thinkers in this period…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

</figure><figure class="quote" id="q-2d36567035" data-kw="">
<blockquote><p>VII… Now, there are three principal opinions of the theologians. Some think, that Christ by His soul properly descended into hell, that is, the place of the damned: either so that He might there undergo hellish sufferings, or so that He might inaugurate His triumph over defeated death. We repudiate this opinion… IX. Others say, that by the descent of Christ into hell nothing else is signified than the grave… X. Most of the Orthodox, by the descent of Christ into hell, understand His infernal anguish and sufferings, which Christ felt in His soul. In this opinion we also acquiesce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Parts of Christ’s Office, pt. 2 in Christian Theology 3rd ed. (1634)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

</figure><figure class="quote" id="q-598435c150" data-kw="">
<blockquote><p>As for annihilationism, the first Anglican cleric to publicly show an openness to the idea was none other than the illustrious Bishop Jeremy Taylor. In his sermon ‘Christ’s Advent to Judgment,’… Taylor explains at some length that church fathers like Justin Martyr and Irenaeus believed that God would eventually annihilate the damned, since immortality is not intrinsic to human nature… Taylor… cannot bring himself to be certain of annihilationism. He settles only for its possibility… No controversy or backlash ever followed Bishop Taylor’s questioning of eternal conscious torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>

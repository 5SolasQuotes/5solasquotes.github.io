<blockquote><p>2. Touching the second difference, which is their vocation or calling, we must note that there is a twofold calling, vel [either]

1. Inefficaciter, formally, or effectually[?]. 2. efficaciter, formally, or effectually. The 1. is outwardly: the 2. is inwardly. The 1. general: the 2. special. Of the first, our Savior says ‘Many are called, but few are chosen.’ (Mt.) Of the second, the apostle says, ‘whom He has predestinated, them He calls,’ (Rom. 8) i.e. effectually. Now touching the outward calling, we must note that as many are called, so He calls them many ways, especially:

1. By the painful preaching of his Word.

2. By the manifold benefits of his grace.

3. By the manifest judgments of his anger. De [concerning]

1. God gave his Word, and great were the number of the preachers (God calls us diverse ways. Ps. 68:11), and He commanded them to preach unto all nations; and so their sound went unto all lands, to all countries, to all places, but especially to this place, where there are painful men, learned men that do often preach and continually call; and yet I fear their preaching is unrespected, I am sure themselves are unregarded… … …

2. God seeks to draw men unto Him in the chains of love, when He gives unto them, beneficia nimis copiosa multa, et magna, et privata, et positiva, many and great blessings, thereby to allure them unto his service.

3. If men will not turn, nor answer to the first and second call, then will He whet his glittering sword and his hand shall take hold of vengeance, He will pour out the vial of his wrath, thereby to convert them or confound them: and no marvel, for debet amor laesus irasci, love too much provoked must wax angry. All these ways has God called us: the preachers cried, and do cry and call continually, his blessings have been manifold and his judgments have been manifested in some measure upon our nation. O then let us take heed unto ourselves and not harden our hearts any longer, but let us hearken unto his voice, lest He swear in his wrath that we shall not enter into his rest. But indeed all these kinds of outward callings are but in vain, and bring no benefit unless the Lord calls us inwardly by his Spirit, for:

1. Nisi spiritus adsit cordi audientis, inanis est labor docentis (‘In vain is all outward calling, unless we be inwardly called by God’s Spirit.’ Gregory, Homily 30, Super Evangel.): In vain do we preach unto your ears, unless the Spirit of God does open your hearts, as He did the heart of Lydia, that you may believe our preaching, as she did the preaching of Paul.

2. All the blessings of the world will but puff us up with pride (as they did the Israelites, as Moses shows, dilectus meus impinguatus calcitrauit, my beloved, fatted and enlarged, spurned with his heels) unless God does give us the grace to use those blessings to the glory of his name.

3. All punishments and all judgments will sooner work desperation than conversion in a sinful soul, unless the grace of God work true humility in us, to make a right use of his fatherly chastisements. And this experience daily shows: First, the Word is preached, the one believes, the other refuses it. Secondly, God bestows his blessings upon men, the one is puffed up with pride, the other is truly thankful. Thirdly, God sends his judgments, the one grows desperate with Saul, the other is humbled with David. And what is the cause of this? to the one sort, He sends his messengers only to call them outwardly, to the other sort He sends his Spirit and gives his grace to make them yield unto his calling: and this effectual calling of the saints to believe the Gospel and to obey the voice of God is the effect and fruit of the love of God. Whensoever therefore we be outwardly called by what way or means soever it be, let us presently pray to God that He would inwardly work in our hearts to incline them to yield unto his calling, else will the outward calling bring no benefit, but only make us without excuse. And so much of their vocation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints</cite>, … (London: Butter, 1622), pt. 1, pp. 85-90 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</span></figcaption>

<blockquote><p>Use 2. Yet let their carelessness make us the more careful… Let us when we look up to God that calls us, remember his greatness. Let us, when we look downward to the misery out of which He has called us, remember the depth of it. Let us when we look forward to the honor unto which He has called us, ponder upon the height of it. Let us when we look backward upon the means whereby He has called us, consider the ineffectualness of them upon others. So shall we find the total sum to be this, That the highest God has called us out of the lowest degree of misery to the greatest step of glory out of his own grace and free mercy.</p></blockquote>

<blockquote><p>Q. 1. What makes the difference between effectual and ineffectual calling? A. Ineffectual calling is when men have nothing but the external sound of the Gospel. Mt. 20:16, ‘For many be called, and few chosen.’ Effectual is, when the Spirit works in conjunction with the Word. Jn. 6:45: ‘It is written in the prophets, ‘And they shall be all taught of God;’ every man therefore that has heard, and has learned of the Father, comes unto Me.’ … Q. 11. What is the third instruction? A. It is dangerous to refuse God’s call. Prov. 1:24, ‘Because I have called, and ye refused; I have stretched out my hand and no man regarded.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the</cite>, [Westminster] Assembly’s Catechism... (London: Cockerill, 1682), ‘Of Effectual Calling’, pp. 67-68</span></figcaption>

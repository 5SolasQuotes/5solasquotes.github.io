<main class="wrap"><figure class="quote" id="q-46682f7824" data-kw="">
<blockquote><p>The forme of Creation, to wit, of that which is primary, is both that hidden force of divine power, put into that first matter, according to the being and conditions of the same: as also the external, immediate and instant bringing forth of the matter &amp; the state thereof, without shape and order: But, of that which is secondary, the form internal is that common and hidden nature of the whole frame, which God has imprinted into all things after a common mean and manner: but the external, whereof speech is here, is that powerful bringing forth of all things, out of the first matter in the beginning of time, by the space of six days; as also the most godly disposing of the same, both in themselues and among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, (London, 1610), bk. 2, ch. 3, Of Creation, Confirming Part, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1cf24ff127" data-kw="">
<blockquote><p>Now God is creator alone, acknowledging no associates in this work, Isa. 44:24; Job 9:8. The reason for this is that creation is a work of infinite Divine power, Jer. 32:17, which, as He alone possesses, so He alone also can create—so that Jeremiah rightly pronounces, Jer. 10:10-12: ‘Those gods who have not made the heavens and the earth shall perish from the earth. But Jehovah is the true God, the living God, and everlasting King, who made the earth by His power,’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

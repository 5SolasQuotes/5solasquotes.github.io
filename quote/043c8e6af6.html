<main class="wrap"><figure class="quote" id="q-043c8e6af6" data-kw="">
<blockquote><p>And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-490092e261" data-kw="">
<blockquote><p>3. Faith is the instrumental cause of our sanctification; so that where it is not, no holiness can be wrought in us. “God purifieth our hearts by faith,” Acts 15:9, and not otherwise; and where the heart is not purified, there is no holiness. All the duties in the world will not denominate him holy whose heart is not purified; nor will any such duties be holy themselves, seeing unto the unclean all things are unclean. All the obedience that is accepted with God is the “obedience of faith,” Rom. 1:5; thence it springs, and therewith is it animated. So is it expressed, 1 Pet. 1:20–22, “You who by Christ do believe in God, and have purified your souls in obeying the truth through the Spirit.” It is from faith in God through Jesus Christ, acting itself in obedience unto the gospel, that we purify or cleanse our souls; which is our sanctification. See Col. 2:12–14, 3:7–11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen, ed. William H. Goold, vol. 3 (Edinburgh: T&amp;T Clark, n.d.), 414.</cite></span></figcaption>

</figure><figure class="quote" id="q-6ceaa3133c" data-kw="">
<blockquote><p>Objection: These gracious effects and fruits of singing Psalms, do plead as much for singing and playing with instruments, as for singing with voices. Answer 1: This last effect of singing to the glory of God with our glory is peculiar only to singing with our tongues. Answer 2: Suppose it were true that these effects of singing Psalms did plead as much for singing and playing with instruments, as singing with voices; yet evident it is that singing with voices had the preeminence, as that which uttering the Word of God did chiefly utter the Spirit of God breathing in it. And withal evident likewise it is that it is no impeachment to an ordinance that the outward dispensing of it may be performed by Nature and Art; but notwithstanding that it may be accompanied of God with a spiritual blessing. Answer 3: Singing with instruments was typical, and so a ceremonial worship and therefore is ceased. But singing with heart and voice is a moral worship such as it written in the hearts of all men by Nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, p. 5</span></figcaption>

</figure><figure class="quote" id="q-93ef3f1441" data-kw="">
<blockquote><p>XVII. We introduce singing as part of divine worship in accordance with Holy Scripture as doctrine and encouragement (1 Cor. 14:26):12 teaching and exhorting one another with psalms, hymns, and spiritual songs (Eph. 5:19); Col 3:16). But let them be sung in a language that is understood, for by the testimony of the apostle those that teach and sing in the assembly without being understood act foolishly and do harm, [as] they that bawl in an unknown language in the presence of idiots and barbarians. The Apostles’ Creed, prayers, or angelic songs and antiphons can be sung in devout fashion. The musical instruments, however, adopted for the pantomime (saltatrici) Mass of Antichrist,2 together with images, we abhor. There is no use for them in the church, and indeed they are marks and occasions of idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-reformed-churches.html">Hungarian Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Debrecen Synod (1567) in Reformed Confessions of the 16th and 17th Centuries in English Translation, ed. James T. Dennison, Jr., 4 vol. (Grand Rapids: Reformation Heritage Books), 3.111.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-112e47dff1" data-kw="">
<blockquote><p>I would to God that every [so-called] Holy-day whatsoever beside the Lord’s Day, were abolished. That zeal which brought them in, was without all warrant of the Word, and merely followed corrupt reason, forsooth to drive out the Holy days of the Pagans, as one nail drives out another. Those Holy days, have been so tainted with superstition that I wonder we tremble not at their very names.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Matt 12, quoted by William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship, p. 360. This quote was compiled by Andrew Myers.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>§46. 6. And as for holy days, there is great difference between them: Those are liable to most question that are obtruded on the Church with the greatest confidence. As for such days as are appointed upon some emergent occasions that arose since Scripture was indited, and are not common to all times and places of the Church, there is no more question whether the magistrate may command them, or the pastors agree upon them, than whether a lecture-day, or fast-day, or thanksgiving-day may be commanded or agreed on: some time for God’s worship besides the Lord’s Day must be appointed: And God having not told us which, the magistrate may, on fit occasions. And this is no derogation from the sufficiency of Scripture: For the occasion of the day was not existent when the Scripture was written: such occasions are various according to the various state of the Church in several ages and countries. And therefore to keep an anniversary day of thanksgiving, such as we keep on the fifth of November for our deliverance from the Papists’ powder plot, is no more questionable than to keep a lecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 412</span></figcaption>

<blockquote><p>…consider, that this [second] command [of the 10 Commandments] is… broken… When something is added to his service, which He has not commanded; and this is superstition and will-worship largely so taken. Of this kind are… [6] More holy days than God has instituted… Again, this command is practically broken… When worship or service under the gospel… is without a divine warrant tied to such a time only; as Christmas (commonly called Yule), Easter, Pasch [Passover], etc. which is an observing of times that God has not appointed. [Gal. 4:9-11]</p></blockquote>

<blockquote><p>This one thing, however, we can scarcely refrain from mentioning, with regard to what is written in the 24th chapter of the aforesaid [Second Helvetic] Confession [of 1566] concerning the ‘festival of our Lord’s nativity, circumcision, passion, resurrection, ascension, and sending of the Holy Ghost upon his disciples,’ that these festivals at the present time obtain no place among us; for we dare not religiously celebrate any other feast-day than what the divine oracles have prescribed. Everything else, as we have said, we teach, approve, and most willingly embrace [in the Second Helvetic Confession].</p></blockquote>

<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 1, ch. 8, ‘That Festival Days take away our Christian Liberty, proved out of the Gospel’, pp. 25-26</span></figcaption>

+is%2C+that+the+apostle+will+not+bear+with+the+observation+days+in+Christian+Churches%2C+who+have+known+God+as+he+speaks.+%E2%80%A6+The+apostle+comports+with+the+observation+of+days+in+the+weak+Jews%2C+who+understood+not+the+fullness+of+the+Christian+liberty%2C+especially%2C+since+those+days+having+had+the+honor+to+be+once+appointed+by+God+Himself%2C+were+to+be+honorably+buried%3A+but+the+same+apostle+reproves+the+Galatians+who+had+attained+to+this+liberty%2C+and+had+once+left+off+the+observation+of+days.+%E2%80%A6+Now+for+confutation+of+this+forged+exposition+of+those+places+of+the+apostle%E2%80%A6+The+%5BRomanist%5D+Rhemists+affirm+that+the+apostle+condemns+only+Jewish+days+%5Bin+Col.+2+%26+Gal.+4%5D%2C+but+not+Christian+days%2C+and+that+we+do+falsely+interpret+his+words+against+their+holy-days.+%5BThomas%5D+Cartwright+answers+them+that+if+Paul+condemned+the+observing+of+feasts+which+God+Himself+instituted%2C+then+much+more+does+He+condemn+the+observation+of+feasts+of+man%E2%80%99s+devising%E2%80%A6+for+he+%5BPaul%5D+condemnes+that+observation+of+days+which+had+crept+into+the+Church+of+Galatia%2C+which+was+not+Jewish+nor+typical%2C+seeing+the+Galatians%2C+believing+that+Christ+was+already+come%2C+could+not+keep+them+as+figures+of+his+coming%2C+as+the+Jews+did%2C+but+rather+as+memorials+that+He+was+already+come%2C+says+Cartwright.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+1%2C+ch.+8%2C+%E2%80%98That+Festival+Days+take+away+our+Christian+Liberty%2C+proved+out+of+the+Gospel%E2%80%99%2C+pp.+25-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdaea4ecbc0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/daea4ecbc0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christian-living/religious-holidays/#:~:text=Col.%202%5D%20verse.%2017%2C%20What%20should,He%20was%20already%20come%2C%20says%20Cartwright&amp;text=Col.%202%5D%20

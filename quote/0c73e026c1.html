<main class="wrap"><figure class="quote" id="q-0c73e026c1" data-kw="">
<blockquote><p>As touching submission or subjection, we say with Dr. Field that subjection is generally and absolutly required where obedience is not, and even when our consciences suffer us not to obey, yet still we submit and subject ourselves, and neither do nor shall (I trust) show any the least contempt of authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies… (1637), | Pt. 1, ch. 3, ‘That the Ceremonies thus imposed &amp; urged as things necessary, do bereave us of our Christian liberty, first, because our practise is adstricted’</cite>, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

— George Gillespie, English-Popish Ceremonies… (1637), | Pt. 1, ch. 3, ‘That the Ceremonies thus imposed &amp; urged as things necessary, do bereave us of our Christian liberty, first, because our practise is adstricted’, p. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+touching+submission+or+subjection%2C+we+say+with+Dr.+Field+that+subjection+is+generally+and+absolutly+required+where+obedience+is+not%2C+and+even+when+our+consciences+suffer+us+not+to+obey%2C+yet+still+we+submit+and+subject+ourselves%2C+and+neither+do+nor+shall+%28I+trust%29+show+any+the+least+contempt+of+authority.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies%E2%80%A6+%281637%29%2C+%7C+Pt.+1%2C+ch.+3%2C+%E2%80%98That+the+Ceremonies+thus+imposed+%26+urged+as+things+necessary%2C+do+bereave+us+of+our+Christian+liberty%2C+first%2C+because+our+practise+is+adstricted%E2%80%99%2C+p.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c73e026c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c73e026c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=As%20touching%20submission%20or%20subjection%2C%20we,any%20the%20least%20contempt%20of%20authority&amp;text=As%20touching%20submission%20or%20subjection%2C%20we%20say%20with&amp;text=trust%29%20show%20any%20the%20least%20contempt%20of%20authority" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-88f912c2be" data-kw="">
<blockquote><p>It’s the Law of Nature in general that the whole rule the part, but it follows not [that] therefore every member is to submit to every positive law of the whole though most unjust; the member is to submit to every Law of Nature commanded by the whole: The little finger infected with a gangrene is to submit to the whole man that it be cut off for the safety of the whole body, but its against particular nature that it be cut off, but most suitable to universal nature [regarding the whole]. So in the general it’s natural for the creature-rational to obey the Creator; but it follows not, but it’s a mere positive law that Peter give his life for the Gospel when God by a positive command calls him to it; and the law-positive, if divine, is not contrary to the law of universal-nature [of the whole].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (1658)</cite>, p. 461</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-bae62eb49e" data-kw="">
<blockquote><p>Of this intellectual treasure house [the conscience], we are to know these: 1. That in the inner cabinet, the natural habit of moral principles lodges, the register of the common notions left in us by nature, the ancient records and chronicles which were in Adam’s time, the Law of Nature of two volumes: One of the first table, that there is a God, that He creates and governs all things, that there is but one God, infinitely good, more just rewarding the evil and the good; And of the second table, as to love our parents, obey superiors, to hurt no man, the acts of humanity; All these are written in the soul, in deep letters, yet the ink is dim and old, and therefore this light is like the moon swimming through watery clouds, often under a shadow, and yet still in the firmament. Caligula, and others, under a cloud, denied there was any God, yet when the cloud was over, the light broke out of prison, and granted, a God there must be; strong winds do blow out a torch in the night, and will blow in the same light again; and that there be other seeds, though come from a far land, and not growing out of the ground, as the former, is clear, for Christ scatters some Gospel-truths in this chalmer [chamber]; as John 7:28, ‘Then cried Jesus in the Temple; as He taught, saying, Ye both know Me, and whence I am.’ John 15:24, ‘But now they have both seen, and hated both Me and my Father.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation Against Pretended Liberty of Conscience (1649), ch. 1, ‘Of Conscience &amp; its Nature’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e33149f1c9" data-kw="">
<blockquote><p>Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-f18afe3f69" data-kw="">
<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (Edinburgh, 1655)</cite>, pp. 17-18</span></figcaption>

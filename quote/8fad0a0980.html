<main class="wrap"><figure class="quote" id="q-8fad0a0980" data-kw="">
<blockquote><p>…it is abominable imagery, and highly injurious to the great God, to represent Him any manner of way. Such abominations are the representing of God by a sun shining with beams, with the name JEHOVAH in it or over it, as in several Bibles: the representing of the Father by an image of an old man, the Son by that of a lamb, or a young man; or the Father by a large shining sun, the Son by a lesser sun shining, and the Holy Spirit by a dove, as in some great Bibles from England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, … ‘Of the 2nd Commandment,’ ‘Sins Forbidden,’ in The Whole Works… ed. Samuel M’Millan (Aberdeen: King, 1848), vol. 2, p. 150</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fd793bc8c6" data-kw="">
<blockquote><p>And what pitiful arguments have they to prove this charge of idolatry: ‘False worship of the true God is idolatry as well as worshipping a false God: But such is the [Anglican] Liturgy: therefore—’ This is all that these rash preachers must trouble the Church and seduce men into a hating factious zeal with. But what mean these men by ‘false worship’? Do they mean worship contrary to God’s Word? That is, which is sinful? And do they mean all such sinful worship or some only? If they mean all such sinful worship, then these words of theirs are idolatry: for they are part of their preaching, which is part of God’s worship, in their own sense: And it is false doctrine and tends to men’s perdition. And so they and all false teachers should be idolaters. By this they would turn all sins in worship into one: It is all idolatry. Is not every confused prayer sinful which has unmeet expressions and disordered, and has wandering thoughts and dull affections? Is there any of these love-killers that dare say they pray without sin? And must we not separate from them then as idolaters? Yea and every man from himself; that is, he must give over praying because it’s all idolatry? But perhaps they will say: ‘This sin is but in the manner and not in the matter.’ Answer: Very good; it seems then that sin in the manner of worship is not idolatry… Will you find some words which you can call false in the matter? Suppose it were so? When an Antinomian, an Anabaptist, a Separatist or anyone that errs does drop some of his errors in his prayers (as I think none will deny that they use to do), must we needs believe that his prayer is idolatry therefore, as being false worship? And is it unlawful to join with such? Then we shall have more separation than you yet plead for or practice yourselves. No two men in the world must join together if all sinful worship, or worship false sometime in the very matter does necessitate a separation… … But what text of Scripture is it that ever told these men that all false worship is idolatry? what text do they name but such as if they did it on purpose to show their boldness in adding to God’s Word? The Second Commandment is the chief which they insist on. But whatever expositions they may forge, there is no such word, nor sense in the Commandment. We all hold that as the gross, direct idolatry is the worshipping of a false God, against the First Commandment; so to make any such false representation of the true God, by words or deeds, as makes Him like an idol, and contradicts his nature, and so to worship Him, this is also a secondary kind of idolatry: Because God is none such as they represent Him, and therefore it is not God indeed but an idol which they worship. And because God is not like to anything corporeal in heaven or earth, therefore he that makes an image of any thing in heaven or earth as like to God, or to represent Him, he makes an idol of God by blasphemy. ‘To what will you liken Me, that I should be like unto it, saith the Holy One?’ This is the idolatry forbidden in the Second Commandment: It is not all false worship, but one sort of false worship, which is idolatry: what else that Commandment forbids is neither called idolatry, nor can so be proved. It is an odious sound, to hear an ignorant, rash, self-conceited person, especially a preacher, to cry out, ‘Idolatry, Idolatry,’ against his brethren’s prayers to God because they have something in them to be amended, while perhaps his own prayers have so much false doctrine in them or false fire of carnal passions and uncharitableness, as makes it a much harder question whether it be lawful to join with such as he is, while he abhors so much to join with others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 33, p. 190-93</span></figcaption>

</figure><figure class="quote" id="q-170e2c1298" data-kw="">
<blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote>

<blockquote><p>It’s further also to be observed in the general, that God has always had apparitions suitable to the matter in hand. Thus He appeared in a burning bush to Moses, like an armed man to Joshua; and with all signs of majesty, and a great God, being to deliver laws to the people that they might see how potent He was to be avenged for every breach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis</cite>, … (London: Young, 1647), lecture 16, p. 154</span></figcaption>

<blockquote><p>Of the nature of painting that represents the Historie of the Bible There are many things are more clearly set forth in a picture then in a discourse. The fabrick of the Tabernacle, the architecture of the Temple; the dimensions, stories, and divers rooms of Noahs Ark, are more perceptible by us in a painting to the eye, then is the verbal description the Scripture gives us of it. A man verily may behold the situation and length of the Land of Canaan better in a Chorographick Map, then in the History of Josuah: But that which is the more evident and easie, is not neverthelesse the more excellent. These paintings are not divine, as are the words of the Scripture. A visible representation of Solomon’s Temple is meerly a humane figure; but the verball representation of the same Temple exhibited in Scripture terms is a divine work. The picture of a man crucified, is it as divine as the words of the Scripture describing the passion of Christ? or rather, is it comparable to a Sermon, in which Jesus Christ is drawn out before our eyes, and crucified among us? Gal. 3.1. Where is it authorized by God to plant Faith in our hearts? In many narrations a picture verily may serve for an help to the understanding of the Historie: but it can never be either instrument or object of our Faith.</p></blockquote>

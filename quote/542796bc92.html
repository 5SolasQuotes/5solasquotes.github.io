<blockquote><p>[2 Corinthians 4:2] But renounce the hidden things. While he commends his own sincerity, he, on the other hand, indirectly reproves the false Apostles, who, while they corrupted by their ambition the genuine excellence of the gospel, were, nevertheless, desirous of exclusive distinction. Hence the faults, from which he declares himself to be exempt, he indirectly imputes to them. By the hidden things of disgrace, or concealments, some understand the shadows of the Mosaic law. Chrysostom understands the expression to mean the vain show, by which they endeavoured to recommend themselves. I understand by it—all the disguises, with which they adulterated the pure and native beauty of the gospel. For as chaste and virtuous women, satisfied with the gracefulness of natural beauty, do not resort to artificial adornings, while harlots never think themselves sufficiently adorned, unless they have corrupted nature, so Paul glories in having set forth the pure gospel, while others set forth one that was disguised, and covered over with unseemly additions. For as they were ashamed of the simplicity of Christ, or at least could not have distinction from true excellencies of Apostles, they framed a new gospel, not unlike a profane philosophy, swelled up with empty bombast, while altogether devoid of the efficacy of the Spirit. Spurious ornaments of this nature, by which the gospel is disfigured, he calls the concealments of disgrace, because the nakedness of those, who have recourse to concealments and disguises, must of necessity be dishonourable and disgraceful. As to himself, he says that he rejects or disdains disguises, because Christ’s face, the more that it is seen opened up to view in his preaching, shines forth so much the more gloriously. I do not, however, deny, that he alludes at the same time to the veil of Moses, (Exod. 34:33,) of which he had made mention, but he ascribes a quite different veil to the false Apostles. For Moses covered his face, because the excessive brightness of the glory of the law could not be endured by tender and blear eyes. They, on the other hand, put on a veil by way of ornament. Besides, as they would be despicable, nay, infamous, if the simplicity of the gospel shone forth, they, on this account, hide their shame under ever so many cloaks and masks</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Corinthians</cite>, trans. John Pringle (repr. Bellingham, WA: Logos Bible Software, 2010), 2.189–90.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-daea4ecbc0" data-kw="">
<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 1, ch. 8, ‘That Festival Days take away our Christian Liberty, proved out of the Gospel’, pp. 25-26</span></figcaption>

</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>

<blockquote><p>Nothing can truly be said to appertain to the priesthood of Aaron so far forth as it is abolished, but that which is used with such like superstition as if it were now (after Christ revealed) needful to salvation, or profitable of itself, or whereby some occasion is given to a man to assume or to retain this superstition with himself, or of troubling the peace and quiet of brethren; Bucer, Script. Anglican, fol. 707, to [John] Hooper.</p></blockquote>

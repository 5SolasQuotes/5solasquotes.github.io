<blockquote><p>But we are bound to give thanks to God always for you, brethren beloved by the Lord, because God from the beginning chose you for salvation through sanctification by the Spirit and belief in the truth (2 Thessalonians 2:13)

(2.) That these things are not causes of election, but fruits of election, and means of execution of God’s decree about our salvation. Sanctification is not a cause, but a subordinate end or means: Eph. i. 4, ‘He hath chosen us to be holy;’ not because we are holy, but that we might be holy. So 1 Peter i. 2, ‘Elect according to the foreknowledge of God, through the sanctification of the Spirit unto obedience.’ Not elected for it, but through it. When God had all mankind in his prospect and view, he freely chose out some to be sanctified and saved.

We come to the possession of it through sanctification, that is, by it as a means. So for the other; faith is a fruit of election, not a foreseen cause: Acts ii. 47, ‘The Lord added to the church daily such as should be saved.’ None cometh to the church but those whom God draweth, and they are actually added to the church by a profession of faith; and such as should be saved were as many as were ordained to salvation Acts xiii. 48, ‘And as many as were ordained to eternal life believed.’ The whole city were met together to hear, but as many as were ordained to eternal life believed. It is not said, as many as believed were ordained to eternal life, but the contrary; faith is not the cause of election, but election is the cause of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), 3: 106.</span></figcaption>

</figure><figure class="quote" id="q-b324cf7a33" data-kw="">
<blockquote><p>For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life. (John 3:16)

That whosoever believeth on him may not perish. It is a remarkable commendation of faith, that it frees us from everlasting destruction. For he intended expressly to state that, though we appear to have been born to death, undoubted deliverance is offered to us by the faith of Christ; and, therefore, that we ought not to fear death, which otherwise hangs over us. And he has employed the universal term whosoever, both to invite all indiscriminately to partake of life, and to cut off every excuse from unbelievers. Such is also the import of the term World, which he formerly used; for though nothing will be found in the world that is worthy of the favour of God, yet he shows himself to be reconciled to the whole world, when he invites all men without exception to the faith of Christ, which is nothing else than an entrance into life.

Let us remember, on the other hand, that while life is promised universally to all who believe in Christ, still faith is not common to all. For Christ is made known and held out to the view of all, but the elect alone are they whose eyes God opens, that they may seek him by faith. Here, too, is displayed a wonderful effect of faith; for by it we receive Christ such as he is given to us by the Father — that is, as having freed us from the condemnation of eternal death, and made us heirs of eternal life, because, by the sacrifice of his death, he has atoned for our sins, that nothing may prevent God from acknowledging us as his sons. Since, therefore, faith embraces Christ, with the efficacy of his death and the fruit of his resurrection, we need not wonder if by it we obtain likewise the life of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the gospel according to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), xvii, 124-5.</span></figcaption>

</figure><figure class="quote" id="q-643aef881b" data-kw="preceptive will gospel offer">
<blockquote><p>Conditional promises and threatenings do not favor conditional decrees because they do not pertain to the decreeing will, but to the preceptive will and are appendages to the divine commands, added to stimulate and excite men. … Hence such promises and threats show only the necessary connection of the condition with the thing conditioned, but involve no futurition of the thing.</p></blockquote>

</figure><figure class="quote" id="q-5ca8b38349" data-kw="">
<blockquote><p>Tried by the political Creed of Mary [Queen of Scots], it must be confessed that Knox entertained disloyal sentiments. Mary held by the principle — to sovereigns a convenient one — of “the right divine of kings to govern wrong.” Knox, on the contrary, held that “all power is founded in a compact expressed or understood, between the rulers and he ruled, and that no one has either divine or human right to govern, save in accordance with the will of the people and the law of God.” This is the amount of all that Knox advanced in his various interviews with Mary. These opinions may have sounded strange to one reared in a despotic court, they were before their time, we admit; but the world has since seen cause to ratify them, and states of no mean name have acted upon them.

They are the very sentiments which were embodied in the famous Declaration of Independence emitted by the states of Holland twenty years afterwards. They received a signal triumph when the British nation adopted them at the revolution of 1688; and they form at this day the basis of that glorious constitution under which it is our lot to live. Branded as treason, when first uttered beneath the regal roof of Holyrood; not a day now passes but we read these same sentiments in a hundred journals, we hear them proclaimed in senates, they are acted on by cabinets, and re-echoed from the throne itself. Let us not forget that the first openly to avow them on Scottish soil was Knox. …

Not to sovereigns, not to parliaments, not to nobles did he entrust the safety of the Reformation; he knew it must preserve itself. The broad practical sagacity in which he excelled, taught him the instrumentality by which alone this could be effected. He demanded, first, a constitutional government; and second, a national system of education. Some have talked, as if these two — constitutionalism and the schoolmaster — were ideas of modern times. On the contrary, they are as old as the days of Knox.

On Knox’s principles we should have had as liberal a government and as free a people in the fifteenth century as we have in the nineteenth. He anticipated by one hundred and fifty years the liberties of the Revolution of 1688. His scheme of education, as developed in the First Book of Discipline, was higher in its literary aims, more complete in its machinery, and more extensive as regarded population, than any that has yet been offered to the nation’s acceptance. That his ideas were not fully realized was no fault of his.

The first part of his scheme was deferred for a century and a half by the wretched despotism of the Court. The second was partially defeated by the grasping avarice of the nobles, joined to the apathy of the people, nevertheless, the institutions which Knox planted, though crippled from these causes, have kept their hold of the soil, and proved vast blessings to his country.

The constitutionalism and the Presbyterianism, of which he was the first public expounder in the British Isles, have become the special mission of Britain, and wherever liberty and religion are reviving, whether in the new countries of Canada and Australia, or in the old states of Europe, they are reviving, speaking generally, upon the Scottish type, Knox’s obstructions were temporary: his work is eternal: his country will yet fulfil the great task he set her: and in the completion of the work of Knox lies the completion of that of Luther and Calvin, — the completion, in fact, of the Reformation itself. And the one beneficent, and surpassingly grand object of the Reformation, was to fill the earth with pure churches and free nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-wylie.html">James A. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Knox in idem (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

They are the very sentiments which were embodied in the famous Declaration of Independence emitted by the states of Holland twenty years afterwards. They received a signal triumph when the British nation adopted them at the revolution of 1688; and they form at this day the basis of that glorious constitution under which it is our lot to live. Branded as treason, when first uttered beneath the regal roof of Holyrood; not a day now passes but we read these same sentiments in a hundred journals, we hear them proclaimed in senates, they are acted on by cabinets, and re-echoed from the throne itself. Let us not forget that the first openly to avow them on Scottish soil was Knox. …

Not to sovereigns, not to parliaments, not to nobles did he entrust the safety of the Reformation; he knew it must preserve itself. The broad practical sagacity in which he excelled, taught him the instrumentality by which alone this could be effected. He demanded, first, a constitutional government; and second, a national system of education. Some have talked, as if these two — constitutionalism and the schoolmaster — were ideas of modern times. On the contrary, they are as old as the days of Knox.

On Knox’s principles we should have had as liberal a government and as free a people in the fifteenth century as we have in the nineteenth. He anticipated by one hundred and fifty years the liberties of the Revolution of 1688. His scheme of education, as developed in the First Book of Discipline, was higher in its literary aims, more complete in its machinery, and more extensive as regarded population, than any that has yet been offered to the nation’s acceptance. That his ideas were not fully realized was no fault of his.

The first part of his scheme was deferred for a century and a half by the wretched despotism of the Court. The second was partially defeated by the grasping avarice of the nobles, joined to the apathy of the people, nevertheless, the institutions which Knox planted, though crippled from these causes, have kept their hold of the soil, and proved vast blessings to his country.

The constitutionalism and the Presbyterianism, of which he was the first public expounder in the British Isles, have become the special mission of Britain, and wherever liberty and religion are reviving, whether in the new countries of Canada and Australia, or in the old states of Europe, they are reviving, speaking generally, upon the Scottish type, Knox’s obstructions were temporary: his work is eternal: his country will yet fulfil the great task he set her: and in the completion of the work of Knox lies the completion of that of Luther and Calvin, — the completion, in fact, of the Reformation itself. And the one beneficent, and surpassingly grand object of the Reformation, was to fill the earth with pure churches and free nations.”

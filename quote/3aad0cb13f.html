<blockquote><p>Seeing therefore that God will not princes commandments should be obeyed in all things, but will have his rather suffer a thousand deaths, than do any thing that is evil: and sense also so many evils and mischiefs may follow in this life, where wicked princes wills may stand for laws, men ought both for God’s sake and commandment abstain to obey such commandments, and cleave unto this Maxim: we must obey God rather than man, for whose sake if we lose both goods and life, we ought to rejoice, that we be called to serve him, and not doubt, but as he is able to recompense it, so will he (according to his promise) reward it.

And besides also they ought to consider, that princes be ordained for the wealth and benefit of the people, and not to their destruction: to maintain common wealths, and not to subvert them: which rather than any man should consent unto, he ought (being a faithful man to his country) to abide all losses, both of body and goods. For next after God, men be borne to love, honour, and maintain their country.</p></blockquote>

<blockquote><p>As to the Confession of Faith,

1. How does their refusing to pray for the queen, to pay her cess, and to own her authority, because she is not a covenanted Queen, agree with the Confession of Faith, chap. 23, § 4, “It is the duty of people to pray for magistrates, to pay them tribute and other dues, and to be subject to their authority for conscience sake: infidelity, or difference in religion, doth not make void the magistrate’s just and legal authority?”

I know they will say, that article is meant of lands not covenanted: there had been some shadow of force in this perhaps, if this Confession of Faith had been framed before the Covenant: but upon the contrary it was long after, and was the product of the Solemn League and Covenant, as appears from the first article of the Covenant, in these words, “And shall endeavour to bring the churches of God in the three kingdoms to the nearest conjunction and uniformity in religion, confession of faith,” etc. The Solemn League and Covenant was sworn in the year 1643, the Confession of Faith was sent hither and approven by the Assembly not till the year 1647, for which see the Act of assembly, printed before the Confession. And can we think, that those who, in pursuance of the covenant, framed this Confession of Faith, to declare to the world the faith of covenanters, would so juggle, as to put in articles of faith which would bind others, but not themselves?

2. How does their reckoning the taking the oath of allegiance to the Queen, one of the steps of the Church’s defection, consist with Confession, chap. 22, §2, “A lawful oath, being imposed by lawful authority, in such matters ought to be taken;” and §3, of the same chapter, “Yet it is a sin to refuse an oath, touching any thing that is good and just, being imposed by lawful authority?” It is true, they reckon her no lawful Queen; but one error will not atone for another.

The famous author of the Apologetical Relation [John Brown of Wamphray] was not of our dissenters’ mind (nay, he thought there had been no Christian of their mind, and for ought I know there were none in these days), for, speaking of the reasons why the oath of Supremacy, called then, tho’ falsely, the oath of allegiance, should be refused, and answering this objection, viz. such as refuse this oath of Allegiance, declare that they are not dutiful and loyal subjects, he saith, “It hath been shown what difference there is betwixt this oath and the oath of allegiance; and there is no minister or Christian should scruple at the taking the pure oath of allegiance,” Apol. Rel. p. 259. If it was this author’s mind, that no minister or Christian should have scrupled the oath of Allegiance to King Charles II. when he had taken the Covenant, broken it, and overturned the work of Reformation, sure, he would far less have thought it a sin to take the oath of allegiance to the present Queen.

3. How doth their separating from this Church, lest they be involved in the guilt of the corruptions amongst us, by keeping communion with us, agree with Conf. chap. 26, §2, “Saints, by profession, are bound to maintain an holy fellowship and communion in the worship of God; — which communion, as God offereth opportunity, is to be extended to all those who in every place call upon the name of the Lord Jesus?”

4. How doth that principle of theirs, sometime at least owned by them, though left out in their last paper, against the power of the magistrate to call assemblies, agree with Conf. chap. 31 §2, “As magistrates may lawfully call a synod of ministers, and other fit persons to consult and advise with about matters of religion?” and with Act of Assembly 1638, sess. 26, concerning yearly General Assemblies, where they say, “If, in the meantime, it shall please the king’s majesty to indite a General Assembly, ordaineth all presbyteries, universities, and burghs, to send their commissioners, for keeping the time and place which shall be appointed by his majesty’s proclamation?” They cry out on the encroachment of the magistrates in dissolving Assemblies; but as our Assemblies are constituted in the name of Christ, so are they dissolved in his name.

What dissolution the magistrate makes, is looked upon as the dismissing of the members. There have indeed been encroachments made by the magistrate in dissolving Assemblies before they had done their business, and there have been protestations made against this. And though, in the late paper, they charge the Church for not protesting against the encroachments, and recording the same; yet that protestations have not been made against them, is an untruth: but where the magistrate’s deed is not recorded, neither are the protestations recorded.

I was eye and ear-witness to the magistrate’s dissolving the Assembly in the midst of business; and protestations were made against it, and for the Church’s intrinsic power; and, from every corner of the house, members adhering thereto. And this protesting is recorded in the Acts of Assembly; so that, from my certain knowledge, I can say they speak an untruth in that charge in the declinature; yea, I have the Acts of the Assembly by me, where they, or any that question the truth of what I say, may read it with their own eyes.

5. How doth their rejecting and despising the testimony of the Commission of the General Assembly against the Union, and reproaching them for it, because it was given into the Parliament by way of humble address, and not by way of protestation, agree with Confession, chap. 31, §5, “Synods and councils are to handle and conclude nothing but that which is ecclesiastical, and are not to intermeddle with civil affairs, which concern the commonwealth, unless, by way of humble petition, in cases extraordinary, or by way of advice, for satisfaction of conscience, if they be thereunto required by the civil magistrate?”

Lastly, How does their crying out on the magistrate’s occasionally appointing fasts and thanksgivings, agree with the Confession of Faith, allowing the magistrate to call Assemblies? This I spoke to formerly in another sermon. And further, how agrees it with the last paragraph of the Directory concerning public solemn fasting, where we have these words, “Besides solemn and general fasts enjoined by authority, we judge,” etc. It may be observed how frequently the apostles enjoin obedience to magistrates, and honouring of them, as 1 Tim. ii. 1, 2, “I exhort therefore, that prayers be made for kings, and for all that are in authority.” Rom. xiii. 1, “Let, every soul be subject unto the higher powers,” etc. Tit. iii. 1, “Put them in mind to be subject to principalities and powers, to obey magistrates.” 1 Pet. ii. 13, and downwards.

All which may shew us, that we have no more right to take away the fifth command out of the decalogue, that requires obedience to magistrates, than the Papists have to take away the second, which condemns their idolatry. I think there is a strange inclination amongst some that profess religion, not only amongst dissenters, but others, to speak evil of dignities, and to embrace every thing that may make against the magistrate; so that the murdering of King Charles I, wherewith Presbyterians are slandered by Papists and malignants, is owned and adopted by some, as if it had been a laudable action.

Wo is me! that ignorance, and an inclination to vilify magistrates, should give such an handle to the enemy against us. If it was such a glorious action, the sectaries must have the glory of it; for it was they, and not Presbyterians, that did the deed, and it was protested against by the commissioners both from the Church and state of Scotland, for which they were hardly used at London; for which see Apol. Rel. p. 64.

Yea, the General Assembly of the Church of Scotland, 1649, gave their testimony against it in their seasonable warning, sess. 27, they say, “That prevailing party of societies in England, who have broken the covenant — and taken away the king’s life, look upon us with an evil eye.” And in their exhortation to their brethren in England, “We have obtained this mercy, to be steadfast to our old principles, in bearing free and faithful testimony against their proceedings, both in reference to the toleration and government, and the taking away the king’s life.” And in their letter to the king, “We do from our hearts abominate and detest that horrid fact of the sectaries, against the life of your royal father our sovereign.” Both which are to be found in the last session of that Assembly.</p></blockquote>

0%9CA+lawful+oath%2C+being+imposed+by+lawful+authority%2C+in+such+matters+ought+to+be+taken%3B%E2%80%9D+and+%C2%A73%2C+of+the+same+chapter%2C+%E2%80%9CYet+it+is+a+sin+to+refuse+an+oath%2C+touching+any+thing+that+is+good+and+just%2C+being+imposed+by+lawful+authority%3F%E2%80%9D+It+is+true%2C+they+reckon+her+no+lawful+Queen%3B+but+one+error+will+not+atone+for+another.%0A%0AThe+famous+author+of+the+Apologetical+Relation+%5BJohn+Brown+of+Wamphray%5D+was+not+of+our+dissenters%E2%80%99+mind+%28nay%2C+he+thought+there+had+been+no+Christian+of+their+mind%2C+and+for+ought+I+know+there+were+none+in+these+days%29%2C+for%2C+speaking+of+the+reasons+why+the+oath+of+Supremacy%2C+called+then%2C+tho%E2%80%99+falsely%2C+the+oath+of+allegiance%2C+should+be+refused%2C+and+answering+this+objection%2C+viz.+such+as+refuse+this+oath+of+Allegiance%2C+declare+that+they+are+not+dutiful+and+loyal+subjects%2C+he+saith%2C+%E2%80%9CIt+hath+been+shown+what+difference+there+is+betwixt+this+oath+and+the+oath+of+allegiance%3B+and+there+is+no+minister+or+Christian+should+scruple+at+the+taking+the+pure+oath+of+allegiance%2C%E2%80%9D+Apol.+Rel.+p.+259.+If+it+was+this+author%E2%80%99s+mind%2C+that+no+minister+or+Christian+should+have+scrupled+the+oath+of+Allegiance+to+King+Charles+II.+when+he+had+taken+the+Covenant%2C+broken+it%2C+and+overturned+the+work+of+Reformation%2C+sure%2C+he+would+far+less+have+thought+it+a+sin+to+take+the+oath+of+allegiance+to+the+present+Queen.%0A%0A3.+How+doth+their+separating+from+this+Church%2C+lest+they+be+involved+in+the+guilt+of+the+corruptions+amongst+us%2C+by+keeping+communion+with+us%2C+agree+with+Conf.+chap.+26%2C+%C2%A72%2C+%E2%80%9CSaints%2C+by+profession%2C+are+bound+to+maintain+an+holy+fellowship+and+communion+in+the+worship+of+God%3B+%E2%80%94+which+communion%2C+as+God+offereth+opportunity%2C+is+to+be+extended+to+all+those+who+in+every+place+call+upon+the+name+of+the+Lord+Jesus%3F%E2%80%9D%0A%0A4.+How+doth+that+principle+of+theirs%2C+sometime+at+least+owned+by+them%2C+though+left+out+in+their+last+paper%2C+against+the+power+of+the+magistrate+to+call+assemblies%2C+agree+with+Conf.+chap.+31+%C2%A72%2C+%E2%80%9CAs+magistrates+may+lawfully+call+a+synod+of+ministers%2C+and+other+fit+persons+to+consult+and+advise+with+about+matters+of+religion%3F%E2%80%9D+and+with+Act+of+Assembly+1638%2C+sess.+26%2C+concerning+yearly+General+Assemblies%2C+where+they+say%2C+%E2%80%9CIf%2C+in+the+meantime%2C+it+shall+please+the+king%E2%80%99s+majesty+to+indite+a+General+Assembly%2C+ordaineth+all+presbyteries%2C+universities%2C+and+burghs%2C+to+send+their+commissioners%2C+for+keeping+the+time+and+place+which+shall+be+appointed+by+his+majesty%E2%80%99s+proclamation%3F%E2%80%9D+They+cry+out+on+the+encroachment+of+the+magistrates+in+dissolving+Assemblies%3B+but+as+our+Assemblies+are+constituted+in+the+name+of+Christ%2C+so+are+they+dissolved+in+his+name.%0A%0AWhat+dissolution+the+magistrate+makes%2C+is+looked+upon+as+the+dismissing+of+the+members.+There+have+indeed+been+encroachments+made+by+the+magistrate+in+dissolving+Assemblies+before+they+had+done+their+business%2C+and+there+have+been+protestations+made+against+this.+And+though%2C+in+the+late+paper%2C+they+charge+the+Church+for+not+protesting+against+the+encroachments%2C+and+recording+the+same%3B+yet+that+protestations+have+not+been+made+against+them%2C+is+an+untruth%3A+but+where+the+magistrate%E2%80%99s+deed+is+not+recorded%2C+neither+are+the+protestations+recorded.%0A%0AI+was+eye+and+ear-witness+to+the+magistrate%E2%80%99s+dissolving+the+Assembly+in+the+midst+of+business%3B+and+protestations+were+made+against+it%2C+and+for+the+Church%E2%80%99s+intrinsic+power%3B+and%2C+from+every+corner+of+the+house%2C+members+adhering+thereto.+And+this+protesting+is+recorded+in+the+Acts+of+Assembly%3B+so+that%2C+from+my+certain+knowledge%2C+I+can+say+they+speak+an+untruth+in+that+charge+in+the+declinature%3B+yea%2C+I+have+the+Acts+of+the+Assembly+by+me%2C+where+they%2C+or+any+that+question+the+truth+of+what+I+say%2C+may+read+it+with+their+own+eyes.%0A%0A5.+How+doth+their+rejecting+and+despising+the+testimony+of+the+Commission+of+the+General+Assembly+against+the+Union%2C+and+reproaching+them+for+it%2C+because+it+was+given+into+the+Parliament+by+way+of+humble+address%2C+and+not+by+way+of+protestation%2C+agree+with+Confession%2C+chap.+31%2C+%C2%A75%2C+%E2%80%9CSynods+and+councils+are+to+handle+and+conclude+nothing+but+that+which+is+ecclesiastical%2C+and+are+not+to+intermeddle+with+civil+affairs%2C+which+concern+the+commonwealth%2C+unless%2C+by+way+of+humble+petition%2C+in+cases+extraordinary%2C+or+by+way+of+advice%2C+for+satisfaction+of+conscience%2C+if+they+be+thereunto+required+by+the+civil+magistrate%3F%E2%80%9D%0A%0ALastly%2C+How+does+their+crying+out+on+the+magistrate%E2%80%99s+occasionally+appointing+fasts+and+thanksgivings%2C+agree+with+the+Confession+of+Faith%2C+allowing+the+magistrate+to+call+Assemblies%3F+This+I+spoke+to+formerly+in+another+sermon.+And+further%2C+how+agrees+it+with+the+last+paragraph+of+the+Directory+concerning+public+solemn+fasting%2C+where+we+have+these+words%2C+%E2%80%9CBesides+solemn+and+general+fasts+enjoined+by+authority%2C+we+judge%2C%E2%80%9D+etc.+It+may+be+observed+how+frequently+the+apostles+enjoin+obedience+to+magistrates%2C+and+honouring+of+them%2C+as+1+Tim.+ii.+1%2C+2%2C+%E2%80%9CI+exhort+therefore%2C+that+prayers+be+made+for+kings%2C+and+for+all+that+are+in+authority.%E2%80%9D+Rom.+xiii.+1%2C+%E2%80%9CLet%2C+every+soul+be+subject+unto+the+higher+powers%2C%E2%80%9D+etc.+Tit.+iii.+1%2C+%E2%80%9CPut+them+in+mind+to+be+subject+to+principalities+and+powers%2C+to+obey+magistrates.%E2%80%9D+1+Pet.+ii.+13%2C+and+downwards.%0A%0AAll+which+may+shew+us%2C+that+we+have+no+more+right+to+take+away+the+fifth+command+out+of+the+decalogue%2C+that+requires+obedience+to+magistrates%2C+than+the+Papists+have+to+take+away+the+second%2C+which+condemns+their+idolatry.+I+think+there+is+a+strange+inclination+amongst+some+that+profess+religion%2C+not+only+amongst+dissenters%2C+but+others%2C+to+speak+evil+of+dignities%2C+and+to+embrace+every+thing+that+may+make+against+the+magistrate%3B+so+that+the+murdering+of+King+Charles+I%2C+wherewith+Presbyterians+are+slandered+by+Papists+and+malignants%2C+is+owned+and+adopted+by+some%2C+as+if+it+had+been+a+laudable+action.%0A%0AWo+is+me%21+that+ignorance%2C+and+an+inclination+to+vilify+magistrates%2C+should+give+such+an+handle+to+the+enemy+against+us.+If+it+was+such+a+glorious+action%2C+the+sectaries+must+have+the+glory+of+it%3B+for+it+was+they%2C+and+not+Presbyterians%2C+that+did+the+deed%2C+and+it+was+protested+against+by+the+commissioners+both+from+the+Church+and+state+of+Scotland%2C+for+which+they+were+hardly+used+at+London%3B+for+which+see+Apol.+Rel.+p.+64.%0A%0AYea%2C+the+General+Assembly+of+the+Church+of+Scotland%2C+1649%2C+gave+their+testimony+against+it+in+their+seasonable+warning%2C+sess.+27%2C+they+say%2C+%E2%80%9CThat+prevailing+party+of+societies+in+England%2C+who+have+broken+the+covenant+%E2%80%94+and+taken+away+the+king%E2%80%99s+life%2C+look+upon+us+with+an+evil+eye.%E2%80%9D+And+in+their+exhortation+to+their+brethren+in+England%2C+%E2%80%9CWe+have+obtained+this+mercy%2C+to+be+steadfast+to+our+old+principles%2C+in+bearing+free+and+faithful+testimony+against+their+proceedings%2C+both+in+reference+to+the+toleration+and+government%2C+and+the+taking+away+the+king%E2%80%99s+life.%E2%80%9D+And+in+their+letter+to+the+king%2C+%E2%80%9CWe+do+from+our+hearts+abominate+and+detest+that+horrid+fact+of+the+sectaries%2C+against+the+life+of+your+royal+father+our+sovereign.%E2%80%9D+Both+which+are+to+be+found+in+the+last+session+of+that+Assembly.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Evil+and+Danger+of+Schism.+A+Sermon%2C+by+the+late+Learned+and+Pious+Mr.+Thomas+Boston%2C+Minister+of+the+Gospel+at+Etterick%2C+%281708%3B+3rd+edn%2C+Oxnam%2C+1753%29%2C+pp+24-29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff115948af2.html&amp;via=5Solas" target="_blank" rel="noopener">Sha <blockquote><p>5. ‘The persons are proposed (Rom. 13) to be the object of our obedience,’ says Dr. Ferne [an erastian royalist]. This is very true: but he is ignorant of our mind in expounding the word ‘person’. We never meant that fear, honor, royalty, tribute, must be due to the abstracted accident of kingly authority [a righteous rule that a bad king may not be exercising], and not to the man who is king; nor is it our meaning that royalty, in abstracto is crowned king [the office apart from the particular king], and is anointed, but that the person is crowned and anointed. But, again, by a ‘person’ we mean nothing less than the man Nero wasting Rome, burning, crucifying Paul and torturing Christians; and that we owe subjection to Nero and to his person in concreto [materially as a specific man], as [distinguished from and compared] to God’s ordinance, God’s minister, God’s sword-bearer, in that notion of a ‘person’, is that only that we deny. Nay, in that Nero, in concreto [as a man, and that sinful], to us is no power ordained of God, no minister of God, but a minister of the devil, and Satan’s armour-bearer, and therefore we owe not fear, honor, subjection, or tribute to the person of Nero. But the person thus far is the object of our obedience, that fear, honor, subjection and tribute must be due to the man in concreto [in particular], to his person who is prince, but not because he is a man, or a person simply, or a sword-bearer of papists, but for his office,- for that eminent place of royal dignity that God has conferred on his person… so here we honor and submit to the man who is king, not because he is a man, that were treason; not because he uses his sword against the church, that were impiety; but because of his royal dignity, and because he uses it for the Lord. …Subjection is due to Nero as an emperor, but not any subjection is due to him in the burning of Rome, and torturing of Christians… Because some believed Christians were free from the yoke of magistracy, and that the dignity itself was unlawful; and because (ch. 12) he had set down the lawful church rulers, and in this and the following chapter, the duties of brotherly love of one toward another; so here ([Rom.] ch. 13) he teaches that all magistrates, suppose [they be] heathen, are to be obeyed and submitted unto in all things, so far as they are ministers of God.</p></blockquote>

— Samuel Rutherford, Lex Rex, Question 29, p. 146; p. 148">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+%E2%80%98The+persons+are+proposed+%28Rom.+13%29+to+be+the+object+of+our+obedience%2C%E2%80%99+says+Dr.+Ferne+%5Ban+erastian+royalist%5D.+This+is+very+true%3A+but+he+is+ignorant+of+our+mind+in+expounding+the+word+%E2%80%98person%E2%80%99.+We+never+meant+that+fear%2C+honor%2C+royalty%2C+tribute%2C+must+be+due+to+the+abstracted+accident+of+kingly+authority+%5Ba+righteous+rule+that+a+bad+king+may+not+be+exercising%5D%2C+and+not+to+the+man+who+is+king%3B+nor+is+it+our+meaning+that+royalty%2C+in+abstracto+is+crowned+king+%5Bthe+office+apart+from+the+particular+king%5D%2C+and+is+anointed%2C+but+that+the+person+is+crowned+and+anointed.+But%2C+again%2C+by+a+%E2%80%98person%E2%80%99+we+mean+nothing+less+than+the+man+Nero+wasting+Rome%2C+burning%2C+crucifying+Paul+and+torturing+Christians%3B+and+that+we+owe+subjection+to+Nero+and+to+his+person+in+concreto+%5Bmaterially+as+a+specific+man%5D%2C+as+%5Bdistinguished+from+and+compared%5D+to+God%E2%80%99s+ordinance%2C+God%E2%80%99s+minister%2C+God%E2%80%99s+sword-bearer%2C+in+that+notion+of+a+%E2%80%98person%E2%80%99%2C+is+that+only+that+we+deny.+Nay%2C+in+that+Nero%2C+in+concreto+%5Bas+a+man%2C+and+that+sinful%5D%2C+to+us+is+no+power+ordained+of+God%2C+no+minister+of+God%2C+but+a+minister+of+the+devil%2C+and+Satan%E2%80%99s+armour-bearer%2C+and+therefore+we+owe+not+fear%2C+honor%2C+subjection%2C+or+tribute+to+the+person+of+Nero.+But+the+person+thus+far+is+the+object+of+our+obedience%2C+that+fear%2C+honor%2C+subjection+and+tribute+must+be+due+to+the+man+in+concreto+%5Bin+particular%5D%2C+to+his+person+who+is+prince%2C+but+not+because+he+is+a+man%2C+or+a+person+simply%2C+or+a+sword-bearer+of+papists%2C+but+for+his+office%2C-+for+that+eminent+place+of+royal+dignity+that+God+has+conferred+on+his+person%E2%80%A6+so+here+we+honor+and+submit+to+the+man+who+is+king%2C+not+because+he+is+a+man%2C+that+were+treason%3B+not+because+he+uses+his+sword+against+the+church%2C+that+were+impiety%3B+but+because+of+his+royal+dignity%2C+and+because+he+uses+it+for+the+Lord.+%E2%80%A6Subjection+is+due+to+Nero+as+an+emperor%2C+but+not+any+subjection+is+due+to+him+in+the+burning+of+Rome%2C+and+torturing+of+Christians%E2%80%A6+Because+some+believed+Christians+were+free+from+the+yoke+of+magistracy%2C+and+that+the+dignity+itself+was+unlawful%3B+and+because+%28ch.+12%29+he+had+set+down+the+lawful+church+rulers%2C+and+in+this+and+the+following+chapter%2C+the+duties+of+brotherly+love+of+one+toward+another%3B+so+here+%28%5BRom.%5D+ch.+13%29+he+teaches+that+all+magistrates%2C+suppose+%5Bthey+be%5D+heathen%2C+are+to+be+obeyed+and+submitted+unto+in+all+things%2C+so+far+as+they+are+ministers+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+Question+29%2C+p.+146%3B+p.+148&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbea784873e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bea784873e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=5.%20%E2%80%98The%20persons%20are%20proposed%20%28Rom,as%20they%20are%20ministers%20of%20God&amp;text=5.%20%E2%80%98The%20persons%20are%20proposed%20%28Rom.%2013%29%20to&amp;text=so%20far%20as%20they%20are%20ministers%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>‘Whether to the King.’ It may be questioned, whom the apostle means by the word King? Such as understand the epistle to be written to the Jews, may perhaps conceive that the kings that ruled by deputation in Judea should be meant, such as were Herod and Agrippa. But in as much as the Jews were scattered through the provinces, and those provincial Jews were most in quiet: and in as much as for the reasons afore given, it is likely that the epistle was written to all Christians, both Jews and Gentiles; therefore by the King he meant Caesar.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5103ae4678" data-kw="">
<blockquote><p>The Root of David He is called, according to Isa. 53:2, whereas He is said to be a branch out of the root, Isa. 11:1, because although He be but a branch according to the flesh for so much as he came of David, yet He is a root according to his divinity (Rupertus; Pannonius), whereupon David and all the godly are born by faith partaking of his grace, as of sap coming from Him, and consequently of salvation by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastica interpretatio: or the Expositions upon the difficult and doubtful passages of the seven Epistles called catholic and the Revelation... (London: Haviland, 1627), on Rev. 5, question 6</cite>, p. 308</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4dc6be0a97" data-kw="">
<blockquote><p>4. Whether the regenerate soul here [after death in the consummation of regeneration] conducts itself purely passively, or rather actively concurs with the motion of the Spirit, and that by virtue of the new creature implanted in it as the principium quo [principle by which]? Response: The latter can be affirmed.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-c7b99b2e9d" data-kw="">
<blockquote><p>5. All the justified have a real union and interest in Christ, to live by faith (Hab. 2:4; Rom. 1:17), and wait on God in all their troubles by faith; but though there be an union of love in God’s mind from eternity, between the elect and God, yet a complete union between us and Christ, without the Spirit, and without any faith, though it be boldly asserted by Familists (Rise, Reign, Er., p. 37), is against the Scripture: For then might we be born again, and not receive Christ by faith, contrary to the Scripture (Jn. 1:11-12, Antinomians hold an union with Christ before we believe); and be united to Christ, as branches to the Vine-tree, and not abide in Christ (Jn. 15:1-6), have Christ dwelling in our heart, and not by faith, contrary to Paul (Eph. 3:17); so might Christ live in us, and we eat and drink Him as the true manna, have the Son, and yet want [lack] faith, contrary to the Scriptures (Gal. 2:20; Rev. 2:7•; Jn. 6:35, 40, 44, 47, 54-55). All which, or most of them, prove that we were not justified when Christ died on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist… (London: 1648), pt. 2, ch. 18, ‘That we are not justified until we believe’</cite>, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-42baf48e08" data-kw="">
<blockquote><p>Thirdly, James has spoken shortly before concerning regeneration, namely, that it occurs through the Gospel. For thus he says 1:18, ‘Of His own will begat He us with the Word of Truth, that we should be a kind of firstfruits of His creatures.’ When he says that we have been born again by the Gospel, he teaches that we have been born again and justified by faith. For the promise concerning Christ is apprehended only by faith, when we set it against the terrors of sin and of death. James does not, therefore, think that we are born again by our works. … but on account of His promise He forgives those who apprehend His promise. Neither do any apprehend His promise, except those who truly believe, and by faith overcome sin and death. These, being regenerated, ought to bring forth fruits worthy of repentance, just as John says, Mt. 3:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004) | pt. 8</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

<blockquote><p>What call you the Judicial Law? That wherein God appointed a Form of Politick and Civil Government of the Common-wealth of the Jews: Which therefore is ceased with the Dissolution of that State, for which it was ordained; saving only in the common Equity. Is this Law utterly revoked and abolished by Christ? No. For he came not to overturn any good Government of the Common-wealth; much less that which was appointed by God himself. May not Christian Magistrates then swerve any thing from those Laws of Government, which were set down by Moses? In some Circumstances they may: But in the general Equity and Substance they may not. What Judicial Laws are immutably to be observed now of Christian Magistrates? Those which have Reasons annexed unto them, and especially those wherein God hath appointed Death for the Punishment of hainous Offences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition</cite>, 242</span></figcaption>

<blockquote><p>With us [the Church of Scotland,] the king or his commissioner is present [in our General Assemblies], as in the national assembly of the Jews was King David (1 Chron. 13:1,2), Asa (2 Chron. 15:9), Hezekiah (2 Chron. 29:4, Josiah, 2 Chron. 34:29). For the king bears the sword and is there as a politic president and nursing father (Isa. 49:23; Rom. 13:4).</p></blockquote>

<blockquote><p>…the Magistrate indeed forbids speaking of blasphemy and teaching of lies in the name of the Lord, but he forbids not teaching of lies, or abstinence from blaspheming, in a spiritual, but in a carnal, co-active, by force of the sword and external way, because he cannot punish the spiritual and internal ways and manner of external obedience, and therefore he cannot under pain of bodily censure command and forbid these ways of obedience; so the Magistrate forbids murder, but God, not the Magistrate, forbids murder, or commands abstinence from killing, out of mercy and love to our neighbor; for the Magistrate cannot punish heart-hatred of our neighbor, or rash anger, but insofar as it comes out to his senses, in striking, maiming, or opprobrious speeches; and these he can forbid and censure and punish. So we say [that] the Magistrate is but a piece, or a bit of an ordinance (though both lawful and necessary, Rom. 13, for our good [v. 4]) to reform the outside and to work outward reformation; and when he commands the outward man and says, ‘Swear not, blaspheme not, speak not lies in the name of the Lord, kill not, steal not under the pain of feeling the stroke of the sword’: he commands not sinning. For though he forbid only external abstinence from sins that troubles the outward man, without any spiritual and internal right way of abstaining, he commands not sin and hypocrisy, per se, and kindly [in its kind], and properly. 1. Because the Magistrate, as the Magistrate, should and ought, as the Minister of God, give commandments to the outward man under pain of corporal punishment, not to the soul or to the inward man. 2. Because that external obedience, not to kill, not to steal, not to speak lies, is good, lawful external obedience, to man, and profitable in the State for the end that God has appointed it, which is the peaceable conversing one with another; that same abstinence from killing in an unrenewed man, who abstains not from killing for fear of God and love to his brethren, is a sinful abstinence and carnal repentance, by accident, and in relation to the Law of God; but the Magistrate neither commands abstinence from killing from an inward spiritual principle, nor forbids he the contrary: he commands not abstinence from false doctrine out of the love that the messenger owes to him who purchased the flock with his blood, nor forbids he such abstinence, but only he commands abstinence from speaking lies to the people of God. 3. If we distinguish obedience, there is first a necessary and good and lawful obedience. 2. There is an obedience complete and entire, and full, and sincere. Outward obedience, which the Magistrate commands, is good and lawful and [is] necessary obedience, and is, in the kind of external and necessary obedience (I mean) necessary for its end, [namely] the safety of the society, not hypocritical, unlawful or sinful. In this notion only it is commanded by the Magistrate, and the omission of it [is] unlawful and punishable by the sword of the deputy and Minister of God. But if we speak of an obedience complete, full and sincere, which is required from the whole man in order to the Law of God, then the outward obedience that the Magistrate demands is not complete, entire, nor sincere, but in relation to the Law of God, which requires entire obedience from the whole man, soul and body, it is not full, not entire, not sincere obedience, but an outside of obedience; but in this sense the Magistrate does not demand obedience to the Law of God, for he has to do with the outward man only and as a Magistrate has nothing to do with the soul and conscience: so then, though the Magistrate command to preach sound doctrine, forbid to preach lies in the name of the Lord, yet he commands not hypocrisy and sin; for this argument may as well prove [that] the Magistrate should neither forbid nor punish murder, nor command abstinence from murder to an unrenewed man, for an unrenewed man cannot but abstain from murder in a sinful way, and his abstinence from murder, in order to the spiritual Law of God, is no better ‘than the oblation of swine’s blood, and the cutting off of a dog’s head to God,’ Isa. 66. 1:2, as is all external obedience of either Tables of the Law, First or Second, without faith and spiritual, inward, moral principles and heart-obedience; and Mr. Williams cannot answer this argument but by the principles of Anabaptists, Familists and Enthusiasts, who say [that] all outward ordinances, ministry, preaching, sacraments, yea preachers and magistrates who command outward obedience to God are unlawful now under the New Testament.</p></blockquote>

e+has+to+do+with+the+outward+man+only+and+as+a+Magistrate+has+nothing+to+do+with+the+soul+and+conscience%3A+so+then%2C+though+the+Magistrate+command+to+preach+sound+doctrine%2C+forbid+to+preach+lies+in+the+name+of+the+Lord%2C+yet+he+commands+not+hypocrisy+and+sin%3B+for+this+argument+may+as+well+prove+%5Bthat%5D+the+Magistrate+should+neither+forbid+nor+punish+murder%2C+nor+command+abstinence+from+murder+to+an+unrenewed+man%2C+for+an+unrenewed+man+cannot+but+abstain+from+murder+in+a+sinful+way%2C+and+his+abstinence+from+murder%2C+in+order+to+the+spiritual+Law+of+God%2C+is+no+better+%E2%80%98than+the+oblation+of+swine%E2%80%99s+blood%2C+and+the+cutting+off+of+a+dog%E2%80%99s+head+to+God%2C%E2%80%99+Isa.+66.+1%3A2%2C+as+is+all+external+obedience+of+either+Tables+of+the+Law%2C+First+or+Second%2C+without+faith+and+spiritual%2C+inward%2C+moral+principles+and+heart-obedience%3B+and+Mr.+Williams+cannot+answer+this+argument+but+by+the+principles+of+Anabaptists%2C+Familists+and+Enthusiasts%2C+who+say+%5Bthat%5D+all+outward+ordinances%2C+ministry%2C+preaching%2C+sacraments%2C+yea+preachers+and+magistrates+who+command+outward+obedience+to+God+are+unlawful+now+under+the+New+Testament.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%E2%80%A6+%281649%29+%7C+Ch.+27%2C+%E2%80%98Whether+our+Darkness+%26+Incapacity+to+Believe%E2%80%A6%E2%80%99%2C+p.+323-5+%28356-8%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F15291052f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/15291052f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=the%20Magistrate%20indeed%20forbids%20speaking%20of,unlawful%20now%20under%20the%20New%20Testament&amp;text=the%20Magistrate%20indeed%20forbids%20speaking%20of%20blasphemy%20and&amp;text=God%20are%20unlawful%20now%20under%20the%20New%20Testament" rel="noopener" target="_blank">Read it online <blockquote><p>Hence it [polygamy] might be lawful in the court of earth (so as to obtain immunity from civil and ecclesiastical punishments among men), but not in the court of heaven before God. … XXIX. As to divorce, God neither simply commanded nor permitted it, but only wished to restrain by fixed laws the facility of divorces which prevailed among the Jews against the natural law of marriage, so as to regulate the mode of an unlawful thing, not however to make it lawful. Hence Christ says that God ‘permitted’ or ‘tolerated’ it ‘because of the hardness of heart of the Jews’ (Mt. 19:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 26 &amp; 29, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence it [polygamy] might be lawful in the court of earth (so as to obtain immunity from civil and ecclesiastical punishments among men), but not in the court of heaven before God. … XXIX. As to divorce, God neither simply commanded nor permitted it, but only wished to restrain by fixed laws the facility of divorces which prevailed among the Jews against the natural law of marriage, so as to regulate the mode of an unlawful thing, not however to make it lawful. Hence Christ says that God ‘permitted’ or ‘tolerated’ it ‘because of the hardness of heart of the Jews’ (Mt. 19:8).”

<blockquote><p>In a disputation by writing, those of the other part [Richard Baxter and others] formed an argument, whose major proposition was to this sense… ‘Whatsoever book [of law] enjoins nothing but what is of itself lawful, and by lawful authority, enjoins nothing that is sinful’. We denied this proposition, and at last gave diverse reasons of our denial; amongst which one was that ‘It may be unlawful by accident, and therefore sinful’… And I must confess I am still guilty of so much weakness as to be confident that ‘Some things, not evil of themselves, may have accidents so evil as may make it a sin to him that shall command them.’ Is this opinion inconsistent with all government? Yea I must confess myself guilty of so much greater weakness as that I thought I should never have found a man on earth that had the ordinary reason of a man, that had made question of it; yea I shall say more than that which has offended, viz, ‘That whensoever the commanding or forbidding of a thing indifferent is like to occasion more hurt than good, and this may be foreseen, the commanding or forbidding it is a sin.’ … I think Paul spake not anything inconsistent with the government of God or man when he bid both the rulers and the people of the Church not to destroy him with their meat for whom Christ died: and when he says, he hath not his power to destruction, but to edification; yea there are evil accidents of a thing, not evil of itself, that are caused by the commander: and it is my opinion that they may prove his command unlawful.</p></blockquote>

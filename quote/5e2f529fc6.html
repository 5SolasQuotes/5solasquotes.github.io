<blockquote><p>Secondly some things dissolve mariage… Disrumpendo, by breaking of it, viz…. Secondly, fornication, as in this verse and Mt. 19:9, where for adultery and fornication it is lawful for a man to put away his wife… [Rudolph] Gualter here includes all greater things, as poison, offering to stab, and the like: but this is doubtful, and the Scripture herein silent, and therefore Peter Martyr (pt. 2, ch. 10, §54-55) holds the contrary.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e90e17e47" data-kw="">
<blockquote><p>Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates.</p></blockquote>

</figure><figure class="quote" id="q-e49b6da69f" data-kw="">
<blockquote><p>Monogamy is a distinctive aspect of the Christian tradition. Polygamy existed in most ancient societies, but Christian authorities opposed the practice, in part to distinguish monogamous Christianity from other faiths. By the early modern period, polygamy was rare in Christian Europe, and it had gained a negative reputation because of its association with sexual excess and lust. During the Reformation, however, certain individuals, including Luther himself, condoned polygamy, and Lutheran doctrine was compatible with plural marriage in some ways. After an ill-fated attempt [by Anabaptists] to establish a polygamous community at Munster, however, it became much more difficult to support polygamy, as the practice was further tainted by association with religious radicalism and lustful, degenerate behavior. During the English Revolution, the downfall of censorship and the tumultuous political climate allowed some English authors to write in support of plural marriage, using both practical and religious arguments. Yet, the majority of authors condemned the practice. Plural marriage continued to be associated with pagan and barbaric culture, and accusations of polygamy were used to undermine and discredit one’s enemies. In the literature of travel and colonisation, accusations of polygamy were used to demean and vilify peoples such as Jews and Turks. The existence of polygamy in Europe’s colonies helped Christian Europeans to maintain a sense of superiority over the pagan, barbaric indigenous inhabitants and helped to establish a shared European and Christian identity. In the writings of the Reformation and the Revolution, along with the literature of travel and colonisation, polygamy became a boundary marker between Christians and non-Christians, Catholics and Protestants, radicals and non-radicals, civilised countries and barbaric countries, and England and its colonies. Polygamy’s function as a boundary marker, more than any theological reasons, was the reason why plural marriage did not gain significant support in early modern England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lisa-loughead.html">Lisa Loughead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perception of Polygamy in Early Modern England MA thesis</cite>, (Nova Scotia: Dalhousie University, 2008) 150 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-8edd371a20" data-kw="">
<blockquote><p>Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…</p></blockquote>

<blockquote><p>§18. Of a child’s carriage in case a parent provide an unfit mate or none at all. … 2nd Question, “What if the parent be negligent, and in due time provide no fit match? May not the child provide one for himself? Answer: A parent’s negligence is not a sufficient pretext to make a child [wholly] cast off that subiection which he owes to his parent. Yet I deny not but that a child knowing where a fit match is to be had, may make known as much to his parent (as Sampson did) and crave both his consent and help thereunto, Judg. 14:2. And if his parent give no ear to his humble suit, he may use the mediation of his kindred or other friends. Yea if necessity require that the child be married, and his parent add wilfulness to negligence, and will not be moved at all, neither by the humble suit of his child, nor by the earnest solicitation of any friends, means may be made to the Magistrate (who is in God’s place over the parent as well as over the child, and ought to afford relief unto the child) and what the Magistrate does in that case is as good a warrant to the child as if the parent had done it. The like means may be used if a parent be an idolater, heretic, or atheist, and will not yield that his child be married to any but to one of his own profession and disposition.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§18. Of a child’s carriage in case a parent provide an unfit mate or none at all. … 2nd Question, “What if the parent be negligent, and in due time provide no fit match? May not the child provide one for himself? Answer: A parent’s negligence is not a sufficient pretext to make a child [wholly] cast off that subiection which he owes to his parent. Yet I deny not but that a child knowing where a fit match is to be had, may make known as much to his parent (as Sampson did) and crave both his consent and help thereunto, Judg. 14:2. And if his parent give no ear to his humble suit, he may use the mediation of his kindred or other friends. Yea if necessity require that the child be married, and his parent add wilfulness to negligence, and will not be moved at all, neither by the humble suit of his child, nor by the earnest solicitation of any friends, means may be made to the Magistrate (who is in God’s place over the parent as well as over the child, and ought to afford relief unto the child) and what the Magistrate does in that case is as good a warrant to the child as if the parent had done it. The like means may be used if a parent be an idolater, heretic, or atheist, and will not yield that his child be married to any but to one of his own profession and disposition.”

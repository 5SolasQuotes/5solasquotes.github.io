<main class="wrap"><figure class="quote" id="q-057b1fe018" data-kw="">
<blockquote><p>Accordingly, the best form of government is in a state or kingdom, where one is given the power to preside over all; while under him are others having governing powers: and yet a government of this kind is shared by all, both because all are eligible to govern, and because the rules are chosen by all. For this is the best form of polity, being partly kingdom, since there is one at the head of all; partly aristocracy, in so far as a number of persons are set in authority; partly democracy, i.e. government by the people, in so far as the rulers can be chosen from the people, and the people have the right to choose their rulers.

Such was the form of government established by the divine law. For Moses and his successors governed the people in such a way that each of them was ruler over all; so that there was a kind of kingdom. Moreover, seventy-two men were chosen, who were elders in virtue: for it is written (Dt. 1:15): “I took out of your tribes wise and honorable, and appointed them rulers”: so that there was an element of aristocracy. But it was a democratical government in so far as the rulers were chosen from all the people; for it is written (Ex. 18:21): “Provide out of all the people wise men,” etc.; and, again, in so far as they were chosen by the people; wherefore it is written (Dt. 1:13): “Let me have from among you wise men,” etc. Consequently it is evident that the ordering of the rulers which the Law provided was the best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica</cite>, I-II, Q.105, Art. 1, co.</span></figcaption>

<blockquote><p>Spiritual substance is distinguished from matter by the characteristic of self-motion, or motion ab intra [from inside]. Matter must be moved from without, by another material substance impinging upon it. But mind moves from within. Its motion is not from external impact, but is self-motion. Adam was created a spirit. The instant, therefore, that he was created, he had all the characteristics that distinguish spirit from matter. One of these, and one of the most important, is self-motion. But self-motion is self-determination, and self-determination is inclination. The Scripture asserts that Adam was created a ‘living soul.’ Life implies motion; and the motion in this case was not mechanical or material, but the motion of mind. Thus in creating a rational spirit, God creates a self-moving essence, and this is a self-determining will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (NY: Charles Scribner’s Sons, 1888), vol. 2, ch. 2, ‘Man’s Primitive State’, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-a6b3792f49" data-kw="">
<blockquote><p>Second, with respect to the particular commandments of the law, saying: and the commandment of the law is holy in regard to the ceremonial precepts by which men are directed in the worship of God: be holy because I am holy (Lev 20:7) and just, in regard to the judicial precepts by which man is ordered to his neighbour in the proper way: the ordinances of the Lord are true and just altogether (Ps 19:9); and good, in regard to the moral precepts: the law of your mouth is better to me than thousands of gold and silver pieces (Ps 119:72). Yet, because all the commandments ordain us to God, he called the whole law holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Romanos lectura</cite>, (c. 1259-65), C. 7, L. 2, 551.</span></figcaption>

<blockquote><p>I say that although things other than God are in fact contingent in respect of actual being, they are not so in respect of potential being. So things that are contingent with respect to actual existence are necessary with respect to possible existence, as that although it is contingent that man exists yet that his existence is possible is necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Intro, p. 9 | This very evident proposition, although it is in itself a necessary one (as will be shown later), is yet a proposition that for us is purely contingent. Hence, in order to preserve the condition of Aristotelian science that the principles be necessary, we can infer something necessary from the contingent proposition ‘something is’, namely the proposition that ‘the existence of something is possible’ or that ‘there is no repugnance between something and existence’. For as Scotus well observes (Lectura 1)</span></figcaption>

</figure><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 146</span></figcaption>

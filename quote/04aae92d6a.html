<main class="wrap"><figure class="quote" id="q-04aae92d6a" data-kw="">
<blockquote><p>There will be no one found among men that is free from every vice; but it is one thing to be blemished with ordinary vices, which do not hurt the reputation, because they are found in men of the highest excellence, and another thing to have a disgraceful name, or to be stained with any baseness. In order, therefore, that a bishop may not be without authority, he enjoins that there shall be made a selection of one who has a good and honorable reputation, and not chargeable with any remarkable vice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Timothy, ch. 3, verse 2, “A bishop, therefore, must be blameless.”</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-546a5fc60b" data-kw="">
<blockquote><p>We grant in this Question: 1. That private Christians from the common duty of charity, making use of those spiritual gifts which they have received from God for men’s edification, do sometimes convert to the faith those souls which went astray; and bring those who live in the world, out of the Church, unto the body of the Church of Christ. See Jn. 4:29, etc. 1 Cor. 7:16. 2. We do not think that the office of him who preaches the Word, as sent of God and the Church, do confer any efficacy to the Word preached by him; or has any influence upon the soul of him that is converted. For the power of God only, and the Spirit which accompanies the Word preached, does give to the Word preached a virtue and saving efficacy for the conversion and salvation of souls, 1 Cor. 12:11 and 15:10. But we affirm that the Word preached by him who is ordained to an ecclesiastical office, and does by his ecclesiastical office authoritatively preach the Word, is the ordinary means to which God does by the efficacy of his Spirit give assistance for the conversion of those who live in sin out of Church-communion. So that pastors, as pastors, by virtue of their pastoral office are the ordinary means of the conversion of those men who live in the world. This assertion is proved: 1. Because faith is given and first attained by the Word preached, by those who by an ecclesiastical call are sent of God, to the pastoral Office, and by virtue of mission and function preach the Word, whereby faith is wrought in man. See Rom. 10:14-15; 1 Cor. 3:19; Gal. 3:2. 2. Because pastors of Churches by reason of the office they bear, are fathers, who do first beget their children to Christ in the Church; and by the spiritual seed of God, do give spirit and life to those that are dead in sins: See 1 Cor. 4:15; Gal. 4:19; 2 Cor. 2:16. 3. Pastors are enjoined, as an office peculiarly belonging to them, to preach the Word of God with all meekness, mildness, and patience, if perhaps God will give repentance to those who are held captives in the snares of the Devil, 2 Tim. 2:24-26, to open the eyes of those who sit in darkness, and to bring them to the light of the Gospel and of grace, Acts 26:18, to seek lost sheep for the Lord, Eze. 34:4-5, and to bring into captivity to the obedience of Christ those who with high minds exalt themselves against the Word of God, 2 Cor. 10:4-5. We reject therefore the opposite positions of those: 1. Who affirm that the conversion of wicked men is not an effect intended that it should be produced by virtue of the ecclesiastical ministry as a means appointed to that end; and therefore that never any are converted by the pastors of the Church by virtue of any ecclesiastical office but by accident, as they are gifted Christians: affirming that ordinarily the conversion of such as go astray is by such Christians endued with gifts of prophesy. But it is certain from the holy Scripture that the ecclesiastical ministry is appointed by God for this end, as the ordinary means whereby such as are strangers and enemies to God may be reconciled, 2 Cor. 5:20, and brought to Christ, 2 Cor. 11:2-4. 2. Of those who affirm that sincere conversion of men is a certain argument that those by whose preaching the Word they are converted are sent of God, according to that Rom. 10:14-15; Jer. 23:32. But we judge that the sending which the apostle speaks of, Rom. 10:14-15, is a sending to an office in a due order, whether extraordinary or ordinary, ecclesiastically performed; and that it consists not only in conferring gifts, whereby a man is made fit for the ministery, or prophecy, but in conferring authority and conveying ministerial authority; as the Protestants prove by manifest arguments against the Socinians. And although private Christians in the duty of charity, and by reason of gifts wherein they are subservient to God, do convert some from their sins; yet it follows not that they are thus sent, as that they have authority as the ambassadours of Christ in his Name to preach the Word of God authoritatively; because they want [lack] the authoritative mission by the Church of Christ, whereby that ministry in the Church is conferred wherein men as the ambassadors of Christ preach the Word of reconciliation, 1 Tim. 4:14; Tit. 1:5, 9-10; 2 Cor. 5:20. Hence also our Belgic Reformed Churches acknowledge that preaching of the Word by ministers ecclesiastically called, is the ordinary means of men’s repentance and first reconciliation to God: as appears by the ecclesiastical Form of establishing pastors in the ministry of the Church through the whole Netherlands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’</cite>, pp. 67-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

— Wilhelm Apollonius, A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 67-70">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+grant+in+this+Question%3A+1.+That+private+Christians+from+the+common+duty+of+charity%2C+making+use+of+those+spiritual+gifts+which+they+have+received+from+God+for+men%E2%80%99s+edification%2C+do+sometimes+convert+to+the+faith+those+souls+which+went+astray%3B+and+bring+those+who+live+in+the+world%2C+out+of+the+Church%2C+unto+the+body+of+the+Church+of+Christ.+See+Jn.+4%3A29%2C+etc.+1+Cor.+7%3A16.+2.+We+do+not+think+that+the+office+of+him+who+preaches+the+Word%2C+as+sent+of+God+and+the+Church%2C+do+confer+any+efficacy+to+the+Word+preached+by+him%3B+or+has+any+influence+upon+the+soul+of+him+that+is+converted.+For+the+power+of+God+only%2C+and+the+Spirit+which+accompanies+the+Word+preached%2C+does+give+to+the+Word+preached+a+virtue+and+saving+efficacy+for+the+conversion+and+salvation+of+souls%2C+1+Cor.+12%3A11+and+15%3A10.+But+we+affirm+that+the+Word+preached+by+him+who+is+ordained+to+an+ecclesiastical+office%2C+and+does+by+his+ecclesiastical+office+authoritatively+preach+the+Word%2C+is+the+ordinary+means+to+which+God+does+by+the+efficacy+of+his+Spirit+give+assistance+for+the+conversion+of+those+who+live+in+sin+out+of+Church-communion.+So+that+pastors%2C+as+pastors%2C+by+virtue+of+their+pastoral+office+are+the+ordinary+means+of+the+conversion+of+those+men+who+live+in+the+world.+This+assertion+is+proved%3A+1.+Because+faith+is+given+and+first+attained+by+the+Word+preached%2C+by+those+who+by+an+ecclesiastical+call+are+sent+of+God%2C+to+the+pastoral+Office%2C+and+by+virtue+of+mission+and+function+preach+the+Word%2C+whereby+faith+is+wrought+in+man.+See+Rom.+10%3A14-15%3B+1+Cor.+3%3A19%3B+Gal.+3%3A2.+2.+Because+pastors+of+Churches+by+reason+of+the at+it+consists+not+only+in+conferring+gifts%2C+whereby+a+man+is+made+fit+for+the+ministery%2C+or+prophecy%2C+but+in+conferring+authority+and+conveying+ministerial+authority%3B+as+the+Protestants+prove+by+manifest+arguments+against+the+Socinians.+And+although+private+Christians+in+the+duty+of+charity%2C+and+by+reason+of+gifts+wherein+they+are+subservient+to+God%2C+do+convert+some+from+their+sins%3B+yet+it+follows+not+that+they+are+thus+sent%2C+as+that+they+have+authority+as+the+ambassadours+of+Christ+in+his+Name+to+preach+the+Word+of+God+authoritatively%3B+because+they+want+%5Black%5D+the+authoritative+mission+by+the+Church+of+Christ%2C+whereby+that+ministry+in+the+Church+is+conferred+wherein+men+as+the+ambassadors+of+Christ+preach+the+Word+of+reconciliation%2C+1+Tim.+4%3A14%3B+Tit.+1%3A5%2C+9-10%3B+2+Cor.+5%3A20.+Hence+also+our+Belgic+Reformed+Churches+acknowledge+that+preaching+of+the+Word+by+ministers+ecclesiastically+called%2C+is+the+ordinary+means+of+men%E2%80%99s+repentance+and+first+reconciliation+to+God%3A+as+appears+by+the+ecclesiastical+Form+of+establishing+pastors+in+the+ministry+of+the+Church+through+the+whole+Netherlands.%E2%80%9D%0A%0A%E2%80%94+Wilhelm+Apollonius%2C+A+Consideration+of+Certain+Controversies+at+this+Time+Agitated+in+the+Kingdom+of+England%2C+Concerning+the+Government+of+the+Church+of+God+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+67-70&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F546a5fc60b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/546a5fc60b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=We%20grant%20in%20this%20Question%3A,the%20Church%20through%20the%20whole%20Netherlands." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. What is essential for making a minister who is extraordinarily called of God, is not ever more essential to the making of a minister ordinarily called of God, in an island where the Gospel is: if all the pastors should die, the people might choose pastors to themselves, but they could not then make pastors; God only, without the ministry of other pastors, in that case should make pastors; but it follows not hence that pastors ordinarily have not their calling to be pastors from the ordination of pastors.</p></blockquote>

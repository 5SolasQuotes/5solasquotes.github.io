<blockquote><p>Indeed the wages of the laborers who mowed your fields, which you kept back by fraud, cry out; and the cries of the reapers have reached the ears of the Lord of Sabaoth (James 5:5)

In his commentary on the above verse, John Calvin condemns some of the cherished sins of free-market economics and laissez-faire capitalism as acts of tyranny and oppression:

Behold, the hire. He now condemns cruelty, the invariable companion of avarice. But he refers only to one kind, which, above all others, ought justly to be deemed odious. For if a humane and a just man, as Solomon says in Prov. xii. 10, regards the life of his beast, it is a monstrous barbarity, when man feels no pity towards the man whose sweat he has employed for his own benefit. Hence the Lord has strictly forbidden, in the law, the hire of the labourer to sleep with us (Deut. xxiv. 15). Besides, James does not refer to labourers in common, but, for the sake of amplifying, he mentions husbandmen and reapers. For what can be more base than that they, who supply us with bread by their labour should be pined through want? And yet this monstrous thing is common; for there are many of such a tyrannical disposition, that they think that the rest of mankind live only for their benefit alone.

But he says that this hire crieth, for whatever men retain either by fraud or by violence, of what belongs to another; it calls for vengeance as it were by a loud voice. We ought to notice what he adds, that the cries of the poor come to the ears of God, so that we may know that the wrong done to them shall not be unpunished. They, therefore, who are oppressed by the unjust ought resignedly to sustain their evils, because they will have God as their defender. And they who have the power of doing wrong ought to abstain from injustice, lest they provoke God against them, who is the protector and patron of the poor. And for this reason also he calls God the Lord of Sabaoth, or of hosts, intimating thereby his power and his might, by which he renders his judgment more dreadful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the catholic epistles</cite>, trans. and ed. John Owen (1551; n.p., 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 345.</span></figcaption>

<blockquote><p>The State, considered in its corporate character, is a MORAL PERSON, with a moral standing and responsibility. It is not the creation of the so-called social compact or of the popular will, but a divine institution based on natural religion. It coheres by a moral and religious bond; and its rulers are the lieutenants of God. If the State is a moral person, capable of performing duty, of committing sin, and suffering punishment, which everyone must own who traces the fate of nations according to the divine word, it follows that a nation, acting by its rulers, can accept Christianity and make a public profession of it as the national rule and guide. It had been held together previous to the recognition of Christianity by some form of religion however impure, without which it could not have existed. And the first duty of the civil ruler when brought in contact with Christianity and persuaded of its divine origin is to RECEIVE THE BIBLE AS A REVELATION in a national way. The immediate effect of this is that it constitutes the State a Christian State, and pledges it to purge out its previous religion in the same way as Pagan and Mahommedan nations constituted themselves, according to their false religions, or as the atheistic state was constituted, or rather attempted to be constituted, by the French Convention. A nation must have a religion, and the only question is, which it will adopt. And when Christianity comes to the nation, or to the family, it does not frown on either of these institutions, which also are divine in origin, but enters into them with an elevating purifying power, and sweetly coalesces with all that is purely human in both. These ordinances of God now became vessels by which Christianity is diffused. The national recognition of the Bible as a revelation subjecting the nation to its authority, though a great step gained, does not exhaust the nation’s duty, as widely diverging views prevail upon the right interpretation of the Bible. The State must by the necessity of the case ADOPT A CREED which will commonly be prepared by the Church. The same duty that devolves upon an individual Christian confronts a Christian State, and it naturally appends the civil sanction to the Church’s creed. It must distinguish between scripture truth and its perversion. The State, by the adoption of a creed, gives utterance to the self-consciousness of a Christian community. It confesses the Christianity it has adopted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Theory of Ecclesiastical Establishments and How Far the Theory is Realised</cite>, (1875), pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-9c76f5e336" data-kw="">
<blockquote><p>And just.] Hereby is meant, that he shewed and made proof of that simplicity and uprightness of his heart, outwardly by his just and honest dealing, as Job by the importunity of his friends’ accusations is driven afterwards to witness of him self in the 29. &amp; 31. Chapters. For that which James speaketh of faith, that that only is a true and lively faith which sheweth it self by good works, must also be applied to all other virtues. Wherefore Aristotle in his first book of Ethics did herein very well (although otherwise he neither knew the chief virtues nor the true cause and the true effects of the rest) that he imagined the chief good not to consist in bare virtue by it self, but rather in the operation and action of virtue.

But peradventure you will say, if he be an upright man who walketh in the right way, and the right way be the Law of the Lord, which was not yet given when these things happened unto Job, how is it that he is called an upright man? Hereunto the Apostle maketh answer in the second to the Romans and the fourteenth verse, that to the Gentiles their conscience was a Law accusing or excusing the deeds of everyone of them. And surely so it is.

For whereas God in the Mount Sinai delivered to his people the ten Commandments contained in two tables, we are not thereof to gather, that then and not before, God prescribed what duties men were to perform to God and their neighbours, but rather, that he then renewed that immutable law of Nature, which was from the beginning written in the hearts of all men, and from whence all good laws have been derived; partly to the end the Israelites might be shut out from all excuse, as who had been twice taught, that is, first of Nature, as all other nations, and then more specially of God him self; and partly because at the same time the true religion of God, intreated of in the first table, was turned into idolatry and worshipping of many Gods: yea the duties of honest behaviour and justice to be observed, kept, and maintained between man and man, which belong to the second table, began to be forgotten and to be quite perverted; as may appear by the laws and customs of divers countries.

For with the Lacedemonians it was accounted no dishonesty to steal; with the Egyptians it was lawful for the brother to join in marriage with his own sister: that I say nothing of the incestuous pollutions of the Canaanites, whereof the Lord him self witnesseth unto his servant Moses. Hereunto may be added the having of more wives at once, as also divorcements; both which God did bear in the Jews almost (that I may so speak) against his will, for the hardness of their hearts. Job therefore walked not in this sort, but, no doubt, he was in that country a most notable and singular example of all true godliness and virtue.</p></blockquote>

+who+had+been+twice+taught%2C+that+is%2C+first+of+Nature%2C+as+all+other+nations%2C+and+then+more+specially+of+God+him+self%3B+and+partly+because+at+the+same+time+the+true+religion+of+God%2C+intreated+of+in+the+first+table%2C+was+turned+into+idolatry+and+worshipping+of+many+Gods%3A+yea+the+duties+of+honest+behaviour+and+justice+to+be+observed%2C+kept%2C+and+maintained+between+man+and+man%2C+which+belong+to+the+second+table%2C+began+to+be+forgotten+and+to+be+quite+perverted%3B+as+may+appear+by+the+laws+and+customs+of+divers+countries.%0A%0AFor+with+the+Lacedemonians+it+was+accounted+no+dishonesty+to+steal%3B+with+the+Egyptians+it+was+lawful+for+the+brother+to+join+in+marriage+with+his+own+sister%3A+that+I+say+nothing+of+the+incestuous+pollutions+of+the+Canaanites%2C+whereof+the+Lord+him+self+witnesseth+unto+his+servant+Moses.+Hereunto+may+be+added+the+having+of+more+wives+at+once%2C+as+also+divorcements%3B+both+which+God+did+bear+in+the+Jews+almost+%28that+I+may+so+speak%29+against+his+will%2C+for+the+hardness+of+their+hearts.+Job+therefore+walked+not+in+this+sort%2C+but%2C+no+doubt%2C+he+was+in+that+country+a+most+notable+and+singular+example+of+all+true+godliness+and+virtue.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Job+Expounded+%E2%80%A6+Partly+in+Manner+of+a+Commentary%2C+Partly+in+Manner+of+a+Paraphrase.+Faithfully+Translated+out+of+Latin+into+English%2C+%28Cambridge%3A+John+Legatt%2C+1589%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c76f5e336.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c76f5e336.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/03/theodore-beza-on-job-and-the-law-of-nature/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>That our Conversations must be such as is beyond such as live under the Law, for the Law of God goes higher than the light of Nature, for there’s more revealed there than in the light of Nature. It’s true, that that you call the moral Law, the light of Nature, if it be clear it is suitable to it, to the most part of it, only there is some part that is positive, but most part is but suitable to the principles of Nature if they were clear and pure; but now because, since the fall of Man, the light of Nature is darkened, and the principles of Nature are much corrupted, therefore God hath given His Law, that is as it were a glass of His Will, that is, the clear glass of what was written in the heart of man in Innocence, that’s the Law: Only there is that of the limitation of the seventh Day particularly from the Creation that hath somewhat positive in it, but take all the other and (I say) it is nothing but as a glass of what was written in the heart of man in the time of Innocency:

There was written in man’s heart to keep some solemn time for the worship of God, only the specification was by revelation, but the substance of all those ten Commandments (I say) is the glass of what was written in the heart of man in Innocency: And because God saw that this writing was so much blotted out, almost all obliterated, therefore God wrote it in Tables of stone, whereas it was written in the Table of man’s heart at first; But now when He comes to bring men to the Gospel there He writes over that Law again in the Tables of their hearts: At first it was written in the heart of Adam, but he falling, doth blot it out in a great measure, then God writes it over fair again, but how? He writes it over in a fair Copy, but it is in Tables of stone: but when God receives any soul in the Gospel He writes it over again in the Tables of their hearts[.]</p></blockquote>

<blockquote><p>One of the best known and most esteemed of John Owen’s works. It is unnecessary to say that he is the prince of divines. to master his works is to be a profound theologian. Owen is said to be prolix, but it would be truer to say that he is condensed. His style is heavy because he gives notes of what he might have said, and passes on without fully developing the great thoughts of his capacious mind. He requires hard study, and none of us ought to grudge it.” – Spurgeon Allen, James – Serious Advice to delivered ones from sickness or any other dangers threatening death, how they ought to carry it that their mercies may be continued, and other misery prevented, or, The healed ones prophulacticon, or healthful diet, delivered in several sermons on John 5:14 (Boston, 1679) Allen (1632-1710) appears to have been a faithful, New England minister. Here are about 15 or so other works of his. Sibbes, Richard – ‘A Rescue from Death, with a Return of Praise’ Works, 6.133-57 on Ps. 107:17 ff. Mather, Cotton – ‘Mens Sana in Corpore Sano. A Discourse upon Recovery from Sickness. Directing how Natural Health, may be Improved into Spiritual: especially by them that have Lately Recovered it’ (Boston, 1698) . 1700’s Wadsworth, Benjamin – ‘Christian Advice to the Sick and Well. In Answer to these Questions:

I. What should Christians do, when under bodily sickness?

II. How should Christians in health, improve the sickness of others; and how should they carry it towards the sick?

III. How should Christians behave themselves, when recovered from sickness? And, None but the Righteous Saved: a Sermon on 1 Cor. 6:9’ Ref (Boston, 1714) Newton, John – Letter 36, ‘To a Gay [Merry] Friend, on his Recovery from Illness’ Works (London, 1808), vol. 1 (of 6), pp. 353-7 . . On Visiting the Sick, especially Church Officers Articles 1500’s Calvin, John – ‘Visitation of the Sick’ in Calvin’s Tracts: containing Treatises on the Sacraments… vol. 2, trans. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c29c6c9eca" data-kw="">
<blockquote><p>But in that chapter: 1. He [John Saltmarsh, an antinomian] denies the Trinity and makes the three Persons (as Mr. Beacon does, in his Catechisme also pp. 47-51) but manifestations of God. Thus God being infinitely one, yet in a threefold manifestation (says he) to us of Father, Son and Spirit, etc. a person is not a manifestation, but has need to be manifested to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, … (London, 1648), pt. 1, ch. 32, pp. 275-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-818604a118" data-kw="">
<blockquote><p>Conclusion 9: All the divine attributes, although they are really the same and can be predicated of each other in the identical sense, and also the proper effects and determinations of any one attributed to any other attribute, yet in the formal sense they are not predicated of each other without implication of contradiction. For example, the mercy of God formally is His anger or corrective and punitive justice, God hates sin, and condemns and afflicts the sinner with eternal punishments through mercy. But the reason for this implication is because the divine attributes are virtually distinguished, and insofar as they are distinguished they cannot formally be one and the same thing, because their formal effects, for example, to hate and to pity, to save Peter, and to punish Judas, are not formally the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | On the Power of God, pt. 2, p. 372</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-ed007f0056" data-kw="">
<blockquote><p>The argument of this thesis is that the explanatory power of the doctrine of divine simplicity has significant ramifications on our understanding of other doctrines of God. I argue that these ramifications can be seen in four distinct theological areas: the doctrine of divine aseity, the doctrine of divine immutability, God’s relationship with moral goodness, and in perfect being theology.</p></blockquote>

</figure><figure class="quote" id="q-d874f8adcc" data-kw="attributes not accidental">

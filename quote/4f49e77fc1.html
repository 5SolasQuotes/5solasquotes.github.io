<blockquote><p>47. The matter may further be thus illustrated: There is almost the like respect and consideration of the Magistrate as he is occupied about the outward things of the Church, and of the ecclesiastic ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience. It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the Word of God, and out of it to show to the Magistrate his duty, to wit, how he ought to govern the commonwealth and in what manner he ought to use the sword. The former is proper and peculiar to the Magistrate (neither does the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers. … 63. The same sin therefore in the same man may be punished one way by the civil, another way by the ecclesiastical power; by the civil power under the formality of a crime, with corporal or pecuniary punishment; By the ecclesiastical power, under the notion and nature of scandal, with a spiritual censure, even as also the same civil question is one way deliberate upon and handled by the Magistrate in the Senate or place of Judgment; another way by the minister of the Church, in the presbytery or synod; by the magistrate so far as it pertains to the government of the commonwealth, by the minister, so far as it respects the conscience; for the ecclesiastical ministry also is exercised about civil things spiritually, in so far as it teaches and admonishes the magistrate out of the Word of God what is best and most acceptable unto God, or as it reproves freely unjust judgments, unjust wars, and the like, and out of the Scripture threatens the wrath of God to be revealed against all unrighteousness of men; So also is the magistrate said to be occupied civilly about spiritual things.</p></blockquote>

<blockquote><p>9. [Maxwell’s accusation of presbyterians is false:] That the king must submit his sceptre to the presbytery. The king’s sceptre is his royal office, which is not subject to any judicature, no more than any lawful ordinance of Christ; but if the king, as a man, blaspheme God, murder the innocent, advance belly-gods (such as our prelates for the most part were) above the Lord’s inheritance, the ministers of Christ are to say, ‘The king troubles Israel, and they have the keys to open and shut heaven to, and upon the king, if he can offend.’ … 21. It is false that presbyteries usurp both swords because they censure sins which the civil magistrate should censure and punish. Elijah might be said then to mix himself with the civil business of the kingdom, because he prophesied against idolaters’ killing of the Lord’s prophets; which crime the civil magistrate was to punish. But the truth is, the assembly of Glasgow, 1637, condemned the prelates because they, being pastors, would be also lords of parliament, of session, of secret council, of exchequer, judges, barons, and in their lawless high commission, would fine, imprison, and use the sword. … 29. It is a lie that our General Assembly may repeal [civil] laws, command and expect performance of the king, or then excommunicate, subject to them, force and compel king, judges and all, to submit to them. They may not force the conscience of the poorest beggar, nor is any Assembly infallible, nor can it lay bounds upon the souls of judges, which they are to obey with blind obedience — their power is ministerial, subordinate to Christ’s law; and what civil laws parliaments make against God’s Word, they may authoritatively declare them to be unlawful, as though the emperor (Acts 15) had commanded fornication and eating of blood. Might not the Assembly forbid these in the synod?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, pp. xxii-xxiii</span></figcaption>

<blockquote><p>1. Whether men should be compelled to communicate with any church by corporal penalties?… 1. It were happy if the sword could compel unbelievers to believe, but it cannot, nor is a way which nature or Scripture ever allowed man to use for such an end. 2. To force an unbeliever to lie, by saying he believes, is a sin. 3. An infidel must not be baptized till he profess with seeming seriousness and willingness that he believes in God, the Father, Son and Holy Ghost, and will vow and devote himself to Him: Therefore to force the unwilling to be baptized, is a sacrilegious profanation of baptism. 4. To be baptized is to be solemnly invested in a visible state of regeneration, pardon, adoption, and right to Christ and life eternal, by a ministerial delivery of such right as in the name of Christ. But no unwilling person has any right to these invaluable gifts: Therefore no unwilling person should be forced to receive the said investiture. 5. Christ’s trial and description of the willing, is, whether they resolve to accept of his grace, forsaking all worldly interest that stands against it: Lk. 14:26-27, to the end. Therefore to baptize all that are forced to it by the sword, and had rather be baptized, and say they believe, than lose all they have, and lie in gaol [prison], is to preach another Gospel in part 6. Persons baptized in infancy, have no right to communion in the Lord’s Supper, till they profess their personal faith and consent to the baptismal Covenant: And the unbaptized are not to be forced to communicate: The Lord’s Supper redelivering all the same great invaluable gifts to the receivers which were delivered in baptism; the unwilling are no more capable of one, than the other. And to force them to say they are willing, and to receive that which they have no right to, is sacrilegious profaning holy things. 7. The ancient Churches for many hundred years, were so far from forcing any to baptism or Church-communion, or thinking that they should be forced, that they admitted none that did not earnestly desire it: And if the baptized by impenitency, or apostasy, or a long withdrawing from communion, did show themselves again uncapable by unwillingness, they declaratively cast them out. 8. And that the excommunicate, as such, should be laid up in prison, and undone, to force them again to be willing to be Christians or to communicate, has the same reasons against it, as against doing it at the first; and to take them for willing and capable of absolution, and salvation, who had rather say, they repent and consent, than lie in gaol, is to pervert Christ’s gospel and sacraments, and confound the Church: And the ancient Churches would have abhorred the notion of such a thing. 9. But it is just and meet that princes make a difference between Christian and infidel subjects; and between those that live willingly in communion of the Church, and those that refuse it: And that a Christian kingdom should give those powers and immunities to willing Christians, which they give not to infidels and the justly excommunicate; especially in matters relating to government, legislative and judiciary, and especially about religion, and the Church. And if any to obtain such immunities or powers, do hypocritically profess Christianity and consent, themselves only are guilty of the profanation, no wrong means was used, and the Church is no searcher of the heart. 10. But Christianity being necessary to our salvation; and it being the Christian magistrate’s duty to do his best for the salvation of all his subjects, and knowledge being the means of consent, and teaching and learning the means of knowledge; it is the duty of such magistrates to provide sufficient teachers for number and quality for all the subjects; and to compel men to hear, consider, and learn, as catechumens: The ancient Churches had their previous instructions for such, who were yet dismissed before the communion exercises, proper to the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts... (1684), Unnecessary Separating Disowned, p.</cite></span></figcaption>

unwilling+are+no+more+capable+of+one%2C+than+the+other.+And+to+force+them+to+say+they+are+willing%2C+and+to+receive+that+which+they+have+no+right+to%2C+is+sacrilegious+profaning+holy+things.+7.+The+ancient+Churches+for+many+hundred+years%2C+were+so+far+from+forcing+any+to+baptism+or+Church-communion%2C+or+thinking+that+they+should+be+forced%2C+that+they+admitted+none+that+did+not+earnestly+desire+it%3A+And+if+the+baptized+by+impenitency%2C+or+apostasy%2C+or+a+long+withdrawing+from+communion%2C+did+show+themselves+again+uncapable+by+unwillingness%2C+they+declaratively+cast+them+out.+8.+And+that+the+excommunicate%2C+as+such%2C+should+be+laid+up+in+prison%2C+and+undone%2C+to+force+them+again+to+be+willing+to+be+Christians+or+to+communicate%2C+has+the+same+reasons+against+it%2C+as+against+doing+it+at+the+first%3B+and+to+take+them+for+willing+and+capable+of+absolution%2C+and+salvation%2C+who+had+rather+say%2C+they+repent+and+consent%2C+than+lie+in+gaol%2C+is+to+pervert+Christ%E2%80%99s+gospel+and+sacraments%2C+and+confound+the+Church%3A+And+the+ancient+Churches+would+have+abhorred+the+notion+of+such+a+thing.+9.+But+it+is+just+and+meet+that+princes+make+a+difference+between+Christian+and+infidel+subjects%3B+and+between+those+that+live+willingly+in+communion+of+the+Church%2C+and+those+that+refuse+it%3A+And+that+a+Christian+kingdom+should+give+those+powers+and+immunities+to+willing+Christians%2C+which+they+give+not+to+infidels+and+the+justly+excommunicate%3B+especially+in+matters+relating+to+government%2C+legislative+and+judiciary%2C+and+especially+about+religion%2C+and+the+Church.+And+if+any+to+obtain+such+immunities+or+powers%2C+do+hypocritically+profess+Christianity+and+consent%2C+themselves+only+are+guilty+of+the+profanation%2C+no+wrong+means+was+used%2C+and+the+Church+is+no+searcher+of+the+heart.+10.+But+Christianity+being+necessary+to+our+salvation%3B+and+it+being+the+Christian+magistrate%E2%80%99s+duty+to+do+his+best+for+the+salvation+of+all+his+subjects%2C+and+knowledge+being+the+means+of+consent%2C+and+teaching+and+learning+the+means+of+knowledge%3B+it+is+the+duty+of+such+magistrates+to+provide+sufficient+teachers+for+number+and+quality+for+all+the+subjects%3B+and+to+compel+men+to+hear%2C+consider%2C+and+learn%2C+as+catechumens%3A+The+ancient+Churches+had+their+previous+instructions+for+such%2C+who+were+yet+dismissed+before+the+communion+exercises%2C+proper+to+the+faithful.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Defended+against+both+Extremes%2C+and+Unnecessary+Division+Confuted+in+Five+Parts...+%281684%29%2C+Unnecessary+Separating+Disowned%2C+p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa38b87c94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa38b87c94.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-civil-magistrates-authority-around-spiritual-things-circa-sacra/#:~:text=1.%20Whether%20men%20should%20be%20compelled,communion%20exercises%2C%20proper%20to%20the%20faithful." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Answer [of Rutherford]: It is a calumnious consequence: pastors and teachers will not be judged by the magistrate in things merely ecclesistical, to stand to his ecclesiastical decision, as if his lips, ex officio, should preserve knowledge; Therefore, pastors and doctors do exempt themselves from the lawful power of the magistrate in his civil judging by the sword; it is as if they would say, Churchmen refuse to submit to an usurped and unlawful power of the magistrate; Therefore, they refuse to submit to their lawful power.</p></blockquote>

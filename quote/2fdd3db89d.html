<main class="wrap"><figure class="quote" id="q-2fdd3db89d" data-kw="">
<blockquote><p>So also no bodily sports, recreations and pleasures are to be tolerated or used merely to cherish the flesh, to refresh the body, and to procure bodily strength, but only such as are in very deed needful in themselves, and used and intended by God’s people with this purpose, and to this end, that they may with more ability, alacrity, and cheerfulness do the holy works and perform the holy duties of God’s worship and service which are proper to the Lord’s holy day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (1638), ch. 21 Westminster divine, p. 156</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-375ecdb9c1" data-kw="">
<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>

</figure><figure class="quote" id="q-69bd674b2a" data-kw="">
<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-832527ca0f" data-kw="">
<blockquote><p>It was unlawful for God’s people under the Old Testament to spend any part of the Sabbath in carnal pleasures and recreations, it is unlawful for us under the New… That such recreations were prohibited to the Jews, I believe none will deny… [by] the Fourth Command and Isa. 58:13 forecited… we are bound to abstain from those recreations upon the Sabbath, as well as the Jews… but the Jews were bound to abstain from carnal recreations on the Sabbath, upon moral grounds, which concern us as well as them… the reasons of the Fourth Command are moral… every one of them levels as much against worldly recreations on the Sabbath Day as against worldly employments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning the Sanctification of the Lord’s Day</cite>, … 3rd ed. (1716; Edinburgh: Lumisden, 1745), pp. 75-76</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4ad73332b1" data-kw="">
<blockquote><p>With respect to the word juftification, we have already shown, I hope, that in the writings of St. Paul it signifies the action of God, as a judge, acquitting man, pronouncing him just, and conferring upon him the reward of eternal life. Concerning this there is no dispute… Faith then, to which justification is attributed by St. Paul, is not to be undertood as one single virtue, but denotes the whole condition of the gospel covenant, that is, comprehends in one word, all the works of Chriftian piety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-bull.html">George Bull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Harmonia Apostolica, or the Mutual Agreement of St. Paul &amp; St. James, comprising a Complete View of Christian Justification</cite>, … tr. Thomas Wilkinson (1669-1670; London: Rivington, 1801) 320 pp. ToC, p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-4ee5d0584b" data-kw="">
<blockquote><p>There is a twofold charge commenced against us, [1] as sinners, and breakers of the Law; [2] as hypocrites and unsound believers. To the first we have nothing but the merits of Christ to plead; to the second, a fruitful obedience; or else, Paul in the opposition between works and faith, means by works, legal observances; by faith true Christianity [inclusive of it working; see Manton’s larger context]. The Jews boasted of their legal observances, to the rejection of the faith of Christ; and James by faith, [meant] a dead faith; and by works, [he meant] Christian duties, or acts of obedience to God; not external observances of the law of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 336</span></figcaption>

</figure><figure class="quote" id="q-2e9a0f1074" data-kw="">
<blockquote><p>We constantly want to justify ourselves before God, to be good enough without Christ. But God does not want us to trust in our goodness. He does not want us to make up for our past sins through present obedience. He does not want us to think that we are good enough to go to heaven by comparing ourselves to the Hitlers and Stalins of the world. Comparisons are useless when it comes to establishing righteousness before God. God crucified His one and only Son for our justification, and He wants us to trust in Him alone. When it comes to being justified, faith plus anything else is quicksand. The only ground for right standing before God is Christ Jesus grabbed ahold of by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-harvey.html">Jay Harvey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Don’t Call it a Comeback</cite>, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

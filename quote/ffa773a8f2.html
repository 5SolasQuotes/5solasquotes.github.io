<main class="wrap"><figure class="quote" id="q-ffa773a8f2" data-kw="">
<blockquote><p>But alas, how should Christ come in power to help us, whom we have rejected comming in power to convert us! Does He come now, and we will not know Him; and can we hope He will come then when we call Him? Open your hearts, all ye that fear the Lord, and let Him in… and has the Gospel of Christ lost the powerfulness? No, if it have not power to convert us, it will have power to confound us. If Christ be not suffered to come unto us, He will not be hindered from coming against us. Oh let us come unto Him, that He may come unto us: subject we our hearts and lives to the obedience of his Gospel… Let us now honor Him when He comes in grace, that He may honor us when He comes in glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the divine Second Epistle General, written by the blessed Apostle St. Peter</cite>, (London: Badger, 1633), on 2 Pet. 1:16, p. 298</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0de67ec8a" data-kw="">
<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Words of Advice to Young Men delivered in Two Sermons</cite>, … (London: Parkhurst, 1668), sermon 1, sect. 5, pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

de67ec8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f0de67ec8a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=3.%20You%20must%20open%20your%20hearts,and%20resolvedly%2C%20and%20He%20is%20yours&amp;text=3.%20You%20must%20open%20your%20hearts%20and%20give&amp;text=it%20heartily%20and%20resolvedly%2C%20and%20He%20is%20yours" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0221660955" data-kw="">
<blockquote><p>3… Oh, how little will they have to say for themselves upon whom grace waited so many years, knocking hard at the door of their hearts for acceptance, and they refused to open to it [Rev. 3:20], or bid it come in. How justly will they suffer long in the other world, to whom God was so long-suffering to no purpose in this world, Rom. 4:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling, in The Works</cite>, (d. 1673; Banner of Truth), 2.478-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

— George Swinnock, The Christian Man’s Calling, in The Works (d. 1673; Banner of Truth), 2.478-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3%E2%80%A6+Oh%2C+how+little+will+they+have+to+say+for+themselves+upon+whom+grace+waited+so+many+years%2C+knocking+hard+at+the+door+of+their+hearts+for+acceptance%2C+and+they+refused+to+open+to+it+%5BRev.+3%3A20%5D%2C+or+bid+it+come+in.+How+justly+will+they+suffer+long+in+the+other+world%2C+to+whom+God+was+so+long-suffering+to+no+purpose+in+this+world%2C+Rom.+4%3A2.%E2%80%9D%0A%0A%E2%80%94+George+Swinnock%2C+The+Christian+Man%E2%80%99s+Calling%2C+in+The+Works+%28d.+1673%3B+Banner+of+Truth%29%2C+2.478-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0221660955.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0221660955.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Oh%2C%20how%20little%20will%20they%20have,purpose%20in%20this%20world%2C%20Rom.%204%3A2&amp;text=Oh%2C%20how%20little%20will%20they%20have%20to%20say&amp;text=to%20no%20purpose%20in%20this%20world%2C%20Rom.%204%3A2" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-71d1c41f51" data-kw="">
<blockquote><p>Or it may be taken as a poetical figure designed to represent the subject more affectingly. God, in his Word and ordinances, is thus to be welcomed by us, 1. With great readiness: the doors and gates must be thrown open to Him. Let the Word of the Lord come into the innermost and uppermost place in our souls; and, if we had 600 necks, we should bow them all to the authority of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 24, verses 7-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-e00db6e50c" data-kw="">
<blockquote><p>6. But here is sad news to such who slight this salvation and refuse Jesus Christ: great will their condemnation be: The men of Nineveh shall rise up in judgment with this generation and condemn it, because they repented at the preaching of Jonah; and behold a greater than Jonah is here. The greatness of this Savior who preaches the Gospel to you and is come to save you will aggravate your condemnation. What was Jonah to Jesus Christ?… O know you, sinners, this day, that Jesus Christ, this glorious King, and Prince of the kings of the earth, this mighty Savior is come to your doors: ‘Behold, I stand at the door and knock’: Will you not open the door, nor cry to Him to help you to open to Him, to enable you to believe in Him? What do you say, shall the Son of God stand at your doors, and you not so much as ask, ‘Who is there? Who is at my door?’ Shall Christ be kept out of your hearts, and stand at your doors, whilst sin commands the chiefest room and has absolute power over you, and rules in you? How will you be able to look this blessed Savior in the face another day? Is He come through a sea of blood to offer his love to you, and to espouse you unto Himself forever, and will not you be persuaded to break your league with the old lovers, who will at last stab you at the very heart, and betray your souls into the hands of divine wrath? Nay, they have done it already: What are your lovers but your lusts… And to deliver you from them, and from that wrath which is due to you for them (I mean, for your sins) is Christ come, and this great Savior is offered to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Mine Opened</cite>, … the Substance of Near Forty Sermons… (London: Marshall, 1694), on Heb. 2:3, Application, pp. 386–87 Keach (1640–1704) was an English, Calvinistic Baptist minister.</span></figcaption>

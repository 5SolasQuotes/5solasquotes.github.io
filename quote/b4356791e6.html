<main class="wrap"><figure class="quote" id="q-b4356791e6" data-kw="">
<blockquote><p>[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea... (1642)</cite>, pp. 214-215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-935e3e47e2" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water, which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears, and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now; There is sometimes an inevitable necessity by God’s providence, and sometimes a contracted necessity through want of care and foresight: in this case the work may sometimes be done, provided that our neglect beforehand be repented of:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath in The Works of Thomas Shepard… (Boston, 1853), vol. 3, Theses Sabbaticae</cite>, pp. 258-59</span></figcaption>

</figure><figure class="quote" id="q-62b6e1860c" data-kw="">
<blockquote><p>This Sabbath is then kept holy unto the Lord, when men, after a due preparing of their hearts, and ordering of their common affairs beforehand, do not only observe an holy rest all the day from their own works, words, and thoughts, about their worldly employments and recreations (Ex 20:8; 16:23, 25-26, 29-30; 31:15-17; Isa 58:13; Neh 13:15-22); but also are taken up the whole time in the public and private exercises of his worship, and in the duties of necessity and mercy. (Isa 58:13; Mat 12:1-13)</p></blockquote>

</figure><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

<blockquote><p>3. Works needful for the comfortable passing of the Sabbath, as dressing of moderate food, and the like, may be done on the Sabbath-day; for seeing Christ allows us to lead the ox to the water, and requires not to fetch in water for him over night, he allows us to dress meat, and requires not to dress it over night. For the order in the Law of not kindling a fire pertained alone to the business of the Tabernacle, and that order of dressing what they would dress on the sixth day, pertained alone to the matter of manna. And for this we have Christ’s clear example, who being invited went to a feast on the Sabbath-day, which he might not have done if it had been unlawful to dress meat and drink on the Lord’s day, for a feast sure was not kept without some preparation of warm meat. This example of Christ we have Luke 14:1, 8, 12, which verses compared make it apparent that it was a feast whereto He was bidden amongst diverse others. So then all labors and businesses except in these three cases are unlawful, for mercy, necessity, and present needful comfort… but as sauce for work, only the spiritual pastimes of singing holy Psalms and songs as a spiritual recreation is allowed to prevent all weariness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment</cite>, p. 818</span></figcaption>

<blockquote><p>A brilliantly worded, deeply devotional, phrase-by-phrase study of Psalm 51.” – Cyril Barber . 1900’s King, Frederick LaRue – ‘Psalm 51’ in Exposition of Selected Psalms (Pennypacker, 1911), pp. 102-39 King (1823-1905) was an American minister born in NJ who graduated from Princeton University who labored in New York and Pennsylvania. Adams, John – Ps. 51, An Ideal Prayer in The Lenten Psalms in The Short Course Series (Charles Scribner’s Sons, 1912) Chappell, Clovis Gillham – ‘A Murderer’s Prayer: David, Ps. 51’ in More Sermons on Biblical Characters (NY: Doran, 1923), pp. 165-75 MacArthur, John – ‘True Confession’ on Ps. 51, a sermon (1979) Beisner, Calvin – ‘Longings of a Broken Heart: Psalm 51’ in Psalms of Promise: Celebrating the Majesty &amp; Faithfulness of God (Presbyterian &amp; Reformed, 1988), pp. 99-115 . 2000’s Ruddell, Todd – ‘Psallo: Psalm 51’ in The Confessional Presbyterian, vol. 3 (2007), pp. 273-75 at Confessional.org Keele, Zach – ‘The Stains of Guilt: A Guide for Confession in Psalm 51’, pt. 1, 2 (2023) at Heidelblog Boswell, Matthew – Create in Me a Clean Heart: Experiencing God’s Abundant Mercy in Psalm 51 (Crossway, 2026) About Blurb: “Based on sermons by Matthew Boswell, Create in Me a Clean Heart reflects on the beauty of Psalm 51. In examining the chapter’s key themes of repentance, restoration, renewal, and response, Boswell offers a fresh, unhurried look into David’s heart and the Christian walk. This rich exposition teaches readers who long for forgiveness or need to understand their own need for repentance to find hope through the joy of confession and the mercy of Jesus.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f81fff8cf4" data-kw="">
<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gaskin.html">John Gaskin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Just Defence &amp; Vindication of Gospel Ministers &amp; Gospel Ordinances Against the Quakers’ many False Accusations, Slanders &amp; Reproaches. In answer to John Horwood, his Letter, &amp; E.B. his Book</cite>, … (London, 1660), pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

e" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b579acfb7d" data-kw="">
<blockquote><p>‘God is to be worshipped in Spirit and in Truth’; no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in psalms and hymns, and spiritual songs, and the Spirit of Truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalter of David with Titles and Collects according to the matter of each Psalm: whereunto is added Devotions for the help and assistance of all Christian people, in all occasions and necessities</cite>, (London, 1647) ‘The Preface’, no page number. Taylor (1613–1667) was a conformed cleric in the Church of England who advocated for very liturgical worship. The Preface is very good, at length, with regard to the psalms. Some of the references to ‘hymns’ refer to the psalms themselves. Taylor held to predominant psalmody.</span></figcaption>

<blockquote><p>The worship of God is commanded by our assemblies to be in private families, as catechizing by the master of the family (or some other better gifted in every family; Deut. 6:6-8; Gen. 18:19; Eph. 6:1-3; 2 Tim. 3:15), and praying (Zech. 12:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 20, 13th Article, ‘Private Worship’, p. 326</span></figcaption>

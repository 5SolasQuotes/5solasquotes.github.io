<main class="wrap"><figure class="quote" id="q-ee087ca3d8" data-kw="">
<blockquote><p>The question is only concerning the children or infant seed of professing believers who are themselves baptized. And, — First, They by whom this is denied can produce no testimony of Scripture wherein their negation is formally or in terms included, nor any one asserting what is inconsistent with the affirmative; for it is weak beneath consideration to suppose that the requiring of the baptism of believers is inconsistent with that of their seed. But this is to be required of them who oppose infant baptism, that they produce such a testimony.

Secondly, No instance can be given from the Old or New Testament since the days of Abraham, none from the approved practice of the primitive church, of any person or persons born of professing, believing parents, who were themselves made partakers of the initial seal of the covenant, being then in infancy and designed to be brought up in the knowledge of God, who were not made partakers with them of the same sign and seal of the covenant.

Thirdly, A spiritual privilege once granted by God unto any cannot be changed, disannulled, or abrogated, without an especial divine revocation of it, or the substitution of a greater privilege and mercy in the room of it; for, —

1. Who shall disannul what God hath granted? What he hath put together who shall put asunder? To abolish or take away any grant of privilege made by him to the church, without his own express revocation of it, is to deny his sovereign authority.

2. To say a privilege so granted may be revoked, even by God himself, without the substitution of a greater privilege and mercy in the room of it, is contrary to the goodness of God, his love and care unto his church, [and] contrary to his constant course of proceeding with it from the foundation of the world, wherein he went on in the enlargement and increase of its privileges until the coming of Christ. And to suppose it under the gospel is contrary to all his promises, the honour of Christ, and a multitude of express testimonies of Scripture.

Thus was it with the privileges of the temple and the worship of it granted to the Jews; they were not, they could not be, taken away without an express revocation, and the substitution of a more glorious spiritual temple and worship in their room. But now the spiritual privilege of a right unto and a participation of the initial seal of the covenant was granted by God unto the infant seed of Abraham, Gen. xvii. 10, 12. This grant, therefore, must stand firm for ever, unless men can prove or produce, —

1. An express revocation of it by God himself; which none can do either directly or indirectly, in terms or any pretence of consequence.

2. An instance of a greater privilege or mercy granted unto them in the room of it; which they do not once pretend unto, but leave the seed of believers, whilst in their infant state, in the same condition with those of pagans and infidels; expressly contrary to God’s covenant. All this contest, therefore, is to deprive the children of believers of a privilege once granted to them by God, never revoked, as to the substance of it, assigning nothing in its room; which is contrary to the goodness, love, and covenant of God, especially derogatory to the honour of Jesus Christ and the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Infant Baptism and Dipping</cite>, (n.d.) in William H. Goold (ed.), The Works of John Owen, D.D. (24 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 16: 258-59.</span></figcaption>

</figure><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Infants are members of the Church of Christ</cite>, pp. 303-304 in The Doctrine of the Two Sacraments in Works, vol. 2 ed. Quick (Philadelphia, 1874)</span></figcaption>

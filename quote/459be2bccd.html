<main class="wrap"><figure class="quote" id="q-459be2bccd" data-kw="">
<blockquote><p>In the next session, S259 TU 16.7.44, the divines debated the proposed words “they are Christians &amp; holy” in relation to infants presented for baptism. A lengthy dispute pertained to what Paul had in mind. Are those baptized holy in reality or are they to be considered holy merely in federal terms, by being in a covenantal relationship with God, which may or may not involve the regenerating presence of the Holy Spirit? Thomas Goodwin claimed that the holiness in view is such that if they die they will be saved. He was uncertain whether they have the holiness of election or regeneration, but he thought they have the Holy Ghost. In short, Goodwin thought that those baptized are to be regarded as really holy, rather than simply federally holy. Lazarus Seaman countered by pointing out that this is to make a different ground for baptism. Goodwin replied by denying that infants are actually saved, but affirming that we are to judge them so. This was too much for Stephen Marshall, who said that Goodwin was wrong: our judgment of charity must not determine whom we admit to the sacrament. We have no warrant to judge that they are saved. It is sufficient that the infants of believing parents are federally holy. Rutherford agreed, pointing out that real and federal holiness are different. The Lord has election and reprobation among infants; if they are in a state of salvation, how can any be lost? To this barrage of opposition, Goodwin insisted that the question is not about the reality (whether or not the infant is regenerate) but “how I am to judge of them. I cannot judge that all are holy &amp; saved, I judge so of this child &amp; that child.” Marshall pointed to a clear mistake in Goodwin’s interpretation and application: the minister is to judge and believe that they are holy with the holiness Paul speaks of, not with any real holiness. While for Goodwin, the holiness in 1 Corinthians 7:14 is the holiness of salvation, Marshall’s rebuttal was that saving holiness infallibly saves. His underlying assumption was that since not all who are baptized will be saved, Paul cannot be referring to saving holiness. Goodwin did not give up. He agreed that an infallible judgment about an infant’s salvation was impossible, but what Paul had in view was a judgment compatible with the promise—an indefinite faith grounded on an indefinite promise. Vines countered Goodwin by denying that the text had anything to do with the judgment of the minister about the child. It applied to each and every child in relation to the parents from whom they proceed. The holiness must be present in each one who comes into the category described in the text. If the infants were really holy, there would be a passing down of such holiness from the parents, and so they would be born regenerate and really holy. Moreover, whatever the kind of holiness intended in the text, it is altogether different from the judgment of the minister. Walker then underlined the distinction between federal and real holiness—many are called holy who are yet wicked and profane. Seaman pointed out that “federall holnesse is the true ground of administration of sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly: Reading Its Theology in Historical Context’ in</cite>, ed. Carl R. Trueman, The Westminster Assembly and the Reformed Faith (Phillipsburg, NJ: P&amp;R Publishing, 2009), pp. 329–331</span></figcaption>

<blockquote><p>Peter also says that “baptism also doth now save us” (1 Peter 3:21). For he did not mean to intimate that our ablution and salvation are perfected by water, or that water possesses in itself the virtue of purifying, regenerating, and renewing; nor does he mean that it is the cause of salvation, but only that the knowledge and certainty of such gifts are perceived in this sacrament. This the words themselves evidently show. For Paul connects together the word of life and baptism of water, as if he had said, by the gospel the message of our ablution and sanctification is announced; by baptism this message is sealed. And Peter immediately subjoins, that that baptism is “not the putting away of the filth of the flesh, but the answer of a good conscience toward God, which is of faith.” Nay, the only purification which baptism promises is by means of the sprinkling of the blood of Christ, who is figured by water from the resemblance to cleansing and washing. Who, then, can say that we are cleansed by that water which certainly attests that the blood of Christ is our true and only laver?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.2</span></figcaption>

</figure><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</span></figcaption>

<blockquote><p>The prophet, in short, teaches us here what Paul has more clearly explained (Rom. 2:29), even this— that the letter is of no value before God, but that the spirit is what He requires: for Paul in these words means that the external sign is worthless, except accompanied by the reality within; for the literal circumcision mentioned by Paul is merely the external rite; in the same manner baptism with us may be called the letter, when there is no repentance and faith. But the spirit, or spiritual circumcision, is the denial of self; it is renovation, and in a word, that true conversion to God, of which the prophet speaks here. …It is yet certain that men do not bestow on themselves what God signifies by the sign of baptism; but He counsels them to seek from God the grace of his Spirit, that they might not in vain be sealed by the external rite of baptism, while destitute of its reality. When therefore the prophet bids the Israelites to take away the foreskin of their heart, it is the same as though he had said, that they were indeed liberal enough with regard to ceremonies and outward worship, but that these were empty masks unless preceded by a right disposition within.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The prophet, in short, teaches us here what Paul has more clearly explained (Rom. 2:29), even this— that the letter is of no value before God, but that the spirit is what He requires: for Paul in these words means that the external sign is worthless, except accompanied by the reality within; for the literal circumcision mentioned by Paul is merely the external rite; in the same manner baptism with us may be called the letter, when there is no repentance and faith. But the spirit, or spiritual circumcision, is the denial of self; it is renovation, and in a word, that true conversion to God, of which the prophet speaks here. …It is yet certain that men do not bestow on themselves what God signifies by the sign of baptism; but He counsels them to seek from God the grace of his Spirit, that they might not in vain be sealed by the external rite of baptism, while destitute of its reality. When therefore the prophet bids the Israelites to take away the foreskin of their heart, it is the same as though he had said, that they were indeed liberal enough with regard to ceremonies and outward worship, but that these were empty masks unless preceded by a right disposition within.”

— John Calvin, Commentary on Jeremiah, ch. 4, verse 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+prophet%2C+in+short%2C+teaches+us+here+what+Paul+has+more+clearly+explained+%28Rom.+2%3A29%29%2C+even+this%E2%80%94+that+the+letter+is+of+no+value+before+God%2C+but+that+the+spirit+is+what+He+requires%3A+for+Paul+in+these+words+means+that+the+external+sign+is+worthless%2C+except+accompanied+by+the+reality+within%3B+for+the+literal+circumcision+mentioned+by+Paul+is+merely+the+external+rite%3B+in+the+same+manner+baptism+with+us+may+be+called+the+letter%2C+when+there+is+no+repentance+and+faith.+But+the+spirit%2C+or+spiritual+circumcision%2C+is+the+denial+of+self%3B+it+is+renovation%2C+and+in+a+word%2C+that+true+conversion+to+God%2C+of+which+the+prophet+speaks+here.+%E2%80%A6It+is+yet+certain+that+men+do+not+bestow+on+themselves+what+God+signifies+by+the+sign+of+baptism%3B+but+He+counsels+them+to+seek+from+God+the+grace+of+his+Spirit%2C+that+they+might+not+in+vain+be+sealed+by+the+external+rite+of+baptism%2C+while+destitute+of+its+reality.+When+therefore+the+prophet+bids+the+Israelites+to+take+away+the+foreskin+of+their+heart%2C+it+is+the+same+as+though+he+had+said%2C+that+they+were+indeed+liberal+enough+with+regard+to+ceremonies+and+outward+worship%2C+but+that+these+were+empty+masks+unless+preceded+by+a+right+disposition+within.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Jeremiah%2C+ch.+4%2C+verse+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4c9f87ef0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c4c9f87ef0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/baptismal-regeneration#:~:text=The%20prophet%2C%20in%20short%2C%20teaches%20us,preceded%20by%20a%20right%20disposition%20within&amp;text=The%20prophet%2C%20in%20short%2C%20teaches%20us%20here%20what&amp;text=masks%20unless%20preceded%20by%20a%20right%20disposition%20within" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Nor do I know any one of our [Reformed] divines who would pronounce that the regeneration which exists in the creation of qualities (which we call sanctification—the Papal writer’s formal justification) is produced at the very moment of baptism. Nay, they all refer this regeneration or spiritual nativity to the period of adult age, in which true and living faith is implanted in the heart of a baptized person from the immortal seed of the Word, and by the operation of the Spirit. … Since, therefore, neither Arminians, nor Papists, nor Protestants acknowledge that infants, by the mere reception of Baptism itself, become partakers of those habitual endowments or spiritual qualities which are properly supposed to constitute a man just and inherently holy, no one can prove the loss of their faith or righteousness, or the apostasy of the saints by any argument derived from the case of infants.</p></blockquote>

<blockquote><p>The Dutch Reformed theologian, Gisbertus Voetius made some critical remarks on Cornelius Burgess’ book On the Baptismal Regeneration of Elect Infants, while, at the same time, arguing that baptism sealed a regeneration already produced in elect infants:

There is a seventh opinion prevalent among the Reformed doctors, which attributes regeneration to all and sundry of infants within the pale of the covenant, provided they are elect—whether they are baptized in infancy or otherwise, whether they die in infancy, whether they are educated in the faith from their birth and always lead a godly life, or whether before their death they are brought to faith and repentance by actual conversion. And I acquiesce in this opinion to a great extent. …

The opinion of this author [Burgess] pleases me insofar as he thinks that an initial regeneration of the Holy Spirit takes place in elect infants, by which is implanted the root and seed of actual conversion or renewal, to follow in its own season. But insofar as he makes this regeneration posterior to baptism, and connects it with that ordinance as a sine qua non, or a kind of moral charter to which it is attached, his opinion is not admitted by the Reformed theologians whom he himself quotes. The well-known opinion of these theologians is that the efficacy of baptism consists not in producing regeneration but in sealing a regeneration already produced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectae disputations theologicae</cite>, (Utrecht, 1648-69), vol. 2, pp 410, 412. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 150.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-ff1f25b0d8" data-kw="">
<blockquote><p>When she was baptized. Hereby it appeareth how effectually God wrought in Lydia even in a short moment. For it is not to be doubted but that she received and embraced the faith of Christ sincerely, and gave him her name, before Paul would admit her unto baptism. This was a token of mere readiness; also, her holy zeal and godliness do therein show themselves, in that she doth also consecrate her family to God. And, surely, all the godly ought to have this desire, to have those who are under them to be partakers of the same faith.

For he is unworthy to be numbered among the children of God, and to be a ruler over others, whosoever is desirous to reign and rule in his own house over his wife, children, servants, and maids, and will cause them to give no place to Christ. Therefore, let every one of the faithful study to govern and order his house so, that it may be an image of the Church. I grant that Lydia had not in her hand the hearts of all those which were of her household, that she might turn unto Christ whomsoever she would; but the Lord did bless her godly desire, so that she had her household obedient.

The godly (as we have already said) must endeavour, with might and main, to drive from their houses all manner of superstition; secondly, that they have not profane families, but that they keep them under the fear of the Lord. So Abraham, the father of the faithful, was commanded to circumcise all his servants with him; and he is commanded for the care he had to govern his house, and to instruct his family. Furthermore, if this duty be required at the hands of the householder, much more of a prince, that he suffer not so much as in him lieth the name of God to be profaned in his realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 104-05.</span></figcaption>

<blockquote><p>LXV. Regarding the unbaptized children of the faithful, there is a real controversy about whether they pertain to the Church. For such infants, according to the Romanists, do not pertain to the Church in any way, while our [Reformed] theologians contend that they follow the condition of their parents and are in God’s covenant and constitute part of the visible Church, at least pertaining to the external communion of the Church, as is particularly evident in the English [Westminster] Confession, ch. 25, and in Bucanus’ work on the Church, in the definition of the Church.</p></blockquote>

<blockquote><p>After this Examination of the Convert, this following Prayer was made.

O Eternal God, how wonderful art thou in thy works! Thou hast been found by those who have not sought thee; Thy grace hath prevented their thoughts. It is neither from him that willeth, nor from him that runneth, but from thy mercy alone that Salvation doth proceed. It is neither from the West, nor from the East, but from thy wonderful dispensation; when it pleaseth thee, thou stretchest forth thy arm from the height of Heavens to the bottom of the Abyss, to pluck out those who were already on the brink of Hell; O God who hast commanded that light should shine in the midst of darkness, enlighten the flames of thy truth amongst those who do lie in the valley of the shade of Death, that the most barbarous people may see the ways &amp; traces of thy Christ; that the pavilions of Ismael, and of Midian may be shaken, that the sheep which are not yet in thy fold may henceforth be brought into it.

Behold here a Soul which prostrates it self at thy feet to be washed in the blood of thy holy Son Jesus, in the blood of that sprinkling which speaketh for Sinners; be pleased to pardon this poor Sinner that is here present; pardon the faults committed by him in the time of his ignorance; cause thou the Scales to fast from his eyes. Create in him a new heart, that being a new Creature he may walk in righteousness and holiness. Cause thou that the Baptism which according to thy ordinance we do confer upon him be effectual to his salvation, that it may redound to the glory of thy great name, to the joy of thy Angels, and to the comfort of those who love thy Anointed who is blessed for evermore.

Immediately after this Prayer, the Convert being on his knees was baptized, presented by Monsieur Armand of Caumont Marquis of Montpouillan, and the Lady Adrian de Mayern who were his Godfather and Godmother, from whom he received the name of Armand Adrian.</p></blockquote>

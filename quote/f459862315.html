<blockquote><p>The central thesis of this study argues that the Christology of the prominent English Reformed theologian Thomas Goodwin (1600-1680) is grounded in, and flows out of, the eternal intra-trinitarian covenant of redemption…” – the bookflap See the review of Dr. Ryan McGraw through the ‘Buy’ link. Woo, Hoon – The Promise of the Trinity: the Covenant of Redemption in the Theologies of Witsius, Owen, Dickson, Goodwin &amp; Cocceius Abstract (V&amp;R, 2018) 317 pp. Abstract – “The doctrine formulated by Owen endorses the doctrines of inseparable operations and terminus operationis so as to give deep insight into the Trinity. In Dickson’s doctrine, the Son’s voluntary consent and obedience to the will of the Father are highly emphasized. Likewise, Goodwin’s depiction of the Holy Spirit secures the divinity of the Spirit as well as his indispensable role for the transaction and accomplishment of the pactum. The doctrine in the theology of Cocceius sheds much light on the vibrant dynamic of the Christian life in accordance with the ordo salutis.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d9cd7e3bb" data-kw="">
<blockquote><p>Q. And what does God promise to bring the elect into in the Covenant of Grace? A. Into an estate of salvation. … Q. How does God promise to do all this? A. By a Redeemer, Isa. 53:10, ‘When Thou shalt make his soul an offering for sin, He shall see his seed, He shall prolong his days, and the pleasure of the Lord shall prosper in his hand,’ v. 11, ‘He shall see of the travail of his soul, and shall be satisfied, etc.’ And this by some learned divines is called the Covenant of Redemption. Q. What do they mean by it? A. That federal transaction that was betwixt God the Father and the Son from everlasting, about the redemption of lost and fallen men. Q. Is not this the same with the Covenant of Grace? A. This covenant is a covenant of grace, but ’tis not strictly that Covenant of Grace, which the Scripture holds out in opposition to the Covenant of works; but rather the means to it, or foundation of it. Q. Wherein do these two covenants differ? A. In the confederates, for in the Covenant of Redemption, the confederates are God and Christ, but in the Covenant of Grace, the confederates are God and believers.</p></blockquote>

<blockquote><p>11. God has made more promises, donations and covenants than one or two, which must not be confounded:

1. His Law and Covenant made to and with man in innocency is one.

2. And his Law and Covenant made to and with Christ, as Mediator, is another.

3. And his absolute promise of a Saviour to the world, with the conditional promise or Law of Grace conjunct, was the first edition of another. And the Gospel, as after the incarnation promulgated, was a more perfect edition of it (to pass by Abraham’s Covenant of Peculiarity, and the Mosaical Law, as such).

12. Though Christ be promised in one of these, and be God’s antecedent gift, He may nevertheless be the Author of another, (and so far the foundation), as well as the meritorious cause.

13. That may be of free grace which is merited by Christ; yea, and that which is annexed to the evangelical worthiness of a believer.

14. That may be a condition required of us, to be done by the help of grace, which yet is the effect of that grace, and given us by God.

15. It is a true Covenant between God the Father, Son, and Holy Ghost, and man, which is solemnly entered into in baptism: And this is a Covenant of Grace, even that proceeds purely from grace; and of grace, as given by God, and by us accepted. He that will confound these various covenants, promises, and laws, on pretense of their unity (though there is doubtless a wonderful unity of all the parts both of God’s moral (signal) means, and his physical works), shall confound much of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

</figure><figure class="quote" id="q-a8bc63c528" data-kw="">
<blockquote><p>The most specious thing that could be said to the contrary is in this, that since consent of the parties, through which their wills agree to the same conditions, is the form of a covenant, and such a consent between the Father and the Son could not have obtained from eternity, because to both belong one and the same will, there also cannot be allowed a covenant between them. We meet this objection by observing that just as in God the essence, one and the same in number, is as it were contracted through the characteristic properties in such a way that three persons are constituted, so also the will, which coincides with the essence, is as it were contracted in the same manner, so that to each person belongs, with the essence, his will. This same thing is more clearly evident than the noon-day sun in the internal operations of God ad intra, as much in the reciprocal essential operations, by which for example, the Father knows the Son, and loves him, and the Son in turn the Father, as in the personal operations, by which the Father generates the Son, the Son proceeds through generation from the Father, and so forth. In addition, in the external operations, the same thing is observable in its own way, insofar as creation is asserted for the Father, redemption for the Son, and sanctification for the Holy Spirit.</p></blockquote>

<blockquote><p>1. That there is such a covenant of which they speak which was entered between God and Christ containing the transactions which pass between the Father and the Son. The tenor of which covenant we find laid down by the prophet Isaiah 53:10 ff., and commented upon by the apostle, Phil. 2:6. There we see first the work that Christ by covenant was to undergo: to make his soul an offering for sin. That is, as elsewhere is expressed, to give His life a ransom for many, and as He covenanted, so He did, “He became obedient to death, even the death of the cross” (Phil. 2:8). And that upon account of this covenant entered, Christ Himself speaking to it and of His work in it, says, “This commandment have I received of my Father” (John 10:18).

2. The reward that He was to receive which is laid down by the prophet in many words. A. “He shall see his seed” (Isa. 53:10). As Isaac being received from the dead in figure saw a seed, had an innumerable posterity, so the Lord Christ who was received from the dead in truth has His seed in like manner, believers innumerable, which are called His seed in resemblance to the seed of man. B. “He shall prolong his days”, not the days of His seed, as some would have it, making this one with the former and rendering the words videbit semen long avum, being delivered from death, He shall live and reign eternally, Rev. 1:18. C. “The pleasure of the Lord shall prosper in his hand”; He shall irresistibly do whatsoever is the Father’s pleasure to be done in the work of man’s salvation. D. “He shall see the travail of his soul, and shall be satisfied”; upon this work done, He fully enjoys the whole of all his desires. E. “Therefore will I divide Him a portion with the great, and He shall divide the spoil with the strong.” He obtains a perfect victory, has a plenary and full conquest over every adversary.

3. We yield that the whole of these covenant transactions between God and Christ was on our behalf. Making His soul an offering for sin, He offers it for those that are fallen by iniquity. All is (as is there said) for the justification of many. Whatsoever it is that upon the work done redounds to Himself. Yet the reason of undertaking was for us: Unto us He was born, unto us He was given, He was wounded for our transgressions, He was bruised for our iniquities, He was delivered for our offences, and raised again for our justification. He endured the work and we reap the benefit.

4. We confess that it is the work of Christ that we enjoy being in covenant, as it is His gift that we enjoy the blessing of ordinances.</p></blockquote>

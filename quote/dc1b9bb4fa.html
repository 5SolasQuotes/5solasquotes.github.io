<main class="wrap"><figure class="quote" id="q-dc1b9bb4fa" data-kw="">
<blockquote><p>…I say again, that I am acquainted with few comparatively that are for presbytery; but I know many that are for pastoral administration without Church-tyranny or schism.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-536663c18e" data-kw="">
<blockquote><p>The Lutherans on the contrary, by defect, decline fraternal fellowship with the Reformed, who by no means differ from them in the foundation. The Reformed pursue a middle way: (1) they reject the Socinians’ Samaritanism, that is, fraternal fellowship with those who err in the foundation, and render it useless to us (1 Cor. 3:12 with Rom. 10:3–4; Gal. 5:4), being adduced: (1)… (c) by reasons, because the fellowship of the mystical body rests upon the unity of the fundamental faith (Eph. 4:4–5). (2) With churches that err concerning the foundation, that is, which teach such things whereby, through necessary consequence, the foundation is made to fail, they do not want to rashly break church fellowship, unless perhaps they exclude us (1 Cor. 3:12; Eph. 4:4–5; Col. 2:19), after the example of Paul, who due to errors of this sort, by no means separated from the churches of Corinth, Galatia, and Colossae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology, ed. Joel Beeke, tr. Todd Rester (Reformation Heritage Books), vol. 5, bk. 7, ch. 1, §35</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>…he [John Sprint] says that the suffering of deprivation for refusing to conform breeds and produces sundry scandals. First says he, it is the occasion of fraternal discord. O egregious impudency! who sees not that the ceremonies are the incendiary sparkles from which the fire of contention has its being and burning? so that conforming (not refusing) is the furnishing of fuel and casting of faggots to the fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 2, ch. 1</cite>, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-edb152a677" data-kw="">
<blockquote><p>All the difference of religion, which is at this day between the Church of Rome and the Protestants, lies in some certain points which the Church of Rome maintains as important, and necessary articles of the Christian faith: whereas the Protestants, on the contrary, neither believe nor will receive them as such. For as for those matters which the Protestants believe, which they conceive to be the fundamentals of religion, they are evidently and undeniably such, that even their enemies admit and receive them as well as they: inasmuch as they are both clearly delivered in the Scriptures, and expressly admitted by the ancient councils and Fathers ; and are indeed unanimously received by the greatest part of Christians in all ages, and in different parts of the world. But now their adversaries add to these many other points, which they press and command men to believe as necessary; and such as, without believing in, there is no possible hope of salvation. As for example: that the Pope of Rome is the head and supreme monarch of the whole Christian Church throughout the world, that he, or at least the Church which he acknowledges a true one, cannot possibly err in matters of faith… which their adversaries plainly protest that they cannot with a safe conscience believe. These points are the ground of the whole difference between them; the one party pretending that they have been believed and received by the Church of Christ in all ages as revealed by him; and the other maintaining the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-daillie.html">John Daillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Author’s Preface’ in A Treatise on the Right Use of the Fathers in the Decision of Controversies Existing at this Day in Religion 2nd ed. (1631; Philadelphia, 1856), pp. 17-21</cite>, pp. 17-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-ae60862e38" data-kw="">
<blockquote><p>Let us 1. distinguish of opinions. Some are in the foundation, in those necessary doctrines upon which the House of God is built, 1 Cor. 3:9-10; Heb. 6:1; Mt. 7:24, the errors contrary wherereunto are pernicious and damnable, 2 Pet. 2:1. Some are only in the superstruction which do not so nearly touch the vitals and essentials of religion, which are not fidei but quaestionum, as Augustine somewhere distinguishes. Such were in the apostles’ time disputes touching meats, and drinks, and days, and things indifferent, Rom. 14:5-6, and in our days touching forms of discipline and government in the Church, wherein men abound in their own sense, with meekness and with submission to the spirits of the prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Two Sermons, one touching composing of Controversies, another touching Unity of Judgement &amp; Love amongst Brethren… (London, 1659)</cite>, pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

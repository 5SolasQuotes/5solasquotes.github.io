<main class="wrap"><figure class="quote" id="q-938ddf105b" data-kw="">
<blockquote><p>I am amazed and do tremble both in body and soul to hear at this day certain men, or rather not men but covered with man’s shape, persons of a beastly understanding, who, after so many and manifold benefits and graces of our Lord God and Saviour Jesus Christ manifested to the whole world, and confirmed with so evident testimonies of the patriarchs, prophets and apostles, approved by wondrous signs and undoubted tokens, declared to be both God and man, by the Spirit of sanctification, the eternal Son of God with power, the very express image of the substance of the Father, and revealed unto us in these later times, in the flesh born of the seed of David, in the which he hath taught us truly, and marvellously finished the mystery of our salvation, and is ascended in body into heaven, from whence his divinity abased himself for our glory, and sitteth in equal power at the right hand of the Father in his everlasting kingdom,— notwithstanding are not ashamed to rob this eternal Son of God, and our most merciful Saviour, of his infinite majesty, and to pluck him out of the glorious throne of his unspeakable deity.

O impiety of all others most detestable! O infidelity more terrible than the palpable darkness of Egypt! O flaming firebrands of hell! – as I may use the terms of the prophet Esay [Isaiah] against such apostates: was it not enough for you to be grievous unto men by manifold sects and heresies, dividing yourselves from Christ’s true catholic church, as never hitherto hath been heard of any heretical segregation, but will also be molesters unto my God, the eternal Son of God? What heart may bear such blasphemy? What eye may quietly behold such an enemy of God? What member of Christ may allow in any wise such a member of the devil? What Christian may have fellowship with such rank antichrists?

Who, having the zeal of the glory of God in his heart, cannot burst out in tears and lamentations, to hear the immortal glory of the Son of God trod under the feet by the vile seed of the serpent, whose head by his eternal godhead he hath beaten down, and therefore now lieth biting at his heel, lurking in corners? But he shall be crushed in pieces unto eternal Woe, after he hath spewed out all his venom; for brighter is the glory of our God and Christ, than it may be darkened by all the rowte [rabble] of the prince of darkness, who dwelleth in the light which is unapproachable, although these dead dogs do take upon them with their corrupt light to pierce and blemish the same to their own blinding forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-philpot.html">John Philpot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for Spitting upon an Arian</cite>, (n.d.) in Robert Eden (ed.), The Examinations and Writings of John Philpot, B.C.L., Archdeacon of Winchester: Martyr, 1555 (Cambridge: The University Press, 1842), pp 295-97.</span></figcaption>

</figure><figure class="quote" id="q-89d508a61f" data-kw="">
<blockquote><p>Such as are sincere, will be careful to maintain Family Religion, from the Conscience of the Charge they have of them. Masters and Parents have the Charge of their Families, and are in some Measure accountable to God for them. Parents are commanded to train up their Children, and Masters are to command their Household to keep the Way of the LORD, as we see in the LORD’s Testimony of Abraham.

Thus we see, in the Fourth Command, the Master of the Family is obliged to fee to the religious observance of the Sabbath by all within his House, and so he has a Charge for which he is accountable to the great GOD: And therefore a sincere Person looks on himself as bound to be careful to maintain the Worship of GOD in his Family, and amongst those whom he has the Charge of. This made holy Job concerned to sacrifice for his Children: And the Neglect of paternal Duty in Eli provoked the LORD’s Displeasure.</p></blockquote>

</figure><figure class="quote" id="q-af00fdcfb0" data-kw="">
<blockquote><p>It is true, likewise, that God directed his people under the Law to bend and bow themselves toward the ark and the temple, wherein the ark was, and the mountain whereon the temple was situate: partly lest that rude people should turn their worship another way, partly because of his promise to hear them when they should pray toward the temple or the ark; partly because of his singular manner of presence in the ark: He was said to dwell between the cherubims, the ark is called his ‘foot-stool,’ and sometime the ‘face of God,’ ‘the glory of the Lord.’ It is reason, where God is present after an extraordinary manner, as when He spake out of the bush and the cloud, that adoration be directed to the place of his extraordinary presence. The altars, the offerings and other holy things wanted [lacked] the like presence and the like promise. The ark and the cherubims upon the ark were not seen [being in the Holy of Holies]: and therefore could not be readily abused to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, … (Leiden, 1619), ‘Kneeling considered, as it is a Breach of the Second Commandment’, p. 51</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is true, likewise, that God directed his people under the Law to bend and bow themselves toward the ark and the temple, wherein the ark was, and the mountain whereon the temple was situate: partly lest that rude people should turn their worship another way, partly because of his promise to hear them when they should pray toward the temple or the ark; partly because of his singular manner of presence in the ark: He was said to dwell between the cherubims, the ark is called his ‘foot-stool,’ and sometime the ‘face of God,’ ‘the glory of the Lord.’ It is reason, where God is present after an extraordinary manner, as when He spake out of the bush and the cloud, that adoration be directed to the place of his extraordinary presence. The altars, the offerings and other holy things wanted [lacked] the like presence and the like promise. The ark and the cherubims upon the ark were not seen [being in the Holy of Holies]: and therefore could not be readily abused to idolatry.”

— David Calderwood, Perth Assembly, … (Leiden, 1619), ‘Kneeling considered, as it is a Breach of the Second Commandment’, p. 51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+true%2C+likewise%2C+that+God+directed+his+people+under+the+Law+to+bend+and+bow+themselves+toward+the+ark+and+the+temple%2C+wherein+the+ark+was%2C+and+the+mountain+whereon+the+temple+was+situate%3A+partly+lest+that+rude+people+should+turn+their+worship+another+way%2C+partly+because+of+his+promise+to+hear+them+when+they+should+pray+toward+the+temple+or+the+ark%3B+partly+because+of+his+singular+manner+of+presence+in+the+ark%3A+He+was+said+to+dwell+between+the+cherubims%2C+the+ark+is+called+his+%E2%80%98foot-stool%2C%E2%80%99+and+sometime+the+%E2%80%98face+of+God%2C%E2%80%99+%E2%80%98the+glory+of+the+Lord.%E2%80%99+It+is+reason%2C+where+God+is+present+after+an+extraordinary+manner%2C+as+when+He+spake+out+of+the+bush+and+the+cloud%2C+that+adoration+be+directed+to+the+place+of+his+extraordinary+presence.+The+altars%2C+the+offerings+and+other+holy+things+wanted+%5Blacked%5D+the+like+presence+and+the+like+promise.+The+ark+and+the+cherubims+upon+the+ark+were+not+seen+%5Bbeing+in+the+Holy+of+Holies%5D%3A+and+therefore+could+not+be+readily+abused+to+idolatry.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+Perth+Assembly%2C+%E2%80%A6+%28Leiden%2C+1619%29%2C+%E2%80%98Kneeling+considered%2C+as+it+is+a+Breach+of+the+Second+Commandment%E2%80%99%2C+p.+51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf00fdcfb0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af00fdcfb0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=It%20is%20true%2C%20likewise%2C%20that%20God,not%20be%20readily%20abused%20to%20idolatry&amp;text=It%20is%20true%2C%20likewise%2C%20that%20God%20directed%20his&amp;text=therefore%20could%20not%20be%20readily%20abused%20to%20idolatry" rel=

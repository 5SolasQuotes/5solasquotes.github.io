<main class="wrap"><figure class="quote" id="q-e33149f1c9" data-kw="">
<blockquote><p>Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused…”

<blockquote><p>Answer. None of us do teach that it is against the light of nature that the adverse party be the judge; it might fall out in a general council lawfully convened, from which there is no provocation; yea and in a national council (for all councils may err) the adverse party may judge, as it was a lawful council according to a Church-constitution that condemned Christ of blasphemy, and they were also his enemies;</p></blockquote>

</figure><figure class="quote" id="q-0e46a7aa42" data-kw="">
<blockquote><p>But if they [the Resolutioners] will extend it [the ordination vows] further, and say that it is meaned of absolute subjection to the sentence of his brethren, whether he have offended or not, they may as well, and with more color of reason, say that he is bound by his oath, not only to give subjection, but also obedience† to all their admonitions, whether just or unjust, lawful or unlawful; because there is no express limitation in the words of the oath, these qualifications, being as we said before, amongst the praecognita [assumptions] and praesupposita [presuppositions] of all such questions and answers, and there being no need to express them, except where there are grounds of jealousy.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e699dbd507" data-kw="">
<blockquote><p>Some NCC people insist that the sexual act should never be separated from the purpose of procreation… I have asked some if they stop having sex when their wives are pregnant, and they admit that they do not… I asked one NCC advocate if he continued to have sex after menopause. He said that he did… The question really boils down to whether it is ever OK to have sex when you know that the sexual union will not result in a pregnancy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’ (2017)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4055135c21" data-kw="">
<blockquote><p>Paracelsus [d. 1541] teaches that men can be produced by the chemical art in his [Opus] Paramirum [A Work Beyond-Wonder, 1531], where he makes three parts of man: elemental, celestial and divine. He denies that the first two come into heaven. There he writes thus: ‘It was doubted by the philosophers whether it could happen that a man be born outside the womb of a woman; to which I respond that it is not repugnant to chemical art and nature, but is very easy. For sperm enclosed in a cucurbit [a flask] or sealed in the womb [venter equinus] of a [living] horse, by the highest putrefaction putrefies for fifty days, until it moves, which is easy to discern. After that time, it will appear somehow similar to a fetus, yet without a body, transparent. If you then daily prudently nourish or feed this with human blood, and keep and cherish it in the equal heat of the horse’s belly, after nine months it will appear adorned with all members like an infant born from a woman, yet smaller in quantity. This thing we call a homunculus, which must afterwards be educated with careful solicitude and diligence like a true boy or infant, until it grows up.’ He adds there that those who are thus born understand all arcana and hidden things which it is otherwise impossible for men to know, because they have acquired life, body, flesh and bones by art; therefore the arts and sciences are innate to them, nor do they need to learn from elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), ‘On Creation’, pt. 10 Latin</cite>, pp. 296-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>(2) The formation of Christ’s body, to which belongs its organization, animation and the uniting of the two, body as well as soul, with the blood. 28: Query, Was Christ’s body formed in a moment or successively? Answer: Three things occur here: (1) the preparation of the material of which Christ’s body was formed; (2) the formation of the body out of the material duly prepared; (3) the completion of the same body brought gradually by its own increments to the proper stature. As regards (1) and (3) all are agreed that they were accomplished by degrees (successive). As regards (2) theologians disagree, some urging an instantaneous formation, others a successive, with the latter of whom we agree. Because: (1) the instantaneous and miraculous formation of Christ’s complete body and its union with the soul is a fiction unsupported by Scripture; (2) in his assumption of human nature Christ is said to have been made like us, except for sin; (3) if Christ’s body was completed in a moment, it could equally have been born the same moment and the Blessed Virgin need not have suffered the inconveniences of ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(XI, 27) as quoted in Heinrich Heppe, Reformed Dogmatics, ch. 17, Person of Christ, section 12</cite>, pp. 425-6</span></figcaption>

</figure><figure class="quote" id="q-59aa811627" data-kw="">
<blockquote><p>The human nature of Christ being thus formed in the womb by a creating act of the Holy Spirit, was in the instant of its conception sanctified, and filled with grace according to the measure of its receptivity… And this work of sanctification, or the original infusion of all grace into the human nature of Christ, was the immediate work of the Holy Spirit; which was necessary unto Him: for let the natural faculties of the soul, the mind, will, and affections, be created pure, innocent, undefiled,— as they cannot be otherwise immediately created of God,— yet there is not enough to enable any rational creature to live to God; much less was it all that was in Jesus Christ.</p></blockquote>

<blockquote><p>[Ps. 51:5] ‘And in sin hath my mother conceiued me.’ The [Hebrew] word iechematin, signifies properly calefacit, ‘warmed’ me in her womb, ‘fed’ or ‘nourished’ me, referring it to the action of heating and feeding the child in the womb nine month[s].</p></blockquote>

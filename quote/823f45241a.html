<main class="wrap"><figure class="quote" id="q-823f45241a" data-kw="">
<blockquote><p>18. And if the unsoundness, badness or weakness of the pastors and the faultiness of the worship, order or discipline be not so great as to make communion with the church simply unlawful, yet any free man whose edification is greatly hindered by it, and can elsewhere have far greater helps for his salvation and join with a church which walks more conformably to the Christian rule, may lawfully remove himself to such a ministry and church, when it is not to the greater hurt of others than his own good. Especially such whose ignorance, weakness and deadness makes a lively and convincing ministry more needful to their safety and welfare than it is to others: For it is a sin, caeteris paribus [other things being equal], to prefer the worse before the better, and a sin to neglect the best means for our souls which we can lawfully enjoy: And the soul is more precious than to be hazarded or left in sin and darkness for an unnecessary circumstance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord</cite>, … (London: Parkhurst, 1691), pt. 2, Question 2, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

dness%2C%20badness%20or%20weakness&amp;text=in%20sin%20and%20darkness%20for%20an%20unnecessary%20circumstance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03771f4977" data-kw="">
<blockquote><p>And sometimes the main reason why they [presbyterians] go to worship God with them is to show they hold communion with them; that though there be many things amiss, against which they bear a real testimony by their non-conformity, yet they go to them to show to the world they separate not from them, and the better to maintain that spiritual love which ought to be among the members of the churches of Christ.</p></blockquote>

<blockquote><p>Some of the special advocates of liberty of speech and opinion, are apt, when in the majority, to find out that it is very heinous to express any dissent from the decision of the General Assembly. This is not Protestantism; nor is it Christianity. It is perfectly consistent with all due deference and obedience, for any member of the Church to express without reserve his opinions as to the wisdom or justice of any decision of our ecclesiastical courts.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d49c153858" data-kw="">
<blockquote><p>…so this [spiritual] life is begun by a union between us and Christ: He lives in us by his Spirit, and we live in Him by faith, Gal. 2:20. The Spirit is the principle of life, and faith is the means to receive it; and therefore we are said, Rom. 6:5, to be planted into the likeness of Christ’s resurrection. Planting notes a union, as a bud that is put into a stock; it becomes one with the stock, and bears fruit by virtue of the life of the stock. We no sooner are planted into Christ, but we feel the power of his life, and virtue of his resurrection; He begins to live in us, and we in him, as the graft in the stock, and as the stock in the graft.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684), Sermons on 2 Cor. 5, Sermon 30, on 2 Cor. 5:15, p. 190</span></figcaption>

</figure><figure class="quote" id="q-e2f2ddb52d" data-kw="">
<blockquote><p>That we may attain unto a more clear understanding of the nature of this regeneration, so necessary to salvation: we must carefully observe with regard to the word, that both the Scriptures and also divines use it sometimes in a larger sense, to denote the whole operation of the Holy Ghost upon the souls of those who are to be saved, whereby they are brought into a state of grace, so that, besides the external call, it comprehends conversion, and even initial santification: in which sense practical divines lay down the marks, motives and means of regeneration. Sometimes the word regeneration is used in a more limited sense, as distinguished from the external call, from conversion and from sanctification: so that the external call signifies only the offer of redemption for our reception: Regeneration conveys that power into the soul, by which the person who is to be saved is enabled to receive the offer. Conversion puts forth the power received into actual exercise, so that the soul does actually receive the offered benefits. Sanctification brings forth the fruits of conversion, or of faith and repentance, in a carefulness to maintain good works, yet not so immediately but that a union with Christ and justification come between conversion and sanctification, at least in the order of nature, if not of time. It is in this stricted sense of the word we shall consider the doctrine of regeneration at present…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration</cite>, … (New Haven, 1770), | section 5, pp. 16-17</span></figcaption>

f="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=That%20we%20may%20attain%20unto%20a,the%20doctrine%20of%20regeneration%20at%20present&amp;text=That%20we%20may%20attain%20unto%20a%20more%20clear&amp;text=shall%20consider%20the%20doctrine%20of%20regeneration%20at%20present" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b21925d580" data-kw="">
<blockquote><p>Question: By what means do we receive or draw these virtues from Christ, or enjoy them in Him? Answer: This is only by faith of Him, that is, by faith receiving or going to Christ’s person, pitching on Him alone as revealed and offered in the Gospel. Doctrine: Faith in Christ’s person, name, is the only means of receiving all saving virtues from Christ, when we believe the Gospel and glad tidings offering us Christ’s person with all his benefits and virtues, and behold Him to be such a one towards us as the Gospel reveals and offers Him to us, that is, our wisdom, righteousness, sanctification, and redemption, our King, Priest, and Prophet, then is He indeed become such a one towards us, and we are made such in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/job-throckmorton.html">Job Throckmorton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Faith, as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (d. 1601; London: 1655), ch. 10, sect. 3, p. 396 Throckmorton (1545-1601) was an English puritan., pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-058361cce0" data-kw="passive first moment">
<blockquote><p>Rather the question concerns the first moment when he is converted and receives new life by regeneration. We contend that he is merely passive in this, as a receiving subject and not as an acting principle. Again, the question is not whether man is able to convert himself without grace. Rather the question is whether he is able to cooperate with that exciting grace.</p></blockquote>

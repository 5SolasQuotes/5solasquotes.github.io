<blockquote><p>§24. Proposition 11. The commands of lawful governors about lawful ceremonies are ordinarily to be understood with exceptions, though there be none expressed, as that in certain cases it is not their will that such commands should bind us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 1, p. 398</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“§24. Proposition 11. The commands of lawful governors about lawful ceremonies are ordinarily to be understood with exceptions, though there be none expressed, as that in certain cases it is not their will that such commands should bind us.”

— Richard Baxter, Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 1, p. 398">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A724.+Proposition+11.+The+commands+of+lawful+governors+about+lawful+ceremonies+are+ordinarily+to+be+understood+with+exceptions%2C+though+there+be+none+expressed%2C+as+that+in+certain+cases+it+is+not+their+will+that+such+commands+should+bind+us.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Five+Disputations+of+Church-Government+%26+Worship+%28London%3A+R.W.%2C+1659%29%2C+5th+Disputation%2C+ch.+1%2C+p.+398&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc71cf0a24.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc71cf0a24.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=24.%20Proposition%2011.%20The%20commands%20of,that%20such%20commands%20should%20bind%20us&amp;text=24.%20Proposition%2011.%20The%20commands%20of%20lawful%20governors&amp;text=their%20will%20that%20such%20commands%20should%20bind%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f08e5695a" data-kw="">
<blockquote><p>Rutherford states quite explicitly that it was Bradwardine who provided him with the solution to the philosophical conundrum of the ground of ethics… Bradwardine offered a subtler threefold division… Bradwardine’s basic distinction was between things which are reasonable naturally prior to the divine will, things which are reasonable naturally posterior to the divine will, and things which are said to be mixed. Within the first category are contained necessary truths about God, such as his being and goodness, which obtain prior to any act of his will… they are able to move the divine will. Within the second category are contained things which are reasonable posterior to God’s will, and which depend on God’s will for their reasonable status. These are therefore said to be caused by the divine will and can in no way move or determine it… Bradward likens it to the situation of someone choosing between two equal alternatives. For when someone chooses one of these, we say that this was a rational choice even though he could have also chosen the other. Within the third category are included reasonable things which are said to be conditionally rather than absolutely necessary. Thus while they do not themselves obtain naturally prior to the divine will, their reasonable status is crucially founded on truths which do obtain in this way… the creature’s duty to love and obey God. For althought the creature’s existence is dependent on the divine will, with the supposition that this creature is in existence it is absolutely reasonable that he should love and obey God and indeed this reasonable status cannot be changed even by God himself… Rutherford therefore had no difficulty transposing this into his own theory of moral complexes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 134-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-5a0f0efa11" data-kw="">
<blockquote><p>…but I owe subjection of conscience to God solely, independently, and only… Yea, though crosses and afflictions work only upon us, as occasions, and external objects; yet are we to submit our conscience to them, as to warnings, because they be sent as God’s messengers appointed by Him, as Mic. 6:9, ‘Hear the rod, and who has appointed it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 135</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 211-13, 218-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

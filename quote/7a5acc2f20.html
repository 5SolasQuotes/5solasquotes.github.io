<main class="wrap"><figure class="quote" id="q-7a5acc2f20" data-kw="">
<blockquote><p>[T]hat we must be reconciled to God, and justified by the remission of our sins, and imputation of righteousness, before any sincere obedience to the law; that we may be enabled for the practice of it. They account, that this doctrine tends to the subversion of a holy practice, and is a great pillar of Antinomianism; and that the only way to establish sincere obedience, is to make it rather a condition to be performed before our actual justification, and reconciliation before God. Therefore some late divines have thought fit to bring the doctrine of former Protestants concerning justification, to their anvil, and to hammer it into another form, that it might be more free of Antinomianism, and effectual to secure a holy practice. But their labor is vain and pernicious, tending to Antinomian profaneness, or painted hypocrisy at best; neither can the true practice of holiness be secure, except the persuasion of our justification, and reconciliation with God, be first obtained without works of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (Lafayette: Sovereign Grace Publishers, 2001), 14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification.html">Sanctification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5617e90de" data-kw="">
<blockquote><p>The Scriptures deliver a twofold righteousness, by which the elect, being freely endowed, are said to be righteous and justified: One most perfect and in all points absolute: the other imperfect and begun in us, and to be perfected in another world: One, which as it depends not on our works, so can it not be perfected by our works: The other, which though it be given of grace and not for works, yet is it increased and perfected by works: One, with which we being endowed, are so justified before God that in the sight and judgment of God Himself we are reputed for altogether blameless and most just: Another, which does not only make us righteous before men, but also makes us more and more acceptable to God, and has the promise of the life that now is and that which is to come. To conclude, one without us, really placed in Christ Himself only our head, and imputed to us, and so made ours by imputation: The other really existing and inherent in ourselves.</p></blockquote>

</figure><figure class="quote" id="q-94f47c7fb4" data-kw="sanctification follows justification">

<blockquote><p>…there is a double beginning or cause of every gracious action in a man regenerate: 1. The Spirit of God by his exciting and cooperating grace. 2. Man himself renewed and sanctified in all his faculties. The former is termed principium a quo [the principle from which], the latter principium quod [the principle that]: man works, but he must be moved thereto and assisted by the Spirit of Grace: both together concur to the producing of every holy action. I say both together: for although man in his first conversion was merely passive, God’s Spirit working all without man’s help: yet man in performance of any holy act is not merely active, able to do all of himself without God’s help. No, he is partly passive, partly active: passive as he stands in need of God’s grace to stir up, guide, and strengthen the endeavor of each faculty in the doing of good: Active in as much as being thus helped by grace, himself willingly moves himself to every godly work. Now by reason of this concurrence of man with God, these operations of grace are properly called man’s work, not God’s work in man. So that when a regenerate man believes, this act though it be caused by Gods Spirit, yet it is done and exercised by Man voluntarily moving himself in that action, and therefore we say it is man that believes, not God’s Spirit that believes: as if the act of believing were wrought in man’s will by the Spirit of God in the same sort as jugglers work strange motions in their puppets, which seem to do wondrous feats, but tis an unseen hand that’s the cause of all. Such gross conceits should not have been devised by ingenuous minds and put upon so plain and clear doctrine as that is touching the concurrence of God’s grace with our strength in all holy actions whatsoever. The point is easy to him that will understand: Every good desire and good work is partly from man, because he wills it: he works it; but principally from God’s Spirit, because He makes man to will and to work it. Without which cooperating grace man by habitual inherent grace could do no good work at all, according to that of Christ, Jn. 15:5, ‘Without Me ye can do nothing,’ and of the apostle, Phil. 1:6, ‘He that hath begun the good work will also perform it;’ and again, Phil. 2:13, ‘It is God that worketh in you both the will and the deed, even of his good pleasure:’ and again, 1 Cor. 15:10, ‘I have labored more abundantly than they all, yet not I but the grace of God which is in me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627) | pp 147-48</span></figcaption>

e+as+that+is+touching+the+concurrence+of+God%E2%80%99s+grace+with+our+strength+in+all+holy+actions+whatsoever.+The+point+is+easy+to+him+that+will+understand%3A+Every+good+desire+and+good+work+is+partly+from+man%2C+because+he+wills+it%3A+he+works+it%3B+but+principally+from+God%E2%80%99s+Spirit%2C+because+He+makes+man+to+will+and+to+work+it.+Without+which+cooperating+grace+man+by+habitual+inherent+grace+could+do+no+good+work+at+all%2C+according+to+that+of+Christ%2C+Jn.+15%3A5%2C+%E2%80%98Without+Me+ye+can+do+nothing%2C%E2%80%99+and+of+the+apostle%2C+Phil.+1%3A6%2C+%E2%80%98He+that+hath+begun+the+good+work+will+also+perform+it%3B%E2%80%99+and+again%2C+Phil.+2%3A13%2C+%E2%80%98It+is+God+that+worketh+in+you+both+the+will+and+the+deed%2C+even+of+his+good+pleasure%3A%E2%80%99+and+again%2C+1+Cor.+15%3A10%2C+%E2%80%98I+have+labored+more+abundantly+than+they+all%2C+yet+not+I+but+the+grace+of+God+which+is+in+me.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29+%7C+pp+147-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69d2bffe34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69d2bffe34.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=there%20is%20a%20double%20beginning%20or,of%20God%20which%20is%20in%20me&amp;text=there%20is%20a%20double%20beginning%20or%20cause%20of&amp;text=the%20grace%20of%20God%20which%20is%20in%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

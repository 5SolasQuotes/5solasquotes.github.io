<main class="wrap"><figure class="quote" id="q-641785839b" data-kw="">
<blockquote><p>Christ, as God, sanctified Himself in His humanity: (1) By appointing His humanity as a sacrifice for sins. (2) By conferring merit and efficacy to His sacrifice, in order to acquire the remission of sins. Some of the Lutherans say that the person, according to both natures, was the subject of the passion. Whence that horrible assertion: the Deity also suffered: which most moderns disapprove, and that rightly. At the same time, being impatient of our animadversion, they strike at us with something else, itself erroneous, concerning the subject of the passion: namely, that, according to the opinion of the Calvinists, only the human nature of Christ suffered: which they then refute with many arguments, but in vain. They invent for themselves an enemy: they do not have us in this role, who orthodoxly and according to Scripture teach, that Christ, according to the flesh, suffered, 1 Pet. 4:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-b402491f0d" data-kw="">
<blockquote><p>I will speak distinctly… how to understand his being forsaken of God, which is not to be understood: 1. As if the union of the Godhead with the human nature had been dissolved, but so as it might still be compatible, and rightly stand with it. For it was not a forsaking in respect of the essence of the Godhead, but of his presence, and so in a way of sense. The Godhead was not separated, though the operation of comfort from the Godhead were sequestered. The union hypostatical continued still with his soul, now filled with the sorrows of death, as well as it did with his body when He lay in the grave. And so as although his body was united to the fountain of life, yet it might die in respect of a natural life: so his soul, although the hypostatical union continued, might yet want [lack] comfort, which is life.</p></blockquote>

<blockquote><p>Keckermann 323f.: (2) ‘Of the seed and blood of the Virgin Mary was formed Christ’s flesh, the Holy Spirit adding quickening force to this material. Of course the seed and blood of the Virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the Holy Spirit’s extraordinary shadowing and quickening were added: whence also it is said to have been conceived of the Holy Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate.–(3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the Virgin Mary, extraordinary as regards the formative force added to this material…&#x27;</p></blockquote>

</figure><figure class="quote" id="q-0dd2b3f86c" data-kw="">
<blockquote><p>Fifthly, the union of the two natures in Christ is an inseparable union. So that from the first moment thereof, there never was, nor to eternity shall be, any separation of them. If you ask how the union remained betwixt them when Christ’s human soul and body were separated from each other upon the cross? Is not death the dissolution of union betwixt soul and body? True, the natural union betwixt his soul and body was dissolved by death for a time, but this hypostatical union remained even then as entire and firm as ever. For though his soul and body were divided from each other, yet neither of them from the divine nature. Divines assist our conception of this mystery by an apt illustration. A man that holds in his hand a sword sheathed, when he pleases, draws forth the sword, but still holds that in one hand and the sheath in the other, and then sheaths it again, still holding it in his hand; so when Christ died his soul and body retained their union with the divine nature, though not (during that space) one with another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘5th Sermon’ on Jn. 1:14 in The Fountain of Life Opened</cite>, … (London, 1673), pp. 56-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

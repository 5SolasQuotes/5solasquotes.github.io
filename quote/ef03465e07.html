<main class="wrap"><figure class="quote" id="q-ef03465e07" data-kw="">
<blockquote><p>Argument 2: If the common senses of sound men (or their sensible apprehensions) be infallible, then the Pope with his pretended General Council is fallible: But the common senses of sound men are infallible: Therefore, etc. I know not how we should come nearer hand with a Papist, nor to plainer dealing than to argue from common sense. And as to the antecedent, either sense is infallible, or it is not: If it be, I have that I seek. If not, then mark what follows: 1. Then no man can be sure that the Christian religion is true: For the proofs of it all vanish, if sense be not infallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Safe Religion</cite>, The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself (London: Miller, 1657) | Query: ‘Whether the Infallible Judgement of the Roman Pope or his Clergy must be the Ground of our Belief of the Christian Doctrine, or of our Receiving the Holy Scriptures as the Word of God? N.’, pp. 240-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><figure class="quote" id="q-b65840e1fc" data-kw="">
<blockquote><p>For they hold the places, but you the Apostolic Faith. They are, it is true, in the places, but outside of the true Faith; while you are outside the places indeed, but the Faith, within you. Let us consider whether is the greater, the place or the Faith. Clearly the true Faith. Who then has lost more, or who possesses more? He who holds the place, or he who holds the Faith? Good indeed is the place, when the Apostolic Faith is preached there, holy is it if the Holy One dwell there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Festal Letters</cite>, fragment, letter to his children</span></figcaption>

</figure><figure class="quote" id="q-cd1dc35099" data-kw="Equality of apostles">
<blockquote><p>If Peter was constituted an ecumenical pontiff, he was greater and superior to the others. But we read of no such superiority having been bestowed upon Peter above the others by Christ or usurped by Peter himself or acknowledged by the apostles. Christ sends them equally: “As the Father sent me, so send I you” (Jn. 20:21). He equally breathes his Spirit into them (v. 22) and gives them the power to remit and to retain sins: “Whose soever sins ye remit, they are remitted unto them; and whose soever sins ye retain, they are retained” (v. 23). He equally gives to all the command to preach and to baptize: “Go ye therefore, and teach all nations” (Mt. 28:19). Hence, he promises them an equality of thrones: “In the regeneration” (i.e., in the renovation of the church caused by the gospel) “ye shall sit upon twelve thrones, judging the twelve tribes of Israel” (Mt. 19:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.5</span></figcaption>

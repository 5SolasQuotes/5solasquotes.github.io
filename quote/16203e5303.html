<main class="wrap"><figure class="quote" id="q-16203e5303" data-kw="">
<blockquote><p>Q. What is the third rule?

A. When the Law forbiddeth or commandeth any thing, it forbiddeth and commandeth all means, occasions, and provocations thereunton.

Q. What is the fourth rule?

A. Whatsoever the Law commands, it forbids the contrary; whatsoever it forbids, it commandeth the contrary. […]

Q. Why are all the Commandments (except two) set down negatively?

A. Because the Negative bindeth more strongly: for the Negative precept bindeth always, and to all moments of time; the Affirmative bindeth always, but not to all moments of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 88.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>

</figure><figure class="quote" id="q-2e65c72609" data-kw="">
<blockquote><p>We may observe this Rule, That the Affirmative Commands include in them the Prohibition of the contrary Sin; and the Negative Commands include the Injunction of the contrary Duty: for it is necessary that the contrary to what is forbidden, must be commanded; and again, the contrary to what is commanded, must be forbidden: As for instance, God in the third Commandment, forbids the taking of his Name in vain, therefore by consequence the hallowing and sanctifying his Name is therein commanded. The Fourth requires the sanctifying of the Sabbath-day; therefore it surely followeth, that the Prophanation of its is thereby forbidden. The Fifth commands us to Honor our Parents; therefore it forbids us to be Disobedient or Injurious to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 25.</span></figcaption>

</figure><figure class="quote" id="q-8edfdd62f1" data-kw="">
<blockquote><p>Obj. 4. Christ is not the lawgiver. Therefore his ministers should not teach and enforce the law. Ans. Christ is not the lawgiver, as it respects the principal office of the mediator; but he was and is lawgiver:

1. In as far as he is God and the author of the law, together with the Father.

2. In as far as it belonged to the mediator to free the law from the errors with which it had been corrupted, and to restore its true sense, not indeed chiefly, but that he might be able to accomplish the principal parts of his office, which are comprehended in the reconciliation and salvation of the human race. We may give the same answer to the objection as it relates to the ministers of the gospel, inasmuch as they are to teach and expound no other doctrine to the church than that which Christ himself delivered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-7b11c3aef5" data-kw="">
<blockquote><p>There then is the first use of the preaching of the law; to make known our innumerable faults so that in ourselves we begin to be miserable and greatly humble ourselves; in short, to beget in us the first degree of repentance which is called “contrition of heart”; this produces a full and open confession toward the Lord.</p></blockquote>

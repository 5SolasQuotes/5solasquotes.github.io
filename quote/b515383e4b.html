<main class="wrap"><figure class="quote" id="q-b515383e4b" data-kw="">
<blockquote><p>We reject the opinion of those [English Independants and congregationalists] who think that in the Church none are to be admitted as members into the external fellowship of the Church, but such as have been by a strict examination first tried by other believers, or the elders of the Church, in the exercises of piety… and have manifested to them evident signs of regeneration: and have afterwards, before the whole body of the Church, publicly professed a sincere confession of faith; and have either by a continued speech, or by questions and answers, made manifest by evident signs the saving grace of God in them… and [are of] such a spirit that in a church covenant sincerely, faithfully, and godlily in the presence of God and the whole church, they both can and will walk in the ways of God. For we read not that in the apostolical Church this manner of admitting church members was in use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London: 1645), ch. 1, ‘Of the Qualification of Church-members’, pp. 10-11</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d81995a250" data-kw="">
<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14, pp. 56-57</span></figcaption>

</figure><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, p. 24</span></figcaption>

<blockquote><p>Question 3: Whether do you not hold all visible believers to be within the visible Church as members thereof, and not ‘without’, in the apostle’s sense, 1 Cor. 5, and therefore ought so to be acknowledged and accepted in all congregations wheresoever they shall come, and are so known: and ought (if they desire and be not otherwise unfit) of right to be permitted to partake in all God’s ordinances and Church privileges there, so far as they personally concern themselves, although they be not as yet fixed members in particular covenant, either with that congregation where for the present they reside, nor with any other? Question 4: Whether you do not hold that baptism rightly (for substance) partaked does make them that are so baptized, members of the visible Church: and so to have right (at least quoad nos [as far as to us]) to all the privileges thereof (so far as they are otherwise fit) until they be cast out (if they so deserve) by excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 32 Questions (1639) in Richard Mather, Church-Government &amp; Church-Covenant Discussed, in an Answer of the Elders of the Several Churches in New-England to Two &amp; Thirty Questions Sent Over to Them by Diverse Ministers in England, to Declare their Judgments Therein… (London, 1643) Bernard was an English puritan. These questions were answered by the New England congregationalists, but it does not appear that Bernard ever published a response (at least that is on the internet) to those answers.</span></figcaption>

</figure><figure class="quote" id="q-40b9e09dad" data-kw="">
<blockquote><p>14. I would willingly inquire of the Independents, to what church were added so many thousands that were baptized by the apostles and added unto the Church in one day? Whether to a particular congregation, or to a greater ecclesiastical consociation? It could not be to a particular congregation:

1. For the reasons I have already produced.

2. Because the apostles were not particular, but universal ministers, set over the universal militant Church; and therefore, in virtue of their charge, admitted them to be members of all the Churches, whereof they were ministers.

3. Because they were of diverse and sundry countries: neither is it credible that to be a member of the Church, they were bound to quit their countries and to stay at Jerusalem, howsoever so long as they did stay there, they might participate as well of all the rest of God’s ordinances, as of baptism: Ergo, they were added to some greater consociation, viz. to that, and to all those, whereof the apostles were ministers; for out of all doubt, the apostles who baptized them could not refuse to admit them unto the Lord’s Table wherever they celebrated the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Part of the Duply to M.S. alias Two Brethren</cite>, The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations… (London, 1644), p. 92 Steuart (1591–1654) was a Scottish presbyterian, philosopher, controversialist and professor in both France and the Netherlands.</span></figcaption>

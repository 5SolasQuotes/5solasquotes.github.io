<main class="wrap"><figure class="quote" id="q-5b3b954022" data-kw="">
<blockquote><p>4 Thesis

For in the absolute Covenant [of grace], there is nothing in the creature that doth impel God either to promise, or to perform what he hath promised, or to perform what he hath promised; But in that Covenant [of works] to which a restipulation is annexed, God doth fulfil what he hath promised, because the creature hath rendered what is required; And although God hath made such a Covenant, wherein he hath promised so great things, upon condition of man’s performance, yet all this proceeds from the antecedent love of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), p. 355.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c853984b6" data-kw="">
<blockquote><p>A sacrament, is an outward sign, which God joins to his covenant, which he hath made with men. And that is either of an eternal, or temporal covenant. A sacrament of an eternal covenant, is a sacrament, whereby God confirms the promise of eternal life. And that is either of the covenant of works, or of the covenant of grace. The sacrament of the covenant of works, is a sacrament, which God gave our first parents in the state of their first integrity. And that was twofold: the tree of life, and the tree of the knowledge of good and evil. The tree of life was a sacrament of the covenant of works, whereby that life was signified, which man should have lived, if he had stood in the obedience of God. Gen. 2. 9. The tree of the knowledge of good and evil, was a sacrament by which was signified to man, in how good estate he was while he performed obedience to God his creator: and into how evil and miserable estate he should cast himself if he obeyed not God. Gen. 2. 17 &amp; 3. 7. 8. 9. 10. 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, trans. E. W. (London, 1595), 116–17. [Spelling and punctuation modernized]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-9fe258b73e" data-kw="">
<blockquote><p>Man, on the other hand, whose nature was to be a mean between the angelic and bestial, [God] created in such sort, that if he remained in subjection to His Creator as his rightful Lord, and piously kept His commandments, he should pass into the company of the angels; and obtain, without the intervention of death, a blessed and endless immortality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God</cite>, God, XII.21 in Nicene &amp; Post-Nicene Fathers, First Series, ed. by Schafff, Philip, vol. 2 (Peabody, Massachusetts: Hendrickson Publishers, 1999), p. 241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

</figure><figure class="quote" id="q-34d705c256" data-kw="">
<blockquote><p>Acquaintance with this covenant is of the greatest importance, for whoever errs here or denies the existence of the covenant of works will not understand the covenant of grace, and will readily err concerning the mediatorship of the Lord Jesus. Such a person will very readily deny that Christ by His active obedience has merited a right to eternal life for the elect. This is to be observed with several parties who, because they err concerning the covenant of grace, also deny the covenant of works. Conversely, whoever denies the covenant of works, must rightly be suspected to be in error concerning the covenant of grace as well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, 1.355.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-944fc81d80" data-kw="">
<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1872), 2.374–376.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

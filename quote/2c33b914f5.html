<main class="wrap"><figure class="quote" id="q-2c33b914f5" data-kw="jewish canon">
<blockquote><p>The reasons are various. (1) The Jewish church, to which the oracles of God were committed (Rom. 3:2), never considered them as canonical, but held the same canon with us (as is admitted by Josephus, Against Apion 1.39–41 [Loeb, 1:178–79], Becanus, Manuale controversiarum 1.1 [1750], pp. 11–12) and Stapelton, “De Principiis fidei doctrinalibus controversia,” Cont. 5.7* in Opera [1620], 1:322–23). This they could not have done without the most grievous sin (and it was never charged upon them either by Christ or his apostles) if these books no less than the others had been committed to them. Nor should the canon of the Jews be distinguished here from that of Christians because Christians neither can nor ought to receive other books of the Old Testament as canonical than those which they received from the Jews, their book-servants “who carry the books of us students” (as Augustine calls them, “On Psalm 40 [41]” [NPNF1, 8:132; PL 36.463]). (2) They are never quoted as canonical by Christ and the apostles like the others. And Christ, by dividing all the books of the Old Testament into thr</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1494d5bc06" data-kw="">
<blockquote><p>Let the weathercocks spin round as much as they please, but we must have fixed points of faith. Unless we have infallibility somewhere, faith is impossible. The true faith teaches us facts which cannot be questioned. Where is faith to build if there be no rock, and nothing left us but shifting sand? As for us, we find infallibility in the Scriptures of the Old and New Testament, and our one desire is to have them opened up to our minds by the Holy Spirit.</p></blockquote>

</figure><figure class="quote" id="q-0a2dfef12d" data-kw="">
<blockquote><p>It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. II</span></figcaption>

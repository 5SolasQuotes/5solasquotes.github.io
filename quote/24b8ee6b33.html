<main class="wrap"><figure class="quote" id="q-24b8ee6b33" data-kw="">
<blockquote><p>Assertion 2. The soul or its faculties are not destroyed in conversion: Peter’s will which he had when he was young, was the same when converted, but renewed, Jn. 21:18; the saints that Peter writes to are not to run to the same excess of riot as of old they wrought the will of the gentiles, 1 Pet. 4:3-4. Paul and Titus were the same men, when disobedient and serving diverse lusts, and when converted, and now washen, regenerated and justified heirs, Tit. 3:1-4. Paul: the same man, a persecuter and an apostle, but grace made a change, 1 Cor. 15:9-10, the same mind and spirit remains in nature, but they are renewed in the spirit of the mind, Rom. 12:2; Eph. 4:23. It is the same heart, but turned to the Lord, 2 Cor. 3:15-16. Christ but removes the scum and the dross, and the false metal, and frames the man a new vessel of mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London, 1647), p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-5b7bdd323b" data-kw="">
<blockquote><p>Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise:

1. Because this is faith; and the Scripture says we are justified by faith.

2. We receive Christ by faith, Jn. 1:12.

3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them.

4. We are to believe without staggering, Rom. 4.19.

5. We have peace of conscience through faith, Rom. 5:1.

6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 272</span></figcaption>

</figure><figure class="quote" id="q-9f8dab1808" data-kw="">
<blockquote><p>Therefore, good works do not entirely lose their salutary force by any grave sin. Let it be that they are mortified for a time. Let it be that their force and efficacy of leading to life is blunted, let it be that it is intercepted, let it be that it is suspended; yet it is not taken away, not extinguished, not abolished, not to die; but with the arrival of a new act of penitence and of trust in Christ our propitiator, they are finally revived, because the interposition of the grave sin is removed, they recover their former vigor and do not cease to exercise their force of leading to life, until all who are truly penitent are crowned, redeemed with a diadem of unfading glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works Mortified by Sin are Revived by Penitence’ in Theological Determinations in Works of Samuel Ward</cite>, … ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 189-94, p. 192</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

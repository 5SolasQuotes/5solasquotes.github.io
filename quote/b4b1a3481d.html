<main class="wrap"><figure class="quote" id="q-b4b1a3481d" data-kw="">
<blockquote><p>Moral obligation can be created only by some intimation of the will of God. God alone can bind the conscience. The will of God can be made known to us only in one of two ways: either by the ‘light of nature’ or by revelation. The light of nature becomes manifest either through the constitution and consciousness of the individual man, or through those of the human race expressed in the ‘consensus populorum.’ [popular consensus] That which has been believed always and everywhere and by all is very apt to be true: and that which has been felt to be binding upon the conscience, with the same universality of times, places and persons, may be concluded to be of moral obligation. The voice of the people in this sense may be regarded as the voice of God. The moral sense may be undeveloped, or it may be perverted in its judgments by ignorance, prejudice, passion, and habits of wickedness; but where it has a fair opportunity to be heard, and especially upon questions upon which its judgments are opposed to the desires and appetites of man, sinful and selfish, it would seem to speak with the authority of man’s Maker and Ruler. It is conscience, the ‘categorical imperative,’ against what is voluntary in man. It is an authority which man feels cannot be resisted with impunity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Moral Obligation of the Tithe’ (1890) in Miscellanies, vol. 1, p. 146. Peck was an American, Southern presbyterian.</cite></span></figcaption>

<blockquote><p>4. The old covenant is abrogated as to the yoke of Mosaical policy. — We have nothing to do with the judicial laws of the Jews, any farther than they are moral, or of a moral equity: “The law and the prophets were until John.” (Lk. 16:16) “The priesthood being changed, there is made of necessity a change also of the law.” (Heb. 7:12)</p></blockquote>

</figure><figure class="quote" id="q-dda84bdd5e" data-kw="">
<blockquote><p>4. Let it be remembered that those things we call morally good, [are those] which agree to right reason: those morally evill, which disagree from right reason: and those indifferent, which include nothing belonging to the order of reason, and so are neither consonant unto nor dissonant from the same. [The following shows that no rational action, and hence thing commanded, is simply indifferent, but must be good or bad to some degree, and hence to be done or not done; and if it is bad in any degree, it cannot be absolutely required.] 5. When we speak of the indifferency of an individual action, it may be conceived two ways, either absolute et sine respectu ad aliud [absolute and without respect to another], or, comparate et cum respectu ad aliud [comparatively and with respect to another]. In the free-will offrings, if so be a man offered according as God had blessed and prospered his estate, it was indifferent to offer either a bullock or a sheep, or a goat; but if he choosed to offer any of them, his action of offering could not be indifferent, but either good or evil. When we speak of the indifferency of an action comparate [comparatively], the sense is only this, that it is neither better not worse than another action, and that there is no reason to make us choose to do it more than another thing. But when we speak of the indifferency of an action, considered absolutely and by itself, the simple meaning is whether it be either good or evil, and whether the doing of the same must needs be either sin or evil doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | pt. 4, ch. 3</cite>, p. 8</span></figcaption>

</figure><figure class="quote" id="q-d3ee81f1a3" data-kw="">
<blockquote><p>Forasmuch as we have been freed from the teaching of Moses through Christ the Lord, so that it is no longer necessary for us to observe the civil decrees of the law of Moses, namely, in terms of the way and the circumstances in which they are described, nevertheless, insofar as the substance and proper end of these commandments are concerned, and especially those which enjoin the discipline that is necessary for the whole commonwealth, whoever does not reckon that such commandments are to be conscientiously observed is certainly not attributing to God either supreme wisdom or a righteous care for our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Reign of Christ HT: Rev. Shawn Mathis | Book 2, ch. 60</cite></span></figcaption>

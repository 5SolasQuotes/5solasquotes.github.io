<main class="wrap"><figure class="quote" id="q-c843ad7271" data-kw="">
<blockquote><p>…so on the seventh day does the Lord allow so much conveniency of sleep and other refreshing, as may be subservient for the main end of the day, these being works of mercy and necessity, which Christ allowed on the Sabbath, which was made for man, and not man for the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments</cite>, ... (Glasgow, 1676), 4th Commandment, p. 146</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da3987fe7e" data-kw="">
<blockquote><p>3 Q. Of how many hours does the Sabbath day consist? A. Of four and twenty. Gen. 2:3 The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day. 4 Q. Are all those hours to be sanctified? A. Yes. Exod. 20:11 The Lord rested the whole seventh day: and all the time wherein He rested He sanctified. Gen. 2:2,3 5 Q. How can all that time be sanctified? A. 1. By observing things commanded. Jer. 17:22 2. By observing things permitted. Exod. 12:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (1641), p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-69bd674b2a" data-kw="">
<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>

<blockquote><p>…in the Ten Commandments, in which one of seven is a Sabbath to the Lord, it will be found that many positives Moral are in the Covenant of Works… But man being considered as endued with the Image of God, so the Holy God made with him a Covenant of life, with Commandments, though positive and moral, yet not deduced from the Law of Nature, in the strictest sense, as to observe such a Sabbath, the seventh from the Creation…</p></blockquote>

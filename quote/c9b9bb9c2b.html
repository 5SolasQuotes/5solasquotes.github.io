<main class="wrap"><figure class="quote" id="q-c9b9bb9c2b" data-kw="">
<blockquote><p>Wherefore we must grant that it is the effect, the event in the communication of the things promised, that is ascribed unto this covenant, and not only the use and application of means unto their production.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 178</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-711e7bc10b" data-kw="">
<blockquote><p>The proposition is universal, as to the modification of the subject, “all;” but in the word “of them,” it is restrained unto those alone with whom this covenant is made. […] But whereas it is the internal, effectual grace of the covenant, and not only the means, but the infallible event thereon, —not only that they shall be all taught to know, but that they shall all actually know the Lord, — all individuals are intended; that is, that whole church all whose children are to be taught of God, and so to learn as to come unto him by saving faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:11; Works, vol. 22, p. 202</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/children-in-the-covenant.html">Children in the Covenant</a> › <a href="../topics/the-covenant-of-grace/children-in-the-covenant/the-baptist-1689-understanding-of-the-covenant-of-grace.html">The Baptist (1689) understanding of the covenant of grace</a></span><span class="t"><a href="../topics/the-covenant-of-grace/administrations.html">Administrations</a> › <a href="../topics/the-covenant-of-grace/administrations/the-new-covenant.html">The New Covenant</a></span><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The proposition is universal, as to the modification of the subject, “all;” but in the word “of them,” it is restrained unto those alone with whom this covenant is made. […] But whereas it is the internal, effectual grace of the covenant, and not only the means, but the infallible event thereon, —not only that they shall be all taught to know, but that they shall all actually know the Lord, — all individuals are intended; that is, that whole church all whose children are to be taught of God, and so to learn as to come unto him by saving faith in Christ.”

— John Owen, An Exposition of the Epistle to the Hebrews, 8:11; Works, vol. 22, p. 202">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20proposition%20is%20universal%2C%20as%20to%20the%20modification%20of%20the%20subject%2C%20%E2%80%9Call%3B%E2%80%9D%20but%20in%20the%20word%20%E2%80%9Cof%20them%2C%E2%80%9D%20it%20is%20restrained%20unto%20those%20alone%20with%20whom%20this%20covenant%20is%20made.%20%5B%E2%80%A6%5D%20But%20whereas%20it%20is%20the%20internal%2C%20effectual%20grace%20of%20the%20covenant%2C%20and%20not%20only%20the%20means%2C%20but%20the%20infallible%20event%20thereon%2C%20%E2%80%94not%20only%20that%20they%20shall%20be%20all%20taught%20to%20know%2C%20but%20that%20they%20shall%20all%20actually%20know%20the%20Lord%2C%20%E2%80%94%20all%20individuals%20are%20intended%3B%20that%20is%2C%20that%20whole%20church%20all%20whose%20children%20are%20to%20be%20taught%20of%20God%2C%20and%20so%20to%20learn%20as%20to%20come%20unto%20him%20by%20saving%20faith%20in%20Christ.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20An%20Exposition%20of%20the%20Epistle%20to%20the%20Hebrews%2C%208%3A11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F711e7bc10b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/711e7bc10b.html">Permalink</a><a class="src" href="https://archive.org/details/worksofjohnowend0023owen" rel="noopener" target="_blank">Read it online · Internet Archive (Goold)</a></div>
</figure><figure class="quote" id="q-9f4eeb7fe6" data-kw="noah">
<blockquote><p>The Remonstrants in the declaration of their opinion about this set forth their opinion thus: “Christ by the merit of his death thus far reconciled God, the Father, to the whole human race, that the Father on account of that merit, without injury to his own justice and truth, could and willed to enter into and sanction a new covenant of grace with sinners and men exposed to damnation” (cf. Acta Synodi Nationalis … Dordrechti (1620), Pt. I, pp. 115–16, on Article 2, “Concerning the Death of Christ”). Now this new covenant, they maintain, was so made with the whole human race that no nation and no individual ought to be said to be excluded from it. “The nations living under the Old Testament, although the covenant was not revealed to them in the same manner as to the Jews, ought not forthwith to be considered as having been absolutely excluded from the covenant, who in some way at least are called that they may seek God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/administrations.html">Administrations</a> › <a href="../topics/the-covenant-of-grace/administrations/noah.html">Noah</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Remonstrants in the declaration of their opinion about this set forth their opinion thus: “Christ by the merit of his death thus far reconciled God, the Father, to the whole human race, that the Father on account of that merit, without injury to his own justice and truth, could and willed to enter into and sanction a new covenant of grace with sinners and men exposed to damnation” (cf. Acta Synodi Nationalis … Dordrechti (1620), Pt. I, pp. 115–16, on Article 2, “Concerning the Death of Christ”). Now this new covenant, they maintain, was so made with the whole human race that no nation and no individual ought to be said to be excluded from it. “The nations living under the Old Testament, although the covenant was not revealed to them in the same manner as to the Jews, ought not forthwith to be considered as having been absolutely excluded from the covenant, who in some way at least are called that they may seek God.”

</figure><figure class="quote" id="q-cef707d457" data-kw="">
<blockquote><p>The Lutherans, on the other side, insist on two arguments to prove, that not a twofold administration of the same covenant, but that two covenants substantially distinct, are intended in this discourse of the apostle. 1. Because in the Scripture they are often so called, and compared with one another, and sometimes opposed unto one another; the first and the last, the new and the old. 2. Because the covenant of grace in Christ is eternal, immutable, always the same, obnoxious unto no alteration, no change or abrogation; neither can these things be spoken of it with respect unto any administration of it, as they are spoken of the old covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 89</span></figcaption>

</figure><figure class="quote" id="q-205b15d455" data-kw="">
<blockquote><p>But this covenant is of that nature, as that the grace administered in it shall effectually preserve all the covenanters unto the end, and secure unto them all the benefits of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 142</span></figcaption>

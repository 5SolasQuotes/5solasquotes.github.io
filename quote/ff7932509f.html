<main class="wrap"><figure class="quote" id="q-ff7932509f" data-kw="">
<blockquote><p>1. There are some men who object to all authorized creeds and articles of faith whatsoever, on the ground that they make the name of Christian and the advantages of Christian fellowship dependent on assent to certain positive truths or dogmas, whether more or fewer. There are some writers in the present day who hold the extreme position, that a man may be fully entitled to call himself a Christian, although he does not believe a single fact or doctrine of Christianity, although he denies the historical existence of the Christ of the Gospels, and the Divine origin of the system which He founded. “To declare any one unworthy of the name of Christian,” says Blanco White, “because he does not agree with your belief, is to fall into the intolerance of the articled Churches. The moment that the name Christian is made necessarily to contain its signification belief in certain historical or metaphysical propositions, that moment the name itself becomes a creed: the length of that creed is of little consequence.… No man has a right to reject another from the Christian union on account of any abstract opinion whatever.” “A total disbelief of miracles and prophecy,” observes Mr. Hennel in his Christian Theism, “no more disqualifies a man for bearing with propriety and consistency the Christian name, than any other deduction from the exuberant belief which places Christ in the Triune Godhead.” Upon views such as these it is not needful to dwell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1 (Edinburgh: T&amp;T Clark, 1868), 316–17.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4926e4926f" data-kw="">
<blockquote><p>Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

<blockquote><p>Sanctification, as here described, is the immediate work of God by his Spirit upon our whole nature, proceeding from the peace made for us by Jesus Christ, whereby, being changed into his likeness, we are kept entirely in peace with God, and are preserved unblamable, or in a state of gracious acceptation with him, according to the terms of the covenant, unto the end.</p></blockquote>

</figure><figure class="quote" id="q-012dcc4c41" data-kw="">
<blockquote><p>The efficacy of faith, then, depends not upon the faith itself, considered as a psychological phenomenon, but upon the object of the faith, namely Christ. Faith is not regarded in the New Testament as itself a meritorious work or a meritorious condition of the soul; but it is regarded as a means which is used by the grace of God.</p></blockquote>

</figure><figure class="quote" id="q-8d2d2850a6" data-kw="">
<blockquote><p>Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 10, ‘Bellarmine’s Arguments…’, p. 391</span></figcaption>

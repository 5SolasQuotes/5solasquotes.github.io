<main class="wrap"><figure class="quote" id="q-40a4d88737" data-kw="">
<blockquote><p>I conclude the proof of this point with the saying of our Savior Christ, Matt 5:18, “Heaven and earth shall pass away, but not one jot or title of the Law shall pass away:” Mark, our Savior says there, that there shall not one jot or title of the Decalogue pass away. As for the Ceremonial, and Judicial Law, they stand not still, but the whole compass of them is removed, the Ceremonial Law is quite and clean abolished; and the Judicial Law, in many particulars; therefore our Savior meant it not of those two Laws, but he speaks of the Decalogue, and He says, Heaven and earth shall passe away, before one jot of it shall pass away, much less an whole branch be rooted out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Profitable Treatises; of the Sabbath</cite>, (d. 1640; 1657), p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5348ac5b40" data-kw="">
<blockquote><p>Freedom from the laws of Moses is that by which Christians are loosed from the ceremonial and judicial laws of Moses, namely so far forth as they only pertain to the civil government under Moses. 1 Cor. 9:1, 19; 2 Cor. 3:17; Heb. 9:10. For such laws which belong to the law of nature, and by which all nations are bound, are not abrogated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, (London, 1595), p. 102</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-0e46a7aa42" data-kw="">
<blockquote><p>But if they [the Resolutioners] will extend it [the ordination vows] further, and say that it is meaned of absolute subjection to the sentence of his brethren, whether he have offended or not, they may as well, and with more color of reason, say that he is bound by his oath, not only to give subjection, but also obedience† to all their admonitions, whether just or unjust, lawful or unlawful; because there is no express limitation in the words of the oath, these qualifications, being as we said before, amongst the praecognita [assumptions] and praesupposita [presuppositions] of all such questions and answers, and there being no need to express them, except where there are grounds of jealousy.</p></blockquote>

</figure><figure class="quote" id="q-8116813603" data-kw="">
<blockquote><p>And thus for the Judicial Laws, because they were given to them as a politic body, that polity ceasing, which was the principal, the accessory falls with it; so that the Ceremonial Law, in the judgement of all, had still bound Christians, were there not special revocations of these commands, and were there not reasons for their expiration from the very nature of them. Now no such thing can be affirmed by the Moral Law; for the matter of that is perpetual, and there are no places of Scripture that do abrogate it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 168</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Some passages pointed out in which the apostle opposes the ritual law principally–he so rejects the observance of the external and ritual law from justification, that in its place he substitutes the internal and spiritual righteousness of the gospel–hence an invincible argument against the soli-fidians.” – ToC, pt. 2, ch. 14 . Historical Article Olson, Roger – ‘Arminius’s Reformed Doctrine of Justification’ (2015) . . . In reply to the question: ‘Is there any news today?’: “Oh, yes, this is always news: ‘The blood of Jesus Christ cleanseth us from all sin.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04a4146caa" data-kw="">
<blockquote><p>It is a clear case, that these three [belief, fear and love] are the only means, yea a perfectly sufficient means to make the solder and the union between God and man, and to bring a man to the possession and fruition of God (for this comprehends the whole man), so that the whole man is possessed of God, and inflamed by God, when his understanding knows Him, and sees the excellency that is in Him, and when the affections of his heart cleave to Him, and close with the most sovereign affections of fear and love, and then when all his whole man is at the command of this, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stoughton.html">John Stoughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Richard Baxter, Richard Baxter’s Confession (1655), ch. 10, sect. 3, p. 398-99 Stoughton (1593?–1639) | Sermon 7</cite>, p. 63</span></figcaption>

</figure><figure class="quote" id="q-dc5af46e06" data-kw="">
<blockquote><p>What word of Christ has Mr. [William] Prynne for extraordinary conversion of men by miracles without the Word? He must conceive with Arminians and Socinians that many are converted that never heard of that precious name of Jesus, without which there is no salvation, Acts 4:11, or of a faith in Christ, as Moses Amyraldus dreams, without the knowledge of Christ, and may write books De salute Ethnicorum [On the Salvation of Ethnics]… This may make us fancy somewhat of the salvation of Aristotle, Seneca, Cicero, Aristides, Scipio, Regulus, without the Law or Gospel, this way of extraordinarily saving men by miracles without the Gospel is the doctrine of Arminians and Socinians; so say the Arminians at the Synod of Dort, pp. 334-35: ‘Those whom God has deprived of the Gospel, He has not precisely rejected them from a communion of the benefits of the Gospel.’ Adolphus Venator (Adversus Dracenos, p. 84), says, ‘The heathen are saved without the Gospel, if they even but pray, Ens Entium miserere mei [‘Being of beings, have mercy on me’]. [Faustus] Socinus (Lectures on Theology, ch. 3), tells us of an inspired word that saves us, called verbum interius [‘an interior word’]. You may please schoolmen thus, such as Granadus (Contr. 8, de grat., tract 6, disp. 1, numb. 43) did Ruiz (De Predesti. se. 8. numb. 7), Alexander Alens. (8, p. q. 69, member 5, art. 3, De bonis Philosophis sic credo, etc.), Roa. (bk. 1, De Provident., quest. 7, n. 50), Vega (bk. 13 in Trident. ch. 12), Enriquez (tome 2, De ultimo fine, ch. 14, num. 6, quod bk. 8, quest. 5), Vasquez (1, par. disp. 97, and ch. 5), Soto (bk. 1, de nat. et grat., ch. 18, ad. 2), Francis Sonnius (in demonstrat. tract. 12. de consiliis ch. 8), Camerarius (bk. 1, de grat., ch. 8 and bk. 7, ch. 8), who do all of them send all the good philosophers and white morallists to heaven by miracles, inspirations, extraordinary works of providence and that without any rumour of Christ and the Gospel; famous Papists, to their own shame, yield that divine faith cannot be produced by miracles. Andradius says often they may be false. Maldonatus says that no necessary argument of faith can be drawn from miracles. Gregorius de Valen. says miracles give us no infallible certainty of doctrine. Bellarmine says, ‘Miracles cannot convince the mind.’ Durandus gives a sure reason why miracles cannot produce faith, ‘because’ (says he) ‘suppose it were known of itself that this miracle of the raising e.g. of Lazarus were true, yet it is not known by itself that it testifies that this is a true doctrine which he preaches who works the miracle.’ Mr. Prynne then has put the salvation of those who never heard the Gospel upon extraordinary pillars when he bottoms them on miracles without the Word, which are extraordinary rotten pillars.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London: 1646), ch. 23</cite>, p. 522</span></figcaption>

+%28bk.+1%2C+de+nat.+et+grat.%2C+ch.+18%2C+ad.+2%29%2C+Francis+Sonnius+%28in+demonstrat.+tract.+12.+de+consiliis+ch.+8%29%2C+Camerarius+%28bk.+1%2C+de+grat.%2C+ch.+8+and+bk.+7%2C+ch.+8%29%2C+who+do+all+of+them+send+all+the+good+philosophers+and+white+morallists+to+heaven+by+miracles%2C+inspirations%2C+extraordinary+works+of+providence+and+that+without+any+rumour+of+Christ+and+the+Gospel%3B+famous+Papists%2C+to+their+own+shame%2C+yield+that+divine+faith+cannot+be+produced+by+miracles.+Andradius+says+often+they+may+be+false.+Maldonatus+says+that+no+necessary+argument+of+faith+can+be+drawn+from+miracles.+Gregorius+de+Valen.+says+miracles+give+us+no+infallible+certainty+of+doctrine.+Bellarmine+says%2C+%E2%80%98Miracles+cannot+convince+the+mind.%E2%80%99+Durandus+gives+a+sure+reason+why+miracles+cannot+produce+faith%2C+%E2%80%98because%E2%80%99+%28says+he%29+%E2%80%98suppose+it+were+known+of+itself+that+this+miracle+of+the+raising+e.g.+of+Lazarus+were+true%2C+yet+it+is+not+known+by+itself+that+it+testifies+that+this+is+a+true+doctrine+which+he+preaches+who+works+the+miracle.%E2%80%99+Mr.+Prynne+then+has+put+the+salvation+of+those+who+never+heard+the+Gospel+upon+extraordinary+pillars+when+he+bottoms+them+on+miracles+without+the+Word%2C+which+are+extraordinary+rotten+pillars.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%3A+1646%29%2C+ch.+23%2C+p.+522&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc5af46e06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc5af46e06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-remission-of-sins/#:~:text=What%20word%20of%20Christ%20has%20Mr,Word%2C%20which%20are%20extraordinary%20rotten%20pillars&amp;text=What%20word%20of%20Christ%20has%20Mr.%20%5BWilliam%5D%20Prynne&amp;text=without%20the%20Word%2C%20which%20are%20extraordinary%20rotten%20pillars" rel="noopener" target="_blank">Read it online · Reformed <blockquote><p>XXIII. This Orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: … III. Of the Socinians: 1. Who overthrow justification through and on account of Christ the Mediator and His λύτρον [lutron, ransom]; who admit no redemption and satisfaction of Christ except a metaphorical one. 2. Who contend that Christ is our Saviour only on account of His prophetic and kingly office — inasmuch as He vindicated this title to Himself only by announcing salvation, confirming it, and communicating it, but not by meriting it. These and other portentous errors of this sort are both contrary to sacred Scripture and to the salutary doctrine of justification drawn and derived therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>

<blockquote><p>The Papists, Socinians and Remonstrants all acknowledge faith to justify, but by it they mean obedience to God’s commandments, and so make it a work, and [do] not consider it as an instrument receiving Christ and his promise. A Papist, a Socinian, a Protestant says, ‘We are justified by faith,’ but dispositive [dispositionally, as an inherent disposition], says the Papist, conditionaliter [conditionally, as a condition only], says the Socinian, applicativè [applyingly], says the Protestant. Faith justifies not as a quality or habit [an inward abiding power] in us, as the Papists teach, Ipsa fides censetur esse justitia [faith itself is considered to be righteousness], for so it is a part of sanctification, but as it is the instrument and hand to receive Christ who is our righteousness, much less as it is an act, as Socinus and his followers teach, as though [Greek] ipsum credere [‘to believe itself’], did properly justify; if we should be justified by it as it is an act, then we should be justified by our works and we should be no longer justified actually then we do actually believe, and so there should be an intercision of justification so oft as there is an intermission of the act of faith; but justification is a continued act. … When we say, ‘Faith alone does justify,’ we do not mean fidem solitariam, that faith which is alone; neither do we in construction join sola with fides the subject, but with justification the predicate, meaning that true faith though it be not alone, yet it does justify alone, even as the eye, though in respect of being it is not alone, yet in respect of seeing, unto which no other member does concur with it, it being the only instrument of that faculty, it is truly said to see alone, so faith though in respect of the being thereof it is not alone, yet in respect of justifying, unto which act no other grace does concur with it, it being the only instrument of apprehending and receiving Christ, is truly said to justify alone. … Objection: Faith is a work; therefore if we be justified by faith, then by works. Answer: With faith we must join the object of it, viz. Christ, Fides justificat non absolutè, sed relativè sc. cum objecto, non efficiendo sed afficiendo et applicando [‘Faith does not justify absolutely, but relatively, even with the object, not efficiently, but affectively and applyingly]. The Scripture says we are justified by faith, and through faith, but never for faith or because of our faith: per fidem, ex fide, non propter fidem. We can only be justified by that righteousness which is universal and complete; faith is a partial righteousness, Phil. 3:9, and as imperfect as other graces. … Only faith receives Christ and a promise. Faith justifies by the mere ordination of God, that on the receiving of Christ, or resting on Him we shall be justified. The proper act of faith which justifies is the relying on Christ for pardon of sin. To justify does not flow from any act of grace, because of the dignity and excellency of that act, but because of the peculiar nature, that it does receive and apply; therefore to receive Christ and to believe in Him is all one, and faith is always opposed to works. Bellarmine objects that to apply is a work or action. It is true, it is a grammatical action, but a predicamental passion [an Aristotelian category of disposition]. But says Bellarmine, ‘Love lays hold on Christ, and by love we are made one;’ but yet there is a difference: love makes us one with Christ extramittendo [sending out], faith intramittendo [bringing in], and besides love joins us to Christ after we are made one by faith, so that it cannot justify us.</p></blockquote>

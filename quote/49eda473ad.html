<main class="wrap"><figure class="quote" id="q-49eda473ad" data-kw="">
<blockquote><p>2. Q: How many fold is the covenant of God established with man? A: It is twofold: there is the covenant of nature or works, and the covenant of grace (Gal. 4:24).

3. Q: What is the covenant of nature or works? A: It is the covenant of God in which he promises man eternal life under the condition of good works—works proceeding from the virtues of [man’s] nature (vires naturae)—and man, moreover, accepts that condition of good works (Lev. 18:5; Rom. 10:5; Gal. 3:12).13

4. Q: Has no grave threat been added to the promise of this covenant? A: One has been added.

5. Q: In what form? A: Cursed is the one who will not persist in doing all things which have been written in the book of law, in order to do them (Gen. 2:17; Deut. 27:26; Gal. 3:10).

6. Q: What is the basis (fundamentum) of the covenant of works? A: A good, holy, and upright nature, of the kind which was in man at creation. For if God had not made man, in the beginning, according to his own image—that is, wise, holy, and just by nature—then he could not, surely, have established with man this covenant, which has for its condition holy, just, and perfect works proceeding from [man’s] nature (Gen. 1:26, 27; Eph. 4:24; Col. 3:9).

7. Q: What is promised in the covenant of works? A: A blessed life which should endure forever (Rom. 10:5; Gal. 3:12).

8. Q: What is the condition in the covenant of works? A: The condition is good works, which ought to proceed from that good, holy, and upright nature upon which the covenant of works itself was based.

9. Q: What things are excluded by this condition? A: By this condition, first, faith in Christ, and second, works proceeding from grace and regeneration, are excluded from the covenant of works (Rom. 11:6).

10. Q: Why are these things excluded? A: Because the virtues of [man’s] nature, and the works proceeding from those virtues, cannot coexist with the grace of Christ and works of grace.

11. Q: What are the principal divisions of this covenant’s condition? A: They are contained individually in the discrete commands of the Decalogue. Hence, the tables upon which the law was written were called “the tables of the covenant” (Ex. 19 and 20; 22:15; Heb. 9:4).

12. Q: Is this condition of works one of merit? A: Not at all. Rather, it is one as of duties which bear witness to [man’s] gratitude towards God the creator (Rom. 11:35; Luke 17:10).</p></blockquote>

<blockquote><p>Besides this evangelical character which unquestionably belongs to the Mosaic covenant, it is presented in two other aspects in the Word of God. First, it was a national covenant with the Hebrew people. In this view the parties were God and the people of Israel; the promise was national security and prosperity; the condition was the obedience of the people as a nation to the Mosaic law; and the mediator was Moses. In this aspect it was a legal covenant. It said, “Do this and live.” Secondly, it contained, as does also the New Testament, a renewed proclamation of the original covenant of works. It is as true now as in the days of Adam, it always has been and always must be true, that rational creatures who perfectly obey the law of God are blessed in the enjoyment of his favour; and that those who sin are subject to his wrath and curse. Our Lord assured the young man who came to Him for instruction that if he kept the commandments he should live (emphasis added).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (1872), 2.374–376.</span></figcaption>

<blockquote><p>Vers. 14. Blotting out the hand-writing of Ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his Cross.

Argum. 9. In which also he explains how Christ obtained remission of sins for us, viz. by taking away the hand-writing, in this sense. The Covenant of works is an hand-writing, established partly in threatnings, partly in appointed positive Ceremonials (excluding the Gentiles from the Church) was against us, and contrary to us. But Christ hath blotted out this hand-writing, taking it out of the way, and nailing it to his Cross: Therefore you must not look back to the legal Covenant or ceremonial appointments in them, to seek for any thing, neither must ye depart in the least from the death of Christ (by which ye are delivered from that hand-writing.)

He compares this Covenant of works, with its appurtenances, to an hand-writing, by which any one binds himself for the paying of a debt; for whosoever are convicted of sin by the light of nature, are also by the force of the Covenant of Works, obnoxious to wrath, and as often as we are convinced of sin, so often also by nature we confirm the punishment of sin, or the condition of the legal Covenant, by the judgement of our consciences against our selves, as by an hand-writing: The conscience of every one performs this much more, which hath received the written Law, and daily bears the punishment of the Law, for the breaking of it.

But chiefly all justiciaries are compelled to subscribe to this hand-writing, who acknowledge no righteousness besides inherent, or that which is by works: Of which number were those that Judaized, and observers of Ceremonies, who adhered to this Covenant, seeking Righteousness by works, and the appointed Ceremonies: For by how much they did endeavour by this means more manifestly to establish their own Righteousness, by so much the more openly they did derive the punishment of the Law broken, by the force of the Covenant, upon themselves: For no man enters a Covenant, but he also admits all the conditions of the Covenant.

The hand-writing is said to be in Ordinances, or rather subscribed to Ordinances, so far as they took upon them those commands, or Legal Ordinances, that they might be perfected in themselves, they did withal oblige themselves to bear the punishment of the breach of those commands.

He calls it the hand-writing against us, or contrary to us, partly because it separated the Jews from the Gentiles, and the Gentiles from the Jews; Partly because it was a yoke, which neither they nor their Fathers could bear; Partly because as often as they did any work of the Law, either moral or ceremonial to be justified thereby, so often by the imperfection of their work, and the profession of their imperfection in the use of the Levitical Ceremonies, they did argue themselves guilty, or rather did acknowledge themselves guilty of death.

As for example, when they offered Sacrifices, and did repeat them, they not only acknowledged themselves sinners against the Moral Law, but did also really confess that their frequent Sacrifices could not purge their consciences from sin, and so the hand-writing of the Covenant of works was always contrary to them: But Christ hath blotted out this hand-writing, and took it out of the way, nailing it to his Cross, insomuch as he for the sake of them that were his, hath paid for the redeemed the penalty due upon the hand-writing by the death of his Cross, and hath completed and abolished the positive Ordinances concerning those vanishing Ceremonies, by the real Sacrifice of his own body once offered.</p></blockquote>

nowledge+no+righteousness+besides+inherent%2C+or+that+which+is+by+works%3A+Of+which+number+were+those+that+Judaized%2C+and+observers+of+Ceremonies%2C+who+adhered+to+this+Covenant%2C+seeking+Righteousness+by+works%2C+and+the+appointed+Ceremonies%3A+For+by+how+much+they+did+endeavour+by+this+means+more+manifestly+to+establish+their+own+Righteousness%2C+by+so+much+the+more+openly+they+did+derive+the+punishment+of+the+Law+broken%2C+by+the+force+of+the+Covenant%2C+upon+themselves%3A+For+no+man+enters+a+Covenant%2C+but+he+also+admits+all+the+conditions+of+the+Covenant.%0A%0AThe+hand-writing+is+said+to+be+in+Ordinances%2C+or+rather+subscribed+to+Ordinances%2C+so+far+as+they+took+upon+them+those+commands%2C+or+Legal+Ordinances%2C+that+they+might+be+perfected+in+themselves%2C+they+did+withal+oblige+themselves+to+bear+the+punishment+of+the+breach+of+those+commands.%0A%0AHe+calls+it+the+hand-writing+against+us%2C+or+contrary+to+us%2C+partly+because+it+separated+the+Jews+from+the+Gentiles%2C+and+the+Gentiles+from+the+Jews%3B+Partly+because+it+was+a+yoke%2C+which+neither+they+nor+their+Fathers+could+bear%3B+Partly+because+as+often+as+they+did+any+work+of+the+Law%2C+either+moral+or+ceremonial+to+be+justified+thereby%2C+so+often+by+the+imperfection+of+their+work%2C+and+the+profession+of+their+imperfection+in+the+use+of+the+Levitical+Ceremonies%2C+they+did+argue+themselves+guilty%2C+or+rather+did+acknowledge+themselves+guilty+of+death.%0A%0AAs+for+example%2C+when+they+offered+Sacrifices%2C+and+did+repeat+them%2C+they+not+only+acknowledged+themselves+sinners+against+the+Moral+Law%2C+but+did+also+really+confess+that+their+frequent+Sacrifices+could+not+purge+their+consciences+from+sin%2C+and+so+the+hand-writing+of+the+Covenant+of+works+was+always+contrary+to+them%3A+But+Christ+hath+blotted+out+this+hand-writing%2C+and+took+it+out+of+the+way%2C+nailing+it+to+his+Cross%2C+insomuch+as+he+for+the+sake+of+them+that+were+his%2C+hath+paid+for+the+redeemed+the+penalty+due+upon+the+hand-writing+by+the+death+of+his+Cross%2C+and+hath+completed+and+abolished+the+positive+Ordinances+concerning+those+vanishing+Ceremonies%2C+by+the+real+Sacrifice+of+his+own+body+once+offered.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s+epistles+together+with+an+explanation+of+those+other+epistles+of+the+apostles+St.+James%2C+Peter%2C+John+%26+Jude%3A+wherein+the+sense+of+every+chapter+and+verse+is+analytically+unfolded+and+the+text+enlightened%2C+%28London%3A+Francis+Eglesfield%2C+1659%29%2C+pp+139-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7879149db4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7879149db4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/04/david-dickson-on-christ-blotting-out-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-24f775c1d2" data-kw="">
<blockquote><p>In a day when the covenant of works is being attacked by Federal Visionists and others who, while generally orthodox, have allowed their biblicism to get the better of them, we can find encouragement in the words of John Paul:

The covenant of works is a doctrine which has stood the test of examination during a series of centuries: the friction of opposition has only tended to brighten its evidence: its advocates are daily increasing, and the myriads of those virulent pamphlets published against it, have, like Jonah’s gourd, “sprung up in a night and perished in a night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paul.html">John Paul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>reeds and confessions defended, in a series of letters addressed to the author of “The battle of the two dialogues”</cite>, (Belfast, 1819) in Stewart Bates (ed.), Works of the late Rev. John Paul, D.D., of Carrickfergus. With a memoir and introduction by the editor (Belfast, 1855), p. 352.</span></figcaption>

</figure><figure class="quote" id="q-c9f03dff6b" data-kw="">
<blockquote><p>Thus also He made man with free will; and although ignorant of his future fall, yet therefore happy, because he thought it was in his own power both not to die and not to become miserable. And if he had willed by his own free will to continue in this state of uprightness and freedom from sin, assuredly without any experience of death and of unhappiness he would have received by the merit of that continuance the fulness of blessing with which the holy angels also are blessed; that is, the impossibility of falling any more, and the knowledge of this with absolute certainty. For even he himself could not be blessed although in Paradise, nay, he would not be there, where it would not become him to be miserable, if the foreknowledge of his fall had made him wretched with the dread of such a disaster.

But because he forsook God of his free will, he experienced the just judgment of God, that with his whole race, which being as yet all placed in him had sinned with him, he should be condemned. For as many of this race as are delivered by God’s grace are certainly delivered from the condemnation in which they are already held bound. Whence, even if none should be delivered, no one could justly blame the judgment of God. That, therefore, in comparison of those that perish few, but in their absolute number many, are delivered, is effected by grace, is effected freely: thanks must be given, because it is effected, so that no one may be lifted up as of his own deservings, but that every mouth may be stopped, and he that glorieth may glory in the Lord.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-53b26ca338" data-kw="">
<blockquote><p>All other works and duties of obedience do accompany faith in the continuation of our justified estate, as necessary effects and fruits of it, but not as causes, means, or conditions, whereon that effect is suspended.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-78f2548b78" data-kw="">
<blockquote><p>Wherefore I say then, that on supposition that a man lives in this world, perseverance unto the end is a necessary condition of his justification. And if so, no man can be justified whilst he is in this world; for a condition does suspend that whereof it is a condition from existence until it be accomplished. It is, then, to no purpose to dispute any longer about justification, if indeed no man is, nor can be, justified in this life. But how contrary this is to Scripture and experience is known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-69d8e13fee" data-kw="">
<blockquote><p>But if it be inquired what it is whereby we immediately concur in a way of duty unto the continuation of our justified estate, — that is, the pardon of our sins and acceptance with God, — we say it is faith alone; for “The just shall live by faith,” Rom. i. 17.</p></blockquote>

</figure><figure class="quote" id="q-7091759340" data-kw="">
<blockquote><p>If it be said, that final perseverance, which is so express a condition of salvation in the new covenant, is not indeed the condition of our first justification, but it is the condition of the continuation of our justification; then they yield up their grand position, that whatever is a necessary condition of the new covenant is a necessary condition of justification: for it is that which they call the first justification alone which we treat about. And that the continuation of our justification depends solely on the same causes with our justification itself, shall be afterwards declared.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 2</span></figcaption>

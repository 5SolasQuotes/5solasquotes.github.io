<blockquote><p>A class of subjects same to be discussed in the latter part of the sixteenth century which had not engaged so much of the attention of the earlier Reformers–especially the Erastian and the Prelatic controversies–and in the discussion of these matters Beza bore his part nobly as an able and faithful champion of the truth. The Erastian controversy, indeed, as conducted between Erastus and Beza, turned mainly upon the particular subject of the excommunication of church members; and it was not till the following century, that the whole of the principles usually regarded by Presbyterian divines as comprehended in the Erastian controversy, were subjected to a full and thorough discussion. Still, even at that early stage, the quested was mooted, on which the entire progress of the subsequent discussion, down even to our own day, has made it more and more manifest that the whole controversy hinges–viz. whether or not Christ has appointed in His church a government, distinct from, independent of, and in its own province not subordinate to, civil magistracy. And on this great question, as well as on the particular topic of excommunication comprehended under it, Erastus took the side which has always been supported by politicians, sycophants [obedient flatterers], and worldlings, while Beza ably defended that which has been adhered to by all intelligent and conscientious Presbyterians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation</cite>, ch. 7, ‘Calvin &amp; Beza’, pp. 350-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/south-carolina.html">State of South Carolina</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of South Carolina</cite>, 1788 (Thorpe, 6.3249-50, 3252, 3255-6)</span></figcaption>

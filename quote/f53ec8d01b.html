<blockquote><p>Q. How is this Faith and Repentance confirmed and increased in us?

A. By three means especially.

Q. Which is the first?

A. A diligent and faithful reading of the holy Scriptures, and hearing of the same word preached, receiving it with all meekness and hearty obedience. …

Q. Which is the second?

Answ. Fervent and constant prayer unto God in the holy Ghost, both public and private according to his will. …

Q. Which is the third?

Answer. A right using and partaking of both the holy Sacraments. viz. Baptism, and the Supper of the Lord.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cbd0ebcdcd" data-kw="">
<blockquote><p>§XII. For in the State of Grace, restituted or of inchoate reparation, the man who is called is excited and vivified from the lethargy and death of sin by prevenient and preparing grace, so that he may be able to read, hear, understand and meditate on the Word of God; by which means the intellect is illuminated and the will is impelled, and is gradually prepared and disposed, so that he can obey God calling through the Word, believe, and convert himself [Acts 2:40]. Eph. 2:5: “God, even when we were dead in sins, hath quickened us together in Christ… And hath raised us up together, and made us sit together in the heavenly places, in Christ Jesus.” ch. 5:8: “For you were heretofore darkness; but now, light in the Lord. Walk then as children of the light.” v. 14: “Wherefore he saith: Arise, thou that sleepest, and arise from the dead: and Christ shall enlighten thee.” Tit. 2:11-12: “For the grace of God our Saviour hath appeared to all men; Instructing us, that, denying ungodliness and worldly desires, we should live soberly, and justly, and godly in this world.” Rev. 3:20: “Behold, I stand at the gate, and knock. If any man shall hear my voice, and open to me the door, I will come in to him, and will sup with him, and he with me.</p></blockquote>

<blockquote><p>How then can his repentance atone for his iniquities, or entitle him to the favour of God and to the happiness of heaven? How can that evangelical repentance, which he is incapable of exercising till after his sins be all forgiven on the ground of an infinite atonement imputed to him, make atonement for them? How can that true repentance, which he cannot exercise until in justification he be already entitled to eternal life, entitle him to eternal life? Does not the consummate righteousness of Jesus Christ, imputed for justification, entitle the believer fully to it? What need is there, then, that his repentance should entitle him? How can that exercise of repentance which is the consequence of pardon, afford a previous title to pardon? or that which is a part of eternal life be a ground of right to eternal life?</p></blockquote>

</figure><figure class="quote" id="q-cd38ed66ee" data-kw="">
<blockquote><p>Now let us see how both these kinds of sorrow belong unto sound repentance. That first sorrow, which is of the law, and is conceived by reason of the punishment which follows sin, I confess it is no part of this holy change and conversion unto God, for of its own nature it does rather estrange us from God, than convert us to God; and, in very deed, it does altogether alienate the wicked from God as from a terrible judge. Notwithstanding, in repentance it has his use, for it prepares the elect by giving them sense of their misery, to that grace and mercy which is propounded in the Gospel. The latter sorrow, which is according to God, and is effected by the Gospel, is properly a part of repentance, and does effect that change of the mind and reason before specified. And, therefore, the apostle says, 2 Cor. 7:10, that the sorrow which is according to God causes repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 34, ‘Of Repentance’, p. 242</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

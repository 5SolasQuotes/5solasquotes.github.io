<blockquote><p>There were 3 things (most Honourable Sirs!) which Luther did fear would prove to be the Ruin of Religion.

1. Oblivion.

2. Security.

3. Carnal policy: The good God overthrow these in our Land, lest our land be overthrown by these: Though Ministers discover all sorts of sins, and though a Parliament discovers all sorts of plots and dangers, yet people are settled on their Lee’s, they will not see, nor fear, nor humble themselves, nor turn to the Lord at all; O pray, (said a dying man in the beginning of the German reformation) that God would preserve the Gospel … For the Pope and the Council of Trent are hatching of strange things: Ministers say as much and more to people, pray, be humbled, reform; For you see what the bloody Papists have done in Ireland, and you hear what they are plotting against England, we do thus speak and weep, but man will not hearken and obey; They who will not easily see their sins, will as hardly believe their dangers … O that God’s advises (so frequent, so earnest, so and more safe) to humbling and reforming might once be regarded and followed: we shall be safe, if we ever remain impenitent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Preservation or, A Sermon Discovering the only way to prevent Destroying Judgements: Preached to the Honourable House of Commons at their last Solemn Fast, being on May, 25, 1642</cite>, (London: Samuel Gellibrand, 1642), epistle dedicatory.</span></figcaption>

<blockquote><p>…the duels which have been fought between princes, which have determined their quarrels by the monomachy of man to man. The crown of England was sometimes in that sort disputed, between Edmund Iron-side, and Canute the Dane: Edward III offered as much to the king of France; the French king to the Emperor Charles V; and Henry the Great, father of our most illustrious queen, made offer to the Duke of Guise his competitor to put a period to their difference by point of spear, his person against his, six against six, or hundred against hundred. I will not say that it is lawful to a prince so to hazard the head of the commonwealth, and in his person, all the body of his estate, but when this way is permitted them, it is, because sovereign princes have not any judge above them who can do them right, so that to obtain reason from their hands who are elevated to as high a pitch of dignity as themselves, there is not any other way but by arms; and these their doings have an outward show of charity: for a prince will say, that he likes better to expose his own person to danger than to see a bloody war that should swallow up many thousands of men and give occasion of an infinite slaughter. And it may be that some people desirous to avoid a general conflict of nation against nation, have sometimes remitted their quarrel to a certain number of men, to be chosen by either side by them to be decided by combat. So three hundred Lacedemonians fought against a like number of the Argiens; three Romans against three Latins; and when David and Ishboseth stood competitors for the royalty, the two generals Joab and Abner caused a combat between twelve soldiers of the tribe of Judah against twelve of the tribe of Beniamin [2 Sam. 2:12-17]. This kind of duel is as it were an abridgement of the war, and yet not very justifiable. There is more appearance in this case than in any of the cases aforementioned: Two armies are ready to fight, he that has the right on his side finds himself inferior in forces, so that if they come to handy-strokes we must all die of necessity: The enemy makes an offer of a single fight, one to one, and offers to stand to the event of this duel; why should we all perish and not rather make legal of this way and expedient, which perchance may give us the victory, or at least will save six thousand men’s lives, and there can but one be slain? But this example has no correspondence with the [private] duel, whereof we now treat, and one may not draw into consequence particular actions which are exploited in war or in the consequence of war, especially in heat of battle…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anti-duello. The Anatomy of Duels</cite>, … (London: Harper, 1632), pp. 11-14 D’Espagne (1591-1659) was a French protestant pastor and theologian who lived in London for a significant time.</span></figcaption>

</figure><figure class="quote" id="q-a7ed5147d9" data-kw="">
<blockquote><p>While our hearts are warmed with prosperity, we think many times small sins can do no great harm; but herein we do wofully deceive ourselves. For besides that the least sin hath the nature of sin in it, as the least drop of poison is poison; and that in smaller sins there is the greater contempt of God, inasmuch as we stand out with God for a trifle, (as we count it,) and venture his displeasure for a little sensual satisfaction.

I say, besides these and many other considerations, which may render our small sins great provocations, this is one unspeakable mischief, that small sins intercept our communion with God, as much as great sins, and sometimes more. For whereas great sins by making deep wounds upon conscience, make the soul go bleeding to the throne of grace, and there to mourn and lament, and never to give God rest, till he gives rest to the soul, and by a fresh sprinkling of the blood of Christ, to recover peace and communion with God.

Smaller sins not impressing such horror upon the conscience, are swallowed in silence with less regret, and so do insensibly alienate and estrange the heart from Jesus Christ. The least hair casts its shadow; a barley-corn laid upon the sight of the eye will keep out the light of the sun, as well as a mountain. The eye of the soul must be kept very clear that will see God: “Blessed are the pure in heart, for they shall see God,” Matt. v. 8. Little sins, though they do not disturb reason so much as great sins, yet they defile conscience, and the conscience under defilement (unlamented) is shy of God, and God shy of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Correction, Instruction; or A Treatise of Afflictions</cite>, (1671; London: Religious Tract Society, 1836), pp 38-39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-850b8d8bb4" data-kw="">
<blockquote><p>Against the public disturbers of the peace of Europe, you protect, not so much yourself, as your people, by armies, fleets and confederacies, and, which renders you most of all formidable to your enemies, by your innate prudence and magnanimity.

And did not words, equal to your merit, fail me, as it gives me singular pleasure to speak of it, your piety above all things ought to be celebrated, whereby you readily and with justice, ascribe all the honour and success you are favoured with, to the goodness of the supreme Being, and are ready, gratefully to lay down your sceptre at the feet of him who, encircled with the rain-bow, sits on his heavenly throne: while you govern with no other view, but that Jehovah may reign, and Jesus rule throughout all your dominions: whose empire you promote and enlarge, not as others do, in support of their superstition and cruelty, by imprisonment, exile and stripes, and every engine of torture, the gibbet and fire; not by depopulating countries, not by the terror and dreadful blasphemies of Dragoons, but by meekness, and by the demonstration of the truth to every conscience; and by what is most of all prevalent, your own example; never offering any violence to the consciences of those who differ in religious sentiments from yourself.

But, in fine, what language can set off, as it ought to be, that sacred solicitude you discovered at your very accession to the throne? That your subjects, laying aside their disputes about some points of Christian worship and ecclesiastical government, might unite with the most desirable harmony of minds, in brotherly fellowship, and uniformity of prayers and praises to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dedication.html">Dedication</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William III in Herman Witsius, The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank (1677; 2 vols, London, 1822), i, p. 13.</cite></span></figcaption>

And did not words, equal to your merit, fail me, as it gives me singular pleasure to speak of it, your piety above all things ought to be celebrated, whereby you readily and with justice, ascribe all the honour and success you are favoured with, to the goodness of the supreme Being, and are ready, gratefully to lay down your sceptre at the feet of him who, encircled with the rain-bow, sits on his heavenly throne: while you govern with no other view, but that Jehovah may reign, and Jesus rule throughout all your dominions: whose empire you promote and enlarge, not as others do, in support of their superstition and cruelty, by imprisonment, exile and stripes, and every engine of torture, the gibbet and fire; not by depopulating countries, not by the terror and dreadful blasphemies of Dragoons, but by meekness, and by the demonstration of the truth to every conscience; and by what is most of all prevalent, your own example; never offering any violence to the consciences of those who differ in religious sentiments from yourself.

But, in fine, what language can set off, as it ought to be, that sacred solicitude you discovered at your very accession to the throne? That your subjects, laying aside their disputes about some points of Christian worship and ecclesiastical government, might unite with the most desirable harmony of minds, in brotherly fellowship, and uniformity of prayers and praises to God.”

<blockquote><p>What attitude should we adopt in view of the present popularity of pictures of Jesus Christ? The following considerations may be suggested as hearing on this question: (a) The Bible presents no information whatever about the personal appearance of Jesus Christ, but it does teach that we are not to think of him as he may have appeared “in the days of his flesh” but as he is today in heavenly glory, in his estate of exaltation (2 Cor. 5:16). (b) Inasmuch as the Bible presents no data about the personal appearance of our Saviour, all artists’ pictures of him are wholly imaginary and constitute only the artists’ ideas of his character and appearance.

(c) Unquestionably pictures of the Saviour have been very greatly influenced by the theological viewpoint of the artist. The typical modern picture of Jesus is the product of nineteenth century “Liberalism” and presents a “gentle Jesus” who emphasized only the love and Fatherhood of God and said little or nothing about sin, judgment, and eternal punishment. (d) Perhaps more people living today have derived their ideas of Jesus Christ from these typically “liberal” pictures of Jesus than have derived their ideas of Jesus from the Bible itself. Such people inevitably think of Jesus as a human person, rather than thinking of him according to the biblical teaching as a divine person with a human nature. The inevitable effect of the popular acceptance of pictures of Jesus is to overemphasize his humanity and to forget or neglect his deity (which of course no picture can portray).

(e) In dealing with an evil so widespread and almost universally accepted, we should bear a clear testimony against what we believe to be wrong, but we should not expect any sudden change in Christian sentiment on this question. It will require many years of education in scriptural principles before the churches and their members can be brought back to the high position of the Westminster Assembly on this question. Patience will be required.</p></blockquote>

<blockquote><p>What say ye of this salvation? Is it not a most glorious salvation? is it not a most excellent salvation that is in your offer? I intreat you speak your minds, tell Christ ye are content to take the great salvation; otherwise, whoever he be that will not partake of this gospel salvation, I in the name and authority of Christ our Master, denounce eternal and irrevocable war against him; put on your harness, ye shall not boast when ye put it off again; the wrath and fury of God shall come upon you to the uttermost if ye embrace not this great salvation:

Other wars are but for a time; the greatest Captains that ever the earth did carry, are now laid down in the sides of the Pit, and their swords broken under their head. Armies of ten hundred thousand, a hundred years’ time have laid them all in their graves, and ended all their contests; but there is no discharge of this war that shall be concluded betwixt Christ and you: it shall become an eternal and most terrible war, which shall be but beginning when time is ended. Now peace or war, which of them will ye choose? Dare ye send a charge to Christ, and say ye will defy him?</p></blockquote>

<blockquote><p>Question 2. May a Papist or a heretic by his knowledge be a lover of God as God? Answer: What is said to the former question is here to be reviewed. And further:

1. A Papist and such heretic as positively holds all the essentials of Christianity, and sees not the opposition of his false opinions hereto, and holds Christianity more practically than those false opinions, may be saved in that state, for he is a lover of God: But no other Papists or heretics can be saved but by a true conversion.

2. There is a sufficiency in the doctrine of Christianity which they hold, to save them, as to objective sufficiency. And that God gives not subjective grace (of sanctification) to any such, notwithstanding their errors, is a thing that no man can prove, nor any sober charitable Christian easily believe: And experience of the piety of many makes it utterly improbable, though we know not certainly the heart of another. There are many murmurings against me in this city (behind my back: for never one man of them to my remembrance to this day, did ever use any charitable endeavor to my face to convince me of my supposed error) as one that holds that a Papist may be saved, yea, that we are not certain that none in the world are saved besides Christians; and the sectaries whisper me to one another to be like Origen, a person in these dangerous opinions, forsaken of God, in comparison of them: What really I assert about these questions, I have here briefly hinted, but more largely opened in my Catholick Theology: But I will confess that I find no inclination in my soul to desire that their doctrine may prove true, who hide the glorified love of God, and would contract his mercy and man’s salvation into so narrow a room as to make it hardly discernable by man, and the Church to be next to no Church, and a Savior to save so very few, as seem scarce considerable among the rest that are left remediless. And who would make us believe that the way appointed to bring men to the love of God is to believe that He has elected that particular person, and left almost all the world (many score or hundreds to one) unredeemed, and without any promise or possibility of salvation: I am sure that the Covenant of Innocency [of Works] is ceased; and I am sure that all the world was brought under a Law of Grace made after the fall to Adam and Noah: and that this Law is still in force to those that have not the more perfect edition in the Gospel. And that Christ came not to bring the world that never hear of Him, nor can do, into a worse condition than Jews and Gentiles were in before: nor has He repealed that Law of Grace which He before made them; nor has God changed that gracious Name which he proclaimed even to Moses, Ex. 34:6-7. And I am sure that Abraham, the father of the faithful, conjectured once, even when God told him that Sodom was ripe for destruction, that yet there might be fifty righteous persons in it; by which we may conjecture what he thought of all the world (read Mal. 1:14 with all the old translations in the polyglot Bible, and consider it). And I know that in every nation he that fears God and works righteousness is accepted of Him [Acts 10:35]; and that he that comes to God must believe that God is, and that He is the rewarder of them that diligently seek Him, and therefore without faith none can please God: And that men shall be judged by that same law which they were under and obliged by, whatever it be. And they that have sinned under the Law (of Moses) shall be judged by it; and they that sinned without that Law shall be judged without it. And I know that God is love itself and infinitely good; and will show us his goodness in such glorious effects to all eternity as shall satisfy us and fill us with joyful praise: And as for the Papists, I know that they are seduced by a worldly clergy, and that by consequence many of the errors in that Church do subvert the fundamentals; and so do many errors of the antinomians and others among us that are taken for religious persons; yea and as notoriously as any doctrines of the Popish councils do: But I know that as a logical faith or orthodoxness, which consists in holding right notions and words, deceives thousands that have no sound belief of the things themselves expressed by these words; So also logical errors about words, notions and sentences, may in unskilful men consist with a sound belief of the things which must necessarily be believed. And that Christ and grace may be thankfully received by many that have false names and notions, and sayings about Christ and grace. And I know the great power of education and converse, and what advantage an opinion has even with the upright, which is commonly extolled by learned, godly, religious men, especially if by almost all. Therefore I make no doubt but God has many among the Papists and the Antinomians (to name no others) who are truly godly, though they logically or notionally hold such errors as if practically held would be their damnation, and if the consequents were known and held: Much more when thousands of the common people, hold not the errors of the Church which they abide in. And it shall not be my way of persuading my own soul or others to love God, by first persuading them that He loves but few besides them. And when such have narrowed God’s love and mercy to all save their own party, and made themselves easily believe that He will damn the rest of the world, even such as are desirous to please God as they are, they have but prepared a snare for their own consciences, which may perhaps, when it is awakened, as easily believe that He will damn themselves. Let us give all diligence to make our own calling and election sure, and leave others to the righteous God, to whose judgment they and we must stand or fall. Who art thou that judgest anothers servant [Rom. 14]? As the [Mosaic] Covenant of Peculiarity was made only with the Israelites, though the Common Law of Grace (made to Adam and Noah) was in force to other nations of the world; So the more excellent Covenant of Peculiarity is since Christ’s incarnation made only with the Christian Church, though the foresaid Common Law of Grace be not repealed to all others: Nor can it be said that they sin not against a Law of Grace; or mercy leading to repentance. And as the Covenant of Peculiarity was not repealed to the ten [Northern] tribes (though the benefits were much forfeited by their violation), but God had still thousands among them in Elijah’s time that bowed not the knee to Baal, and such as Obadiah to hide the prophets; though yet the Jews were the more orthodox: Even so though the Reformed Churches, as the two tribes, stick closer to the truth, the kingdoms where Popery prevails, have yet many thousands that God will save; and notwithstanding their errors and corrupt additions, they have the same articles of Faith and Baptismal Covenant as we. And if any man think himself the wiser or the happier man than I, for holding the contrary, and thinking so many are hated of God more than I do (and consequently rendering Him less lovely to them), I envy not such the honor nor comfort of their wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Knowledge &amp; Love</cite>, … (London: Parkhurst, 1689), pt. 2, ch. 14, pp. 267-69</span></figcaption>

+it+hardly+discernable+by+man%2C+and+the+Church+to+be+next+to+no+Church%2C+and+a+Savior+to+save+so+very+few%2C+as+seem+scarce+considerable+among+the+rest+that+are+left+remediless.+And+who+would+make+us+believe+that+the+way+appointed+to+bring+men+to+the+love+of+God+is+to+believe+that+He+has+elected+that+particular+person%2C+and+left+almost+all+the+world+%28many+score+or+hundreds+to+one%29+unredeemed%2C+and+without+any+promise+or+possibility+of+salvation%3A+I+am+sure+that+the+Covenant+of+Innocency+%5Bof+Works%5D+is+ceased%3B+and+I+am+sure+that+all+the+world+was+brought+under+a+Law+of+Grace+made+after+the+fall+to+Adam+and+Noah%3A+and+that+this+Law+is+still+in+force+to+those+that+have+not+the+more+perfect+edition+in+the+Gospel.+And+that+Christ+came+not+to+bring+the+world+that+never+hear+of+Him%2C+nor+can+do%2C+into+a+worse+condition+than+Jews+and+Gentiles+were+in+before%3A+nor+has+He+repealed+that+Law+of+Grace+which+He+before+made+them%3B+nor+has+God+changed+that+gracious+Name+which+he+proclaimed+even+to+Moses%2C+Ex.+34%3A6-7.+And+I+am+sure+that+Abraham%2C+the+father+of+the+faithful%2C+conjectured+once%2C+even+when+God+told+him+that+Sodom+was+ripe+for+destruction%2C+that+yet+there+might+be+fifty+righteous+persons+in+it%3B+by+which+we+may+conjecture+what+he+thought+of+all+the+world+%28read+Mal.+1%3A14+with+all+the+old+translations+in+the+polyglot+Bible%2C+and+consider+it%29.+And+I+know+that+in+every+nation+he+that+fears+God+and+works+righteousness+is+accepted+of+Him+%5BActs+10%3A35%5D%3B+and+that+he+that+comes+to+God+must+believe+that+God+is%2C+and+that+He+is+the+rewarder+of+them+that+diligently+seek+Him%2C+and+therefore+without+faith+none+can+please+God%3A+And+that+men+shall+be+judged+by+that+same+law+which+they+were+under+and+obliged+by%2C+whatever+it+be.+And+they+that+have+sinned+under+the+Law+%28of+Moses%29+shall+be+judged+by+it%3B+and+they+that+sinned+without+that+Law+shall+be+judged+without+it.+And+I+know+that+God+is+love+itself+and+infinitely+good%3B+and+will+show+us+his+goodness+in+such+glorious+effects+to+all+eternity+as+shall+satisfy+us+and+fill+us+with+joyful+praise%3A+And+as+for+the+Papists%2C+I+know+that+they+are+seduced+by+a+worldly+clergy%2C+and+that+by+consequence+many+of+the+errors+in+that+Church+do+subvert+the+fundamentals%3B+and+so+do+many+errors+of+the+antinomians+and+others+among+us+that+are+taken+for+religious+persons%3B+yea+and+as+notoriously+as+any+doctrines+of+the+Popish+councils+do%3A+But+I+know+that+as+a+logical+faith+or+orthodoxness%2C+which+consists+in+holding+right+notions+and+words%2C+deceives+thousands+that+have+no+sound+belief+of+the+things+themselves+expressed+by+these+words%3B+So+also+logical+errors+about+words%2C+notions+and+sentences%2C+may+in+unskilful+men+consist+with+a+sound+belief+of+the+things+which+must+necessarily+be+believed.+And+that+Christ+and+grace+may+be+thankfully+received+by+many+that+have+false+names+and+notions%2C+and+sayings+about+Christ+and+grace.+And+I+know+the+great+power+of+education+and+converse%2C+and+what+advantage+an+opinion+has+even+with+the+upright%2C+which+is+commonly+extolled+by+learned%2C+godly%2C+religious+men%2C+especially+if+by+almost+all.+Therefore+I+make+no+doubt+but+God+has+many+among+the+Papists+and+the+Antinomians+%28to+name+no+others%29+who+are+truly+godly%2C+though+they+logically+or+notionally+hold+such+errors+as+if+practically+held+would+be+their+damnation%2C+and+if+the+consequents+were+known+and+held%3A+Much+more+when+thousands+of+the+common+people%2C+hold+not+the+errors+of+the+Church+which+they+abide+in.+And+it+shall+not+be+my+way+of+persuading+my+own+soul+or+others+to+love+God%2C+by+first+persuading+them+that+He+loves+but+few+besides+them.+And+when+such+have+narrowed+God%E2%80%99s+love+and+mercy+to+all+save+their+own+party%2C+and+made+themselves+easily+believe+that+He+will+damn+the+rest+of+the+world%2C+even+such+as+are+desirous+to+please+God+as+they+are%2C+they+have+but+prepared+a+snare+for+their+own+consciences%2C+which+may+perhaps%2C+when+it+is+awakened%2C+as+easily+believe+that+He+will+damn+themselves.+Let+us+give+all+diligence+to+make+our+own+calling+and+election+sure%2C+and+leave+others+to+the+righteous+God%2C+to+whose+judgment+they+and+we+must+stand+or+fall.+Who+art+thou+that+judgest+anothers+servant+%5BRom.+14%5D%3F+As+the+%5BMosaic%5D+Covenant+of+Peculiarity+was+made+only+with+the+Israelites%2C+though+the+Common+Law+of+Grace+%28made+to+Adam+and+Noah%29+was+in+force+to+other+nations+of+the+world%3B+So+the+more+excellent+Covenant+of+Peculiarity+is+since+Christ%E2%80%99s+incarnation+made+only+with+the+Christian+Church%2C+though+the+foresaid+Common+Law+of+Grace+be+not+repealed+to+all+others%3A+Nor+can+it+be+said+that+they+sin+not+against+a+Law+of+Grace%3B+or+mercy+leading+to+repentance.+And+as+the+Covenant+of+Peculiarity+was+not+repealed+to+the+ten+%5BNorthern%5D+tribes+%28though+the+benefits+were+much+forfeited+by+their+violation%29%2C+but+God+had+still+thousands+among+them+in+Elijah%E2%80%99s+time+that+bowed+not+the+knee+to+Baal%2C+and+such+as+Obadiah+to+hide+the+prophets%3B+though+yet+the+Jews+were+the+more+orthodox%3A+Even+so+though+the+Reformed+Churches%2C+as+the+two+tribes%2C+stick+closer+to+the+truth%2C+the+kingdoms+where+Popery+prevails%2C+have+yet+many+thousands+that+God+will+save%3B+and+notwithstanding+their+errors+and+corrupt+additions%2C+they+have+the+same+articles+of+Faith+and+Baptismal+Covenant+as+we.+And+if+any+man+think+himself+the+wiser+or+the+happier+man+than+I%2C+for+holding+the+contrary%2C+and+thinking+so+many+are+hated+of+God+more+than+I+do+%28and+consequently+rendering+Him+less+lovely+to+them%29%2C+I+envy+not+such+the+honor+nor+comfort+of+their+wisdom.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Treatise+of+Knowledge+%26+Love%2C+%E2%80%A6+%28London%3A+Parkhurst%2C+1689%29%2C+pt.+2%2C+ch.+14%2C+pp.+267-69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3068990442.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3068990442.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=Question%202.%20May%20a%20Papist%20or,honor%20nor%20comfort%20of%20their%20wisdom&amp;text=Question%202.%20May%20a%20Papist%20or%20a%20heretic&amp;text=such%20the%20honor%20nor%20comfort%20of%20their%20wisdom" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

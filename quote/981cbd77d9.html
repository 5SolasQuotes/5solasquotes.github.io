<main class="wrap"><figure class="quote" id="q-981cbd77d9" data-kw="">
<blockquote><p>Question. It was queried by some, how we may make our application unto Christ; not in general, but under what notion and apprehension of the person of Christ?

Answer Because some seem to apprehend there might be danger in terminating our worship upon the nature of Christ as a creature, I shall give you my thoughts and directions in it. And, —

First. You must observe we are to have no conceptions, in our acting of any duty, towards Christ or about him, but with respect unto his person as he is God and man in one person. It is not lawful for us to have any apprehensions of Christ, to make any application to him, as man only; nor is it lawful for us to have any apprehensions of him as God only: but all our apprehensions of Christ, and all our addresses unto him, must be as God and man in one person. So he is, and so he will be to all eternity.

The union is inseparable and indissoluble; and for any man to make his application unto Christ either as God or as man, is to set up a false Christ. Christ is God and man in one person, and no other. So, in all our actings of faith upon him, and applications unto him, we ought to consider him as he was “the seed of David,” and as ” God over all, blessed for ever,” in one person.

This makes the great idolatry among the Papists; — in the image of Christ they represent the human nature of Christ separated from his Deity; for they can make no representation of one that is God and man in one person: hereby they become guilty of double idolatry, referring the mind unto one that is a man, and no more, — and doing it by means of an image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse V: The Ground of an Application to Christ (1676) in William H. Goold (ed.), The Works of John Owen</cite></span></figcaption>

<blockquote><p>…the office-power, no, not though it were from idolaters, for idolatrous purposes, does not make persons actually idolaters, till they do actually exhibit divine worship to a creature. Suppose a person be ordained a priest to offer sacrifice-propitiatory for the quick and dead in the mass; yet if he repent thereof, and never do adore the breaden-god, he is not an idolater: Yea, suppose he act in baptizing, preaching, marrying, burying according to the rituals of the Romanists, by virtue of his ordination as a priest, or, as this author speaks, his office-power, without exhibiting any divine worship to a creature (which in some of these may be), yet is he not thereby an idolater. The reason whereof is manifest, because he is not an idolater to whom the definition of idolatry agrees not. And this is the reason why, if Jeroboam’s priests, though consecrated for the worship of idols, did not worship them, they were not to be accounted idolaters: Nor are those that act by virtue of authority committed to them in matters civil, from rebels [such as Oliver Cromwell], equally guilty of rebellion as those from whom they derive that their authority, unless they act rebelliously; if they act for the restitution of their prince, the public peace, they are accounted good subjects [as many did under Cromwell], and not rebels, though at first they derived their authority from rebels. Nor does the worshipping of God by a form merely of humane composition make idolaters, though it have been abused to idolatry with the rites and modes of idolaters, unless there be idolatry in the form, and the rites and modes be idolatrous in their use: because, notwithstanding this, no divine worship may be given to a creature. So, though the form of baptism in the Roman Church were merely of human composition, used with crossings, cream, oil, spittle, if these rites were used, though by them abused to idolatry, not as they do, so as to give divine worship to a creature, the users in this manner, however guilty of will-worship or superstition, yet would not be justly chargeable with idolatry; no, not though they should in some sort symbolize with idolaters, that is, be assimilated to them or in some sort comply with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Sect. 11. Acting in the holy things of God, by an Office-power and modes of Idolaters, may be without Idolatry, Ch. 7; pp. 245-46</span></figcaption>

</figure><figure class="quote" id="q-da10e894b5" data-kw="">
<blockquote><p>To make such images and representations to be used in divine worship, is not simply evil, as appears by the brazen serpent, a temporary ordinance for an occasion in the wilderness; and by the cherubims on the mercy-seat, a stated ordinance for the Mosaical dispensation. There were also supernatural unimitable representations, though not of the divine nature, yet of the divine presence, as the burning bush and the appearances on Mount Sinai. Divine worship directed to such images or representations as to a mediate object, is idolatry. The ark and the cherubims, and the temple, were not made the object of worship. A learned man writes that incurvation in way of religion towards any symbolical presence, as to an object, is flat idolatry; if it be in worship of saints, angels, and demons, it is double idolatry; if in the worship of the true God, single [idolatry]. I suppose it is one thing to make somewhat (as for instance, the ark of the Covenant, and the mercy-seat, and the temple) an object of our consideration in the worship of God, as instructing and exciting therein; and another thing to make it the object of worship itself. And the said author says that to direct our adoration towards a supernatural and unimitable transplendency of the divine presence, is not idolatry. I suppose he means that the burning bush which Moses saw, and the visible glories on the Mount, were only media cultus, not objects thereof, the presence of God shining through the same as a bright medium.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship, 2nd Part in The Remains of… John Corbet… (London: Parkhurst, 1684) | section 18, p. 205</span></figcaption>

<blockquote><p>Let us not use things and rites in divine worship which are not prescribed, or not necessary by the law of nature, or even which do not have a particular use in worship, which were monuments of past idolatry, and had an enormous abuse, because God commanded to abolish monuments of this sort, Ex. 39:13; Num. 25:3, 33:52-53; Dt. 7:5; Is. 30:22; 1 Cor. 10:20; Rev. 2:14, 20…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus theologiae</cite>, 14.1.57 trans. Charles Johnson</span></figcaption>

<blockquote><p>…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures. Also we make a distinction of images, that some of them be true, and some of them false. Among the true, those be reckoned, which doo represent those things, which either be, or haue béene, or hereafter shall be. But those are called false, which represent those things that neither be, have been, nor yet ever shall be: as are the chymaeras and centaurs. There be also some images filthy and some honest, according as those things be which are expressed by them. Also they may be distinguished according to the circumstance of the place, because some be set in a holy place and some in places prophane. Again, others there be which are appointed in respect of worship and religion: but others are erected as ornaments, and only for the remembrance of a thing.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8062fcc4ca" data-kw="">
<blockquote><p>I have followed this method in the Theses on the secret of eternal Predestination, in which I considered primarily the efficient cause of Election and Reprobation with utmost diligence and faith. However, I could not escape the foul calumnies of detractors and some unreasonable people. For when I have shown from the Gospel of Jesus Christ that the decree of eternal election must be distinguished from our eternal salvation as a cause from its effect, and that the means leading us to that eternal salvation, among which are faith in Christ and His merit, are efficient causes of eternal salvation, but not the decree of election, some have dared, prompted by weakness or perhaps ignorance combined with a malicious intent, to affirm that I have taught that we are not saved by faith in Christ and that the merit of Christ is not the cause of our eternal salvation. But I give thanks to my God, who deigns to gradually make me conformed to the image of His Son, for enduring calumnies for the sake of heavenly truth; and I persuade myself that it is Christian to be ill-spoken of when you believe rightly and teach and do well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 1 (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-104b7eb9fb" data-kw="">
<blockquote><p>17. It is mercy that there is a possibility of happiness, and that upon our pain’s taking, we may have a Kingdom; by our Fall in Adam we forfeited Heaven; why might not God have dealt with us as with the lapsed angels? they had no sooner sinned but were expelled Heaven never to come thither more; we may say as the apostle, Rom. 11:22, ‘Behold the goodness and severity of God.’ To the apostate angels behold the severity of God that He should throw them down to Hell forever; to us behold the goodness of God, that He has put us into a possibility of mercy, and if we do but take pains, there is a Kingdom stands ready for us; how may this whet and sharpen our industry, that we are in a capacity of salvation; and if we do but what we are able, we shall receive an eternal weight of glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity (d. 1686; London: Parkhurst, 1692), The Lord’s Prayer, ‘Thy Kingdom Come’</cite>, p. 507</span></figcaption>

</figure><figure class="quote" id="q-ab49ef4f0f" data-kw="good pleasure election">
<blockquote><p>The orthodox maintain that the good pleasure (eudokian) alone has place and think that no other cause can either be given or rightly sought. But the adversaries (who cherish Pelagianism or semi-Pelagianism) suppose that others also can come in order: for instance, either Christ and his merit, or the foresight of faith and works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.10.1</span></figcaption>

</figure><figure class="quote" id="q-26b513cea7" data-kw="">
<blockquote><p>Paul … alludes to the creation of Adam, and rises up to the eternal purpose of God, who, before he created mankind, decreed of his own mere will and pleasure, to manifest his glory, both in saving of some whom he knew, in a way of mercy, and in destroying others, whom he also knew, in righteous judgment. And verily, unless we judge this to be the case, God will be greatly injured; because he will not be sufficiently wise, who first creates men, and looks upon them corrupt, and then appoints to what purpose he has created them: nor sufficiently powerful, if when he has taken up a purpose concerning them, he is hindered by another, so that he obtains not what he willed; nor sufficiently constant, if willingly and freely he takes up a new purpose, after his workmanship is corrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Complete Tract on the Doctrine &amp; True Use of Predestination, out of the Lectures of Theodore Beza on Chapter 9 of the Epistle to the Romans… adjoined are some places taken out of the book of Dr. Luther on the Bound Will Against Erasmus, from which appears that his judgment on Predestination was in everyway consonant with ours 2nd ed. ed. Raphael Eglin (Eustathius Vignon, 1583) 182</cite>, pp. no ToC Table</span></figcaption>

tml">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=Paul%20%E2%80%A6%20alludes%20to%20the%20creation,purpose%2C%20after%20his%20workmanship%20is%20corrupted." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-252239b9c2" data-kw="">
<blockquote><p>While living in Geneva about 1558, Knox was asked by persons back in England to answer a book circulating there titled Careless by Necessity. This work, written by an Anabaptist, denied the doctrine of Predestination. Knox complied… This work is the longest of Knox’s writings… On Predestination is in the form of an ‘answer’, and is disputational in structure. Knox alternately [block] quotes an assertion from his ‘Adversarie’ [in the order of the adversary’s book] immediately following it with his ‘Answer’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-l-dole.html">Brian L. Dole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Knox on Predestination’</cite></span></figcaption>

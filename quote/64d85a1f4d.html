<main class="wrap"><figure class="quote" id="q-64d85a1f4d" data-kw="">
<blockquote><p>The Law of nature, which teacheth men self-preservation, requireth this as a means for that end. whatsoever is needful for our defence, is a duty, it requires and enjoins whatsoever is a means for this end; so that acquaintance with or the exercise of ourselves in the use of arms, or other parts of military exercise, may be enforced from that Commandment which requires men to use all means to preserve life, to defend themselves it were to no end to make a law requiring duty, if to our might we should not use the proper means for our own preservation. Let out a Prince never so great, tread upon a worm, and it will turn; they have that instinct in them to defend themselves.

There are our Rights both as Men, and as Christians, our civil Rights and Liberties as Men and our religious Liberties and Rights as Christians; both which we are to defend with the sword, as far as we are able, or to commit ourselves to God in the way of duty in doing of it. There is such a thing as Liberty and Property given to us, both by the Laws of God &amp; Men when these are invaded, we may defend ourselves. God hath not given great ones in the world that absolute power over men, to devour them at pleasure, as great Fishes do the little ones; he hath set Rulers their bounds &amp; by his Law hath determined peoples liberties and property.

He that rules over men must be just that is should be so, ruling in the fear of God: therefore Kings are commanded to read the Book of the Law because it is a boundary of their authority, as well as of the peoples’ liberty. Naboth’s Vineyard taken away by Ahab in that manner as it was, was revenged by God on Ahab and Jezebel too. If we have that that is our Right and Due, it is not another’s being stronger can make our Right Null and void: therefore that Law that gives us a Right, requires attendance on the work of this day, that is Martial exercise, in order to the defence of our selves by Arms, when the providence of God puts us upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-nowell.html">Samuel Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abraham in arms; or The first religious general with his army engaging in a war for which he had wisely prepared, and by which, not only an eminent victory was obtained, but a blessing gained also. Delivered in an artillery-election-sermon, June, 3. 1678</cite>, (Boston MA: John Foster, 1678), pp 9-10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-657f806a6f" data-kw="">
<blockquote><p>We may not be idle; We are created unto good works which God hath prepared that we might walk in them. We are redeemed and bought with a price, not to do nothing or to live as we list, but to serve him which hath redeemed us. Our Saviour could in no wise abide idleness, Why stand ye still? Saint Paul would have all men to be stirring, Let every man walk. Not one is excepted, not one can be dispensed withal, Whosoever he bee that will not labour let him not eat. For it is good that every man should eat his bread in the sweat of his brows. And work in the wise man’s judgement is even as needful for men as meat. There is no such bane to a common wealth or kingdom, no such poison to the manners of every particular man as idleness is.

Examples we have too many in all ages. Idleness in David was a cause of lewdness: so that it is not good no not for Princes to be idle. Idleness was the root of all that filth in Sodom. Israel in the absence of Moses being idle, fell to feasting, dancing, and idolatry. And therefore seeing that such as be idle are subject to so many noisome temptations: S. Jerome’s counsel is this, See thou be always doing somewhat that the devil may find thee occupied: he that is out of good exercise is easily snared of the devil. And idleness, saith S. Bernard, is the mother of toys (he might have said of vices) and the stepdame of virtues. Amasis king of Egypt made provision by Law against idleness, once a year calling every man to a reckoning what he had gotten, and what he had spent.

In this reckoning was neither the gain of carding, dicing, usury, bribery, cousinage [sic] nor extortion allowed. Let every man walk in that vocation wherewith God hath called him. God hath called no man with these vocations. Yet dare I not say, neither will I, that for any man, at any time, in any sort, to recreate himself with cards or dice is sin. I am not of that opinion. Yet it falleth out too often that these exercises are occasions of much sin. And when they are so, it were no doubt much better to be altogether idle than so ill occupied. We must not play, but walk.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the Most Reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 100.</span></figcaption>

<blockquote><p>[I]t is a principal function of kings and of governors to search and explore what function of life has been designed by God for each citizen, and to take care that each one is initiated, prepared, and helped toward this end from childhood, so certainly the same persons ought to exercise utmost interest and a primary concern among their subjects, and, wherever possible, to seek and find those whom the Lord seems to have appointed to this supremely salutary work, necessary before all others, of preaching the gospel. So Paul glories that he had been “separated for this work from his mother’s womb” (Gal. 1:15). They should take care that such of these as they can discover be initiated and trained from childhood for this most holy office, and that those who have been duly tested and proved be used in their good time for this function. This is certainly necessary before all things else, to be realized with utmost zeal by all kings and princes of the people of God who pray from their hearts, “Thy Kingdom come” (Matt. 6:10).</p></blockquote>

<blockquote><p>And now that so much as I have said is required, active Obedience to legal, civil Authority to all Magistrates in their legal commands in civil matters; or at least passive yielding to the penalty of the Laws, in case of not obeying actively; and neither further then to legal commands of legal Authority, appears by the Apostle’s reason in this 1. verse. For there is no power but of God; which he redoubles in a second phrase, The powers that be are ordained of God, or under God … Every soul must be under their order … because they all are ordered by God under him, his deputies and vicegerents in their order and degree, higher and highest.

This is true of all powers, and therefore to all must subjection be performed. And to none hath God ordered or ordained any Authority but legal. Which as none will deny (no not the Doctor himself) of other Governors besides the supreme: So can none with reason affirm, that any hath more authority then the Laws, whether special or general, written or unwritten, have allotted them. Which Laws God ratifies (being not against his) and so the Authority according to them.

And this our Doctor also confesses (in sense) in more places then one of his Book, for active Obedience, that no more is due, but according to the Laws of God, and the established laws of the Land. Only he argues for passive obedience beyond this, every where. 1. Because he argues against resistance even of Tyranny. But in a word to refute this from the Apostle’s reason in the first verse.

If I be bound to be subject to tyranny, (or to suffer violence of a tyrant) by virtue of the commandment here. Then tyranny is the Ordinance of God, or Magistrates have power ordained of God to use tyrannous violence (for thus the Apostle argues for subjection from God’s ordaining the power) But this is false. Ergo, so is that, that I should be bound to suffer tyrannous violence. …

But I say again, that by all the foregoing context, and the reason from God’s Ordinance in the second verse: The prohibition of blaming of resistance, goes no further, then, of legal commands of legal authority. The Doctor will not (doth not) say that the most peremptory, or obstinate refusing to obey actively tyrannous and illegal commands is resistance. By what authority then of the Text or context will he stretch the prohibition to refusing to suffer tyrannous violence?

Or how does any resist unlawfully (though by Arms) when unlawful violence is offered him? which God no where gave authority to use to him, nor ever commanded him to yield unto? In a word, till God’s Ordinance can be proved allowing tyranny (which can never be) or undeniably ordaining a man to suffer it, which is no where in his word (I mean the extremity of tyranny depriving of life, or so) though often it is so in his providence, when he affords no means of resistance: This Text of the Apostle will no way condemn the resisting by Arms tyrannous and illegal outrageous violences. Besides all that, the context following refuses this sense of the Doctor, as I have already shewed. …

Then besides all that hath been said on the Text and context, I only add this: That then every meanest Officer (if wicked) may ruin the whole neighbourhood, because he may not be resisted by Arms, who yet will bring Arms to act his villanies. And so the blessed Ordinance of God in Magistracy shall turn to the greatest curse to Mankind (the best and most conscientious of them) that can be imagined, in regard of outward sufferings, and general confusion.

It remains therefore that as the Apostle in the following verses, banishes tyranny out of the context, describing every where a righteous Magistrate, and not a tyrant: So tyranny is to be banished out of the interpretation of this Text, which allows him that is a tyrant, no security, that he shall be endured, and not resisted even with Arms. Though it doth (and that most justly and necessarily) secure a just ruling Prince or Magistrate from all resistance, even when he punishes most severely according to Law and justice, upon the heaviest guilt of being found resisters against God (that resist such a rule) and the heaviest penalty of damnation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And now that so much as I have said is required, active Obedience to legal, civil Authority to all Magistrates in their legal commands in civil matters; or at least passive yielding to the penalty of the Laws, in case of not obeying actively; and neither further then to legal commands of legal Authority, appears by the Apostle’s reason in this 1. verse. For there is no power but of God; which he redoubles in a second phrase, The powers that be are ordained of God, or under God … Every soul must be under their order … because they all are ordered by God under him, his deputies and vicegerents in their order and degree, higher and highest.

This is true of all powers, and therefore to all must subjection be performed. And to none hath God ordered or ordained any Authority but legal. Which as none will deny (no not the Doctor himself) of other Governors besides the supreme: So can none with reason affirm, that any hath more authority then the Laws, whether special or general, written or unwritten, have allotted them. Which Laws God ratifies (being not against his) and so the Authority according to them.

And this our Doctor also confesses (in sense) in more places then one of his Book, for active Obedience, that no more is due, but according to the Laws of God, and the established laws of the Land. Only he argues for passive obedience beyond this, every where. 1. Because he argues against resistance even of Tyranny. But in a word to refute this from the Apostle’s reason in the first verse.

If I be bound to be subject to tyranny, (or to suffer violence of a tyrant) by virtue of the commandment here. Then tyranny is the Ordinance of God, or Magistrates have power ordained of God to use tyrannous violence (for thus the Apostle argues for subjection from God’s ordaining the power) But this is false. Ergo, so is that, that I should be bound to suffer tyrannous violence. …

But I say again, that by all the foregoing context, and the reason from God’s Ordinance in the second verse: The prohibition of blaming of resistance, goes no further, then, of legal commands of legal authority. The Doctor will not (doth not) say that the most peremptory, or obstinate refusing to obey actively tyrannous and illegal commands is resistance. By what authority then of the Text or context will he stretch the prohibition to refusing to suffer tyrannous violence?

<blockquote><p>…it appears to me that no objection can be made to admitting into the consistory officers of justice and chiefs of police, provided they sit in it in the capacity of magistrates. But always let there be a due distinction observed between the two functions and conditions. To exclude persons that belong to the civil government from all superintendence in the spiritual administration, seems to me contrary to reason. What is essential is that when fitting persons shall have been elected to such an office, there should be no blending of their functions, nor the power of the sword confounded with what ought to be carefully kept distinct from it.</p></blockquote>

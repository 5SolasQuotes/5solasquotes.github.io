<blockquote><p>Goodness is the very opposite of harshness, cruelty, gruffness, severity, mercilessness–all of which are far removed from God. How unbecoming it is to have such thoughts about God! Such sinful emotions are found in man. The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17) . In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout (Soli Deo Gloria, 1992), 1:122-23</span></figcaption>

<blockquote><p>VI. The Purpose and Extent of the Atonement 5. THE WIDER BEARING OF THE ATONEMENT. The question may be raised, whether the atonement wrought by Christ for the salvation of the elect, and of the elect only, has any wider bearing… Several Reformed theologians hold that, though Christ suffered and died only for the purpose of saving the elect, many benefits of the cross of Christ do actually — and that also according to the plan of God — accrue to the benefit of those who do not accept Christ by faith. They believe that the blessings of common grace also result from the atoning work of Christ. [Cf. Witsius, De Verbonden II, 9.4; Turretin, Loc. XIV, Q. 14, Sec. 11; Cunningham, Hist. Theol. II, p. 332; Hodge, The Atonement, 358 and elsewhere; Grosheide in the Evangelical Quarterly, April, 1940, p. 127. Cf. also Strong, Syst. Theol., p. 772.]</p></blockquote>

<blockquote><p>Thirdly, the Lord makes use of this outward and common covenanting with all receivers of the offer, as a mean to draw the confederate in the letter, to be confederate in the spirit; for, the faith which he requires as the condition of the covenant, he works in the elect, if not before, or with the external covenanting, yet undoubtedly after, in a time acceptable, and that by the ordinary means, the use whereof is granted to all confederate externally: and so as common illumination is a mean to that special, spiritual and saving illumination; and dogmatic or historical faith, is a mean unto saving faith; and external calling, is a mean of effectual calling, So external covenanting in the letter, is a mean most fit, and accommodate to make a man a covenanter in the spirit.</p></blockquote>

<blockquote><p>The words ‘in love’ [in Eph. 1:4] allow of two senses: either of our kindness and love towards our neighbor through which imitating God Himself as best we can through his Spirit dwelling within us, we eagerly do good to all men; or of the love of us in an objective sense, the love wherewith God has loved us–so that we have a further mention of the cause of our election, which is solely the boundless love of God with which he embraces us in his Son.</p></blockquote>

<blockquote><p>Nebuchadnezzar… was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven… And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion is an everlasting dominion, and his kingdom is from generation to generation. And all the inhabitants of the earth are reputed as nothing: and He doeth according to his will in the army of heaven, and among the inhabitants of the earth… At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me…</p></blockquote>

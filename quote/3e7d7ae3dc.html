<main class="wrap"><figure class="quote" id="q-3e7d7ae3dc" data-kw="">
<blockquote><p>Every secesion is not evil and schismatical, but only that which is made rashly and unjustly. Since this cannot be said of ours [from Rome] (which had the most weighty and highly necessary causes), schism cannot be charged upon us…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-06dba7071a" data-kw="">
<blockquote><p>5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principal Duty of Parliament-Men, or, A Short &amp; Compendious Treatise Concerning the Unity &amp; Unanimity which Should be in the Members of that Honourable Assembly (London, 1641), p. 46. Ward, a civil officer, was speaking to the English parliament.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.”

— Richard Ward, The Principal Duty of Parliament-Men, or, A Short &amp; Compendious Treatise Concerning the Unity &amp; Unanimity which Should be in the Members of that Honourable Assembly (London, 1641), p. 46. Ward, a civil officer, was speaking to the English parliament.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+Remember%2C+that+you+have+all+but+one+end+and+one+aim%2C+that+is%2C+you+are+all+of+you+elected+and+called+to+this+assembly+for+the+glory+of+your+God%2C+the+honor+of+your+king%2C+the+welfare+of+his+people%2C+the+peace+and+purity+of+the+Church%2C+the+punishing+of+offenders%2C+the+reforming+of+abuses+and+the+taking+away+of+all+polluted+and+pernicious+doctrines+and+practices+from+amongst+us.+And+then+the+remembrance+hereof+will+be+a+means+to+make+you+one.%E2%80%9D%0A%0A%E2%80%94+Richard+Ward%2C+The+Principal+Duty+of+Parliament-Men%2C+or%2C+A+Short+%26+Compendious+Treatise+Concerning+the+Unity+%26+Unanimity+which+Should+be+in+the+Members+of+that+Honourable+Assembly+%28London%2C+1641%29%2C+p.+46.+Ward%2C+a+civil+officer%2C+was+speaking+to+the+English+parliament.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06dba7071a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06dba7071a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-peace-purity-of-the-church/#:~:text=5.%20Remember%2C%20that%20you%20have%20all,a%20means%20to%20make%20you%20one&amp;text=5.%20Remember%2C%20that%20you%20have%20all%20but%20one&amp;text=will%20be%20a%20means%20to%20make%20you%20one" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-25febfab2b" data-kw="">
<blockquote><p>2. None of the corruptions which they falsely term, are of that high nature as to call for a personal separation, because none of them are fundamental. The least corruption that we can certainly espy, which yet is not in constitution, but in execution, we must separate from, in judgment, in affection, in practice, but to separate personally for any error not fundamental, let them teach it them to whom all errors are alike, but we may not be so dull.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Sermons: the one A Heavenly Voice calling all God’s people out of Romish Babylon; the other An Everlasting Record of the utter ruin of Romish Amalek (Lonodon, 1624), A Heavenly Voice</cite>, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-c6c4db6eae" data-kw="">
<blockquote><p>Seeing the motion of furthering ecclesiastical reconcilement amongst Protestants has been hitherto very favourably entertained by foreign States and Churches… that there is a most laudable purpose intended, and a good inclination expressed towards the furthering of the good of all Protestants, for the preservation of true religion and the union of their Churches with ours in the same cause, against the common enemies, which by our divisions are encouraged to intend, and enabled to work out our destruction; which they will certainly bring to pass if the Fatherly providence of our good God, whose counsels are unsearchable, and his ways past finding out, does not prevent their malice, by our loving concurrence in the ways of brotherly union, for the maintaining of his glorious Gospel… Therefore your petitioner does humbly request, that in the order, which hopefully will be made for the observation of that day of fasting and praying, this purpose of ecclesiastical reconcilement of Protestants by the union of their spirits in the truth of God, and against the adversaries of Christ’s Gospel, may be expressly mentioned to be recommended unto God by the prayers of that public meeting. And also, that some divines may be thought upon and nominated unto your petitioner, to whom he should make his address to begin a spiritual correspondence, which in this purpose is necessary, for the preparing and ripening of such proposals, as by the grace of God will be able to bring the wished for union of Protestants in due time to some perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/articles-of.html">Articles of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Petition to the Honorable House of the Commons in England now Assembled in Parliament, whereunto are Added Certain Considerations Showing the Necessity of a Correspondence in Spiritual Matters Betwixt All Protestant Churches (London, 1642) 4 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

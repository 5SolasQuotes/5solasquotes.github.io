<main class="wrap"><figure class="quote" id="q-a882442396" data-kw="">
<blockquote><p>Every person who shall be chosen a member of either house, or appointed to any office or place of trust, before taking his seat, or entering upon the execution of his office, shall take the following oath… ‘I, A B, will bear true allegiance to the Delaware State… do profess faith in God the Father, and in Jesus Christ his only Son, and in the Holy Ghost, one God, blessed for evermore: and I do acknowledge the holy scriptures of the Old and New Testament to be given by divine inspiration.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/delaware.html">State of Delaware</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of Delaware</cite>, 1776, Article 22 (Thorpe, 1.566)</span></figcaption>

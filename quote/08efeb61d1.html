<main class="wrap"><figure class="quote" id="q-08efeb61d1" data-kw="">
<blockquote><p>God’s Children though they sin, yet still they are in covenant with God; God hath taken them in to an everlasting covenant with himself, that shall never be broken: Though they do offend, God will not charge it upon them as the breach of that great covenant of grace that God hath made with them in his Son, that’s an everlasting covenant; God hath made a covenant to unite their hearts to fear his name, that he will never depart from them; and that he will put his fear into their hearts, and they shall never depart from him, notwithstanding all their infirmities: This must be made good, this covenant that God hath made with them, must stand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gate</cite>, (London, 1668), pp 98-99.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c387c9c582" data-kw="">
<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jonah</cite>, ch. 4, verse 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-e2aa4918d7" data-kw="">
<blockquote><p>2. [About the word “righteousness“:] It cannot be denied but that in many places its used for that propensity in God whereby from his hatred to sin He punishes wicked men; and thus it must be here [in Ps. 11:7], as the context evidences. Thus it is evidently used 2 Chron. 12:6; Rom. 2:5. Therefore in the next place, righteousness attributed to God signifies in the general that rectitude and purity in God’s nature, whereby He is free from all sin and hates all iniquity. And then more particularly that attribute in God whereby He does punish ungodly men:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654) | sect. 1, Sermon 1, Demonstrations of God’s Righteousness; The Kinds of it, and in what sense its attributed unto God, p. 3</span></figcaption>

" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-56f3aee1cf" data-kw="">
<blockquote><p>Although a native-born Scot, John Cameron (1579-1625) was a noted theologian among the French Huguenots. The English Puritan, Samuel Bolton published Cameron’s Certain Theses on covenant theology as an appendix to his famous book The True Bounds of Christian Freedom:

I Thesis

Covenant in Scripture, doth sometimes signify the absolute Promise of God without any restipulation; as what that Covenant which God made with Noah presently after the Flood, freely promising never to destroy the world again by water; of this kind is that Covenant, in which God promiseth to give unto his Elect, faith and perseverance: to which promise there cannot be conceived any condition to be annexed, which is not comprehended in the promise it self.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), p. 353.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-c8f5ff4e9d" data-kw="">
<blockquote><p>These things being observed, we may consider that the Scripture doth plainly and expressly make mention of two testaments, or covenants, and distinguish between them in such a way, as what is spoken can hardly be accommodated unto a twofold administration of the same covenant. The one is mentioned and described, Exodus 24:3-8, Deuteronomy 5:2-5, — namely, the covenant that God made with the people of Israel in Sinai; and which is commonly called “the covenant,” where the people under the old testament are said to keep or break God&#x27;s covenant; which for the most part is spoken with respect unto that worship which was peculiar thereunto. The other is promised, Jeremiah 31:31-34, 32:40; which is the new or gospel covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 91</span></figcaption>

<blockquote><p>Assertion 5: Good works are understood to have a causative power for eternal life in three ways. 1. As strictly meritorious, which we reject against the papists as blasphemous, as we proved in another place. 2. That they may have an inferior and causal instrumental power conferred upon them by the grace of God, as Gisbertus Voetius says in Thersite Heautontemerumeno, section. 1, ch. 2, just as running is the cause of the attaining of a crown which is received, contending the cause of the victory, and diet is a cause of health [1 Cor. 9:24-25; Heb. 12:1]. Neither may one be said to distinguish accurately here between a means and a cause, or between a way and a cause: for while good works are means, they are not passive, but active: a means here is an inferior cause. Therefore it is said, “For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory”. Κατεργάζεται ἡμῖν, they work, they bring about a cause for us, as the Holy Spirit speaks, 2 Cor. 4:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>p. 532 of ’10. Whether good works are necessary as causes of justification, and therefore also of salvation? in Ch. 12, ‘On the Justification of Sinners’ in Examination of Arminianism (Utrecht, 1668)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>

<blockquote><p>XII. The Adjuncts of good works are, their imperfection and their necessity nevertheless. … XV. Good works are necessary by the necessity of precept and of the means, but not by the necessity of the cause or merit. By the necessity of precept they are necessary, because the study of good works through all the Scriptures is most severely enjoined to us: They are necessary in regard of the means, because they are sure marks of Vocation, Election, and true Faith; and because they are the way and means to attain heavenly bliss: As if a man should make a journey from York to London to obtain an inheritance, the way or journey is them medium or means, but not the meriting cause or the inheritance; even so it is in this matter.</p></blockquote>

</figure><figure class="quote" id="q-245cbc81d0" data-kw="">
<blockquote><p>Of what then does our Lord in this place [Mt. 25:35,42] say that the god works of the holy are the cause; for they are added with the causal conjunction ‘for I was an hungered.’ etc.? They are the cause of the full attainment to and enjoyment of this kingdom, not of the right to it… God therefore makes the good works of those who are His, causes both of increasing and daily perfecting their salvation, and at length of fully enjoying it also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputata Ratisbonae, in altero colloqui, Anno XLVI. Et Collocutorum Augustanae Confessionis Responsa … De Justificatione, et locis doctrinae Euangelicae omnibus, quos doctrina de Iustificatione complectitur… (1548) as translated in Forbes, Justification, p. 311. Rutherford quotes from this work of Bucer to the same effect as below approvingly in his Examination, pp. 531-531.</cite>, p. 94</span></figcaption>

</figure><figure class="quote" id="q-ac017145c5" data-kw="">
<blockquote><p>What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works? 1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake. 2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake. 3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance. 4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith. 5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith. 6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (London, 1606), ch. 32, ‘Of Good Works’</cite>, p. 376-77</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works? 1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake. 2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake. 3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance. 4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith. 5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith. 6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).”

— William Bucanus, Institutions of Christian Religion (London, 1606), ch. 32, ‘Of Good Works’, p. 376-77">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+to+be+observed+in+the+sayings+of+the+Scriptures+wherein+justification%2C+salvation+and+life+eternal+is+ascribed+to+works%3F+1.+Legal+sentences+are+to+be+understood+of+perfect+good+works%2C+such+as+none+can+be+found+in+no+creature%3B+But+evangelical+sentences+do+always+include+faith+in+our+works.+And+we+must+understand+that+by+faith+in+the+first+place%2C+justification+is+received%2C+and+acceptation+to+life+eternal%3A+afterward+in+the+second+place+and+by+consequence%2C+works+are+accepted+as+the+fruits+of+faith%2C+and+life+eternal+is+promised+to+these+for+Christ%E2%80%99s+sake.+2.+In+such+sayings%2C+there+are+not+brought+forth+arguments+from+the+cause+%5Bas+to%5D+why+the+person+is+made+partaker+of+eternal+life%2C+but+it+is+showed+from+the+effects+or+the+adjuncts+what+person+is+partaker+of+remission+of+sins+and+life+eternal+%28so+Lk.+7%3A47%29.+Christ+plainly+proves+in+way+of+resolution+by+this+argument+that+the+woman%E2%80%99s+sins+were+pardoned+because+she+loved+much.+But+two+diverse+questions+are+at+no+hand+to+be+confounded.+The+one+to+whom+life+eternal+is+given%2C+the+other+for+what+cause+it+is+given.+To+them+that+do+well+and+meditate+in+the+law+of+God%2C+is+happiness+and+life+eternal+promised%2C+but+yet+it+is+given+freely+for+Christ%E2%80%99s+sake.+3.+In+this+question+we+must+remember+to+observe+a+rule+of+the+Rabbins+concerning+the+Holy+Scriptures.+In+every+place+wherein+thou+lightest+on+an+objection+for+an+heretics%2C+thou+findest+a+medicine+in+the+side+thereof.+So+the+scripture%2C+wheresoever+it+ascribes+eternal+life+to+works+as+a+reward%2C+calls+it+an+inheritance.+4.+When+as+diverse+effects+do+depend+alike+of+one+and+the+self+same+cause%2C+the+consequence+from+one+effect+avails+to+another+because+of+their+common+dependence%2C+as+Lk.+7%3A47%2C+the+consequence+from+love+avails+%28to+prove%29+the+remission+of+sins%3A+because+each+of+them+depends+on+faith.+5.+Where+there+is+a+subject+there+is+his+propriety%2C+and+on+the+contrary+where+there+is+a+propriety+there+is+his+subject.+So+where+there+is+faith+there+be+works%2C+and+where+there+be+good+works+there+is+faith.+6.+Seeing+good+works+do+spring+from+faith%2C+whatsoever+is+attributed+to+them%2C+must+needs+be+ascribed+to+the+root+%28i.e.+faith%2C+whence+they+spring%29.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion+%28London%2C+1606%29%2C+ch.+32%2C+%E2%80%98Of+Good+Works%E2%80%99%2C+p.+376-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac017145c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac017145c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=What%20is%20to%20be%20observed%20in,root%20%28i.e.%20faith%2C%20whence%20they%20spring%29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

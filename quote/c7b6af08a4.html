<main class="wrap"><figure class="quote" id="q-c7b6af08a4" data-kw="">
<blockquote><p>Mind holy performances in thy family. Every master of a family is a priest, and his whole family should be a royal priesthood, offering at least morning and evening sacrifice to God, acceptable through Jesus Christ. The Jews had sacrifice in their families, as well as in the tabernacle, Exod. xii. 2. ‘ Let me go, I pray thee, for our family hath a sacrifice in the city,’ saith David to Jonathan, 1 Sam. vi. 20.

It was prophesied that in the days of the gospel the Spirit should be poured down upon men, and they should see Christ, and mourn ‘every family apart,’ Zech. ii. 10. It was the advice of Jerome to a pious matron, So take care of thine house, as alway to allow liberty and time to thy soul. The governor hath the cure of the souls as well as of the bodies in his family; and if he mind their outward man and neglecteth their inward, he is but a brute in human shape, for beasts feed the bodies of their young.

As the school fitteth young men for the university, so holy performances in private prepare servants and children for, and help them to profit by, the ordinances of God in public. A foundation well laid by the master of a family is a great help to the minister when he goeth to rear and raise the building. Confident I am our work would not have half that difficulty which now it hath, if masters of families would but do their duties.

He that findeth his timber ready hewn to his hand hath a great advantage in setting up a house of him that must fell, bark, season, and hew it himself. It is no wonder that an apprentice is so backward to his work and so bungling at it, when he is wholly unacquainted with it and a stranger to it. If children and servants were accustomed to religious exercises at home, sermons would not be so tedious nor Sabbaths so tiresome to them as they are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling</cite>, (1661-65) in The Works of George Swinnock, M.A. (5 vols, Edinburgh: James Nichol, 1868), 1: 337-38.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9b601c8d0" data-kw="">
<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

136.%20%5Bm%5D%20Micah%206%3A8&amp;text=The%20duties%20required%20in%20the%20first%20commandment%20are&amp;text=l%5D%20Jer.%2031%3A18.%20Ps.%20119%3A136.%20%5Bm%5D%20Micah%206%3A8" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2141fcea92" data-kw="">
<blockquote><p>The restless, high-pressure hurry in which men live endangers the very foundations of personal religion. Daily private prayer and daily Bible-reading are too often jostled into a corner, and hastily slurred over. Body and mind are wearied out, when Sunday arrives, by the intense struggle of week-day life. Church services are listlessly attended, and sometimes neglected altogether. The temptation to idle away God’s day, or to spend it in visiting or dining out, becomes almost irresistible. Little by little the soul gets into a languid and relaxed condition, and the fine edge of conscience becomes blunt and dull.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Upper Room: Being a Few Truths for the Times</cite>, (1880; Edinburgh: Banner of Truth, 1970), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-9fb55b28b1" data-kw="">
<blockquote><p>We ought not to worship God with any other external Worship, than what himself hath commanded and appointed us in his holy Word.

The Scripture hath set us our Bounds for Worship, to which we must not add, and from which we ought not to diminish; for whosoever doth either the one or the other, must needs accuse the Rule either of Defect in things necessary, or of Superfluity in things unnecessary: which is an high Affront to the Wisdom of God, who as he is the Object, so he is the Prescriber of all that Worship which he will accept and reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London: Nathanael Ranew, 1692), pp 126-27.</span></figcaption>

</figure><figure class="quote" id="q-95f09a7369" data-kw="">
<blockquote><p>Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 3, pp. 46-47</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.”

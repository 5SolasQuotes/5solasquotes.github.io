<main class="wrap"><figure class="quote" id="q-79b15337b3" data-kw="">
<blockquote><p>That I am not my own, but belong—body and soul, in life and in death—to my faithful Savior, Jesus Christ. He has fully paid for all my sins with his precious blood, and has set me free from the tyranny of the devil. He also watches over me in such a way that not a hair can fall from my head without the will of my Father in heaven; in fact, all things must work together for my salvation. Because I belong to him, Christ, by his Holy Spirit, assures me of eternal life…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 1</span></figcaption>

</figure><figure class="quote" id="q-e2cf359f99" data-kw="Affliction Submission">
<blockquote><p>How kind is God in wisely and mercifully deciding so many things for us! The man who fears God and loves his little daughter, would esteem it a greater affliction to be called on to say when his child should be sick—than he now finds it to nurse her through weeks of disease, close her eyes in death, and then carry her to the grave. God very mercifully bears the heaviest part of all our trials, by marking out our course for us. God is governor. We are servants. To us belong obedience, submission, acquiescence. It is not ours to guide, to decide what is best, to rule the world, to shape the course of events.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Mysteries of God’s Providence”</span></figcaption>

</figure><figure class="quote" id="q-972b5259c7" data-kw="Mary Queen of Heaven Submission">
<blockquote><p>This phrase, Behold the handmaid of the Lord, doth not speak her the lady and queen of heaven, (as the papists style her), but it speaketh her humility and readiness to give up herself to the Lord&#x27;s pleasure, her assent and consent unto God.</p></blockquote>

</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

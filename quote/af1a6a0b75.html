<main class="wrap"><figure class="quote" id="q-af1a6a0b75" data-kw="">
<blockquote><p>Who would think there were any evil in forcing of virginity, chastity, or single life? He that is unmarried, careth for the things of the Lord, how he may please the Lord, that he may be holy, both in body and also in spirit: would God it were so with all that have taken the profession of single life: but the colour is fair. Hence hath it grown, that bishops and priests, and young men and maidens, have continued single. This seemed strange, and a miracle, and a matter of great holiness.

But this is a mystery; this is a way to bring in antichrist. Mark what St. Paul speaketh hereof (1 Tim. iv): “They shall forbid to marry.” Of whom speaketh he? of antichrist and his disciples, they shall forbid lawful marriage, as unholy, and as a state of life unfit for their holiness. Yet Christ Jesus, the Son of God, did never forbid it: his Apostles were married, and had wives.

“This (saith St. Paul) is a mark of antichrist, by this shall he be known.” Forbidding of marriage is a doctrine of devils; not of Christ, or of God, but of devils. It is a gulf, it is a sea, it is a world, it is a hell of iniquity, and the vilest villainy that ever crept into the church of God. Jerome expounding the words of Daniel (chap.vii.), “He shall have no regard to the desires of women,” saith, “The better exposition hereof is, to apply these words to antichrist, for that he shall pretend chastity, that he may deceive many.” This is the mystery of iniquity. This is the practice of antichrist: he shall come with a cloak of counterfeited chastity, not with true chastity, both in body and also in spirit; but with counterfeit chastity, and so shall deceive the hearts of many.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 216-17.</span></figcaption>

<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>

<blockquote><p>Our Saviour Christ proceeding further, to restore the seventh commandment to his perfection, doth here confute a false interpretation of a Politick law of Moses, given by the Scribes and Pharisees. For this end, first he lays down the words of Moses politick law; but yet so, as containing in them the false interpretation of the Jewish teachers, ver. 31. then he opposeth the truth of God, against their false interpretation, and maintaineth the first institution of marriage, v. 32.

For the first, Moses politick law was, That he which put away his wife, should give her a Bill of divorce. This law the Jewish Teachers did falsely interpret; for the better perceiving whereof, these three points are to be handled, touching Moses politick law: 1. what kind of law it was: 2. the straightness of that law: 3. what effect and force it had. For the first, the law is set down, Deut. 24. 1. when a man marrieth a wife, and she find no favour in his eyes, because he hath espied some filthiness in her; then let him write her a bill of divorce, and put it in her hand, and send her out of his house. This law was not moral, but civil, or politick, for the good ordering of the common wealth.

Now among their particular laws, some were laws of toleration, and permission, which were such as did not approve of the evil which they concerned, but did only tolerate and permit that evil which could not be avoided, for the preventing of a greater evil, which otherwise would fall out. As when the sea hath made a breach into the land, if it cannot possibly be stopped, the best course is, to make it as narrow as may be. Such was the law concerning usury, Deut. 23. 20. permitting the Jews to exercise it upon a stranger, but not towards a brother: and the like was the law touching polygamy, Deut. 21. 15.

If a man had two wives, the one hated, the other loved, and they both have borne him children; if the first borne be the son of the hated (though she were married to him the latter) yet her seed was legitimate, and her son had the right of the first borne. In both which laws were tolerated, that which God condemned, only for the preventing of a greater evil. Under this sort comes our law of usury, for taking ten in the hundred, not approving but permitting so much, for the avoiding of greater usury.

Unto this kind, the Papists would reduce their law of permitting Stews, for the preventing of greater sins; but that law can have no title to such permission: for a law of permission, is to diminish that evil, which by man cannot possibly be cut off altogether: now that sin which they would prevent by their Stews, might be cut off among them, if they would give allowance to God’s own ordinance of lawful marriage, unto all sorts and sexes. So likewise this law of Moses for divorce, was a law of permission, not approving of the giving a bill of divorce for every light cause, but tolerating of it, for the preventing of greater mischief, even of murder: for the nature of the Jews was this; if a man once took dislike to his wife, he would never be at rest till he had shed her blood, if they might not be parted asunder.

Now this law of divorce, was given to restrain this great evil, for hereby a man was tolerated to put away his wife, when she found no favour in his eyes, lest he should kill her; yet so, as he gave her a bill of divorce, wherein he must set down the cause why he put her away: whereby also, many were restrained from putting away their wives, because it was a great shame, for a light occasion, so highly to transgress God’s holy institution, who made them by marriage, one flesh. The truth of this may appear by the Lord’s own complaint, against his people, to whom he speaketh, as to a wife that had forsaken her husband, without a cause on his behalf, Isay 50. 1. Where (saith he) is that bill of your mother’s divorcement, whereby I sent her away? As if he should say, I gave her no bill, but her departure and separation from mee, is by her own sins: which phrase sheweth what was the custom of the Jews in this case.

II. Point. The straightness of this law appears in this, that the man only was permitted to give this bill unto his wife, but the wife might not give it to her husband; for Moses saith, Whosoever shall put away his wife: neither is there any place in Scripture, to prove that the wife had this liberty, so to deal with her husband. If it bee asked, whether the wife in a just cause, as for adultery, had not the like liberty:

I answer, If we respect God’s institution touching marriage, the right of divorce is equal to them both; for in regard of the bond of marriage, they are equally bound one to another. Here indeed this liberty is permitted only to the man, by this politick law, not that he had more right, but to prevent the evil, of the hardness of his heart, who taking displeasure at his wife, would rather spill her blood, then continue with her. If it be alleged, that a man is the woman’s head: I answer, that is for regiment and direction in her place, but not in regard of breaking the bond of marriage, whereby he is bound to his wife, as well as she to him, as the Apostle teacheth, 1. Cor. 7. 4.

III. Point. The force and effect of this law was this, It made the Bill of divorcement for any cause given, to be tolerable before men; &amp; marriage after such a divorce, lawful and warrantable in the Courts of men, Deut. 24. 4. But yet in the court of conscience before God, the divorcement it self, and second marriages made thereupon, were both unlawful; for God hateth this separation, Mal. 2. 15. And whether party soever marrieth another upon this divorce, commits adultery, Matth. 19. 9. This must be remembered, for the true understanding of this law of Moses; the first words whereof, are a permission, to this effect; If a man do conceive such a dislike against his wife, as that he will not abide with her, but will needs put her away, then he may; but yet so, as he give her a bill of divorce: which doth not acquit him before God, but before men only.</p></blockquote>

Now among their particular laws, some were laws of toleration, and permission, which were such as did not approve of the evil which they concerned, but did only tolerate and permit that evil which could not be avoided, for the preventing of a greater evil, which otherwise would fall out. As when the sea hath made a breach into the land, if it cannot possibly be stopped, the best course is, to make it as narrow as may be. Such was the law concerning usury, Deut. 23. 20. permitting the Jews to exercise it upon a stranger, but not towards a brother: and the like was the law touching polygamy, Deut. 21. 15.

If a man had two wives, the one hated, the other loved, and they both have borne him children; if the first borne be the son of the hated (though she were married to him the latter) yet her seed was legitimate, and her son had the right of the first borne. In both which laws were tolerated, that which God condemned, only for the preventing of a greater evil. Under this sort comes our law of usury, for taking ten in the hundred, not approving but permitting so much, for the avoiding of greater usury.

Unto this kind, the Papists would reduce their law of permitting Stews, for the preventing of greater sins; but that law can have no title to such permission: for a law of permission, is to diminish that evil, which by man cannot possibly be cut off altogether: now that sin which they would prevent by their Stews, might be cut off among them, if they would give allowance to God’s own ordinance of lawful marriage, unto all sorts and sexes. So likewise this law of Moses for divorce, was a law of permission, not approving of the giving a bill of divorce for every light cause, but tolerating of it, for the preventing of greater mischief, even of murder: for the nature of the Jews was this; if a man once took dislike to his wife, he would never be at rest till he had shed her blood, if they might not be parted asunder.

Now this law of divorce, was given to restrain this great evil, for hereby a man was tolerated to put away his wife, when she found no favour in his eyes, lest he should kill her; yet so, as he gave her a bill of divorce, wherein he must set down the cause why he put her away: whereby also, many were restrained from putting away their wives, because it was a great shame, for a light occasion, so highly to transgress God’s holy institution, who made them by marriage, one flesh. The truth of this may appear by the Lord’s own complaint, against his people, to whom he speaketh, as to a wife that had forsaken her husband, without a cause on his behalf, Isay 50. 1. Where (saith he) is that bill of your mother’s divorcement, whereby I sent her away? As if he should say, I gave her no bill, but her departure and separation from mee, is by her own sins: which phrase sheweth what was the custom of the Jews in this case.

II. Point. The straightness of this law appears in this, that the man only was permitted to give this bill unto his wife, but the wife might not give it to her husband; for Moses saith, Whosoever shall put away his wife: neither is there any place in Scripture, to prove that the wife had this liberty, so to deal with her husband. If it bee asked, whether the wife in a just cause, as for adultery, had not the like liberty:

I answer, If we respect God’s institution touching marriage, the right of divorce is equal to them both; for in regard of the bond of marriage, they are equally bound one to another. Here indeed this liberty is permitted only to the man, by this politick law, not that he had more right, but to prevent the evil, of the hardness of his heart, who taking displeasure at his wife, would rather spill her blood, then continue with her. If it be alleged, that a man is the woman’s head: I answer, that is for regiment and direction in her place, but not in regard of breaking the bond of marriage, whereby he is bound to his wife, as well as she to him, as the Apostle teacheth, 1. Cor. 7. 4.

III. Point. The force and effect of this law was this, It made the Bill of divorcement for any cause given, to be tolerable before men; &amp; marriage after such a divorce, lawful and warrantable in the Courts of men, Deut. 24. 4. But yet in the court of conscience before God, the divorcement it self, and second marriages made thereupon, were both unlawful; for God hateth this separation, Mal. 2. 15. And whether party soever marrieth another upon this divorce, commits adultery, Matth. 19. 9. This must be remembered, for the true understanding of this law of Moses; the first words whereof, are a permission, to this effect; If a man do conceive such a dislike against his wife, as that he will not abide with her, but will needs put her away, then he may; but yet so, as he give her a bill of divorce: which doth not acquit him before God, but before men only.”

— William Perkins, A godly and learned exposition of Christ’s Sermon in the Mount, (Cambridge: University of Cambridge, 1608), pp 141-43.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+Saviour+Christ+proceeding+further%2C+to+restore+the+seventh+commandment+to+his+perfection%2C+doth+here+confute+a+false+interpretation+of+a+Politick+law+of+Moses%2C+given+by+the+Scribes+and+Pharisees.+For+this+end%2C+first+he+lays+down+the+words+of+Moses+politick+law%3B+but+yet+so%2C+as+containing+in+them+the+false+interpretation+of+the+Jewish+teachers%2C+ver.+31.+then+he+opposeth+the+truth+of+God%2C+against+their+false+interpretation%2C+and+maintaineth+the+first+institution+of+marriage%2C+v.+32.%0A%0AFor+the+first%2C+Moses+politick+law+was%2C+That+he+which+put+away+his+wife%2C+should+give+her+a+Bill+of+divorce.+This+law+the+Jewish+Teachers+did+falsely+interpret%3B+for+the+better+perceiving+whereof%2C+these+three+points+are+to+be+handled%2C+touching+Moses+politick+law%3A+1.+what+kind+of+law+it+was%3A+2.+the+straightness+of+that+law%3A+3.+what+effect+and+force+it+had.+For+the+first%2C+the+law+is+set+down%2C+Deut.+24.+1.+when+a+man+marrieth+a+wife%2C+and+she+find+no+favour+in+his+eyes%2C+because+he+hath+espied+some+filthiness+in+her%3B+then+let+him+write+her+a+bill+of+divorce%2C+and+put+it+in+her+hand%2C+and+send+her+out+of+his+house.+This+law+was+not+moral%2C+but+civil%2C+or+politick%2C+for+the+good+ordering+of+the+common+wealth.%0A%0ANow+among+their+particular+laws%2C+some+were+laws+of+toleration%2C+and+permission%2C+which+were+such+as+did+not+approve+of+the+evil+which+they+concerned%2C+but+did+only+tolerate+and+permit+that+evil+which+could+not+be+avoided%2C+for+the+preventing+of+a+greater+evil%2C+which+otherwise+would+fall+out.+As+when+the+sea+hath+made+a+breach+into+the+land%2C+if+it+cannot+possibly+be+stopped%2C+the+best+course+is%2C+to+make+it+as+narrow+as+may+be.+Such+was+the+law+concerning+usury%2C+Deut.+23.+20.+permitting+the+Jews+to+exercise+it+upon+a+stranger%2C+but+not+towards+a+brother%3A+and+the+like+was+the+law+touching+polygamy%2C+Deut.+21.+15.%0A%0AIf+a+man+had+two+wives%2C+the+one+hated%2C+the+other+loved%2C+and+they+both+have+borne+him+children%3B+if+the+first+borne+be+the+son+of+the+hated+%28though+she+were+married+to+him+the+latter%29+yet+her+seed+was+legitimate%2C+and+her+son+had+the+right+of+the+first+borne.+In+both+which+laws+were+tolerated%2C+that+which+God+condemned%2C+only+for+the+preventing+of+a+greater+evil.+Under+this+sort+comes+our+law+of+usury%2C+for+taking+ten+in+the+hundred%2C+not+approving+but+permitting+so+much%2C+for+the+avoiding+of+greater+usury.%0A%0AUnto+this+kind%2C+the+Papists+would+reduce+their+law+of+permitting+Stews%2C+for+the+preventing+of+greater+sins%3B+but+that+law+can+have+no+title+to+such+permission%3A+for+a+law+of+permission%2C+is+to+diminish+that+evil%2C+which+by+man+cannot+possibly+be+cut+off+altogether%3A+now+that+sin+which+they+would+prevent+by+their+Stews%2C+might+be+cut+off+among+them%2C+if+they+would+give+allowance+to+God%E2%80%99s+own+ordinance+of+lawful+marriage%2C+unto+all+sorts+and+sexes.+So+likewise+this+law+of+Moses+for+divorce%2C+was+a+law+of+permission%2C+not+approving+of+the+giving+a+bill+of+divorce+for+every+light+cause%2C+but+tolerating+of+it%2C+for+the+preventing+of+greater+mischief%2C+even+of+murder%3A+for+the+nature+of+the+Jews+was+this%3B+if+a+man+once+took+dislike+to+his+wife%2C+he+would+never+be+at+rest+till+he+had+shed+her+blood%2C+if+they+might+not+be+parted+asunder.%0A%0ANow+this+law+of+divorce%2C+was+given+to+restrain+this+great+evil%2C+for+hereby+a+man+was+tolerated+to+put+away+his+wife%2C+when+she+found+no+favour+in+his+eyes%2C+lest+he+should+kill+her%3B+yet+so%2C+as+he+gave+her+a+bill+of+divorce%2C+wherein+he+must+set+down+the+cause+why+he+put+her+away%3A+whereby+also%2C+many+were+restrained+from+putting+away+their+wives%2C+because+it+was+a+great+shame%2C+for+a+light+occasion%2C+so+highly+to+transgress+God%E2%80%99s+holy+institution%2C+who+made+them+by+marriage%2C+one+flesh.+The+truth+of+this+may+appear+by+the+Lord%E2%80%99s+own+complaint%2C+against+his+people%2C+to+whom+he+speaketh%2C+as+to+a+wife+that+had+forsaken+her+husband%2C+without+a+cause+on+his+behalf%2C+Isay+50.+1.+Where+%28saith+he%29+is+that+bill+of+your+mother%E2%80%99s+divorcement%2C+whereby+I+sent+her+away%3F+As+if+he+should+say%2C+I+gave+her+no+bill%2C+but+her+departure+and+separation+from+mee%2C+is+by+her+own+sins%3A+which+phrase+sheweth+what+was+the+custom+of+the+Jews+in+this+case.%0A%0AII.+Point.+The+straightness+of+this+law+appears+in+this%2C+that+the+man+only+was+permitted+to+give+this+bill+unto+his+wife%2C+but+the+wife+might+not+give+it+to+her+husband%3B+for+Moses+saith%2C+Whosoever+shall+put+away+his+wife%3A+neither+is+there+any+place+in+Scripture%2C+to+prove+that+the+wife+had+this+liberty%2C+so+to+deal+with+her+husband.+If+it+bee+asked%2C+whether+the+wife+in+a+just+cause%2C+as+for+adultery%2C+had+not+the+like+liberty%3A%0A%0AI+answer%2C+If+we+respect+God%E2%80%99s+institution+touching+marriage%2C+the+right+of+divorce+is+equal+to+them+both%3B+for+in+regard+of+the+bond+of+marriage%2C+they+are+equally+bound+one+to+another.+Here+indeed+this+liberty+is+permitted+only+to+the+man%2C+by+this+politick+law%2C+not+that+he+had+more+right%2C+but+to+prevent+the+evil%2C+of+the+hardness+of+his+heart%2C+who+taking+displeasure+at+his+wife%2C+would+rather+spill+her+blood%2C+then+continue+with+her.+If+it+be+alleged%2C+that+a+man+is+the+woman%E2%80%99s+head%3A+I+answer%2C+that+is+for+regiment+and+direction+in+her+place%2C+but+not+in+regard+of+breaking+the+bond+of+marriage%2C+whereby+he+is+bound+to+his+wife%2C+as+well+as+she+to+him%2C+as+the+Apostle+teacheth%2C+1.+Cor.+7.+4.%0A%0AIII.+Point.+The+force+and+effect+of+this+law+was+this%2C+It+made+the+Bill+of+divorcement+for+any+cause+given%2C+to+be+tolerable+before+men%3B+%26+marriage+after+such+a+divorce%2C+lawful+and+warrantable+in+the+Courts+of+men%2C+Deut.+24.+4.+But+yet+in+the+court+of+conscience+before+God%2C+the+divorcement+it+self%2C+and+second+marriages+made+thereupon%2C+were+both+unlawful%3B+for+God+hateth+this+separation%2C+Mal.+2.+15.+And+whether+party+soever+marrieth+another+upon+this+divorce%2C+commits+adultery%2C+Matth.+19.+9.+This+must+be+remembered%2C+for+the+true+understanding+of+this+law+of+Moses%3B+the+first+words+whereof%2C+are+a+permission%2C+to+this+effect%3B+If+a+man+do+conceive+such+a+dislike+against+his+wife%2C+as+that+he+will+not+abide+with+her%2C+but+will+needs+put+her+away%2C+then+he+may%3B+but+yet+so%2C+as+he+give+her+a+bill+of+divorce%3A+which+doth+not+acquit+him+before+God%2C+but+before+men+only.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+godly+and+learned+exposition+of+Christ%E2%80%99s+Sermon+in+the+Mount%2C+%28Cambridge%3A+University+of+Cambridge%2C+1608%29%2C+pp+141-43.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2cfd7b7fbc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2cfd7b7fbc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/25/william-perkins-on-the-political-law-of-moses-concerning-divorce/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-e412663113" data-kw="">
<blockquote><p>Six days shalt thou labour.] The command of due labour and diligence in our particular callings, is not of this place; it belongs properly to the Eighth precept, and in some way, to the Seventh: here, it is only mentioned premissively, and for illustration of this duty here enjoined.

And further, there is under it a motive from abundant equity: seeing that God hath made the proportion thus, not pinched to us, but dealt very liberally in the time granted for our own work, what gross, not impiety only, but iniquity and ingratitude will it be, to encroach upon that small part He hath nominated and set apart for His service! …

Thou shall labour six days.] Not so as in them to forget and take no notice of God, nor at all to call upon Him and worship Him, and think to acquit all by some kind of attendance on Him on the Sabbath. They who do so, are most unsanctified themselves, and therefore, cannot sanctify the Sabbath to God. Such profane persons do profane and pollute all they touch with their foul hands, for such be all profane hands lifted up to God in prayer.

The life of the godly is not a visiting of God only in His house on this day, but a daily and constant walking with God in our own houses, and in all our ways, making both our houses and our hearts. His houses, His temples, where He may dwell with us, and we may offer Him our daily sacrifices. Only, the peculiar of this day is, that we may not divide it betwixt Heaven and Earth, but it shall be wholly for the service of God, and no work at all to have place in it that may hinder that, and suits not with the sanctifying of it: for so we are to understand the word. No manner of work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, (1701) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 381.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-915e624165" data-kw="">
<blockquote><p>Things inconvenient even in matters of religion may be commanded in some cases (Circumcision was a burden, Acts 15:10, and these burdens called ‘necessary things,’ v. 28, and they were said to do well if they observe them, v. 29.): as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to preuent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary</cite>, pp. 586-98 on 1 Pet. 2:13 in A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), pp. 590-91</span></figcaption>

</figure><figure class="quote" id="q-ef42a8d959" data-kw="">
<blockquote><p>Is this rational, that where two commands of the magistrate are joined, the one undoubtedly lawful to be obeyed, the other doubted of, that subjects should disobey the magistrate in that which is clearly lawful, because they have a doubt or unclearness anent obeying him in the other command? Does it not become subjects to go as far on in obedience to lawful authority as they see they may without sin against God? Then it is time to stop when anything is put to them by virtue of the king’s command which they clearly see they cannot do without sin.</p></blockquote>

<blockquote><p>Lastly, No place is so sanctified by the miraculous special presence of God, but that presence ceases, when the tokens of God’s residence cease; the Ark, the Mercy-seat, the places became as before.

For us to go a pilgrimage to Jerusalem, and to the Temple, is an abominable thing; how many bloody battles have since been sought there? these places where the presence of God was, when abused to the dishonour of God, they become worse and worse: whatever we use in holy uses, loses their holiness when abused. It’s boldness for us to tie the presence of God to any place, for God hath not tied himself to any place.

I cannot but wonder, how it’s possible for men to hold, that the Lord’s day, which God hath been pleased to set apart for himself, that its holiness can cease; for that they say, the Lord’s day is not holier longer than the service is in doing; yet that the Church, that God never appointed, should retain its holiness, that you must not tread there, but with your hat off, nor come there without bowing the knee. …

There are several persons to be reproved; those that take pilgrimages to particular places, because of that holiness they suppose in them. I might tell you of their lying Reliques: I will not trouble you with them: suppose them true, what is this to Institution and command of God? where have you a command for such a thing? I might take notice of those that put holiness in places of Burial; in the Church; think it holier than the Church-yard; and one part of the Church holier than another; private prayer, rather than join in public: for any to bow towards the place of the Communion Table, rather than to any other place of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The burning yet un-consumed bush, or, The holiness of places discussed held forth in two farewell-sermons at Christ-Church London, August 17th, 1662</cite>, (London, 1662), pp 33, 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

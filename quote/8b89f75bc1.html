<main class="wrap"><figure class="quote" id="q-8b89f75bc1" data-kw="">
<blockquote><p>So little does Jesus imagine that the Ten Commandments were of local and temporary obligation that He treats them as the law of the universal and eternal kingdom which He came to establish. Nor has He left us to infer this merely from His dealing with them in such instances as this of the rich young ruler. He tells us explicitly that His mission as regards the law was, not to abrogate it, but “to fulfil it,” that is to say, “to fill it out,” complete it, develop it into its full reach and power. The law, He declares in the most solemn manner, is not susceptible of being done away with, but shall never cease to be authoritative and obligatory.

“For verily I say unto you,” He says, employing for the first time in the record of His sayings which have come down to us, this formula of solemn asseveration—”Verily I say unto you, till heaven and earth pass away, one jot or one tittle shall in no wise pass away from the law, till all things be accomplished.” So long as time endures, the law shall endure in full validity, down to its smallest details.

The concluding phrase of this declaration, rendered in our Revised Version, “until all things be accomplished,” and perhaps even more misleadingly in the Authorized Version, “till all be fulfilled,” is not a mere repetition of “Till heaven and earth pass away,” but means, in brief, “until all which the law requires shall be done, until no item of the law shall remain unobserved.” So long as the world stands no iota of the law shall pass away—till all that it prescribes shall be performed.

The law exists not to be broken or to be abrogated, but to be obeyed; not to be “undone,” to employ an old English phrase, but to be “done.” It is to be obeyed, and it shall be obeyed, down to the last detail; and therefore in no detail of it can it be set aside or safely neglected. “The thought is,” remarks H. A. W. Meyer justly, that “the law will not lose its binding obligation, which reaches on to the final realization of all its prescriptions, so long as heaven and earth remain.”

Now, the law of which our Lord makes this strong assertion of its ever-abiding validity includes, as one of its prominent constituent parts, just the Ten Commandments. For, as He proceeds to illustrate His statements from instances in point, showing how the law is filled out, completed by Him, He begins by adducing instances from the Ten Commandments: “Thou shalt not kill”; “Thou shalt not commit adultery.” It is with the Ten Commandments clearly in His mind, therefore, that He declares that no jot or tittle of the law shall ever pass away, but it all must be fulfilled.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80dd888a05" data-kw="">
<blockquote><p>The law as a rule of life is also of great use to believers. … Now in this point of view, it serves in the following ways, under the illuminating influences of the Holy Spirit: …To show them how far they are from perfection of holiness. In order to render them humbler and more contrite; to cause them to renounce, in a higher degree, all confidence in their own wisdom, righteousness, and strength; and to trust constantly and only in the Lord Jesus for all their salvation, the law discovers to them the sin that dwells in them and that cleaves to all their thoughts, words, and actions. It is of great use to teach them the need that they have to be more humble, penitent, and holy. And so it serves, in a high degree, to promote their sanctification and their desire to attain perfection of holiness (Rom. 7:22–24; Phil. 3:10–14). As it requires them to be holy in a perfect degree (Matt. 5:48), it shows them that their want of perfect conformity to it is, every moment, their sin and that they ought continually to press on toward perfection and long for heaven, where their holiness and happiness will be perfect (2 Cor. 5:2–4; Phil. 1:23).</p></blockquote>

<blockquote><p>2 Q. How many Commandments are there?

2. A. There are ten Commandments which are the sum and substance of all God’s perpetual Law. Deut. 10. 9. Exod. 34. 28.

Are there not ten?

Yes.

And, Are they not the sum and substance of all God’s perpetual Law?

Yes.

And, Hath not every one of them a general meaning and scope, and so encompasseth whatsoever tendeth to that?

Yes.

And, Do they not among them forbid all evil?

Yes.

And, Command all good?

Yes.

And, That in words &amp; thoughts as well as deeds?

Yes.</p></blockquote>

</figure><figure class="quote" id="q-01aff859f5" data-kw="law uses schoolmaster">
<blockquote><p>As the doctrine concerning the law of God properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life—as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin (Rom. 3:20). (3) For preparation for grace—in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24.</p></blockquote>

</figure><figure class="quote" id="q-771cc66c44" data-kw="">
<blockquote><p>As for that which they tax the ministers, to be ministers of the dead letter, one may plainly see the Lord’s taking vengeance upon the outrage offered unto his holy Word; smiting them with the spirit of giddiness, for having despised the true and only means of coming unto God, which is the Scripture and the Word of God. In the passage of the Corinthians where Paul says, “The letter kills, and the Spirit quickens;” let any closely consider, against whom the Apostle disputes, and they will understand his drift. It is very evident that Paul in this place, had to do with false Apostles, who preached and extolled the Law without Christ, and caused the people to recoil from salvation purchased by Christ, and the grace of the new covenant, whereunto the Lord had promised to write his Law in the heart of the faithful: the Law then being separated from Christ, as a body without a soul; and nothing comes from it but death, to those that are under it: it does nothing but beat and strike the ears, without quickening the soul, until by faith we are sent from it unto Christ, as from the usher to the master; and then the Law will be found such as David sings it, “The Law of the Lord is perfect, converting the soul; the testimony of the Lord is faithful, making Wise the simple: the commandments of the Lord are right, rejoicing the heart, etc.” Thus must we understand how it is said, “The Letter kills:” Paul called the Law, The killing Letter, and says, The Spirit quickens, i.e., The Ministry of the Gospel, which he opposes unto the naked Law; and he himself calls his preaching “The Ministry of the Spirit.</p></blockquote>

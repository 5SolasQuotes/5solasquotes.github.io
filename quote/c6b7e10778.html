<blockquote><p>209… We have no power… to will things not apprehended to be good… 210. The three conjunct powers of the soul [vital-active, intellective and volitive] suppose each other, though they are not formally the same: We have no power to will objects not understood, nor to understand, will or execute without vital-activity; nor to understand most things without the will’s determination ad exercitium [to the exercise].</p></blockquote>

</figure><figure class="quote" id="q-b15a672f4d" data-kw="">
<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… Traditionally, the act of entertaining a concept is known as simple apprehension; the act of affirming or denying the truth of a proposition is known as judgment; and the act of inferring a proposition from other propositions is known as reasoning. Simple apprehension, judgment, and reasoning are the intellect’s basic operations. Being rational or capable of thought is essentially a matter of having the capacity for these operations of the intellect.</p></blockquote>

<blockquote><p>XXIV. As for the Protestants, and those who among them are called Reformed by a special name, they also, by common consent, teach that God created man in true righteousness and holiness: according to Ecclesiastes, God made man upright. For that rectitude could consist in nothing else but conformity with the will and law of God, in which man’s righteousness consists. They also think that Paul alludes to this when he exhorts the faithful to put on the new man, who was created according to God in justice and holiness of truth. Where it is manifest that he alludes to the first creation, in which man is said to be created in the image and likeness of God; to which, in his view, belongs that holiness and justice which Christ works in the faithful by His Spirit. XXV. However, they do not place that holiness and justice in which the first man was created by God solely in the fact that he acknowledged God as his Creator, as was fitting, and adhered to Him with pure and sincere love, but also in the fact that all his faculties were so well constituted and ordered that the lower faculties obeyed the higher, and the higher obeyed God without difficulty and resistance; nor was there any inclination to evil or difficulty and resistance in doing good, such as is now found in all and each individual. Therefore, according to their opinion, in the newly created man, there was nothing disordered or immoderate. Nor did any struggle or conflict of his faculties among themselves have a place in him: but all his faculties, in the highest concord and order among themselves, conspired to the same end, namely that to which he was created by God, the author of nature. XXVI. Moreover, they contend that this righteousness was natural to the first man before the fall and should be called so. Not because it constituted part of the essence of human nature, or because it necessarily flowed from the principles of human nature: but because it was something created with nature and belonging to the innate endowments of human nature not yet fallen… Therefore, according to their doctrine, that original righteousness was a natural gift, not a supernatural one. And it related to the soul of integral man in the same way that the just proportion and beauty of the members, vigor, and decor related to his body, which were found in him then and which regarded a certain natural, not supernatural, perfection of man: although they were not of the essence of man, nor did they necessarily flow from the principles of human nature. … XLV. Furthermore, as can be inferred from what has been said, many in the Roman Church concede to the Reformed that original justice, whatever it should be called, whether natural or supernatural, was a perfection so owed to innocent man that, consistent with divine wisdom and goodness, he could not have been created without it: and therefore the state of man in pure natural things, as described by the common view of the Roman School, and in which it is supposed that man was not a sinner but devoid of justice, prone to vice, and struggling with concupiscence against right reason, is something merely fictitious; and which the goodness, justice, and wisdom of God in the nature of things never allowed to exist. XLVI. Conversely, the Protestant Doctors concede to the Roman School that original justice was not natural to the first man, in the sense that natural signifies what constitutes nature or what necessarily, or in a physical manner, flows from the principles of human nature. Moreover, many Doctors of the Reformed School do not deny that the first man had certain supernatural gifts: and that some grace was necessary for man, even when innocent, to act rightly and justly. Indeed, some of them acknowledge that original righteousness did not flow from the powers of nature [in some respect]. … LVII. However, this does not contradict what many Reformed distinctly teach, namely that there were some supernatural gifts in the first man. For God could add whatever He pleased above nature’s original endowments and the aids necessary for it; but what and how much that was, we do not dare, in the absence of Scripture, to define. However, it is certain from Scripture that there was some supernatural knowledge in the first man: since God revealed Himself to him above nature and taught him His will by express word.</p></blockquote>

<blockquote><p>…in the case of a rational substance, an end toward which it is directed can be known intellectually, and that the will or rational appetite just is that power by virtue of which such a subtance can aim at an end qua grasped by the intellect.ª ª We can, of course, also aim at ends that are not grasped by the intellect. For example, any human being aims at the end of circulating blood through his body, just by virtue of having a heart and blood vessels, and does so even if he is completely unaware of the existence of this circulatory system. It is precisely because we can iam at such ends without the intellect being cognizent of them that their pursuit is not the subject of the will. A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>

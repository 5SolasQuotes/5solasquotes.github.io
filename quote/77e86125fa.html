</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53fccf7f2e" data-kw="">
<blockquote><p>…[by] the abrogation of these ceremonies [of preparing manna the day before and not kindling a fire in the wilderness on the Sabbath by the Israelites] ought not Christians to turn into surquedry [arrogance] and excess of feasting (as too many do) so abusing their christian liberty: but to be used with all sobriety, such as may not hinder, but help the holy spiritual duties of this day by a due refreshing of the body, for necessity, not for superfluity. … So that the whole worship and service of God, and his saving knowledge for man’s salvation (to speak nothing of bodily refreshing and works of charity for the relief of the poor) having a necessary dependance, as touching the external means, upon the due observation of the Fourth Commandment in the morality of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law &amp; the Gospel Reconciled</cite>, … (London: Slatter, 1631), pp. 40-41</span></figcaption>

</figure><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21 Westminster divine, p. 152</span></figcaption>

</figure><figure class="quote" id="q-9a29be598b" data-kw="">
<blockquote><p>This delight is spiritual in God as the proper object, and in the ordinances as the only means to lead us unto God, Job 27:10; Ps. 43:4; Canticles, 2:3; Isa. 56:7. Reasons.

1. Because the duties of that day are higher, we have then all the means of communion with God:

1. We have them in a more raised solemn way without any interruption; there is then a double institution, not only of the worship, but the time.

2. Its a spiritual feast, a day of God’s appointment, our recompence as well as our duty, Neh. 2:26. Ordinances are fodinae gratiae [wells of grace], Isa. 12:3.

3. This day we come to remember the highest favours of God to the creature, to contemplate the works of Creation, God’s rest, and of Redemption, Christ’s rest, 1 Pet. 4:1, and our own eternal rest, Heb. 4:9, the Sabbaths of the faithful are the suburbs of Heaven, Heb. 12:23, the Lord’s Supper is heaven in a map, Luke 14:15; Mt. 26:29.

4. Many of the duties of the day are but spiritual recreations; meditation is the solace of the mind in the contemplation of God’s works, Ps. 104:34. Singing of Psalms is a vent for spiritual mirth, Lam. 5; Eph. 5:18-19; then God should be solemnly praised, Ps. 92:1-2.

5. It is the temper of the people of God to delight in his solemn worship, Ps. 2; 1 Cor. 2:12. Male concordat canticum novum et vetus homo [The new song and old man poorly agree]. Augustine; Ps. 84:1, 10; Ps. 122:1.

6. Delight in the Sabbath is the best way to discharge the duties:

1. With comfort; delight sweetens all; how will men toil at their sport? Neh. 11:8.

2. With profit, Isa. 64:5; God will not send them away sad which come into his presence with joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment, pp. 820-21</span></figcaption>

<blockquote><p>9. The strong, violent and firm persuasions of conscience in single persons, or in some communities of men, is not a sufficient indication of a moral law. The weak brother of whom St. Paul speaks durst not eat flesh, but thought it an impiety next to unpardonable, but he was abused: and there are at this day some persons, some thousands of persons against whose conscience it is to dress meat upon the Lord’s Day, or to use an innocent permitted recreation: Now when such an opinion makes a sect, and this sect gets firm confidents and zealous defenders, in a little time it will dwell upon the conscience as if it were a native there, whereas it is but a pitiful inmate and ought to be turned out of doors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., pp. 370-71</span></figcaption>

<div class="actions"><button class="copy" data-copy="“9. The strong, violent and firm persuasions of conscience in single persons, or in some communities of men, is not a sufficient indication of a moral law. The weak brother of whom St. Paul speaks durst not eat flesh, but thought it an impiety next to unpardonable, but he was abused: and there are at this day some persons, some thousands of persons against whose conscience it is to dress meat upon the Lord’s Day, or to use an innocent permitted recreation: Now when such an opinion makes a sect, and this sect gets firm confidents and zealous defenders, in a little time it will dwell upon the conscience as if it were a native there, whereas it is but a pitiful inmate and ought to be turned out of doors.”

<main class="wrap"><figure class="quote" id="q-9aa39ebf56" data-kw="">
<blockquote><p>…he [John Sprint] says that the suffering of deprivation for refusing to conform breeds and produces sundry scandals. First says he, it is the occasion of fraternal discord. O egregious impudency! who sees not that the ceremonies are the incendiary sparkles from which the fire of contention has its being and burning? so that conforming (not refusing) is the furnishing of fuel and casting of faggots to the fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-e4d6b93d76" data-kw="">
<blockquote><p>He speaks there of Jesus Christ the Righteous: the Son of God, who is here in my text likewise made the object of this knowledge. ‘Thou art Christ the Son of the living God,’ [Mt. 16] is by Christ Himself made the rock upon which the whole Church is builded, ‘And other foundation’ (says St. Paul) ‘can no man lay than that is laid, which is Jesus Christ.’ Not that we should think that there were no other fundamental doctrine to be acknowledged but this alone (for the articles of the Holy Ghost, forgiveness of sins, resurrection of the dead, eternal judgement, and such like other have their place also in the foundation), but because this is the most special object of faith, and the primary foundation of all the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration of the Universality of the Church of Christ &amp; the Unity of the Catholic Faith</cite>, … (London, 1629), pp. 38-39</span></figcaption>

</figure><figure class="quote" id="q-d0c5795f6d" data-kw="">
<blockquote><p>As the relatively strict confessionalism of the sixteenth and seventeenth centuries gave way to various patterns of deconfessionalization, it became increasingly difficult to justify and sustain a strict understanding of the fundamental articles. Among the Reformed themselves, the half century from 1675 to 1725 saw a shift from the attempt to define confessional orthodoxy in the strictest terms in the Formula Consensus Helvetica to the passing of strict confessional subscription throughout nearly all of Protestant Switzerland. At the same time, in England, the Dissenting clergy [after 1662] were unable to maintain any sort of standardized confessional subscription and the Anglican Church had reached the conclusion that both Reformed and Arminian constructions of the doctrine of salvation could be legitimate under subscription to the Thirty-Nine Articles–and some even argued the legitimacy of non-Nicene understandings of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (2003) 1.428-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-321cf00249" data-kw="">
<blockquote><p>We shall here declare what offences are censurable with this greatest and last censure of excommunication, according to the order that is there prescribed, and which, as it requires, ‘that it be inflicted with great and mature deliberation, and after all other good means have been essayed;’ so it appoints in these express words: ‘That such errours in practice as subvert the Faith, or any other errours which overthrow the power of godliness; if the party who holds them spread them, seeking to draw others after him; and such sins in practice as cause the name and truth of God to be blasphemed, cannot stand with the power of godliness; and such practices, as in their own nature manifestly subvert that order, unity and peace which Christ has established in his Church; and particularly all those scandalous sins, for which any person is to be suspended from the sacrament of the Lord’s Supper, obstinately persisted in; these being publicly known, to the just scandal of the Church; The sentence of excommunication may and ought to proceed, according to the directions after following. But the persons that hold other errors in judgment, about which learned and godly men possibly may and do differ, and which subvert not the faith, nor are destructive to godliness, or that be guilty of such sins of infirmity as are commonly found in the children of God: or being otherwise sound in the Faith and holy in life (and so not falling under censure by the former rules) endeavour to keep the unity of the spirit in the bond of peace; and do yet out of conscience not come up to the observation of all those rules which are or shall be established by authority for regulating the outward worship of God and government of his Church; the sentence of excommunication for these causes shall not be denounced against them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancaster-presbyterians.html">Lancaster Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Censures of the Church Revived</cite>, … (London: Eversden, 1659) sect. 4, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

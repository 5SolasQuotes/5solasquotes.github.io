<main class="wrap"><figure class="quote" id="q-8ffa30f4c7" data-kw="">
<blockquote><p>But the soul is not a complete substance in its own right. Though it can to some extent operate independently of the body, that is not its natural state, and only if the body is restored to it will the complete human person be restored. Nor can resurrection be an alternative to the soul’s immortality. For suppose a body that is physically indistinguishable from Socrates’ body were suddenly to appear. Should we say that Socrates has been resurrected? Or should we say instead that a perfect replica of Socrates has come into being? Recall from chapter 10 that Antony Flew raises this problem for the view that reconstituting a person’s body suffices to ensure that the person survives death. And recall that Aquinas’s conception of the resurrection is not open to this objection, because it hold that the soul of a person persists between death and resurrection, so that there is continuity between the person who died and the later person whose body is indistinguishable from that of the person who died. If Socrates is ressurected, he will be Socrates and not a mere replica because the same one soul, which had informed the matter of Socrates’ body before he died, comes to inform that matter again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholastica, 2024), pt. 4, ch. 11, pp. 519-20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed34e8b466" data-kw="">
<blockquote><p>Properly speaking, Christ&#x27;s Resurrection is not the meritorious cause, but the efficient and exemplar cause of our resurrection.... And since, as was stated above (Reply to Objection 2), the primary cause of human resurrection is the Divine justice, from which Christ has &quot;the power of passing judgment, because He is the Son of Man&quot; (John 5:27); the efficient power of His Resurrection extends to the good and wicked alike, who are subject to His judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, III, q. 56, a. 1, ad 3</span></figcaption>

</figure><figure class="quote" id="q-654e99d971" data-kw="">
<blockquote><p>When the change above described has been accomplished, when once the resurrection has taken place, then, according to the language of Scripture, death shall be completely conquered. Not only shall those over whom he had triumphed, and whom he had so long detained in the prison of the grave, be delivered from his power, but there shall be no more death. … The victory over death is to be complete and final.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, on 15:54</span></figcaption>

</figure><figure class="quote" id="q-399eaf4d68" data-kw="">
<blockquote><p>Obj. 1. The resurrection of Christ, according to what has been said, can neither be an argument in favor of the resurrection of the wicked, nor the cause of it, inasmuch as they are not members of Christ. Therefore the wicked will not rise. Ans. The wicked will not rise on account of the resurrection of Christ, but for other causes, viz: on account of the just judgment of God, for which they will be raised from the dead, that they may be eternally punished.</p></blockquote>

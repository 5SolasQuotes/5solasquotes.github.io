<main class="wrap"><figure class="quote" id="q-9ddbd7b749" data-kw="">
<blockquote><p>Fifthly, some consider instruments to be a mere circumstance rather than a real element of worship, so the Church can use them or not, as it sees fit. That there are such circumstances the Westminster Confession acknowledges: “There are some circumstances concerning the worship of God . . . common to human actions and societies, which are to be ordered by the light of nature, and Christian prudence, according to the general rules of the word, which are always to be observed” (1:6). However, God did not treat instruments as mere circumstances. They had no place in Old Testament worship until He put them in it by His express command. And He has never put them into New Testament worship. Plus, to class something as a mere circumstance rather than an element of worship, it must be common to human society and necessary. Appointing a suitable time and place to meet for public worship is a circumstance of worship, because without that no gathering of people could be possible, and is done for all orderly public meetings. But singing with instruments is not necessary: it may be done, but it does not need to be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-m-watkins.html">K.M. Watkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Watkins is a minister in the Free Presbyterian Church of Scotland. ‘Musical Instruments in Worship’</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-239084461a" data-kw="">
<blockquote><p>It was at Poietiers that the evangelisation of France began in a systematic way. The school which Calvin here gathered round him comprehended persons in all conditions of life… They discoursed about Divine mysteries as they walked together on the banks of the neighboring torrent, the Clain, or as they assembled in the garden of the Basses Treilles, where… they often held their re-unions… By-and-by it was thought prudent to discontinue these meetings in the Basses Treilles, and to seek some more remote and solitary place of re-union. A deep and narrow ravine… then known as the ‘Cave of Benedict,’ but which from that day to this has borne the name of “Calvin’s grotto,” was selected as the scene of the future gatherings of the converts. It was an hour’s walk from the town… In this grotto, so far as the light of history serves, was the Lord’s Supper celebrated for the first time in France after the Protestant fashion. On an appointed day the disciples met here, and Calvin, having expounded the Word and offered prayer, handed round the bread and cup, of which all partook… The place had none of the grandeurs of cathedral, but ‘the glory of God and the Lamb’ lent it beauty. No chant of priest, ‘no swell of organ accompanied the service, but the devotion of contrite hearts, in fellowship with Christ, was ascending from that rocky chamber, and coming up before the throne in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/france.html">France</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Protestant Administration of the Lord’s Supper, 1534 | J.A. Wylie, The History of Protestantism, vol. 2</cite>, p. 179</span></figcaption>

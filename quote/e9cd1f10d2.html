<blockquote><p>…the prophecy which speaks thus concerning us: ‘The people shall be called by a new name, which the Lord shall name them, and shall be a holy people.’ This was first fulfilled in Syria, for ‘the disciples were called Christians at Antioch,’ when Paul and Peter were laying the foundations of the Church.</p></blockquote>

<blockquote><p>29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>

</figure><figure class="quote" id="q-dab9c937fe" data-kw="">
<blockquote><p>4. What the apostles do as apostles agrees only to apostles, and can be done by none but apostles, or by evangelists having their power by special warrantable commission from them, as what a man does as a man, what a pastor does as a pastor, a deacon as a deacon, a prophet as a prophet, can be done by none but by a man only, a pastor only, a deacon only… 5. …and what any one apostle does as an apostle by the amplitude of a transcendent power, every apostle does it completely, and wholly his alone as without help of another apostle; Peter works a miracle, especially any one apostle, as Paul, his alone might ordain Timothy an evangelist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (London, 1644) | Part 1</cite>, p. 452</span></figcaption>

</figure><figure class="quote" id="q-d1a8abb219" data-kw="">
<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries.. (London, 1644), pt. 2, ch. 5, sections 1 &amp; 2, Question 2, “Whether or not all gifted persons may preach the Word of God publicly and ordinarily, for the gathering in of souls to Christ, though they be destitute of all official authority, or Church calling to that ministry? [No]”</cite>, pp. 280-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

paration." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

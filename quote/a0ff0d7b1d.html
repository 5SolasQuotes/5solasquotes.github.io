<main class="wrap"><figure class="quote" id="q-a0ff0d7b1d" data-kw="">
<blockquote><p>The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on Christ’s Sermon on the Mount, in Works</cite>, 1:244–45.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f32f3548f9" data-kw="">
<blockquote><p>The basic principle in application is to know whether the passage is a statement of the law or of the gospel. For when the Word is preached, the law and the gospel operate differently. The law exposes the disease of sin, and as a side-effect, stimulates and stirs it up. But it provides no remedy for it. However the gospel not only teaches us what is to be done, it also has the power of the Holy Spirit joined to it….A statement of the law indicates the need for a perfect inherent righteousness, of eternal life given through the works of the law, of the sins which are contrary to the law and of the curse that is due them…. By contrast, a statement of the gospel speaks of Christ and his benefits, and of faith being fruitful in good works</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Prophesying: or a Treatise concerning the Sacred &amp; Only True Manner &amp; Method of Preaching</cite>, (1592). Reprinted, Edinburgh: Banner of Truth Trust, 1996, 54-55.</span></figcaption>

</figure><figure class="quote" id="q-e0985778de" data-kw="">
<blockquote><p>The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis et Foederis</cite>, [Vindications of the Law and Covenant]: or a Reply to Mr. Philip Cary’s Solemn Call in Works, vol. 6, p. 323</span></figcaption>

<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

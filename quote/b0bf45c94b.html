<main class="wrap"><figure class="quote" id="q-b0bf45c94b" data-kw="">
<blockquote><p>Be there any parts or kinds of God?

None at all, because he is a most simple essence, which doth admit no composition or division; and simply, and in every respect of unity one, and in act most infinite.

Are there any causes of God?

Not any, for he is the cause of all causes.

Is there any accident in God?

No, in regard of God himself; for whatsoever is in God is his essence.

Seeing the essence of God is most simple, in what respect do power, goodness, justice, wisdom, mercy differ in God?

Not in essence: for all these attributes in essence, are but one very thing indeed: but in our weak capacity and manner of knowing, in regard of us, and by the effects, in respect of the creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9945e0b4ac" data-kw="">
<blockquote><p>The analogical use of terms is crucial to understanding God’s knowledge properly in another respect. I have spoken of various concepts and propositions existing in the divine intellect, but they cannot exist there in exactly the same sense in which they exist in our intellects. For in our intellects they exist as distinct thoughts, and there cannot be any such distinctions in God consistent with his simplicity. To a first approximation, we might think instead in terms of a conjunction of all propositions, and say that there is in the divine intellect something like a single thought with this one gigantic conjunctive proposition as its content. But even that cannot be quite right, because this single conjunctive proposition will itself have component parts. A better, though still imperfect, way to understand the nature of God’s knowledge would be to think in terms of analogies like the following. From a beam of white light, various beams of colored light can be derived by passing it through a prism. Though the colors are not separated out until the beam reaches the prism, they are still in the white light in a unified way. From a lump of dough, cookies of various shapes can be derived by means of cookie cutters. Though the various cookies with their particular shapes are not separated out until the cutters are applied to the dough, they are still in the uncut dough virtually. Now, God is pure actuality, whereas each kind of created thing represents a different way in which actuality might be limited by potentiality. That is to say, each created thing is comparable to one of the different specific colors that might be derived from the white light that contains all of them, or is like one of the many cookie shapes which might be derived from the dough which contains all of them. God’s creation of the world is thus like the passing of white light through a prism or the application of the cutters to the dough. The prism draws out, from the color spectrum which is contained in a unified way in the white light, a particular beam of this color and a particular beam of that color; and the cutters draw out, from the variety of possible cookies contained in a unified way in the lump of dough, a cookie of this particular shape and a cookie of that particular shape… Now, just as if you knew the white light perfectly, you would know all the colors which could be derived from it, and if you knew the lump of dough perfectly, you would know all the shapes which might be carved out of it, so too, perfectly to know that which is pure actuality would entail knowing all the various limited ways of being actual which might be derived from it. And that is how God knows all the various kinds of finitely actual things which exist or might exist—by virtue of perfectly knowing himself as that which is pure or unlimited actuality. That is not to say that his knowledge is exactly like that of someone who grasps the nature of white light or of dough, but it is analogous to that. And even if the analogy is imperfect, that is, as I have said, only to be expected given how very far beyond its ordinary sphere of operation reason has to push itself when seeking ultimate explanations.</p></blockquote>

<blockquote><p>This thesis presents a case for the traditional doctrine of divine simplicity by construing it along the lines that God exists as actus purus. My formulation of divine simplicity draws upon the medieval insight that God is what He is in virtue of what He does in one, eternal act of will with which He is identical. In chapter I, I survey the contemporary literature on divine simplicity. In chapter II, I critique Alvin Plantinga’s Platonic theory of the divine attributes… In chapter III, I provide rejoinders to all of Plantinga’s defeaters against divine simplicity… In chapter IV, I develop a viable theory of divine simplicity, given an actus purus conception of God, and I formulate a number of arguments supporting it… As such, I seek to demonstrate that the traditional understanding of the divine essence is something that is worthy for theists to embrace and to explore…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allen-stanley-gehring.html">Allen Stanley Gehring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity as Actus Purus Ref</cite>, (Texas A &amp; M University, 2005)</span></figcaption>

<blockquote><p>[Margin note:] How far the will of sign may be a will Question 33, Whether the will of sign may improperly and metonymically be the will of God? Response: The will of sign, according as it designates what is the pleasing and acceptable revealed will of God to us, that which is of our duty, so it is called the approving will, contradistinguished from the will of good-pleasure [of decree], and refers to two things:

1. To that which we ought to believe or do, inasmuch as that is obliging of consciences, since we ought to will to please God and will the reward of obedience following.

2. It refers to obedience, and this so far as God displays that to us by an act, either through special grace or a common concursus. The first will is of complacency and is properly called will, whose object is the duty of the rational creature. In this way God sincerely [serio] approves and wills obedience, and is pleased in this moral good as a rule and norm, and it is not less a will than that which is called of good-pleasure [or the will of decree]. But the latter way is not an executing will as the will of good-pleasure is, nor does God will, intend or decree through grace or concursus, to work in the creatures that which He commands or prohibits, because He commands or prohibits it. And in this way the will of sign is so far improperly called ‘the will of sign’; indeed, the punishment is called the wrath of God, because assuredly God punishes that which is done, as men are accustomed to do such being angry and in the passion of wrath, being aroused and agitated, although nonetheless, passions do not occur in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, (Edinburgh, 1649), Metaphysical Inquiries, p. 605 Trans. T. Fentiman. A ‘metonymy’ is something that is indirectly named by something closely related to it. Rutherford here delineates the eternal foundation of the will of sign, namely what Rollock had elucidated, the will of approval in God, which wills the goodness of things in and of themselves.</span></figcaption>

1. To that which we ought to believe or do, inasmuch as that is obliging of consciences, since we ought to will to please God and will the reward of obedience following.

— Samuel Rutherford, A Scholastic Disputation on Divine Providence, chs. 1-10, (Edinburgh, 1649), Metaphysical Inquiries, p. 605 Trans. T. Fentiman. A ‘metonymy’ is something that is indirectly named by something closely related to it. Rutherford here delineates the eternal foundation of the will of sign, namely what Rollock had elucidated, the will of approval in God, which wills the goodness of things in and of themselves.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BMargin+note%3A%5D+How+far+the+will+of+sign+may+be+a+will+Question+33%2C+Whether+the+will+of+sign+may+improperly+and+metonymically+be+the+will+of+God%3F+Response%3A+The+will+of+sign%2C+according+as+it+designates+what+is+the+pleasing+and+acceptable+revealed+will+of+God+to+us%2C+that+which+is+of+our+duty%2C+so+it+is+called+the+approving+will%2C+contradistinguished+from+the+will+of+good-pleasure+%5Bof+decree%5D%2C+and+refers+to+two+things%3A+1.+To+that+which+we+ought+to+believe+or+do%2C+inasmuch+as+that+is+obliging+of+consciences%2C+since+we+ought+to+will+to+please+God+and+will+the+reward+of+obedience+following.+2.+It+refers+to+obedience%2C+and+this+so+far+as+God+displays+that+to+us+by+an+act%2C+either+through+special+grace+or+a+common+concursus.+The+first+will+is+of+complacency+and+is+properly+called+will%2C+whose+object+is+the+duty+of+the+rational+creature.+In+this+way+God+sincerely+%5Bserio%5D+approves+and+wills+obedience%2C+and+is+pleased+in+this+moral+good+as+a+rule+and+norm%2C+and+it+is+not+less+a+will+than+that+which+is+called+of+good-pleasure+%5Bor+the+will+of+decree%5D.+But+the+latter+way+is+not+an+executing+will+as+the+will+of+good-pleasure+is%2C+nor+does+God+will%2C+intend+or+decree+through+grace+or+concursus%2C+to+work+in+the+creatures+that+which+He+commands+or+prohibits%2C+because+He+commands+or+prohibits+it.+And+in+this+way+the+will+of+sign+is+so+far+improperly+called+%E2%80%98the+will+of+sign%E2%80%99%3B+indeed%2C+the+punishment+is+called+the+wrath+of+God%2C+because+assuredly+God+punishes+that+which+is+done%2C+as+men+are+accustomed+to+do+such+being+angry+and+in+the+passion+of+wrath%2C+being+aroused+and+agitated%2C+although+nonetheless%2C+passions+do+not+occur+in+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Scholastic+Disputation+on+Divine+Providence%2C+chs.+1-10%2C+%28Edinburgh%2C+1649%29%2C+Metaphysical+Inquiries%2C+p.+605+Trans.+T.+Fentiman.+A+%E2%80%98metonymy%E2%80%99+is+something+that+is+indirectly+named+by+something+closely+related+to+it.+Rutherford+here+delineates+the+eternal+foundation+of+the+will+of+sign%2C+namely+what+Rollock+had+elucidated%2C+the+will+of+approval+in+God%2C+which+wills+the+goodness+of+things+in+and+of+themselves.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64b072195a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64b072195a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=Margin%20note%3A%5D%20How%20far%20the%20will,passions%20do%20not%20occur%20in%20God&amp;text=Margin%20note%3A%5D%20How%20far%20the%20will%20of%20sign&amp;text=although%20nonetheless%2C%20passions%20do%20not%20occur%20in%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The will of God,¹ as to all things, must always be fulfilled, – because as the Almighty can do everything possible, so, when the divine will is determined for positing something in being with final determination, it will be; but to will that with will of being well-pleased is to will it with the last determination that can be posited on the part of the omnipotent will willing the effect into being; therefore, in respect of whatever effect God is thus willing, it will be. ¹ The Vatican editors say this is against Scotus’ doctrine, and they refer to Rep. IA d. 46 nn. 17-18, 12-14, and to nn. 7-8 here below. …

7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation.

8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>

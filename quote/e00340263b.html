<main class="wrap"><figure class="quote" id="q-e00340263b" data-kw="">
<blockquote><p>And here the doubt touching the precedency of faith and repentance may be easily determined. For if faith be taken largely or generally for a belief of the promise, if we repent and receive it, then faith is before repentance: for there can be no turning without hope of pardon, nor coming home by hearty sorrow, without some expectation of mercy [see WCF 15.2 &amp; WSC 87]. Thus the exhortations run, ‘Turn unto the Lord, for He is merciful and gracious.’ ‘Repent, for the Kingdom of God is at hand.’ But if faith be taken more strictly, for that faith or belief whereby we receive, embrace, or rest upon the promise of God in Christ Jesus for pardon and forgiveness, then repentance goes before pardon: for no remission is promised to be enjoyed but upon condition of repentance… If repentance be necessary to justification, of necessity it must go before justifying faith; because faith and justification are immediately coupled together. It is impossible to come unto Christ without repentance… Coming unto Christ is a lively motion of the soul, wherein arising from sin, it draws nigh or approaches unto Christ, that in Him it might be satisfied. The motion is one, but the points are two. For in drawing nigh unto Christ, the soul arises from sin: which may be called repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, 2nd pt., ch. 5, p. 349 of A Treatise of the Covenant of Grace (London, 1645)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36b7092420" data-kw="">
<blockquote><p>The gospel does not promise salvation on condition of good works as causes effecting it, but on condition of faith and repentance: the one as an instrument of accepting remission of sins the other as a causa sine qua non [casue without which: nothing]: nor on condition of such repentance or new obedience as is perfect, but such as is by grace begun.</p></blockquote>

<blockquote><p>God and Christ does by the law of grace absolve or justify the penitent, constitutive: Even before the pastor pronounces absolution, every penitent is by the covenant of grace justified or made righteous.</p></blockquote>

</figure><figure class="quote" id="q-e54df171fc" data-kw="">
<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 34, ‘Of Repentance’, p. 245</span></figcaption>

</figure><figure class="quote" id="q-ddc97a5df0" data-kw="">
<blockquote><p>Concerning penitence, which embraces in itself the fear of God, and almost all other acts, there occur (as we have shown before) very many passages in Scripture, in which it is set forth as a necessary means through which to obtain pardon of sins, or (what in fact is the same thing) as a condition under which God (ultimately of his own gratuitous promise) forgives sin. Who will deny that these in some sense have the nature of a cause, except he who is more pleased with the pugnacity of disputing, and the desire of cavilling, than with the love of the truth? How often is forgiveness of sins described in Scripture as the effect or fruit of penitence? (Isa. 1:16-19; 56:4-12; Jer. 18:7-8; Joel 2:12-14; Jonah 3:10, etc.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 39</span></figcaption>

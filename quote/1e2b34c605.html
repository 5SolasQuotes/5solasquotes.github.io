<main class="wrap"><figure class="quote" id="q-1e2b34c605" data-kw="">
<blockquote><p>Question 18: What if a woman have a husband that will not suffer her to read the Scriptures, nor go to God’s worship, public or private, or that so beats or abuses her, as that it cannot be expected that human nature should be in such a case kept fit for any holy action: or if a man have a wife that will scold at him when he is praying or instructing his family, and make it impossible to him to serve God with freedom, or peace and comfort? Answer: The woman must (at necessary seasons, though not when she would) both read the Scriptures and worship God, and suffer patiently what is inflicted on her: Martyrdom may be as comfortably suffered from a husband as from a prince. But yet if neither her own love and duty, and patience, nor friends’ persuasion, nor the magistrate’s justice can free her from such inhumane cruelty, as quite disables her for her duty to God and man, I see not but she may depart from such a tyrant. But the man has more means to restrain his wife from beating him, or doing such intollerable things: either by the magistrate, or by denying her what else she might have, or by his own violent restraining her, as belongs to a conjugal ruler, and as circumstances shall direct a prudent man. But yet in case that unsuitableness or sin be so great, that after long trial, there is no likelihood of any other cohabitation but what will tend to their spiritual hurt and calamity, it is their lesser sin to live asunder by mutual consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’, p. 539</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-5f44cb6f49" data-kw="">
<blockquote><p>The woman being created was brought to man and given unto him by God, and he took her, with her consent, as flesh of his flesh, and bone of his bone; and they twain became one flesh. And God commanded this order to be observed unto the end of the world. This was the first institution of this sacred society: So that the first and principal efficient of marriage, was God instituting it; the subordinate, is the mutual consent of the parties. For marriage is a contract, or covenant: This is the general nature of it; and as the matter is one man, and one woman, free from all former obligation that may hinder it, so the form, and chief essence is in the special nature of the contract, whereby they mutually bind themselves one unto another so as to become one flesh for term of life of both the parties. The end is propagation mutual help and comfort, and upon the Fall, per accidens, the avoiding of fornication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theo-Politica, or, A Body of Divinity Containing the Rules of the Special Government of God</cite>, ... (London: Streater, 1659), ch. 8, 7th Commandment, p. 205</span></figcaption>

</figure><figure class="quote" id="q-8edd371a20" data-kw="">
<blockquote><p>Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…</p></blockquote>

<blockquote><p>It is not in men’s free will that they have government or no government, because it is not in their free will to obey or not to obey the acts of the court of nature, which is God’s court; and this court enacts that societies suffer not mankind to perish, which must necessarily follow if they appoint no government; also it is proved elsewhere, that no moral acts, in their exercises and use, are left indifferent to us…</p></blockquote>

<blockquote><p>VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, sections 6 &amp; 23</cite>, pp. 8-9, 14</span></figcaption>

<blockquote><p>Seventhly, are any of the Reformed Churches or any Churches or persons of the whole world so injurious to magistrates as their principles [that of the New England Independents, such as John Cotton] force them to be, who spoil Christian kings and parliaments of their whole legislative power? They will have us to believe, as good divinity, that it is not only unlawful for Church-assemblies to make ecclesiastic canons, but that it is alike unlawful for any prince or State to make a civil law, that the placing of a legislative power in kings or parliaments, is to usurp the property and prerogative of God. These principles cannot be very favorable to the State, which at one stroke annihilate all the acts of Parliament that now are in force, either in this or any other kingdom, and make it impossible (if they were believed) to have any more in any place of the earth, to the world’s end. Look back upon what I have cited from the chief of the Brownists’ writings. I grant the New English polishers of Brownism do not express their tenets in terms so hugely gross; yet see how near they come to them in substance, when they tell us that no magistrate may make any Laws about the bodies, lands, goods, liberties of the subject, which are not according to the laws and rules of Scripture, Scripture being given to men for a perfect rule, as well in matters of civil justice, as of devotion and holiness; and if so, then they must make it as unlawful and contrary to the Scripture’s perfection, for any man to make laws in matters of righteousness and of the State, as in matters of holiness and of the Church. That beside things in themselves good or evil, which Scripture determines by its laws expressly, things of an indifferent nature, whereupon the most of civil laws are made, must be regulated according to the Scripture rules of piety, charity, and conscience, so far that the expediency and reason of the law must ever carry and convince the conscience of the subject: that no man is obliged to the obedience of a civil Law in a thing never so indifferent by the authority of the lawgiver, but every man whose conscience is not convinced of the piety and charity of that Law, is free from all obedience and subjection thereto: Thus far Mr. Cotton.¹ ¹ Cotton’s Model of Power in The Bloody Tenet, p. 140. “The magistrate in making laws about civil and indifferent things in the commonwealth; First, he has no power given him of God to make what laws he pleases, either in restraining from or constraining to the use of indifferent things; because that which is indifferent in its nature, may sometimes be inexpedient in its use, and consequently unlawful: it is a prerogative proper to God to require obedience of the sons of men, because of his authority and will. It is an evil speech in some, that in some things the will of the law, not the reason of it, must be the rule of conscience to walk by: and that princes may forbid men to seek any other reason but their authority, yea when they command men frivola &amp; dura; and therefore it is the duty of the magistrate in all laws about indifferent things, to show the reasons, not only the will; to show the expediency as well as the indifferency of things of that nature; and because the judgement of expedient and inexpedient things, is often difficult and diverse, it is meet that such laws should not proceed without due consideration of the rules of expediency set down in the Word, which are these three: First, the rule of piety, that they may make for the glory of God, 1 Cor. 10:31. Secondly, the rule of charity, that no scandal come thereby to any weak brother, 1 Cor. 8:13. Thirdly, the rule of charity, that no man be forced to submit against his conscience, Rom. 14:14,23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (London: 1645)</cite>, pp. 127-28</span></figcaption>

.+10%3A31.+Secondly%2C+the+rule+of+charity%2C+that+no+scandal+come+thereby+to+any+weak+brother%2C+1+Cor.+8%3A13.+Thirdly%2C+the+rule+of+charity%2C+that+no+man+be+forced+to+submit+against+his+conscience%2C+Rom.+14%3A14%2C23.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+A+Dissuasive+from+the+Errors+of+the+Time%2C+wherein+the+Tenets+of+the+Principal+Sects%2C+Especially+of+the+Independents%2C+are+Drawn+Together+in+One+Map+%28London%3A+1645%29%2C+pp.+127-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4cd6764ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e4cd6764ff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=Seventhly%2C%20are%20any%20of%20the%20Reformed,submit%20against%20his%20conscience%2C%20Rom.%2014%3A14%2C23&amp;text=Seventhly%2C%20are%20any%20of%20the%20Reformed%20Churches%20or&amp;text=forced%20to%20submit%20against%20his%20conscience%2C%20Rom.%2014%3A14%2C23" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-ca00530fdc" data-kw="">
<blockquote><p>The Care of God, which throughout the time before us guarded the Churches, seems to have utterly forsaken this present life. And my soul is immersed to such a degree by calamities that the private sufferings of my own life hardly seem to be worth reckoning among evils (though they are so numerous and great, that if they befell anyone else I should think them unbearable); but I can only look at the common sufferings of the Churches; for if at the present crisis some pains be not taken to find a remedy for them, things will gradually get into an altogether desperate condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Letters of Saint Gregory Nazianzen (Epistle 202) in Nicene and Post-Nicene Fathers 2, 7: 438.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3caee1b681" data-kw="">
<blockquote><p>And do further statute and ordain, that no person be admitted, or continued for hereafter, to be a minister or preacher within this Church, unless that he… do also subscribe the Confession of faith, ratified in the foresaid 5th Act of the second Session of this Parliament, declaring the same to be the confession of his faith, and that he owns the doctrine therein contained to be the true doctrine which he will constantly adhere to: As likewise, that he owns and acknowledges Presbyterian Church government, as settled by the foresaid fifth act of the second session of this parliament, to be the only government of this Church, and that he will submit thereto, and concur therewith, and never endeavour, directly or indirectly, the prejudice or subversion thereof…</p></blockquote>

<blockquote><p>Sect. XVII. It is lawful to separate from particular churches in all the degrees and cases following:

1. It is lawful to abate our esteem of any church or pastor as they are less worthy, or more corrupt or culpable, and to value more the more worthy. Sect. XVIII.

2. It is lawful to remove one’s dwelling from one city or parish to another, for the just reasons of our worldly affairs, and thereby to remove from other churches: And it is lawful to do the same for the good of our souls, when one minister is bad or less fit for our edification and one church more corrupt and culpable and others more sound and pure and their communion more conducible to our salvation. Sect. XIX.

3. Parish bounds being but human institutions for order sake, it is lawful to be of a church in a neighbor parish instead of one’s own parish church in case we have the allowance of the higher powers, or without that in cases of true necessity, or when consideratis considerandis, the benefit is evidently greater than any hurt that it is like to do. For no man has power to bind me to that which is to the danger or detriment of my soul unless (at least) some greater notorious interest of the community require it. If my parish have an ignorant, unsound teacher or a weak, dull, dangerous or unprofitable, careless or scandalous, vicious pastor, [and] yet tolerable rather than to have none, or judged tolerable by the rulers, and the next parish have an able, holy, faithful pastor, by whom I am more abundantly edified, I am not bound by man’s commands to trust the conduct of my soul with the former or to deny myself the benefit of the latter when I cannot remove my dwelling: For men’s power is not to destruction but to edification; and order is for the thing ordered and not against it. My soul is more Christ’s and my own than the rulers. And I am not unthankfully to neglect the helps offered me by Christ (who ascended to give gifts to men for the edifying of his Body) merely because a man commands me so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, … (London: Hancock, 1680), pt. 3, ‘Of Schism’, ch. 1, pp. 7-8</span></figcaption>

<blockquote><p>All the difference of religion, which is at this day between the Church of Rome and the Protestants, lies in some certain points which the Church of Rome maintains as important, and necessary articles of the Christian faith: whereas the Protestants, on the contrary, neither believe nor will receive them as such. For as for those matters which the Protestants believe, which they conceive to be the fundamentals of religion, they are evidently and undeniably such, that even their enemies admit and receive them as well as they: inasmuch as they are both clearly delivered in the Scriptures, and expressly admitted by the ancient councils and Fathers ; and are indeed unanimously received by the greatest part of Christians in all ages, and in different parts of the world. But now their adversaries add to these many other points, which they press and command men to believe as necessary; and such as, without believing in, there is no possible hope of salvation. As for example: that the Pope of Rome is the head and supreme monarch of the whole Christian Church throughout the world, that he, or at least the Church which he acknowledges a true one, cannot possibly err in matters of faith… which their adversaries plainly protest that they cannot with a safe conscience believe. These points are the ground of the whole difference between them; the one party pretending that they have been believed and received by the Church of Christ in all ages as revealed by him; and the other maintaining the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Author’s Preface’ in A Treatise on the Right Use of the Fathers</cite>, ed. (1631; Philadelphia, 1856), pp. 17-21, pp. 17-19</span></figcaption>

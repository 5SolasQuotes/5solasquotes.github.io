<main class="wrap"><figure class="quote" id="q-445062f1f3" data-kw="">
<blockquote><p>[Scotus:] ‘To the willing of the created will, two wills concur — namely, the created and the divine. There can be a defect in that willing from the defect of one of the causes, because one could give rectitude to the act, which it is bound to give yet does not give” — this is the created will — “while the other, though not bound to give it, would on its own part give it if the created will cooperated.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Scotus:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58a3697fb1" data-kw="">
<blockquote><p>[Thomas:] ‘God is the first cause moving both natural causes and voluntary causes; and just as by moving natural causes He does not take away the fact that their acts are natural, so by moving voluntary causes He does not take away the fact that their actions are voluntary, but rather brings this about in them — for He operates in each according to its property.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Thomas’s Position, pp. 425-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-111d9a548d" data-kw="">
<blockquote><p>I returned, and saw under the sun, that the race is not to the swift, nor the battle to the strong, neither yet bread to the wise, nor yet riches to men of understanding, nor yet favour to men of skill; but time and chance happeneth to them all.” – Eccl. 9:11 Wettstein, Gernler &amp; Buxtorf – 6. Providence in A Syllabus of Controversies in Religion which come between the Orthodox Churches &amp; whatever other Adversaries, for material for the regular disputations… customarily held in the theological school of the academy at Basil (Basil, 1662), pp. 19-21 . 1700’s Hottinger, Johann J. – A Theological Exercitation on the Immediate Operation of God in the Soul of Man (Zurich, 1714) 54 pp. . . Latin Book 1600’s Rutherford, Samuel – A Scholastic Disputation on Divine Providence… (Edinburgh, 1649) 620 pp. ToC English ToC . . Historical Theology On the 1500’s-1600’s Article Matava, R.J. – ‘A Sketch of the Controversy de auxiliis‘ in Journal of Jesuit Studies (Apr, 2020) Abstract: “In the 16th century, the Dominicans and the Jesuits engaged in a polarized theological debate about how God can move the human will in a way that neither compromises human free choice nor makes God the author of moral evil. This debate, called the “controversy de auxiliis,” was never resolved. In 1607, Pope Paul V decreed that neither side was heretical and forbade further publishing on the issue without his explicit permission. This article explains the main theological points of the various Dominican and Jesuit actors, the human factors that contributed to the debate…</p></blockquote>

</figure><figure class="quote" id="q-e710bbc718" data-kw="Author of sin">
<blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-cox.html">Benjamin Cox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Appendix to a Confession of Faith</cite>, 1646, art. 3</span></figcaption>

<blockquote><p>But we may well enough grant the proposition true, that Christ, as Mediator, is to be adored with divine worship, because as He is Mediator, He must necessarily be God, and so therein is included the ratio formalis sub quà [the formal reason which is under] of all religious worship: So that to be worshipped as Mediator, and as God, are not opposite, but one is necessarily included in the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 137, ‘How Christ (as Mediator) had his Glory given Him, although as God He could not properly have any thing given Him, except by way of Manifestation: Against the Socinians’ in 145 Expository Sermons upon John 17 (1656) See especially, p. 667 | Burgess (d. 1664) was a Westminster divine. Burgess’ key statement is:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b946668c3a" data-kw="">
<blockquote><p>Naturally the honour of worship does not belong to Christ’s humanity as such, but because the divine Logos has taken it up into his personality, which is by nature adorabilis. Wolleb 68: ‘The honor which results from the personal union is the adoration of the human nature; not however of the flesh qua flesh, nor of the creature, but of God in the created flesh.’ Keckermann 322: ‘It is because of the union that the whole person of Christ is worshipped, although the direct object of worship is the divinity alone.’ Zanchius 71: ‘The union of natures in the person of Christ brings it about that we cannot worship the Deity in Christ, unless at the same time we also worship the human nature in him, and that both the human and the divine nature in him must be worshipped by us altogether with the one worship only.’ Voetius devoted an explicit section to the discussion of this doctrinal point ([Disputations] I, 520-552), ‘anent the question whether Christ as the Mediator should be worshipped.’ Voetius distinguishes between ‘worship’ and ‘worshipfulness’. ‘Christ as mediator or under the formula qua est mediator is not worshipful’; for only God is ‘worshipful’. But since Christ qua person is God it follows that ‘in and along with the flesh, in and along with the office of mediator Christ is to be worshipped, so that the object of our consideration is Christ’s person, together with everything that is in it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics ed. Bizer (1950; Wipf &amp; Stock), ch. 17, section 21</cite>, pp. 438-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b946668c3a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-grounds-of-christ-the-mediator-receiving-divine-worship/#:~:text=Naturally%20the%20honour%20of%20worship%20does,with%20everything%20that%20is%20in%20it&amp;text=Naturally%20the%20honour%20of%20worship%20does%20not%20belong&amp;text=person%2C%20together%20with%20everything%20that%20is%20in%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4b07a0e66a" data-kw="">
<blockquote><p>And not only Peter but also all the apostles, by making this confession—which they would soon proclaim in the midst of the world—laid the foundation of the church of Christ. Accordingly, figuratively speaking, along with Peter they were all of them the rock on which Christ built his church; or, in another application of the same image, Christ is the rock that the apostles by their preaching laid as the foundation of the church (Acts 4:11; Rom. 9:33; 1 Cor. 3:10–11; Eph. 2:20; 1 Pet. 2:5–6; Rev. 21:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><figure class="quote" id="q-20befb7a15" data-kw="">
<blockquote><p>The actions performed by our royal Mediator flow from a double principle in this single Person, because this person does consist of two natures, and each nature performs its proper work; the divine nature does what is divine, and the human nature what is human; and therefore though the Person be but one, and the effect one, yet there are two different actions of two different natures united in one Person for producing of one and the same glorious effect, and we are to give to each nature what is properly due unto it. … Finally the Kingdom which is administered by our royal Mediator God-man, in a glorious way is but a dispensatory kingdom, not his natural kingdom, an inferior and temporary kingdom, not his sovereign, essential, eternal kingdom; and therefore even in the very administration of it our Mediator God-man, is in respect of order, and that gracious dispensation unto which He condescended for our salvation, employed in a kind of subordinate way… This dispensatory kingdom is administred principally by the Godhead, instrumentally by the manhood, absolutely and perfectly by the Person of Christ acting in a divine way as God, and human way as man, that the properties of each nature may be reserved as peculiar to each, even whilst He does mediate, reign and judge, according to both; and therefore divine honor is still reserved as proper and peculiar to the divine nature of our Mediator, who is God-man in one person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Trinunity… (London, 1650)</cite>, pp. 347-9</span></figcaption>

ksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-two-operations-energies-of-the-mediator-divine-human-unto-the-same-effect-apotelesma/#:~:text=The%20actions%20performed%20by%20our%20royal,who%20is%20God%2Dman%20in%20one%20person&amp;text=The%20actions%20performed%20by%20our%20royal%20Mediator%20flow&amp;text=our%20Mediator%2C%20who%20is%20God%2Dman%20in%20one%20person" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0c475215e2" data-kw="">
<blockquote><p>This Person is the common beginning of those actions, which the Greek Fathers have called divinely humane: for the actions of Christ are not only, some humane, some divine: but also some of common operation, which Christ effects; both as he is Man-God by Nature, and as he is Mediator by dispensation: his Natures are the beginnings of Natural Actions; but his person is the beginning, both of common and particular actions, according to both natures: wherefore every working of Christ, in respect of his person, is in number one; in respect of his Natures, is in kind, two-fold: One in number, because he is one effectual Worker: and one absolute Perfection. In kind two-fold, because there is one Divine, of the God-head, and another humane, of the man-hood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), ‘Of the Person of Christ’, Part Confirmative, ch. 6</cite>, pp. 156-7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This Person is the common beginning of those actions, which the Greek Fathers have called divinely humane: for the actions of Christ are not only, some humane, some divine: but also some of common operation, which Christ effects; both as he is Man-God by Nature, and as he is Mediator by dispensation: his Natures are the beginnings of Natural Actions; but his person is the beginning, both of common and particular actions, according to both natures: wherefore every working of Christ, in respect of his person, is in number one; in respect of his Natures, is in kind, two-fold: One in number, because he is one effectual Worker: and one absolute Perfection. In kind two-fold, because there is one Divine, of the God-head, and another humane, of the man-hood.”

<blockquote><p>These things, beloved brethren, when we have learnt from the sacred reading, and have gathered in what way we ought to approach to prayer, let us know also from the Lord’s teaching what we should pray. “Thus,” says He, “pray ye:—

“Our Father, which art in heaven, Hallowed be Thy name. Thy kingdom come. Thy will be done, as in heaven so in earth. Give us this day our daily bread. And forgive us our debts, as we forgive our debtors. And suffer us not to be led into temptation; but deliver us from evil. Amen.” …

After all these things, in the conclusion of the prayer comes a brief clause, which shortly and comprehensively sums up all our petitions and our prayers. For we conclude by saying, “But deliver us from evil,” comprehending all adverse things which the enemy attempts against us in this world, from which there may be a faithful and sure protection if God deliver us, if He afford His help to us who pray for and implore it.

And when we say, Deliver us from evil, there remains nothing further which ought to be asked. When we have once asked for God’s protection against evil, and have obtained it, then against everything which the devil and the world work against us we stand secure and safe. For what fear is there in this life, to the man whose guardian in this life is God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian.html">Cyprian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Lord’s Prayer</cite>, (c. 252), 7, 27 in Ante-Nicene Fathers, 5: 449, 454-55.</span></figcaption>

<blockquote><p>But here Austin moves this objection: if we must not use many words in prayer for that our heavenly father knows our want by the same reason, and for the same cause, we should not use few words, no not those which are here appointed by our Saviour Christ.

The answer is: that in regard of God, and for his cause, we need, neither many nor few, nor any words at all in prayer, neither doth the form of prayer consist in the repetition of words. For to pray is to lift up the mind unto God, to pour out the heart before God, &amp; to ask something of him: but no man doth truly ask any thing, which desireth not the same, and desire is an affection of the mind.

And therefore though he utter with his mouth the best words that can be, unless there be also a lifting up of the mind, with attention and devotion, so as the heart may truly desire that which he asketh, that man prayeth not indeed. But he that lifteth up his mind, and with a devout inward affection of heart, doth entirely ask any thing of God, that man doth truly pray, although he express not in words his desire.

One man cannot intreat another unless he use words or gesture: but the inward and most secret corners of the mind and heart are plainly seen of God, and therefore David saith, my groaning is not hid from thee, Psal. 38. v. 10. &amp; Psal. 10. v. 17. The Lord heareth the desire of the poor: thine ear harkeneth to the preparation of their heart. And Psal. 38.10. My whole desire is before thee. Rom. 8. v. 26. When we know not what to ask, the spirit it self maketh request for us, with sighs which cannot be expressed.

And it were a foolish thing, therefore to utter our prayer in words, as though God could not understand the desire of our heart. And yet the Saints of God in the old testament, and the Apostles in the new are said, to have used words in praying. Neither doth Christ without cause say thus, in Luke, [when ye pray, say] but it was for our sakes and for our prayers. Which is carefully to be considered, that we may learn to use vocal prayer well and profitably: for our mind doth not thoroughly consider and regard those things which we want, or are to aske, especially if they be spiritual, and pertain to the glory of God. And therefore the words which we use in praying, do by a kind of advertisement lead us to that consideration, that so the desire of our heart may be rightly informed.

Now the heart in prayer ought to be penitent and humble. But because we do for the most part rush upon this exercise of prayer, without due consideration of our sins and unworthiness: therefore the rehearsing of words is profitable, whereunto if the mind give heed, that we may pray with the Spirit and with the understanding also, 1. Cor. 1.15. then will the meditation thereof prepare the heart to serious repentance and to true humility. The desires of our heart are commonly out of order, so as oftentimes men neither think upon the order, nor on the end of those things they are to require: but the words which we use in prayer doe advertise us of those things we are to think upon when we pray.

And doubtless the rehearsing and meditation of God’s promises doth stir up, kindle, and increase our faith. We are often slow to prayer, and in praying cold and drowsy, neither do we come unto God with the devotion of mind we ought to do. But when as in praying we repeat the words, by diligent meditation thereon, and by due consideration of the promise and commandment, our mind is moved to lift up it self unto God, our devotion is kindled, and being once kindled is continued and increased.

Also the diligent marking of those things we are to ask, whereof we are put in mind by the words of our prayer, doth excite and kindle in our benumbed and frozen heart a good affection unto prayer. For those words, because they are the words of Christ, be the tool or instrument of the Spirit, whereby the Spirit of prayer will be powerful and effectual in us. And therefore that which Christ here delivereth [When we pray, SAY:] doth bind us so far forth as the rehearsal of words in praying is hereunto available, to excite, and kindle, to continue and increase our devotion, least it should wax cold and benumbed and be quenched altogether. And hereunto sometime longer prayers serve best, otherwise those which are shorter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 9-13.</span></figcaption>

</figure><figure class="quote" id="q-e5e2944920" data-kw="">
<blockquote><p>Prayer is a natural worship, and is incumbent upon all men, as they are created by God. Prayer is a duty which the very law of nature, as well as the law of the word, lays upon men. And this you may see in those pagans, Jonah i. 5, ‘The mariners cried every man to his god.’ That there is a God, and that this God is to be called upon, are lessons that are taught in nature’s school: Isa. xlv. 20, ‘They pray to a god that cannot save.’

For any man to say a wicked man ought not to pray, is to say a wicked man ought not to worship God, nor acknowledge him to be his maker; and who but such who are either blind or mad dare speak such language? Certainly they that live in the neglect of prayer under the gospel sin against a double light, the light of nature and the light of the gospel, and therefore they shall be double-damned. There is no hell to these men’s hell who sin against a double light, &amp;c.</p></blockquote>

— Thomas Brooks, The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 234.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPrayer+is+a+natural+worship%2C+and+is+incumbent+upon+all+men%2C+as+they+are+created+by+God.+Prayer+is+a+duty+which+the+very+law+of+nature%2C+as+well+as+the+law+of+the+word%2C+lays+upon+men.+And+this+you+may+see+in+those+pagans%2C+Jonah+i.+5%2C+%E2%80%98The+mariners+cried+every+man+to+his+god.%E2%80%99+That+there+is+a+God%2C+and+that+this+God+is+to+be+called+upon%2C+are+lessons+that+are+taught+in+nature%E2%80%99s+school%3A+Isa.+xlv.+20%2C+%E2%80%98They+pray+to+a+god+that+cannot+save.%E2%80%99%0A%0AFor+any+man+to+say+a+wicked+man+ought+not+to+pray%2C+is+to+say+a+wicked+man+ought+not+to+worship+God%2C+nor+acknowledge+him+to+be+his+maker%3B+and+who+but+such+who+are+either+blind+or+mad+dare+speak+such+language%3F+Certainly+they+that+live+in+the+neglect+of+prayer+under+the+gospel+sin+against+a+double+light%2C+the+light+of+nature+and+the+light+of+the+gospel%2C+and+therefore+they+shall+be+double-damned.+There+is+no+hell+to+these+men%E2%80%99s+hell+who+sin+against+a+double+light%2C+%26c.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+The+Crown+and+Glory+of+Christianity%3B+or+Holiness%2C+the+only+way+to+Happiness.+Discovered+in+LVIII+Sermons+from+Heb.+12.+14%2C+%281662%29+in+The+Works+of+Thomas+Brooks%2C+ed.+Alexander+B.+Grossart+%286+vols%2C+Edinburgh%3A+James+Nichol%2C+1861-67%29%2C+4%3A+234.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe5e2944920.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5e2944920.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/01/14/thomas-brooks-on-prayer-and-the-light-of-nature/" rel="noopener" target="_blank">Read it online · Re </figure><figure class="quote" id="q-898e8bb1d4" data-kw="">
<blockquote><p>O Father of Light, who hast been pleased to vouchsafe unto us poor miserable sinners, who by nature sit in darkness and in the shadow of death, the light to direct us through the darkness of this world unto the light of glory, We beseech thee to pardon all our sins, and to open the blind eyes of our understanding, that we may rightly conceive thy Word, and withal to give us grace rightly to apply it unto our own hearts, and to yield all holy obedience thereunto through Jesus Christ our Lord and only Saviour. Amen.</p></blockquote>

</figure><figure class="quote" id="q-5619110d65" data-kw="">
<blockquote><p>Prayer consists in calling upon the true God, and arises from an acknowledgment and sense of our want, and from a desire of sharing in the divine bounty, in true conversion of heart and confidence in the promise of grace for the sake of Christ the mediator, asking at the hands of God such temporal and spiritual blessings as are necessary for us; or in giving thanks to God for the benefits received. The genus or general character of prayer consists invocation or adoration. Adoration is often used in the sense of the whole worship of God, since we regard him as the true God, whom we worship. Prayer is a species or part of invocation, for to call upon the true God is to ask of him such things as are necessary both for soul and body, and to render thanks to him for benefits received. It is here used in the sense of the general character of pray. There are, therefore, two species or parts comprehended in prayer—petition and thanksgiving. Petition is a prayer asking of God those blessings necessary both for the soul and body. Thanksgiving is prayer acknowledging and magnifying the benefits received from God, and binding those who receive these gifts to such gratitude as is pleasing to God. Thankfulness in general consists in acknowledging and professing what and how great is the benefit received, and in binding those who are the recipients thereof to the performance of such duties as are mutual, possible and becoming. It comprehends, therefore, truth and justice. The apostle Paul, in his first Epistle to Timothy, 2:1, enumerates four species of prayer, saying, “I exhort, therefore, that first of all supplication, prayers, intercessions, and giving of thanks, be made for all men.” The first includes prayers against evil things; the second, petitions for good things; the third, intercession for others; and the fourth, thanksgiving for benefits received and evils warded off. This distinction is drawn from the end or design of prayer. Prayer is also distinguished into public and private prayer, from the circumstances of person and place. Private prayer is the intercourse which a faithful soul has with God, asking, alone and apart from others, certain blessings for himself, or for others; or giving thanks for benefits received. This form of prayer is not restricted to any particular words or places, for oftentimes the heart, when burdened and distressed, gives utterance to nothing more than sighs and groans; and the Apostle commands “that men pray every where, lifting up holy hands.” (1 Tim. 2:8.) Public prayer is that which, by the use of certain words, is offered up to God by the whole church in the congregation, the minister leading, as it is right and proper that he should in the public gatherings of the church. Language, or the use of the tongue, is necessary for this form of prayer. Hence Christ said: When ye pray, say, Our Father, &amp;c. It was also chiefly for this that the tongue was made, that God might be praised and magnified by it; and it is out of the abundance of the heart that the mouth speaketh. Lastly, by this others are also invited to praise and worship God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, (Cincinnati, OH: Elm Street Printing Company, 1888), 619–20.</span></figcaption>

<blockquote><p>3. Some object the heinousness of the sins of ministers’ conformity as being deliberate covenanting to (I am loath to name them), and so the command, “from such turn away” [2 Tim. 3:5], with such “not to eat” [1 Cor. 5:11]… But these sins were never so surely proved as great as alleged: 1. Every minister cannot be proved guilty of the worst part. 2. And the matter of a sin may be heinous, and yet ignorance take off much of the guilt, as it did of Paul ‘s persecution [1 Tim. 1:13]. An unlawful war in which thousands were murdered and countries ruined is materially one of the greatest sins in the world; and yet woe to the abundance of princes and people if ignorance excuse it not and if we must renounce communion with all countries and persons that are guilty of it. 3. And when whole countries and Churches are in sin which we cannot cure and have no government of, the case of commanded communion much differs from that which is with single offenders, and that which is in our power to choose or refuse. 4. Some object that the fifth, sixth, seventh and eighth canons have excommunicated us already. Therefore we separate not, but they cast us out. Answer: Let them that are concerned in those canons defend them if they can and justify themselves, for it’s past my skill; but we are not bound (though excommunicated) to execute them on ourselves: Let others do it if it must be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-4efb55a7e7" data-kw="">
<blockquote><p>It is one thing most requisite, that the true Kirk is discerned from the filthy synagogues by clear and perfect notes, lest we, being deceived, receive and embrace to our condmenation the one for the other. The notes therefore of the true Church of God, we believe, confess and avow to be: First, the true preaching of the Word of God, wherein God has revealed Himself to us, as the writings of the prophets and apostles do declare. Secondly, the right administration of the sacraments of Jesus Christ, which must be annexed unto the Word and promise of God, to seal and confirm the same in our hearts. Lastly, ecclesiastical discipline uprightly administered as God’s Word prescribes, whereby vice is repressed and virtue nourished. Wheresoever then these former notes are seen, and of any time continue (be the number never so few, about two or three) there, without all doubt, is the true Church of Christ, who, according to his promise, is in the midst of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>A separation, when not upon clear and just ground, is a greater sin before God, and more wounding to the heart of Christ, than either murder or adultery, etc. And whoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-dab48019cf" data-kw="">
<blockquote><p>…while he [the opponent] says: ‘That all Scots-men were generally of one Communion, and that the presbyterians (except the Cameronians) had returned to the Episcopal Church, and were become hearers, and many communicaters with her: That there was no separate meetings kept, at least publicly, but very rarely.’ This, I say, is most false: For though never any of the presbyterians would, directly nor undirectly, own episcopal government, yet many of the more sober and intelligent among them did not think it unlawful to hear them occasionally, who had complied with episcopacy; yet they chose rather to hear their own lawful pastors, though driven into corners, than these unfaithful men: And not only so, but there were many thousands, beside Cameronians, who would never hear them: And that many (who when they had occasion to hear others, made use of that opportunity) did go to hear these men, when their liberty of hearing others was taken away, it is no wonder. Yet this practice was far less general than he says, and meetings of nonconformists were not so rare (for all the horrid persecution that they were under) as he would make us believe: Many, who were no Cameronians, kept up their meetings, though I confess it was no wonder that their meetings were not public [after about 1680], when they were by such barbarous persecutions driven into corners… §2. Another falshood is, that the party which was then treated severely, was only the Cameronians: Whereas, though they had their share of the persecution, yet other presbyterians were most cruelly dealt with; and it was observed, that, indeed, the spite of his [episcopal / royalist] party appeared most against the most sober of the presbyterians, as being the persons most capable to do them hurt. …It is also most false and calumnibus, ‘that all presbyterians in Scotland were of one principle, only the Cameronians were more ingenuous’: For the sober presbyterians did always condemn many, both principles and practices, of that party. Such as that magistrates and ministers fall, ipso facto, from their authority, respective, and stations, when they are guilty of mis-managements, and that private persons may treat them as such, without a ••••enee [decree?] of State or Church. That the rest of the presbyterians condemned the Cameronians for keeping up their meetings, is also an untruth, for they also kept up meetings; but they condemned them for the manner of their meeting, with such contempt of, and bidding defiance to the authority of the magistrate.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…while he [the opponent] says: ‘That all Scots-men were generally of one Communion, and that the presbyterians (except the Cameronians) had returned to the Episcopal Church, and were become hearers, and many communicaters with her: That there was no separate meetings kept, at least publicly, but very rarely.’ This, I say, is most false: For though never any of the presbyterians would, directly nor undirectly, own episcopal government, yet many of the more sober and intelligent among them did not think it unlawful to hear them occasionally, who had complied with episcopacy; yet they chose rather to hear their own lawful pastors, though driven into corners, than these unfaithful men: And not only so, but there were many thousands, beside Cameronians, who would never hear them: And that many (who when they had occasion to hear others, made use of that opportunity) did go to hear these men, when their liberty of hearing others was taken away, it is no wonder. Yet this practice was far less general than he says, and meetings of nonconformists were not so rare (for all the horrid persecution that they were under) as he would make us believe: Many, who were no Cameronians, kept up their meetings, though I confess it was no wonder that their meetings were not public [after about 1680], when they were by such barbarous persecutions driven into corners… §2. Another falshood is, that the party which was then treated severely, was only the Cameronians: Whereas, though they had their share of the persecution, yet other presbyterians were most cruelly dealt with; and it was observed, that, indeed, the spite of his [episcopal / royalist] party appeared most against the most sober of the presbyterians, as being the persons most capable to do them hurt. …It is also most false and calumnibus, ‘that all presbyterians in Scotland were of one principle, only the Cameronians were more ingenuous’: For the sober presbyterians did always — Gilbert Rule, A Vindication of the Church of Scotland, being an Answer to Five Pamphlets… (Edinburgh: Parkhurst, 1691) Rule (c. 1629 – 1701) was a divine right, resisting presbyterian who was a leader in the post-1690 Church of Scotland. | Answer to 2nd Letter, pp. 14-16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6while+he+%5Bthe+opponent%5D+says%3A+%E2%80%98That+all+Scots-men+were+generally+of+one+Communion%2C+and+that+the+presbyterians+%28except+the+Cameronians%29+had+returned+to+the+Episcopal+Church%2C+and+were+become+hearers%2C+and+many+communicaters+with+her%3A+That+there+was+no+separate+meetings+kept%2C+at+least+publicly%2C+but+very+rarely.%E2%80%99+This%2C+I+say%2C+is+most+false%3A+For+though+never+any+of+the+presbyterians+would%2C+directly+nor+undirectly%2C+own+episcopal+government%2C+yet+many+of+the+more+sober+and+intelligent+among+them+did+not+think+it+unlawful+to+hear+them+occasionally%2C+who+had+complied+with+episcopacy%3B+yet+they+chose+rather+to+hear+their+own+lawful+pastors%2C+though+driven+into+corners%2C+than+these+unfaithful+men%3A+And+not+only+so%2C+but+there+were+many+thousands%2C+beside+Cameronians%2C+who+would+never+hear+them%3A+And+that+many+%28who+when+they+had+occasion+to+hear+others%2C+made+use+of+that+opportunity%29+did+go+to+hear+these+men%2C+when+their+liberty+of+hearing+others+was+taken+away%2C+it+is+no+wonder.+Yet+this+practice+was+far+less+general+than+he+says%2C+and+meetings+of+nonconformists+were+not+so+rare+%28for+all+the+horrid+persecution+that+they+were+under%29+as+he+would+make+us+believe%3A+Many%2C+who+were+no+Cameronians%2C+kept+up+their+meetings%2C+though+I+confess+it+was+no+wonder+that+their+meetings+were+not+public+%5Bafter+about+1680%5D%2C+when+they+were+by+such+barbarous+persecutions+driven+into+corners%E2%80%A6+%C2%A72.+Another+falshood+is%2C+that+the+party+which+was+then+treated+severely%2C+was+only+the+Cameronians%3A+Whereas%2C+though+they+had+their+share+of+the+persecution%2C+yet+other+presbyterians+were+most+cruelly+dealt+with%3B+and+it+was+observed%2C+that%2C+indeed%2C+the+spite+of+his+%5Bepiscopal+%2F+royalist%5D+party+appeared+most+against+the+most+sober+of+the+presbyterians%2C+as+being+the+persons+most+capable+to+do+them+hurt.+%E2%80%A6It+is+also+most+false+and+calumnibus%2C+%E2%80%98that+all+presbyterians+in+Scotland+were+of+one+principle%2C+only+the+Cameronians+were+more+ingenuous%E2%80%99%3A+For+the+sober+presbyterians+did+always+condemn+many%2C+both+principles+and+practices%2C+of+that+party.+Such+as+that+magistrates+and+ministers+fall%2C+ipso+facto%2C+from+their+authority%2C+respective%2C+and+stations%2C+when+they+are+guilty+of+mis-managements%2C+and+that+private+persons+may+treat+them+as+such%2C+without+a+%E2%80%A2%E2%80%A2%E2%80%A2%E2%80%A2enee+%5Bdecree%3F%5D+of+State+or+Church.+That+the+rest+of+the+presbyterians+condemned+the+Cameronians+for+keeping+up+their+meetings%2C+is+also+an+untruth%2C+for+they+also+kept+up+meetings%3B+but+they+condemned+them+for+the+manner+of+their+meeting%2C+with+such+contempt+of%2C+and+bidding+defiance+to+the+authority+of+the+magistrate.%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+A+Vindication+of+the+Church+of+Scotland%2C+being+an+Answer+to+Five+Pamphlets%E2%80%A6+%28Edinburgh%3A+Parkhurst%2C+1691%29+Rule+%28c.+1629+%E2%80%93+1701%29+was+a+divine+right%2C+resisting+presbyterian+who+was+a+leader+in+the+post-1690+Church+of+Scotland.+%7C+Answer+to+2nd+Letter%2C+pp.+14-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdab48019cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dab48019cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=while%20he%20%5Bthe%20opponent%5D%20says%3A%20%E2%80%98That,to%20the%20authority%20of%20the%20magistrate&amp;text=while%20he%20%5Bthe%20opponent%5D%20says%3A%20%E2%80%98That%20all%20Scots%2Dmen&amp;text=bidding%20defiance%20to%20the%20authority%20of%20the%20magistrate"

<blockquote><p>IX. Although the care of religion belongs to the magistrate, political and ecclesiastical power are not on this account confounded. They are concerned with it in a different way; some are the duties of that, others of this. The former is concerned only about extrinsic things, as to their external disposition and order (which belong to the worship of God); the latter, however, about internal things (to wit, the administration of those things which pertain to the worship of God). He does not exercise the ministry of the word who admonishes and corrects a minister erring in doctrine or delinquent in life and removes an obstinate or scandalous one. He does not baptize who prohibits the profanation of baptism, who takes care that holy things should be done in a holy manner.

X. As it is not lawful for bishops to draw the sword, so neither is it lawful for princes and civilians to handle the thurible [sic]; as to the preaching of the word, the administration of the sacraments and other things which formally belong to pastors and are of the essential reason of their office. But it does not thence follow that the other functions concerning the government of the church do not belong to the believing magistrate. Although it is not lawful for bishops to engage in politics or to plead in court, still it is lawful and incumbent upon them to admonish and to exhort magistrates to do their duty. And if they at any time fall in it, they are to rebuke and to denounce the judgment of God against them. So, in turn, although the preaching of the word does not pertain to magistrates, still it is lawful for them to admonish and rebuke bishops and pastors neglecting or wandering from their office; nay, also to bring to order transgressors and to take care that the ministry be not corrupted and religion to suffer no harm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), iii, 318-19.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aa16ffe7e7" data-kw="">
<blockquote><p>And this general Rule give me leave to assert and commend to your most serious considerations and consciences. That whatsoever Law of GOD, or Command of His, we find recorded in the Law-book, in either of the Volumes of GODS Statute, the N.T. or the Old, Remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the Statute-Law of this Nation, or of any Nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or Repealed by a latter Law. And so men (I forewarn them) shall find one day urged upon them, for all those Laws that stand upon Record in GODS sacred Volumes, however now many take Liberty to reject what they please, without any just ground, that GOD hath discharged them: And the Denial or Neglect of this (in matter of Church-Government) is the Rock that we have dashed upon formerly; and therefore we had need to take the more heed of it for time to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The glass of God’s providence towards his faithful ones</cite>, (London, 1644), p. 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>A Holy Commonwealth… is a candid confession as to why a conservative [congregationalist] Puritan fought for Parliament in the Civil War and gave his support to the Cromwells. Baxter publicly repudiated the work in 1670, and in 1683 the Oxford University authorities ordered it to be part of a book-burning that included the works of Hobbes and Milton.” – on Amazon Hale, Matthew – The Analysis of the Law 3rd ed. (d. 1676; n.p., n.d.) Hale (1609-1676) was an Anglican and influential barrister, judge and jurist most noted for his treatise, The History of the Pleas of the Crown. Hale’s early works, including, A Discourse of the Knowledge of God, reflect his early Puritan and Reformed background. After ca. 1660 his thought becomes more Arminian. Hale’s Analysis of the Common Law (below) is noted as the first published history of English law and a strong influence on William Blackstone’s Commentaries on the Laws of England. Hale’s jurisprudence struck a middle-ground between Edward Coke’s “appeal to reason” and John Selden’s “appeal to contract”, while refuting elements of Thomas Hobbes’s theory of natural law. Stair, James Dalrymple – The Institutions of the Law of Scotland, Deduced from its Originals, &amp; Collated with the Civil, Canon &amp; Feudal Laws, &amp; with the Customs of Neighboring Nations… (Edinburgh, 1681) Dalrymple (1619–1695), 1st Viscount of Stair, was a Scottish lawyer, statesman and had close relationships at times with leading covenanters. In 1662, as a judge, though it was required of him, he refused to declare the National Covenant and the Solemn League &amp; Covenant to be unlawful oaths. The work above shows influences from Stair’s philosophical training, his foreign travels, and continental jurists as well as English lawyers. In 1695 there was published a small volume entitled, A Vindication of the Divine Perfections, Illustrating the Glory of God in them by Reason and Revelation, methodically digested… It is undoubtedly Stair’s work, and was edited by the two Nonconformist divines, William Bates and John Howe. . 1700’s See below on Common Law &amp; English law. . 1800’s Thomas, John Penford – A Treatise of Universal Jurisprudence (London, 1829) ToC Bastiat, Frederic – The Law (1850; NY: 1964) Bastiat (1801–1850) was a French economist, writer and a prominent member of the French Liberal School. A Freemason and a member of the French National Assembly, Bastiat developed the economic concept of opportunity cost. As an advocate of classical economics and the economics of Adam Smith, his views favored a free market and influenced the Austrian School. Bastiat did most of his writing during the years just before — and immediately following — the Revolution of February 1848. This was the period when France was rapidly turning to complete socialism. As a Deputy to the Legislative Assembly, Bastiat was studying and explaining each socialist fallacy as it appeared. And he explained how socialism must inevitably degenerate into communism. But most of his countrymen chose to ignore his logic. Lindley, Nathaniel – An Introduction to the Study of Jurisprudence, being a translation of the general part of [Anton] Thibaut’s System Des Pandekten Rechts, with Notes &amp; Illustrations (London, 1855) Thibaut (1772–1840) was a German jurist. Wiki: “The fame of this book [of Thibaut’s] results from its being the first modern complete compendium of the subject, distinguished alike by the accuracy of its sources and the freedom and unpedantic manner in which the subject is handled. It is, in effect, a codification of the Roman law as it then obtained in Germany, modified by canon law and the practice of the courts into a comprehensive system of Pandect [Roman] law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Holy Commonwealth</cite>, …</span></figcaption>

d+unpedantic+manner+in+which+the+subject+is+handled.+It+is%2C+in+effect%2C+a+codification+of+the+Roman+law+as+it+then+obtained+in+Germany%2C+modified+by+canon+law+and+the+practice+of+the+courts+into+a+comprehensive+system+of+Pandect+%5BRoman%5D+law.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Holy+Commonwealth%2C+%E2%80%A6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F90e68c39ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/90e68c39ff.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=A%20Holy%20Commonwealth,comprehensive%20system%20of%20Pandect%20%5BRoman%5D%20law&amp;text=A%20Holy%20Commonwealth&amp;text=into%20a%20comprehensive%20system%20of%20Pandect%20%5BRoman%5D%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…to punish, is to inflict malum disconveniens naturae, an evil contrary to nature; but, in appointing rulers and in agreeing to laws, they [the people] consent they shall be punished by another, upon supposition of transgression, as the child willingly going to school submits himself in that to school discipline, if he shall fail against any school law;</p></blockquote>

</figure><figure class="quote" id="q-ae450bebdf" data-kw="">
<blockquote><p>The upright man will love his native country. A country every man has. For every one there is some tract of land to which he can point with more than ordinary pleasure, and say, “there is my country.” He may call himself a citizen of the world, and such he may be as far as possible, but still there is one land, which his mind and memory favour above all others.

Famine may waste it, and the sword may devour, nevertheless “the magnet of his soul” will point to it. Brothers may prove to be monsters, and the archers may shoot at him, and hate him, but nothing can take away the magic from the words; “the land of my fathers.” So thought Joseph. Although he sat on the throne next to the King, he could not refrain from tears as his brethren led his mind over the scenes of his youth. …

Be interested in the political affairs of the nation, and see to it that your first and last votes are given in the fear of God, and for men who do not oppress, and enslave their fellow men. Refuse to vote for those, who will give honour to oppressors. O, brethren be faithful to your duty at the ballot box. There give expression to your prayers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/north-star.html">North Star</a></span><span class="wk"><span class="lbl">Work:</span> <cite>North Star</cite>, 12 May 1848.</span></figcaption>

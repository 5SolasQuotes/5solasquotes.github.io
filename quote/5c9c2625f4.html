<main class="wrap"><figure class="quote" id="q-5c9c2625f4" data-kw="">
<blockquote><p>The third breach of the institution [of the Lord’s Supper] made by kneeling is the taking away of that mystical rite representing Christ’s passion, to wit, the breaking of the bread. The apostle says not, the communion of one bread, but, the communion of one broken bread, hath in it a mystery of our unity. When the bread is carved in little morsels before it be presented to the table, it is not the sacramental and mystical breaking in the use of the sacrament which ought to be performed after the thanksgiving, according to Christ’s example. Augustine says, ‘When that which is blessed on the Lord’s table, sanctified, and broken in small pieces to be distributed,’ etc. This breaking was needful both for mystery and distribution. The breaking of the bread was thought so needful in the sacrament, that it was called ‘breaking of bread.’ The Syriac interpreter translates the breaking of bread ‘Eucharist’ (Acts 2:24, 20:7). [David] Pareus (on 1 Cor. 11) proves at length this rite not to be indifferent, but a thing commanded. Where kneeling is practiced, we read not in their service-books [of the Church of England, seeking to be imposed on the Church of Scotland] of this breaking of bread after thanksgiving, whereby the passion of Christ is not set forth to the communicants as it ought to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, … ([Leiden: Pilgrim Press, 1619]), p. 40</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47937a0e98" data-kw="">
<blockquote><p>§2. The fourth position we draw from the same rule [of following the example of Christ] is, that it is not indifferent for a minister to omit the breaking of the bread at the Lord’s table after the consecration and in the distribution of it, because he ought to follow the example of Christ, who, after He had blessed the bread, and when He was distributing it to them who were at table, brake it, breaking into pieces in his hands the bread he had taken,¹ but had it not carved in small pieces before it was brought to the table. Hence, G. J. Vossius² does rightly condemn those who, though they break the bread in multas minutias [into many small pieces], yet they break it not in actu sacramentali [in the sacramental act]. Such a breaking as this (he says well) is not mystica [related to mystery], but coquinaria [related to cooking]. 1. Paræus in 1 Cor. 11:24. manibus comminuendo panem acceptum in partes. [Cf. Ad Corinthios priorem (1609), col. 743.] 2. De Symb. Cœnæ Dom., disp. 2, thes. 5. [Cf. Theses Theologicæ et Historicæ, 1658 ed., p. 275.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637; Naphtali Press, 2013), pp. 192–193</span></figcaption>

th%20position%20we%20draw%20from%20the&amp;text=Theses%20Theologic%C3%A6%20et%20Historic%C3%A6%2C%201658%20ed.%2C%20p.%20275" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0fbb9ae289" data-kw="">
<blockquote><p>He took bread. The bread which Christ took was leavened bread, such as they ate at the feast of the Passover. This circumstance, however, does not properly belong to the Supper, any more than the evening at which time it was instituted; for the use of leavened bread at the institution was accidental. Hence we must not infer from this that there is any necessity for the use of such bread in the celebration of the Supper, or that Christ would lay down any particular way of baking or using it. Yet still the bread which is used in the celebration of the Lord’s supper differs from common bread, for whilst the latter is eaten for the nourishment of the body, the former is received for the nourishment of the soul, or for the confirmation of our faith, and union with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, reprinted 1888, trans. G.W. Williard, 4th American ed,, Cincinnati, | Question 77, p. 384</span></figcaption>

</figure><figure class="quote" id="q-bfdd296a71" data-kw="">
<blockquote><p>But I come back to your interrogatories. You say, “The bread which our Savior brake, was surely unleavened. No other was in existence among the Jews on the Passover day. How do you justify the use of leavened bread at our sacramental table?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sprague.html">William Sprague</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1876 | Dr. Sprague’s Reply to Professor Stuart’s Letter addressed to him through the American Temperance Intelligencer of August, 1835. Relative to his late sermon on the exclusion of wine from the Lord’s Supper.</span></figcaption>

<blockquote><p>2nd, from the significancy of the symbol; since bread, as the principal natural nourishment of our bodies, represents his flesh, which, as living bread, he gave for the life of the world.–– John 6:51 . But the kind of bread, whether leavened or unleavened, is not specified in the command, nor is it rendered essential by the nature of the service. Christ used unleavened bread because it was present at the Passover. The early Christians celebrated the Communion at a common meal, with the bread of common life, which was leavened. The Romish Church has used unleavened bread ever since the eighth century, and commands the use of the same as the only proper kind, but does not make it essential (“Cat. Conc. Trident.,” Pt. 2, ch. 4:, &amp;&amp; 13 and 14). The Greek Church insists upon the use of leavened bread. The Lutherans Church uses unleavened bread. The Reformed Church, including the Church of England, regards the use of leavened bread, as the food of common life, to be most proper, since bread in the Supper is the symbol of spiritual nourishment. The use of sweet cake, practiced in some of our churches is provincial and arbitrary, and is without any support in Scripture, tradition, or good taste.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quotes was compiled by Andy Webb</cite></span></figcaption>

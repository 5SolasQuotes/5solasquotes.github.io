<main class="wrap"><figure class="quote" id="q-a3ba694740" data-kw="">
<blockquote><p>[T]here were two opinions held by ancient philosophers about the passions. The Stoics said that there was no place in the wise man for sorrow. The Peripatetics said that the wise man is indeed sad, but in sad things he conducts himself with a moderation in accord with reason. This opinion accords with the truth.

For reason does not take away the condition of nature. It is natural to sensible nature to rejoice and be pleased about fitting things, and grieve and feel pain about harmful things. So reason does not take away this natural disposition, but so moderates it, that reason is not deflected from its right course because of sorrow. This opinion also accords with Holy Scripture which places sorrow in Christ, in whom there is every fullness of virtue and wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositio super Iob ad Litteram</cite>, (1263-65), C. 3, L. 1, 3:10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>We can distinguish between adequate and inadequate distinction. The first is if the things said to be distinct are as it were equal or equivalent, as is the case with all the distinctions above adduced. A distinction is inadequate if the distinct things are not equal, so that one includes the other but not conversely. Such inadequate distinctions flourish, for example, between the whole and its part, or between a subject and its mode, for a mode includes the subject it modifies and the whole includes its parts. These sort of inadequate distinctions, as is plain, can be real (for example between the human body and an arm), or formal (for example between soul and intellect, between animality and sense feeling, between formality and its mode, as between divine wisdom and the same thing’s infinity), or logical (for instance between the rays of the sun and their power of heating). Also here can be added real negative distinctions, which flourish not between thing and thing but between a thing and a negation of it (for example between man and blindness).</p></blockquote>

</figure><figure class="quote" id="q-40090ed0e8" data-kw="">
<blockquote><p>It should be carefully noted that our criticism of this procedure does not imply that we hold it to be wrong for the Christian church to make formal use of the categories of thought discovered by Aristotle or any other thinker. On the contrary, we believe that in the Providence of God, Aristotle was raised up of God so that he might serve the church of God by laying at its feet the measures of his brilliant intellect. When Solomon built the temple of God he was instructed to make use of the peculiar skill and the peculiar gifts of the pagan nation that was his neighbor. But this was something quite different than to build together with pagan nations. The Samaritans wanted to help the Jews construct the city and the temple. Hence they were rejected by the true Jews. The Phoenicians merely wanted to bring their treasures to Solomon and let him construct the way he saw fit. Hence they were gladly received by Solomon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of Christian Epistemology</cite>, (The Presbyterian and Reformed Publishing Company: Phillipsburg, NJ, 1969).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-2f36d8f083" data-kw="">
<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aquinas: a Beginner’s Guide</cite>, (OneWorld, 2010), ch. 4, ‘Psychology’ | ‘The Soul’, pp. 114-22 ‘Hylemorphic Dualism’, pp. 138-47, pp. 141-42</span></figcaption>

<blockquote><p>Second, with respect to the particular commandments of the law, saying: and the commandment of the law is holy in regard to the ceremonial precepts by which men are directed in the worship of God: be holy because I am holy (Lev 20:7) and just, in regard to the judicial precepts by which man is ordered to his neighbour in the proper way: the ordinances of the Lord are true and just altogether (Ps 19:9); and good, in regard to the moral precepts: the law of your mouth is better to me than thousands of gold and silver pieces (Ps 119:72). Yet, because all the commandments ordain us to God, he called the whole law holy.</p></blockquote>

<blockquote><p>But concerning the first part (which lies in the power [of the Church] to decree or ordain), we have already declared above that God has received to Himself fully and entirely the right to prescribe laws pertaining to the conscience and that we should walk in them uprightly before God and man.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb28d063cd" data-kw="">
<blockquote><p>But these general truths may be added, concerning the Judicial Laws: 1. None can say that none of the Judicial Laws, concerning political constitutions, is to be observed in the New Testament: for then many special rules of natural and necessary equity would be rejected, which are contained in the Judicial Laws of God: Yea all the laws of equity in the world would be so cast; for none can be instanced, which may not be reduced to some of the Judicial Laws: And if any of them are to be observed, certainly these penal statutes so necessary for the preservation of policies, must be binding. … 3. Those Judicial Laws, which had either somewhat typical, or pedagogical, or peculiar to the then Judaical State, are indeed not binding to us under that formality; though even these doctrinally are very useful, in so far as in their general nature, or equity of proportion, they exhibit to us some documents of duty: but those penal judgments, which in the matter of them are appended to the Moral Law, and are in effect but accurate determinations and accommodations of the Law of Nature, which may suit our circumstances as well as the Jews, do oblige us as well as them. And such are these penal statutes I adduce; for, that blasphemy, murder and idolatry, are heinous crimes and that they are to be punished, the Law of Nature dictates; and how, and by whom, in several cases, they are to be punished, the Law judicial determines. Concerning the Moral Equity even of the strictest of them: [William] Ames, Of the Conscience, Book 5, ‘Of the Appended Precepts of Moses’. 4. Those Judicial Laws, which are but Positive in their form, yet if their special internal and proper reason and ground by Moral, which pertains to all nations, which is necessary and useful to mankind, which is rooted in and may be fortified by human reason, and as to the substance of them approven by the more intelligent heathens; those are Moral, and oblige all Christians as well as Jews: and such are these laws of punishing idolaters, etc. founded upon Moral grounds, pertaining to all nations necessary and useful to mankind, rooted in and fortified by human reason, to wit that the wrath of God may be averted, and that all may hear and fear and do no more so wickedly; especially this reason be superadded, when the case is such, that innocent and honest people cannot be preserved, if such wicked persons be not take order with.</p></blockquote>

</figure><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654)</cite>, pp. 211-13, 218-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, sections 6 &amp; 23</cite>, pp. 8-9, 14</span></figcaption>

<div class="actions"><button class="copy" data-copy="“VI. Besides the uncreated natural divine right (called primary) founded immediately upon the very nature and holiness of God (the contrary of which He could not will nor command without denying Himself), another is granted (created and secondary), founded on the nature of things (according to the constitution established by God and the mutual suitableness or fitness of things to each other). On the hypothesis of the order instituted by God (according to which He willed such to be the nature of things), it is necessary. Still it cannot be regarded as of the same necessity with the first, nor do the duties flowing from it have an equal degree of obligation. For the former is immutably absolute; nor is there any case in which God can relax it because thus He would appear to deny his own nature, on which it is based. Hence He never could command or approve hatred of Himself, idolatry, perjury and falsehood. But the latter (although containing the natural rule of rectitude, because it supposes a certain state of things) could in certain cases (the circumstances of things and persons being altered) be changed, but only by his authority who established it. For example, murder and stealing (forbidden in the sixth and eighth commandments) could become lawful [e.g. possibly Gen. 22 with Abraham being commanded of God to sacrifice Isaac], some circumstance being changed–for instance, a divine command or public authority being given. In this respect, it can be referred to positive right; not indeed absolutely and simply such and merely free (which has no foundation except in the will of God alone), but relatively, inasmuch as (although based upon the order of things and created nature), it can still admit of a change in accordance with the wisdom of the legislator, who established that order. … XXIII. The sixth commandment, about homicide, was not dispensed with when Abraham was ordered to kill his own son. The command was only exploratory, not absolute. Neither if he had killed him by God’s command would he have violated the law concerning homicide because he would have done it empowered by a public authority (to wit, the command of God). However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty…”

— Francis Turretin, Institutes, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, sections 6 &amp; 23, pp. 8-9, 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVI.+Besides+the+uncreated+natural+divine+right+%28called+primary%29+founded+immediately+upon+the+very+nature+and+holiness+of+God+%28the+contrary+of+which+He+could+not+will+nor+command+without+denying+Himself%29%2C+another+is+granted+%28created+and+secondary%29%2C+founded+on+the+nature+of+things+%28according+to+the+constitution+established+by+God+and+the+mutual+suitableness+or+fitness+of+things+to+each+other%29.+On+the+hypothesis+of+the+order+instituted+by+God+%28according+to+which+He+willed+such+to+be+the+nature+of+things%29%2C+it+is+necessary.+Still+it+cannot+be+regarded+as+of+the+same+necessity+with+the+first%2C+nor+do+the+duties+flowing+from+it+have+an+equal+degree+of+obligation.+For+the+former+is+immutably+absolute%3B+nor+is+there+any+case+in+which+God+can+relax+it+because+thus+He+would+appear+to+deny+his+own+nature%2C+on+which+it+is+based.+Hence+He+never+could+command+or+approve+hatred+of+Himself%2C+idolatry%2C+perjury+and+falsehood.+But+the+latter+%28although+containing+the+natural+rule+of+rectitude%2C+because+it+supposes+a+certain+state+of+things%29+could+in+certain+cases+%28the+circumstances+of+things+and+persons+being+altered%29+be+changed%2C+but+only+by+his+authority+who+established+it.+For+example%2C+murder+and+stealing+%28forbidden+in+the+sixth+and+eighth+commandments%29+could+become+lawful+%5Be.g.+possibly+Gen.+22+with+Abraham+being+commanded+of+God+to+sacrifice+Isaac%5D%2C+some+circumstance+being+changed%E2%80%93for+instance%2C+a+divine+command+or+public+authority+being+given.+In+this+respect%2C+it+can+be+referred+to+positive+right%3B+not+indeed+absolutely+and+simply+such+and+merely+free+%28which+has+no+foundation+except+in+the+will+of+God+alone%29%2C+but+relatively%2C+inasmuch+as+%28although+based+upon+the+order+of+things+and+created+nature%29%2C+it+can+still+admit+of+a+change+in+accordance+with+the+wisdom+of+the+legislator%2C+who+established+that+order.+%E2%80%A6+XXIII.+The+sixth+commandment%2C+about+homicide%2C+was+not+dispensed+with+when+Abraham+was+ordered+to+kill+his+own+son.+The+command+was+only+exploratory%2C+not+absolute.+Neither+if+he+had+killed+him+by+God%E2%80%99s+command+would+he+have+violated+the+law+concerning+homicide+because+he+would+have+done+it+empowered+by+a+public+authority+%28to+wit%2C+the+command+of+God%29.+However%2C+the+law+does+not+condemn+homicide+of+every+kind.+For+the+magistrate+is+bound+to+punish+the+guilty%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes%2C+vol.+2%2C+11th+Topic%2C+2nd+Question%2C+%E2%80%98The+Nature+of+the+Moral+Law%E2%80%99%2C+sections+6+%26+23%2C+pp.+8-9%2C+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b5a3f9db9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b5a3f9db9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text=VI.%20Besides%20the%20uncreated%20natural%20divine,is%20bound%20to%20punish%20the%20guilty%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>However, all those things of which it cannot be said that God was not by necessity of nature bound to the other part of the contradiction (or in which we know that God can make or has actually made some change in the obligation) belong to positive right. Such were the symbolical law given to Adam and the ceremonial laws of the Old Testament (which depended on the free will of God). Here also the permission of sin is usually referred.</p></blockquote>

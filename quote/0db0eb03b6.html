<main class="wrap"><figure class="quote" id="q-0db0eb03b6" data-kw="">
<blockquote><p>And turn aside the way of the meek. [Amos 2:7]

That is, first they turn aside the way of Justice and Equity, which is the means of recovering their right. They cannot have that justice and right done them, which is due unto them. By reason of the greatness of the estates and power of these men, they stop the current of justice and equity, whereby these meek ones should be delivered from their oppressors.

Secondly, they turn aside the way of the meek, that is, they take away the way of their livelihood. We use commonly to ask this Question, How doth such a man live? And ’tis answered, He lives in a very good way, he hath such a way of living, such a trade, calling, or profession, that’s his way. Thus to turn aside the way of the meek, is to put them besides the way of getting their bread, and maintaining themselves, wives, and children with necessary provisions. To take away the calling they live by, is a turning aside the way of the meek to all purposes.

Thirdly, they turn aside the way of the meek. Why? what is the way of the meek? The Psalmist tells us, Psal. 25. 9. it is God’s way, the meek he will teach his way. Now these great ones either first force them to make shipwreck of faith and a good conscience, or else undo them if they will not consent unto them in their unjust and uncharitable designs. And so of necessity these meek ones must be undone either in the inward, or outward man. Or else secondly, they become tempters unto these meek ones by their often alluring persuasions and ill egging, or else by their ill examples to turn them out of God’s way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-moore.html">John Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scripture-word against inclosure; viz. such as doe un-people towns, and un-corn fields. As also against all such that daub over this black sin with untempered morter</cite>, (London: Anthony Williamson, 1656), pp 3-4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57c738a3a2" data-kw="">
<blockquote><p>Let your affection, then, be drawn out by us more and more as we nearly say to you what Ruth said to Naomi. We came here to become the same body with you. And as your God is our God, your people will from now on also be our people, your laws will be our laws, and your interests our interests. Where you live we will live; where you die we will die and we will be buried in your tombs. Love us, then, as your brothers and your countrymen, and kindly look down on our weaknesses. We were born in a climate that doesn’t give to everyone the wise, discreet and restrained temperament that yours gives to you. Put up with us, for as it is proper that we should conform ourselves as much as is possible to your prudence, we also hope that you in fairness will not hold against us all of our weaknesses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-claude.html">Jean Claude</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on Ecclesiastes 7:14: Delivered during a Fast Day at The Hague, the Netherlands, on November 21, 1681 , trans. Charles K. Telfer in Mid-American Journal of Theology</cite></span></figcaption>

<blockquote><p>So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].</p></blockquote>

<blockquote><p>Whereas it has pleased the Lord to move the Heart of our dread Sovereign Charles [I] by the Grace of God King etc. to grant license and liberty to sundry of his subjects to plant themselves in the Western parts of America. We… considering with ourselves the holy Will of God and our own Necessity that we should not live without wholesome Laws and Civil Government among us… do in the name of Christ and in the sight of God combine ourselves together to erect and set up among us such Government as shall be to our best discerning agreeable to the Will of God… and binding of ourselves solemnly by the Grace and Help of Christ and in His Name and fear to submit ourselves to such Godly and Christian Laws as are established in the realm of England… which shall… be made and enacted among us according to God that we may live quietly and peaceably together in all godliness and honest.</p></blockquote>

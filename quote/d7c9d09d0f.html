<main class="wrap"><figure class="quote" id="q-d7c9d09d0f" data-kw="">
<blockquote><p>1. That it is necessary for salvation, Jn. 3:3.

2. That regeneration is one action in species, and consequently always one and uniform for all, as to essentials.

3. That it is instantaneous, or that it happens in an instant. But what is said by some to be successive is to be understood of the whole complex or collection of the terminus in the first and second moment; but we here treat of the terminus of regeneration in the first moment.

4. That it is perfect (as also all actions of God) according to the divine idea and intention; in the same way the first creation of all things was perfect. But I say it is perfect not only in itself and by reason of God operating (to whom no defect can happen), but also by reason of the terminus and intended effect, and of the operation proportionate to it.

5. That it is supernatural, transcending the whole of nature and its works and the order constituted in creation, Matthew 16:17; John 1:9–10, 12–13.

6. That consequently it is of God alone, no less than creation and resuscitation, Romans 4:17.

7. That the mode of operating or causality of God regenerating is physical, by which one thing is directly changed into another, and the new creature is produced and introduced.

8. That the same is nevertheless called moral or objective, not in itself and with respect to regeneration as such, but by reason of its adjunct, whether antecedent or concomitant, namely, calling.

9. That it is infallible by reason of God’s intention and the event, and irresistible and invincible by reason of the mode and efficacy of operating. For although man according to his innate depravity can do nothing but resist in the divided sense, yet actually he does not resist nor can he resist in the composite sense, when the Holy Spirit regenerating removes resistibility by impressing a new principle of spiritual life.

10. Therefore no voluntary or involuntary of man has place in this first moment, because no human action intervenes, but it is the action of God alone. So that the will conducts itself neutrally and purely passively with respect to the new principle, here willing or not willing nothing. Yet regeneration could be called voluntary as to man by extrinsic denomination from the consequent effect, or by a certain extrinsic respect, on account of the subsequent (not indeed antecedent or simultaneous) consent of the will, or new and regenerate volition, by which, excited by second grace in the second moment, man himself begins to will the spiritual goods offered through calling according to the new will divinely impressed, and according as the Holy Spirit made him willing from unwilling, and works in him τὸ θέλειν [to thelein, the willing] and to accomplish.

11. Finally, that it is difficult if you look to nature and flesh, yet easy if you look to τὸ κράτος τῆς ἰσχύος [to kratos tēs ischuos, the might of the power] divine, Matthew 19:23–26, compared with Ephesians 1:19; Proverbs 21:1; Romans 11:23. Hence omnipotent facility and easy omnipotence are attributed to God regenerating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>

</figure><figure class="quote" id="q-42baf48e08" data-kw="">
<blockquote><p>Thirdly, James has spoken shortly before concerning regeneration, namely, that it occurs through the Gospel. For thus he says 1:18, ‘Of His own will begat He us with the Word of Truth, that we should be a kind of firstfruits of His creatures.’ When he says that we have been born again by the Gospel, he teaches that we have been born again and justified by faith. For the promise concerning Christ is apprehended only by faith, when we set it against the terrors of sin and of death. James does not, therefore, think that we are born again by our works. … but on account of His promise He forgives those who apprehend His promise. Neither do any apprehend His promise, except those who truly believe, and by faith overcome sin and death. These, being regenerated, ought to bring forth fruits worthy of repentance, just as John says, Mt. 3:8.</p></blockquote>

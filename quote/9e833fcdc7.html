</figure><figure class="quote" id="q-cb8ac2d81e" data-kw="">
<blockquote><p>The notion that the Spirit creates union with Christ and constitutes us definitively sanctified by this union/identification with Christ from which flows the rest of the ordo salutis (including justification and progressive sanctification) may be true, but it isn’t the obvious and overwhelming teaching of the Reformed theologians and confessions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What is Definitive Sanctification &amp; is it Reformed?’</cite>, (2009) 20 paragraphs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“The notion that the Spirit creates union with Christ and constitutes us definitively sanctified by this union/identification with Christ from which flows the rest of the ordo salutis (including justification and progressive sanctification) may be true, but it isn’t the obvious and overwhelming teaching of the Reformed theologians and confessions.”

— R. Scott Clark, ‘What is Definitive Sanctification &amp; is it Reformed?’ (2009) 20 paragraphs">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+notion+that+the+Spirit+creates+union+with+Christ+and+constitutes+us+definitively+sanctified+by+this+union%2Fidentification+with+Christ+from+which+flows+the+rest+of+the+ordo+salutis+%28including+justification+and+progressive+sanctification%29+may+be+true%2C+but+it+isn%E2%80%99t+the+obvious+and+overwhelming+teaching+of+the+Reformed+theologians+and+confessions.%E2%80%9D%0A%0A%E2%80%94+R.+Scott+Clark%2C+%E2%80%98What+is+Definitive+Sanctification+%26+is+it+Reformed%3F%E2%80%99+%282009%29+20+paragraphs&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb8ac2d81e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb8ac2d81e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=The%20notion%20that%20the%20Spirit%20creates,of%20the%20Reformed%20theologians%20and%20confessions&amp;text=The%20notion%20that%20the%20Spirit%20creates%20union%20with&amp;text=overwhelming%20teaching%20of%20the%20Reformed%20theologians%20and%20confessions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9bf5ec5c6f" data-kw="">
<blockquote><p>§I. Sacred Scripture, of both the Old and the New Testament, exhorts and obliges man under the Covenant of Grace to perfection. In the Old Testament, God Himself addresses Abraham: Gen. 17:1, ‘Walk before Me, and be perfect;’… §II. ‘In the New Testament, Christ commands in Mt. 5:48, ‘Be ye therefore perfect, τέλειοι, even as your Father which is in heaven is perfect.’ Paul in 1 Cor. 2:6 says, ‘we speak wisdom among them that are perfect, τελείοις. Phil. 3:15, the same apostle stimulates himself and other Christians to perfection, ‘Let us therefore, as many as be perfect, τέλειοι, be thus minded.’ Col. 1:28, he professes that he and the other apostles announce Christ, so that we may present every man perfect, τέλειον, in Christ Jesus. Col. 3:14, he calls charity σύνδεσμον τῆς τελειότητος, the bond or chain of perfection. Col. 4:12, it is said of Epaphras that he is always striving in prayers for the Colossians, that they may stand perfect, τέλειοι, and complete, πεπληρωμένοι, in all the will of God… Heb. 5:14, the apostle says that strong meat belongs to them that are of full age (perfect), τελείων. §III. Examples of perfect men also occur in the sacred writings… Concerning Noah, God Himself testifies that he was a just and perfect man before him in his generations, Gen. 6:9, and walked with God without ceasing. Concerning Job, God Himself, addressing Satan, gives this sentence in chap. 1 &amp; 2, ‘Hast thou considered my servant Job, that there is none like him in the earth, תםָּ שׁאיִ , a perfect and an upright man, one that feareth God, and escheweth evil.’… §IV. Therefore, the term for Christian ‘perfection’ exists, which we can use without suspicion of heterodoxy, even if others, namely the Novatians and Pelagians, have abused it… Certainly, in the age of Justin Martyr [2nd century A.D.], the name of the perfect was so customary that in his Dialogue with Trypho he himself interprets to become perfect as to become a Christian. … §VI… Perfection is twofold: Legal and Evangelical. Legal is either absolute, or in a certain respect… §VII. Evangelical perfection, on the contrary, consists in the recognition of our misery, both corporal and spiritual, and the necessity of fleeing to the grace of God in Jesus Christ our propitiator, and in a sincere and ἀνυπόκριτος, that is, undisguised and serious and constant endeavor to serve and obey God, through the grace of the Holy Spirit, to be obtained from Him for that purpose by ardent prayers, according to all the commands of the Law, and according to all the faculties of the soul and body, and to grow and advance daily more and more in faith, charity, hope, and other Christian virtues, and to implore pardon for errors and lapses for the sake of the Mediator. §VIII. The former [legal] perfection is rightly called one of degrees, full, and absolute and consummate in all its parts. The latter [evangelical] is called a perfection of parts, inchoate, and in one word, sincerity. And it is such, either absolutely without respect to others who are more imperfect; or comparatively with respect to others who are more imperfect and less mature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Inaugural Historical-Theological Disputation on Christian Perfection’</cite>, (Frankfurt: Coepsel, 1698) 34 pp.</span></figcaption>

fies+that+he+was+a+just+and+perfect+man+before+him+in+his+generations%2C+Gen.+6%3A9%2C+and+walked+with+God+without+ceasing.+Concerning+Job%2C+God+Himself%2C+addressing+Satan%2C+gives+this+sentence+in+chap.+1+%26+2%2C+%E2%80%98Hast+thou+considered+my+servant+Job%2C+that+there+is+none+like+him+in+the+earth%2C+%D7%AA%D7%9D%D6%B8%D6%BC+%D7%A9%D7%81%D7%90%D7%99%D6%B4+%2C+a+perfect+and+an+upright+man%2C+one+that+feareth+God%2C+and+escheweth+evil.%E2%80%99%E2%80%A6+%C2%A7IV.+Therefore%2C+the+term+for+Christian+%E2%80%98perfection%E2%80%99+exists%2C+which+we+can+use+without+suspicion+of+heterodoxy%2C+even+if+others%2C+namely+the+Novatians+and+Pelagians%2C+have+abused+it%E2%80%A6+Certainly%2C+in+the+age+of+Justin+Martyr+%5B2nd+century+A.D.%5D%2C+the+name+of+the+perfect+was+so+customary+that+in+his+Dialogue+with+Trypho+he+himself+interprets+to+become+perfect+as+to+become+a+Christian.+%E2%80%A6+%C2%A7VI%E2%80%A6+Perfection+is+twofold%3A+Legal+and+Evangelical.+Legal+is+either+absolute%2C+or+in+a+certain+respect%E2%80%A6+%C2%A7VII.+Evangelical+perfection%2C+on+the+contrary%2C+consists+in+the+recognition+of+our+misery%2C+both+corporal+and+spiritual%2C+and+the+necessity+of+fleeing+to+the+grace+of+God+in+Jesus+Christ+our+propitiator%2C+and+in+a+sincere+and+%E1%BC%80%CE%BD%CF%85%CF%80%CF%8C%CE%BA%CF%81%CE%B9%CF%84%CE%BF%CF%82%2C+that+is%2C+undisguised+and+serious+and+constant+endeavor+to+serve+and+obey+God%2C+through+the+grace+of+the+Holy+Spirit%2C+to+be+obtained+from+Him+for+that+purpose+by+ardent+prayers%2C+according+to+all+the+commands+of+the+Law%2C+and+according+to+all+the+faculties+of+the+soul+and+body%2C+and+to+grow+and+advance+daily+more+and+more+in+faith%2C+charity%2C+hope%2C+and+other+Christian+virtues%2C+and+to+implore+pardon+for+errors+and+lapses+for+the+sake+of+the+Mediator.+%C2%A7VIII.+The+former+%5Blegal%5D+perfection+is+rightly+called+one+of+degrees%2C+full%2C+and+absolute+and+consummate+in+all+its+parts.+The+latter+%5Bevangelical%5D+is+called+a+perfection+of+parts%2C

<main class="wrap"><figure class="quote" id="q-95d4f7e253" data-kw="">
<blockquote><p>At a soiree to the Revd Dr Samuel B. Wylie held at Belfast in October 1845, the Revd Isaac Nelson of Donegall Street Presbyterian Church spoke of his admiration for Dr Wylie. Dr Wylie then addressed the gathering, which was chaired by Counsellor James Gibson, on the steps that Covenanters in America had taken against the abomination of chattel slavery:

The CHAIRMAN then called upon the Rev. Isaac Nelson, to address the meeting on union among christians of all denominations, for the suppression of slavery as a system repugnant to liberty, and the spirit of the Gospel. Mr. Nelson responded to the sentiment in an eloquent and energetic speech, in which he denounced slavery as hateful in the sight of God, and disgraceful to humanity. – He hoped the mantle of Dr. Wylie, and men like him, who had contended for the liberty of their fellow-man, would fall upon others, who would never cease their efforts until the foul stain of slavery would be not only banished from churches, but from every nation under heaven. (Hear, hear, and cheers.) All sections of the church would unite to free the slave, indeed, on that subject of slavery, and the conclusion to which he had come was, that no slaveholder should be allowed to sit down at the Lord’s table, or be recognised as a member of the Christian Church. He did not take his opinions from any man, and, were he to stand alone in the Church to which he had the honour to belong, he would maintain his opinion that slave-holding was a sin, and that the slave-holder should be excluded from the church. (Cheers.)

THE CHAIRMAN then introduced Dr. Wylie to the meeting, and he gave a detailed account of what he had done himself and of what had been done in his day for the abolition of slavery in America, as regarded the Reformed Presbyterian Church, the end of which was that all slaveholders were banished from her communion. For many years that church had maintained the high and holy stand she had taken, though in some places her members had suffered much on account of their opposition to slavery. The Covenanting Church in America would as soon allow a sheep-stealer to sit down at the table of the Lord, as they would a slave-holder. (This statement was received with the most enthusiastic applause.) Dr. Wylie then congratulated the various churches in this country on the stand which they had taken in opposition to slavery […]</p></blockquote>

<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature:

1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin.

2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually.

3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.)

4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>

<blockquote><p>BELFAST ANTI-SLAVERY SOCIETY

On Thursday evening, a meeting of this Society was held in the Presbyterian Church, Rosemary-street, to give the delegates from the American Anti-slavery Society the opportunity of laying before the people of this country the present condition of slavery in the United States, and the results of emancipation in the British Colonies.

At half-past seven o’clock, the Rev. THOMAS DREW, of Christ Church, was called to the chair, and commenced the business by prayer. He afterwards proceeded to observe, that he was happy to respond to the wish of the Society, to preside at this meeting; and believed that every one, whatever were his opinions on other subjects, was convinced of this, – that slavery was a curse. (Hear, hear.) The great meeting held this year in London, at which the illustrious husband of our gracious Sovereign [Prince Albert] presided, was a striking demonstration of this, for there men of all sects and parties, united by one common bond of charity and mercy, came to the declaration, that no man had the power over his fellow-creature to treat him as if he were chattel property; for what is so degrading and brutalizing as the whole iniquitous system? what can a slave man be as a husband? what a slave woman as a wife?

Here, under the place we are now assembled, is an admirable Sunday School, conducted by Mr [James] Gibson, which is an honour to that gentleman, and to the town at large; but mark the contrast in the States of America, which is an honour to that gentleman, and to the town at large; but mark the contrast in the States of America, which boast of their freedom. If any negro shall venture to teach a Sunday school, he is fined £500; and if the offence shall be repeated, he is subject to the penalty of death. I am sorry to say that a native of this town, a man of great talents, has written a book in favour of slavery.

It may not be generally known, that the Lough of Belfast has been stained with the blood of slaves. More than 100 years ago, when slavery was even worse than at present, a ship with slaves, driven by stress of weather, took shelter in our beautiful Lough. She anchored near Bangor, and there many of the slaves instinctively leaped into the water, and got on shore – proud of the glorious privilege which spoke to their hearts, that the slave who planted his foot on British ground was free.

The captain seeing the danger of losing all his ill fated cargo, and determined by a signal act of tyranny to make an example to deter the slaves from seeking their freedom, took a young female slave, and placing round her waist a rope, lowered her repeatedly from the yard-arm into the water – her shrieks were loud, but disregarded – at last he drew up only one-half of his murdered victim, for the sharks, seeking for human blood, had followed the vessel, and now got their prey. That blood is still crying out for vengeance, and no conscientious man is innocent who does not protest against the atrocious injustice of slavery. (Cheers.)</p></blockquote>

d%2C+he+is+subject+to+the+penalty+of+death.+I+am+sorry+to+say+that+a+native+of+this+town%2C+a+man+of+great+talents%2C+has+written+a+book+in+favour+of+slavery.%0A%0AIt+may+not+be+generally+known%2C+that+the+Lough+of+Belfast+has+been+stained+with+the+blood+of+slaves.+More+than+100+years+ago%2C+when+slavery+was+even+worse+than+at+present%2C+a+ship+with+slaves%2C+driven+by+stress+of+weather%2C+took+shelter+in+our+beautiful+Lough.+She+anchored+near+Bangor%2C+and+there+many+of+the+slaves+instinctively+leaped+into+the+water%2C+and+got+on+shore+%E2%80%93+proud+of+the+glorious+privilege+which+spoke+to+their+hearts%2C+that+the+slave+who+planted+his+foot+on+British+ground+was+free.%0A%0AThe+captain+seeing+the+danger+of+losing+all+his+ill+fated+cargo%2C+and+determined+by+a+signal+act+of+tyranny+to+make+an+example+to+deter+the+slaves+from+seeking+their+freedom%2C+took+a+young+female+slave%2C+and+placing+round+her+waist+a+rope%2C+lowered+her+repeatedly+from+the+yard-arm+into+the+water+%E2%80%93+her+shrieks+were+loud%2C+but+disregarded+%E2%80%93+at+last+he+drew+up+only+one-half+of+his+murdered+victim%2C+for+the+sharks%2C+seeking+for+human+blood%2C+had+followed+the+vessel%2C+and+now+got+their+prey.+That+blood+is+still+crying+out+for+vengeance%2C+and+no+conscientious+man+is+innocent+who+does+not+protest+against+the+atrocious+injustice+of+slavery.+%28Cheers.%29%E2%80%9D%0A%0A%E2%80%94+Thomas+Drew%2C+Belfast+Commercial+Chronicle%2C+31+October+1840.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff8aff45bb5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f8aff45bb5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/16/thomas-drew-on-the-atrocious-injustice-of-black-slavery/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The Prelate [John Maxwell] objects out of Spalato, Arnisaeus and Hugo Grotius… All government and superiority in rulers is not primely and only for the subjects’ good; for some are by God and nature appointed for the mutual and inseparable good of the superior and inferior, as in the government of husband and wife, or father and son; and in herili dominio, in the government of a lord and his servant, the good and benefit of the servant is but secondary and consecutively intended, it is not the principal end, but the external and adventitious [end], as the gain that comes to a physician is not the proper and internal end of his art, but follows only from his practice of medicine.</p></blockquote>

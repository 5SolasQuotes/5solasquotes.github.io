<main class="wrap"><figure class="quote" id="q-843533abf8" data-kw="">
<blockquote><p>Let them [the Protesters] take heed if this be not a main step to Separation (which in words they seem to abhor), when as they protest and profess they will not hear us, so they would cast on us a kind of necessity to hold them as heathens and publicans; But to prevent this they have found a way of their own, and (as if they had not been of us) they are gone out from us, and setting up to do their own business without us, as they seem to intimate in the last page of their printed Paper after the Protestation, contrary to the very fundamentals of the discipline of our Kirk, which is, and has ever been professed to be by presbyteries, synods and national assemblies, duly subordinate one to another, all which their course overturns, while they walk in another way to make the matters of their propositions practicable, as they say.</p></blockquote>

 target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a4aed3395" data-kw="">
<blockquote><p>I. The Articles of the Christian Belief It is a catechism if you prefix to every article the question, ‘What do you believe?’ There is one only God in three persons, the Father, Son and Holy Ghost: who is infinite in being, power, wisdom and goodness: the Creator of all things, our most absolute Lord, most righteous Governor and most gracious Father. God made man for Himself in his own image, with reason and freewill: endued with wisdom and holiness; and put under him the inferior creatures, for his use: and bound him by the Law of Nature to adhere to God his Maker; to believe Him, fear Him, love Him, honor Him and obey Him with all his powers: moreover forbidding Him to eat of the Tree of Knowledge upon pain of death. Man being tempted by Satan, did willfully sin, and so fell from God and happiness, under the wrath of God, the curse of his Law and the power of the Devil: and hence we are all conceived in sin, and prone to evil, and condemnation is passed upon all; and no mere creature is able to deliver us. God so loved the world that He gave his only Son to be their Redeemer; who being God, and one with the Father did take our nature, and become man; being conceived by the Holy Ghost in the Virgin Mary, and born of her, and called Jesus Christ; and being free from sin, He conquered the tempter, fulfilled all righteousness, revealed the Gospel, and confirmed it by miracles; and gave Himself a sacrifice for our sins, and a ransom for us, in suffering death on the cross, to reconcile us unto God; and was buried, and went among the dead) and rose again the third day, having conquered death; and afterward ascended into heaven where he remains God and Man, in one Person, and is Lord of all, in glory with the Father; the chief Priest, and Prophet, and King of his Church; interceding for us; and teaching and ruling us, by his Spirit, ministers, and Word. The Lord Jesus Christ has ordained in his Testament that all they that receive Him by a true effectual faith, and by true repentance do turn from the flesh, the world, and the Devil unto God, shall freely receive the pardon of their sins, and shall become the sons of God, and heirs of everlasting life, and the Spirit of Christ shall dwell within them: and all that overcome and persevere to the death, shall live with Christ in endless glory: But the unbelievers, impenitent and unholy shall be condemned to everlasting fire. And this He has commanded his ministers to preach to all the world: And has told us that, All that are given Him of the Father, shall come to Him, and that he will in no wise cast them out, nor shall any pluck them out of his hands. The Holy Ghost proceeding from the Father and the Son, did inspire and guide the prophets, apostles, and evangelists, that they might truly and fully reveal the doctrine of Christ, and deliver it in Scripture to the Church as the rule of our faith and life: and by abundance of evident uncontrolled miracles, and wonderful gifts, to be the great witness of Christ, and of the truth of his holy Word. Where the Gospel is made known, the Holy Ghost by it does enlighten the minds of all that shall be saved, and opening and softening their hearts, does draw them to believe in Christ and turns them from the power of Satan unto God: Whereupon they are joined to Christ the Head, and into one holy catholic Church which is his Body, consisting of all true believers: and are freely justified, and made the sons of God; and a sanctified peculiar people unto Him, and do love Him above all, and serve Him sincerely in holiness and righteousness, loving and desiring the communion of the saints; overcoming the flesh, the world and the Devil, and hoping for Christ’s second coming, and for everlasting life. At death the souls of the justified go to happiness with Christ, and the souls of the wicked to misery: And at the end of this world the Lord Jesus Christ will come again, and will raise the bodies of all men from the dead; and will judge all according to their works; And the righteous shall go into everlasting life, and the rest into everlasting punishment: All this I do unfeignedly believe.

II. Our Consent to the Gospel Covenant, with God the Father, Son and Holy Ghost, by which we are Christians and members of the catholic Church Question: Are you willing and resolved to give up yourself to God the Father, Son and Holy Ghost, according to the Gospel doctrine which your profess? Repenting of my sins and renouncing the flesh, the world and the devil, I do take this one God to be my only God, and do heartily give up myself unto Him; even to the Father, as my Creator and reconciled Father in Christ: And to his Son Jesus Christ, as my Lord, and only Savior, to reconcile and bring me unto God: And to the Holy Ghost as my Sanctifier; that He may further illuminate, sanctify and confirm me, and I may hold fast and obey the doctrine of Christ, which was revealed by his inspiration, and witnessed by his gifts and miracles, and is now contained in the Holy Scriptures; and that he may be in me the earnest of my everlasting happiness with God.

III. The Sum of Christian Duty Question: What are [???…] Christ has appointed that fit men shall be ordained his ministers, to preach the Gospel to the nations of the world, and make them his disciples, baptizing them in the name of the Father, Son and Holy Ghost: and to congregate his disciples, and to oversee and guide the several congregations, and each member thereof: particularly, to teach them the Word of God; to pray and praise God with them and for them to administer the Lord’s Supper in remembrance of Him; especially on the Lord’s Day, which He has appointed for holy communion in such works: Also to rebuke with authority the scandalous and unruly; and to bind and reject those that are obstinately impenitent, and unreformed; and to absolve and restore the penitent, and confirm the weak. It is therefore the people’s duty to join with such churches, for the aforesaid worship of God; and to know, hear, submit to, and obey these their guides that are over them in the Lord; and to avoid division and discord, and to live in unity, love and peace. The secret duties of holiness are these: The exercise of faith, repentance, love, hope, delight in God, and all other graces; The mortifying of our sins; especially atheism, unbelief, and unholiness; hardness of heart, disobedience and unthankfulness, flesh-pleasing, covetousness, and pride; The diligent examining of our own hearts, about our estates, our duties, and our sins: meditating upon God, and his Word and works; especially of our redemption by Jesus Christ; and of death, Judgment, heaven, and Hell; watching diligently over our thoughts, affections, words and actions: resisting temptations: And frequent and fervent prayer to God, in the name of Christ, with confession, thanksgiving, and cheerful praises; Parents and masters must diligently teach their children and servants the Word and fear of God, and pray with them and for them, and hinder them from sin, and use all their power that they and their households may serve the Lord: children and servants must willingly learn and obey: We must seek instruction in the matters of our salvation, especially of our teachers: we must take heed of the company of tempting and ungodly persons, and delight in the company and help of the godly: We must lovingly and faithfully give, and thankfully receive admonitions and exhortations: confessing our faults one to another: and by prayer, psalms, and edifying conference, and a holy conversation, provoking one another to love, and to good works. Superiors must rule for God and the common good, with justice and mercy: Inferiors must honor and obey them in the Lord: We must not injure, but preserve the life, chastity, estate, name, and rights of our neighbor: Not seeking our own against his welfare, but doing as we would be done by; forbearing and forgiving; and loving our neighbor as ourselves: Yea loving our enemies; and doing good to all according to our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, The Christian Religion expressed: I. briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II. more largely in a Profession taken out of the Holy Scriptures, containing 1. the articles of the Christian Belief, 2. our consent to the Gospel Covenant, 3. the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660) | The Profession of the Christian Religion. See the original for the Scripture proofs.</span></figcaption>

y+it+does+enlighten+the+minds+of+all+that+shall+be+saved%2C+and+opening+and+softening+their+hearts%2C+does+draw+them+to+believe+in+Christ+and+turns+them+from+the+power+of+Satan+unto+God%3A+Whereupon+they+are+joined+to+Christ+the+Head%2C+and+into+one+holy+catholic+Church+which+is+his+Body%2C+consisting+of+all+true+believers%3A+and+are+freely+justified%2C+and+made+the+sons+of+God%3B+and+a+sanctified+peculiar+people+unto+Him%2C+and+do+love+Him+above+all%2C+and+serve+Him+sincerely+in+holiness+and+righteousness%2C+loving+and+desiring+the+communion+of+the+saints%3B+overcoming+the+flesh%2C+the+world+and+the+Devil%2C+and+hoping+for+Christ%E2%80%99s+second+coming%2C+and+for+everlasting+life.+At+death+the+souls+of+the+justified+go+to+happiness+with+Christ%2C+and+the+souls+of+the+wicked+to+misery%3A+And+at+the+end+of+this+world+the+Lord+Jesus+Christ+will+come+again%2C+and+will+raise+the+bodies+of+all+men+from+the+dead%3B+and+will+judge+all+according+to+their+works%3B+And+the+righteous+shall+go+into+everlasting+life%2C+and+the+rest+into+everlasting+punishment%3A+All+this+I+do+unfeignedly+believe.+II.+Our+Consent+to+the+Gospel+Covenant%2C+with+God+the+Father%2C+Son+and+Holy+Ghost%2C+by+which+we+are+Christians+and+members+of+the+catholic+Church+Question%3A+Are+you+willing+and+resolved+to+give+up+yourself+to+God+the+Father%2C+Son+and+Holy+Ghost%2C+according+to+the+Gospel+doctrine+which+your+profess%3F+Repenting+of+my+sins+and+renouncing+the+flesh%2C+the+world+and+the+devil%2C+I+do+take+this+one+God+to+be+my+only+God%2C+and+do+heartily+give+up+myself+unto+Him%3B+even+to+the+Father%2C+as+my+Creator+and+reconciled+Father+in+Christ%3A+And+to+his+Son+Jesus+Christ%2C+as+my+Lord%2C+and+only+Savior%2C+to+reconcile+and+bring+me+unto+God%3A+And+to+the+Holy+Ghost+as+my+Sanctifier%3B+that+He+may+further+illuminate%2C+sanctify+and+confirm+me%2C+and+I+may+hold+fast+and+obey+the+doctrine+of+Christ%2C+which+was+revealed+by+his+inspiration%2C+and+witnessed+by+his+gifts+and+miracles%2C+and+is+now+contained+in+the+Holy+Scriptures%3B+and+that+he+may+be+in+me+the+earnest+of+my+everlasting+happiness+with+God.+III.+The+Sum+of+Christian+Duty+Question%3A+What+are+%5B%3F%3F%3F%E2%80%A6%5D+Christ+has+appointed+that+fit+men+shall+be+ordained+his+ministers%2C+to+preach+the+Gospel+to+the+nations+of+the+world%2C+and+make+them+his+disciples%2C+baptizing+them+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3A+and+to+congregate+his+disciples%2C+and+to+oversee+and+guide+the+several+congregations%2C+and+each+member+thereof%3A+particularly%2C+to+teach+them+the+Word+of+God%3B+to+pray+and+praise+God+with+them+and+for+them+to+administer+the+Lord%E2%80%99s+Supper+in+remembrance+of+Him%3B+especially+on+the+Lord%E2%80%99s+Day%2C+which+He+has+appointed+for+holy+communion+in+such+works%3A+Also+to+rebuke+with+authority+the+scandalous+and+unruly%3B+and+to+bind+and+reject+those+that+are+obstinately+impenitent%2C+and+unreformed%3B+and+to+absolve+and+restore+the+penitent%2C+and+confirm+the+weak.+It+is+therefore+the+people%E2%80%99s+duty+to+join+with+such+churches%2C+for+the+aforesaid+worship+of+God%3B+and+to+know%2C+hear%2C+submit+to%2C+and+obey+these+their+guides+that+are+over+them+in+the+Lord%3B+and+to+avoid+division+and+discord%2C+and+to+live+in+unity%2C+love+and+peace.+The+secret+duties+of+holiness+are+these%3A+The+exercise+of+faith%2C+repentance%2C+love%2C+hope%2C+delight+in+God%2C+and+all+other+graces%3B+The+mortifying+of+our+sins%3B+especially+atheism%2C+unbelief%2C+and+unholiness%3B+hardness+of+heart%2C+disobedience+and+unthankfulness%2C+flesh-pleasing%2C+covetousness%2C+and+pride%3B+The+diligent+examining+of+our+own+hearts%2C+about+our+estates%2C+our+duties%2C+and+our+sins%3A+meditating+upon+God%2C+and+his+Word+and+works%3B+especially+of+our+redemption+by+Jesus+Christ%3B+and+of+death%2C+Judgment%2C+heaven%2C+and+Hell%3B+watching+diligently+over+our+thoughts%2C+affections%2C+words+and+actions%3A+resisting+temptations%3A+And+frequent+and+fervent+prayer+to+God%2C+in+the+name+of+Christ%2C+with+confession%2C+thanksgiving%2C+and+cheerful+praises%3B+Parents+and+masters+must+diligently+teach+their+children+and+servants+the+Word+and+fear+of+God%2C+and+pray+with+them+and+for+them%2C+and+hinder+them+from+sin%2C+and+use+all+their+power+that+they+and+their+households+may+serve+the+Lord%3A+children+and+servants+must+willingly+learn+and+obey%3A+We+must+seek+instruction+in+the+matters+of+our+salvation%2C+especially+of+our+teachers%3A+we+must+take+heed+of+the+company+of+tempting+and+ungodly+persons%2C+and+delight+in+the+company+and+help+of+the+godly%3A+We+must+lovingly+and+faithfully+give%2C+and+thankfully+receive+admonitions+and+exhortations%3A+confessing+our+faults+one+to+another%3A+and+by+prayer%2C+psalms%2C+and+edifying+conference%2C+and+a+holy+conversation%2C+provoking+one+another+to+love%2C+and+to+good+works.+Superiors+must+rule+for+God+and+the+common+good%2C+with+justice+and+mercy%3A+Inferiors+must+honor+and+obey+them+in+the+Lord%3A+We+must+not+injure%2C+but+preserve+the+life%2C+chastity%2C+estate%2C+name%2C+and+rights+of+our+neighbor%3A+Not+seeking+our+own+against+his+welfare%2C+but+doing+as+we+would+be+done+by%3B+forbearing+and+forgiving%3B+and+loving+our+neighbor+as+ourselves%3A+Yea+loving+our+enemies%3B+and+doing+good+to+all+according+to+our+power.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Other+citations+%28work+not+named%29%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Profession+of+the+Christian+Religion.+See+the+original+for+the+Scripture+proofs.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a4aed3395.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a4aed3395.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=I.%20The%20Articles%20of%20the%20Christian,to%20all%20according%20to%20our%20power&amp;text=I.%20The%20Articles%20of%20the%20Christian%20Belief%20It&amp;text=doing%20good%20to%20all%20according%20to%20our%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We say, furthermore, that these Reformed Churches do not dissent in the fundamentals of faith. For although they may dissent in some chapters of Doctrine, we nevertheless deny any dissension in the fundamentals of faith… We are not saying here that they do not dissent in rites and ceremonies, for not every such dissension, either by its own nature severs, or ought to sever, the union of the Reformed Churches, especially since none of the Reformed Churches retains rites that are repugnant to the Gospel or introduced with an opinion of worship… Augustine, in Epistle 86, wrote no less skillfully than holily: “Let the garment of the Church be so varied by different observances that it is not torn apart by adverse contentions.”… Furthermore, it should also be added that we do not say that the Reformed Churches do not likewise dissent in the external mode of administering ecclesiastical polity or discipline… Nevertheless, we also contend that, this discrepancy being admitted, there is still no dissension in the fundamentals of faith. Indeed, such diversity in external polity can and ought to be tolerated without injury to or rupture of fraternal unity, especially since all the reformed Churches retain those things which are absolutely necessary, namely, the pure preaching of the Word of God, the due administration of the Sacraments, the ordination of pastors by public authority, and finally, the censure of morals. It is not on account of a difference in external form in these matters, where there is consensus in the fundamentals of faith, that the Reformed Churches should fight among themselves and reject all external ecclesiastical union. … The Foundation of Faith denotes… The primary object of faith, which is Christ the Savior… An epitome of this doctrine of the prophets and apostles [Eph. 2:20], containing in itself the sum of the Law and the Gospel, can be and is accustomed to be most conveniently reduced to four heads. So Augustine in the Enchiridion.

1. The Apostles’ Creed.

2. The Decalogue.

3. The Lord’s Prayer.

4. The doctrine of the sacraments. … But neither do we say they dissent in the very many secondary and tertiary articles, which since they are sufficiently proposed to, revealed to, and understood by all the Reformed Churches, are asserted with unanimous consent by them against the old heresies of the Marcionites, Manichaeans, Arians, Eunomians, Nestorians, Eutychians, and Monothelites, and against the new heresies of the Romanists. In a very few secondary articles not sufficiently proposed to all, or certainly not well enough weighed by them, and in some tertiary ones whose clear deduction from the primary is still hidden from some Churches, let there be dissent… Yet that does not impede the harmony of faith (ὁμονοίαν πίστεως) nor does it, or should it, break the ecclesiastical unity of the said Churches.</p></blockquote>

+reject+all+external+ecclesiastical+union.+%E2%80%A6+The+Foundation+of+Faith+denotes%E2%80%A6+The+primary+object+of+faith%2C+which+is+Christ+the+Savior%E2%80%A6+An+epitome+of+this+doctrine+of+the+prophets+and+apostles+%5BEph.+2%3A20%5D%2C+containing+in+itself+the+sum+of+the+Law+and+the+Gospel%2C+can+be+and+is+accustomed+to+be+most+conveniently+reduced+to+four+heads.+So+Augustine+in+the+Enchiridion.+1.+The+Apostles%E2%80%99+Creed.+2.+The+Decalogue.+3.+The+Lord%E2%80%99s+Prayer.+4.+The+doctrine+of+the+sacraments.+%E2%80%A6+But+neither+do+we+say+they+dissent+in+the+very+many+secondary+and+tertiary+articles%2C+which+since+they+are+sufficiently+proposed+to%2C+revealed+to%2C+and+understood+by+all+the+Reformed+Churches%2C+are+asserted+with+unanimous+consent+by+them+against+the+old+heresies+of+the+Marcionites%2C+Manichaeans%2C+Arians%2C+Eunomians%2C+Nestorians%2C+Eutychians%2C+and+Monothelites%2C+and+against+the+new+heresies+of+the+Romanists.+In+a+very+few+secondary+articles+not+sufficiently+proposed+to+all%2C+or+certainly+not+well+enough+weighed+by+them%2C+and+in+some+tertiary+ones+whose+clear+deduction+from+the+primary+is+still+hidden+from+some+Churches%2C+let+there+be+dissent%E2%80%A6+Yet+that+does+not+impede+the+harmony+of+faith+%28%E1%BD%81%CE%BC%CE%BF%CE%BD%CE%BF%CE%AF%CE%B1%CE%BD+%CF%80%CE%AF%CF%83%CF%84%CE%B5%CF%89%CF%82%29+nor+does+it%2C+or+should+it%2C+break+the+ecclesiastical+unity+of+the+said+Churches.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98The+Reformed+Churches+do+not+Dissent+in+the+Fundamentals+of+Faith%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%2C+%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+144-53%2C+pp.+145-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7665cff6b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7665cff6b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=We%20say%2C%20furthermore%2C%20that%20these%20Reformed,ecclesiastical%20unity%20of%20the%20said%20Churches&amp;text=We%20say%2C%20furthermore%2C%20that%20these%20Reformed%20Churches%20do&amp;text=break%20the%20ecclesiastical%20unity%20of%20the%20said%20Churches" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>

</figure><figure class="quote" id="q-a15ced2a13" data-kw="">
<blockquote><p>Mr. de Cluse in his prophesy [preaching amongst the Brownists] labored to prove separation from a true Church for any corruption, obstinately stood in this doctrine, was by another in prophesying there showed to be absolutely contrary to the place, Rev. 2:24; which how unsoundly it was concluded by our teacher was then observed by many… If these things be so, and be not redressed by the 〈◊〉 of this prophesy we must (according to Mr. de Cluse’s doctrine) make a new separation. How oft do the [Brownist] Brethren except one against another’s prophesying, by which, much heart-burning and strife is kindled between them? These things being well considered, I pray you well to mind whether this new way of prophesying on the Lord’s Day can be for the edification of the Church or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times</cite>, (London: Wilson, 1645), ‘Of the Brownists’ | 18. ‘Of their Prophesying’, pp. 63-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

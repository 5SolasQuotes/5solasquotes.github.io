<main class="wrap"><figure class="quote" id="q-1f15f34314" data-kw="">
<blockquote><p>The eternal Father willed and proposed, that his eternal Son, for accomplishing his design of mercy towards sinners of mankind, should, in the fulness of time, assume their nature, and so become man. He from eternity saw, that “sacrifice and offering,” could not answer the exigence; that the debt was too great to be discharged so easily; and, that the redemption of souls was too precious, to be either purchased, or conferred, by a person of less than infinite dignity.

Therefore, having, in his infinite sovereignty, purposed, that the glory of his attribute of mercy, should, in the salvation of lost sinners of mankind, be illustriously displayed; he proposed, that the human nature should, in the fulness of time, be united to the Divine nature, in the person of the adorable Son. He willed and proposed, that the eternal Word should be made flesh; that he should take to himself, a true body, and a reasonable soul; not—as a person, distinct from his own Divine person, but—only as a nature, assumed unto a subsistence in his person.

To this gracious proposal, the only begotten Son, the second person of the eternal Trinity, having as yet, no nearer relation to man, than that of his Creator and sovereign Lord, did with infinite readiness consent. He said to his eternal Father, ‘Sacrifice and offering thou wouldst not, but a body hast thou prepared me:— Then said I, Lo, I come (in the volume of the book it is written of me) to do thy will, O God.” The eternal Word, consented to be made flesh, that all flesh might not perish. He agreed to become man, that he might be as really the Son of man, and one of the family of Adam; as he was already the Son of God, and one of the family of Heaven. This, in Him, was an instance of astonishing condescension.

By his consenting to assume, as well as by his act of assuming, the human nature, he made himself of no reputation. He assumed it, with all its sinless infirmities; in a state of servile subjection to the law as a covenant, under the meanest appearance, the heaviest load of imputed sin, and all the infinite weight of the curse of the law. The highest Monarch’s consenting, to lay aside his royal robes, to clothe himself with rags, and to become the most abject of the sons of men; is not once to be compared to this. Nay, the highest angel’s consenting to become a worm, is not once to be named, in comparison of the eternal Son, the equal of the Father, consenting to become man: for, while the distance, between the nature of angels, and that of worms of the dust, is but finite; the distance, between the nature of the only begotten of the Father, and that of man, is infinite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 63-64.</span></figcaption>

<blockquote><p>4. The gospel holds forth the greatest example of self-denial that ever was in the world, and by all ways that ever God has made known his mind, He never has revealed his will in an example of self-denial so as He has done in the Gospel, and that is in the example of the Lord Jesus Christ: God evidences there such a work of self-denial as never was: and ’tis impossible to apprehend a greater example of self-denial than that is: though Christ thought it no robbery to be equal with God; read but the second of the Philippians, vv. 7-8, and there you may see what Christ was, and yet how He emptied Himself, how He denied Himself in his honor, how vile He was made in the world, though He was the brightness of his father’s glory, yet He was made of no reputation; how He denied Himself in riches. Christ that was the heir of all things, though He were rich, yet He was made poor for us; how He denied Himself in his pleasures, He was the delight of the Father from all eternity, and yet he was made a man of sorrows; He denied Himself in his life, for He was the Lord of life, and yet He subjected Himself to death, to a cursed death for us: Oh the example of Christ in self-denial is the greatest that ever was: and this seems to be one great end of the humiliation of Jesus Christ to hold forth a preaching pattern of self-denial to the world: And there’s a great deal more power in the pattern and example of self-denial, then in the commands of self-denial. I only present this to show you that it is the most unbeseeming the gospel for anyone that professes the gospel to be selfish, altogether scraping for themselves; and whatsoever service they are put upon, except self may have an oar in it, they have no mind to it; Oh ’tis becoming the gospel of Jesus Christ for men and women to be emptied of themselves, no matter what becomes of ourselves, but be willing to give up ourselves for public good, to venture your estates and lives, and all your comforts, yea to be swallowed up in the glory of God, to be nothing, that Christ may be all. In the gospel of Christ, we find that Christ, He was swallowed up with the glory of his Father; and He came not to do his own will, but the will of his father that sent Him; and though He was one that had infinitely more excellency than all men and angels in heaven and earth, yet He was content for the honor of his Father to be made as a worm and no man, to be trampled under foot, to endure the greatest extremities of all sorts; this holds out an example to us, that while we live in this world we should be taken off from ourselves: Oh this self-love sticks much in the hearts of men and women: now upon the example of Christ’s self-denial, we are required to deny ourselves, and it is the proper lesson of the Gospel, ‘He that will follow me, let him deny himself,’ you never read of such a precept in all the Old Testament;(though no question the people of God did deny themselves then), but in expresse terms so fully you have not such a thing there: and there’s no such rules among the heathens for a man to deny himself. ‘Let him deny himself;’ those that know the original, know that the word is, not only to deny, but there is that joined to it that does increase the signification, let them deny themselves, thoroughly, there is a preposition put to the word, to show that those that will come to Christ must deny themselves, and that thoroughly, it is a proper lesson of the gospel, and the first lesson. Oh when our Lord and Master has thus denied Himself, and emptied Himself for good to us, what is beseeming this gospel, but that all that are professors of it should deny themselves? It is very unbeseeming the glorious gospel, for a Christian to be selfish, to have his self-ends, and self-ways, and interests in everything, as generally almost all men in the world they are acted by self, some self-ends, or self-excellency carries them on in their actions, or else they have no heart to do anything; this is unbecoming the gospel. But now I say, one that would live as becomes the Gospel, must be wholly emptied of himself, whatsoever parts, estate, credit, or honor he has in the world, must be melted into the glory of God; Jesus Christ for the glory of His Father, was content infinitly to deny Himself more than we can; For what have we to deny ourselves of? Do you or I live as becomes the gospel? when (I say) all that we apprehend to have any excellency in, we have it all swallowed up in the glory of God, when we can dedicate and consecrate our lives, honors, liberties, estates, comforts, and all to the glory of God, and be as nothing to ourselves, and let God be all in all to us. Ministers may bring many reasons why we should deny ourselves, but all these reasons comes to nothing, till the soul comes to behold the clear light of the gospel, and there beholds the Son of God by faith, how He did empty Himself; nay then, says a believing soul, if the Son of God did deny Himself, was emptied thus for me, Oh then let me be wholly taken off from myself, and venture wholly upon God, I must not live in myself, nor live for myself, nor live to myself; but wholly live in God, and for God, and to God, and upon God: Oh this is that which becomes the gospel of Jesus Christ.</p></blockquote>

<blockquote><p>This Son of God, a distinct Person, but the same in substance with the Father, being the middle person betwixt the Father and the Spirit, undertakes to be Mediator betwixt God and man; by him the world was made, and by him therefore it was fitting it should be redeemed; which notwithstanding, could not have been done by him, unless he became the Son of man in time, as well as he had been the Son of God from eternity. Hereupon he took man’s nature; he that had the nature of God communicated to him, hath the nature of man assumed by him.

Not as if the Divine nature was converted into or confounded with the human, but only the human nature is assumed into the Divine, so as to become perfectly man like unto us in all things, our sinful infirmities only excepted, in time, as he had been perfectly God, like to the Father in all things, his personal properties only excepted, from eternity. And therefore man having two essential constitutive parts, a soul and a body, Christ in his assuming of the human nature was invested with both, yea, and the natural infirmities of both too; he had a soul as well as we, he had a body as well as we, and he had his soul and body united together as well as we, and so was hungry and thirsty and weary and sorrowful, as we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 77-78.</span></figcaption>

<blockquote><p>It is the love of a Divine Person in human nature. The body which was prepared for him was animated, not by his divine nature, but by a human soul, and in this body he was to make his love effectual by means of all the inward affections, as well as external actions which were peculiar and proper to it. His human nature was furnished immeasurably with all grace, and especially with love, pity, and compassion to fallen and lost men.

There was a universal love, or benevolence, exerted in doing good to all within his reach, and in loving and forgiving his enemies, which was the soul of his obedience, and the fulfilling of the law. But there was also in his human soul a peculiar love to those who were given him by the Father, which exerted itself in strong, fervent, and irrepressible desires for their salvation, and which urged him on, and gave him no rest, until he had completed it by “giving himself an offering and a sacrifice of a sweet-smelling savour to God.” “I have a baptism to be baptized with, and how am I straitened till it be accomplished.” “With desire have I desired to eat this passover with you before I suffer.”

So strong did the manifestations of this desire become as the hour of its consummation approached, that the disciples, and especially those that were with him in the garden, might have said, in the language of Naomi, “The man will not be in rest, until he have finished the thing this day.” Now, in meditating on the love of Christ, we are not to confine our thoughts to the eternal actings of his divine nature (for all the acts of his love, as God, must be eternal), but are to take into view also its temporal acting in the human nature.

In undertaking our cause from everlasting, and in becoming man, the love of the divine nature only was displayed; but subsequently to the incarnation there was a concurrence of the two natures in the expression of love, and though the acts of love in these two natures were infinitely distinct, yet, in virtue of the hypostatical union, they were acts of one and the same person. If the bodily actions of Christ were the acts of his divine person, surely his mental acts were so also; if the act of laying down his life, so also the cheerfulness and delight with which he made the sacrifice, from regard to his Father’s glory, and from love to sinners. “God purchased the Church with his own blood.</p></blockquote>

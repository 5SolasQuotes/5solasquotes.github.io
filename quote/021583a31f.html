<main class="wrap"><figure class="quote" id="q-021583a31f" data-kw="">
<blockquote><p>Let your theologians [O Stapleton] dispute as much as they will that it is the least of all sins, and less than any venial one: what else do they reveal to all but their singular ignorance? If it is so minimal that it ought to be considered less than even any venial sin, then it cannot even be a sin, because what is less than venial is not to be placed among sins, since no sin is less than venial. Do you think Thomas felt this, when he writes that original sin is greater extensively than actual sin, but intensively less, because the actual has more of the nature of the voluntary (Thomas, in pt. 1 of 2, q. 82, art. 2)? If that reason does not deceive, they did rightly who placed it below any venial sin whatsoever, since in the slightest sin there is more of the voluntary than in the original, unless we are understood to have willed in Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XIV. Although the philosopher may be allowed to begin with a doubt in order to a safer investigation of natural things, yet this cannot be introduced into subjected of theology and faith. They are founded upon certain and indubitable principles and truths known per se, to doubt concerning which is impious (as concerning the existence of God) unless we wish to strip ourselves of conscience and the moral dependence on the Creator (which cannot be shaken off or for a moment rejected without crime) and thus to introduce philosophical doubt (epochen) into religion and render the whole of theology sceptical.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-cd272d7124" data-kw="">
<blockquote><p>…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, ch. 11, ‘The Form of the Body’ in Immortal Souls: a Treatise on Human Nature Ref (Editiones Scholastica, 2024), pp. 493-523 See especially, ‘Hylemorphic Dualism’, pp. 505-10., p. 508</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>§1. We have laid out the concept of the natural knowledge of God based on the mainstream orthodox view. What is left is to demonstrate the wider agreement on this by quoting different authors… These authors do not just generally affirm this natural knowledge of God, but also distinctly break it down into parts or species which they explain: the innate or implanted or subjective type; and the acquired or added or objective or discursive or demonstrative type, derived a posteriori from observing effects.</p></blockquote>

</figure><figure class="quote" id="q-a4aa7a3398" data-kw="">
<blockquote><p>I constantly keep exactly the same order of books, treatises, disputations, chapters, and sections which the author, Father Suárez, observed, so that, if anyone should at times wish to inspect or weigh more fully some subject that has been proposed, he may at once be able to ﬁnd it in the very archetype without any diﬃculty or toil. Sometimes, however, for the sake of brevity, I have gathered into a single heading certain chapters of his which were divided, but have a great mutual connexion; yet not even thus is the ease of ﬁnding the matter desired taken away, since I always retain the original order of the subject-matter. Further, if sometimes from the title the sense of the question does not suﬃciently appear, I preﬁx a brief explanation of it, and, when needful, I set out the whole question for clearer understanding by a successive series of cardinal numbers, saying 1, 2, 3, etc., as Father Suárez himself also more frequently is wont to set things forth. Next, because he oﬅen preﬁxes to his own position the diverse opinions of authors or the heresies, I likewise indicate these at the outset along with his own, and at the end I resolve in a body their arguments or objections. Yet do not expect, dear reader, that all and each of the original’s proofs and refutations—especially those drawn from authority—could have been included in so narrow a compendium; I have excerpted only those more necessary, suitable, and eﬀective, for the most part merely indicating the rest in general. Moreover, I have always striven, as brieﬂy as I could, to embrace his whole line of argument and meaning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-noel.html">Francis Noel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendium of R.P. Fancisco Suarez</cite>, tr. AI (Madrid: 1732; Paris: Migne, 1858) More detailed tables of contents are at the front of each volume. | Preface by Noel:</span></figcaption>

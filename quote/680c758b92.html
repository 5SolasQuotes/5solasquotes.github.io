</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2234423053" data-kw="">
<blockquote><p>…that arrangement which takes away all confusion, barbarity, obstinacy, turbulence, and dissension. There are examples of the first sort in Paul: that profane drinking bouts should not be mingled with the sacred supper of the Lord (1 Cor. 11:21-22), and that women should not go out in public with uncovered heads (1 Cor. 11:5). And we have many others in daily use, such as: that we pray with knees bent and head bare… [Calvin implicitly distinguishes that female covering in Paul’s time was a normal social propriety for appearing in public. Greek and Roman men on the other hand, went uncovered in public. In Reformation Geneva, men normally wore hats in public, but then uncovered for prayer.] But because He did not will in outward discipline and ceremonies what we ought to do (because He foresaw that this depended upon the state of the times, and He did not deem one form suitable for all ages), here we must take refuge in those general rules which He has given, that whatever the necessity if the church will require for order and decorum should be tested against these… Lastly, because He has taught nothing specifically, and because these things are not necessary to salvation, and for the upbuilding of the church ought to be variously accommodated to the customs of each nation and age, it will be fitting (as the advantage of the church will require) to change and abrogate traditional practices and to establish new ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (Westminster Press), bk. 4, ch. 10, sections 29-30, pp. 1207-8</span></figcaption>

<blockquote><p>Three things about the worship of God are to be considered:

1. The kinds of it…

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-18487bdd66" data-kw="">
<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints Happiness</cite>, … (London: M.S., 1660), pp. 15-16</span></figcaption>

</figure><figure class="quote" id="q-aaa70fed60" data-kw="">
<blockquote><p>Wherefore let it be set down that it is lawful for the Church to make to itself either canons or laws, or decrees, or statutes, or call them by what name thou wilt. For the Church is a company, and must be ruled by the Word of God, especially because it belongs to the salvation thereof, and to the worshiping of God. But there be other things which belong only unto outward discipline. For there is need of certain outward bonds, to the end that the fellowship of the people may be retained. So the apostle decreed that women ought to pray with the head covered, and men uncovered. And the apostles in the Acts, decreed that we should abstain from blood, from strangled, and from things dedicated unto idols. And always in councils after they had done with doctrine, they began to entreat of discipline. Finally so did all the fathers as Tertullian, Origen, Basil, Augustine and Jerome. The end of these laws must be edifying and good order. But for so much as they be not of necessity, they may be changed according to the times and places.</p></blockquote>

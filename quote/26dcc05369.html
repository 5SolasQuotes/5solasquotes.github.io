<main class="wrap"><figure class="quote" id="q-26dcc05369" data-kw="">
<blockquote><p>The second duty is obedience, to be performed by all persons, and in all things possible (the contrary whereof God commands not), though hard and unequal… and this obedience must be to all governors, to the king as superior, and to the rest appointed by him, and to these, whether Christian or heathen, good or bad, merciful or cruel, for there is no power but of God (Rom. 13:1). The third is piety, that subjects pray for their governors, yea though they were infidels, or wicked: Thus did Daniel, thus did the ancient Christians for the heathen emperors, for their long life and safety… … Use 2. Hence it appears that the Pope with his limbs are the great rebels of the world; for not only pulling their necks as ecclesiastical persons from the yoke of the emperor and their sons’ reigns, but especially for seeking to overrule, depose and destroy the kings and kingdoms of the earth. Use 3. Learn they duty. Thy calling is to be subject… Pay all subsidies, tares, customs, etc…. and surely, if we must willingly pay to a heathen, much more to a Christian, religious, merciful, and renowned king.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Divinity Plainly Discovering the Mysteries of Christian Religion</cite>, … (London, 1615), pp. 361-4. Parr (d. 1632?) was a reformed Anglican.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87f1be735e" data-kw="">
<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Scandal</cite>, On how Circa Sacra flows out of the 4th Commandment: | The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal… (1659), pt. 3, ch. 13, pp. 241-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-1d7699be7b" data-kw="">
<blockquote><p>1st Assertion: The magistrate as the magistrate is to procure that there be preachers and Church-officers to dispense Word, sacraments and discipline, for: 1. His end is, that people under him may lead a quiet and a peaceable life in godliness and honesty, 1 Tim. 2:2. And the Magistrate attains his end as a Magistrate, if there be simple exercise of religion in the quiet and peaceable way, that may consist with the subjects indemnity, and immunity, from rapine, injuries, and violence. … 4th Assertion. The magistrate de jure is obliged not only to permit, but also to procure the free exercise of the ministry in dispensing Word, sacraments and discipline, and owe his accumulative power, to convene synods, to add his sanction to the lawful and necessary constitutions and ordination of worthy, and to the deposition of unworthy officers in the Church, because: 1. He is a nurse-father in the Church, Isa. 49:23. 2. And by office, as a public father, to procure the good of the souls of the subjects in his coactive [coercive] way, that we may lead a quiet and peaceable life in all godliness and honesty, 1 Tim. 2:2. 3. He is not only to permit, but also positively to procure all peace, in the exercise of all lawful and profitable trades and arts; therefore, far more that glory may dwell in the land, and that the peace thereof may be as a river, Isa. 48:18, by the presence of Christ walking in the midst of the golden candlesticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 24, pp. 543 &amp; 552</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-c60425a24e" data-kw="">
<blockquote><p>Also, in the Queries Touching the Ordination of Ministers [1647], written in opposition to the learned and much-approved book entitled Jus Divinum Regiminis Ecclesiastici [The Divine-Right of Church Government], the same controversy is touched upon frequently with more railing than reason by that furious Erastian [William Aspinwall, †1662] who composed the Grallae [Stilts] against [Willem] Apollnius [1602-1657]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions n.d</cite>, ch. 3, ‘Whether Ordination be Essential to the Calling of a Minister?’ 9, pp. pp. 14-23</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8d1426d071" data-kw="">
<blockquote><p>And from our own [reformed] writers [on regeneration]: the treatise of William Whately on regeneration; the sermon of Obadiah Sedgwick on Rev. 3:1-3; Nicolas Byfield’s Principia Fidei [Principles of Faith], ch. 25; the various opuscula [small works] of Paul Baynes; Thomas Hooker on the humiliation of the soul, on the preparation of the soul for Christ, on the union of the soul with Christ, etc.; and writers on the practice of repentance: Perkins, Stock, Daniel Dyke, Arthur Dent… They are to be read, however, with this judgment: that one aim at the distinctions hitherto brought by us, and consider that the concepts of the practical writers—if not all, at least most—are to be referred to the second moment of regeneration and to actual conversion, whether first or renewed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“And from our own [reformed] writers [on regeneration]: the treatise of William Whately on regeneration; the sermon of Obadiah Sedgwick on Rev. 3:1-3; Nicolas Byfield’s Principia Fidei [Principles of Faith], ch. 25; the various opuscula [small works] of Paul Baynes; Thomas Hooker on the humiliation of the soul, on the preparation of the soul for Christ, on the union of the soul with Christ, etc.; and writers on the practice of repentance: Perkins, Stock, Daniel Dyke, Arthur Dent… They are to be read, however, with this judgment: that one aim at the distinctions hitherto brought by us, and consider that the concepts of the practical writers—if not all, at least most—are to be referred to the second moment of regeneration and to actual conversion, whether first or renewed.”

— Gisbertus Voetius, XI. ‘Appendix concerning the Second Moment of Conversion’ in Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+from+our+own+%5Breformed%5D+writers+%5Bon+regeneration%5D%3A+the+treatise+of+William+Whately+on+regeneration%3B+the+sermon+of+Obadiah+Sedgwick+on+Rev.+3%3A1-3%3B+Nicolas+Byfield%E2%80%99s+Principia+Fidei+%5BPrinciples+of+Faith%5D%2C+ch.+25%3B+the+various+opuscula+%5Bsmall+works%5D+of+Paul+Baynes%3B+Thomas+Hooker+on+the+humiliation+of+the+soul%2C+on+the+preparation+of+the+soul+for+Christ%2C+on+the+union+of+the+soul+with+Christ%2C+etc.%3B+and+writers+on+the+practice+of+repentance%3A+Perkins%2C+Stock%2C+Daniel+Dyke%2C+Arthur+Dent%E2%80%A6+They+are+to+be+read%2C+however%2C+with+this+judgment%3A+that+one+aim+at+the+distinctions+hitherto+brought+by+us%2C+and+consider+that+the+concepts+of+the+practical+writers%E2%80%94if+not+all%2C+at+least+most%E2%80%94are+to+be+referred+to+the+second+moment+of+regeneration+and+to+actual+conversion%2C+whether+first+or+renewed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+XI.+%E2%80%98Appendix+concerning+the+Second+Moment+of+Conversion%E2%80%99+in+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d1426d071.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8d1426d071.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=And%20from%20our%20own%20%5Breformed%5D%20writers,actual%20conversion%2C%20whether%20first%20or%20renewed&amp;text=And%20from%20our%20own%20%5Breformed%5D%20writers%20%5Bon%20regeneration&amp;text=and%20to%20actual%20conversion%2C%20whether%20first%20or%20renewed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36f049e9bf" data-kw="">

<blockquote><p>Those places of Scripture which are alleged [Dt. 10:16; Jer. 4:4; Eze. 18:31; Rom. 12:2; Joel 2:13; Mt. 4:17] speak not of regeneration strictly so called, by which God infuses the first principle of life, but of conversion, wherein He brings forth the life already bestowed into actual exercise.</p></blockquote>

</figure><figure class="quote" id="q-1125fa090f" data-kw="">
<blockquote><p>Regeneration is a benefit of God, by which our corrupted nature is renewed to the image of God by the Holy Spirit, 2 Pet. 1:4; Tit. 3:5; Gal. 4:6; 2 Cor. 3:7. That same is also called sanctification, and the gift of grace. Rom. 5. Also of schoolemen it is called an infused grace. Regeneration is either begun, or perfected: the former belongs to this life, the latter to the life to come… Regeneration of the soul is that whereby the powers of the soul are renewed. Tit. 3:5; Gal. 4:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, … (London, 1595), ‘Regeneration’, pp. 94-95</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-78167023f5" data-kw="Mary">
<blockquote><p>Which is said not through ignorance or contempt, but either, as displeased with the interruption given him; or with a view to take an opportunity from hence of expressing his superior value to his spiritual relations; which looks with no favourable aspect on the superstitious notions, and veneration of the virgin Mary among the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Entire Bible</cite>, Mark 3:33</span></figcaption>

</figure><figure class="quote" id="q-b26669486a" data-kw="Mary">
<blockquote><p>As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, Mark 3:31-35</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.”

</figure><figure class="quote" id="q-fecc17f84e" data-kw="Mary|Mediator|Invocation of saints|Idolatry">
<blockquote><p>It may be added also that the doctrine of the Papists that the saints or the Virgin Mary may act as mediators to procure blessings for us, is false. There is but &quot;one Mediator;&quot; and but one is necessary. Prayer offered to the &quot;saints,&quot; or to the &quot;Virgin,&quot; is idolatry, and at the same time removes the one great Mediator from the office which he alone holds, of making intercession with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/albert-barnes.html">Albert Barnes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on the Bible</cite>, 1 Timothy 2:5</span></figcaption>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary|Queen of Heaven|Mediator">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7a006bceb9" data-kw="">
<blockquote><p>Some hold that the name HOLY SPIRIT refers exclusively to His office in man’s salvation. But it is necessary to distinguish when truth and error are confusedly put together. The designation SPIRIT OF GOD is the distinctive name of the third person of the Godhead, denoting a divine subsistent, with intelligence and will, proceeding from another. The epithet HOLY, frequently conjoined with the term SPIRIT, gives us a nearer view of the Spirit’s SPECIAL WORK in connection with man’s salvation, and suggests an antithesis to every unholy spirit, whether human or Satanic. The procession of the Spirit is spoken of by our Lord in connection with a reference to the covenant of grace, and doubtless the reason is to show that the natural order in the Godhead is also the order in the execution of the covenant of grace.

Had we no other word of Scripture through which to think on this matter, the single title “THE SPIRIT of GOD” shows the relation of two Persons, the one proceeding from the other, just as the title “the Son of God” proves the eternal Sonship. He is called — (1) the Spirit of the Lord (Isa. 11.2); (2) the Spirit of God (Rom. 8.9); (3) the Spirit that proceedeth from the Father (John 15.26); (4) the Spirit of His Son (Gal. 4.6); and we should grievously err if we believed that these phrases have no significance. We ascribe no such procession to Him as is in any way associated with the idea of imperfection. We acknowledge, however, something fitly represented by the analogy of respiration, for it would be irreverence to imagine that there is no analogy in the terms employed.

The more the matter is discussed, the more is Scripture found to warrant the position that, in the scheme of grace, the acts of the Persons of the Trinity are found to be according to their order of subsistence in the Godhead, and are but the visible manifestation of that order in the divine essence. The Spirit could not be called the Spirit of the Father, or the Spirit of Him who raised up Christ from the dead (Rom. 8.11), unless He proceeded from the Father. He could not be called the Spirit of His Son (Gal. 4.6), or the Spirit of Christ (Rom. 8.9), because He replenished the humanity of Jesus.

Nor does it appear how the Spirit could be sent by Him except upon the footing of that procession by which He is the Spirit of the Son as well as the Spirit of the Father, and which is eternally continued without a past and without a future. The question is important in every respect, because it lies at the foundation of the MISSION OF THE COMFORTER. And as to its practical results, Church history informs us that it is in the last degree calamitous to ignore it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 105-06.</span></figcaption>

</figure><figure class="quote" id="q-3feb3b91bf" data-kw="autotheos aseity Son">
<blockquote><p>Although the Son is from the Father, nevertheless he may be called God-of-himself (autotheos), not with respect to his person, but essence; not relatively as Son (for thus he is from the Father), but absolutely as God inasmuch as he has the divine essence existing from itself and not divided or produced from another essence (but not as having that essence from himself). So the Son is God from himself although not the Son from himself.</p></blockquote>

</figure><figure class="quote" id="q-059b4916c5" data-kw="essence persons">
<blockquote><p>We assert that the essence is one in the three persons, not as a whole in parts, since each person possesses the entire essence. Nor is it like a genus in species, as the persons are not species but individuals. Nor is it like a species in individuals, as the essence itself is singular in number and cannot be divided into multiple essences. Rather, the whole essence is present in each person in a peculiar manner that we cannot fully express with words or comprehend with thought.</p></blockquote>

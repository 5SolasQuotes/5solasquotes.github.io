<main class="wrap"><figure class="quote" id="q-1fa2e2b5f2" data-kw="">
<blockquote><p>‘The Lord is well pleased.’… This passage is interpreted in various ways. Some render it, “The Lord has so willed it;” others, “He is merciful;” but, for my own part, I have translated it, “The Lord is willing,” that is, disposed and inclined to deliver his people, and that for the purpose of magnifying his Law and extolling his righteousness. Thus God assigns the reason why He is ready to aid those who are unworthy, that He wishes to spread his glory in their salvation, that in this manner his righteousness may be illustriously displayed, and that his Law may prevail and flourish. As to the heavy calamities that have come on the Jews, the reason is, that of their own accord they have resolved to be blind, and to bring afflictions on themselves, instead of obeying God; for otherwise the Lord would have wished to enrich and exalt them…. Others render it, “For his righteous one,” and refer it to Christ; but they mistake the meaning of the word צדקו, (tzidko) and unquestionably He speaks of righteousness, and means that the Lord would willingly have displayed the magnificence of his promises: and would have given proofs of his righteousness in preserving his people, if they had not shown themselves to be ungrateful and unworthy. Some think that the Lord here offers an excuse for Himself, because, when the people whom He had adopted were exposed to so many evils, it appeared as if his truth were shaken, and that the prophet intended to meet this calumny, for they were seized and became a prey, not because the Lord delights in their miseries, but because He prefers his righteousness to everything else. For my own part, I explain it simply to mean, “The Lord, for the sake of doing honor to his Law, was inclined to do good to his people, in order that his glory and righteousness might shine forth in it; but his people showed themselves to be unworthy of so great a favor; and, therefore, by their own obduracy they made their wounds incurable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah 42, verse 21, “The Lord is well pleased for his righteousness’ sake; he will magnify the law, and make it honourable.”</cite></span></figcaption>

<blockquote><p>III Proposition: In asking any spiritual gift we are encouraged by the bounty and mercy of God [as in Ps. 119:64]. David signifies both: 1. His bounty or benignity, or that free inclination which is in God to do good to his creatures. 2. His mercy respects the creature as affected with any misery. Mercy properly is a proneness to succour and relieve a man in misery notwithstanding sin. Now the larger thoughts of mercy, the more hope, partly because we have no plea of merit and therefore mercy is the fountain of all the good which comes to us from God.</p></blockquote>

<blockquote><p>(Verse. 31) ‘He forsakes not forever.’… Moreover, this is most sure, that the nature of God is such as that He delights not in our afflictions, being Himself naturally good, gentle, slow to anger and of great compassion. Thus we see how God is described unto us throughout the whole volume of the scripture, namely, in the 34th chapter of Exodus, insomuch that whenas Isaiah in his 28th chapter says He punishes and afflicts us, it seems rather that He deals like a stranger, and not like Himself. And namely, in the midst of all our afflictions, He makes his singular goodness always appear in the moderating of our punishments, turning them all to our benefit and welfare. And according hereunto, most notably wrote Saint Augustine in his epistles to Felix and Rusticus, saying, What is it that our good God will not mercifully do unto man? And how can it be but that He will show him all the favor He can, considering that all the tribulations which He sends are more benefits…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lamentations &amp; Holy Mournings of the Prophet Jeremiah… (London: Windet, 1587), ch. 3</cite>, p. 131-32</span></figcaption>

<blockquote><p>God in this attribute of mercy is infinite and incomprehensible. He is in this as in other attributes; indeed He is God. Heaps of places I might bring in; the Bible abounds with passages of the merciful inclination of God: Ex. 34:6-7, ‘The Lord God merciful and gracious, etc.’ And again, ‘Keeping mercy for thousands.’ Dt. 5:10, ‘And showing mercy unto thousands.’ Ps. 36:5, ‘Thy mercy O Lord is in the heavens,’ or unto the heavens. So that we need not ask as Esau did of Jacob his father about a blessing, ‘Hast thou but one blessing my father?’ (Gen. 27:38) So hast Thou but one mercy, O God? For come there never so many, there is mercy for all. The bottomless ocean of God’s mercy can never possibly be drawn dry by the creature. Many admirable sayings have we touching God’s mercy: First, God inclines to it; it comes naturally from Him: not as waters out of the pump, but as showers from heaven. Tis but ‘open our mouths’ and God will fill them [Ps. 95]. Yea secondly (to use the words of a painful and learned writer; [John] Downame’s Christian Warfare, bk. 2, ch. 34, sect. 4, p. 204), ‘It is not only not troublesome and painful’ (to wit because it is natural to God to show mercy) ‘but also pleasant and delightful for God to show mercy, etc.’ And a little after: ‘And contrariwise it should be troublesome and irksome, if I may so speak‘ (says mine author) ‘for God not to show and exercise his nature and mercy, etc.’ And once more: ‘For as the eye is delighted with seeing, and to be restrained therefrom is grievous unto it, as the ear is delighted with hearing and is much molested if it be stopped; and as every part and faculty of the body and soul are delighted in exercising their several actions and functions and are much vexed and cumbered if by any means they should be hindered, so is the Lord delighted and well pleased in showing and exercising his own nature and attributes.’ God weeps when He strikes, but smiles when He strokes. It does his heart good (as we use to say of men). Certainly God will not be barred of his pleasure; He rejoices much to have an occasion offered of exercising his mercy. Ps. 147:11, David says that, ‘the Lord is delighted in them that fear Him and attend upon his mercy.’ When men wait for mercy, God is delighted to exercise it towards them. Judicious Mr. [Joseph] Caryl, ‘To show mercy pleases Him more than it relieves us.’ Thirdly, God is said ‘to multiply’ to show mercy. Single acts of mercy cannot give Him content: He shows mercies by thousands, unto thousands of his people. Fourthly, ye have an expression, Isa. 30:18, ‘And therefore will He be exalted that He may have mercy upon you.’ But what do I speak of that which is infinite and incomprehensible? Sooner can we number the stars of heaven, drops of the ocean, sands on the shore, yea atoms in the sun, than give you a true account of the mercies of this most merciful God. What is a drop to the ocean? (Quantum scintilla ad mare se habet, tantum hominis malitia ad Dei clementiam imo vero non tantum; [As much as a spark is to the sea, so much is man’s wickedness to God’s clemency; indeed, not even so much.] Chrysostom) And what are our sins to the mercies of God. Infiniteness cannot be limited. God’s thoughts of mercy are exalted above the thoughts of our unworthiness far higher than the heavens are exalted above the earth. Mercy is as it were God’s fetching of breath. His infinite and incomprehensible goodness does in a sort wholly live in works of mercy; For all the world are object of God’s mercy since Adam’s fall: ‘For all have sinned, and have come short of the glory of God.’ That famous man, Jerome Zanchi has notable stuff about this matter. I will take notice but of one passage, upon Ex. 34:6-7, where it is said that God is slow to anger. He writes (On the Attributes, bk. 2, ch. 1, quest. 2): ‘And therefore we must note, although anger be attributed unto God, it is in God nothing else but the chief goodness and justice whereby He abhors evil, and according to his just judgment, does at length punish it if it be not amended by his longsuffering and patience. This here hence appears evidently speaking of revenge, which is an effect of anger; He does not say that He does presently inflict punishment, or that He is so ready to inflict it as to show mercy: but He says that He ‘is slow to anger,’ etc.’ And upon the 28th of Isa. 21, where the words are: ‘For the Lord shall rise up as in mount Perahim; He shall be wrath as in the valley of Gibeon, that He may do his work, his strange work, and bring to pass his acts, his strange act.’ ‘The prophet’ (says Zanchi): ‘makes two sorts of God’s works: his proper and strange works. The proper work of God is to show mercy and to spare or forgive; his strange work is to be angry and to punish.’ So far he. I have been somewhat long about this quotation. The weight lies upon this, that mercy in God is his nature, and therefore infinite; it is the very life of God, his drawing of breath in his proper works. Mercy, goodness, longsuffering are according to the nature of the Deity, which is far remote from all unjust severity, cruelty, tyranny and pride. All providences have mercy in them. Tis of the infinite mercy of God that the world is borne up, which would else sink into its first: nothing. It is mercy [that] respites the damnation of wicked men and saves the elect; yea, behold I tell you a mystery, mercies bring calamities: 1 Cor. 11:32, ‘But when we are judged we are chastened of the Lord that we should not be condemned with the world.’ O let me draw breath a little! Consider what unexpected, even incredible mercies God sometimes breathes out. Even when He seems to breathe out smoke and flames, yet He is angry that He may bring his work to pass, that is to say, his proper work; that is, that he may have mercy and preserve. The Devil, he breathes out deaths, miseries and mischiefs, but God loads us with mercies, and (as I said) the attribute of goodness sets God on work to put Himself out in endless mercies and tender bowels beyond what man or angel can possibly imagine.</p></blockquote>

e+Deity%2C+which+is+far+remote+from+all+unjust+severity%2C+cruelty%2C+tyranny+and+pride.+All+providences+have+mercy+in+them.+Tis+of+the+infinite+mercy+of+God+that+the+world+is+borne+up%2C+which+would+else+sink+into+its+first%3A+nothing.+It+is+mercy+%5Bthat%5D+respites+the+damnation+of+wicked+men+and+saves+the+elect%3B+yea%2C+behold+I+tell+you+a+mystery%2C+mercies+bring+calamities%3A+1+Cor.+11%3A32%2C+%E2%80%98But+when+we+are+judged+we+are+chastened+of+the+Lord+that+we+should+not+be+condemned+with+the+world.%E2%80%99+O+let+me+draw+breath+a+little%21+Consider+what+unexpected%2C+even+incredible+mercies+God+sometimes+breathes+out.+Even+when+He+seems+to+breathe+out+smoke+and+flames%2C+yet+He+is+angry+that+He+may+bring+his+work+to+pass%2C+that+is+to+say%2C+his+proper+work%3B+that+is%2C+that+he+may+have+mercy+and+preserve.+The+Devil%2C+he+breathes+out+deaths%2C+miseries+and+mischiefs%2C+but+God+loads+us+with+mercies%2C+and+%28as+I+said%29+the+attribute+of+goodness+sets+God+on+work+to+put+Himself+out+in+endless+mercies+and+tender+bowels+beyond+what+man+or+angel+can+possibly+imagine.%E2%80%9D%0A%0A%E2%80%94+Thomas+Larkham%2C+The+Attributes+of+God+Unfolded+%26+Applied...+%28London%3A+Eglesfield%2C+1656%29+Larkham+%281602%E2%80%931669%29+was+an+English+puritan+clergyman+and+settler+in+New+England.%2C+pp.+131-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F900923f427.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/900923f427.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=God%20in%20this%20attribute%20of%20mercy,man%20or%20angel%20can%20possibly%20imagine&amp;text=God%20in%20this%20attribute%20of%20mercy%20is%20infinite&amp;text=beyond%20what%20man%20or%20angel%20can%20possibly%20imagine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

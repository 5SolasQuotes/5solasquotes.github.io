<blockquote><p>‘He that shows mercy, let him do it with cheerfulness.’ And this seems to have been the office of widows and of old men, which were to that end maintained by the Church, that they should take care of strangers and of them that were sick. For good cause he commands these to have cheerfulness. For men that be weak and afflicted, are much relieved if they see their necessities are ministered unto with cheerfulness… Thus much spake Paul concerning the public ministries of the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (London, 1583), pt. 4, ch.1, ‘Of Diverse Ministries of the Church’, p. 8 on Rom. 12:8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5708a3112a" data-kw="">
<blockquote><p>VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief</cite>, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-90f7c75b47" data-kw="">
<blockquote><p>2. We see also that though ministers are virtually both elders and deacons (as the apostles were), yet ought they to regulate their exercising of both these with respect to the former two. And, 3. that elders and deacons ought in governing and overseeing the poor to have special respect to keep ministers from being burdened or toiled with these, that they may have freedom to follow the ministry of the Word as the main thing: Yea, even to have much access to privacy and solitariness, which is both most necessary for and a well becoming duty to a minister; This is a special end of the appointment of these officers, and in reference to which they are helps, 1 Cor. 12:28, both to the people and to the ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659), pt. 2, ch. 2, p. 70</span></figcaption>

</figure><figure class="quote" id="q-acd0b817f0" data-kw="">
<blockquote><p>Nor are women, sons, servants, debarred from voicing in election because it is a Church-power, for it is no power of jurisdiction. For: 1. Their tacit [understood or implied without being stated] voices and consents are not excluded, because they must try the spirits, and not upon trust and fide implicita [implicit faith] believe every teacher more than men, or believe as the Church believes, more than their husbands, nor must they take doctrines as truth upon their husband’s word; nor are women so excluded from speaking in the Church as [that] they may upon no occasion: confess their faith, 2. profess vocally repentance, 3. depose as witnesses, [or] 4. accuse the guilty before the binding Church.

4. Nor may a [civil] corporation cast out a major [an official] by an authoritative power such as binding and loosing is, Mt. 18 [that is, the power by which they do it is not of the same kind as ecclesiastical power].

5. We seek a warrant why the votes of women in choosing their pastors must more be included in the votes of the male than their being essential parts of the redeemed Church is included in the males, or their confessing publicly that Jesus is the Christ, as many women martyrs and sons and servants have gloriously done; and yet their confession of Christ to the death must be personal, and not included in the confession of husband or parents, as Mt. 10:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 257</span></figcaption>

<blockquote><p>2. The extent; unlimited, ‘In everything;’ that is, in everything that is lawful and belonging to her duty. Certainly those things which hinder our due subjection to God and Christ are excepted; as the apostle in another case, 1 Cor. 15:29, ‘When He hath put all things under Him, it is manifest that He is excepted that hath put all things under Him.’ There are cases excepted by a superior law. In Luke 14:26, it is said, ‘If a man hate not father and mother, wife and children, he cannot be my disciple.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons upon Eph. 5</cite>, sermon 29, on Eph. 5:24, p. 458</span></figcaption>

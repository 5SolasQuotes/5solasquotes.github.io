<blockquote><p>The reasons are: (1) the formula of the covenant of grace under which the fathers lived does not suffer them to be hurled into a limbo, but demands that they should be admitted into heaven. For since God promised that he would be their God, not temporarily, but eternally (nor is he the God of the dead, but of the living)—the fathers must necessarily still live even after death, at least as to some part of them (i.e., as to the soul), not with any kind of life, but with a happy and heavenly life, necessarily included in this promise (as has been proved before, Question 2). Christ expressly teaches this. When speaking of the dead fathers he says “All live unto him” (pantes autō zōsi, Lk. 20:38), not only in the mind and power of God because he can recall them to life and was really about to do this according to his decree; but they live because they are before him always and enjoy a divine life. This is both “from him” (as the beginning) and terminates “on him” (as its object and end). Now who would say that they live in God who being thrust into hell are without the vision of God and feel the punishment of loss (at least the temporal). V. Second, the ancients immediately after death were received into the bosom of Abraham, as appears from the example of Lazarus (Lk. 16:22, 23). Therefore they were also received into heavenly joy. For “the bosom of Abraham” can be referred to no other thing than to eternal life; this is shadowed forth under the symbol of a sumptuous feast, in allusion to a custom of the ancients in which they were accustomed so to recline at their feasts that the one rested his head on the bosom of the other. This is said of John, because Christ reclining upon the higher part of the couch had John next to him, who is therefore said to have leaned upon his bosom (Jn. 13:23). Thus nothing is more natural than that it should be said here that Lazarus was to Abraham what John was to the Lord; in the heavenly feast especially since Christ elsewhere clearly unfolds this mystery when he says, “Many shall come from the east and the west, and shall sit down with Abraham, and Isaac, and Jacob, in the kingdom of heaven” (Mt. 8:11), i.e., shall enjoy with him the celestial banquet. “To sit down with Abraham” and “to be in the bosom of Abraham” are the same except that to be in the bosom is a mark of greater love because not all shall recline upon his bosom, as Maldonatus aptly remarks on this passage (Commentaria in quatuor evangelistas [1863], 2:287–88 on Lk. 16:22). Now mention is made of Abraham rather than of Jacob or any other saint; both because he was the father of believers in whose bosom (i.e., most loving embrace) they are collected who partake of the fruit of the same faith with him, as sons come together in the bosom of their father when they are graciously received by him; and also on account of his liberal hospitality during life, so that the hospitality of the good but wealthy Abraham may be opposed to the inhospitality of the wealthy provider of the feast. VI. Hence it is evident that to no purpose does Bellarmine maintain that the bosom of Abraham is nothing else than limbo and that the souls of Abraham and of Lazarus were in the same abyss with the soul of the provider of the feast, distinct indeed from each other, but having nothing solid interposed, but only a great gulf (mega chasma) (“De Purgatorio,” 2.6* in Opera [1857], 2:396). For first, our interpretation concerning the reclining in the heavenly banquet being established, this figment falls to the ground. Hence, after mention of this sitting down, it is added that others shall be cast out “into outer darkness” (eis to skotos exōteron, Mt. 8*:12)—the similitude being taken from a magnificent banquet in which on the inside the ceiling glitters with lamps, but outside there is nothing but the blackness of night. Thus whatever is outside the kingdom of heaven (where the eternal light shines) will be darkness. Again, in the bosom of Abraham good things are received and consolation is given to Lazarus for the torture he had suffered. Thus “the alternate changes of evil and good things are compensated by an ample retribution” (Tertullian, De Idolatria 13.14–15 [trans. J. H. Waszink and J. C. M. van Winden, 1987], pp. 46–47). But in limbo neither can this good be possessed, nor any place for consolation be had because there is the punishment of loss and exclusion from the face of God. Third, if Abraham was in hell, how can it be said that the abyss was so profound that there could be no passage from one to the other? How could Lazarus be said to have been carried away (apenechtheis) to a different place from hell, where the rich man is said to have been? Fourth, the Roman Ritual itself favors our opinion. For among other things which the clergy ought to sing, as soon as the funeral enters the church, they sing, “May Christ who called receive thee and angels carry thee into the bosom of Abraham” (“Caput 8: De Exspiratione*,” Rituale Romanum [1944], p. 141). In reality the whole of this discourse (whether it be a history or a parable or a history parabolically described) must be understood not according to the letter (kata to rhēton) and historically, but parabolically, for neither tongues nor speech nor fingers can belong to souls. * Corrected citation</p></blockquote>

<blockquote><p>Shall there be no difference in the examination of the Elect and the Reprobate? Yes. For, 1. The Elect shall not have their sins, for which Christ satisfied, but only their good works, remembered. 2. Being in Christ, they and their works shall not undergo the strict trial of the Law simply in it self; but as the obedience thereof doth prove them to be true partakers of the grace of the Gospel.</p></blockquote>

<blockquote><p>For affections or passions in man, they are of two sorts: 1. Sensual belonging to the sensitive appetite and directed by the fantasy: these are common to brute beasts with us, and arise from one like temper and constitution in both. The object of these is all natural good or evil. 2. Rational, appertaining to the reasonable appetite or will, and guided by the understanding. These are proper to man, and they have their original from the substance of the reasonable soul, in which they always remain, not only when it is in the body, but even when tis severed from it. For fear, hope, love, hatred, joy, grief, etc. are in the damned and blessed spirits as well as living men. The object of these properly human passions is all moral and spiritual good or evil. I need not among so many learned, artists stand curiously upon the distinction of these two sorts of passions in man: the identity of names in both sorts has caused some confusion, but in reason the diversity of their nature is evident. Wherefore I go on to see what is meant by excitation or stirring up of the affections: whereby we can understand nothing else but their right and orderly motions about their proper objects. As in the particulars, sensual passions are then duly excited when they are moved about any natural good or evil, according to the instinct of nature in brute beasts and according to the same instinct of nature in man, but guided and moderated by right reason. Reasonable affections are then duly stirred up when their motions about all spiritual and moral good or evil are conformable to the quality of the object affected and to the rules of a rightly informed understanding.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For affections or passions in man, they are of two sorts: 1. Sensual belonging to the sensitive appetite and directed by the fantasy: these are common to brute beasts with us, and arise from one like temper and constitution in both. The object of these is all natural good or evil. 2. Rational, appertaining to the reasonable appetite or will, and guided by the understanding. These are proper to man, and they have their original from the substance of the reasonable soul, in which they always remain, not only when it is in the body, but even when tis severed from it. For fear, hope, love, hatred, joy, grief, etc. are in the damned and blessed spirits as well as living men. The object of these properly human passions is all moral and spiritual good or evil. I need not among so many learned, artists stand curiously upon the distinction of these two sorts of passions in man: the identity of names in both sorts has caused some confusion, but in reason the diversity of their nature is evident. Wherefore I go on to see what is meant by excitation or stirring up of the affections: whereby we can understand nothing else but their right and orderly motions about their proper objects. As in the particulars, sensual passions are then duly excited when they are moved about any natural good or evil, according to the instinct of nature in brute beasts and according to the same instinct of nature in man, but guided and moderated by right reason. Reasonable affections are then duly stirred up when their motions about all spiritual and moral good or evil are conformable to the quality of the object affected and to the rules of a rightly informed understanding.”

— William Pemble, Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627), pp. 125-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+affections+or+passions+in+man%2C+they+are+of+two+sorts%3A+1.+Sensual+belonging+to+the+sensitive+appetite+and+directed+by+the+fantasy%3A+these+are+common+to+brute+beasts+with+us%2C+and+arise+from+one+like+temper+and+constitution+in+both.+The+object+of+these+is+all+natural+good+or+evil.+2.+Rational%2C+appertaining+to+the+reasonable+appetite+or+will%2C+and+guided+by+the+understanding.+These+are+proper+to+man%2C+and+they+have+their+original+from+the+substance+of+the+reasonable+soul%2C+in+which+they+always+remain%2C+not+only+when+it+is+in+the+body%2C+but+even+when+tis+severed+from+it.+For+fear%2C+hope%2C+love%2C+hatred%2C+joy%2C+grief%2C+etc.+are+in+the+damned+and+blessed+spirits+as+well+as+living+men.+The+object+of+these+properly+human+passions+is+all+moral+and+spiritual+good+or+evil.+I+need+not+among+so+many+learned%2C+artists+stand+curiously+upon+the+distinction+of+these+two+sorts+of+passions+in+man%3A+the+identity+of+names+in+both+sorts+has+caused+some+confusion%2C+but+in+reason+the+diversity+of+their+nature+is+evident.+Wherefore+I+go+on+to+see+what+is+meant+by+excitation+or+stirring+up+of+the+affections%3A+whereby+we+can+understand+nothing+else+but+their+right+and+orderly+motions+about+their+proper+objects.+As+in+the+particulars%2C+sensual+passions+are+then+duly+excited+when+they+are+moved+about+any+natural+good+or+evil%2C+according+to+the+instinct+of+nature+in+brute+beasts+and+according+to+the+same+instinct+of+nature+in+man%2C+but+guided+and+moderated+by+right+reason.+Reasonable+affections+are+then+duly+stirred+up+when+their+motions+about+all+spiritual+and+moral+good+or+evil+are+conformable+to+the+quality+of+the+object+affected+and+to+the+rules+of+a+rightly+informed+understanding.%E2%80%9D%0A%0A%E2%80%94+William+Pemble%2C+Vindici%C3%A6+grati%C3%A6.+%3D+A+Plea+for+Grace%2C+More+especially+the+Grace+of+Faith%E2%80%A6+%28London%3A+1627%29%2C+pp.+125-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb0cd5d6e63.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b0cd5d6e63.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/heaven#:~:text=For%20affections%20or%20passions%20in%20man,rules%20of%20a%20rightly%20informed%20understanding&amp;text=For%20affections%20or%20passions%20in%20man%2C%20they%20are&amp;text=to%20the%20rules%20of%20a%20rightly%20informed%20understanding" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>

</figure><figure class="quote" id="q-1b13e7cb51" data-kw="">
<blockquote><p>Whether the blessed saints after the end of this world shall inhabit this earth, or at least often visit it, Curiose quaeritur &amp; docte ignoratur ‘It is carefully examined, shrewdly passed over’. Voet, Bibliotheca Studiosi Theologiae, bk. 1, ch. 9 [p. 87]. Dr. [Andrew] Willet upon the Romans holds the affirmative (as I remember) and grounds it on that place of Mt. 5:5. Some urge that place in Peter, ‘A new heaven and earth wherein dwelleth righteousnesse’, that is, righteous persons.</p></blockquote>

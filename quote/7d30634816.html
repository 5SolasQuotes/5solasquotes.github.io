<main class="wrap"><figure class="quote" id="q-7d30634816" data-kw="">
<blockquote><p>O but the management of the kingdom of grace must be a great thing! and our Mediator must be well furnished for the managing of it! since the vast and extensive kingdom of Providence is put in his hand as a subordinate, there to be administered in a subserviency to the kingdom of grace, and to carry on the glorious purposes thereof. He sits enthroned in Zion; and as Zion’s King, his power reaches through the whole earth, the seas, heaven, and hell! All power is given him everywhere. His subjects in Zion are but few, but the whole world is rolled hither and thither for that little kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to his Correspondent in Edinburgh, 14 December 1724 in Memoirs (1731) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 12: 484.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence.html">Providence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa89377c4b" data-kw="">
<blockquote><p>It is asked, do the Remonstrants rightly ascribe to us that God forsakes us before we forsake Him? I respond: Calumniously. For if the discussion is about desertion by way of merit, we forsake God first:

1. Because the merit of sin precedes punishment.

2. Because God, punishing antecedent sins by subsequent ones, punishes by forsaking sinners. But if the discussion is about desertion purely negative and not culpable, by which God denies predetermining grace, which he owes to no one; then God forsakes us before we forsake Him:

1. Because God withdrew from Adam predetermining grace (or as Calvin calls it in his Response to the Calumnies of a Certain Worthless Fellow, p. 1016, ‘fortitude and constancy’), which, if given, he would have stood.

2. Because grace would not be grace, if it depended on the nod of free will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 13, on Rom. 7:17, p. 380</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>But He does not defect prior in nature in the evil act, because deficiency is not a concurrence but rather a defect thereof, arising from the non-operation of the will.</p></blockquote>

<blockquote><p>IV. Whence also it [original sin] is natural in us, because it is in us and in our nature—not as it was created upright from the beginning by God (for “God has made man upright,” Eccl. 7:29, which rectitude of the whole workmanship rejects crookedness and distortion), but as it is depraved by the fault of the first principle from which we all naturally descend.</p></blockquote>

</figure><figure class="quote" id="q-963508f7c6" data-kw="">
<blockquote><p>…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Good Acts</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

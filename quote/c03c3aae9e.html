<main class="wrap"><figure class="quote" id="q-c03c3aae9e" data-kw="">
<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-mede.html">Joseph Mede</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Diatribae Discourses on Diverse Texts of Scripture</cite>, (London, 1642-1648), Discourses on Diverse Texts of Scripture, Sermon on 1 Cor. 11:5, pp. 182-83</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-586625ff3c" data-kw="">
<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). … 13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. … 14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). … 15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. … 16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on 1 Cor. 11, n.p.</span></figcaption>

3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/586625ff3c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=4.%20It%20being%20the%20custom%20then,we%20can%2C%20must%20not%20affect%20dissimilitude&amp;text=4.%20It%20being%20the%20custom%20then%20to%20cover&amp;text=concordant%20as%20we%20can%2C%20must%20not%20affect%20dissimilitude" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f6ee7b820c" data-kw="">
<blockquote><p>Am I suggesting that women return to wearing coverings or veils? No. We must distinguish between the fundamental principle that underlies a text and the application of that principle in a specific culture… Now, in the first century, failure to wear a covering sent a signal to the congregation that a woman was rejecting the authority of male leadership. Paul was concerned about head coverings only because of the message they sent to people in that culture… Lack of head coverings sends no message at all in our culture. Nevertheless, that does not mean that this text does not apply to our culture. The principle still stands that women should pray and prophesies will be one indication of whether she is humble and submissive. The principle enunciated here should be applied in a variety of ways given the diversity of the human situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-r-schreiner.html">Thomas R. Schreiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Head Coverings, Prophecies &amp; the Trinity</cite>, 1 Corinthians 11:2-16’ in eds. Piper &amp; Grudem, Recovering Biblical Manhood &amp; Womanhood: a Response to Evangelical Feminism (Crossway, 1991), pp. 124-39, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

%20human%20situation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-15a6d09e85" data-kw="">
<blockquote><p>Part III will find the exact ‘covering’ prohibited to men while ‘praying or prophesying’ (11:4) is less certain [compared to the woman’s covering], though it seems Paul proscribed Corinthian men from wearing any dishonoring covering in the assemblies, namely which hung down from their heads, whether material, a hair–bun or long hair, yet not wreaths, helmets, hats or turbans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Part III of 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pp. 232-57, p. 9</span></figcaption>

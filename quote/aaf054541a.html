<main class="wrap"><figure class="quote" id="q-aaf054541a" data-kw="">
<blockquote><p>To shew that this kind of Government doth not entrench upon the authority of the civil Magistrate, let the difference betwixt them be well observed, and that in these three particulars.

1. Civil Magistrates command in their own name, or in the name of a superior civil Magistrate, thus, I charge you in the name of the King. But Church-Governors, in the name of Christ.

2. Civil Magistrates require obedience to themselves, Church-Governors, to Christ.

3. Civil Magistrates press on their subjects their own Laws, as Statutes and Ordinances made by themselves. Church-Governors, the Ordinances of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 25-26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Now there were three kinds of laws given through Moses – the moral law, which lays down man’s duty towards God and his neighbour – the ceremonial, which lays down the rites or ceremonies of the religion observed under the Old Testament – the judicial, which established the civil government of the Jewish people. The moral law had respect to the Israelites as men; the ceremonial respected them, as under the Old Testament, waiting for the promised Messiah; the judicial, as a peculiar people.

There is a very great difference between these three laws. The moral law is founded, at least in a very great measure, on the natural right of God; by which we mean that which rests upon the most pure and holy nature of God himself; for instance, this precept, which is the sum of the law, – Thou shalt love the Lord thy God, is founded on the very nature of God; otherwise God could command himself, who is the supreme good, to be hated.

Whereas other laws are founded on the positive right of God, by which we mean that which depends on the mere will and pleasure of God. This law is known from nature; hence the Gentiles themselves were not ignorant of it, although it was far more clearly known when divinely revealed. The ceremonial law does not come under the natural understanding of man; and as to the judicial law, although in its general precepts it is founded on natural reason, yet with regard to its particular conclusions it depends entirely on the will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.2, pp 259-60.</span></figcaption>

</figure><figure class="quote" id="q-afc487e6b5" data-kw="">
<blockquote><p>The oral contraceptive principle has its basis in the Talmud as a potion or ‘cup of roots,’ the kos shel ikkarin. The ‘roots’ in that potion may refer to its herbal ingredients (the modern progesterone pill makes use of roots of the Mexican yam), and the mixture, in varying compositions, had many purposes… The kos shel ikkarin itself could, in a different dosage or composition, cause fertility rather than sterility, or could cure certain ailments [pointing to its hormonal nature]. An inquiry concerning the wife’s right to drink a potion that would help her become pregnant (sam l’hit-abber) was addressed to the eminent R. Solomon ben Adret of the thirteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-m-feldman.html">David M. Feldman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Birth Control in Jewish Law</cite>, (1968; Schocken Books, 1974) 315 pp. ToC, p. 235</span></figcaption>

</figure><figure class="quote" id="q-e411187ebd" data-kw="">
<blockquote><p>Now if Pighius do feign that God created in us these lusts and wicked affections, then is he blasphemous and contumelious against him: which faults he unworthily goeth about to lay to our charge. For forasmuch as God is good, and most wise, and most just, and hath also created man unto the highest felicity, he would not have given him those things, whereby he should be withdrawn from that felicity: which should entice him to do against his commandments: which of their own accord are filthy, and should lead us captives into the law of sin &amp; of death. For these things if they ought to be mortified and crucified, as undoubtedly they ought, we must needs grant, that they are vices and hateful unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romans wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Epi</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 121.</span></figcaption>

</figure><figure class="quote" id="q-dbf669f70d" data-kw="">
<blockquote><p>In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Orthodoxy &amp; Philosophy</cite>, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), pp. 239-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

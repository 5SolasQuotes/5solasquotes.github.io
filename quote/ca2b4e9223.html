<main class="wrap"><figure class="quote" id="q-ca2b4e9223" data-kw="">
<blockquote><p>As now for instance; The light of Nature that will teach this: That we are to worship God: the Heathens have worshiped God in their way. … Yea, the light of Nature will teach, That we must live justly among men, yea, and that we must do as we would be done to: This the light of Nature will teach.

Many of the Heathens have had that principle, to be just with men, to do as we would be done by. The light of Nature condemns gross sins, of Drunkenness, Adultery, Swearing &amp;c. I could give you many instances in the Laws of Heathens, punishing those sins very severely, and some of them with death. …

Yea the light of Nature will rise thus high, That a man should be conscientious, should make conscience of secret sins, of sins that none in the world could know of, or are ever like to know of. As I remember sometimes I have told you of one of the Heathens that did but owe for a pair of shoes to a Shoe maker, and nobody knew it but only the Shoe-maker himself; the Shoe-maker dies, nobody could challenge this of him, yet his conscience would never let him be at quiet, until he ran and threw the money into the shop, and said, Though he be dead to others, yet he is not dead to me: whereas he had a temptation to have kept it because nobody could challenge it; he knew it was not his, he knew it was either the Children’s, or Executors, and so he restored it.

Many particulars might be named to shew how far we might go by the light of Nature; but now I only bring it in to this end, to shew that if we would have our Conversations such as becomes the Gospel of Christ, we must go beyond what ever any have done by the light of Nature: and yet Oh Lord how short do many Professors of Religion come of this! How many that will profess they hope to be saved by Christ!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 33-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3ebbf6126" data-kw="">
<blockquote><p>If we pass to the New Testament, we shall there also find this Argument used. From the Fabrick of the World St. Paul proves to the Men of Lystra, that there is a God, a Living God, in Contra distinction to the Gentile Gods, or Idols rather. From the making of Heaven and Earth, the Sea and all things that are therein, he argues the Existence of an All-sufficient and Self-subsistent Being, Acts 14.15.

And again, Rom. 1.20. The invisible things of God from (i. e. ever since) the Creation of the World are clearly seen, being understood by the things that are made, even his eternal Power and Godhead, even those Invisible things are clearly manifested by those Visible Works that he hath wrought. Or perhaps the meaning … may be from the Consideration of the Creation, from this alone the invisible things of the Deity, viz. his Power, Wisdom and Bounty are seen and proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A demonstration of the existence and providence of God, from the contemplation of the visible structure of the greater and the lesser world in two parts, the first shewing the excellent contrivance of the heavens, earth, sea, &amp;c., the second the wonderful formation of the body of man</cite>, (London: Jonathan Robinson and John Wyat, 1696), 1.12, pp 252-53.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-8394b46f2c" data-kw="insufficient">
<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.4</span></figcaption>

</figure><figure class="quote" id="q-77bb6179c1" data-kw="">
<blockquote><p>Whereupon Tertullian said: ‘First God sent Nature to be our school-dame, purposing afterward to send the Word; that so having learned in the school of Nature, we might the more easily believe the Word of God.’ So then as when I see an house, I say there has been a carpenter, though I see him not: so when I look upon the frame of this world, I must say, it had a builder, though I behold him not.</p></blockquote>

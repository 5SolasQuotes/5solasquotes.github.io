<main class="wrap"><figure class="quote" id="q-7c73d67f29" data-kw="">
<blockquote><p>This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/perseverance-and-assurance.html">Perseverance and Assurance</a> › <a href="../topics/perseverance-of-the-saints/perseverance-and-assurance/how-they-relate.html">How they relate</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a> › <a href="../topics/assurance-peace-and-joy/assurance-of-salvation/assurance-of-faith.html">Assurance of faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b044c059b" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God&#x27;s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light, yet are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.4</span></figcaption>

</figure><figure class="quote" id="q-1ef2c0c632" data-kw="">
<blockquote><p>The elect in due time, though in various degrees and in different measures, attain the assurance of this their eternal and unchangeable election, not by inquisitively prying into the secret and deep things of God, but by observing in themselves with a spiritual joy and holy pleasure the infallible fruits of election pointed out in the Word of God—such as, a true faith in Christ, filial fear, a godly sorrow for sin, a hungering and thirsting after righteousness, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 12</span></figcaption>

</figure><figure class="quote" id="q-a34880204e" data-kw="">
<blockquote><p>We, therefore, condemn those who seek other than in Christ, whether they are chosen from all eternity, and what God has decreed of them before all beginning. For men must hear the gospel preached and believe it. If you believe and are in Christ, you may undoubtedly reckon that you are elected. For the Father has revealed unto us in Christ His eternal sentence of predestination, as we even now showed out of the apostle in 2 Timothy 1:9–10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 10</span></figcaption>

</figure><figure class="quote" id="q-a155569413" data-kw="">
<blockquote><p>When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, pp. 70–71</span></figcaption>

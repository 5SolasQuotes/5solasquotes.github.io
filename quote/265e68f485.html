<blockquote><p>Mercy and truth are met together, righteousness and peace have kissed each other. When God made heaven and earth out of nothing, he made them by a word, without any other ceremony; but, when he made man, there was some particular solemnity, a grand council, as it were, of the glorious Trinity called; Come, let us make man after our image. But now man having unmade himself, if God hath a mind for the praise of his own glorious grace to make him up again, by a new creation in Christ Jesus, there must be a more glorious solemnity yet; not only a council of the adorable Trinity, but a grand meeting of all the attributes of God, to consult their own glory that was marred, and reconcile their own interests, and seemingly contradictory claims:

For the sin of man had brought real confusion among all the creatures of God on earth, yea, and seeming war among all the attributes of God in heaven, concerning the execution of the sentence of the law upon mankind, the transgressor thereof; some of these attributes, such as Mercy, saying, if the sentence of death be executed upon them, how shall I be glorified? Others, such as Truth, saying, if the sentence be not executed, how shall I be glorified? Is it to be expected that such opposites can meet together? Or, if they meet, that they will agree together cordially? Yea, tho’ it be beyond the expectation of men and angels, yet behold, it is here celebrated with a song? Mercy and truth are met together, righteousness and peace have kissed each other. …

But now, if we would know what sort of glory it is that appears when Christ is revealed, why it is even the glorious harmony of all the divine attributes illustriously shining in him, who is both our salvation and our glory; Mercy and truth are met together; righteousness and peace have kissed each other. Now, tho’ these words may be applied to the happy meeting of graces in men, upon the revelation of Christ in the soul, which I may afterwards observe in the sequel, and in which sense some interpreters understand it, yet I take it mainly to import the happy meeting of perfections in God to be glorified in the sinner’s salvation by Jesus Christ, which is a gloss that no interpreter I have had occasion to consult does neglect or omit; and, if any of them should miss it, I think they would miss the very ground-work and foundation of all other happy meetings: Mercy and truth are met together, righteousness and peace have kissed each other.</p></blockquote>

<blockquote><p>Sixthly, He tells us page 32, That in all Reformed Churches men used to enter into the place of public worship with their hats off, which is as great an untruth, as ever dropped from writers’ pen, unless it be understood of places of public worship, whilst public worship is actually performed in them, and if it may be so understood, then the Presbyterians would hugely approve of it. By the [Westminster] Directory it was enjoined that, all enter the assembly not irreverently, but in a grave and seemly manner: gravity and seemliness do include putting off the hat, which yet would be a ridiculous action, if a man should use it, as too many now a days do as oft as they go through the Church, though none be met for worship, and though they themselves intended no worship: nor does the Directory any where condemn the manner which Mr. Durell tells us has obtained among the French Ladies, viz. to unmask themselves when they come into the temple; provided they do not unmask themselves out of a vain or wanton design; if they should do so, they know by whom they are condemned. [I but says Mr. Durell, the devoutest sort both of men and women, use[d] to kneel and make a prayer for God’s blessing, before they sit down, and this the [Westminster] Directory prohibits.] Had he said that the devouter sort use a short prayer when they took no seats, and came to perform no service to God; then he had said something to excuse the actings of some among us. The peoples making a secret prayer before they sit down in their seats, is not forbidden by the Directory, unto all, or unto any, but these who come into the Church the public worship being begun, and whether it be more meet for such to betake themselves to their private devotions, or to join with the Assembly in that ordinance that is in hand, let the learned judge for they are wise. Seventhly, All might have been spared that is brought, page 33, Of people’s standing bare in time of divine service, and at the administration of sacraments: In the very Church of Scotland all are uncovered at the administration of the sacraments; here in England men had left off to put on their hats in time of sermon (which Mr. Durell seems to distinguish from Service) had Mr. Calamy and others been hearkened to. Eighthly, Above all, what need we be told, page 22, that Calvin wore a gown and a cap: Were not presbyterians accustomed so to do in the universities? Those sent down by the two Houses to Cambridge, did all of them preach in the University Church in their gowns, and in their hoods;</p></blockquote>

<blockquote><p>Secondly, whereas there goes but two things to the reformation of the Church, they are both in the word glory.

First, there must be all the ordinances; thus the Ark was called glory, and the Ark signified both the word and Sacraments; here are communicants in these, and they are such as are cleansed and undefiled, vers. 3. here is thirdly, government; 2 Pet. 2.10. it is said of some they do despise and not respect dominions, or glories, as the word is; and the glory that is there spoken is not evil but ecclesiastical, for it is such a kind of despising, as Corah and Dathan were guilty of against Moses, Jude 8.11. Now they opposed Moses, not as a Magistrate, but as a Minister and Law-giver unto the Church, and therefore they said, Are not all the people of the Lord holy? and not wise, or valorous, or true hearted? which art the virtues of a Magistrate. Besides, false teachers are for the most part flatterers of Princes, not Despisers, as Zedekiah was, and Simon Magus who adored Nero.

When you have the ordinances, then the Second thing required to a Reformation, is to have them pure, and after God’s prescript, without human addition or alteration: take this for a rule, the more plain God’s ordinances are, the more powerful; the more there is of man, the less there is of God in them, Ezek. 44.7. God tells them they had polluted his Sanctuary, that is, made it common, the sacramental bread did them no more good than their own ordinary bread, and the company of the Saints no more then the company and society of men. You have this in the text too, for here is beauty joined with glory in vers. 2. and beauty is a native complexion; here is glory joined with purging, the spirit of judgement, and of burning, in the verse before my text; here is holiness written on every Soul, vers. 3. and to be holy is all one with being set apart to a holy use and being prepared, and fitted for it.</p></blockquote>

— Sidrach Simpson, Reformation’s preservation opened in a sermon preached at Westminster before the honourable House of Commons, at the late solemne fast, July 26, 1643, (London: Benjamin Allen, 1643), pp 4-5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+whereas+there+goes+but+two+things+to+the+reformation+of+the+Church%2C+they+are+both+in+the+word+glory.%0A%0AFirst%2C+there+must+be+all+the+ordinances%3B+thus+the+Ark+was+called+glory%2C+and+the+Ark+signified+both+the+word+and+Sacraments%3B+here+are+communicants+in+these%2C+and+they+are+such+as+are+cleansed+and+undefiled%2C+vers.+3.+here+is+thirdly%2C+government%3B+2+Pet.+2.10.+it+is+said+of+some+they+do+despise+and+not+respect+dominions%2C+or+glories%2C+as+the+word+is%3B+and+the+glory+that+is+there+spoken+is+not+evil+but+ecclesiastical%2C+for+it+is+such+a+kind+of+despising%2C+as+Corah+and+Dathan+were+guilty+of+against+Moses%2C+Jude+8.11.+Now+they+opposed+Moses%2C+not+as+a+Magistrate%2C+but+as+a+Minister+and+Law-giver+unto+the+Church%2C+and+therefore+they+said%2C+Are+not+all+the+people+of+the+Lord+holy%3F+and+not+wise%2C+or+valorous%2C+or+true+hearted%3F+which+art+the+virtues+of+a+Magistrate.+Besides%2C+false+teachers+are+for+the+most+part+flatterers+of+Princes%2C+not+Despisers%2C+as+Zedekiah+was%2C+and+Simon+Magus+who+adored+Nero.%0A%0AWhen+you+have+the+ordinances%2C+then+the+Second+thing+required+to+a+Reformation%2C+is+to+have+them+pure%2C+and+after+God%E2%80%99s+prescript%2C+without+human+addition+or+alteration%3A+take+this+for+a+rule%2C+the+more+plain+God%E2%80%99s+ordinances+are%2C+the+more+powerful%3B+the+more+there+is+of+man%2C+the+less+there+is+of+God+in+them%2C+Ezek.+44.7.+God+tells+them+they+had+polluted+his+Sanctuary%2C+that+is%2C+made+it+common%2C+the+sacramental+bread+did+them+no+more+good+than+their+own+ordinary+bread%2C+and+the+company+of+the+Saints+no+more+then+the+company+and+society+of+men.+You+have+this+in+the+text+too%2C+for+here+is+beauty+joined+with+glory+in+vers.+2.+and+beauty+is+a+native+complexion%3B+here+is+glory+joined+with+purging%2C+the+spirit+of+judgement%2C+and+of+burning%2C+in+the+verse+before+my+text%3B+here+is+holiness+written+on+every+Soul%2C+vers.+3.+and+to+be+holy+is+all+one+with+being+set+apart+to+a+holy+use+and+being+prepared%2C+and+fitted+for+it.%E2%80%9D%0A%0A%E2%80%94+Sidrach+Simpson%2C+Reformation%E2%80%99s+preservation+opened+in+a+sermon+preached+at+Westminster+before+the+honourable+House+of+Commons%2C+at+the+late+solemne+fast%2C+July+26%2C+1643%2C+%28London%3A+Benjamin+Allen%2C+1643%29%2C+pp+4-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa15b770ca8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a15b770ca8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/01/sidrach-simpson-on-reformation-and-the-purity-of-ordinances/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>THE main drift of the blessed apostle, the Holy Ghost’s penman, in this excellent epistle, is to set forth the pre-eminence of our Lord Jesus Christ, first, in his divine person, far above all angels, who are bid worship him, even when dwelling in man’s nature. If the god-head of our Lord Jesus Christ be hid from the readers of this epistle, it must be a special power of the God of this world on their unbelieving minds, 2 Cor. 4:3, 4. Will blinded men forbear to call the Son God, when the Father speaks so? chap. 1:8. Thy throne, O God, is for ever and ever. Then the apostle speaks of his incarnation, chap. 2:11, &amp;c. And therewith speaks of his priesthood, chap. 3. The apostle compares Christ with, and prefers him above Moses, chap. 2.; then above Aaron as a priest, chap. 7.; and compares him with Melchizedek, an eminent type of Christ.

By this epistle we may know what Paul’s reasonings with the Jews were, Acts 9:22 and 17:2, 3 and what is the right way of dealing with the Jews at this day. Till Christ’s divine person, and righteousness, and priesthood, have more room in the religion of the Gentiles, Christianity is not like to leaven the Jews. This doctrine of Christ’s priesthood, and of the sacrifice of himself he offered in that office, the apostle doth often intermix, with suitable exhortations from it; as in the context, ver. 14. Seeing then that we have a great high priest, (all the Old Testament high-priests were but types and shadows of him, and were but little high-priests), that is passed into the heavens, (no high-priest but Christ went farther than the holy of holies, for the people’s advantaged), Jesus the Son of God, let us hold fast our profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 11-12.</span></figcaption>

</figure><figure class="quote" id="q-c61e996173" data-kw="">
<blockquote><p>The apostle delivered nothing as it were by a second hand to the Corinthians, but what he had formerly received from the Lord. Divine things are unto us deposited; we must first be receivers, before deliverers.

HERE then we see, first, both the absurdity and the wickedness of a will-worship; when the same man who is to perform the obedience, shall dare to appoint the laws, implying a peremptory purpose of no farther observance, than may consist with the allowance of his own judgement: whereas true obedience must be grounded on the majesty of that power that commands, not on the judgement of the subject, or benefit of the precept imposed.

Divine laws require obedience, not so much from the quality of the things commanded (though they be ever holy and good), as from the authority of him that institutes them. We are all the servants of God; and servants are but living instruments, whose property it is to be governed by the will of those, in whose possession they are. Will-worship, and services of superstition, well they may flatter God, they do not please him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 15-16.</span></figcaption>

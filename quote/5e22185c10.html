<main class="wrap"><figure class="quote" id="q-5e22185c10" data-kw="">
<blockquote><p>1. When the Lord Jesus comes and stands knocking at the door of your heart with the hammer of his Word, and with the hand of his Spirit, then bow yourself with all your might (as Sampson did, Judg. 16:30) to pull back every bolt and to draw in every bar that would keep the door shut against this blessed and bleeding Redeemer. The duty indeed is yours, but the ability is his: as much as in you lies, cause every lust of your heart to make room for your dear Jesus. 2. Welcome Christ into your heart with joy. Say to Him as Laban did to Abraham’s servant, ‘Come in thou blessed of the Lord, thou art welcome; wherefore standest thou without?’ Gen. 24:31. Christ will come to you with a blessing in his hand to bestow on you, as he did to Jacob, Gen. 32:26, etc. David-literal says to his son (that invited him to his house), ‘Why should we be chargeable to thee, my son?’ 2 Sam. 13:25. But this David-spiritual will not be chargeable: wheresoever He comes, where He comes to sup with any soul, He brings his supper with Him, Rev. 3:20, and eats but of his own honeycomb, and of his own honey, Cant. 5:1. This blessed guest brings his blessing with Him, as the ark did to the house of Obed-Edom. 3. When Christ is come into your house to dwell in your heart by faith, Eph. 3:17, be careful to keep his habitation quiet and comfortable; to this end you must adjure your corruptions by the roes and by the hinds of the field that they stir not up nor awake your beloved until He please, Cant. 2:7. ‘Tis pity such a blessed guest should meet with any disturbance; lay God’s charge upon your lusts…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-ness.html">Christopher Ness</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown &amp; Glory of a Christian, consisting in a Sound Conversion… (London: Newman, 1676), bk. 2</cite>, pp. 10-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6f5c835f2" data-kw="">
<blockquote><p>Here the Lord Jesus Christ stands knocking at the Laodicean’s door; He would fain have them to sup with Him, and that He might sup with them; that is, that they might have intimate communion and fellowship one with another. Now, pray tell me, what preparations or qualifications had these Laodiceans to entertain Christ? Surely none; for they were lukewarm, they were ‘neither hot nor cold,’ they were ‘wretched, and miserable, and poor, and blind, and naked’; yet Christ to show his free grace and his condescending love, invites the very worst of sinners to open to Him, though they were no ways so prepared or qualified to entertain Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices in Works, vol. 1, Appendix</cite>, pp. 147-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-3a4fd6c2c2" data-kw="">
<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Catechism... (London: Norton, 1632), pt. 2, 4th Article</cite>, pp. 182-83</span></figcaption>

<blockquote><p>If we have truly received Jesus Christ into our hearts…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>49 Sermons upon the Whole Epistle of the Apostle St. Paul to the Colossians… (London: White, 1672), pt. 1, 15th Sermon</cite>, p. 147</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

— Jean Daillé, 49 Sermons upon the Whole Epistle of the Apostle St. Paul to the Colossians… (London: White, 1672), pt. 1, 15th Sermon, p. 147">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+we+have+truly+received+Jesus+Christ+into+our+hearts%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Jean+Daill%C3%A9%2C+49+Sermons+upon+the+Whole+Epistle+of+the+Apostle+St.+Paul+to+the+Colossians%E2%80%A6+%28London%3A+White%2C+1672%29%2C+pt.+1%2C+15th+Sermon%2C+p.+147&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f038757f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f038757f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=If%20we%20have%20truly%20received%20Jesus%20Christ%20into%20our%20hearts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1cfa5d17ab" data-kw="">
<blockquote><p>He does not knock at the door of his friends merely, but at the door of his enemies. He knocks at the door of the vilest of sinners… 3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing. Nor is this all—you may say, I am such a great sinner—I have rejected him so long, that He will not receive me now. But what says the Savior? ‘If any man hear my voice’—vile as he may be, if he is on the side of hell—‘if any man hear my voice and open the door, I will come in to him, and sup with him, and he with Me.’ If you are not now a Christian, permit me to say that you have never heard his voice, nor opened the door, nor been willing to receive Him. You have never complied with the invitation in the text. The Savior is ready and willing, but you will not come to Him that you might have life. [Jn. 5:40] 4. Behold your danger. The Savior stands at your door. He does not sit. He stands ready to enter or ready to depart… He may say, as he once said to the Jews, ‘I go my way. Ye shall see me, and shall die in your sins.’ How often ‘I would,’ and ‘ye would not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asahel-nettleton.html">Asahel Nettleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Remains of the Late Rev. Asahel Nettleton, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’</cite>, pp. 300-302</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“He does not knock at the door of his friends merely, but at the door of his enemies. He knocks at the door of the vilest of sinners… 3. Behold the extent of his willingness to receive sinners. The sinner sometimes says, ‘I am willing to receive Christ, but He is not willing to receive me.’ But what says the text? ‘Behold I stand at the door and knock.’ Does not this imply his readiness and willingness to come in? Nor is this all—He calls, ‘Open unto Me—open unto Me.’ Nor is this all—He says, ‘if any man hear my voice and open the door, I will come in.’ He positively declares that He is willing. Nor is this all—you may say, I am such a great sinner—I have rejected him so long, that He will not receive me now. But what says the Savior? ‘If any man hear my voice’—vile as he may be, if he is on the side of hell—‘if any man hear my voice and open the door, I will come in to him, and sup with him, and he with Me.’ If you are not now a Christian, permit me to say that you have never heard his voice, nor opened the door, nor been willing to receive Him. You have never complied with the invitation in the text. The Savior is ready and willing, but you will not come to Him that you might have life. [Jn. 5:40] 4. Behold your danger. The Savior stands at your door. He does not sit. He stands ready to enter or ready to depart… He may say, as he once said to the Jews, ‘I go my way. Ye shall see me, and shall die in your sins.’ How often ‘I would,’ and ‘ye would not.&#x27;”

— Asahel Nettleton, Remains of the Late Rev. Asahel Nettleton, ed. B. Tyler (Hartford: Robins &amp; Smith, 1845), Sermon 25, ‘Christ Standing at the Door’, pp. 300-302">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+does+not+knock+at+the+door+of+his+friends+merely%2C+but+at+the+door+of+his+enemies.+He+knocks+at+the+door+of+the+vilest+of+sinners%E2%80%A6+3.+Behold+the+extent+of+his+willingness+to+receive+sinners.+The+sinner+sometimes+says%2C+%E2%80%98I+am+willing+to+receive+Christ%2C+but+He+is+not+willing+to+receive+me.%E2%80%99+But+what+says+the+text%3F+%E2%80%98Behold+I+stand+at+the+door+and+knock.%E2%80%99+Does+not+this+imply+his+readiness+and+willingness+to+come+in%3F+Nor+is+this+all%E2%80%94He+calls%2C+%E2%80%98Open+unto+Me%E2%80%94open+unto+Me.%E2%80%99+Nor+is+this+all%E2%80%94He+says%2C+%E2%80%98if+any+man+hear+my+voice+and+open+the+door%2C+I+will+come+in.%E2%80%99+He+positively+declares+that+He+is+willing.+Nor+is+this+all%E2%80%94you+may+say%2C+I+am+such+a+great+sinner%E2%80%94I+have+rejected+him+so+long%2C+that+He+will+not+receive+me+now.+But+what+says+the+Savior%3F+%E2%80%98If+any+man+hear+my+voice%E2%80%99%E2%80%94vile+as+he+may+be%2C+if+he+is+on+the+side+of+hell%E2%80%94%E2%80%98if+any+man+hear+my+voice+and+open+the+door%2C+I+will+come+in+to+him%2C+and+sup+with+him%2C+and+he+with+Me.%E2%80%99+If+you+are+not+now+a+Christian%2C+permit+me+to+say+that+you+have+never+heard+his+voice%2C+nor+opened+the+door%2C+nor+been+willing+to+receive+Him.+You+have+never+complied+with+the+invitation+in+the+text.+The+Savior+is+ready+and+willing%2C+but+you+will+not+come+to+Him+that+you+might+have+life.+%5BJn.+5%3A40%5D+4.+Behold+your+danger.+The+Savior+stands+at+your+door.+He+does+not+sit.+He+stands+ready+to+enter+or+ready+to+depart%E2%80%A6+He+may+say%2C+as+he+once+said+to+the+Jews%2C+%E2%80%98I+go+my+way.+Ye+shall+see+me%2C+and+shall+die+in+your+sins.%E2%80%99+How+often+%E2%80%98I+would%2C%E2%80%99+and+%E2%80%98ye+would+not.%27%E2%80%9D%0A%0A%E

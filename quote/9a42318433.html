<main class="wrap"><figure class="quote" id="q-9a42318433" data-kw="">
<blockquote><p>A person of the Deity, is a subsistence in the Deity, having such properties, as cannot be communicated from one to another. There are three persons in the Deity, the Father, the Son, &amp; the holy ghost. Mat. 3.16. &amp; 28.19. 1. John. 5.7. Ephes. 2.18. Gene. 1.26. and 18.2. Exod. 3.6. and 15.16. Psal. 33.6. Esa. 6.3.

These are coeternal, and equal, of one, &amp; the self same simple essence, distinct one from another by an incommunicable propriety. And those are distinguished one from another, not essentially, because the essence of them is but one, yet notwithstanding really: they differ from the essence of God, not in deed, but by respect or by relation only.

The Father, is the first in the Godhead, which hath begot the Son from everlasting. Psal. 2. 2. Cor. 13. The Son, is the second in the Godhead, which is begotten of the Father, by an eternal communicating of the whole essence. John. 1.14.18.34. and 3.16. Mat. 3.17. 2. Cor. 1.19. Hose. 11.3. Luke. 1.31. Rom. 1.4.

The divine essence neither doth beget, neither is begotten: because that which doth beget is in very deed, distinguished from that which is begotten: now the divine essence, being but one, and most simple, it cannot be distinguished from it self.

The Son, is begotten of the essence of the Father: and hath the whole essence of the Father not by flowing from, neither by cutting out of the Father, neither by propagation, (for the essence of the Son, doth not flow from the essence of the Father, neither is it propagated or cut out of it) but by communicating. And the Son is not in deed the Son of himself, because he is the Son of the Father: yet notwithstanding he is God of himself, that is to say, that essence which is in the Son, is not of another, but of it self, seeing the essence of the Father, and the Son, is one and self same.

The essence of the Father, is of it self, without all beginning: but the essence of the Son, is the essence of the Father. For the Godhead, by which the Son is God, is that same by which the Father is God: therefore the essence of the Son is of it self and without beginning. Therefore Christ is God of himself. For except he be God of himself, he certainly cannot be God at all. For that he be God, God hath it of himself naturally. He cannot be God whose essence is not of it self.

But it is one thing for the essence to be begotten, and another thing to be begotten of the essence. The essence is not begotten of the essence, the essence is without generation. Therefore the Son also as he is God, is not begotten. But the Son is begotten of the essence of the Father. Wherefore Christ as he is God is of himself, as he is the Son, he is of the Father.

The holy Spirit is the third person in the Godhead, which proceedeth from the Father and the Son. John. 15.25.26. and 20.22. Rom. 8.9. Esa. 6.8.9. Acts. 28.25.26. &amp; 5.3.4. 1. Cor. 3.6. and 19.20. 2. Cor. 6.16.

Therefore God is one in essence. Exod. 3.14. Deut. 4.35. and 6.4. and 7.9. and 10.17. and 32.39. 1. Cor. 12.6. Gal. 3.20. Ephes. 4.6. 1. Tim. 2.5. But three in persons, whereupon we worship the reverend Trinity, or Trinity in unity. Genes. 1.26. and 18.2. 1. John. 5.7. Ephes. 2.18. Rom. 9 5. 1. Timot. 3.16. Acts. 5.3.4.</p></blockquote>

<blockquote><p>The Scriptures teach so frequently and so explicitly that the Son is God and eternal that to argue otherwise is to willfully ignore the clear light of evidence. Notable is Psalm 45, where, according to the Apostle in Hebrews 1, the Psalmist addresses Christ: &quot;Your throne, O God, is forever and ever; the scepter of your kingdom is a scepter of uprightness. You have loved righteousness and hated wickedness; therefore, God, your God, has anointed you with the oil of gladness beyond your companions.&quot; And in Isaiah 9:6, the Son is called &quot;Mighty God, Everlasting Father.</p></blockquote>

<blockquote><p>But that which abides always is certainly not changed, therefore if it suffers no change it is eternal. And so the Holy Spirit is eternal, but the creature is liable to fault, and therefore subject to change. But that which is subject to change cannot be eternal, and there cannot therefore be anything in common between the Spirit and the creature, because the Spirit is eternal, but every creature is temporal.</p></blockquote>

<blockquote><p>XIX. The glory of his Person may be considered, partly in reference to the divine nature; partly, to the human. The former is nothing else than a most illustrious assertion, vindication, and display of the Divine majesty of Christ, reflected from the glory of the human nature. During his abode on the earth, the Son of God had so concealed his glory under the vail of his humbled flesh, that only a few faint rays, despised by the generality of spectators, appeared. But now, in his glorified humanity, he shines forth like the sun, having, by his bright and exalted lustre, dispelled the clouds of his obscure and debased condition; and declares, in a striking and glorious manner, that the Son of man is the Son of God, and truly God. This was the matter of his request in the following solemn prayer: “And now, O Father, glorify thou me with thine own self, with the glory which I had with thee, before the world was.” That is, “Gloriously declare that I am thine eternal and only-begotten Son:”—which the Father has done chiefly by setting him at his right hand, as the place of the highest dignity and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser, vol. 2 (London: Khull, Blackie &amp; Co., 1823), 252.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XIX. The glory of his Person may be considered, partly in reference to the divine nature; partly, to the human. The former is nothing else than a most illustrious assertion, vindication, and display of the Divine majesty of Christ, reflected from the glory of the human nature. During his abode on the earth, the Son of God had so concealed his glory under the vail of his humbled flesh, that only a few faint rays, despised by the generality of spectators, appeared. But now, in his glorified humanity, he shines forth like the sun, having, by his bright and exalted lustre, dispelled the clouds of his obscure and debased condition; and declares, in a striking and glorious manner, that the Son of man is the Son of God, and truly God. This was the matter of his request in the following solemn prayer: “And now, O Father, glorify thou me with thine own self, with the glory which I had with thee, before the world was.” That is, “Gloriously declare that I am thine eternal and only-begotten Son:”—which the Father has done chiefly by setting him at his right hand, as the place of the highest dignity and glory.”

— Herman Witsius, Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed, trans. Donald Fraser, vol. 2 (London: Khull, Blackie &amp; Co., 1823), 252.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXIX.+The+glory+of+his+Person+may+be+considered%2C+partly+in+reference+to+the+divine+nature%3B+partly%2C+to+the+human.+The+former+is+nothing+else+than+a+most+illustrious+assertion%2C+vindication%2C+and+display+of+the+Divine+majesty+of+Christ%2C+reflected+from+the+glory+of+the+human+nature.+During+his+abode+on+the+earth%2C+the+Son+of+God+had+so+concealed+his+glory+under+the+vail+of+his+humbled+flesh%2C+that+only+a+few+faint+rays%2C+despised+by+the+generality+of+spectators%2C+appeared.+But+now%2C+in+his+glorified+humanity%2C+he+shines+forth+like+the+sun%2C+having%2C+by+his+bright+and+exalted+lustre%2C+dispelled+the+clouds+of+his+obscure+and+debased+condition%3B+and+declares%2C+in+a+striking+and+glorious+manner%2C+that+the+Son+of+man+is+the+Son+of+God%2C+and+truly+God.+This+was+the+matter+of+his+request+in+the+following+solemn+prayer%3A+%E2%80%9CAnd+now%2C+O+Father%2C+glorify+thou+me+with+thine+own+self%2C+with+the+glory+which+I+had+with+thee%2C+before+the+world+was.%E2%80%9D+That+is%2C+%E2%80%9CGloriously+declare+that+I+am+thine+eternal+and+only-begotten+Son%3A%E2%80%9D%E2%80%94which+the+Father+has+done+chiefly+by+setting+him+at+his+right+hand%2C+as+the+place+of+the+highest+dignity+and+glory.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Sacred+Dissertations%2C+on+What+Is+Commonly+Called+the+Apostles%E2%80%99+Creed%2C+trans.+Donald+Fraser%2C+vol.+2+%28London%3A+Khull%2C+Blackie+%26+Co.%2C+1823%29%2C+252.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39136277e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39136277e2.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/12/glory-unveiled/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>This righteousness then, which God communicates to man, and accepts alone, and owns as righteousness, has been revealed, he says, without the law, that is, without the aid of the law; and the law is to be understood as meaning works; for it is not proper to refer this to its teaching, which he immediately adduces as bearing witness to the gratuitous righteousness of faith. Some confine it to ceremonies; but this view I shall presently show to be unsound and frigid. We ought then to know, that the merits of works are excluded. We also see that he blends not works with the mercy of God; but having taken away and wholly removed all confidence in works, he sets up mercy alone. It is not unknown to me, that Augustine gives a different explanation; for he thinks that the righteousness of God is the grace of regeneration; and this grace he allows to be free, because God renews us, when unworthy, by his Spirit; and from this he excludes the works of the law, that is, those works, by which men of themselves endeavour, without renovation, to render God indebted to them. (Deum promereri—to oblige God.) I also well know, that some new speculators proudly adduce this sentiment, as though it were at this day revealed to them. But that the Apostle includes all works without exception, even those which the Lord produces in his own people, is evident from the context.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, trans. John Owen (Bellingham, WA: Logos Bible Software, 2010), 134.</span></figcaption>

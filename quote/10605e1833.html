<main class="wrap"><figure class="quote" id="q-10605e1833" data-kw="">
<blockquote><p>Although this epistle was written specifically to the Galatians, its teaching is relevant to all churches everywhere at all times. The doctrine of the gospel that it contains is universal, and Christ commanded it to be proclaimed to all nations throughout the world. But how can Paul call these congregations of the Galatians to whom he is writing “churches,” when they had been led astray by the false apostles and had turned away from Christ to rely on the merits of their works?

They are called churches either for the sake of those among the Galatians who continued to believe correctly about Christ, for even in the midst of ungodliness, God preserves in his church those seven thousand who have not bowed the knee to Baal, or because of the public ministry of the gospel and sacrament, which continued to function in the churches of Galatia.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio Epistolae Pauli ad Galatas</cite>, (Frankfurt, 1546). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

They are called churches either for the sake of those among the Galatians who continued to believe correctly about Christ, for even in the midst of ungodliness, God preserves in his church those seven thousand who have not bowed the knee to Baal, or because of the public ministry of the gospel and sacrament, which continued to function in the churches of Galatia.”

</figure><figure class="quote" id="q-b9aa2973f1" data-kw="">
<blockquote><p>But the chief thing is, that Christ, the Sun of Righteousness, has so irradiated your mind with the light of his Gospel, that you understand that the true way of governing the Church is no other than what is to be derived from him, and that you at the same time know the difference between that genuine form of religion which he has instituted, and that fictious and degenerate form which was afterwards introduced; for you wholly understand that God’s worship has been corrupted and deformed, as innumerable superstitions have crept in, that the grace of Christ has been unworthily involved in great darkness, that the virtue of his death has been annihilated, that he himself has been almost lacerated and torn in pieces, that assurance of salvation has been plucked up by the roots, that consciences have been miserably and even horribly vexed and tormented, that wretched men have been led away from the sincere and right worship of God into various and perplexed labyrinths, that the Church has been cruelly and tyrannically oppressed; and, in short, that no real Christianity has been left.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, trans. John Owen (Bellingham, WA: Logos Bible Software, 2010), xxii.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4122de5616" data-kw="">
<blockquote><p>…for when the Word determines not, conscience (though misinformed) casts the balance to the side which it judges to be necessary; As for instance, if a man think it a sin to hear the Word with the head uncovered, he is oblidged to cover his head, and contrarily; For conscience there casts the balance: but when the thing is unlawful on the matter, it may bind him up, while it remains in an error, so as he cannot without sin counteract its dictate; but it never oblidges him to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven upon Earth, in the Serene Tranquillity &amp; Calm Composure, in the Sweet Peace &amp; Solid Joy of a Good Conscience</cite>, ... (Edinburgh, 1685), sermon 2, on Acts 24:16, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3256f8381d" data-kw="">
<blockquote><p>…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (d. 1656; 1660), ‘The Women’s Vail: or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… upon 1 Cor. 11:10, Occasioned by an offence unjustly taken at a Modest Dress’, p. 237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;”

0their%20voices%20heard" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb9354003c" data-kw="">
<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul</cite>, ... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-584333870e" data-kw="">
<blockquote><p>Again there appeared unto me that Vein of Piety and spiritual Affection, Reverence unto God, and satisfaction in the things themselves pleaded about, as hath given me a great esteem of the Author as well as of his Work, though he be otherwise utterly unknown to me; and this respect was increased, when I found he was no Minister or Church-man, whose business it is or ought to be to enquire diligently into these things; but a Gentleman acted by a voluntary concernment in Truth and Piety. It would not be to the disadvantage of the Nation, or the Church of God in it, if we had more of that rank and quality alike able and alike minded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Preface to the Reader in Edward Polhill, The divine will considered in its eternal decrees, and holy execution of them. By Edward Polhill of Burwash in Sussex Esquire</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-217578419b" data-kw="">
<blockquote><p>When the Heretick willeth me to prove from Scripture that Christ is very man; it is a vain thing he should demand of me beside to prove by Scripture, that Christ is such a one also as can laugh, weep, admire, sing, sigh, &amp;c. for these are presupposed to follow man’s nature; and if Scripture prove Christ to be a true man, it presupposeth by nature’s light, that he can laugh, he can weep, and that in some time, some place, in some habit, in some gesture, so he be a man; for that is presupposed by the light of nature, and known by the most Barbarous who never heard of Scripture …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government and Excommunication: or a Peaceable Dispute for the Perfection of the Holy Scripture in Point of Ceremonies and Church Government</cite>, (London: John Field, 1646), 1.3, p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-8c9279c1c1" data-kw="">
<blockquote><p>20. There are so few Churches on earth that worship God without all set liturgies or forms as are next to none. And there are very few in all the world so good as the English liturgy and that have so few faults: which martyrs composed and joyfully used. And it is unchristian to renounce communion with any one Church for a reason that is common to all, or almost all, it being contrary to the communion of saints in one body, and [is] far worse than to slander any single man.</p></blockquote>

</figure><figure class="quote" id="q-eb7595389b" data-kw="">
<blockquote><p>Carnal sports and pleasures are as great a profanation of the sabbath, as the most servile labour and drudgery in the world. Dicing and card-playing do as much violate the law of the sabbath, as digging and carting; playing, as much as ploughing; dancing and morrice-games, as much as working in the smith’s forge; bowling and shooting, as well as hewing of wood and drawing of water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-1eb5a2a357" data-kw="">
<blockquote><p>But the reformation was not complete; the high places were not all taken away, though many of them were, 2 Chron. 15:3, 5. Those in the cities were removed, but not those in the cities of Judah, but not those in the cities of Israel which were reduced to the house of David; or those that were used in the service of false gods, but not those that were used in the service of the God of Israel. These he connived at, and yet his heart was perfect. There may be defects in some particular duties where yet the heart, in the man, is upright with God. Sincerity is something less than sinless perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible</cite>, on 2 Chron. 15, vv. 8-19</span></figcaption>

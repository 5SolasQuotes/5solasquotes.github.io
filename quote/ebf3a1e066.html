<blockquote><p>The statement of the question is not: (1) whether proper reverence and honor are due to the bread and the cup, the symbols of the Lord’s body and blood, both on account of the majesty of the author and the divinity of the things they seal and the excellent and singular use they have in religion, such as is legitimately exhibited to baptism and other rites and signs of religion. … However, we, although not denying that a proper reverence should be paid to the sacred symbol, do deny that the adoration which is due to the supreme God (usually designated by the Romanists as the worship of latria) should be paid to them. And although in one and the same celebration of the sacrament, they are made once and at the same time, still we think that they ought to be distinct the one from the other and unconfounded that we may not receive the signs for the things themselves; but may pay reverence to the signs indeed, but adoration to Christ alone. As in baptism of adults, the adoration of Christ (into whom they are initiated) and the reverence towards the water (the sacred symbol of the mystery) remain widely distinct… But we deny that on this account the sacrament itself should be adored; nay, we reject this worship as a most foul and detestable idolatry and bread-worship (artolatreian).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes 3.538-39</cite></span></figcaption>

med Books Online</a></div>

<blockquote><p>3. That God required not moral preparation in them for eating the Passover as he does in us before we eat the Lord’s Supper [as the congregationalists claimed], I conceive to be an untruth. 1. Because not to profane the holy things of God, and not to take God’s Law in their mouth and to hate to be reformed, Ps. 50:16, not to sacrifice with bloody hands, Isa. 1:11-12, etc. Ps. 50:8-10; Isa. 66:1, was moral, and did bind and oblige the Jews as they do us, and 2 Chron. 30:6, the posts are sent to gather the people to the Passover, charging them to turn to the Lord God of their fathers, not to be like their fathers; and it is clear by Hezekiah’s prayer, verses 18-19, ‘Good Lord pardon him that prepares his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary,’ verse 20, ‘And the Lord hearkened, and healed the people.’ Therefore, there was required a preparation of the heart for the right eating of the Passover, besides the typical and ceremonial preparation. Yea God counted the ceremonial preparation void of the moral preparation but abomination, as Isa. 66:1; Isa. 58:3-6 and Josiah’s Passover is commended from this, 2 Kings 23:22 (as Junius well observes) that none did with such care and zeal, as Josiah did prepare the priests, the people and himself for the passover, in removing all idolatry and abomination, and in renewing their covenant and resolution, verse 3, ‘to walk after the Lord and to keep his commandments with all their heart and with all their soul.’ 4. The unclean and uncircumcised in heart were no more members of the true and invisible Church of the Jews, and of Christ’s mystical body, his spouse, his royal generation, than Sodom and Gomorrah, Isa. 1:10, than the Ethiopians, Amos 9:7, than Ammon and Moah, Jer. 9:25-26, as in the New Testament, and the true invisible Church amongst them, as amongst us were kings and priests unto God, Ex. 19:5,9; Ps. 149:1, as we are, 1 Pet. 2:9-10; Rev. 1:5. 5. Amongst them no man could invade the priest’s office, or run unsent, no more than under the New Testament, Heb. 5:4; 1 Tim. 4:22, though they were to rebuke one another, Lev. 19, and they had sacrifices for sins of ignorance, Lev. 4:27… And a third step was excommunication and casting out of the synagogue after the captivity, which are the very degrees of our Church censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 2</cite>, pp. 190-91</span></figcaption>

<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>

<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>

</figure><figure class="quote" id="q-181b24d352" data-kw="">
<blockquote><p>Question 9 [to objectors]: Should we not in doubtful cases take the safer side? And is it not safer to do as Christ and his apostles and his Church for many hundred years did, than to follow the novelties of later times? Is it not certain that where there is no law, there is no transgression? and I know of no law binding us to receive kneeling: therefore for my part I cannot fear that Christ will condemn me for following his own, his apostles’ and his Church’s example, when he never gave me a word to the contrary. Objection: If Christ’s example bind to sit, then you must also imitate Him in doing it in an upper room, and but to twelve, etc. Answer: 1. This objection is nothing to our question. For we be not affirming that sitting is necessary, but that it is certainly lawful, and that kneeling is not such a duty, as that men should refuse communion with a church for want of it. 2. Both the known reasons of the thing, and the after practices of the Church do assure us that Christ’s administering in an upper room, and but to twelve, and not to women, were all occasional and mutable; and the Churches did otherwise: But for a feasting gesture there is no such proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, pp. 91-92</span></figcaption>

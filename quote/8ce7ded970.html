<main class="wrap"><figure class="quote" id="q-8ce7ded970" data-kw="">
<blockquote><p>The committee of the Assembly of Westminster, in their Reply to the Independents, said, If the Church impose anything that is sinful, we must forbear to comply, yet without separation, as was the practice of the puritans in the late times. As to the charge of schism, they admit that difference in judgment, in some particular points, is not schism; nor does an inconformity to some things enjoined deserve that name. But our [Independent] Brethren desire further to set up separate communions, which is a manifest rupture of our societies into others; and is therefore a schism in the Body. This is a setting up altar against altar, allowing our churches, as Independents do, to be true churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

<blockquote><p>…[After Bothwell in 1679] [Donald] Cargill received an urgent invitation from [Robert] M’Ward and Brown [of Wamphray] in Holland to go over and join them… he determined at once to accept. Apparently, however, there were others included in the invitation and time was pressing, for on receiving the letter Cargill wrote at once to Robert Hamilton, who was now in hiding in Galloway, to come to Edinburgh in all haste to meet him. Hamilton duly arrived, heavily disguised for fear of capture, and Cargill put the proposition to him. Hamilton, who was in daily danger of his life so long as he remained in the country, readily assented; and some time in mid-August he and Cargill appear to have left for Holland together.</p></blockquote>

</figure><figure class="quote" id="q-74159f9800" data-kw="">
<blockquote><p>And for my part this I say, and I say it with much integrity, I never yet took up religion by parties, in the lump; I have found by trial of things, that there is some truth on all sides. I have found holiness where you would little think it, and so likewise truth; and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion. My brethren, this rule that I have now mentioned (which I profess I have lived by, and shall do while I live), I know I shall never please men in it. Why? it is plain, For this is the nature and condition of all mankind; if a man dissents from others in one thing, he loses them in all the rest; and therefore if a man do take what is good of all sides, he is apt to lose them all, but he pleases Christ by it, and so will I for this particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, p. 559</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

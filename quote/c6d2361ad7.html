<main class="wrap"><figure class="quote" id="q-c6d2361ad7" data-kw="">
<blockquote><p>There are two sorts of persons who will find it harder to repent than others:

1. Such as have sat a great while under the droppings of God’s ordinances, but grow no better. The earth which drinketh in the rain, yet beareth thorns and briars, is nigh unto cursing (Heb. 6.8). The metal which hath lain long in the fire, but is not melted and refined, there is little hope of it. When God hath sent his ministers one after another, exhorting and persuading men to leave their sins, but they settle upon the lees of formality, and can sit and sleep under a sermon; it will be hard for these ever to be brought to repentance; they may fear lest Christ should say to them as once to the fig-tree, Never fruit grow on thee more.

2. They will find it harder to repent, who have sinned frequently against the convictions of the Word, the checks of conscience, and the motions of the Spirit. Conscience has stood as the angel, with a flaming sword in its hand; it has said, ‘Do not this great evil;’ but sinners regard not the voice of conscience, but march on resolvedly under the Devil’s colors: these will not find it easy to repent (Job 24.13). They are of those that rebel against the light. It is one thing to sin for want of light, and another thing to sin against light. Here the unpardonable sin takes its rise; first men sin against the light of conscience, and so proceed gradually to the despighting the Spirit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Repentance, Useful for These Times</cite>, (London: Printed by R.W. for Thomas Parkhurst, 1668), pp. 77-78</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-750827620a" data-kw="">
<blockquote><p>As to the term ‘regenerated’ or ‘born again’, I do not call one who is enlightened or breathed upon by any motion of the Holy Spirit, regenerated… I call him unregenerate who has not yet attained to this spiritual quickening, however he may have been affected by some preceding operations of the Holy Spirit. … We concede, then, to the Papists, that before the infusion of regenerating grace, many actions which lead the way to faith and contrition, are both required from men, and by them both can, and are wont [accustomed] to be done, through the sole assistance of awakening grace. Of this kind, are not only joining the Church and hearing the Word, but of thinking of God and divine things, considering their peculiar sins, being alarmed by the sense of them, desiring deliverance from this fear, and many other such like things, which are prerequisite to acts truly spiritual and saving. But we affirm, moreover, that the mind and disposition of the unregenerate is engaged in a natural way only with the aforesaid things; that the will is not elevated to produce an act truly spiritual, until regenerating or quickening efficacy shall have been added, besides, to the awakening and evidencing grace. (See Suarez, Opuscula, De Auxil.Div. Grat., bk. 3, chs. 1-2) Moreover, we grant that this regenerating grace is not infused into men remaining inactive and idling looking for some vague fervors or other; but to minds aroused, and brought under and disposed, in some measure, by the aforesaid actions, through the Word and Spirit of God; nevertheless, we deny that the free-will of an unregenerate man is assisted by these auxiliaries, in such was so to dispose itself that God should be bound to infuse quickening grace into any one from merit of congruity. Lastly, we confess that in the Church of God, where men are excited constantly by the Word and Spirit, this regenerating grace, which alone renders them capable of repenting and believing savingly, is denied to no adult of whom it cannot be truly said, that he willingly resists the Holy Spirit in those actions before-mentioned, and also perversely repulses the quickening operation of the same. (See Spalato, bk. 7, p. 239, &amp; Suarez, Opuscula, p. 222) Yet we deny that any mortal man can be found, who, in repelling the preparatory actions of the Spirit, does not incur, abundantly, this demerit; and, inasmuch as some, repelling God by this intervening, common demerit, are repelled of God and left to themselves; others, notwithstanding equal or greater demerit, are often, and more powerfully assailed by grace, and are at length quickened by the omnipotent operation of the Spirit. The mystery is to be referred to the gracious will of God, pitying or not pitying, and [is] not to be rashly enquired into by any human curiosity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, Question 9, ‘Free-Will is Not Granted unto the Unregenerate for their Spiritual Good’ in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846), pp. 265-66 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>

<blockquote><p>This question is rightly instituted to counter the unjust calumny of the Romanists, who defame us everywhere with the name of Solifidians, because we assert that we are justified by faith alone, as if we reject all dispositions for justification and all other preparatory works for justification… …we say that the said preparatory works are given [by God], that is, are prerequisite for justification, before God either forgives sins or accepts to life. For God does not justify any sinner living in the Church, but a sinner who believes with catholic Faith, fears punishment, hopes for pardon, loves and desires beatitude, loves God graciously inviting to salvation, acknowledges and condemns sins, is truly sorry for offending God, is weary of his former life, and pants for a new one. A sinner, unless he has been prepared and disposed by these previous arts, does not seek a physician, nor does he run and flee to Christ the Justifier and Savior, nor does he desire to flee… we demonstrate from the scriptures that this array of preparatory works is necessary.” – 32-33 Collinges, John – The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons… (London: 1646) 81 pp. This is excellent. Ambrose, Isaac – The Doctrine &amp; Directions but more especially the Practice &amp; Behavior of a Man in the Act of the New Birth… (London: 1650) Hooker, Thomas – multiple works Grebenitz, Elias – Disputation 3, ‘On Regeneration in General’ in ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), pp. 60-87 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt. Le Blanc de Beaulieu, Louis – Theological Theses Published at Various Times in the Academy of Sedan 3rd ed. tr. by AI by Colloquia Scholastica (1675; London, 1683) Latin Whether sufficient grace for conversion and avoiding sins is given to all men? 291-97 … Necessity of grace for fallen nature for salvific good and true piety: Roman doctrine 847 . pt. 2, Protestants’ doctrine compared with Roman 859 Whether man, in a state of sin, can prepare and dispose himself for grace by his natural powers alone 867 . pt. 2, Roman school 879 . pt. 3, Protestant and Roman opinions are compared 891-906 Le Blanc (1614-1675) was a reformed professor of theology at Sedan. . 1700’s de Moor, Bernard – Continuous Commentary on John Marck’s Didactic-Elenctic Compendium of Christian Theology Buy (1761-1772), ch. 2, Scripture Theological Disputation on Eph. 5:14, “Wherefore he saith, Awake thou that sleepest, and arise from the dead, and Christ shall give thee light.</p></blockquote>

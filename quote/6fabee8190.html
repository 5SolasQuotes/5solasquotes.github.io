<main class="wrap"><figure class="quote" id="q-6fabee8190" data-kw="">
<blockquote><p>It should be noted that assumption and hypostatic union are not the same thing. Assumption speaks of the action in the agent assuming and the passion in the patient assumed. Union implies the relationship that follows from this. To be united may be said equally of the divine and human natures in the incarnate Word; but to assume actively is said only of the Word’s divine nature, and to be assumed is said only of the human nature. It cannot be said of the Word’s divinity that it is assumed, though it can be said that it is united. Thus, assumption and hypostatic union do not have the same meaning. Assumption, considered actively and passively, is what establishes the hypostatic union as a consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dolezal.html">James Dolezal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’Neither Subtraction, Nor Addition</cite>, vol. 20, no. 1 (Winter, 2022), fn. 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0985b8d1c9" data-kw="">
<blockquote><p>As God raised Christ from the dead and set him at his own right hand in heavenly places; so you, that were dead in sins, hath he quickened and raised you up together in him. This analogy is the very thing he would have them understand. They had undergone a great change; they had been brought to life; they had been raised from the dead by the same almighty power which wrought in Christ. There was as great a difference between their present and their former condition, as between Christ in the tomb and Christ at the right hand of God.</p></blockquote>

</figure><figure class="quote" id="q-ed50f0f0ca" data-kw="">
<blockquote><p>Objection: If Christ as God-man be Mediator, then the divine nature subsisting in the relation of the Son, received the Office of Mediator, and consequently something may be added to God, but nothing can be added to God because He is perfection itself? Answer: The divine nature received not the office as considered in itself, but in respect of its voluntary dispensation, as accepting of subsistence with the human nature, i.e. Christ received and sustained the Office of Mediatour, not as God alone, nor as man alone, but as God-man: the divine nature in respect of its voluntary dispensation: the human nature properly. To the divine nature there is not anything added, only a relation: but to the human nature there is added a real change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clarke.html">Samuel Clarke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla Theologiæ</cite>, (London, 1659), ch. 29, ‘Questions &amp; Cases of Conscience about Christ’, p. 294</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-e7069eb1a8" data-kw="">
<blockquote><p>The person of the Word subsists in two natures: in one, from which he has first esse, and in another (as it were adventitious) from which he has second esse, just as if Socrates were said in some way to subsist in humanity and whiteness. But… it is not generally held that the person of Christ is composed, speaking properly of composition, that is, from act and potency (as from matter and form), or from two potentialities (such as are those things which are called by Aristotle elements that integrate a whole nature). Therefore the authoritative texts of Damascene, which speak of the person as composed, should be expounded by saying that both divine and human natures are as truly there as if they were to compose a person, but without confusion, so that there is no third thing from them, since they do not make a composition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as trans. Richard Cross, Union &amp; Communion | p. 14, from Ord. III, d. 6, q. 1, n. 26</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

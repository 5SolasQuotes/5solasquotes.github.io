<main class="wrap"><figure class="quote" id="q-1559f0031b" data-kw="">
<blockquote><p>Such mockers there were in the time of saint Peter, against whom he speaks in his second epistle, and third chapter… Say the mockers, ‘There shall be no judgment.’ ‘There shall,’ says the apostle. How can that be? Have not all things continued as they were, since the begining of the Creation for so many thousand years?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Threnoikos, the House of Mourning, Furnished with Directions for the Hour of Death… (London, 1660) | Sermon 1</cite>, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is written by Moses in the First &amp; Second Chapters of Genesis... (London, 1641)</cite>, ch. 2, p. 25</span></figcaption>

</figure><figure class="quote" id="q-1fa55170b9" data-kw="">
<blockquote><p>Conservation, as it is here understood, is defined as the action by which a being from-another remains in the existence it has received. It is double, namely: a) Negative, or the action by which what can destroy the existence of the thing is removed or impeded. Penicillin, for example, which destroys bacteria, conserves the health of the body; b) Positive is the act that consists in the positive inflow by which a thing is continually given existence. Hence it is a sort of continued creation. Conclusion 24: All created things are positively conserved in existence by God. Whatever does not have in itself a reason for its existence positively requires, if it remains in existence, a cause of its remaining in existence. But there cannot be an infinite regress in conserving causes, because such causes need to exist simultaneously; therefore the thing is conserved positively by God as first cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-bd85ce9c97" data-kw="">
<blockquote><p>But to the contrary: 1. First it is argued through the text of Genesis, where it is said that through the space of six days [sex dierum spatium] the Lord completed the work that was begun. Therefore it is seen that the underlying matter was not produced in perfect actuality, according to the judgment of sacred Scripture.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<main class="wrap"><figure class="quote" id="q-98e33e6fa9" data-kw="" data-pol="">
<blockquote><p>For what is idolatry if it is not to worship the gifts instead of the giver? Here the sin is twofold. The honour robbed from God is transferred to the creature, and God, moreover, is dishonoured by the pollution and profanation of his own goodness, while his holy sacrament is converted into an execrable idol.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.17.36</figcaption>

<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, pp. 197–198</figcaption>

</figure><figure class="quote" id="q-89510b8bf5" data-kw="" data-pol="">
<blockquote><p>So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 59</figcaption>

</figure><figure class="quote" id="q-19a2e6f8a1" data-kw="" data-pol="">
<blockquote><p>What remains but for the blind to see, the deaf to hear, children even to perceive this abomination of the mass, which, held forth in a golden cup, has so intoxicated all the kings and nations of the earth, from the highest to the lowest; so struck them with stupor and giddiness, that, duller than the lower animals, they have placed the vessel of their salvation in this fatal vortex. Certainly Satan never employed a more powerful engine to assail and storm the kingdom of Christ.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.18.18</figcaption>

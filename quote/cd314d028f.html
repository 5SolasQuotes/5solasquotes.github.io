<main class="wrap"><figure class="quote" id="q-cd314d028f" data-kw="">
<blockquote><p>Job, when God visited him, desired to know wherefore God contended with Him: it is a sad thing to lie drowned under unknown and fatherless plagues, we being ignorant of the causes of God’s judgement; so we suffer blind crosses like the ox that bears the yoke and knows nothing of the art of husbandry [farming], or the horse killed in the battle, and yet is ignorant of State-affairs, and of the causes of war, and of disorders in Laws, Liberties, Religion in State and Church, we are like one smitten in the dark night by a spirit or a ghost, but he sees not who strikes. Oh it were good we would inquire, as the prophet does, Isa. 42:24, “Who gave Jacob for a spoil, and Israel to robbery?” and wherefore is all this come on us? why doth the Lord contend with us? O make us know our iniquities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached before the Right Honorable House of Lords, in the Abbey Church at Westminster, Wednesday the 25th day of June, 1645. Being the day appointed for a solemn and public humiliation.</cite>, p. 45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-afafab548b" data-kw="">
<blockquote><p>Such as stand against a strong and mighty tentation [trial], being pressed out of measure, above strength, as Paul was (2 Cor. 1:8-9) insomuch (saith he) that we despaired even of life. But we had the sentence of death in ourselves, do prevail to the being taught of God, not to trust in ourselves, but in God who quickens the dead: For here there comes real strength from fighting: As he who, by strength of nature, lives and convalesceth after a running botch and strong pestilence, goes through pest-houses [asylums for plague victims] and is never infected again. So the worthies by faith who overcame strong temptations (Heb. 11 to the end), keep the fields and prevail till death.</p></blockquote>

</figure><figure class="quote" id="q-139d516bd3" data-kw="">
<blockquote><p>Whereas some object that the care both of temporal good and spiritual good belongs to the magistrate, therefore he must have a power to make Church laws. See [David] Pareus. For his care cannot be supreme, if he must rule at the nod and beck of Church-men. I Answer, the connection is weak: he who has the care of both the temporal and spiritual good of the people, he has a nomothetic [law-making] power to procure both these two goods: it follows [in] no way, for then might he have a power in his own person to preach, and administrate the sacraments; this power [of the magistrate] procures the spiritual good, but such as is the care, such is the power: the care is politic and civil; Therefore the power to procure the spiritual good, must bee politic and civil [circa sacra, not in sacra].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), Appendix</cite>, pp. 442-3</span></figcaption>

</figure><figure class="quote" id="q-8ddfaddc4a" data-kw="">
<blockquote><p>He that being in health or [is] sick, shall contemn physic, let him be condemned of stubbornness and counted as an heretic: unto whom also afterwards, less benefit and duty is due from others; nay, he shall be counted unworthy [of] the fellowship of citizens. For he has tempted God and with the rebellious Jews required miracles, when as without miracles he might have had experience of the grace of God. Whosoever shall affirm that it is lawful for Christians in the time of the plague, without a lawful cause and consent of the rulers, to leave his city and church, he is worthy [of] the name of a schismatic… And he that shall hold every plague to be as an immediate punishment from God, is to be condemned of ignorance and to be despised as an evil speaker: as one that lays upon God his own rashness and blame of his own reckless negligence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books (London, 1583), bk. 2, ch. 9</cite></span></figcaption>

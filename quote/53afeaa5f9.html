<main class="wrap"><figure class="quote" id="q-53afeaa5f9" data-kw="">
<blockquote><p>At the beginning of the human race that old serpent led humanity away from the word of the law, and thus from the covenant of creation by a false interpretation. . . . The summary of this law shining forth in the image of God was that he love the Lord his God with all his heart . . . and as a testimony of this love refrain from eating from the one tree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, 2.27; Geneva, 1585.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>As it is of the law of nature that, in general, a due proportion of time be set apart for the worship of God; so, in his Word, by a positive, moral, and perpetual commandment, binding all men in all ages, he hath particularly appointed one day in seven for a Sabbath, to be kept holy unto him:a which, from the beginning of the world to the resurrection of Christ, was the last day of the week; and, from the resurrection of Christ, was changed into the first day of the week,b which in Scripture is called the Lord’s day,c and is to be continued to the end of the world, as the Christian Sabbath.d a. Exod 20:8, 10-11; Isa 56:2, 4, 6-7. • b. Gen 2:2-3; Acts 20:7; 1 Cor 16:1-2. • c. Rev 1:10. • d. Exod 20:8, 10 with Mat 5:17-18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 21.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that: 1. God’s power makes it possible for all things to be. 2. Next God knows them possible. 3. He knows what is convenient or fit to be made to his unsearchable ends. 4. He wills that they shall be, and man among the rest, and so on.</p></blockquote>

<blockquote><p>the Chaldeans are daily refuted. How many things I remember being said by the Chaldeans to Pompey, how many to Crassus, how many to Caesar himself; that none of them would die except in old age, except at home, except with clarity, so that it seems very strange to me that anyone still exists who believes those whose predictions he sees refuted daily by fact and events”; yet all of these were taken away by a violent death, which is confirmed by the examples of Julian the Apostate, Ludovico Sforza, Prince of Milan, Edward VI, King of England, the son of Cardanus, and others, to whom things far different from what had been predicted happened. Hence 10 emperors, princes, and lawgivers have forbidden this art of divining from the stars, and wise men and the fathers have disapproved of it. Maecenas, in Dio, bk. 52, Oration to Augustus, said that “diviners should not be tolerated in a republic.” Augustus expelled the astrologers from the city, Tiberius and Claudius from Italy; Vitellius also severely judged that they should be deprived of the world and of life. See Code, bk. 9, Tit. 18; bk. 2, 5, 7, and Tacitus, bk. 2, Annals, ch. 32, in whose judgment, “mathematicians are a race of men untrustworthy to the powerful, deceitful to the hopeful: which in our state will always be both forbidden and retained.” Cf. Valerius Maximus, bk. 1, ch. 3; Curtius, bk. 4, ch. 10; bk. 7, ch. 7. If an event has corresponded to some predictions, this should be attributed either to the shrewdness of the diviners, who had knowledge of the morals, counsels, and studies of those consulting them; or to the credulity of those consulting, who have turned fortuitous chances into the fulfillment of the thing predicted; or to the work of the devil, from whose suggestion or inspiration such prophets can draw many things; or to the just judgment of God, who chastises the vain minds of men with those mockeries, and permits the superstition of men to feel the scourge of Satan.</p></blockquo

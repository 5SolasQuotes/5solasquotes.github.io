<blockquote><p>The overall chain of argument, then, goes something like this: Pure reason proves through philosophical arguments that there is a God and that we have immortal souls. This by itself entails that a miracle like a resurrection from the dead is possible. Now the historical evidence that Jesus Christ was in fact resurrected from the dead is overwhelming when in interpreted in light of that background knowledge. Hence pure reason also shows that Jesus really was raised from the dead. But Jesus claimed to be divine, and claimed that the authority of his teachings would be confirmed by His being resurrected. So the fact that He was resurrected provides divine authentication of His claims. Hence reason shows that He really was divine… Of course some of those teachings [of Christ] are taken on the basis of authority, but the point is that the trustworthiness of that authority is something that, it is claimed, can be established by reason.. We can know such-and-such a teaching was true because Christ taught it… and a divine being cannot be in error… Every link in the chain is supported by argument… All I am interested in doing here is sketching out the general strategy that Christian theology has traditionally used in justifying its doctrinal claims, and the point of doing so is to understand where faith fits into the picture… So how does it come into play? This way… suppose that the general strategy just sketched can be successfully fleshed out. Then it follows that if you are rational you will believe anything Christ taught; indeed, if you are rational you will believe it even if it is something that you could not possibly have come to know in any other way, and even if it is something highly counterintuitive and difficult to understand. For reason will have told you that Christ is infallible, and therefore cannot be wrong in anything He teaches. In short, reason tells you to have faith in what Christ teaches, because He is divine. And that is at bottom what faith is from the point of view of traditional Christian theology: belief in what God has revealed because if God has revealed it it cannot be in error; but where the claim that He revealed it is itself something that is known on the basis of reason. Faith doesn’t conflict with reason, then; it is founded on reason and completes reason.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d69247320" data-kw="">
<blockquote><p>Similarly, the soul of a man isn’t a complete substance; only the soul and body (i.e. the form and matter) together constitute a thing or substance, that is, a man. It isn’t the soul that thinks when a man uses his intellect; it is the man himself who thinks, just as it is the man himself, and not the soul, who grows taller, digests his food, and walks around. For this reason, it is not at all surprising that human thought should be very closely correlated with certain brain events even if it is not identical to any of them. Since the soul is the form of the body, including the brain, the connection between them is in many ways like the connection between the form of the some particular table–its round shape, its having four legs, its being brown, etc.–and the matter that make up the table; that is, it i bound to be very close indeed. When the intellect determines that a certain course of action is the best one to take and the will follows it, the body proceeds to move in a way that constitutes the action. The operation of intellect and will constitute in this case is the formal-cum-final caue of the action, of which the firing of the neurons, flexing of the muscles, etc. are the material cause. Then there is the fact that even though the intellect itself operates without any bodily organ, it does depend indirectly on the senses for the raw material from which it abstracts universals or essences (e.g. it abstracts the universal ‘triangularity’ from particular triangles it has perceived). And the sense organs, along with the brain events associated with perceptual experiences, are material. But precisely because the operation of the intellect are not directly dependent on the matter of the brain, the parallel with the form of a table is not exact. If the soul can, unlike the form of a table, function apart from the matter it informs (as it does in thought), then it can also, and again unlike the form of a table, exist apart from the matter it informs, as a kind of incomplete substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism (South Bend, Indiana: St. Augustine’s Press, 2008), ch. 4, ‘The Soul’</cite>, p. 127</span></figcaption>

</figure><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>

<blockquote><p>Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-heider.html">Daniel Heider</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universals in Second Scholasticism: A Comparative Study with Focus on the Theories of Francisco Suárez S.J. (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.”

— Daniel Heider, Universals in Second Scholasticism: A Comparative Study with Focus on the Theories of Francisco Suárez S.J. (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPart+of+Heider%E2%80%99s+project+is+to+argue+that+Su%C3%A1rez+was+in+fact+a+moderate+realist%2C+despite+widespread+characterizations+of+him%2C+both+by+his+immediate+successors+and+by+recent+scholars%2C+as+essentially+a+nominalist.+Such+characterizations+gain+strength+from+Su%C3%A1rez%E2%80%99s+own+statement+that+he+perhaps+differed+from+the+nominalists+only+modo+loquendi+%2897%29.+Heider%2C+however%2C+argues+that+it+makes+more+sense+to+regard+Su%C3%A1rez+as+a+moderate+realist%2C+of+broadly+the+same+stripe+as+Poinsot%2C+Mastri%2C+and+Belluto.+It+is+not+always+entirely+clear%2C+though%2C+wherein+Heider+disagrees+with+other+commentators.+Do+they+offer+substantively+different+interpretations+of+Su%C3%A1rez%2C+or+are+they+using+different+taxonomies%2C+with+more+or+less+strict+usages+of+the+term+%E2%80%9Cnominalist%3F%E2%80%9D+In+particular%2C+it+is+worth+noting+that%2C+if+the+crude%2C+but+widely+used%2C+division+between+realism+and+nominalism+is+employed%2C+moderate+realism+is+a+species+of+nominalism%2C+rather+than+the+realism+its+name+suggests.+The+great+strength+of+this+book+is+Heider%E2%80%99s+masterful%2C+detailed+examination+of+three+representative+accounts+from+sixteenth-+and+seventeenth-century+Scholasticism.+Su%C3%A1rez+offers+an+original+blend+of+Thomist%2C+Scotist%2C+and+nominalist+elements%3B+Poinsot%E2%80%99s+account+is+more+purely+ad+mentem+Thomi%2C+while+Mastri+and+Belluto+take+an+approach+ad+mentem+Scoti.+Of+course%2C+there+were+other+streams+of+thought+in+the+period%2C+but+Heider+reasonably+takes+these+to+be+th

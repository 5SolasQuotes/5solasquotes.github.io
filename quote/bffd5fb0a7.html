<main class="wrap"><figure class="quote" id="q-bffd5fb0a7" data-kw="" data-pol="">
<blockquote><p>Thus, when the Pope usurps the triple office of Christ, he destroys Christ’s gospel by his own traditions, also destroying Christ’s redemption by his own indulgences, purgatory, masses, and rewards; all this while verbally professing Jesus to be the Christ. Notwithstanding his profession, he must be regarded as having denied Christ, together with the Father, by his very deeds and works.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 58</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/person-of-christ/prophet-priest-king.html">Prophet, Priest &amp; King</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c93bf87ff0" data-kw="" data-pol="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>
<figcaption>— <a href="../authors/louis-berkhof.html">Louis Berkhof</a>, <cite>Systematic Theology</cite>, Part Five, The Doctrine of the Church, ch. III (Government of the Church)</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/scripture/authority.html">Authority</a><a class="tag" href="../topics/church/government.html">Government</a></div>

<figcaption>— <a href="../authors/william-tyndale.html">William Tyndale</a>, <cite>Foxe&#x27;s Book of Martyrs</cite>, ch. 12 (as reported by John Foxe)</figcaption>

</figure><figure class="quote" id="q-dc860b657c" data-kw="" data-pol="">
<blockquote><p>If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/salvation/justification.html">Justification</a></div>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="" data-pol="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.7.24</figcaption>

<blockquote><p>…when I preached at court before the [English] Queen’s majesty, and was speaking about the antiquity of the popish religion, I remember that I said this among other things, that our enemies, when they accuse our cause of novelty, both wrong us and deceive the people; for that they approved new things as if they were old and condemned as new things of the greatest antiquity; that their private masses and their mutilated communions, and the natural and real presence and transubstantiation, etc. (in which things the whole of their religion is contained) have no certain and express testimony either of holy scripture or ancient councils, or fathers, or of anything that could be called antiquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To H. Bullinger &amp; Lavater</cite>, (1566) in The Zurich Letters… (Parker Society, 1846), p. 207</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8424af3a24" data-kw="">
<blockquote><p>Do you think that the Supper of the Lord ought to be celebrated in any other place than in the common and public congregation? Answer: This was a custom in the beginning of the old Church, that the sacrament should be sent by deacons to the sick that were absent from the public meeting, that is to say, at that time that the mysteries were celebrated of the rest in that meeting, because it was meet that those whom one disease did let [prevent] to be present in body, should be accompted as if they were present: neither do I doubt but that that thing brought great comfort to those that were sick, the which custom I would very gladly [wish it] were restored. But whether it be meet to be celebrated to the sick at that time when the Supper of the Lord is not ministred in the Church, of this I greatly doubt. … Notwithstanding I do acknowledge that in this case it is somewhat diverse. For although it were very meet that these mysteries throughout [the] whole [of] Christendom, albeit in diverse places, yet notwithstanding daily also if it were possible, or at least upon appointed and set days were celebrated, which should profit very much to the witnessing of that same mutual fellowship and consolation in Christ: notwithstanding forasmuch as neither of both can be obtained for many just and necessary causes it seems, I know not in what sort to be contrary to the institution of the Supper of the Lord, that all the rest of the Church omitting it, some one house extraordinarily should celebrate those mysteries. Moreover, unless that were done amongst all those that were sick, how shall the suspicion of partiality in respecting of persons be shunned? Now if the Supper of the Lord be to be ministered amongst all that are sick, let pastors see by what means the profanation thereof may be avoided and how they may satisfy and undergo so great labors. The custom therefore of certain [persons] do nothing at all [to] move me, although that it be very ancient, because the matter is to be judged not by examples, but by reasons… But if a man think that he can shun all these inconveniences, and think that those mysteries may be ministred to a sick man in the congregration, he requiring it, upon these conditions I would not be against this custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Other Part of Christian Questions &amp; Answers, which is concerning the Sacraments</cite>, Question 242, ‘Of the Celebration of the Supper of the Lord in Private Houses besides the Time of the Ecclesiastical Meeting’ in The Other Part of Christian Questions &amp; Answers, which is Concerning the Sacraments (London, 1580), no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-27784aaa36" data-kw="">
<blockquote><p>When you [congregationalists] say that ‘a seal does not make a thing that was not, but confirm a thing that was,’ while you would seem to refute Papists, who vainly teach that sacraments do confer grace ex opere operato, by the deed done, yet do you make the sacrament but a naked sign and take part with Arminians and Socinians, whose very arguments in express words you use, for Socinius goes before you in this argument, and so does Smalcius follow him: ‘To obsignation and sealing there is required the trying of the thing, and some teaching or document; but that ceremony (a baptism) and that rite, though it be holy, does nothing to the remission of sins, but it does only shadow out, and as it were delineate and point forth remission of sins by the washing of water exponed in the Word of God.’ You say, ‘Sacraments do not make a thing that was not, but confirm a thing that was before;’ you can have no other meaning than to deny all causality and all real exhibition of grace in the sacraments: for if a sacrament make not a thing that was not before, or if God give not, and really produce, confer and exhibit grace, and a stronger measure of faith, and assurance of remission of sins, at the due and right use of the sacrament [that is with faith], the Sacrament is a naked sign, and not an exhibitive seal. But if† Christ give and in the present exhibit as surely remission of sins, as the infant is washen with water, as our divines and the Palatinate [Heidelberg] Catechism teaches, yea and the [Belgic] confession thereof, and the Synod of Dort teaches, then by the sacrament of baptism, a thing is made that which it was not. † [That is, this does not necessarily always occur, but if it does, then etc.] It is true a civil seal, as I said before, adds no new lands to the owner of the charter, but if Christ by his seals rightly and in faith used, do not only confirm grace and pardon, but also really exhibit and give grace and pardon in a further degree, and a new measure of assurance to the conscience which there was not before, you go not a streas [star’s?] breadth from Arminians and Socinians, especially seeing Episcopius, Henricus Welsingius say that remission of sins is not sealed by baptism, but signified only, and the Remonstrants in their Apology, while they expone our communion with Christ in the Lord’s Supper, and will reject a physical union of our souls with the physical substance of Christ’s body, which we also reject, they say that communion signifies, ‘only a profession of one and the same worship, whereby Christians solemnly testify that they adhere to Christ as to be partaker of the table of devils and of devils themselves, 1 Cor. 10:18,20, is a testimony of a communion with the devils’: But the Word of God says more, Gal. 3:17, ‘As many of you as are baptized have put on Christ;’ So Rom. 6:3, ‘Therefore we are buried with Him by baptism unto his death, that like as Christ was raised up from the dead, by the glory of the Father, even so we also should walk in newness of life,’ Eph. 5:26, ‘That He might sanctify and cleanse his Church with the washing of water by the Word,’ Tit. 3:5, and 1 Pet. 3:21, ‘The like figure whereunto even baptism does also now save us, etc.’ All this is more than a naked signification, otherwise manna saved Israel, and the water of the rock did wash them from their sins, and the sacrifice of bulls and goats did cleanse from sin, and open Heaven to sinners. Therefore by baptism and the Lord’s Supper something is made what it was not before, as by partaking of the table of devils, the partaker is really made a partaker with the devil, and an idolater; and his idolatry that he committed before was not only confirmed and signified to be what it was before. And in this civil seals and sacraments differ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 2, ch. 4, section 5, pp. 216-18</span></figcaption>

s+not+necessarily+always+occur%2C+but+if+it+does%2C+then+etc.%5D+It+is+true+a+civil+seal%2C+as+I+said+before%2C+adds+no+new+lands+to+the+owner+of+the+charter%2C+but+if+Christ+by+his+seals+rightly+and+in+faith+used%2C+do+not+only+confirm+grace+and+pardon%2C+but+also+really+exhibit+and+give+grace+and+pardon+in+a+further+degree%2C+and+a+new+measure+of+assurance+to+the+conscience+which+there+was+not+before%2C+you+go+not+a+streas+%5Bstar%E2%80%99s%3F%5D+breadth+from+Arminians+and+Socinians%2C+especially+seeing+Episcopius%2C+Henricus+Welsingius+say+that+remission+of+sins+is+not+sealed+by+baptism%2C+but+signified+only%2C+and+the+Remonstrants+in+their+Apology%2C+while+they+expone+our+communion+with+Christ+in+the+Lord%E2%80%99s+Supper%2C+and+will+reject+a+physical+union+of+our+souls+with+the+physical+substance+of+Christ%E2%80%99s+body%2C+which+we+also+reject%2C+they+say+that+communion+signifies%2C+%E2%80%98only+a+profession+of+one+and+the+same+worship%2C+whereby+Christians+solemnly+testify+that+they+adhere+to+Christ+as+to+be+partaker+of+the+table+of+devils+and+of+devils+themselves%2C+1+Cor.+10%3A18%2C20%2C+is+a+testimony+of+a+communion+with+the+devils%E2%80%99%3A+But+the+Word+of+God+says+more%2C+Gal.+3%3A17%2C+%E2%80%98As+many+of+you+as+are+baptized+have+put+on+Christ%3B%E2%80%99+So+Rom.+6%3A3%2C+%E2%80%98Therefore+we+are+buried+with+Him+by+baptism+unto+his+death%2C+that+like+as+Christ+was+raised+up+from+the+dead%2C+by+the+glory+of+the+Father%2C+even+so+we+also+should+walk+in+newness+of+life%2C%E2%80%99+Eph.+5%3A26%2C+%E2%80%98That+He+might+sanctify+and+cleanse+his+Church+with+the+washing+of+water+by+the+Word%2C%E2%80%99+Tit.+3%3A5%2C+and+1+Pet.+3%3A21%2C+%E2%80%98The+like+figure+whereunto+even+baptism+does+also+now+save+us%2C+etc.%E2%80%99+All+this+is+more+than+a+naked+signification%2C+otherwise+manna+saved+Israel%2C+and+the+water+of+the+rock+did+wash+them+from+their+sins%2C+and+the+sacrifice+of+bulls+and+goats+did+cleanse+from+sin%2C+and+open+Heaven+to+sinners.+Therefore+by+baptism+and+the+Lord%E2%80%99s+Supper+something+is+made+what+it+was+not+before%2C+as+by+partaking+of+the+table+of+devils%2C+the+partaker+is+really+made+a+partaker+with+the+devil%2C+and+an+idolater%3B+and+his+idolatry+that+he+committed+before+was+not+only+confirmed+and+signified+to+be+what+it+was+before.+And+in+this+civil+seals+and+sacraments+differ%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%28London%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+section+5%2C+pp.+216-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27784aaa36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27784aaa36.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=When%20you%20%5Bcongregationalists%5D%20say%20that%20%E2%80%98a,this%20civil%20seals%20and%20sacraments%20differ&amp;text=When%20you%20%5Bcongregationalists%5D%20say%20that%20%E2%80%98a%20seal%20does&amp;text=And%20in%20this%20civil%20seals%20and%20sacraments%20differ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

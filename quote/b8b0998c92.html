<main class="wrap"><figure class="quote" id="q-b8b0998c92" data-kw="">
<blockquote><p>amor Dei: the love of god; i.e., both the love of creatures for God and the divine attribute of love… Considered as a divine attribute, the amor Dei can be defined as the propensity of the divine essence or nature for the good, both in the sense of God’s inward intrinsic, benevolentia, or willing of the good, and in the sense of God’s external, extrinsic, beneficentia, or kindness, toward his creatures… the amor Dei communis is directed toward all human beings, both elect and reprobate, and is manifest in the blessings, or benefits (beneficia), of God… the amor Dei communis is understood to be benevolentia in the strict sense of goodwill toward human beings…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker Academic, 2017), pp. 31-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a31fa81a8b" data-kw="">
<blockquote><p>God wills not only Himself, but other things apart from Himself. This is clear from the comparison which we made above (A. 1). For natural things have a natural inclination not only towards their own proper good, to acquire it if not possessed, and, if possessed, to rest therein; but also to spread abroad their own good among others, so far as possible. Hence we see that every agent, in so far as it is perfect and in act, produces its like. It pertains, therefore, to the nature of the will to communicate as far as possible to others the good possessed; and especially does this pertain to the divine will, from which all perfection is derived in some kind of likeness. Hence, if natural things, in so far as they are perfect, communicate their good to others, much more does it appertain to the divine will to communicate by likeness its own good to others as much as possible. Thus, then, He wills both Himself to be, and other things to be; but Himself as the end, and other things as ordained to that end, inasmuch as it befits the divine goodness that other things should be partakers therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 19 | art. 2, Whether God wills things apart from Himself?, I answer that</span></figcaption>

</figure><figure class="quote" id="q-c201986fef" data-kw="">
<blockquote><p>I believe it is the duty of every minister of Christ plainly and faithfully to preach the gospel to all who will hear it; and as I believe the inability of men to do spiritually good things to be wholly of the moral, and therefore of the criminal kind and that it is their duty to love the Lord Jesus Christ and trust in Him for salvation, though they do not; I therefore believe free and solemn and solemn addresses, invitations, calls, and warnings to them to be not only consistent, but directly adapted, as means, in the hand of the Spirit of God, to bring them to Christ. I consider it as part of my duty which I could not omit without being guilty of the blood of souls.</p></blockquote>

<blockquote><p>As the term God is more distinctly expressive of majesty, so the term ‘Father’ conveys the idea of clemency and benevolent disposition. It becomes us to contemplate both as existing in God, that his majesty may inspire us with fear and reverence, and that his fatherly love may secure our full confidence. Hence it is not without good reason that Paul has conjoined these two things… At the same time there will be no inconsistency in saying, that he contents himself with the single term, ‘Father’. Farther, as it is necessary that his incomparable grace should be expressed by the term ‘Father’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, 1:12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>This work is important as it was the first commentary on the Westminster Confession, and from its same generation. When it was printed is significant. Dickson died in 1662, when the anti-presbyterian Charles II was king. The work was first printed (in a pirated form) in 1684, in the midst of the Killing Times. While not seeking to draw too much from this, yet it does give support that the generation of Westminster divines did not understand their Confession’s teaching on upholding the validity of the rule of non-Christians, or those of different religions, as only applicable to non-Christian, non-covenanted nations, but rather that it applied to their own Christian and covenanted nations of their time (England and Scotland).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Intro</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc45fd21f5" data-kw="">
<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>

<blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

<blockquote><p>My arguments against the derivation of magistracy from Jesus Christ as Mediator, and against the magistrate’s holding of his office of and under Christ as Mediator, are these: First, this doctrine does evacuate and nullify the civil authority and government of all heathen or pagan magistrates; for which way was the authority of government derived from Christ, and from Him as Mediator, to a pagan magistrate or emperor? If he has not his power from Christ, as Mediator, then He is but a usurper, and has no just title to reign, according to their principles, who hold that all government, even civil, is given to Christ, and to Him as Mediator. Mr. Hussey, forsooth, does learnedly yield the argument, and answers, p. 20, that not only it is a sin to be a heathen, but the government of a heathen is sinful and unlawful; for which he gives this reason, ‘Whatsoever is not of faith is sin.’ He might as well conclude, in that sense, that the best virtues of the heathen were sin, because not of faith; that is, accidentally sin, in respect of the end, or manner of doing, not materially, or in their own nature. Upon the same reason he must conclude, that the government of a heathen magistrate per se [in of itself], simpliciter [essentially], et ex natura sua [out of its nature], unlawful and sinful? Whether has he any just right or title to government and magistracy? If his title to civil magistracy be just, and if his government be in itself materially and substantially lawful, then he must have a commission from Christ, and from him as Mediator. This I suppose cannot be Mr. Hussey’s sense, for he has not answered one syllable to the argument, tending that way. But if the government of a heathen magistrate be in itself materially, substantially, and in the nature of the tenure, sinful and unlawful, so that, as long as he remains a heathen, he has no real right or true title to government, but only a pretended and usurped title (which must needs be Mr. Hussey’s sense, if he has answered anything at all to my argument), then he goes cross not only to the holy men of God in the Old Testament, who honored heathen princes, and were subject to them as to lawful magistrates, but also to the doctrine of Jesus Christ, who taught his disciples to give unto Caesar what is Caesar’s; and of the apostles, who in their time, exhorted the churches to be subject even to the heathen magistrates (for they had no other at that time), to obey them, to pray for them, Rom. 13; Titus 3:1; 1 Tim. 2:1-2; 1 Pet. 2:13-17. It is justly condemned as one of the errors of the Anabaptists, that a heathen magistrate is not to be acknowledged as a lawful magistrate, or as being from God. See Gerhard, Loc. Com., tom. 6, p. 498-9; P. Hinkelmannus, de Anabaptismo, disp. 13, cap. 1 The Scriptures now cited are so clear, that when Mr. Hussey says of the heathen magistrate, ‘Let Baal plead for himself,’ he might as well have said, that Christ and his apostles pleaded for Baal. They that plead for the authority of a heathen magistrate do not plead for Baal, but for God, and for his ordinance; ‘For the powers that be are ordained of God,’ says Paul, speaking even of the heathen magistrates, Rom. 13:1. But what will Mr. Hussey say, if his great master Erastus be found a pleader for Baal as much as I am? Confirm. Thes., lib. 3, cap. 2, p. 184, speaking of the heathen and unbelieving magistrates, before whom the Corinthians went to law one against another, he says, [contains Latin], Is not the ungodly magistrate also preferred by God, that he may defend any of his subjects from injury and violence. Yea, the Scriptures afore touched are so clear in this point, that Gamachaeus, in Primam Secundae, quest. 4-5, cap. 33, though he hold that by human and ecclesiastical right, pagan princes lose their dominion and authority over their subjects when their subjects turn Christians, yet he acknowledges that they still retain their former jurisdiction over those subjects by the law of God and nature. Surely one might as well say, that heathen parents are unlawful, and heathen husbands are unlawful (all which were contrary to the Word of God), as to say that heathen magistrates are unlawful. Take the instance in parents; for all lawful magistrates are fathers by the fifth commandment: Does the paternity of a heathen father differre specie [differ in kind] from the paternity of a Christian father? are they not both lawful parents, being made such by God and nature? are not their children bound to honor them, and be subject to them, and obey them in things lawful? The paternity is the same in se [in principle], but different modaliter [in way], that I may borrow a distinction from Mr. Hussey. The Christian father is sanctified, and qualified to do service to Jesus Christ, as a father, in educating his children Christianly, which a heathen father cannot do. The heathen magistrate and the Christian magistrate are both lawful magistrates, being made such by God and nature, or by election of people. They are both of them to be honored, submitted unto, and obeyed; they are both of them the ministers of God for the good to their people; their power is the same in actu signato [the intent of power], though not in actu exercito [in how the power is actually exercised in specific acts]. The heathen magistrate may do, and ought to do, what the Christian magistrate does; but the Christian magistrate is fitted, qualified, enabled, and sanctified to glorify and serve Jesus Christ as a magistrate, which the heathen magistrate is not.</p></blockquote>

diction over those subjects by the law of God and nature. Surely one might as well say, that heathen parents are unlawful, and heathen husbands are unlawful (all which were contrary to the Word of God), as to say that heathen magistrates are unlawful. Take the instance in parents; for all lawful magistrates are fathers by the fifth commandment: Does the paternity of a heathen father differre specie [differ in kind] from the paternity of a Christian father? are they not both lawful parents, being made such by God and nature? are not their children bound to honor them, and be subject to them, and obey them in things lawful? The paternity is the same in se [in principle], but different modaliter [in way], that I may borrow a distinction from Mr. Hussey. The Christian father is sanctified, and qualified to do service to Jesus Christ, as a father, in educating his children Christianly, which a heathen father cannot do. The heathen magistrate and the Christian magistrate are both lawful magistrates, being made such by God and nature, or by election of people. They are both of them to be honored, submitted unto, and obeyed; they are both of them the ministers of God for the good to their people; their power is the same in actu signato [the intent of power], though not in actu exercito [in how the power is actually exercised in specific acts]. The heathen magistrate may do, and ought to do, what the Christian magistrate does; but the Christian magistrate is fitted, qualified, enabled, and sanctified to glorify and serve Jesus Christ as a magistrate, which the heathen magistrate is not.”

overnment+of+a+heathen+magistrate+be+in+itself+materially%2C+substantially%2C+and+in+the+nature+of+the+tenure%2C+sinful+and+unlawful%2C+so+that%2C+as+long+as+he+remains+a+heathen%2C+he+has+no+real+right+or+true+title+to+government%2C+but+only+a+pretended+and+usurped+title+%28which+must+needs+be+Mr.+Hussey%E2%80%99s+sense%2C+if+he+has+answered+anything+at+all+to+my+argument%29%2C+then+he+goes+cross+not+only+to+the+holy+men+of+God+in+the+Old+Testament%2C+who+honored+heathen+princes%2C+and+were+subject+to+them+as+to+lawful+magistrates%2C+but+also+to+the+doctrine+of+Jesus+Christ%2C+who+taught+his+disciples+to+give+unto+Caesar+what+is+Caesar%E2%80%99s%3B+and+of+the+apostles%2C+who+in+their+time%2C+exhorted+the+churches+to+be+subject+even+to+the+heathen+magistrates+%28for+they+had+no+other+at+that+time%29%2C+to+obey+them%2C+to+pray+for+them%2C+Rom.+13%3B+Titus+3%3A1%3B+1+Tim.+2%3A1-2%3B+1+Pet.+2%3A13-17.+It+is+justly+condemned+as+one+of+the+errors+of+the+Anabaptists%2C+that+a+heathen+magistrate+is+not+to+be+acknowledged+as+a+lawful+magistrate%2C+or+as+being+from+God.+See+Gerhard%2C+Loc.+Com.%2C+tom.+6%2C+p.+498-9%3B+P.+Hinkelmannus%2C+de+Anabaptismo%2C+disp.+13%2C+cap.+1+The+Scriptures+now+cited+are+so+clear%2C+that+when+Mr.+Hussey+says+of+the+heathen+magistrate%2C+%E2%80%98Let+Baal+plead+for+himself%2C%E2%80%99+he+might+as+well+have+said%2C+that+Christ+and+his+apostles+pleaded+for+Baal.+They+that+plead+for+the+authority+of+a+heathen+magistrate+do+not+plead+for+Baal%2C+but+for+God%2C+and+for+his+ordinance%3B+%E2%80%98For+the+powers+that+be+are+ordained+of+God%2C%E2%80%99+says+Paul%2C+speaking+even+of+the+heathen+magistrates%2C+Rom.+13%3A1.+But+what+will+Mr.+Hussey+say%2C+if+his+great+master+Erastus+be+found+a+pleader+for+Baal+as+much+as+I+am%3F+Confirm.+Thes.%2C+lib.+3%2C+cap.+2%2C+p.+184%2C+speaking+of+the+heathen+and+unbelieving+magistrates%2C+before+whom+the+Corinthians+went+to+law+one+against+another%2C+he+says%2C+%5Bcontains+Latin%5D%2C+Is+not+the+ungodly+magistrate+also+preferred+by+God%2C+that+he+may+defend+any+of+his+subjects+from+injury+and+violence.+Yea%2C+the+Scriptures+afore+touched+are+so+clear+in+this+point%2C+that+Gamachaeus%2C+in+Primam+Secundae%2C+quest.+4-5%2C+cap.+33%2C+though+he+hold+that+by+human+and+ecclesiastical+right%2C+pagan+princes+lose+their+dominion+and+authority+over+their+subjects+when+their+subjects+turn+Christians%2C+yet+he+acknowledges+that+they+still+retain+their+former+jurisdiction+over+those+subjects+by+the+law+of+God+and+nature.+Surely+one+might+as+well+say%2C+that+heathen+parents+are+unlawful%2C+and+heathen+husbands+are+unlawful+%28all+which+were+contrary+to+the+Word+of+God%29%2C+as+to+say+that+heathen+magistrates+are+unlawful.+Take+the+instance+in+parents%3B+for+all+lawful+magistrates+are+fathers+by+the+fifth+commandment%3A+Does+the+paternity+of+a+heathen+father+differre+specie+%5Bdiffer+in+kind%5D+from+the+paternity+of+a+Christian+father%3F+are+they+not+both+lawful+parents%2C+being+made+such+by+God+and+nature%3F+are+not+their+children+bound+to+honor+them%2C+and+be+subject+to+them%2C+and+obey+them+in+things+lawful%3F+The+paternity+is+the+same+in+se+%5Bin+principle%5D%2C+but+different+modaliter+%5Bin+way%5D%2C+that+I+may+borrow+a+distinction+from+Mr.+Hussey.+The+Christian+father+is+sanctified%2C+and+qualified+to+do+service+to+Jesus+Christ%2C+as+a+father%2C+in+educating+his+children+Christianly%2C+which+a+heathen+father+cannot+do.+The+heathen+magistrate+and+the+Christian+magistrate+are+both+lawful+magistrates%2C+being+made+such+by+God+and+nature%2C+or+by+election+of+people.+They+are+both+of+them+to+be+honored%2C+submitted+unto%2C+and+obeyed%3B+they+are+both+of+them+the+ministers+of+God+for+the+good+to+their+people%3B+their+power+is+the+same+in+actu+signato+%5Bthe+intent+of+power%5D%2C+though+not+in+actu+exercito+%5Bin+how+the+power+is+actually+exercised+in+specific+acts%5D.+The+heathen+magistrate+may+do%2C+and+ought+to+do%2C+what+the+Christian+magistrate+does%3B+but+the+Christian+magistrate+is+f

<main class="wrap"><figure class="quote" id="q-9d7b8126b5" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments [cf. 2 Sam. 24:10–17], the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called “burdens,” Acts 15 [v. 28]. And Moses may make an ordinance about the use of a bill of divorcement which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London: Flesher, 1637), on 1 Pet. 2:13, pp. 434–35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

booksonline.com/on-evil/#:~:text=Things%20inconvenient%2C%20even%20in%20matters%20of,sin%2C%20as%20all%20sound%20divines%20confess&amp;text=Things%20inconvenient%2C%20even%20in%20matters%20of%20religion%2C%20may&amp;text=but%20a%20sin%2C%20as%20all%20sound%20divines%20confess" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c93619138f" data-kw="Hardening Justice Satan">
<blockquote><p>As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 5.6</span></figcaption>

</figure><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</span></figcaption>

</figure><figure class="quote" id="q-6536deebe0" data-kw="">
<blockquote><p>Objection 1: It seems that God does not exist; because if one of two contraries be infinite, the other would be altogether destroyed. But the word ‘God’ means that He is infinite goodness. If, therefore, God existed, there would be no evil discoverable; but there is evil in the world. Therefore God does not exist. … Reply to Objection 1: As Augustine says (Enchiridion, xi): Since God is the highest good, He would not allow any evil to exist in His works, unless His omnipotence and goodness were such as to bring good even out of evil. This is part of the infinite goodness of God, that He should allow evil to exist, and out of it produce good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, art. 3, ‘Whether God Exists’, obj. 1 &amp; reply to obj. 1</span></figcaption>

</figure><figure class="quote" id="q-47c06a0653" data-kw="">
<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

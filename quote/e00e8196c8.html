<main class="wrap"><figure class="quote" id="q-e00e8196c8" data-kw="">
<blockquote><p>For what the law could not do, in that it was weak through the flesh, God sending his own Son, in the likeness of sinful flesh, and for sin, condemned sin in the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25</cite>, …’ in Works (London: Tegg, 1845), vol. 5, pp. 378-79 | By Christ’s redemption, the guilt of sin is taken away, and by his active obedience, the believing person is made completely righteous, in the sight of God; and although these always go together, yet are they to be distinguished one from the other: for as it is one thing to obey the command, and another to suffer the penalty, even so it is one thing to be fread from hell, by the merit of Christ’s death, and another thing to be entitled to heaven by the merit of his obedience, Rom. 8:3. Here we have the end and design of the Father’s sending of Christ asserted.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05ca7b0d67" data-kw="">
<blockquote><p>Therefore, we always hold fast this foundation, ascribing all the glory to God, humbling ourselves before Him, and acknowledging ourselves to be such as we really are, without presuming to trust in any thing in ourselves, or in any merit of ours, relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></span></div>

</figure><figure class="quote" id="q-a906397c9a" data-kw="">
<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin. 2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, p. 254</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin. 2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?”

</figure><figure class="quote" id="q-668dd45d16" data-kw="">
<blockquote><p>Q. What place has Christ’s righteousness here? Answer: [David] Pareus with some others distinguish between [1] the righteousness of Christ’s Person, which contains his essential righteousness as God, [2] the habitual and actual conformity of the man-Christ, and the perfect holiness of the man-Christ. Such a High Priest became us, as is holy, harmless, etc. Heb. 7:26. And [3] the righteousness of his merit, in the satisfaction of his suffering: the satisfaction is the formal cause of our justification, which is counted ours: this latter righteousness is acquired, the former is essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; p. 226</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-9a507d44d8" data-kw="">
<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae ecclesiasticae, Epistle 68</cite>, p. 124b as trans. G.A. van den Brink, The Transfer of Sin: The Debate on Imputation in the English Antinomian Controversy (1690–1700)… (Brill, 2024), p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.”

<blockquote><p>Argument 7. That opinion is not to be held which lays ground that Christ-Mediator is a temporary king, has under Him magistrates, even heathenish, who have nothing to do with a mediator, to bear a temporal sword for a supernatural and spiritual end, as Christ under-heirs, He himself being the first-heir of all such and so makes heathens within the verge of the Mediatorial Kingdom; as if Christ were as Mediator, a King to heathen and all and everyone of mankind, who must have magistrates, and so [it] makes the Kingdom of men as men, and the Kingdom of Grace commensurable, and of alike latitude and extension, and makes nature and grace of equal comprehension: But such is the former opinion; the proposition cannot be denied, except by Arminians, Socinians, Papists, who do maintain an universal redemption, a grace universal, a catholic Kingdom of Grace comprehensive of all and every man, of Pharaoh, Evil Merodach, Belshazzar, all the kings of Romans, Persians, Assyrians, Chaldeans, and of Turk[s], India, and such as worship the sun and moon, the Devil, and the work of men’s hands…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church-Government… (London, 1646)</cite>, p. 614</span></figcaption>

ine · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13940a8abf" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ‘If government by independent congregations be insufficient because it authorizes not persons to be pastors over pagans, government by synods is sick of the same disease.’ [Rutherford’s] Answer: [1.] We judge the essence of a pastor not to stand in the call and choice of those to whom they are pastors; for it makes Paul, Barnabas and the apostles to be no pastors to the gentiles and to the heathen, to whom they preach, and [it] makes the apostles as apostles to be no pastors. [Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Richard Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, dis. 19, th. 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leided, in Synopsis of Pure Theology, dis. […], thesis 17, p. 605; Bucan, in loc., Com. 42, q. 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, &amp; munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Com. ibid. Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trochoregia, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline (London, 1658)</cite>, p. 472</span></figcaption>

</figure><figure class="quote" id="q-3e43ae1689" data-kw="">

<blockquote><p>Moreover, God permits: (1) sometimes in express terms (Col. 2:16, 20–21; Gen. 2:16–17; Lev. 11:2–4), when he removes these or those things from among things prohibited; (2) sometimes only by nowhere prohibiting (cf. Rom. 14:14; Acts 10:15); (3) sometimes also in terms of commanding (Deut. 23:20; Gen. 1:28), just as in the same terms of commanding he sometimes expressly prohibits (Num. 22:20; John 13:27).</p></blockquote>

</figure><figure class="quote" id="q-3163c0e2b3" data-kw="">
<blockquote><p>I have hesitated till the present time, not through lack of ability to refute the falsehood or bear testimony for the truth, but from fear and apprehension that I might seem to some to be making additions to the doctrines or precepts of the Gospel of the New Testament, which it is impossible for one who has chosen to live according to the Gospel, either to increase or to diminish. But being recently in Ancyra in Galatia, I found the church there greatly agitated by this novelty, not prophecy, as they call it, but rather false prophecy, as will be shown. Therefore, to the best of our ability, with the Lord’s help, we disputed in the church many days concerning these and other matters separately brought forward by them, so that the church rejoiced and was strengthened in the truth, and those of the opposite side were for the time confounded, and the adversaries were grieved… Their opposition and their recent heresy which has separated them from the Church arose on the following account… a recent convert, Montanus [fl. 157-172] by name… And he became beside himself, and being suddenly in a sort of frenzy and ecstasy, he raved, and began to babble and utter strange things, prophesying in a manner contrary to the constant custom of the Church handed down by tradition from the beginning. Some of those who heard his spurious utterances at that time were indignant, and they rebuked him as one that was possessed, and that was under the control of a demon, and was led by a deceitful spirit, and was distracting the multitude; and they forbade him to talk, remembering the distinction drawn by the Lord and his warning to guard watchfully against the coming of false prophets… For the faithful in Asia met often in many places throughout Asia to consider this matter, and examined the novel utterances and pronounced them profane, and rejected the heresy, and thus these persons were expelled from the Church and debarred from communion. Since, therefore, they called us slayers of the prophets because we did not receive their loquacious prophets, who, they say, are those that the Lord promised to send to the people…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I have hesitated till the present time, not through lack of ability to refute the falsehood or bear testimony for the truth, but from fear and apprehension that I might seem to some to be making additions to the doctrines or precepts of the Gospel of the New Testament, which it is impossible for one who has chosen to live according to the Gospel, either to increase or to diminish. But being recently in Ancyra in Galatia, I found the church there greatly agitated by this novelty, not prophecy, as they call it, but rather false prophecy, as will be shown. Therefore, to the best of our ability, with the Lord’s help, we disputed in the church many days concerning these and other matters separately brought forward by them, so that the church rejoiced and was strengthened in the truth, and those of the opposite side were for the time confounded, and the adversaries were grieved… Their opposition and their recent heresy which has separated them from the Church arose on the following account… a recent convert, Montanus [fl. 157-172] by name… And he became beside himself, and being suddenly in a sort of frenzy and ecstasy, he raved, and began to babble and utter strange things, prophesying in a manner contrary to the constant custom of the Church handed down by tradition from the beginning. Some of those who heard his spurious utterances at that time were indignant, and they rebuked him as one that was possessed, and that was under the control of a demon, and was led by a deceitful spirit, and was distracting the multitude; and they forbade him to talk, remembering the distinction drawn by the Lord and his warning to guard watchfully against the coming of false prophets… For the faithful in Asia met often in many places throughout Asia to consider this matter, and examined the novel utterances and pronounced them profane, and rejected the heresy, and thus these persons were expelled from the Church and debarred from communion. Since, therefore, they called us slayers of the prophets because we did not receive their loquacious prophets, who, they say, are those that the Lord promised to send to the people…”

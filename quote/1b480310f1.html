<main class="wrap"><figure class="quote" id="q-1b480310f1" data-kw="">
<blockquote><p>The catholic church sees nothing clearer in the divine books than that God, just as surely as he is the one and only God, is also three in number, and that the Father, Son and Holy Spirit are not only one essence, but are one God, and one only, and that man, having become an enemy of God, and hated on account of his sins, could not return to his holy and worthy communion with God, except through the bloody death of the Son, and that this death can save no one who is not gifted and filled with the breath of the Holy Spirit. But this goddess Reason is in no way willing or able to swallow and stomach. The mystery of the Father, the Son, and the Holy Spirit, and the mystery that rests on it, that of redemption, of Christ, she mocks as stupidity – to her it is a perpetual stumbling-block.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henricus-pontanus.html">Henricus Pontanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Funeral Oration on the Death of Pieter van Mastricht, 24 February 1706 in Pieter van Mastricht, Theoretical-Practical Theology Volume 1: Prolegomena</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2dd84b7c30" data-kw="">
<blockquote><p>XX… For the Father is called God [in Col. 1:2] by way of distinction, not in an absolute sense, but in terms of order, because He is the first person of the Godhead who begot the Son from Himself, as the source and principle of the Deity. This is known as the simple essence of the divine unity, which cannot be conceived unless it begins from the Father. The mention of ‘our Lord Jesus Christ’ is expressly added to the Father, both for the purpose of distinction because He is the Mediator, and to refute the Arians, both the ancient and recent ones, who wrongly deduce from this passage of Paul that the name of God belongs exclusively and properly to the Father alone. It is certain that it is used relatively here because the mention of our Lord Jesus Christ is explicitly joined to the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

<blockquote><p>The debate over Remonstrant Arminianism involved more than a dispute over soteriology. The Scottish Covenanter and Commissioner to the Westminster Assembly, Robert Baillie reminds us that the original Arminians were also suspect on the doctrines of the Trinity and divine simplicity:

It is to be remarked that the Arminian spirit in Holland leads men to hell another way than here in Britain; there the Arminians with great boldness running after Vorstius &amp; Socinus with a marvelous petulancy fell to brangle [shake into confusion] the Trinity of the Divine persons, yea, the simplicity of the Divine nature itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scotch Antidote Against the English Infection of Arminianism</cite>, (London: Samuel Gellibrand, 1652), pp 18-19.</span></figcaption>

</figure><figure class="quote" id="q-3a922f0ea6" data-kw="">
<blockquote><p>By person, then, I mean a subsistence in the Divine essence,--a subsistence which, while related to the other two, is distinguished from them by incommunicable properties. By subsistence we wish something else to be understood than essence. For if the Word were God simply and had not some property peculiar to himself, John could not have said correctly that he had always been with God. When he adds immediately after, that the Word was God, he calls us back to the one essence. But because he could not be with God without dwelling in the Father, hence arises that subsistence, which, though connected with the essence by an indissoluble tie, being incapable of separation, yet has a special mark by which it is distinguished from it. Now, I say that each of the three subsistences while related to the others is distinguished by its own properties. Here relation is distinctly expressed, because, when God is mentioned simply and indefinitely the name belongs not less to the Son and Spirit than to the Father. But whenever the Father is compared with the Son, the peculiar property of each distinguishes the one from the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/person-and-subsistence.html">Person and subsistence</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/personal-properties.html">Personal properties</a></span></div>

</figure><figure class="quote" id="q-6be95af5f6" data-kw="">
<blockquote><p>But in all the things that God has made… there is nothing which can properly be likened to the nature of God: neither are there any words in the mouths of men that can properly be spoken of it: neither are there any similitudes of man’s inuention that can rightly and squarely agree with the divine essence. And St. Basil, disputing De Ousia &amp; Hypostasi, says: ‘It cannot be that the comparisons of examples should in all points be like to those things, to the use whereof the examples do serve. Thou mayest say that injury is done to the majesty of God if it be compared with mortal things. But for because the holy scripture does not a little condescend and attemper itselfe to our infirmity, I will put a similitude, although in very deed much unlike, which is usually taken and commonly used. Behold the sun and the beams that come from it, and then the heat that proceedes from them both. As the sun is the head-spring of the light and the heat: so is the Father the headspring of the Son, who is light of light. And as of the sun and the beams together the heat does come, so of the Father and the Son together the holy Ghost proceeds. But now, put case, or imagine that the sun were such, as never had beginning, nor ever shall have ending, and should not then I pray you, ye beams of this everlasting sun be everlasting too? and should not the heat, which proceeds of them both, be everlasting as well as they? Finally, should not the Son be one still in essence or substance, and three by reason of the three subsistences or persons? This parable of the sun did Tertullian use (contra Praxeam.), whose words, which do also contain other similitudes, I will not be grieved to recite unto you. ‘I wil not doubt’ (says he) ‘to call both the stalk of a root, the brook of a springhead, and a beam of the sun, by the name of a son: for every original is a parent and every thing that issues of that original is a son: much more then the Word of God may be called a Son, which even properly has the name of Son, and yet neither is the stalk separated from the root, nor the brook from the springhead, nor the beam from the sun, no more is the Word separated from God. Therefore according to the fashion of these examples I profess that I say there are two, God &amp; his Word, the Father and his Son. For the root and the stalk are two things, but joined in one. And the springhead and the brook are two kinds, but undivided. And the sun and the beams are two forms, but both cleaving the one to the other. Everything that comes of anything must needs be second to that out of which it comes, and yet it is not separated from that from which it proceeds. But where a second is, there are two, and where a third is there are three. For the third is the spirit of God and the Son: even as the third from the root is the fruit of the stalk, the third from the springhead is the river of the brook, and the third from the sun is the heat of the beam: yet none of these is alienated from the matrix [womb] of which they take the properties that they have. So the Trinity descending by annexed and linked degrees from the Father, does not make against the monarchy, and does defend the economical state, that is, the mystery of the dispensation. Understand everywhere that I profess this rule wherein I testify, that the Father, the Son and the Holy Ghost are unseparated one from another, and so thou shalt know how everything is spoken.’ And so forth. For all these are the words of Tertullian, who flourished in Africa not long after the age of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (London, 1577), 4th Decade, 3rd Sermon, ‘Of God, of the True Knowledge of God…’, pp. 630-31</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But in all the things that God has made… there is nothing which can properly be likened to the nature of God: neither are there any words in the mouths of men that can properly be spoken of it: neither are there any similitudes of man’s inuention that can rightly and squarely agree with the divine essence. And St. Basil, disputing De Ousia &amp; Hypostasi, says: ‘It cannot be that the comparisons of examples should in all points be like to those things, to the use whereof the examples do serve. Thou mayest say that injury is done to the majesty of God if it be compared with mortal things. But for because the holy scripture does not a little condescend and attemper itselfe to our infirmity, I will put a similitude, although in very deed much unlike, which is usually taken and commonly used. Behold the sun and the beams that come from it, and then the heat that proceedes from them both. As the sun is the head-spring of the light and the heat: so is the Father the headspring of the Son, who is light of light. And as of the sun and the beams together the heat does come, so of the Father and the Son together the holy Ghost proceeds. But now, put case, or imagine that the sun were such, as never had beginning, nor ever shall have ending, and should not then I pray you, ye beams of this everlasting sun be everlasting too? and should not the heat, which proceeds of them both, be everlasting as well as they? Finally, should not the Son be one still in essence or substance, and three by reason of the three subsistences or persons? This parable of the sun did Tertullian use (contra Praxeam.), whose words, which do also contain other similitudes, I will not be grieved to recite unto you. ‘I wil not doubt’ (says he) ‘to call both the stalk of a root, the brook of a springhead, and a beam of the sun, by the name of a son: for every original is a parent and every thing that issues of that original is a son: much more then the Word of God may be called a Son, which even properly has the name of Son, and yet neither is the stalk separated from the root, nor the brook from the springhead, nor the beam from the sun, no more is the Word separated from God. Therefore according to the fashion of these examples I profess that I say there are two, God &amp; his Word, the Father and his Son. For the root and the stalk are two things, but joined in one. And the springhead and the brook are two kinds, but undivided. And the sun and the beams are two forms, but both cleaving the one to the other. Everything that comes of anything must needs be second to that out of which it comes, and yet it is not separated from that from which it proceeds. But where a second is, there are two, and where a third is there are three. For the third is the spirit of God and the Son: even as the third from the root is the fruit of the stalk, the third from the springhead is the river of the brook, and the third from the sun is the heat of the beam: yet none of these is alienated from the matrix [womb] of which they take the properties that they have. So the Trinity descending by annexed and linked degrees from the Father, does not make against the monarchy, and does defend the economical state, that is, the mystery of the dispensation. Understand everywhere that I profess this rule wherein I testify, that the Father, the Son and the Holy Ghost are unseparated one from another, and so thou shalt know how everything is spoken.’ And so forth. For all these are the words of Tertullian, who flourished in Africa not long after the age of the apostles.”

— Heinrich Bullinger, Fifty Godly &amp; Learned Sermons divided into Five Decades, … (London, 1577), 4th Decade, 3rd Sermon, ‘Of God, of the True Knowledge of God…’, pp. 630-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+in+all+the+things+that+God+has+made%E2%80%A6+there+is+nothing+which+can+properly+be+likened+to+the+nature+of+God%3A+neither+are+there+any+words+in+the+mouths+of+men+that+can+properly+be+spoken+of+it%3A+neither+are+there+any+similitudes+of+man%E2%80%99s+inuention+that+can+rightly+and+squarely+agree+with+the+divine+essence.+And+St.+Basil%2C+disputing+De+Ousia+%26+Hypostasi%2C+says%3A+%E2%80%98It+cannot+be+that+the+comparisons+of+examples+should+in+all+points+be+like+to+those+things%2C+to+the+use+whereof+the+examples+do+serve.+Thou+mayest+say+that+injury+is+done+to+the+majesty+of+God+if+it+be+compared+with+mortal+things.+But+for+because+the+holy+scripture+does+not+a+little+condescend+and+attemper+itselfe+to+our+infirmity%2C+I+will+put+a+similitude%2C+although+in+very+deed+much+unlike%2C+which+is+usually+taken+and+commonly+used.+Behold+the+sun+and+the+beams+that+come+from+it%2C+and+then+the+heat+that+proceedes+from+them+both.+As+the+sun+is+the+head-spring+of+the+light+and+the+heat%3A+so+is+the+Father+the+headspring+of+the+Son%2C+who+is+light+of+light.+And+as+of+the+sun+and+the+beams+together+the+heat+does+come%2C+so+of+the+Father+and+the+Son+together+the+holy+Ghost+proceeds.+But+now%2C+put+case%2C+or+imagine+that+the+sun+were+such%2C+as+never+had+beginning%2C+nor+ever+shall+have+ending%2C+and+should+not+then+I+pray+you%2C+ye+beams+of+this+everlasting+sun+be+everlasting+too%3F+and+should+not+the+heat%2C+which+proceeds+of+them+both%2C+be+everlasting+as+well+as+they%3F+Finally%2C+should+not+the+Son+be+one+still+in+essence+or+substance%2C+and+three+by+reason+of+the+three+subsistences+or+persons%3F+This+parable+of+the+sun+did+Tertullian+use+%28contra+Praxeam.%29%2C+whose+words%2C+which+do+also+contain+other+similitudes%2C+I+will+not+be+grieved+to+recite+unto+you.+%E2%80%98I+wil+not+doubt%E2%80%99+%28says+he%29+%E2%80%98to+call+both+the+stalk+of+a+root%2C+the+brook+of+a+springhead%2C+and+a+beam+of+the+sun%2C+by+the+name+of+a+son%3A+for+every+original+is+a+parent+and+every+thing+that+issues+of+that+original+is+a+son%3A+much+more+then+the+Word+of+God+may+be+called+a+Son%2C+which+even+properly+has+the+name+of+Son%2C+and+yet+neither+is+the+stalk+separated+from+the+root%2C+nor+the+brook+from+the+springhead%2C+nor+the+beam+from+the+sun%2C+no+more+is+the+Word+separated+from+God.+Therefore+according+to+the+fashion+of+these+examples+I+profess+that+I+say+there+are+two%2C+God+%26+his+Word%2C+the+Father+and+his+Son.+For+the+root+and+the+stalk+are+two+things%2C+but+joined+in+one.+And+the+springhead+and+the+brook+are+two+kinds%2C+but+undivided.+And+the+sun+and+the+beams+are+two+forms%2C+but+both+cleaving+the+one+to+the+other.+Everything+that+comes+of+anything+must+needs+be+second+to+that+out+of+which+it+comes%2C+and+yet+it+is+not+separated+from+that+from+which+it+proceeds.+But+where+a+second+is%2C+there+are+two%2C+and+where+a+third+is+there+are+three.+For+the+third+is+the+spirit+of+God+and+the+Son%3A+even+as+the+third+from+the+root+is+the+fruit+of+the+stalk%2C+the+third+from+the+springhead+is+the+river+of+the+brook%2C+and+the+third+from+the+sun+is+the+heat+of+the+beam%3A+yet+none+of+these+is+alienated+from+the+matrix+%5Bwomb%5D+of+which+they+take+the+properties+that+they+have.+So+the+Trinity+descending+by+annexed+and+linked+degrees+from+the+Father%2C+does+not+make+against+the+monarchy%2C+and+does+defend+the+economical+state%2C+that+is%2C+the+mystery+of+the+dispensation.+Understand+everywhere+that+I+profess+this+rule+wherein+I+testify%2C+that+the+Father%2C+the+Son+and+the+Holy+Ghost+are+unseparated+one+from+another%2C+and+so+thou+shalt+know+how+everything+is+spoken.%E2%80%99+And+so+forth.+For+all+these+are+the+words+of+Tertullian%2C+who+flourished+in+Africa+not+long+after+the+age+of+the+apostles.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+Fifty+Godly+%26+Learned+Sermons+divided+into+Five+Decades%2C+%E2%80%A6+%28London%2C+1577%29%2C+4th+Decade%2C+3rd+Sermon%2C+%E2%80%98Of+God%2C+of+the+True+Knowledge+of+God%E2%80%A6%E2%80%99%2C+pp.+630-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6be95af5f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6be95af5f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=But%20in%20all%20the%20things%20that,after%20the%20age%20of%20the%20apostles&amp;text=But%20in%20all%20the%20things%20that%20God%20has&amp;text=not%20long%20after%20the%20age%20of%20the%20apostles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

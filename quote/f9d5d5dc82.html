<blockquote><p>But here another scruple is to be removed. If faith is such a certain and firm assent, are they destitute of true faith, who are sometimes fluctuating and doubting even about fundamental truths?

Answer, I. We are describing faith as considered in idea, as that christian virtue, to the perfection of which we all ought to tend, not as it subsists in any particular subject.

II. It may sometimes happen, even amongst the most eminent believers, especially when exposed to some vehement temptation, that there may be doubts and staggerings, and even contrary inclinations, as the waverings of Asaph, Jeremy, and others, about the providence of GOD, do prove; these are certain defects in faith, which arise from the infirmity of the flesh.

III. faith immediately wrestles with those temptations, it doth not assent to those suggestions of the devil, or to the evil desires of the flesh; nor doth it ever rest until it hath entered into the sanctuary of the Lord, and, by the teaching of the Spirit of God, is confirmed in the contemplation and acknowledgment of the truths, about which it was staggering. There at length, and no where else, doth it find rest for the soles of its feet. See Ps. l.xxiii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Christian Faith</cite>, trans. Martin Madan (London: E. Dilly, 1761), pp 14-15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2f770b046" data-kw="">
<blockquote><p>It remains, then, that the church founded in the covenant, and unto which all the promises did and do belong, abode at the coming of Christ, and doth abide ever since, in and among those who are the children of Abraham by faith. The old church was not taken away, and a new one set up, but the same church was continued, only in those who by faith inherited the promises. Great alterations, indeed, were then made in the outward state and condition of the church; as,— (1.) The carnal privilege of the Jews, in their separation to bring forth the Messiah, then failed; and therewith their claim on that account to be the children of Abraham. (2.) The ordinances of worship suited unto that privilege expired and came to an end. (3.) New ordinances of worship were appointed, suited unto the new light and grace then granted unto the church. (4.) The Gentiles came in to the faith of Abraham together with the Jews, to be fellow-heirs with them in his blessing. But none of these, nor all of them together, made any such alteration in the church but that it was still one and the same. The olive-tree was the same, only some branches were broken off, and others planted in; the Jews fell, and the Gentiles came in their room.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 1.124. Emphasis added.</span></figcaption>

<blockquote><p>Are the wicked intermixed with true and zealous professors? What shall we then say to the old Donatists (Socrates, Ecclesiastical History, bk. 1, ch. 7), and the Brownists, and Anabaptists, which separate themselves from the true Church, say with those in the prophet, ‘Come not near us for we are holier then ye.’ Me thinks I may say unto them as Constantine said to Acesius, a Novatian Bishop: Let them make a ladder for themselves to ascend into heaven, here is no place for them on earth, as long as this world shall last, the Lord’s wheat shall grow up with the tares.(Mt. 13:29) Christ has spoken it, and Christ is truth, ‘if there be in them any charity, they will assent to this verity’ (Sit in illis charitas et congaudeant veritate, Augustine, Cor. 2:6). ‘Yea but light has no communion with darkness, nor bitterness with honey, nor life with death, nor the unbeliever with the infidel.’ It is the objection of Petilian the Donatist against Augustine. But his answer is that when they eschew the darkness, they forsake the light: when they flee from death they flee from life also: Attendis Zizania per mundum, &amp; triticum non attendis, cum per totum vtraque sint iussa crescere? attendis semen maligni, quod ad finem messis separabitur; et non attendis semen Abrahae, in quo benedicentur omnes gentes? Dost thou mark the darnel, and dost thou not remember the wheat? Dost thou think upon the seed of the serpent, whose head shall be crushed; and dost thou not think upon the seed of Abraham, in whom all the nations of the earth shall be blessed? When thou fleest from the chaff, thou forsakest the good wheat, which is mingled with it. When thou separatest thyself from the seed of the wicked, thou seperatest thyself from the seed of Abraham. When thou thus dividest thyself from the hypocrites that are in the true Church, thou cuttest thyself from the Church, and a member taken from the whole must needs perish. If thou wilt think upon this with that heedfulness that thou shouldst, thou wilt not forsake the green pastures of the Lord that are besides the waters of comfort (Ps. 23) because of the goats; nor leave God’s house because of the vessels of dishonor; nor run out of the Lord’s floor, because of the chaff; nor separate thyself from the wheat because of the tares, which shall at length be bound in a bundle and cast into the fire; nor burst the unity of the Lord’s net because of the bad fish, which swim in it, (which, when the net is brought to land, shall be cast away), but as a father speaks: tolerare potiùs propter bonos cōmixtionem malorum, quam violare propter malos charitatem bonorum; rather for the good to tolerate the bad than for the bad to forsake the good. (Augustine, bk. 3, Contra litt. Petit., ch. 3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-dawes.html">Lancelot Dawes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Sermons preached at the Assizes holden at Carlile touching sundry Corruptions of these Times</cite>, (Oxford: Barnes, 1614), 1st Sermon, pp. 32-34 Dawes (1580–1653) was an Anglican clergyman.</span></figcaption>

<blockquote><p>When Christians reflect how frequently the language of prayer has flowed from their lips, while scarcely one devout aspiration has arisen from their heart,—how often they have read the Scriptures, while they hardly recollected that they were perusing the words of eternal life, dictated by the Spirit of God, and addressed to them as sinners; and in how many instances they have waited on the ministry of the Word, with views and feelings but little favourable to the admission of its holy and sanctifying influence; what humiliation and self-abasement must such a review bring with it!

Can the Christian, then, recollect without the deepest humiliation, those offences by which he has grieved the Holy Spirit of God? The very mercy and forbearance which be has experienced, must give inexpressible bitterness to his sorrow; and as often as he recollects his past delinquencies, they will prove a new motive to him “to work out his own salvation with fear and trembling,” seeing that “it is God that worketh in him, both to will and to do of his good pleasure.</p></blockquote>

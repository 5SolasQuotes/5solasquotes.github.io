<main class="wrap"><figure class="quote" id="q-9ebcc2d3db" data-kw="">
<blockquote><p>…it cannot be proved [from Limited Atonement] that there is any inconsistency or insincerity [in the Gospel offer and call], that there is any injustice or deception, on God’s part, in anything which He says or does in this matter, even though the intended destination of the atonement was to effect and secure the forgiveness and salvation of the elect only, even though He did not design or purpose, by sending His son into the world, to save any but those who are saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/see-also.html">See Also</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol 2, “Extent of Atonement and Gospel Offer,” pp. 332-34 &amp; 343-348</cite>, p. 348</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is a Six-fold Commentary upon… Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>[For He does not punish from his heart] it arises not from God’s voluntary desire, but from the sin of man that God punishes; [and makes sorrowful the children of men] gives them cause by afflicting them to be vexed and grieved. Doctrine. [for etc.] sin constrains the Lord to afflict his dearest children: for the reasons hereof, see verse 27. … Doctrine. [not punish from his heart] God takes no delight in afflicting his children, Ps. 81:13; Isa. 1:24. The use is to teach us, first, to abhor their profaneness that say God sports Himself in punishing man. Secondly, by his example, to censure others with all remorse and pity, not delighting to disgrace them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-udall.html">John Udall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Lamentations of Jeremy... (London: Orwin, 1593), ch. 3, on v. 33</cite>, p. 127</span></figcaption>

<blockquote><p>velleitas (or velle): willingness; thus (1) the condition of having a capability of willing or the ability of a spiritual being to act without exterior compulsion; or (2) a general willingness or nonefficacious openness of will to the occurrence of something, as distinct from an actual or efficacious willing. See arbitrium; voluntas.</p></blockquote>

</figure><figure class="quote" id="q-9e96acf3b2" data-kw="">
<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy 28, verse 63</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>But love and fear press me to put you in mind, that it hath been in all ages the holy disposition &amp; happy practise of all God’s people waiting for the appearing of Jesus their Lord, tendering the weal of his spouse, and taking to heart the eternal salvation of their own souls; to set continually before their eyes. 1. His inestimable goodness towards his Kirk. 2. Her case and condition, while she is militant here on earth. And 3. in consideration of the one and the other, the duty required and expected at their hands, wherethrough in the goodness of God they have been safe from that dreadful ruin, that hath overtaken the wicked.

And which I wish you my beloved children to escape by calling to mind in like manner at this time of your danger and my distress. First how wonderful the Lord’s mercies have been towards me his Kirk in this nation. Secondly my present case crying with the complaints of a mother for help at your hands. And thirdly what is due from your affection, places, and callings to me, in whose womb ye were conceived, and by whose care ye are brought up to that which ye now are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The speech of the Kirk of Scotland to her beloved children</cite>, (Amsterdam, 1620), pp 2-3.</span></figcaption>

<blockquote><p>Lastly, as ’tis the greatest sin, so it makes men obnoxious to the saddest judgements of God, and severest punishments of the magistrate, when a man shall directly and purposely speak reproachfully of God, denying him in his attributes, or attributing that to Him which is inconsistent with his nature; this is called direct and immediate blasphemy, and if it be acted not out of infirmity of nature, the person not being distempered with sickness, melancholy, or madness; but out of malice, deliberation, and obstinacy; then the party is to die without mercy (Lev. 24:13-16). This was no judicial Law, peculiar only to the Jews, but it being of the Law of Nature, is an Universal Law for all Nations. He, whoever he be that shall directly and obstinately blaspheme the Name of the Lord; shall surely die. Hence wicked Jesabel, that she might stone Naboth to death, proclaims him a blasphemer (1 Kings 21:11, 14). This stoning endured till Christ’s time, as appears by their stoning of Steven (Acts 7). Now if every direct and obstinate blasphemers should be stoned to death in England, what showers of stones would there be in all parts of the land? And if Nebuchadnezzar, a heathen, by the light of Nature could make a decree, that who ever blasphemed the God of Heaven, or spake any thing amiss concerning Him, should be cut in pieces, and his house be made a Dung-hill (Dan. 3:29), how much more ought Christian Magistrates to make severe laws for the punishing of such high offenders; lest as their light and charge is greater, so they suffer double punishment. We see how careful magistrates are to punish thieves and murderers of men; and shall spiritual thieves, who rob God of his honor, deny his being, and since they cannot kill Him yet will smite Him with their tongue, be suffered to go unpunished? We see how tender great men are of their own names, honors, privileges, and lives; if any oppose them, he must die for it, and shall he that abuses and blasphemes the King of Kings, not die the death? Surely, as this is the greatest sin, so it should be punished with some eminent and remarkable punishment. This hellish sin defiles the land, and cannot be purged away, but by the death of the blasphemers. Impunity breeds blasphemy, and all manner of sin (Eccl. 8:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, (1658), pp. 64-65</span></figcaption>

<blockquote><p>In the midst of a debate at the 1833 Reformed Presbyterian Synod, Thomas Houston argued that the Mosaic judicials advocating the punishment of heretics were still applicable today. This did not mean that every heretic should automatically be put to death. As I understand it the ultimate sanction is only to be used in extreme and incorrigible cases of heresy, and thus in Houston’s writings he is careful not to argue that all heretics should be slain. In the Old Testament itself, judging by the examples of the reforming kings in Israel, it appears that lesser means were used to purge heresy and false worship before death was inflicted. It is worth keeping in mind that the Westminster Confession does not specify what penalties are maximum or mandatory, thus the question is extra-confessional and not a test of orthodoxy (incidentally, there is wide diversity among modern theonomists on these issues). Nevertheless, he did believe that the penal laws of common equity were obligatory today and that these demanded the suppression of heresy:

[I]n the Westminster Confession, ch. xxiii. art. 3, it is declared that the Civil Magistrate hath authority, and it is his duty to take order that unity and peace be preserved in the Church, &amp;c. and that all blasphemies and heresies be suppressed, &amp;c. That the compilers of the Confession intended that the Christian Magistrate should suppress heresy and idolatry by his official power, as direct offences against the Supreme Governor of the nation, and not merely under the notion of crime being associated with faction or rebellion against the State, is evident, first, from the Scripture passages which they adduce in proof, such as Ezra vii. 23; Levit. xxiv. 10; Deut. xiii. 5, &amp;c; 2 Chron. xxxiv. 33, &amp;c. These clearly show that our fathers regarded the judicial laws respecting the punishment of heresy and idolatry still obligatory under the New Testament, with the exception, which they specify in another article, viz. so far as the general equity thereof may require; and, likewise, that the conduct of the Jewish Magistrate in punishing heresy and idolatry is to be imitated by Christian Rulers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 23 July 1833.</span></figcaption>

<blockquote><p>In our case, murder being once for all forbidden, we may not destroy even the fœtus in the womb, while as yet the human being derives blood from other parts of the body for its sustenance. To hinder a birth is merely a speedier man-killing; nor does it matter whether you take away a life that is born, or destroy one that is coming to the birth. That is a man which is going to be one; you have the fruit already in its seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Apology</cite>, (c. 197), IX in Ante-Nicene Fathers, 3: 25.</span></figcaption>

</figure><figure class="quote" id="q-cac2629ee6" data-kw="">
<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again.

1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne.

2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off.

3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C].

4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>

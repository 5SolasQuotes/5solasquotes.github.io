<main class="wrap"><figure class="quote" id="q-49037c1d73" data-kw="">
<blockquote><p>…some speak of a sentence [in justification] before the angels, as if God did declare before them who is righteous; but this I think is altogether unscriptural: others speak of a sentence in conscience, but this is but the manifestation of justification. Let us first distinguish of justification, and then answer. There is a double justification, constitutive justification, whereby God makes us just in this life; sentential justification, whereby God pronounces us just at death and judgment. Constitutive justification is the foundation of sentential, for the true God will not pronounce us just unless we are such, and sentential justification is the compleature of constitutive: For here there is sententia judicis [a sentence of judgment] crowning us as righteous;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Faith considered in its Nature, Working &amp; Growth</cite>, … (London: Cockerill, 1675), ch. 7, pp. 207-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2c3d6d853" data-kw="against soul sleep">
<blockquote><p>When the dead are said to sleep (Jn. 11:11; 1 Cor. 11:30; 1 Thess. 4:15 and elsewhere), this is not to be understood with respect to the soul (which is received into heaven and lives with Christ), but with respect to the body (which must be recalled to life as from a sleep to an awakening). Passages which promise happiness after the resurrection do not thereby imply that souls sleep or are excluded from the vision of God before that time.</p></blockquote>

</figure><figure class="quote" id="q-1c3100eede" data-kw="death wages of sin">
<blockquote><p>Nor ought death to be called natural, as if man was necessarily to die even if he had not sinned—the fiction of Pelagius and Socinus against the express words of Paul who asserts that by sin death entered (Rom. 5:12) and the wages of sin is death (Rom. 6:23). It is also false that there can be a death which is not legal, since from no other source than from the power of the law and by its sanction was it ordained that man should die once.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.1</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 9.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor%20ought%20death%20to%20be%20called%20natural%2C%20as%20if%20man%20was%20necessarily%20to%20die%20even%20if%20he%20had%20not%20sinned%E2%80%94the%20fiction%20of%20Pelagius%20and%20Socinus%20against%20the%20express%20words%20of%20Paul%20who%20asserts%20that%20by%20sin%20death%20entered%20%28Rom.%205%3A12%29%20and%20the%20wages%20of%20sin%20is%20death%20%28Rom.%206%3A23%29.%20It%20is%20also%20false%20that%20there%20can%20be%20a%20death%20which%20is%20not%20legal%2C%20since%20from%20no%20other%20source%20than%20from%20the%20power%20of%20the%20law%20and%20by%20its%20sanction%20was%20it%20ordained%20that%20man%20should%20die%20once.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%209.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1c3100eede.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1c3100eede.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7b61e11f2c" data-kw="">
<blockquote><p>VI. Consummation or final perfection at the end of life. Hence death is called the abolition of sin by our [Heidelberg] Catechism, Question 42—just as the generation of one is called the corruption of another. For the abolition of sin is a consequent of death in the instant of nature, but a concomitant or connected thing in the instant of time. For these things happen simultaneously, so that in the first instant after death there is no longer any original sin, no struggle in the souls of the elect, and consequently no actual sin is any longer committed. This is elicited from 1 Cor. 13:9–10, colated with Heb. 12:23, where it treats of the state of blessed souls after death. To which also Heb. 4:10 can be referred, and the vow of the apostle in Phil. 1:21, 23, where τὸ κρεῖσσον [the better thing] is to be understood especially also with respect to the evil of guilt. This reason also is added: because nothing unclean shall enter (Rev. 21:27)—if indeed that place is expounded concerning the heavenly receptacle of souls—and Eph. 5:27. Finally, the final victory is in death and after death (2 Tim. 4:8). Therefore they are then free from all conflict, from every enemy—namely from that domestic one (Gal. 5:17, collated with Rom. 7:20). Problem 1. Whether Romans 7:24 can or ought to be understood as the body of sin or the old man, or rather as the mortal body which we carry about here? Response: Either can be understood.

      2. Whether the laying down of the body in death is properly called the adequate and proximate cause of its abolition, and can be demonstrated therefrom? Response: Negative.

      3. Whether the consummation of the sanctification of the soul departing hence is a work of the regenerating Spirit qua talis [as such]? Response: I do not see why this crowning and consummating grace cannot be attributed to the regenerating and sanctifying Spirit as such.

      4. Whether the regenerate soul here conducts itself purely passively, or rather actively concurs with the motion of the Spirit, and that by virtue of the new creature implanted in it as the principium quo [principle by which]? Response: The latter can be affirmed.

      5. Whether all that augmentation or degree which is required for perfection is infused at once and simultaneously, and thus added to the holiness or indwelling Spirit? Response: Affirmative.

      6. Whether in the same instant of time in which sanctification and holiness (namely, in first act) is perfected, it is also excited to second act? Response: Nothing absurd is committed if this is affirmed.

      7. Whether those very first acts elicited from perfection are to be reduced to the light of grace and the state of regeneration, or rather to the light of glory and the state of glorification? Response: I incline to the affirmative of the latter.

      8. Whether perfect sanctification is accomplished in the same instant of time in which a man dies, or rather in the instant after, or in some instants afterward—if indeed a small delay of time is said to intervene, during which the separated soul is locally transferred into heaven; so that, with that small delay intervening, or at least in the proximate instant after the instant of death and in the instant before entrance into heaven, this is accomplished, and thus it does not enter into heaven without perfection? Response: I would rather ἐπέχειν [suspend judgment] here and hear the opinions of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-da021a173b" data-kw="">
<blockquote><p>2. All things are in God in three ways: in his power as in an efficient cause, in his idea as in an exemplar cause, in his knowledge as in one knowing. Whence the threefold being of creatures in God: eminent, ideal, intelligible. But this whole being is objective, without any composition or commingling, just as light is in air and air in light: Augustine, On the Literal Interpretation of Genesis, bk. 4, ch. 12, and On the Trinity, bk. 14, ch. 12; Cyril of Alexandria on John, bk. 9, ch. 40. See further the Scholastics on Summa Theologiae, pt. I, quest. 18, art. 4; Suárez, On God, bk. 2, ch. 2; and the commentators on Acts 17:28; 2 Pet. 1:4. And the philosophers explaining that axiom: ‘In a certain way, all things are four: God, heaven, prime matter, intellect.’ 3. God communicates his essence, life, goodness outside Himself, or ad extra, in the genus of efficient, exemplar, final cause, and indeed not naturally but freely, not through essence but through grace, so that for example all things participate of his goodness and are good by it extrinsically and causally, but by their proper goodnesses formally: Thomas, Summa Theologiae, pt. I, quest. 7, art. 4. Meanwhile they remain most distinct in individual and in species or univocal genus: the essence or goodness of God, and the essence or goodness produced in creatures to the likeness or image of the divine. But that communication of the divine essence is fivefold: 1. through creation, 2. through the grace of adoption, 3. through glory and beatitude, 4. through love and desire, 5. through incarnation;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations | pt. 1, On the One &amp; Most Simple Essence of God, pp. 233-34 Latin</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cf24ff127" data-kw="">
<blockquote><p>Now God is creator alone, acknowledging no associates in this work, Isa. 44:24; Job 9:8. The reason for this is that creation is a work of infinite Divine power, Jer. 32:17, which, as He alone possesses, so He alone also can create—so that Jeremiah rightly pronounces, Jer. 10:10-12: ‘Those gods who have not made the heavens and the earth shall perish from the earth. But Jehovah is the true God, the living God, and everlasting King, who made the earth by His power,’ etc.</p></blockquote>

</figure><figure class="quote" id="q-3dd1700e32" data-kw="">
<blockquote><p>It is necessary to attribute providence to God. For all the good that is in created things has been created by God, as was shown above (Q. 6, A. 4). In created things good is found not only as regards their substance, but also as regards their order towards an end and especially their last end, which, as was said above, is the divine goodness (Q. 21, A. 4). This good of order existing in things created, is itself created by God. Since, however, God is the cause of things by His intellect, and thus it behooves that the type of every effect should pre-exist in Him, as is clear from what has gone before (Q. 19, A. 4), it is necessary that the type of the order of things towards their end should pre-exist in the divine mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 22, art. 1, I answer that</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Q. In what time was the world created? A. Every particular thing quickly, and as it were in an instant, and the whole in the space of six days. … Q. Why was God six days in making the world? A. Not because He needed so much time, but that we might more distinctly consider of his works.</p></blockquote>

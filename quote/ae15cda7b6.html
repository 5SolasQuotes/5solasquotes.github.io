<main class="wrap"><figure class="quote" id="q-ae15cda7b6" data-kw="">
<blockquote><p>There are with us Doctors of Divinity who teach in schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3:10, under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their colleges, were young prophets, or sons of the prophets, as 1 Sam. 10:5; 2 Kings 2:7; 2 Kings 4:1; 1 Kings 20:35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Prov. 22:6; Eph. 6:4, if they aim at the ministery, prophecy in our presbyterial meetings, 1 Cor. 14:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland (London, 1642) | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | Article 10, Schools and Doctors</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“There are with us Doctors of Divinity who teach in schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3:10, under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their colleges, were young prophets, or sons of the prophets, as 1 Sam. 10:5; 2 Kings 2:7; 2 Kings 4:1; 1 Kings 20:35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Prov. 22:6; Eph. 6:4, if they aim at the ministery, prophecy in our presbyterial meetings, 1 Cor. 14:29.”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland (London, 1642) | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | Article 10, Schools and Doctors">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+are+with+us+Doctors+of+Divinity+who+teach+in+schools+and+Universities%2C+men+tried+to+be+holy+and+learned%2C+and+then+put+in+office%2C+as+1+Tim.+3%3A10%2C+under+whose+instruction+are+students+aiming+at+the+holy+ministry+called+expectants%2C+as+in+the+Jewish+Church+in+their+colleges%2C+were+young+prophets%2C+or+sons+of+the+prophets%2C+as+1+Sam.+10%3A5%3B+2+Kings+2%3A7%3B+2+Kings+4%3A1%3B+1+Kings+20%3A35.+These+Doctors+and+also+the+teachers+of+human+literature%2C+who+train+up+children+in+the+nurture+and+admonition+of+the+Lord%2C+Prov.+22%3A6%3B+Eph.+6%3A4%2C+if+they+aim+at+the+ministery%2C+prophecy+in+our+presbyterial+meetings%2C+1+Cor.+14%3A29.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland+%28London%2C+1642%29+%7C+Ch.+20%2C+Whether+or+not+the+government+of+the+Church+of+Scotland+can+be+proved+by+God%E2%80%99s+Word+to+be+lawful%3F+%7C+Article+10%2C+Schools+and+Doctors&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae15cda7b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae15cda7b6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/teachers/#:~:text=There%20are%20with%20us%20Doctors%20of,our%20presbyterial%20meetings%2C%201%20Cor.%2014%3A29." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50503ba649" data-kw="">
<blockquote><p>VI. That phrase by which pastors and ministers of churches in the N.T. are called priests seems incorrect and abusive in some way. Why do they not call the churches synagogues by the same right? Why do they not revive the rest of the technologisms of Judaism (from which the apostles abstain in the N.T.)?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Sacrifice of Melchizedek, on Gen. 14:18’ tr. Onku with AI in Select Disputations (Utrecht, 1669), vol. 4</cite>, p. 533 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“VI. That phrase by which pastors and ministers of churches in the N.T. are called priests seems incorrect and abusive in some way. Why do they not call the churches synagogues by the same right? Why do they not revive the rest of the technologisms of Judaism (from which the apostles abstain in the N.T.)?”

</figure><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

</figure><figure class="quote" id="q-22ecc7abf5" data-kw="">
<blockquote><p>Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had.</p></blockquote>

</figure><figure class="quote" id="q-a190a878ae" data-kw="">
<blockquote><p>And though women be forbidden authoritatively to teach in the Church, 1 Tim. 2:7; 1 Cor. 14, and publicly, yet they may teach the younger women, Tit. 2:2-3, give a seasonable rebuke and counsel to men, 2 Sam. 20:16-17; 1 Sam 25:23-24, 32-33, and a woman, a sister is to labor to gain a sister, by Mt. 18, and that in a Church-way; and women, as other Church-members, are to teach, exhort, warn, according to their place, as well as men, Col. 3:16; Rom. 15:14; 1 Thess. 5:14; Heb. 3:13 &amp; 20, 25.</p></blockquote>

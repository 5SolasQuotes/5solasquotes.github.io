<main class="wrap"><figure class="quote" id="q-6d07731405" data-kw="">
<blockquote><p>1. Where the authority of God evidences itself … and confirmed to the mind, believers have a stable and sure foundation for their faith, whether they use translations or the originals, though it must be allowed, where persons are capable of it, the originals are most satisfying.

And this is plainly the case, as all real Christians from certain experience know, as to all the truths of the greatest importance, and whereon our faith or obedience are more immediately or directly concerned: so that as to these there is no room left for this objection.

2. The wisdom of God has so carefully provided for the security and stability of our faith, as to particular truths of any considerable importance, against pretences of this, or of a like nature, that our faith rests not upon the evidence of one single testimony, but such truths upon a variety of occasions are often repeated, and our faith leans upon them, not only as thus frequently repeated, but cleared and confirmed by their connection to other truths, which infer them and the whole analogy of faith, or current of the Scriptures, with respect to that which is the principal design of God. So that we are in no hazard of being deprived of any one truth, of any considerable influence, in faith or practice by pretended corruptions, or wrong translations.

The famous Dr. [John] Owen, who had considered the whole various readings, and well knew the failures of particular translations, observes, that were all the various readings added to the worst and most faulty translation, the church of God would not sustain by it the loss of one important truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay Concerning the Nature of Faith; or, The Ground upon which Faith Assents to the Scriptures</cite>, (1714) in Faith and Justification (Gwynedd: James Begg Society, 2000), pp 70-71.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef55d607ed" data-kw="">
<blockquote><p>Accordingly, Rivet rejected the medieval quadriga [four-fold interpretation] and argued that the source of all theological conclusions was the literal sense of the text ([Isagogue] chap. 14[:1; C.f. 15:20]). At the same time, he recognized that the literal sense of Holy Scripture included various figures and types; yet allegories, tropes, and anagogy he understood as false readings when they were imposed on the text rather than being identified as integral to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Willem van Asselt in Theology of the French Reformed Churches</cite>, (RHB, 2014), p. 261</span></figcaption>

<blockquote><p>Let this point therefore stand: that those whom the Holy Spirit has inwardly taught truly rest upon Scripture, and that Scripture indeed is self-authenticated; hence, it is not right to subject it to proof and reasoning. And the certainty it deserves with us, it attains by the testimony of the Spirit. … For as God alone is a fit witness of himself in his Word, so also the Word will not find acceptance in men&#x27;s hearts before it is sealed by the inward testimony of the Spirit.</p></blockquote>

</figure><figure class="quote" id="q-33fb3b11d1" data-kw="">
<blockquote><p>We make our prayers in that tongue which all our people, as meet is, may understand, to the end they may (as Paul counselleth us) take common commodity by common prayer, even as all the holy fathers and Catholic bishops, both in the Old and New Testament, did used to pray themselves, and taught the people to pray too, lest, as Augustine saith, &quot;like parrots and ousels we should seem to speak that we understand not.&quot; Neither have we any other mediator and intercessor, by whom we may have access to God the Father, than Jesus Christ, in whose only Name all things are obtained at His Father&#x27;s hand.</p></blockquote>

</figure><figure class="quote" id="q-f06f0da33b" data-kw="hebrew greek">
<blockquote><p>The following arguments prove that the sources have not been corrupted. (1) The providence of God which could not permit books which it willed to be written by inspiration (theopneustois) for the salvation of men (and to continue unto the end of the world that they might draw from them waters of salvation) to become so corrupted as to render them unfit for this purpose. And since new revelations are not to be expected (after God has recorded in the Scriptures his entire will concerning the doctrine of salvation), what can be more derogatory to God (who has promised his constant presence with the church) than to assert that he has permitted the books containing this doctrine to become so corrupt that they cannot serve as a canon of faith? (2) The fidelity of the Christian church and unceasing labor in preserving the manuscripts; for since Christians have always labored with great zeal to keep this sacred deposit uncorrupted, it is not credible that they would either corrupt it themselves or suffer it to be corrupted by others. (3) The religion of the Jews who have bestowed upon the sacred manuscripts great care and labor amounting even to superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.10</span></figcaption>

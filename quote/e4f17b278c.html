<main class="wrap"><figure class="quote" id="q-e4f17b278c" data-kw="">
<blockquote><p>Legislating upon, and even against, the Word of God, is the burning, yea, the damning spot on Britain’s escutcheon. A part of the daily wailings of Cassandra, as she roamed throughout her father’s halls, is given us by the poet, thus – “Cry, Trojans, cry, a Helen and a woe.” Cassandra-like, my wail is, cry, Britain, cry, legislation upon and against the Bible, and a woe; cry, Britain, cry, the national support given to Popery, Prelacy, and Erastianism, and a woe; cry, Britain, cry, shameful Sabbath desecration, and a woe; cry, Britain, cry, the yet unconfessed and unrepented of, act of national apostacy and perjury, when the Solemn League and National Covenant were publicly burned at Linlithgow, May 29 1661 (an act acquiesced in by every church in the Three Kingdoms with the exception of the R. P. Church), and a woe! “Hear, O earth: behold, I will bring evil upon this people, even the fruit of their thoughts, because they have not hearkened unto my words, nor to my law, but rejected it” (Jer. vi. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>…the minister who is to preach is to… to call upon the Lord to this effect: ‘To acknowledge our great sinfulness, First, by reason of original sin, which… doth defile our best actions… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed. And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord…&#x27;</p></blockquote>

</figure><figure class="quote" id="q-0433b9d43f" data-kw="">
<blockquote><p>And here appeareth the abuse of our time, which following rather the phantasy of carers or painters, than the word of God have set up in churches the image (as they call it) of the Trinity, where they portrayed God the father like an old man with a long hairy beard. And what can simple people learn herby, but error, and ignorance?

Have not many thought that God the father is a bodily substance, &amp; that he hath a face, and beard, hands, and feet, because they see him so painted? And for this consideration saith saint Austen [Augustine], it is a detestable thing for Christian men to have any such image of God in the church, whereby it appeareth that in saint Austen’s times, there were no such images in christen churches, but that it is an invention of the papists brought in of later years, which bringeth us not unto the true knowledge of god, but leadeth vs into errors and ignorance of God. …

We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be led to the knowledge of God without painted or carved images. Now peradventure some will say that Christ hath a body, and likewise have saints, &amp; therefore of them we may have images although of God there can be made no image. And further they will say, that the cause why images were forbid, was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images.

Yet as I will not utterly deny but they may be had, so I think it more convenient for Christian religion that they should be taken out of Christian men’s churches, then that they should be placed in the temple of God. [1] And of this my opinion I will shew you certain good grounds, to the intent that when you be demanded, why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images. That if any man shall hereafter god about craftily to bring in images again for his own lucre sake, they may the sooner perceive his Iuglynge [sic], and so the better avoid the peril and danger.

First it is certain, that we neither have commandment, counsel nor example of the scripture, nor of the primitive church in the apostles’ time, nor many years after to set up images in our churches. … It cannot be said that images be necessary, for then we condemn the apostles, and al the holy men in the primitive church, yea and Christ himself also because they used no such thing, nor yet that they be profitable, for if they had, either Christ would have taught it or the holy ghost would have revealed it, unto the apostles which they did not. And if they did, the apostles, were very negligent that would not make some mention of it, and speak some good word for images, seeing that they speak so many against them.

And by this means Antichrist and his holy papists, had more knowledge or fervent zeal to give us godly things, and profitable for us, than had the very holy saints of Christ, yea more than Christ himself, and the holy ghost. Now forasmuch good children, as images be neither necessary nor profitable in our churches and temples, nor were not used at the beginning in Christ nor the apostles time, nor many years after, and that at length they were brought in by Bishops of Rome …, &amp; seeing also that they be very slanderous to Christ’s religion, for by them the name of God is blasphemed among the infidels, Turks, and Jews, which because of our images do call Christian religion Idolatry and worshipping of images.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechismus, that is to say, a short instruction into Christian religion for the singular commodity and profit of children and young people</cite>, (n.p., 1548), unpaginated.</span></figcaption>

And by this means Antichrist and his holy papists, had more knowledge or fervent zeal to give us godly things, and profitable for us, than had the very holy saints of Christ, yea more than Christ himself, and the holy ghost. Now forasmuch good children, as images be neither necessary nor profitable in our churches and temples, nor were not used at the beginning in Christ nor the apostles time, nor many years after, and that at length they were brought in by Bishops of Rome …, &amp; seeing also that they be very slanderous to Christ’s religion, for by them the name of God is blasphemed among the infidels, Turks, and Jews, which because of our images do call Christian religion Idolatry and worshipping of images.”

— Thomas Cranmer, Catechismus, that is to say, a short instruction into Christian religion for the singular commodity and profit of children and young people, (n.p., 1548), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+here+appeareth+the+abuse+of+our+time%2C+which+following+rather+the+phantasy+of+carers+or+painters%2C+than+the+word+of+God+have+set+up+in+churches+the+image+%28as+they+call+it%29+of+the+Trinity%2C+where+they+portrayed+God+the+father+like+an+old+man+with+a+long+hairy+beard.+And+what+can+simple+people+learn+herby%2C+but+error%2C+and+ignorance%3F%0A%0AHave+not+many+thought+that+God+the+father+is+a+bodily+substance%2C+%26+that+he+hath+a+face%2C+and+beard%2C+hands%2C+and+feet%2C+because+they+see+him+so+painted%3F+And+for+this+consideration+saith+saint+Austen+%5BAugustine%5D%2C+it+is+a+detestable+thing+for+Christian+men+to+have+any+such+image+of+God+in+the+church%2C+whereby+it+appeareth+that+in+saint+Austen%E2%80%99s+times%2C+there+were+no+such+images+in+christen+churches%2C+but+that+it+is+an+invention+of+the+papists+brought+in+of+later+years%2C+which+bringeth+us+not+unto+the+true+knowledge+of+god%2C+but+leadeth+vs+into+errors+and+ignorance+of+God.+%E2%80%A6%0A%0AWe+have+also+the+holy+scriptures+which+declare+unto+us+the+wonderful+works+of+God%2C+by+which+things+we+may+be+led+to+the+knowledge+of+God+without+painted+or+carved+images.+Now+peradventure+some+will+say+that+Christ+hath+a+body%2C+and+likewise+have+saints%2C+%26+therefore+of+them+we+may+have+images+although+of+God+there+can+be+made+no+image.+And+further+they+will+say%2C+that+the+cause+why+images+were+forbid%2C+was+peril+of+idolatry%2C+and+worshipping+of+them.+So+that+where+there+is+no+such+peril%2C+we+may+have+images.%0A%0AYet+as+I+will+not+utterly+deny+but+they+may+be+had%2C+so+I+think+it+more+convenient+for+Christian+religion+that+they+should+be+taken+out+of+Christian+men%E2%80%99s+churches%2C+then+that+they+should+be+placed+in+the+temple+of+God.+%5B1%5D+And+of+this+my+opinion+I+will+shew+you+certain+good+grounds%2C+to+the+intent+that+when+you+be+demanded%2C+why+we+English+men+have+no+images+in+our+churches%2C+you+may+be+able+to+make+thereunto+a+reasonable+answer%2C+and+that+also+in+time+to+come+you+may+declare+to+your+children+what+abuses+have+crept+into+the+church+by+the+occasion+of+images.+That+if+any+man+shall+hereafter+god+about+craftily+to+bring+in+images+again+for+his+own+lucre+sake%2C+they+may+the+sooner+perceive+his+Iuglynge+%5Bsic%5D%2C+and+so+the+better+avoid+the+peril+and+danger.%0A%0AFirst+it+is+certain%2C+that+we+neither+have+commandment%2C+counsel+nor+example+of+the+scripture%2C+nor+of+the+primitive+church+in+the+apostles%E2%80%99+time%2C+nor+many+years+after+to+set+up+images+in+our+churches.+%E2%80%A6+It+cannot+be+said+that+images+be+necessary%2C+for+then+we+condemn+the+apostles%2C+and+al+the+holy+men+in+the+primitive+church%2C+yea+and+Christ+himself+also+because+they+used+no+such+thing%2C+nor+yet+that+they+be+profitable%2C+for+if+they+had%2C+either+Christ+would+have+taught+it+or+the+holy+ghost+would+have+revealed+it%2C+unto+the+apostles+which+they+did+not.+And+if+they+did%2C+the+apostles%2C+were+very+negligent+that+would+not+make+some+mention+of+it%2C+and+speak+some+good+word+for+images%2C+seeing+that+they+speak+so+many+against+them.%0A%0AAnd+by+this+means+Antichrist+and+his+holy+papists%2C+had+more+knowledge+or+fervent+zeal+to+give+us+godly+things%2C+and+profitable+for+us%2C+than+had+the+very+holy+saints+of+Christ%2C+yea+more+than+Christ+himself%2C+and+the+holy+ghost.+Now+forasmuch+good+children%2C+as+images+be+neither+necessary+nor+profitable+in+our+churches+and+temples%2C+nor+were+not+used+at+the+beginning+in+Christ+nor+the+apostles+time%2C+nor+many+years+after%2C+and+that+at+length+they+were+brought+in+by+Bishops+of+Rome+%E2%80%A6%2C+%26+seeing+also+that+they+be+very+slanderous+to+Christ%E2%80%99s+religion%2C+for+by+them+the+name+of+God+is+blasphemed+among+the+infidels%2C+Turks%2C+and+Jews%2C+which+because+of+our+images+do+call+Christian+religion+Idolatry+and+worshipping+of+images.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cranmer%2C+Catechismus%2C+that+is+to+say%2C+a+short+instruction+into+Christian+religion+for+the+singular+commodity+and+profit+of+children+and+young+people%2C+%28n.p.%2C+1548%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0433b9d43f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0433b9d43f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/02/thomas-cranmer-on-the-error-of-images-in-christian-churches/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

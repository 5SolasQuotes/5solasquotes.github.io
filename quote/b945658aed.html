<main class="wrap"><figure class="quote" id="q-b945658aed" data-kw="">
<blockquote><p>The first, the most obvious, and the most decisive argument against this doctrine is, that, so far as any work or act of the sinner is concerned, the Bible everywhere teaches that the only indispensable condition of salvation is faith in Jesus Christ.… Whosoever believes on the Son hath everlasting life. This stands firm. It matters not to what Church he may belong; it matters not whether he be Jew or Gentile, bond or free, learned or unlearned, good or bad, baptized or unbaptized, whosoever believes shall be saved.… Neither does the Bible anywhere teach that Christian baptism effects either pardon or regeneration in those still out of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Direct Arguments against the Doctrine of Baptismal Regeneration”</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4c1b9cb59" data-kw="">
<blockquote><p>If the sacraments are said to remit sins, to save and to regenerate (Acts 2:38; 22:16; Eph. 5:26; Tit. 3:5; 1 Pet. 3:21), they do not do this by a proper, immediate and internal force (as is evident from 1 Pet. 3:21). Rather they do it sacramentally and improperly because they are efficacious signs by which those benefits are signified and sealed and in their legitimate use conferred.… When remission of sins is ascribed to baptism (Acts 22:16), it is not ascribed to it except under the relation of a sign and seal and not under the relation of a true, proper and immediate physical cause… In fine, although that remission is ascribed to baptism, it does not belong to it by reason of the external action properly, but by reason of the internal grace and receiving faith, without which all the external ablution is in vain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Topic 19</span></figcaption>

</figure><figure class="quote" id="q-70fbe0dd05" data-kw="">
<blockquote><p>The schools of the Sophists have taught with remarkable agreement that the sacraments of the new law (those now used in the Christian church) justify and confer grace, provided we do not set up a barrier of mortal sin. How deadly and pestilential this notion is cannot be expressed — and the more so because for many centuries it has been a current claim in a good part of the world, to the great loss of the church. Of a certainty it is diabolical. For in promising a righteousness apart from faith, it hurls souls headlong to destruction… Hence, any man is deceived who thinks anything more is conferred upon him through the sacraments than what is offered by God’s Word and received by him in true faith. From this something else follows: assurance of salvation does not depend upon participation in the sacrament, as if justification consisted in it. For we know that justification is lodged in Christ alone, and that it is communicated to us no less by the preaching of the gospel than by the seal of the sacrament, and without the latter can stand unimpaired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.14.14</span></figcaption>

</figure><figure class="quote" id="q-0286a9a64d" data-kw="">
<blockquote><p>While the grace of God generally operates mediately, it is not inherent in the means as a divine deposit, but accompanies the use of these. This must be maintained in opposition to the Roman Catholics, the High Church Anglicans, and the Lutherans, who proceed on the assumption that the means of grace always operate in virtue of an inherent power, though their operation may be made ineffective by the condition or attitude of the recipient. Protestants, on the other hand, teach that the sacraments are not absolutely necessary unto salvation, but are obligatory in view of the divine precept.… That they are not absolutely necessary unto salvation, follows… from the fact that Scripture mentions only faith as the instrumental condition of salvation… and from the fact that the sacraments do not originate faith but presuppose it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Means of Grace; Necessity of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-305c2b20cb" data-kw="">
<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on Mark 16:16 (the necessity of baptism)</span></figcaption>

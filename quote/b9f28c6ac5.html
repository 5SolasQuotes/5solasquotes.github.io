<main class="wrap"><figure class="quote" id="q-b9f28c6ac5" data-kw="">
<blockquote><p>Believing commonly signifies an act of the understanding, yielding assent to testimony. But because the will tends to be moved upon that understanding, and to stretch itself forth to embrace the good allowed by it, therefore Faith aptly enough sets forth this act of the will also. … Hence Faith is carried to that good which is made ours by it; it is an act of election, an act of the whole man, which in no way agrees to a mere act of the understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, 1.3.2–3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e401e1a03f" data-kw="">
<blockquote><p>Hence we conclude that the knowledge of faith consists more of certainty than discernment. … We add, that it is sure and firm, the better to express strength and constancy of persuasion. For as faith is not contented with a dubious and fickle opinion, so neither is it contented with an obscure and ill-defined conception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.14–15</span></figcaption>

</figure><figure class="quote" id="q-c59794d9a4" data-kw="">
<blockquote><p>And this promise must be gratuitous; for a conditional promise, which throws us back upon our works, promises life only in so far as we find it existing in ourselves. Therefore, if we would not have faith to waver and tremble, we must support it with the promise of salvation, which is offered by the Lord spontaneously and freely, from a regard to our misery rather than our worth.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a4024f7cad" data-kw="">
<blockquote><p>The opinion that the sacraments are but bare signs and seals of God’s promise and grace to us, doth not a little hinder piety: whereas, indeed, they are seals, as well of our service and obedience unto God; which service if we perform not to him, the sacraments seal no grace to us.

But if we receive them, upon the resolution to be his faithful and penitent servants, then the sacraments do not only signify and offer, but also seal and exhibit indeed the inward spiritual grace which they outwardly promise and represent.

And to this end baptism is called the “washing of regeneration, and renewing of the Holy Ghost,” (Tit. iii. 5;) and the Lord’s Supper, “the communion of the body and blood of Christ.” (1 Cor. x. 16.) Were this truth believed, the holy sacrament of the Lord’s Supper would be more often, and with greater reverence received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), p. 86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general.html">The Sacraments in General</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-35927c7d95" data-kw="">
<blockquote><p>I had in answer to Mr. [William] Prynne’s third Query, given this reason why profane and scandalous persons are to be kept off from the Sacrament, and yet not from hearing the Word: because the word is not only a confirming and comforting, but a converting Ordinance, and is a mean appointed of God to turn sinners from darkness to light, and from the power of Satan to God: Whereas the Sacrament is not a converting, but a confirming and sealing Ordinance, which is not given to the Church for the conversion of Sinners, but for the Communion of Saints: It is not appointed to put a man in the state of grace, but to seal unto a man that interest in Christ and in the Covenant of Grace which he already hath.

Mr. Prynne doth with much eagerness contradict me in this, and argue at length the contrary. (Which is the marrow and fatness (if there be any) in his debate concerning the eighth point of difference) Whereby he doth not only contradict me, but himself too (as shall appear) yea and join not only with the more rigid Lutherans, but with the Papists themselves against the Writers of the Reformed Churches. For the very same thing which is controverted between him and me, is controverted between Papists and Protestants. The Papists hold that the Sacraments are instrumental, to confer, give, or work grace; yea ex opere operato.

Our divines hold that the Sacraments are appointed of God, and delivered to the Church as sealing Ordinances, not to give, but to testify what is given, not to make, but confirm Saints. And they do not only oppose the Papists’ opus operatum, but they simply deny this instrumentality of Sacraments, that they are appointed of God for working or giving grace where it is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, The Divine Ordinance of Church Government Vindicated, So as the present Erastian Controversy concerning the distinction of Civil and Ecclesiasticall Government, Excommunication, and Suspension, is fully debated and discussed, from the holy Scripture, from the Jewish and C</cite>, (London: Richard Whitaker, 1646), Book 3.12, p. 229.</span></figcaption>

</figure><figure class="quote" id="q-b72f941944" data-kw="">
<blockquote><p>Lastly, the names given to this sacrament, noting the nature thereof, do afford us a good consideration to strike through the heart of this private mass, being called sometimes the Supper of the Lord, and sometimes a Communion among ourselves. If it be an holy supper and spiritual banquet, why are none bidden and called thereunto? If it be a communion, why does the priest uncharitably swallow all alone? whereby they make it a communion, but without company: a supper, but without guests: meat, but without eating: drink, but without drinking: a table, but without sitting down: a participation, but without any that are partakers: a banquet, but without seeding thereat, the people departing as hungry and thirsty as they came. Wherefore, as no man celebrated the Passover aright, or received profit thereby, but such as did eat the flesh thereof: so can none come to the supper of the Lord as he ought, though he look upon others, except he eat of the bread and drink of the cup, according to the commandment of Christ, the author thereof. And thus much of the sole communions and private masses brought into the church against the example of Christ against the use of the apostles, and against the name and nature of the sacrament itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), bk. 3, ‘Of the Lord’s Supper’, pp. 278-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

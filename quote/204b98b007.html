<main class="wrap"><figure class="quote" id="q-204b98b007" data-kw="">
<blockquote><p>St. Augustine says, ‘The church ought not to be preferred before Jesus Christ. For He always judges truly; but the ecclesiastical judges often may deceive themselves and truly do so.’ For who condemned Jesus Christ? A council lawfully assembled, if we consider that outward succession and appearance. Who concluded that those who were baptized by heretics should be re-baptized? A council in Africa where St. Cyprian was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theodore Beza’s Confession</cite>, (1560): A Brief &amp; Pithy Sum of Christian Faith’, 5th Point, ‘Of the Church’, 12. ‘How Far We May Differ from Councils’ in Reformed Confessions of the 16th &amp; 17th Centuries, ed. Dennison (RHB, 2010), vol. 2, pp. 311-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“St. Augustine says, ‘The church ought not to be preferred before Jesus Christ. For He always judges truly; but the ecclesiastical judges often may deceive themselves and truly do so.’ For who condemned Jesus Christ? A council lawfully assembled, if we consider that outward succession and appearance. Who concluded that those who were baptized by heretics should be re-baptized? A council in Africa where St. Cyprian was.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6b2e80d829" data-kw="">
<blockquote><p>IV. (2) …Laws bind the conscience per se and directly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly, and a violation of them incurs guilt; but constitutions bind the conscience only indirectly and mediately in case of scandal and contempt. Hence the guilt arising from their violation is not properly on account of the violation of the constitution, but on account of the neglect of the authority which God ordained, and on account of the scandal given. … XX. Again, in the transgression of them [church constitutions] there can be no sin except indirectly (i.e., not on account of the usurpation of the thing itself [as in homicide, fornication], but on account of another thing [that is, from contempt of lawful authority], for because obedience is commanded by God, there is sin in a neglect of it, if with a neglect of brotherly edification, or if from impiety and license. However, if all these are absent, there will be no sin in a transgression of them… nor is the authority of the one commanding to be so much regarded as the cause of the command.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, pp. 285-6, 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-84003b4470" data-kw="">
<blockquote><p>Besides, do not our divines require that the Church’s canons, even in matters of rite, be ‘profitable to the edification of the Church’ (Polanus, Syntagma, bk. 7, ch. 17); and that the observation of the same, must carry before it a manifest utility (Calvin, Institutes, bk. 4, ch. 10, §32); that in rites and ceremonies the Church has no power to destruction, but only to edification? (Chemnitz, Examination, part 2, p. 121)… Do they not teach that no idle ceremony, which serves not unto edifying, is to be suffered in the Church (Paraeus, on 1 Cor. 14:26; John Calvin, Epistolarum &amp; Responsorum, col. 478); and that godly bretheren are not holden to subject themselves unto such things as they perceive neither to be right nor profitable? (Calvin, on 1 Cor. 10:23; Taylor on Titus 1:15, p. 295) That whatsoever either would scandalize our brother, or not be profitable to him for his edification, Christians for no respect must dare to meddle with it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Edinburgh, 1637) | pt. 2, ch. 1, p. 8</span></figcaption>

</figure><figure class="quote" id="q-0c33103c99" data-kw="">
<blockquote><p>Second, there are means of a most indispensable kind to be employed in the way of explanation and instruction, counsel and persuasion, to secure the convictions and concurrence of the private members of the Church, in whatever act or declaration the rulers, in the exercise of their judicial, or legislative, or administrative functions, may find it necessary for them to perform or to adopt. Without the use of such means to carry the conscience and understanding of the members of the Church along with them in all that they do and declare, the office-bearers are not at liberty to use or enforce their peculiar power at all. And it is only when all such means have been employed and exhausted without effect, and when the members of the Church, so dealt with in the way of Christian persuasion and instruction, still refuse their concurrence, that it may be necessary and is lawful to use authority to strengthen the appeal, and to fall back upon the ultimate resource of all societies, — namely, the inherent right of the rulers to rule, and the no less inherent duty of the ruled to obey.</p></blockquote>

ne</a></div>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [prelate] Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches and Gregory de Valentia, as I show[ed] before… …when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo [therefore], it [the Church’s judgment] cannot remove my doubting and beget faith… 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

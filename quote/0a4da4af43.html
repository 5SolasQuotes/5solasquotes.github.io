<blockquote><p>A debate arose among Reformed divines in the 1620s and 30s, particularly in England, over the issue of baptismal regeneration. A variety of interpretations of passages like Titus 3:5 and 1 Peter 3:21 were proposed and there was debate over how to interpret Augustine and even Calvin on this issue. In the past it was thought that this debate arose in response to Anabaptist arguments against the propriety of infant baptism. Jay Colier, however, has convincingly argued in his recent book, that the debate was actually set off by the Synod of Dort, specifically the canon affirming the perseverance of all the saints. Prior to Dort, Reformed confessions did not explicitly affirm the doctrine of perseverance, allowing some variation in how the doctrine was taught, though no one outright denied it… In affirming and codifying the absolute perseverance of every saint, however, the Synod of Dort and its canons gave a greater sense of urgency to the issue, removing any gray area that would permit a general sort of regeneration for non-elect infants that might be lost when a child reaches maturity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eric-parker.html">Eric Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Debating Baptismal Regeneration: Johannes Maccovius’</cite>, (2018)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/nature-of-perseverance.html">Nature of Perseverance</a></span></div>

v>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9078428041" data-kw="">
<blockquote><p>While one may find a confession like the Irish Articles (1615) explicitly stating perseverance of all those who are regenerate and have true faith (Art. 38), many Reformed confessions, like the First Helvetic Confession (1536), simply don’t address the topic. Similarly, doctrinal standards like the Belgic Confession (1561) and the Heidelberg Catechism (1563), which many people find conducive to the perseverance of the saints, never clearly state it. And while the tenth chapter of the Second Helvetic Confession (1566) may be suggestive of perseverance of the saints when it identifies those engrafted in Christ by faith with the elect, it does not come out and say that those with true faith cannot lose it. Other confessions, like the Thirty-Nine Articles (1563), speak of the elect attaining everlasting felicity (Art. 17) without ever specifying that everyone with saving faith is elect. This path was even followed by the French Confession (1559) and the Confession of La Rochelle (1571), which were highly influenced by Calvin and the Reformers in Geneva. But the fact that so many Reformed confessions did not require adherence to the perseverance of the saints does not mean that the doctrine was not prominent. To the contrary, the fact that the confessions did not deny it allowed the doctrine to flourish among the Reformed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-t-collier.html">Jay T. Collier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Debating Perseverance: the Augustinian Heritage in Post-Reformation England Pre</cite>, (Oxford, 2018) 207 pp. ToC, pp. 11-12</span></figcaption>

<blockquote><p>Controversy VIII: Can justifying faith be lost? Thesis: Although the elect frequently fall into grave sins and thus lose faith in its act, time, and part, they are not completely abandoned by God, nor do they totally and finally lose faith and the other gifts of the Holy Spirit in terms of the root and habit, even if they may lose them in terms of quantity. [Romanist] Antithesis: Justifying faith and justice not only can be totally and finally lost but are sometimes indeed lost. Confirmation of the Thesis:

1. Scripture teaches that Christ’s sheep cannot perish (John 10) and that nothing can separate them from the love of God (Romans 8).

2. Faith is our victory by which we overcome the world (1 John 5).

3. God does not abandon the work of His hands (Psalm 138), nor does He tempt His own beyond their strength, but provides a happy escape (1 Corinthians 10). [Romanist] Confirmation of the Antithesis:

1. “The righteous can turn from their justice” (Ezekiel 18).

2. Some fall temporarily (Luke 8), and the charity of many will grow cold (Matthew 24). Many fall from the grace of God (Galatians 5). Many also depart from the faith (1 Timothy 4 and 6).

3. Some branches in Christ do not bear fruit and are thrown into the fire (John 15).

4. The apostle says he subdues his body to avoid being disqualified (1 Corinthians 9).

5. Some, after tasting the grace of God, fall back (Hebrews 6).

6. Some, like dogs, return to their own vomit (2 Peter 2).

7. Examples of fallen angels, the first parents, Saul, David, Solomon, Peter, etc., who fell into grave sins, show that some lost all final justice.

8. The nature of faith or justice is not such that it cannot be lost. Experience shows that many fall from faith every day. Many, though baptized and justified in baptism, fall. [The Reformed] Censure:

1. It does not concern here the living root of justice but the external appearance, so that the name “justice” refers to our senses, not to God’s hidden judgment. Moreover, the hypothesis is not correctly turned into a categorical.

2. Faith here means the doctrine and profession of faith, not the heart’s trust. The charity of hypocrites, which seems like fire, cools in winter, that is, in calamities.

3. It concerns hypocrites who, for some time, are branches in their own opinion and that of others.

4. Paul speaks of pious concern, not of a final event. 5.

6. It concerns hypocrites who, on the one hand, taste the grace of God, insofar as they receive various gifts of the Holy Spirit, on the other hand, seem truly to be elect.

7. Examples of fallen angels and Saul are irrelevant and unequal; the others are false.

8. Perseverance is attributed not to the merit of faith but to God’s mercy in Christ. Hence it is said: “Faith is immovable because of the Father’s election, the Son’s satisfaction, and the Holy Spirit’s seal.” Moreover, many hypocrites fall from faith. Finally, it is false to say that baptism justifies by the act itself. In short, in this controversy, the fallacy of “secundum quid ad simpliciter” is commonly used, that is, what is true in a certain sense is considered true absolutely; this is the fallacy of arguing from appearance to essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

<blockquote><p>VI. Preservation in that state, by which God preserves the regenerate until the end of life, 1 Pet. 1:5, 9, and hence their perseverance: for they themselves, acted upon by God, act, and preserved, preserve themselves, 1 Jn. 5:4, 18.</p></blockquote>

<blockquote><p>XLIII. Perseverance in true faith is a gift that is supremely necessary, so that, strengthened with all power according to the glorious might of God, we may overcome all afflictions, persecutions, and even temptations of the flesh, the world, and Satan, with all patience and gentleness, and with joy. XLIV. And this perseverance is not from us, but is graciously communicated to us by the power of God; therefore, Paul asks for it from God [in Col. 1:3-5]. No one can remain steadfast in the faith of Christ unless they are graciously strengthened by God, with the power of God aiding our weakness and granting patience. XLV. However, patience should by no means be forcibly extracted from those who are unwilling, but rather it should arise from a joyful and cheerful spirit, so that in trials the joy of the spirit may surpass the pain of the flesh. XLVI. From this, we conclude:

1. No faithful person can stand by their own virtue alone.

2. The steadfastness of faith amidst various temptations is a special gift from God, to be obtained through constant prayers.

3. Since the steadfastness of faith is strengthened by the glorious might of God, truly faithful and reborn individuals can never completely lose their faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2f8de45373" data-kw="">
<blockquote><p>Synonyms [of regeneration] more properly signifying are: …

II. Conversion. This word sometimes denotes the act of God alone; sometimes the complete act of God and man; sometimes the formal act of man, so that it is of the same notion as the word penitence and repentance. The first signification looks to the act of first or preventing grace, and properly pertains here and makes a synonym of regeneration. In the Pelagian controversies concerning grace and free will, such conversion is wont to be called by theologians the first moment of conversion, where man conducts himself purely passively. The second signification looks to the act of God’s second grace, by which man, instructed and informed through preventing or first grace with a new habitual principle of spiritual life impressed by the omnipotent facility of God, is premoved and excited by God to perform acts and to actually elicit acts of spiritual life, or of repentance and faith, Jer. 31:18; Song 1:4. The third signification properly looks to the act of man. For man is the proper and formal principle of actual penitence or repentance, of conversion from his sin—not God, who is the effective principle. For He Himself does not do, so as to be that proper and particular cause (which, for example, is Peter repenting), that is, He does not grieve, does not repent, does not weep bitterly, does not die to sin, does not rise to new life; but He makes us to do, as Augustine speaks. We ourselves therefore do those things, but not of ourselves—as I remember reading that distinction in the homilies of Ardentius Pictaviensis [Ardent of Poitiers]. …

II. Sometimes it [‘regeneration’] denotes:

      1. The first impression of the new creature, or the change from non-being to spiritual being.

      2. Its conservation, continuation, and augmentation.

      3. Its instauration and renovation.

      4. Its consummation and final perfection. … As for regeneration or conversion in the second moment, it can be analogically conceived thus:

I. The one generating is the Holy Spirit through second grace as through a plastic power.

II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited.

III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration.

IV. Preparatory dispositions are certain acts of repentance preceding faith.

V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2.

VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification.

VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith.

VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity.

IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>

<blockquote><p>3… Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this [faith] man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.</p></blockquote>

<blockquote><p>But however it may be: Since among the Lutherans and the Reformed it is not a matter of controversy that:

1. After the Fall, man is intimately corrupt, dead in sins, and therefore utterly unfit to begin and to perfect any spiritual good.

2. Not only faith itself, but also the inclination and disposition to faith is a gratuitous gift of God.

3. Man, in the first moment of conversion, behaves purely passively, etc. From this it is clear that the Reformed and the Lutherans can be reconciled more easily than others concerning this matter. . ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 25-26 Latin §XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. Ps. 119:18: God “reveals the eyes to consider the wondrous things of the Divine Law.” Lk. 24:45: he “opens the minds of men, that they may understand the Scriptures.” Acts 16:14: he “opens the heart, that they may attend to those things which are said by the ministers.” Eph. 1:17-18: he “gives the Spirit of Wisdom and of revelation, in the knowledge of Christ, the eyes of our heart being enlightened, that we may know what the hope is of our calling, and what are the riches of the glory of his inheritance in the saints.” Ps. 51:12 &amp; Eph. 2:10: He “creates a clean heart” in them, and “renews a right spirit” in their bowels. Eze. 36:26-27: he “gives a new heart and puts a new spirit in the midst of the converted: and takes away the stony heart out of their flesh, and gives them a heart of flesh, and puts his spirit in the midst of them, and causes them to walk in his commandments, and to keep his judgments, and do them.” Jn. 3:5 &amp; 1 Pet. 1:3: he regenerates from heaven. Jn. 6:44: he draws. Eph. 1:19-20: he “works on them according to the operation of the might of his power, which he wrought in Christ, raising him up from the dead.” Phil. 2:13: he works “both to will and to accomplish.” 2 Thess. 1:11: He “fulfills all the good pleasure of his goodness, and the work of faith in power” in them. Heb. 13:21: He “works in them that which is well pleasing in his sight through J.C.” Jer. 31:33: He “gives his law in their bowels, and will write it in their heart.” Whence Israel there sighs in vv. 18-19 “Convert thou me, and I shall be converted: for thou art the Lord my God. For after thou didst convert me, I did penance: and after thou didst show unto me, I struck my thigh.</p></blockquote>

<blockquote><p>III. By a true and a real union (but which is only passive on their part) they are united to Christ when his Spirit first takes possession of them and infuses into them a principle of new life: the beginning of which life can be from nothing else but from union with the Spirit of Christ, who is to the soul, but in a far more excellent manner, in respect of spiritual life, what the soul is to the body in respect of animal and human life. As therefore the union of soul and body is in order of nature prior to the life of man, so also the union of the Spirit of Christ and the soul is prior to the life of a Christian. Further, since faith is an act flowing from the principle of spiritual life, it is plain, that in a sound sense, it may be said, an elect person is truly and really united to Christ before actual faith.

IV. But the mutual union (which, on the part of an elect person, is likewise active and operative), whereby the soul draws near to Christ, joins itself to Him, applies, and in a becoming and proper manner closes with him without any distraction, is made by faith only. And this is followed in order by the other benefits of the covenant of grace, justification, peace, adoption, sealing, perseverance, etc. Which if they be arranged in that manner and order, I know not whether any controversy concerning this affair can remain among the brethren.</p></blockquote>

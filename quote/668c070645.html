<main class="wrap"><figure class="quote" id="q-668c070645" data-kw="">
<blockquote><p>So God is often wont to bring good to his people out of those things that naturally have no goodness in them, that in themselves are not good but evil.

So God brings spiritual good oftentimes to his people out of affliction. Afflictions in themselves are evil, and therefore man in a state of innocence had no affliction; and in heaven there will be none. The afflictions are evils in themselves, yet God brings good out of them to his people; Hebrews 12:11, “No affliction for the present seemeth joyous, but grievous: nevertheless afterward it yieldeth the peaceable fruit of righteousness unto them which are exercised thereby.”

So God often brings good to his people out of spiritual darkness they are under. When God hides his face from ’em and they are in the dark, they are exercised with doubts about their condition and with fears of wrath. He brings them into the wilderness amongst hideous rocks, but God turns it to their spiritual good; he makes them to suck honey out of those rocks. He causes light to arise out of this darkness.

Again, God often causes good to arise to God’s people out of Satan’s temptations. They are things evil in themselves and are designed by Satan to mischief those that are exercised by them; but God turns them to good. And so God brings to his people meat out of the eater, and sweetness out of the strong, as Samson got honey out of the carcass of the lion [Judges 14:9]. So God makes his people to reap benefits by the sins of other men. Though this proves a snare to the wicked oftentimes, yet to the godly it is turned to good.

And again, God sometimes makes their own sins and falls an occasion of their good. When they have committed sin, they are more humble and place their confidence more in God and less in themselves. And when they have recovered themselves, they are more careful to avoid sin for the future, and more diligent to clear themselves of the remains of sin; 2 Corinthians 7:11, “This selfsame thing, that ye sorrowed after a godly sort, what carefulness it wrought in you, yea, what clearing of yourselves.” Peter, when he was converted after his fall, was stronger and more firmly fixed in grace and holiness than he was before. Therefore Christ bids him when he is converted to strengthen his brethren [John 21:15–17].

God oftentimes turns those things to his people’s good that seem to them to tend only to their hurt. They can’t see which way they can tend to any good. It seems to them that it only hinders the progress of grace in their souls and hinders them in their work; they can’t serve God with that advantage that otherwise they might do. It seems to them as unlikely that any good should be got by it, it may be, as that they should get honey out of a rock. But yet God, that sees further than they do, knows how to turn it to their advantage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Honey from the Rock</cite>, (1730) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 131-32.</span></figcaption>

<blockquote><p>If we would show that we are truly godly people, then we must absolutely not indulge ourselves in such things as the godless are accustomed to use. As soon as we learn how displeasing such things are to God, and if we are really serious and want to show that we are indeed godly people, we must be found fighting against them all. We should therefore deny ourselves for God’s sake, even if we loved some of these sins as much as our own right eye, yes, even if some sin seems as necessary and as profitable to us as our own right hand. Nevertheless, in such cases we must cut sin off for God’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-teellinck.html">Willem Teellinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Path of True Godliness</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke, Classics of Reformed Spirituality (1636; Grand Rapids MI: Reformation Heritage Books, 2003), p. 34.</span></figcaption>

</figure><figure class="quote" id="q-38a59f0360" data-kw="">
<blockquote><p>Only thus much I should advise, that if it be known that any person is guilty of a capital crime (as for example of adultery) though we be not bound alway to accuse them openly, or to bring them to such a confession or self-accusation as may hazard their lives, yet: 1. The pastor may suspend them and in some cases require the people to avoid them when the fact is publicly known (though the party not prosecuted) and give but a general intimation of the fault, as known already; though perhaps the evidence will not hold in law. (As I have known persons that openly confess adultery at home, but denying it before the judge, come off as if they were innocent; and yet confess it again when they come home.) And I should think that such persons should not be re-admitted to Communion, till they do manifest public serious penitence in the congregation: but only in general terms (seeing they are not bound to accuse themselves, so as to expose their lives to danger), as thus: ‘I confess before God and this congregation that I am a heinous sinner, and unworthy of communion with the Church: the particulars I need not express, seeing the congregation may easily know my meaning, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 3-4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Only thus much I should advise, that if it be known that any person is guilty of a capital crime (as for example of adultery) though we be not bound alway to accuse them openly, or to bring them to such a confession or self-accusation as may hazard their lives, yet: 1. The pastor may suspend them and in some cases require the people to avoid them when the fact is publicly known (though the party not prosecuted) and give but a general intimation of the fault, as known already; though perhaps the evidence will not hold in law. (As I have known persons that openly confess adultery at home, but denying it before the judge, come off as if they were innocent; and yet confess it again when they come home.) And I should think that such persons should not be re-admitted to Communion, till they do manifest public serious penitence in the congregation: but only in general terms (seeing they are not bound to accuse themselves, so as to expose their lives to danger), as thus: ‘I confess before God and this congregation that I am a heinous sinner, and unworthy of communion with the Church: the particulars I need not express, seeing the congregation may easily know my meaning, etc.&#x27;”

<blockquote><p>By many who have paid no attention to the subject, or who have formed erroneous conceptions of its nature, much ridicule has been cast on the capital offence of witchcraft. It ought to be understood, that under the general term of witchcraft, were included all the designs, arts, and practices of magic, charms, fortune-telling, and the like. The punishment of death which has been inflicted even in enlightened Christian States on those who were guilty, or even believed to have been guilty, of this offence, has met with many a sneer, to which the Mosaic law must also be regarded as exposed.

It would have been much better if the shafts of ridicule had been spared till men had considered how the case really stood … it is a crime of very great magnitude against God and against society. It is evidently fitted to subvert all faith in the supreme providence of God. It withdraws men from the direction and control of laws, both human and divine. It places society at the mercy of those who practise such arts, and it sets up the dominion of a terror of unseen, invisible, undivine powers, wielded at the pleasure of a fellow-mortal.

It therefore cannot fail to prove a constant source of crime and misery. It is, moreover, a practical blasphemy against God, and an outrage on all religion, law, civilization, and happiness. We might refer to the wretched state in which great tribes in Africa, for example, are constantly kept by rain-makers, and the like, who resemble so many infernal powers walking among the people, and keeping them trembling subject to their horrid will and purposes.

No state in which such practices abound, can ever be prosperous or peaceful. The duty of rulers is, therefore, to encourage the spread of that light of divine truth which banishes such darkness, and to hold as deserving the punishment of death those who continue obstinately and wickedly to follow such practices. This is a duty they owe to those under them, whose weakness and ignorance expose them to be the easy prey of such malignant or cunning propagators of a belief in such supernatural power.</p></blockquote>

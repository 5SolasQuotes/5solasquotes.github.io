<blockquote><p>And upon these [previously listed] terms I (and I believe everybody else) will willingly consent to their readmission [under a limited-political toleration]. If any desire further satisfaction in this particular, either from civilians, schoolmen, casuists, canonists, historians, or other divines, he may consult these or such like: I. Justinian Cod. de Judaeis &amp; Caelicolis, bk. 1, title 12 and the gloss there. II. Codex Theodosianus de Judaeis, Caelicolis &amp; Samaritanis, bk. 16, title 8, p. 515. III. Jacobi Sirmondi, Appendix Cod. Theodosiani, leg. 6. p. 14 &amp; leg. 4, p. 11. IV. Marquardus de Susanis Tractatu de Judaeis, &amp; aliis Infidelibus inter tractatus Illustrium, tome 14, p. 28. See Bernardum, Hieronimum, Alexandrum Iltum, aliosque Auctores ab eo ibidem citatos. V. Mathaeus Wesenbecius in Comentario in Codicem Justinianeum de Judeis, title 9, p. 14. VI. Decretum Gregorii extra de Judaeis, &amp; Saracenis, bk. 6, title 6. VII. Clementinar. bk. 5, title 2, de Judaeis. VIII. Corvini Jus Canonicum, tit. de Judaeis, p. 295. IX. Frederick Balduin, Cases of Conscience, bk. 2, ch. 6, case 5, p. 188. X. Capitulare Caroli Magni, bk. 6, ch. 120 &amp; 308. XI. Henry Alting, Problematum Theolog. pt. 2, problem 21, p. 340. XII. Petrus Crespetius in summa Eccles. Disciplinae Verbo Judaeus, p. 520 etc. fuse. XIII. Philip Melanchthon, Epistles, bk. 1, epistle 68, p. 75 in edit. Corn. Bee. XIV. Martin Becanus, in compendio manualis, bk. 5, ch. 17, p. 509. XV. Decretum Concilii Viennensis contra Judaeos apud Hen. Canisium Lect. Antiquarum, tome 1, p. 621 &amp; apud Binium, tome 3, parte altera, p. 1,493. XVI. Filiucius, Cases of Conscience, tract 22, ch. 5, p. 40, col. 2, de Judaismo. XVII. Johannes de Lugo, Of the Power of Divine Faith, disp. 22, sect. 4 and authors cited there. XVIII. Bodinus, Of the Republic, bk. 3-4. XIX. Statutum de Judaismo apud D. Edvardum Cooke, Institit. pt. 2, p. 506 &amp; Commentarium ejus in dictum Statutum. XX. Aquinas, [Summa] pt. 2 of 2, quest. 10-11 where various things on the Jews occur. XXI. Erasmus Brockmannus, Systemate Theologiae, universae, art. 41, ch. 2, quest. 9, tome 2, p. 5,043. XXII. Basilica Lenuclavii, bk. 1, title 1, ch. 9, de Judaeis, p. 2. XXIII. Jerome of the Holy Faith, Book contra the Jews. XXIV. Petrus Galatinus, de Arcanis Catholicae veritatis. XXV. Gilbertus Genebrardus, in Symbolae fidei Judeorum è R. Mos. Aegyptio, etc. XXVI. Vide etiam (si placet) Scriptores (innumeros pene) quos exhibet Georgius Draudius in Bibliothea Classica inter Libros Theologicos, pp. 349-50, etc. Alii alios de facili addant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-barlow.html">Thomas Barlow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Miscellaneous &amp; Weighty Cases of Conscience Learnedly &amp; Judiciously Resolved (d. 1691; London: 1692), ‘The Case of the Jews’</cite>, pp. 75-78</span></figcaption>

<blockquote><p>do constantly affirm what I set forth in my Apology, as I remember, whether in my own or the late Queen’s time, that conscience and religion have been the cause of the last extremity of punishment. For however much a man may be addicted to his religion, however much he may openly and constantly profess it, no danger of death will hang over him unless he shall have actually offended against the foreign laws in any act; or shall have been seen to be the very summit of a conspiracy of counsels pernicious to the commonwealth: except only such as relate to sacrifices, and other parts of the Pontifical system, who in transmarine regions insinuate themselves into sacred orders: who have so many conspiracies, so many treasons by them in England, either conceived or instigated or applauded, that from our borders they are driven back under the penalty of destruction. And yet none of them remains in the same thing which you would wish to call holy: that by the single case, being mulcted, death should immediately follow.</p></blockquote>

<blockquote><p>“46. Now there remains to speak somewhat particularly of Jews and heretics: for this kind of men are suffered almost in all cities, provinces and kingdoms, and they dwell together with Christians. Why the Jews should be suffered, Augustine among others brings certain reasons. He, Of the City of God, bk. 4, ch. 18, as also upon the 58th psalm and in other places, writes that therefore they be suffered because they before other men had the promise of salvation; neither are they past all hope, seeing that some of them many times, although few in number, do return unto Christ. ‘Blindness’ (says Paul unto the Romans) ‘fell partly upon Israel’ (Rom. 11:25): as though he would say not upon all. And to this the same apostle adds, ‘When the fulness of the gentiles is come in, then all Israel shall be saved.’ (Rom. 11:25-26) And lest peradventure thou shouldest think that these words are spoken allegorically, Paul writes them as a mystery. And to prove his saying he brings the prophecy of Isaiah the prophet, to wit, that ‘the iniquity shall be then taken away from Jacob.’ Furthermore, they be now called ‘enemies unto God for our sakes, but friends in respect of their fathers.’ The same Augustine, in his Questions upon the Gospel, bk. 2 and question 33 (if those be Augustine’s books) when he interprets the parable of the prodigal son, he says that that son does betoken the gentiles. For it is written, that he departed into a far country (Lk. 15:11); because the ethnics were so far departed from God as they worshipped idols publicly and in open profession. But the elder son, under whom is shadowed the Hebrew people, went not so far off. And although he were not within his father’s house, which is the church, yet nevertheless he abode in the field. For the Jews are occupied in the holy scriptures, which they understand not rightly, nor with such spiritual sense as the church of Christ does know them; but take them in an earthly and carnal manner, whereby not unaptly they be said to have their abode in the field. This elder son does not at the beginning enter into his father’s house, but in the latter days he shall also be called and come. 47. The same father also for the proof of this doctrine brings that which is written in the 59th psalm, as he reads it, ‘Do not kill them, lest they forget thy law, but scatter them in thy power.’ (v. 12) The Son of God (says he) prays unto the Father that the same nation might not be destroyed, but that it might wander every where in the world. Other provinces, when they were overcome of the Romans, followed the laws and rites of the Romans, so that at length they became Romans: but the Hebrews, notwithstanding they were overcome by the Romans, yet would they never yield unto their laws, rites and ceremonies. They still observe their own as much as they may; and being dispersed, they wander abroad. Neither have they utterly forgotten the law of God; not that the godly apply themselves to observe it, but do only read it and keep certain rites and ceremonies, whereby they are discerned from other nations. Verily it seems that God has put a sign upon them as He did upon Cain for killing his brother Abel, namely, that every man should not kill them. (Gen. 4:15) Neither is this scattering of them abroad in the world unprofitable unto the Christians, because (as it is written to the Romans) they are showed unto us as broken boughs. (Rom. 11:17) And for so much as we were grafted in their place, when as we see that they were so miserably cut off, we acknowledge the grace of God towards us: and by beholding of them be taught to take heed that for our infidelity’s sake, for the which they were broken off, we also be not cut off in like manner. Moreover, there is another commodity which comes unto us by the dispersing of them. Because our books are saved by them; I mean the holy Bible, which they carry everywhere about them and read it. And although because they be blinded they believe not, yet they confess that those writings are most true. Indeed they be in heart our deadly enemies; but yet by these books, which they have and reverence, they are a testimony to our religion. Wherefore I cannot marvel sufficiently at those which do so much hate the Jewish tongue and Bibles in Hebrew, as they desire to have them destroyed and burnt, seeing Augustine, On Christian Doctrine, thinks, that wheresoever we doubt of the Greek or Latin translation, we must flee unto the truth of the Hebrew. And Jerome in many places writes the same. 48. But they say that the holy books were abused and corrupted by the Hebrews. To this Jerome upon Isaiah, the sixth chapter, towards the end, answers thus: Either they did this before the coming of Christ and the preaching of the apostles, or else afterward. If a man will say that it was done of them before, then, seeing Christ and his apostles reprehended the most grievous wicked acts of the Jews, I marvel why they would say nothing of that sacrilege and so detestable a wicked act. Undoubtedly they would have reproved them for marring and corrupting of the scriptures. But if thou wilt affirm that the faults were brought in by them afterward: then will I say that it had behooved them to corrupt those places chiefly which do testify of Christ and of his religion; and which were alleged by the Lord Himself and his apostles in the New Testament. But those places remain sound; and the very same sentences which they cited do remain still in the Hebrew Bibles: for they were not so greatly careful for the words, and it is not likely, that they in other places have corrupted the holy scriptures. Yea, if a man diligently read over their books, he shall find in them a great many more testimonies, and those more plain and manifest, than our common translation has. Do they not read in the second psalm, ‘Kiss the son’: which our men have translated, ‘Take ye hold of discipline?’ Which words undoubtedly are referred unto Christ. But I do not mean at this present to bring all such like testimonies: it is sufficient if I prove with Jerome that the books of holy scriptures are not corrupted by the Hebrews. The which surely, if they would have done, yet had they missed of their purpose. For many of the most ancient books are found, and that in written hand, which have been kept a very long time by the Christians, which never came in their hands to abuse. 49. But let us return to discourse of that commodity, which Augustine has declared; There be very many (says he) which would peradventure think that the things which we affirm to be done of the ancient people and of the prophets were but vain and imagined by us, unless they saw the Jews yet alive, who with their books maintain that which we profess, whether they will or no. For although the Hebrews be blinded in their heart, and be against us with as much power as they can, yet we have themselves, together with their books, most evident testimonies of our religion. And doubtless, among all testimonies, that testimony is of greatest account, which is testified by the enemies. And of this kind of witnesses God has provided great store for his Church: for we not only have the Hebrew books to make on our side, but also the verses of the Sibyls, which were born in sundry countries. Neither must it be thought, that those verses were invented by our forefathers themselves: for in the time of Lactantius, Eusebius of Caesaria and Augustine, which alleged those verses, the books of the Sibyls were rife in every man’s hand. So as, if they had added any counterfeit verses unto them, the ethnics, which were then many in number and were full of eloquence, and deadly enemies unto our religion, would have reproved them as vain and lying. What then remains but that God would wonderfully defend his Church even by the testimonies of his adversaries? Now then, the Jews are tolerated among the Christians, partly for the promise’s sake, which they have of salvation to be given to their kindred, and partly because of the commodities, which I have now recited out of Augustine. Wherefore they be not only borne withal, but they have also synagogues where they openly read the books of the holy scripture and one with another do call upon the God of their fathers. In which thing nevertheless, the diligence of magistrates and bishops is to be required, who ought to provide that they do nothing else there, and by all means to beware that in their public prayers, exhortations and sermons they do not curse nor rail upon Christ our God. And this, if our magistrates and bishops do not look unto, they cannot escape a just accusation. But it is not lawful to grant unto the Turks any religious assemblies, for that they have not any particular promise of their salvation: neither would they read there either the Old Testament or the New, but only their most detestable Al Koran. Over this, the Jews should be prohibited to exercise false bargaining and usury among Christians, thereby to vex and afflict the poor Christians before our face: the which cannot be done without great indignity. But our princes exact a good, great tribute of them; and of those gains which come by usury and naughty bargaining, they obtain great prey: so far are they from forbidding them these evil arts. Furthermore (a thing no less hurtful), they provide not to have them taught, when as they ought to compel them to come often to godly Christian sermons: otherwise, while they be so negligently left, they become daily worse and worse. Whereby, either naughty fruit or in a manner none at all can be looked for by the conversation which they have among Christians. It must also be looked diligently to that they corrupt not Christians in seducing them to their Jewish religion. By reason of neglecting hereof, the heresy of the Marrans has much increased, specially in Spain. Moreover, it is meet that they may by some apparel or certain token be known from Christians, lest any unwittingly should be familiar with them no less than with the Christians. And these things shall suffice concerning this sort of infidels.</p></blockquote>

od+as+they+worshipped+idols+publicly+and+in+open+profession.+But+the+elder+son%2C+under+whom+is+shadowed+the+Hebrew+people%2C+went+not+so+far+off.+And+although+he+were+not+within+his+father%E2%80%99s+house%2C+which+is+the+church%2C+yet+nevertheless+he+abode+in+the+field.+For+the+Jews+are+occupied+in+the+holy+scriptures%2C+which+they+understand+not+rightly%2C+nor+with+such+spiritual+sense+as+the+church+of+Christ+does+know+them%3B+but+take+them+in+an+earthly+and+carnal+manner%2C+whereby+not+unaptly+they+be+said+to+have+their+abode+in+the+field.+This+elder+son+does+not+at+the+beginning+enter+into+his+father%E2%80%99s+house%2C+but+in+the+latter+days+he+shall+also+be+called+and+come.+47.+The+same+father+also+for+the+proof+of+this+doctrine+brings+that+which+is+written+in+the+59th+psalm%2C+as+he+reads+it%2C+%E2%80%98Do+not+kill+them%2C+lest+they+forget+thy+law%2C+but+scatter+them+in+thy+power.%E2%80%99+%28v.+12%29+The+Son+of+God+%28says+he%29+prays+unto+the+Father+that+the+same+nation+might+not+be+destroyed%2C+but+that+it+might+wander+every+where+in+the+world.+Other+provinces%2C+when+they+were+overcome+of+the+Romans%2C+followed+the+laws+and+rites+of+the+Romans%2C+so+that+at+length+they+became+Romans%3A+but+the+Hebrews%2C+notwithstanding+they+were+overcome+by+the+Romans%2C+yet+would+they+never+yield+unto+their+laws%2C+rites+and+ceremonies.+They+still+observe+their+own+as+much+as+they+may%3B+and+being+dispersed%2C+they+wander+abroad.+Neither+have+they+utterly+forgotten+the+law+of+God%3B+not+that+the+godly+apply+themselves+to+observe+it%2C+but+do+only+read+it+and+keep+certain+rites+and+ceremonies%2C+whereby+they+are+discerned+from+other+nations.+Verily+it+seems+that+God+has+put+a+sign+upon+them+as+He+did+upon+Cain+for+killing+his+brother+Abel%2C+namely%2C+that+every+man+should+not+kill+them.+%28Gen.+4%3A15%29+Neither+is+this+scattering+of+them+abroad+in+the+world+unprofitable+unto+the+Christians%2C+because+%28as+it+is+written+to+the+Romans%29+they+are+showed+unto+us+as+broken+boughs.+%28Rom.+11%3A17%29+And+for+so+much+as+we+were+grafted+in+their+place%2C+when+as+we+see+that+they+were+so+miserably+cut+off%2C+we+acknowledge+the+grace+of+God+towards+us%3A+and+by+beholding+of+them+be+taught+to+take+heed+that+for+our+infidelity%E2%80%99s+sake%2C+for+the+which+they+were+broken+off%2C+we+also+be+not+cut+off+in+like+manner.+Moreover%2C+there+is+another+commodity+which+comes+unto+us+by+the+dispersing+of+them.+Because+our+books+are+saved+by+them%3B+I+mean+the+holy+Bible%2C+which+they+carry+everywhere+about+them+and+read+it.+And+although+because+they+be+blinded+they+believe+not%2C+yet+they+confess+that+those+writings+are+most+true.+Indeed+they+be+in+heart+our+deadly+enemies%3B+but+yet+by+these+books%2C+which+they+have+and+reverence%2C+they+are+a+testimony+to+our+religion.+Wherefore+I+cannot+marvel+sufficiently+at+those+which+do+so+much+hate+the+Jewish+tongue+and+Bibles+in+Hebrew%2C+as+they+desire+to+have+them+destroyed+and+burnt%2C+seeing+Augustine%2C+On+Christian+Doctrine%2C+thinks%2C+that+wheresoever+we+doubt+of+the+Greek+or+Latin+translation%2C+we+must+flee+unto+the+truth+of+the+Hebrew.+And+Jerome+in+many+places+writes+the+same.+48.+But+they+say+that+the+holy+books+were+abused+and+corrupted+by+the+Hebrews.+To+this+Jerome+upon+Isaiah%2C+the+sixth+chapter%2C+towards+the+end%2C+answers+thus%3A+Either+they+did+this+before+the+coming+of+Christ+and+the+preaching+of+the+apostles%2C+or+else+afterward.+If+a+man+will+say+that+it+was+done+of+them+before%2C+then%2C+seeing+Christ+and+his+apostles+reprehended+the+most+grievous+wicked+acts+of+the+Jews%2C+I+marvel+why+they+would+say+nothing+of+that+sacrilege+and+so+detestable+a+wicked+act.+Undoubtedly+they+would+have+reproved+them+for+marring+and+corrupting+of+the+scriptures.+But+if+thou+wilt+affirm+that+the+faults+were+brought+in+by+them+afterward%3A+then+will+I+say+that+it+had+behooved+them+to+corrupt+those+places+chiefly+which+do+testify+of+Christ+and+of+his+religion%3B+and+which+were+alleged+by+the+Lord+Himself+and+his+apostles+in+the+New+Testament.+But+those+places+remain+sound%3B+and+the+very+same+sentences+which+they+cited+do+remain+still+in+the+Hebrew+Bibles%3A+for+they+were+not+so+greatly+careful+for+the+words%2C+and+it+is+not+likely%2C+that+they+in+other+places+have+corrupted+the+holy+scriptures.+Yea%2C+if+a+man+diligently+read+over+their+books%2C+he+shall+find+in+them+a+great+many+more+testimonies%2C+and+those+more+plain+and+manifest%2C+than+our+common+translation+has.+Do+they+not+read+in+the+second+psalm%2C+%E2%80%98Kiss+the+son%E2%80%99%3A+which+our+men+have+translated%2C+%E2%80%98Take+ye+hold+of+discipline%3F%E2%80%99+Which+words+undoubtedly+are+referred+unto+Christ.+But+I+do+not+mean+at+this+present+to+bring+all+such+like+testimonies%3A+it+is+sufficient+if+I+prove+with+Jerome+that+the+books+of+holy+scriptures+are+not+corrupted+by+the+Hebrews.+The+which+surely%2C+if+they+would+have+done%2C+yet+had+they+missed+of+their+purpose.+For+many+of+the+most+ancient+books+are+found%2C+and+that+in+written+hand%2C+which+have+been+kept+a+very+long+time+by+the+Christians%2C+which+never+came+in+their+hands+to+abuse.+49.+But+let+us+return+to+discourse+of+that+commodity%2C+which+Augustine+has+declared%3B+There+be+very+many+%28says+he%29+which+would+peradventure+think+that+the+things+which+we+affirm+to+be+done+of+the+ancient+people+and+of+the+prophets+were+but+vain+and+imagined+by+us%2C+unless+they+saw+the+Jews+yet+alive%2C+who+with+their+books+maintain+that+which+we+profess%2C+whether+they+will+or+no.+For+although+the+Hebrews+be+blinded+in+their+heart%2C+and+be+against+us+with+as+much+power+as+they+can%2C+yet+we+have+themselves%2C+together+with+their+books%2C+most+evident+testimonies+of+our+religion.+And+doubtless%2C+among+all+testimonies%2C+that+testimony+is+of+greatest+account%2C+which+is+testified+by+the+enemies.+And+of+this+kind+of+witnesses+God+has+provided+great+store+for+his+Church%3A+for+we+not+only+have+the+Hebrew+books+to+make+on+our+side%2C+but+also+the+verses+of+the+Sibyls%2C+which+were+born+in+sundry+countries.+Neither+must+it+be+thought%2C+that+those+verses+were+invented+by+our+forefathers+themselves%3A+for+in+the+time+of+Lactantius%2C+Eusebius+of+Caesaria+and+Augustine%2C+which+alleged+those+verses%2C+the+books+of+the+Sibyls+were+rife+in+every+man%E2%80%99s+hand.+So+as%2C+if+they+had+added+any+counterfeit+verses+unto+them%2C+the+ethnics%2C+which+were+then+many+in+number+and+were+full+of+eloquence%2C+and+deadly+enemies+unto+our+religion%2C+would+have+reproved+them+as+vain+and+lying.+What+then+remains+but+that+God+would+wonderfully+defend+his+Church+even+by+the+testimonies+of+his+adversaries%3F+Now+then%2C+the+Jews+are+tolerated+among+the+Christians%2C+partly+for+the+promise%E2%80%99s+sake%2C+which+they+have+of+salvation+to+be+given+to+their+kindred%2C+and+partly+because+of+the+commodities%2C+which+I+have+now+recited+out+of+Augustine.+Wherefore+they+be+not+only+borne+withal%2C+but+they+have+also+synagogues+where+they+openly+read+the+books+of+the+holy+scripture+and+one+with+another+do+call+upon+the+God+of+their+fathers.+In+which+thing+nevertheless%2C+the+diligence+of+magistrates+and+bishops+is+to+be+required%2C+who+ought+to+provide+that+they+do+nothing+else+there%2C+and+by+all+means+to+beware+that+in+their+public+prayers%2C+exhortations+and+sermons+they+do+not+curse+nor+rail+upon+Christ+our+God.+And+this%2C+if+our+magistrates+and+bishops+do+not+look+unto%2C+they+cannot+escape+a+just+accusation.+But+it+is+not+lawful+to+grant+unto+the+Turks+any+religious+assemblies%2C+for+that+they+have+not+any+particular+promise+of+their+salvation%3A+neither+would+they+read+there+either+the+Old+Testament+or+the+New%2C+but+only+their+most+detestable+Al+Koran.+Over+this%2C+the+Jews+should+be+prohibited+to+exercise+false+bargaining+and+usury+among+Christians%2C+thereby+to+vex+and+afflict+the+poor+Christians+before+our+face%3A+the+which+cannot+be+done+without+great+indignity.+But+our+princes+exact+a+good%2C+great+tribute+of+them%3B+and+of+those+gains+which+come+by+usury+and+naughty+bargaining%2C+they+obtain+great+prey%3A+so+far+are+they+from+forbidding+them+these+evil+arts.+Furthermore+%28a+thing+no+less+hurtful%29%2C+they+provide+not+to+have+them+taught%2C+when+as+they+ought+to+compel+them+to+come+often+to+godly+Christian+sermons%3A+otherwise%2C+while+they+be+so+negligently+left%2C+they+become+daily+worse+and+worse.+Whereby%2C+either+naughty+fruit+or+in+a+manner+none+at+all+can+be+looked+for+by+the+conversation+which+they+have+among+Christians.+It+must+also+be+looked+diligently+to+that+they+corrupt+not+Christians+in+seducing+them+to+their+Jewish+religion.+By+reason+of+neglecting+hereof%2C+the+heresy+of+the+Marrans+has+much+increased%2C+specially+in+Spain.+Moreover%2C+it+is+meet+that+they+may+by+some+apparel+or+certain+token+be+known+from+Christians%2C+lest+any+unwittingly+should+be+familiar+with+them+no+less+than+with+the+Christians.+And+these+things+shall+suffice+concerning+this+sort+of+infidels.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+The+Common+Places%E2%80%A6+%28d.+1562%3B+London%3A+Henrie+Denham+et+al.%2C+1583%29%2C+pt.+2%2C+ch.+4%2C+%E2%80%98The+First+Precept%2C+where+is+entreated+of+Idolatry%2C+and+sundry+kinds+of+Idols%E2%80%99%2C+%E2%80%98Of+the+Suffering+of+Jews+%26+Heretics%E2%80%99%2C+pp.+328-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9401c9b669.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9401c9b669.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=46.%20Now%20there%20remains%20to%20speak,suffice%20concerning%20this%20sort%20of%20infidels&amp;text=46.%20Now%20there%20remains%20to%20speak%20somewhat%20particularly&amp;text=things%20shall%20suffice%20concerning%20this%20sort%20of%20infidels" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Second, it is asked whether their rites are as it were idolatry. That it seems so: 1. From the fact that it is said in Gal. 5:1, on the words, “Do not again be entangled with the yoke of bondage,” the Gloss says: “This bondage is not lighter than that of idolatry,” because the servitude of the legal observances is likened to idolatry in burden. 2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.</p></blockquote>

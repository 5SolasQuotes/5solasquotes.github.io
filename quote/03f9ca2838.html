<main class="wrap"><figure class="quote" id="q-03f9ca2838" data-kw="">
<blockquote><p>BUT THE KNIGHTS OF CHRIST may safely do battle in the battles of their Lord, fearing neither the sin of smiting the enemy nor the danger of their own downfall, inasmuch as death for Christ, inflicted or endured, bears no taint of sin, but deserves abundant glory. In the first case one gains for Christ, and in the second one gains Christ himself, who freely accepts the death of the foe in vengeance, and yet more freely gives himself in consolation to his fallen knight.

The knight of Christ, I say, may strike with confidence and succumb more confidently. When he strikes, he does service to Christ, and to himself when he succumbs. Nor does he bear the sword in vain. He is God’s minister in the punishment of evil doers and the praise of well doers. Surely, if he kills an evil doer, he is not a man-killer, but, if I may so put it, an evil-killer. Clearly he is reckoned the avenger of Christ against evildoers, and the defender of Christians. Should he be killed himself, we know he has not perished, but has come safely home. The death which he inflicts is Christ’s gain, and that which he suffers, his own.

At the death of the pagan, the Christian exults because Christ is exalted; in the death of the Christian the King’s liberality is conspicuous when the knight is ushered home to be rewarded. In the one case a just person shall rejoice at regarding vindication; in the other man shall say, Truly there is a reward for the just; truly it is God who judges the earth. Yet this is not to say that the pagans are to be slaughtered when there is any other way of preventing them from harassing and persecuting the faithful; but only that now it seems better to destroy them than to allow the rod of sinners to continue to be raised over the lot of the righteous, lest perchance the righteous set their hand to iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Praise of the New Knighthood: A Treatise on the Knights Templar and the Holy Places of Jerusalem</cite>, trans. M. Conrad Greenia (c. 1130; Piscataway NJ: Gorgias Press, 2010), 3.4, pp 39-40.</span></figcaption>

<blockquote><p>7. We are all so very much in the dark as to the clear and distinct apprehension of the true nature of original, inherent pravity or sin that we must needs be as much ignorant of the true nature of that inherent sanctity or righteousness which is its contrary, or cure. Learned [Matthew Flacius] Illiricus thought it was a substance, which he has in his Clavis pleaded for at large. Others call it a habit, others a nature, or natural inclination and a privation of a natural inclination to God: others call it an indisposition of the mind and will to holy truth and goodness, and an ill disposition of them to error and evil. Others call it only the inordinate lust of the sensitive faculties, with a debility of reason and will to resist it. And whilst the nature of the soul itself and its faculties are so much unknown to itself, the nature of original pravity and righteousness must needs be very much unknown.</p></blockquote>

Books Online</a></div>
</figure><figure class="quote" id="q-dfac016fde" data-kw="">
<blockquote><p>That a man should duly, and as he ought, believe, and receive the decision of a synod, it must be both true and he must believe and know that it is true; but [on the other hand,] that it may oblige him and does oblige him, whether his conscience be erroneous, or no[t], is as true, for then this Commandment, ‘Thou shalt not kill’, ‘Honor thy father and thy mother’, should lay no obligation on a man that believes it is service to God to kill the apostles, as, John 16, some do. For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment; for whatever frees a man from actual obligation frees him also from actual sinning: for all sin is a doing against a Law-obligation; and if so, then are none to be led by any rule but their own conscience: the written Law and Gospel is not henceforth our rule any more.</p></blockquote>

<blockquote><p>2. Are the primary-first motions of concupiscence sins? XXI. It is asked, second, whether actual concupiscence toward evil, with respect to its primary-first motion, is sin… The papists, so that they may keep safe the idea of a perfection of every sort in man, at least in the regenerate, since they observe that the primary-first motions obtain even in the most holy persons, conclude that they are not sins, because they are devoid of all consent of the will, that the secondary-first motions are only venial sins, because they lack the full consent of the will, and moreover that only the second motions are mortal sins, because they are perpetrated with full consent. In this sense Bellarmine (vol. 4, bk. 5, “On Sin,” ch. 5–7) upholds that concupiscence, in itself and from its own nature, the sort that is found even in the baptized and justified, is not properly sin. The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence. Finally, (4) it is also the cause of all sin (James 1:14–15). Therefore it is sin, for nothing is the cause of sin that does not sin, since the causation of sin, if it is permitted to speak this way, is a transgression of the law. Objections Accordingly, it is not valid to say: (1) it begets sin, therefore it is not sin. For a man, because he begets a man, does not cease to be a man; indeed, as we have said, it is sin by the very fact that it begets sin. And (2) that there is said to be no condemnation (κατάκριμα) in those who are in Christ Jesus (Rom. 8:1) does not argue that there is nothing in them that is condemnable, or sin, but that there is no actual condemnation, as its guilt has been transferred to Christ. Furthermore, (3) that in baptism concupiscence is taken away, as sin. I respond, It is taken away with respect to guilt and dominion… not with respect to its existence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3 | section 21, bk. 4, ch. 3</span></figcaption>

— Petrus van Mastricht, Theoretical Practical Theology, (RHB), vol. 3 | section 21, bk. 4, ch. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Are+the+primary-first+motions+of+concupiscence+sins%3F+XXI.+It+is+asked%2C+second%2C+whether+actual+concupiscence+toward+evil%2C+with+respect+to+its+primary-first+motion%2C+is+sin%E2%80%A6+The+papists%2C+so+that+they+may+keep+safe+the+idea+of+a+perfection+of+every+sort+in+man%2C+at+least+in+the+regenerate%2C+since+they+observe+that+the+primary-first+motions+obtain+even+in+the+most+holy+persons%2C+conclude+that+they+are+not+sins%2C+because+they+are+devoid+of+all+consent+of+the+will%2C+that+the+secondary-first+motions+are+only+venial+sins%2C+because+they+lack+the+full+consent+of+the+will%2C+and+moreover+that+only+the+second+motions+are+mortal+sins%2C+because+they+are+perpetrated+with+full+consent.+In+this+sense+Bellarmine+%28vol.+4%2C+bk.+5%2C+%E2%80%9COn+Sin%2C%E2%80%9D+ch.+5%E2%80%937%29+upholds+that+concupiscence%2C+in+itself+and+from+its+own+nature%2C+the+sort+that+is+found+even+in+the+baptized+and+justified%2C+is+not+properly+sin.+The+Reformed+on+the+contrary+state+that+all+the+acts+of+concupiscence%2C+even+the+primary-first%2C+are+sins%2C+because+the+contrary+opinion+is%3A+%281%29+contrary+to+the+express+words+of+the+apostle+%28Rom.+7%3A7%29%3B+%282%29+contrary+to+the+express+demand+of+the+law+%28Ex.+20%3A17%29%3B+%283%29+contrary+to+the+force+and+strictness+of+the+law%2C+which+under+the+penalty+of+an+eternal+curse+demands+the+most+exact+obedience+%28Matt.+22%3A37%3B+Deut.+27%3A26%3B+Gal.+3%3A10%29%2C+and+therefore+condemns+all+concupiscence.+Finally%2C+%284%29+it+is+also+the+cause+of+all+sin+%28James+1%3A14%E2%80%9315%29.+Therefore+it+is+sin%2C+for+nothing+is+the+cause+of+sin+that+does+not+sin%2C+since+the+causation+of+sin%2C+if+it+is+permitted+to+speak+this+way%2C+is+a+transgression+of+the+law.+Objections+Accordingly%2C+it+is+not+valid+to+say%3A+%281%29+it+begets+sin%2C+therefore+it+is+

<main class="wrap"><figure class="quote" id="q-83a5c9bf20" data-kw="">
<blockquote><p>Now it is to be considered what kind of religious observations God has reserved to his own determination and forbidden to be devised or instituted by man. And these are first, such as are of the same reason with those ordinances which God has instituted to be observed by the universal Church to the world’s end, as to make an addition of another weekly day to the same holy intents for which the Lord’s Day is set apart, or to institute any ordinance that is of the same reason with the sacraments of the Covenant of Grace. … 2. No new integral part of divine worship, without which the worship of God is supposed not entire, but deficient in part, may be invented of man. For it were to invent a new part of the Christian religion and to augment it beyond the state thereof as settled by the Author and Founder of it. Here note that the accidental parts of religion being varied, or augmented, or diminished, make no variation, addition or diminution in the religion, no more than alteration in clothes makes an alteration in the man. 3. No ordinance that is of universal and perpetual use to the Church of God (if it be at all of use), so that it may in no place, in no age be omitted, may be devised of man. For the devising of such an ordinance supposes a defect in the divine ordinances of universal and perpetual use, to be made up by adding other ordinances by way of supplement. And it is but a presuming that those others are requisite, when they are not. Also if the universal Lawgiver has reserved anything to his own power, it can be no less than the making of such laws or ordinances as are of universal and perpetual use. And surely that He has reserved something to Himself, few among us will gainsay. Howbeit an arbitrary and temporary use of a religious observance by particular men for such ends as equally concern all Christians may not be unlawful upon this account, because therein Christ’s legislative power is not encroached upon, it not being made a law to the Church, but only a private arbitrary observation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 4, What of Divine Worship may not be Devised or Instituted by Man</cite></span></figcaption>

<blockquote><p>20. They are not fond of significant mystic ceremonies in the worship and service of God, but rather follow and symbolize that comely Gospel-simplicity which Christ and his apostles used that in the Church of Rome has been sadly marred with the whorish fairdings and gaudrie of human devices, additions and traditions, rather borrowed from the old pagan pagentry than the sacred page: But though they nauseate such relics and pieces of Papistry, yet what rites and ceremonies are decent and convenient, either from the nature or adjuncts of the religious things or actions they are exercised about, they are neither so shay nor foolish as to refuse to use them, K. J. Conf., art: 21, Acts of the Assembly, 1638, ss: 7, Assembly’s Confession, ch. 21, article 1.</p></blockquote>

</figure><figure class="quote" id="q-630b9d1cd4" data-kw="">
<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>

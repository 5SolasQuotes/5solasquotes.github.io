<blockquote><p>The demand was of the same man, who formerly did lawfully preach in a public assembly, if he should [now] obtain a license from the Lord bishop of the diocese, without any unlawful condition for to continue in that his course [of public preaching], whether that leave or license given does pollute the actions, seeing a man may ask leave of the great Turk to preach the gospel within his dominions? His [John Robinson’s] answer is that the very obtaining and receiving of such a license is unlawful, because it is a real acknowledgement that such a bishop has a lawful power to grant it. Which [in my judgment] is neither so nor so, for:

1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his license a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a license from that usurper (though he were no better than a strong thief) no reasonable man will say that in so doing he did acknowledge such [an] usurped power [to be] lawful. The rulers of Jewish synagogues had no lawful power over the apostles of Christ in any part of their ministry, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop?

2. There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a Confirmation of the Former in an Answer to his Manumission (Amsterdam, 1615), pp. 6-7</span></figcaption>

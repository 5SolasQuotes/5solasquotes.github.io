<blockquote><p>XVIII. God by his antecedent will decreed to bestow faith and grace on us, which by his consequent will He resolved to deny us; his former will was moved by his own goodness, but his latter will was provoked by our wickedness: if we have unjustly rejected the grace which by his former will He resolved to give us, may not He justly by his latter will deny that grace, which was rejected so perversely by us. Lord, if thou art resolved by thy first will to bestow grace on me, let me not by my disobedience provoke thy second will to deny that grace unto me. XIX. Our wickedness is the cause that moves God to exercise his acts of justice; but his own bounty is the cause, and our misery the occasion, why He exercises his acts of mercy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef4dac9cd" data-kw="">
<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 40, art. 3, On Divine Election, quest. 1, ‘Whether election is in God from eternity, or in time.’</span></figcaption>

— Richard Baxter, Richard Baxter’s Catholic Theology... (London: White, 1675), pt. 2, sect. 7, ‘The Antecedent &amp; Consequent Will of God, etc.’, p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+no+man+of+religion+can+deny+either+that+God%E2%80%99s+Law+is+the+signification+of+his+will%2C+or+his+will+signified%2C+or+that+his+judgment+and+execution+is+his+will+declared%3B%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Catholic+Theology...+%28London%3A+White%2C+1675%29%2C+pt.+2%2C+sect.+7%2C+%E2%80%98The+Antecedent+%26+Consequent+Will+of+God%2C+etc.%E2%80%99%2C+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46c3ae3357.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46c3ae3357.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-signified-will-or-will-of-sign/#:~:text=And%20no%20man%20of%20religion%20can,and%20execution%20is%20his%20will%20declared&amp;text=And%20no%20man%20of%20religion%20can%20deny%20either&amp;text=his%20judgment%20and%20execution%20is%20his%20will%20declared" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-46d54d6e63" data-kw="">
<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians</cite>, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-a47b51708f" data-kw="">
<blockquote><p>But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer to his Five Reasons against Absolute Reprobation’, pp. 225-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“But to answer more clearly to the point in hand: We must first consider that mere or purely conditional decrees, or conditional volitions, agree not with the perfection of the divine nature. Volitiones pure conditionales sunt alienae a sapientia et prudentia Dei. (Ruiz, De Voluntate, disp. 20, §1) [Volitions that are purely conditional are incompatible with the wisdom and prudence of God.] Voluntas Dei conditionata dici potest, non quia actu feratur in objectum sub conditione, sed quia ex illa voluntate quae praesens est alia oriretur si conditio in objecto poneretur. (Vasqez, in 1st part, disp. 83, p. 511) [The will of God may be called conditional, not because it is actually directed toward its object under a condition, but because from that will which is presently existing another would arise if the condition were to be posited in the object.] The speeches therefore above-cited out of Scripture do not imply a conditional will in God suspended for any moment of time, and then post purificatam conditionem [after the condition has been fulfilled], becoming an absolute and effectual will (see Ruiz, De Scientia, disp. 71, §7), as the like conditional propositions do in us, who have neither knowledge whether the condition will be certainly performed or no, nor yet power in ourselves to work the condition whereupon the future act of our will was suspended. (Ruiz, De Voluntate, disp. 8, §7) But in God, who knows eternally what every man will do or not do, and who in Himself has an absolute power and freedom to make men do any good whereunto He makes promise of reward, and to leave them to their own defective freewill in doing those things for which He has threatened desertion and destruction, these conditional decrees or volitions must be far otherwise conceived: namely, not purely but mixedly conditionalia [conditionals], that is, grounded in some absolute revealed decree of God to the performance whereof He has tied Himself. For example; It is an absolute decree of the divine will published in the gospel that whosoever repents, believes, perseveres, shall be saved: From hence is derived that mixed conditional decree: If Cain, if Judas, if any other repent and believe, they shall be saved. Now such mixed conditional decrees carry no contradiction to the absolute decrees of election and non-election or reprobation. For who sees not that these two propositions may well stand together: I will that if Judas repent and believe he shall have remission and salvation; I will not give unto Judas the gift of repentance, of faith, and of eternal life? The former conditional proposition contains all which this author [Davenant is writing against] can truly collect from the testimonies alleged; and the latter does as truly infer that absolute reprobation for which we contend. For the absolute decree of God resolving not to give faith, repentance and eternal life unto Judas, is that which we understand by the word ‘reprobation’: and this is never abrogated by any conditional promise founded in any universal absolute decree of God.”

— John Davenant, Animadversions upon a Treatise entitled, God’s Love to Mankind... (Cambridge: Daniel, 1641), ‘Answer to his Five Reasons against Absolute Reprobation’, pp. 225-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+to+answer+more+clearly+to+the+point+in+hand%3A+We+must+first+consider+that+mere+or+purely+conditional+decrees%2C+or+conditional+volitions%2C+agree+not+with+the+perfection+of+the+divine+nature.+Volitiones+pure+conditionales+sunt+alienae+a+sapientia+et+prudentia+Dei.+%28Ruiz%2C+De+Voluntate%2C+disp.+20%2C+%C2%A71%29+%5BVolitions+that+are+purely+conditional+are+incompatible+with+the+wisdom+and+prudence+of+God.%5D+Voluntas+Dei+conditionata+dici+potest%2C+non+quia+actu+feratur+in+objectum+sub+conditione%2C+sed+quia+ex+illa+voluntate+quae+praesens+est+alia+oriretur+si+conditio+in+objecto+poneretur.+%28Vasqez%2C+in+1st+part%2C+disp.+83%2C+p.+511%29+%5BThe+will+of+God+may+be+called+conditional%2C+not+because+it+is+actually+directed+toward+its+object+under+a+condition%2C+but+because+from+that+will+which+is+presently+existing+another+would+arise+if+the+condition+were+to+be+posited+in+the+object.%5D+The+speeches+therefore+above-cited+out+of+Scripture+do+not+imply+a+conditional+will+in+God+suspended+for+any+moment+of+time%2C+and+then+post+purificatam+conditionem+%5Bafter+the+condition+has+been+fulfilled%5D%2C+becoming+an+absolute+and+effectual+will+%28see+Ruiz%2C+De+Scientia%2C+disp.+71%2C+%C2%A77%29%2C+as+the+like+conditional+propositions+do+in+us%2C+who+have+neither+knowledge+whether+the+condition+will+be+certainly+performed+or+no%2C+nor+yet+power+in+ourselves+to+work+the+condition+whereupon+the+future+act+of+our+will+was+suspended.+%28Ruiz%2C+De+Voluntate%2C+disp.+8%2C+%C2%A77%29+But+in+God%2C+who+knows+eternally+what+every+man+will+do+or+not+do%2C+and+who+in+Himself+has+an+absolute+power+and+freedom+to+make+men+do+any+good+whereunto+He+makes+promise+of+reward%2C+and+to+leave+them+to+their+own+defective+freewill+in+doing+those+things+for+which+He+has+threatened+desertion+and+destruction%2C+these+conditional+decrees+or+volitions+must+be+far+otherwise+conceived%3A+namely%2C+not+purely+but+mixedly+conditionalia+%5Bconditionals%5D%2C+that+is%2C+grounded+in+some+absolute+revealed+decree+of+God+to+the+performance+whereof+He+has+tied+Himself.+For+example%3B+It+is+an+absolute+decree+of+the+divine+will+published+in+the+gospel+that+whosoever+repents%2C+believes%2C+perseveres%2C+shall+be+saved%3A+From+hence+is+derived+that+mixed+conditional+decree%3A+If+Cain%2C+if+Judas%2C+if+any+other+repent+and+believe%2C+they+shall+be+saved.+Now+such+mixed+conditional+decrees+carry+no+contradiction+to+the+absolute+decrees+of+election+and+non-election+or+reprobation.+For+who+sees+not+that+these+two+propositions+may+well+stand+together%3A+I+will+that+if+Judas+repent+and+believe+he+shall+have+remission+and+salvation%3B+I+will+not+give+unto+Judas+the+gift+of+repentance%2C+of+faith%2C+and+of+eternal+life%3F+The+former+conditional+proposition+contains+all+which+this+author+%5BDavenant+is+writing+against%5D+can+truly+collect+from+the+testimonies+alleged%3B+and+the+latter+does+as+truly+infer+that+absolute+reprobation+for+which+we+contend.+For+the+absolute+decree+of+God+resolving+not+to+give+faith%2C+repentance+and+eternal+life+unto+Judas%2C+is+that+which+we+understand+by+the+word+%E2%80%98reprobation%E2%80%99%3A+and+this+is+never+abrogated+by+any+conditional+promise+founded+in+any+universal+absolute+decree+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Animadversions+upon+a+Treatise+entitled%2C+God%E2%80%99s+Love+to+Mankind...+%28Cambridge%3A+Daniel%2C+1641%29%2C+%E2%80%98Answer+to+his+Five+Reasons+against+Absolute+Reprobation%E2%80%99%2C+pp.+225-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa47b51708f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a47b51708f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-s

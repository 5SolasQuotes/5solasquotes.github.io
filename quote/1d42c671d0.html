<main class="wrap"><figure class="quote" id="q-1d42c671d0" data-kw="">
<blockquote><p>But Paul would say all his excellency was from free grace. Were any indifferent beholder up in the highest Jerusalem after the Day of Judgement to see the company of the Lamb and his court, so many thousand pieces of clay then clothed with highest grace smiling on the face of Him that sits on the throne, made eternal kings, that for glory and robes of grace and the weighty crown you cannot see a bit of clay, and yet originally all these are but glistering bits of clay and graced dust; it should tire the beholder with admiration. O but the second Creation is a rare piece of workmanship. But again come and see that heaven of wonders, the Man-Christ, who as man has: 1. Flesh and blood, and a man’s soul as we have; but O so incomparably wonderful, as the grace of God without merit has made the man-Christ. Grace has exalted this man to a high throne, the Godhead, in person dwells in this clay tent of endless glory and God speaks personally out of this man; and this Emmanuel is God, and the man is so weighted with glory as all that are there (and they be a fair and numerous company) are upon one continued act of admiring, enjoying, praising, loving Him for no less date than endless eternity, and they can never be able to pull their eyes off Him. And then grace seen, enjoyed as it grows at the well-head up in Emmanuel’s highest and newest land is of another strain, sweeter and more glorious than down here in the earth, which is not the element of grace, they are but glimpses, borrowed shaddows, chips and drops of grace that are here. That is a world of nothing but graoe;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, pp. 238-39</span></figcaption>

<blockquote><p>It is a question: An sancti fruantur beatitudine ante ultimum judicium? [Whether the saints enjoy blessedness before the Last Judgment?] It was a current opinion among most of the Fathers, if not all that the souls of men after their death do not go immediately to heaven, but are in a receptacle or mansion-place till the day of Judgement, and some of late have followed it, especially the Anabaptists. The souls immediately departed have not the compleat fullness of that happiness which they shall have, yet they are not excluded from the enjoying of God, Lk. 23:43; 2 Cor. 5:1; Phil. 1:23. Some say there is a difference of those that are raised again, as Lazarus and some others; for it is likely (say they) that their souls went not into heaven, but were detained by God, who would unite them again to show forth his glory. The accidental joy of the saints (say the [Medieval] Schoolmen) shall be greater, both extensively, because it shall be in soul and body, and intensively, because the soul shall rejoyce to see the body glorified. 2. The essential glory shall increase extensively, because it shall redound unto the body. The souls of the godly immediately after their departure hence from the body are said to be in rest, Heb. 4:11 in consolation, Lk. 16:25, in security, Jn. 11:15,18, therefore they presently go to heaven, to God and Christ. Consider the names given to the state of glory: it is called Life, ‘These shall enter into life’; Rest, find rest, go to rest; our home, our Fathers’ house; a purchased and glorious inheritance; A Kingdom, the Kingdom of heaven; Joy, our Master’s joy, everlasting joy; Glory, weight of glory, eternal weight of glory; The City of our God. The Scripture calls it Paradise, a place of all delight and pleasure, alluding to that Paradise planted by God’s own hand, to make it a delight for the innocent state of man, and Abrahams bosom, wherein the Saints receive refreshing, which is a borrowed speech taken from fathers carrying and cherishing their little one, in their bosome, so the elect are cherished in the bosom of the father of all the faithful. There is perfection, perpetuity, immutability, there is Foelix securitas, secura foelicitas. Bernard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, 1654), bk. 10, ch. 4, ‘Of Everlasting Life’</cite>, pp. 869-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-9b0e021c59" data-kw="">
<blockquote><p>That, however, of which it now consists (for it must not be called immaterial) is corporeal substance. For it will be, and in part already is, the ordinary place of glorified bodies, Jn. 14:2-3; 17:24. It was visibly opened, Mt. 3:16; Acts 7:56, and was passed through by Christ ascending, Eph. 4:10. It also has its own magnitude, Jn. 14:2-3. Meanwhile, we maintain that this substance is most subtle, most lucid, and subject to no corruption, on the ground of the places: 1 Tim. 6:16; Rev. 21-22. The position of this heaven is uppermost and outermost, above all visible heavens, Dt. 4:39; Lk. 2:14; Eph. 4:10. Its circuit, moreover, is most capacious, Jn. 14:2-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-1b13e7cb51" data-kw="">
<blockquote><p>Whether the blessed saints after the end of this world shall inhabit this earth, or at least often visit it, Curiose quaeritur &amp; docte ignoratur ‘It is carefully examined, shrewdly passed over’. Voet, Bibliotheca Studiosi Theologiae, bk. 1, ch. 9 [p. 87]. Dr. [Andrew] Willet upon the Romans holds the affirmative (as I remember) and grounds it on that place of Mt. 5:5. Some urge that place in Peter, ‘A new heaven and earth wherein dwelleth righteousnesse’, that is, righteous persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>bk. 10, ‘Of Glorification…’, ch. 4, ‘Of Everlasting Life’ of A System or Body of Divinity (London, 1654)</cite>, p. 873</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Whether the blessed saints after the end of this world shall inhabit this earth, or at least often visit it, Curiose quaeritur &amp; docte ignoratur ‘It is carefully examined, shrewdly passed over’. Voet, Bibliotheca Studiosi Theologiae, bk. 1, ch. 9 [p. 87]. Dr. [Andrew] Willet upon the Romans holds the affirmative (as I remember) and grounds it on that place of Mt. 5:5. Some urge that place in Peter, ‘A new heaven and earth wherein dwelleth righteousnesse’, that is, righteous persons.”

<blockquote><p>I come now to my third [point]: that it is lawful to do good works intuitu mercedis, ‘with an eye or respect to the recompense of reward’. It is plain that Nehemiah here did so: “Remember me, O my God, concerning this,” etc. [Neh. 13:14] So did Moses, of whom it is said that he chose rather to suffer affliction with the people of God than to enjoy the pleasures of sin for a season; esteeming the reproach of Christ greater riches than the treasures of Egypt(Heb. 11:25–26), for, says the text, [Greek] (aspiciebat or intuebatur) [Greek], he had respect unto the recompense of reward. And, I confess, it seems an unreasonable thing to me [1] that that which is made the end (though but in part) of the action should not be at all looked unto by the agent; whereas finis is principium actionis [‘the end is the principle of the action]; and [2] that that which God has promised unto us as an encouragement, to make us work with the more alacrity, should not be thought on nor looked to in our working. Do not they who would persuade this go the way to discourage men from good works, by removing out of their sight the encouragement which God has given them? But they object, the obedience of God’s children ought to be filial, that is, free, and not mercenary, as that of hirelings. I answer: obedience which is only for reward, without all respect or motive of love and duty, is the obedience of a hireling; not that which acknowledges the tie of obedience-absolute, and the reward no otherwise due than of his Father’s free love and bounty, as every true child of God does, and ought to do. They object again that of the apostle, 1 Cor. 13:5, “Charity seeks not her own.” Now, say they, the works of God’s children must proceed from love and charity. I answer: what though charity seeks not her own? May not yet a charitable man so much as look or hope for his own, or have an eye to what is promised him? But this place is altogether misapplied and abused: for that property of charity now mentioned (as some also of the rest in that chapter) concerns only our charity towards men, and not our charity towards God; the meaning thereof being that a charitable man will sooner lose his own than, by seeking or contending for it, break the bond of charity.</p></blockquote>

<blockquote><p>4. OBJECT. “Since you deny that the present powers have any rightful claim to allegiance from the British covenants, there is at least part of these bonds, which in their present form, has no obligation. The form then is changed. But as matter and form are both necessary to the existence of any thing, destroy the form and the thing ceases to exist in that predicament in which it formerly existed. The form of these covenants is destroyed by your own principles, therefore their existence as covenants ceases.”

THERE are, to be sure, some people, in other respects judicious, who rigidly contend for the covenants precisely in their present form. As in their present form they comprehend all ranks, “We noblemen,” &amp;c. some think that though the government, and great majority of the nation have resiled [sic] from these engagements, yet in their present form their friends can find language sufficiently precise, and adapted to their ranks and situation. However well meant this may be, it is doubtless a mistake. When taken in connection with the pious views of its advocates, it may perhaps be properly denominated a right hand extreme. They are afraid of infringing upon sacred deeds. Such a disposition is laudable. Let it, however, be subjected to the dominion of reason.

A contempt for the deeds of ancestors, on the one hand, and a superstitious veneration for them, on the other, are extremes equally to be avoided. The former is impious, the latter is idolatrous. What is there in human composition, which may not admit of alteration? The fluctuation of living languages clearly demonstrates this. The language of our ancestors five hundred years ago, however suitable to those times, is barely intelligible at present, and in several instances, scarcely decent. Take the venerable Wickliff’s translation of the Bible as proof of this. This is not meant as a reflection on our forefathers, but is owing to that constant flux, which is found in the mode of phraseology of all living languages.

BUT it may be farther observed, that circumstances. The form of course ought to vary, with the circumstances which produced it. For instance, our covenants could not be renewed in their present form, without many explanations and marginal references. What valuable purpose would this serve? What is there so sacred in the bare phraseology of these covenants, that, when explanations are necessary, we may not substitute these for the original text? If there be, I confess I cannot see it. Let every moral duty in these sacred deeds, be carefully gathered up, and put into a form and phraseology, adapted to our existing circumstances. To these we are already bound, not only as moral, but also as covenant duties. We are bound to them, not only by the divine law, but also by our representation in our fathers, which we consider equally obligatory as our solemn act – That the forms of covenants are only circumstantials, and may be lawfully altered as circumstances require, is abundantly evident from the history of covenanting in the Old Testament.

BUT admitting, as I have done, an alteration in the form of these covenants, this does not destroy their validity or nullify their covenant obligation. It might be asked, how much of the present form of any thing is essential to its specific existence. Legs, feet and toes, arms, hands and fingers all belong to the present form of human beings; but should a finger, or toe, or even an arm or leg be cut off, the form would be somewhat altered. Would this amputation destroy the essentials of humanity? Suppose a man, who has a wife and family, enters into the ministerial office, part of his ordination vow is, that he shall faithfully discharge the duties of the conjugal relation. Should his wife and children die, and he stand no longer in a family capacity, this part of the vow being circumstantial, ceases with this change in his circumstances. Does this destroy, or in the least invalidate his ordination oath? Certainly not. He has no less ministerial authority on this account. In like manner the obligation of the moral duties contained in these covenants, not only as moral, but also as covenant duties, still remains, though the form and phraseology may undergo considerable alterations. The example of the reformers in the 16th century is full in point.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-37e96bfd8c" data-kw="">
<blockquote><p>Man as a sinner, as all true Christians will admit, has no right to approach into God’s presence at all. The amity which previously existed in Eden was broken up by the Fall. God “drove out the man,” and He alone is entitled to say whether, and on what conditions, he shall never again be permitted to approach His throne. It is manifest presumption on the part of fallen creatures to dictate to God either that there shall be worship at all or what form it shall assume.

In entering the courts of earthly monarchs, even where a right to enter is conceded, every rule and form of the court must be carefully observed; and far more is this important in entering, by gracious permission, into the immediate presence of the King of kings and Lord of lords. “See thou do all things according to the pattern showed thee in the mount,” was the command of God to Moses. “God is greatly to be feared in the assembly of the saints.”

It is in connection with worship that the solemn question is asked, “Who hath required this at your hands?” It is in connection with the second commandment, which concerns the mode of Divine worship, that the Lord says, “I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children, even unto the third and fourth generation of them that hate me.” Korah and his company were swallowed up for disregarding the ordinance of God in regard to worship. It was in connection with this that Christ drove the buyers and sellers out of the temple, and that He said on another occasion, “In vain do they worship me, teaching for doctrines the commandments of men.</p></blockquote>

<blockquote><p>10. Ye observe days. He adduces as an instance one description of “elements,” the observance of days. No condemnation is here given to the observance of dates in the arrangements of civil society. The order of nature out of which this arises, is fixed and constant. How are months and years computed, but by the revolution of the sun and moon? What distinguishes summer from winter, or spring from harvest, but the appointment of God, — an appointment which was promised to continue to the end of the world? (Genesis 8:22.) The civil observation of days contributes not only to agriculture and to matters of politics, and ordinary life, but is even extended to the government of the church. Of what nature, then, was the observation which Paul reproves? It was that which would bind the conscience, by religious considerations, as if it were necessary to the worship of God, and which, as he expresses it in the Epistle to the Romans, would make a distinction between one day and another. (Romans 14:5.)

When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.

11. Lest I have bestowed upon you labour in vain. The expression is harsh, and must have filled the Galatians with alarm; for what hope was left to them, if Paul’s labour had been in vain? Some have expressed astonishment that Paul should be so powerfully affected by the observance of days, as almost to designate it a subversion of the whole gospel. But if we carefully weigh the whole, we shall see that there was just reason; and that the false apostles not only attempted to lay the yoke of Jewish bondage on the neck of the church, but filled their minds with wicked superstitions. To bring back Christianity to Judaism, was in itself no light evil; but far more serious mischief was done, when, in opposition to the grace of Christ, they set up holidays as meritorious performances, and pretended that this mode of worship would propitiate the divine favour. When such doctrines were received, the worship of God was corrupted, the grace of Christ made void, and the freedom of conscience oppressed.

Do we wonder that Paul should be afraid that he had laboured in vain, that the gospel would henceforth be of no service? And since that very description of impiety is now supported by Popery, what sort of Christ or what sort of gospel does it retain? So far as respects the binding of consciences, they enforce the observance of days with not less severity than was done by Moses. They consider holidays, not less than the false apostles did, to be a part of the worship of God, and even connect with them the diabolical notion of merit. The Papists must therefore be held equally censurable with the false apostles; and with this addition in aggravation, that, while the former proposed to keep those days which had been appointed by the law of God, the latter enjoin days, rashly stamped with their own seal, to be observed as most holy.</p></blockquote>

<blockquote><p>Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it [one’s birth], and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>

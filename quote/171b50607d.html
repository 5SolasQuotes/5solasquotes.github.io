<main class="wrap"><figure class="quote" id="q-171b50607d" data-kw="">
<blockquote><p>”28. So great is the peace and comfort of many parishes where the public ministers and all the religious people live together in love and amity that it loudly tells us how much better that is than to study to render each other odious, or vile and excommunicable. … 37. To hold that any congregations are such whose worship is faulty, but such as God forgives and accepts, but that it is unlawful for us to join with them, lest it make us guilty of their sin, this (though it should be erroneous, and uncharitable and sinful) yet is not to excommunicate that congregation as no Church or no Christians. But to say of any congregation that they want [lack] anything essential to Christianity or to make them capable to be loved as Christians, or that their worship of God is idolatry, or so bad as that God accepts it not, the evil of it being greater than the good (as poison in our food), and on this reason to declare that no good Christian should communicate with them, this is to excommunicate such [a] congregation, as far as one Church may excommunicate another, which is but by such renouncing their communion.² ² [An equivalent example of this is in 1 Kings 13:1-10.] 38. There is no history that I have seen or heard that tells us of any Churches on earth that for many hundred years together did worship God without a liturgy as faulty as ours: To make them all idolaters, and such whose worship God cursed and accepted not, is to make them no true Churches… and if Christ had no Church, He was no Head and King of it, and so no Christ.</p></blockquote>

<blockquote><p>XXVIII… Gathering new churches by way of separation from others, or gathering assemblies without the consent of the lawful pastors who had the charge of the people of those assemblies, is a sin and schism in all these cases following: 1. In general, when the laws, practices or persons of the church which they separate from give them no sufficient cause of a departure. 2. In general, when in the judgment of true reason, according to the notable evidence of the case, the said assemblies are likely to do more hurt than good. 3. When such assemblies are gathered in opposition to some truth which the separaters would thereby disown (e.g. infant-baptism, the lawfulness of [some] set-forms of praise or prayer, or any sound doctrine) or [they are gathered] for the profession and propagation of some heresy or error (as Antinomianism, Popery, etc.). 4. When such churches are gathered by men that have no true fitness and calling for the sacred ministry or the work which they undertake. 5. When they are gathered by the pride of the ministers that would thereby unduly set up themselves and draw away disciples after them, or by their covetousness, seeking not the good of the flock, but the fleece, not them, but theirs, not serving the Lord Jesus, but their own bellies: or when gathered, by the pride of the people that unjustly think those that they separate from [are] men unworthy of their communion, and say to them, ‘Come not near to us; we are holier than you,’ Isa. 65:5. 6. When they are gathered by a quarrelsome passion, falling out with the pastors and people whom they separate from. The parting of Paul and Barnabas [Acts 15:36-40] had some evil in it. 7. When they are gathered to encourage and strengthen a sinful faction or party, or when men separate from others for fear of being censured by such a party, as Peter did withdraw from the gentile Christians lest he should displease the erroneous Jews, Gal. 2. 8. When it is done out of a proud overvaluing of men’s own opinions, or some odd singularity whereby men cannot bear those that are not of their mind, or whereby they would fain be more conspicuous as more orthodox and wise than others. 9. When it is done mistakingly to set up some wrong course of Church government or worship (as that the people may have the power of the keys or of examining and judging all admitted members, or that Papal government or the mass may be introduced, [or for] enthusiastical disorderly talking by pretended inspiration, by ignorant uncalled men, or to introduce such traditions and superstitions as the Papists use, etc.). 10. When it is done upon a false conceit that a man’s presence with any Church that has known error or faults in doctrines or worship is guilty [of] approving them; and therefore that they must separate from all such. 11. When they separate out of an unruliness of spirit, because they will not be governed by their lawful pastors in lawful things, as time, place, order, etc. or because a minor part in elections is over-voted by the major part and cannot have their wills. 12. When they separate out of a profaneness of mind, not enduring the power of the preacher’s doctrine or the holiness and discipline of the Church, but would be licentious, while they would be called religious. All these are unlawful separations and assemblings. 13. Yet that which is unlawful as to the principle, end and manner secundum quid [‘according to that’], is not always unlawful simply and in the thing itself, for a proud, covetous, turbulent person may sinfully do a lawful thing. XXIX… When pastors by concord or magistrates by laws have settled lawful circumstances or accidents of Church order or worship, or discipline, though they be in particular but human institutions, it is sinful disobedience to violate them without necessary reason, e.g. parochial order, associations, times, places, ministers, maintenance, Scripture-translations, etc. XXX… When able, faithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gathering of Separate Churches</cite>, The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6, pp. 47-49 &amp; 51-58, 85, 100-2, 118 | When Gathering of Separate Worship Assemblies or Churches is Schismatic</span></figcaption>

ithful pastors are lawfully set over the assemblies by just election and ordination, if any will causelesly and without right silence them, and command the people to desert them, and to take others for their pastors in their stead, of whom they have no such knowledge as may encourage them to such a change, we cannot defend this from the charge of schism, which puts a congregation on so hard a means of concord as to judge whether they are bound to that pastor that was set over them as Christ appointed, or must renounce him and take the other when they are commanded. So Cyprian in the case of Novatian says that he could be no bishop because another was rightful bishop before.”

relsome+passion%2C+falling+out+with+the+pastors+and+people+whom+they+separate+from.+The+parting+of+Paul+and+Barnabas+%5BActs+15%3A36-40%5D+had+some+evil+in+it.+7.+When+they+are+gathered+to+encourage+and+strengthen+a+sinful+faction+or+party%2C+or+when+men+separate+from+others+for+fear+of+being+censured+by+such+a+party%2C+as+Peter+did+withdraw+from+the+gentile+Christians+lest+he+should+displease+the+erroneous+Jews%2C+Gal.+2.+8.+When+it+is+done+out+of+a+proud+overvaluing+of+men%E2%80%99s+own+opinions%2C+or+some+odd+singularity+whereby+men+cannot+bear+those+that+are+not+of+their+mind%2C+or+whereby+they+would+fain+be+more+conspicuous+as+more+orthodox+and+wise+than+others.+9.+When+it+is+done+mistakingly+to+set+up+some+wrong+course+of+Church+government+or+worship+%28as+that+the+people+may+have+the+power+of+the+keys+or+of+examining+and+judging+all+admitted+members%2C+or+that+Papal+government+or+the+mass+may+be+introduced%2C+%5Bor+for%5D+enthusiastical+disorderly+talking+by+pretended+inspiration%2C+by+ignorant+uncalled+men%2C+or+to+introduce+such+traditions+and+superstitions+as+the+Papists+use%2C+etc.%29.+10.+When+it+is+done+upon+a+false+conceit+that+a+man%E2%80%99s+presence+with+any+Church+that+has+known+error+or+faults+in+doctrines+or+worship+is+guilty+%5Bof%5D+approving+them%3B+and+therefore+that+they+must+separate+from+all+such.+11.+When+they+separate+out+of+an+unruliness+of+spirit%2C+because+they+will+not+be+governed+by+their+lawful+pastors+in+lawful+things%2C+as+time%2C+place%2C+order%2C+etc.+or+because+a+minor+part+in+elections+is+over-voted+by+the+major+part+and+cannot+have+their+wills.+12.+When+they+separate+out+of+a+profaneness+of+mind%2C+not+enduring+the+power+of+the+preacher%E2%80%99s+doctrine+or+the+holiness+and+discipline+of+the+Church%2C+but+would+be+licentious%2C+while+they+would+be+called+religious.+All+these+are+unlawful+separations+and+assemblings.+13.+Yet+that+which+is+unlawful+as+to+the+principle%2C+end+and+manner+secundum+quid+%5B%E2%80%98according+to+that%E2%80%99%5D%2C+is+not+always+unlawful+simply+and+in+the+thing+itself%2C+for+a+proud%2C+covetous%2C+turbulent+person+may+sinfully+do+a+lawful+thing.+XXIX%E2%80%A6+When+pastors+by+concord+or+magistrates+by+laws+have+settled+lawful+circumstances+or+accidents+of+Church+order+or+worship%2C+or+discipline%2C+though+they+be+in+particular+but+human+institutions%2C+it+is+sinful+disobedience+to+violate+them+without+necessary+reason%2C+e.g.+parochial+order%2C+associations%2C+times%2C+places%2C+ministers%2C+maintenance%2C+Scripture-translations%2C+etc.+XXX%E2%80%A6+When+able%2C+faithful+pastors+are+lawfully+set+over+the+assemblies+by+just+election+and+ordination%2C+if+any+will+causelesly+and+without+right+silence+them%2C+and+command+the+people+to+desert+them%2C+and+to+take+others+for+their+pastors+in+their+stead%2C+of+whom+they+have+no+such+knowledge+as+may+encourage+them+to+such+a+change%2C+we+cannot+defend+this+from+the+charge+of+schism%2C+which+puts+a+congregation+on+so+hard+a+means+of+concord+as+to+judge+whether+they+are+bound+to+that+pastor+that+was+set+over+them+as+Christ+appointed%2C+or+must+renounce+him+and+take+the+other+when+they+are+commanded.+So+Cyprian+in+the+case+of+Novatian+says+that+he+could+be+no+bishop+because+another+was+rightful+bishop+before.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Gathering+of+Separate+Churches+%7C+The+Nonconformists%E2%80%99+Plea+for+Peace%2C+or+an+Account+of+their+Judgment+in+Certain+Things+in+which+they+are+Misunderstood%E2%80%A6+%28London%2C+1679%29%2C+sect.+6%2C+pp.+47-49+%26+51-58%2C+85%2C+100-2%2C+118+%7C+When+Gathering+of+Separate+Worship+Assemblies+or+Churches+is+Schismatic&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feb61408690.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eb61408690.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Gathering%20new%20churches%20by%20way%20of,because%20another%20was%20rightful%20bishop%20before&amp;text=Gathering%20new%20churches%20by%20way%20of%20separation%20from&amp;text=no%20bishop%20because%20another%20was%20rightful%20bishop%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

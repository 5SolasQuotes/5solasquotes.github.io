<main class="wrap"><figure class="quote" id="q-34ff0f9694" data-kw="">
<blockquote><p>In response to an overture, Synod adopted the following statement: That the 14th Synod of the United Reformed Churches in North America join with the Associate Reformed Presbyterian Church, the Presbyterian Church in America, the Reformed Presbyterian Church of North America, and the Orthodox Presbyterian Church and condemn without distinction any theological or political teaching which posits a superiority of race or ethnic identity born of immutable human characteristics and call to repentance any who would promote or associate themselves with such teaching, either by commission or omission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-calgary.html">Synod of Calgary</a></span><span class="wk"><span class="lbl">Work:</span> <cite>United Reformed Churches in North America</cite>, (June 11, 2026)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0f012044f8" data-kw="">
<blockquote><p>7. We must distinguish betwixt a dependance ‘absolute’, and ‘in some respect’; a congregation does absolutely depend upon the holy Scriptures alone, as the perfect rule of faith, and manners, of worship and of Church-Government; for we accurse the tyranny of prelates, who claimed to themselves autocratoric power over congregations to whom they gave their naked-will for a law: one of themselves told a whole synod that they ought to esteem that best which seems so to superiors; and that this is a sufficient ground to the conscience for obeying, though the thing be inconvenient. We say that congregations ought indeed to be subject to presbyteries and synods, yet not absolutely, but in the Lord, and in things lawful: and to this purpose the constitutions of presbyteries and synods are to be examined by the judgement of Christian discretion; for a synod is judex judicandus [a judge which ought to be judged], and regula regulata [a rule having been regulated], so that it ought not to be blindly obeyed, whether the ordinances be convenient or inconvenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), pt. 2, ch. 2, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-9bb9848495" data-kw="">
<blockquote><p>Therefore, since schism stands so justly chargeable as leveling a most forcible battery for the ruin and supplantation of these dearest concerns of Christianity, it’s hardly conceivable what miserable inconsideration acts those men who make so light of the Spirit of Unity: and ’tis certain that nothing less than the most incurable and fundamental overturnings can warrant a separation or rupture: And it’s a matter next to a miracle there should be any thing in the world (if not condemned by Scripture in the plainest and most down-right terms) maligned which is any way fitted for the preservation of unity.</p></blockquote>

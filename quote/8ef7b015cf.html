<main class="wrap"><figure class="quote" id="q-8ef7b015cf" data-kw="">
<blockquote><p>§XVII. There is disagreement today whether the essence of the soul is to be constituted in actual thought itself [by Cartesians], or otherwise. Theologians and philosophers hitherto have stated: The soul is a spiritual substance endowed with the faculty of thinking; and thinking always in the first act [in its existence and power], but not always in the second [in that power’s exercise]. But certain more recent thinkers [Cartesians] wish that the very essence and substance of the rational soul is thought, or that the mind is constituted by actual thought itself. We approve the former opinion with the following arguments: (1) Because Scripture distinguishes the essence of the soul from its action or operation, i.e., thought, Prov. 19:21, “Many are the thoughts in a man’s heart,” where the heart or mind is manifestly distinguished from the thoughts. Thus in Prov. 16:9 it is said: “The heart of man plans his way.” Mt. 1519, “out of the heart proceed evil thoughts.” Paul in Rom. 9:11 says of Esau and Jacob: “when they had not yet been born, or had done any good or evil etc.” from which it appears that these twins, at least in their mother’s womb, had not yet thought. In Dan. 4:29-30, Nebuchadnezzar for seven periods lacked the use of reason and the exercise of thoughts, unless we wish to assert that Nebuchadnezzar was changed in substance into another species, and therefore was utterly deprived of all humanity and mind, from which it would follow: One Nebuchadnezzar sinned, another bore the punishment for his pride. (2) From reason: No substance, at least no created one, is constituted by its own action. Since, therefore, thought is an action of our mind, it is clear that the soul is not constituted by thought, which [Renee] Descartes does not deny in his Reply to the 3rd Objection, Obj. 2 to the 2nd Meditation, p. 82. (3) No attribute is constitutive of its substance, but is consequent to it; nor does it make the substance, but presupposes it. Thought is an attribute which is predicated of the soul, and follows it. Therefore, thought does not constitute or make its substance or subject. (4) Thoughts are multiple and numerous; therefore, for the multiplication of thoughts, the soul would have to be multiplied; for their variation, it would have to be varied; for the production of thoughts, it would have to be produced. (5) The soul can lack thoughts in the second act, for example, when a person sleeps, and in a swoon, apoplexy, and epilepsy; at which time, according to the other hypothesis, the person would lack a mind. (6) Because the learned think more than the rustic and stupid, it would follow that there is more soul in a learned person than in a rustic and stupid one. (7) According to this opinion, the simplicity of God, by which He is believed to be pure act, would not remain proper to God, but would be communicated to men. (8) This opinion is repugnant to the fathers, scholastics, theologians, and even Protestant philosophers up to these times. See Leidecker, Fac. Verit., Locus 7, Controversy 6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Man’ (Frankfurt: Schwartz, 1712), trans. AI</cite></span></figcaption>

ocus%207%2C%20Controversy%206." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ea1dd5eff" data-kw="">
<blockquote><p>Therefore choice, arbitrium (an excessively proud term, in Greek αὐτεξούσιον), naturally considered, is the faculty of intellect and will by which we do what we want, by preceding counsel and judgment, such that we are not determined by any other created cause. It pertains to the intellect and will in such a way that the intellect judges and shows what should be done, but the will commands what is shown and judged, and thus at root it has reference to the intellect, but formally it has reference to the will. This certainly implies some indifference, in a divided sense, as they say, by which, with the consideration of the divine decree and predetermination set aside, man is indifferent at least by nature to acting or not acting; yet he is not indifferent in a composite sense, with regard to the divine decree and its predetermining providence, but is already determined virtually to one or the other; much less does choice consist in indifference itself. For in this way neither God, nor angel, nor any man, regenerate or unregenerate, would possess free choice, and consequently free choice would be a non-entity. For God is determined to good… And so arbitrium, choice, is more correctly said to consist in the power of acting from counsel and προαίρεσις, free choosing, or what is the same thing, in rational complacency.</p></blockquote>

</figure><figure class="quote" id="q-f32404dc04" data-kw="">
<blockquote><p>Man’s intellect, to go no further, since it attains universal and necessary truth, is not limited by material conditions and material organs. Hence man’s soul, the source of his intellect, is independent of matter, and hence survives the corruption of the human organism.</p></blockquote>

<blockquote><p>Yet know and consider that God’s power in thus abandoning all mankind for their sin in Adam is far inferior to that power He showed in cruciating his own Son, his most innocent and holy Son, in making his soul an offering for our sin. And that God has power, not only to annihilate the holiest (which is without all question), but to inflict upon him any pain. Medina is bold to profess, Ex concordi omnium theologorum sententia [according to the harmonious judgment of all theologians]; And Vasques the Jesuit acknowledges as much, though herein, they say, He should not cary himself as Judex [a Judge], but as Dominus vitae et mortis [the Lord of life and death].</p></blockquote>

<blockquote><p>§XXII… Let us be permitted to observe: that, just as the opinion of Traducianism wins by the weight of its arguments, so the opinion of Creation wins by its ecclesiastical authority.</p></blockquote>

<blockquote><p>We have reason, as a nation, to remember this awful lesson. The tempest lowered above us, and spent itself around our shores; but if national sins have been increasing, despite of mercy and warning, then a day of sterner retribution awaits us, when the cup of Britain’s iniquity shall be full.</p></blockquote>

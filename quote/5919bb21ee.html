<blockquote><p>The Pauline doctrine of justification by faith alone, which we have just treated at considerable length, is, as we have seen, the very foundation of Christian liberty. It makes our standing with God dependent not at upon what we have done, but altogether upon what God has done. If our salvation depended upon what we have done, then, according to Paul we should still be bondslaves; we should still be endeavouring feverishly to keep God’s law so well that at the end we might possibly win His favour. It would be a hopeless endeavour because of the deadly guilt of sin; we should be like debtors endeavouring to pay, but in the very effort getting deeper and deeper into debt. But as it is, in accordance with the gospel, God has granted us His favour as an absolutely free gift; He has brought us in right relation to Himself not on the basis of any merit of ours, but altogether on the basis of the merit of Christ. Great is the guilt of our sins; but Christ took it all upon Himself not on the basis of any merit of ours, but altogether on the basis of the merit of Christ. Great is the guilt of our sins; but Christ took it all upon Himself when he died for us on Calvary. We do not need, then, to make ourselves good before we become God’s children; but we can come to God just as we are, all laden with our sins, and be quite certain that the guilt of sin will be removed and that we shall be received. When God looks upon us, to receive us or to cast us off, it is not we that He regards but our great Advocate, Christ Jesus the Lord. Such is the glorious certainty of the gospel. The salvation of the Christian is certain because it depends altogether upon God; if it depended in slightest measure upon us, the certainty of it would be gone. Hence appears the vital importance of the great Reformation doctrine of justification by faith alone; that doctrine is at the very centre of Christianity. It means that acceptance with God is not something that we earn; it is not something that is subject to the wretched uncertainties of human endeavour; but it is a free gift of God. It may seem strange that we should be received by the holy God as His children; but God has chosen to receive us; it has been done on His responsibility not ours; He has a right to receive whom He will into His presence; and in the mystery of His grace He has chosen to receive us. That central doctrine of the Christian faith is really presupposed in the whole New Testament; but it is made particularly plain the Epistles of Paul.</p></blockquote>

<blockquote><p>For justification, see what it is: the Scripture in St. Paul’s epistles speaks of justification by faith; and in St. James, of justification by works. Now it will be useful for us in this point to know whence justification comes. It comes from justice, tsedeck as the original [Hebrew] has it, and ‘to justify’; so that justification and righteousness depend one upon the other. For what is justification but the manifestation of the righteousness that is in a man? and therefore in Gal. 3:21, they are put for one and the same thing: ‘For if there had been a Law given which could have given life, verily righteousness had been by the Law;’ that is, justification had been by the Law. Again, ‘If righteousness be by the Law, then Christ is dead in vain,’ Gal. 2. That is also: If justification had been by the Law, etc. justification is a manifestation of righteousness. And as many ways as righteousness is taken, so many ways is justification, which is a declaration of righteousness; so that if there be a double righteousness, there must be also a double justification. Beloved, I bring you no new doctrine; be not afraid of that; but I show you how to reconcile places of Scripture against the Church of Rome and those things which the Papists bring against us in this point. It stands by reason, seeing justification is a declaration of righteousness, that there must be so many sorts of justification as there be of righteousness. Now there is a double sort of righteousness, Rom. 8:4, ‘That the righteousness of the Law may be fulfilled in us.’ See then there is a double righteousness: there is a righteousness fulfilled in us, and a righteousness fulfilled by us; that is walking in the Spirit. The righteousness fulfilled in us is fulfilled by another and is made ours by imputation; so we have a righteousness without us and a righteousness inherent in us; the righteousness without us is forgiveness of sins and pardon of them, which is a gracious act of God, letting fall all actions against me, and accounting of me as if I had never sinned against Him all my lifetime; then there is a righteousness within me, an inherent righteousness. And if a righteousness, then justification; for that is but a declaration of righteousness. And so that which the Fathers call “justification” is taken generally for sanctification; that which we call “justification”, they call forgiveness of sins; that which we call “sanctification”, they call “justification”; so that the difference is only in the terms. Justification we must know, is not taken only as opposed to condemnation, which is the first kind of righteousness: Rom. 6:7, ‘He that is dead, is freed from sin.’ If you look to the Greek or to the margin, it is, ‘He that is dead is justified from sin;’ this is not taken in the first sense as opposed to condemnation, but in the other sense as it has relation to final grace; The perfection of sanctification is wrought in me; for where there is final grace, there is a supersedeas from all sin; so Rev. 22:11, ‘Let him that is righteous, be righteous still;’ the Greek is, ‘Let him that is righteous, be justified still.’ See then the difference between Saint Paul and Saint James. Saint Paul speaks of that which consists in remission of sins, as in comparing the apostle with David will appear, ‘Blessed is the man whose sins are forgiven.’ [Ps. 32:1] Saint James speaks of justification in the second acception. You need not fly to that distinction of justification before God and justification before men; think not that Saint James speaks only of justification before men. Was not Abraham our father justified by works when he offered up Isaac on the altar? [Gen. 22] What, justified by killing his son? this was a proper work indeed to justify him before man, to be a parricide; to kill his son, though it were not so before God. So Ps. 106, we read how God accounted the act of Phineas as for righteousness. Thus you see how works are accounted righteousness in the second kind of righteousness. In the former righteousness we are justified by faith; for in righteousness inherent there is a goodly chain of virtues: ‘Add to your faith virtue,’ etc. Add one grace to another; add to virtue knowledge. Faith is but one part of the crown. Now this justification in the first sense whereby my sins are forgiven is called the righteousness of God because of Christ which is God, because it is wrought by Christ, Dan. 9; He is called an everlasting righteousness, which continues forever world without end; for do not think the saints in Heaven have only the second kind of righteousness; for they have the same covering by justification by Christ in Heaven that they had before; God covers their sins not here only, but there also; justification follows them forever.</p></blockquote>

e+is+a+righteousness+fulfilled+in+us%2C+and+a+righteousness+fulfilled+by+us%3B+that+is+walking+in+the+Spirit.+The+righteousness+fulfilled+in+us+is+fulfilled+by+another+and+is+made+ours+by+imputation%3B+so+we+have+a+righteousness+without+us+and+a+righteousness+inherent+in+us%3B+the+righteousness+without+us+is+forgiveness+of+sins+and+pardon+of+them%2C+which+is+a+gracious+act+of+God%2C+letting+fall+all+actions+against+me%2C+and+accounting+of+me+as+if+I+had+never+sinned+against+Him+all+my+lifetime%3B+then+there+is+a+righteousness+within+me%2C+an+inherent+righteousness.+And+if+a+righteousness%2C+then+justification%3B+for+that+is+but+a+declaration+of+righteousness.+And+so+that+which+the+Fathers+call+%E2%80%9Cjustification%E2%80%9D+is+taken+generally+for+sanctification%3B+that+which+we+call+%E2%80%9Cjustification%E2%80%9D%2C+they+call+forgiveness+of+sins%3B+that+which+we+call+%E2%80%9Csanctification%E2%80%9D%2C+they+call+%E2%80%9Cjustification%E2%80%9D%3B+so+that+the+difference+is+only+in+the+terms.+Justification+we+must+know%2C+is+not+taken+only+as+opposed+to+condemnation%2C+which+is+the+first+kind+of+righteousness%3A+Rom.+6%3A7%2C+%E2%80%98He+that+is+dead%2C+is+freed+from+sin.%E2%80%99+If+you+look+to+the+Greek+or+to+the+margin%2C+it+is%2C+%E2%80%98He+that+is+dead+is+justified+from+sin%3B%E2%80%99+this+is+not+taken+in+the+first+sense+as+opposed+to+condemnation%2C+but+in+the+other+sense+as+it+has+relation+to+final+grace%3B+The+perfection+of+sanctification+is+wrought+in+me%3B+for+where+there+is+final+grace%2C+there+is+a+supersedeas+from+all+sin%3B+so+Rev.+22%3A11%2C+%E2%80%98Let+him+that+is+righteous%2C+be+righteous+still%3B%E2%80%99+the+Greek+is%2C+%E2%80%98Let+him+that+is+righteous%2C+be+justified+still.%E2%80%99+See+then+the+difference+between+Saint+Paul+and+Saint+James.+Saint+Paul+speaks+of+that+which+consists+in+remission+of+sins%2C+as+in+comparing+the+apostle+with+David+will+appear%2C+%E2%80%98Blessed+is+the+man+whose+sins+are+forgiven.%E2%80%99+%5BPs.+32%3A1%5D+Saint+James+speaks+of+justification+in+the+second+acception.+You+need+not+fly+to+that+distinction+of+justification+before+God+and+justification+before+men%3B+think+not+that+Saint+James+speaks+only+of+justification+before+men.+Was+not+Abraham+our+father+justified+by+works+when+he+offered+up+Isaac+on+the+altar%3F+%5BGen.+22%5D+What%2C+justified+by+killing+his+son%3F+this+was+a+proper+work+indeed+to+justify+him+before+man%2C+to+be+a+parricide%3B+to+kill+his+son%2C+though+it+were+not+so+before+God.+So+Ps.+106%2C+we+read+how+God+accounted+the+act+of+Phineas+as+for+righteousness.+Thus+you+see+how+works+are+accounted+righteousness+in+the+second+kind+of+righteousness.+In+the+former+righteousness+we+are+justified+by+faith%3B+for+in+righteousness+inherent+there+is+a+goodly+chain+of+virtues%3A+%E2%80%98Add+to+your+faith+virtue%2C%E2%80%99+etc.+Add+one+grace+to+another%3B+add+to+virtue+knowledge.+Faith+is+but+one+part+of+the+crown.+Now+this+justification+in+the+first+sense+whereby+my+sins+are+forgiven+is+called+the+righteousness+of+God+because+of+Christ+which+is+God%2C+because+it+is+wrought+by+Christ%2C+Dan.+9%3B+He+is+called+an+everlasting+righteousness%2C+which+continues+forever+world+without+end%3B+for+do+not+think+the+saints+in+Heaven+have+only+the+second+kind+of+righteousness%3B+for+they+have+the+same+covering+by+justification+by+Christ+in+Heaven+that+they+had+before%3B+God+covers+their+sins+not+here+only%2C+but+there+also%3B+justification+follows+them+forever.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+Eighteen+Sermons+preached+in+Oxford%2C+1640%2C+of+conversion%2C+unto+God%2C+of+redemption+%26+justification%2C+by+Christ+%28London%3A+1660%29+%7C+15th+Sermon%2C+on+Rom.+5%3A1%2C+pp.+396-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F212ccc2b72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/212ccc2b72.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=For%20justification%2C%20see%20what%20it%20is,there%20also%3B%20justification%20follows%20them%20forever&amp;text=For%20justification%2C%20see%20what%20it%20is%3A%20the%20Scripture&amp;text=only%2C%20but%20there%20also%3B%20justification%20follows%20them%20forever" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin. 2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>

</figure><figure class="quote" id="q-c085023e56" data-kw="">
<blockquote><p>Whence it follows, that the merit of works ceases when righteousness is sought by faith; for it is necessary that this righteousness should be freely given by God, and offered in his word, in order that any one may possess it by faith. To render this more intelligible, when Moses says that faith was imputed to Abram for righteousness, he does not mean that faith was that first cause of righteousness which is called the efficient, but only the formal cause; as if he had said, that Abram was therefore justified, because, relying on the paternal loving-kindness of God, he trusted to His mere goodness, and not to himself, nor to his own merits. For it is especially to be observed, that faith borrows a righteousness elsewhere, of which we, in ourselves, are destitute; otherwise it would be in vain for Paul to set faith in opposition to works, when speaking of the mode of obtaining righteousness. Besides, the mutual relation between the free promise and faith, leaves no doubt upon the subject.</p></blockquote>

<blockquote><p>[The Galatians] joined the works of the law with Christ and his grace in the cause of their justification and salvation. Here it must be observed that they which make a union of grace and works in the cause of justification are separated from the grace of God. Grace admits no partner or fellow. Grace must be freely given every way, or it is no way grace.</p></blockquote>

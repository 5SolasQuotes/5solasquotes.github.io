<blockquote><p>In the dispute which resulted in the schism of 1840 over the civil magistrate’s power circa sacra, it was alleged that Thomas Houston was arguing for the entire judicial law to be upheld by the Christian ruler. This was a complete straw-man, yet, in modern debates over Theonomy, we hear this very same straw-man repeated again and again. No matter how many times you tell people that this is not the case, they persist in spreading such misrepresentation. Instead, our position is that the judicial laws which are part of the moral law continue to oblige all nations; as Dr Houston puts it:

Again, the authors of the Declinature obviously represent Mr. Houston, as teaching that the whole Judicial Code is still obligatory on Christian civil rulers, whereas, even in the passages which they have quoted, the writer limits the laws, as do the eminent Divines, to those which guard the Decalogue, which are moral in their nature, and which are susceptible of application, to nations in different ages, and under every dispensation.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-786cf49f11" data-kw="">
<blockquote><p>But how doth it appear that these or any other Judicial Laws of Moses do at all appertain to us, as rules to guide us in like cases? I shall with him who scrupleth this, to read Piscator his Appendix to his Observations upon the 21, 22, 23. Chapters of Exodus, where he excellently disputeth this question, Whether the Christian Magistrate be bound to observe the Judicial laws of Moses, as well as the Jewish Magistrate was. He answereth by the common distinction, he is obliged to those things in the Judicial law which are unchangeable, and common to all Nations: but not to those things which are mutable, or proper to the Jewish Republic. But then he explaineth this distinction, that by things mutable, and proper to the Jews, he understandeth the emancipation of an Hebrew servant or handmaid in the seventh year, a mans marying his brothers wife and raising up seed to his brother, the forgiving of debts at the Jubilee, marying with one of the same Tribe, and if there be any other like to these; also Ceremonial trespasses, as touching a dead body, etc. But things immutable, and common to all Nations are the laws concerning Moral trespasses, Sins against the Moral law, as murder, adultery, theft, enticing away from God, blasphemy, striking of Parents. Now that the Christian Magistrate is bound to observe these Judicial laws of Moses which appoint the punishments of sins against the Moral law, he proveth by these reasons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty</cite>, (London: Christopher Meredith, 1645), 6–7.</span></figcaption>

</figure><figure class="quote" id="q-2173736ca3" data-kw="">
<blockquote><p>Perhaps it may be thought by some that the Saviour’s declaration, “Render, therefore, unto Caesar the things which are Caesar’s,” (Mat. xxii. 21,) does not seem to coincide with the sentiments now expressed. As this passage has also been impressed into the service of courtly adulation, and been generally applied in support of unqualified subjection to all kinds of taxes and Government-imposts, we must here endeavour to set it in its true light. We affirm, then, in the most unequivocal terms, that the declaration is no direct and positive answer to the question proposed, nor was it understood to be so by the Jews.

As the question stood, it required to be answered thus:- It is lawful, or it is not evident, that the question was captious and ensnaring, since the Saviour said – “Why tempt ye me, ye hypocrites?” The answer, therefore, was evasive and equivocal, and was so understood; otherwise, how should those who proposed it “marvel,” had not their cunning been baffled, and their hopes disappointed? Let it be remarked, that it is no way derogatory to the Saviour’s candour to say, that he is baffled the malice of his enemies by answering the fool according to his folly.

We have an instance of this kind in the decision he gave respecting the woman taken in adultery – “Let him that is without sin among you cast the first stone at her.” So, likewise, when he said – “Destroy this temple, and in three days I will rear it up again,” he gave a practical illustration of the propriety of the precept in these instances which we have adduced. Since the answer, then, was evasive, it must be highly absurd to consider it as direct, and to apply it accordingly, as has been frequently done.

But even although we should allow the question to have been answered in direct terms, which we by no means do, it could never be justly adduced as an example for our imitation, either regarding obedience to civil rulers, or the voluntary payment of government taxes, since our political circumstances, and those of the Jews in the Saviour’s time, are entirely different. They were a conquered nation – and had, by their aggravated sins, given the Gentiles, or Romans, a right over them, which none would have obtained, had they continued to perform their allegiance to God.

Caesar did not govern them, either by their choice or consent; they had no hand in enacting those laws to which they were obliged to submit, nor had any of the Caesars sworn to govern them according to law. They had no political charter, recognizing their rights and liberties; nor had it ever been said to them, in relation to Caesar, “Will ye have this man to reign over you?” They were, therefore, obliged to submit to any imposition, because resistance, at that time, was out of the question.

Our case is entirely different in submitting to the authority of our Caesars or civil magistrates. They have no absolute or dictatorial power over us; nor can they demand a shilling from us, unless it be allowed them by law. Those laws which claim our obedience are not made by the magistrate, but by ourselves, through our representatives; nor are we bound to obey any magistrates, but such as have been legally set up.

Our Caesar swears and engages to rule by law; and all his power is derived from the same law which constitutes him chief magistrate. The law alone sanctions what he is to command, and defines the limits of our obedience. These circumstances, then, can be no just similarity established between Caesar’s arbitrary exactions from the Jews, and our taxation according to law. This text, of course, is grossly abused, when it is applied for the purpose of inculcating submission to the measures of civil government; nor does it tend in the slightest degree, when rightly understood, to invalidate the doctrine advocated in the preceding remarks.</p></blockquote>

<blockquote><p>That this Author saith, God commanded those that transgressed his holy Law with an high hand, and presumptuously to be killed, lest they should live and profane his holy things; I defend not: But sure Erastus erreth, who will have all such to be killed by the Magistrate under the New Testament, because they were killed in the Old: Then are we to stone men that gathereth sticks on the Lord’s Day; the child that is stubborn to his Parents, the Virgins, daughters of Ministers that committeth fornication are to be put to death. Why, but then the whole judicial Law of God shall oblige us Christians as Carolosladius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them, so it was mysterious teach of us, how God hated such and such sins, and mysteries of that kind are gone with the other shadows. But we read not (saith Erastus) where Christ hath changed those Laws in the New Testament. It is true, Christ hath not said in particular, I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated until the evening; nor hath he said particularly of every carnal Ordinance and judicial Law, it is abolished. Be we conceive, the whole bulk of the judicial Law, as judicial, and as it concerned the Republick of the Jews only, is abolished, though the moral equity of all those be not abolished; also some punishments were merely symbolical, to teach the detestation of such a vice, as the boaring with an aul the ear of him that loved his Master, and desired still to serve him, and the making of him his perpetual servant. I should think the punishing with death the man that gathered sticks on the Sabbath was such; and in all this, the punishing of a sin against the Moral Law by the Magistrate, is Moral and perpetual; but the punishing of every sin against the Moral Law, tali modo, so and so, with death, which spitting on the face: I much doubt if these punishments in particular, and in their positive determination to the people of the Jews, be moral and perpetual: As he that would marry a captive woman of another Religion, is to cause her first pare her nails, and wash herself, and give her a month, or less time to lament the death of her Parents, which was a Judicial, not a Ceremonial Law; that this should be perpetual, because Christ in particular hath not abolished it, to me seems most unjust; for as Paul saith, He that is Circumcised becomes a debtor to the whole Law, sure to all the Ceremonies of Moses his Law: So I argue, à pari, from the like, He that will keep one judicial Law, because judicial and given by Moses, becometh debtor to keep the whole judicial Law, under pain of God’s eternal wrath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London : John Field for Christopher Meredith, 1646), 493–94.</span></figcaption>

<blockquote><p>Objection. But do not the laws of men in authority bind the conscience? Answer. Not by themselves and primarily, but secondarily by participation, with the Law of God which does immediately and of itself bind the conscience; as water does make hot and scald sometimes, not of itself, but as it participates in the heat of fire, which immediately from the nature of it makes hot. If they command anything repugnant to God’s Word we may disobey it, and not sin: provided that our denial of obedience come from conscience of God’s will, and not from want of due subjection in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Help to True Happiness</cite>, (London, 1618), pt. 1, question 3, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

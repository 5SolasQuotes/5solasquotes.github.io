<main class="wrap"><figure class="quote" id="q-526678c88e" data-kw="">
<blockquote><p>7. Works done by unregenerate men, although, for the matter of them, they may be things which God commands, and of good use both to themselves and others;[y] yet, because they proceed not from a heart purified by faith;[z] nor are done in a right manner, according to the word;[a] nor to a right end, the glory of God;[b] they are therefore sinful, and cannot please God, or make a man meet to receive grace from God.[c] And yet their neglect of them is more sinful, and displeasing unto God.[d] [y] 2 Kings 10:30,31. 1 Kings 21:27,29. Phil. 1:15,16,18. [z] Gen. 4:5 with Heb. 11:4. Heb. 11:6. [a] 1 Cor. 13:3. Isa. 1:12. [b] Matt. 6:2,5,16. [c] Hag. 2:14. Tit. 1:15. Amos 5:21,22. Hosea 1:4. Rom. 9:16. Tit. 3:5. [d] Ps. 14:4. Ps. 36:3. Job 21:14,15. Matt. 25:41-43,45. Matt. 23:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, ch. 16, Of Good Works</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-598435c150" data-kw="">
<blockquote><p>As for annihilationism, the first Anglican cleric to publicly show an openness to the idea was none other than the illustrious Bishop Jeremy Taylor. In his sermon ‘Christ’s Advent to Judgment,’… Taylor explains at some length that church fathers like Justin Martyr and Irenaeus believed that God would eventually annihilate the damned, since immortality is not intrinsic to human nature… Taylor… cannot bring himself to be certain of annihilationism. He settles only for its possibility… No controversy or backlash ever followed Bishop Taylor’s questioning of eternal conscious torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’</cite>, (2025)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

</figure><figure class="quote" id="q-4ca0e1084c" data-kw="">
<blockquote><p>III. Although the resurrection of the dead surpasses nature and man&#x27;s corrupt reason, yet it is neither against nature nor against right reason. For right reason teaches both that the dead can be raised and that they are to be raised. The former is concluded from the omnipotence of God, the latter from his justice. For as it is just that certain sins should be punished after this life, so it is also just that what was the partner of the sins should be the partner of the penalties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 3</span></figcaption>

</figure><figure class="quote" id="q-c89fc9a1c8" data-kw="">

</figure><figure class="quote" id="q-bcdbb060e2" data-kw="Gehenna sheol">
<blockquote><p>Hell is called in Hebrew sheol, in Greek hades. Here we take it for the place of the damned, as it is taken in Lk. 16:23. Various synonyms of it occur in the Scriptures: perdition; Gehenna (Mt. 5:22, 29), a word derived from the valley of the children of Hinnom, in which the wicked Israelites were accustomed to practice horrible idolatries to Moloch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.7.2</span></figcaption>

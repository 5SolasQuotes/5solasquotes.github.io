<blockquote><p>The judicial law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles, and the typical signification of the kingdom of Christ. However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments for crimes, these same judicial laws all remain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scriptorum Theologicorum Heidelbergensium Tomus Primus, continens Locos Communes</cite>, (Amstelodami, Apud Joannem Janssonium, 1646), Locorum Theologicorum, Pars Prior, Locus VI, pp 100–13. Quoted in Johannes Piscator, Disputations on the Judicial Laws of Moses, trans. Adam J. Brink, ed. Joel McDurmon (1646; Powder Springs GA: American Vision Press, 2015), p. 59n.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-a505dec620" data-kw="">
<blockquote><p>1. An unrighteous judge does condemn the cause of God Himself: For every righteous cause is his. 2. …It is a damnable sin not to relieve the innocent and imprisoned in their distress, when we have power…

3. It is a turning of the remedy into a double misery; and taking away the only help of oppressed innocency. What other defense has innocency, but Law and Justice? And when their refuge itself does fall upon them and oppress them, whither shall the righteous fly?

4. It subverts laws and government, and abuses it to destroy the ends which it is appointed for.

5. Thereby it turns human society into a state of misery, like the depredations of hostility.

6. It is a deliberate resolved sin, and not done in a passion by surprise: It is committed in that place, and in that form, as acts of greatest deliberation should be done: As if he should say, upon full disquisition, evidence and deliberation, I condemn this person, and his cause.

7. All this is done as in the Name of God, and by his own commission, by one that pretends to be his officer or minister, Rom. 3:3- 6. For the judgement is the Lord’s; 2 Chron. 19:8-10 &amp; 19:5-7. And how great a wickedness is it thus to blaspheme, and to represent Him as Satan, an enemy to truth and righteousness, to his servants and Himself?…

8. It is sin against the fullest and frequentest prohibitions of God. Read over Ex. 23:1-3, etc.; Lev. 10:15; Dt. 1:16-17 &amp; 16:18; Isa. 1:17, 20, 23; Dt. 24:17 &amp; 27:19, ‘Cursed be he that perverts the judgement of the stranger, the fatherless and widow, and all the people shall say Amen’; Ezra 7:26; Ps. 33:5 &amp; 37:28 &amp; 72:2 &amp; 94:15 &amp; 106:3,30; Prov. 17:27 &amp; 19:28 &amp; 20:8 &amp; 29:4 &amp; 31:5; Eccl. 5:8; Isa. 5:7 &amp; 10:2 &amp; 56:1-2 &amp; 59:14-15; Jer. 5:1 &amp; 7:5 &amp; 9:24; Eze. 18:8 &amp; 45:9; Hos. 12:6; Amos 5:7,15,24 &amp; 6:12; Mic. 3:9; Zech. 7:9 &amp; 8:16; Gen. 18:19; Prov. 21:3,7,15. I cite not the words to avoid prolixity…

9. False judges cause the poor to appeal to God against them, and the cries of the afflicted shall not be forgotten, Lk. 18:5-8.

10. They call for God’s judgement upon themselves, and devolve the work into his hands… Ps. 9:7-9, ‘The Lord hath prepared his throne for judgement, and he shall judge the world in righteousness, he shall minister judgement to the people in uprightness; he will be a refuge for the oppressed;’ Ps. 37:6, ‘He will bring forth righteousness as the light, and thy judgement as the noon day;’ Ps. 89:14, ‘Justice and judgement are the habitation of his throne;’ Ps. 103:6, ‘The Lord executeth righteousness and judgement for all that are oppressed;’ Ps. 146:7. In a word, the sentence of an unjust Judge is passed against his own soul, and he calls to God to condemn him righteously, who unrighteously condemned others. Of all men, he cannot stand in judgement, nor abide the righteous doom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, § 4, III, ‘The Evil of Unrighteous Judgments’, p. 150</span></figcaption>

all+the+people+shall+say+Amen%E2%80%99%3B+Ezra+7%3A26%3B+Ps.+33%3A5+%26+37%3A28+%26+72%3A2+%26+94%3A15+%26+106%3A3%2C30%3B+Prov.+17%3A27+%26+19%3A28+%26+20%3A8+%26+29%3A4+%26+31%3A5%3B+Eccl.+5%3A8%3B+Isa.+5%3A7+%26+10%3A2+%26+56%3A1-2+%26+59%3A14-15%3B+Jer.+5%3A1+%26+7%3A5+%26+9%3A24%3B+Eze.+18%3A8+%26+45%3A9%3B+Hos.+12%3A6%3B+Amos+5%3A7%2C15%2C24+%26+6%3A12%3B+Mic.+3%3A9%3B+Zech.+7%3A9+%26+8%3A16%3B+Gen.+18%3A19%3B+Prov.+21%3A3%2C7%2C15.+I+cite+not+the+words+to+avoid+prolixity%E2%80%A6+9.+False+judges+cause+the+poor+to+appeal+to+God+against+them%2C+and+the+cries+of+the+afflicted+shall+not+be+forgotten%2C+Lk.+18%3A5-8.+10.+They+call+for+God%E2%80%99s+judgement+upon+themselves%2C+and+devolve+the+work+into+his+hands%E2%80%A6+Ps.+9%3A7-9%2C+%E2%80%98The+Lord+hath+prepared+his+throne+for+judgement%2C+and+he+shall+judge+the+world+in+righteousness%2C+he+shall+minister+judgement+to+the+people+in+uprightness%3B+he+will+be+a+refuge+for+the+oppressed%3B%E2%80%99+Ps.+37%3A6%2C+%E2%80%98He+will+bring+forth+righteousness+as+the+light%2C+and+thy+judgement+as+the+noon+day%3B%E2%80%99+Ps.+89%3A14%2C+%E2%80%98Justice+and+judgement+are+the+habitation+of+his+throne%3B%E2%80%99+Ps.+103%3A6%2C+%E2%80%98The+Lord+executeth+righteousness+and+judgement+for+all+that+are+oppressed%3B%E2%80%99+Ps.+146%3A7.+In+a+word%2C+the+sentence+of+an+unjust+Judge+is+passed+against+his+own+soul%2C+and+he+calls+to+God+to+condemn+him+righteously%2C+who+unrighteously+condemned+others.+Of+all+men%2C+he+cannot+stand+in+judgement%2C+nor+abide+the+righteous+doom+of+Christ.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+%E2%80%A6+%28London%2C+1673%29%2C+pt+4%2C+ch.+22%2C+%E2%80%98Cases+%26+Directions+Against+Injurious+Law-Suits%2C+Witnessing+%26+Judgment%E2%80%99%2C+%C2%A7+4%2C+III%2C+%E2%80%98The+Evil+of+Unrighteous+Judgments%E2%80%99%2C+p.+150&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa505dec620.html&amp;via=5Solas" target="_blank" rel="noopener">

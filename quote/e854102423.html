<main class="wrap"><figure class="quote" id="q-e854102423" data-kw="">
<blockquote><p>Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 6 (Edinburgh: T&amp;T Clark, n.d.), 592.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-39f5b803b8" data-kw="">
<blockquote><p>But in none of its normal uses is ‘beautiful’ a metaphor, even if, like many a metaphor, it ranges over indefinitely many categories of object. So why do we call things beautiful? What point are we making, and what state of mind does our judgement express? There is an appealing idea about beauty which goes back to Plato and Plotinus, and which became incorporated by various routes into Christian theological thinking. According to this idea beauty is an ultimate value—something that we pursue for its own sake, and for the pursuit of which no further reason need be given. Beauty should therefore be compared to truth and goodness, one member of a trio of ultimate values which justify our rational inclinations. Why believe p? Because it is true. Why want x? Because it is good. Why look at y? Because it is beautiful. In some way, philosophers have argued, those answers are on a par: each brings a state of mind into the ambit of reason, by connecting it to something that it is in our nature, as rational beings, to pursue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre</cite>, (Oxford University Press, 2011) 180 pp. ToC, p. 2</span></figcaption>

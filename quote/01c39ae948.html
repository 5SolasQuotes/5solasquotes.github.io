<main class="wrap"><figure class="quote" id="q-01c39ae948" data-kw="">
<blockquote><p>Right discipline is not necessary to the essence of a visible Church. All our divines condemn Anabaptists and Pelagians, who plead that righteous men only, and such societies as have right discipline, be true Churches. Novatians and Donatistscame near to them in this also. The exercise may be wanting in a Church, a true visible Church, from which we are not to separate. A Church may retain the essence and being of a visible Chuch, and yet have no discipline in actual use, or little.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</span></figcaption>

</figure><figure class="quote" id="q-4a9d17945f" data-kw="">
<blockquote><p>There was also a paper, entitled An information against Mr Renwick’s party, given in to ministers… the papers had been left by Alexander Gordon… There was nothing on the face of the ‘information’ paper to suggest that it had not been compiled by the Carrick men themselves, but the style and substance of it pointed directly to Robert Langlands… The Societies, it charged… had imposed restrictions on ministers and cast off the whole suffering ministry… they had made ‘canons’ laying down the qualifications of those fitted to be members of their meetings, forbidding association with those they regarded as unfaithful, even to the extent of servants joining in family worship with their masters, or children with their parents;¹ and, not least, they had ‘cast off most part of the societies in the shires of Ayr and Galloway, chiefly upon these two heads, that they would not disown and condemn the [civil] declaration published by Argyle, and because they were clear to call and hear faithful suffering ministers’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), p. 137</span></figcaption>

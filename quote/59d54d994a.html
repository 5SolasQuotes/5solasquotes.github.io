<blockquote><p>Cruel is the mercy which exposes the sheep as a prey that the wolf may be appeased; and which suffers the body of Christ to be lacerated and their minds to be tainted with the poison of corrupt doctrines that the stench of one rotten member may remain entire.</p></blockquote>

— Francis Turretin, Institutes of elenctic theology, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), iii, 329.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCruel+is+the+mercy+which+exposes+the+sheep+as+a+prey+that+the+wolf+may+be+appeased%3B+and+which+suffers+the+body+of+Christ+to+be+lacerated+and+their+minds+to+be+tainted+with+the+poison+of+corrupt+doctrines+that+the+stench+of+one+rotten+member+may+remain+entire.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+elenctic+theology%2C+trans.+G.+M.+Giger%2C+ed.+J.+T.+Dennison+%281679%3B+3+vols%2C+Philipsburgh%2C+1992%29%2C+iii%2C+329.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F59d54d994a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/59d54d994a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/03/31/francis-turretin-the-tender-mercies-of-the-tolerationists-are-cruel/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2cda512777" data-kw="">
<blockquote><p>The first error we mention was their inquisitorialness, — the excess of their ecclesiastical legislation. This refers to those who belonged to their own communion. It is well known that the discipline of the Church Courts, from kirk-sessions to general assemblies, even over those who were friends, was extreme. Such legislation could not be tolerated in our day, even among the most devoted Protestants. It was not desirable. Individuals, families, congregations, communities, were all dealt with by ecclesiastical or burghal authorities, and often in minute matters, which did not properly belong to the business of the Church.

We may admire the impartiality of the Church and its administrators, and their evident sincerity, sparing no class, high or low, contravening their regulations, — their honest zeal, — but we cannot approve of such severity of discipline, even for offences which properly came before the Church Courts. We have no authority in Scripture for clothing men under discipline in sackcloth, and making them appear before a congregation for successive days in a white sheet, and far less for the pillory, and ducking, and fines. …

The course pursued was well intended, but it was mistaken. It was more than the Word of God or the example of the Apostolic Church demanded, and must have made the transition from the moral relaxation of the Church of Rome, to the proper strictness of the Reformed standard, more difficult. The change must have been in many cases so violent as to disgust and repel. Gentler treatment might have won.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-g-lorimer.html">John G. Lorimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Errors of the Age of the Reformation and the Light in which they should be regarded by the men of the Present Day in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

We may admire the impartiality of the Church and its administrators, and their evident sincerity, sparing no class, high or low, contravening their regulations, — their honest zeal, — but we cannot approve of such severity of discipline, even for offences which properly came before the Church Courts. We have no authority in Scripture for clothing men under discipline in sackcloth, and making them appear before a congregation for successive days in a white sheet, and far less for the pillory, and ducking, and fines. …

</figure><figure class="quote" id="q-29730e0286" data-kw="">
<blockquote><p>Love to God, and love to man, is the substance of religion; when these prevail, civil laws will have little to do… 1. The magistrate (or ruling part of any society) ought to encourage piety by his own example, and by endeavoring to make it an object of public esteem. Whenever the general opinion is in favor of anything, it will have many followers. Magistrates may promote and encourage men of piety and virtue, and they may discountenance those whom it would be improper to punish. 2. …It is commonly said, however, that in case any sect hold tenets subversive of society, and inconsistent with the rights of others, that they ought not to be tolerated. On this footing Popery is not tolerated in Great Britain; because they profess entire subjection to a foreign power, the See of Rome: and therefore must be in opposition to the proper interest of their own state; and because violence or persecution for religion is a part of their religion, which makes their prosperity threaten ruin to others, as well as the principle imputed to them, which they deny, That faith [upholding agreements] is not to be kept with heretics… 3. The magistrate may enact laws for the punishment of acts of profanity and impiety. The different sentiments of men in religion ought not by any means to encourage or give a sanction to such acts as any of them count profane. Many are of the opinion, that, besides all this, the magistrate ought to make public provision for the worship of God, in such manner as is agreeable to the great body of the society; though, at the same time, all who dissent from it are fully tolerated. And, indeed, there seems to be a good deal of reason for it, that so instruction may be provided for the bulk of common people, who would, many of them, neither support nor employ teachers, unless they were obliged. The magistrate’s right in this case seems to be something like that of the parent; they have a right to instruct, but not to constrain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Moral Philosophy, Lecture 14, ‘Jurisprudence’ in Works</cite>, (Edinburgh, 1815), vol. 7, pp. 119-21</span></figcaption>

<blockquote><p>[I]f any party whatever, but especially if the State, or civil power, shall claim the right of controlling the government which Christ has appointed in the hands of Church office-bearers, they must refuse obedience to that claim, must make up their minds to suffer, if need be, the loss of all things, rather than yield to it. And this because they are only servants, ministers, stewards, entrusted by the alone Master and King with a certain authority and duty.

Were they princes — as Rome’s ecclesiastics claim to be — then might they be free to consider the question, at least, whether it were not expedient, in certain circumstances, to resign the government of the Church into other hands. But they are stewards only, mere administrators, and have no discretion in any such matter. They hear the voice of the Master, “The flock over which the Holy Ghost hath made you overseers” — “put away from among yourselves that wicked person” — “whatsoever ye shall bind on earth, shall be bound in heaven; and whatsoever ye shall loose on earth, shall be loosed in heaven.”

And the government which they have thus received, they must discharge on their responsibility to Christ alone. But especially, to yield it up into the hands of the State, were to yield it, as we have seen, into the hands of another king, another master, and so were nothing less than treason against the only King and Head of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-j-brown.html">Charles J. Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Disruption Question Stated. Reprinted (with some additions) from the Free Church Record, at the request of the Free Presbytery of Edinburgh</cite>, (Edinburgh: T. Nelson and Sons, 1863), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

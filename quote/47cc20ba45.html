<main class="wrap"><figure class="quote" id="q-47cc20ba45" data-kw="">
<blockquote><p>That the services of domestic worship may be instrumental in subserving this high purpose, two things are indispensable;— they should be performed with scrupulous punctuality, and formality should be carefully avoided. No multiplicity or variety of engagements — no plea of inability for conducting devotional services — no backwardness, from the presence of servants or strangers, can be sustained as valid excuses for the occasional or frequent neglect of a duty, on which so much of the benefit or happiness of the family depends.

To limit family worship to one part of the day, and to omit it, at times, from the interruption of business or society, is to neglect Heaven’s standing institute and to postpone the spiritual welfare of the household to the trivial, fleeting interests of the world. It is, in fact, to substitute a human invention for God’s appointed ordinance, and to render the spiritual and eternal interests of a family subservient to mere worldly caprice or convenience.

Ability for duty is obtained in the way of diligently observing it, and never by neglecting it; and obstacles and interruptions will give way before those whose faces are towards God’s altar, and whose heartfelt purpose is that of the veteran Joshua — “As for me and my house, we will serve the Lord.” David might have pleaded multiplicity of engagements, and pressing public duties, as an excuse for neglecting family worship, on the day that he returned to “bless his house;” and the “father of the faithful” had doubtless many temptations, in his frequent journeyings, to omit at times the devotional exercises of the family.

But the saints of God have ever regarded their true interest, and the blessing of their households, as connected with seeking God’s face; and amidst difficulties and trials, they have considered daily domestic worship as at once the most valuable work in which the family could be employed, and as the most effectual means of promoting its genuine prosperity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Commendation of Abraham, or, Parental Duties; and the Blessing Resulting from their Faithful Performance</cite>, (Edinburgh: William Whyte &amp; Co., 1844), pp 61-63.</span></figcaption>

<blockquote><p>Concerning Musical Organs It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolized the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed, he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical Masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal chronicles attribute its introduction to Pope Vitalian [†672]. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore, they do wrong that mumble foolishly before God the canonical hours as if superstitiously chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13)…</p></blockquote>

<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>

<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>

</figure><figure class="quote" id="q-65b627bb18" data-kw="">
<blockquote><p>The seventh [day of creation] is the institution of the Sabbath on the seventh day of the world, on which day Christ was promised: and by the promise of Christ which was the greatest blessing given and revealed to the fathers in the old testament, that day came to be the most blessed day of the week, and was sanctified by God to be the weekly Sabbath, until by the full exhibition of Christ a perfect redeemer in his resurrection on the first day of the week, that first day became a more blessed day, and by Christ the Lord of the Sabbath, was sanctified, and had the honour of the weekly Sabbath transferred unto it, and is to be observed of Christians for their holy day of rest, until they come to the eternal rest in heaven.</p></blockquote>

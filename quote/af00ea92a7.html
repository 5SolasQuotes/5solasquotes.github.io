<main class="wrap"><figure class="quote" id="q-af00ea92a7" data-kw="">
<blockquote><p>Another very heinous sin amongst us, is Profanation of the Lord’s Day, and neglect of the Worship of God. How many are idling away their time at home, or which is worse, sinning it away in Tipling-houses, whilst they should be attending the Public Service of God? Or if they afford their bodily presence there for an hour or two, how soon after do they betake themselves to their pleasures, as if the rest of the day were their own? Or as if when they had prayed to God, to keep them that day without sin, they might boldly commit it? As if when they had begged of God, to teach them to keep (amongst the rest) the Fourth Commandment, they might then take Liberty to break it? And by their after-practice, one would judge their prayer had been, Lord have mercy upon us, and give us leave to break this thy Law.

Some go to their Drunken Companions, some to their Sports; others to walk idly in the streets or fields; and the most to their common, vain and worldly discourse: To any thing, rather than to private meditation, or Family-repetition of what they have heard. How far are men from spending this day, as beseems those who have Immortal Souls to care for, and can spare but little time on week-days for such employments? Oh how exceeding few are there that are willing rightly to inform themselves of the nature, use and end of this day, and accordingly to improve it?

As it is a day set apart to commemorate not only the work of Creation, but chiefly of Redemption by Christ our Lord, and especially his Resurrection, that being to him as a kind of rest from his Labours: And moreover, as it may be to us a Type and a Resemblance of the Eternal Sabbatism we shall enjoy in the Heavens: When we shall rest from all sinful, troublesome, and bodily works, and be wholly employed in the admiration, and praise of that Divine Love, which contrived and wrought our Redemption and Salvation. To have leave thus to spend a day with and for God, would be sufficient to engage holy and ingenious Souls, with all alacrity and thankfulness to embrace the opportunity.

Such would be ashamed to stand reasoning and enquiring whether they might not halve it with God, and rob him and themselves of a good part. What a strange tedious thing is it for poor Creatures, that know not God, nor their own necessities, to be obliged to consecrate One day in Seven to spiritual Services, for which, awakened and experienced Souls think their whole Life-time little enough? How many have we had crying, like those, Amos 8. 5. When will the New Moon be gone, and the Sabbath over? That they might again to their pleasures, or enjoyments! Nay, our People have been in more haste than so, they could not stay till the Sabbath was over, but must to their bargaining, their buying and selling. How frequent is this with many Shop-keepers in the City, when no necessity requires it? Well, if indeed you are so eagerly bent on your business, that you will not keep a Sabbath which God commands you, he’ll force you to another kind of Sabbath than this, which you shall have more reason to cry out, When will it be over?

You shall be made to rest from your works longer than this comes to, if you cannot afford God that small space of time he affords you: And you that were wont to be so weary of the Prayer and Sermon, and shift postures, first up, and then down, peeping at the Glass, or your Watch; Is it not equal that you should be held with those pains which shall make you weary for somewhat? when you shall turn from side to side, but get no ease, and count all the tedious hours of the night, expecting every moment to sink into that woeful state, where are no more days, or nights, or hours, where you shall never have a moments rest through a whole Eternity!

And then say whether the Service of God, or the Sufferings you feel from God, be the more tedious. If wicked wretches thus loosely encroach upon the Lord’s own day, may we not well fear lest God should depopulate our Land, that so at length it may enjoy its Sabbaths? And is it not just they should be seized with a disease, which admits not of a Minister to visit them, who in the time of life and health did so little care for their Minister? How many who have been shut up from all converse with men, were wont formerly to excommunicate themselves from the Public Congregation?

And if they would not stir over their Threshold to the Church, ’tis just they should not stir out at all. And may we not see many doors praying now, whose owners were not before wont to pray either in Public, or with their Families, on the Lord’s Day, or any other time? Nay, perhaps, might be deriders of all serious praying, and only use to take God’s Name in vain with their Formalities: Is it not just then, that those who were utterly unacquainted with, and it may be jeered at, praying by the Spirit, should be taught by the feeling of their flesh, to groan out an hearty Lord have mercy upon us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Solomon’s prescription for the removal of the pestilence, or, The discovery of the plague of our hearts, in order to the healing of that in our flesh</cite>, (London, 1665), pp 32-34.</span></figcaption>

— John Owen, Sermon I, (Carlisle: The Banner of Truth Trust, repr. 2009), 8:28.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+worship%2C+their+paintings%2C+crossings%2C+crucifixes%2C+bowings%2C+cringings%2C+altars%2C+tapers%2C+wafers%2C+organs%2C+anthems%2C+litany%2C+rails%2C+images%2C+copes%2C+vestments%2C%E2%80%94what+were+they+but+Roman+varnish%2C+an+Italian+dress+for+our+devotion%2C+to+draw+on+conformity+with+that+enemy+of+the+Lord+Jesus%3F+In+doctrine%2C+the+divinity+of+Episcopacy%2C+auricular+confession%2C+free-will%2C+predestination+on+faith%2C+yea%2C+works+foreseen%2C+%E2%80%9Climbus+patrum%2C%E2%80%9D+justification+by+works%2C+falling+from+grace%2C+authority+of+a+church%2C+which+none+knew+what+it+was%2C+canonical+obedience%2C+holiness+of+churches%2C+and+the+like+innumerable%2C%E2%80%94what+were+they+but+helps+to+Sancta+Clara%2C+to+make+all+our+articles+of+religion+speak+good+Roman+Catholic%3F+How+did+their+old+father+of+Rome+refresh+his+spirit%2C+to+see+such+chariots+as+those+provided+to+bring+England+again+unto+him%21+This+closing+with+Popery+was+the+sting+in+the+errors+of+those+days%2C+which+cause+pining%2C+if+not+death%2C+in+the+episcopal+pot.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Sermon+I%2C+%28Carlisle%3A+The+Banner+of+Truth+Trust%2C+repr.+2009%29%2C+8%3A28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d6d420903.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8d6d420903.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/11/john-owen-and-the-organ-among-other-things/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Objection 8. In respect of God, who is truth itself, we are to believe the promise in particular: yet if we respect our own unworthiness and indisposition, we are to fear and in some part to doubt. For the promise of remission of sins is not absolute, but depends upon the condition of our works. Therefore our certainty is only conjectural. Answer. I answer first that in respect of our own unworthiness, we are not to doubt of our salvation, but to be out of all doubt, yea to despair before the judgment seat of God. For they which are of the works of the law, are under the curse, (Gal. 3:10), and Paul saith of his own works of grace, “in this am I not justified” (1 Cor. 4:4). And David being out of all doubt of his own deserved damnation in regard of his own unworthiness saith freely, “Enter not into judgment with thy servant, O Lord, for no flesh shall be justified in thy sight” (Ps. 143:2). Again the consideration of any unworthiness in ourselves, doth not hinder a resolution considering God’s mercy in Christ. For true faith makes an entrance unto God with boldness, (I say with boldness) even for those persons that are unworthy in themselves, (Eph. 4:12). And Abraham (whose faith is to be followed of us) did not upon the consideration of his old decayed body, rest himself with bare hope upon a likelihood of the accomplishment of God’s promise, but he “believed under hope even against hope” (Rom. 4:18). Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture saith, it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith here must not be considered as a work, but as an instrument apprehending Christ with His benefits: and withal repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith, and the signs and documents thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, 8.73. (emphasis added)</span></figcaption>

</figure><figure class="quote" id="q-fd3f638bb2" data-kw="">
<blockquote><p>Not long since [during the times of Romanism] what a stir was there about the more than decent, even superstitious adorning of temples, and building of altars, and brave canopies, what sumptuous things and fine knacks had they, and all to set out a pompous superstitious way of worship? This altogether prevailed; as for the purity and simplicity of Gods ways and worship, how was it trampled under feet as an unworthy contemptible thing? But these things that for a while seemed so glorious, begin to vanish, and we hope ere long will come to nothing, the very memory of them shall perish, the purity of God’s worship, and the simplicity of the Gospel in God’s ordinances shall recover their beauty and glory when those braveries shall be no more.</p></blockquote>

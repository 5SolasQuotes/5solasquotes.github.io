<blockquote><p>It must suffice, in this Essay, to indicate briefly the effect of this apprehension of the privilege of the Christian, as the forgiven and justified child of God, upon his relation to the ordinances of the Gospel, and to the ministry of the Church. While this doctrine was obscured, the inevitable tendency was to regard those ordinances as acts, or sacrifices, on our part, by which men hoped to procure the forgiveness or grace of which they felt the need. They were of the nature of works, by which that grace was won or merited.

But from the point of view of the Reformed doctrine, they appeared rather as the manifestations and channels of God’s gifts and graces to His redeemed and justified children. Instead of losing in importance, they became still more precious, because we could approach them, submit ourselves to them, and use them, in full assurance of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-wace.html">Henry Wace</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Principles of Protestantism in Church and Faith: Being Essays on the Teaching of the Church of England</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>Proposition 2. The faith which Paul speaks of is not the same with that which James speaks of. What kind of faith that is which Paul speaks of appears by the description which he himself gives us of it, Gal. 5. He is there speaking of justification, verse 4, and of the righteousness of faith, verse 5. And then tells us what kind of faith it is, verse 6, a faith working by love, a faith which shows itself to be a living faith by the fruit it brings forth… Faith is never opposed in Scripture to Gospel-works; because it is inclusive of ’em, and they can’t be divided, but always go together. This is faith in Paul’s sense: the tree with it’s fruit hanging on it: a living, working, fruit-bearing faith. But now the faith that James speaks of [in ch. 2], is such a faith as is alone, verse 17, without works, verse 20, and therefore is dead, verse 17. … Proposition 4. They both speak of the same justification. This is undeniably evident, because they both produce the same Scripture for the proof of their distinct positions, or assertions. James proves that Abram was justified by works because by his offering up Isaac, that Scripture was fulfilled which says, ‘Abram believed God, and it was counted to him for righteousness,’ verse 23. And Paul proves that Abram was justified by faith, and not by works, because the Scripture saith, Abram believed God, and it was counted to him for righteousness, Rom. 4:2-3… But the same Scripture proves that Abram was justified both by faith and by works; and therefore faith, and such works as are the fruit of faith are all one in Scripture-account. They are materially the same, though there may be some formal difference between ’em. And therefore, to be justified by faith, according to Paul, and by works according to James, are all one… (2) This justification he [James] speaks of was before God: For he produces that passage of Scripture for the proof of what he asserts, which all acknowledge does refer to a man’s justification before God, viz. that Abraham believed God, and it was counted to him for righteousness, verse 23. … (1) ‘Tis only the Works of the Law, that the apostle Paul opposes and rejects in this point of justification. This has been fully proved already, ch. 9, §2. (2) The Hebrew Word [Hebrew] signifies to be righteous, as well as to justify, as was showed at first setting out. (3) To justify is to account righteous, and treat as such. (4) The Scripture does expresly define being righteous by doing righteousness, and that with a special remark and observable caution prefixed, 1 Jn. 3:7, ‘Little children, let no man deceive you: He that does righteousness is righteous, even as He is righteous.’… (5) Abraham’s obedience, and Phineas’s zeal, were reckoned to them for righteousness, Jm. 2:21, 23; Ps. 106:31, and Abel by his sacrifice obtained witness that he was righteous, Heb. 11:4… (6) Whatsoever is required to pardon is required to justification; for though the formal, precise notion of justification does not consist in pardon, yet pardon is included in it taken largely, as being the inseparable adjunct and undivided companion thereof (as has been showed, ch. 4, §5). But repentance, confession, forgiveness of others, and the like, are required to pardon… (7) The Scripture frequently uses the Word [Faith] in a large Sense, so as to comprehend Obedience too, as was show’d, ch. 11. §. 2. (8) We are expresly said, to be justified by Works. To all which I add by way of Antidote. §5. (9) The admitting of gospel-works or holiness to have an interest in justification, and to be an ingredient thereof, is not inconsistent with, nor derogatory to free-grace… (10) And lastly, this doctrine has no bad influence upon practice, but is less subject to abuse in this respect than the other… … §9… I shall extract the spirits and quintessence of all in the following description of justification with the Scriptures, that proves every part of it: Justification is an act (Rom. 8:33) of God’s (Rom. 3:24) free-grace, whereby for the sake of Christ (1 Cor. 6:11), that is, for the merit of his obedience (Rom. 5:19), or, upon consideration of Christ’s righteousness (Rom. 5:18), or his blood (Rom. 5:9), that is, his suffering the punishment (Isa. 53:11) due to us for our sins, He at present counts (Rom. 4:3) righteous all true believers (Acts 13:39; Rom. 5:1), who are endued with living (Jm. 2:20), working faith (Gal. 5:6; Jm. 2:24), and deals with ’em as such, by discharging (Gal. 3:13) ’em from the curse of the Law, and eternal condemnation (Rom. 5:9; 8:33-34) (which is pardon in the most proper and famous sense) and bestowing upon ’em those privileges and benefits which belong to righteous persons, viz. reconciliation (Rom. 5:1), and adoption (Tit. 3:7), and then at last will solemnly declare and pronounce (Rom. 5:18) ’em righteous at the Day of Judgment, and bestow upon ’em eternal life (Acts 3:19; Mt. 12:36-37).</p></blockquote>

<blockquote><p>If the inheritance of life eternal be by the law, it is no more by the promise. But it is by the promise because God gave it unto Abraham freely by promise. Therefore it comes not by the law. The opposition between the law and the promise shows that Paul in this epistle speaks not only of the ceremonial, but also of the moral. For the greatest opposition is between the moral law and the free promise of God….For if life come by the law, it comes not by the promise,” says Paul. And, ‘If they which are of the law are heirs, the promise is of none effect’ (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If the inheritance of life eternal be by the law, it is no more by the promise. But it is by the promise because God gave it unto Abraham freely by promise. Therefore it comes not by the law. The opposition between the law and the promise shows that Paul in this epistle speaks not only of the ceremonial, but also of the moral. For the greatest opposition is between the moral law and the free promise of God….For if life come by the law, it comes not by the promise,” says Paul. And, ‘If they which are of the law are heirs, the promise is of none effect’ (Rom. 4:14). By this we see the Church of Rome overturns and abrogates the free promise of God. For they of that church teach that the first justification is by mere mercy. And that the second is by the works of the law. But the law and the promise cannot be mixed together, more than fire and water. The law joined with the free promise disannuls the said promise.”

<blockquote><p>William H. Goold, the editor of John Owen’s works, wrote the following concerning the battles waged by Augustine of Hippo and Gottschalk of Orbais on behalf of sovereign grace during the Patristic and medieval eras. Obviously, we would not stand over every historical judgement that he makes in this extract:

The relation of man to his Creator has engaged the attention of earnest and thoughtful minds, from the days of the patriarch of Uz to the most recent controversies of modern times. The entrance of sin into the world has vastly complicated this relationship; so that, considered in its various bearings, it involves some of the most difficult problems with which the human intellect has ever attempted to grapple. The extent to which the intellect itself has been weakened and beclouded by the corruption of our nature, renders us the less able to penetrate into the deep mysteries of human duty and destiny.

Whether man sins now as essentially affected with the taint of the first sin, and involved in the responsibilities of the first sinner, or sins wholly on his own account and by his own free act, under the bias of no connection with Adam, except what connection obtains between example on the one hand and imitation on the other? whether, on the supposition of a scheme of saving grace, grace is simply divine and external aid to the will of man, already operating freely in the direction of what is good, and so establishing a meritorious claim upon God for the bestowal of such aid, or a supernatural influence creating in man the very liberty itself to will and to do what is good? and whether, in the latter view of divine grace, as bestowed in divine sovereignty, and therefore according to a divine purpose, it can be reconciled with human responsibility? — are the questions which produced the sharp encounter of keen and conflicting wits between Pelagius and Augustine of old.

Towards the middle of the ninth century, these questions again assumed distinctive prominence in the history of theological speculation. Gottschalc, a monk of Orbais, distinguished himself by his advocacy of the doctrines of Augustine. It was the doctrine of predestination chiefly on which he insisted; and the controversy in his hands assumed this peculiar modification, that not merely the application of gracious influence, but the reference of the atonement, was exhibited as under the limit and regulation of the divine sovereignty and purpose. Not that in this respect he was at variance with Augustine, but the point seems to have been specially and formally mooted in the discussions of this age.

His view of predestination embraced an element which may be reckoned an advance on the Augustinian doctrine; for according to him, predestination was twofold, comprehending the punishment of the reprobate as well as the salvation of the elect; but while he held the predestination of men to the punishment of their sin, he was far from holding, as his opponents alleged, that they were predestinated to the commission of sin. Council warred with council in the case of Gottschalc. Gottschalc himself expiated by a death in prison his audacious anticipation of the rights of private judgment and free inquiry in a dark age.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-h-goold.html">William H. Goold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory note to John Owen, ΘΕΟΜΑΧΙΑ ΑΥΤΕΞΟΥΣΙΑΣΤΙΚΗ</cite></span></figcaption>

<blockquote><p>Why then does James say that it was fulfilled? Even because he intended to shew what sort of faith that was which justified Abraham; that is, that it was not idle or evanescent, but rendered him obedient to God, as also we find in Heb 11:8. The conclusion, which is immediately added, as it depends on this, has no other meaning. Man is not justified by faith alone, that is, by a bare and empty knowledge of God; he is justified by works, that is, his righteousness is known and proved by its fruits.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f59ec2f5be" data-kw="">
<blockquote><p>…nor does the [Westminster] Directory [for the Public Worship of God] anywhere forbid the administering of the Communion unto those that are sick in private houses; though if it had so done, it might have justified itself by the example of many of the best Reformed Churches. Let Mr. [John] Durel when he is at leisure, enquire whether one of the Assembly of divines did not administer the sacrament to captain Hotham when he was just going to be beheaded? or whether he was ever censured for so doing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus Vapulans [A Bull being Whipped], or, Some Castigations given to Mr. John Durel for Fouling Himself &amp; Others in his English &amp; Latin Book, by a Country Scholar (London, 1672), pp. 60-61 Hickman was an English puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“…nor does the [Westminster] Directory [for the Public Worship of God] anywhere forbid the administering of the Communion unto those that are sick in private houses; though if it had so done, it might have justified itself by the example of many of the best Reformed Churches. Let Mr. [John] Durel when he is at leisure, enquire whether one of the Assembly of divines did not administer the sacrament to captain Hotham when he was just going to be beheaded? or whether he was ever censured for so doing?”

— Henry Hickman, Bonasus Vapulans [A Bull being Whipped], or, Some Castigations given to Mr. John Durel for Fouling Himself &amp; Others in his English &amp; Latin Book, by a Country Scholar (London, 1672), pp. 60-61 Hickman was an English puritan.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6nor+does+the+%5BWestminster%5D+Directory+%5Bfor+the+Public+Worship+of+God%5D+anywhere+forbid+the+administering+of+the+Communion+unto+those+that+are+sick+in+private+houses%3B+though+if+it+had+so+done%2C+it+might+have+justified+itself+by+the+example+of+many+of+the+best+Reformed+Churches.+Let+Mr.+%5BJohn%5D+Durel+when+he+is+at+leisure%2C+enquire+whether+one+of+the+Assembly+of+divines+did+not+administer+the+sacrament+to+captain+Hotham+when+he+was+just+going+to+be+beheaded%3F+or+whether+he+was+ever+censured+for+so+doing%3F%E2%80%9D%0A%0A%E2%80%94+Henry+Hickman%2C+Bonasus+Vapulans+%5BA+Bull+being+Whipped%5D%2C+or%2C+Some+Castigations+given+to+Mr.+John+Durel+for+Fouling+Himself+%26+Others+in+his+English+%26+Latin+Book%2C+by+a+Country+Scholar+%28London%2C+1672%29%2C+pp.+60-61+Hickman+was+an+English+puritan.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff59ec2f5be.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f59ec2f5be.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments/whether-the-sacraments-may-be-administered-privately-or-with-only-several-christians/#:~:text=nor%20does%20the%20%5BWestminster%5D%20Directory%20%5Bfor,was%20ever%20censured%20for%20so%20doing&amp;text=nor%20does%20the%20%5BWestminster%5D%20Directory%20%5Bfor%20the%20Public&amp;text=whether%20he%20was%20ever%20censured%20for%20so%20doing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af723c8aa3" data-kw="">
<blockquote><p>10. On the 6th Article of the 11th Chapter [of The Discipline of the Reformed Chuches of France, 1559], a question was propounded by the Province of Higher Languedoc, Whether in case of grievous sickness, and the child being in apparent danger of death, he might be baptized on lecture-days, before sermon began, and whether baptism might be administred at such times when as there is no sermon preached, but only public common-prayers? It was answered that if the consistory, or any of the elders did attest the malady of the infant, the pastor might do it [the baptism]. And if the observation of this article should beget new difficulties, the provinces were intreated to come prepared unto the next national synod, for their assoiling of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/qualifications.html">Qualifications</a></span><span class="wk"><span class="lbl">Work:</span> <cite>French Reformed Churches | John Quick, Synodicon (London, 1692) | Synod of St. Maixant (1609), ch. 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>
<div class="actions"><button class="copy" data-copy="“10. On the 6th Article of the 11th Chapter [of The Discipline of the Reformed Chuches of France, 1559], a question was propounded by the Province of Higher Languedoc, Whether in case of grievous sickness, and the child being in apparent danger of death, he might be baptized on lecture-days, before sermon began, and whether baptism might be administred at such times when as there is no sermon preached, but only public common-prayers? It was answered that if the consistory, or any of the elders did attest the malady of the infant, the pastor might do it [the baptism]. And if the observation of this article should beget new difficulties, the provinces were intreated to come prepared unto the next national synod, for their assoiling of them.”

</figure><figure class="quote" id="q-997e1d62c0" data-kw="">
<blockquote><p>Can these men [dissenters]… prove in this sense we maintain a private Communion? These terms were never known to fit our church doctrine, till those first moniters and the heirs of their scruples… The Gentle Admonition [to the Parliament, 1572, by Cartwright and the presbyterians] that was the first bate for this idle debate, then rawly entered, since over hotly followed (but vainly, and unfruitfully God He knows, and we deplore) makes this an occasion of their lamentable separation. Ye should first prove (say they) that the private communion is agreable to the Word of God. And is it not reason they should first prove that we enjoin a private communion, before they enjoin us to prove what they now reprove?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cotton.html">William Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 10, ‘Private Communion’ in The Second &amp; Last Part of the Answer to the Reasons for Refusal of Subscription, pp. 65-78 in Reasons for Refusal of Subscription to the Book of Common Prayer under the hands of certain Ministers of Devon and Cornwall... as they were exhibited by them to the Right Reverend Father in God William Coton… with an Answer... (London, 1605)</cite>, p. 66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-d9a4793fdf" data-kw="">
<blockquote><p>In what place is (the H. Supper) to be administered? In public assembly, not to individuals privately or to those ill in bed at home or about to die without the congregation of the faithful and their participation. Communication should be ecclesiastical and public, not an idion deipnon [a private supper]. And the Supper is a symbol of the communion of saints…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

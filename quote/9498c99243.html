<blockquote><p>Q. Have men only benefit by this union of the two natures [of Christ], or doth it reach also to the Angels?

A. It seemeth to reach no further then to man; for God never meant to save those angels that fell, seeing they fell maliciously into rebellion against God, without tentation, contrary to the clear light of nature revealed in their Creation. And if he had purposed either to save them, or to have benefited the elect Angels, any otherwise then by confirming them, he would have taken their nature upon him.

Q. But why then is it said, that God (by Christ) doth reconcile all things unto himself, whether in earth, or heaven? Coloss. 1. 20.

A. By things in heaven, is there to be understood, not the Angels, but the Saints then in heaven. For although God did elect the Angels to eternal glory; yet Christ did not redeem them, but only the seed of Abraham.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), p. 174.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e65dcbe9df" data-kw="">
<blockquote><p>When writing privately to his English friend, William Wilberforce, Thomas Chalmers explained how the majority of evangelical ministers within the Church of Scotland now diverged from the views of the Covenanters against the toleration of popery and were now advocating that Romanists be admitted to parliament (so-called Catholic Emancipation):

I promised to write you on a subject the interest of which has for the time gone by. I have based with a most approving eye to the part you take respecting the Catholics of Ireland and I simply wanted to let you know, that the evangelical party in our Church are fast hastening towards the same enlightened spirit of Christian and liberal policy in regard to them.

There are still a few extremely old clergymen amongst us who have not yet got the better, and never will of the sore recollections of their Covenanting forefathers. But with the exception of them and of some others who take the opposite side of the question from political motives, I do think that the Church of Scotland would like the removal of the existing disabilities. What a piece of kingly munificence would it have been, had his majesty been enabled to carry the deed of emancipation to Ireland along with him. ….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Wilberforce, 25 June 1821 (David M. Rubenstein Rare Book &amp; Manuscript Library, Duke University, Durham NC, William Wilberforce Letters, RL.01381).</cite></span></figcaption>

<blockquote><p>These objects which Christ hath to work upon, are either rational creatures, or such as are void of the principles of reason. The former are Angels or men. The Angels which are holy He preserveth in that state of subjection to Himself wherein they continued when the rest left their habitation, upholding them not only in their beings, but in the integrity and perfection of their beings, whose perfection is their voluntary subordination to the Son of God, Christ Jesus, who is the Head of all principality and power: and so they are ministering Spirits unto Him, employed as a Convoy to his people in the wilderness of the world, until they arrive at that eternal rest which he hath purchased for them.

As for the apostate angels, by an act of justice and power, He cast them down into everlasting chains under darkness, where he holdeth them prisoners until the great Assize, the judgement of the last day. And though for the present He is not pleased to keep them close prisoners, but seemeth to give them the liberty of the prison, and sometime to lengthen their chains, suffering them to range abroad for the executing of his judgements in divers kinds upon the wicked, and for the exercise and trial of the godly (out of all which He getteth glory to His great Name) yet still He keepeth them chained; that is, under the restraint of His Almighty Arm, not permitting them to stir an inch beyond the bounds which He hath set them: as themselves intimated when they begged leave of Him to enter into the herd of swine, and when Satan petitioned the Lord for a Commission to plunder holy Job, and then to have it enlarged for afflicting of his person; when the Lord gave him greatest liberty, it was with limitation: But save his life.

So that the devils now are Christ His prisoners, and should not be suffered to walk up and down the world, had He not use of them for such ends as those, formerly hinted. However they stir not one foot without their keeper, viz. the over-ruling power of Christ. But at the last day they shall be fully and for ever subdued by the almighty power of Christ, never to stir more against any of His. Yea these apostate angels shall be so absolutely brought under by Christ, that His very servants shall sit in judgement upon them. I am persuaded it will be a wonderful torment to these proud spirits (who have affected a principality, yea a godhead in the world) to be convented before men as their judges, who were their inferiors by Creation, and are of the seed of that woman, who was long since vanquished by the devil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maynard.html">John Maynard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A shadow of the victory of Christ, represented to the Honourable House of Commons, in a sermon preached at Margaret’s Westminster on the day of the publick fast, Octob. 28. 1646</cite>, (London: Samuel Gellibrand, 1646), pp 4-5.</span></figcaption>

</figure><figure class="quote" id="q-13cf881006" data-kw="">
<blockquote><p>Angels are spiritual substances created by God after his own image, and ordained to sing glory to God on high, and to be ministers upon earth, of the church or of the heirs of everlasting salvation. … By these descriptions and the testimonies cited in the text of the Epistle, seven differences may be gathered.

1 Christ is verily and by nature the son of God, begotten of the substance of the eternal father. Psal. 2. This day have I begotten thee. 2. Reg. 7. I will be a father to him, and he shall be a son to me. The Angels are not verily and by nature the sons of God, but only by adoption or grace. Ergo Christ far excelleth all the Angels.

2 Invocation is an honour to be attributed only to God the searcher of hearts, according to this saying: Thou shalt worship the Lord thy God; and in general, whosoever is worshipped, is better than he that worshippeth: But God commandeth that Christ shall be called upon, yea even of the Angels: Ps. 96. Worship ye him all ye Angels of God. Ergo Christ is both God, and also far more excellent than all the Angels.

3 Christ is the maker of heaven and earth. Psa. 101. Thou O Lord hast founded the earth from the beginning. Angels are substances created, as Psal. 103. is said: which makest thine Angels spirits, and thy ministers a flame of fire, that is to say, clear substances, which in sheerness, force, nimbleness, and swiftness, are like to fire.

4 Christ is an everlasting king, bearing a rightful scepter, and justifying all that flee unto him. Psa. 45. Thy throne O God endureth for ever and ever, the scepter of righteousness is the scepter of thy kingdom. But the Angels are but only the servants of this king, and impart not their righteousness unto any others.

5 Christ is verily and naturally the son of God. Ps. 45. O God (Christ,) thy God (the eternal father,) hath anointed thee with the oil of gladness for thy fellows’ sakes. Now the Angels are not God, but creatures.

6 Christ is anointed with fulness of the holy Ghost, to the intent he may anoint his fellows, that is to say, the rest of the members of the church. The Angels are not anointed with fulness of the holy Ghost, neither can they of their own power anoint others and garnish them with the gifts of the holy Ghost.

7 Christ sitteth at the right hand of the eternal Father, that is to say, reigneth in equal majesty and glory with the everlasting father. The Angels sit not at the right hand of the Father, nor reign in equal power with the eternal father: but are the ministers of Christ and of the whole church, pitching their tents round about all those that fear him …</p></blockquote>

ter+of+thy+kingdom.+But+the+Angels+are+but+only+the+servants+of+this+king%2C+and+impart+not+their+righteousness+unto+any+others.%0A%0A5+Christ+is+verily+and+naturally+the+son+of+God.+Ps.+45.+O+God+%28Christ%2C%29+thy+God+%28the+eternal+father%2C%29+hath+anointed+thee+with+the+oil+of+gladness+for+thy+fellows%E2%80%99+sakes.+Now+the+Angels+are+not+God%2C+but+creatures.%0A%0A6+Christ+is+anointed+with+fulness+of+the+holy+Ghost%2C+to+the+intent+he+may+anoint+his+fellows%2C+that+is+to+say%2C+the+rest+of+the+members+of+the+church.+The+Angels+are+not+anointed+with+fulness+of+the+holy+Ghost%2C+neither+can+they+of+their+own+power+anoint+others+and+garnish+them+with+the+gifts+of+the+holy+Ghost.%0A%0A7+Christ+sitteth+at+the+right+hand+of+the+eternal+Father%2C+that+is+to+say%2C+reigneth+in+equal+majesty+and+glory+with+the+everlasting+father.+The+Angels+sit+not+at+the+right+hand+of+the+Father%2C+nor+reign+in+equal+power+with+the+eternal+father%3A+but+are+the+ministers+of+Christ+and+of+the+whole+church%2C+pitching+their+tents+round+about+all+those+that+fear+him+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+David+Chytr%C3%A4us%2C+A+postil+or+orderly+disposing+of+certain+epistles+usually+red+in+the+Church+of+God%2C+upon+the+Sundays+and+holy+days+throughout+the+whole+year%2C%2C+trans.+Arthur+Golding+%28London%3A+Lucas+Harrison+and+George+Bishop%2C+1570%29%2C+pp+12-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F13cf881006.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/13cf881006.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/03/20/david-chytraus-on-seven-differences-between-christ-and-the-angels/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>5. Duration XVII. Fifth, the duration of their existing, and its measure, through which they are not under time, by which such things are measured which by their nature admit of a beginning and end; nor under eternity, which belongs only to him who by nature can experience neither beginning nor end; but under aevum, ‘forever,’20 by which those things are measured which include a beginning by nature, but exclude an end. This aevum is congruent with time, tempus, in this, that not only does it imply a beginning of duration, but also flux or succession; this aevum is congruent with eternity in that it excludes an end of its duration. It differs from time in that it excludes an end, and from eternity in that it includes a beginning and flux. 23 The three measures of duration are tempus, aeternitas, and aevum, also called “aeviternity” or “improper eternity.” Cf. 1.2.11 §VIII.</p></blockquote>

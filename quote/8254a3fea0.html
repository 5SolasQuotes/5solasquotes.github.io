<blockquote><p>Justification in order goeth before sanctification…Sanctification presupposeth justification: they who are sanctified may rest upon it, that they are cleansed and justified. For sanctification is a fruit of justification…Admirable is the comfort, which the Saints in this world reap hereby. For their sanctification being imperfect, and the flesh abiding in them, and lusting against the spirit: yea sin being present with them when they would do good, they are oft forced to complain and cry, O wretched man that we are: who shall deliver us from this body of death(Rom 7:24)? If they had no other ground to fasten the anchor of their hope upon but their sanctification, it could not hold them fast enough against the tempest of Satan’s temptations. But in that their sanctification is a fruit and evidence of their justification, they take heart to themselves, and thank God that with the mind they themselves serve the Law of God, though with the flesh the Law of sin. And thus upheld and comforted, they continue to strive against sin, till it be clean rooted out of them, as well as remitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Treatise: The Scriptural Basis for Domestical Duties, in Of Domestical Duties</cite>, (1622), 28.</span></figcaption>

<blockquote><p>How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence… Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to Him for righteousness and through him obtains the right to eternal life. First, it is distinguished from the works of the law (which could not be done if it were taken absolutely because thus it is a work of the law)… Therefore it [being a condition] cannot be ascribed to faith materially (inasmuch as it is a work), but instrumentally (inasmuch as it is the hand apprehending).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 3, ‘Is the covenant of grace conditional and what are its conditions?’ in Institutes of Elenctic Theology, ed. James Dennison Jr., trans. George Giger, 3 vols. (P&amp;R, 1992–1997), vol. 2, pp. 184–89</span></figcaption>

<blockquote><p>…a man may be said to be justified either intentionally, or virtually, or actually; either in God, or in Christ, or in himself.

1. Intentionally in God in God’s purpose and decree: This is from all eternity, but this decree and intention does not put anything into a state of actual being, but in the fulness of time.

2. Virtually in Christ: And this is from the day of Christ’s passion, and in the virtue of his satisfaction; yet this intends no more but that satisfaction is made and remission purchased by the blood of Christ.

3. Actually in himself: When a man has the possession of justification, immediately after his union with the Lord Jesus Christ. Now this justification considered as it is a state of favor, a covenant state with God, which a man at his first believing is put into, is not reiterated, no more than a wife, after that first entrance into the relation, is frequently made a wife; yet the particular acts of pardon, and imputation of Christ’s righteousness, are continually by God communicated unto the believer. In this respect this actual justification (or particular acts of pardon) has its degrees of progression: The beginning thereof is laid in our first union and incorporation into Christ; the consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission: Between both these, there is a progressive work of justification, by the constant actings of the Spirit, applying the blood of Christ by the hand of faith, to the quiet and comfort of the soul: The first we may term initial justification, the second progressive, the last perfective; the second is the fruit of the first, and the preludial assurance of the last: The first is wrought and sealed in the first sacrament, the second is wrought and sealed in the second sacrament; and both these branches of sacramental justification, are to us the pre-assurance of that complemental and perfective justification, the sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession. It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Media: the Middle Things</cite>, … (London: Field, 1649), ch. 1, 2. ‘First Privilege: Justification’, pp. 2-3 Bedford and Ambrose were sharing some notes one way or the other.</span></figcaption>

the+second+progressive%2C+the+last+perfective%3B+the+second+is+the+fruit+of+the+first%2C+and+the+preludial+assurance+of+the+last%3A+The+first+is+wrought+and+sealed+in+the+first+sacrament%2C+the+second+is+wrought+and+sealed+in+the+second+sacrament%3B+and+both+these+branches+of+sacramental+justification%2C+are+to+us+the+pre-assurance+of+that+complemental+and+perfective+justification%2C+the+sentence+whereof+puts+an+end+to+all+fears%2C+changing+our+faith+and+hope+into+fruition+and+full+possession.+It+has+been+commonly+said+by+some+of+our+best+divines+that+justification+is+transacted+in+our+first+union+and+incorporation+into+Christ%3B+at+which+time+it+is+conceived+that+the+pardon+of+all+sin+is+sealed+to+the+believer+at+once.+But+I+fear+the+misunderstanding+of+this+point+%28not+untrue+in+itself%2C+if+not+mistaken+and+misapprehended%29+has+laid+the+ground+upon+which+some+build+that+unhappy+structure+which+turns+the+grace+of+God+into+wantonness%3A+who+knows+not+that+justification+in+the+proper+acceptation+of+the+word%2C+according+to+the+Scripture+phrase%2C+is+the+act+of+a+judge+pronouncing+a+judicial+sentence%2C+wherein+he+absolves+the+person+of+the+sinner+from+all+sin+and+punishment+due+to+him+for+sin%2C+and+that+for+the+alone+righteousness+of+the+surety+Christ+freely+imputed%2C+and+by+faith+received+of+him.+And+according+to+this%2C+I+suppose+we+shall+not+err+from+the+truth%2C+if+we+say%3A+1.+That+the+main+work+of+justification%2C+is+even+as+yet+to+us+future%2C+viz.+at+the+great+and+last+day+of+Judgment%2C+when+we+shall+receive+a+final+quietus+est%2C+and+discharge%2C+and+when+God+shall+wipe+away+all+tears+from+our+eyes%3A+And+yet+2.+That+in+our+first+union+with+Christ+there+is+a+work+of+justification%2C+viz.+actual+imputation+of+Christ%E2%80%99s+righteousness%2C+and+actual+remission+of+what+sin+for+the+present+the+soul+stands+guilty+of%2C+at+that+time+when+it+is+first+united+to+Christ.+I+dare+not+say+that+justification%2C+quatenus+%5Bso+far+as%5D+it+comprehends+imputation+and+remission+of+sin%2C+is+one+individual+act%3B+or+that+all+sins%2C+past%2C+present+and+to+come+are+remitted+to+the+believer+at+once%3B+but+this+I+say%2C+that+in+our+first+union%2C+all+our+sins+past+and+present+are+actually+pardoned%3B+and+this+favor+received+is+a+pledge+of+assurance+that+in+future+also%2C+by+applying+ourselves+to+Christ%2C+we+may+and+shall+receive+the+forgiveness+of+our+daily+sins%2C+and+that+at+the+Last+Day+we+shall+at+once+be+absolved+from+all+accusations+and+charges+laid+in+against+us%3B+and+that+justification+%28besides+those+particular+acts+of+pardon%2C+and+imputation+of+Christ%E2%80%99s+righteousness%29+does+connote+a+state+that+the+subject+at+his+first+believing+is+put+into%2C+viz.+a+state+of+grace%2C+and+favor%2C+and+reconciliation+with+God+for+the+imputed+righteousness+of+Christ%2C+without+apostasy+from+it%2C+either+total+or+final.%E2%80%9D%0A%0A%E2%80%94+Isaac+Ambrose%2C+Media%3A+the+Middle+Things%2C+%E2%80%A6+%28London%3A+Field%2C+1649%29%2C+ch.+1%2C+2.+%E2%80%98First+Privilege%3A+Justification%E2%80%99%2C+pp.+2-3+Bedford+and+Ambrose+were+sharing+some+notes+one+way+or+the+other.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ccdcde87d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ccdcde87d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=a%20man%20may%20be%20said%20to,from%20it%2C%20either%20total%20or%20final&amp;text=a%20man%20may%20be%20said%20to%20be%20justified&amp;text=without%20apostasy%20from%20it%2C%20either%20total%20or%20final" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Ethics and theology clearly distinguish two kinds of merit: Condign merit or merit in the strict sense of the word (meritum adœquatum sive de condigno), and congruous or quasi-merit (meritum inadœquatum sive de congruo). Condign merit supposes an equality between service and return; it is measured by commutative justice (justitia commutativa), and thus gives a real claim to a reward. Congruous merit, owing to its inadequacy and the lack of intrinsic proportion between the service and the recompense, claims a reward only on the ground of equity.</p></blockquote>

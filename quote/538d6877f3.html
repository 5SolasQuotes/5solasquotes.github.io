<main class="wrap"><figure class="quote" id="q-538d6877f3" data-kw="">
<blockquote><p>WHAT ought you to believe concerning the Scriptures, the fountain of all Divine knowledge.

A. That the whole Scriptures were given by the inspiration of God, and so are the very word of God.

Proofs.

2 Tim. 3. 16. All Scripture is given by inspiration of God, &amp;c.

2 Pet. 1. 21. For the Prophecy came not in old time, by the will of man, but holy Men of God, spake as they were moved by the holy Ghost.

Q. What else?

A. That they are perfect every way sufficient of themselves, to direct us in all things needful to holiness or salvation.

Proofs.

Psal. 19. 7. The Law of the Lord is perfect, &amp;c.

2 Tim. 3. 16. 17. And is profitable for doctrine, for reproof, &amp;c. That the man of God may be perfect, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The principal grounds of Christian religion. Briefly and plainly propounded by way of question and answer for the instructing of the younger sort</cite>, (London: Ralph Rounthwaite, 1625), pp 1-2.</span></figcaption>

<blockquote><p>For when some have taken up a private interpretation of any place of Scripture, if, before they have thoroughly imbibed and vented it, they do not submit their conception, although they seem to be greatly satisfied in it and full of it, unto the authority of the Scripture in the declaration of its own mind in other places, there is but small hope of their recovery. And this is that pride which is the source and original of heresy, -- namely, when men will prefer their seemingly wise and rational conceptions of the sense of particular places before the analogy of faith.</p></blockquote>

</figure><figure class="quote" id="q-6b39c2095a" data-kw="">
<blockquote><p>Therefore no other writings of men, although never so holy, no custom, no multitude, no antiquity, nor prescription of times, nor personal succession, nor any councils; and, to conclude, no decrees or ordinances of men, are to be matched or compared with these divine Scriptures, and this bare truth of God; for so much as God&#x27;s truth excelleth all things. For all men of their own nature are liars, and lighter than vanity itself.</p></blockquote>

</figure><figure class="quote" id="q-f06f0da33b" data-kw="hebrew greek">
<blockquote><p>The following arguments prove that the sources have not been corrupted. (1) The providence of God which could not permit books which it willed to be written by inspiration (theopneustois) for the salvation of men (and to continue unto the end of the world that they might draw from them waters of salvation) to become so corrupted as to render them unfit for this purpose. And since new revelations are not to be expected (after God has recorded in the Scriptures his entire will concerning the doctrine of salvation), what can be more derogatory to God (who has promised his constant presence with the church) than to assert that he has permitted the books containing this doctrine to become so corrupt that they cannot serve as a canon of faith? (2) The fidelity of the Christian church and unceasing labor in preserving the manuscripts; for since Christians have always labored with great zeal to keep this sacred deposit uncorrupted, it is not credible that they would either corrupt it themselves or suffer it to be corrupted by others. (3) The religion of the Jews who have bestowed upon the sacred manuscripts great care and labor amounting even to superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.10</span></figcaption>

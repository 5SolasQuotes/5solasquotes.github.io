<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>TO WHAT USE BAPTISM WAS USED.

First, to be a sure seal and an evident testimony unto us that God the Father for his Son Jesus Christ’s sake hath freely forgiven us all our sins, received us into his favour, and given us the Holy Ghost; by whom we are born anew, not of mortal, but of immortal seed; by whom also we are made the sons and heirs of God, and through faith reckoned pure and holy in his godly sight. …

Secondly, to put us in remembrance that, forasmuch as we are become the soldiers of Christ, we ought, so long as we live, valiantly to fight against the devil, the world, and the flesh, to mortify all unclean lusts, to die unto sin, and to rise again new men, bearing the image of Christ, and fashioning our conversation and manners after his example, that we may learn the Lord our God in such holiness and righteousness as is allowed before him all the days of our life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), p. 508.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-75f7428879" data-kw="">
<blockquote><p>SIMO[N].

Thou hast not yet told why the ancient fathers did baptise them again, that had been baptized by heretics.

JOIADA.

They were not baptized again, but they were baptized as they that had not been baptized. For heretics did deny the trinity, the god head of Christ, and the holy ghost. Besides that, they were not of the church: Ergo, they had no baptism, nor did baptise in the name of Jesus, whom they did deny.

Moreover, the custom of rebaptising, or baptizing again, was not commonly used in the church. For they that had been baptized in the name of the father, of the son, and of the holy ghost, were not baptized again, but were received by the imposition of hands, and also were admonished to persist and abide in the sincerity of faith. This therefore helpeth you nothing, but rather doth make against you. Among the true Christians, ye have no example at all of your rebaptization, but among these ancient heretics, that have been already condemned of the church. For ye do renew the heresies of Aupentius, Novatius &amp; Pelagius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>Q. How do you prove that Infants are to be baptized?

A. There is the same use of Baptism under the Gospel, that was of Circumcision under the Law; and the Infants of Christians are under the Covenant as well as theirs; and Baptism is a sign of the Covenant, as well as Circumcision: if therefore Infants were circumcised, and Baptism possess the room of Circumcision, except there can be shewed a special prohibition or restraint in God’s word, it will follow that Infants also may be baptized.

Further, the Apostles are said to baptize whole families, amongst which it is ordinary, that there be some children, and there is no reason to limit the words to them that are at years. And this use hath continued in the Church since the Apostles times, and was never gainsaid by any but those, that by the universal Church, have been judged heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), p. 223.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

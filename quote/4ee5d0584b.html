<main class="wrap"><figure class="quote" id="q-4ee5d0584b" data-kw="">
<blockquote><p>There is a twofold charge commenced against us, [1] as sinners, and breakers of the Law; [2] as hypocrites and unsound believers. To the first we have nothing but the merits of Christ to plead; to the second, a fruitful obedience; or else, Paul in the opposition between works and faith, means by works, legal observances; by faith true Christianity [inclusive of it working; see Manton’s larger context]. The Jews boasted of their legal observances, to the rejection of the faith of Christ; and James by faith, [meant] a dead faith; and by works, [he meant] Christian duties, or acts of obedience to God; not external observances of the law of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cd11ee322" data-kw="">
<blockquote><p>4. Since all of both sides [Reformed and Romanist] allow that forgiveness of sins belongs to the formal cause of our justification, let us now discuss the imputation of the justice of Christ, and whether by that also we are formally justified. … 6. Christ merited for us by everything which He did or suffered on earth; for all infinitely pleased God the Father, and were of immeasureable and inexhaustible merit, because of the hypostatic union of the Divine Person, for He worked human works in a divine manner, as testify S. Dionysius the Areopagite and S. John Damascene. But amongst all that Christ did and suffered, undertaken for us, his death, with the passion immediately preceding it, has chiefly and most especially merited to us justification; for in it the obedience of Christ to the Father, and his love to the human race, shone forth in a wonderful manner, and his whole obedience was therein consummated, as the apostle clearly teaches. This is testified by innumerable passages of Scripture and the Fathers, and moreover, in this all Protestants and Romanists agree…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 2, pp. 101-103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-e2f2c4ad9c" data-kw="">
<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified. 2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>

</figure><figure class="quote" id="q-0b03df12ae" data-kw="">
<blockquote><p>23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (Baker, 1997), ch. 27, ‘Justification’, p. 163</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3193acaa56" data-kw="">
<blockquote><p>What was used in the days of Henry VIII and Edward VI appears by the book of acts and monuments and statutes in their days, to wit, the rejecting the Pope’s jurisdiction, appointing visitors, judging and deposing some bishops, commands to take down images, causing divine service to be in the English tongue, the Bible in the English tongue to be in churches, with many other things of the like kind. The promise to defend them is ‘to our power’ whether by opposing the bringers in of a foreign power, especially the Pope’s or by aiding the king in the right use of this authority, neither is the power granted which may not be lawfully used or exercised, nor is the abuse of it required to be defended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Serious Consideration of the Oath of the King’s Supremacy… (London: Hills, 1660) 27 pp.</cite>, pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47926c9091" data-kw="">
<blockquote><p>And what further authority, or proceedings purely ecclesiastical, of one, or many sister Churches towards another whole Church, or Churches offending, either the Scriptures do hold forth, or can rationally be put in execution (without the magistrates interposing a power of another nature, unto which we upon his particular cognizance, and examination of such causes, profess ever to submit, and also to be most willing to have recourse unto) for our parts we saw not then, nor do yet see… And if the magistrate’s power (to which we give as much, and (as we think) more, than the principles of the presbyterial government will suffer them to yield) do but assist and back the sentence of other Churches denouncing this non-communion [of Independent churches] against Churches miscarrying, according to the nature of the crime, as they judge meet…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/goodwin-nye-simpson-burroughs-bridge.html">Goodwin, Nye, Simpson, Burroughs, Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apologetical Narration, Humbly Submitted to the Honourable Houses of Parliament (London [1643])</cite>, pp. 17, 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</div>
</figure><figure class="quote" id="q-bb1b33fbe2" data-kw="">
<blockquote><p>The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27).¹ ¹ See ‘On the Ethics of Paying Specific Taxes designated to a Corrupt Purpose or Imposed by a Usurped Authority or Usurper’ and ‘On the Ethics of Paying the Scottish Cess Near &amp; During the Killing Times’ at ‘On Paying Taxes’ (RBO). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged [Scottish ministers] censured the indulged with?² Did Jesus compromise his authority or the exercise of his ministry? ² Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Editor’s Extended Introduction, p. 151 in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-8d902ff6ba" data-kw="">
<blockquote><p>…it appears to me that no objection can be made to admitting into the consistory officers of justice and chiefs of police, provided they sit in it in the capacity of magistrates. But always let there be a due distinction observed between the two functions and conditions. To exclude persons that belong to the civil government from all superintendence in the spiritual administration, seems to me contrary to reason. What is essential is that when fitting persons shall have been elected to such an office, there should be no blending of their functions, nor the power of the sword confounded with what ought to be carefully kept distinct from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters, #620 (1562)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-15b6f3d606" data-kw="">
<blockquote><p>Forasmuch as it has pleased the Almighty God by the wise disposition of his divine providence so to Order and dispose of things that we… are now cohabiting and dwelling in and upon the River of Conectecotte… And well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God… do therefore… enter into Combination and Confederation together, to maintain and preserve the liberty and purity of the gospel of our Lord Jesus which we now profess, as also the discipline of the Churches, which according to the truth of the said gospel is now practiced amongst us… 1. It is Ordered, sentenced and decreed that there shall be yearly two general Assemblies or Courts… wherein shall be yearly chosen form time to time so many magistrates and other public officers… Whereof one to be chosen Governor… which… shall have power to administer justice according to the Laws here established, and for want thereof according to the rule of the word of God… … The Oath of the Governor, for the [Present] I N. W…. do swear by the great and dreadful name of the everliving God, to promote the public good and peace of the same… and will further the execution of Justice according to the rule of God’s word; so help me God, in the name of the Lord Jesus Christ.</p></blockquote>

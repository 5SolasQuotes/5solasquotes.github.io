<main class="wrap"><figure class="quote" id="q-3bc99e300d" data-kw="">
<blockquote><p>Because it is a relic of Paradise and type of Heaven. The first Sabbath dawned on the bowers of a sinless paradise. When Adam was created in the image of his Maker, he was put into the garden to dress it and to keep it. No doubt this called forth all his energies. To train the luxuriant vine, to gather the fruit of the fig-tree and palm, to conduct the water to the fruit-trees and flowers, required all his time and all his skill. Man was never made to be idle.

Still when the Sabbath-day came round, his rural implements were all laid aside; the garden no longer was his care. His calm, pure mind looked beyond things seen into the world of eternal realities. He walked with God in the garden, seeking deeper knowledge of Jehovah and His ways, his heart burning more and more with holy love, and his lips overflowing with seraphic praise. Even in Paradise man needed a Sabbath. Without it Eden itself would have been incomplete. How little they know the joys of Eden, the delight of a close and holy walk with God, who would wrest from Scotland this relic of a sinless world!

It is also the type of heaven. When a believer lays aside his pen or loom, brushes aside his worldly cares, leaving them behind him with his week-day clothes, and comes up to the and comes up to the house of God, it is like the morning of the resurrection, the day when we shall come out of great tribulation into the presence of God and the Lamb. When he sits under the preached word, and hears the voice of the shepherd leading and feeding his soul, it reminds him of the day when the Lamb that is in the midst of the throne shall feed him and lead him to living fountains of waters. When he joins in the psalm of praise, it reminds him of the day when his hands shall strike the harp of God. Where congregations ne’er break up, And Sabbaths have no end.

When he retires, and meets with God in secret in his closet, or, like Isaac, in some favourite spot near his dwelling, it reminds him of the day when “he shall be a pillar in the house of our God, and go no more out.” This is the reason why we love the Lord’s day. This is the reason why we “call the Sabbath a delight.” A well-spent Sabbath we feel to be a day of heaven upon earth. For this reason we wish our Sabbaths to he wholly given to God. We love to spend the whole time in the public and private exercises of God’s worship, except so much as is taken up in the works of necessity and mercy. We love to rise early on that morning, and to sit up late, that we may have a long day with God.

How many may know from this that they will never be in heaven! A straw on the surface can tell which way the stream is flowing. Do you abhor a holy Sabbath? Is it a kind of hell to you to be with those who are strict in keeping the Lord’s day? The writer of these lines once felt as you do. You are restless and uneasy. You say, “Behold what a weariness is it!” “When will the Sabbath be gone, that we may sell corn?” Ah! soon, very soon, and you will be in hell. Hell is the only place for you. Heaven is one long, never-ending, holy Sabbath-day. There are no Sabbaths in hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Love the Lord’s Day</cite>, (1841) in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee (Edinburgh: Oliphant Anderson &amp; Ferrier, 1892), pp 596-97.</span></figcaption>

</figure><figure class="quote" id="q-ecb89ccf1c" data-kw="">
<blockquote><p>1. The benefits of a sound liturgy are: 1. to keep out heresy and ill words from public worship, 2. to be a help to men of unready utterance, 3. that the people may know beforehand what they join in. The inconveniences are: 1. the dulling of affection in hearing still the same words, 2. the tempting of slothful worldly candidates and ministers to learn no other way of praying when this will serve all their worldly turns. But I must add that this follows not from the imposing of a liturgy, but from the exclusion of other prayer and taking up with this alone.

2. The conveniences of praying from a habit are: 1. a just variation, as occasions vary, 2. help to fresh affection, 3. forcing ministers to get ability for utterance. The inconveniences are:

1. That the people know not till the words are past whether they may own them, and so hardly try all and follow with just consent.

2. That abundance of young, raw, unskillful men do ordinarily disgrace prayer by their unskillful methods and expressions.

3. That heretics and erroneous men have great opportunity to put their sins into their prayer, which yet the people should by joining in make their own were they sound (which they are not bound to do by sermons): And no man of understanding can choose, but suspect that weak ignorant ministers will be showing their weakness in the highest duties, and so must suspend their consent till late.

4. That less care will be taken in speaking to God than in speaking to men, while most sober ministers study their sermons.

5. That when to avoid disgraceful words and manner of praying, men must decree that no such weak or unready men shall be ministers, the number that can do it better will be so small as that most churches on earth must be so deprived of ministers and all public worship if that take place.

6. That by this means young ignorant men that by use can speak fluently and fervently in prayer shall be followed by the people when many great divines, judicious and holy that have not that readiness of utterance, shall be rejected as having not the Spirit.

7. That as all men’s bodies and minds be not in the like quickness and fitness at all times, but sometimes clouded by fumes or weakness, the public worship shall be as mutable, uncertain and various as men’s tempers are. All these on both sides are so great inconveniences that though both Formalists and Fanatics have derided me for it, I have formerly said, and still say that I believe that the best way to avoid both sorts of evils is to have meet set forms, which shall be owned by the Church as their professed desires, not being so long as to take up too much time from freer prayer, much less to forbid it, which Calvin wisely ordered for France and Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 53-54, on a mixture of a minister praying with forms in public worship with free prayer as the ideal.</span></figcaption>

<blockquote><p>The human nature of Christ is the only true tabernacle, wherein God would dwell personally and substantially. The dwelling of God with men was ever looked on as an infinite condescension. So Solomon expressed it, in his prayer at the dedication of the temple, “But will God indeed dwell on the earth? Behold, the heaven and heaven of heavens cannot contain thee,” 1 Kings viii. 27. But there are various degrees of this condescension, various kinds of this inhabitation of God among men. Under the old testament, he dwelt in the tabernacle and temple, by many symbols and pledges of his glorious presence.

Such in especial were the ark and mercy-seat; whence that which was done before the ark is said to be done “before the LORD,” Exod. xxx. 8. This was, as Solomon expresseth it, a great condescension in the infinite, incomprehensible God; and there was a great glory accompanying this his presence. Under the new testament, God dwelleth in his saints by his Spirit, whereby they become a holy temple unto him. And of this inhabitation of God I have treated elsewhere. But his dwelling in the human nature of Christ is quite of another nature than either of these; and his love with his condescension, inconceivably more conspicuous than in them.

Hence is that expression of our apostle. “In him dwelleth all the fulness of the Godhead bodily,” Col. ii. 9. It is not any sign or token, it is not any effect of the divine power, goodness, and grace, that dwells in him, but “the fulness of the Godhead;” that is, the divine nature itself. And this dwelleth in him “bodily;” that is, by the assumption of the body or the human nature into personal subsistence with the Son of God. How glorious should this be in our eyes! How did they admire the condescension of God of old, in his dwelling in the tabernacle and temple by the glorious signs of his presence! and yet was it all but a dark representation and shadow of this glorious love and grace, whereby he dwells in our nature in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 21-22.</span></figcaption>

<blockquote><p>48. Q. When begins the Lord’s day?

A. In the morning. Act. 20.7.

When Paul came to the Church at Troas, he had a mind to spend a Lord’s day with them, though he was in great haste to depart so soon as he could. He came therefore to their assembly at the time that they came together according to their custom: but he kept them till the end of that day: (for he would not travel on the Lord’s day) and having dismissed the assembly, he departed. Now it is said, that he continued his speech till midnight (Acts 20. 7) even till break of day (ver. 11.) and then departed: which departure of his is said to be on the morrow. By this punctual expression of the time it appears that the first day of the week, the Lord’s day, ended at midnight: and that then the morrow began. Now to make a natural day which consisteth of twenty four hours, it must begin and end at the same time: for the end of one day is the beginning of another. There is not a minute betwixt them. As therefore the Lord’s day ended at midnight, so it must begin at midnight: when we count the morning to begin. Which is yet more evident by this phrase (Mat. 28.1.) In the end of the Sabbath (namely of the week before, which was the former Sabbath) as it began to dawn (namely) on the next day, which was the Lord’s day) or (as Joh. 20.1.) when it was yet dark there came divers to anoint the body of Jesus, but they found him not in the grave: he was risen before: so as Christ rose before the Sun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 24-5.</span></figcaption>

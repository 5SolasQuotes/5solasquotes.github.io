<main class="wrap"><figure class="quote" id="q-73f3a162aa" data-kw="">
<blockquote><p>The principles that have been learned and our rebalancing of priorities ought to not only show us that the unifying of Christ’s Church is possible, but it is obligatory and this ought to cause us to endeavor after it… The civil allowance of the more sound protestant denominations in England [in 1690]… could only tend toward facilitating and cementing those denominations into remaining separate, entering us into modern denominationalism. To seek to reverse that trend, Phil. 3:15-16, “whereto we have already attained, let us walk by the same rule, let us mind the same thing,” will be expounded and cleared from the separatistic construction often put on it. Lastly, principles of Scripture, Westminster, the Scots and the London presbyterians for unifying the Church will be laid out and recommended, versus erecting denominational white towers. The fundamentals (at least) of Christianity will be seen to be sufficient and obligatory Scriptural doctrinal grounds for organic Church union (with all due care and prudence), as the post-apostolic early Church, many of the reformed (including the leading Scottish covenanter James Durham) and the London presbyterians taught, it being no sin, but a divine obligation for the stronger to help and be united to the weaker (though they must relinquish rights and privileges for the here now to do so). Consequently, secondary teachings and practices which do not tend to overturn the fundamentals or the power of godliness will be seen to be no grounds for division, or schism. Objections will be resolved and the reform of Christ’s one Church will be encouraged and set on its way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>4. “White Towers &amp; Unifying Christ’s Church” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 160-89</cite>, p. 160</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a00019d58" data-kw="">
<blockquote><p>1. It has been already declared (yea, adjudged) that, by that statute [the Act of Parliament in the 13th year of Elizabeth], there is no liberty for any man to subscribe the [39] Articles with any limitation, or explication, if any credit be given to Sir Edward Cook, who says (Institutes, 4.47, p. 324, ed. 1658), that he has heard Wray, chief Justice in the King’s Bench, Pasch. 23 Elizabeth (quoting Dier 23 Elizabeth, 377, bk. 6, fol. 69, Grene’s Case, Smith’s Case) report that where one Smith subscribed to the said 39 Articles of Religion with this addition, ‘so far forth as the same were agreeable to the Word of God,’ that it was resolved by him and all the judges of England that this subscription was not according to the Statute of 13th Elizabeth, because the statute required an absolute subscription, and this subscription made it conditional; and that this act was made for avoiding diversities of opinions, etc. And, by this addition the party might by his own private opinion take some of them to be against the Word of God: and by this means diversities of opinions should not be avoided, which was the scope of the statute; and the very act itself made touching subscription, hereby [be] of none effect. Thus, he. 2. This shows a necessity of repealing that branch of the act, so far as it concerns subscription, because: 1. If we may not subscribe with such an addition, ‘so far forth as the same Articles are agreeable to God’s Word,’ it must needs be granted that the composers of them are admitted to be infallible; and their Articles, of equal authority with canonical Scripture: or else that the statute intended to tyrannize over the consciences of men, which is not to be imagined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons showing the Necessity of Reformation… (London: Cotrel, 1660), I. ‘Of Doctrine,’</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-f4042b8944" data-kw="">
<blockquote><p>While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;</p></blockquote>

<blockquote><p>For my own part, as highly as I honor the men [the Westminster divines], I am not of their mind in every point of the government which they would have set up; and some words in their Catechism I could wish had been more clear;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ: or, Mr. Richard Baxter’s Narrative of the most Memorable Passages of his Life &amp; Times (London: Parkhurst, 1696), bk. 1, pt. 1</cite>, p. 73</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b884325095" data-kw="">
<blockquote><p>…that such who were known to be godly might not come to the sacrament of the Lord’s Supper, unless they were members of some particular congregation, and so, in their partaking with you, they must yield that grand Brownistical principle, the foundation of other errors among the Separatists, namely, that sacraments belong not to visible believers, but as they are members of some particular congregation… And let me entreat you, in your reply you [will] give to this answer, to give me a Scripture to prove that all men who come to the Lord’s Supper must profess their membership and their retaining to such a particular congregation: I profess myself of another judgement, and cast the glove to any of you five, or to you all; That it is lawful for the ministers of Christ to receive such whom they know to be godly to the Lord’s Supper, though they be not members of a particular church, and to receive those who are members without any [of them] professing themselves to be so: Suppose some godly merchants or marriners, who all their days travel and never stay long in any one place, yet in all places where they come, desire to join in the ordinances, ought not such to be received? The standing rule of coming to the Lord’s Supper will be found to be faith and godliness shown forth, rather than the formality of membership: …so I find Mr. Batchelour (one of you) writing from Rotterdam of your churches, that they will not keep back the sacrament from any of the godly of such churches in England, as Mr. Goodwin’s and Mr. Calamy’s are (always provided that their own pastors do consent unto it). Now the godly who are gone into Holland, and especially to New-England, not finding any such word in Scripture of bringing a ticket from their ministers, and so coming into those countries without it, may be long kept from the sacrament of the Lord’s Supper till they either go [back] into England and fetch it, or till they send for it over, and have a return back of the consent of their own pastors (which may be, was the reason, that though you offered to receive into the Communion of the Lord’s Supper some godly that came to visit you in your exile, yet for want of bringing their pastor’s consent unto it, returned into England without partaking in the Lord’s Supper with you). Which (by the way) will be a good warning for all that henceforth go over into Holland or New-England, to carry their minister’s consents over with them, lest otherwise they be not admitted to the Lord’s Supper…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or a Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge</cite>, … (London, 1644), p. 52</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2dcc764c1" data-kw="">
<blockquote><p>Question 3: Whether do you not hold all visible believers to be within the visible Church as members thereof, and not ‘without’, in the apostle’s sense, 1 Cor. 5, and therefore ought so to be acknowledged and accepted in all congregations wheresoever they shall come, and are so known: and ought (if they desire and be not otherwise unfit) of right to be permitted to partake in all God’s ordinances and Church privileges there, so far as they personally concern themselves, although they be not as yet fixed members in particular covenant, either with that congregation where for the present they reside, nor with any other? Question 4: Whether you do not hold that baptism rightly (for substance) partaked does make them that are so baptized, members of the visible Church: and so to have right (at least quoad nos [as far as to us]) to all the privileges thereof (so far as they are otherwise fit) until they be cast out (if they so deserve) by excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 32 Questions (1639) in Richard Mather, Church-Government &amp; Church-Covenant Discussed, in an Answer of the Elders of the Several Churches in New-England to Two &amp; Thirty Questions Sent Over to Them by Diverse Ministers in England, to Declare their Judgments Therein… (London, 1643) Bernard was an English puritan. These questions were answered by the New England congregationalists, but it does not appear that Bernard ever published a response (at least that is on the internet) to those answers.</span></figcaption>

<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14, pp. 56-57</span></figcaption>

— Samuel Rutherford, A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658), Book 1, ch. 14, pp. 56-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+Argument+%5Bof+Rutherford%5D%3A+In+the+first+receiving+of+members+by+the+apostles%2C+there+was+but+a+professed+willingness+to+receive+the+Gospel%2C+howbeit+some+received+it+not+from+the+heart.+Mr.+Hooker+answereth%3A+%E2%80%98There+was+not+only+a+professed+willingness%2C+but+a+practical+reformation%2C+that+in+the+judgement+of+charity+giveth+grounds+of+hope+that+there+is+something+real%2C+before+the+contrary+appear%3B+Therefore%2C+Peter+who+received+Magus+upon+his+approbation+of+the+truth+and+outward+conformity+thereunto+in+the+course+of+his+life%2C+rejected+him+as+one+in+the+gall+of+bitterness%2C+who+had+no+share+in+Christ%2C+and+therefore+certainly+would+not+suffer+him+in+the+privileges+of+communion%2C+so+persisting+without+repentance.%E2%80%99+%5BRutherford%E2%80%99s%5D+Answer+1%3A+%5BHooker+says%3A%5D+%E2%80%98Not+professed+willingness%2C+but+also+practical+reformation+is+required.%E2%80%99+But+is+not+professed+willingness+in+murderers+of+Christ%2C+who+said%2C+%E2%80%98What+shall+we+doe+to+be+saved%3F%E2%80%99+some+practical+reformation%3F+There+is+nothing+but+conjectures+that+the+apostles+did+not+admit+all+and+every+one+of+the+three+thousand+until+they+had+experience+of+their+state+of+grace+and+judicially+determined+so+of+them+all.+%28%5BMargin+note%3A%5D+Mr.+Hooker+neither+proves%2C+nor+can+prove+that+the+apostles+had+habitual+experience+in+so+few+hours%2C+all+and+every+one+of+the+3%2C000+%28Acts+2%29+gave+evidence+of+real+conversion+to+the+apostles.%29+%282%29.+This+practical+reformation+was+not+an+experience+of+their+practice+of+savory+walking%2C+required+by+Mr.+Hooker+%28p.+1.+ch.+2%2C+pp.+14-15%29+in+visible+saints+before+admission%2C+except+some+four+or+five+hours+time+may+create+an+habitual+experience%2C+for+the+same+very+day+they+were+baptized+%28Acts+2%3A41%29.+%283%29+Mr.+Hooker+should+prove+that+the+apostles+found+this+practical+reformation+in+all%2C+Ananias%2C+Saphira%2C+and+the+whole+3000%3B+and+that+the+apostles+tried+and+smelled+the+savouriness+of+saving+grace+in+all%3B+in+Saphira%3B+the+text+giveth+not+the+least+jot+of+this%2C+we+must+take+it+upon+the+naked+assertion+of+Mr.+Hooker+%284%29+That+this+practical+reformation+gave+to+the+apostles%E2%80%99+judgement+of+charity+ground+of+hope+that+there+was+something+real%2C+that+is%2C+the+whole+number%2C+about+three+thousand+%28none+excepted%2C+for+all+were+made+Church-saints+visible%29+gave+grounds+of+hope+that+they+were+all+really+%28otherwise+their+speaking+and+hearing+the+word+was+real%2C+that+is%2C+not+imaginary%29+internally+and+effectually+called%2C+and+born+over+again+of+the+spirit%2C+and+so+chosen+to+life+eternal+from+eternity%2C+before+the+apostles+durst%2C+without+the+offending+of+God%2C+admit+them+to+Church-fellowship+and+visible+communion%3B+those+%5Bthings%5D+%28I+say%29+must+be+proven.+If+I+durst+%5Bdare%5D%2C+I+am+not+far+from+judging+the+godly+and+judicious+in+cold-blood%2C+free+of+heat+of+dispute%2C+dare+not+so+judge+of+the+text%2C+Acts+2+or+Acts+8.+%285%29+There+is+no+shadow%2C+Acts+8%2C+that+Peter+%28Mr.+Hooker+should+say+Philip%29+admitted+not+Magus+while+he+saw+such+grounds+of+the+sorcerer%E2%80%99s+real+conversion+and+real+predestination+to+glory.+%286%29+Peter+said+that+Magus+had+no+share+in+Christ.+True%2C+but+said+he+that+he+was+an+unbaptized+man+who+had+no+share+in+the+visible+Church%3F+No.+%287%29+But+he+would+not+suffer+Magus+to+share+in+the+privileges+of+communion%2C+he+persisting+without+repentance.+True%2C+but+it+is+no+answer+to+the+argument+from+the+manner+of+receiving+in%2C+this+is+something+to+the+casting+out%2C+%288%29+that+Peter+reproveth+him+in+the+gall+of+bitterness+%5Band%5D+2.+Exhorts+him+to+repent%2C+to+pray+for+pardon%2C+%5Bthese+last+two+things%5D+were+great+privileges+of+Church-communion+bestowed+upon+Magus.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+penned+by+Mr.+Thomas+Hooker%E2%80%A6+wherein+the+way+of+the+churches+of+N.+England+is+now+re-examined+%28London%2C+1658%29%2C+Book+1%2C+ch.+14%2C+pp.+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd81995a250.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d81995a250.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=First%20Argument%20%5Bof%20Rutherford%5D%3A%20In%20the,privileges%20of%20Church%2Dcommunion%20bestowed%20upon%20Magus&amp;text=First%20Argument%20%5Bof%20Rutherford%5D%3A%20In%20the%20first%20receiving&amp;text=were%20great%20privileges%20of%20Church%2Dcommunion%20bestowed%20upon%20Magus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

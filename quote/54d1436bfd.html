<blockquote><p>…as [John] Cameron notes, it is ordinary to call that necessary which is very profitable and expedient. Beside this (I say), we further maintain that in the use of things indifferent, that which we deliberate upon to do is never lawful to be done except it be also necessary, though not necessitate absoluta seu consequentis [by an absolute necessity, of the consequence], yet necessitate consequentiae seu ex supposition [by a necessity of the consequent, or from the supposition]. Paul’s circumcising of Timothy was lawful only because it was necessary, for he behooved by this means to win the goodwill of the people of Lystra who had once stoned him, otherwise he could not safely have preached the Gospel among them. Therefore he had done wrong if he had not circumcised Timothy, since the circumcising of him was according to the rules of the Word, and it was expedient to circumcise him and unexpedient to do otherwise. And (because de paribus idem est judicium [from the parts, so is the judgment]) whensoever the use of any indifferent thing is according to the rules of the Word, that is, when it is profitable for God’s glory and man’s edification, and the doer is persuaded of so much, I say, putting this case, then (for so much as not only it may, but ought to be done) the use of it is not only lawful, but necessary: and (for so much as not only it needs not, but ought not to be omitted) the omission of it is not only unnecessary, but also unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637) | pt. 4, ch. 3, ‘Whether there be anything indifferent in actu exercito [in the exercised act]’, p. 17 While Gillespie’s teaching here is not in the context of the Sabbath, it is very relevant.</span></figcaption>

<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

</figure><figure class="quote" id="q-de0aa54e5c" data-kw="">
<blockquote><p>So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>

</figure><figure class="quote" id="q-375ecdb9c1" data-kw="">
<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>

— James Durham, The Law Unsealed: or a Practical Exposition of the Ten Commandments... (Glasgow, 1676), 4th Commandment, p. 171">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+Works+of+comliness%2C+tending+to+honest+or+decent+walking%E2%80%A6+By+all+which+believers+have+allowance%3A+1.+for+piety%2C+2.+for+charity%2C+3.+for+what+is+needful+for+their+beasts%2C+4.+what+is+needful+and+convenient%2C+or+comely+for+themselves%3B+and+more+is+not+necessary%3A+In+these+the+Lord+has+not+straightned+them%2C+neither+has+He+pinched+and+pinned+them+up+to+absolute+necessity%2C+but+has+left+them+to+walk+by+Christian+prudence+%28yet+so+as+they+may+not+exceed%29+for+the+disciples+possibly+might+have+endured+that+hunger%2C+and+not+plucked+the+ears+of+corn%2C+or+beasts+may+live+a+day+without+water%2C+and+not+be+much+the+worse%2C+or+some+sort+of+victuals+may+be+provided+to+be+set+beside+men+on+the+Sabbath+needing+no+dressing+or+preparing%3B+yea%2C+a+man+may+live+on+little+or+nothing+for+one+day%3A+but+the+Lord+has+thought+good+not+to+straighten+them%2C+so+as+to+make+his+day+and+worship+a+weariness+and+burden+unto+them%2C+seeing+He+has+made+the+Sabbath+for+man%2C+to+be+refreshing+to+him%2C+and+not+man+for+the+Sabbath%3B+nor+will+he+have+their+consciences+to+be+fettered+with+inextricable+scruples%3A+He+leaveth+it+to+men+on+other+days+how+much+to+eat+and+drink+by+a+Christian+prudence+%28yet+allows+them+not+to+exceed+even+on+these%29+so+here+there+is+some+latitude+left+to+conscientious+reason+to+walk+by%3B+for+some+may+do+something+at+one+time%2C+and+not+at+another%2C+yea%2C+one+man+may+take+more+pains+in+upholding+his+body+than+is+called+for+from+another+who+is+stronger%2C+so+that+it%E2%80%99s+impossible+to+set+particular+rules+which+will+agree+to+all%2C+but+%5Bthat%5D+men+would+look%3A+1.+to+their+end%2C+2.+to+their+need%2C+3.+to+what+may+conveniently+attain+the+end.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+The+Law+Unsealed%3A+or+a+Practical+Exposition+of+the <blockquote><p>This delight is spiritual in God as the proper object, and in the ordinances as the only means to lead us unto God, Job 27:10; Ps. 43:4; Canticles, 2:3; Isa. 56:7. Reasons. 1. Because the duties of that day are higher, we have then all the means of communion with God: 1. We have them in a more raised solemn way without any interruption; there is then a double institution, not only of the worship, but the time. 2. Its a spiritual feast, a day of God’s appointment, our recompence as well as our duty, Neh. 2:26. Ordinances are fodinae gratiae [wells of grace], Isa. 12:3. 3. This day we come to remember the highest favours of God to the creature, to contemplate the works of Creation, God’s rest, and of Redemption, Christ’s rest, 1 Pet. 4:1, and our own eternal rest, Heb. 4:9, the Sabbaths of the faithful are the suburbs of Heaven, Heb. 12:23, the Lord’s Supper is heaven in a map, Luke 14:15; Mt. 26:29. 4. Many of the duties of the day are but spiritual recreations; meditation is the solace of the mind in the contemplation of God’s works, Ps. 104:34. Singing of Psalms is a vent for spiritual mirth, Lam. 5; Eph. 5:18-19; then God should be solemnly praised, Ps. 92:1-2. 5. It is the temper of the people of God to delight in his solemn worship, Ps. 2; 1 Cor. 2:12. Male concordat canticum novum et vetus homo [The new song and old man poorly agree]. Augustine; Ps. 84:1, 10; Ps. 122:1. 6. Delight in the Sabbath is the best way to discharge the duties: 1. With comfort; delight sweetens all; how will men toil at their sport? Neh. 11:8. 2. With profit, Isa. 64:5; God will not send them away sad which come into his presence with joy.</p></blockquote>

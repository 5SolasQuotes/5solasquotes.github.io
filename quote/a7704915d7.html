<main class="wrap"><figure class="quote" id="q-a7704915d7" data-kw="">
<blockquote><p>Popes, kings, bishops, have been striving to be lords over God’s flock; that ambition has cost all the three dear. Let Christ alone (by his own laws, his own officers, and his own courts) have the full spiritual and ecclesiastical government of his churches. The taking of this from him, may spoil us of his protection. Those men that are most careful to vindicate the right of Christ, are best servants to the state; for they lay a sure foundation of Christ’s favour and protection to that state wherein they settle Christ as the only King, Lord and Master of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Errors &amp; induration are the great sins &amp; the great judgments of the time. Preached in a sermon before the Right Honourable House of Peers, in the Abbey-Church at Westminster, July 30, 1645, the day of the Monthly Fast in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64ac0180e5" data-kw="">
<blockquote><p>[I]t is a principal function of kings and of governors to search and explore what function of life has been designed by God for each citizen, and to take care that each one is initiated, prepared, and helped toward this end from childhood, so certainly the same persons ought to exercise utmost interest and a primary concern among their subjects, and, wherever possible, to seek and find those whom the Lord seems to have appointed to this supremely salutary work, necessary before all others, of preaching the gospel. So Paul glories that he had been “separated for this work from his mother’s womb” (Gal. 1:15). They should take care that such of these as they can discover be initiated and trained from childhood for this most holy office, and that those who have been duly tested and proved be used in their good time for this function. This is certainly necessary before all things else, to be realized with utmost zeal by all kings and princes of the people of God who pray from their hearts, “Thy Kingdom come” (Matt. 6:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 227.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-91e0ad208d" data-kw="">
<blockquote><p>When the public magistrate proves faithless, and when he is determined to betray the interests of the commonwealth, then the citizens may take measures for their own safety, and may assume that power which he so ruinously prostitutes. When this classic city [Londonderry] was invested, and when the chief magistrate had resolved upon a base surrender, was he not forced to flee when his projects were discovered, and were not the citizens warranted to occupy his place with braver and more trusty governors?

And when the monarch himself [King James II] evinced a disposition to sacrifice the good cause, was not he too obliged to give way to the righteous indignation of an injured people, and to abdicate the sovereignty? And had not they a right to appoint as his successor that illustrious Presbyterian [King William III], who was raised up by Providence to vindicate their principles, and to serve as the bulwark of Protestantism?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-d-killen.html">William D. Killen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse I in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-76b42ef2c0" data-kw="">
<blockquote><p>…especially seeing his Majesty [King Charles I] shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>

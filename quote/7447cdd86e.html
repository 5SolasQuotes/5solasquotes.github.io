<blockquote><p>Arguments of Peter Martyr disputing with Mr. Chadsey upon the first question: The analogy and resemblance between the sacrament and the thing signified must ever be kept in all sacraments. In the sacrament of the Lord’s body, this analogy or resemblance cannot be kept, if bread be transubstantiated: Ergo [therefore], the substance of bread must needs remain in the sacrament of the Lord’s body. The major [premise] of this argument is certain by St. Austen [Augustine] (Book on Catechizing in the Rudiments; Epistle to Dardan), where he says: Sacraments must needs bear a similitude of those things whereof they are sacraments, or else they can be no sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in John Foxe, Acts &amp; Monuments… (London, 1583), ‘The Ninth Book Containing the Acts &amp; Things Done in the Reign of King Edward VI’, ‘Arguments of Peter Martyr…’, p. 1374</span></figcaption>

<blockquote><p>Q. 26. Are our forefathers to be blamed for pulling down altars, images, and other monuments of idolatry, from places of public worship at the Reformation? No; they had Scripture precept and warrant for what they did, Num. 33:52, and Deut. 7:5 — “Ye shall destroy their altars, and break down their images, and cut down their groves, and burn their graven images with fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher.html">James Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism Explained</cite>, (1753)</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), p. 198</span></figcaption>

— Samuel Rutherford, The Divine Right of Church Government (London, 1646), p. 198">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHis+%5BChrist%E2%80%99s%5D+non-sitting+and+washing+their+feet%2C+being+a+moral%2C+not+a+sacramental%2C+teaching+them+humility%E2%80%A6+Christ+teaches+lessons+of+humility%2C+not+to+learn+us+not+to+seek+the+spiritual+honor+of+communion+with+Christ%2C+that+were+to+teach+us+to+be+proud%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+p.+198&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcccea831a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cccea831a9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=His%20%5BChrist%E2%80%99s%5D%20non%2Dsitting%20and%20washing%20their,to%20teach%20us%20to%20be%20proud&amp;text=His%20%5BChrist%E2%80%99s%5D%20non%2Dsitting%20and%20washing%20their%20feet%2C%20being&amp;text=that%20were%20to%20teach%20us%20to%20be%20proud" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-075824cdf1" data-kw="">
<blockquote><p>Goodwin’s argument makes as much against Christ and the apostles as against us, for they could never in all their sermons and writings so frequently bottom and found the faith on &lt;Greek&gt; ‘as it is written in the Prophets,’ ‘as David saith,’ ‘as Isaiah saith,’ and Hosea, ‘as Daniel saith,’ as Moses and Samuel, and all the Prophets bear witness, if they had had no other certainty, that the writings of the Prophets, that came to their hands, was the very word of God, but the credit, learning and authority of men, as Mr. [John] Goodwin says, for sure Christ and the apostles and evangelists had not the authentic and first copies of Moses and the prophets, but only copies written by men, who might mistake, printers and translators not being then, more than now, immediately inspired Prophets, but fallibly men, and obnoxious to failings, mistakes and ignorance of ancient Hebraisms and force of words; and if ye remove an unerring providence, who doubts but men might add a &lt;Hebrew&gt; or subtract, and so vitiate the fountain sense? and omit points, change consonants, which in the Hebrew and Greek, both might quite alter the sense: Nor can any say, ‘Christ and the Apostles being infallible, could well cite the prophets without a mistake, though the copies might have been vitiate and corrupt, 2. Because the very citing of these testimonies by Christ and his apostles, made them Scripture, and so of infallible authority; but our citing of them, (since both printers and translators are not immediately inspired, and we also might err) cannot adopt them into canonical and authentic Scripture, such as was first written by the immediately inspired prophets.’ I shall answer that first, this objection presumes that Christ and the apostles might, and did, find errors and mis-printings even in written Scripture, which might reduce the Church in after ages to an invincible ignorance in matters of faith, and yet they gave no notice to the Church thereof; or if there was no error de facto, then for so many hundred years, yet there are now substantial errors, and so foul that it may be we have no Word of God at all, amongst us, and God has no Church, no believer on earth, but we must all take the word of printers and translators, which is merely the word of man: And what is become of all the martyrs that suffered by the bloody woman Babel? They died for mere conjectures and opinions, for they had not the first original copies of Moses and the Prophets, yea Stephen the first martyr, who according to all our copies, Acts 7, adds five to Moses, his 70 souls, that went down to Egypt, in that glorious sermon that he has before his death, when he sealed the truth with his blood and died gloriously, and said, ‘Lord Jesus receive my spirit,’ died but upon the faith of men’s fallible skill in grammar, printing and writing; for he cites the writings of Moses to his enemies that stoned him, according to the copies that they then had, who would quickly have controlled him if he had cited false copies, and Stephen’s own testimony was controverter, and therefore except we say that Stephen and Christ and the apostles cited the testimonies of the prophets as they were then obvious to the eyes and reading of both the people of God and the enemies, and that not simply as their own words which they spake as immediately inspired, but as the testimony of the prophets, according to the then written copies, we must say they spake not ingeniously the truth of God, for it was against truth, candor, ingenuity, to Christ and the apostles to say, ‘as it is written in your Law,’ John 8:17, and so often ‘it is written,’ if they would not have the hearers to receive with certainty of faith and full assurance, free from all doubting and fear of humane fallibility, that what they cited as written, was undoubtedly the same very truth of God, and no other, which Moses and the prophets spoke and wrote; and if they would not have them to read, search and believe these same Scriptures, and to conceive that they drew arguments in the New Testament to prove and confirm their doctrine from that which was written by Moses and the prophets in the Old Testament, and would not have them to believe them, only because New Testament writers immediately inspired had so said.

6. If God will have us to try and examine all spirits, all doctrines, by the Scriptures written, then are we certainly assured that the books we now have of the Old and New Testament, are the very Word of God, though we cannot by any possibility have the first and original authentic copies of Moses and the prophets and apostles. Because 1. God would not bid us try, and then leave us no rule to try withal but our own natural light, which must lead us into darkness.

2. The visible Church should not be guilty of unbelief if the written Word were not among us, or then Christ and his apostles speaking to us, as is clear, John 15:22; Rom. 10:14-15; Mt. 11:21-22. The assumption is clear by the commended practice of the Bereans, who tried Paul’s doctrine by the Scriptures, Acts 17. See Rivetus, Whitaker, Calvin.

3. By the command of God, 1 Thess. 5:2; 1 John 4:1; ‘Try all things,’ ‘try the sprits.’

7. John would not call those blessed who read and hear, Rev. 1:5, nor would Paul recommend reading to Timothy, and continuance in the doctrine of the Scriptures, and so extol the necessity and utility of the Scripture and the indwelling of the word of God in us as he does, 1 Tim. 4:16; 2 Tim. 3:14-16; Col. 3:16, nor could the things written by John ch. 21, by Moses and the prophets, Luke 16:29-31, be holden forth as sufficient to bring souls to heaven, and to cause them eschew Hell, if it were true that we ‘have no certainty that the Scripture of the old and New Testament are the very word of God, but such as is made of men’s credit and learning.’

8. Yea and so what God spake immediately to Abraham, Moses and the prophets, could not be infallibly and by certainty of faith to them the Word of God; for if God spake to them in a language intelligible, they had no certainty of faith that the words that came from God did signify thus and thus; for sure, God, by immediate inspiration, taught them not grammar and significations of words, and those that read the Law written by God’s finger on two tables of stone, those who heard Moses and the prophets preach in their mother-tongue, even the Jews who read the original first Hebrew copy of Moses and the prophets, must have had no warrant that that was the Word of God, but the authority of father, mother and nurses, who first taught them their mother-tongue, for sure the prophets were not school-masters to teach them Hebrew; so by this learning there was never since the world was any certainty of faith, but such conjectural human and fallible opinions in all the matters of God as is resolved ultimately (says Mr. Goodwin) into men’s fallible and topic authority and skill of grammar, and all divine faith is perished out of the earth, except God by a supernatural power taught men first grammar, and then to believe, for which we have no warrant, so all our faith must be dreams. And since Mr. Goodwin acknowledges a supernatural power of the Spirit of grace to believe; what else does this Spirit cause us believe, but lies? or at best fancies resolved into human credit? which may be false for any certainty of knowledge that Libertines allow us? … May not reading, interpunction, a parenthesis, a letter, an accent, alter the sense of all fundamentals in the Decalogue? of the principles of the Gospel? and turn the Scripture in all points (which Mr. Doctour restricts to some few darker places, whose senses are off the way to heaven, and less necessary) in a field of problems, and turn all believing into digladiations of wits? all our comforts of the Scriptures into the reelings of a Windmill, and fancies of seven moons at once in the firmament? this is to put our faith and the first-fruits of the Spirit, and Heaven and Hell to the press. But though printers and pens of men may err, it follows not ‘that heresies should be tolerated,’ except we say, 1. that our faith is ultimately resolved upon characters, and the faith of printers. 2. We must say we have not the clear and infallible word of God, because the Scripture comes to our hand by fallible means, which is a great inconsequence, for though scribes, translators, grammarians, printers, may all err, it follows not that an erring providence of Him that has seven eyes, has not delivered to the Church, the Scriptures containing the infallible truth of God. Say that Baruch might err in writing the prophesy of Jeremiah, it follows not that the prophesy of Jeremiah, which we have, is not the infallible Word of God; if all translators and printers did their alone watch over the Church, it were something, and if there were not one with seven eyes to care for the Scripture. But for tradition, councils, popes, fathers, they are all fallible means, and so far forth to be believed as they bring Scripture with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), pp. 333-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

Spirit+cause+us+believe%2C+but+lies%3F+or+at+best+fancies+resolved+into+human+credit%3F+which+may+be+false+for+any+certainty+of+knowledge+that+Libertines+allow+us%3F+%E2%80%A6+May+not+reading%2C+interpunction%2C+a+parenthesis%2C+a+letter%2C+an+accent%2C+alter+the+sense+of+all+fundamentals+in+the+Decalogue%3F+of+the+principles+of+the+Gospel%3F+and+turn+the+Scripture+in+all+points+%28which+Mr.+Doctour+restricts+to+some+few+darker+places%2C+whose+senses+are+off+the+way+to+heaven%2C+and+less+necessary%29+in+a+field+of+problems%2C+and+turn+all+believing+into+digladiations+of+wits%3F+all+our+comforts+of+the+Scriptures+into+the+reelings+of+a+Windmill%2C+and+fancies+of+seven+moons+at+once+in+the+firmament%3F+this+is+to+put+our+faith+and+the+first-fruits+of+the+Spirit%2C+and+Heaven+and+Hell+to+the+press.+But+though+printers+and+pens+of+men+may+err%2C+it+follows+not+%E2%80%98that+heresies+should+be+tolerated%2C%E2%80%99+except+we+say%2C+1.+that+our+faith+is+ultimately+resolved+upon+characters%2C+and+the+faith+of+printers.+2.+We+must+say+we+have+not+the+clear+and+infallible+word+of+God%2C+because+the+Scripture+comes+to+our+hand+by+fallible+means%2C+which+is+a+great+inconsequence%2C+for+though+scribes%2C+translators%2C+grammarians%2C+printers%2C+may+all+err%2C+it+follows+not+that+an+erring+providence+of+Him+that+has+seven+eyes%2C+has+not+delivered+to+the+Church%2C+the+Scriptures+containing+the+infallible+truth+of+God.+Say+that+Baruch+might+err+in+writing+the+prophesy+of+Jeremiah%2C+it+follows+not+that+the+prophesy+of+Jeremiah%2C+which+we+have%2C+is+not+the+infallible+Word+of+God%3B+if+all+translators+and+printers+did+their+alone+watch+over+the+Church%2C+it+were+something%2C+and+if+there+were+not+one+with+seven+eyes+to+care+for+the+Scripture.+But+for+tradition%2C+councils%2C+popes%2C+fathers%2C+they+are+all+fallible+means%2C+and+so+far+forth+to+be+believed+as+they+bring+Scripture+with+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty <blockquote><p>By a ‘ceremony’ I understand an external rite in or about the worship of God. By ‘significant ceremonies’ I understand rites in divine worship signifying some material point of religion. There is no controversy about those outward actions that by nature or general custom signify the reverence of the mind, as kneeling and lifting up our eyes and hands to Heaven in token of devotion to the God of Heaven, and being uncovered in prayer, etc. But the question is of those that signify merely by the force of authoritative institution or private arbitrary intention. Such significant things, though they may have some natural aptitude to signify such and such points of religion, yet they do not actually signify, but [only signify] as arbitrarily designed thereunto. It is generally received that significant ceremonies in taking an oath may lawfully be used, and that not only such as naturally signify, as lifting up the hand towards Heaven, but such also as signify by institution, as laying the hand on a book or kissing the book. Now though the end of an oath may be a civil thing, as the ending of a controversy, yet the formal of it is divine worship. And the aforesaid ceremonies are expressive of the very external part of it, and they actually signify by force of institution. Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words. The Christians heretofore, being among infidels, might lawfully have the figure of the cross somewhere visible about them to show that they were Christians. For the meaning was no more than if they had said, “We are Christians.” But it may be replied this was no act of divine worship, but an indicant or speaking sign towards men. With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution. And if instituted signs of devotion in general be lawful, I see not why signs of some special part of devotion, or mystery in religion, should be unlawful. I am more confident of the warrantableness of rites and ceremonies of worship that are used only instead of so many words pronounced, than of those that are added to words for their more solemn ratification, as seals are to a writing or federal signs to a verbal contract. Nevertheless, the forementioned ceremonies of swearing seem added to the words of the oath for more solemn ratification; and it alters not the case whether the words be read by him that administers or pronounced by him that takes the oath, for either way they are his words that takes the oath. Likewise I have more confidence of the warrantableness of those significant ceremonies that are of private arbitrary intention than of those that are of authoritative institution; also of those that are used occasionally and pro hic et nunc [for here and now], than of those that are used statedly. Furthermore I apprehend that significant ceremonies of divine worship are more apt to degenerate into superstition; and if they be multiplied, that religion is therewith loaded as with unprofitable luggage; and that it is a form of religion rather Mosaic than evangelical, wherein spiritual worship is most regarded. I think also that significant ceremonies are not necessary in genere, as those things are which are left to the determination of human authority, and so not to be instituted and imposed in the ordinary divine service. I apprehend that our Lord Christ has instituted all those stated ordinances of positive worship that are necessary to the Church universal, and therefore that more of the same nature are not to be devised by men. If any significant ceremonies be indeed necessary for some parts of the catholic Church in respect of time and place, there seems to me a fairer plea for their institution in those times and places; but the controverted ceremonies among us seem to be necessary for the whole Church in every age, if at all necessary. Significant ceremonies of the same nature and reason with those perpetual ordinances that Christ has instituted for the universal Church may not be instituted by man, and particularly such as are made symbols of the Covenant of Grace and Christianity. In matters doubted among sober Christians, superiors should take heed of strict imposing, and thereby wresting the consciences of their subjects and overstraining them to a compliance with them, in derogation to God’s authority in their consciences. If superiors command that which is above their sphere to command, namely, things not necessary in genere, yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>

— John Corbet, Of Divine Worship, pt. 3, sect. 6 in Remains (London: Parkhurst, 1684)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+a+%E2%80%98ceremony%E2%80%99+I+understand+an+external+rite+in+or+about+the+worship+of+God.+By+%E2%80%98significant+ceremonies%E2%80%99+I+understand+rites+in+divine+worship+signifying+some+material+point+of+religion.+There+is+no+controversy+about+those+outward+actions+that+by+nature+or+general+custom+signify+the+reverence+of+the+mind%2C+as+kneeling+and+lifting+up+our+eyes+and+hands+to+Heaven+in+token+of+devotion+to+the+God+of+Heaven%2C+and+being+uncovered+in+prayer%2C+etc.+But+the+question+is+of+those+that+signify+merely+by+the+force+of+authoritative+institution+or+private+arbitrary+intention.+Such+significant+things%2C+though+they+may+have+some+natural+aptitude+to+signify+such+and+such+points+of+religion%2C+yet+they+do+not+actually+signify%2C+but+%5Bonly+signify%5D+as+arbitrarily+designed+thereunto.+It+is+generally+received+that+significant+ceremonies+in+taking+an+oath+may+lawfully+be+used%2C+and+that+not+only+such+as+naturally+signify%2C+as+lifting+up+the+hand+towards+Heaven%2C+but+such+also+as+signify+by+institution%2C+as+laying+the+hand+on+a+book+or+kissing+the+book.+Now+though+the+end+of+an+oath+may+be+a+civil+thing%2C+as+the+ending+of+a+controversy%2C+yet+the+formal+of+it+is+divine+worship.+And+the+aforesaid+ceremonies+are+expressive+of+the+very+external+part+of+it%2C+and+they+actually+signify+by+force+of+institution.+Words+signify+by+general+custom%2C+and+have+the+same+sense+out+of+the+worship+of+God+as+in+it%3B+and+therefore+the+arguing+from+their+lawfulness+as+signs+of+worship+unto+the+lawfulness+of+instituted+signs+seems+liable+to+exception.+Nevertheless+it+may+be+said+that+instituted+signs+soon+become+customary+and+as+well+understood+as+words.+The+Christians+heretofore%2C+being+among+infidels%2C+might+lawfully+have+the+figure+of+the+cross+somewhere+visible+about+them+to+show+that+they+were+Christians.+For+the+meaning+was+no+more+than+if+they+had+said%2C+%E2%80%9CWe+are+Christians.%E2%80%9D+But+it+may+be+replied+this+was+no+act+of+divine+worship%2C+but+an+indicant+or+speaking+sign+towards+men.+With+acknowledgment+of+my+own+weakness%2C+I+express+my+apprehensions+of+this+matter.+God+has+allowed+words+for+signs+expressive+of+divine+worship%2C+but+I+find+not+that+He+has+allowed+words+only+and+forbidden+gestures+and+actions+for+such+an+end.+The+dumb+%5Bwho+can%E2%80%99t+speak%5D+must+express+their+internal+worship+by+gestures+and+actions+or+they+cannot+externally+worship+God+at+all.+If+signs+of+devotion+that+are+of+customary+signification+be+lawful%2C+I+see+not+why+such+as+are+of+instituted+signification+should+be+unlawful%2C+and+especially+when+they+become+as+customary%2C+as+those+that+have+been+without+institution.+And+if+instituted+signs+of+devotion+in+general+be+lawful%2C+I+see+not+why+signs+of+some+special+part+of+devotion%2C+or+mystery+in+religion%2C+should+be+unlawful.+I+am+more+confident+of+the+warrantableness+of+rites+and+ceremonies+of+worship+that+are+used+only+instead+of+so+many+words+pronounced%2C+than+of+those+that+are+added+to+words+for+their+more+solemn+ratification%2C+as+seals+are+to+a+writing+or+federal+signs+to+a+verbal+contract.+Nevertheless%2C+the+forementioned+ceremonies+of+swearing+seem+added+to+the+words+of+the+oath+for+more+solemn+ratification%3B+and+it+alters+not+the+case+whether+the+words+be+read+by+him+that+administers+or+pronounced+by+him+that+takes+the+oath%2C+for+either+way+they+are+his+words+that+takes+the+oath.+Likewise+I+have+more+confidence+of+the+warrantableness+of+those+significant+ceremonies+that+are+of+private+arbitrary+intention+than+of+those+that+are+of+authoritative+institution%3B+also+of+those+that+are+used+occasionally+and+pro+hic+et+nunc+%5Bfor+here+and+now%5D%2C+than+of+those+that+are+used+statedly.+Furthermore+I+apprehend+that+significant+ceremonies+of+divine+worship+are+more+apt+to+degenerate+into+superstition%3B+and+if+they+be+multiplied%2C+that+religion+is+therewith+loaded+as+with+unprofitable+luggage%3B+and+that+it+is+a+form+of+religion+rather+Mosaic+than+evangelical%2C+wherein+spiritual+worship+is+most+regarded.+I+think+also+that+significant+ceremonies+are+not+necessary+in+genere%2C+as+those+things+are+which+are+left+to+the+determination+of+human+authority%2C+and+so+not+to+be+instituted+and+imposed+in+the+ordinary+divine+service.+I+apprehend+that+our+Lord+Christ+has+instituted+all+those+stated+ordinances+of+positive+worship+that+are+necessary+to+the+Church+universal%2C+and+therefore+that+more+of+the+same+nature+are+not+to+be+devised+by+men.+If+any+significant+ceremonies+be+indeed+necessary+for+some+parts+of+the+catholic+Church+in+respect+of+time+and+place%2C+there+seems+to+me+a+fairer+plea+for+their+institution+in+those+times+and+places%3B+but+the+controverted+ceremonies+among+us+seem+to+be+necessary+for+the+whole+Church+in+every+age%2C+if+at+all+necessary.+Significant+ceremonies+of+the+same+nature+and+reason+with+those+perpetual+ordinances+that+Christ+has+instituted+for+the+universal+Church+may+not+be+instituted+by+man%2C+and+particularly+such+as+are+made+symbols+of+the+Covenant+of+Grace+and+Christianity.+In+matters+doubted+among+sober+Christians%2C+superiors+should+take+heed+of+strict+imposing%2C+and+thereby+wresting+the+consciences+of+their+subjects+and+overstraining+them+to+a+compliance+with+them%2C+in+derogation+to+God%E2%80%99s+authority+in+their+consciences.+If+superiors+command+that+which+is+above+their+sphere+to+command%2C+namely%2C+things+not+necessary+in+genere%2C+yet+if+they+be+not+simply+evil%2C+subjects+may+do+those+things%2C+unless+they+be+evil+in+their+consequence+to+a+higher+degree+than+the+not+doing+of+them+would+be.+In+this+case+it+is+not+formal+obedience%2C+but+they+are+done+for+the+end%E2%80%99s+sake+and+to+avoid+evil.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%2C+pt.+3%2C+sect.+6+in+Remains+%28London%3A+Parkhurst%2C+1684%29&amp;url=htt

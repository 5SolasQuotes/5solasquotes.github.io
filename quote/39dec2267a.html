<blockquote><p>48. In whatever God wills He is universally effectual; He is not hindered or frustrated in obtaining what He wills. For if He should properly will anything and not attain it He would not be wholly perfect and blessed. … 53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology (d. 1633; 1997), bk. 1, ch. 7</cite>, pp. 99-100</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57db1848de" data-kw="">
<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter trans. Johnson &amp; Fentiman (RBO, 2019) | Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’, pp. 57-58</cite>, ch. 2, ‘On God’; pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3f80f93133" data-kw="">
<blockquote><p>Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature, or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature. (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved, as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 13</span></figcaption>

<blockquote><p>[Edward Leigh:] ‘God is patient, Psalm 103:8; Job. 21:7. God’s patience is that whereby He bears the reproach of sinners and defers their punishments; or it is the most bountiful will of God, whereby He doth long bear with sin which He hates, sparing sinners, not minding their destruction, but that He might bring them to repentance. See Acts 13:18.’¹ … It is, thus, ‘the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but He does warn them beforehand, lightly correct and seek to turn them unto Him.’² ¹ Leigh, Body of Divinity, II.xiii (p. 299), citing marginally Nahum 1:3 and Isa. 30:18; cf. Cocceius, Summa theol., III.x.67. ² Leigh, Treatise, II.xiii (p. 106).</p></blockquote>

<blockquote><p>3. Above, indeed, we proved that there is not in God a conditioned will properly so called, although rewards and punishments are proposed to us conditionally: For these differ as much as heaven from earth. Eternal life is conditional, but the sacred oracles do not know of a will of God to give eternal life that is conditional. For there was in God a will by which these things were concatenated, the establishment of Saul’s kingdom and the obedience of Saul, just as the vision of miracles and the conversion of the Tyrians are concatenated, as I mentioned above. Would the establishment of the kingdom have followed the obedience of Saul in this sense, but God had both decreed and long before predicted through the patriarch Jacob, Gen. 49:10, that royal power would be with the tribe of Judah, and that Shiloh, that is, Christ, would arise from him? What? Would that promise have been false if Saul had obeyed? What kind of dreams are these? Corvinus will say (in the cited location), if God had established the kingdom for Saul on the condition that he obeyed, then He would have wished to establish it. ‘For if’ (he says) ‘God had done that, the condition being posited, He surely wished to do it before the condition was fulfilled, under that law, if it were fulfilled.’ A conditional will includes two things (Alvarez, disp. 22, ad fig. 8): 1. Formally and expressly, an affection of simple complacency. 2. Eminently and implicitly, [there is] an efficacious and absolute will, which indeed does not actually exist, but nevertheless would exist if the condition were fulfilled; but insofar as it is turned into an absolute [will] through the fulfillment of the condition, it is called conditional. Response: 1. There is no consequence [in the argument]. If God had established Saul’s kingdom on the hypothesis of obedience, Corvinus, according to his custom, fraudulently assumes this, but does not prove it. Would that he had brought forward an argument! For this alone follows: ‘Therefore He would have willed and decreed to establish it, if He had established it,’ which is most true and by us in no way denied. But because God sends a Savior if men are sinners, it in no way follows: ‘Therefore He decreed to send a Savior on the hypothesis that men are sinners.’ For God’s eternal decree in no way depends upon a temporal condition to be fulfilled by men, for otherwise it would not be eternal. 2. If God had established Saul’s kingdom, He would have decreed to establish it; if He had decreed to establish it, He would also have decreed to work obedience in Saul by efficacious grace, just as He provided this in David. Therefore, from the condition having been fulfilled, there would have followed the temporal and external act of God, but in no way from the same would there have followed the eternal and immanent act. What? Would it be in the power of the creature that there should be eternal acts and eternal volitions in God? Then it would be in the power of the creature that God’s will should exist, and consequently that God Himself should exist; for God’s volitions are the same as God Himself. 3. He says that the conditional will comprises an affection of simple complacency, that is, an absolute volition. Does God therefore absolutely love and will eternal life for Judas, and also conditionally will eternal life for Judas? But these are contradictory. For if God [wills] salvation of the Jew simply, then He would also effect that (Alvarez, disp. 22, ad fig. 8); and therefore he still begs the question. 4. He says that a conditional will eminently contains the absolute will of God, which is not in act, yet would be if the condition were fulfilled, but he foreknows from eternity that the condition will never be fulfilled. How, therefore, does a conditional will, either eminently or formally, contain such an efficacious will, which God both foreknows and decrees will never be? This is a dream. 5. Is not the condition to be fulfilled such a thing upon which the absolute will of God depends? The Arminians deny this, for they do not wish for the first cause to be suspended from the second. 6. “According as it is turned into the absolute,” he says, “it is called conditional.” But truly, change the word “turned” into the word “changed,” and then the eternal conditional will of God is changed into an absolute one. Is the will of God so mutable? But how is the natural desire of God turned into an absolute decree, and then the same will of God will be both natural and free, that is, free and not free? If God has now ceased to will the salvation of the believing elect by an antecedent will, and now absolutely wills them to be saved because they believe, then an end is given to the eternal desire of God. But truly, since He desires the salvation of the elect because He is good toward His creatures, if that desire has now vanished as having been changed into an absolute will, He ceases to be good toward believers. 7. This absolute will, once the condition has been fulfilled, either follows necessarily or contingently. If necessarily, then the efficacious decree of God concerning the salvation of believers is not free, but follows necessarily, by a necessity of nature, from the act of man; and yet Arminius himself concedes that election is a free decree. But if it follows contingently, or freely, from the decree, then God decreed to decree, He willed to will absolutely the salvation of believers. How absurd it is that He should first decree to decree, before He decrees! But this is to posit a progression to infinity. (Alvarez, disp. 22, ad fig. 8)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. Above, indeed, we proved that there is not in God a conditioned will properly so called, although rewards and punishments are proposed to us conditionally: For these differ as much as heaven from earth. Eternal life is conditional, but the sacred oracles do not know of a will of God to give eternal life that is conditional. For there was in God a will by which these things were concatenated, the establishment of Saul’s kingdom and the obedience of Saul, just as the vision of miracles and the conversion of the Tyrians are concatenated, as I mentioned above. Would the establishment of the kingdom have followed the obedience of Saul in this sense, but God had both decreed and long before predicted through the patriarch Jacob, Gen. 49:10, that royal power would be with the tribe of Judah, and that Shiloh, that is, Christ, would arise from him? What? Would that promise have been false if Saul had obeyed? What kind of dreams are these? Corvinus will say (in the cited location), if God had established the kingdom for Saul on the condition that he obeyed, then He would have wished to establish it. ‘For if’ (he says) ‘God had done that, the condition being posited, He surely wished to do it before the condition was fulfilled, under that law, if it were fulfilled.’ A conditional will includes two things (Alvarez, disp. 22, ad fig. 8): 1. Formally and expressly, an affection of simple complacency. 2. Eminently and implicitly, [there is] an efficacious and absolute will, which indeed does not actually exist, but nevertheless would exist if the condition were fulfilled; but insofar as it is turned into an absolute [will] through the fulfillment of the condition, it is called conditional. Response: 1. There is no consequence [in the argument]. If God had established Saul’s kingdom on the hypothesis of obedience, Corvinus, according to his custom, fraudulently assumes this, but does not prove it. Would that he had brought forward an argument! For this alone follows: ‘Therefore He would have willed and decreed to establish it, if He had established it,’ which is most true and by us in no way denied. But because God sends a Savior if men are sinners, it in no way follows: ‘Therefore He decreed to send a Savior on the hypothesis that men are sinners.’ For God’s eternal decree in no way depends upon a temporal condition to be fulfilled by men, for otherwise it would not be eternal. 2. If God had established Saul’s kingdom, He would have decreed to establish it; if He had decreed to establish it, He would also have decreed to work obedience in Saul by efficacious grace, just as He provided this in David. Therefore, from the condition having been fulfilled, there would have followed the temporal and external act of God, but in no way from the same would there have followed the eternal and immanent act. What? Would it be in the power of the creature that there should be eternal acts and eternal volitions in God? Then it would be in the power of the creature that God’s will should exist, and consequently that God Himself should exist; for God’s volitions are the same as God Himself. 3. He says that the conditional will comprises an affection of simple complacency, that is, an absolute volition. Does God therefore absolutely love and will eternal life for Judas, and also conditionally will eternal life for Judas? But these are contradictory. For if God [wills] salvation of the Jew simply, then He would also effect that (Alvarez, disp. 22, ad fig. 8); and therefore he still begs the question. 4. He says that a conditional will eminently contains the absolute will of God, which is not in act, yet would be if the condition were fulfilled, but he foreknows from eternity that the condition will never be fulfilled. How, therefore, does a conditional will, either eminently or formally, contain such an efficacious will, which God both foreknows and decrees will never be? This is a dream. 5. Is not the condition to be fulfilled such a thing upon which the absolute will of God depends? The Arminians deny this, for they do not wish for the first cause to be suspended from the second. 6. “According as it is turned into the absolute,” he says, “it is called conditional.” But truly, change the word “turned” into the word “changed,” and then the eternal conditional will of God is changed into an absolute one. Is the will of God so mutable? But how is the natural desire of God turned into an absolute decree, and then the same will of God will be both natural and free, that is, free and not free? If God has now ceased to will the salvation of the believing elect by an antecedent will, and now absolutely wills them to be saved because they believe, then an end is given to the eternal desire of God. But truly, since He desires the salvation of the elect because He is good toward His creatures, if that desire has now vanished as having been changed into an absolute will, He ceases to be good toward believers. 7. This absolute will, once the condition has been fulfilled, either follows necessarily or contingently. If necessarily, then the efficacious decree of God concerning the salvation of believers is not free, but follows necessarily, by a necessity of nature, from the act of man; and yet Arminius himself concedes that election is a free decree. But if it follows contingently, or freely, from the decree, then God decreed to decree, He willed to will absolutely the salvation of believers. How absurd it is that He should first decree to decree, before He decrees! But this is to posit a progression to infinity. (Alvarez, disp. 22, ad fig. 8)”

— Samuel Rutherford, Apologetic Exercitations (Amsterdam: Laurentius, 1636), Exercise 2, ch. 4, ‘On the Antecedent &amp; Consequent Will of God’, pp. 323-63 tr. AI by The Faith Received Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Above%2C+indeed%2C+we+proved+that+there+is+not+in+God+a+conditioned+will+properly+so+called%2C+although+rewards+and+punishments+are+proposed+to+us+conditionally%3A+For+these+differ+as+much+as+heaven+from+earth.+Eternal+life+is+conditional%2C+but+the+sacred+oracles+do+not+know+of+a+will+of+God+to+give+eternal+life+that+is+conditional.+For+there+was+in+God+a+will+by+which+these+things+were+concatenated%2C+the+establishment+of+Saul%E2%80%99s+kingdom+and+the+obedience+of+Saul%2C+just+as+the+vision+of+miracles+and+the+conversion+of+the+Tyrians+are+concatenated%2C+as+I+mentioned+above.+Would+the+establishment+of+the+kingdom+have+followed+the+obedience+of+Saul+in+this+sense%2C+but+God+had+both+decreed+and+long+before+predicted+through+the+patriarch+Jacob%2C+Gen.+49%3A10%2C+that+royal+power+would+be+with+the+tribe+of+Judah%2C+and+that+Shiloh%2C+that+is%2C+Christ%2C+would+arise+from+him%3F+What%3F+Would+that+promise+have+been+false+if+Saul+had+obeyed%3F+What+kind+of+dreams+are+these%3F+Corvinus+will+say+%28in+the+cited+location%29%2C+if+God+had+established+the+kingdom+for+Saul+on+the+condition+that+he+obeyed%2C+then+He+would+have+wished+to+establish+it.+%E2%80%98For+if%E2%80%99+%28he+says%29+%E2%80%98God+had+done+that%2C+the+condition+being+posited%2C+He+surely+wished+to+do+it+before+the+condition+was+fulfilled%2C+under+that+law%2C+if+it+were+fulfilled.%E2%80%99+A+conditional+will+includes+two+things+%28Alvarez%2C+disp.+22%2C+ad+fig.+8%29%3A+1.+Formally+and+expressly%2C+an+affection+of+simple+complacency.+2.+Eminently+and+implicitly%2C+%5Bthere+is%5D+an+efficacious+and+absolute+will%2C+which+indeed+does+not+actually+exist%2C+but+nevertheless+would+exist+if+the+condition+were+fulfilled%3B+but+insofar+as+it+is+turned+into+an+absolute+%5Bwill%5D+through+the+fulfillment+of+the+condition%2C+it+is+called+conditional.+Response%3A+1.+There+is+no+consequence+%5Bin+the+argument%5D.+If+God+had+established+Saul%E2%80%99s+kingdom+on+the+hypothesis+of+obedience%2C+Corvinus%2C+according+to+his+custom%2C+fraudulently+assumes+this%2C+but+does+not+prove+it.+Would+that+he+had+brought+forward+an+argument%21+For+this+alone+follows%3A+%E2%80%98Therefore+He+would+have+willed+and+decreed+to+establish+it%2C+if+He+had+established+it%2C%E2%80%99+which+is+most+true+and+by+us+in+no+way+denied.+But+because+God+sends+a+Savior+if+men+are+sinners%2C+it+in+no+way+follows%3A+%E2%80%98Therefore+He+decreed+to+send+a+Savior+on+the+hypothesis+that+men+are+sinners.%E2%80%99+For+God%E2%80%99s+eternal+decree+in+no+way+depends+upon+a+temporal+condition+to+be+fulfilled+by+men%2C+for+otherwise+it+would+not+be+eternal.+2.+If+God+had+established+Saul%E2%80%99s+kingdom%2C+He+would+have+decreed+to+establish+it%3B+if+He+had+decreed+to+establish+it%2C+He+would+also+have+decreed+to+work+obedience+in+Saul+by+efficacious+grace%2C+just+as+He+provided+this+in+David.+Therefore%2C+from+the+condition+having+been+fulfilled%2C+there+would+have+followed+the+temporal+and+external+act+of+God%2C+but+in+no+way+from+the+same+would+there+have+followed+the+eternal+and+immanent+act.+What%3F+Would+it+be+in+the+power+of+the+creature+that+there+should+be+eternal+acts+and+eternal+volitions+in+God%3F+Then+it+would+be+in+the+power+of+the+creature+that+God%E2%80%99s+will+should+exist%2C+and+consequently+that+God+Himself+should+exist%3B+for+God%E2%80%99s+volitions+are+the+same+as+God+Himself.+3.+He+says+that+the+conditional+will+comprises+an+affection+of+simple+complacency%2C+that+is%2C+an+absolute+volition.+Does+God+therefore+absolutely+love+and+will+eternal+life+for+Judas%2C+and+also+conditionally+will+eternal+life+for+Judas%3F+But+these+are+contradictory.+For+if+God+%5Bwills%5D+salvation+of+the+Jew+simply%2C+then+He+would+also+effect+that+%28Alvarez%2C+disp.+22%2C+ad+fig.+8%29%3B+and+therefore+he+still+begs+the+question.+4.+He+says+that+a+conditional+will+eminently+contains+the+absolute+will+of+God%2C+which+is+not+in+act%2C+yet+would+be+if+the+condition+were+fulfilled%2C+but+he+foreknows+from+eternity+that+the+condition+will+never+be+fulfilled.+How%2C+therefore%2C+does+a+conditional+will%2C+either+eminently+or+formally%2C+contain+such+an+efficacious+will%2C+which+God+both+foreknows+and+decrees+will+never+be%3F+This+is+a+dream.+5.+Is+not+the+condition+to+be+fulfilled+such+a+thing+upon+which+the+absolute+will+of+God+depends%3F+The+Arminians+deny+this%2C+for+they+do+not+wish+for+the+first+cause+to+be+suspended+from+the+second.+6.+%E2%80%9CAccording+as+it+is+turned+into+the+absolute%2C%E2%80%9D+he+says%2C+%E2%80%9Cit+is+called+conditional.%E2%80%9D+But+truly%2C+change+the+word+%E2%80%9Cturned%E2%80%9D+into+the+word+%E2%80%9Cchanged%2C%E2%80%9D+and+then+the+eternal+conditional+will+of+God+is+changed+into+an+absolute+one.+Is+the+will+of+God+so+mutable%3F+But+how+is+the+natural+desire+of+God+turned+into+an+absolute+decree%2C+and+then+the+same+will+of+God+will+be+both+natural+and+free%2C+that+is%2C+free+and+not+free%3F+If+God+has+now+ceased+to+will+the+salvation+of+the+believing+elect+by+an+antecedent+will%2C+and+now+absolutely+wills+them+to+be+saved+because+they+believe%2C+then+an+end+is+given+to+the+eternal+desire+of+God.+But+truly%2C+since+He+desires+the+salvation+of+the+elect+because+He+is+good+toward+His+creatures%2C+if+that+desire+has+now+vanished+as+having+been+changed+into+an+absolute+will%2C+He+ceases+to+be+good+toward+believers.+7.+This+absolute+will%2C+once+the+condition+has+been+fulfilled%2C+either+follows+necessarily+or+contingently.+If+necessarily%2C+then+the+efficacious+decree+of+God+concerning+the+salvation+of+believers+is+not+free%2C+but+follows+necessarily%2C+by+a+necessity+of+nature%2C+from+the+act+of+man%3B+and+yet+Arminius+himself+concedes+that+election+is+a+free+decree.+But+if+it+follows+contingently%2C+or+freely%2C+from+the+decree%2C+then+God+decreed+to+decree%2C+He+willed+to+will+absolutely+the+salvation+of+believers.+How+absurd+it+is+that+He+should+first+decree+to+decree%2C+before+He+decrees%21+But+this+is+to+posit+a+progression+to+infinity.+%28Alvarez%2C+disp.+22%2C+ad+fig.+8%29%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Apologetic+Exercitations+%28Amsterdam%3A+Laurentius%2C+1636%29%2C+Exercise+2%2C+ch.+4%2C+%E2%80%98On+the+Antecedent+%26+Consequent+Will+of+God%E2%80%99%2C+pp.+323-63+tr.+AI+by+The+Faith+Received+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03bc725315.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03bc725315.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=3.%20Above%2C%20indeed%2C%20we%20proved%20that,Alvarez%2C%20disp.%2022%2C%20ad%20fig.%208&amp;text=3.%20Above%2C%20indeed%2C%20we%20proved%20that%20there%20is&amp;text=to%20infinity.%20%28Alvarez%2C%20disp.%2022%2C%20ad%20fig.%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

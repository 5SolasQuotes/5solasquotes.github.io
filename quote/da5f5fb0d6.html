<main class="wrap"><figure class="quote" id="q-da5f5fb0d6" data-kw="">
<blockquote><p>Beware therefore Kings and Princes, beware kingdoms and common-wealths. Beware of false prophets, which come to you in sheep’s clothing, but inwardly are ravening wolves. And thou Britain especially Scotland, my dear country, the purest portion of Christ’s Church in the world this day, assure thy self, and I assure thee, for I know it, that thy good people are as sheep in the midst of wolves, be ye therefore (heads and members thereof) wise as serpents Casting out this bound woman and her Son, by the execution of the Law, of the kingdom, ad amussim, punctually, not granting them a pecunial [sic] liberty of conscience, or any toleration whatsoever, and GOD will help you, yet notwithstanding your imminent dangers, whereof I shall advertise you in the end of this discourse; otherwise your liberties and kingdoms are lost, and Antichrist hath prevailed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-abernethy.html">Thomas Abernethy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abjuration of popery, by Thomas Abernethy: sometime Jesuit, but not penitent sinner, and an unworthy member of the true Reformed Church of God in Scotland, at Edinburgh, in the Gray-frier church, the 24 of August, 1638</cite>, (Edinburgh: George Anderson, 1638), p. 17.</span></figcaption>

<blockquote><p>I answer that, Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, question 158, ‘Anger’ in Summa, 2nd pt. of 2nd pt.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…”

— Martin Bucer, Other citations (work not named), On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 54, ‘Honest Games’, pp. 352-53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+from+gymnastic+art+those+sports+will+have+to+be+proposed+to+youth+which%2C+besides+what+they+contribute+to+the+health+and+preservation+of+the+body+and+the+production+of+graceful+movements%2C+also+render+men+fit+and+ready+for+military+service+and+the+advantageous+use+of+arms.+Young+men+should+therefore+exercise+themselves+in+running%2C+jumping%2C+wrestling%2C+horseback+riding%2C+the+handling+of+all+arms+and+weapons+which+are+used+for+open+and+hand-to-hand+combat%2C+the+arrangement+of+battle+formations%2C+the+positioning+of+camp%2C+and+mock+battle+%28Plato%2C+Laws%2C+VII%2C+803c%2C+813d-e%29.+To+these%2C+nobles+may+add+the+exercise+of+hunting.+These+exercises+which+pertain+to+military+science+ought+to+be+so+constituted+and+conducted+in+such+a+serious+manner+that+they+approximate+as+much+as+possible+the+actual+operations+of+war%2C+as+Plato+has+said+%28Plato%2C+Laws+VII%2C+824+a-c%29%E2%80%A6+according+to+the+words+of+the+psalm%3A+%E2%80%98It+is+God+who+girds+me+with+strength+for+war+and+prepares+my+path%E2%80%99+%28Ps.+18%3A32%29.+In+charge+of+these+sports%2C+as+of+the+kind+previously+mentioned%2C+there+should+always+be+men+singularly+experienced+in+the+field+involved%2C+men+of+universal+wisdom+most+zealous+for+all+piety+and+virtue%2C+who+are+admired+and+therefore+have+the+authority+and+power+to+relate+and+to+adapt+all+youthful+sport+to+a+zeal+for+and+practice+of+the+virtues%2C+which+is+the+one+goal+of+all+sports+among+Christians%3B+for+we+have+been+created+for+the+praise+of+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Other+citations+%28work+not+named%29%2C+On+the+Reign+of+Christ+in+Melanchthon+%26+Bucer%2C+ed.+Wilhelm+Pauck+%28Philadelphia%3A+Westminster+Press%2C+1969%29%2C+bk.+2%2

<main class="wrap"><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England</cite>, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e9215f958" data-kw="">
<blockquote><p>Neither may they forbid a communion with them in good because all communion in evil is denied us. Neither to hear them preach evil or untruth is to communicate with them in evil, except we yield to, believe, or obey their evil. And so those Scriptures forbidding to hear are to be understood. For Jeremiah did hear the false prophet Hananiah and said ‘amen’ to his prayer (Jer. 28:6). That is, to that good, or to those words of his prayer which might be taken well, he answered ‘so be it, the Lord ratify they words,’ but yet he reproved the evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), 3. ‘A Reproof of Certain Schismatical Persons,’</cite>, pp. 225-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-f251732d51" data-kw="">
<blockquote><p>17. As God has not tied us to words in prayer or preaching (though he have recorded many forms in Scripture), but left all to choose what words, time and circumstances make fit (by book, or without) so the conveniences and inconveniences both of set forms and of free speaking are on each part so great and undeniable that we have no cause to censure that Church which uses both; that is, which agrees on a set form to show what the Church professes to own, if the minister should blutter out any error or indecency, and yet not restrain ministers from the due use of free speech. 18. It is a great sin out of a fond conceit of the excellency of either way above its due value to think and speak with unjust vilifying of the other way when God has tied us to neither alone: It is contrary to knowledge, love, peace and concord out of a self-conceitedness, peevishness or false prejudice received from others to think and speak worse of other men’s words in prayer than they deserve and to frighten the ignorant from lawful communion by calling that sin or false worship that is not so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | On Free Prayer with Forms</cite></span></figcaption>

rget="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e8c1086815" data-kw="">
<blockquote><p>24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad3beebfd8" data-kw="">
<blockquote><p>Rutherford, in the following year, joined in [Charles] Herle’s crusade against Congregationalism with his famous work, ‘The Due Right of Prebyteries’ (1644). In reply to Herle, [Richard] Mather and William Tompson published, ‘A Modest &amp; Brotherly Answer To Mr. Charles Herle’ (1644). Also, refuting both Herle and Rutherford, Mather wrote another work, ‘A Reply to Mr. Rutherford’ (1647). It should be remembered that Rutherford’s The Due Right of Prebyteries (1644) itself was his critical review of both Mather’s ‘Church Government and Church Covenant Discussed’ (1643) and [John] Cotton’s ‘The Way Of The Churches Of Christ In New-England’, whose manuscript was widely circulated in England even a few years before its publication in 1645. By 1644, Rutherford was already involved in another round of debate, which was set off by John Cotton. Particularly, Cotton’s ‘The Keys Of The Kingdom Of Heaven’ (1644) was so influential in England that John Owen, a Presbyterian, became convinced that Cotton was right and, finally, supported the Congregational form of church government.¹ ¹ See John Owen’s Preface in A Defence of Mr. John Cotton from the Imputation of Self-Contradiction Charged on Him by Mr. Daniel Cawdrey (Oxford: H. Hall for T. Robinson, 1658)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, or a Peaceable Plea for the Government of the Church of Scotland… (London, 1644) ToC | Sang Ahn, Covenant in Conflict</cite>, pp. 61:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-56c9eecbf0" data-kw="">
<blockquote><p>They [Brownists] except against our ministers because they receive their ordination from bishops. To which I answer: We have our ordination from Christ by bishops and clergymen; and for this kind of ordination by bishops and presbyters we have the universal consent of the primitive Church; by St. Paul, Timothy, and Titus were ordained. And this has been the practice of all the Christian Churches of the universe until the time that Anabaptists crept into the world. But they will allege that we have been ordained by Antichristian bishops, and therefore they conclude every action done by our ministers to be Antichristian. To which I answer: Why is not the ordination that our forefathers had from Antichristian bishops as effectual as the baptism that was administered by them to our forefathers? Did ever any Reformed Church rebaptize them that were baptized by them? And why should our ministers be reordained more than rebaptized? Indeed our ministers being ordained by bishops and that by Protestant bishops, such as Cranmer, Latimer and Ridley, who were holy martyrs, who renounced all superstition; what exceptions can be taken against them? Neither can they find any shelter under that noted text, ‘neglect not the gift that is in thee by the imposition of the hands of the presbytery,’ which learned Mr. [John] Calvin expounds not of the men, but of the office, following herein Jerome, Anselm, Haimo, Lyra, referring it to the gift given him and to the bishops and presbyters, which has been the practice of the Church of England and all Christian Churches in the world until the Anabaptists. To conclude, let the Brownists confess our bishops to be but Christians, which they cannot deny, and the ordination of our ministers will be lawful by their own rules: for if the ordination of their ministers by plebeian artificers be lawful, how much more is the ordination of our ministers by bishops and learned ministers, qualified with learning and wisdom and set apart to do the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times (London: Wilson, 1645), ‘Of the Brownists’, 15. ‘Except against our Ordination’</cite>, p. 60</span></figcaption>

</figure><figure class="quote" id="q-94c6016077" data-kw="">
<blockquote><p>In England it [civilly] belongs: 1. to the patron to present; 2. to the bishop to ordain and institute, and therefore to approve and invest; 3. to the people jure divino to be free consenters; 4. and to the magistrate to protect and to judge who shall be protected or tolerated under him. If now these four parties be for four ministers or for three, or two several men, and cannot agree in one, the culpable dissenters will be the causes of the schism.</p></blockquote>

<blockquote><p>Last of all, we are to distinguish between the condition of the primitive churches, before the division of parishes, and the state of our churches now after such division. At the first, when the multitude of Christians in those great cities of Rome, Corinth, Ephesus, etc. was not divided into several parishes, the common presbytery in the city did suffice for the government of the whole [as described in the N.T.], and there was no need of a particular consistory [session] of elders for every assembly and congregation of Christians within the city, except perhaps to admonish, rebuke or exhort, or to take notice of such things as were to be brought into the common presbytery. But after that parishes were divided, and Christian congregations planted in the rural villages, as well as in the cities, from henceforth it was necessary that every congregation should have at hand, within itself, a certain consistory, for some acts of church government, though still those of greater importance were reserved to the greater presbytery… If it be said that I seem to deny the divine right of the same, or that they have any warrant from the pattern of the apostolic Church, I answer: I acknowledge the conformity of the same with the pattern thus far: 1. It is to be suposed that in some small cities (especially the same not being wholly converted to the Christian faith) there was but one Christian congregation, the eldership whereof did manage matters of jurisdiction proper thereto. 2. Even in the great cities, at the first there was but one congregation of Christians, and so but one particular eldership. 3. After that the Gospel had spread, and Christians were multiplied in those great cities, it is true, they were all governed by a common presbytery, but that presbytery was not remote, but ready at hand among themselves. Now in this we keep ourselves as close to the pattern, as the alteration of the Church’s condition by the division of parishes will suffer us, that is to say, we have a common presbytery for governing the congregations within a convenient circuit, but withal our congregations have, ad manum, among themselves, an inferior eldership for lesser acts of government; though in respect of the distance of the seat of the common presbytery from sundry of our parishes, they cannot have that ease and benefit of neareness which the apostolic Churches had, yet by the particular elderships they have as great ease of this kind as conveniently can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland... (Edinburgh: 1641), pt. 2</cite>, ch. 2, 128-30</span></figcaption>

sion of parishes will suffer us, that is to say, we have a common presbytery for governing the congregations within a convenient circuit, but withal our congregations have, ad manum, among themselves, an inferior eldership for lesser acts of government; though in respect of the distance of the seat of the common presbytery from sundry of our parishes, they cannot have that ease and benefit of neareness which the apostolic Churches had, yet by the particular elderships they have as great ease of this kind as conveniently can be.”

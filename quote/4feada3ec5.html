<main class="wrap"><figure class="quote" id="q-4feada3ec5" data-kw="">
<blockquote><p>XIX. …it is one thing to be in the external communion of the church (which we readily grant and according to it the apostate are truly said to go out when they fall away); another to be in it also by internal communion (in which sense John denies that such were of us).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, 3rd Question, ‘Besides the elect, are reprobates and infidels (whether secret or open) also true members of the church of Christ? We deny against the Romanists., p. 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f537cdcf5" data-kw="">
<blockquote><p>The which thing St. Ambrose teaches us saying (De Salubr., ch. 7), that the catholic Church is that where God speaks with his servants: and St. Augustine also (contra Cresco. Gramat., bk. •, ch. 11 etc.), where He places the ministry of ministers and pastors of the Church, in the Word of God and sacraments. Let us yet add hereunto the third mark of this Church, albeit it be not of the substance, but outward, to wit, the lawful vocation of pastors and ministers of the Church, which have the administration of the things aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>

</figure><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 54</span></figcaption>

</figure><figure class="quote" id="q-7f7f44081b" data-kw="">
<blockquote><p>…nor is it inconvenient to say that Papists as baptized and under that reduplication are members of the visible Church, though as baptized thus and thus they be not members of the true, visible Church, professing the sound faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, p. 219</span></figcaption>

— Samuel Rutherford, The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5, p. 219">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6nor+is+it+inconvenient+to+say+that+Papists+as+baptized+and+under+that+reduplication+are+members+of+the+visible+Church%2C+though+as+baptized+thus+and+thus+they+be+not+members+of+the+true%2C+visible+Church%2C+professing+the+sound+faith.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%E2%80%A6+%28London%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+section+5%2C+p.+219&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f7f44081b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f7f44081b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-church#:~:text=nor%20is%20it%20inconvenient%20to%20say,visible%20Church%2C%20professing%20the%20sound%20faith&amp;text=nor%20is%20it%20inconvenient%20to%20say%20that%20Papists&amp;text=the%20true%2C%20visible%20Church%2C%20professing%20the%20sound%20faith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-abd7767cf3" data-kw="">
<blockquote><p>Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized; not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such [by] that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 1, pp. 204-8, 229, 235 irregular numbering</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

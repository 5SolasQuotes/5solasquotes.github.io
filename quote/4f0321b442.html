<main class="wrap"><figure class="quote" id="q-4f0321b442" data-kw="">
<blockquote><p>For, 2. This would be acceptable to God. This ‘willing’ mind is accepted (2 Cor. 8:12), when accompanied with sincere endeavors. When men purpose that which is good, and endeavour according to their ability to perform also, God will accept of what they have, or can do, and not reject them for what they have not, and what is not in their power to do: and this is true as to other things besides the work of charity… It is accepted, indeed, where there is a performance as far as we are able, and when providence hinders the performance, as in David’s case concerning building a house for the Lord, 2 Sam. 7:1-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-mayo.html">Daniel Mayo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Henry’s Commentary, on 2 Corinthians, ch. 8, vv. 7-15 Mayo, an English puritan, was the continuator of 2 Corinthians after Henry died, using Henry’s outlines.</span></figcaption>

</figure><figure class="quote" id="q-01615fa0d0" data-kw="">
<blockquote><p>…it is a great consideration also: I know that Jesus Christ has given his people light in matters of this nature by degrees. Thousands of good souls that have been bred up and born in our assemblies, and enjoy the ordinances of God, and have done it comfortably, cannot suddenly take in other principles, you must wait upon Christ to do it. In this case, men are not to be wrought off by falsehoods [in exaggerations and extreme speaking and positions], God has no need of them. No, rather till men do take in light, you should give them all that is comfortable in the condition they are in; we should acknowledge every good thing in every man, in every church, in every thing, and that is a way to work upon men, and to prevail with them; as it is Philemon, verse 6: ‘That the communication of thy faith may become effectual by the acknowledgment of every good thing, which is in you in Christ Jesus.’ It is that which builds men up, by acknowledgment of every good thing that is in them.</p></blockquote>

<blockquote><p>Q. 138, ‘How may we know the Fundamentals, Essentials, or what parts are necessary to Salvation? And is the Papists way allowable that (some of them) deny that distinction, and make the difference to be only in the degrees of men’s opportunities of knowledge?’ …And whereas they [Papists] would make all the parts of Christian faith and practice equally necessary, where men have a capacity and ability to know, believe and practice them, it is a gross deceit… And thereby they make all sins and errors as equal as all duties and truths (James 3:2; 1 John 1, end). Whereas: 1. There is no man that has not some error and some sin. 2. There is no man that does all that ever he was able to do to understand all the truth. 3. Therefore there is no man whose errors themselves are not (many of them at least) culpable or sinful. 4. And they that distinguish between mortal and venial sins, and yet will not distinguish between mortal and venial errors, are either blind or would keep others blind. As it is not so damning a sin for a man to think a vain thought, or to speak a vain word, as not to love God or holiness (no though he was more able to have forborne that idle word than to have loved God), so it is not so mortal a sin (that is, inconsistent with a justified state) to mistake in a small matter (as who was the Father of Arphaxad, or what year the world was drowned in, etc.) as to blaspheme the Holy Ghost or deny Jesus Christ to be the Savior of the world, or to deny that there is a God or everlasting life, or a difference between good and evil. All sins are not equal in magnitude or danger. Therefore all errors are not equal in magnitude sinfulness or danger.</p></blockquote>

<blockquote><p>14. God has by nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances or accidents of this universal religion which are not themselves meet for an universal and unchangeable obligation, but [for] local, temporary and mutable [circumstances and obligations]: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin. I have often named many particulars, as: The translation of the Scripture, which to choose: the version of the Psalms in rhyme or meter, the common use of new made hymns,¹ the dividing the Scripture into chapter and verse, the words of sermons, their method, the particular text to be chosen, what chapters to read, at what hour to begin, how long to preach, in what words to pray, whether the same oft or changed, whether forestudied or not, whether written or unwritten, whether studied and written by ourselves or by others, where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? ¹ [Elsewhere Baxter speaks of, “the choice of psalms and hymns: the use of David’s are lawful and so are others: but no institution ties us to one, but leaves us to choose.” Schism Detected in Both Extremes (1684), pt. 2, pp. 5-6. This is plainly false: Ex. 15:20-21; 2 Sam. 23:1; 1 Chron. 25:1-7; 2 Chron. 29:25-30; Neh. 12:45-46; Ps. 95:2; etc. See ‘Singing of Psalms’.] Whether we be bareheaded or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit or be prostrate at prayer, etc. What distinctive garments pastors shall use, by what signs of consent and obligation men vow and swear, whether by putting the hand under the thigh [Gen. 24:2, 9; 47:29], lifting it up [Gen. 14:22; Dt. 32:40], subscribing, laying it on the Book,² kissing the Book,³ etc. What catechisms to use, with many more such. ² [See ‘On Laying One’s Hand on the Bible to Swear’.] ³ [See ‘On Trembling at the Word, Weeping before the Bible, Kissing the Stake, etc.’] God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc. 15. These [things] may be called ‘worship’ in a sense subservient to God’s ordinances of worship¹ (as we worship men by putting off the hat, kneeling, bowing [Mt. 18:26; Lk. 14:10; Rev. 3:9], etc.). But if any will not call it ‘worship’, they must [then] not call it ‘false worship’, nor pretend that the controversy is any more than about the bare name. ¹ [For an explanation of this, see pp. 73-84 of Travis Fentiman, 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022).] 16. They that feign such things as these to be sinful additions and an invading of Christ’s office and denying his faithfulness, etc. condemn the Scripture that commands such determinations, and contradict the Law of Nature and the practice of all Churches on earth, and would exterminate all God’s worship, which cannot be performed without some such determinations.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3820906d0c" data-kw="">
<blockquote><p>The doctrine hence arising is this, that so long as we labor to keep the substance of God’s worship, though we fail in some circumstances thereof, He will be merciful to us. If we embrace the substance thereof willingly, and fail in the circumstances unwillingly, God will never lay it to out charge. Examples will prove this more fully unto us: ‘Ye have heard of the patience of God’ (says the apostle James) ‘and ye know what end God made with him.’ (James 5:11; Job 3)… there was in him a great deal of passion and distemper: and that he held out but very weakly in a great part of the conflict… yet because he held out in the substance of godliness, in the midst of all his woes and miseries… and in the end acknowledged his fault and desired to lay his hand upon his mouth: because (I say) these good things were found in him, God passes by his infirmities and takes notice of his patience, with high commendation thereof… For the Lord in his wisdom considered that it was not through any stubbornness, or rebellious disposition that he brake out in that manner…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, pp. 122-23</span></figcaption>

<blockquote><p>Furthermore that must be observed: what kind of idolatry that is which saint Paul says may fall into a brother and yet he retain the name of ‘brother’. (1 Cor. 8, 10) This appears upon the discourse he makes in that epistle to have been only a sitting down to eat at the feast of idolaters, made in honor of their idols, without any honor done to idols by sacrifice or bodily worship, and without any conscience of that meat more than of other. Which although he prove a species of idolatry: yet was that one of the least and lightest kinds, and such as holding still the foundation of Christianity, could not without obstinacy in it, cut [him] from the church. Whereby [it] falls out that the papists, which in their idolatry raze the foundations of true religion, cannot, by that place, come into any account of the church of God.</p></blockquote>

<blockquote><p>After affirming belief in the sufficiency of scripture for the doctrine and worship of the church in its First Head (“Of Doctrine”), the First Book of Discipline of the Church of Scotland (1560) called for all extra-biblical holy days to be abolished:

In which Books of Auld and New Testaments we affirm, that all things necessary for the instruction of the Kirk, and to make the man of God perfect, is contained and sufficiently expressed.

By the contrary Doctrine, we understand whatsoever men, by Laws, Counsels, or Constitutions have imposed upon the consciences of men, without the expressed commandment of God’s word; such as be [the] vows of chastity, forswearing of marriage, binding of men and women to several disguised apparels, to the superstitious observation of fasting days, difference of meat for conscience sake, prayer for the dead; and keeping of holy days of certain Sanctis commandit by man, such as be all those that the Papists have invented, as the Feasts (as they term them) of Apostles, Martyrs, Virgins, of Christmas, Circumcision, Epiphany, Purification, and other fond feasts of our Lady. Which things, because in God’s Scriptures they neither have commandment nor assurance, we judge them utterly to be abolished from this Realm; affirming farther, that the obstinate maintainers and teachers of such abominations ought not to escape the punishment of the Civil Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 185-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>This one thing, however, we can scarcely refrain from mentioning, with regard to what is written in the 24th chapter of the aforesaid [Second Helvetic] Confession [of 1566] concerning the ‘festival of our Lord’s nativity, circumcision, passion, resurrection, ascension, and sending of the Holy Ghost upon his disciples,’ that these festivals at the present time obtain no place among us; for we dare not religiously celebrate any other feast-day than what the divine oracles have prescribed. Everything else, as we have said, we teach, approve, and most willingly embrace [in the Second Helvetic Confession].</p></blockquote>

<blockquote><p>Tilen sets out the expediency of holy-days for imprinting in the minds of people the sense and knowledge of the benefits of redemption. Answer:

1. There is no mean so good for this purpose as catechizing and preaching, out of season and in season.

2. What could he say unto them who have attained his end without his mean? I find people better instructed and made more sensible of those benefits where the feasts are not kept, than where they are.

3. Think they their people sufficiently instructed in the grounds of religion when they hear of the nativity, passion, etc. What course will they take for instructing them in other principles of faith? Why do they not keep one way, and institute a holy-day for every particular head of catechism? But Bishop Lindsey thinks yet to let us see a greater expediency for observing holy-days. Certainely says he, nothing is so powerful to abolish profaneness and to root out superstition of men’s hearts, as the exercise of divine worship in preaching, praying and thanksgiving, chiefly then when the superstitious conceits of merit and necessity are most pregnant in the heads of people, as doubtless they are when the set times of solemnities return; for then it is meet to lance the oposterne when it is ripe. Answer: This is a very bad cure and is not only to heal the wound of the people slightly [Jer. 6:14], but to make it the more inveterate and festered. I might object that little or nothing is preached or spoken by him and his companions at the revolution of those festivities against the superstitious keeping of them; but though they should speake as much as can be against this superstition, their lancing being in word only, and not in deed, the recidivation will prove worse than the disease. The best lancing of the oposterne were not to observe them at all, or to preach against them, which are tried to work this effect more powerfully than the bishop’s cure has done: for all know, that there is none so free of this superstition as those who observe not the holy-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 2, ‘Against those of our Opposites who plead for the Ceremonies as things Expedient’, pp. 13-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-e8fa779d47" data-kw="">
<blockquote><p>Those days which are consecrated to Christ in the Church, if they are received only for reason of a remembrance of the saving graces of Christ to us, and are retained, in order to make us more certain concerning these matters and actions, and if they are observed without any superstition of the day, in the way that they were celebrated when they were first instituted, not by the Papists, but by the Church), then, let them be retained for the honor of Christ, for as long as it seems good to the pious Church, because they are matters straightaway indifferent, and means. Although, I think and judge that even these days among us (who cannot now doubt concerning the trustworthiness of the Evangelical history; nor do we, by the grace of God, walk amongst the heathens), these days, I say, are to be abolished. For, every day, by the preaching of the gospel, Christ is born, circumcised, dies, and resurrects for us, Heb. 13:8.</p></blockquote>

<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVIII Sermons on the Second Chapter of the 2nd Epistle to the Thessalonians</cite>, … (London, 1679), 340–42 [Spelling and punctuation modernized].</span></figcaption>

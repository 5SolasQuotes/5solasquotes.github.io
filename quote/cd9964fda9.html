<main class="wrap"><figure class="quote" id="q-cd9964fda9" data-kw="">
<blockquote><p>Now who can be so insensible to the words of the apostle, who so foolishly, nay, so insanely ignorant of the purport of his statement, as to venture to affirm that the law is grace, when he who knew very well what he was saying emphatically declares, “Ye who are justified by the law are fallen from grace”? Well, but if the law is not grace, seeing that in order that the law itself may be kept, it is not the law, but only grace which can give help, will not nature at any rate be grace?

For this, too, the Pelagians have been bold enough to aver, that grace is the nature in which we were created, so as to possess a rational mind, by which we are enabled to understand,—formed as we are in the image of God, so as to have dominion over the fish of the sea, and over the fowl of the air, and over every living thing that creepeth upon the earth.

This, however, is not the grace which the apostle commends to us through the faith of Jesus Christ. For it is certain that we possess this nature in common with ungodly men and unbelievers; whereas the grace which comes through the faith of Jesus Christ belongs only to them to whom the faith itself appertains. “For all men have not faith.” Now, as the apostle, with perfect truth, says to those who by wishing to be justified by the law have fallen from grace, “If righteousness come by the law, then Christ is dead in vain;” so likewise, to those who think that the grace which he commends and faith in Christ receives, is nature, the same language is with the same degree of truth applicable: if righteousness come from nature, then Christ is dead in vain.

But the law was in existence up to that time, and it did not justify; and nature existed too, but it did not justify. It was not, then, in vain that Christ died, in order that the law might be fulfilled through Him who said, “I am come not to destroy the law, but to fulfil it;” and that our nature, which was lost through Adam, might through Him be recovered, who said that “He was come to seek and to save that which was lost;” in whose coming the old fathers likewise who loved God believed.</p></blockquote>

<blockquote><p>§XVII. There is disagreement today whether the essence of the soul is to be constituted in actual thought itself [by Cartesians], or otherwise. Theologians and philosophers hitherto have stated: The soul is a spiritual substance endowed with the faculty of thinking; and thinking always in the first act [in its existence and power], but not always in the second [in that power’s exercise]. But certain more recent thinkers [Cartesians] wish that the very essence and substance of the rational soul is thought, or that the mind is constituted by actual thought itself. We approve the former opinion with the following arguments: (1) Because Scripture distinguishes the essence of the soul from its action or operation, i.e., thought, Prov. 19:21, “Many are the thoughts in a man’s heart,” where the heart or mind is manifestly distinguished from the thoughts. Thus in Prov. 16:9 it is said: “The heart of man plans his way.” Mt. 1519, “out of the heart proceed evil thoughts.” Paul in Rom. 9:11 says of Esau and Jacob: “when they had not yet been born, or had done any good or evil etc.” from which it appears that these twins, at least in their mother’s womb, had not yet thought. In Dan. 4:29-30, Nebuchadnezzar for seven periods lacked the use of reason and the exercise of thoughts, unless we wish to assert that Nebuchadnezzar was changed in substance into another species, and therefore was utterly deprived of all humanity and mind, from which it would follow: One Nebuchadnezzar sinned, another bore the punishment for his pride. (2) From reason: No substance, at least no created one, is constituted by its own action. Since, therefore, thought is an action of our mind, it is clear that the soul is not constituted by thought, which [Renee] Descartes does not deny in his Reply to the 3rd Objection, Obj. 2 to the 2nd Meditation, p. 82. (3) No attribute is constitutive of its substance, but is consequent to it; nor does it make the substance, but presupposes it. Thought is an attribute which is predicated of the soul, and follows it. Therefore, thought does not constitute or make its substance or subject. (4) Thoughts are multiple and numerous; therefore, for the multiplication of thoughts, the soul would have to be multiplied; for their variation, it would have to be varied; for the production of thoughts, it would have to be produced. (5) The soul can lack thoughts in the second act, for example, when a person sleeps, and in a swoon, apoplexy, and epilepsy; at which time, according to the other hypothesis, the person would lack a mind. (6) Because the learned think more than the rustic and stupid, it would follow that there is more soul in a learned person than in a rustic and stupid one. (7) According to this opinion, the simplicity of God, by which He is believed to be pure act, would not remain proper to God, but would be communicated to men. (8) This opinion is repugnant to the fathers, scholastics, theologians, and even Protestant philosophers up to these times. See Leidecker, Fac. Verit., Locus 7, Controversy 6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), trans. AI</span></figcaption>

<blockquote><p>In this way only we attain to what is not to say difficult but altogether against nature, to love those that hate us, render good for evil, and blessing for cursing, remembering that we are not to reflect on the wickedness of men, but look to the image of God in them, an image which, covering and obliterating their faults, should by its beauty and dignity allure us to love and embrace them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.7.6 (Beveridge transl.)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In this way only we attain to what is not to say difficult but altogether against nature, to love those that hate us, render good for evil, and blessing for cursing, remembering that we are not to reflect on the wickedness of men, but look to the image of God in them, an image which, covering and obliterating their faults, should by its beauty and dignity allure us to love and embrace them.”

</figure><figure class="quote" id="q-4bb6a68408" data-kw="">
<blockquote><p>Howbeit I think it not amiss to declare those ways and means which I have observed amongst the ecclestical writers [touching the propagation of original sin]: whose opinions touching this matter are four in number: The first is of those which thought that we receive of our parents the souls together with the bodies, that even as God by human seed creates the body, so also of the same creates He the soul… Whose arguments… I judge indeed probable: but yet not of necessity… [The second view is not labeled and might be another form of traducianism.] The third way is that God therfore creates the soul with such a sin or defect, for that it shall be the soul of a man now damned, and set under the curse. Such a soul say they, God creates as is required to such a man… this fond device is of every man rejected: lest we should seem to make God absolutely the author of sins. The fourth maner is by the consents of many men received, and seems very likely to be true: namely, that the soul is not created with some [sin], but straightway draws unto it sin so soon as ever it is adjoined unto the body derived from Adam…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-84c5842698" data-kw="">
<blockquote><p>1. There is no imposition [by the Church of England, as to] what gesture to sing a psalm in, or to hear God’s Word; and about these I never heard of a contention. But about the sacrament-gesture, and bowing rather at the name of Jesus, than of Christ, or God, there is imposition, and there’s contention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry, containing: I. the Reasons of their Preaching, II. an Answer to the accusations urged as reasons for the silencing of about 2000</cite>, … (1681), p. 87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08672052eb" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74561d709a" data-kw="">
<blockquote><p>Thus he will have images adored with the same worship that is given to God: But I answer: 1. if he shall kiss that creature and direct religious bowing toward it, and through that external religious act, convey his worship to God, and give no other external adoration and sign of heart submission to God, then that which is tied and alligated of purpose to that fair creature, as Papists and Jews did of old, who kissed the calves and fell down before the images (as Isa. 44:17, which yet were but memorials of Jehovah teaching them of Iehovah, Isa. 40:18; 46:6-7; Hab. 2:18-19), such a one should also worship that fair creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Ch. 1; p. 163</span></figcaption>

</figure><figure class="quote" id="q-ee3d9f351c" data-kw="">
<blockquote><p>In the second place, to supply the defendant his penury, the Rejoynder brings abundance of instances, out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this: and therefore by prevention, replies: to say these are not human inventions, because they partly spring out of natural light, is as much as to say, they are not, because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross, and surplice; the cornered-cap, and tippet; the bishops’ rochet, and coap; with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willful invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time, lay aside right natural invention, and judgement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), p. 495</span></figcaption>

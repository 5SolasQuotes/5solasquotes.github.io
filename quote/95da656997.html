<main class="wrap"><figure class="quote" id="q-95da656997" data-kw="">
<blockquote><p>Bodily worship without soul-worship is nothing; but soul-worship may be accepted without bodily worship; therefore it is the soul that God does principally look at in holy duties: If you be not able to worship God in your bodies, you may worship Him in your souls, and God regards that bodily exercise in holy duties is little worth… but it is nothing in comparison: the great work is the work of the soul, for God is a Spirit and must be worshipped in spirit. And God is said to be a Spirit… it notes the simplicity of God… but in the simplicity of your hearts you must come to worship God, and thus you shall worship Him with such worship as is some way suitable to him as he is a Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship... (London: 1647) | Sermon 6</cite>, pp. 93-94</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672)</cite>, ch. 5, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

d Books Online</a></div>
</figure><figure class="quote" id="q-5b76ba6123" data-kw="">
<blockquote><p>And the reason why there must be this sanctifying of the heart is: 1. First, because the Lord does first accept of the person before He does accept of the action: Men indeed do accept of the persons of men because they do good actions, but God accepts of the actions of men because their persons are good. If indeed we see a man do good, then we love him and accept of the person of the man; but God first will accept of the person before the action: As the Lord accepted of Abel first, and then He accepted his offering [Gen. 4:4; Heb. 11:4]… you must first look after means of acceptation of your persons, which is through the righteousness of Jesus Christ, and through the sanctification of his Spirit, whereby you come to have his image and life, and so are accepted, and then all that proceeds from you comes to be accepted… 2. Secondly, our hearts must be sanctified because the Lord does look more to the principle from whence a thing comes than at the thing itself… So God is not pleased with anything that comes from us except He knows that it comes from a principle of love, grace, and holiness in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”</cite>, pp. 69-70</span></figcaption>

k">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dc9d6f7f58" data-kw="">
<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jame-owen.html">Jame Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-e20ef78ad3" data-kw="">
<blockquote><p>He [Owen] intimates that it is not in our power to close with some and not withal. This is his first error. Though man give us no such power, God does: as it is in my power to believe all that one speaks truly and well, and not that which he speaks amiss. I am not bound to own all that any preacher or priest shall say in the church. God put it in the disciples’ power to beware of the leaven of the Pharisees [Mt. 16:6], and yet to hear them [Mt. 23:1-3]. Proving all things [1 Thess. 5:21] is not approving all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 25</span></figcaption>

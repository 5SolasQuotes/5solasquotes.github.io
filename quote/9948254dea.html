<blockquote><p>Reply Obj. 1: A thing moved by another is forced if moved against its natural inclination; but if it is moved by another giving to it the proper natural inclination, it is not forced; as when a heavy body is made to move downwards by that which produced it, then it is not forced. In like manner God, while moving the will, does not force it, because He gives the will its own natural inclination. Reply Obj. 2: To be moved voluntarily, is to be moved from within, that is, by an interior principle: yet this interior principle may be caused by an exterior principle; and so to be moved from within is not repugnant to being moved by another. Reply Obj. 3: If the will were so moved by another as in no way to be moved from within itself, the act of the will would not be imputed for reward or blame. But since its being moved by another does not prevent its being moved from within itself, as we have stated (ad 2), it does not thereby forfeit the motive for merit or demerit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 105, art. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-562e876894" data-kw="">
<blockquote><p>What is added in the last place, concerning the general intention of God, by which He wills that all men individually should be saved through the death of his Son, needs explanation. It must be observed, therefore, that according to the custom of the Scriptures, the Divine will or intention sometimes denotes merely the appointment of means to an end, although there is no determinate will in God of producing that end by those means. And the Schoolmen refer this intention or will of God to the common order of providence. In this sense He willed and intended the obedience and salvation of the angels who apostatized, inasmuch as He furnished them with gifts, fit in themselves and suitable, to perform obedience and obtain salvation. And in this sense God, with a general intention, wills life to all men, inasmuch as he willed the death of Christ to be the fountain and cause of life to all men individually, according to the tenor of the evangelical covenant.¹ ¹ [Davenant calls the gospel offer, that whosoever believes in Christ will be saved (Jn. 3:16), established with all men as men, a “covenant,” and the “evangelical covenant”. While this call and offer does not reach all persons, yet, according to some, it potentially could save all persons if it were not for the sin of persons after Adam and Eve not continuing in their responsibility and for persons not obeying the command to preach the gospel to every creature. This potential power of providential means, designed unto the end of salvation, however varied or inaccessible through human history, yet reflects, for some theologians, God’s gracious will of providence in some way for the life and salvation of every human individual, especially in contrast to the demons which receive no such favors.] But we must observe, that the Scriptures mention another will or intention of God, and that properly so called, which never fails in producing the good intended, and which the Schoolmen refer to the order of special predestination… But if by this general intention they mean nothing more than a general aptitude and sufficiency in the death of Christ to effect the salvation of all men individually in the mode of an universal cause, or a general appointment of God concerning the salvation of all men individually, who, through the grace of God, duly apply to themselves this universal cause, then there is no need to reject this form of speaking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Gallican Controversy, pt. 1</cite>, pp. 564-65 appended to Davenant, An Exposition of Colossians, vol. 2 ed. Josiah Allport (London, 1832)</span></figcaption>

</figure><figure class="quote" id="q-1d4d0791d2" data-kw="">
<blockquote><p>3… But more especially the Holy Ghost is compared to a wind in respect of its irresistable workings; as nothing can resist the wind, it goes and blows which way soever it will; so nothing can resist the Spirit of God, wheresoever it has a purpose to work efficaciously; I will not say, but the heart of a man may resist and reject the work of the Spirit in some measure, and in some degrees; Stephen told the Jews, they had always resisted the Holy Ghost (Act. 7:51); and the apostle tells of strong holds, and of every high thing that exalts itself against God (2 Cor. 10:5); so there is a natural contrariety, a constant enmity and active resisting of God’s Spirit by our spirits; we must therefore distinguish between a prevalent and a gradual resisting; the Spirit in conversion so works that He takes away the prevalent, but not the gradual resisting; A man before he be converted is froward, and full of cavils and prejudices; he is unwilling to be saved; he cannot abide the truth; he does what he can to stifle all good motions: yet if he belong to the election of grace, God will at last over-master his heart and make him of unwilling, willing; He will omnipotently bow and change the will and work on his soul by his mighty power efficaciously, insuperably and irresistably.</p></blockquote>

<blockquote><p>Whether we can Resist the Grace of God, or No? But now arises an other doubt as touching our nature as it is now fallen and corrupt, whether it can resist the grace of God and his Spirit being present, or no? (There are sundry degrees of grace of God) I think we must consider that there are, as it were, sundry degrees of the help or grace of God: for his might and abundance is sometimes so great that He wholly bows the will of man and does not only counsel, but also persuade. And when it so comes to pass, we cannot depart from the right way, but we are of God’s side and obey his sentence. Wherefore it was said unto Paul: “It is hard for thee to kick against the pricks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Judges</cite>, ch. 9, pp. 167-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether we can Resist the Grace of God, or No? But now arises an other doubt as touching our nature as it is now fallen and corrupt, whether it can resist the grace of God and his Spirit being present, or no? (There are sundry degrees of grace of God) I think we must consider that there are, as it were, sundry degrees of the help or grace of God: for his might and abundance is sometimes so great that He wholly bows the will of man and does not only counsel, but also persuade. And when it so comes to pass, we cannot depart from the right way, but we are of God’s side and obey his sentence. Wherefore it was said unto Paul: “It is hard for thee to kick against the pricks.”

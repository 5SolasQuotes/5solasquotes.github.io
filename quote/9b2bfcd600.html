<main class="wrap"><figure class="quote" id="q-9b2bfcd600" data-kw="">
<blockquote><p>It is a radical [root] principle of our system ‘that a larger part of the Church, or a representation of it, should govern a smaller, or determine matters of controversy which arise therein.’… This is of the essence of Presbyterianism. It is involved in the declaration that the Church is to be governed not only by congregational and presbyterial, but also by synodical assemblies; and more expressly in the declaration that synods have authority ‘to redress whatever has been done by presbyteries contrary to order.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, a. ‘Appeals in Cases Not Judicial’, pp. 479-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-452ff0feab" data-kw="">
<blockquote><p>Dort’s form of subscription [1619] remained in use in the Reformed churches of the Netherlands for almost two hundred years. In 1816, after the monarchy was restored following the Napoleonic wars, the Dutch Reformed church was reorganized, and a new form of subscription replaced that of Dort… the new version contained a weaker declaration of agreement with ‘the doctrine, which, in agreement with God’s Holy Word, is contained in the accepted forms of unity.&#x27;” p. 279 . Book Janssen, Roelf Christiaan – By this our Subscription: Confessional Subscription in the Dutch Reformed Tradition since 1816 PhD diss. (Theologische Universiteit, Gereformeerde Kerken, 2009) 480 pp. On the era before 1619, see pp. 22-33. On the era from 1619 to 1816, see pp. 33-45. . Lutheranism On the Post-Reformation to Today Cochrane, Arthur C. – ‘The Act of Confession-Confessing’ in Sixteenth Century Journal, vol. 8, no. 4, The Formula of Concord: Quadricentennial Essays (Dec., 1977), pp. 61-83 Cochrane is a confessional Lutheran professor at Wartburg Theological Seminary (ELCA, Iowa) that here gives helpful thoughts and observations about confessing in general and historically in the Post-Reformation up through to the (German) Barmen Declaration (1934). Preus, Robert – 6. ‘Confessional Subscription’ in eds. Kiehl &amp; Werning, Evangelical Directions for the Lutheran Church (1970), pp. 43-52 . On the 1800’s Lee II, James A. – ‘Theodosius Harnack &amp; Confessional Subscription’ in Concordia Theological Quarterly, vol. 89:1 (Jan. 2025), pp. 61-83 Harnack (1817–1889) was a Baltic, German, Neo-Lutheran theologian of the Erlangen school. Abstract: “This essay explores the significant contributions of Theodosius Harnack to the nineteenth-century discourse on subscription to the Lutheran Confessions, contextualized against the debate over Johannes von Hofmann‘s theory of the atonement.</p></blockquote>

</figure><figure class="quote" id="q-7b62193997" data-kw="">
<blockquote><p>For it is said [in Acts 8] that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning [of the Romanist opponent], would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian…</p></blockquote>

</figure><figure class="quote" id="q-3caee1b681" data-kw="">
<blockquote><p>And do further statute and ordain, that no person be admitted, or continued for hereafter, to be a minister or preacher within this Church, unless that he… do also subscribe the Confession of faith, ratified in the foresaid 5th Act of the second Session of this Parliament, declaring the same to be the confession of his faith, and that he owns the doctrine therein contained to be the true doctrine which he will constantly adhere to: As likewise, that he owns and acknowledges Presbyterian Church government, as settled by the foresaid fifth act of the second session of this parliament, to be the only government of this Church, and that he will submit thereto, and concur therewith, and never endeavour, directly or indirectly, the prejudice or subversion thereof…</p></blockquote>

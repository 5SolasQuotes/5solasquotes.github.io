<blockquote><p>2. No man may take this honour to himself, unless he be called of God, and sent to preach his Word in the Name of God, Rom. 10:14-15. But all who have the gifts of preaching the Word are not called and sent of God. For those who are sent of God are sent either by an immediate and extraordinary call, or by a mediate call by the Church: but whereas now an extraordinary mission or sending is ceased in the Church, those are therefore by the ordinary ecclesiastical call separated to the office of preaching, who may lawfully undertake it. 1 Tim. 4:14 &amp; 5:22; 2 Tim. 2:2-3. … We reject therefore the contrary assertion of those [congregationalists] who affirm this to be an ordinance perpetual and ordinary in the Church, that a private Christian endued with gifts, either ordinarily or upon occasion, being thought fit in the judgment of those to whom it belongs, may (by the Word of God) preach publicly in the church-assembly with all authority, though he bear no Church office. But to us it’s certain that even under the Old Testament in the Jewish Church, every one was not admitted to speak publicly in the synagogues, but that it was the ordinary function of those that are called scribes and lawyers (the Levites being also for this cause distributed into many places), whereupon they are said to sit on Moses’s chair. If any were endued with extraordinary gifts of prophecy, as the prophets in Israel, this was permitted and enjoyned him by the Word of God, publicly to preach in God’s Name. When the prophet Amos was forbidden by the Chief Priest to prophecy at Bethel, he does not challenge this liberty to the Israelites, that they might publicly preach the Word of God in God’s Name in the holy assemblies, but pleads his extraordinary mission, whereby he was sent of God to preach this word, Amos 7:14-15. And so perhaps was it permitted to the sons of the prophets, who were fitted, educated, and set apart for the ecclesiastical ministry, 1 Sam. 19:20. In the synagogues, after the reading of Moses and the prophets was ended, there were exhortations added; which exhortations if at any time occasion required, and it so seemed good to the rulers of the synagogue, in corrupt times especially, it was indeed permitted to some, out of order, to teach and exhort; but they were always such as had testimony of their gifts, and of whom there was a general opinion of their mission extraordinary or ordinary, by reason of the doctrine they preached, and the works they did. Thus at Nazareth Christ was permitted in the synagogue to read and explain the writings of the prophets, Lk. 4:16, as one who by reason of his majesty and miracles did everywhere obtain audience, as reverend Beza here notes; by which right he taught both in the Temple and everywhere: wherefore also the ordinary doctors demanded of him by what authority he did it, Mt. 21:23. So we find that Paul and Barnabas were allowed, Acts 13:15, publicly to speak and exhort in the synagogue at Antioch; as being such whose fame was already known to those of Antioch: for they had, before this time, for a whole year preached the Word of God to many there, and brought many to the faith of Christ; and Agabus who was joined with them, did by an extraordinary gift of prophesy foretell to those of Antioch the famine approaching; where were also many other prophets and doctors, who preached the Word of God both to Jews and Greeks: See Acts 11:19-21, 25-28, and 13:1-2, etc. But in the practice of the New Testament, none but prophets by gift and office, either extraordinary or ordinary, were permitted publicly in the assembly of believers to preach the Word of God in Christ’s Name, as appears, 1 Cor. 14:29-31, etc. The apostle speaks not of any in the congregation promiscuously, but of prophets lawfully called to instruct the Church of God (says Beza on this place) and therefore they are not to be hearkened to [namely the congregationalists], who from hence gather that any of the assembly may speak in the Church, and who reprehend the custom of having only a sermon preached by one.</p></blockquote>

<blockquote><p>3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already.

4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.</p></blockquote>

<blockquote><p>Answer:

1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders.

2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Answer:

1. Some parcels of these epistles are written to Timothy and Titus as evangelists, such as none may now do but they only (2 Tim. 4:4; Tit. 1:3; 2 Tim. 1:5) and some other things which they gave in charge to elders.

2. Some things are written to them as Christians, as 1 Tim. 1:19; Tit. 3:3 and finaliter, or objectively, all is written for the Church’s good; but 3. the bulk of the epistle is written to them as elders, and is a rule of perpetual government, and especially, 1 Tim. 5:22; 2 Tim. 2:2, for these and the like they were to do with the presbytery, as is clear, 1 Tim. 4:14.”

<blockquote><p>4. Stephen [a deacon] did no more (Acts ch. 7) in his apology [contra Anglicans who hold that deacons may preach] than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman who yet may not preach, 1 Cor. 14:34.</p></blockquote>

</figure><figure class="quote" id="q-2d7bd346a7" data-kw="">
<blockquote><p>Notwithstanding of all the multiplicity of Popish orders, yet Peter Lombard (pt. 4, distinction 4) treading the vestiges of the primitive simplicity, did observe that the apostles left only two sacred orders to be perpetual in the Church, the order of deacons and the order of elders. The administration of deacons is exercised about things bodily. The administration of elders about things spiritual. The former about the goods: the latter about the government of the Church. Now elders are of three sorts: 1. Preaching Elders, or Pastors, 2. Teaching Elders or Doctors, 3. Ruling Elders. All these are elders, because they have voice in presbyteries and all assemblies of the Church, and the government of the Church is incumbent to them all: nor only to the pastor and elder, but to the doctor also. The bishop of Dune, in his Examen conjurationis Scoticae [‘Examination of the Scottish Conjuration’], p. 35, alleges that our Church of Scotland did never yet determine whether doctors and deacons have right of voicing in the consistories and assemblies of the Church. But had he read our book of Policy, he might have found that it excludes deacons from being members of presbyteries and assemblies, ch. 8, but admits doctors into the same, ch. 5. The doctor being an elder, as said is, should assist the pastor in the government of the Kirk and concur with the elders, his brethren, in all assemblies, by reason the interpretation of the Word, which is [the] only judge in ecclesiastical matters, is committed to his charge. But they differ in that the pastor labors in the Word of exhortation, that is, by the gift of wisdom, applies the Word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labours in the Word of doctrine, that is, without such applications as the pastor uses, by simple teaching he preserves the truth and sound interpretation of the Scriptures against all heresy and error. The ruling elder does neither of these, but labours in the government and policy of the Church only. The apostle has distinguished these three sorts of elders, 1 Tim. 5:17, ‘Let elders that rule well be counted worthy of double honour, especially they who labour in the Word and doctrine,’ where, as Beza notes, he distinguishes the Word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7-8, he distinguishes teaching from exhortation: and 1 Cor. 12:8 puts the Word of wisdom and the word of knowledge for two different things. Now beside those elders which labour in the Word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the Word nor doctrine, but in ruling well.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c0ee5bb7c7" data-kw="end of world signs">
<blockquote><p>Can anything certain and determinate be held concerning the time of the end of the world? And are certain signs to precede it? The former we deny; the latter we affirm. The end of the world will close and put an end to the world and worldly things. It is called the consummation of ages because it will consummate all things belonging to this state of life and close the duration of the present time, that room may be given for eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.4.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-89510b8bf5" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 59</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption>— <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</figcaption>

</figure><figure class="quote" id="q-7d52868f27" data-kw="">
<blockquote><p>Every sin invades the rights of God and strips him of one or other of his perfections. It is such a vilifying of God as if he were not God; as if he were not the supreme Creator and benefactor of the world; as if we had not our being from him; as if the air we breathed in, the food we lived by were our own by right of supremacy, not of donation.… That affection that excites a man to break his law would excite him to annihilate his being if it were in his power. A man in every sin aims to set up his own will as his rule and his own glory as the end of his actions, against the will and glory of God; and could a sinner attain his end, God would be destroyed: God cannot outlive his will and his glory.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (every sin invades God’s rights)</figcaption>

</figure><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption>— <a href="../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, p. 100</figcaption>

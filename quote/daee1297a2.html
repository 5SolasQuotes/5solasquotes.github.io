<main class="wrap"><figure class="quote" id="q-daee1297a2" data-kw="">
<blockquote><p>Though the Jewish Church and commonwealth were for the most part not different materially, the same men being members of both, even as in all Christian republics; yet they were formally different from one another in regard of distinct acts, laws, courts, officers, censures, and administrations. For, 1. The ceremonial law was given to them as a Church, the judicial law given to them as a State.

2. They did not worship, do sacrifice, pray, praise, etc. as a State; nor did they kill malefactors with the sword as a Church.

3. As the Lord’s matters and the King’s matters were distinguished, so there were two different courts for judging of the one and the other (2 Chron. 19:8, 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 122-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-e52ba179f8" data-kw="">
<blockquote><p>It is no small ground of Admiration, that God should rescue so vile and degenerate a people by the hands of such a justly Renowned Instrument. God hath sent us a Saviour, and a great one, (as the Prophet speaks) One not like Noble Cyrus of old, but Superior to him, for he knew not God, though he was girded by him; One not like the King of Babylon, to whom God promised the wages of a Temporal Reward, for himself and his Army; for the service done at this time, hath been so clearly from another Principle, and with another Spirit, that I doubt not of God’s recompensing it to him, with a Throne in Heaven, and an Incorruptible Crown of Glory.

Let his Enemies be Judges (if their Tongues will confess what their Hearts know) whether he be not worthy of double Honour, beyond those of his own rank; and let all men consider, whether he do not deserve our Praises the more, because his Humility declines them so much. We are undoubtedly very pure in our own Eyes, if we imagine that too much to be said of him, which was spoken by the people to David, that he is worth ten thousand of us; and therefore wonder, that such a Person should be exposed and hazarded for our safety and preservation. Wonder, that a man wise as an Angel of God should be found out and stirred up by God to deliver a Nation so void of Counsel; and that One who is so great an Ornament and Credit to the Protestant Profession, should willingly offer himself for us, who were so notorious a Scandal and Disgrace to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-cruso.html">Timothy Cruso</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mighty Wonders of a Merciful Providence. In a Sermon Preached on January 31, 1688/89. Being the Day of Public Thanksgiving to God for the Great Deliverance of this Kingdom by His Highness the Prince of Orange</cite>, (London: Thomas Cockerill, 1689), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-301897e599" data-kw="">
<blockquote><p>For such a man shows his profligacy in everything so that everyone readily recognizes the life of the profligate and the life of the pure man by what is valued in each one’s household. In the house of the one there are frescoes on the wall which by their artful pictures inflame the sensual passions. These things bring out the nature of the illness, and through the eye passion pours in upon the soul from the dishonorable things which are seen. But in the house of the prudent man there is every precaution and foresight to keep the eye pure from sensual spectacles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Moses</cite>, trans. and eds. Abraham J. Malherbe and Everett Ferguson, The Classics of Western Spirituality (c. 390; New York: Paulist Press, 1978), Book 2.71, p. 70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

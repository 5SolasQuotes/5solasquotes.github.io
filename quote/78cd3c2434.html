<blockquote><p>5. They [papists] likewise say that some countries have no wine [in order to justify their witholding the cup from lay-persons]. I answer also that there are countries that have no bread; and that if men can carry the one thither, they may carry the other also: or if that be impossible, it is better in such a country to use that which serves there instead of bread and wine, rather than to be wholly or in part deprived of the sacrament… Add hereunto that if some countries cannot have wine for the sacrament, it follows not but that they may be furnished from an infinite number of other provinces where they may have wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Buckler of the Faith: or a Defence of the Confession of Faith of the Reformed Churches in France, Against the Objections of Mr. Arnoux, the Jesuite</cite>, … (London, 1620), 38th Article, ‘An Examination of the Reasons Alledged by our Adversaries’, pp. 531-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c214d30fa" data-kw="">
<blockquote><p>If any thing be altered or added which is not commanded of God, being not essential, but accidental, and not as necessary, but as indifferent, appertaining to decency, or to order, or to edification, we cannot hence conclude that anything is altered of the appointed worship, or that there is another worship erected. As for example, Christ performed his Supper at night. The apostles were wont to perform it also in the morning, and the Church followed afterwards this time. Should a man hereupon say that anything is derogated from the Supper of the Lord? Surely no, because Christ commanded not the same to be celebrated in the night, as Himself observed it, but only ‘hoc facite,‘ that we should do that (for the matter or substance) which He did, but not at that time wherein He did it. Also to that the primitive Church (as appears in Justin Martyr) did mingle water with the wine in the Lord’s Supper; it is not a sufficient ground to say they altered or changed the institution of the Lord’s Supper, and that for two reasons: One, because it may be that the wine which Christ Jesus gave to his disciples was mingled with water, seeing the apostles do not report the contrary and it is probable that the primitive Church might receive this from the apostles. Another reason is because the primitive Church did not add water as a matter altogether necessary, and so as appertaining to the substance of the Lords Supper, but only to signify a mystery. But if any did commend it as necessary, they did undoubtedly deprave the Lord’s Supper. But they much more, who used only water in the Lord’s Supper, as the Aquarii did, against whom Cyprian did write: for it is evident, that Christ our Sauior used wine, and commanded that we also should do the like. To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship. To this kind of addition appertain the places of forbidding to add to God’s Word, Dt. 4:1-2. Note that which he there says, ‘Ye shall not add to the Word which I command you,’ the Word of the Lord is necessary, it ties the conscience, and delivers the substance of the worship, and has nothing adiaphoral or indifferent therein: wherefore to add unto the Word is to ordain or appoint in God’s worship some thing as necessary, and as appertaining to the essence or worship of God, and which does so bind men’s consciences, even as the Word of God itself; wherefore he adds not unto the Word of God, which by the consent of the Church ordains anything, not as necessary, but as indifferent, and free for order only, or for decency, and unto edification, not binding the conscience of any by such an ordinance.</p></blockquote>

<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively. 8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object. 9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light. 10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary. 11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected. 12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them. 13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church. 14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true. 15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>

— Friedrich Spanheim the Elder, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+That+Word+of+God+was+first+%E1%BC%84%CE%B3%CF%81%CE%B1%CF%86%CE%BF%CE%BD+%5Bunwritten%5D%2C+afterward+%E1%BC%94%CE%B3%CE%B3%CF%81%CE%B1%CF%86%CE%BF%CE%BD+%5Benscripturated%5D%2C+materially+the+same+in+both+cases%2C+even+if+not+formally%3B+%5Bit+was+the+same%5D+intensively%2C+even+if+not+extensively.+8.+It+alone+today+is+the+rule+of+things+to+be+believed+and+done%2C+and+therefore+adequate+to+its+regulated+object.+9.+As+it+has+its+authority+comparatively+from+itself%2C+so+also+it+has+it+in+itself%2C+and+although+it+can+be+persuaded+to+us+through+other+means%2C+yet+it+cannot+be+persuaded+except+through+that+very+light+which+it+has+in+itself%2C+just+as+also+the+sun+can+be+seen+only+by+its+own+light.+10.+The+authority+of+the+Church%2C+whatever+it+may+be%2C+can+be+here+%CE%B5%E1%BC%B0%CF%83%CE%B1%CE%B3%CF%89%CE%B3%CE%B9%CE%BA%CE%AE+%5Bintroductory%5D+and+%CE%B4%CE%B9%CE%B7%CE%B3%CE%B7%CF%84%CE%B9%CE%BA%CE%AE+%5Bexpository%5D%2C+but+cannot+be+%CE%B1%E1%BD%90%CE%B8%CE%B5%CE%BD%CF%84%CE%B9%CE%BA%CE%AE+%5Bself-authorizing%5D+or+%CE%B1%E1%BD%90%CF%84%CE%BF%CF%80%CE%B9%CF%83%CF%84%CE%B9%CE%BA%CE%AE+%5Bself-credentialing%5D%3B+for+although+the+Holy+Spirit+uses+both+the+intrinsic+light+of+Scripture+and+the+extrinsic+light+of+the+Church+in+impressing+faith+concerning+Scripture+upon+us%2C+yet+the+former+is+the+primary+medium+and+motive%2C+the+latter+only+secondary.+11.+The+Church+can+use+unwritten+traditions+whether+public+of+councils+or+private+of+fathers%2C+but+ought+not+to+rely+upon+them.+And+traditions+subalternate+to+Scripture+must+always+be+distinguished+from+those+opposed+to+it%3B+the+former+to+be+admitted%2C+the+latter+to+be+rejected.+12.+All+dogmatic+traditions+of+the+Roman+Church+fabricated+outside+God%E2%80%99s+word+are+opposed+to+God%E2%80%99s+word%2C+ritual+ones+for+the+greatest+part+of+them.+13.+Neither+the+constitution+of+the+%5BBiblical%5D+canon+nor+the+interpretation+of+the+constituted+canon+ultimately+rests+on+the+authority+of+the+Church.+14.+The+%CE%B1%E1%BD%90%CF%84%CE%BF%CE%BA%CF%81%CE%B1%CF%84%CE%BF%CF%81%CE%B9%CE%BA%CF%8C%CF%82+%5Babsolute+ruler%5D%2C+judge+of+controversies%2C+is+the+one+Spirit+of+God%2C+the+%CE%BA%CE%B1%CE%BD%CE%BF%CE%BD%CE%B9%CE%BA%CF%8C%CF%82+%5Bnormative%5D+judge+is+sacred+Scripture%2C+the+%E1%BD%80%CF%81%CE%B3%CE%B1%CE%BD%CE%B9%CE%BA%CF%8C%CF%82+%5Binstrumental%5D+or+%CE%BB%CE%B5%CE%B9%CF%84%CE%BF%CF%85%CF%81%CE%B3%CE%B9%CE%BA%CF%8C%CF%82+%5Bministerial%5D+judge+is+the+Church%2C+but+the+one+which+is+true%2C+not+the+one+which+merely+professes+itself+to+be+true.+15.+But+Scripture+is+a+real+Judge%2C+not+personal%2C+whence+vain+are+the+argumentations+which+are+drawn+against+the+real+judge+from+the+characteristics+of+a+personal+judge.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim+the+Elder%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F481419e3f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/481419e3f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-authority-of-the-bible/#:~:text=7.%20That%20Word%20of%20God%20was,the%20characteristics%20of%20a%20personal%20judge&amp;text=7.%20That%20Word%20of%20God%20was%20first%20%E1%BC%84%CE%B3%CF%81%CE%B1%CF%86%CE%BF%CE%BD&amp;text=judge%20from%20the%20characteristics%20of%20a%20personal%20judge" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some. … 24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not. ¹ [The Anglican parish churches tended to have a simpler and more plain and Scriptural worship than the cathedral churches of the cities, which had many more human and showy additions. Many of the older non-conformist ministers that separated from the cathedral worship yet would not separate in principle from the parish churches. Baxter was of this mind.] 25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 2, pp. 12-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Now the King Himself, the Lord who reigns in this external policy [of the Church], must be the only Lawgiver, James 4:12; Isa. 33:22. There can be no rabbis or doctors on earth who as little kings can make laws under Him, Mt. 23:8-10. Yea, not apostles, who can teach how the worship should externally be ordered, but what they receive of the King of the Church, 1 Cor. 11:23; Acts 15:13-18, how the house should be governed, Heb. 3:1-2; 4:5. Yea, nothing [is] more reasonable than that whatsoever is commanded by the God of Heaven, should be done in and for the house of the God of Heaven under the pain of his wrath, Ezra 7:23; 1. That there should be officers in a Kingdom, and laws to govern the subjects, beside the will of the prince or judges of the Land, or that the members of a family, or soldiers in an army should be governed by any rule, custom or law, beside[s] or without the will of the Master of the House, and of the general and commanders, is all one, as if subjects, families and soldiers should be ruled and governed by their own will and wisdom, and not by their king, judges, masters and commanders; For the question is upon this undeniable supposition, that Christ is the only Head and King of his Church, and so the Head and King of Prelates (if they be of the body) and of the rulers, guides and pastors of the Church, which are to be governed and ruled by certain laws, no less than the people, whether or no this representative Church of rulers, being subjects and members of the Head and King of the Church, are to be ruled by the wisdom, laws and commandments of this King, the Lord Jesus; or if they have granted to them a vast arbitrary power to govern both themselves and the people, by adding positive mandates of arbitrary commanders, such as Prelates are (in the mind of those who think they have no patent of any divine-right) and of surplice, crossing, kneeling for reverence to wood, to bread and wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646) | Intro, Section 2, pp. 17-18</span></figcaption>

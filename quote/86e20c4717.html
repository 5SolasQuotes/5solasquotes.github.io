<main class="wrap"><figure class="quote" id="q-86e20c4717" data-kw="">
<blockquote><p>Of all tyrannies, a tyranny sincerely exercised for the good of its victims may be the most oppressive. It would be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth. This very kindness stings with intolerable insult. To be ‘cured’ against one’s will and cured of states which we may not regard as disease is to be put on a level of those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-s-lewis.html">C.S. Lewis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God in the Dock: Essays on Theology</cite>, (Making of Modern Theology)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘The Distribution of Theology’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, pp. 209-10</span></figcaption>

</figure><figure class="quote" id="q-1873affc2a" data-kw="">
<blockquote><p>Application 1: This may first let us see that notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field. Rome has long doted on Peter’s Chair, and Jerusalem might as well have bragged of her privileges as any other place, but Christ leaves them: Never rest we then in any outward estate, for Christ may leave us. The Palatinate [Germany] has been as reformed as any Church for doctrine, and though they might say, their bed was green, and their beams were of cedar, and their rafters of fir, yet God has left them: for do we think that if God had been there, these things had befallen them that now are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canticles, or Song of Songs, Opened &amp; Explained</cite>, … (London, 1642), ch. 2, pp. 60-61</span></figcaption>

<blockquote><p>every word that appertains to God may be required and discussed, and all knowledge of things out of them may be understood. But if anything do remain which the holy Scripture ought to be received to authorize any knowledge; but that which remains we must commit to the fire, that is, we must reserve it to God. For in this present world God would not have us to know all things.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-bcbc57069a" data-kw="">
<blockquote><p>As I am not willing to thrust any man into extremes, nor to trouble men with calling those sins which God has not forbidden; So I have reason to advise men to go in doubtful cases on the safer side; much more to disuade them from undoubted sin, and especially from great and multiplyed sins:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes] in A Christian Directory… (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’</cite>, pp. 877-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service, vol. 2</cite>, pp. 566-67</span></figcaption>

<blockquote><p>§27. Though all these things are left to human determination, and so are indifferent in themselves, before; yet may they become accidentally necessary or unlawful. And though man must determine of them, yet not as he list, without a rule: but by those sufficient general directions which God has given in Scripture, and the end and nature of the work. And to cross these directions is a sin in him that does determine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London: R.W., 1659), 5th Disputation, ch. 2</cite>, p. 407</span></figcaption>

</figure><figure class="quote" id="q-26f04c7fb2" data-kw="">
<blockquote><p>Objection [of opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side, nor for the other, what rulers think good, is to be followed, there being no evil nor impiety in that which they command. Answer 1: This is to make rulers in matters of salvation liable to the Scriptures of God; but in matters which men call indifferent to make them Popes, and to hang our consciences upon their sleeve, which is most absurd: 1. Because Paul in matters most indifferent, of days and meats, would not have the Romans to hang upon his judgment, but will rule both their practice and his own by the Law of nature: ‘Murder not,’ ‘Scandalize not.’ 2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if in matters that they call of salvation, not thoughts, but the Word of God should rule and square canon-makers, but in matters indifferent, their thoughts should be a law. 3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is conventent in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters, which they call fundamental; yea, the Scripture shall be imperfect in the duties of the Second Table, if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), Appendix, Intro, ‘Whether or no things indifferent can be commanded because indifferent?’</cite>, p. 656</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-8b4ec1842b" data-kw="">
<blockquote><p>The Anatomie of Abuses probably carried additional weight with a certain class, because in its attitude toward the drama it took in the first edition a liberal position. The preface of that edition was careful to explain that its author did not condemn all plays. ‘Who seeth not,’ it read, ‘that some kind of playes, tragedies and enterluds, in their own nature are not onely of great ancientie, but also very honest and very commendable exercyses,’ containing matter ‘both of doctrine, erudition, good example, and wholsome instruction; And may be vsed, in tyme and place conuenient, as conducible to example of life and reformation of maners.’ In thus commending ‘honest &amp; chast playes’ as a Godly recreation of the min,’ and as a ‘good example of life,’ Stubbes advanced close to Lodge’s position. Yet, strange to say, in all subsequent editions this explanatory preface was left out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-stubbes.html">Philip Stubbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Stubbes’ Outlook | Elbert N.S. Thompson, XX. The Controversy Between the Puritans &amp; the Stage in Yale Studies in English PhD diss. (NY: Henry Holt &amp; Co., 1903)</cite>, pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>The covenant of grace in Christ is made only with the Israel of God, the church of the elect. … The covenant of grace, as reduced into the form of a testament, confirmed by the blood of Christ, doth not depend on any condition or qualification in our persons, but on a free grant and donation of God, and so do all the good things prepared in it.</p></blockquote>

<blockquote><p>In the very morning of the creation, God revealed himself to man as a holy and just God, whose eyes could behold no iniquity; and therefore he made him upright, and made a covenant of life and peace with him, to give him immortal and eternal life,—to continue him in his happy estate, if so be he continued in well-doing; Rom. 10.5, “do this and live.”

In which covenant, indeed, there were some outbreakings of the glorious grace and free condescendency of God; for it was no less free grace and undeserved favour to promise life to his obedience, than now to promise life to our faith. So that if the Lord had continued that covenant with us, we ought to have called it grace, and would have been saved by grace as well as now; though it be true, that there is some more occasion given to man’s nature to boast and glory in that way, yet not at all before God, Rom. 4.2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker Academic, 2017), pp. 41-42</span></figcaption>

</figure><figure class="quote" id="q-0763d9d644" data-kw="">
<blockquote><p>Secondly, he [Peter] calleth to their remembrance the vocation of the Jews, and promise of God, alleging the covenant or testament of God, made in the time past with Abraham. You (sayeth he) are the children of the covenant, which God made with your fathers, saying to Abraham: Euen in thy seed shall all the kindreds of the earth be blessed. He seemeth by an Hebrew phrase to call them the children of the Testament, to whom the Testament belonged, and which were Heirs written in the Testament of God. For so we read they are called the children of wrath, or death, whom God in his wrath appointeth to death.

Peter seemeth to make two arguments. The first is of a thing before denounced or shewed, saying: God in the Testament which he made with your fathers hath written you for heirs also. Ergo, the salvation contained in the Testament of God, belongeth as well to you as to the fathers. The Antecedent needed no great proof, with those who knew the promise of God well enough: I will be thy God, and the God of thy seed after thee. Then alleging the sum and effect of the Testament, he proveth by an argument a comparatis, that is, of things compared or laid together, that they cannot be excluded from the promises.

For thus God testified to their father Abraham, that in his seed all the Nations of the earth should be blessed. And if the Testament of God extended to foreign Nations, who I pray you will deny that it appertaineth to them that be born of the stock of Abraham? Yet let us always remember that Peter speaketh these things conditionally, and that salvation is promised to them which (by the faith that was in Abraham) take hold of Christ, lest we attribute unto carnal generation, that which dependeth upon the mere grace of God, and his free election, as Paule at large proveth to the Romans, the ix. Chapter.

By this place may the madness of the Anabaptists be confuted, which will not admit the children born of the faithful into the society and fellowship of Christ’s Church, yet none of us deny but that salvation standeth in God’s election, and not in carnally generation. In the meane while where as God in his Testament hath long since included the children of the faithful: it may seem great rashness to deny them the communion of the Testament and Church of God.

Shall we think the conditions of the new Testament more hard and grievous for our children, than the old were, when by Circumcision the eighth day they were taken into the fellowship of the people of God? Or shall the authority of Christ be of no force with us, which attributeth faith to little children, and affirmeth that the kingdom of heaven pertaineth to them? Or what shall we say to Paule, which speaking of unlike marriages, feareth not to call those children holy, which have but one parent only, be it father or mother that is a Christian? Let us therefore avoid the heady audacity of our judgement, and constantly keep the articles of God’s covenant, where it is manifest, that salvation is promised even to very children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An hundred, threescore and fifteen Homilies or Sermons, upon the Acts of the Apostles, written by Saint Luke</cite>, trans. John Bridges (London: Henry Denham, 1572), pp 185-86.</span></figcaption>

— Rudolf Gwalther, An hundred, threescore and fifteen Homilies or Sermons, upon the Acts of the Apostles, written by Saint Luke, trans. John Bridges (London: Henry Denham, 1572), pp 185-86.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly%2C+he+%5BPeter%5D+calleth+to+their+remembrance+the+vocation+of+the+Jews%2C+and+promise+of+God%2C+alleging+the+covenant+or+testament+of+God%2C+made+in+the+time+past+with+Abraham.+You+%28sayeth+he%29+are+the+children+of+the+covenant%2C+which+God+made+with+your+fathers%2C+saying+to+Abraham%3A+Euen+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed.+He+seemeth+by+an+Hebrew+phrase+to+call+them+the+children+of+the+Testament%2C+to+whom+the+Testament+belonged%2C+and+which+were+Heirs+written+in+the+Testament+of+God.+For+so+we+read+they+are+called+the+children+of+wrath%2C+or+death%2C+whom+God+in+his+wrath+appointeth+to+death.%0A%0APeter+seemeth+to+make+two+arguments.+The+first+is+of+a+thing+before+denounced+or+shewed%2C+saying%3A+God+in+the+Testament+which+he+made+with+your+fathers+hath+written+you+for+heirs+also.+Ergo%2C+the+salvation+contained+in+the+Testament+of+God%2C+belongeth+as+well+to+you+as+to+the+fathers.+The+Antecedent+needed+no+great+proof%2C+with+those+who+knew+the+promise+of+God+well+enough%3A+I+will+be+thy+God%2C+and+the+God+of+thy+seed+after+thee.+Then+alleging+the+sum+and+effect+of+the+Testament%2C+he+proveth+by+an+argument+a+comparatis%2C+that+is%2C+of+things+compared+or+laid+together%2C+that+they+cannot+be+excluded+from+the+promises.%0A%0AFor+thus+God+testified+to+their+father+Abraham%2C+that+in+his+seed+all+the+Nations+of+the+earth+should+be+blessed.+And+if+the+Testament+of+God+extended+to+foreign+Nations%2C+who+I+pray+you+will+deny+that+it+appertaineth+to+them+that+be+born+of+the+stock+of+Abraham%3F+Yet+let+us+always+remember+that+Peter+speaketh+these+things+conditionally%2C+and+that+salvation+is+promised+to+them+which+%28by+the+faith+that+was+in+Abraham%29+take+hold+of+Christ

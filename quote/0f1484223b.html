<blockquote><p>IV… The soul, being simple and immaterial—opposite to material things—existing wholly in the whole body and in each of its parts, [in the Garden of Eden] subsisted independently of the body in both being and operation, and it would have persisted independently of the body even after death, contrary to the claims of Socinus.</p></blockquote>

<blockquote><p>7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).</span></figcaption>

</figure><figure class="quote" id="q-81609f3c8d" data-kw="">
<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10).

2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6).

3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment.

4. No glory to God could arise from this but rather the dishonor of a tyrannical lord.

5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing.

2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself.

3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such.

4. We are permitted to kill innocent creatures. Reply.

1. Not rational ones.

2. Irrational ones (bruta) for our use (2 Pet. 2:12).

3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, pp. 84-85, 112-13, 121-22</span></figcaption>

<blockquote><p>15. What is philosophy, and what is its relation to theology ? Philosophy, in its wide sense, embraces all human knowledge, acquired through the use of man’s natural faculties, and consists of that knowledge interpreted and systematized by the reason. Science is more specific, relating to some special department of knowledge thoroughly reduced to system… Philosophy is presupposed, therefore, in science as the first and most general knowledge. It inquires into the soul and the laws of thought, into intuition and ultimate truth, into substance and real being, into absolute cause, the ultimate nature of force and will, into conscience and duty. As to its relations to theology it will be observed — 1st. The first principles of a true philosophy are presupposed in all theology, natural and revealed. 2d. The Holy Scriptures, although not designed primarily to teach philosophy, yet necessarily presuppose and involve the fundamental principles of a true philosophy. Not the inferences of these principles drawn out into a system, but the principles themselves, as to substance and cause, as to conscience and right, etc. … 4th. The devout believer, however, who is assured that the Bible is the very word of God, can never allow his philosophy, derived from human sources, to dominate his interpretation of the Bible, but will seek with a docile spirit and with the assistance of the Holy Spirit, to bring his own philosophy into perfect harmony with that which is implicitly contained in the Word. He will, by all means, seek to realize a philosophy which proves itself to be the genuine and natural handmaid of the religion which the Word reveals.</p></blockquote>

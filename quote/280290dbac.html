<main class="wrap"><figure class="quote" id="q-280290dbac" data-kw="">
<blockquote><p>I have endeavoured to give the Law its due, and the Gospel its due, remembering that of Luther […] He that knoweth how to distinguish between Law and Gospel, let him give thanks to God, and know that he is a Divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), epistle to the reader.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d34b1bacb7" data-kw="">
<blockquote><p>Do you see how he makes this the distinction between law and gospel: that the former attributes righteousness to works, the latter bestows free righteousness apart from the help of works? This is an important passage, and one that can extricate us from many difficulties if we understand that righteousness which is given us through the gospel has been freed of all conditions of the law. (Calvin commenting on Romans 10:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-eec03fdec4" data-kw="">
<blockquote><p>Q. What is the Moral Law?

A. It is a Doctrine commanding the perfection of Godliness, and Righteousness, binding us to eternal death for our least defect therein; which Law is handled at large throughout the whole Scripture, but is summarily contained, first into ten words, or ten Commandments, written by God’s own finger at the first, in Tables of stone: to signify thereby, not only the hardness of our hearts, in which they ought to be imprinted; but also the perpetual use of them, to the very end of the world. And after, further abridged into two Commandments by our Saviour Christ, containing the sum of the whole Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), pp 74-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>1. Affections, considered in themselves, have always an incomplete, imperfect act of the will or volition joined with them. They are something that lies between the firm purpose of the soul and the execution of that purpose. The proper actings of affections lie between these two; that is, in an incomplete, tumultuary volition. That God is not obnoxious to such volitions and incomplete actings of the will, besides the general consideration of his perfections and blessedness premised, is evident from that manner of procedure which is ascribed to him. His purposes and his works comprise all his actings. As the Lord hath purposed, so hath he done. “He worketh all things after the counsel of his own will.” “Who hath known his mind? or who hath been his counsellor? Of him, and through him, and to him, are all things.”

2. They have their dependence on that wherewith he in whom they are is affected; that is, they owe their rise and continuance to something without him in whom they are. A man’s fear ariseth from that or them of whom he is afraid; by them it is occasioned, on them it depends. Whatever affects any man (that is, the stirring of a suitable affection), in all that frame of mind and soul, in all the volitions and commotions of will which so arise from thence, he depends on something without him. Yea, our being affected with something without lies at the bottom of most of our purposes and resolves. Is it thus with God, with him who is I AM? Exod. iii. 14. Is he independence upon any thing without him? Is it not a most eminent contradiction to speak of God in dependence on any other thing? Must not that thing either be God or be reduced to some other without and besides him, who is God, as the causes of all our affections are? ” God is in one mind, and who can turn him? what his soul desireth, that he doeth,” Job xxiii. 13.

3. Affections are necessarily accompanied with change and mutability; yea, he who is affected properly is really changed; yea, there is no more unworthy change or alteration than that which is accompanied with passion, as is the change that is wrought by the affections ascribed to God. A sedate, quiet, considerate alteration is far less inglorious and unworthy than that which is done in and with passion. Hitherto we have taken God upon his testimony, that he is the “Lord, and he changeth not,” Mai. iii. 6; that “with him there is neither change nor shadow of turning; “-—it seems, like the worms of the earth, he varieth every day.

4. Many of the affections here ascribed to God do eminently denote impotence; which, indeed, on this account, both by Socinians and Arminians, is directly ascribed to the Almighty. They make him affectionately and with commotion of will to desire many things in their own nature not impossible, which yet he cannot accomplish or bring about (of which I have elsewhere spoken); yea, it will appear that the most of the affections ascribed to God by Mr B[iddle]., taken in a proper sense, are such as are actually ineffectual, or commotions through disappointments, upon the account of impotency or defect of power.

Corel. To ascribe affections properly to God is to make him weak, imperfect, dependent, changeable, and impotent.</p></blockquote>

<blockquote><p>But let us hear what reasons may be alleged to the Universality of redemption: I. Ezekiel 33. v. 11. As I live saith the Lord, I will not the death of the wicked: but, that the wicked return from his wicked way. Answ. The place is to be understood not simply but in respect; of the twain God rather wills the repentance of the sinner then his death. Again, he wills not death as it is the destruction of his creature; and so this place may be understood: yet nevertheless he wills the same as it is a means of manifestation of his justice: and therefore the prophet Esai saith, that God createth evil.

II. 1. Tim. 2. God would have all men to be saved and come to the acknowledgement of the truth. Ans. The place is meant not of the persons of all particular men, but of the orders and kinds of men. For in the first verse Paul exhorted Timothy that prayer should be made for all men: and in the second verse opening his own meaning, he addeth these words, for kings and all that be in authority: as though he should say, we must pray not only for private men and for the common people, but also for public persons, though they persecute the Gospel. But why? because in that very order God hath his elect which shall be saved. And on this manner Paul expounds himself elsewhere. There is neither Jew nor Grecian: there is neither bond nor free: there is neither male nor female: for ye are all one in Christ.

III. Rom. 11. v. 32. God hath shut up all in unbelief that he might have mercy on all. Ans. The word all, must be understood of all that are to be saved, both of Jews and Gentiles, as the article added to all importeth, and the meaning is, that God will save all whom he purposeth to save of his mercy, and not of their merit, because all are sinners as well Jews as Gentiles: thus Paul expounds himself, Galat. 3.22. The scripture hath concluded all under sin, that the promise by the faith of Jesus Christ should be given to them that believe. And if we should expound the word all, for every particular man, as some would have it, Paul must contradict himself, who said before that God would have mercy on whom he will have mercy, and whom he will he hardeneth, and in this very chapter his drift is to prove the rejection of the Jews, and the calling of the Gentiles.

IV. Joh. 3. 16. God so loved the world that he hath given his only begotten son, that whosoever believeth in him shall not perish but have everlasting life: and Joh. 6.51. I will give my flesh for the life of the world. Answ. By world, we must not understand every particular man in the world, but the Elect among the Jews and Gentiles: for in both these places Christ doth overthwart the conceit of the Jews, which thought that they alone were loved of God, and not the Gentiles. And how this word is to be understood in the new testament, Paul doeth fully declare. Rom. 11. v. 12. If (saith he) the fall of them, that is, the Jews, be the riches of the world, and the diminishing of them the riches of the Gentiles, &amp;c. and v. 15. If the casting away of them be the reconciling of the world, what shall the receiving be but life from the dead. Where by the world, he understands the body of the Gentiles in the last age of the world. And thus he fully declares his own meaning, when he saith to the Corinthians, God was in Christ reconciling the world unto himself.

V. Rom. 14. v. 15. Destroy not him with thy meat for whom Christ dyed. 2. Pet. 2.1. Denying the Lord that bought them, and bring upon themselves swift damnation. Therefore Christ died for them also which are condemned. Answ. The reason is not good. For in these and such like places the scripture speaks of men, not as they are indeed before God, but as they are in appearance and profession, and as they are in the acceptation with men. For so long as a man holds and embraces the Christian faith, so long in the judgement of charity we must esteem him to be one that is redeemed by Christ, though indeed he be not. And this is the meaning of Peter when he saith, that false prophets deny the Lord that bought them.

VI. In the preaching of the gospel grace is freely offered not only to the Elect, but to all men indifferently: and God in offering grace deludes no man: and therefore Christ’s death appertains and belongs to all men indifferently. Answer. The preaching of the Gospel is an ordinance of God appointed for the gathering together and the accomplishment of the number of the elect: and therefore in the ministerial of the word, grace and salvation is offered principally and directly to the elect; and only by consequent to them which are ordained to just damnation: because they are mingled with the elect in the same societies: and because the ministers of God, not knowing his secret counsel, in charity think all to be elect. And though God in offering grace do not confer it to all, yet is there no delusion. For the offering of grace doth not only serve for the conversion of a sinner, but also to be an occasion by men’s fault of blinding the mind and hardening the heart, and of taking away excuse in the day of judgement.

To conclude this point; Universal redemption of all men, we grant: the Scripture saith so: and there is an universality among the elect and believers: but universal Redemption of all and every man as well the damned as the elect and that effectually, wee renounce as having neither footing in the scripture, nor in the writings of any ancient and orthodox divine, for many hundred years after Christ, his words not depraved and mistaken.</p></blockquote>

</figure><figure class="quote" id="q-d86c6c4121" data-kw="">
<blockquote><p>All the fulness of the Godhead.] That is, not some portion of the Divinity, which the Gentiles had an erroneous persuasion of concerning their false gods; neither excellent endowments of Divine grace and munificence only, which are common to angels, and prophets, and other holy men: but the Lογος itself—true and perfect God, with all his Divine attributes, namely, infinite wisdom, power, goodness, dwells in this human nature of Christ.

And the Apostle seems to allude to the ark of the covenant: for God promised that he would dwell there, hear them from thence, and be propitious to them: and, furthermore, the Apostle intimates, that the ark and the propitiatory, or mercy-seat, were types of Christ, and that the Deity dwelt in a much more excellent way in his human nature, than he did formerly in the tabernacle, concerning which it is written, Exod. xxix. 44, 45, I will sanctify the tabernacle of the testimony, and I will dwell among the children of Israel, &amp;.c.

As, therefore, the Jews, who had an appointed place whence God uttered his oracles, and made known his will, could not, without sin, enquire elsewhere about things pertaining to God; so we, who have the fulness of the Godhead dwelling in the body of Christ, cannot seek either the will of God or our salvation elsewhere, without the greatest folly and impiety.

Hence we learn,

1. As often as seducers endeavour to lead us away from the Gospel and from Christ, to their traditions and inventions, we must seriously reflect what kind of Saviour and Teacher Christ Jesus was; viz. one in whom dwelt all the fulness of the Godhead; and it is the height of madness to require new teachers after him.

2. Whoever, therefore, wanders out of Christ, or mixes any other thing with his doctrine as necessary to salvation, he accuses Christ of imperfection, and denies the fact that all the fulness of the Godhead dwelt in him.

3. This we observe in the Turks and Jews, who are not content with the Gospel doctrine, because they do not believe that all the fulness of the Godhead dwelt in him who proclaimed the Gospel. As to Papists, who, being fascinated with novel and marvellous error, acknowledge that all the fulness of the Godhead is in Christ, yet deny that all the fulness of salvation is contained in his doctrine, I know not what to say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 412-13.</span></figcaption>

<blockquote><p>From the points which have been so far upheld against middle knowledge it is clear that the whole difficulty in the present controversy reduces to this one point: Could free conditioned things, from eternity indifferent by nature to futurition or nonfuturition, have passed over into the state of a future event otherwise than by the divine decree? This is the fundamental of fundamentals, on which the whole weight of the case rests. This is that postulate, which both we cannot concede to our adversaries and they cannot prove to us. …Middle knowledge is effective and congruous for any end by its nature. Upon it God is forced to wait in the wise framing of His decrees, which are bound to have a fixed result. The truth or falsity of future conditioned free ones is not known from their causes or from the divine decree, but from the actual occurrence of the thing. Before every act of His will God can see certainty in things quite uncertain by their nature. In short, there is an ens independent of the supreme ens.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, 80ff.</span></figcaption>

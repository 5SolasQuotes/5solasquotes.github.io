<main class="wrap"><figure class="quote" id="q-f73420d41d" data-kw="">
<blockquote><p>We think that even the adversaries acknowledge that, in justification, the remission of sins is necessary first. For we all are under sin. Wherefore we reason thus: To attain the remission of sins is to be justified, according to Ps. 32:1, ‘Blessed is he whose transgression is forgiven.’ By faith alone in Christ, not through love, not because of love or works, do we acquire the remission of sins, although love follows faith. Therefore by faith alone we are justified, understanding justification as the making of a righteous man out of an unrighteous, or that he be regenerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession</cite>, Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004), pt. 2 | pt. 5, That we obtain remission of sins by faith alone in Christ</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-237767f776" data-kw="">
<blockquote><p>Thesis 10. And it also follows from this that the word ‘to be justified’ in this argument in no way should be thus understood as if that righteousness of Christ were infused into us. Rather, it is thus declared that, having seized Christ Himself together with His righteousness by faith, we are absolved from all our sins and death, and through the one same Christ Himself we are declared worthy of eternal life in the one same Christ. But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses Written Out in Full with the Unanimous Consent of the Pastors of the Swiss Churches by the Authority of the Very Distinguished Senate of Bern</cite>, 1588’ in Justification by Faith Alone: Selected Writings from Theodore Beza (1519-1605), Amandus Polanus (1561-1610), Francis Turretin (1623-1687), trans. Casey Carmichael in Classic Reformed Theology (RHB, 2023), pp. 113-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thesis 10. And it also follows from this that the word ‘to be justified’ in this argument in no way should be thus understood as if that righteousness of Christ were infused into us. Rather, it is thus declared that, having seized Christ Himself together with His righteousness by faith, we are absolved from all our sins and death, and through the one same Christ Himself we are declared worthy of eternal life in the one same Christ. But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.”

<blockquote><p>(2) “He that is just, let him be justified still” (Rev. 22:11). I respond, That is to say, He that is justified, let him continue to declare himself justified, or, He who has been justified with respect to the first constitution of justification, let him, by renewing faith, act such that his justification may be continued.</p></blockquote>

</figure><figure class="quote" id="q-2b47bfaab1" data-kw="">
<blockquote><p>7. Man may be justified before man, not by man only, but by God also.

8. God also may justify us before man by our formal and inherent righteousness. Thus by sundry means here upon earth He sometimes justifies his children against the sundry calumniations and slanders of wicked men: But more specially He will do it at the Day of Judgment, in the face of the whole world, manifesting not only that righteousness of theirs, which they have in and by Christ; but the inherent innocency, integrity and sincerity of their hearts and ways, so much belied and traduced by the wicked enemies of sanctity and religion.</p></blockquote>

<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Perseverance, Explained &amp; Confirmed</cite>, ... (London, 1654), ch. 5, pp. 118-120</span></figcaption>

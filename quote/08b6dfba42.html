<blockquote><p>Question: Is it simply unlawful to play for any money at all, the game being lawful? Answer: No; if the play be for a small matter, the loss whereof is no hurt to him that loses it, and if it be applied to a common good, and be bestowed in some honest meeting for the increase of love, then it is lawful: otherwise not.</p></blockquote>

<blockquote><p>Gataker’s opinion on the nature of lots eventually was commonly accepted. Plagiarized versions of his arguments in favour of the use of cards and dice in sport appeared as early as 1633 (Downe, 1633). Clark (1916) credits Gataker’s (1619) work as instrumental in ending the Christian practice of divination by lot, although it was practiced sporadically by some Christian groups including the Wesleys into the eighteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-r-bellhouse.html">D.R. Bellhouse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Probability in the Sixteenth &amp; Seventeenth Centuries: An analysis of Puritan Casuistry” in International Statistical Review, 56, 1 (1988), pp. 63-74 with a bibliography</cite>, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>
<div class="actions"><button class="copy" data-copy="“Gataker’s opinion on the nature of lots eventually was commonly accepted. Plagiarized versions of his arguments in favour of the use of cards and dice in sport appeared as early as 1633 (Downe, 1633). Clark (1916) credits Gataker’s (1619) work as instrumental in ending the Christian practice of divination by lot, although it was practiced sporadically by some Christian groups including the Wesleys into the eighteenth century.”

</figure><figure class="quote" id="q-dfed102fe5" data-kw="">
<blockquote><p>…there is a certain other kind of gaming which stands partly upon chance and partly upon industry, as is playing at tables, and such like, where in very deed they cast by chance, but the casts are governed by endeavor. Wherfore Plato affirmed the life of man to be like unto the playing at tables. For even as in table-play, so also in the life of man, if anything chance amiss, the same by art must be corrected. Unto which sentence Terence in his Comedy Adelphorum alludes. And indeed these kind of plays seem to be such, that sometime they may be permitted, so that they hurt not, so they recreate the spirits and be joined with honesty, and that the time, which should be spent vpon better things, be not consumed in these… But what shall we answer unto Ambrose?… the reason, which Ambrose first alleged, was because there was nothing found in the holy Scriptures, how these things ought to be used. Thereunto we answer that they are found in the holy Scriptures generally, ‘Whether ye eat, or whether ye drink, or whether you do anything else, do all things to the glory of God.’ (1 Cor. 10:31) Wherefore the body and the mind must otherwhiles be so refreshed with plays, as afterward we may be cheerful and prompt to weightier matters. Furthermore, there is nothing found particularly in the Scriptures touching bakers, cooks, or shipmen, and yet nevertheless their exercises must not be altogether excluded… But now to conclude, me thinks that those kind of [stage] plays, which serve for refreshing of men’s strength, are not utterly to be forbidden.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (London: Rowe, 1583), pt. 2, ch. 12, 8th Commandment, ‘Of Plays or Pastimes,’</cite>, pp. 526-27</span></figcaption>

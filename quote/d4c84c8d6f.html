<main class="wrap"><figure class="quote" id="q-d4c84c8d6f" data-kw="">
<blockquote><p>But William III. was a great politician, and would have every thing in the kingdom managed by the court. And there are his correspondents. There sits William Carstares, the son of John Carstares. The father had been an old unbending covenanter, and the son had been so deeply implicated in some of the political movements against the Stuart dynasty, that he had been in danger of his life, and subjected to the torture of the thumb-kins to extort from him some confessions.

He is evidently of a more modern school than the father, and has all the air of a finished diplomatist. The bosom friend and councillor of King William, he is now the acknowledged leader of the Scottish Church, and an eyesore to the Jacobites, who hate him most cordially for his politics, while he is rather suspected by some of his friends of too much leaning to the court.

See how anxious he is to repress the sallies of his more zealous and less courtly brethren! He knows all the wheels within the wheels of the state engine, and the exact degree of pressure it is able to bear; and he is trembling lest some rash ebullition of clerical steam should produce an explosion, and run the newly started establishment off the rails! “He is a fat, sanguine-complexioned, fair man,” says a Jacobite spy, “always smiling when he designs most mischief; a good friend when he is sincere; turned of fifty years old.” “He delivers himself so gravely and distinctly,” writes an admirer, “with such an acceptable pathos and well-placed accent, and all the other advantages of a natural and easy eloquence.” “He is the cunningest dissembler in the world, with an air of sincerity,” say his political enemies. “He preserved,” say his friends, “through all vicissitudes of fortune, the same humble spirit and simple worth, the same zealous and sincere piety, the same amiable and affectionate heart.”

“I have known him long,” says King William, “I know him thoroughly, and I know him to be a truly honest man.” Alas, for human nature! both portraits may have been founded in truth. Carstares at his own fireside, and Carstares at the head of the Assembly, may have been very different characters! We shall always feel respect for the man who, when in London, and hearing that a royal mandate had been sent down to dissolve the Assembly in the king’s name, at the risk of his life intercepted the message, and rushing into the king’s bed-chamber in the middle of the night, threw himself on his knees to obtain his majesty’s pardon. Nor can we help loving the man who, on learning that his inveterate opponent, Curate Calder, the reviler of the Presbyterians, was in abject poverty, sent for him, and observing the seedy condition of his coat, affected to be in a great rage at his tailor for having made him a suit of clothes which did not fit him, and insisted upon Calder donning them on the spot.

We cannot, however, shut our eyes to his defects. Carstares was a partisan of the court. He is said to have been the first to introduce the custom, which has ever since been observed, of the Moderator opening the Assembly by a formal address. It would have been well had this been the only novelty he introduced; but there is reason to fear that to him may be traced the commencement of the policy which so long reigned dominant in that court, that of managing the affairs of the Church through a junto in close correspondence with government, and acting under its secret instructions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Marrow Controversy: with Notices of the State of Scottish Theology in the beginning of the last century’, British and Foreign Evangelical Review</cite></span></figcaption>

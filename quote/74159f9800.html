<main class="wrap"><figure class="quote" id="q-74159f9800" data-kw="">
<blockquote><p>And for my part this I say, and I say it with much integrity, I never yet took up religion by parties, in the lump; I have found by trial of things, that there is some truth on all sides. I have found holiness where you would little think it, and so likewise truth; and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion. My brethren, this rule that I have now mentioned (which I profess I have lived by, and shall do while I live), I know I shall never please men in it. Why? it is plain, For this is the nature and condition of all mankind; if a man dissents from others in one thing, he loses them in all the rest; and therefore if a man do take what is good of all sides, he is apt to lose them all, but he pleases Christ by it, and so will I for this particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, p. 559</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f10d1f2232" data-kw="">
<blockquote><p>Moreover this Assembly entreats and exhortsall for God’s sake, and the glory of his great name, and their own salvation,and for the peace and welfare of the nation; yea, it adjures by all that is desirable or commendable, the whole body of our communion in general, and every faitful soul in particular, to divest themselves of all animosities whatsoever, and to lop off immediately all dissolutions and dissensions, lest they should be the causes of the dissipation of the Churches of God in this kingdom. And all pastors and elders of Churches are enjoined diligently to procure the reunion of the respective members of their flocks, and to lend one another their helping hand to effect so good a work, and mightily to insist upon it in their public sermons, and private exhortations and remonstrances; And in case they should meet with contempt, scorn and reproach in the discharge of this their duty, and that any one, through an obdurate perverseness, should show himself implacable and irreconcilable, this Assembly, according to that authority which the great God gives unto the ministers of his holy Word, denounces to them the dreadful judgments of God, and wishes they may be had in execration” (that is, detestation) “among and by all the faithful; yea, all the censures of the Churchshall be exerted against such refractory persons, and the utmost rigor of our discipline shall be inflicted and executed upon them, lest the good name of God should be blasphemed through our sins, and that we may not contract upon ourselves the guilt of the Church’s desolation.</p></blockquote>

squotes.github.io%2Fquote%2Ff10d1f2232.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f10d1f2232.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=Moreover%20this%20Assembly%20entreats%20and%20exhortsall,the%20guilt%20of%20the%20Church%E2%80%99s%20desolation&amp;text=Moreover%20this%20Assembly%20entreats%20and%20exhortsall%20for%20God%E2%80%99s&amp;text=upon%20ourselves%20the%20guilt%20of%20the%20Church%E2%80%99s%20desolation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-68b231c68e" data-kw="">
<blockquote><p>You must do it in a peaceable way, so as to manifest that you desire peace, and not to be the least disturbance to the peace of the Church, but that the peace of it is dear and precious to you; therefore, when ye have witnessed the truth, and discharged your conscience in it, you must then be content to sit down quiet: For so the rule is, ‘That the spirits of the prophets must be subject to the prophets,’ in that case. But if it should prove that the Church should continue, if the evil be notorious and great as requires departing, and the Church, after all means used, and all patience, should continue in it; in such a case you may desire to be dismissed from it and depart, but in as peaceable a way as possibly can be; yet continuing in due respect unto the Church for all that, though you should depart, only leaving your witness behind you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-8b60e1e0ff" data-kw="">
<blockquote><p>That Scripture, Rom. 16:17, does not command us to avoid everyone that causes divisions and offenses occasionally and passively, by giving the first rise to divisions by offensive courses; for that way divisions may be caused by infirmities and a man’s using his own light, and by the offense of others, whom upon that account to avoid, were contrary to the same apostle’s doctrine in that same epistle, chs. 14 and 15. But it commands us to avoid them which cause divisions and offenses actively, designedly and purposely, and do promote and abet a downright schism, and will not be persuaded to let divisions fall, though it may be done without prejudice to truth. Next, to “avoid,” there is the same with the duty of turning away, 2 Tim. 3:5, extended there to self-lovers, covetous proud, unholy, having a form of godliness without the power. This cannot be interpreted always and only of withdrawing from Church-communion; for then we must withdraw from all that are self-lovers, from all that are unholy, from all that are hypocrites, which none will affirm: But we may avoid men several other ways, by withdrawing from personal communion with them, or familiar converse, and from communion in their corrupt designs and courses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>If (we say) there be truth at the bottom of these things, and if in speaking and writing thereof they have these good ends before them which they have professed, then may the Lord through grace therein accept, and hear, and have compassion upon them and His people, by finding out the means to purge His House, though men will not hear, nor pity, but accompt them foul slanderers and subtle subverters for discovering and complaining of these things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (Edinburgh, 1658), p. 27</span></figcaption>

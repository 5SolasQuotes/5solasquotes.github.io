<main class="wrap"><figure class="quote" id="q-ce4875884b" data-kw="">
<blockquote><p>And then (saith he) it shall come to passe, that all the people of Israel shall be saved: which testimony of the Apostle is a sufficient argument to declare, that the Jews shall be restored again, if I be not deceived. … But the knowledge of the certain moments and appointed minutes of that time, we commit unto the Lord. This only we learn most assured out of S. Paul, that God hath decreed upon an infallible certainty of time, wherein the Gentiles shall mount to their fullness, and the Jews also after that fullness of time shall return unto the faith.

For speedy &amp; good success whereof, this one thing doth minister plentiful matter of good hope, yet our Lord Jesus Christ hath vouchsafed to cleanse his Churches every where almost so happily in these our days, &amp; purged them from all offences &amp; stumbling blocks, which occasioned the Jews to withdraw themselves so long from the participation of our faith.

And here I might use offered opportunity, to exclaim against the presumptuous boldness of those persons whatsoever they were, which presumed to thrust into Temples and Churches of Christians, images, and counterfeits of the saints and the saints at the first, and to convey the pure worshipping of the invisible God, to the representations of visible things, contrary to the prescript ordinance of the Law of God, contrary to reason &amp; nature, contrary to the approved custom of the elders, &amp; contrary to all example of the Patriarchs, Prophets &amp; Apostles: out of which puddle as issued wonderful stench, so amongst all other, nothing more noisome then those pestilent Botches of image worship, bread worship, wine worship, cross worship, signs &amp; portraits of visible creatures, the view whereof caused the true and sincere profession of the Christians to be loathsome to the Jews, to their great hindrance and prejudice.

For what marvel was it if the Jews (yet were taught by the prescript rule of God’s law to abhor worshipping of images) entering into the churches of Christians, &amp; beholding the walls, pillars, &amp; all the corners thereof, bedaubed with painted, &amp; carved idols, besides innumerable other bables of imagery, perceiving also open market to be made, not only of the picture of the crosse, but of the sacrament of bread &amp; wine also, displayed &amp; blazed abroad not after the manner of communicating, but gloriously vaunted with singular magnificence to be honoured and kneeled unto: what marvel was it (I say) if they being offended with this open idolatry, did so long refrain from us, and from the discipline of our faith?

But it is well now, thanked be Christ, yet these offensive baggage &amp; image worshippings are for yet more part defaced &amp; scraped out of Christian churches, &amp; the ancient purity of Christian profession, is begun to take so good footing, yet now amongst us remain no dregs in our temples, in our religion, nor in our doctrine, that may minister just occasion of offence to the Jews, or any other enemies, though they inveigh our religion never so much.

And I would to God, all other that profess the name of Christians, would yield their like endeavour to the abolishment of all corruptions of religion, and incivility of living out of their congregations, which may breed any further loathsomeness to the Jews. Truly this is much to be lamented, that our adversaries can find no blemish of just quarrel in the person of Christ Jesus, whose name we would seem to profess: and on the other side, to wit, in us nothing consonant, and agreeable to the true touchstone of Gods holy word, and Christ’s religion, whereof we bear the name, but all things repugnant and unlike the pure &amp; first pattern thereof. …

We have been plagued sufficiently enough by the Turks [Muslims] and Saracens for our idolatry, if we respect the sundry overthrows, famines, slaughters, and alterations of kingdoms, wherewith the Christians have been miserably tormented many hundred years, to the great delight of the Jews: neither is any hope almost of redress from great calamities, like to ensue, unless we cast away this worshipping of idols out of Christian congregations and Temples, (as I said before) and by this means enter upon a new course of better conversation and purer worshipping of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>

<blockquote><p>There may be therefore two heads of superstition. §5.

1. Negative, when men abstain from some things under a notion of religion, or worship of God, which are not forbidden by God, but left free and indifferent: either not forbidden, or, if once they were, now [they are] antiquated, or outdated… And of this sort was that, Col. 2:21, ‘Touch not, taste not, handle not;’ which was superstitious negative will-worship. §6.

2. Positive, when men of their own hearts and heads set up ways of religion, to worship God by, which He never commanded; and this (as was said) may be committed against any of the four first Commandments… Now this positive superstition may be exemplified in many particulars…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Diatribe triplex</cite>, … (London: Wright, 1654), ‘Of Superstition,’, p. 6</span></figcaption>

<blockquote><p>Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.</p></blockquote>

<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-752bf8d5c6" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called [to the Savoy Conference] by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XI. They spake not against episcopacy, as it is a presidency among and over presbyters differing in degree, and not in office, called ‘order’, and that in a Church of the lowest species. …

XIII. They said nothing against metropolitans, patriarchs, lay-chancellors, commissaries, officials, surrogates, archdeacons, etc. as officers of the king, appointed to do nothing (besides the sacred ministry if they be clergymen) but what belongs to magistracy [according to circa sara].

XIV. They said nothing against any promise of obedience to them only in the capacities and in the exercise of the power forementioned.

XV. Much less did they ever oppose or question swearing to the king, according to the oaths of Allegiance and Supremacy: And I with diverse others also being (for some ends) entered as his chaplains in ordinary, took also that Oath of Fidelity which the king’s household servants take. XVI. We never were for any dishonoring of kings by public excommunications, much less by subjects or foreigners, whom kings never choose to be their pastors; but only in case of necessity, for such a denial of sacramental communion to them, as Bishop Andrewes in Tortura Torti and Bishop Bilson [The True Difference between Christian Subjection &amp; Unchristian Rebellion, pt. 3, pp. 376-77] plead for, which is but to forbear ourselves a sinful act. XVII. We never pleaded for any elders’ (or chancellors’) power of the keys, who are but laymen. XVIII. We never held that magistrates are bound to add their force by the sword to the censures of the Church as such, and to punish men more because the Church has by excommunication cast them out, or because they are not reconciled. XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689) The preface is dated 1683., ch. 3, pp. 11-13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-979a88a1b4" data-kw="">
<blockquote><p>There is some authority in the bishops derived from the king which may be acknowledged [as] lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>

</figure><figure class="quote" id="q-f2f5bd7b0b" data-kw="">
<blockquote><p>1. It is most desirable that all kingdoms were wholly Christians, and the princes be defenders and promoters of religion, and the Church and kingdom be materially the same; and the civil government used holily, according to God’s laws, to holy ends.

2. And it is desirable accordingly, that the kingdom being all Christian, be divided into fit parts for Christian conversation [conduct] and communion, such as our parishes are, and that all be of the Church who are of the parish, and the civil state sanctified, and the ecclesiastic, grow up as body and soul into one. And that all in the parish be of one mind, and of one church; and that there be no just cause given for any to separate from the rest; nor any do it without cause.

3. And it is desirable that all these parish-churches in a kingdom living under one civil government, do by the means of senior pastors and synods, hold such correspondence as is necessary to their common concord and strength. These things being desirable, it is no wonder if good governors endeavor them, and that ignorant men plead for all such concomitants, subordinates and consequents as do suppose them. When as in fact the case being quite otherwise, to administer matters on a false supposition of the matter of fact, as if that were which is not, is but like the men of Gotham’s striving and fighting which way they should drive their sheep, and where they should pasture them, when they had none.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts</cite>, ... (1684), Unnecessary Separating Disowned, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-da5bda3de4" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: And his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Even so when Satan finds that he cannot directly destroy the unity of the Church and bring division into credit, he will be more zealous for unity than Christ Himself: He will then endure no disagreement among Christians, no not in an opinion, nor a form or ceremony; not in meats or drinks or keeping of days, or in judging of things lawful or unlawful, which are not of necessity to the Church’s concord. He is either for tolerating all propagation of heresy and practice of wickedness, or else he is so much for unity, that no difference almost is to be tolerated. For he well knows that while men are imperfect such differences will still be: And then if he can but persuade the world that for concord sake they must not be endured, what follows but that the dissenters must be fined, imprisoned or banished to bring them (or the rest) to unity. And so he will set all the world together by the ears in cruelties and bloodshed and in hating one another, and all under pretense of making them one. You may think that till mankind be all turned bedlams [mental patients], they can never be so cheated by such a gross deceit, nor ever guilty of so mad a work. But what will you say if this be the common case of the far greatest part of the Christian world? And what will you say further, if after above a thousand years’ universal experience of the unhappy success, they continue it still as the only way to unity and peace? Look but about you with opened eyes and see whether it be not so. Were not he a gracious promoter of unity in the world that would say, ‘Unity is so excellent a thing that it is meet we should be all of one complexion, or at least that the world should speak but one language; and therefore no other but one should be tolerated.’ And here how easy is it to dilate of the great inconveniences of many languages: I could write a volume in folio of it myself; and all true and evident. Methinks I see hereupon how these books are scattered and read, and how those called learned men and politicians applaud them, and shake their heads and gnash their teeth at those that would have so great a mischief tolerated: And hereupon they set about the business and desire a law that upon pain of imprisonment and banishment (I know not whither) no one in the world shall speak any other language but one. And now I hope unity will be promoted indeed, when all the world is thus engaged in a war to perfect nature and make men one. But methinks I hear one man that is awake thus bespeak the promoters of this concord: ‘Unity and concord in those points where God has made them necessary, cannot be over-valued’: But yet it is visible that there is a marvelous diversity which nature is delighted in: when of all faces and of all voices, and of all the sorts of animals and plants, there is so discernable a difference: yea of all the millions of stones in the field, no two is perfectly like each other. And where greater unity is most desirable, it must first be considered how much of it is possible or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world.’ The speech being ended, the hearers derided it and made a law for unity to destroy it, and set every man on hating and fighting against his neighbor, to make all one. It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 57, ‘Yet let not any here cheat you by overdoing, nor mere names and titles of unity deceive you instead of the thing itself…’, pp. 270-73</span></figcaption>

ne language; and therefore no other but one should be tolerated.’ And here how easy is it to dilate of the great inconveniences of many languages: I could write a volume in folio of it myself; and all true and evident. Methinks I see hereupon how these books are scattered and read, and how those called learned men and politicians applaud them, and shake their heads and gnash their teeth at those that would have so great a mischief tolerated: And hereupon they set about the business and desire a law that upon pain of imprisonment and banishment (I know not whither) no one in the world shall speak any other language but one. And now I hope unity will be promoted indeed, when all the world is thus engaged in a war to perfect nature and make men one. But methinks I hear one man that is awake thus bespeak the promoters of this concord: ‘Unity and concord in those points where God has made them necessary, cannot be over-valued’: But yet it is visible that there is a marvelous diversity which nature is delighted in: when of all faces and of all voices, and of all the sorts of animals and plants, there is so discernable a difference: yea of all the millions of stones in the field, no two is perfectly like each other. And where greater unity is most desirable, it must first be considered how much of it is possible or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world.’ The speech being ended, the hearers derided it and made a law for unity to destroy it, and set every man on hating and fighting against his neighbor, to make all one. It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.”

— Richard Baxter, The Cure of Church Divisions… (London, 1670), pt. 1, Direction 57, ‘Yet let not any here cheat you by overdoing, nor mere names and titles of unity deceive you instead of the thing itself…’, pp. 270-73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+no+part+of+religion+which+Satan+does+not+endeavor+to+destroy+under+pretense+of+promoting+it%3A+And+his+way+is+to+overgo+Christ+and+his+apostles%2C+and+to+seem+more+zealous+than+ever+they+were%2C+and+to+mend+their+work+by+doing+it+better+or+doing+more%E2%80%A6+Even+so+when+Satan+finds+that+he+cannot+directly+destroy+the+unity+of+the+Church+and+bring+division+into+credit%2C+he+will+be+more+zealous+for+unity+than+Christ+Himself%3A+He+will+then+endure+no+disagreement+among+Christians%2C+no+not+in+an+opinion%2C+nor+a+form+or+ceremony%3B+not+in+meats+or+drinks+or+keeping+of+days%2C+or+in+judging+of+things+lawful+or+unlawful%2C+which+are+not+of+necessity+to+the+Church%E2%80%99s+concord.+He+is+either+for+tolerating+all+propagation+of+heresy+and+practice+of+wickedness%2C+or+else+he+is+so+much+for+unity%2C+that+no+difference+almost+is+to+be+tolerated.+For+he+well+knows+that+while+men+are+imperfect+such+differences+will+still+be%3A+And+then+if+he+can+but+persuade+the+world+that+for+concord+sake+they+must+not+be+endured%2C+what+follows+but+that+the+dissenters+must+be+fined%2C+imprisoned+or+banished+to+bring+them+%28or+the+rest%29+to+unity.+And+so+he+will+set+all+the+world+together+by+the+ears+in+cruelties+and+bloodshed+and+in+hating+one+another%2C+and+all+under+pretense+of+making+them+one.+You+may+think+that+till+mankind+be+all+turned+bedlams+%5Bmental+patients%5D%2C+they+can+never+be+so+cheated+by+such+a+gross+deceit%2C+nor+ever+guilty+of+so+mad+a+work.+But+what+will+you+say+if+this+be+the+common+case+of+the+far+greatest+part+of+the+Christian+world%3F+And+what+will+you+say+further%2C+if+after+above+a+thousand+years%E2%80%99+universal+experience+of+the+unhappy+success%2C+they+continue+it+still+as+the+only+way+to+unity+and+peace%3F+Look+but+about+you+with+opened+eyes+and+see+whether+it+be+not+so.+Were+not+he+a+gracious+promoter+of+unity+in+the+world+that+would+say%2C+%E2%80%98Unity+is+so+excellent+a+thing+that+it+is+meet+we+should+be+all+of+one+complexion%2C+or+at+least+that+the+world+should+speak+but+one+language%3B+and+therefore+no+other+but+one+should+be+tolerated.%E2%80%99+And+here+how+easy+is+it+to+dilate+of+the+great+inconveniences+of+many+languages%3A+I+could+write+a+volume+in+folio+of+it+myself%3B+and+all+true+and+evident.+Methinks+I+see+hereupon+how+these+books+are+scattered+and+read%2C+and+how+those+called+learned+men+and+politicians+applaud+them%2C+and+shake+their+heads+and+gnash+their+teeth+at+those+that+would+have+so+great+a+mischief+tolerated%3A+And+hereupon+they+set+about+the+business+and+desire+a+law+that+upon+pain+of+imprisonment+and+banishment+%28I+know+not+whither%29+no+one+in+the+world+shall+speak+any+other+language+but+one.+And+now+I+hope+unity+will+be+promoted+indeed%2C+when+all+the+world+is+thus+engaged+in+a+war+to+perfect+nature+and+make+men+one.+But+methinks+I+hear+one+man+that+is+awake+thus+bespeak+the+promoters+of+this+concord%3A+%E2%80%98Unity+and+concord+in+those+points+where+God+has+made+them+necessary%2C+cannot+be+over-valued%E2%80%99%3A+But+yet+it+is+visible+that+there+is+a+marvelous+diversity+which+nature+is+delighted+in%3A+when+of+all+faces+and+of+all+voices%2C+and+of+all+the+sorts+of+animals+and+plants%2C+there+is+so+discernable+a+difference%3A+yea+of+all+the+millions+of+stones+in+the+field%2C+no+two+is+perfectly+like+each+other.+And+where+greater+unity+is+most+desirable%2C+it+must+first+be+considered+how+much+of+it+is+possible+or+to+be+hoped+for%2C+and+next%2C+what+are+the+proper+means+to+attain+it.+For+first%2C+the+medicining+of+all+incurable+disease%2C+especially+with+violent+physic%2C+is+not+the+way+to+make+it+better%2C+but+to+exasperate+it+and+hasten+death%2C+when+a+palliate+and+patience+might+do+better.+It+is+very+desirable+that+all+the+king%E2%80%99s+subjects+were+strong+and+beautiful+and+ingenuous+and+learned%2C+but+it+is+not+to+be+hoped%3A+But+that+they+may+be+all+loyal+and+honest+in+their+dealing+with+others+may+be+well+endeavored.+And+secondly%2C+a+wrong+kind+of+medicine+will+much+more+hasten+and+ascertain+death+than+to+let+the+disease+alone+to+nature%3A+It+is+desirable+that+all+the+kings+subjects+be+as+is+said%2C+both+wise+and+learned%2C+yea+and+perfect+in+honesty+and+piety+without+fault%3A+But+if+you+make+a+law+that+for+the+honor+of+unity%2C+all+that+are+not+learned+and+perfect+in+virtue+shall+be+fined%2C+imprisoned+or+banished%2C+the+king+nor+his+subjects+will+be+but+little+beholden+to+you+for+their+unity.+So+one+language+is+very+desirable+to+the+world%3A+But+first+it+is+not+attainable+and+secondly+a+law+to+punish+all+that+speak+another+language+is+not+the+way+to+procure+it%3B+but+to+set+them+together+by+the+ears%3A+you+must+appoint+parents+and+school-masters+to+teach+them+all+one+language+by+degrees%2C+and+keep+them+to+their+duties+and+remove+impediments%2C+and+thus+stay+the+time%3B+and+what+cannot+this+way+be+attained+must+not+be+expected+in+this+world.%E2%80%99+The+speech+being+ended%2C+the+hearers+derided+it+and+made+a+law+for+unity+to+destroy+it%2C+and+set+every+man+on+hating+and+fighting+against+his+neighbor%2C+to+make+all+one.+It+is+very+desirable+that+all+Christians+were+perfect+in+knowledge%2C+gifts+and+graces%2C+and+consequently+that+there+were+no+different+opinions%2C+nor+no+different+forms+or+modes+of+worship%2C+but+that+all+were+equal+to+the+wisest+and+to+the+most+sober%2C+pious%2C+zealous+and+sincere.+But+if+a+law+be+made+that+none+shall+be+endured+in+any+kingdom+that+are+not+of+this+temperament+and+stature%2C+the+subjects+of+all+princes+may+soon+be+numbered.+Set+parents%2C+school-masters+and+ministers+at+work%2C+to+make+men+wiser%2C+and+drive+them+on+to+diligence+in+their+duty+and+restrain+men+from+hindering+them%2C+and+from+intolerable+wickedness+and+sin%2C+and+patiently+expect+the+success+of+this%3A+And+what+this+will+not+do%2C+expect+not.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+57%2C+%E2%80%98Yet+let+not+any+here+cheat+you+by+overdoing%2C+nor+mere+names+and+titles+of+unity+deceive+you+instead+of+the+thing+itself%E2%80%A6%E2%80%99%2C+pp.+270-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda5bda3de4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da5bda3de4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=There%20is%20no%20part%20of%20religion,this%20will%20not%20do%2C%20expect%20not&amp;text=There%20is%20no%20part%20of%20religion%20which%20Satan&amp;text=And%20what%20this%20will%20not%20do%2C%20expect%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

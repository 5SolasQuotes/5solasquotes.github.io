<main class="wrap"><figure class="quote" id="q-110a252b6a" data-kw="">
<blockquote><p>We must not therefore apprehend of God, as having a new will to do a thing in time, which he had not from eternity (as [Conrad] Vorstius and others blaspheme) but his will was from all eternity, that such a thing be in time accomplished by his wisdom.

As for example, in Creation, God did not then begin to have a will to create: but he had a will from all eternity, that the world should exist in time; and thus it is in Justification and Sanctification; not that these effects are from eternity, but God’s will is: And if you ask, Why, seeing God’s will to create or justify is from eternity, Creation and Justification are not also from eternity?

The answer is, because God is a free Agent, and so his will is not a necessary cause of the thing, for then it would be immediately, as the Sun beams are necessarily as soon as the Sun is, but it is a voluntary principle, and so maketh the effect to be at the time he prescribeth. As if there were an Artificer or Carpenter, that could by his mere will cause an house to be reared up; he might will this to be done in such and such a year long after his will of it to be: So God when the world is made, when a sinner is justified, willed these things from all eternity, and when they come to have a being, these effects cause an extrinsical denomination to be attributed to God, which was not before, as now he is a Creator, and was not before, now he justifieth, and did not before. There is no change made in God, but the alteration is in the creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 165-66.</span></figcaption>

</figure><figure class="quote" id="q-5ccdcde87d" data-kw="">
<blockquote><p>…a man may be said to be justified either intentionally, or virtually, or actually; either in God, or in Christ, or in himself.

1. Intentionally in God in God’s purpose and decree: This is from all eternity, but this decree and intention does not put anything into a state of actual being, but in the fulness of time.

2. Virtually in Christ: And this is from the day of Christ’s passion, and in the virtue of his satisfaction; yet this intends no more but that satisfaction is made and remission purchased by the blood of Christ.

3. Actually in himself: When a man has the possession of justification, immediately after his union with the Lord Jesus Christ. Now this justification considered as it is a state of favor, a covenant state with God, which a man at his first believing is put into, is not reiterated, no more than a wife, after that first entrance into the relation, is frequently made a wife; yet the particular acts of pardon, and imputation of Christ’s righteousness, are continually by God communicated unto the believer. In this respect this actual justification (or particular acts of pardon) has its degrees of progression: The beginning thereof is laid in our first union and incorporation into Christ; the consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission: Between both these, there is a progressive work of justification, by the constant actings of the Spirit, applying the blood of Christ by the hand of faith, to the quiet and comfort of the soul: The first we may term initial justification, the second progressive, the last perfective; the second is the fruit of the first, and the preludial assurance of the last: The first is wrought and sealed in the first sacrament, the second is wrought and sealed in the second sacrament; and both these branches of sacramental justification, are to us the pre-assurance of that complemental and perfective justification, the sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession. It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Media: the Middle Things</cite>, … (London: Field, 1649), ch. 1, 2. ‘First Privilege: Justification’, pp. 2-3 Bedford and Ambrose were sharing some notes one way or the other.</span></figcaption>

<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works.

3. The power of nature without illumination and grace.

4. The power of the Law.

5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

<blockquote><p>Because all men be sinners and offenders against God, and breakers of His law and commandments, therefore can no man by His own acts, works, and deeds (seem they never so good) be justified, and made righteous before God: But every man of necessity is constrained to seek for another righteousness or justification, to be received at God’s own hands, that is to say, the forgiveness of his sins and trespasses, in such things as he hath offended. And this justification or righteousness, which we so receive of God’s mercy and Christ’s merits, embraced by faith, is taken, accepted, and allowed of God, for our perfect and full justification.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4d518dd603" data-kw="">
<blockquote><p>It is true, that God also elected good angels, confirming them in holiness, rendering them happy in the possession of eternal glory, and hence they are called “elect angels.” Yet they were not elected in Christ, for never having sinned, they needed no Mediator, no Redeemer — it was only necessary to insure their original integrity; but man having fallen from his innocence, it was indispensible that he should be restored to it through the medium of a surety, in the contemplation of whose merit alone we could be elected. God, then, elected us in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), p. 202.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e411c59bf1" data-kw="">
<blockquote><p>…and it is most certain that angelical persons have a limited presence, because they have a finite essince [as opposed to God]… I need say no more concerning angels than what is commonly said, ‘Angeli sunt alicuoi definitive; sunt enim in suo ubi non per operationem vel circumscriptionem, sed per designationem definitivam,’ angels are naturally somewhere; though they are not in any place by extension of parts, yet their finite nature is contained within certain bounds and limits. Hence it is that some learned men affirm that it is improper to say, that God is somewhere because He is everywhere; somewhere is a definitive word.</p></blockquote>

<blockquote><p>Evangelical,” on the other hand, although it is a fine term, does not quite seem to designate clearly enough the position of those who hold specifically to the system of doctrine taught in the Westminster Confession of Faith, as distinguished from other systems which are near enough to the truth in order that they may be called “evangelical” but which yet fall short of being the system that is contained in God’s Word.</p></blockquote>

</figure><figure class="quote" id="q-4246cbe1f0" data-kw="">
<blockquote><p>Angels are intelligent spirits free from a body. Propositions …

IV. Angels are in a particular place not as if they were enclosed within it, but to the exclusion of being anywhere else [non circumscriptive sed definitive].

V. Angels cannot be in several places at once.

VI. Angels truly move from one place to another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 56</span></figcaption>

</figure><figure class="quote" id="q-5e2deb465d" data-kw="">
<blockquote><p>Therefore, angels and human beings, because of the fact that they have been created as rational, have received from God in the very creation of a spiritual nature, the gift of eternity and happiness. This was done in such a way that, if they adhered uninterruptedly to the love of the Creator, at the same time, they would remain eternally blessed; if, on the other hand, by a decision of their own free will, they would endeavour to do their own will against the command of the Most High Creator, blessedness would immediately depart from the recalcitrant, and there would be left for them as a punishment eternal misery, henceforward subjected to error and grief. Concerning the angels, God has decided this and carried it out, that, if any of them loses the goodness of will, he will never restore it by divine gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/fulegentius-of-ruspe.html">Fulegentius of Ruspe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To Peter on the Faith</cite>, in Selected Works, trans. Robert B. Enos, The Fathers of the Church: A New Translation, vol. 95 (Washington D.C.: The Catholic University of America Press, 1997), III.32, p. 80.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

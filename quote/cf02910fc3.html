<main class="wrap"><figure class="quote" id="q-cf02910fc3" data-kw="">
<blockquote><p>We adults, who are imbued with the noxious doctrine of the papists, which we absorbed into our very bones and marrow, acquired an opinion of Christ altogether different from the one that Paul sets forth here. No matter how much we declared with our mouths that Christ had redeemed us from the tyranny and slavery of the Law, actually we felt in our hearts that He was a lawgiver, a tyrant, and a judge more fearful than Moses himself. Even today, in the great light of the truth, we cannot completely banish this wicked opinion from our minds. So stubbornly do things to which we have been accustomed since youth cling to us! You young people, who are still unspoiled and have never been infected by this wicked notion, have less difficulty in teaching purely about Christ than we adults have in banishing these blasphemous illusions about Him from our minds. Yet you have not altogether escaped the wiles of the devil. For even if you have not yet been imbued with this wicked idea of Christ as a lawgiver, you still have the same source of this idea in you, namely, the flesh, the reason, and the wickedness of our nature, which cannot think of Christ in any other way than as a lawgiver. Therefore you must contend with all your might, in order that you may learn to acknowledge and regard Christ as Paul portrays Him in this passage [Gal. 4:4-5]. But if, in addition to the wickedness of our nature, there come wicked teachers—of whom the world is full today, both the old and the new variety—they lend support to the wickedness of our nature; and the evil is doubled. For when wicked instruction is applied to a nature that is already corrupted in itself, it is impossible not to develop a false Christ. As I have said, reason invents him on its own; and then bad instruction makes him grow and impresses him on our minds so strongly that he cannot be eliminated without great labor and effort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 368–369.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-91b1f98b9f" data-kw="">
<blockquote><p>1. The beatitude of God is the eternal condition in himself of absolute satisfaction and delight. That’s bound up with God’s fullness of glory as the Father, the Son, and the Holy Spirit. Now that’s a traditional understanding of God’s beatitude. This is not something that I’m just coming up with myself. We may not hear a lot about the attribute of God’s beatitude, but it is a tradition throughout church history.

2. The outward beauty of God is expressed and perceivable as an aesthetic quality of his glory in his work of creation, redemption, and consummation. It’s important here to call attention to the distinctive characteristic of beauty. Beauty as beauty is not desired as a means to another end. Pleasure or delight associated with beholding the beautiful is its own end.

3. That characteristic to communicate the delight as its own end is correlative to that absolute self that characterizes God’s own eternal, internal life as Father, Son, and Spirit. The uniqueness of beauty, as opposed to goodness or truth (we just talked about the transcendentals there), is that beauty evokes a delight, but you don’t use that delight to then do something more. It is its own end.

4. We talk about God’s beatitude. It is its own end. It is itself delight. He’s self-satisfied. Where I draw this all together is with a postulation that the beauty of God in his outward works as it is perceived and experienced by human beings is what most clearly can be traced to that perfection of beatitude and sense of delight that belongs to God in himself as Father, Son, and Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-king.html">Jonathan King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How can I see the Beauty of God?</cite>, (2019) at Desiring God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland (1641)</cite>, p. 53</span></figcaption>

ics/evangelism#:~:text=But%20what%20can%20be%20the%20reason,neither%20have%20provincial%20nor%20national%20assemblies&amp;text=But%20what%20can%20be%20the%20reason%2C%20may%20some&amp;text=they%20can%20neither%20have%20provincial%20nor%20national%20assemblies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4b5970fc2" data-kw="">
<blockquote><p>3. Those duties which are required of all those who publicly preach the Word of God in the Name of Christ are not required of all those Christians that are gifted: as that there lies on them the pastoral charge of souls, of which they are to give an account to God, Heb. 13:17, that they ought to give themselves wholly to the reading and studying of the Scriptures, 2 Tim. 4:15-16, that they may not apply themselves to the things of this world, 2 Tim. 2:4, that in the Name of Christ as his Ambassadors they entreat men to be reconciled to God, 2 Cor. 5. 20, that they are to distribute to all and every one in the house of God their portion of food in due season, Mt. 24:46, that they are authoritatively in the Name of Christ to remit and retain sins, Jn. 20:21. Now all these things are not enjoined on all Christians who have received the gifts of the Spirit. 4. Hence also the privileges and promises which are made to pastors, who preach the Word in the Name of God, are not given to all believers who are endued with the gifts of the Spirit; as, that they are worthy of double honor, 1 Tim. 5:17, that God will by a peculiar and singular assistance of his Spirit be present with them, Mt. 28:20; Lk. 21:14-15. And so a prophet’s recompence and reward is distinguished from the reward of a righteous man, Mt. 10:42. Therefore that labor, duty, and burden, to which these promises are made, is not imposed on all the righteous that are endued with gifts of the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’</cite>, pp. 79-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

</figure><figure class="quote" id="q-4cd0104428" data-kw="">
<blockquote><p>4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. … 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another; 4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office. 5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 2</cite>, p. 272</span></figcaption>

</figure><figure class="quote" id="q-2954cf3d83" data-kw="">
<blockquote><p>Christ preached the Gospel to those that He knew sinned against the Holy Ghost, to the Pharisees who persecuted Christ to death and others, Mt. 12:31-34; Jn. 15:22-25; Jn. 7:28-29; Jn. 12:35-38; Jn. 10:31-32; Jn. 11:47-48… the word is a converting ordinance out of question, and preached to heathen and to the non-converted, though they refuse to embrace and believe the Gospel, and refuse to entertain the preachers of it: as is clear, Acts 19:22-25; Tit. 1:10-13; 2 Tim. 3:25-27. The texts that Master Prynne alledges, that the Gospel should not be preached to heathen who refuse to embrace and believe the Gospel, to wit, Mt. 10:14-15; Lk. 9:5; Acts 13:46, are to no purpose, for Mt. 10; Lk. 9, is but a temporary commandment, given for a time, that the disciples should depart from those houses of Judea (there is nothing of the heathen; but by the contrary the apostles are forbidden to go to Samaritans or gentiles at all, Mt. 10:5-6 [which was unique to those circumstances]) who would not receive the peace of God in the Gospel, which precept the apostles in the story of the Acts did not observe, but preached the Gospel to many heathen who refused to embrace and believe the Gospel: As Acts 16 and 17, and 19:2. The place Acts 13:15 is meant of the blaspheming Jews, to whom Paul preached long after they persecuted and stoned the prophets, and had killed the Lord of life, Acts▪2 and 4, and 8, and 9; Mt. 23:37-38. 3. Those places, are to better color of purpose brought by Arminians and Socinians to prove that the Gospel is preached to people for their good entertainment thereof, and denied to others for their unworthiness, and because they will not welcome it; So the Arminians in the conference at Hague, pp. 87-89, God sends the Gospel not according to his absolute will, sed ob alias causas in homine latent•s, for secret causes in man. Arminius, Against Perkins, p. 199, ‘The will of God in sending the Gospel has causes in the will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), ch. 23</cite>, pp. 516-18</span></figcaption>

e will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.”

— Samuel Rutherford, The Divine Right of Church Government (London, 1646), ch. 23, pp. 516-18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist+preached+the+Gospel+to+those+that+He+knew+sinned+against+the+Holy+Ghost%2C+to+the+Pharisees+who+persecuted+Christ+to+death+and+others%2C+Mt.+12%3A31-34%3B+Jn.+15%3A22-25%3B+Jn.+7%3A28-29%3B+Jn.+12%3A35-38%3B+Jn.+10%3A31-32%3B+Jn.+11%3A47-48%E2%80%A6+the+word+is+a+converting+ordinance+out+of+question%2C+and+preached+to+heathen+and+to+the+non-converted%2C+though+they+refuse+to+embrace+and+believe+the+Gospel%2C+and+refuse+to+entertain+the+preachers+of+it%3A+as+is+clear%2C+Acts+19%3A22-25%3B+Tit.+1%3A10-13%3B+2+Tim.+3%3A25-27.+The+texts+that+Master+Prynne+alledges%2C+that+the+Gospel+should+not+be+preached+to+heathen+who+refuse+to+embrace+and+believe+the+Gospel%2C+to+wit%2C+Mt.+10%3A14-15%3B+Lk.+9%3A5%3B+Acts+13%3A46%2C+are+to+no+purpose%2C+for+Mt.+10%3B+Lk.+9%2C+is+but+a+temporary+commandment%2C+given+for+a+time%2C+that+the+disciples+should+depart+from+those+houses+of+Judea+%28there+is+nothing+of+the+heathen%3B+but+by+the+contrary+the+apostles+are+forbidden+to+go+to+Samaritans+or+gentiles+at+all%2C+Mt.+10%3A5-6+%5Bwhich+was+unique+to+those+circumstances%5D%29+who+would+not+receive+the+peace+of+God+in+the+Gospel%2C+which+precept+the+apostles+in+the+story+of+the+Acts+did+not+observe%2C+but+preached+the+Gospel+to+many+heathen+who+refused+to+embrace+and+believe+the+Gospel%3A+As+Acts+16+and+17%2C+and+19%3A2.+The+place+Acts+13%3A15+is+meant+of+the+blaspheming+Jews%2C+to+whom+Paul+preached+long+after+they+persecuted+and+stoned+the+prophets%2C+and+had+killed+the+Lord+of+life%2C+Acts%E2%96%AA2+and+4%2C+and+8%2C+and+9%3B+Mt.+23%3A37-38.+3.+Those+places%2C+are+to+better+color+of+purpose+brought+by+Arminians+and+Socinians+to+prove+that+the+Gospel+is+preached+to+people+for+their+good+entertainment+thereof%2C+and+denied+to+others+for+their+unworthiness%2C+and+because+they+will+not+welcome+it%3B+So+the+Arminians+in+the+conference+at+Hague%2C+pp.+87-89%2C+God+sends+the+Gospel+not+according+to+his+absolute+will%2C+sed+ob+alias+causas+in+homine+latent%E2%80%A2s%2C+for+secret+causes+in+man.+Arminius%2C+Against+Perkins%2C+p.+199%2C+%E2%80%98The+will+of+God+in+sending+the+Gospel+has+causes+in+the+will+of+man+according+to+that%2C%E2%80%99+habenti+dabitur%3A+So+Corvinus%2C+Ad+Wallachros%2C+p.+44.+Socinus%2C+Commentary+on+1+Jn.+4%2C+p.+307+says+the+same%3A+and+Mr.+Prynne+is+pleased+in+the+same+sense+to+cite+them%2C+I+conceive+imprudently%2C+for+I+believe+that+Reverend+and+learned+man+does+hate+those+impious+sects%2C+the+enemies+of+the+grace+of+God%3B+but+truly+if+this+be+a+rule+to+pastors+to+spread+the+Gospel%2C+that+they+are+to+offer+and+give+the+pearl+of+the+preached+Gospel+to+those+that+willingly+receive+it+and+harbour+the+preachers%2C+and+presently+to+depart+and+preach+no+more+the+Word+of+the+Kingdom+to+those+who+refuse+it%2C+as+the+places+Mt.+10%3A14+and+Lk.+9%3A5+carry+that+sense%2C+because+they+are+heathens+who+refuse+to+embrace+and+believe+the+Gospel%2C+and+harbor+the+preachers%2C+as+%28the+worthy+divine+says%29+conceiving+that+to+be+a+casting+of+pearls+to+dogs+and+swine%3B+I+see+not+how+the+preachers+and+spreaders+of+the+Gospel+to+the+heathen+are+to+believe+that+God+out+of+mere+grace+and+the+good+pleasure+of+his+will%2C+without+respect+to+good+or+bad+deserving%2C+sends+the+Gospel+to+some+and+denies+it+to+others.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+ch.+23%2C+pp.+516-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2954cf3d83.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2954cf3d83.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=Christ%20preached%20the%20Gospel%20to%20those,some%20and%20denies%20it%20to%20others&amp;text=Christ%20preached%20the%20Gospel%20to%20those%20that%20He&amp;text=Gospel% <blockquote><p>…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.</p></blockquote>

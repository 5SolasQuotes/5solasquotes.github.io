<main class="wrap"><figure class="quote" id="q-2fb322bad0" data-kw="">
<blockquote><p>God thus created man at first singularly pre-eminent among the animal tribes, both in regard to his bodily frame and his mental faculties, the noblest and wisest among living creatures on this earth. But his very pre-eminence- seemed to place him at a disadvantage, in comparison with the inferior creatures.

There was not found among them a help meet for him, and he stood far apart from them all. He found himself alone, without any suitable companion—without the solace of society, or the intercourse of friendship. “The Lord God said, It is not good that man should be alone; I will make him an help meet for him.”

To prevent merely the evil of being alone, it might have seemed a natural thing to have created another man, in every respect alike, as a perfect companion; and this it was, indeed, easy for the Lord to have done, and to have produced one man after another, or multitudes of them together, at successive periods of time, to aid one another, and to inhabit the earth.

“It is not good that the man should be alone,” would, therefore, seem to import something more than merely being without any other human being like himself; for even another human being like himself was not the help meet, that was provided for him—not another man, but woman; one, indeed, so like to himself, and so near to himself, as to be justly called “bone of his bones, and flesh of his flesh,”—”a creature manlike, but a different sex;” differing in various qualities both of body and mind; yet, by these very dissimilarities, each supplying what the other required for mutual aid, comfort, and improvement. “Male and female created he them;” and that not merely for the increase of their race, but for the enlargement of their happiness, and the improvement of their nature.

Man alone, or men by themselves, removed from the influence of woman, or refusing to admit such influence, seem always to approach the fierceness of the brutal tribes, and to become a rude and iron race; but when placed within the reach of the qualities peculiar to the female character, “their graceful acts and thousand decencies,” become softened and refined, wiser and better, than, with all their superior powers, they could otherwise have been. The formation of woman thus farther manifests the wisdom and goodness of the gracious Creator; and, by the exercise of her peculiar powers, she is capable of proving the source of the greatest good in the life of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-brewster.html">James Brewster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Creation of Man in Christian Miscellany</cite></span></figcaption>

<blockquote><p>…creation is instantaneous, unpreceded by a process of becoming… St. Thomas excels in explaining this distinction, just now noted, between passive potency and active potency. Real passive potency is not simple possibility. Simple possibility is prerequired and suffices for creation ex nihilo. But it does not suffice as prerequisite for motion, change, mutation. Mutation presupposes a real subject, determinable, transformable, mutable, whereas creation is the production of the entire created being, without any presupposed real potency. Now, since active potency, active power, must be greater in proportion to its passive correlative, it follows that when passive potency is reduced to zero, the active potency must be infinite. In other words, the most universal of effects, the being of all [created] things, cannot be produced except by the most universal of all causes, that is, by the Supreme Being. (Summa, pt. 1, q. 45, art. 1, 2, 5; pt. 3, q. 75, art. 8)</p></blockquote>

<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>

<blockquote><p>25. Axioms concerning the perfection of God:

I. God is in Himself absolutely and in every way perfect from eternity to eternity, devoid of all defect or progress. Rom. 11:35, ‘Who has first given to Him, and it shall be recompensed to them?’

      26. II. God can lack no perfection, neither privatively nor negatively: that is, No privation of perfection, no negation can fall upon God.

      27. III. All perfections belong to God according to one and simple form, which is His essence.

      28. IV. God is the cause of all perfections in other things, Rom. 11:36, ‘For from Him, and through Him, and to Him are all things.’

      29. V. All perfections, which are found in things created by God, were first in God most perfect and in the most perfect manner. Indeed, God, as the first cause, contains all possible perfection in Himself. All perfections are simply simple in God, because in their formal concept they have no imperfection, but pure perfection, nor do they involve any contradiction among themselves. God, by reason of His perfection, eminently contains the perfections of creatures. Eminently: to contain the perfection of something is to have such a perfection of a higher order, which by its power contains whatever is in the lower perfection: whence, because He also contains eminently, He can bring it about. For all effects are in efficient causes by power, so that such causes are said to be like their effects; and conversely, effects are such as their causes.</p></blockquote>

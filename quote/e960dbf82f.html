<blockquote><p>Behold, this is the doctrine and the power of the Gospel and the treasure by which we are saved, which brings us to the point that we also begin to fulfill the Law. For where the great unfathomable love and favor of Christ are known and believed, thence flows forth also love both to God and to our neighbor. For by means of such knowledge and consolation the Holy Spirit moves the heart to love God, and gladly does what it should to His praise and thanks, guards against sin and disobedience, and willingly offers itself to serve and help everybody, and where it still feels its weakness it battles against the flesh and Satan by calling upon God, etc. And thus while ever rising in faith it holds to Christ, where it does not do enough in keeping the Law, its comfort is that Christ fulfills the Law and bestows and imparts His fullness and strength, and thus He remains always our righteousness, salvation, sanctification, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Day by Day</cite>, (Luther’s Works 79 (Lenker) 5:54)</span></figcaption>

<blockquote><p>2… But here we must distinguish between effectual calling, which always takes place and none can hinder it, and calling not effectual, yet sufficient if men did not put in a bar by their own hardness of heart: God’s absolute will then is not resisted when men come not to repentance: for his will is to leave such to themselves by his just judgment: and not to give them of his effectual grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Six-fold Commentary upon Romans</cite>, (Cambridge: Legge, 1611), on Rom. 2, 3. Questions, Question 7, ‘Whether the leading of men to repentance by God’s long sufferance argues that they are not reprobate’, p. 104</span></figcaption>

<blockquote><p>Hereby also the Lord allures the Laodiceans to repentance, showing that every time is meet for conversion and that God is evermore ready to receive sinners, and provokes them always that they should amend and live. And this matter he expounds in an allegorical and goodly speech taken out of the fifth chapter of the book of Canticles. For he fains the Lord to stand at the door and knock, yea and to promise to them that open the greatest familiarity and joys unspeakeable. First, therefore is declared the benevolence of God towards sinners and his most ready will always to receive the same, yea and his infinite study to move men to repentance [Rom. 2:4] that they might live. For the Lord stands at the door and knocks. The word of ‘standing’ does signify that God is always prepared, always watches over our salvation. For He sits not still, nor lies not on the one side like a sluggard: He stands busily to his work. And ‘I stand’ says He, not ‘I stood’, or ‘shall stand’: But ‘I stand’ evermore ready, evermore loving and gentle. What does He? He knocks, and that indeed at the door, desiring to be let in. For like as he that knocks at the door seriously covets to be let in: so God desires earnestly to be of us received. And God uses sundry kinds of knocking. For He warns and excites with his Word by the prophets, again by signs and wonders, and also by sundry chances and movings. These things may be seen in the city of Jerusalem. He sends to them his prophets and apostles. He shows diverse wonders. He brings on them sorrowful chances that they might admonish them: Such as are reported, Lk. 13, of the Galileans, and of those whom the tower of Siloh had overwhelmed. We may see the like at this day how the Lord knocks. Therefore He said truly, ‘Jerusalem, Jerusalem, etc.’ Mt. 23. These are doubtless the parts and doings of God which will not that a sinner should die, but rather convert and live. Then must we see what is required of us, verily that we should hear the knocking and noise of the Knocker, and that also we open and receive such as desire to come in. Here are they confuted which speak of man as though he were a block and image, ‘I know not what manner of drawing,’ sayng: ‘It is neither in the runner, nor in the willer, etc.’ Certain [persons] altogether abstain from well-doing, saying, ‘If I be chosen, it is enough.’ But the Scripture requires everywhere hearing and obedience. We know that the elect are only saved, and that the elect in Christ: In Christ to be they that believe: That faith is of hearing, hearing by the Word of God. Therefore says the prophet, ‘This day if you heare his voice. etc.’ [Ps. 95] This same is recited of the apostle, Heb. 4. The apostle also, 2 Tim. 2, ‘In a great house there be not only vessels of gold, but of earth also. If any purge himself, etc.’ And therefore the Lord says, ‘I knock’: It shall be thy part not to despise Him that knocks, but to open unto Him. And he recites indeed two things, [1] to hear, which both in the 8th and 9th of John is required of the children of God and of the true sheep: And [2] to open, that is to receive the Lord, or believe, to obey, and to frame themselves after the will of God and to do penance. Notwithstanding we must here beware, that we think not that man has power of himself to receive the Lord. The Lord illumines his elect, and by Him we can do all things, without whom we can do nothing. Other places must be conferred with this as Jn. 15; 2 Cor. 3; Phil. 2. They therefore that open, do open by the grace of God. They that open not being wrapped in their sins, through their own fault open not, and not through any fault of God. Let us hear moreover what the Lord promises to them that open, that is to say, to such as receive Christ with true faith. The Lord promises to them two things chiefly. First, ‘I will go into him’, says He. The scripture signifies that Christ dwells everywhere through faith in the hearts of the faithful and with a most straight knot to be joined unto them… And in the 14th chapter [of John] He says, ‘He that loves Me, will keep my Word: And my Father and I will come unto him, and will make abode with him.’ St. Paul says that he lives not now, but that Christ lives in him. [Gal. 2:20] The same affirms that Christ through faith dwells in the hearts of the faithful. And so the Lord enters the hearts of them that let Him in. Not the least part of felicity consists in this conjunction. For to be united with God is blessedness, which begins here, and is made perfect in another life. And therefore in the second place the Lord says: ‘And I will sup with him, and he with Me.’ Whereby he notes not only again a most dear friendship and familiarity (for the table is consecrated to amity) but rather the fruition of eternal glory. For by the supper are signified the joys, celestial, greatest and unspeakeable, which after their souls the godly receive immediately after death: but more fully in the end of times when the bodies shall arise again. Therefore is it not applied to a dinner, but to a supper, as it is also in the 14th of Luke. Then if we receive Christ, we shall have Him dwelling with us continually whilst we live in this world. And in the world to come we shall have the full fruition of all the joys celestial. These things be certain and true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundred Sermons upon the Apocalypse of Jesus Christ</cite>, … (1561), on Rev. 3:20, pp. 134-36</span></figcaption>

+therefore+that+open%2C+do+open+by+the+grace+of+God.+They+that+open+not+being+wrapped+in+their+sins%2C+through+their+own+fault+open+not%2C+and+not+through+any+fault+of+God.+Let+us+hear+moreover+what+the+Lord+promises+to+them+that+open%2C+that+is+to+say%2C+to+such+as+receive+Christ+with+true+faith.+The+Lord+promises+to+them+two+things+chiefly.+First%2C+%E2%80%98I+will+go+into+him%E2%80%99%2C+says+He.+The+scripture+signifies+that+Christ+dwells+everywhere+through+faith+in+the+hearts+of+the+faithful+and+with+a+most+straight+knot+to+be+joined+unto+them%E2%80%A6+And+in+the+14th+chapter+%5Bof+John%5D+He+says%2C+%E2%80%98He+that+loves+Me%2C+will+keep+my+Word%3A+And+my+Father+and+I+will+come+unto+him%2C+and+will+make+abode+with+him.%E2%80%99+St.+Paul+says+that+he+lives+not+now%2C+but+that+Christ+lives+in+him.+%5BGal.+2%3A20%5D+The+same+affirms+that+Christ+through+faith+dwells+in+the+hearts+of+the+faithful.+And+so+the+Lord+enters+the+hearts+of+them+that+let+Him+in.+Not+the+least+part+of+felicity+consists+in+this+conjunction.+For+to+be+united+with+God+is+blessedness%2C+which+begins+here%2C+and+is+made+perfect+in+another+life.+And+therefore+in+the+second+place+the+Lord+says%3A+%E2%80%98And+I+will+sup+with+him%2C+and+he+with+Me.%E2%80%99+Whereby+he+notes+not+only+again+a+most+dear+friendship+and+familiarity+%28for+the+table+is+consecrated+to+amity%29+but+rather+the+fruition+of+eternal+glory.+For+by+the+supper+are+signified+the+joys%2C+celestial%2C+greatest+and+unspeakeable%2C+which+after+their+souls+the+godly+receive+immediately+after+death%3A+but+more+fully+in+the+end+of+times+when+the+bodies+shall+arise+again.+Therefore+is+it+not+applied+to+a+dinner%2C+but+to+a+supper%2C+as+it+is+also+in+the+14th+of+Luke.+Then+if+we+receive+Christ%2C+we+shall+have+Him+dwelling+with+us+continually+whilst+we+live+in+this+world.+And+in+the+world+to+come+we+shall+have+the+full+fruition+of+all+the+joys+celestial.+These+things+be+certain+and+true.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+A+Hundred+Sermons+upon+the+Apocalypse%E2%80%A6+%281561%29%2C+on+Rev.+3%3A20%2C+pp.+134-36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b30b2e0d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b30b2e0d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Hereby%20also%20the%20Lord%20allures%20the,These%20things%20be%20certain%20and%20true&amp;text=Hereby%20also%20the%20Lord%20allures%20the%20Laodiceans%20to&amp;text=joys%20celestial.%20These%20things%20be%20certain%20and%20true" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

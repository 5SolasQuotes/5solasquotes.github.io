<main class="wrap"><figure class="quote" id="q-fe3d1de3db" data-kw="">
<blockquote><p>I hope Mr. Hobbs is none of his subjects, and yet his book is much inflated with pride against learning and learned men. But in my opinion this paper Leviathan is like that beast in the Revelation, which opened his mouth into blasphemy against God, and his Tabernacle, and against them that dwell in heaven. Rev.13. 6. Against God, in saying, he made the world by nature, and by consequence of necessity, whereas he made it indeed voluntarily and freely. 2. In making the three Persons of the Trinity rather names then substances. 3. In making Christ only to personate God the Son. 4. In making God the author of sin. 5. In making him corporeal, and part of the universe.

Against his Tabernacle, that is, against his Church, in labouring to overthrow her faith, knowledge, miracles, and ordinances. Against them that dwell in heaven, that is, the Angels and separated souls, in making the one but fancies and dreams, and the others mortal, and not capable hereafter of any other happiness then earthly. He tells us besides, that faith is not by inspiration, or infusion, but by study and industry, that to believe in God, is not to trust in his Person, but to confess the doctrine.

That our belief is in the Church; that they were not devils, but madmen which confessed Christ; that covetousness and ambition, and injustice with power are honourable, that tyrants and good Princes are all one; that a man may sin against his conscience; that men should not render a reason or account of their faith; that Princes are not subject to their own laws; that private men have no property in their goods; that our natural reason is the word of God; that divine dreams cannot win belief; that it was a wind, not the holy Spirit which in the Creation moved on the waters; that the dove and fiery tongues may be called Angels; that Christ hath no spiritual kingdom here on earth; that he did not cast out devils, but only cured madness; that Satan did not enter into Judas; that we may dissemble in matter of religion; that we may disobey Christ and his Apostles without sin. Such, and much more like stuff and smoke, doth this Leviathan send out of his nostrils, as out of a boiling pot or caldron, Job 41.20.

This is the sperma caete, or spawn which this whale casteth out; a whale, I say, that hath not swallowed up Jonah the prophet, but Cerinthus the heretic, and vomited up the condemned opinions of the old heretics; and chiefly the Anthropomorphists, Sabellians, Nestorians, Sadduceans, Arabians, Tacians or Eucratits, Manichiees, Mahumetans and others: for in holding life eternal to be onely on earth, he is a Cerinthian and Mahumetan: in giving to God corporeity he is an Anthropomorphit, Manichean, Tertullianist and Audaean: in holding the three Persons to be distinct names and essences represented by Moses, Christ, and the Apostles, he is a Sabellian, Montanist, Aetian, and Priscillianist: in saying, that Christ personated God the Son, he is a Nestorian giving him two personalities, for no person can personate himself: in denying spirits he is a Sadducean: in making the soul to rest with the body till the resurrection, he is an Arabian: in making the soul of man corporeal he is a Luciferian: by putting a period to hell torments he is an Originist: by teaching dissimulation in religion he is a Tacian or Encratit: in making God the cause of injustice or sin, he is a Manichee: in slighting Christ’s miracles, he is a Jew: and in making our natural reason the word of God, he is Socinian: In discovering of these errors, I quarrel not with Mr. Hobbs, but with his book; which not only I, but many more, who are both learned, and judicious, men, look upon as a piece dangerous both to Government and Religion. All the hurt I wish him is, true illumination, a sanctified heart, and Christian sobriety; that he may retract what is amiss. And so I bid him and thee farewell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), epistle to the reader.</span></figcaption>

<blockquote><p>It is (Men, Brethren and Fathers) a great work that God hath called you to set your heads, and hearts, and hands unto, to rescue truth from the jaws of those monstrous errors, that had almost devoured it; to disburthen the worship of God of those corruptions, that have so long clogged and defiled it; to advise of, and propound such a Government in the Church, as may be most agreeable to God’s word, most conformed to the pattern in the Mount, and to the practises of the best Reformed Churches; …

Had our God cast you upon this work in the most pacate times, and among a People the most prepared for Reformation that any ever were, yet (in it self considered) such is the infinite weight of your employment as might even swallow up all your thoughts.

But then to consider how unprepared the hearts of people are for that which is the work of this age, and this Assembly Reformation, which hath been represented to Prince and People under the odious notion of Brownism, Anabaptism, Church Anarchy, Confusion, in so much that with many, endeavours and assays of Reformation will find no better entertainment, then Hezekiah’s messengers of Reformation did, 2 Chron. 30.10. when the people laughed them to scorn, and mocked them[.]

Nay, with some worse, for so enraged do some burn after their Idolatrous ways, and so mad are they upon their own inventions, that deny them these, and it is to be feared you shall find them in the temper the Abezrites were, scarce anything will pacify them, but the blood of those that have cast down the altar of Baal, and cut down the grove that was by it; Judg. 6.30. Do not Multitudes cry already upon the disuse of some Ceremonies, and the displacing of some Superstitious Priests? do they not cry with Micah, Judg. 18.24. Ye have taken away our Gods and our Priests, and what have we more?</p></blockquote>

<blockquote><p>Rule Two. We must have a respect to the ordinance itself, that it be not made contemptible, that the discipline of Christ’s house be not rendered obnoxious to reproach and contempt; and as in the first reformation of religion, when men were coming out of popery and were ready to fear and spurn at discipline, and knew not the difference between the popish yoke and Christ’s yoke, in that case and in that time there was forbearance on this account. ‘I would they were cut off that trouble you’ (Gal. 5:12). Why then would he not cut them off? Because there was such a distemper among the Galatians, they were so bewitched and led away after the false teachers, and Paul’s authority was questioned; therefore he held himself at a wish and will not put forth the authority he had against those false and corrupt men.</p></blockquote>

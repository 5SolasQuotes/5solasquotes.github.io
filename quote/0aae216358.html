<blockquote><p>Suffering especially tests and strengthens hope. Paul teaches that discovering God’s help increases our hope (Rom. 5:5). Because God enables us to experience his goodness, power, and faithfulness when we are in need, because he strengthens us against every temptation and safeguards us against every attack, and because he delivers us from all our fears, he in all these ways so establishes and guarantees in us the truth of his promises that whoever calls on him will be saved and whoever trusts in him will never be put to shame. …

By means of trials God puts our obedience to the test. When all goes well according to the flesh, it is not difficult for us to yield to his will and to recognize his goodness and love towards us. But when he visits us with sickness, poverty, reproach, or some other misery, it is then true obedience to feel that he loves us, to embrace his divine guidance, and to submit to his will. …

How shabbily we treat this one, true, and heavenly Father when in days of oppression we fail to hallow his name, to conform our will to his, and to confess that all things proceed from his goodness and love – all of which serves his praise as well as our salvation.

So we see how in the school of we learn what it actually means to be obedient to God. We need this education. For as Jesus Christ, even though he was God’s Son, nevertheless “learned obedience from what he suffered” (Heb. 5:8), how much more necessary it is for us in days of persecution to learn to submit our heads and our hearts to God’s leading.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Baker Books, 2003), pp 106-07, 108.</span></figcaption>

<blockquote><p>She [the church at Philadelphia] is set in the second place after Sardis (for this is the first after Jezabel overcome) where by is shewed that her Antitype is the second reformed Church, which should arise after the Germane, and this is the Church of the Helvetians, Suevia [Swabia], Geneva, France, Holland Scotland. I join all these into one, because they live almost after one and the same kind of laws and ordinances, as touching the things that are of any moment. Neither doth the distance of place break of that society which the conjunction of minds and will doth couple.

Yea this dispersion doth agree chiefly to the Philadelphians, whom we have shewed to dwell thicker and more frequent in the fields then in the city. Whereby it cometh to pass that this thins [sic] of the citizens taketh up much place, though the citizens are not so many. We shall find that this Church which I speak of arose a little while after the German; when Ulricus Zwinglius began to teach at Tigur in Helvetia, in the year 1519, and the reformation was begun the fourth year after, to wit, in the year 1523, at which time no Papist durst enter into combat against Zwinglius, who did defer the judgment of all controversies to the arbitrement of the sacred scriptures. They of Constance, Basil, Strasbourg, Geneva and others, followed their steps. …

In the Antitype, a divine power specially shineth forth sanctifying the Church, by kindling the desyre of godlines, and in making it in Christ Iesus fit and cheerfull to every good worke. Let my words be without envy, the true doctrine soundeth no where purer, the worship lesse corrupted, more flourisheth the faithfull diligence of the Pastors, is performed more willing obedience of the peo∣ple, nor greater reverence of all religion among all degrees. …

Neither doth she keep only the doctrine of salvation uncorrupt, but also she both delivereth and teacheth in writings and exerciseth in practise a sincere manner of administring, wherby salvation is bestowed. Certainly the whole will of God is communicated with his saints, so as Christ taketh to himself not undeservedly this praise of true in governing this Church: He doth also perform plenteously that which he promised, that he would keep safe and sound those that seek him with an upright heart.

What have not endevoured the French man, the Spaniard, the Savoyan, the Pope, to root out them of Geneva, a small people, and environed on every side with enemies, and shut up from all aid of friends? Nevertheless it flourisheth yet still thanks be to God, and shall flourish hereafter, while all her adversaries burst with envy: as long as she shall continue in this holy order. The French Church hath been preserved hitherto, no other wise then the three children in the furnace.

Who would have believed that the Low Countries had been able to resist and withstand the raging Philip, the cruel Duke d’Alve, and so many bloody Tyrants? But true is he, who hath promised this honour to his saints, that they should bind the Kings with chains, and their nobles with fetters of iron, Psalm 149.8.9. And that I may not speake of every each one, they can be safe only by thy protection, o most high God, who art constant in all thy promises, whom both enemies almost infinite do persecute with deadly hatred, and also to whom many of their freinds through envy wish not very well.</p></blockquote>

<blockquote><p>May it please your Grace and your Lordships, I Should not presume to take up any part of that time, which Your Grace so happily employs in the Government and Conservation of a whole Nation; nor to divert the rest of this honourable Board from those important Affairs, which usually call your Lordships hither; were I not under an Obligation both of Gratitude and Duty, to be an Interpreter for those poor Protestants, lately come out of France, to take Sanctuary with you: and to express for them and in their names, as they have earnestly desired me, a part of that grateful sense, which they have, and will for ever preserve, of your Lordships Christian Charity and Generosity towards them: This they have often, I assure you, acknowledged to Heav’n in their Prayers, but could not be satisfied, till they had made their solemn and public Acknowledgments to their Noble Benefactors.

Life and Religion are the two things most dear and valuable of all upon earth: Life is the ground of all the Good and Happiness we enjoy in this world, and Religion is the foundation of all the Felicities we hope for in that to come; so that those persons that are deprived both of the comforts of Life, and the Profession and Exercise of their Religion, may justly be looked upon as the truest objects of pity that we can meet with in this world; and by the same rule, those that have a lively sympathy with such, have the true principle of a Christian Spirit, and are the true examples of a Christian Practice.

What extreme Hardships and Sufferings those Protestants were under in their own Country, both as to their Livelihood and Religion, is too sad and too notorious a truth, as well as too big a Subject for me now to enlarge upon. The many Proclamations which their Prince made against them, for pulling down and demolishing most of their Churches, and excluding them from all Trades and Preferments, are well known, they could neither serve God, nor enjoy themselves; They are forbidden to quit their Country, and yet by their hard usage, and persecution, in effect, not suffered to stay.

The Cry of that Egyptian-like Bondage and Slavery, they groaned under, that entered into the ears of the Lord of Hosts, entered also into your noble and charitable Hearts, and there has met with Compassion and Pity; and by your Christian Example and Charity you have set your selves Patterns to this whole Nation: By it you have excited the general Beneficence of all; and by it, no less than by your Orders, you have already influenced this great City (and I hope will shortly after, the whole Kingdom) into an Obedience to that truly Christian, and royal Law of Beneficence and Mercy.

And although this be eminent, and extraordinary in its kind, yet it is no wonder that that Illustrious Person, who began as early to be good, as to be great, whose matchless Courtesy and Generosity are not only known to his Friends, to his Servants, to Strangers, but even to his greatest Enemies; who has learned by a long experience, what it is to suffer for Righteousness sake, and to forsake all, rather than his Honour and Religion; no wonder, I say, that He should be ready and zealous to relieve those that suffer innocently, and for a good Conscience, and who forsake their All, rather than forsake their God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-drelincourt.html">Peter Drelincourt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A speech made to His Grace the Duke of Ormond Lord Lieutenant of Ireland, and to the Lords of His Majesties most Honourable Privy Council to return the humble thanks of the French Protestants lately arrived in this kingdom, and graciously relieved by them</cite>, (Dubliln: William Mendey, 1682), pp 3-5.</span></figcaption>

The Cry of that Egyptian-like Bondage and Slavery, they groaned under, that entered into the ears of the Lord of Hosts, entered also into your noble and charitable Hearts, and there has met with Compassion and Pity; and by your Christian Example and Charity you have set your selves Patterns to this whole Nation: By it you have excited the general Beneficence of all; and by it, no less than by your Orders, you have already influenced this great City (and I hope will shortly after, the whole Kingdom) into an Obedience to that truly Christian, and royal Law of Beneficence and Mercy.

And although this be eminent, and extraordinary in its kind, yet it is no wonder that that Illustrious Person, who began as early to be good, as to be great, whose matchless Courtesy and Generosity are not only known to his Friends, to his Servants, to Strangers, but even to his greatest Enemies; who has learned by a long experience, what it is to suffer for Righteousness sake, and to forsake all, rather than his Honour and Religion; no wonder, I say, that He should be ready and zealous to relieve those that suffer innocently, and for a good Conscience, and who forsake their All, rather than forsake their God.”

<blockquote><p>Though God hath reserved to Himself a liberty of afflicting his people, yet He hath tied up his own hands by promise never to take away his loving-kindness from them.</p></blockquote>

— John Flavel, Keeping the Heart">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough+God+hath+reserved+to+Himself+a+liberty+of+afflicting+his+people%2C+yet+He+hath+tied+up+his+own+hands+by+promise+never+to+take+away+his+loving-kindness+from+them.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+Keeping+the+Heart&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3981058055.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3981058055.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/affliction#:~:text=Though%20God%20hath%20reserved%20to%20Himself,take%20away%20his%20loving%2Dkindness%20from%20them&amp;text=Though%20God%20hath%20reserved%20to%20Himself%20a%20liberty&amp;text=never%20to%20take%20away%20his%20loving%2Dkindness%20from%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7be8fd49ca" data-kw="">
<blockquote><p>It cannot be concluded, they do not suffer for Christ, who have some sin mixed with that which is made the cause of their sufferings, if it be the cause of God indeed, for the substance of it, and they sincere in it for the main. When the people of God are ready to offer up themselves, and what they have for him, he will not reject such a sacrifice for every blemish. Christ had something against the church of Ephesus, something to charge her with as matter of provocation, even when he is speaking of her sufferings, Rev. ii. 4. And yet he owns her as one that had suffered and laboured for his name’s sake, verse 3.

Nor can this be concluded, because of some miscarriage under their sufferings. David, while he was persecuted by Saul, miscarried divers ways, as you may see 1 Sam. xxi. 2, 12, 13, and elsewhere; yet this did not hinder him from being a sufferer for righteousness.

As the Lord has provided a way, that what his people do for him may be accepted as done for him, though there be too many sinful mixtures therein, so he has provided an expedient, that what they suffer for him may be accepted as suffered for him, though there be many flaws therein, both for matter and manner. The Lord Jesus, the advocate of and sacrifice for his people, is effectual for both. When they apply themselves to him, in the exercise of faith and repentance, through his mediation, that which is therein evil shall not be remembered, that which is good therein will be accepted, Rom. xii. 1. How acceptable, see Eph. i. 6, 7.

Licinius, as you may read, Eusebius De vita Constantini, makes an edict, that whosoever did relieve the imprisoned and distressed Christians should suffer the same things that were inflicted upon them. Now, suppose some, out of love to Christ and his afflicted members, should have ventured (as many did indeed) to have relieved them, and yet should have done it too sparingly, or too fearfully, or with some selfish reflections, and should, according to the edict, have suffered for relieving them, here had been some sin mixed with the cause of their sufferings. And yet in this case, since their cause was good, and the cause of Christ, for the substance of it, who would deny but they suffered for Christ?

Or suppose one should suffer because he would not leave praying (which was Daniel’s case, Dan. 6), and yet in his prayer should have some mixture of unbelief, and lukewarmness, and other distempers, which the best cannot always escape, here would be some sin mixed with the cause of sufferings; yet who would deny but that, suffering for doing his duty, he is a sufferer for God?

To proceed a little further: suppose some godly Lutherans should suffer for those great truths of the gospel, which they maintain against the papists, and together with them should suffer for consubstantiation, which indeed is an error, here would be a sin mixed with the cause of their suffering; yet I suppose their laying down their lives for those other great truths of Christ, notwithstanding this sinful mixture, would be accounted a suffering for Christ.</p></blockquote>

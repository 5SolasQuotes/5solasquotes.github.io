<main class="wrap"><figure class="quote" id="q-a68407c8d3" data-kw="">
<blockquote><p>But there are other Philistines namely Arminian and Socinian Philistines, by which Church and State are much endangered, and it is the business now in hand to lay open their mystery of iniquity to the public view. We may say to these pestilent Heretics as well as to malignant Statesmen, Ita nati estis ut mala vestra ad Rempub. pertineant; for there are no greater Statesmen in the world then the English Arminians, and Popish Socinians; for such Monsters hath England nourished as are not to be found in all Africa.

Herod and Pilate, the Roman and the Racovian Antichrist, are made friends in England, all the Grand-Malignants, Arminians, Papists, and Socinians are of one confederacy, all united under one head the Arch-Bishop of Canterbury, the Patriarch or Pope of this British world, alterius orbis Papa as his Brother-Pope hath given him leave to phrase it, because he saw the Arch-Bishop too proud to acknowledge his Supremacy, but forward enough to maintain any other point of Popery, &amp; ready to join with him to suppress all Pure Protestants.

If this Design take effect, there may well be a reconciliation professed &amp; established between Rome and Canterbury, the two Popes may divide the spoil of the Church between them if they can but agree at parting. Whether some have not endeavoured to make such a Reconciliation; whether all points of Popery almost have not been greedily embraced in England, and that of the Pope’s Supremacy only rejected, more out of pride then conscience, let the prudent judge, they have light and evidence enough, and new evidence is daily produced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, growth, and danger of Socinianism together with a plain discovery of a desperate design of corrupting the Protestant religion, whereby it appears that the religion which hath been so violently contended for (by the Archbishop of Canterbury and his adherents) is not the true pure Protestant</cite>, (London: Samuel Gellibrand, 1643), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

<blockquote><p>[…] Papists, home-born Papists, who are vipers that most unnaturally have endeavoured to eat through their mother’s bowels. Not their nature only, but their Religion also, teaches and allows them for the Good of the Catholic cause, falsely so called, not to spare their own native Country, their own kindred, Brothers, Fathers, no not of their own Religion. To blow up Parliaments, to ruin Cities, Countries, Kingdoms, is their ordinary work. Especially of those, whom they call Jesuits, the Bellows of Hell, the Incendiaries of Christendom, at this day. The Curse of God is upon them fearfully for arrogating their Name from Jesus, which signifies a Saviour, and is impropriated to the Son of God: Thou shalt call his name Jesus. These men, that call themselves Jesuits, are, by the just judgement of God upon them, Destroyers of Cities, Countries, Kingdoms, and might far better take their name from him, who is called in Hebrew Abaddon, and in Greek Apollon, but signifying a Destroyer. Revel. 9. 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The good man a public good. A sermon preached to the honourable House of Commons, at the late solemn fast:</cite>, January 31, 1643 (London, 1643), pp 28-9.</span></figcaption>

</figure><figure class="quote" id="q-49003e754d" data-kw="">
<blockquote><p>Certain it is that many popes have been notorious heretics, as Liberius and Felix, who were Arians; Honorius, a Monothelite; and John XXIII, who denied the immortality of the soul. In the papal see, several schisms have been, and divers times many popes together, excommunicating one another and reciprocally calling one another Antichrist; and of those Antichrists, the worst commonly overcame. So according to the very canons of the Roman Church, factions and corruptions in the creation of the popes have several times made their election void and therefore have broken the thread of that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, bk. 1, ch. 32</span></figcaption>

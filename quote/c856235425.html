<main class="wrap"><figure class="quote" id="q-c856235425" data-kw="against antinomians">
<blockquote><p>Whether the moral law is abrogated entirely under the New Testament. Or whether in a certain respect it still pertains to Christians. The former we deny; the latter we affirm against the Antinomians. From the third use of the law (which we called directive) arises the proposed question lying between us and the Antinomians, who maintain that there is no use of the law any longer under the New Testament. On this account, they hold that the Scriptures of the Old Testament do not belong to Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36e4c46091" data-kw="abrogation justification curse">
<blockquote><p>The question does not concern the use of the law as to justification—whether we are still bound to the law in order to acquire life. Since this is impossible after sin, in this sense it may even be said to have been abrogated: “By the deeds of the law there shall no flesh be justified” (Rom. 3:20) and “As many as are of the works of the law, are under the curse” (Gal. 3:10). Second, the question does not concern its curse because by Christ under this relation it is abrogated with respect to believers: “Christ hath redeemed us from the curse of the law, being made a curse for us” (Gal. 3:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.2</span></figcaption>

</figure><figure class="quote" id="q-7b7ba306fb" data-kw="">
<blockquote><p>This is one part of atheism and self-idolatry, to magnify ourselves, with the forgetfulness and to the injury of our Creator.… In ascribing the glory of what we do or have to ourselves, to our own wisdom, power, virtue, etc.… He regards Babylon as his heaven and himself as his idol, as if he were all and God nothing.… So much as we sacrifice to our own credit, to the dexterity of our hands, or the sagacity of our wit, we detract from God.</p></blockquote>

</figure><figure class="quote" id="q-900bb6b6ed" data-kw="third use rule of life">
<blockquote><p>It not only antecedently prepares the elect man for Christ, but consequently also directs him already renewed through Christ in the ways of the Lord; serving him as a standard and rule of the most perfect life, to which he knows he is called by Christ and which he ought diligently to pursue (1 Tim. 1:5).</p></blockquote>

</figure><figure class="quote" id="q-56cfa7cd20" data-kw="Holiness">
<blockquote><p>Since the precept about not coveting is general, it ought to be extended to all depraved and inordinate concupiscence, original and habitual as well as actual—whether this is determinate and voluntary or still indeterminate and only titillating. This is true in order that the perfect purity and holiness of the lawgiver may be noted (which will suffer not even the smallest taint of depraved concupiscence in man, but demands righteousness and holiness of every kind).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b5b7f085f8" data-kw="">
<blockquote><p>I lighted upon a passage in [the Romanist] Becanus (Sum. Theol. tome 5, ch. 7, question 3, p. 119) , that merits a little stay and consideration. Besides that grant above mentioned, which the Orthodox make unto the Lutherans, he gratifies them farther, and yields unto them that the divine attributes are communicated unto the humanity, not only in the Person of the Word, but also in the very humanity itself: Howbeit, not proximè, immediately, and formally, but only mediately, consequently, and identically; for only the subsistence of the Word is communicated proximè, immediately, and formally unto the humanity in itself, and by it the humanity does nextly, immediately, and formally subsist. But because that subsistence is really the same with the divine essence and attributes, therefore the divine essence and attributes are communicated consequently and identically unto the humanity, not that the humanity is omnipotent, omniscient, and omnipresent by them, but that it subsists by them, as they are really one and the same thing with the subsistence of the Word. A hint he had of this conceit it seems from Gregory De Valentia: For unto him he refers the reader, and the words which he relates unto are as follows: ‘Agnoscimus &amp; subsistentiam, &amp; etiam divinitatem at{que} perfectionem omnem verbi, naturae humanae communicatam esse uno quodam modo maximè reali, ut scilicet in personâ verbi subsistat, primariò quidem per ipsam verbi subsistentiam seu personalitatem, secundariò autem per Divinitatem etiam &amp; perfectiones ejus, quae ab eâ subsistentia re non differunt’ (tome 4, question 2, punct. 3, section 3, p. 131). ‘We acknowledge that both the subsistence and also divinity, and every perfection of the Word, is communicated unto the human nature after one way or manner, that is most real: to wit, that it subsists in the person of the Word primarily, by the subsistence, or personality itself of the word, secondarily by the divinity also, and perfections thereof, which do not differ really from the subsistence.’ Thus you see, that both of them make no bones to affirm that the subsistence, or personality of the Word, is communicated unto the manhood of Christ, so that it denominates it to subsist properly in, or by the Person of the Word. For confutation of this their opinion, I shall at present allege but two arguments out of [Robert] Baron against it (Philos. Theol. Exercit., pt. 1, article 12, pp. 55-56).

1. If the manhood of Christ subsist any manner of way, then it is a person, or suppositum: for what is subsistence here, but suppositality, and therefore it, and suppositum are reciprocated.

2. To exist in another person, and to subsist, are opposite manners of existence; for to subsist isesse per se, &amp; extra aliud omne suppositum. But the manhood of Christ does exist in the Person of the Word, and therefore it cannot be said to subsist. If these men would have consulted their own Suarez, he would have rectified this their mistake, and have told them, how that usual saying, ‘The humanity of Christ subsists in the Person of the Word,’ is to be qualified, to wit, in regard of its termination unto, and sustentation by the subsistence of the Word. For having propounded this objection, ‘Dices, humanitas Christi non subsistit proprie, quia non est in se, sed in alio,’ he frames hereunto this answer: ‘Respondetur, non subsistere, tanquam id quod subsistit: sed proprie verbum in illa subsistit, &amp; illa dicitur in verbo subsistere, quia illius subsistentia terminatur, &amp; quasi sustentatur.’ (on 3rd pt. of Thomas, tome 1, disputation 8, section 3, p. 231)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a469aee8d1" data-kw="Faith">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>

</figure><figure class="quote" id="q-4dff76414d" data-kw="">
<blockquote><p>A threefold being is usually distinguished: of essence, of existence, and of subsistence… Therefore, concerning this being of existence, the present question is whether in Christ there is one existence of the divine nature and another of the human nature, or rather there is only a single being of existence, namely the uncreated existence of the Word itself, by which the assumed humanity is also said to exist… In this controversy there are two opposed opinions. The first is common in the school of Thomists, denying that in the humanity of Christ there is any created existence, and affirming that by union it was assumed not only to the subsistence of the Word but also to existence… And so the Thomists commonly teach in the cited place: Cajetan, Capreolus, Ferrara, Medina, Cabrera, Alvarez, and other notable followers of the same school. The opposed opinion is common outside the school of St. Thomas, affirming that the assumed humanity has its own created existence by which it exists. For although it was assumed to the subsistence of the Word, nevertheless [it was] not [assumed] to [his] existence. So Scotus holds (Ordinatio 3, d. 6, q. 1), St. Bonaventure (Sent. 3, d. 5, a. 3, q. 3), and the Scotists commonly follow, and all the more recent [theologians], some of whom strive to benignly interpret St. Thomas and draw him into this opinion as well.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“A threefold being is usually distinguished: of essence, of existence, and of subsistence… Therefore, concerning this being of existence, the present question is whether in Christ there is one existence of the divine nature and another of the human nature, or rather there is only a single being of existence, namely the uncreated existence of the Word itself, by which the assumed humanity is also said to exist… In this controversy there are two opposed opinions. The first is common in the school of Thomists, denying that in the humanity of Christ there is any created existence, and affirming that by union it was assumed not only to the subsistence of the Word but also to existence… And so the Thomists commonly teach in the cited place: Cajetan, Capreolus, Ferrara, Medina, Cabrera, Alvarez, and other notable followers of the same school. The opposed opinion is common outside the school of St. Thomas, affirming that the assumed humanity has its own created existence by which it exists. For although it was assumed to the subsistence of the Word, nevertheless [it was] not [assumed] to [his] existence. So Scotus holds (Ordinatio 3, d. 6, q. 1), St. Bonaventure (Sent. 3, d. 5, a. 3, q. 3), and the Scotists commonly follow, and all the more recent [theologians], some of whom strive to benignly interpret St. Thomas and draw him into this opinion as well.”

— Bartolomeo Mastrius, bk. 3, Of the Incarnation of the Lord (d. 1673), Disputation 1 tr. by AI by OmegaPoint99 | quest. 6, ‘Whether the human nature in Christ has its own existence, or rather exists by the existence of the Word’ 140 | art. 1, Resolution of the question 141 art. 2, The foundations of the opposing opinion are overthrown 152-58, pp. 140-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+threefold+being+is+usually+distinguished%3A+of+essence%2C+of+existence%2C+and+of+subsistence%E2%80%A6+Therefore%2C+concerning+this+being+of+existence%2C+the+present+question+is+whether+in+Christ+there+is+one+existence+of+the+divine+nature+and+another+of+the+human+nature%2C+or+rather+there+is+only+a+single+being+of+existence%2C+namely+the+uncreated+existence+of+the+Word+itself%2C+by+which+the+assumed+humanity+is+also+said+to+exist%E2%80%A6+In+this+controversy+there+are+two+opposed+opinions.+The+first+is+common+in+the+school+of+Thomists%2C+denying+that+in+the+humanity+of+Christ+there+is+any+created+existence%2C+and+affirming+that+by+union+it+was+assumed+not+only+to+the+subsistence+of+the+Word+but+also+to+existence%E2%80%A6+And+so+the+Thomists+commonly+teach+in+the+cited+place%3A+Cajetan%2C+Capreolus%2C+Ferrara%2C+Medina%2C+Cabrera%2C+Alvarez%2C+and+other+notable+followers+of+the+same+school.+The+opposed+opinion+is+common+outside+the+school+of+St.+Thomas%2C+affirming+that+the+assumed+humanity+has+its+own+created+existence+by+which+it+exists.+For+although+it+was+assumed+to+the+subsistence+of+the+Word%2C+nevertheless+%5Bit+was%5D+not+%5Bassumed%5D+to+%5Bhis%5D+existence.+So+Scotus+holds+%28Ordinatio+3%2C+d.+6%2C+q.+1%29%2C+St.+Bonaventure+%28Sent.+3%2C+d.+5%2C+a.+3%2C+q.+3%29%2C+and+the+Scotists+commonly+follow%2C+and+all+the+more+recent+%5Btheologians%5D%2C+some+of+whom+strive+to+benignly+interpret+St.+Thomas+and+draw+him+into+this+opinion+as+well.%E2%80%9D%0A%0A%E2%80%94+Bartolomeo+Mastrius%2C+bk.+3%2C+Of+the+Incarnation+of+the+Lord+%28d.+16 </figure><figure class="quote" id="q-bc48cf2972" data-kw="faith instrument receives Christ alone means union">
<blockquote><p>So great is the necessity of faith in the matter of salvation that as Christ alone is the cause of salvation, so faith alone is the means and way to Christ. Hence it is celebrated as the bond of our union with Christ because he dwells in us by faith (Eph. 3:17); as the condition of the covenant of grace under which salvation is promised to us; as the instrument by which we receive Christ with all his benefits. For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-da8941acdb" data-kw="">
<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seems not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If He were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God, as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest than that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

<blockquote><p>Briefly, the concept of double justice posits a higher hidden justice in God which transcends the Law and could condemn even the angels. This idea appears in Calvin’s works before the sermons on Job but always grows out of his fascination with Job 4:18, namely that even the angels are not clean in God’s sight… which proved that creaturely justice cannot satisfy the justice of God… But when he tried to develop double justice as a hermeneutical key to the book of Job as a whole, the text led him in a direction he did not want to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/susan-schreiner.html">Susan Schreiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Exegesis &amp; Double Justice in Calvin’s Sermons on Job’ in Church History</cite>, 58, no. 3 (Sep., 1989), pp. 322-38, p. 322</span></figcaption>

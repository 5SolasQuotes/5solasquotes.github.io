<main class="wrap"><figure class="quote" id="q-3676f10726" data-kw="">
<blockquote><p>19. …that all persons, professing a belief in the faith of any Protestant sect, who shall demean themselves peaceably under the government, as hereby established, shall be capable of being elected into any office of profit or trust, or being a member of either branch of the Legislature, and shall fully and freely enjoy every privilege and immunity, enjoyed by others their fellow subjects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-jersey.html">New Jersey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of New Jersey, 1776 (Thorpe, 5.2597-8)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3236da1c4" data-kw="">
<blockquote><p>A class of subjects same to be discussed in the latter part of the sixteenth century which had not engaged so much of the attention of the earlier Reformers–especially the Erastian and the Prelatic controversies–and in the discussion of these matters Beza bore his part nobly as an able and faithful champion of the truth. The Erastian controversy, indeed, as conducted between Erastus and Beza, turned mainly upon the particular subject of the excommunication of church members; and it was not till the following century, that the whole of the principles usually regarded by Presbyterian divines as comprehended in the Erastian controversy, were subjected to a full and thorough discussion. Still, even at that early stage, the quested was mooted, on which the entire progress of the subsequent discussion, down even to our own day, has made it more and more manifest that the whole controversy hinges–viz. whether or not Christ has appointed in His church a government, distinct from, independent of, and in its own province not subordinate to, civil magistracy. And on this great question, as well as on the particular topic of excommunication comprehended under it, Erastus took the side which has always been supported by politicians, sycophants [obedient flatterers], and worldlings, while Beza ably defended that which has been adhered to by all intelligent and conscientious Presbyterians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers &amp; the Theology of the Reformation, ch. 7, ‘Calvin &amp; Beza’</cite>, pp. 350-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-d330e59098" data-kw="">
<blockquote><p>16. All persons living in the Province who confess and acknowledge the one Almighty and Eternal God, and holds themselves obliged in conscience to live peaceably and quietly in a civil society, shall in no way be molested or prejudged for their religious persuasions and exercise in matters of faith and worship… Yet it is also hereby provided, that no man shall be admitted a member of the great or common Council, or any other place of public trust, who shall not [sic] profaith in in Christ Jesus, and solemnly declare that he does no ways hold himself obliged in conscience to endeavor alteration in the government… Nor by this article is it intended, that any under the notion of this liberty shall allow themselves to avow atheism, irreligiousness, or to practice cursing, swearing, drunkenness, prophaneness, whoring, adultery, murdering or any kind of violence… … 20. That all marriages nor forbidden in the law of God, shall be esteemed lawful…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-jersey.html">New Jersey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamental Constitutions for the Province of East New Jersey in America, 1683 (Thorpe, 5.2579-81)</cite></span></figcaption>

</figure><figure class="quote" id="q-71644a8bf2" data-kw="">
<blockquote><p>But although a king may remove an unprofitable and hurtful bishop, yet cannot a bishop (on the other side) depose a king if he have offended. (Mt. 14:4; Prelates of the Church have no authority to depose kings and princes, Lk. 13:32) John indeed reproved Herod, but he displaced him not of his kingdom. Ambrose and Innocentius excommunicated emperors, but they proceeded no further. Yea, and Christ called Herod a wolf, but He took not away his kingdom from him, and He paid tribute unto Tiberius, a most wicked prince. (Mt. 17:27) Neither was He at any time author to any man to shake off his yoke. Wherefore let Popes take heed: by what right they remove at their own pleasure kings and emperors out of their places. This did neither any of the prophets, nor the apostles, nor yet Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, Book 4</cite>, ch. 13, section 12, p. 232</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-af834b5bd2" data-kw="">
<blockquote><p>Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labor in it more diligently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah (1550)</cite></span></figcaption>

</figure><figure class="quote" id="q-1d1ebfccd9" data-kw="">
<blockquote><p>And to complete the dismal scene of our misery, we have had for a long time among us one of the most scandalous, pernicious and most unaccountable schisms that perhaps ever was in any age of the Church; a schism carried on by three weak men, supported by a poor people, and both are equally ignorant of the nature of union with, and separation from, a Church, and of what will justify the one or other; they cannot, in a consistency with their principles, hold communion with any Church this day on earth. We confess to our shame there are many things wrong with us, and that there are errors in the administration, against which we are, with the help of grace, still struggling and contending; and we resolve ever to plead against such corruptions: But no man of common understanding will think this national Church should be cast off, and that we should separate from her; we have a good constitution; we have a standard of doctrine without error; Westminster Confession of Faith, which we own as the confession of our faith; we have subscribed and preach the doctrine therein contained; our worship is pure, without men’s additions; our discipline and government, in their constitution, are agreeable unto, founded on, and appointed in the Word of God; and there are no sinful terms of communion imposed. As we cannot, and hope never shall, justify the measures some take, and for which they shall answer to God; so we will not despise the dust of Zion: What of the covenanted work of reformation is remaining among us, we must favor that dust, and look on it as precious, and pray and wrestle, by the help of grace, that our Lord would return to build his own House (for men have not courage to do it) and take a new infeftment[?] thereof by a cloud of his glory. There are a set of faithful ministers in this Church who are troubled for the many offenses that are given, and for laying so many stumbling blocks before the blind: And as they mourn for these in secret, so they give frequent testimony against them.</p></blockquote>

<blockquote><p>The Brownists did not difler from the Church of England in any articles of faith, but were very rigid and narrow in points of discipline. They denied the Church of England to be a true Church and her ministers to be rightly ordained. They maintained the discipline of the Church of England to be Popish and antichristian, and all her ordinances and sacraments invalid. Hence they forbade their people to join with them in prayer, in hearing, or in any part of public worship; nay, they not only renounced communion with the Church of England, but with all other reformed Churches, except such as should be of their own model. They apprehended, according to Scripture, that every church ought to be confined within the limits of a single congregation and that the government should be democratical. When a church was to be gathered, such as desired to be members made a confession of their faith in the presence of each other, and signed a covenant, obliging themselves to walk together in the order of the gospel, according to certain rules and agreements therein contained. The whole power of admitting and excluding members, with the deciding of all controversies, was in the brotherhood. Their church-officers, for preaching the Word and taking care of the poor, were chosen from among themselves, and separated to their several offices by fasting and prayer and imposition of the hands of some of the brethren. They did not allow the priesthood to be a distinct order, or to give a man an indelible character; but as the vote of the brotherhood made him an officer and gave him authority to preach and administer the sacraments among them, so the same power could discharge him from his office and reduce him to the state of a private member. When the number of communicants was larger than could meet in one place, the church divided and chose new officers from among themselves as before, living together as sister-churches and giving each other the right hand of fellowship, or the privilege of communion with either. One church might not exercise jurisdiction or authority over another, but each might give the other counsel, advice, or admonition if they walked disorderly or abandoned the capital truths of religion; and if the offending church did not receive the admonition, the others were to withdraw and publicly disown them as a church of Christ. The powers of their church-officers were confined within the narrow limits of their own society; the pastor of one church might not administer the sacrament of baptism or the Lord’s supper to any but those of his own communion and their immediate children. They declared against all prescribed forms of prayer. Any lay-brother had the liberty of prophesying or giving a word of exhortation in their church assemblies; and it was usual after sermon for some of the members to ask questions and confer with each other upon the doctrines that had been delivered; but as for church-censures, they were for an entire separation of the ecclesiastical and civil sword. In short, every church, or society of Christians meeting in one place, was, according to the Brownists, a body corporate, having full power within itself to admit and exclude members, to choose and ordain officers; and, when the good of the society required it, to depose them, without being accountable to classes, convocations, synods, councils or any jurisdiction whatsoever. Some of their reasons for withdrawing from the Church are not easily answered: they alleged that the laws of the realm and the queen’s injunctions had made several unwarrantable additions to the institutions of Christ. That there were several gross errors in the Church-service. That these additions and errors were imposed and made necessary to communion. That if persecution for conscience’ sake was the mark of a false church, they could not believe the Church of England to be a true one. They apprehended farther that the constitution of the hierarchy was too bad to be mended; that the very pillars of it were rotten and that the structure must be begun anew. Since therefore all Christians are obliged to preserve the ordinances of Christ pure and undefiled, they resolved to lay a new foundation and keep as near as they could to the primitive pattern, though it were with the hazard of all that was dear to them in the world.</p></blockquote>

to+the+state+of+a+private+member.+When+the+number+of+communicants+was+larger+than+could+meet+in+one+place%2C+the+church+divided+and+chose+new+officers+from+among+themselves+as+before%2C+living+together+as+sister-churches+and+giving+each+other+the+right+hand+of+fellowship%2C+or+the+privilege+of+communion+with+either.+One+church+might+not+exercise+jurisdiction+or+authority+over+another%2C+but+each+might+give+the+other+counsel%2C+advice%2C+or+admonition+if+they+walked+disorderly+or+abandoned+the+capital+truths+of+religion%3B+and+if+the+offending+church+did+not+receive+the+admonition%2C+the+others+were+to+withdraw+and+publicly+disown+them+as+a+church+of+Christ.+The+powers+of+their+church-officers+were+confined+within+the+narrow+limits+of+their+own+society%3B+the+pastor+of+one+church+might+not+administer+the+sacrament+of+baptism+or+the+Lord%E2%80%99s+supper+to+any+but+those+of+his+own+communion+and+their+immediate+children.+They+declared+against+all+prescribed+forms+of+prayer.+Any+lay-brother+had+the+liberty+of+prophesying+or+giving+a+word+of+exhortation+in+their+church+assemblies%3B+and+it+was+usual+after+sermon+for+some+of+the+members+to+ask+questions+and+confer+with+each+other+upon+the+doctrines+that+had+been+delivered%3B+but+as+for+church-censures%2C+they+were+for+an+entire+separation+of+the+ecclesiastical+and+civil+sword.+In+short%2C+every+church%2C+or+society+of+Christians+meeting+in+one+place%2C+was%2C+according+to+the+Brownists%2C+a+body+corporate%2C+having+full+power+within+itself+to+admit+and+exclude+members%2C+to+choose+and+ordain+officers%3B+and%2C+when+the+good+of+the+society+required+it%2C+to+depose+them%2C+without+being+accountable+to+classes%2C+convocations%2C+synods%2C+councils+or+any+jurisdiction+whatsoever.+Some+of+their+reasons+for+withdrawing+from+the+Church+are+not+easily+answered%3A+they+alleged+that+the+laws+of+the+realm+and+the+queen%E2%80%99s+injunctions+had+made+several+unwarrantable+additions+to+the+institutions+of+Christ.+That+there+were+several+gross+errors+in+the+Church-service.+That+these+additions+and+errors+were+imposed+and+made+necessary+to+communion.+That+if+persecution+for+conscience%E2%80%99+sake+was+the+mark+of+a+false+church%2C+they+could+not+believe+the+Church+of+England+to+be+a+true+one.+They+apprehended+farther+that+the+constitution+of+the+hierarchy+was+too+bad+to+be+mended%3B+that+the+very+pillars+of+it+were+rotten+and+that+the+structure+must+be+begun+anew.+Since+therefore+all+Christians+are+obliged+to+preserve+the+ordinances+of+Christ+pure+and+undefiled%2C+they+resolved+to+lay+a+new+foundation+and+keep+as+near+as+they+could+to+the+primitive+pattern%2C+though+it+were+with+the+hazard+of+all+that+was+dear+to+them+in+the+world.%E2%80%9D%0A%0A%E2%80%94+About+Separatists%2C+The+Tenets+of+the+English+Brownists+%7C+Daniel+Neal%2C+The+History+of+the+Puritans%E2%80%A6+%28London%2C+1822%29%2C+vol.+1%2C+ch.+6%2C+From+Parker+to+Grindal%2C+pp.+303-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5105eb4e3e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5105eb4e3e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=The%20Brownists%20did%20not%20difler%20from,dear%20to%20them%20in%20the%20world." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

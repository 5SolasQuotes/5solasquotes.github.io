<blockquote><p>Use of Instruction, That there may be an happy reconciliation and accord between God’s grace in forgiving, and man’s duty in repenting, one need not be preached to justly out the other. All error is an extremity of some truth, and therefore it is hard to discover truth, because its difficult to find out where the bounds are, that truth parts from error. Let not therefore a Christian so rely upon his repentance, as if there were no Covenant of grace, no blood of Christ to procure an atonement: so neither let him extoll these causes to the extinguishing of his duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted and Vindicated, from the Errors of Papists, Arminians, Socinians, and more especially Antinomians. In XXX Lectures Preached at Lawrence-Jury, London</cite>, (London: Robert White, 1648), p. 155.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22475fe67c" data-kw="">
<blockquote><p>The first covenant having been broken by the fall of man, the justice of God could have inflicted punishment; but we have beheld him pitying the human race, and giving his Son to satisfy justice by his death, and thereby entering into a new covenant with mankind; concerning this covenant we must now speak a little more particularly. …

God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man.

Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality. Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit.

The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished, and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works. which was entered into with Adam, and renewed on Mount Sinai.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.17, pp 324, 325-26.</span></figcaption>

</figure><figure class="quote" id="q-5d18bed3b9" data-kw="">
<blockquote><p>The first great thing in this Controversy is, to consider the nature of the Covenant, which is the first foundation of the privilege to believers, and their seed, as it was first made with Abraham and his seed, in the name of all believers, and their seed both Jews and Gentiles; for so large is the extent of that Covenant to both, as hereafter shall be proved from the New Testament expressions; and if we find the same Covenant reaching Gentile-believers, and their Children, as Abraham and his, we cannot be denied the new external sign and seal of the same Covenant; for though the outward signs may be changed, yet there is no change of the privileges, if the Covenant remain entire.</p></blockquote>

</figure><figure class="quote" id="q-a4ad6c5aa9" data-kw="">
<blockquote><p>God cannot deal with them whom you call the world of mankind, according to the Covenant of Grace: For if he should, he should save them all; as I prove thus. If whatsoever God requires by this covenant on man’s part, God undertakes to perform on his part, then it is impossible but that all must be saved with whom he means to deal according to this covenant.

But whatsoever by this covenant God requires on man’s part, God himself undertakes to perform on his part, as I prove thus. First, in general, God undertakes in this covenant, to be our Lord and our God, to sanctify us. Therefore, he undertakes to give us faith and repentance. Secondly, in special, and first, doth God require at our hands, that we should love him with all our hearts, and with all our souls? God undertakes to perform this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 181.</span></figcaption>

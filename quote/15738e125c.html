<main class="wrap"><figure class="quote" id="q-15738e125c" data-kw="">
<blockquote><p>So that it is evident that to be justified has a threefold signification. For first it imports as much as to be absolved from sin, that is, to be freed from the woeful consequents of that disfavor and dislike, that unrighteousness and sin subjects us unto. Secondly, to be accepted and respected so as righteous men are wont to be: And thirdly to be framed to the love and desire of doing righteously.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-field.html">Richard Field</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, bk. 3, appendix, ch. 11 in Of the Church... (Oxford: Turner, 1628), pp. 290-324, p. 291; also p. 312.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac48967e05" data-kw="">
<blockquote><p>‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.</p></blockquote>

</figure><figure class="quote" id="q-7d996b190a" data-kw="">
<blockquote><p>The incarnation of Christ was once done and is not to be done again; but remission of sin is so done as that it is continually to be done for us, and the ultimate complete effect of it will then only be when sin shall be quite taken away, so that a total and full remission will be only at the Day of Judgment, as appears, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come:’ Not but that every sin here forgiven is fully and perfectly forgiven, but because we renew sin daily, therefore there is need of a daily pardon: Away therefore with all such opinions as shall either plead such an inherent righteousness in the Pelagian way, or such an imputed righteousness in the Antinomian way that will overthrow this petition [in the Lord’s prayer] for forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, 14.4</span></figcaption>

</figure><figure class="quote" id="q-07cd49e86a" data-kw="">
<blockquote><p>Again (in the second place), this fulfilling of the Law, or obedience towards the Law, is indeed righteousness, when it is complete; but in us it is small and impure. (For, although they have received the first-fruits of the Spirit, and the new, yea, the eternal life has begun in them, there still remains a remnant of sin and evil lust, and the Law still finds much of which it must accuse us.) Accordingly, it is not pleasing for its own sake, and is not accepted for its own sake. But although from those things which have been said above it is evident that justification signifies not only the beginning of the renewal, but the reconciliation by which also we afterwards are accepted, nevertheless it can now be seen much more clearly that the inchoate fulfilling of the Law does not justify, because it is accepted only on account of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concordia Triglotta</cite>, … (St. Louis, MO: Concordia Publishing House, 1921), Apology of the Augsburg Confession, pt. 3, sect. 40, p. 166</span></figcaption>

<blockquote><p>to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | I am pleased to set these things forth in the very words of the great Calvin, Institutes, bk. 3. ch. 17, sect. 8. “It is one thing,” he says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.”

<blockquote><p>(5) This lamentation of Christ over impenitent Jerusalem teaches us also that man’s ruin is from himself? If after all Christ’s gracious invitations, all his unwearied forbearances, all his bitter and salt tears, Jerusalem will stil persist in her rebellious contempt of his gracious offers, how inexcusable is her sin, and inevitable her ruin? What will prevail upon her, if Christ’s tears and entreaties will not prevail? What can save her, if her Redemer’s grace and mercy save her not? What is it that keeps evangelic sinners from being saved? is it any defect in the object, or its revelation? is it mere simple ignorance, or impotence in the subject? No; but it is wilfull blindness and impotence: they shut their eyes and will not see; they bolt their hearts and will not open to Christ, who knocks at the door of the soul by many gracious invitations of his Gospel and Spirit. And do not such deservedly perish, who electively embrace their own ruin, and wilfully reject the things that belong to their peace, Mt. 23:37?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger (London: Widdowes, 1679), bk. 1, ch. 9</cite>, pp. 68-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 12, Sermons Upon Romans 8, Sermon 8, p. 288</span></figcaption>

<blockquote><p>3. The next thing we exhort you to do, is to make choice for your own souls. That is Moses makes of it: Deut. 30:19, ‘Therefore choose life, that both thou and thy seed may live.’ Hearing, believing, considering, are all in order to choice; and without choice, and a determined, fixed, bent of the heart, you will never walk evenly in heaven’s ways. Determine not only that you must, but you will, walk in the way which God has set forth for you. God’s ways must be chosen: Ps. 119:30, ‘I have chosen the way of truth;’ and verse 173, ‘I have chosen your precepts;’ Josh. 24:15, ‘If it seem evil to you to serve the Lord, choose you this day whom you will serve.’ Not as if it were indifferent, but to set an edge upon their appetite. There is much strength in the bond, when a man binds himself freely, and makes the more inexcusable if he does not observe it. All will choose life before death, but they are out in the means; they do not choose good before evil, the good of holiness before the evil of sin. Every man desires some good. It is as natural for the reasonable creature to desire to be happy, as it is for the fire to bring us to that happiness that we desire. They would be happy, but they choose means quite contrary to happiness. Oh, then, choose the ways of God; let life be your motive, and holiness your choice. This is the way to live forever, to avoid hell beneath. As soon as we come to years of discretion, we should make our choice to go on in the ways of life. To this we are obliged by the most weighty reasons, urged by the enforcements of the word, and by the sad and numerous examples of young people, who make an ill choice in the beginning, and go on, and are hardened therein, and perish forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Seventeenth Sermon’, on Deut. 30:15, in The Works of Thomas Manton, vol. 2</cite>, p. 369</span></figcaption>

</figure><figure class="quote" id="q-7ddb942aa9" data-kw="">
<blockquote><p>‘I stand at the door and knock, if any will open.’ What then? ‘I will come in to him and sup with him and He with me’ (Rev. 3:20), as if He should say: ‘If any will listen to these motions of the Spirit, he will have the sweet work and the sweet consolations of the Spirit in him; the Spirit shall come in, shall cheer and refresh him.’ He that will make much of these sparks shall have a comfortable fire kindled, at which he shall warm and comfortably refresh himself. See how the cherishing of the motions of the Spirit keeps it from quenching and causes it to enflame and burn. But on the contrary, when a man neglects the knocks of the Spirit and does not yield obedience to them, opens not the door, that causes a sad quenching of the Spirit. See an example in Song of Solomon 5:2, ‘It is the voice of my Beloved that knocks, saying, ‘Open to me, my sister.” There are the motions of the Spirit of Christ. And she takes notice of them, therein she did right. It is the voice of my Beloved that knocks. But she failed in the second thing, she does not arise presently and open, but she shucks and shuffles (verse 3) and has her put-offs, ‘I have put off my coat, etc.’ Well, what is the issue [result]? Verse 5, she arose to open to her beloved after her heart smote her for not opening before, but it was too late, for verse 6. See, how for lack of obedience to the motions of the Spirit, she quenched the comforts and joy of the Spirit.</p></blockquote>

<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2c5554f76e" data-kw="">
<blockquote><p>We find no separation but in case of idolatry… We shall not deny but that whatsoever is practiced in the worship of God, or set up as an ordinance without God’s warrant in his Word, may be comprehended under idolatry, taking idolatry in a large sense, but that everything set up or practiced in the worship of God or in ordinances is such idolatry as is ground sufficient to separate from a Church wherein it is practiced as no true Church, is a conceit in itself without warrant of the Word, nay directly contrary to the allowed practice of God’s people in the Word, both in Old and New Testament. This conceit of Mr. Lockyer’s is very Brownism and rigid Separatism engrained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-wood.html">James Wood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Stone Pretended to be out of the Mountain, Tried &amp; found to be a Counterfeit… (Edinburgh: Andro Andrews, 1654), sect. 12, pp. 341-42 Wood was a Scottish covenanter.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f3b61fd2a" data-kw="">
<blockquote><p>37th Question, Why Nadab &amp; Abihu were Judged Only, and Not Eleazar and Ithamar, who also were in Error. … 2. Therefore the reason may be that these two had aliquam excusationem, ‘some excuse’ of their sin, because they were in grief, but their brethren which were slain had no such excuse. 3. And beside the Lord would not extinguere pontificiam dignitatem, at once ‘extinguish the pontifical dignity’ granted to Aaron and his posterity. 4. But chiefly the cause was the mercy of God, which He always tempers with his judgments: He was contented with this example of severity, as the Lord said to the angel that smote Israel after David had numbered the people: ‘It is sufficient, hold now thine hand.’ 5. Yet this is the best resolution, after we have scanned what we can, that the true cause was the good pleasure of God, whereof no reason is to be yielded, sure we are,Quamvis occulta sint Dei iduicia, non ideo iniqua esse, ‘although God’s judgments be secret, yet they are not unjust.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus… (London, 1631), on Lev. 10</cite>, pp. 197-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>37. To hold that any congregations are such whose worship is faulty, but such as God forgives and accepts, but that it is unlawful for us to join with them, lest it make us guilty of their sin, this (though it should be erroneous, and uncharitable and sinful) yet is not to excommunicate that congregation as no Church or no Christians. But to say of any congregation that they want [lack] anything essential to Christianity or to make them capable to be loved as Christians, or that their worship of God is idolatry, or so bad as that God accepts it not, the evil of it being greater than the good (as poison in our food), and on this reason to declare that no good Christian should communicate with them, this is to excommunicate such [a] congregation, as far as one Church may excommunicate another, which is but by such renouncing their communion.²</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2</cite>, pp. 9-14</span></figcaption>

<blockquote><p>…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 1</cite>, pp. 1-2</span></figcaption>

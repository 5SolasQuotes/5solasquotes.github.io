<main class="wrap"><figure class="quote" id="q-bbd710f39d" data-kw="">
<blockquote><p>…yea there can be no sin eligible [chosen] by such and such a case [of necessary circumstance], as Lot sinned in exposing his daughters to the lust of men, to redeem abstinence from sodomy. Hence it is clear: we may not do a less, nor counsel another to commit a less sin, to eschew a greater, as the Jesuits wickedly teach. So Tannerus, so Turrianus and others who make a scandalum permissum, a scandal that a Christian may hinder another to fall in, and yet he permits him to fall in it. But God has a prerogative to permit sinful scandals, men have no such power, when they are obliged to hinder it. The divinity of others seems better to me, who deny that the least venial [sin] should be committed to eschew a greater sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty</cite>, p. 83 in The Divine Right of Church Government (1646)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97113abe63" data-kw="">
<blockquote><p>But if a governor so mis-determine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to… An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: but not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London, 1659), 5th Disputation, ch. 12,; p. 463</span></figcaption>

<blockquote><p>Yet if the miscarriage be so great in the [authorities’] ordering even of these circumstances or in the manner of duties, as shall overthrow the duty itself and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey… then… we are not bound to follow… in such a case, but otherwise we are.</p></blockquote>

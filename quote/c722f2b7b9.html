<main class="wrap"><figure class="quote" id="q-c722f2b7b9" data-kw="">
<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 77-78</span></figcaption>

</figure><figure class="quote" id="q-208206c415" data-kw="">
<blockquote><p>News of the ordination of Cameron [by Robert M’Ward and John Brown of Wamphray in the Netherlands in late-July or early-August 1679] and [Thomas] Hog was swiftly carried back to Scotland, where it caused a predictable outburst of indignation amon the older nonconforming ministers. John Carstairs, one of the most senior among them, wrote bitterly to M’Ward on 20 August: ‘I somewhat wonder you have there ordained those two young men–not so very acceptable, to say no more, to the Church of Scotland. I fear it offends many; nor do I see, especially at this time, how it can be so well justified. Do you think that there is no ministerial church amongst the nonconforming ministers in Scotland to ordain whom they think fit to be ordained? And is it suitable to that Christian correspondence and deference that the churches of Christ ought to have with and to one another that a few ministers of the church in Holland should ordain ministers for the Church of Scotland without their desire, consent , allowance or knowledge?’ Carstairs’ view was certainly typical of many of the older and more influential of the ministers, and his letter clearly reflected their resentment at what they saw as a usurpation of their ministerial functions by M’Ward and Brown. It also gave an indication of the sort of reception Cameron could expect on his return to Scotland [in late-1679]. A further hint of the welcome that awaited him was given in a letter from John Dickson to M’Ward on 16 July: ‘As for Mr Cameron, the prejudice against him is screwed up so high that no vindication will allay the feverish spirits of some persons who are maddened against him.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), p. 163</span></figcaption>

</figure><figure class="quote" id="q-badc6b380d" data-kw="">
<blockquote><p>Take heed of pretending to greater purity and strictness about Church communion and administrations than the Word of God commends, or the examples of Christ and the apostles and the primitive Church do commend; nor be so extremely rigid as not to bear with things that they have tolerated. It is an observable rule laid down by wise and eminent divines that too much strictness and severity often does injury the Church more than profit it; it’s the way to overturn churches, not to reform them; especially this severity is unbecoming private Christians, who having no authority, yet complain such persons and such things are defilements: they must separate from them, they must not touch the unclean thing: such should take heed that they be not ‘righteous over-much,’ and not dare to be wise above what is written, lest their too much affected purity and misguided zeal hurt more the Church of Christ, and their own souls than the corruptions they so much complain of. Calvin adv. Anab., Art. 2. ‘Cum sub specie studii perfectionis imperfectionem nulam tollerare possumus; tune Diabolum nos tumefacere superbia, et hypocrisi seducere moneamur.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/i-c-m-a.html">I.C.M.A.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to the True Religion</cite>, … (Edinburgh: Anderson, 1669), pp. 87-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

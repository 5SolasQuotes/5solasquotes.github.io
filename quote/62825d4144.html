<main class="wrap"><figure class="quote" id="q-62825d4144" data-kw="">
<blockquote><p>11th Objection: This Chuch [of Scotland] is erroneous in her doctrine, therefore ’tis sinful to keep communion with her. This is a heavy charge indeed; and, if it was true that her declared or professed doctrine is corrupt in fundamental points and we required to approve thereof, I should think it sufficient ground of separation:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738)</cite>, ch. 6, section 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“11th Objection: This Chuch [of Scotland] is erroneous in her doctrine, therefore ’tis sinful to keep communion with her. This is a heavy charge indeed; and, if it was true that her declared or professed doctrine is corrupt in fundamental points and we required to approve thereof, I should think it sufficient ground of separation:”

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738), ch. 6, section 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C11th+Objection%3A+This+Chuch+%5Bof+Scotland%5D+is+erroneous+in+her+doctrine%2C+therefore+%E2%80%99tis+sinful+to+keep+communion+with+her.+This+is+a+heavy+charge+indeed%3B+and%2C+if+it+was+true+that+her+declared+or+professed+doctrine+is+corrupt+in+fundamental+points+and+we+required+to+approve+thereof%2C+I+should+think+it+sufficient+ground+of+separation%3A%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland%2C+in+which+the+Chief+Things+in+the+Testimonies+of+these+Reverend+Brethren+who+lately+made+a+Secession+from+her+are+considered+%26+shown+to+be+no+Ground+of+Separation+or+Secession+%281738%29%2C+ch.+6%2C+section+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62825d4144.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62825d4144.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=11th%20Objection%3A%20This%20Chuch%20%5Bof%20Scotland%5D,think%20it%20sufficient%20ground%20of%20separation%3A" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66cd10c262" data-kw="">
<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Scandal</cite>, pp. 321–22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.”

— James Durham, Treatise Concerning Scandal, pp. 321–22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThen+there+may+and+ought+to+be+uniting+%5Bin+church+union%5D+when+the+evils+that+follow+division+or+schism%2C+are+greater+and+more+hurtful+to+the+Church%2C+than+the+evils+that+may+be+supposed+to+follow+on+union.+I+speak+not+of+ills+of+sin+%28for+the+least+of+these+are+never+to+be+chosen%29%2C+but+of+evils+and+inconveniences+that+may+indeed+be+hurtful+to+the+Church+in+themselves%2C+and+sinful+in+respect+of+some+persons%2C+yet+are+not+so+to+all%3A+Now%2C+in+such+evils+the+lesser+is+to+be+chosen.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+Treatise+Concerning+Scandal%2C+pp.+321%E2%80%9322&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66cd10c262.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66cd10c262.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/unity-of-the-church/#:~:text=Then%20there%20may%20and%20ought%20to,the%20lesser%20is%20to%20be%20chosen." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2258402bd8" data-kw="">
<blockquote><p>The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697)</cite>, pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce.”

— Anthony Horneck, The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 33-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+divisions+among+Protestant+Churches+are+to+be+deplored+so+much+the+more+because+the+points+they+differ+in+are+inconsiderable+and+might+easily+be+composed+if+men+had+but+peaceable+tempers+and+were+resolved+to+lay+aside+interest+and+carnal+respects%2C+and+punctilios+of+honor+and+credit%2C+etc.+for+they+all+agree+in+fundamentals%2C+all+are+satisfied+that+the+Church+of+Rome+has+notoriously+deviated+from+the+simplicity+of+the+Gospel%3B+and+the+matters+in+difference%2C+are+things+in+which+salvation+is+not+concerned.+And+upon+that+account+their+labours+deserve+great+commendations%2C+who+heretofore+and+very+lately+have+endeavored+to+reconcile+the+Protestant+Churches+into+a+perfect+union%3A+A+blessed+work.+Blessed+are+the+peacemakers%2C+that+endeavor+to+make+peace+among+the+jarring+members+of+Christ%E2%80%99s+Body%3B+and+though+they+may+fail+of+success%2C+yet+they+shall+not+lose+their+reward.+In+the+meanwhile+those+who+widen+or+heighten+these+differences%2C+and+incite+the+respective+parties+to+hatred%2C+and+wrath%2C+and+animosities+one+against+another%2C+to+be+sure+are+no+children+of+the+God+of+peace%2C+and+had+need+at+least+before+they+die+make+public+satisfaction+for+the+dreadful+effects+their+heats+and+passions+do+produce.%E2%80%9D%0A%0A%E2%80%94+Anthony+Horneck%2C+The+Blessed+Advantages+of+Peace+%26+Peacemakers+In+a+Sermon+preached+at+the+Savoy+in+London+upon+the+Fifth+of+St.+Matthew%2C+verse+9%2C+%E2%80%98Blessed+are+the+Peace-makers%E2%80%A6%E2%80%99+%28London%3A+Aylmer%2C+1697%29%2C+pp.+33-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2258402bd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2258402bd8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=The%20divisions%20among%20Protestant%20Churches%20are,their%20heats%20and%20passions%20do%20produce." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b9174c43e8" data-kw="">
<blockquote><p>That there should be a mutual amity and forbearance amongst those who differ in matters of Church-government or the like, but agree in the fundamentals is most reasonable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Religion &amp; Learning &amp; of Religious &amp; Learned Men (London: A.M., 1656), bk. 1, ch. 7</cite>, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

— Edward Leigh, A Treatise of Religion &amp; Learning &amp; of Religious &amp; Learned Men (London: A.M., 1656), bk. 1, ch. 7, p. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+there+should+be+a+mutual+amity+and+forbearance+amongst+those+who+differ+in+matters+of+Church-government+or+the+like%2C+but+agree+in+the+fundamentals+is+most+reasonable.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+Treatise+of+Religion+%26+Learning+%26+of+Religious+%26+Learned+Men+%28London%3A+A.M.%2C+1656%29%2C+bk.+1%2C+ch.+7%2C+p.+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9174c43e8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b9174c43e8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=That%20there%20should%20be%20a%20mutual,in%20the%20fundamentals%20is%20most%20reasonable." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7da1df1747" data-kw="">
<blockquote><p>(5) Beware of having the persons of men in admiration, either for gifts or grace, or because of advantage, Judg. 5:16. This was it which occasioned the schisms in the Church of Corinth, admiring their teachers, they were puffed up for one against another, and one said, ‘I am of Paul, another, I of Apollo, others, I of Cephas, etc.’ even according as their humor and liking led them? take heed of being taken in the same snare. All flesh is grass, none infallible, and therefore none to be doted upon. Ne judicemus ex personis fidem, sed ex fide personas, said Tertullian. Let not your eyes be so dazzled with whatever eminency of parts or graces ye apprehend to be in any, as to set up their bare word for your oracle, or their example for your rule. This was it which drew many of the Jews (and Barnabas among the rest) into a sinful separation (Gal. 2:12-13) because they saw Peter a leading man, a prime and eminent apostle, going that way before them. And yet that pillar of the Church did therein halt, and walked not with a straight foot, and was to be blamed; and consequently to be not imitated, but shunned. It is dangerous to shape our course by another’s compass; as many a ship has been lost and run on banks by following their admiral’s lanthorn. Give eminent and godly men their due respect, but put them not in God’s room. It is divine rule, not human example we are to walk by. Follow no man further than he follows Christ, 1 Cor. 11:1… … (8) Enslave not yourselves to any person or party, so as to be over-desirous to please them or over-fearful of their censures. Is it not servile man-pleasing and cowardice to do so? and leads many to sinful compliance with dividing courses? When therefore any fervent self-conceited person or people would carry all down by their censoriousness and passions, it is high time for pastors and the aged, graver and maturer sort of Christians openly to rebuke them, to appear against them and stand their ground (as Paul did, Gal. 2:11) and not to comply with the misguided sort (though well-meaning) and their preposterous zeal, that by connivance or compliance ye may escape their censures and reproaches. He that thus saves his name, shall lose it, and perhaps on a worse account. Be not therefore cowed to silence or amen to their way, for fear of the scourge of tongues. Be valiant for the truth and against such ills, else fainting will feed their humor and invite them to be more insolent. Put on authority and Gospel-austerity to check their petulancy and untowardliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London, 1681)</cite>, pp. 180-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

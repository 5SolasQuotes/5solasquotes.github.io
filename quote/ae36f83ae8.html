<main class="wrap"><figure class="quote" id="q-ae36f83ae8" data-kw="">
<blockquote><p>But although the sanctifying of a Sabbath be thus Obligatory to Christians, yet it is not the same Sabbath Day, to the Observation of which the Jews and the People of God, before Christ’s coming into the World, were bound. But it is with good Ground, and upon good Authority, changed from the last to the first Day of the Week, from Saturday to Sunday; called now the Lord’s Day, because it was that Day of the Week on which our Lord and Saviour rose from the Dead; in Memory of which, and in a Thankful Acknowledgement of the great Mercy of our Redemption, fully completed by his Resurrection, the Sabbath hath been translated to this Day, and is now rightly celebrated on this Day by all the Churches of Christ throughout the World.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), pp 213-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-bc55678204" data-kw="">
<blockquote><p>There is a political end of the Sabbath, viz. The refreshment and recreative breathing of the outward man, a relaxation of the body from the pains and toil of the week; and therefore the Sabbath is called a rest. It is said of God Himself that on the seventh day He rested and was refreshed, Ex. 31:17. And how much more does poor man stand in need of rest and refreshment? Death indeed fairly unpins our tabernacle of clay, folds it up and lays it in the grave, but too much labour tears it down; man’s body is taken down by death, is thrown down by too much toil, therefore the wearisome labours of the week must be allayed by the rest of the Sabbath. The very name of a Sabbath signifies nothing but rest, strongly to argue, that that holy day was appointed for mans relaxation from the hurries of the world, and the sweats of the week. The Sabbath is a rest to the body and a revival to the soul, the body’s ease, and the soul’s enjoyment; the outward man on the Sabbath recovers strength, and the inward man receives Christ: Our exhausted spirits on God’s holy day are sweetly recruited, and our importunate souls are rarely answered, they then prey upon a Christ offered in the Gospel. Plato observes that the gods willing to recrui• mankind over-toiled with labour, in pity have appointed festival days for their ease and relaxation. Thus that heathen philosopher gives in his verdict to this particular; Indeed God’s blessed Sabbath shores up a piece of clay, and it builds up a piece of eternity, the precious and the immortal soul. The Sabbath is the body’s friend, and the soul’s fosterer; the body’s rest-time, and the soul’s term-time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian</cite>, … (London, 1668) Wells was an English puritan. | ch. 23, ‘We must not only meditate on the God of the Sabbath, but on the Sabbath of God, in the morning of his holy day’, pp. 193-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-e3cc892188" data-kw="">
<blockquote><p>(Now these heretics) have themselves been sent forth by Satan, for the purpose of slandering before the Gentiles the divine name of the Church. (And the devil’s object is,) that men hearing, now after one fashion and now after another, the doctrines of those (heretics), and thinking that all of us are people of the same stamp, may turn away their ears from the preaching of the truth, or that they also, looking, (without abjuring,) upon all the tenets of those (heretics), may speak hurtfully of us. (The followers of Carpocrates) allege that the souls are transferred from body to body, so far as that they may fill up (the measure of) all their sins. When, however, not one (of these sins) is left, (the Carpocratians affirm that the soul) is then emancipated, and departs unto that God above of the world-making angels, and that in this way all souls will be saved. If, however, some (souls), during the presence of the soul in the body for one life, may by anticipation become involved in the full measure of transgressions, they, (according to these heretics,) no longer undergo metempsychosis. (Souls of this sort,) however, on paying off at once all trespasses, will, (the Carpocratians say,) be emancipated from dwelling any more in a body. Certain, likewise, of these (heretics) brand their own disciples in the back parts of the lobe of the right ear. And they make counterfeit images of Christ, alleging that these were in existence at the time (during which our Lord was on earth, and that they were fashioned) by Pilate.</p></blockquote>

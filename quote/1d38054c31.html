<main class="wrap"><figure class="quote" id="q-1d38054c31" data-kw="">
<blockquote><p>Now Christian theology has always been more or less conscious of this calling. On the whole, its teaching has been that God is “simple,” that is, sublimely free from all composition, and that therefore one cannot make any real [i.e., ontological] distinction between his being and his attributes. Each attribute is identical with God’s being: he is what he possesses. In speaking of creatures we make all sorts of distinctions between what they are and what they have. A person, for example, is still human even though he or she has lost the image of God and has become a sinner. But in God all his attributes are identical with his being. God is light through and through; he is all mind, all wisdom, all logos, all spirit, and so forth. In God “to be is the same as to be wise, which is the same as to be good, which is the same as to be powerful. One and the same thing is stated whether it be said that God is eternal or immortal or good or just.” Whatever God is, he is that completely and simultaneously. “God has no properties but is pure essence. God’s properties are really the same as his essence: they neither differ from his essence nor do they differ materially from each other.”68 68. Augustine, The Trinity, VI, 7; John of Damascus, The Orthodox Faith, I, 9; T. Aquinas, Summa theol., I, qu. 2, art. 3; H. Heppe, Dogmatik der evangelisch-reformierten Kirche, 42, 51–53; H. F. F. Schmid, Doctrinal Theology of the Evangelical Lutheran Church, 122.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, trans. John Bolt and John Vriend, vol. 2 (Grand Rapids, MI: Baker Academic, 2004), 118.</span></figcaption>

<blockquote><p>…Grim’s objection also seems to assume a model of divine knowledge which would be rejected by those who hold (as, again, Scholastic realists do) that God is absolutely simple or noncomposite. In particular, it seems to assume that the truths God knows correspond to discrete ideas in the divine intellect, which together form a set. But given divine simplicity, what we describe in terms of such discrete ideas is really one and the same thing in God. There is in God something analogous to what we call, in the case of our own intellects, a grasp of the proposition that all men are mortal, something analogous to what we call a grasp of the proposition that Socrates is a man, and so forth. But these are different ways of describing what, in God, is really one and the same thing.</p></blockquote>

</figure><figure class="quote" id="q-697e2aa704" data-kw="">
<blockquote><p>This thesis offers a constructive account of the doctrine of divine simplicity in Christian theology. In its methodology, the thesis aims to present this divine perfection as an implicate of the scriptural portrayal of God, to draw upon the insights and conceptual resources of Thomas Aquinas and various Reformed orthodox theologians, and to respond to some objections to divine simplicity…. The case for God’s simplicity is made by examining God’s singularity, aseity, immutability, infinity, and act of creation in Holy Scripture and then tracing the ways in which these descriptions of God imply that he is (negatively) not composed of parts. Rather, he is (positively) actus purus and really identical with his own essence, existence, and attributes, each of which is identical with the whole being of the triune God considered under some aspect. In light of the constructive work, this study then addresses the three most pressing objections to divine simplicity: (1) that it denigrates God’s revelation of his many attributes in the economy; (2) that it eliminates God’s freedom in creating the world and acting in history; and (3) that it does not cohere with the doctrine of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity: a Dogmatic Account PhD diss</cite>, (Univ. of St. Andrews, 2014) 325 pp. Here is the pubilshed version of this dissertation: Divine Simplicity: a Dogmatic Account in T&amp;T Clark Studies in Systematic Theology, vol. 30 (Bloomsbury, 2010) 260 pp.</span></figcaption>

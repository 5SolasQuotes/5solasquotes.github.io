<main class="wrap"><figure class="quote" id="q-d88e972086" data-kw="eternal procession Filioque">
<blockquote><p>The question concerns the eternal and internal procession (which is terminated inwardly and is nothing else than the mode of communication of the divine essence, i.e., that by which the third person of the Trinity has from the Father and the Son the same numerical essence which the Father and the Son have).</p></blockquote>

</figure><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>

</figure><figure class="quote" id="q-eb2c42b026" data-kw="Spirit distinct person">
<blockquote><p>To tell us, that he will come unto us, that he will be our comforter, that he will teach us, lead us, guide us; that he spake of old in and by the prophets,—that they were moved by him, acted by him; that he “searcheth the deep things of God,” works as he will; that he appointeth to himself ministers in the church;—in a word, to declare, in places innumerable, what he hath done, what he doth, what he will do, what he says and speaks, how he acts and proceeds, is to ascribe unto him a distinct subsistence from the Father and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, IV</span></figcaption>

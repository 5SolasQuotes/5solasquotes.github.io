</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2284cf8f0" data-kw="">
<blockquote><p>Hence if the officers by these places [in the writings of reformed divines] have suffrages and votes in ordaining of officers, as why should the holy Ghost bid prophets separate Paul and Barnabas for such a ministry and command Timothy to lay hands suddenly on no man (1 Tim. 5:22) but on faithful men that are able to teach others (2 Tim. 2:2; Tit. 1:5,7-8) if officers have no official work in creating officers, but only to choose them, which any brother or woman may do?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658) | The context is Rutherford arguing against congregationalists that Church officers, as officers, have a vote in calling a man to ordination., p. 422</span></figcaption>

</figure><figure class="quote" id="q-90f7c75b47" data-kw="">
<blockquote><p>2. We see also that though ministers are virtually both elders and deacons (as the apostles were), yet ought they to regulate their exercising of both these with respect to the former two. And, 3. that elders and deacons ought in governing and overseeing the poor to have special respect to keep ministers from being burdened or toiled with these, that they may have freedom to follow the ministry of the Word as the main thing: Yea, even to have much access to privacy and solitariness, which is both most necessary for and a well becoming duty to a minister; This is a special end of the appointment of these officers, and in reference to which they are helps, 1 Cor. 12:28, both to the people and to the ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659), pt. 2, ch. 2, p. 70</span></figcaption>

</figure><figure class="quote" id="q-4ded594794" data-kw="">
<blockquote><p>In giving the name of bishops, presbyters, and pastors, indiscriminately to those who govern churches, I have done it on the authority of Scripture, which uses the words as synonymous. To all who discharge the ministry of the word it gives the name of bishops. Thus Paul, after enjoining Titus to ordain elders in every city, immediately adds, &quot;A bishop must be blameless,&quot; &amp;c., (Tit. 1: 5, 7.) So in another place he salutes several bishops in one church, (Phil. 1: 1.) And in the Acts, the elders of Ephesus, whom he is said to have called together, he, in the course of his address, designates as bishops, (Acts 20: 17.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.3.8</span></figcaption>

<blockquote><p>I pray the Lord to preserve his Majesty, and pour out his best blessings on his person and government.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf446c742e" data-kw="">
<blockquote><p>If any person walk unworthy of the Gospel or commit any trespass, he is (unless the scandal be public and notorious) admonished first: secretly by one, next by two or three more. And thirdly, if he contemn both, then according to the order prescribed by our Savior (Matt 18), the matter is brought before the minister and elders where he is accused both of the trespass and of the contempt. If he cannot yet be brought to repentance, then is the matter in some measure made known unto the congregation and he is called before the greater presbytery, where, if he give signs of his repentance, he is remitted to satisfy his own session. But if he persist in his obstinacy, then by the ordinance of the presbytery, the particular eldership is to proceed against him with the censures of the church even to excommunication. The matter being thus heard, known and judged, and the whole process revised by the greater presbytery, the next Sabbath (without delay) the trespass and order of admonitions are declared to the congregation and the person (without specification of his name) is admonished yet to satisfy. Which, if he still refuse to do, the next Sabbath his name, with his offence and contempt, are published. If he yet continue obstinate, then on the next Sabbath (which is the third), he is charged publicly to satisfy for his offence and contempt under the pain of excommunication. If now he offer himself to the particular presbytery, then do they (at the appointment of the presbytery) give order for his public repentance, the removing of the scandal, and his reconcilement to the church. Otherwise the minister proceeds in this order: … As the presbytery excommunicates profane professors, so does it also depose preachers… … The subject and matters treated in the presbytery are all the ecclesiastical matters of weight which concern the particular churches there represented, as: the examination, ordination, suspension and deposition of ministers, scandals of ministers in doctrine, life, or any part of their calling, the decerning [decreeing] of excommunication…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland</cite></span></figcaption>

<blockquote><p>2. The greatest charge… appears [to be] that the Church of Scotland does not press the renewing of the Covenants, National [1638] and Solemn League [1643]. But there are several things as to this that they take no notice of, which, if noticed, might, in a great measure, allay their clamour: (1) That the National Covenant is, indeed, a confession of our faith, very praiseworthy in its time, but I conceive, for variety and perspicuity, not to be compared with the Westminster Confession, which we own and press. (2) That the Westminster Confession is ratified in King William’s Parliament, and the other [the National Covenant] was approven [implicitly, not explicitly] by the last Parliament of King Charles the Second [in 1681], where I think [James] the Duke of York presided, and included [it] in the bosom of the Test [for civil office] as a point thereof; which honour I believe that Parliament would not have given to the Westminster Confession. (3) As to the Solemn League, they would do well to consider, more seriously, what that answer does overly take notice of, p. 13, near the beginning, viz. that the [General] Assembly [of the Church of Scotland] appoints its being subscribed by all the true professors of the Reformed religion, only after its reception and approbation in the kingdom of England. But they should have considered further, that the Assembly, for aught I can find, by their act, do not appoint even that it be subscribed, only they recommend to the honorable Convention of Estates, that, being examined and approved by them, it may be sent to England, to be received and approven there, that after that it may be, with all religious solemnity, sworn, etc. (4) They would consider whether it be practicable to get England to consent to renew that Covenant, and if it be, whether they themselves will undertake to gain their consent. (5.) Whether we can renew it without their consent, and whether, in that case, it would be a league and covenant. (6) Whether that league and covenant obliges us by open force to constrain them to extirpate prelacy, when they are not willing and do not consent to it. (7) Whether it be in our power to do it. And, (8) Whether it were lawful for us to do it if it were in our power; and whether ever our blessed Lord gave any such commandment to his followers by the power of the sword to reform nations, as it is said Mahomet gave to his followers, and Romish antichrist has too much practiced. Another heavy charge against the Church of Scotland, on which these people ground their schism and separation, is, that the breaches of these covenants, and other such sins of public defection, are not, or have not been, publicly acknowledged. But this is very uncharitable, for, 1690, there was a very full acknowledgment and enumeration of those sins, and of defection in the causes of the fast emitted by that Assembly… For breach of covenant is really among the causes of that fast [in 1706], seeing the act expressly requires ministers both to warn of and confess the national sins enumerated in causes of fast 1690, 1700, and 1701, in all which breach of covenant is very particularly acknowledged… And now, if that be a sufficient ground of separation from the Church of Scotland, I could appeal to all the Protestant Churches in Europe… Another charge against mhiisters, wherefore they are to be separated from, is because our civil rulers have only asserted as the ground of their re-establishing Presbytery, that it was more agreeable to the people’s inclinations, etc.; ergo [therefore], ministers must be disowned. But have any ministers ever asserted that this is the only ground; have they not, do they not plead its divine right? Yea, if I mistake not, even the Parliament, in one of the acts, have asserted its being agreeable to and founded upon the Word of God. But I am weary of these things, and therefore will not go furder, nor meddle with that which seems to be also a great prejudice against ministers, their subjecting to the Government and our present Queen, who is of the communion of the Church of England. But, would ever our worthy Reformers, of whom they so much boast, have refused subjection to King James the Sixth and his son King Charles [I], because of that communion? Would they not have been well satisfied, if they had but suffered the Church of Scotland to enjoy her privileges? But I must now forbear, and remember I am not writing an answer to that paper, nor do I design it… I had forgot to signify, that though the author of the Modest Reply greatly quarrels [with] our Church constitution, yet, from what appears through his discourse, there is too much ground to apprehend that the great eye-sore is the civil constitution, and hinc illae lacrymae [hence those tears]!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 39, ‘Vindication of the Church of Scotland in Answer to a Cameronian Pamphlet’</cite>, (1710) in The Correspondence of the Rev. Robert Wodrow, 3 vols. (Edinburgh: Wodrow Society, 1842), vol. 1, pp. 122-27</span></figcaption>

— Robert Wodrow, Letter 39, ‘Vindication of the Church of Scotland in Answer to a Cameronian Pamphlet’ (1710) in The Correspondence of the Rev. Robert Wodrow, 3 vols. (Edinburgh: Wodrow Society, 1842), vol. 1, pp. 122-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+greatest+charge%E2%80%A6+appears+%5Bto+be%5D+that+the+Church+of+Scotland+does+not+press+the+renewing+of+the+Covenants%2C+National+%5B1638%5D+and+Solemn+League+%5B1643%5D.+But+there+are+several+things+as+to+this+that+they+take+no+notice+of%2C+which%2C+if+noticed%2C+might%2C+in+a+great+measure%2C+allay+their+clamour%3A+%281%29+That+the+National+Covenant+is%2C+indeed%2C+a+confession+of+our+faith%2C+very+praiseworthy+in+its+time%2C+but+I+conceive%2C+for+variety+and+perspicuity%2C+not+to+be+compared+with+the+Westminster+Confession%2C+which+we+own+and+press.+%282%29+That+the+Westminster+Confession+is+ratified+in+King+William%E2%80%99s+Parliament%2C+and+the+other+%5Bthe+National+Covenant%5D+was+approven+%5Bimplicitly%2C+not+explicitly%5D+by+the+last+Parliament+of+King+Charles+the+Second+%5Bin+1681%5D%2C+where+I+think+%5BJames%5D+the+Duke+of+York+presided%2C+and+included+%5Bit%5D+in+the+bosom+of+the+Test+%5Bfor+civil+office%5D+as+a+point+thereof%3B+which+honour+I+believe+that+Parliament+would+not+have+given+to+the+Westminster+Confession.+%283%29+As+to+the+Solemn+League%2C+they+would+do+well+to+consider%2C+more+seriously%2C+what+that+answer+does+overly+take+notice+of%2C+p.+13%2C+near+the+beginning%2C+viz.+that+the+%5BGeneral%5D+Assembly+%5Bof+the+Church+of+Scotland%5D+appoints+its+being+subscribed+by+all+the+true+professors+of+the+Reformed+religion%2C+only+after+its+reception+and+approbation+in+the+kingdom+of+England.+But+they+should+have+considered+further%2C+that+the+Assembly%2C+for+aught+I+can+find%2C+by+their+act%2C+do+not+appoint+even+that+it+be+subscribed%2C+only+they+recommend+to+the+honorable+Convention+of+Estates%2C+that%2C+being+examined+and+approved+by+them%2C+it+may+be+sent+to+England%2C+to+be+received+and+approven+there%2C+that+after+that+it+may+be%2C+with+all+religious+solemnity%2C+sworn%2C+etc.+%284%29+They+would+consider+whether+it+be+practicable+to+get+England+to+consent+to+renew+that+Covenant%2C+and+if+it+be%2C+whether+they+themselves+will+undertake+to+gain+their+consent.+%285.%29+Whether+we+can+renew+it+without+their+consent%2C+and+whether%2C+in+that+case%2C+it+would+be+a+league+and+covenant.+%286%29+Whether+that+league+and+covenant+obliges+us+by+open+force+to+constrain+them+to+extirpate+prelacy%2C+when+they+are+not+willing+and+do+not+consent+to+it.+%287%29+Whether+it+be+in+our+power+to+do+it.+And%2C+%288%29+Whether+it+were+lawful+for+us+to+do+it+if+it+were+in+our+power%3B+and+whether+ever+our+blessed+Lord+gave+any+such+commandment+to+his+followers+by+the+power+of+the+sword+to+reform+nations%2C+as+it+is+said+Mahomet+gave+to+his+followers%2C+and+Romish+antichrist+has+too+much+practiced.+Another+heavy+charge+against+the+Church+of+Scotland%2C+on+which+these+people+ground+their+schism+and+separation%2C+is%2C+that+the+breaches+of+these+covenants%2C+and+other+such+sins+of+public+defection%2C+are+not%2C+or+have+not+been%2C+publicly+acknowledged.+But+this+is+very+uncharitable%2C+for%2C+1690%2C+there+was+a+very+full+acknowledgment+and+enumeration+of+those+sins%2C+and+of+defection+in+the+causes+of+the+fast+emitted+by+that+Assembly%E2%80%A6+For+breach+of+covenant+is+really+among+the+causes+of+that+fast+%5Bin+1706%5D%2C+seeing+the+act+expressly+requires+ministers+both+to+warn+of+and+confess+the+national+sins+enumerated+in+causes+of+fast+1690%2C+1700%2C+and+1701%2C+in+all+which+breach+of+covenant+is+very+particularly+acknowledged%E2%80%A6+And+now%2C+if+that+be+a+sufficient+ground+of+separation+from+the+Church+of+Scotland%2C+I+could+appeal+to+all+the+Protestant+Churches+in+Europe%E2%80%A6+Another+charge+against+mhiisters%2C+wherefore+they+are+to+be+separated+from%2C+is+because+our+civil+rulers+have+only+asserted+as+the+ground+of+their+re-establishing+Presbytery%2C+that+it+was+more+agreeable+to+the+people%E2%80%99s+inclinations%2C+etc.%3B+ergo+%5Btherefore%5D%2C+ministers+must+be+disowned.+But+have+any+ministers+ever+asserted+that+this+is+the+only+ground%3B+have+they+not%2C+do+they+not+plead+its+divine+right%3F+Yea%2C+if+I+mistake+not%2C+even+the+Parliament%2C+in+one+of+the+acts%2C+have+asserted+its+being+agreeable+to+and+founded+upon+the+Word+of+God.+But+I+am+weary+of+these+things%2C+and+therefore+will+not+go+furder%2C+nor+meddle+with+that+which+seems+to+be+also+a+great+prejudice+against+ministers%2C+their+subjecting+to+the+Government+and+our+present+Queen%2C+who+is+of+the+communion+of+the+Church+of+England.+But%2C+would+ever+our+worthy+Reformers%2C+of+whom+they+so+much+boast%2C+have+refused+subjection+to+King+James+the+Sixth+and+his+son+King+Charles+%5BI%5D%2C+because+of+that+communion%3F+Would+they+not+have+been+well+satisfied%2C+if+they+had+but+suffered+the+Church+of+Scotland+to+enjoy+her+privileges%3F+But+I+must+now+forbear%2C+and+remember+I+am+not+writing+an+answer+to+that+paper%2C+nor+do+I+design+it%E2%80%A6+I+had+forgot+to+signify%2C+that+though+the+author+of+the+Modest+Reply+greatly+quarrels+%5Bwith%5D+our+Church+constitution%2C+yet%2C+from+what+appears+through+his+discourse%2C+there+is+too+much+ground+to+apprehend+that+the+great+eye-sore+is+the+civil+constitution%2C+and+hinc+illae+lacrymae+%5Bhence+those+tears%5D%21%E2%80%9D%0A%0A%E2%80%94+Robert+Wodrow%2C+Letter+39%2C+%E2%80%98Vindication+of+the+Church+of+Scotland+in+Answer+to+a+Cameronian+Pamphlet%E2%80%99+%281710%29+in+The+Correspondence+of+the+Rev.+Robert+Wodrow%2C+3+vols.+%28Edinburgh%3A+Wodrow+Society%2C+1842%29%2C+vol.+1%2C+pp.+122-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b2b566a7a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b2b566a7a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=2.%20The%20greatest%20ch

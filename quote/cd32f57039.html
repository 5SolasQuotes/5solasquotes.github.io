<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are:

1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.]

2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.]

3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.]

4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.]

5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.]

361. I tell you their sense that I may the better open the plain truth to you, which is as follows:

1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man.

2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it.

3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675) | pt. 1, sect. 14, Of Several Distinctions of God’s Will, pp. 56-57</span></figcaption>

</figure><figure class="quote" id="q-ce882a2742" data-kw="">
<blockquote><p>And this much touching the wisdom of God. Now follows concerning his will. … 2. Again the will of God is either absolute or conditional. … The conditional will of God is that by which God wills certain things, with a condition adjoined thereunto. And this is called the will of sign, because God does declare and manifest the same, both in precepts and prohibition, and also in promises, and threatenings, as it were by signs. It is also called the antecedent [that which comes before] will, because it goes before the reward or the punishment, that is propounded in the promises, or in the threatenings. By this, God will have all men to be saved and to come to the acknowledgment of truth [1 Tim. 2:4]: to with, if they believe the promises and preaching of the Gospel, and also obey the same. And therefore He calls and invites all men of all sorts and degrees (and therefore magistrates also) to the fellowship of salvation, and to the confession of the truth: yet he commands all to work their own salvation, and to come to the acknowledging of his truth, though all do it not. 1 Tim. 2:4. By this will Christ would have gathered together the Israelites, as a hen does her chickens, Lk. 13:34 to wit, unless they that were called had refused to come. This will is manifested, not by our conjectures, but only out of his word. And it is the square of all our works, and the perfect rule of all righteousness and holiness. Neither is this will of God dissembled or counterfeit, as though God commanded many things, which he would not: for example, when Gen. 22, He commanded Abraham to offer his son, and yet afterwards forbade it. Whatsoever God commands that He wills. So He commanded that Abraham should offer up his son, to wit, in will, in mind, and in appointing him for a burnt offering, for so God tried his faith and readiness to obey his commandments, and not that Abraham should indeed kill and slay his son Isaac, though Abraham did so understand the word of offering: and this the Lord Himself does sufficiently declare when in verse 12. He says, ‘Now I know and have tried that thou fearest God, seeing that thou hast not spared or withheld thy son even thy only son from me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, (London, 1600), pp. 11-16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“And this much touching the wisdom of God. Now follows concerning his will. … 2. Again the will of God is either absolute or conditional. … The conditional will of God is that by which God wills certain things, with a condition adjoined thereunto. And this is called the will of sign, because God does declare and manifest the same, both in precepts and prohibition, and also in promises, and threatenings, as it were by signs. It is also called the antecedent [that which comes before] will, because it goes before the reward or the punishment, that is propounded in the promises, or in the threatenings. By this, God will have all men to be saved and to come to the acknowledgment of truth [1 Tim. 2:4]: to with, if they believe the promises and preaching of the Gospel, and also obey the same. And therefore He calls and invites all men of all sorts and degrees (and therefore magistrates also) to the fellowship of salvation, and to the confession of the truth: yet he commands all to work their own salvation, and to come to the acknowledging of his truth, though all do it not. 1 Tim. 2:4. By this will Christ would have gathered together the Israelites, as a hen does her chickens, Lk. 13:34 to wit, unless they that were called had refused to come. This will is manifested, not by our conjectures, but only out of his word. And it is the square of all our works, and the perfect rule of all righteousness and holiness. Neither is this will of God dissembled or counterfeit, as though God commanded many things, which he would not: for example, when Gen. 22, He commanded Abraham to offer his son, and yet afterwards forbade it. Whatsoever God commands that He wills. So He commanded that Abraham should offer up his son, to wit, in will, in mind, and in appointing him for a burnt offering, for so God tried his faith and readiness to obey his commandments, and not that Abraham should indeed kill and slay his son Isaac, though Abraham did so understand the word of offering: and this the Lord Himself does sufficiently declare when in verse 12. He says, ‘Now I know and have tried that thou fearest God, seeing that thou hast not spared or withheld thy son even thy only son from me.’”

<blockquote><p>We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.</p></blockquote>

<blockquote><p>He made the world, the world knows Him not; and yet He lets the world stand for all this. He has let the world continue almost six thousand years, notwithstanding all this ingratitude of the world.</p></blockquote>

<blockquote><p>the Chaldeans are daily refuted. How many things I remember being said by the Chaldeans to Pompey, how many to Crassus, how many to Caesar himself; that none of them would die except in old age, except at home, except with clarity, so that it seems very strange to me that anyone still exists who believes those whose predictions he sees refuted daily by fact and events”; yet all of these were taken away by a violent death, which is confirmed by the examples of Julian the Apostate, Ludovico Sforza, Prince of Milan, Edward VI, King of England, the son of Cardanus, and others, to whom things far different from what had been predicted happened. Hence 10 emperors, princes, and lawgivers have forbidden this art of divining from the stars, and wise men and the fathers have disapproved of it. Maecenas, in Dio, bk. 52, Oration to Augustus, said that “diviners should not be tolerated in a republic.” Augustus expelled the astrologers from the city, Tiberius and Claudius from Italy; Vitellius also severely judged that they should be deprived of the world and of life. See Code, bk. 9, Tit. 18; bk. 2, 5, 7, and Tacitus, bk. 2, Annals, ch. 32, in whose judgment, “mathematicians are a race of men untrustworthy to the powerful, deceitful to the hopeful: which in our state will always be both forbidden and retained.” Cf. Valerius Maximus, bk. 1, ch. 3; Curtius, bk. 4, ch. 10; bk. 7, ch. 7. If an event has corresponded to some predictions, this should be attributed either to the shrewdness of the diviners, who had knowledge of the morals, counsels, and studies of those consulting them; or to the credulity of those consulting, who have turned fortuitous chances into the fulfillment of the thing predicted; or to the work of the devil, from whose suggestion or inspiration such prophets can draw many things; or to the just judgment of God, who chastises the vain minds of men with those mockeries, and permits the superstition of men to feel the scourge of Satan.</p></blockquo <blockquote><p>In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

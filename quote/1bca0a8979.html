<main class="wrap"><figure class="quote" id="q-1bca0a8979" data-kw="">
<blockquote><p>That faith, so far as it respects Divine truths, is of four sorts. 1st, An historical faith is mentioned in Scripture. This faith, is a bare assent of the mind, to the truth of what is revealed in the word of God; while the man who thus believes, does neither love, nor regard, nor apply to himself, the truths therein revealed.

He may have clear speculative notions of all the doctrines of Scripture, and be able to illustrate and defend them, in an unexceptionable manner; and yet, all this knowledge leaves his heart without the smallest suitable impression, either of the truth, or importance, or design of them.

His study of them, is only the exercise of natural reason, and is in order to gratify his curiosity, and to increase his degree of knowledge. In this historical faith of Divine truths, there may be a firmer assent, than is commonly given to the truth of any human history; which may be a reason, why many mistake it for a saving assent. Such a faith as that may be found in wicked men, and even in devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of Saving Faith from the Sacred Records</cite>, (Edinburgh: Thomsons, Brothers, 1824), pp 6-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith.html">Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c23310058e" data-kw="">
<blockquote><p>The next thing necessary is, that what the mind has imbibed be transferred into the heart. The word is not received in faith when it merely flutters in the brain, but when it has taken deep root in the heart, and become an invincible bulwark to withstand and repel all the assaults of temptation. But if the illumination of the Spirit is the true source of understanding in the intellect, much more manifest is his agency in the confirmation of the heart; inasmuch as there is more distrust in the heart than blindness in the mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.36</span></figcaption>

</figure><figure class="quote" id="q-e89ef892fe" data-kw="">
<blockquote><p>We will Enquire, First, What is the Believing, that will secure Salvation?

And that Enquiry shall be thus Answered. It is a Looking to, and Trusting in, the Lord Jesus Christ, for Salvation. Faith cannot be better described, than in that Call to Faith which our Lord has given us, Isa. 45.22. Look unto me, &amp; be ye Saved. A man must see himself plunged into doleful circumstances of Sinfulness &amp; Wretchedness, by his Fall from God, &amp; see himself unable to help himself out of those doleful circumstances. A man must see God manifest in Flesh, and the Son of God become Incarnate, in our Lord Jesus Christ, and the Lord Jesus Christ become the only Mediator between God and man.

A man must see the Lord Jesus Christ making Satisfaction for the Sins of His Chosen by His Obedience to the Death, and now Ever living to make Intercession for us, and able to Save unto the uttermost all that come to God by Him. A Sight of these things, &amp; a Flight unto the Lord Jesus Christ upon what we see, This is Faith. Faith is an Addressing to, &amp; a Depending on the Lord Jesus Christ, as the only One, that shall Recover us to Everlasting Happiness. Faith is a Repairing to the Lord Jesus Christ for Salvation. It saith, Psal. 116.4. I beseech thee, O Lord, to deliver my Soul. And Faith is a Relying on the Lord Jesus Christ for Salvation. It saith, Psal 62.5, 6. My Soul, wait thou only upon God, for my Expectation is from Him, He only is my Salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace triumphant. Or, A notable example of a great sinner, becoming a great saint. Improved for the direction and encouragement, of them that have sinned exceedingly, to seek salvation from all their sins</cite>, (Boston: T. Green, 1700), pp 19-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith.html">Faith</a></span></div>

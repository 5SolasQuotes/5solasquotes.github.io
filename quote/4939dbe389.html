<main class="wrap"><figure class="quote" id="q-4939dbe389" data-kw="">
<blockquote><p>Every art has its basic ingredients. Grammar has the alphabet. Geometry has a few simple illustrations. These basics are important to know, but they are not the whole story. Likewise the elements of the world are not the finished product, but only those things out of which the rest are put together. Similarly, righteousness has its basic elements, its own alphabet. This elementary ABC level of righteousness has its place, in the law of Moses.

But perfect righteousness is that which is found in Christ by faith. When Christ is known by faith, relapsing into a search for righteousness by observing the feasts of the law is nothing other than if someone who was a most learned professor and master of arts should lapse back into learning the alphabet. Who would not be astonished at such stupidity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio Epistolae Pauli ad Galatas</cite>, (Frankfurt, 1546). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 145.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

But perfect righteousness is that which is found in Christ by faith. When Christ is known by faith, relapsing into a search for righteousness by observing the feasts of the law is nothing other than if someone who was a most learned professor and master of arts should lapse back into learning the alphabet. Who would not be astonished at such stupidity?”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, pp. 566-67</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4d7b72c231" data-kw="">
<blockquote><p>But the church of God is in God the Father, and in the Lord Jesus Christ; it is the company of the faithful, whom God hath gathered together in Christ by his word and by the Holy Ghost, to honour him, as he himself hath appointed. This church heareth the voice of the Shepherd; it will not follow a stranger, but flieth from him; for it knoweth not the voice of strangers. Of this church St. Jerome saith, “The church of Christ, which containeth the churches through all the world, is joined together in the unity of the spirit, and hath the cities of the law, of the Prophets, of the Gospel, and of the Apostles. This church goeth not forth, or beyond her bounds, that is, the holy Scriptures.”

It is the pillar of the truth, the body, the fulness, and the spouse of Christ; it is the vine, the house, the city, and the kingdom of God; they which dwell in it, are no more strangers and foreigners, but citizens with the saints, and of the household of God, and are built upon the foundation of the Apostles and Prophets; Jesus Christ himself being the head corner-stone, in whom all the building coupled together, groweth into an holy temple in the Lord. This church Christ loved, and gave himself for it, that he might sanctify it, and cleanse it by the washing of water through the word; that he might make it unto himself a glorious church, not having spot or wrinkle, or any such thing, but that it should be holy, and without blame. (Eph. v.)

Such a church was the church of God at Thessalonica; such a church are they, whosoever in any place of the world fear the Lord, and call upon his name; their names are written in the book of life; they have received the spirit of adoption, by which they cry Abba, Father; they grow from grace to grace, and abound more and more in knowledge and in judgment; they cast away the works of darkness, and put on the armour of light; they are made absolute and perfect unto all good works; they are evermore comforted in the mercies of God, both by the holy Scriptures, wherein God declareth his gracious goodness towards them, and by the sacraments, which are left unto the church to be witnesses and assured pledges for performance of the promises of God’s good will and favour towards them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 10-11.</span></figcaption>

<blockquote><p>For the persons and duties of men may be accepted with God, when they walk and act in sincerity according to their light, though in many things, and those of no small importance, sundry irregularities are found, both in what they do, and in the manner of doing it. Where persons walk before God in their integrity, and practice nothing contrary to their light and conviction in his worship, God is merciful unto them, although they order not everything according to the rule and measure of the Word. So was it with them who came to the Passover in the days of Hezekiah: they had not cleansed themselves, but did eat the Passover otherwise than it was written, 2 Chron. 30:18; for whom the good king made the solemn prayer suited to their occasion: ‘The good Lord pardon every one that prepareth his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary; and the Lord hearkened unto Hezekiah and healed the people,’ vv. 18-20. Here was a duty for the substance of it appointed of God, but in the manner of its performance there was a failure: they did it not according to what was written, which is the sole rule of all religious duties. This God was displeased withal, yet graciously passed by the offence, and accepted them whose hearts were upright in what they did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms</cite>, (London: 1682), ch. 11, pp. 232-33</span></figcaption>

<blockquote><p>At the Reformation of religion, some learned and godly men were of opinion that in detestation of the Popish superstition which had overspread and soiled all the worship of God, the best way was to as far from the Church of Rome as possibly might be: Others, no less learned and godly than they thought it better to depart no further from the Romish Church than she had departed from the right way, partly that they that would might step over from them to us the more easily; partly that our departure from them might appear to be made rather of necessity than of choice, and not for things which might be tolerated, but for things intolerable. Both aimed at one mark, but did not shoot after one compass; and the wiser sort and more pious pleased themselves and were not displeased with others in this difference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-burges.html">John Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer Rejoined to that much Applauded Pamphlet of a Nameless Author, bearing this Title</cite>, … (London, Matthewes, 1631), Preface, p. 2</span></figcaption>

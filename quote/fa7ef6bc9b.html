<main class="wrap"><figure class="quote" id="q-fa7ef6bc9b" data-kw="">
<blockquote><p>The law, with all its [requirements about] individual virtues and vices, even in the smallest cases of conscience, remains in force (at least the life of the church and of mankind requires such decisions), and therefore [the law] must be explained according to the teaching of God’s word by professors, and by ministers of the word in sermons and in catechetical instruction, unless they want to be least in the kingdom of heaven (Mt. 5:19). … This explanation of the law is the most important element of practical theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectae Disputationes Theologicae</cite>, (1648-69) in Reformed Dogmatics, ed. and trans. John W. Beardslee III, A Library of Protestant Thought (New York: Oxford University Press, 1965), p. 274.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gen. 13:9-11</cite></span></figcaption>

</figure><figure class="quote" id="q-46ea3c98db" data-kw="">
<blockquote><p>3. Magistrates as magistrates hold forth in their Law abstinence from these sins [of adultery, incest, murder, etc.], not as the ambassadors of Christ, craving subjection of conscience and divine faith to those charges, but only external obedience: For though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience, nor is he in Christ’s stead to lay divine bands on the conscience to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order and as the Creator, and Founder, and another of human societies and of peace, to exact external obedience and to lay bands on your hands, not to shed innocent blood, and on your body not to defile it with adultery or incest, nor to violate the chastity of your brother; Hence it is evident that the adversaries are far out who would have ministers who do hold forth commands that lay hold on the conscience and crave faith and soul-submission under the pain of eternal wrath, to do and act as the deputies and vicars of those who have nothing to do with the conscience [such as prelates who simultaneously held civil offices], and have neither office nor authority to crave soul submission or to threaten or inflict any punishment but such as is circumscribed within the limits of time and which the body of clay is capable of; yea, when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), pp. 550-51</span></figcaption>

<blockquote><p>Thirdly, that Prophesy, 2 Pet. 2:18, ‘They allure by the lusts of the flesh, through much wantonness,’ etc. is fulfilled in the Papacy, which permits pubic stews, I might say, allows, because who keep those houses, do therefore pay a pension to the Pope.</p></blockquote>

</figure><figure class="quote" id="q-7b8baa4b2c" data-kw="">
<blockquote><p>Our gracious prince, who now by the blessing of God happily reigns over us, will not (we assure ourselves) be offended at us for having regard to our consciences [though it goes against his command], God’s own deputies placed in our souls, so far, that for all the world we dare not hazard their peace and quiet by doing anything with their repugnance and aversation;</p></blockquote>

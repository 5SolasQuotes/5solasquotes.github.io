<blockquote><p>When there have been determinations against the common uncorrupted senses of mankind, as that what their sight, and touch, and taste assures them is Bread, is said to be the flesh of an human body.

For if you cannot be sure of what both your own, and the sound senses of any other man would tell you, you can be sure of nothing at all: You cannot be sure you see one another, or hear me speaking to you; nor be sure when you heard the transforming words, This is my Body; or much less that they were ever spoken, if you heard them not; or that that was Bread and not a Stone, or a piece of Clay that is pretended to be transubstantiated by them.

The foundation of all certainty were upon these terms taken away from among men on Earth; and upon the same common grounds upon which it is pretended you ought to believe that which is shewn or offered you to be the flesh of a man, and not bread any longer, you must believe or judge the quite contrary, that it is bread still, and not flesh, and consequently that he [the Pope] is far from being infallible, but doth actually err, upon whose authority you are directed to believe otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two sermons preached at Thurlow in Suffolk on those words, Rom. 6.13 “Yield your selves to God”</cite>, (London: Tho. Parkhurst, 1688), pp 18-19.</span></figcaption>

ormed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8c9cafa19" data-kw="">
<blockquote><p>Let me exhort you to a conscionable use of Ordinances. Be more frequent in hearing, in praying, in receiving, &amp;c.— I might say something to this last, viz. Receiving, The Apostle tells us, 1 Cor. 11.26. As often as we eat this bread, we shew forth the Lord’s death; it implies a frequent use of the Ordinance, more then once or twice a year, or once a quarter. Indeed the opportunities might be more frequent, if it were not for the coldness and deadness of our hearts.

In the Primitive times of the Church, while the blood of Christ was warm, they had the Sacrament every day; we have an uncontradicted authority, that they had it every Lord’s day. And as men grew colder, so the distances grew greater. Sure, were it not for the coldness and deadness of our hearts, it might almost be our daily bread; at least we might enjoy a more frequent use of this Ordinance then we do: but as the Apostle saith, as oft as you have opportunity do good: so as oft as you have the opportunity, take the occasions to meet God in his Ordinances.</p></blockquote>

</figure><figure class="quote" id="q-f213479f08" data-kw="">
<blockquote><p>But for Christians, I advise you, in reading the prophets and apostles concerning Christ and his sufferings, to make use of this as a key to open up all, as a light that enlightens all — That all the sufferings of Christ were laid on him, and endured by him, and presented unto God, as he did represent his guilty people; otherwise justice could not exact on him, nor his people be saved by them. See how Christ expresseth this in the celebration and institution of his last supper. He taketh, blesseth, breaketh, and giveth bread, and calls it, my body given for you. Likewise also the cup after supper, saying, “This cup is the new testament in my blood, which is shed for you,” Luke xxii. 19, 20.

I do not mind the antichristian synagogue, (for a church it is not, but in an usurped name, or in a vain notion,) who have abused and perverted these plain and easy words, more than devils or men did ever pervert any words of God or man before; and have, upon that abuse of them, set up the grossest idol that ever a heathen worshipped; for such as worship sun, and moon, and the host of heaven, have God’s glorious workmanship before their eyes; yea, the Egyptians’ garden and herb gods are preferable greatly to a bit of paste, kneaded and baked by a baker in his oven, conjured into a pitiful godhead by the mumbling of a priest, and first worshipped, and then swallowed down as other food, by the besotted people. Nothing less than the dreadful wrath of God can be in men’s believing this lie, that the man’s reason and all his senses militate against, 2 Thess. ii. 10—12.

But many that are not infected with this strong delusion, understand no more by Christ’s words in this sacred ordinance, than that the bread and wine, so used as Christ appointed, do signify the sufferings unto death of our Lord Jesus Christ, cruelly handled by wicked men, and severely dealt with by the justice of God; but the cause and end of his death, they mind not. This Christ puts us in mind of, in these words: “For you, and for your sins, and for the remission of them; you, and your sins, are the cause of my death: and my death is the cause of your forgiveness.” Christians, if you keep out that word, for you; if your faith do not echo to Christ’s for you, with your for me, I assure you, that the bread and wine on the Lord’s table, and the same food on your own table, will be of equal signification, as to soul-nourishment; and that is, none at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sixteen Sermons on the Lord’s Prayer, in John xvii. 24</cite>, (1705) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 2: 227-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>In his Sacred Supper he bids me take, eat, and drink his body and blood under the symbols of bread and wine. I do not doubt that he himself truly presents them, and that I receive them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles, vol. 1, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 4.17.10.</span></figcaption>

<blockquote><p>…other children of the same condition who have been baptized and obtained eternal life… Although unbaptized children are separated from God as regards the union of glory…” (Summa, app. 2, art. 2) Voet: “Whether all infants without baptism withdraw to the resurrection of the damned? It is denied contra the Papists.” (Syllabus, sect. 2, tract 6, title 3, subtitle 3, ‘Of the Resurection’, ‘Of the Subject &amp; Object’) . Not Absolutely Tied to a Certain Form of Words Gillespie affirms Thomas (Summa, pt. 3, q. 60, art. 8) holding “that the consecration of a sacrament is not absolutely tied to a certain form of words.” (English-Popish, pt. 4, ch. 7, p. 34) Voet: “Whether the form of baptism consists in precisely that form of words, ‘I baptize you in the name of the Father, etc.’? It is denied.</p></blockquote>

</figure><figure class="quote" id="q-47d596d2bb" data-kw="">
<blockquote><p>Medieval theology received from the church fathers a great body of highly detailed doctrine, but virtually nothing that could be called a system [of] theology and, certainly, no theological prolegomena. The received body of patristic teaching was clarified and systematized… to the point that, toward the close of the twelfth century… [they] were able to draw doctrine together into collections of theological statements and definitions, the sententiae.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, Ch. 2, sections 1-2, pp. 85-96 of Post-Reformation Reformed Dogmatics, vol. 1, 2nd ed. (Baker, 2003), p. 85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-d662f50fd5" data-kw="">
<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 6, pp. 45-56</span></figcaption>

</figure><figure class="quote" id="q-69092f7def" data-kw="">
<blockquote><p>Man is a personal body created in God’s image. The Bible makes quite clear that man’s hope is in resurrection of the body, not release from the body (John 2:19-22; Lk. 24:40; Rom. 8:23; 1 Cor; 15:3-4, 44, 48-49; 2 Cor. 5:1-5; Isa. 26:19; 66:22-23; Dan. 12:2). Moreover, it is embodied existence which is the criterion of future judgment (2 Cor. 5:10; Heb. 9:27). We may not know all the answers with respect to the intermediate state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/greg-bahnsen.html">Greg Bahnsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Mind / Body Problem in Biblical Perspective’</cite>, (Covenant Media Foundation, 1972) 10 pp. | Yet Bahnsen is seriously weak on death and the intermediate state (if his view can even adequately explain these things, which it is not clear it can):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

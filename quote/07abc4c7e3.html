<main class="wrap"><figure class="quote" id="q-07abc4c7e3" data-kw="">
<blockquote><p>XXII. …it [the Apostles’ Creed] cannot be an exact mark of fundamental articles because it treats only of theoretical articles relating to faith, not of practical articles relating to worship… …that the Symbol [Creed] is not to be considered only with regard to the words, but as to the sense (because, as Hilary says, ‘The Scriptures do not consist in the reading but in the understanding,’ Ad Constantium Augustum, II,9 [PL 10.570]; and ‘fundamentals are not found in the words but in the sense,’ as Jerome says). Therefore although heretics may say that they receive the Symbol, yet they do not because they reject its true and genuine sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, question 14, ‘Are some theological topics fundamental, others not; and how can they be mutually distinguished?’ in Institutes of Elenctic Theology, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1992), vol. 1, 1st Topic, pp. 48-55, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXII. …it [the Apostles’ Creed] cannot be an exact mark of fundamental articles because it treats only of theoretical articles relating to faith, not of practical articles relating to worship… …that the Symbol [Creed] is not to be considered only with regard to the words, but as to the sense (because, as Hilary says, ‘The Scriptures do not consist in the reading but in the understanding,’ Ad Constantium Augustum, II,9 [PL 10.570]; and ‘fundamentals are not found in the words but in the sense,’ as Jerome says). Therefore although heretics may say that they receive the Symbol, yet they do not because they reject its true and genuine sense.”

enuine%20sense" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-188d83d849" data-kw="">
<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors Toleration, Erastianism</cite>, … (d. 1667; Edinburgh: 1692), ‘Sermon preached before the synod at Glasgow, 1653’, pp. 246-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.”

</figure><figure class="quote" id="q-5e364a1344" data-kw="">
<blockquote><p>2. Such a Baptism that is valid, as touching the substance of the seal, as is in Rome: such a Church according to the metaphysic entity and being of a Church, is Rome a Ministerial Church, teaching necessary fundamentals, though darkening and contradicting all; but it is not morally a true Church, but leprous and unclean. See what Junius, Whitaker, Calvin and Rivetus say hereupon…</p></blockquote>

<blockquote><p>4. This turning the grace of God into lasciviousness argues the grossest folly; it is a forsaking of our own mercy, a receiving the grace of God in vain. What is, if this be not to neglect great salvation; to be prodigal of blessedness; to ravel out and to wanton away the offers of Christ Himself? Who would not heartily chide himself that by toying, trifling, or unnecessary lingering in the way to the exchange, misses of a bargain by which he might have gained a thousand pounds?… 4. Grace turned into lasciviousness is the top of all ingratitude. What greater unkindness than to be evil because God is good?… To be lascivious because God is gracious is to fight against God with his own weapons, to wound God with that arm which He has cured (Hos. 7:15), to kill and crucify Him who has freed us from death: In a word, to make that a pillow for presumption which God appointed for an antidote against despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, … (London: Maxey, 1652), on v. 4, pp. 333-34</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-574b527461" data-kw="">
<blockquote><p>As God may by metaphor be said to will what by His will, properly speaking, He wills not; so He may by metaphor be said to will what He does will, properly speaking. Hence there is nothing to prevent the same thing being the object of the will of good pleasure and of the will of expression [sign]. But operation is always the same as the will of good pleasure; while precept and counsel are not; both because the former regards the present, and the two latter the future; and because the former is of itself the effect of the will; the latter its effect as fulfilled by means of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, q. 19, art. 12, reply to obj. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>God’s call sometimes is ineffectual, and sometimes effectual. So the same apostle plainly declares in 1 Thess. 2:13: “For this cause also thank we God, which effectually works also in you that believe.” Observe that it is the work of God’s Spirit in the heart, superadded to the Word of the Gospel, as spoken by men, that makes any call effectual. Without this inward work, God may call, and the soul will never answer… It is this effectual work of God’s Spirit, in regenerating the soul by infusing of habits of grace, which distinguishes an internal effectual call of God form a mere external and ineffectual one… The text makes sure that it might be known whether or not God has so called you by His Word, as that also He has worked in you by His Spirit; whether God has illuminated your understanding, and inclined your will, so that you have complied with God’s will, and have answered His call. Whether, when God drew you, you ran after Him (Cant. 1:4); whether, when God entreated and persuaded you to be reconciled to Him you consented (2 Cor. 5:20); whether, when He wooed you, He also won you; whether, when He invited you to the wedding supper of His Son, you made no excuse or delay, but accepted, and welcomed the offer of the Gospel with faith and love (Luke 14:18). All which if you did do, it arose from the power of an inward call, being superadded to the outward call of the Word…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-fairclough.html">Richard Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Puritan Sermons</cite>, vol. 6, ‘The Papal Doctrine In Denying The Possibility Of Assurance Is False, And Has A Dangerous Tendency To Destroy The True Place And Comfort Of Souls In The Certain Hopes Of Everlasting Happiness. – 2 Peter 1:10’, p. 377-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

enying+The+Possibility+Of+Assurance+Is+False%2C+And+Has+A+Dangerous+Tendency+To+Destroy+The+True+Place+And+Comfort+Of+Souls+In+The+Certain+Hopes+Of+Everlasting+Happiness.+%E2%80%93+2+Peter+1%3A10%E2%80%99%2C+p.+377-78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6255e86111.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6255e86111.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=God%E2%80%99s%20call%20sometimes%20is%20ineffectual%2C%20and,the%20outward%20call%20of%20the%20Word&amp;text=God%E2%80%99s%20call%20sometimes%20is%20ineffectual%2C%20and%20sometimes%20effectual&amp;text=superadded%20to%20the%20outward%20call%20of%20the%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b26fb3dc36" data-kw="">
<blockquote><p>From this, these things we posit, saying: 1. God seriously wills, that is, He loves, approves and by an act of complacency He lifts up for the obedience of reprobates, insofar as it is a good and holy thing, whether the obedience may come forth by the act, or not… … 5. For God to intend and decree the death of a sinner, and for God not to delight in the death of a sinner, as He swears in Eze. 33:11, are in no way contradictions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercise 2, ‘Of Notions of the Divine Will’</cite>, ch. 1, ‘Of God’s Revealed Will [Signi] and His Will of Good-pleasure’ in Apologetic Exercises for Divine Grace (Amsterdam, 1636; 1651), pp. 213-238, p. 232-233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

— Samuel Rutherford, Exercise 2, ‘Of Notions of the Divine Will’, ch. 1, ‘Of God’s Revealed Will [Signi] and His Will of Good-pleasure’ in Apologetic Exercises for Divine Grace (Amsterdam, 1636; 1651), pp. 213-238, p. 232-233">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+this%2C+these+things+we+posit%2C+saying%3A+1.+God+seriously+wills%2C+that+is%2C+He+loves%2C+approves+and+by+an+act+of+complacency+He+lifts+up+for+the+obedience+of+reprobates%2C+insofar+as+it+is+a+good+and+holy+thing%2C+whether+the+obedience+may+come+forth+by+the+act%2C+or+not%E2%80%A6+%E2%80%A6+5.+For+God+to+intend+and+decree+the+death+of+a+sinner%2C+and+for+God+not+to+delight+in+the+death+of+a+sinner%2C+as+He+swears+in+Eze.+33%3A11%2C+are+in+no+way+contradictions.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Exercise+2%2C+%E2%80%98Of+Notions+of+the+Divine+Will%E2%80%99%2C+ch.+1%2C+%E2%80%98Of+God%E2%80%99s+Revealed+Will+%5BSigni%5D+and+His+Will+of+Good-pleasure%E2%80%99+in+Apologetic+Exercises+for+Divine+Grace+%28Amsterdam%2C+1636%3B+1651%29%2C+pp.+213-238%2C+p.+232-233&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb26fb3dc36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b26fb3dc36.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=From%20this%2C%20these%20things%20we%20posit,33%3A11%2C%20are%20in%20no%20way%20contradictions&amp;text=From%20this%2C%20these%20things%20we%20posit%2C%20saying%3A%201&amp;text=in%20Eze.%2033%3A11%2C%20are%20in%20no%20way%20contradictions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e33d02e0fa" data-kw="">
<blockquote><p>For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind</cite>, ... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 398-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end [such as salvation in the gospel call] is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].”

— John Davenant, Animadversions upon a Treatise entitled, God’s Love to Mankind... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 398-99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+God+properly+intends+no+end+of+his+volitions+or+actions+but+Himself%2C+unto+whose+glory+all+things+have+naturam+mediorum+%5Bthe+nature+of+means%5D%2C+not+intenti+finis+%5Bthe+intention+of+an+end%5D.+The+intention+therefore+of+means+by+God+unto+any+lower+or+inferior+end+%5Bsuch+as+salvation+in+the+gospel+call%5D+is+nothing+else+but+the+fitness+of+such+means+considered+in+themselves+%28and+not+abused%29+for+the+producing+of+that+end%3A+And+this+intention+is+not+altered+by+the+decree+of+reprobation%3B+for+that+decree+as+it+is+immanent+and+eternal+in+voluntate+divina%2C+nihil+ponit+in+reprobato+%5Bin+the+divine+will%2C+puts+nothing+in+the+reprobate%5D%3A+And+when+the+temporal+execution+comes%2C+it+puts+no+malice+into+his+will%3B+it+puts+no+necessitation+unto+wicked+actions+upon+his+will%3B+it+only+puts+in+God+an+absolute+will+of+not-giving+effectual+grace%2C+and+of+not-working+in+him+salutiferous+actions%2C+whereupon+follows+perditio+tua+exte+%5Byour+destruction+is+out+of+yourself%2C+Hos.+13%3A9%5D.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Animadversions+upon+a+Treatise+entitled%2C+God%E2%80%99s+Love+to+Mankind...+%28Cambridge%3A+Daniel%2C+1641%29%2C+%E2%80%98Answer%3A+Whether+the+decree+of+absolute+Reprobation+is+contrary+unto+the+use+and+end+of+God%E2%80%99s+gifts+bestowed+upon+men%2C%E2%80%99%2C+pp.+398-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe33d02e0fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e33d02e0fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-will-of-god/#:~:text=For%20God%20properly%20intends%20no%20end,is%20out%20of%20yourself%2C%20Hos.%2013%3A9&amp;text=For%20God%20properly%20intends%20no%20end%20of%20his&amp;text=your%20destruction%20is%20out%20of%20yourself%2C%20Hos.%2013%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

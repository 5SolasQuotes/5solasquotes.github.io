<blockquote><p>In George Smeaton’s preface to the 1871 edition of the elder Thomas McCrie’s classic defence of the establishment principle, Statement of the Difference the Free Church theologian explained the circumstances that had given rise to the publication of McCrie’s book:

THE celebrated Statement of the late Dr M’Crie, of which a reprint in full is here presented to the public, was drawn up with the express design of exhibiting the difference between the profession of the Reformed Church of Scotland and the theory of Voluntaryism. The latter term, indeed, was not yet in common use. The question discussed, however, was precisely the same. It was not the question as in former times: with what restrictions and with what regard to the church’s intrinsic freedom may magistrates competently exercise their power about religion? It was the absolute question: is any power whatever competent to the Christian Civil ruler in seeking to further the cause of Christ?

Dr M’Crie’s work discusses this point, and possesses the following peculiarities:— It is a masterly defence of the principle of Establishments as a scripture truth; and the most complete vindication ever given to the world of the position occupied by the Reformed Church of Scotland on the whole subject of national religion, and of the magistrate’s legitimate power in promoting it.

The occasion which called forth the treatise, was as follows. A change had been introduced into the testimony of the church of which Dr M’Crie was a minister, on the question of the Civil Ruler’s authority and duty in reference to religion. About the same period, that is, during the last decennium of the previous century, the leaven of Voluntaryism, or, the theory that it is not competent to the Christian ruler to exercise his authority and influence in behalf of religion in any form, — began to work within the pale both of the Burgher and Antiburgher sections of the Secession Church. To the latter only, as the Denomination to which Dr M’Crie belonged, do we deem it necessary to refer in this place.

In the Antiburgher Synod, or General Associate Synod, as it was termed, a motion was made in 1795 to take steps for preparing or compiling a new Historical and Doctrinal Testimony for the use of the Denomination. Various reasons prompted this proposal. It was deemed fitting to simplify the document heretofore used as a testimony; to put together in a readable form what had been said in several publications on their distinctive principles; and to bring down the testimony to the time then present. But above all it was thought desirable as the event too plainly proved, to find expression for the new opinions already widely diffused on the subject of the magistrate’s power in reference to religion; in other words, to make room for the Voluntary Theory.

For some years, the people were kept on the tip-toe of expectation for the new Display of the Secession Testimony, which was to supersede that previously in use, and to prove a great improvement upon it. When at length it appeared, after nine years spent in its preparation, it was found to say and unsay; some passages doing homage to the past attainments of the Reformed Church of Scotland, while others were all too plainly at variance with the previously recognised doctrine of the Secession Church, in reference to the lawfulness of the connection between church and state.

But, as is not unusual in such cases, the extent of the alteration was sought to be concealed. A radical change, or rather a revolution, had been made in the constitution of this section of the Secession Church. But the change was not for a time openly avowed. The Synod, abandoning the principles and position of the Secession Church, though still retaining the name, had, in fact become a Dissenting Denomination. It had broken with the Historic Church of Scotland. The connection was dissolved.

There was a certain mis-statement, therefore, in asserting that they continued, as Heretofore, to bear testimony to the doctrine, worship, discipline, and government of the Reformed Church of Scotland, (p. 15.) The Confession, received in 1647 with one explanation, was now received with many limitations, under colour of carrying out the course of action then initiated. They declared their liberty of signifying their adherence to it with the same or similar limitations, (p. 12.) The section, in particular, which described what was competent to the civil magistrate, was evacuated of its import under the plea that it taught compulsory measures in religion. It was perverted, too, from its proper meaning, as if it might be accepted in the sense of referring to the magistrate in his private capacity, (p. 198.)

Furthermore, the scheme of separating the narrative and doctrinal part of the new Testimony from each other; — that is, by binding the members of the church solely to the latter, — men’s minds were gradually led away from the facts, in support of which the Secession testimony had at first been raised. In short, the Historic basis was to a large extent removed. We frankly acknowledge that in the exhibition of doctrine, there is much precious statement of central truth, worthy of the best times of the Secession Church. But it cannot be denied that wherever reference is made, directly or indirectly, to the misleading negation of Voluntaryism, we encounter one-sided statements, vacillation, and defective exposition.

The Synod, on the 1st of May 1804, approved the testimony, and enacted that henceforth, for all who entered the denomination, it should be held as the bond or term of ministerial and Christian communion. Then followed, on the part of a small but influential minority, a determined opposition. Only six ministers refused to acquiesce in the change made on the constitution of the church. But their piety and ability, as well as their literary eminence, gave weight to the cause they represented.

Two of the number, Messrs Whytock of Dalkeith and Hog of Kelso, were soon removed from the scene of conflict, by death. The four who remained — Rev. Prof. Bruce of Whitburn, Rev. Mr Aitken of Kirriemuir, Rev. Mr Chalmers of Haddington, and Dr M’Crie — maintained the old testimony in all its integrity. But they suffered deposition at the hand of the majority.

Their testimony, however, was not to be suppressed. Forming themselves into a Presbytery, under the designation of the Constitutional Presbytery, they rendered the most important service to the entire Presbyterian church by their clear and scriptural testimony to national Christianity.</p></blockquote>

<blockquote><p>Many facile thinkers believe that because the establishment principle has been abused, the doctrine must be discarded. As the Seceder William MacKray points out, this is vain reasoning. Virtually anything can be abused by sinners for corrupt ends – even Christianity itself. Yet we do not reject Christianity just because some evil men have abused it to satisfy their selfish desires. Unlike many today, the Covenanters understood the distinction between the abuse and the proper use of a biblical principle:

They were persecuted by the State; but they did not therefore adopt the notion that the State has nothing to do with religion. They were persecuted by a church established by law; but they did not, therefore, adopt the opinion, that establishments must necessarily persecute, and that, of course, all establishments are unjust. They exercised a spirit of sound discrimination. They distinguished a good and scriptural institution from its perversion and abuse.</p></blockquote>

</figure><figure class="quote" id="q-810bf8d936" data-kw="">
<blockquote><p>But we read not” (says Erastus) “where Christ has changed those laws in the New Testament.” It is true, Christ has not said in particular: “I abolish the debarring of the leper seven days, and he that is thus and thus unclean shall be separated till the evening;” nor has He said particularly of every carnal ordinance and judicial law: “it is abolished.” But we conceive the whole bulk of the Judicial Law, as judicial, and as it concerned the republic of the Jews only, is abolished, though the moral equity of all those be not abolished… … But sure Erastus errs who will have all such to be killed by the magistrate under the New Testament because they were killed by him in the Old: Why, but then the whole judicial law of God shall oblige us Christians as Carolostadius and others teach? I humbly conceive that the putting of some to death in the Old Testament, as it was a punishment to them [the malefactors], so was it a mysterious teaching of us how God hated such and such sins; and mysteries of that kind are gone with other shadows.</p></blockquote>

<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>HT</cite></span></figcaption>

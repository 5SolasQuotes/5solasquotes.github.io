<blockquote><p>Question 11. What duties are done by the people? … (4.) Saying “amen” audibly to the blessing. … As for an audible pronouncing of “amen,” if the minds of them that pronounce it have been upon that which the minister uttered, and their hearts have given consent thereto, it comprises altogether as much as the minister has uttered. This is the only warrantable means for people to utter their minds in a congregation. It must, therefore, be uttered by everyone, altogether, so loud, as the minister may hear their consent, as well as they hear what he has uttered in their name. For the one is as requisite as the other.</p></blockquote>

</figure><figure class="quote" id="q-ecb89ccf1c" data-kw="">
<blockquote><p>1. The benefits of a sound liturgy are: 1. to keep out heresy and ill words from public worship, 2. to be a help to men of unready utterance, 3. that the people may know beforehand what they join in. The inconveniences are: 1. the dulling of affection in hearing still the same words, 2. the tempting of slothful worldly candidates and ministers to learn no other way of praying when this will serve all their worldly turns. But I must add that this follows not from the imposing of a liturgy, but from the exclusion of other prayer and taking up with this alone. 2. The conveniences of praying from a habit are: 1. a just variation, as occasions vary, 2. help to fresh affection, 3. forcing ministers to get ability for utterance. The inconveniences are: 1. That the people know not till the words are past whether they may own them, and so hardly try all and follow with just consent. 2. That abundance of young, raw, unskillful men do ordinarily disgrace prayer by their unskillful methods and expressions. 3. That heretics and erroneous men have great opportunity to put their sins into their prayer, which yet the people should by joining in make their own were they sound (which they are not bound to do by sermons): And no man of understanding can choose, but suspect that weak ignorant ministers will be showing their weakness in the highest duties, and so must suspend their consent till late. 4. That less care will be taken in speaking to God than in speaking to men, while most sober ministers study their sermons. 5. That when to avoid disgraceful words and manner of praying, men must decree that no such weak or unready men shall be ministers, the number that can do it better will be so small as that most churches on earth must be so deprived of ministers and all public worship if that take place. 6. That by this means young ignorant men that by use can speak fluently and fervently in prayer shall be followed by the people when many great divines, judicious and holy that have not that readiness of utterance, shall be rejected as having not the Spirit. 7. That as all men’s bodies and minds be not in the like quickness and fitness at all times, but sometimes clouded by fumes or weakness, the public worship shall be as mutable, uncertain and various as men’s tempers are. All these on both sides are so great inconveniences that though both Formalists and Fanatics have derided me for it, I have formerly said, and still say that I believe that the best way to avoid both sorts of evils is to have meet set forms, which shall be owned by the Church as their professed desires, not being so long as to take up too much time from freer prayer, much less to forbid it, which Calvin wisely ordered for France and Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024), pp. 53-54, on a mixture of a minister praying with forms in public worship with free prayer as the ideal.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-257a0d3a59" data-kw="">
<blockquote><p>Answer: This [argument of Rutherford’s Independent opponent] speaks against glebes [contracted lands] of ministers, but the New Testament speaks not of manses or houses, or of moneys for ministers; yet a wage we know is due, Matt 10:10; 1 Cor. 9:8-10; Gal. 6:6, and the Levites were not to be distracted from the most necessary work of the Tabernacle and service of God more than ministers, yet they had lands and towns assigned of God to them; though the less distractous the wages be, the better and the more convenient they are, 2 Tim. 2:3-5. As for the tithes, we think quotta decimarum, or a sufficient maintenance of tithes or what else may conduce for food and raiment, of divine right, Matt 10:16; 1 Cor. 9:8-9, tithes formally as tithes are not necessary, so [as long as] the ministers be provided and a stipend be allowed to them, not as an alms but as a debt, Luke 10:7. But the stinting [frugal restricting] of maintenance for ministers the author [Rutherford’s opponent] condemns, because when Constantine gave large rents to the Church, it proved the bane of the Church. But I answer, stinting makes not this, but excess, for mountains of rents may be stinted no less than mole-hills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), 2nd Part, pp. 465-66 Scottish commissioner to the Westminster Assembly</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Answer: This [argument of Rutherford’s Independent opponent] speaks against glebes [contracted lands] of ministers, but the New Testament speaks not of manses or houses, or of moneys for ministers; yet a wage we know is due, Matt 10:10; 1 Cor. 9:8-10; Gal. 6:6, and the Levites were not to be distracted from the most necessary work of the Tabernacle and service of God more than ministers, yet they had lands and towns assigned of God to them; though the less distractous the wages be, the better and the more convenient they are, 2 Tim. 2:3-5. As for the tithes, we think quotta decimarum, or a sufficient maintenance of tithes or what else may conduce for food and raiment, of divine right, Matt 10:16; 1 Cor. 9:8-9, tithes formally as tithes are not necessary, so [as long as] the ministers be provided and a stipend be allowed to them, not as an alms but as a debt, Luke 10:7. But the stinting [frugal restricting] of maintenance for ministers the author [Rutherford’s opponent] condemns, because when Constantine gave large rents to the Church, it proved the bane of the Church. But I answer, stinting makes not this, but excess, for mountains of rents may be stinted no less than mole-hills.”

— Samuel Rutherford, Due Right of Presbyteries (1644), 2nd Part, pp. 465-66 Scottish commissioner to the Westminster Assembly">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnswer%3A+This+%5Bargument+of+Rutherford%E2%80%99s+Independent+opponent%5D+speaks+against+glebes+%5Bcontracted+lands%5D+of+ministers%2C+but+the+New+Testament+speaks+not+of+manses+or+houses%2C+or+of+moneys+for+ministers%3B+yet+a+wage+we+know+is+due%2C+Matt+10%3A10%3B+1+Cor.+9%3A8-10%3B+Gal.+6%3A6%2C+and+the+Levites+were+not+to+be+distracted+from+the+most+necessary+work+of+the+Tabernacle+and+service+of+God+more+than+ministers%2C+yet+they+had+lands+and+towns+assigned+of+God+to+them%3B+though+the+less+distractous+the+wages+be%2C+the+better+and+the+more+convenient+they+are%2C+2+Tim.+2%3A3-5.+As+for+the+tithes%2C+we+think+quotta+decimarum%2C+or+a+sufficient+maintenance+of+tithes+or+what+else+may+conduce+for+food+and+raiment%2C+of+divine+right%2C+Matt+10%3A16%3B+1+Cor.+9%3A8-9%2C+tithes+formally+as+tithes+are+not+necessary%2C+so+%5Bas+long+as%5D+the+ministers+be+provided+and+a+stipend+be+allowed+to+them%2C+not+as+an+alms+but+as+a+debt%2C+Luke+10%3A7.+But+the+stinting+%5Bfrugal+restricting%5D+of+maintenance+for+ministers+the+author+%5BRutherford%E2%80%99s+opponent%5D+condemns%2C+because+when+Constantine+gave+large+rents+to+the+Church%2C+it+proved+the+bane+of+the+Church.+But+I+answer%2C+stinting+makes+not+this%2C+but+excess%2C+for+mountains+of+rents+may+be+stinted+no+less+than+mole-hills.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Due+Right+of+Presbyteries+%281644%29%2C+2nd+Part%2C+pp.+465-66+Scottish+commissioner+to+the+Westminster+Assembly&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F257a0d3a59.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/257a0d3a59.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings#:~:text=Answer%3A%20This%20%5Bargumen

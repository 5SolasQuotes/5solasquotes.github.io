<main class="wrap"><figure class="quote" id="q-c964cd8291" data-kw="">
<blockquote><p>The time when Christ went forth to be tempted is noted in this word Then: what time this was, we shall see in the end of the former chapter, where is set down the baptism of our Saviour Christ by John in the river Jordan; as also the great honour and majesty wherewith he was there renowned: for it pleased Christ for special end and purpose to be baptized, not as we are, to put off sin, for he had none; but to be ordained a Mediator for us, that putting on our sin he might bear the burden thereof in our steed. Again in his baptism he was distinctly proclaimed, The doctor of his Church: for immediately thereupon, The Holy ghost descended upon him like a dove, and a voice came from heaven, saying, This is my well-beloved son in whom I am well pleased. Now so soon as Christ was thus solemnly inaugurated into his office, and proclaimed from heaven to be the sole Doctor and Prophet of God’s Church, even then immediately without any delay was he driven forth, as Mark saith, chapt. 1. 12.

The use. In that Christ is no sooner baptized, but he is presently tempted, we learn; that all those who are truly baptized into Christ must make account to be tempted, and prepare for a combat with the Devil, even through the whole course of their lives: for if Satan durst be so bold as to encounter with Christ Jesus the head of the Church after his baptism, then doubtless he will not spare any of his members who are but weak &amp; sinful men. Again, in baptism a man gives up his name unto God, promising therein for ever to renounce all service to the Devil, the flesh and the world; and contrariwise to believe in God, and to serve him; and this vow being thus made, it is the will of God he should be tempted, that in the school of temptation he might learn to practise his baptism. But here most men will say, they never felt by experience in themselves the truth of this doctrine; for they have not perceived any such combat in themselves, though they have been baptized many years agone.

Answ. Such men, whatsoever they be, have indeed the outward baptism of water, but they never yet received the inward baptism of the spirit; they wear Christs livery, but as yet they do service vnto Satan; And though they have been made partakers of the seals of the covenant, yet still they abide within the kingdom of darkness; for Christ here teacheth by his own example, that all those who have received the inward baptism of the spirit, whereby they have effectually put off sin, and put on the Lord Jesus, are as sure to be tempted by Satan as himself was: therefore let such persons as never yet felt in themselves this spiritual conflict, now begin to reform their lives, and to perform their vow of baptism, and they shall undoubtedly find in themselves the truth of this doctrine, That all that are baptized into Christ, shall be tempted of the Devil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The combat between Christ and the Devil displayed: or A commentary upon the temptations of Christ</cite>, (London: Melchizedek Bradwood, 1606), pp 1-2.</span></figcaption>

<blockquote><p>5. The Fathers do not acknowledge either actual or habitual faith and love to be bestowed upon infants in baptism. They teach, moreover, that conversion or the creation of the new heart, which is properly called regeneration, is produced only in those who are arrived at that time of life when there is the capability of exercising reason.</p></blockquote>

</figure><figure class="quote" id="q-f7256acec7" data-kw="">
<blockquote><p>Fourthly, (saith Mr. T[ombes].) Circumcision did sign Canaan; Baptism eternal life. This we have answered to afore, That Circumcision did sign Canaan as it was a type of heaven, Heb. 4. As baptism and the holy Supper under material elements signify and give us things spiritual and eternal. All this while I cannot see such a material difference between Circumcision and Baptism in the least to deface the analogy and semblance between the administration of the one and the other, to believers and their Infants, or to interrupt that consequence from the one to the other. What ever may be urged against the incapacity of children to be Baptized, may as well be argued against Circumcision.

By this that hath been answered candid men may see what reason Mr. T. hath to deny major, or consequence, or minor. If this argument be not restrainedly understood an egg is laid, out of which manifest Judaism may be hatched.

No fear, if we argue as the Apostle argues; who Colossians 2, 11. 12. (as we have cleared we hope) puts Baptism in the room of Circumcision. If we do not put those things in the place one of another, which God puts in (though but by practice and example) without looking for a new institution or command, there being a difference only of circumstances, I am bold to say, an egg is laid out of which may be hatched Antisabbatarianism a nulling of the Lords day, (as is frequent upon this very consequence, among the Anabaptists) and Exemption of women from the holy Supper with many the like inconveniencies, which we stay not now to name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>XXVI. What is said by some (“Infants are baptized in the faith of their parents”) does not mean that what is in adults is imputed to infants or answers for infants; both because each one lives by his own faith and because if the parents should be hypocrites, their infants would be excluded from salvation. But the faith of parents bears this relation—that they bring their children to be baptized from the faith by which they believe that the gospel promises belong to them and to their children; again, that by it they obtain the grace of God for their children (?Mk. 7:19).</p></blockquote>

<blockquote><p>…hence we seek a warrant, why these who were once members of the visible Church and baptized, as the Answer to the 32 [Questions, a previously published congregationalist work] says, and so [are] clean and holy, 1 Cor. 7:14; Rom. 11:16, (2) in covenant with God, Acts 2:38-39; Acts 15:14-15; Gen. 17:7; 2 Cor. 6:16-18, etc. (3) and so redeemed by the blood of Christ and baptized into his body, 1 Cor. 12:13, even unto Christ, Gal. 3:17; Acts 2:38-39, when they come to age, are for no scandal unchurched, and because they cannot give evidence of real conversion, yet for 60 or 80 years, and to their dying day, are no more Church-members than pagans? ([Margin note:] Our [congregationalist] Brethren cast out of the Church these who were baptized in their infancy, and members thereof, because visibly non-regenerated. What warrant for this censure?)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9d2b6c7659" data-kw="">
<blockquote><p>It has often been said that the Puritans and Covenanters were strict Sabbatarians, while the continental Reformers took a more relaxed attitude to the Lord’s Day, even allowing people to indulge in recreation. Henry Bullinger, however, challenges this assumption:

They transgress this commandment, that cease not from evil works, but abuse the sabbath’s rest to the provoking of fleshly pleasures. For they keep the Sabbath to God, but work to the devil, in dicing, in drinking, in dancing, and feeding their humours with the vanities of this world, whereby we are not drawn from the company of the holy congregation, but do also defile our bodies, which we ought rather to sanctify and keep holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 262.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ecc59b3148" data-kw="">
<blockquote><p>Neo. I pray you, sir, then proceed to the negative part, and tell us what the Lord forbiddeth in this [second] commandment.

Evan. Well then, I pray you understand, that in this commandment is forbidden, neglecting of prayer, as you may see, (Psa 14:4). And so also is absenting ourselves from the hearing of the word preached, or any other ordinance of God, when the Lord calls us thereunto, as you may see, (Luke 14:18-20). And so also is our rejecting the sacrament of baptism, as you may see, (Luke 7:30). And so also is our slighting the sacrament of the Lord’s Supper, as you may see, (2 Chron 30:10). And so also is the slighting and omitting any of the other forenamed duties, as you may see, (Psa 10:4, John 3:31, Isa 22:12-14). And so also is praying to saints and angels, as you may see, (Isa 63:16, Rev 19:10).

And so also is the making of images for religious uses, as you may see, (Lev 19:4). And so also is the representing God by an image, as you may see, (Exo 32:8,9). And so also are all carnal imaginations of God in his worship, as you may see, (Acts 17:29). And so also is all will worship, or the worshipping of God according to our own fancy, as you may see, (1 Sam 9:10,13, Col 2:23). And thus have I shown unto you both what the Lord requireth, and what he forbiddeth in this commandment, and now, neighbour Nomologista, I pray you, tell me whether you keep it perfectly or no?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 406.</span></figcaption>

squotes.github.io%2Fquote%2Fecc59b3148.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ecc59b3148.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/17/edward-fisher-on-the-negative-aspect-of-the-second-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8d59717acf" data-kw="">
<blockquote><p>That the Testimony of the Senses in cases of this sort is not entirely to be rejected, it is evident: 1. Because God makes use of this means to engender Faith, Romans 10:14, 17; whence, not only is the use of this means proven, but hence also it is apparent that the Senses are not in all things and always fallible; for otherwise this means would not be suitable to engender certain knowledge.

2. The sacred text seeks arguments from the Senses to confirm Theological truths, of which sort, for example, is the Resurrection of Christ, which is confirmed by the testimony of sight, Matthew 28:6, of sight and touch together, Luke 24:39; Peter appeals to the seeing and hearing of Christ’s glory, 2 Peter 1:16-18; John appeals to hearing, seeing, and touching together in matters regarding the economy of Christ, 1 John 1:1. Now, 3. the Faithfulness of God does not allow us to believe that He has willed to make sport of men, by sending them to testimony, which was designed as uniquely apt to cheat and to deceive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 32, p. 229.</span></figcaption>

</figure><figure class="quote" id="q-3b1b27c588" data-kw="">
<blockquote><p>Hence forth will I now touch certain points what I would have in your common assemblies observed and kept, and what I would were avoided, that in them nothing be done either unorderly, or contentiously, or riotously… One thing more must I tell you, which is yet of no great importance, nor [is] much weighty, but such as may, if the time and place so require, be changed… Lesse hurt were it, if ye in such points agreed, since they be but externe matters, nor make so much to the furtherance of Gospel-like godliness.</p></blockquote>

<blockquote><p>He that hath taken upon him the charge and oversight of the Church of God, let him well weigh and consider, whether he have carefully discharged his duty, both in doctrine &amp; life, so that the glory of God by him thereby hath been the rather favoured and propagated, and the consciences of many effectually stayed &amp; comforted.

Whether in matters touching God and Christian religion, he hath set forth and uttered in the Church, any thing doubtful and uncertain, in steed of certain truth, and undoubted verity. Whether he be spotted and infected with any heresy, or unsound opinion. Whether he have at all times to the uttermost of his ability and skill, endeavoured to beat down and confute all corrupt doctrines.

Whether he have patiently winked at, &amp; quietly suffered any rites wherein hath been either apparent superstition, or otherwise any notable offence and inconvenience: As gadding and ranging about with procession, countenancing in corners, superstitious usage of holy water, pilgrimages, and vows to be performed in some certain places, and with certain appointed solemnities and ceremonies, whereby there are commonly committed sundry lewd attempts and many lamentable enormities.

Whether he have admitted any to be teachers in the Church, which were either unmeet or unable sincerely and discreetly to deliver the word of God: or any corrupt and unsound preachers, that willingly deprave the texts of the scriptures, and purposely misconstrue the words of truth, to confirm and establish their own fantastical, or rather fanatical, opinions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 37-39.</span></figcaption>

— Andreas Hyperius, The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl, trans. Thomas Newton (London: John Windet, 1587), pp 37-39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+that+hath+taken+upon+him+the+charge+and+oversight+of+the+Church+of+God%2C+let+him+well+weigh+and+consider%2C+whether+he+have+carefully+discharged+his+duty%2C+both+in+doctrine+%26+life%2C+so+that+the+glory+of+God+by+him+thereby+hath+been+the+rather+favoured+and+propagated%2C+and+the+consciences+of+many+effectually+stayed+%26+comforted.%0A%0AWhether+in+matters+touching+God+and+Christian+religion%2C+he+hath+set+forth+and+uttered+in+the+Church%2C+any+thing+doubtful+and+uncertain%2C+in+steed+of+certain+truth%2C+and+undoubted+verity.+Whether+he+be+spotted+and+infected+with+any+heresy%2C+or+unsound+opinion.+Whether+he+have+at+all+times+to+the+uttermost+of+his+ability+and+skill%2C+endeavoured+to+beat+down+and+confute+all+corrupt+doctrines.%0A%0AWhether+he+have+patiently+winked+at%2C+%26+quietly+suffered+any+rites+wherein+hath+been+either+apparent+superstition%2C+or+otherwise+any+notable+offence+and+inconvenience%3A+As+gadding+and+ranging+about+with+procession%2C+countenancing+in+corners%2C+superstitious+usage+of+holy+water%2C+pilgrimages%2C+and+vows+to+be+performed+in+some+certain+places%2C+and+with+certain+appointed+solemnities+and+ceremonies%2C+whereby+there+are+commonly+committed+sundry+lewd+attempts+and+many+lamentable+enormities.%0A%0AWhether+he+have+admitted+any+to+be+teachers+in+the+Church%2C+which+were+either+unmeet+or+unable+sincerely+and+discreetly+to+deliver+the+word+of+God%3A+or+any+corrupt+and+unsound+preachers%2C+that+willingly+deprave+the+texts+of+the+scriptures%2C+and+purposely+misconstrue+the+words+of+tr

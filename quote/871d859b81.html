<main class="wrap"><figure class="quote" id="q-871d859b81" data-kw="">
<blockquote><p>[N]ow lest any should mistake, there was three sorts of Laws published in writing at Mount Sinai which were not written before, first, that eternal Moral Law in the 20. chap. of Exodus, now this was not only written for them but for us also, Rom. 15:4. I Cor. 10:11. yea for Saints and Angels eternally, Psal. 119:89; 103:20. not one title of this Law shall fail, and the Apostles do not seek to make void this Law, but do establish it, Rom. 3:31. but then at Mount Sinai there was the Judicial Law given in the 21, 22, 23. chapters of Exodus, and that Law belongs no more to us then our Laws of the Land belong to them any farther then they are grounded on the moral Law.

3. There was the Ceremonial Law given in the 24, 25, 26, 27, 28, 29, 30, 31. now this ceremonial Law being in types and shadows of Christ to come were all ended when Christ was once offered to bear the sins of many, although the Priests stood daily ministering and offering oftentimes the same sacrifices, but when Christ had offered one sacrifice for sins, for ever sat down at the right hand of God, Heb. 9:28. 10, 11, 12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two solemn covenants made between God and man: viz. the covenant of works and the covenant of grace</cite>, (London: Thomas Banks, 1647), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c59836fcd" data-kw="">
<blockquote><p>Men, under the pretense of curing the defects and shortcomings, the nakedness and bareness, attaching to ecclesiastical arrangements as set before us in the New Testament, have been constantly proposing innovations and improvements in government and worship. The question is, How ought these proposals to have been received? Our answer is, There is a great general scriptural principle which shuts them all out. We refuse even to enter into the consideration of what is alleged in support of them. It is enough for us that they have no positive sanction from Scripture.</p></blockquote>

</figure><figure class="quote" id="q-f2f9ef2aec" data-kw="">
<blockquote><p>Another feature of the book [of Common Order, 1564] was that it was so framed as to make responsive worship impossible. The worshipper was to follow the continuous prayers with silent accord… At Frankfort [Germany] the signal for the outbreak of hostilities between the two parties was the loud responses of the Anglicans when a liturgy of compromise was read. The ground which Knox had taken up there, he was not likely to abandon in Scotland. His position would be that the people’s vocal part in divine service was the singing of Psalms; for the preface to the original Geneva Book says: ‘Prayers are after two manner of sorts, that is, either in words only or else with song joined thereunto.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-leishman.html">Thomas Leishman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ritual of the Church’ in</cite>, ed. Story, Robert, The Church of Scotland, Past and Present (1890 ff.), vol. 5, p. 327</span></figcaption>

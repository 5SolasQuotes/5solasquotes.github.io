</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86e2524294" data-kw="">
<blockquote><p>Though we do good works, we do not found our salvation upon them; for we can do no work but what is polluted by our flesh, and also punishable; and although we could perform such works, still the remembrance of one sin is sufficient to make God reject them. Thus, then, we would always be in doubt, tossed to and fro without any certainty, and our poor consciences would be continually vexed if they relied not on the merits of the suffering and death of our Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 24</span></figcaption>

</figure><figure class="quote" id="q-52317ab2c8" data-kw="">
<blockquote><p>It is true that it is a doctrine which well deserves to be embraced, that God cannot be a righteous Judge to save us, unless he have been previously declared to be in the highest degree a merciful Father; that there will be no righteousness in us but that which he has placed there; and that he cannot reward us but by crowning his gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on 2 Timothy</cite>, Sermon on 2 Timothy 4:8</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is true that it is a doctrine which well deserves to be embraced, that God cannot be a righteous Judge to save us, unless he have been previously declared to be in the highest degree a merciful Father; that there will be no righteousness in us but that which he has placed there; and that he cannot reward us but by crowning his gifts.”

— John Calvin, Sermons on 2 Timothy, Sermon on 2 Timothy 4:8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt%20is%20true%20that%20it%20is%20a%20doctrine%20which%20well%20deserves%20to%20be%20embraced%2C%20that%20God%20cannot%20be%20a%20righteous%20Judge%20to%20save%20us%2C%20unless%20he%20have%20been%20previously%20declared%20to%20be%20in%20the%20highest%20degree%20a%20merciful%20Father%3B%20that%20there%20will%20be%20no%20righteousness%20in%20us%20but%20that%20which%20he%20has%20placed%20there%3B%20and%20that%20he%20cannot%20reward%20us%20but%20by%20crowning%20his%20gifts.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Sermons%20on%202%20Timothy%2C%20Sermon%20on%202%20Timothy%204%3A8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52317ab2c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52317ab2c8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom43" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-d8aa891617" data-kw="">
<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-bergius.html">Conrad Bergius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praexi Cathol. Divin. Canon., Dissertation 7</cite>, pp. 963-64 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.</span></figcaption>

</figure><figure class="quote" id="q-f9e1d8e3fb" data-kw="">
<blockquote><p>First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, Ephesians 2:8</span></figcaption>

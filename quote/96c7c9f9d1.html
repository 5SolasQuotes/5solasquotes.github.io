<main class="wrap"><figure class="quote" id="q-96c7c9f9d1" data-kw="">
<blockquote><p>Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.”

— Gisbertus Voetius, A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+the+Son+of+God+assumed+flesh+by+the+soul+mediating%3F+It+is+affirmed+with+a+distinction.+Whether+the+Son+of+God+assumed+a+soul+by+the+spirit+or+mind+mediating%2C+that+is%2C+the+rational+part+of+the+soul%3F+It+is+affirmed.+Whether+the+soul+was+assumed+before+the+flesh.+It+is+denied.+Whether+the+flesh+of+Christ+was+assumed+by+the+Word+before+the+union+of+the+soul%3F+It+is+denied.+Whether+the+whole+nature+was+assumed+simultaneously+through+mediating+parts%3F+It+is+distinguished.+Whether+the+human+nature+was+assumed+by+grace+mediating%3F+It+is+distinguished.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+A+Syllabus+of+Theological+Problems%E2%80%A6+%28Utrecht%2C+1643%29%2C+Tract+2%2C+On+the+Person%2C+Offices+%26+States+of+Christ+the+Mediator%2C+Title+1%2C+on+the+Person+of+Christ+the+Mediator%2C+Subtitle%3A+On+the+Assumption+%26+Union+of+the+Human+Nature.+trans.+T.+Fentiman+%7C+On+the+Mode+of+Assuming%2C+as+far+as+the+Order&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96c7c9f9d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96c7c9f9d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Whether%20the%20Son%20of%20God%20assumed,by%20grace%20mediating%3F%20It%20is%20distinguished&amp;text=Whether%20the%20Son%20of%20God%20assumed%20flesh%20by&amp;text=was%20assumed%20by%20grace%20mediating%3F%20It%20is%20distinguished" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c459073e43" data-kw="">
<blockquote><p>If by birth control is meant that married couples should use their common sense in spacing births–that with pure and unselfish motives they should strive not to beget children when their physical, financial and other circumstances do not warrant it–we whole heartedly agree that it is permissible. Indeed it is an offence against God, against their offspring and against themselves, if a couple continue to bring forth children when their circumstances do not justify it. When, however, birth control is practiced for selfish reasons and with false motives, it is to be strongly opposed.</p></blockquote>

</figure><figure class="quote" id="q-58428f44b4" data-kw="">
<blockquote><p>I so think that in the very point of generation, when the matter is disposed to that point that it is apt for the reception of the substantial form, which makes a man out of an embryo, that the souls of individual men are more probably both new and created from nothing, this being in greater harmony with the sacred letters, testimonies of the fathers and philosophers, and reasons than that one is propagated from another through being passed over or through the seed of parents.</p></blockquote>

</figure><figure class="quote" id="q-25f516dcaa" data-kw="">
<blockquote><p>In order effectively to serve the needs of human life, modern biology reconstructed the nature of the organic body, representing it not as something animated, purposive and striving, but as dead matter-in-motion. This reductive science has given us enormous power, but it offers no standards to guide its use. Worse, it challenges our self-understanding as creatures of dignity, rendering us incapable of recognizing dangers to our humanity that arise from the very triumphs biology has made.</p></blockquote>

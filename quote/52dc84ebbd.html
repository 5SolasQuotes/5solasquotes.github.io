</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50c5c02faf" data-kw="">
<blockquote><p>That the [Anglican] Ceremonies are a great hinderance to edification appears, first, in that they obscure the substance of religion and weaken the life of godliness by outward glory and splendor, which draws away the minds of people so after it that they forget the substance of the service which they are about… departing from the apostolical and most ancient simplicity, and for adding ceremonies unto ceremonies in a worldly splendor and spectability, whereas the worship of God ought to be pure and simple… Secondly, the Ceremonies are impediments to the inward and spiritual worship, because they are fleshly and external…</p></blockquote>

</figure><figure class="quote" id="q-fcecb65172" data-kw="">
<blockquote><p>whatsoever you hear [from the holy Scriptures] let that savor well unto you; whatsoever is without them, refuse, lest you wander in a cloud.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-augustine.html">St Augustine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Pastor, ch. 11</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“whatsoever you hear [from the holy Scriptures] let that savor well unto you; whatsoever is without them, refuse, lest you wander in a cloud.”

— St Augustine, On the Pastor, ch. 11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cwhatsoever+you+hear+%5Bfrom+the+holy+Scriptures%5D+let+that+savor+well+unto+you%3B+whatsoever+is+without+them%2C+refuse%2C+lest+you+wander+in+a+cloud.%E2%80%9D%0A%0A%E2%80%94+St+Augustine%2C+On+the+Pastor%2C+ch.+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffcecb65172.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fcecb65172.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=whatsoever%20you%20hear%20%5Bfrom%20the%20holy,lest%20you%20wander%20in%20a%20cloud&amp;text=whatsoever%20you%20hear%20%5Bfrom%20the%20holy%20Scriptures%5D%20let&amp;text=them%2C%20refuse%2C%20lest%20you%20wander%20in%20a%20cloud" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d342678c42" data-kw="">
<blockquote><p>The things set down under the former head as forbidden are such new ordinances of worship as are coordinate with the divine ordinances and are in a proper sense additions, pretending or in themselves expressing the same nature, reason, end and use that the divine ordinances have and consequently importing an insufficiency in them. But there are such institutions of men in subordination to the divine institutions as serve for the more convenient modifying and ordering of the same; and they are not proper additions because they are not of the same nature and use: and these are unlawful. All such modes of a duty as are necessary in genere, and not determined in specie (as when there must be a practice one way or other, but whether this way or that way, is not determined of God) are left free to human determination. This human determination must be regulated by the general rules of God’s Word, of which there be these two chief: First, that all determinations be made for edification and not for destruction. Secondly, that all things be done decently and in order. These two rules we find expressly in Scripture, and they are also of the law of nature. These things are neither the essential nor integral parts of divine worship; but if any of them be called “parts” thereof, as being direct expressions of honor to God, they are but accidental parts, as the putting off the hat in divine worship is a worshipping of God so far as it is an expression of honor to God. … Whatsoever nature or custom has so made decent or reverent that the negation of it is indecent or irreverent, is doubtless commanded of God in his worship, though not by any particular, yet by general laws. And the institution and observation of such things is no addition to God’s Law, but merely an application of the general Law in particular cases, as the Law itself does warrant. All these are such mutable things as are not fit to be in particular the matter of a universal law because they are fit in one place and at one time, and not another. Note that things not determined of God and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 5, What things of or belonging to Divine Worship may be Devised or Instituted by Man</cite></span></figcaption>

</figure><figure class="quote" id="q-68de1d7e71" data-kw="">
<blockquote><p>And it shall be, when you are come in unto the land which the Lord your God gives you for an inheritance, and possess it, and dwell therein; That you shall take of the first of all the fruit of the earth, which you shall bring of your land that the Lord your God gives you, and shall put it in a basket, and shall go unto the place which the Lord your God shall choose to place his name there. And you shall go unto the priest that shall be in those days, and say unto him, ‘I profess this day unto the Lord your God, that I am come unto the country which the Lord swore unto our fathers for to give us.’ And the priest shall take the basket out of your hand, and set it down before the altar of the Lord your God. And you shall speak and say before the Lord your God, ‘A Syrian ready to perish was my father [Jacob], and he went down into Egypt, and sojourned there with a few, and became there a nation, great, mighty, and populous: And the Egyptians evil entreated us, and afflicted us, and laid upon us hard bondage: And when we cried unto the Lord God of our fathers, the Lord heard our voice, and looked on our affliction, and our labor, and our oppression: And the Lord brought us forth out of Egypt with a mighty hand, and with an outstretched arm, and with great terribleness, and with signs, and with wonders: And He has brought us into this place, and has given us this land, even a land that flows with milk and honey. And now, behold, I have brought the firstfruits of the land, which You, O Lord, have given me.’ And you shall set it before the Lord your God, and worship before the Lord your God: And you shall rejoice in every good thing which the Lord your God has given unto you, and unto your house, you, and the Levite, and the stranger that is among you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mdiv-travis-fentiman.html">MDiv. Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In all the Bible Deut. 26:1-11 is the only passage where a confession or creed is used in worship. Israel is about to enter the promised land of Canaan after their 40 years in the wilderness. God speaks through Moses and tells them that when they are in the land they are to keep a yearly holiday named the Feast of Firstfruits. They are to take the first ripe portions of their harvest before the Lord’s presence at the tabernacle (and later the temple in Jerusalem) and give it to the Lord. In doing so, before the priest, they are to make a confession remembering their humble beginnings and how the Lord had prospered them. The inspired confession is given to them, word-for-word, by God. The passage reads:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

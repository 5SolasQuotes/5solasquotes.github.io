<main class="wrap"><figure class="quote" id="q-4223bd30c4" data-kw="">
<blockquote><p>And thus I have showed you what materials our brethren will afford us to this building [of Church government], which I could for my own part rather be content to sit down withal, than by raising it higher, but heighten our confusion, run the mischief of division among ourselves, than which no penal evil can be sadder and more uncomfortable. I wish we might all remember the apostle’s rule, Phil. 3:15-16…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error… (London: Miller, 1646)</cite>, p. 311</span></figcaption>

<blockquote><p>I have heard many pleading for ceremonies say that if the magistrate commanded them and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law…</p></blockquote>

</figure><figure class="quote" id="q-260ed823a9" data-kw="">
<blockquote><p>When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 134</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?”

</figure><figure class="quote" id="q-072a7423b2" data-kw="">
<blockquote><p>One may object: (1) But is not a minister leading responsive readings inducing others to do what is wrong, which is prohibited by God’s Law (WLC #99.5–8)? Besides what has been said, to put it in a bit different way: Given that the impurities in responsive readings do not so corrupt the reading of the Word as to make the hurt more than the benefit, overturning the profit and substance of the ordinance itself, so God graciously receives this worship from sincere Christians. Leading weaker brothers in substantially good and Biblical worship as their consciences will bear (Rom. 14:5), especially given public order, is to direct them to their duty, which WLC #99.5–8 also obliges us to; and the moral necessity to do the greater good ordained of God, though mixed with impurities (without morally approving them), is greater than to abstain from that substantial and greater good because of its impurities. This is not to do “what God forbids,” which “is at no time to be done,” because this is precisely what “He commands” and “is always our duty” (WLC #99.5). If one does not agree, but believes it is sinful to ever personally perform, or direct others to do good things with impurities, inconvenience, an association of evil or that which another person could take scandal at, welcome to Separatism. Our puritan authors’ Scriptural Refutation of it will be instructive to you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

asquotes.github.io%2Fquote%2F072a7423b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/072a7423b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=One%20may%20object%3A%20%281%29%20But%20is,it%20will%20be%20instructive%20to%20you." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

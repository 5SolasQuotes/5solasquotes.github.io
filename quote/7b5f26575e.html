<main class="wrap"><figure class="quote" id="q-7b5f26575e" data-kw="">
<blockquote><p>In this we are even more justified, because the nature and requirements of a rule fit as exactly as possible with Scripture alone. First, the rule of living for God, without doubt, ought to be prescribed by God alone (Deut. 12:32; Matt. 15:9). For a rule cannot be prescribed by any other than by the one whom the rule concerns. Now, Scripture alone has been prescribed by God as the rule for us (2 Tim. 3:16; 2 Peter 1:21), and due to the sublimity of the matter it could not be revealed and prescribed by anyone but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, vol. 1: Prolegomena, Part 1, Book 1, ch. 2, §V</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f70548235" data-kw="">
<blockquote><p>In other words, if faith depends upon the word of God alone, if it regards and reclines on it alone, what place is left for any word of man? … God deprives man of the power of producing any new doctrine, in order that he alone may be our master in spiritual teaching, as he alone is true, and can neither lie nor deceive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

</figure><figure class="quote" id="q-0a2dfef12d" data-kw="">
<blockquote><p>It has been assumed that Theology has to do with the facts or truths of the Bible; in other words, that the Scriptures of the Old and New Testaments are the only infallible rule of faith and practice. This, however, is not a conceded point. Some claim for Reason a paramount, or, at least a coördinate authority in matters of religion. Others assume an internal supernatural light to which they attribute paramount, or coördinate authority. Others rely on the authority of an infallible church. With Protestants, the Bible is the only infallible source of knowledge of divine things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/nature-of-theology.html">Nature of Theology</a> › <a href="../topics/theology/nature-of-theology/method-of-theology.html">Method of theology</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-d04c21ab00" data-kw="Grace">
<blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</span></figcaption>

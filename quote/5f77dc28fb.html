<blockquote><p>Now further, in that the prophet [Isaiah] speaks in the present tense, ‘My beloved has a Vineyard:’ albeit the whole Church of Israel and Judah was at this time so generally corrupted, as that from the crown of the head to the sole of the foot, there was nothing found but wounds, swellings and sores, full of corruption (as he had before testified [in Isa. 1:5]). We observe that: ([Margin note:] Doctrine: A true Church may be corrupted with error and idolatry) Albeit a Church be corrupted with error and idolatry, yet it is still to be accounted God’s Church, till He has divorced and forsaken her. Thus in the days of Eli (1 Sam. 2:24, 29), Israel was called God’s people; and so his Church, albeit they were not then separated from all false ways, and Eli’s sons (sons of Belial, says the text, v. 12, who knew not the Lord) remained amongst them. So Moses calls Israel God’s people when he was upon the Mount (Ex. 32:11), and yet at that time they were in the very act of their idolatry, which was not unknown to Moses, for God Himself informed him thereof (vv. 7-8). So in this our prophet’s time, albeit this people were sunk deep in rebellion and idolatry, yet for all that God Himself does call them his people, ‘Israel does not know, My people does not consider.’ (Isa. 1:21-22, 29; 2:6, 8; 65:11; 1:3) Turn we our eyes from the estate of the Church in these times to after times, as it was under the Gospel, and we shall see the truth of the point propounded. Look upon Jerusalem in our Saviour Christ’s time, and we shall see the eleven Tribes were become apostates (Mt. 23:37), and the Church amongst them was wonderfully corrupted both in doctrine and manners, as appears by our Saviour Christ’s severe reproof of both (Mt. 5:21); yea the temple itself was almost become a den of thieves, full of buyers and sellers. Yet at this time it was the true Church of God, else the evangelist would never have called it ‘the Holy City.’ (Mat. 4:5 &amp; 27:53) In Saint Paul’s time the Corinthians were called the Church of God (1 Cor. 1:1-2), and yet at that very instant some of them were in an heresy (2 Cor. 12:20-21), others in incest, and othersome that had not repented of their filthiness. (1 Cor. 5:1) Such was the estate of the Churches of Asia, yet the title of true Churches was given to them. (Rev. 2 &amp; 3) Those therefore that condemn the Church of England for a no-Church, and make a separation from it in regard of the errors and corruptions that are in it, are far from the spirit of Christ, and the prophets and apostles, who never made any schismatical and bodily separation from any true Church, for the corruptions (though gross) that were therein found. I deny not but blemishes are in every Church (for what Church ever breathed in so pure an air as that it might not justly complain of some thick and unwholesome evaporations of error and sin?), but because our Mother wants some beauty, has she lost her face? Because she is black, has she no comeliness at all? [Song 1:5-6] What is it they charge us with, but with corruptions? (for fundamental error they can discover none). Now do corruptions in a man make a false man, or a corrupt man? So that though they make the worst they can of our Church, they can make it but a corrupt Church, and not a false Church. We have the true Word of God preached, the true sacraments of Christ Jesus administered, which all divines in all the reformed Churches in Christendom, which now are or have been, do hold to be the infallible tokens of a true Church, and are reciprocally converted with the true Church. We maintain every point of the most ancient Creeds; we overthrow not the foundation by any consequence. And as yet we have not received a bill of divorcement. As for discipline (the want whereof they charge us with) our Church is not destitute of it altogether…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nehemiah-rogers.html">Nehemiah Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Strange Vineyard in Palæstina in an Exposition of Isaiah’s Parabolical Song of the Beloved, discovered: to which God’s Vineyard in this our Land is Paralleld</cite>, (London: Haviland, 1623), pp. 73-74</span></figcaption>

<blockquote><p>There is no doctrine objectively of absolute necessity to salvation, but the doctrine of the Baptismal Covenant which is expounded in the [Apostles’] Creed, Lord’s prayer and Decalogue. But there is much doctrinal and active means necessary to make men uUnderstand, Believe, Love and Practice this necessary Covenant doctrine. And the doctrine or articles of faith, will save none that do not understand, believe, love, and practise it, and that sincerely preferring the things revealed before all the pleasures, riches and honors of this world. A parrot shall not be a saint for saying the Creed.</p></blockquote>

<blockquote><p>England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

tians+Disagree%3A+Lessons+from+the+Fractured+Relationship+of+John+Owen+and+Richard+Baxter+%28Crossway%2C+2024%29%2C+pp.+23%2C+91-92%2C+104.+Cooper%3A%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f8b9a4f73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f8b9a4f73.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=England%20had%20a%20divided%20church.%20Even,associations%20sprang%20up%20in%20other%20counties&amp;text=England%20had%20a%20divided%20church.%20Even%20among%20puritans&amp;text=similar%20ministerial%20associations%20sprang%20up%20in%20other%20counties" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7daab76c8c" data-kw="">
<blockquote><p>Yet it is the verdict of some (Sarav., N. Fratri &amp; Amico, Art. 17) that the blame lies not upon the ceremonies, but upon ministers themselves, who leave their places and draw all this evil upon themselves. This is even as Nabal blamed David for breaking away from his master, when he was chased away against his will (1 Sam. 23:10); and as Julian, when he had impoverished the Christians, laughed them to scorn, as if they had impoverished themselves to get that blessing which Christ had promised to the poor. (Socrates, bk. 3, ch. 12) The Canon Law speaks for the lord’s bishops, which are persecuted from citty to city. ‘Nec ipsi in hoc peccant, quoniam non sponte sed coacte hoc agunt: sed illi qui eos persecuuntur: nec ipsis Episcopis hoc imputari potest, sed illis qui eos hoc agere cogunt.’ (Decr., pt. 2, causa. 7, q. 1, ch. 36) How is it that they are not ashamed, who say that ministers leave their own places and callings, when they would faine abide in them, and with heavy hearts are thrust from them. Neither is this all the injury which is occasioned by the ceremonies: they make godly and zealous Christians to be mocked and nicknamed puritans, except they can swallow the camel of conformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 5, p. 23</span></figcaption>

<blockquote><p>The apostle, 1 Tim. 6:3-5, saying, separate from such, has a two-fold sense: Either such as teach otherwise than the truth fundamentally, and then separate wholly: Or not fundamentally, but erring only in points less than the foundation. And these diversely also: Either presumptuously obstinately, and of a desparate conscience: and then if that apear, separate from such wholly: Or else, erring in simplicity and of oversight, and former preiudice, from such, separate not wholly, but only from the very error or errors, in no wise from their Christian communion and society, seeing these are true Christians. Seing therefore our corruptions of the prelacy and ceremonies be of these latter sort: which thing hitherto you haue not, nor cannot overthrow (and withal you must utterly overthrow Master [Thomas] Cranmer and the rest of the martyrs’ Christianity likewise): Therefore we in England, by the grace of God, are still true Christians: and you ought so to acknowledge us, as you will answer unto God: All which you may do, and yet touch no part of our ecclesiastical corruptions at all, to give allowance unto them: And in all this, there is no contradiction with myself, it is but your distempered conceit, that seems contrary. Neither is our absolute departure from the Papists hereby any whit impeached…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jacob.html">Henry Jacob</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Churches &amp; Ministry of England, written in Two Treatises, against the reasons and objections of Master Francis Johnson, and others of the Separation commonly called Brownists</cite>, (Middleburg, 1599), ‘Jacob’s 2nd Reply to the 9th Reason’, pp. 79-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

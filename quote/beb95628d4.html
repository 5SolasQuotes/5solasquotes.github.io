<main class="wrap"><figure class="quote" id="q-beb95628d4" data-kw="">
<blockquote><p>I. THE Arminians are of the opinion, that Christ by his death obtained and got remission of sins, reconciliation, &amp; salvation for all, and particular men: Nor do they doubt to say, that by the death of Christ, reconciliation was obtained for Pharaoh, Saul, Judas and Pilate, not as they were Reprobates, but as they were sinners: For God doth equally intended and desire the Salvation of all men; and that the incredulity of man is the cause that remission and reconciliation is not applied to all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 27.1, p. 196.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

— Pierre Du Moulin, The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c, (1619; London: Nathanael Newbery, 1635), 27.1, p. 196.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+THE+Arminians+are+of+the+opinion%2C+that+Christ+by+his+death+obtained+and+got+remission+of+sins%2C+reconciliation%2C+%26+salvation+for+all%2C+and+particular+men%3A+Nor+do+they+doubt+to+say%2C+that+by+the+death+of+Christ%2C+reconciliation+was+obtained+for+Pharaoh%2C+Saul%2C+Judas+and+Pilate%2C+not+as+they+were+Reprobates%2C+but+as+they+were+sinners%3A+For+God+doth+equally+intended+and+desire+the+Salvation+of+all+men%3B+and+that+the+incredulity+of+man+is+the+cause+that+remission+and+reconciliation+is+not+applied+to+all.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%3A+Or%2C+The+Opening+of+the+Controversies+of+These+Times+%28Formerly+Handled+in+the+Low-Countries%29+Concerning+the+Doctrine+of+Providence%2C+of+Predestination%2C+of+the+Death+of+Christ%2C+of+Nature+and+Grace%2C+%26c%2C+%281619%3B+London%3A+Nathanael+Newbery%2C+1635%29%2C+27.1%2C+p.+196.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbeb95628d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/beb95628d4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/05/21/pierre-du-moulin-on-arminianism-and-a-frustrated-divine-desire-for-the-salvation-of-all-men/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3aa993b37" data-kw="">
<blockquote><p>John Davenant wrote to his fellow member of the British delegation to the Synod of Dort, Joseph Hall, to correct false aspersion of Arminianism cast upon the latter divine and to affirm that Arminianism was contrary to the doctrine of the Church of England:

As for the aspersion of Arminianism, I can testify that in our joint employment at the Synod of Dort you [Joseph Hall] were as far from it as myself. And I know that no man can embrace it in the Doctrine of Predestination and Grace but he must first desert the Articles agreed upon by the Church of England, nor in the point of perseverance but he must vary from the common Tenet and received opinion of our best approved Doctors in the English Church. And therefore be no more troubled with other men’s groundless suspicions, then you would be in like case, with their idle dreams. Thus I have enlarged my self beyond my first intent. But my love to your self, and the assurance of your constant love unto the Truth, enforced me thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Joseph Hall, 30 January 1628 in Joseph Hall, The Reconciler, or An epistle pacificatory of the seeming differences of opinion concerning the true being and visibility of the Roman Church Enlarged with the addition of letters of resolution, for that purpose, from some famous divines of our </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-e7d3313ae5" data-kw="">
<blockquote><p>But the full state of the question arises out of these particulars thus: Whether Christ by his death did intend or purpose to procure remission of sins, and eternal life for every man either absolutely, or upon any condition. The affirmative is the judgment of Arminius and his followers; the negative of the contra-Remonstrants and their followers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-howe.html">Obadiah Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Universalist Examined &amp; Convicted, Destitute of Plain Sayings of Scripture or evidence of Reason</cite>, (London: Rothwell, 1648) 223 pp. ToC, ch. 1, end, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-83f3bb03b4" data-kw="">
<blockquote><p>By negative infidelity understand the mere lack of faith in one to whom the catholic Faith has either not been announced, or certainly not sufficiently. Such is the infidelity of those who have either heard nothing of the Faith, like the pagans; or have indeed heard, but so cursorily that the mysteries of the faith have not yet been shown to them to be evidently credible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 54-59, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

— Samuel Ward, ‘Negative Infidelity, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 54-59, p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+negative+infidelity+understand+the+mere+lack+of+faith+in+one+to+whom+the+catholic+Faith+has+either+not+been+announced%2C+or+certainly+not+sufficiently.+Such+is+the+infidelity+of+those+who+have+either+heard+nothing+of+the+Faith%2C+like+the+pagans%3B+or+have+indeed+heard%2C+but+so+cursorily+that+the+mysteries+of+the+faith+have+not+yet+been+shown+to+them+to+be+evidently+credible.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+%E2%80%98Negative+Infidelity%2C+%5Bof+the+Gospel%5D+Condemns+No+One+%5Bdue+to+Invincible+Ignorance%5D%E2%80%99+in+Theological+Determinations+in+Works+of+Samuel+Ward%2C+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+pp.+54-59%2C+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83f3bb03b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83f3bb03b4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/arminianism/#:~:text=By%20negative%20infidelity%20understand%20the%20mere,to%20them%20to%20be%20evidently%20credible&amp;text=By%20negative%20infidelity%20understand%20the%20mere%20lack%20of&amp;text=been%20shown%20to%20them%20to%20be%20evidently%20credible" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2b1fae712e" data-kw="">
<blockquote><p>The Arminians (who bring popery and Pelagianism in by the back door) have struck against the same rock [as the modern Lutherans]. For although they endeavour with great labour to prove that they do not make faith the cause of election (in order to shun the odium of semi-Pelagianism deservedly charged upon them), still they do not deny that it is the cause sine qua non or the prerequisite condition necessary in those to be elected. Yea, not obscurely can we gather that they proceed further and attribute a certain causality to faith, so that God is moved by its foresight to choose this rather than that one. Otherwise why would they say so often that election is founded on the foresight of faith unless they meant that the consideration of faith influenced the election of one before another? …

Moreover, they make a twofold decree of election: the first general, of saving believers; the second special, of saving individuals by name whom God foresaw would believe. They hold that no other cause of the first can be given than the pure will of God, but as to the second (although it also is founded upon the divine will), they hold it supposes the consideration and regard of faith, so that God is moved by it to elect one rather than another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), 4.11.7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>It is easy for the wicked to conceive an evil design, and it is beyond doubt that God’s power so keeps their evil will within certain limits that they are unable to get what they covet without God’s permission. No one ever so little instructed in religious doctrine but knows that God’s wisdom and justice make use even of the evil works they do with an evil intention to achieve His own designs and decrees, when he sees that the most merciful will of God the Father who did not spare even His own Son, but delivered Him up for us all, was carried out by the wicked will of the traitor Judas and of the Jews, and when he reads in the Gospel that when Pilate said to Jesus: Speakest thou not to me? Knowest thou not that I have power to crucify thee, and I have power to release thee? our Lord answered: Thou shouldst not have any power against me, unless it were given thee from above.

Accordingly, God governs light and darkness. Darkness is not without guilt because God makes use of it for a good purpose and disposes that even the works of darkness should result in the good of the sons of light, allowing the wickedness of men bent on doing them harm to exact extent that He knows it will be helpful to chastise or to test His saints. And so, even when they go against God’s will, they yet fulfil that very will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/prosper-of-aquitaine.html">Prosper of Aquitaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Extracts of the Genoese in Defense of St. Augustine, trans. P. De Letter, Ancient Christian Writers, no. 32 (Westminster MD: Newman Press, 1963), pp 60-61.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-403f6adf5c" data-kw="">
<blockquote><p>Q. 145. Has God such a will in Him, as He calls a conditional will? as for example, to will all men’s salvation if they repent? Answer: Properly there cannot be a conditional will in God: First, because such a will supposes a superior that may hinder, Acts 18:21. Secondly, it supposes ignorance how things may fall out, as Abraham willed his servant to fetch a wife for Isaac out of the land of his kindred, Gen. 24:4, if she were willing, verse 8. Nevertheless, improperly it may be given to God, not as though his will can have a condition, for that’s the property of a created will, to have a condition of it, Jam. 4:15, but because the thing willed of God may have a condition, Isa. 7:9. Now, that the Lord may be said to have a conditional will in some sense is plain: First, because He is said to will the connection of things when He does not will the things asunder; and therefore He wills them only upon the condition of a connection: God would have all men to repent and come to the knowledge of the truth, 1 Tim. 2:4. Secondly, because He is said to will the salvation of all believers and true penitent persons, and therefore if a reprobate do believe, He wills his salvation, 1 Kn. 11:38. This is true of God towards a reprobate: “If thou wilt obey Me, I will bless thee,” Dt. 7:12-13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Man’s Directory</cite>, … (London: T.F., 1648), Of Catechizing, Of Thoughts, pp. 108-9</span></figcaption>

<blockquote><p>XVIII. God by his antecedent will decreed to bestow faith and grace on us, which by his consequent will He resolved to deny us; his former will was moved by his own goodness, but his latter will was provoked by our wickedness: if we have unjustly rejected the grace which by his former will He resolved to give us, may not He justly by his latter will deny that grace, which was rejected so perversely by us. Lord, if thou art resolved by thy first will to bestow grace on me, let me not by my disobedience provoke thy second will to deny that grace unto me. XIX. Our wickedness is the cause that moves God to exercise his acts of justice; but his own bounty is the cause, and our misery the occasion, why He exercises his acts of mercy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>

<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ .

1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following.

2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing.

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/diego-ruiz-de-montoya.html">Diego Ruiz de Montoya</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries &amp; Disputations on the First Part of St. Thomas, on the Will of God &amp; its Proper Acts</cite>, (Lugduni: Prost, 1630), Quest. 19, On the Will of God, Disputation 20, ‘It is explained whether the antecedent will is conditional, and whether it is formally concerned with the means, insofar as they are means’ tr. AI by The Faith Received Ruiz (1562-1632) was a Spanish Jesuit theologian who fundamentally was on the side of those affirming Middle Knowledge in the De Auxiliis controversy, who yet sought to bridge the difference with a formulation which came to be critiqued by both Jesuits and Dominicans. Ruiz was a favorite of John Davenant.</span></figcaption>

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.”

— Diego Ruiz de Montoya, Commentaries &amp; Disputations on the First Part of St. Thomas, on the Will of God &amp; its Proper Acts, (Lugduni: Prost, 1630), Quest. 19, On the Will of God, Disputation 20, ‘It is explained whether the antecedent will is conditional, and whether it is formally concerned with the means, insofar as they are means’ tr. AI by The Faith Received Ruiz (1562-1632) was a Spanish Jesuit theologian who fundamentally was on the side of those affirming Middle Knowledge in the De Auxiliis controversy, who yet sought to bridge the difference with a formulation which came to be critiqued by both Jesuits and Dominicans. Ruiz was a favorite of John Davenant.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSection+4%2C+%E2%80%98On+the+imperfections+which+an+inefficacious+will+and+a+will+suspended+from+a+condition+seem+to+display%3A+objections+are+dissolved.%E2%80%99+.+1.+Certain+arguments+of+the+contrary+opinion+have+been+solved+elsewhere%2C+or+will+have+to+be+solved+below%3B+for+certain+arguments+are+directed+immediately+to+proving+that+the+divine+will+totally+precedes+our+wills%2C+so+that+in+no+way+does+it+wait+for+them.+But+these+have+been+solved+elsewhere.+Other+arguments%2C+however%2C+contend+immediately+and+directly+that+the+application+of+God+to+concur+with+free+choice+would+be+confused%2C+blind%2C+and+fortuitous%2C+if+it+were+to+depend+on+a+condition%2C+provided+that+free+choice+should+will.+Nevertheless+we+shall+show+this+inference+to+be+null+below+in+disputation+45+and+the+following.+2.+But+the+following+objections+seem+to+be+proper+to+the+present+undertaking.+The+first+is%3A+Inefficacy+of+will+is+an+imperfection%3B+therefore+no+will+of+God+is+inefficacious.+It+is+confirmed%2C+because+the+desire+of+a+thing+not+to+be+obtained+by+its+nature+is+apt+to+sadden+and+afflict+the+one+desiring.+It+is+answered%3A+Inefficacy+is+an+imperfection+when+it+proceeds+from+impotence+of+the+will.+But+when+the+will+could%2C+if+it+willed%2C+effectively+obtain+any+object+whatsoever%2C+and+yet+does+not+will+to+obtain+it+effectively%2C+but+only+to+desire+it+ineffectively%3B+then+rather+it+is+a+perfection+of+the+will%2C+and+a+dominion+over+itself+and+over+its+power.+It+is+confirmed%2C+since+to+will+not+to+produce+other+worlds+is+not+an+imperfection%2C+but+rather+a+perfection%3B+therefore+likewise+to+will+not+to+produce+effectively+free+actions%2C+but+only+to+supply+to+them+a+sufficient+concurrence%2C+will+not+be+an+imperfection.+To+the+confirmation+it+is+answered%3A+if+the+desired+thing+is+not+obtained+on+account+of+a+defect+of+power%2C+or+if+the+desired+thing+increases+in+some+way+the+happiness+of+the+desiring+will%3B+then+not+to+obtain+that+thing+can+of+itself+sadden+and+afflict.+But+to+God+neither+is+there+lacking+power+to+obtain%2C+nor+is+the+happiness+of+God+increased+in+anyway+by+the+obtaining+of+the+desired+thing.+3.+The+second+objection+is%2C+that%3A+A+conditional+volition+is+proper+to+a+will+which+cannot+obtain+that+good+without+the+condition+appended%3A+just+as+a+conditional+will+of+retaining+wares+in+a+storm+%5Bon+the+sea%5D+is+proper+to+a+will+which+cannot+avoid+shipwreck+unless+a+jettison+of+the+wares+be+made.+It+is+confirmed%2C+because+that+will+of+the+merchant+would+effectively+preserve+the+wares%2C+if+he+could+without+danger%2C+or+inconvenience%2C+and+difficulty.+But+God%2C+without+danger%2C+inconvenience%2C+and+difficulty%2C+could+have+saved+all+men%2C+if+He+willed.+Therefore+neither+by+a+conditional+will+does+He+will+their+salvation.+4.+It+is+answered%3A+By+denying+the+first+antecedent.+For+although+the+will+be+omnipotent%2C+and+can+without+an+appended+condition+obtain+such+a+good%2C+nonetheless+most+wisely+and+most+powerfully+it+uses+a+conditioned+volition%2C+when+another+greater+good%2C+incompatible%2C+is+loved+by+an+efficacious+volition%2C+which+depends+on+the+aforesaid+condition.+But+the+%5Bproposed%5D+greater+good+is+a+better+administration+of+the+universe%2C+and+a+more+illustrious+manifestation+of+divine+justice+together+with+mercy+requires+that+the+salvation+of+all+be+loved%2C+as+much+as+regards+God%2C+efficaciously%3B+nor+does+it+allow+that%2C+by+the+antecedent+will+of+God%2C+impediments+of+salvation+be+decreed+and+procured%3B+yet+at+the+same+time+it+requires+that+many+men+be+so+left+to+their+own+choice+that+they+be+permitted%2C+if+they+will%2C+to+resist+the+aforesaid+will+of+God.+Since+therefore+this+greater+good+efficaciously+willed+by+God+implies+a+contradiction+with+the+salvation+of+those+same+men+efficaciously+willed%2C+for+that+reason+God+most+wisely+and+most+powerfully+appends+a+condition+to+His+will%2C+depending+upon+the+choice+of+men.+For+this+volition+satisfies+the+natural+propensity+and+benevolence%2C+which+He+professes+toward+men%2C+even+the+reprobate%2C+without+dissimulation.+It+is+confirmed%3A+By+the+example+of+the+human+will+of+Christ+the+Lord%2C+to+whom+there+was+not+lacking+the+power+of+avoiding+death%2C+according+to+that+of+Mt.+26%3A+%E2%80%9CDo+you+think+that+I+cannot+ask+my+Father%2C+and+He+will+provide+for+Me+now+more+than+twelve+legions+of+angels%3F%E2%80%9D+and+Jn.+10%3A+%E2%80%9CI+lay+down+my+life%2C+that+I+may+take+it+again.+No+one+takes+it+from+Me%3B+but+I+lay+it+down+of+Myself.%E2%80%9D%0A%0A%E2%80%94+Diego+Ruiz+de+Montoya%2C+Commentaries+%26+Disputations+on+the+First+Part+of+St.+Thomas%2C+on+the+Will+of+God+%26+its+Proper+Acts%2C+%28Lugduni%3A+Prost%2C+1630%29%2C+Quest.+19%2C+On+the+Will+of+God%2C+Disputation+20%2C+%E2%80%98It+is+explained+whether+the+antecedent+will+is+conditional%2C+and+whether+it+is+formally+concerned+with+the+means%2C+insofar+as+they+are+means%E2%80%99+tr.+AI+by+The+Faith+Received+Ruiz+%281562-1632%29+was+a+Spanish+Jesuit+theologian+who+fundamentally+was+on+the+side+of+those+affirming+Middle+Knowledge+in+the+De+Auxiliis+controversy%2C+who+yet+sought+to+bridge+the+difference+with+a+formulation+which+came+to+be+critiqued+by+both+Jesuits+and+Dominicans.+Ruiz+was+a+favorite+of+John+Davenant.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e99793f4b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9e99793f4b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=Section%204%2C%20%E2%80%98On%20the%20imperfections%20which,I%20lay%20it%20down%20of%20Myself&amp;text=Section%204%2C%20%E2%80%98On%20the%20imperfections%20which%20an%20inefficacious&amp;text=Me%3B%20but%20I%20lay%20it%20down%20of%20Myself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>III. For the will of God is two fold, the one is his decree, the other is his commandment. The decree of God, belongeth to the providence of God, and the commandment of God, belongeth to his justice; By his decree, he doth appoint and dispose the events of things; by his commandment he doth govern our actions. By the former will, God doth appoint what he will have done; by the latter, what he would have us do. To the former all creatures obey, even the Devils themselves; to the latter only the faithful, and yet not that perfectly.</p></blockquote>

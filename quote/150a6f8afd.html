<main class="wrap"><figure class="quote" id="q-150a6f8afd" data-kw="">
<blockquote><p>The nature and use of the law (which goes before the covenant of grace) having been unfolded, we must now treat of the covenant itself. Since it is of the greatest importance in theology (being as it were the center and bond of all religion, consisting in the communion of God with man and embracing in its compass all the benefits of God towards man and his duties towards God), our highest interest lies in rightly knowing and observing it. Hence the discussion of it demands peculiar accuracy (akribeian), that the truth may be confirmed against the errors by which Satan has endeavored in almost every age to obscure and corrupt this saving doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 12.1.1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>I answer that, Everything is said to be good so far as it is perfect; for in that way only is it desirable (as shown above, AA. 1, 3). Now a thing is said to be perfect if it lacks nothing according to the mode of its perfection. But since everything is what it is by its form (and since the form presupposes certain things, and from the form certain things necessarily follow), in order for a thing to be perfect and good it must have a form, together with all that precedes and follows upon that form. … Further, upon the form follows an inclination to the end, or to an action, or something of the sort; for everything, in so far as it is in act, acts and tends towards that which is in accordance with its form;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 5, art. 5, Whether the essence of goodness consists in mode, species and order?, I answer that</span></figcaption>

<blockquote><p>And now, before we close, let us once more entreat you who are unconverted to turn to Jesus. Could ministers but give you some faint idea of Christ’s willingness to save you! If any soul here can declare that it is willing to receive Christ, let it know that Christ is yet more willing to save and to bless. He does not wish you to remain an hour longer a stranger to his love. Why did He suffer? Why did He die? Oh! not merely that He might be glorified in your destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-c-burns.html">William C. Burns</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of William Chalmers Burns</cite>, ed. Parisis &amp; Link (†1868; 2011), ch. 18, pt. 5, The Secret Place, p. 186</span></figcaption>

</figure><figure class="quote" id="q-5c95a48cd0" data-kw="">
<blockquote><p>To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1.450.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

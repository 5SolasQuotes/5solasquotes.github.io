<blockquote><p>4. Q. By what names is it usually known?

A. It is usually called the Lord’s Supper, the Eucharist, or the Communion.

5. Q. Why is it called the Lord’s Supper?

A. Because it was instituted by Christ immediately after he had eaten the Paschal Supper with his disciples, and is to be regarded by Christians as a feast in honour of their Lord.

6. Q. Why is it called the Eucharist?

A. Because it is an occasion of special and solemn thanksgiving to God for his goodness in giving up his own Son to death for our salvation—the term Eucharist being derived from a word which signifies thanksgiving.

7. Q. Why is it called the Communion?

A. Either because it is a communion with Christ the Saviour, or because it is a communion with one another as disciples of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-thomson.html">Andrew Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism for the Instruction of Communicants in the Nature and Uses of the Sacrament of our Lord’s Supper, and in the Doctrines and Duties connected with that Ordinance</cite>, (Edinburgh: William Ritchie, [1807]), p. 1.</span></figcaption>

<blockquote><p>Must those who feel spiritually weak abstain from participation in the Lord’s Supper, from listening to the divine Word and from the prayers, because they think they have no faith or question whether they have any?

Answer: By no means, for God must be sought with constant yearning, also when the feeling of his nearness is not experienced. In addition, it is by these means that the life of the Spirit is maintained, just as we eat food to preserve life, even though we have neither desire nor appetite for it.</p></blockquote>

<blockquote><p>The terms of Communion in the Reformed Presbyterian Church are certainly more comprehensive than those in force in any other denomination. It is necessary that all who become members acknowledge the inspiration and infallibility of the Old and New Testaments; the agreeableness of the Confession of Faith and Catechisms (Larger and Shorter) with the Word of God; the divine right of Presbyterianism; the perpetual obligation of the National Covenant and Solemn League and Covenant; practical dissent from all national constitutions that ignore the Lord Jesus Christ as King of nations, and the duty of adorning the doctrine of God our Saviour by a life of godliness. No Church in the world has a larger creed for membership. […]

The popular cry now is for a brief creed, and the avowed object of this cry is that larger numbers may be led into the membership of the Church. The more comprehensive and intensive the creed the fewer must the members of the Church be; the fewer and less explicit the articles of the creed the more numerous will be the members. A creed with many articles is said to be a stumbling-block in the way of those without, to burden the Church and diminish her influence. It is true, doubtless, that a large creed is the occasion of much unpopularity meanwhile, but the adoption of the policy implied in the objection would abolish all creeds, however brief and narrow. […] To remove any truth from the creed of a Church is to strip her of part of the armour with which she is to gird herself for the duty required of her by her great Commander-in-chief. It is to limit and narrow the area on which she stands, and so bind her arms – her powers and influence. “The faith which was once for all delivered unto the saints” is one body; it is a perfect unity; and the Church that attempts to mutilate that perfect body incurs a dread responsibility. Her offence against the Lord is aggravated when this deed is perpetuated under the profession of breadth and enlargement. When the policies of ecclesiastical procedure have the peacock feathers of liberality and charity, with which they have been adorned, plucked off, they stand revealed as vultures which, with unrestrained appetite, would devour the whole body of revealed truth, and reduce the Christian and the Church to a condition of lamentable leanness – the mere skeletons of Christians and Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-kerr.html">James Kerr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Presbyterianism: its special claims</cite>, (Belfast, 1895), pp 5-6.</span></figcaption>

<blockquote><p>An act of Christ alone is not sufficient to form a command; for although He consecrated in white wine, or at night, for example, He did not on that account command us to consecrate” (3. Thom. De Sacra. +). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>

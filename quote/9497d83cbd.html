<blockquote><p>In arguing for a national endowment of true religion, David Scott did not demand that the precise form of endowment that was provided in the Hebrew commonwealth be slavishly followed. Instead, he argued that the precise manner of such provision was a circumstantial matter, which had to be applied differently in varying circumstances. This, of course, is a correct way to interpret the moral-positive judicial laws, and why we confess that the “general equity thereof” still applies and deny that every nation must be an exact replica of Old Testament Israel:

A national provision for the support of religion is the duty inculcated by the example of the Jewish commonwealth without reference to peculiarity of circumstances; these may modify the details of the arrangement, but the example itself holds up for imitation the universal moral principle, that it is the duty of a civil community to make a competent provision for the maintenance of true religion within the national domain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 274.</span></figcaption>

<blockquote><p>15. When the [English] Parliament’s armies were worsted and weakened by the King [Charles I], and they found themselves in danger of being overcome, they entreated help from the Scots, who taking the advantage of their straits, brought in the [Solemn League and] Covenant as the condition of their help; which the Parliament rather accepted [in 1643] than they would lose them, which at first was imposed on none by force. But (to pass by all other considerations) was judged by many wise men, to be an occasion of division, as making the opposition to prelacy to be the terms of the kingdom’s unity and concord, when they might know that the king and a great, if not the greatest part of the kingdom, were of the contrary mind; and so it was thought to be (as the Papal terms of unity) a means of unavoidable division: But others thought that because it tied them to no endeavors, but in their places and callings, they might take it.

16. The Assembly of divines at Westminster were men that had lived in conformity, except about eight or nine of them and the Scots: But being such as thought conformity lawful in case of deprivation, but the things imposed to be a snare, which should be removed if it could be lawfully done, they also received the Covenant, but were divided about the sense of the word ‘prelacy,’ many professing their judgment to be for moderate episcopacy; whereupon the describing additions ‘Archbishops, bishops, deans, archdeacons’ were added. And upon such a profession that it disclaimed not all episcopacy, Mr. [Thomas] Coleman is said to have given the Covenant to the House of Lord’s…

17. This Covenant and vow was taken by the Parliament and by their garrisons and soldiers that would voluntarily take it, as a test whom they would trust; the rest being had in suspension: And after the wars, by such as were ordained ministers and by the king’s adherents when they made their compositions: so far was it afterward imposed. But many ministers and gentlemen refused it, and so did Cromwell ‘s soldiers, and in many counties few did take it. … 32. The persons that were silenced [in the Great Ejection of 1662] were not of one mind and measure about all the things imposed on them:

1. Some of them were episcopal, and for as much as Richard Hooker writes for, and were against the Covenant (and never took it) and the Parliament’s War, and were for the liturgy and ceremonies and had conformed had these been all that had been imposed, who yet were cast out of fellowships and ministry: Yea some had suffered for the king, and been ruined in their patrimony, some imprisoned for him, and some had been in arms for him.

2. Besides these, and other episcopal nonconformists, some and very many, and we think the greatest part of any one, were such disengaged pacificators as we before mentioned about associations:

3. Some were for the presbyterian government, and 4. Some for that called Independent, which were comparatively but few. … … 35. As to the late civil wars which some most loudly charge on the nonconformists, this is the truth, that the several parties charge the beginning of that war on one another… The truth is: …3. That some few that had been in the king’s army or cause, and that were sufferers for him, and were against the Covenant and the Parliament’s war, were nonconformists… … 37. The 2,000 silenced [in 1662] were not a quarter of the ministers of England, who were in possession before the return of the bishops: so that it is evident that above three-fourth parts of the ministers that kept in under the Parliament and Protector [Cromwell] (notwithstanding Covenant, [Westminster’s] Directory and all) did prove conformists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 7, pp.</span></figcaption>

<blockquote><p>…about a law there are these affections (if I may call them so): There is an interpretation, a dispensation, or relaxation; and these differ from an abrogation. For the former do suppose the law still standing in force, though mitigated; but Abrogation is then properly, when a Law is totally taken away. And this abrogation arises sometimes from the express constitution at first, which did limit and prescribe the time of the law’s continuance: sometimes by an express revoking and repealing of it by that authority which made it, sometimes by adding to that repeal an express law commanding the contrary. Now it may be easily proved that the Ceremonial and Judicial laws, they are abrogated by express repeal. The Judicial Law: 1 Pet. 2:13, where they are commanded to be subject to every ordination of man: and this was long foretold Gen. 49:10. The Lawgiver shall be taken from Judah. The Ceremonial Law that is also expressly repealed Acts 15 and in other places… In the second place, if we would speak exactly and properly, we cannot say, in any good sense, that the Moral Law is abrogated at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), pp. 211-12</span></figcaption>

<blockquote><p>Paul made himself a servant unto all, that he might gain the more, though he was free from all men (1 Cor. 9:19). They submitted themselves to all the injuries and affronts of men; to be accounted the plagues and troublers of the world, and as the scorn and off-scouring of all things, and a gazing stock to Angels and to men (1 Cor. 4:12-15; Acts 24:5). And are you better than they? If you are, you are more humble, and not more proud.</p></blockquote>

<blockquote><p>If it be asked, whether the consent of parents be essential to marriage? the common sentence will resolve it, Multa impediunt matrimonium contrahendum, quae non dirimunt contractum, so that consent is necessary, necessitate praecepti, sed non necessitate medii [by the necessity of precept, but not by a necessity of means]; though by human constitution such marriages may be disallowed, and the issue repute as unlawful, but the marriage cannot be annulled, l. 11. de stat. hom. l. 13 §. 6. de Adult, by which laws, not only the Issue of such marriages are excluded from succession, but the marriage itself insinuate to be null, which human constitutions cannot reach, though the magistrate or minister, celebrator of the marriage, may refuse to proceed without consent of the parents; as by the law and custom of Holland, Art. 3. Ord. Pol. It is statute that… where the parties are minor, they be not married without consent of their parents; and where they are both major, intimation must be made to the parents, and if they appear not, their consent is presumed; and if they do appear and dissent, they must condescend upon the reasons, that it may be cognosced whether they be sufficient or not: And if the marriage do otherways proceed, they account it null… neither do the civil constitutions of princes annul or dissolve marriage, whatever they may work as to the interest of the married persons… Yea, between Jews and Christians, for diversity of religion cannot annul it.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7cb199e3ab" data-kw="Forensic">
<blockquote><p>The Hebrew word to which the Greek dikaioun answers and the Latin justificare, is used in two ways in the Scriptures—properly and improperly. Properly the verb is forensic, put for “to absolve” anyone in a trial or “to hold” and to declare “just”; as opposed to the verb “to condemn” and “to accuse” (Ex. 23:7; Dt. 25:1; Prov. 17:15; Lk. 18:14; Rom. 3–5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.1.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/forensic-not-moral.html">Forensic, Not Moral</a> › <a href="../topics/justification/forensic-not-moral/the-meaning-of-the-word-justify.html">The meaning of the word “justify”</a></span><span class="t"><a href="../topics/justification/forensic-not-moral.html">Forensic, Not Moral</a> › <a href="../topics/justification/forensic-not-moral/a-judicial-sentence.html">A judicial sentence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41a65a8c0f" data-kw="">
<blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)</span></figcaption>

<blockquote><p>In the Bible the verb “justify” means “to count righteous” not “to make righteous.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sinclair-ferguson.html">Sinclair Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assured by God</cite>, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/forensic-not-moral.html">Forensic, Not Moral</a> › <a href="../topics/justification/forensic-not-moral/declared-not-made-righteous.html">Declared, not made, righteous</a></span><span class="t"><a href="../topics/justification/forensic-not-moral.html">Forensic, Not Moral</a> › <a href="../topics/justification/forensic-not-moral/the-meaning-of-the-word-justify.html">The meaning of the word “justify”</a></span></div>

</figure><figure class="quote" id="q-3e2d83e76c" data-kw="">
<blockquote><p>It never was the doctrine of the Reformation, or of the Lutheran and Calvinistic divines, that the imputation of righteousness affected the moral character of those concerned. It is true, whom God justifies he also sanctifies; but justification is not sanctification, and the imputation of righteousness is not the infusion of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @5Solas2</cite>, Oct 21, 2024</span></figcaption>

</figure><figure class="quote" id="q-c4f1074b78" data-kw="Forensic">
<blockquote><p>Justification is opposed to condemnation: “Who shall lay anything to the charge of God’s elect? It is God that justifieth. Who is he that condemneth?” (Rom. 8:33, 34). As therefore accusation and condemnation occur only in a trial, so also justification. Nor can it be conceived how God can be said to condemn or to justify, unless either by adjudging to punishment or absolving us from it judicially.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.1.7</span></figcaption>

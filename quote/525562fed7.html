<blockquote><p>Question 2. Is A Magistrate Held Responsible To Render Account Of All His Laws To His Subjects? And How Far Are They To Presume Such Laws To Be Just? After this foundation has been laid we would also inquire into certain other questions which would appear to be germane to this discourse that the consciences of many may be satisfied. First the question is raised whether the magistrate is held to render account of all his laws to any man soever so as to offer proof that they be fair and in accordance with the precepts of religion. I answer that he is not so held; nay more, that it is fair that all virtuous subjects should regard their lords in the light of virtue and should not presume of suspect anything unjust concerning them; nay, that it is not becoming that men in private station should inquire over curiously even concerning doubtful matters beyond their comprehension or station in life. If, however, the conscience of some be at a loss, they can and are even under an obligation to examine (albeit discreetly and in a peaceful manner) what elements of reason and justice are to be found in the command by which they are bidden or forbidden to do something; for the word of the apostle abides: “whatsoever is not of faith (that is while the conscience is in doubt whether that is being done justly or not) is sin”. But if what is commanded is openly sinful or unjust, then indeed that which has been said above applies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers Over Their Subjects &amp; the Duty Of Subjects Towards Their Rulers</cite>, (1574)</span></figcaption>

25562fed7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-the-mere-will-determination-judgment-or-saying-so-of-authorities-is-in-insufficient-ground-of-faith-obedience-that-authorities-are-never-to-act-or-require-something-without-a-naturally-mo/#:~:text=Question%202.%20Is%20A%20Magistrate%20Held,which%20has%20been%20said%20above%20applies&amp;text=Question%202.%20Is%20A%20Magistrate%20Held%20Responsible%20To&amp;text=indeed%20that%20which%20has%20been%20said%20above%20applies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59fc4a82a3" data-kw="">
<blockquote><p>By which it does manifestly appear that they would bear dominion over our consciences, not as lords only, by requiring the willing and ready assent of our consciences to those things which are urged upon us by their sole will and authority, but even as tyrants, not caring if they get so much as constrained obedience, and if by their authority they can compel conscience to that which is contrary to the [Greek] and full persuasion which it has conceived. It will be said that our consciences are in an error, and therefore ought to be corrected by the sentence of superiors, whose authority and will does bind us to receive and embrace the ceremonies, though our consciences do condemn them. Answer: Giving and not granting that our consciences do err in condemning the ceremonies, yet so long as they cannot be otherwise persuaded, the ceremonies ought not to be urged upon us, for if we be made to do that which our consciences do condemn, we are made to sin. Rom. 14:23. It is an audacious contempt in Calvin’s judgment to do any thing repugnante conscientia.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Edinburgh, 1637) | Pt. 1, ch. 5, p. 16</span></figcaption>

<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in:

1. Propounding and expounding God’s laws.

2. In executing them and defending them from the violence of men.

3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>

<blockquote><p>6. Why holds he us [to be] contemners of the Church for not receiving the five Articles of Perth [1618]? We cannot be called contemners for not obeying, but for not subjecting ourselves, wherewith we cannot be charged. Could he not distinguish betwixt subjection and obedience? Art thou a doctor in Israel, and knowest not these things? Nay, art thou a conformist, and knowest not what thy fellow conformists do hold? (Field, Of the Church, bk. 4, ch. 34 &amp; Bilson, apud Parker of the Cross, pt. 2, p. 33)</p></blockquote>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [prelate] Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches and Gregory de Valentia, as I show[ed] before… …when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo [therefore], it [the Church’s judgment] cannot remove my doubting and beget faith…

7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7456f1d0c7" data-kw="">
<blockquote><p>For our wills and affections; we should be ready to cross and bend them against all the noise of corrupt delights; to pluck out our right eye, cut off our right hand; to be crucified to the world; to be disposed of by God’s providence, cheerfully in any course, whether of passive obedience to have a mind submitting unto it, and rejoicing in it; or of active obedience to obey him, contrary to the stream and current of our natural desires; though it be to offer unto him our Isaac, our closest and choicest affection; though to shake off the child that hangeth about our neck, to stop our ear to the voice of her that bare us, to throw the wife out of our bosom, when they shall tempt us to neglect God, to spit out the sweetest sin that lies under our tongue; briefly, to take under Christ’s banners the Roman oath, to go and do where and whatsoever our great captain commanded; neither for fear of death, or dread of enemy, to forsake service, or resign weapon till death shall extort it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), iii, 58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d5fb4690b1" data-kw="">
<blockquote><p>But our disputation tendeth not to the confounding of the offices and duties of the magistrate and ministers of the church, as that we would have the king to preach, to baptize, and to minister the Lord’s supper; or the priest, on the other side, to sit in the judgment-seat, and give judgment against a murderer, or by pronouncing sentence to take up matters in strife. The church of Christ hath, and retaineth, several and distinguished offices; and God is the God of order, and not of confusion.

Hereunto tendeth our discourse, by demonstration to prove all men, that the magistrate of duty ought to have a care of religion, either in ruin to restore it, or in soundness to preserve it; and still to see that it proceed according to the rule of the word of God. For to that end was the law of God given into the king’s hands by the priests, that he should not be ignorant of God’s will touching matters ecclesiastical and political, by which law he had to govern the whole estate of the realm.</p></blockquote>

<blockquote><p>[T]hat God, for the better settling of piety and honesty among men, and the repressing of prophaneness [sic] and other vices, hath established two distinct powers upon earth: the one of the keys, committed to the Church; the other of the sword, committed to the civil magistrate. That of the keys is ordained to work upon the inner man; having immediate relation to the remitting of sins.That of the sword is appointed to work upon the outward man; yielding protection to the obedient, and inflicting external punishment upon the rebellious and disobedient.

By the former, the spiritual officers of the Church of Christ are enabled to “govern well,” to “speak and exhort” and “rebuke with all authority;” to “loose” such as are penitent, to commit others unto the Lord’s prison, until their amendment, or to bind them over unto the judgment of the great day, if they shall persist in their wilfulness and obstinacy. By the other, princes have an imperious power assigned by God unto them, for the defence of such as do well, and executing “revenge and wrath” upon such as do evil; whether “by death or banishment, or confiscation of goods, or imprisonment,” according to the quality of the offence.

When St Peter, that had the keys committed unto him, made bold to draw the sword, he was commanded to put it up; as a weapon that he had no authority to meddle withal. And on the other side, when Uzziah the king would venture upon the execution of the priest’s office, it was said unto him, “It pertaineth not unto thee Uzziah to burn incense unto the Lord; but to the priests the sons of Aaron, that are consecrated to burn incense.” Let this therefore be our second conclusion: that the powers of the sword and of the keys are two distinct ordinances of God; and that the prince hath no more authority to enter upon the execution of any part of the priest’s function, than the priest hath to intrude upon any part of the office of the prince.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A speech delivered in the castle chamber at Dublin, the 22d of November, anno 1622. At the censuring of certain officers, who refused to take the oath of supremacy</cite>, (1622) in The whole works of the most Rev. James Ussher, D.D., Lord Archbishop of Armagh, and primate of all Ireland (16 vols, Dublin, 1864), 2: 462-63.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-183ccf445b" data-kw="">
<blockquote><p>We entreated them to stand to the declaration, to let us go on against our enemy, and to let all debates alone till a free parliament and a general assembly [was had]. They told us we were for an indulgence, and they would sheathe their swords as soon in them who owned it as they would do in many of the malignants. We wished that we had known that sooner. We said, we told them we were not for an indulgence more nor they, and we would subscribe it if they would not believe us. Robert Hamilton told us that they owned Cameron, and were of his judgment plainly. I arose and told Robert Hamilton, that I had a wife and five children, and that I had a little bit of an estate, and that I was come to hazard all and my life, to get the yoke of prelacy and supremacy removed; but for ought that I saw, they intended to tyrannize over our consciences, and lead us to a worse snare nor we were into; and for my part, I would fight till the last drop of my blood before I went one step-length with them. And I told Mr. Cargill, he rendered himself odious by his naughty principles. He was very much offended with me. When they saw we were resolved to leave them, they drew by, and when they came to us they condescended to stand to the declaration, and to let all debates alone, and to give it under their hands: so we were all glad and merry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell.</cite>, p. 470</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-1a1e1e72f4" data-kw="">
<blockquote><p>[James] Renwick, he was told, would have to subscribe the Confession and Catechisms of the Dutch church, as was mandatory in all ordinations; otherwise there was no prospect of the Presbytery ordaining him. Hamilton asked to see a copy of the Confession, and found his worst fears confirmed… there were vestiges of pre-Reformation practices–ceremonial, liturgy, and the role of the civil power in the church–which were reflected all too plainly in the [Belgic] Confession. Hamilton on seeing this, urgently consulted Renwick. Together they had to accept that Renwick could not subscribe the [Belgic] Confession, since to do so would be to compromise the basic principles of the Scottish Reformation and Covenants… …he [Hamilton] went round the ministers of the Presbytery and pleaded with them that, if Renwick was to subscribe anything, ti should be the Confession and Catechisms of the Church of Scotland… they eventually assented.</p></blockquote>

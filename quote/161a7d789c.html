<main class="wrap"><figure class="quote" id="q-161a7d789c" data-kw="">
<blockquote><p>Q. Who receive the benefit of this Redemption wrought by Christ?

A. Only the Church, which is a company of men in every age that are God’s Elect, gathered by the power of Christ, &amp; separated from the World, unto the sincere profession of true Religion. …

Quest. What are the principal benefits we receive by Christ in this life?

Ans. Our Justification, and our Sanctification. …

Quest. What is our Justification?

Ans. It is the imputing of the active, and passive obedience of Christ unto us, whereby all our sins are forgiven, and we are made just before God. …

Quest. To whom is the Righteousness of Christ imputed?

Ans. Only to such as have a true Faith. …

Q. Who have a true faith?

Answ. Only such as rely upon the mercies of God, and the merits of Christ for their justification and all happiness. …</p></blockquote>

</figure><figure class="quote" id="q-97278baa58" data-kw="">
<blockquote><p>When God reveals some new truth to man, some truth of mighty import, and bearing immediately upon the eternal interests of the soul; or when (as oftener happens) some truth as old almost as the beginnings of Revelation, but which has long been obscured by the mass of human traditions which have gathered over it, is revived, and assumes its proper place, an amazing effect is produced. The history of the great doctrine of “Justification by Faith” affords a remarkable illustration of this.

That doctrine is so clearly revealed, and occupies so conspicuous a place throughout the sacred writings, that it is a matter of astonishment that any one who reads them should miss it. Yet, for long and weary ages, it was in a manner lost to man. God, indeed, always, even in the times of darkest superstition, had a band of witnesses upon earth. For centuries they were so few and so despised, that they might well be called “hidden ones” Without exaggeration it may be said, that to Christendom – that great truth was lost.

The discovery and revival of it at the Reformation, was life from the dead. A new impulse – the freshness and glory of a new and spiritual existence – was throughout Europe communicated to the human mind. The earth is not more invigorated, when the breezes and showers of spring, with the potent alchemy of the sun now gaining the ascendant, dispel the fogs, and relax the frozen grip of winter, causing the vegetation to teem up, and mantle bill and valley, than were the minds of men by that blessed change, for which we are too stinted in our gratitude to the Most High. To this so celestial doctrine, and those others which go hand in hand with it in fair procession, we owe all those privileges which we so justly esteem, and by which the ages since the Reformation are distinguished from those that went before, by all that is Christian in sentiment pure in principle, and charitable in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-clarkston-fairbairn.html">John Clarkston Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Baptist in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-2075fbfe66" data-kw="">
<blockquote><p>Here we are reminded to make sure that we are not cut off from the truth of the gospel of God. There are two ways in which we can be cut off, one on the left and the other on the right. This is because the truth of the gospel has two parts to it. The right-hand one is justification, which comes only by faith in Christ and is for the salvation of everyone who believes, whether Jew or Gentile. The left-hand side is the new creation, or newness of life or renewal of the mind.

Those who teach that justification is freely imputed on the basis of faith in Christ alone and who do not confuse it with the doctrine of merits and self-righteousness that comes from works, and who also teach that faith is not dead and useless but active in love, and in the renewal of the mind that comes by the Spirit of Christ are on the right track toward the truth of the gospel.

Those who teach self-righteousness and human merits cut people off from it on the right, and those who preach faith in such a way as to make worldly people feel secure without having to change their lives and allow them to live according to the desires of the flesh without repenting of them, cut them off on the left. In other words, the papists cut people off on the right and the pseudo-evangelicals cut them off on the left.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<main class="wrap"><figure class="quote" id="q-f207ede92f" data-kw="">
<blockquote><p>And does not reason confirm the same truth? For, 1st, if God be not just, whence is there any justice? Either there would be no justice at all, or if there was any, it would not proceed from God; or if it did, it must proceed from one who had none; each of which particulars is absurd.

Besides, 2d, inasmuch as the Lord is governor of the whole universe, he would degenerate into a tyrant if he was not just; and, 3d, seeing Jehovah is judge of all the earth, how could he judge aright without being just himself? Neither can it be otherwise but that God should be just, seeing that he is absolutely perfect. All confess justice to be an excellency, involving no imperfection in it, and therefore it cannot bet wanting to that being, who is absolutely and infinitely perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-tennent.html">Gilbert Tennent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Justice of God in Sermons and Essays by the Tennents and their Contemporaries, Compiled by the Board</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>1224. Rom. 9:18, ‘God has mercy on whom He will have mercy, and whom He will He hardens.’ Ch. 11:32, ‘God has concluded them all in unbelief, that He might have mercy upon all.’ The first place is concerning the most free will and power of God, who may have mercy on whom He please; his antecedent will reaches to all men, his consequent will is restrained to the believers and unbelievers, and so He will have mercy of the faithful, that they may be saved, but he justly punishes and hardens the unbelievers and wicked men who resist his grace freely offered unto them.</p></blockquote>

</figure><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>

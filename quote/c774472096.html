<blockquote><p>[For He does not punish from his heart] it arises not from God’s voluntary desire, but from the sin of man that God punishes; [and makes sorrowful the children of men] gives them cause by afflicting them to be vexed and grieved. Doctrine. [for etc.] sin constrains the Lord to afflict his dearest children: for the reasons hereof, see verse 27. … Doctrine. [not punish from his heart] God takes no delight in afflicting his children, Ps. 81:13; Isa. 1:24. The use is to teach us, first, to abhor their profaneness that say God sports Himself in punishing man. Secondly, by his example, to censure others with all remorse and pity, not delighting to disgrace them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-udall.html">John Udall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Lamentations of Jeremy... (London: Orwin, 1593), ch. 3, on v. 33</cite>, p. 127</span></figcaption>

<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions</cite>, pp. 560-61</span></figcaption>

</figure><figure class="quote" id="q-25871be9fa" data-kw="">
<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God… (d. 1680; London: Newman, 1682), Goodness of God</cite>, pp. 584-85</span></figcaption>

</figure><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.”

— Andrew Willet, Hexapla, that is a Six-fold Commentary upon… Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6these+considerations+must+be+premised%3A+1.+That+mercy+is+otherwise+in+God+than+in+man%3A+in+man+indeed+it+is+a+grief+or+compassion+conceived+upon+another%E2%80%99s+misery%3A+but+in+God+it+is+only+a+propension+and+readiness+of+the+divine+will+to+help+those+which+are+in+misery.+2.+Mercy+in+God+either+signifies+the+inclination%2C+power%2C+faculty+and+property+to+show+mercy%2C+and+this+is+natural+in+God%3A+or+the+act+and+exercising+of+that+property+toward+the+creature%2C+and+this+is+so+natural+in+God+as+yet+it+is+directed+by+his+will.+3.+A+thing+is+said+to+be+natural+two+ways%3A+Either+that+which+only+proceeds+from+the+instinct+of+nature%2C+as+the+fire+naturally+burns%3A+or+that+whereunto+nature+inclines%2C+yet+not+without+direction+of+the+will%2C+as+thus+a+man+is+said+to+speak%2C+to+understand+naturally%3A+So+God+is+both+ways+naturally+merciful%2C+in+Himself+the+first+way%3B+toward+his+creatures+the+second.+Now+to+the+arguments+we+answer%3A+1.+The+apostle+%5Bin+Rom.+9%3A18%5D+speaks+not+of+the+natural+property%2C+but+of+the+act+of+mercy%2C+which+is+directed+by+the+will+of+God.+2.+All+the+natural+properties+which+are+in+God+He+always+uses+not%2C+nor+towards+all%3A+as+his+justice%2C+power%2C+longanimity%2C+mercy%3A+they+are+always+in+God%2C+but+He+exercises+them+as+it+pleases+Him.+3.+Justice+and+mercy+are+not+contrary%2C+but+cruelty+is+opposed+to+mercy%3A+neither+is+there+any+contrariety+in+God%2C+but+in+the+effects+in+diverse+subjects%3A+as+the+Sun+with+the+same+heat+mollifies+the+wax+and+hardens+the+clay.+4.+Neither+are+these+properties+unequal+in+God%2C+but+the+effects+and+acts+only+are+unequal%2C+as+it+pleases+God+to+dispose+in+his+freewill.%E2%80%9D%0A%0A%E

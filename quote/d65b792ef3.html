<main class="wrap"><figure class="quote" id="q-d65b792ef3" data-kw="">
<blockquote><p>There is a purpose in affliction, in each, in all affliction, in the nature of it, in the extent of it, in the duration of it. It does not follow because an individual, or a family, have been afflicted, that they have been sinners above all others. … But it may be fairly concluded by others that they have something to learn — it may be inferred by themselves. They may not know it. They may require to come to God to be instructed in the matter. They may require to come saying, Shew me, Lord, why thou contendest with me!

But I believe it has been admitted by all sufferers, not merely that they required the discipline of affliction, speaking generally, but that they needed that peculiar and special affliction, to accomplish a certain and now ascertained end — an end which was indicated by the affliction wherewith they had been visited. Not that they would allege that no other discipline could have produced this effect, but they perceive a wisdom in that which is employed of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-thorburn.html">Joseph Thorburn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sanctified Affliction (November 1844) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>It is commonly said by others who do not know what melancholy [depression] is, “Why do you think and pore so much? Divert yourselves; think of something else.” But it is no more possible for people, where this disease comes with violence, to divert their thoughts than it is possible for a man to be alert in apoplexy or calm in a raging fever; no more than a man who has a broken arm or leg can walk and act as he used to do before.</p></blockquote>

<blockquote><p>I believe that God never expects us to feel no suffering or pain when it pleases Him to visit us with affliction. There are great mistakes upon this point. Submission to God’s will is perfectly compatible with intense and keen suffering under the chastisements of that will. Troubles in fact not felt, are no troubles at all. To feel trouble deeply, and yet submit to it patiently is that which is required of a Christian.</p></blockquote>

</figure><figure class="quote" id="q-248ce88d1e" data-kw="">
<blockquote><p>In the earlier years of his [Thomas E. Peck’s] religious history, he was subject to occasional fits of depression, but in later years these passed away. This is the common experience of men of unusual talents. They stand on the threshold of the great arena eager for the competition and thirsting for success, yet uncertain of themselves; their abilities untested; and the strong impulses to action checked and fretted with the doubt whether the venture will prove a source of satisfaction or distress.

In many cases this stage of the mental development produces moodiness and irritation; discontent with self breeds suspicion of others; and the manifestations of character become unpromising and perilous. In Dr. Peck’s case there was nothing of this; the firm texture of his mind, and his strong hold on the principles of religion, held down such effects of depressed feeling, and left him only to the grief it created, and to the silence of a steady endurance.

As he passed on, and the development of his intellect and his growth in grace expanded into maturity, his steadfast nature, with its underlying currents of lively and affectionate sensibility, grew equable in their habitual manifestations. His work, whatever it was, was always well and faithfully done, according to the law of his own exact and veracious conception of duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-r-vaughan.html">Clement R. Vaughan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biographical Sketch of Dr. T. E. Peck in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-3bd7c96cb1" data-kw="">
<blockquote><p>First; an earnest deprecation of an impending Judgment, is reconcilable with our Submission to the pleasure of God, declared by the Event. Our Saviour with humility and importunity desired the removing of the Cup of Bitterness. We must distinguish between God’s Law, and his Decree and Counsel; The Law is the Rule of our Duty, and requires an entire exact subjection in all our Faculties, even in our internal Desires, in the first motions of the Will; the least velleity, or rising of the Heart against the Divine Command, is irregular and culpable; for not only the acts of Sin are forbidden in every Command respectively, but all the incitations of Concupiscence, before the deliberate judgment of the Mind, or the actual consent of the Will. But the Decree of God is not the Rule of our Duty, and Secret, till manifested by the event of things. This being premised, the Reasons are evident why we may pray against an Affliction that threatens us, without violating our Duty.

First; Because Afflictions are Evils which the Will naturally declines, and are not desirable things in themselves. They are not beneficial and productive of our good by any proper efficacy and operation, but by the over-ruling Providence of God, and the gracious assistance of his Spirit. When Aaron‘s Rod was put into the Sanctuary, and became green and flourishing with Blossoms and Almonds, ’twas not from any inherent virtue of its own, but from the special influence of the Divine Power; for the other Rods remained dead and dry: thus the happy effects of the Afflicting Rod are from Divine Grace.

Secondly; There are proper Temptations that attend the afflicted State. Many are encompassed in a sad Circle, their Sins procure Afflictions, and their Afflictions occasion many Sins. Indeed, Tribulation that is sanctified, by a happy gradation worketh Patience; and Patience, Experience of the Divine Mercy; and Experience, Hope, and Hope maketh not ashamed. But when it meets with a stubborn Spirit, there are fearful descents of Sin: Tribulation excites Impatience, and Impatience causeth Perplexity, and that Despair, and Despair Confusion.

The Devil lays his trains in every condition, and sometimes by immoderate Sorrow, sometimes by inordinate Joy, doth mischief to the Soul. And as more perish by Surfeits than Abstinence, yet the Diseases that are caused by emptiness, are more dangerous and incurable than those that proceed from fullness: So more are ruined by Prosperity than Adversity: But the guilty Passions that ferment and rage in Adversity, are more pernicious, and more hardly tempered and subdued, than the Luxurious Appetites that are fomented and drawn forth by Prosperity. We are directed by our Saviour to pray, that we may not be led into Temptation, and to be delivered from all Evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great duty of resignation to the divine will in afflictions, enforced from the example of our suffering Saviour</cite>, (London: Brabazon Aylmer, 1684), pp 6-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

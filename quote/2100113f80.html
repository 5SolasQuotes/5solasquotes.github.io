<main class="wrap"><figure class="quote" id="q-2100113f80" data-kw="">
<blockquote><p>By this faith a Christian believeth to be true whatsoever is revealed in the Word for the authority of God himself … but the principal acts of saving faith have immediate relation to Christ, accepting, receiving, and resting upon him alone for justification, sanctification, and eternal life, by virtue of the covenant of grace.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bfb2c03381" data-kw="">
<blockquote><p>From all that has been said we can readily arrive at the following definition of faith: Faith is a heartfelt trust in Christ—and through Him in God—in order to be justified, sanctified, and glorified, leaning upon Christ&#x27;s voluntary offer of Himself and upon His promises that He will perform this to all who receive Him and rely upon Him to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian&#x27;s Reasonable Service</cite>, vol. 2, ch. 32</span></figcaption>

</figure><figure class="quote" id="q-b9f28c6ac5" data-kw="">
<blockquote><p>Believing commonly signifies an act of the understanding, yielding assent to testimony. But because the will tends to be moved upon that understanding, and to stretch itself forth to embrace the good allowed by it, therefore Faith aptly enough sets forth this act of the will also. … Hence Faith is carried to that good which is made ours by it; it is an act of election, an act of the whole man, which in no way agrees to a mere act of the understanding.</p></blockquote>

</figure><figure class="quote" id="q-159631b248" data-kw="">
<blockquote><p>Faith consists not in ignorance, but in knowledge--knowledge not of God merely, but of the divine will. We do not obtain salvation either because we are prepared to embrace every dictate of the Church as true, or leave to the Church the province of inquiring and determining; but when we recognize God as a propitious Father through the reconciliation made by Christ, and Christ as given to us for righteousness, sanctification, and life.</p></blockquote>

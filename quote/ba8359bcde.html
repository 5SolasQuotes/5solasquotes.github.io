<blockquote><p>II. This punishment (this disobedience having been posited) the divine nature first of all requires, for God is a consuming fire who cannot bear sin (Deut 4:24, Hab 1:13). Yet we do not want God to act irrationally (just as elementary fire), but most rationally, concomitantly to his nature but not antecedently, for he is a rational and intelligent fire who, although he can transfer the burning to another combustible thing, yet cannot suspend it totally:

      1. Because God hates and abhors sin to the utmost, and hatred (like all affections) belongs to God according to its effects, and signifies in him 1) opposition to the hated thing, 2) rejection and damnation and grave punishment of the one who perpetrates that hated thing, as even Vorstius teaches (Notes on Disp. 10 on God, thesis 20).

      2. God as the best being, by necessity of nature is zealous for his own glory, which is the end of all his actions, which does not happen unless by vindicating the contempt of himself which he suffers through sin, which is not expiated except through punishment.

      3. The supreme Lord by necessity of nature requires supreme acknowledgment of himself, which is denied to him through sin, which cannot be repaired except through the acknowledgment of the despiser by which he may experience how grave and sad is the contempt of his master. And these things are so true that even in civil affairs, neglect of his majesty cannot consist with the supreme magistrate; nor therefore through this is God rendered impotent, as the Socinian Gitichius deduces from this (Against Lucius, Argument 2). For he cannot deny himself (2 Tim 2:13) nor his glory. Secondly, the truth of the divine threats, by which the highest torments await sinners, demands this punishment (see the previous thesis).

III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied. But what can man do for this? His demerit is infinite (by the previous thesis)… IV… Hence fall:

      1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.).

      2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)?

      3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God.

      4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said.</p></blockquote>

<blockquote><p>LIII. But though nothing from without be the cause of God’s volition, yet, since He wills that there should be order in things (which order is placed principally in this, that [iliae] some things be the causes of others) just so far as God’s volition is borne towards those objects, it is as if it were the cause of itself as it is borne towards others: (Hos. 2:21-22) Thus the cause why He wills the condemnation of anyone, is this, because He wills the order of his justice to be observed throughout the universe. (Jn 6:40; Dt. 7:8)… … LVI. 1. The Divine Will is borne towards its object, either according to the mode of Nature, or according to the mode of Liberty. According to the mode of Nature, it tends towards a primary and proper object, one that is suitable and adequate to its nature. According to the mode of Liberty, it tends towards all other things. Thus, God by a natural necessity wills Himself; but He wills freely all other things; (2 Tim. 2:13; Rev. 4:11) though the act which is posterior in order may be bound by a free act which is prior in order. This may be called “hypothetical necessity,” having its origin partly from the free volition and act of God, partly from the immutability of his nature. “For God is not unrighteous,” says the apostle,” to forget the work and labor of love” of the pious; because He has promised them a remuneration, and the immutability of his nature does not suffer Him to rescind his promises. (Heb. 6:10, 18) … LVIII… when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28)… … LXIII. 8. Lastly. God wills some things per se or [per accidens] accidentally. He wills per se, those things which are simply and relatively good; (2 Pet. 3:9; accidentally, those which are in some respect evil, but which have such good tbings united with them as He wills in preference to be respective good things which are opposed to those evil ones: thus, He wills the evils of punisbnient, because He would rather have the order of justice preserved in punishment, than suffer an offending creature to go unpunished. (Jer. 9:9; Ps. 50:21; Jer. 15:6) … LXVII. Love is an affection of union in God, the objects of which are God Himself and the good of justice or righteousness, the creature and its felicity. (Prov. 16:4; Ps. 11:7; Jn. 3:16; Wisdom 11:24-26) Hatred is an affection of separation in God, the object of which are the unrighteusness and misery of the creature. (Ps. 5:5; Eze. 25:11; Dt. 25:15-16, etc.; Isa. 1:24) But since God primarily loves Himself and the good of justice, and at the same moment hates iniquity; and since He loves the creature and its happiness only secondarily, and at the same moment [odio habet] dislikes the misery of the creature; (Ps. 11:5; Dt. 28:63) hence it comes to pass, that He hates a creature that pertinaciously perseveres in unrighteousness, and He loves its misery. (Isa. 66:4) LXVIII. Goodness in God is an affection of communicating his own good. (Rev. 4:11; Gen. 1:31) Its first object [ad extra] outwards is nothing; and thus necessarily the first, that, [illo sublato] on its removal, there can be no [ad extra] outward communication. The first [progressus] advance of this goodness is towards the creature as it is a creature; the second is towards the creature as it performs its duty, to communicate good to it beyond the remuneration promised. Both these procedures of the Divine goodness may appropriately receive the appellation of “Benignity.” The third advance is towards a creature that has sinned, and that has by such transgression rendered itself liable to misery. This advance is called Mercy, that is, an affection for affording succor to a person in misery, sin itself presenting no obstacle to its exercise. (Rom. 5:8; Eze. 16:6). … LXXV. Righteousness or Justice in God, is an eternal and constant will to render to every one his own: (Ps. 11:7) To God Himself that which is his, and to the creature what belongs to it. We consider this righteousness in its Words and in its Acts. In all its Words are found veracity and constancy; and in its Promises, fidelity. (2 Tim. 2:13; Num. 23:19; Rom. 3:4; 1 Thess. 5:24) With regard to its Acts, it is twofold, Disposing and Remunerative. The former is that according to which God disposes all the things in his actions through his own wisdom, according to the rule of equity which has either been prescribed or pointed out by his wisdom. The latter, [remunerative righteousness] is that by which God renders to his creatures that which belongs to it, according to his work through an agreement into which He has entered with it. (Heb. 6:10, 17-18; Ps. 145:17; 2 Thess. 1:6; Rev. 2:23)</p></blockquote>

— James Arminius, The Works of James Arminius, tr. James Nichols (Auburn: Derby, Miller, Orton, 1853), vol. 1, Public Disputations, Disputation 4, ‘On the Nature of God’, p. 456">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLIII.+But+though+nothing+from+without+be+the+cause+of+God%E2%80%99s+volition%2C+yet%2C+since+He+wills+that+there+should+be+order+in+things+%28which+order+is+placed+principally+in+this%2C+that+%5Biliae%5D+some+things+be+the+causes+of+others%29+just+so+far+as+God%E2%80%99s+volition+is+borne+towards+those+objects%2C+it+is+as+if+it+were+the+cause+of+itself+as+it+is+borne+towards+others%3A+%28Hos.+2%3A21-22%29+Thus+the+cause+why+He+wills+the+condemnation+of+anyone%2C+is+this%2C+because+He+wills+the+order+of+his+justice+to+be+observed+throughout+the+universe.+%28Jn+6%3A40%3B+Dt.+7%3A8%29%E2%80%A6+%E2%80%A6+LVI.+1.+The+Divine+Will+is+borne+towards+its+object%2C+either+according+to+the+mode+of+Nature%2C+or+according+to+the+mode+of+Liberty.+According+to+the+mode+of+Nature%2C+it+tends+towards+a+primary+and+proper+object%2C+one+that+is+suitable+and+adequate+to+its+nature.+According+to+the+mode+of+Liberty%2C+it+tends+towards+all+other+things.+Thus%2C+God+by+a+natural+necessity+wills+Himself%3B+but+He+wills+freely+all+other+things%3B+%282+Tim.+2%3A13%3B+Rev.+4%3A11%29+though+the+act+which+is+posterior+in+order+may+be+bound+by+a+free+act+which+is+prior+in+order.+This+may+be+called+%E2%80%9Chypothetical+necessity%2C%E2%80%9D+having+its+origin+partly+from+the+free+volition+and+act+of+God%2C+partly+from+the+immutability+of+his+nature.+%E2%80%9CFor+God+is+not+unrighteous%2C%E2%80%9D+says+the+apostle%2C%E2%80%9D+to+forget+the+work+and+labor+of+love%E2%80%9D+of+the+pious%3B+because+He+has+promised+them+a+remuneration%2C+and+the+immutability+of+his+nature+does+not+suffer+Him+to+rescind+his+promises.+%28Heb.+6%3A10%2C+18%29+%E2%80%A6+LVIII%E2%80%A6+when+the+creature+%5Bexcedit+ordinem%5D+transgresses+the+order+of+this+revealed+Will%2C+the+creature+by+it+may+be+reduced+to+order%2C+and+that+the+Will+of+God+may+be+done+%5Bde%5D+on+those+by+whom+his+Will+has+not+been+performed.+%282+Sam.+17%3A14%3B+Isa.+5%3A4-5%3B+Mt.+21%3A39-41%3B+Acts+5%3A4%3B+1+Cor.+7%3A28%29%E2%80%A6+%E2%80%A6+LXIII.+8.+Lastly.+God+wills+some+things+per+se+or+%5Bper+accidens%5D+accidentally.+He+wills+per+se%2C+those+things+which+are+simply+and+relatively+good%3B+%282+Pet.+3%3A9%3B+accidentally%2C+those+which+are+in+some+respect+evil%2C+but+which+have+such+good+tbings+united+with+them+as+He+wills+in+preference+to+be+respective+good+things+which+are+opposed+to+those+evil+ones%3A+thus%2C+He+wills+the+evils+of+punisbnient%2C+because+He+would+rather+have+the+order+of+justice+preserved+in+punishment%2C+than+suffer+an+offending+creature+to+go+unpunished.+%28Jer.+9%3A9%3B+Ps.+50%3A21%3B+Jer.+15%3A6%29+%E2%80%A6+LXVII.+Love+is+an+affection+of+union+in+God%2C+the+objects+of+which+are+God+Himself+and+the+good+of+justice+or+righteousness%2C+the+creature+and+its+felicity.+%28Prov.+16%3A4%3B+Ps.+11%3A7%3B+Jn.+3%3A16%3B+Wisdom+11%3A24-26%29+Hatred+is+an+affection+of+separation+in+God%2C+the+object+of+which+are+the+unrighteusness+and+misery+of+the+creature.+%28Ps.+5%3A5%3B+Eze.+25%3A11%3B+Dt.+25%3A15-16%2C+etc.%3B+Isa.+1%3A24%29+But+since+God+primarily+loves+Himself+and+the+good+of+justice%2C+and+at+the+same+moment+hates+iniquity%3B+and+since+He+loves+the+creature+and+its+happiness+only+secondarily%2C+and+at+the+same+moment+%5Bodio+habet%5D+dislikes+the+misery+of+the+creature%3B+%28Ps.+11%3A5%3B+Dt.+28%3A63%29+hence+it+comes+to+pass%2C+that+He+hates+a+creature+that+pertinaciously+perseveres+in+unrighteousness%2C+and+He+loves+its+misery.+%28Isa.+66%3A4%29+LXVIII.+Goodness+in+God+is+an+affection+of+communicating+his+own+good.+%28Rev.+4%3A11%3B+Gen.+1%3A31%29+Its+first+object+%5Bad+extra%5D+outwards+is+nothing%3B+and+thus+necessarily+the+first%2C+that%2C+%5Billo+sublato%5D+on+its+removal%2C+there+can+be+no+%5Bad+extra%5D+outward+communication.+The+first+%5Bprogressus%5D+advance+of+this+goodness+is+towards+the+creature+as+it+is+a+creature%3B+the+second+is+towards+the+creature+as+it+performs+its+duty%2C+to+communicate+good+to+it+beyond+the+remuneration+promised.+Both+these+procedures+of+the+Divine+goodness+may+appropriately+receive+the+appellation+of+%E2%80%9CBenignity.%E2%80%9D+The+third+advance+is+towards+a+creature+that+has+sinned%2C+and+that+has+by+such+transgression+rendered+itself+liable+to+misery.+This+advance+is+called+Mercy%2C+that+is%2C+an+affection+for+affording+succor+to+a+person+in+misery%2C+sin+itself+presenting+no+obstacle+to+its+exercise.+%28Rom.+5%3A8%3B+Eze.+16%3A6%29.+%E2%80%A6+LXXV.+Righteousness+or+Justice+in+God%2C+is+an+eternal+and+constant+will+to+render+to+every+one+his+own%3A+%28Ps.+11%3A7%29+To+God+Himself+that+which+is+his%2C+and+to+the+creature+what+belongs+to+it.+We+consider+this+righteousness+in+its+Words+and+in+its+Acts.+In+all+its+Words+are+found+veracity+and+constancy%3B+and+in+its+Promises%2C+fidelity.+%282+Tim.+2%3A13%3B+Num.+23%3A19%3B+Rom.+3%3A4%3B+1+Thess.+5%3A24%29+With+regard+to+its+Acts%2C+it+is+twofold%2C+Disposing+and+Remunerative.+The+former+is+that+according+to+which+God+disposes+all+the+things+in+his+actions+through+his+own+wisdom%2C+according+to+the+rule+of+equity+which+has+either+been+prescribed+or+pointed+out+by+his+wisdom.+The+latter%2C+%5Bremunerative+righteousness%5D+is+that+by+which+God+renders+to+his+creatures+that+which+belongs+to+it%2C+according+to+his+work+through+an+agreement+into+which+He+has+entered+with+it.+%28Heb.+6%3A10%2C+17-18%3B+Ps.+145%3A17%3B+2+Thess.+1%3A6%3B+Rev.+2%3A23%29%E2%80%9D%0A%0A%E2%80%94+James+Arminius%2C+The+Works+of+James+Arminius%2C+tr.+James+Nichols+%28Auburn%3A+Derby%2C+Miller%2C+Orton%2C+1853%29%2C+vol.+1%2C+Public+Disputations%2C+Disputation+4%2C+%E2%80%98On+the+Nature+of+God%E2%80%99%2C+p.+456&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb04a00abca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a <blockquote><p>Since the office of judge and ruler belongs naturally to God, the rectifying right concerning punishment which depends upon it must be essential; and so also avenging justice founded on that. “The wrath of God is revealed from heaven against all ungodliness and unrighteousness of men … who know the judgment of God, that they which commit such things are worthy of death” (Rom. 1:18, 32).</p></blockquote>

<blockquote><p>30. It is said by some very learned and reverend men, that God freely made the world, though He necessarily made it good; He freely made positive laws, though He necessarily made them wisely and just; He freely annexes threatenings to his laws, though necessarily they are just threatenings; He freely sentences or judges, though He necessarily judge justly; He freely executes his sentence by punishing, though He necessarily punish justly. And the reasons given, are:

1. Because God executes his sentence as Dominus [Lord].

2. Because his threatenings bind Him not to punish, but man to suffer.</p></blockquote>

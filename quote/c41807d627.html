<main class="wrap"><figure class="quote" id="q-c41807d627" data-kw="">
<blockquote><p>The resurrection of souls pertains to merit, which is the effect of justification; but the resurrection of bodies is ordained for punishment or reward, which are the effects of Him who judges. Now it belongs to Christ, not to justify all men, but to judge them: and therefore He raises up all as to their bodies, but not as to their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, III, q. 56, a. 2, ad 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-judge.html">The Judge</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ccf4f8f6d0" data-kw="">
<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways: I. As God. II. As Judge of the World. III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-judge.html">The Judge</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement/particular-redemption.html">Particular redemption</a></span></div>

</figure><figure class="quote" id="q-f76e8433df" data-kw="">
<blockquote><p>Now although the efficiency of Christ&#x27;s Resurrection extends to the resurrection of the good and wicked alike, still its exemplarity extends properly only to the just, who are made conformable with His Sonship, according to Romans 8:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, III, q. 56, a. 1, ad 3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Now although the efficiency of Christ&#x27;s Resurrection extends to the resurrection of the good and wicked alike, still its exemplarity extends properly only to the just, who are made conformable with His Sonship, according to Romans 8:29.”

— Thomas Aquinas, Summa Theologiae, III, q. 56, a. 1, ad 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow%20although%20the%20efficiency%20of%20Christ%27s%20Resurrection%20extends%20to%20the%20resurrection%20of%20the%20good%20and%20wicked%20alike%2C%20still%20its%20exemplarity%20extends%20properly%20only%20to%20the%20just%2C%20who%20are%20made%20conformable%20with%20His%20Sonship%2C%20according%20to%20Romans%208%3A29.%E2%80%9D%0A%0A%E2%80%94%20Thomas%20Aquinas%2C%20Summa%20Theologiae%2C%20III%2C%20q.%2056%2C%20a.%201%2C%20ad%203&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff76e8433df.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f76e8433df.html">Permalink</a><a class="src" href="https://www.newadvent.org/summa/4056.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><figure class="quote" id="q-68ca6aa5c2" data-kw="">
<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.1.26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-judge.html">The Judge</a></span><span class="t"><a href="../topics/resurrection/christs-resurrection-as-the-pledge.html">Christ&#x27;s Resurrection as the Pledge</a> › <a href="../topics/resurrection/christs-resurrection-as-the-pledge/united-to-the-risen-head.html">United to the risen Head</a></span></div>

</figure><figure class="quote" id="q-08cd10f158" data-kw="">
<blockquote><p>The sovereignty of the Lord Jesus over all creatures, doth plainly foreshew a resurrection of the bad, as well as of the good. Indeed, the unjust shall not arise, by virtue of any relation they stand in to the Lord Jesus, as the saints shall; but yet, because all are delivered into his hand, and he made sovereign Lord over them; therefore by an act of his sovereign power, they that are ungodly, shall arise</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurrection of the Dead, and Eternal Judgment</cite>, The Resurrection of the Wicked</span></figcaption>

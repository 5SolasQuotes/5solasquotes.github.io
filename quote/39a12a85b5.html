<main class="wrap"><figure class="quote" id="q-39a12a85b5" data-kw="">
<blockquote><p>We see not how letters of recommendation, most lawful as we judge, and necessary, can resign ministerial power, a liberty bought with Christ’s blood (as you say) to any other church, for we think all the visible Churches are one catholic visible Church and should have a visible communion, and so that there is no resignation of ministerial power in these letters, but they are declaratory of the Christian behavior of the dismissed Christian. We ask if dimissory letters be authoritative and done by the church as the church, and how can a church usurp authority (by your way) over a sister church to recommend a sojourner to a church-state and church liberties and seals of the Covenant? one church has no authority over another. If these letters be merely private and merely declaratory, to manifest and declare the sojourner’s Christian behavior, only then he had power and right without these letters or any act of resignation, or giving away ministerial power, to be a Church-member of the visible Church to the which he goes. Therefore, he was a member of the visible Church to which he goes before the dimissory letters were written; and the letters do resign no right but only notify and declare the sojourner’s preexistent right, and so there is a visible Church and a visible communion of all congregations on earth, and must be an external power and authority in all for synods. Let our [congregationalist] brethren see to this. [Margin note:] It is true, none should remove from one congregation to another without God go before them, nor can they change countries without God’s warranting direction, Gen 12:1; 46:4, but that such removal is a matter of Church-discipline, and must be done by a ministerial power, is unwarranted by any word of God.

3. [In congregationalism] The person to remove must be dismissed and loosed by the consent of the whole congregation (if conveniency permit) else he is not exonered of his church-oath made to that congregation; What if conveniency do not permit? then is he loosed from an oath without consent of the Church, which did by oath receive him. I thinkejusdem potestatis est(as the law says) ligare et solvere, ‘that’ Church ‘power which binds must loose.’

4. If the [man-drawn-up] church-covenant be an everlasting covenant, as Jer. 50:5 [which the congregationalists proof-texted], tying the man to the membership of that particular congregation forever, I see not how the church can use [letters of transfer like] indulgences and Pope-like dispensations against the oath of God, to break it upon light and frivolous reasons [such as moving, etc.]; for if God punish covenant breaking, so also should the church, and can by no indulgence be accessory to the breach of God’s oath; there is too great a smell of Popery, Arminianism, and Socinianism in this way in my weak judgement. But if the man be not sworn a member of that particular church by his oath, he is sworn a member of the visible Church universal, which our brethren cannot well say. Neither is any covenant called an everlasting covenant in the Scripture but the Covenant of Grace, Jer. 31:33; 32:40; Isa. 54:9-10, and that is made with the invisible catholic Church of believers, as is the Covenant [in] Jer. 50:5, and not a Covenant with one visible congregation; and what warrant has the Church to dispense with the breach of such an everlasting Covenant?

5. The testimony of other churches, if it be a warrant to you, in faith, to receive into the church such a one as a saint and a temple of the Holy Spirit, how should it not also be a warrant to you to cast out and excommunicate also?

6. The person coming from another Church, if of approven piety, is received, by lifting up of the hands, or silence of the church, as you say:

1. Have we a warrant from God’s Word for such a new inchurching?

2. Why is he not received by a church oath? as a minister transplanted to another church must have ordination and election of new [according to congregationalists], for to you there is alike reason.

3. If there be no need of a new church oath to make him a member of that visible congregation, seeing now he is loosed from the former, you insinuate his former church-oath did make him a member of a visible church, and so he that is a visible member in a church, is a visible member of all, and so there must be a visible Church-catholic, if there be a catholic visible membership in any one member, and so you destroy what you build.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 6, section 1, pp. 328-30</span></figcaption>

<blockquote><p>And Trypho again inquired, ‘But if some one, knowing that this is so, after he recognises that this man is Christ, and has believed in and obeys Him, wishes, however, to observe these [Mosaic institutions], will he be saved?’ I said, ‘In my opinion, Trypho, such an one will be saved, if he does not strive in every way to persuade other men— I mean those gentiles who have been circumcised from error by Christ, to observe the same things as himself, telling them that they will not be saved unless they do so. This you did yourself at the commencement of the discourse, when you declared that I would not be saved unless I observe these institutions.’ Then he replied, ‘Why then have you said, ‘In my opinion, such an one will be saved,’ unless there are some who affirm that such will not be saved?’ ‘There are such people, Trypho,’ I answered, ‘and these do not venture to have any intercourse with or to extend hospitality to such persons; but I do not agree with them. But if some, through weak-mindedness, wish to observe such institutions as were given by Moses, from which they expect some virtue, but which we believe were appointed by reason of the hardness of the people’s hearts, along with their hope in this Christ, and [wish to perform] the eternal and natural acts of righteousness and piety, yet choose to live with the Christians and the faithful, as I said before, not inducing them either to be circumcised like themselves, or to keep the Sabbath, or to observe any other such ceremonies, then I hold that we ought to join ourselves to such, and associate with them in all things as kinsmen and brethren. But if, Trypho,’ I continued, ‘some of your race, who say they believe in this Christ, compel those gentiles who believe in this Christ to live in all respects according to the law given by Moses, or choose not to associate so intimately with them, I in like manner do not approve of them. But I believe that even those, who have been persuaded by them to observe the legal dispensation along with their confession of God in Christ, shall probably be saved. And I hold, further, that such as have confessed and known this man to be Christ, yet who have gone back from some cause to the legal dispensation, and have denied that this man is Christ, and have repented not before death, shall by no means be saved.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-9a6ca930c0" data-kw="">
<blockquote><p>…I intend not in this relation to set down all things which they [the New England churches] hold or practice in discipline or church-government, but such things only or for the most part, wherein there lies some difference between them and us, or other the best Reformed Churches. Neither do I intend to wrap up all and every one of the elders (much less members) of the New England churches in the same imputations: Forasmuch as it is most certain that though in practice they act generally all alike, yet in their opinion of things practiced, much more in the grounds and reasons thereof, some of them do not only differ from the rest but have stiffly opposed the rest therein, which I write to preserve the just repute of some eminent persons there from such censures and hard opinions as others of them, perhaps, may seem to merit and incur.</p></blockquote>

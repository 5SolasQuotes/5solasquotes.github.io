<blockquote><p>13. For the Spirit dictates [by illumination] both unto the Church, as well what is profitable for avoiding of scandal, as also that those things which are commanded for avoiding of scandal, are neither the worship of God, nor yet necessary to be observed without the case of scandal and contumacy, as appears by those sayings (1 Cor. 7:6, 35): ‘I speake this by permission, not by commandement. This I speak for your own commodity, not to entangle you in a snare, but that you follow that which is honest, and that you may cleave fast unto the Lord without separation.&#x27;</p></blockquote>

<blockquote><p>3. Suppose that the suffrage and voice of a pastor and of an elder be voices different only in diverse relations to diverse officers, to wit, the pastor and the elder; yet in the matter of bearing weight in the conscience from force of truth, and not from the authority of men, they are equal; and therefore ruling elders having knowledge and light, and withal authority of office, may well have voices [in Church courts]: But it follows not hence that these who have knowledge are formal canon-makers, because the decrees and constitutions of synods lay two obligations upon the people: [1.] One for the matter, and so in respect that in the moral part thereof they must be agreeable to the Word, they bind the consciences to an obedience of conscience. 2. They impose an ecclesiastical tie from the authority of the council and canon-makers, and so they require subjection or obedience of reverence for the authority-official that is in the canon-makers: The second command lays on the first bond or tie, and the first command lays on the other bond and tie.</p></blockquote>

<blockquote><p>[4.] Calvin treating of Church-power, says well, ‘Non est igitur ecclesiae potestas in•…inita, sed subjecta verbo Domini, &amp; in eo quasi inclusa.’ (Institutes, bk. 4, ch. 8, sect. 4) That all Church-judicatories, whether congregational-elderships, or presbyteries or synods, whether provincial or national, or ecumenic, being constituted of men that are weak, frail and ignorant in part, are in their determinations fallible and subject to error, Isa. 40:6-8; Rom. 3:4; 1 Cor. 13:9,12. 5. That insofar as any of these do actually err and decline from the truth, they do insofar act without power and authority from Jesus Christ: They can do nothing (of themselves, they may do, but not by His commission and warrant) against the truth, but for the truth, 2 Cor. 13:8. The power which He has given them being to edification, and not to destruction, 2 Cor. 13:12. 6. Sad experience, almost in every generation, does teach us that Church-guides and Church-judicatories do oftentimes decline from the straight-ways of the Lord, and decree unrighteous decrees, and write grievous things which they have prescribed, Isa. 9:15-16; Jer. 8:8-9; Mal. 2:8-9; Jer. 2:8. And that whilst they are boasting of the authority given to them of God, and of their skill in the Law, and professing to walk according thereto, they are perverting the precious truths of God, and persecuting these who cleave thereunto, Jer. 18:18; Isa. 66:5; Jn. 7:48-49. 7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2. And that it is therefore both the duty and privilege of every Church-member, and of every inferior Church-judicatory, to examine by the judgement of discretion every thing which the Church-authority joins, whether it be agreeable or repugnant to the rules of the Word; and if after a diligent and impartial search, it be found repugnant, they are not to bring their consciences in bondage thereto; neither is the allowing and exercising of the judgement of discretion by inferiors, the setting them as judges over their superiors, or making them transgress the line, or limits of that due subordination and submission appointed unto them of God. Protestant divines in their writings, de judice controverstarum [on the judge of controversies] have fully answered this, and showed us that it does not make a private man or an inferior, judge of the sentences and decrees of his superiors, but only of his own actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (Edinburgh, 1658), pp. 96-7</span></figcaption>

<blockquote><p>93. Next it may be granted that the matter may be put under a further examination, yet upon condition, that when it is come to the revision of the former sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>

<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that. In reference to which, these things are to be adverted to: 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word, going before, or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-656e970a64" data-kw="">
<blockquote><p>From the salaries of the sacred ministers under the Old Testament (Num. 18:8-12), to whom were given ordinarily sacrifices, tithes, firstfruits, and other similar things, besides certain cities and suburban fields (Num. 35:1-8). Now although in the New Testament, we are not bound by those laws as to the special material from which and the manner in which the pay was given, still they remain as to kind and analogy, as is evident from the passage already quoted (1 Cor. 9:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Start Here</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What does carry over into the New Testament from the specific tithe-laws of the Old Testament? To summarize Francis Turretin</cite>, (1623-87), a leading voice of high, reformed orthodoxy: it is their general equity (see WCF 19.4). Turretin, in seeking to prove that ministers of the New Testament should be paid, argued (Institutes, 3.270):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>

</figure><figure class="quote" id="q-86e4f4dbbf" data-kw="">
<blockquote><p>We profess a difference between ourselves and the unrenewed, as radical as that between light and darkness, almost as wide as that between heaven and hell. But in all the visible and practical concerns which interest the unrenewed heart, we nearly resemble them. Our words say that we believe riches to be vanity and emptiness. Our acts seem to say that we love and seek them as intensely as those do who make them their all and their god. We say in words that ‘we have here no continuing city,’ but in act are as eager to adorn our dwellings here as though they were our only home…</p></blockquote>

</figure><figure class="quote" id="q-fed762504d" data-kw="">
<blockquote><p>Let us then here call to mind the distinction which has been showed betwixt religious ceremonies and moral circumstances: for as touching moral circumstances which serve for common order and decency in the worship of God, they being so many and so alterable that they could not be particularly determined in Scripture, for all the different and almost infinite cases which might occur, the Jewish Synagogue had the same power for determining things of this nature which the church of Christ now has. For the law did not define but left the[m to] be defined by the Synagogue, the set hours for all public divine service, when it should begin, how long it should last, the order [that] should be kept in the reading and expounding of the law, praying, singing, catechizing, excommunicating, censuring and absolving of delinquents, etc., the circumstances of the celebration of mariage, of the education of youth in schools and colleges, etc.</p></blockquote>

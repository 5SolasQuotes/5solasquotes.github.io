<main class="wrap"><figure class="quote" id="q-d5d98e52e8" data-kw="">
<blockquote><p>Take heed of Oppression, this brought the great dishonour upon the King of Babylon, that he should be cast out of his grave as an abominable branch, and not be joined with the Kings of the Nations in burial, because he had destroyed his Land, and slain his people. Therefore see that ye break every yoke, and untie every burden, that the Subjects may have no cause to complain that their yokes are only changed. We are told, that in England our Rulers are not above our Laws, but bound to rule by them, as well as the Subject to obey them; and in this their strength, glory, and authority consists.

And we find it taxed as a common evil design, that hath been long on foot in the Government of this Nation, that the Kings did desire to cast off the Rule of Law, and to govern by Prerogative in an Arbitrary way, that in the end their wills might become Laws, and they might command and require what they list. This I say hath been condemned as an evil in former ages, and this will be found as an evil in Government in all those that succeed, under what name or title soever it be; for surely God did not make men to be like the fishes of the Sea that have no King: Let every one of you (Right Honourable) but upon higher, even Gospel Principles, say as Tiberius did, Aurum illud adulterinum est, quod cum subditorum lachrimis collectum est. That will never prove currant coin to the Ruler, that is gathered with the tears, much less when it is with the blood of the Subjects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-strong.html">William Strong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The way to the highest honour: Presented in a sermon preached before the Right Honourable House of Peers, in the Abbey Church at Westminster, at their late solemn monthly fast. Feb. 24. 1646</cite>, (London: John Saywell, 1647), p. 49.</span></figcaption>

<blockquote><p>O Cyaraxe, tò te genos Epainô, kai tén paida, kai dôra; boulomai de, ephê sun tê toû patros gnómê, kai tes metros tanta sunainesai,” (Xenoph., Cyrop., book 8) which is englished in this manner: “Uncle Cyaraxis, I commend the stock and the maid, and the portion; howbeit” (saith he) “by the counsel of my father and mother I will assent unto you:” as if he had said, without their advice I can do nothing. All histories, philosophers and poets in a manner, are full of the practice of this duty (Terent in phormion). And no marvel, for this is agreeable to the common principle in nature, “Whatsoeuer ye would that other men should do unto you, do ye even so to them,” Mt. 7:12. Sampson saw a maid in Timnah that liked him well, notwithstanding he spake not one word to her, but came back to his parents, and desired them to make the marriage for him. They were the first whom he acquainted with his purpose: not as in our days, wherein commonly the parents are the last. Judg. 14:2, “Get her to me, for she pleaseth me well.</p></blockquote>

</figure><figure class="quote" id="q-2e5f9deb53" data-kw="">
<blockquote><p>For if it be a great Crime, and almost an Impiety not to live under and suffer patiently the Humours and harsh Usage of our Natural Parents; ’tis sure a much greater, not to endure those of our Country, which wise Men have unanimously preferred to their Parents. …

But a Man may sometimes say, My Country is grown mad or foolish, (as Plato said of his) sometimes that it rages and cruelly tears out its own Bowels.—We are to take care in the first Place, that we do not ascribe other Folks Faults to our innocent Country. There have been may cruel Tyrants in Rome and in other Places; these not only tormented innocent good Men, but even the best deserving Citizens, with all manner of Severities: Does it therefore follow, that the Madness of these Tyrants must be imputed to their Country?

The Cruelty of the Emperor Macrinus is particularly memorable; who as Julius Capitolinus writes, was nicknamed Macellinus, because his House was stained with the Blood of Men, as a Shambles is with that of Beasts. Many such others are mentioned by Historians, who for the like Cruelty (as the same Capitolinus tells us) were styled, one Cyclops, another Busiris, a 3d Sciron, a 4th Tryphon, a 5th Gyges. These were firmly persuaded, that Kingdoms and Empires could not be secured without Cruelty: Would it be therefore reasonable, that good Patriots should lay aside all Care and Solicitude for their Country? Certainly they ought rather to succour her, when like a miserable oppressed Mother, she implores her Children’s Help, and to seek all proper Remedies for the Mischiefs that afflict her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or An Account of the Ancient Free State of France, and most other parts of Europe, before the loss of their Liberties</cite>, trans. Robert Molesworth (1574; 2nd edn, London: Edward Valentine, 1721), pp 9, 10.</span></figcaption>

But a Man may sometimes say, My Country is grown mad or foolish, (as Plato said of his) sometimes that it rages and cruelly tears out its own Bowels.—We are to take care in the first Place, that we do not ascribe other Folks Faults to our innocent Country. There have been may cruel Tyrants in Rome and in other Places; these not only tormented innocent good Men, but even the best deserving Citizens, with all manner of Severities: Does it therefore follow, that the Madness of these Tyrants must be imputed to their Country?

The Cruelty of the Emperor Macrinus is particularly memorable; who as Julius Capitolinus writes, was nicknamed Macellinus, because his House was stained with the Blood of Men, as a Shambles is with that of Beasts. Many such others are mentioned by Historians, who for the like Cruelty (as the same Capitolinus tells us) were styled, one Cyclops, another Busiris, a 3d Sciron, a 4th Tryphon, a 5th Gyges. These were firmly persuaded, that Kingdoms and Empires could not be secured without Cruelty: Would it be therefore reasonable, that good Patriots should lay aside all Care and Solicitude for their Country? Certainly they ought rather to succour her, when like a miserable oppressed Mother, she implores her Children’s Help, and to seek all proper Remedies for the Mischiefs that afflict her.”

— Francis Hotman, Franco-Gallia: Or An Account of the Ancient Free State of France, and most other parts of Europe, before the loss of their Liberties, trans. Robert Molesworth (1574; 2nd edn, London: Edward Valentine, 1721), pp 9, 10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+if+it+be+a+great+Crime%2C+and+almost+an+Impiety+not+to+live+under+and+suffer+patiently+the+Humours+and+harsh+Usage+of+our+Natural+Parents%3B+%E2%80%99tis+sure+a+much+greater%2C+not+to+endure+those+of+our+Country%2C+which+wise+Men+have+unanimously+preferred+to+their+Parents.+%E2%80%A6%0A%0ABut+a+Man+may+sometimes+say%2C+My+Country+is+grown+mad+or+foolish%2C+%28as+Plato+said+of+his%29+sometimes+that+it+rages+and+cruelly+tears+out+its+own+Bowels.%E2%80%94We+are+to+take+care+in+the+first+Place%2C+that+we+do+not+ascribe+other+Folks+Faults+to+our+innocent+Country.+There+have+been+may+cruel+Tyrants+in+Rome+and+in+other+Places%3B+these+not+only+tormented+innocent+good+Men%2C+but+even+the+best+deserving+Citizens%2C+with+all+manner+of+Severities%3A+Does+it+therefore+follow%2C+that+the+Madness+of+these+Tyrants+must+be+imputed+to+their+Country%3F%0A%0AThe+Cruelty+of+the+Emperor+Macrinus+is+particularly+memorable%3B+who+as+Julius+Capitolinus+writes%2C+was+nicknamed+Macellinus%2C+because+his+House+was+stained+with+the+Blood+of+Men%2C+as+a+Shambles+is+with+that+of+Beasts.+Many+such+others+are+mentioned+by+Historians%2C+who+for+the+like+Cruelty+%28as+the+same+Capitolinus+tells+us%29+were+styled%2C+one+Cyclops%2C+another+Busiris%2C+a+3d+Sciron%2C+a+4th+Tryphon%2C+a+5th+Gyges.+These+were+firmly+persuaded%2C+that+Kingdoms+and+Empires+could+not+be+secured+without+Cruelty%3A+Would+it+be+therefore+reasonable%2C+that+good+Patriots+should+lay+aside+all+Care+and+Solicitude+for+their+Country%3F+Certainly+they+ought+rather+to+succour+her%2C+when+like+a+miserable+oppressed+Mother%2C+she+implores+her+Children%E2%80%99s+Help%2C+and+to+seek+all+proper+Remedies+for+the+Mischiefs+that+af

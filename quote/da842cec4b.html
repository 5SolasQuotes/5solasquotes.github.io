</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d95edf01bb" data-kw="">
<blockquote><p>Three things about the worship of God are to be considered: 1. The kinds of it… 2. The parts of it… 3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment</cite>, p. 772</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-e9f016fc63" data-kw="">
<blockquote><p>As for the vails wherewith the apostle would have women covered while as they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1), they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign for that comely and orderly distinction of men and women, which civil decency required in all their meetings: wherefore that distinction of habits [garments], which they used for decency and comeliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness, still to retain in their holy assemblies. And further the apostle shows that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman, verses 3, 8, 9 (for covering was then a sign of subjection), and by the long hair which nature gives to a woman, verse 15, where he would have the artificial covering to be fashioned in imitation of the natural. What need we [argue] any more? Let us see nature’s institution or the apostles’ recommendation for the controverted [English-Popish] ceremonies (as we have seen them for women’s vails) and we yield the argument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘The 5th Argument… taken from the mystical &amp; significant nature of them’</cite>, pp. 90-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-892e4869cd" data-kw="">
<blockquote><p>Question: How is the public worship of God to be ordered and administered in the Church? Answer: All the members of the Church, being met together as one man in the sight of God are to join together in holy duties with one accord, the men with their heads uncovered, the women covered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Constitution of a Particular Visible Church, Proved by Scripture… (London, 1642)</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question: How is the public worship of God to be ordered and administered in the Church? Answer: All the members of the Church, being met together as one man in the sight of God are to join together in holy duties with one accord, the men with their heads uncovered, the women covered.”

</figure><figure class="quote" id="q-eb9354003c" data-kw="">
<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

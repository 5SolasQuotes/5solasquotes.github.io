<main class="wrap"><figure class="quote" id="q-98358f02ab" data-kw="">
<blockquote><p>How highly doth it concern us all, to present God daily for England’s sins, with broken hearts, his well pleasing Sacrifices who knows how God may repent him of the evil? …

I. The SWORD hath been threatened or inflicted on people for these sins ensuing, viz.

1. Sottish ignorance of God and of his ways, Jerem. 4. 19, 20, 21, 22. 2. Disobedience to Gods commands, Deut. 28. 15,—22, 23, 24. Job 36. 11. 3. Backsliding from God, forsaking of God, Jerem. 15. 1, 2, 6. 4. Idolatry, Deut. 28. 21. to 26. Judg. 5 8. Psal. 78. 58. to 63. Isa. 65. 11, 12. Jer. 9. 13. to 17. &amp; 16. 4, 11, 12. &amp; 32. 28, 29 30. &amp;c. &amp; 44 25, 27. 5. Breach of Covenant, Jerem. 34 18. to the end of the Chapter. 6. Distrusting the Lord, and relying on the arm of flesh; as Asa on the King of Syria, 2 Chro. 16. 7, 8 9. 7. Prophesying lies in the name of the Lord, and entertaining them, Jer. 14. 13. to 17. 8. Mocking and misusing the messengers of God, and despising God’s word by them, 2 Chro. 36. 15, 16, 17. 9. The sins and provocations of a profane and wicked King, as of Manasses, Jer. 15. 24. 2 King. 24. 23, 41. 10. Warring against the Church and people of God, as did Amaleck, Exod. 17. 8, 16. 11. Insulting over God’s afflicted Church and people, as Tyre did over Jerusalem, Ezek. 26 1. to 15. 12. Murder, Blood, Cruelty, &amp;c. 2 Sam. 2. 9, 10. 13. Pride, Haughtiness, &amp;c. Isa. 3. 16, 25. 14. Oppression, Isa. 3. 12, 13, 14, 25. Jer. 6. 4. to 9 Job 27. 13 14. 15. Incorrigibleness under Gods Judgements, Levit. 26. 16. to 36. …

For, which of all those Abominations fore-mentioned is not England deeply guilty of? And shall England think to commit the same sins, and yet escape the judgements of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Broken Spirit, God’s Sacrifices. Or, The Gratefulness of a Broken Spirit unto God. Represented in a Sermon, before the right Honourable House of Peers, in K. Henry the Seventh’s chapel in the Abbey Westminster, upon Wednesday Decemb. 9. 1646. Being a day of public humiliation for removing of the g</cite>, (London: George Calvert, 1647), dedication.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4fbc8bf29" data-kw="">
<blockquote><p>Though God in mercy can distinguish between his own and ours, and does not count the whole worship to be in vain where any degree of superstition is mixed (for then most zealous persons were undone), yet the superstitious part of worship is always in vain; And all the rest is made as vain where that is the predominant and denominating part. Thus overdoing is undoing, and thus the superstitious are (materially) righteous overmuch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, (London: Symmons, 1670), pt. 1 | Direction 58, p. 284</span></figcaption>

</figure><figure class="quote" id="q-c62361e910" data-kw="">
<blockquote><p>It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. …This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface to the 1543 Genevan Psalter</span></figcaption>

<blockquote><p>…so our sectaries are great Innovators as changeable as the moon, bringing into their churches new opinions daily, new practices, taking away the old used in all Reformed Churches, and substituting new; taking away of singing of psalms and pleading for hymns of their own making; bringing in anointing with oil, bringing in their laying on of hands to give the Holy Ghost, with several other strange ways and practices…</p></blockquote>

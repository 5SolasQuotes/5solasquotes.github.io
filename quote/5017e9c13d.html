<main class="wrap"><figure class="quote" id="q-5017e9c13d" data-kw="practical syllogism elected believes">

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-625f719715" data-kw="">
<blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate, but diligently to persevere in the use of means, and with ardent desires devoutly and humbly to wait for a season of richer grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 16</span></figcaption>

</figure><figure class="quote" id="q-68b5fb0c9a" data-kw="seal fruits election faith">
<blockquote><p>We may know whether the seal of God is stamped upon our hearts and whether the fruits of election (viz., faith and repentance) may be found in us (which is the safest way of proceeding to the saving knowledge of that doctrine). In one word, all curious and fruitless questions.</p></blockquote>

</figure><figure class="quote" id="q-1e5e22ed38" data-kw="">
<blockquote><p>Who teach: That there is in this life no fruit and no consciousness of the unchangeable election to glory, nor any certainty, except that which depends on a changeable and uncertain condition. For not only is it absurd to speak of an uncertain certainty, but also contrary to the experience of the saints, who by virtue of the consciousness of their election rejoice with the apostle and praise this favor of God (Eph. 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Rejection of Errors, ¶7</span></figcaption>

</figure><figure class="quote" id="q-f426fefa18" data-kw="persuaded free mercy election">
<blockquote><p>We shall never feel persuaded as we ought that our salvation flows from the free mercy of God as its fountain, until we are made acquainted with his eternal election, the grace of God being illustrated by the contrast--viz. that he does not adopt all promiscuously to the hope of salvation, but gives to some what he denies to others. It is plain how greatly ignorance of this principle detracts from the glory of God, and impairs true humility. But though thus necessary to be known, Paul declares that it cannot be known unless God, throwing works entirely out of view, elect those whom he has predestined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.1</span></figcaption>

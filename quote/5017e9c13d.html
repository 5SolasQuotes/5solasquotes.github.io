<blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful…</p></blockquote>

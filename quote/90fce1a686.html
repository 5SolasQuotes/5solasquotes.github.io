<blockquote><p>A pious Heart hath three happy ways of self-entertainment in solitary; three rare ways of being least alone, when most alone. The first way of self-entertainment, is the Ordinance of reading and searching the Holy Scriptures, the pure, perfect, and infallible Word and Will of Christ concerning us. There Christ hath prepared his rich feast of fat things full of marrow, and his Royal Banquet of heavenly Truths. There he sets forth the great varieties of sure Directions, precious Promises, high Examples, rare Experiences, and the help of all his holy Ordinances to feed and satiate the hungry and thirsty spirit.

The second way of self-entertainment, is Divine Meditation, by either pondering of spiritual things, for improving knowledge, and exciting practice; or by a weighing all other things whatever, for reducing them to a spiritual end and use. The third way of self-entertainment, is private Praying, such as is both bottomed and bounded by Christ’s will in his Word; such as is both prepared and assisted, made wise and warm by serious Meditation.

Meditation stands between the two Ordinances of Reading and Praying, as the grand Improver of the former, and the high Quickner of the latter, to furnish the mind with choice materials for prayer, and to fill the heart with holy fervency in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-ranew.html">Nathanael Ranew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Reader in Solitude improved by divine meditation, or, A treatise proving the duty and demonstrating the necessity, excellency, usefulness, natures, kinds and requisites of divine meditation. First intended for a person of honour, and now published for general use</cite></span></figcaption>

<blockquote><p>If no time be set apart by a competent authority for public worship, there will be no public worship. When Paul rebuked some of the early Christians, for “forsaking the assembling of themselves together,” Heb. 10:25, it would have been ample justification for them to have replied, “No such thing is required, and no time is set for it.” But we hear of no such plea. It never was made.

There was as much agreement among the early Christians in observing the Lord’s day as in observing the Lord’s supper. It would be mere will-worship to observe the Lord’s day, if it had not been appointed to be so observed by God himself. Is it credible that God should have left the whole church so ignorant of his will, that all believers for eighteen hundred years should have been mistaken as to their duty in so important a matter as this?

The apostle James says, “He that keepeth the whole law, and yet offendeth in one point, is guilty of all.” That he here means the moral law is evident, for he cites two of the precepts of it in the next verse: “Do not commit adultery,” “Do not kill.” James 2: 10, 11. Now, if you do not kill, or swear profanely, yet if you violate the fourth commandment, you are “become a transgressor of the law.” Let those who indulge in Antinomian laxity concerning the law of the Sabbath, solemnly consider the course of reasoning adopted by James, and be warned in time.</p></blockquote>

<blockquote><p>Images of God were strictly forbidden. But Puritan psychology also kept its strong Scholastic roots… Tension between Reformed iconoclasm and Scholastic psychology was not immediately apparent, but during the Evangelical Awakening of the 1740s it became acute. The problem may be stated concisely: If mental images are natural products of the imagination, how can a mental image of Christ be condemned as idolatrous? Does not this impugn the character of God who gave the mind its capacity for forming images? The following study… concludes with the controversy which erupted in Scotland when Jonathan Edwards defended the psychological neutrality of ‘Imaginary ideas of Christ.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-ba1677ffe2" data-kw="">
<blockquote><p>3. The government gives a legal security and establishment to gross heresy, blasphemy, and idolatry, under the notion of liberty of conscience. It would be too tedious to examine each of the State constitutions on this head. One may suffice.

We shall select that of the State of Pennsylvania. See the preamble, together with the third and twenty-sixth sections of the ninth article. Here the constitution recognizes and unalterably establishes the indefeasible right of worshipping the Almighty God in whatever way a man’s conscience may dictate; and declares that this shall for ever remain inviolate. We believe that no man has a right to worship God any other way than he himself hath prescribed in his law. We also think it criminal for a man’s conscience to approve any way repugnant to this sacred rule: and that this crime cannot legitimate another, or make an action right which God expressly condemns under pain of eternal wrath.

If conscience can legitimate what God’s law condemns, it must be paramount to the divine law, and, consequently, to the Legislator also, in having a negative over the requisitions of both the one and the other.

Were this the case, it would not only free from criminality, but would render virtuous, laudable, and praiseworthy the most damnable errors—the most horrid blasphemies and detestable abominations—if but dictated by the consciences of Pagans, Mohammedans, &amp;c. Then the Egyptians, worshipping God under the form of a snake or crocodile, would be as lawful, yea, as commendable, as doing it precisely according to the manner which he has prescribed in his word, provided, that, in both cases, conscience said Amen!</p></blockquote>

<main class="wrap"><figure class="quote" id="q-af1d9fc9d0" data-kw="">
<blockquote><p>We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 5 (pp. 433–34)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cade01efb4" data-kw="">
<blockquote><p>My principal design is, to manifest that every believer may, in the due use of the means appointed of God for that end, attain unto such a full assurance of understanding in the truth, or all that knowledge of the mind and will of God revealed in the Scripture, which is sufficient to direct him in the life of God, to deliver him from the dangers of ignorance, darkness, and error, and to conduct him unto blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/reading-by-the-laity.html">Reading by the laity</a></span></div>
<div class="actions"><button class="copy" data-copy="“My principal design is, to manifest that every believer may, in the due use of the means appointed of God for that end, attain unto such a full assurance of understanding in the truth, or all that knowledge of the mind and will of God revealed in the Scripture, which is sufficient to direct him in the life of God, to deliver him from the dangers of ignorance, darkness, and error, and to conduct him unto blessedness.”

</figure><figure class="quote" id="q-4bd5742617" data-kw="">
<blockquote><p>Besides that, we are all priests, as I have said, and have all one faith, one Gospel, one Sacrament; how then should we not have the power of discerning and judging what is right or wrong in matters of faith? What becomes of St. Paul&#x27;s words, &quot;But he that is spiritual judgeth all things, yet he himself is judged of no man&quot; (1 Cor. ii. 15), and also, &quot;we having the same spirit of faith&quot;? (2 Cor. iv. 13). Why then should we not perceive as well as an unbelieving pope what agrees or disagrees with our faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Nobility of the German Nation</cite>, The Second Wall</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Besides that, we are all priests, as I have said, and have all one faith, one Gospel, one Sacrament; how then should we not have the power of discerning and judging what is right or wrong in matters of faith? What becomes of St. Paul&#x27;s words, &quot;But he that is spiritual judgeth all things, yet he himself is judged of no man&quot; (1 Cor. ii. 15), and also, &quot;we having the same spirit of faith&quot;? (2 Cor. iv. 13). Why then should we not perceive as well as an unbelieving pope what agrees or disagrees with our faith?”

</figure><figure class="quote" id="q-76a5437c2b" data-kw="">
<blockquote><p>We do not deny that there can be in the church a ministerial and secondary judge, who can officially moderate controversies over the faith by the Word of God, but we hold that the Holy Spirit, as its source, teaches us the true interpretation of Scripture where inner assurance is concerned. We deny that any supreme and infallible judge except Scripture need be sought with regard to external proof of the object, much less that the pope, who assumes such a task, is to be accepted. We believe that Scripture alone, or God speaking in it, is enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span></div>

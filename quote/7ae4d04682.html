<main class="wrap"><figure class="quote" id="q-7ae4d04682" data-kw="">
<blockquote><p>As concerning actions of Church-Policy, that cannot be warranted by the light of nature, and yet have intrinsecal conveniency and aptitude to edify and decently to accomodate the worship of God. I conceive these may be done, but not because the Church so commands, as if their commandment were the formal reason of our obedience, but because partly the light of the Law of reason, partly Scripture does warrant them… Again I conceive that there be two sort of positives in the externals of government or worship: 1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: [2.] and when the Church forms a directory for worship and government; the directory itself is in the form not simply divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Intro, Section 5</cite>, p. 80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-719ef5777b" data-kw="">
<blockquote><p>…The case is not here as in earthly cities: a man who is a free citizen in one burrough is not for that a free citizen of all the burroughs and cities on earth; nor is he who is civilly excommunicated and cast out of his city privileges in one city, cast out of his city privileges in all other cities whereof he is a free member: and the reason is, there is not one common owner and Lord of all the cities on earth, who can give or take away, in a law-way, city privileges; But the case is far otherwise in the privileges of visible Churches, for he who is a member of one visible congregation is by his baptism and sincere profession, and his professed standing in Covenant with God, a member of all visible congregations on earth, as he is baptized in all congregations on earth; and if he be excommunicated out of a single congregation, he is excommunicated out of all, and loses right to the seal of the Lord’s Supper in all visible congregations, as his sins are bound in Heaven to all also, for that one common Head and Savior, who gives him right to the seals of Christ’s body and blood in one, gives him right to these seals in all. For we worthily communicate with Christ in his body and blood, not as his body was broken and his blood shed for one single visible congregation, but as broken and shed for the whole Church-universal.</p></blockquote>

<blockquote><p>8. If any do dislike the superstitious and needless ceremonies in ordination and yet also acknowledge that the bishops may call, authorize, try, confirm and warrant by testimony the sufficiency of ministers, what grievous sin is it?</p></blockquote>

</figure><figure class="quote" id="q-323e74c17f" data-kw="">
<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43</cite>, pp. ToC</span></figcaption>

e First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.”

— Theodore Beza, The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43, pp. ToC">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+bishop+ordained+of+God%2C+or+set+up+by+the+law+of+God%2C+does+declare+nothing+else+but+their+calling%2C+which+by+an+other+more+special+name%2C+are+called+pastors%2C+whom+%28says+Luke+%5Bin+Acts+20%5D%29+the+holy+Ghost+has+appointed+bishops+to+feed+the+Church+of+God.+And+either+of+these+names+of+pastor+or+of+bishop+is+proper+to+them+in+the+New+Testament%2C+whereby+the+apostle+does+distinguish+them+from+apostles%2C+prophets%2C+and+evangelists%2C+which+were+callings+to+endure+for+a+time%2C+Eph.+4%3A11%2C+and+from+deacons%2C+1+Tim.+3+and+Phil.+1%3A1%2C+for+otherwise+they+are+everywhere+called+elders%E2%80%A6+But+they+are+called+bishops+in+regard+of+the+sheep+committed+unto+them%2C+as+though+a+man+should+call+them+watchmen+of+%5Bor%3F%5D+overseers.+These+now+were+one+alone%2C+as+where+any+church+had+but+one+pastor%2C+or+more+if+the+church+had+more+than+one.+And+the+meeting+of+them+together+jointly+with+their+elders%2C+whom+Paul+calls+%E2%80%98governors%E2%80%99+%5B1+Cor.+12%5D%2C+of+the+other+common+name+called%2C+was+the+eldership.+Their+duty+was+to+attend+on+the+word+and+prayer%2C+both+publicly+and+privately%2C+and+in+common+to+governe+the+Church%2C+as+appears+by+many+places+of+Scripture.+%E2%80%A6+Of+the+Bishop+that+is+of+Man+The+bishop+that+is+of+man%2C+that+is+to+say%2C+brought+into+the+Church+by+the+alone+wisdom+of+man%2C+besides+the+express+Word+of+God%2C+is+a+certain+power+given+to+one+certain+pastor+above+his+other+fellows%2C+yet+limited+with+certain+orders+or+rules+provided+against+tyranny.+They+which+did+bear+this+office+of+bishop%2C+are+called+bishops+in+regard+of+their+fellow+elders+and+the+whole+clergy%2C+as+watchmen+set+over+the+clergy.+That+this+calling+was+not+brought+in+by+the+Word%2C+it+is+manifest+by+that%2C+that+there+is+not+to+be+found+in+the+New+Testament+so+much+as+one+syllable%2C+whereby+there+may+be+the+least+surmise+of+any+such+thing.+For+although+we+doubt+not%2C+but+all+things+ought+to+be+done+orderly+in+the+Lord%E2%80%99s+house%2C+and+therefore+that+some+one+should+be+president+in+every+assembly%E2%80%A6+%E2%80%A6+The+Answer+to+the+First+Question+Where+as+Satan%E2%80%99s+bishop+has+been+the+overthrow+of+the+Church+and+all+Christian+kingdoms%2C+whose+head+is+the+Roman+Antichrist%2C+it+is+to+be+looked+unto+of+all+hands%2C+especially+of+all+godly+princes%2C+that+they+at+once+abolish+it%2C+if+they+mind+the+reformation+of+the+Church+and+their+own+safety.+As+for+the+bishop+ordained+by+man+and+brought+into+the+Church+by+little+and+little%2C+whereby+Satan+made+him+a+way+for+greater+things%2C+it+had+been+tolerable%E2%80%A6+experience+of+so+many+ages+does+teach+us+too+well%2C+that+unless+this+root+also+be+plucked+up%2C+it+will+come+to+pass+that+the+same+fruit+will+sprout+and+bud+forth+again.+Finally%2C+seeing+the+Lord+has+so+often+decided+this+controversy+of+superiority+among+his+own+disciples%2C+that+He+shut+it+clean+out%2C+seeing+the+rule+both+for+doctrine+and+good+order+of+the+Church+is+to+be+sought+for+out+of+the+very+writings+of+the+apostles%3A+and+it+is+manifested%2C+the+churches+then+prospered%2C+when+all+this+authority+of+one+man+over+the+rest%2C+yet+was+not%2C+but+as+that+grew+up%2C+so+all+things+fell+to+decay.+Finally%2C+seeing+where+the+remnants+of+this+government+by+a+few+are+not+clean+taken+away%2C+the+work+of+the+Lord%2C+is+openly+hindered%3A+Our+judgement+is+that+after+the+chasing+away+of+this+device+of+man%2C+the+churches+shall+be+well+provided+for%2C+if+they+may+be+repaired+according+to+the+writings+of+the+apostles.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Judgment+of+a+Most+Reverend+%26+Learned+Man+from+Beyond+the+Seas+Concerning+a+Threefold+Order+of+Bishops+%5Bof+God%2C+of+Man%2C+of+the+Devil%5D%2C+with+a+Declaration+of+Certain+Other+Weighty+Points+Concerning+the+Discipline+%26+Government+of+the+Church+%28%5BLondon%2C+1585%5D%29+43%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F323e74c17f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/323e74c17f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=A%20bishop%20ordained%20of%20God%2C%20or,to%20the%20writings%20of%20the%20apostles." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

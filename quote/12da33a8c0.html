<main class="wrap"><figure class="quote" id="q-12da33a8c0" data-kw="">
<blockquote><p>The subject of national education furnishes a plain and striking illustration of this branch of national duty. It is, perhaps, universally admitted by judicious men, that the interests of education are within the province of civil authorities: that it is the duty of the state to make ample provision for the instruction of its youth. The question occurs, should this be of a Christian character and tendency, or not? Ought schemes for public instruction be so framed and executed as to impress upon the tender minds of youth a conviction of the being, and a sense of the glory and claims of Christ, or is every thing tending to this to be carefully excluded? Should the Bible be read or not? Should prayer in Christ’s name accompany public instruction or not? The reply of every Christian mind and heart, not sealed by prejudice, may be anticipated: “Let us have systems of education imbued with the principles and instinct with the spirit of the Christian religion.” Every intelligent man knows that the cultivation of the intellect, promotes neither happiness nor usefulness, unless that of the heart go along with it. And no Christian will say that any means to accomplish the latter can be effectual, but the doctrines of the Bible; Christ must be known. We must then deny that the care of providing for national instruction devolves upon the public authorities, assent to the monstrous proposition that national instruction may be, without sin, a moral blank, or admit that nations in their national character are bound “to serve the Lord Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible magistracy: or Christ’s dominion over the nations: with an examination of the civil institutions of the</cite>, United States (Philadelphia, 1842), pp 59-61.</span></figcaption>

<blockquote><p>2dly. Outward monuments — ways of declaring and holding out false and idolatrous worship — he is to remove; as the Papists’ images, altars, pictures, and the like; Turks’ mosques; prelates’ service-book. Now these are of two sorts: —

(1st.) Such things as, in their whole use and nature, serve only for the carrying on of worship in itself wholly false, and merely invented; as altars, images, crosses.

(2dly.) Such as are used for the carrying on of worship true in itself, though vilely corrupted; as praying and preaching; — such are those places commonly called churches.

The first are to be abolished; the latter aright used. I speak as to public appearances; for private disquisitions after such things I may be otherwise minded. The reason of this difference is evident to all.

Thus, in days of old, Constantine shut up Pagans’ temples, Euseb. de Vita Constant., lib. iv. cap. 23, 24; and demolished some of the most filthy of them, lib. iii. cap. 52. Theodosius utterly cast them to the ground, though not without some blows and bloodshed, Socrat. Ecclesiastes Hist., lib. v. cap. 16. The command of God for the abolishing all monuments of idolatry, Deut. xii. 1-3, with the commendation of those kings of Judah who accordingly performed this duty, 2 Chron. xvii. 6, xxx. 14, are enough to confirm it, and to bottom this position: —

VI. It is the duty of the magistrate not to allow any public places for (in his judgment) false and abominable worship; as also, to demolish all outward appearances and demonstrations of such superstitious, idolatrous, and unacceptable service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Toleration; and the Duty of the Magistrate about Religion</cite>, (1649) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1967), 8: 194.</span></figcaption>

</figure><figure class="quote" id="q-8a6261ad06" data-kw="">
<blockquote><p>The Church’s power is one and the same in things indifferent and necessary in matters of doctrine, discipline, and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find pre-existent goodness in doctrine, discipline, and matters of order. Therefore will of authority, as will, has no power to dispose of the least circumstance of time, place or person; but the Church’s power is ministerial, and determined to what is good, expedient, and convenient.</p></blockquote>

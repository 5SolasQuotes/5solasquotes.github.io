<main class="wrap"><figure class="quote" id="q-30dd503b4e" data-kw="">
<blockquote><p>‘I will make an everlasting covenant with you, even the sure mercies of David.’ The sinner who comes to Christ is in covenant with God. God reveals to that sinner the fulness that’s in the covenant, and out of that covenant fulness he meets the sinner’s every need with the mercies of David.

These are the mercies that were promised to David’s greater Son and Lord, Jesus Christ. David himself recognised that the covenant was something that would survive after his death. ‘He hath made with me an everlasting covenant, ordered in all things, and sure.’ It was a covenant that was finding its fulfilment in Jesus Christ. What is promised to sinners who come to Christ in response to this call is that they will enter into the possession and the enjoyment of all those mercies promised to Christ in the everlasting covenant for his people. You see, the promise was made in eternity. We didn’t exist in eternity, but the Son of God existed, and the promises were made to him, for himself and for his people.

What was promised to him is described here as ‘sure mercies’. All the provisions of the gospel of the grace of God — justification, adoption, sanctification, and all the benefits that flow from them, in this life, at death, and at the resurrection. All these things are sure mercies, because God has promised them and provides them — because Jesus Christ God’s Son has procured them for his people, he met all the conditions — and because the Holy Spirit applies them to his people. That’s how sure they are. That’s how sure the salvation of the sinner who trusts in Christ is — they have the sure mercies of David, covenanted mercies. ‘I will make an everlasting covenant with them,’ as we have it in Jeremiah. The covenant was, ‘I will not turn away from them, but I’ll put my fear in their hearts so that they will not turn away from me’ (Jeremiah 32: 40).

These are sure mercies. God will never abandon us, and we will never abandon God. Although we have in us an evil heart of unbelief, departing from the living God, the Lord will not allow his people to depart. The Lord holds on to them. They may wander, they may fall, they may go through very dark passages. But the Lord’s everlasting arms are underneath them. His mercies are sure. They’re bound up with Christ. Their life is hid with Christ in God (Colossians 3: 3). How more secure could a person be than that? Your life is hid with Christ in God— is there anywhere more secure than in God and bound up with Christ in God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-m-cartwright.html">Hugh M. Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>With An Everlasting Love: Selected Sermons of Rev Hugh M Cartwright</cite>, (Stornoway, Reformation Press. Kindle edition, 2015), pp 144-45.</span></figcaption>

</figure><figure class="quote" id="q-cec81726a1" data-kw="">
<blockquote><p>In Psalm 68:31 we read, “Ethiopia [or Cush] shall soon stretch out her hands unto God.” The early Seceder, Ebenezer Erskine, interpreted this text as a prediction that the Gentile nations, including those in Africa, would enter into covenant with God:

The words read … are a declaration of the success of the gospel among the Gentile nations. Ethiopia, Egypt, and other places of the world, would submit unto his royal sceptre, when it should be swayed among them in the dispensation of the gospel, Princes shall come out of Egypt, Ethiopia shall soon stretch out her hands unto God. …

From which it appears, that Ethiopia, Scotland, and all the Gentile nations, and every individual among them is, by nature, in a most dismal and deplorable condition, without God, the chief good, without Christ, the only Saviour, without hope of salvation, without the true church, where life and immortality alone is brought to light; without God’s covenant of promise, which is the only charter of salvation; under the power of sin and Satan, the great enemy of their salvation; and, consequently, in a state of hostility against God. …

Lastly, This phrase of stretching out the hand to God implies an open profession of the faith in Christ, before the world, angels, men, and devils, which is sometimes called in Scripture an avouching of the Lord to be our God; and is sometimes done there by a person or people, with the solemnity of lifting up the hand, an ancient form of swearing, Rev. x. 5, 6, when the angel swore by him that liveth for ever and ever, he doth it with his hand lifted up to heaven.

So here, Ethiopia shall soon stretch out her hands unto God, that is, the inhabitants of Ethiopia, and of the Gentile nations, shall openly profess the God and Father of our Lord Jesus Christ to be their God, and they shall do it with the solemnity of an oath or covenant, as Israel they shall do it with the solemnity of an oath or covenant, as Israel did, Josh. xxiv. 22. When Joshua told them, “Ye are witnesses against yourselves, that ye have chosen you the Lord, to serve him.” And in this manner have we, in this land, and neighbouring nations, lifted up our hand to God, declaring him to be our God, and ourselves to be his people, although, alas! these covenants have been scandalously broken, burnt, and in a great measure buried. …

See from this doctrine, wherein the essence either of personal or national covenanting with God doth consist. Why, it just lies in following the example of Ethiopia, which stretched out the hand unto God, in a way of faith and solemn profession, that the God of Christ shall be their God, and that the Father of Christ shall be their Father; and that in the strength of the grace that is in Jesus, promised in a new covenant of grace, they will cleave unto him by a personal holy walk and conversation; and that, through grace, they will cleave unto the doctrine, discipline, worship, and government, that he has appointed in his house, in his holy oracles.

It must be a strange kind of spirit, that either sets his people on edge against such covenants, or turns them to an indifferency about the public work and cause of Christ, as if it were not worth the contending for, or suffering for. When God commands us to “contend for the faith delivered to the saints,” Jude iii., and to “stand fast in the liberty wherewith Christ hath made us free,” Gal. v. 1. It appears evidently to be a plot of hell for burying a testimony for our solemn covenants, and for the reformation of Scotland, and for our encouraging judicatories to go on in their course of backsliding from the Lord, and his work and way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ethiopia Stretching out Her Hands to God in The Works of Ebenezer Erskine</cite></span></figcaption>

The words read … are a declaration of the success of the gospel among the Gentile nations. Ethiopia, Egypt, and other places of the world, would submit unto his royal sceptre, when it should be swayed among them in the dispensation of the gospel, Princes shall come out of Egypt, Ethiopia shall soon stretch out her hands unto God. …

From which it appears, that Ethiopia, Scotland, and all the Gentile nations, and every individual among them is, by nature, in a most dismal and deplorable condition, without God, the chief good, without Christ, the only Saviour, without hope of salvation, without the true church, where life and immortality alone is brought to light; without God’s covenant of promise, which is the only charter of salvation; under the power of sin and Satan, the great enemy of their salvation; and, consequently, in a state of hostility against God. …

Lastly, This phrase of stretching out the hand to God implies an open profession of the faith in Christ, before the world, angels, men, and devils, which is sometimes called in Scripture an avouching of the Lord to be our God; and is sometimes done there by a person or people, with the solemnity of lifting up the hand, an ancient form of swearing, Rev. x. 5, 6, when the angel swore by him that liveth for ever and ever, he doth it with his hand lifted up to heaven.

So here, Ethiopia shall soon stretch out her hands unto God, that is, the inhabitants of Ethiopia, and of the Gentile nations, shall openly profess the God and Father of our Lord Jesus Christ to be their God, and they shall do it with the solemnity of an oath or covenant, as Israel they shall do it with the solemnity of an oath or covenant, as Israel did, Josh. xxiv. 22. When Joshua told them, “Ye are witnesses against yourselves, that ye have chosen you the Lord, to serve him.” And in this manner have we, in this land, and neighbouring nations, lifted up our hand to God, declaring him to be our God, and ourselves to be his people, although, alas! these covenants have been scandalously broken, burnt, and in a great measure buried. …

See from this doctrine, wherein the essence either of personal or national covenanting with God doth consist. Why, it just lies in following the example of Ethiopia, which stretched out the hand unto God, in a way of faith and solemn profession, that the God of Christ shall be their God, and that the Father of Christ shall be their Father; and that in the strength of the grace that is in Jesus, promised in a new covenant of grace, they will cleave unto him by a personal holy walk and conversation; and that, through grace, they will cleave unto the doctrine, discipline, worship, and government, that he has appointed in his house, in his holy oracles.

It must be a strange kind of spirit, that either sets his people on edge against such covenants, or turns them to an indifferency about the public work and cause of Christ, as if it were not worth the contending for, or suffering for. When God commands us to “contend for the faith delivered to the saints,” Jude iii., and to “stand fast in the liberty wherewith Christ hath made us free,” Gal. v. 1. It appears evidently to be a plot of hell for burying a testimony for our solemn covenants, and for the reformation of Scotland, and for our encouraging judicatories to go on in their course of backsliding from the Lord, and his work and way.”

— Ebenezer Erskine, Ethiopia Stretching out Her Hands to God in The Works of Ebenezer Erskine">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Psalm+68%3A31+we+read%2C+%E2%80%9CEthiopia+%5Bor+Cush%5D+shall+soon+stretch+out+her+hands+unto+God.%E2%80%9D+The+early+Seceder%2C+Ebenezer+Erskine%2C+interpreted+this+text+as+a+prediction+that+the+Gentile+nations%2C+including+those+in+Africa%2C+would+enter+into+covenant+with+God%3A%0A%0AThe+words+read+%E2%80%A6+are+a+declaration+of+the+success+of+the+gospel+among+the+Gentile+nations.+Ethiopia%2C+Egypt%2C+and+other+places+of+the+world%2C+would+submit+unto+his+royal+sceptre%2C+when+it+should+be+swayed+among+them+in+the+dispensation+of+the+gospel%2C+Princes+shall+come+out+of+Egypt%2C+Ethiopia+shall+soon+stretch+out+her+hands+unto+God.+%E2%80%A6%0A%0AFrom+which+it+appears%2C+that+Ethiopia%2C+Scotland%2C+and+all+the+Gentile+nations%2C+and+every+individual+among+them+is%2C+by+nature%2C+in+a+most+dismal+and+deplorable+condition%2C+without+God%2C+the+chief+good%2C+without+Christ%2C+the+only+Saviour%2C+without+hope+of+salvation%2C+without+the+true+church%2C+where+life+and+immortality+alone+is+brought+to+light%3B+without+God%E2%80%99s+covenant+of+promise%2C+which+is+the+only+charter+of+salvation%3B+under+the+power+of+sin+and+Satan%2C+the+great+enemy+of+their+salvation%3B+and%2C+consequently%2C+in+a+state+of+hostility+against+God.+%E2%80%A6%0A%0ALastly%2C+This+phrase+of+stretching+out+the+hand+to+God+implies+an+open+profession+of+the+faith+in+Christ%2C+before+the+world%2C+angels%2C+men%2C+and+devils%2C+which+is+sometimes+called+in+Scripture+an+avouching+of+the+Lord+to+be+our+God%3B+and+is+sometimes+done+there+by+a+person+or+people%2C+with+the+solemnity+of+lifting+up+the+hand%2C+an+ancient+form+of+swearing%2C+Rev.+x.+5%2C+6%2C+when+the+angel+swore+by+him+that+liveth+for+ever+and+ever%2C+he+doth+it+with+his+hand+lifted+up+to+heaven.%0A%0ASo+here%2C+Ethiopia+shall+soon+stretch+out+her+hands+unto+God%2C+that+is%2C+the+inhabitants+of+Ethiopia%2C+and+of+the+Gentile+nations%2C+shall+openly+profess+the+God+and+Father+of+our+Lord+Jesus+Christ+to+be+their+God%2C+and+they+shall+do+it+with+the+solemnity+of+an+oath+or+covenant%2C+as+Israel+they+shall+do+it+with+the+solemnity+of+an+oath+or+covenant%2C+as+Israel+did%2C+Josh.+xxiv.+22.+When+Joshua+told+them%2C+%E2%80%9CYe+are+witnesses+against+yourselves%2C+that+ye+have+chosen+you+the+Lord%2C+to+serve+him.%E2%80%9D+And+in+this+manner+have+we%2C+in+this+land%2C+and+neighbouring+nations%2C+lifted+up+our+hand+to+God%2C+declaring+him+to+be+our+God%2C+and+ourselves+to+be+his+people%2C+although%2C+alas%21+these+covenants+have+been+scandalously+broken%2C+burnt%2C+and+in+a+great+measure+buried.+%E2%80%A6%0A%0ASee+from+this+doctrine%2C+wherein+the+essence+either+of+personal+or+national+covenanting+with+God+doth+consist.+Why%2C+it+just+lies+in+following+the+example+of+Ethiopia%2C+which+stretched+out+the+hand+unto+God%2C+in+a+way+of+faith+and+solemn+profession%2C+that+the+God+of+Christ+shall+be+their+God%2C+and+that+the+Father+of+Christ+shall+be+their+Father%3B+and+that+in+the+strength+of+the+grace+that+is+in+Jesus%2C+promised+in+a+new+covenant+of+grace%2C+they+will+cleave+unto+him+by+a+personal+holy+walk+and+conversation%3B+and+that%2C+through+grace%2C+they+will+cleave+unto+the+doctrine%2C+discipline%2C+worship%2C+and+government%2C+that+he+has+appointed+in+his+house%2C+in+his+holy+oracles.%0A%0AIt+must+be+a+strange+kind+of+spirit%2C+that+either+sets+his+people+on+edge+against+such+covenants%2C+or+turns+them+to+an+indifferency+about+the+public+work+and+cause+of+Christ%2C+as+if+it+were+not+worth+the+contending+for%2C+or+suffering+for.+When+God+commands+us+to+%E2%80%9Ccontend+for+the+faith+delivered+to+the+saints%2C%E2%80%9D+Jude+iii.%2C+and+to+%E2%80%9Cstand+fast+in+the+liberty+wherewith+Christ+hath+made+us+free%2C%E2%80%9D+Gal.+v.+1.+It+appears+evidently+to+be+a+plot+of+hell+for+burying+a+testimony+for+our+solemn+covenants%2C+and+for+the+refor

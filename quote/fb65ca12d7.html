<main class="wrap"><figure class="quote" id="q-fb65ca12d7" data-kw="">
<blockquote><p>…all [senses] given it [the Hebrew word for “turned”] in this place do concur in one scope or making one meaning (to wit), to express in God a tender affection, a propensity to show mercy to them, notwithstanding their great provocation of Him; the effects of which affection prevailing with Him are declared in the next verse [“I will not execute the fierceness of mine anger, I will not return to destroy Ephraim: for I am God, and not man;”].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pococke.html">Edward Pococke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hosea</cite>, (Oxford: 1685), on Hos. 11:8, “How shall I give thee up, Ephraim? how shall I deliver thee, Israel? how shall I make thee as Admah? how shall I set thee as Zeboim? mine heart is turned within Me, my repentings are kindled together.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“…all [senses] given it [the Hebrew word for “turned”] in this place do concur in one scope or making one meaning (to wit), to express in God a tender affection, a propensity to show mercy to them, notwithstanding their great provocation of Him; the effects of which affection prevailing with Him are declared in the next verse [“I will not execute the fierceness of mine anger, I will not return to destroy Ephraim: for I am God, and not man;”].”

— Edward Pococke, A Commentary on the Prophecy of Hosea (Oxford: 1685), on Hos. 11:8, “How shall I give thee up, Ephraim? how shall I deliver thee, Israel? how shall I make thee as Admah? how shall I set thee as Zeboim? mine heart is turned within Me, my repentings are kindled together.”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6all+%5Bsenses%5D+given+it+%5Bthe+Hebrew+word+for+%E2%80%9Cturned%E2%80%9D%5D+in+this+place+do+concur+in+one+scope+or+making+one+meaning+%28to+wit%29%2C+to+express+in+God+a+tender+affection%2C+a+propensity+to+show+mercy+to+them%2C+notwithstanding+their+great+provocation+of+Him%3B+the+effects+of+which+affection+prevailing+with+Him+are+declared+in+the+next+verse+%5B%E2%80%9CI+will+not+execute+the+fierceness+of+mine+anger%2C+I+will+not+return+to+destroy+Ephraim%3A+for+I+am+God%2C+and+not+man%3B%E2%80%9D%5D.%E2%80%9D%0A%0A%E2%80%94+Edward+Pococke%2C+A+Commentary+on+the+Prophecy+of+Hosea+%28Oxford%3A+1685%29%2C+on+Hos.+11%3A8%2C+%E2%80%9CHow+shall+I+give+thee+up%2C+Ephraim%3F+how+shall+I+deliver+thee%2C+Israel%3F+how+shall+I+make+thee+as+Admah%3F+how+shall+I+set+thee+as+Zeboim%3F+mine+heart+is+turned+within+Me%2C+my+repentings+are+kindled+together.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb65ca12d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fb65ca12d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=all%20%5Bsenses%5D%20given%20it%20%5Bthe%20Hebrew,I%20am%20God%2C%20and%20not%20man&amp;text=all%20%5Bsenses%5D%20given%20it%20%5Bthe%20Hebrew%20word%20for&amp;text=Ephraim%3A%20for%20I%20am%20God%2C%20and%20not%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-184a168527" data-kw="">
<blockquote><p>The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ [Rev. 3:20] it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Acquaintance &amp; Highest Honor of Christians, or a Discourse of Acquaintance with God</cite>, (London: Parker, 1679), ch. 4, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ [Rev. 3:20] it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.”

</figure><figure class="quote" id="q-07ae059f1c" data-kw="">
<blockquote><p>But when expressions that import anger, or grief, are used [Gen. 6:6; Jud. 10:16; Ps. 78:40; 95:10; etc.], even concerning God Himself, we must sever in our conception everything of imperfection and ascribe everything of real perfection. We are not to think such expressions signify nothing, that they have no meaning, or that nothing at all is to be attributed to Him under them. Nor are we, again, to think they signify the same thing with what we find in ourselves and are wont to express by those names. In the divine nature, there may be real, and yet most serene complacency and displacency, viz. that are unaccompanied with the least commotion, and import nothing of imperfection, but perfection rather, as it is a perfection to apprehend things suitably to what in themselves they are… But we must take heed, lest, under the pretense that we cannot ascribe everything to God that such expressions seem to import, we therefore ascribe nothing. We ascribe nothing, if we do not ascribe to Him a real unwillingness that men should sin on, and perish; and consequently, a real willingness that they should turn to Him, and live; which so many plain texts assert. And therefore it is unavoidably imposed upon us to believe that God is truly unwilling of some things, which He does not think fit to interpose his omnipotency to hinder; and is truly willing of some things which He does not put forth his omnipotency to effect…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Redeemer’s Tears Wept Over Lost Souls, in Works</cite>, vol. 2, pp. 358-61</span></figcaption>

<blockquote><p>[Ex. 20:5] ‘And showing mercy unto thousands of them that love Me and keep my commandments.’ God’s justice reaches unto the third and fourth generation, but his mercy to the thousand[th] generation; and hence we may gather that God inclines more to mercy than to justice, and therefore when He punishes He is said, facere opus non suum, Isa. 28:21, that He may do his strange work, that is to punish.</p></blockquote>

</figure><figure class="quote" id="q-67e7455814" data-kw="">
<blockquote><p>The 14th Chapter of Ecclesiastical doctrine is of the Lord’s keys, of which he says to Peter, I will give thee the Keys of the Kingdom of Heaven, and these keys are the peculiar function or Ministry and administration of Christ his power, and his holy Spirit; which power is committed to the Church of Christ, and to the Ministers thereof, unto the end of the world: that they should not only by preaching publish the holy Gospel, although they should do this especially, that is, should shew forth that Word of true comfort, and the joyful message of peace, and new tidings of that favor which God offers, but also that to the believing and unbelieving, they should publicly or privately denounce and make known, to wit, to them His favor, to these his wrath, and that to all in general, or to everyone in particular, that they may wisely receive some into the house of God, to the communion of Saints, and drive some out from thence, and may so through the performance of their Ministry, hold in their hand the Scepter of Christ his Kingdom, and use the same to the government of Christ his Sheep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, The Confession of Bohemia, which Gillespie quotes approvingly on, p.154</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

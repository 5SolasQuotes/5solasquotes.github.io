<main class="wrap"><figure class="quote" id="q-1bdc43c173" data-kw="">
<blockquote><p>Why it is, that while two or three very small denominations of Christians use the Psalms of David exclusively, the remaining “ninety-nine hundredths” of the Christian Church exclude these divine songs from divine worship, and adopt in their stead mere human compositions.

The question then is, shall we use, in the instituted worship of God, the Psalms, and Hymns, and Spiritual songs of the Holy Ghost, usually called the Psalms of David, or shall we use human compositions? Or, in other words, shall we sing in the praise of God his songs, or ours? This is the main question or point; and what is the spontaneous response to this question from every Christian heart? Certainly it is, that we should sing the Lord’s songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter I. Psalmody – The Question in Evangelical Guardian</cite></span></figcaption>

</figure><figure class="quote" id="q-d897e7cab1" data-kw="">
<blockquote><p>We are told by hymnologers that there is no mention in such psalms of the “sweet name of Jesus.” But is there in the hymns in question? But what Christian minister what Christian elder, nay, what Christian child, who has had a godly father or mother, does not know who the Refuge of the believer is? Does any soul ever sing such a psalm without rejoicing in that name as “ointment poured forth,” as the way into this Refuge, and in the Holy Spirit, who, in God’s infinite grace, has guided him into it? It is very shallow piety indeed that needs all this to be put in words in a song of praise.

It is not the nature of truly lifting up of the soul to God in trust, and hope, and joy, to do it in the details of a doctrinal and theological discussion, whether in thanksgiving, in penitence, or prayer. So the psalms express the essence of them all. What Christian congregation in this land does not know the Redeemer, the name of Jesus, and the Holy Spirit? Did David not know it when he sang Psalm Ixxxviii. 1 — “Lord God, my Saviour,” (my Jesus) “day and night, Before thee cried have I,”- etc.

Nay, did Abraham not know it when he “saw his day afar off, and was glad”? Our Lord himself hath amply taught us, both personally, and by His inspired apostles, that they did; and are we not to know it when we sing Psalms il., xvi., xxii., xxiii., xlv., cx., cxviii., and many others?

To sing these psalms with our gospel light, is to enjoy the communion of saints from the beginning of the church on earth even until now — a communion in praise, at least, which sectarian hymns from their very nature completely destroy, and raise the spirit of controversy rather than kindle the lofty flame of pure devotion. Who does not know what is the child’s true hymn — “The Lord’s my Shepherd?” What child does not know who He was — the great and the good Shepherd, who giveth His life for the sheep, and who “carrieth the lambs in His bosom;” and who said, “Suffer the little children to come unto me”?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 135-36.</span></figcaption>

— James Gibson, The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books, (London: James Nisbet and Son, 1869), pp 135-36.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+told+by+hymnologers+that+there+is+no+mention+in+such+psalms+of+the+%E2%80%9Csweet+name+of+Jesus.%E2%80%9D+But+is+there+in+the+hymns+in+question%3F+But+what+Christian+minister+what+Christian+elder%2C+nay%2C+what+Christian+child%2C+who+has+had+a+godly+father+or+mother%2C+does+not+know+who+the+Refuge+of+the+believer+is%3F+Does+any+soul+ever+sing+such+a+psalm+without+rejoicing+in+that+name+as+%E2%80%9Cointment+poured+forth%2C%E2%80%9D+as+the+way+into+this+Refuge%2C+and+in+the+Holy+Spirit%2C+who%2C+in+God%E2%80%99s+infinite+grace%2C+has+guided+him+into+it%3F+It+is+very+shallow+piety+indeed+that+needs+all+this+to+be+put+in+words+in+a+song+of+praise.%0A%0AIt+is+not+the+nature+of+truly+lifting+up+of+the+soul+to+God+in+trust%2C+and+hope%2C+and+joy%2C+to+do+it+in+the+details+of+a+doctrinal+and+theological+discussion%2C+whether+in+thanksgiving%2C+in+penitence%2C+or+prayer.+So+the+psalms+express+the+essence+of+them+all.+What+Christian+congregation+in+this+land+does+not+know+the+Redeemer%2C+the+name+of+Jesus%2C+and+the+Holy+Spirit%3F+Did+David+not+know+it+when+he+sang+Psalm+Ixxxviii.+1+%E2%80%94+%E2%80%9CLord+God%2C+my+Saviour%2C%E2%80%9D+%28my+Jesus%29+%E2%80%9Cday+and+night%2C+Before+thee+cried+have+I%2C%E2%80%9D-+etc.%0A%0ANay%2C+did+Abraham+not+know+it+when+he+%E2%80%9Csaw+his+day+afar+off%2C+and+was+glad%E2%80%9D%3F+Our+Lord+himself+hath+amply+taught+us%2C+both+personally%2C+and+by+His+inspired+apostles%2C+that+they+did%3B+and+are+we+not+to+know+it+when+we+sing+Psalms+il.%2C+xvi.%2C+xxii.%2C+xxiii.%2C+xlv.%2C+cx.%2C+cxviii.%2C+and+many+others%3F%0A%0ATo+sing+these+psalms+with+our+gospel+light%2C+is+to+enjoy+the+communion+of+saints+from+the+beginning+of+the+church+on+earth+even+until+now+%E2%80%94+a+communion+in+praise%2C+at+least%2C+which+sectarian+hymns+

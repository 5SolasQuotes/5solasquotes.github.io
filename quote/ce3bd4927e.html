<blockquote><p>9. There is a general warrant in Scripture for worship and moral actions, twofold: either when the major proposition is only in Scripture, and the assumption [minor premise] is the will of men, or when both the proposition and assumption are warranted by Scripture: the former warrant I think not sufficient, and therefore the latter is necessary to prove the thing lawful.</p></blockquote>

</figure><figure class="quote" id="q-9c6e5cd948" data-kw="">
<blockquote><p>There is a lot of psychological distress involved in even talking about it. I don’t care for the overuse of words like ‘trauma,’ but it really has felt traumatic, and we weren’t suffering the worst of it by any means. Our family has been shunned by the pastor because he didn’t believe we voted for him to be installed [as the pastor], although we did; you don’t realize how much damage it does to have your spiritual leader refuse to even speak to you, because it starts to seem normal. I was also reprimanded when one of the elders found out that I asked a question about the church’s unconventional sacramental practices to someone outside the church. There have been sustained, vicious attacks on family members by the session [of elders]. There is consistent abuse of Matthew 18 to stifle any publicly voiced criticisms of actions by the session. There is a lack of transparency: for example, the session refuses to release a comprehensive budget to the congregation, and makes major purchases without a congregational vote. Church discipline has no established procedure, and excommunication is done behind closed doors, without a public trial or public testimony by witnesses. Excommunications are also based on manufactured sins; the current excommunication, for example, is based on the charge of “living in darkness.” The pastor has literally pronounced eternal damnation over people who have criticized him in public. The session has even gone after people who left the church and are no longer members, going so far as to contact people’s ex-spouses to attempt to find incriminating information about them to convey to the non-member’s new pastor. They also routinely spread around information that was given in confidence for counseling purposes. Everyone we’ve told who is not in the church is appalled; in retrospect we wonder why it took so long for us to leave, but it really is painful. It was hard to leave for a number of reasons. First, we had a lot of specific doctrinal agreements with that church, that most other churches don’t share. Along with that came like-minded friends who we really did not want to give up. Things got incrementally worse over a long time, and quite often the leadership had semi-plausible explanations for their actions which were not easy to disprove. The worst of it was not targeted at us, and we thought we could just keep our heads down and avoid interacting with the session. We wished we could more vocally confront them, but the people being abused asked that we not get involved, so we didn’t feel that we could. Over time the cognitive dissonance grew worse, and it seemed to us the Holy Spirit had entirely withdrawn from the church. The church moving to a new building that was much farther away gave us a ready excuse to go elsewhere that couldn’t be argued with. Then the final decision was made for us when the pastor purported to damn our relative; that’s a bell that can’t really be unrung, and we couldn’t commune in good faith after that. We are members of the congregation. We are hoping the elders will just leave us alone, but they have harassed people who have left before, so we are trying to get under the shelter of another church quickly. We did a complete communication blackout. We blocked all of the communication outlets from all of the elders, so we won’t have to even see anything they might send which could tempt us to reply. Articles on spiritual abuse do capture very well the experience of being in the situation, the damage it does and the psychological consequences of getting out.</p></blockquote>

</figure><figure class="quote" id="q-f84e1e20f2" data-kw="">
<blockquote><p>For answering… how the Mediator is the object of divine worship: we shall first distinguish this title ‘object,’ then answer. By divines there is in this case a threefold object acknowledged (all agreeing to the Mediator in some respect): 1. There is objectum materiale, or, quod [‘that’], that is, the object, or Person to whom worship is given. 2. There is objectum formale, or, quo, that is, the account upon which it is given to that Person, or object. 3. There is objectum considerationis, that is, the consideration that the worshipper has of that object in worshipping of Him, and is as a motive thereto, or is (as the learned Voetius calls it, specificatio objecti) ‘the specification of the object,’ whereby the heart of the worshipper, by taking up the object worshipped under such a consideration, is warmed with love and thankfulness, and strengthened in his confidence, to worship that object. Thus, the relations that God took on Him to be the redeemer of His people from Egypt, and from the land of the North, did give no new object of worship, yet did they give some external denominations, or specifications, of that object, God, to them: the consideration whereof in their worshipping did much qualify the object to them, so that with the more thankfulness and confidence they might approach to Him: and thus we distinguish between the object worshipped, and the consideration which may be had of Him in our worship. And this does not make Him adorable simply and in Himself, because He was so naturally; but, it is the ground upon which He is accessible to us, who are sinners and enemies:</p></blockquote>

<blockquote><p>With regard to the form to be observed in receiving the sacraments, it is not without reason that you entertain doubts and scruples, for nothing is better than to abide by that pure simplicity which we hold from the Son of God, whose ordinance ought to be our single rule, to which also the usage of the apostles was perfectly conformable. And indeed the moment we deviate ever so little from it, our admixture of human invention cannot fail to be a corruption. But it seems to us that your condition is different from that of the pastors of the place and the great body of the people. If the pastors did their duty, they would employ all their endeavours to retrench those superfluities which do not tend to edification, or rather which serve to obscure the clearness of the gospel. The [civil] governors on their part would also do well to see to it. It is a vice to be condemned so far as they are concerned, that they keep up these unmeaning mummeries — which are as it were a residue of Popish superstitions, the recollection of which we should strive as much as in us lies to exterminate. But in your capacity of private individuals, not only you may lawfully, but what is more, you should support and suffer such abuses as it is not in your power to correct. We do not hold lighted candles in the celebration of the eucharist, nor figured bread to be such indifferent things that we would willingly consent to their introduction, or approve of them, though we object not to accommodate ourselves to the use of them, where they have been already established, when we have no authority to oppose them. If we were called upon to receive such ceremonies, we should hold ourselves bound according to the position in which God has placed us, to admit of no compromise in resisting their introduction, and in maintaining constantly the purity which the church confided to us already possesses. But should our lot be cast in some place where a different form prevails, there is not one of us who from spite against a candle or a chasuble [a ministerial vestment] would consent to separate himself from the body of the church, and so deprive himself of the use of the sacrament.</p></blockquote>

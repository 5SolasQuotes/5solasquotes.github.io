<main class="wrap"><figure class="quote" id="q-b88afc4031" data-kw="">
<blockquote><p>The beautiful is the same as the good, and they differ in aspect only. For since good is what all seek, the notion of good is that which calms the desire; while the notion of the beautiful is that which calms the desire, by being seen or known. Consequently those senses chiefly regard the beautiful, which are the most cognitive, viz., sight and hearing, as ministering to reason; for we speak of beautiful sights and beautiful sounds. But in reference to the other objects of the other senses, we do not use the expression beautiful, for we do not speak of beautiful tastes, and beautiful odors. Thus it is evident that beauty adds to goodness a relation to the cognitive faculty: so that good means that which simply pleases the appetite; while the beautiful is something pleasant to apprehend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 of pt. 2, q. 27, art. 1, reply to obj. 3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef8c84ca9f" data-kw="">
<blockquote><p>There are then a great number of truths, both of faith and of morality, which seem contradictory, and which all hold good together in a wonderful system. The source of all heresies is the exclusion of some of these truths, and the source of all the objections which the heretics make against us is the ignorance of some of our truths. And it generally happens that, unable to conceive the connection of two opposite truths, and believing that the admission of one involves the exclusion of the other, they adhere to the one, exclude the other, and think of us as opposed to them. Now exclusion is the cause of their heresy; and ignorance that we hold the other truth causes their objections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/blaise-pascal.html">Blaise Pascal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pensees</cite>, section 14, Appendix: ‘Polemical Fragments’ in Pensees – The Provincial Letters in The Modern Library (d. 1662; NY: Modern Library, 1941), p. 305</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>It is sure the way of truth must be still rationally convincing, such as does persuade by teaching and to fix and clear the judgment before the will, by manifestation of the truth to men’s conscience, for thus we are taught, and be always ready to render a reason of the hope that is in you with all meekness and fear, 1 Pet. 3:15.</p></blockquote>

</figure><figure class="quote" id="q-91b1f98b9f" data-kw="">
<blockquote><p>1. The beatitude of God is the eternal condition in himself of absolute satisfaction and delight. That’s bound up with God’s fullness of glory as the Father, the Son, and the Holy Spirit. Now that’s a traditional understanding of God’s beatitude. This is not something that I’m just coming up with myself. We may not hear a lot about the attribute of God’s beatitude, but it is a tradition throughout church history.

2. The outward beauty of God is expressed and perceivable as an aesthetic quality of his glory in his work of creation, redemption, and consummation. It’s important here to call attention to the distinctive characteristic of beauty. Beauty as beauty is not desired as a means to another end. Pleasure or delight associated with beholding the beautiful is its own end.

3. That characteristic to communicate the delight as its own end is correlative to that absolute self that characterizes God’s own eternal, internal life as Father, Son, and Spirit. The uniqueness of beauty, as opposed to goodness or truth (we just talked about the transcendentals there), is that beauty evokes a delight, but you don’t use that delight to then do something more. It is its own end.

4. We talk about God’s beatitude. It is its own end. It is itself delight. He’s self-satisfied. Where I draw this all together is with a postulation that the beauty of God in his outward works as it is perceived and experienced by human beings is what most clearly can be traced to that perfection of beatitude and sense of delight that belongs to God in himself as Father, Son, and Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-king.html">Jonathan King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How can I see the Beauty of God?</cite>, (2019) at Desiring God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>45. The Lord’s Supper shall be celebrated at least every month, and everyone at their location should strive that if the whole congregation cannot participate every Sunday (which most corresponds to Christ’s ordinance and to apostolic custom and is greatly desired), at least it should happen as often as possible…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b442d0187d" data-kw="">
<blockquote><p>Regarding laymen, suppose the Lord’s Supper is not administered in every way it ought to be (as through much of Church history). A layman ought not then to conform to and participate in such an inconvenient and actively scandalous ceremony. This may preclude one from receiving the Supper for many years or most of one’s life. Yet in the time of Hannah, were not the Israelites still bound to receive the sacrificial meals in 1 Sam. 2:12–17, though the corrupt priests had greatly marred them, adjoining the threat of physical coercion; and were not the Israelites in some measure to be blamed for withdrawing from and abhorring the offering of the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Regarding laymen, suppose the Lord’s Supper is not administered in every way it ought to be (as through much of Church history). A layman ought not then to conform to and participate in such an inconvenient and actively scandalous ceremony. This may preclude one from receiving the Supper for many years or most of one’s life. Yet in the time of Hannah, were not the Israelites still bound to receive the sacrificial meals in 1 Sam. 2:12–17, though the corrupt priests had greatly marred them, adjoining the threat of physical coercion; and were not the Israelites in some measure to be blamed for withdrawing from and abhorring the offering of the Lord?”

— Travis Fentiman, “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), p. 51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRegarding+laymen%2C+suppose+the+Lord%E2%80%99s+Supper+is+not+administered+in+every+way+it+ought+to+be+%28as+through+much+of+Church+history%29.+A+layman+ought+not+then+to+conform+to+and+participate+in+such+an+inconvenient+and+actively+scandalous+ceremony.+This+may+preclude+one+from+receiving+the+Supper+for+many+years+or+most+of+one%E2%80%99s+life.+Yet+in+the+time+of+Hannah%2C+were+not+the+Israelites+still+bound+to+receive+the+sacrificial+meals+in+1+Sam.+2%3A12%E2%80%9317%2C+though+the+corrupt+priests+had+greatly+marred+them%2C+adjoining+the+threat+of+physical+coercion%3B+and+were+not+the+Israelites+in+some+measure+to+be+blamed+for+withdrawing+from+and+abhorring+the+offering+of+the+Lord%3F%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+p.+51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb442d0187d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b442d0187d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/#:~:text=Regarding%20laymen%2C%20suppose%20the%20Lord%E2%80%99s%20Supper,abhorring%20the%20offering%20of%20the%20Lord&amp;text=Regarding%20laymen%2C%20suppose%20the%20Lord%E2%80%99s%20Supper%20is%20not&amp;text=from%20and%20abhorring%20the%20offering%20of%20the%20Lord" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0bce3d4602" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil112 (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>Q. What are the outward signs of this sacrament? A. Sacramental elements and actions. Q. What are the sacramental actions of the minister? A. The taking, blessing, and breaking the bread, and giving it, with the wine, to the communicants. Q. What is signified by the breaking of the bread? A. God’s breaking and bruising Christ for our sin.</p></blockquote>

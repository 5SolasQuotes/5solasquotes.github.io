<main class="wrap"><figure class="quote" id="q-d42412a951" data-kw="baptism of heretics">
<blockquote><p>What has been said in general of the baptism of heretics ought to be applied in particular to the baptism of the Romanists. Although we think it ought to be retained in those who come from them to us because the essentials of baptism remain with them; still we deny that it can rightly be sought or received from them, as will be proved more fully when we come to that subject. Sixteenth Question Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists I. Although this question appears to be less necessary in our day, when no one is baptized except with that baptism which the apostles administered; yet because it is wont to be fiercely agitated by the Romanists, we must speak briefly concerning it, in order that the truth of the orthodox doctrine concerning baptism may be the better illustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/administrators.html">Administrators</a> › <a href="../topics/baptism/administrators/heretical-baptism.html">Heretical baptism</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Baptism</cite></span></figcaption>

</figure><figure class="quote" id="q-cc1cc3dd52" data-kw="">
<blockquote><p>Baptism is not a means of regeneration, as the Lord’s Supper is of sanctification. … Paul, Cornelius, and the eunuch were regenerated before they were baptized.</p></blockquote>

</figure><figure class="quote" id="q-305c2b20cb" data-kw="">
<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on Mark 16:16 (the necessity of baptism)</span></figcaption>

</figure><figure class="quote" id="q-5304def06a" data-kw="">
<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>

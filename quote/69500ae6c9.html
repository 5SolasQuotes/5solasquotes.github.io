<blockquote><p>John Owen (1616–83), a prominent English Reformed theologian, emphasized the importance of affections in Christian life… Affections, as opposed to turbulent emotions, are regarded as a more delicate inclination and disposition of the soul… Owen’s theology is built in a theocentric way, with a particular emphasis on the experiential and pastoral aspects. This research investigates how Owen used the concept of affections to construct his anthroposensitive theology.</p></blockquote>

</figure><figure class="quote" id="q-0d4354917f" data-kw="">
<blockquote><p>Among these creatures theology deals especially with angels and human beings, since God has bestowed his image upon them. Propositions I. Although the entire universe is a mirror of the divine power, wisdom, and goodness, yet the image of God, properly speaking, is a quality only of angels and men. II. The image of God consists partly of natural gifts–the simple, invisible substance of angels and of human souls, life, intellect, will and immortality; and partly of supernatural ones–original blessedness, rectitude and majesty of intellect and will, and majesty and dominion over other creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wolleb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), p. 56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Among these creatures theology deals especially with angels and human beings, since God has bestowed his image upon them. Propositions I. Although the entire universe is a mirror of the divine power, wisdom, and goodness, yet the image of God, properly speaking, is a quality only of angels and men. II. The image of God consists partly of natural gifts–the simple, invisible substance of angels and of human souls, life, intellect, will and immortality; and partly of supernatural ones–original blessedness, rectitude and majesty of intellect and will, and majesty and dominion over other creatures.”

— Johannes Wolleb, Abridgment of Christian Divinity, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), p. 56">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAmong+these+creatures+theology+deals+especially+with+angels+and+human+beings%2C+since+God+has+bestowed+his+image+upon+them.+Propositions+I.+Although+the+entire+universe+is+a+mirror+of+the+divine+power%2C+wisdom%2C+and+goodness%2C+yet+the+image+of+God%2C+properly+speaking%2C+is+a+quality+only+of+angels+and+men.+II.+The+image+of+God+consists+partly+of+natural+gifts%E2%80%93the+simple%2C+invisible+substance+of+angels+and+of+human+souls%2C+life%2C+intellect%2C+will+and+immortality%3B+and+partly+of+supernatural+ones%E2%80%93original+blessedness%2C+rectitude+and+majesty+of+intellect+and+will%2C+and+majesty+and+dominion+over+other+creatures.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wolleb%2C+Abridgment+of+Christian+Divinity%2C+bk.+1%2C+ch.+5%2C+%E2%80%98Creation%E2%80%99+%281626%29+in+ed.+John+Beardslee%2C+Reformed+Dogmatics%3A+J.+Wollebius%2C+G.+Voetius+%26+F.+Turretin+%28Oxford+Univ.+Press%2C+1965%29%2C+p.+56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0d4354917f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0d4354917f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/man-the-image-of-god#:~:text=Among%20these%20creatures%20theology%20deals%20especially,majesty%20and%20dominion%20over%20other%20creatures&amp;text=Among%20these%20creatures%20theology%20deals%20especially%20with%20angels&amp;text=will%2C%20and%20majesty%20and%20dominion%20over%20other%20creatures" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d3bbb51ec1" data-kw="">
<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South End, IN: St. Augustine’s Press, 2015), ch. 16, ‘In Defense of the Perverted Faculty Argument’, pp. 385-86</span></figcaption>

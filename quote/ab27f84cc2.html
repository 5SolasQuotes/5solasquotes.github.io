<main class="wrap"><figure class="quote" id="q-ab27f84cc2" data-kw="">
<blockquote><p>Honest recreation: a thing that fitteth us for the service of God, and of every good duty; as Shooting, Music, putting forth of Riddles, and the like: for these the Word of God doth by name speak of. So David, 2. Sam. 1. 18. to teach the children of Judah to handle the Bow, uttered that Lamentation which is there extant of Saul and Jonathan. And himself, by the sweetness of his Music, refreshed the troubled heart of Saul, 1. Sam. 16. 24. Of the other we have an Example in the Riddle put forth by SAMSON, Judges 14. 14. Out of the eater came meat, and out of the strong came sweetness. The contrary whereof is, first, the dulling of our selves by a continual wearying of the mind and body, without intermission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Sacred Divinity Briefly &amp; Methodically Propounded: More Largely &amp; Clearly Handled and Explained</cite>, (London: William Stansby, [1625]), 1.5, pp 135-36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>XLVI. The FOURTH COMMANDMENT. Exod. 20.8, 9, 10, 11. Remember the Sabbath day to keep it holy, &amp;c.

<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-62b6e1860c" data-kw="">
<blockquote><p>This Sabbath is then kept holy unto the Lord, when men, after a due preparing of their hearts, and ordering of their common affairs beforehand, do not only observe an holy rest all the day from their own works, words, and thoughts, about their worldly employments and recreations (Ex 20:8; 16:23, 25-26, 29-30; 31:15-17; Isa 58:13; Neh 13:15-22); but also are taken up the whole time in the public and private exercises of his worship, and in the duties of necessity and mercy. (Isa 58:13; Mat 12:1-13)</p></blockquote>

</figure><figure class="quote" id="q-935e3e47e2" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water, which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears, and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now; There is sometimes an inevitable necessity by God’s providence, and sometimes a contracted necessity through want of care and foresight: in this case the work may sometimes be done, provided that our neglect beforehand be repented of:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath in The Works of Thomas Shepard</cite>, … (Boston, 1853), vol. 3, Theses Sabbaticae, pp. 258-59</span></figcaption>

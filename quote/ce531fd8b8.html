<main class="wrap"><figure class="quote" id="q-ce531fd8b8" data-kw="">
<blockquote><p>Another thing God did towards this work, at that time, was his inspiring David to show forth Christ and his redemption, in divine songs, which should be for the use of the church, in public worship, throughout all ages. David was himself endued with the spirit of prophecy.

He is called a prophet, Acts ii. 29.30. “Let me freely speak to you of the patriarch David, that he is both dead and buried, and his sepulchre is with us unto this day: therefore being a prophet, and knowing that God had sworn with an oath,” &amp;c. So that herein he was a type of Christ, that he was both a prophet and king.

We have no certain account of the time when David was first endued with the spirit of prophecy; but it is manifest, that it either was at the time that Samuel anointed him, or very soon after; for he appears soon after acted by this spirit, in the affair of Goliath: and then great part of the psalms were penned in the time of his troubles, before he came to the crown; as might be made manifest by an induction of particulars.

The oil that was used in anointing David was a type of the spirit of God; and the type and the antitype were given both together; as we are told, 1 Sam. xvi.13. “Then Samuel took the horn of oil, and anointed him in the midst of his brethren; and the spirit of the Lord came down upon David from that day forward:” and it is probable, that it now came upon him in its prophetical influences.

The way that this spirit influenced him was, to inspire him to show forth Christ, and the glorious things of his redemption, in divine songs, sweetly expressing the breathings of a pious soul, full of admiration of the glorious things of the Redeemer, inflamed with divine love, and lifted up with praise; and therefore he is called the sweet psalmist of Israel. 2 Sam. xxiii.1. “Now those be the last words of David: David the son of Jesse said, and the man who was raised up on high, the anointed of the God of Jacob, and the sweet psalmist of Israel.”

The main subjects of these sweet songs were the glorious things of the gospel; as is evident by the interpretation that is often put upon them, and the use that is made of them in the New Testament; for there is no one book of the Old Testament that is so often quoted in the New, as the book of Psalms. Joyfully did this holy man sing of those great things of Christ’s redemption, that had been the hope and expectation of God’s church and people from the beginning of the church of God on earth; and joyfully did others follow him in it, as Asaph, Heman, Ethan, and others; for the book of Psalms was not all penned by David, though the greater part of it was. Hereby the canon of scripture was further added to; and an excellent portion of divine writ was it that was added.

This was a great advancement that God made in this building; and the light of the gospel, which had been gradually growing from the fall, was exceedingly increased by it: for whereas before there was but here and there a prophecy given of Christ in a great many ages, nowhere Christ is spoken of by his ancestor David abundantly, in multitudes of songs, speaking of his incarnation, life, death, resurrection, ascension into heaven, his satisfaction, intercession; his prophetical, kingly, and priestly office; his glorious benefits in this life and that which is to come; his union with the church, and blessedness of the church in him; the calling of the Gentiles, the future glory of the church near the end of the world, and Christ’s coming to the final judgement. All these things, and many more, concerning Christ and his redemption, are abundantly spoken of in the book of Psalms.

This was also a glorious advancement of the affair of redemption, as God hereby gave his church a book of divine songs for their use in that part of their public worship, viz. singing his praises, throughout all ages to the end of the world. It is manifest the book of Psalms was given of God for this end. It was used in the church of Israel by God’s appointment: this is manifest by the title of many of the psalms, in which they are inscribed to the chief musician, i. e. to the man that was appointed to be the leader of divine songs in the temple, in the public worship of Israel.

So David is called, the sweet psalmist of Israel, because he penned psalms for the use of the church of Israel; and accordingly we have an account that they were actually made use of in the church of Israel for that end, even ages after David was dead; as 2 Chron. xxix.30. “Moreover, Hezekiah the king, and the princes, commanded the Levites to sing praises unto the Lord, with the words of David, and of Asaph the seer.”

And we find that the same are appointed in the New Testament to be made use of in the Christian church, in their worship: Eph. v. 19. “Speaking to yourselves in psalms, hymns, and spiritual songs.” Col. iii. 16. “Admonishing one another in psalms, hymns, and spiritual songs.” And so they have been, and will to the end of the world be made use of in the church to celebrate the praises of God. The people of God were wont sometimes to worship God by singing songs to his praise before; as they did at the Red sea; and they had Moses’s prophetical song, in the 32nd chapter of Deuteronomy, committed to them and Deborah, and Barak, and Hannah, sung praises to God: but now first did God commit to his church a book of divine songs for their constant use.</p></blockquote>

<blockquote><p>But the practice of this devotion [a psalmody] I derived from a higher precedent [and not just the Early Church], even of Christ and his apostles: for before the passion, immediately they sung a Psalm, saith the Scripture, hymno dicto, saith the vulgar Latin, ‘having recited or said a Psalm’. But however, it was part of David’s Psalter that was sung, it was the great Allelujah, as the Jews called it, beginning at the 113 psalm, to the 119 exclusively, part of that was sung… Against the example of Christ, if we confront the practice of Antichrist, nothing can be said greater in commendation of this manner of devotion: for B. Hippolytus, in his oration of the end of the world, saith that in the days of Antichrist, Psalmorum decantatio cessabit, they shall then no more use the singing or saying of the Psalms; which when I had observed. without any further deliberation I fixed upon the Psalter as the best weapon against him whose coming we have great reason to believe is not far off, so great preparation is making for him. From the example of Christ this grew to be a practice apostolical, and their devotion came exactly home to the likeness of the design of this very Book: they turned the Psalms into prayers. Thus it was said of Paul and Silas, Acts 16, ‘they prayed a Psalm’, so it is in the Greek… I only add this, that since according to the instruction of our blessed Savior, God is to be worshipped in Spirit and in truth, no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in Psalms and Hymns, and spiritual Songs, and the spirit of truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But the practice of this devotion [a psalmody] I derived from a higher precedent [and not just the Early Church], even of Christ and his apostles: for before the passion, immediately they sung a Psalm, saith the Scripture, hymno dicto, saith the vulgar Latin, ‘having recited or said a Psalm’. But however, it was part of David’s Psalter that was sung, it was the great Allelujah, as the Jews called it, beginning at the 113 psalm, to the 119 exclusively, part of that was sung… Against the example of Christ, if we confront the practice of Antichrist, nothing can be said greater in commendation of this manner of devotion: for B. Hippolytus, in his oration of the end of the world, saith that in the days of Antichrist, Psalmorum decantatio cessabit, they shall then no more use the singing or saying of the Psalms; which when I had observed. without any further deliberation I fixed upon the Psalter as the best weapon against him whose coming we have great reason to believe is not far off, so great preparation is making for him. From the example of Christ this grew to be a practice apostolical, and their devotion came exactly home to the likeness of the design of this very Book: they turned the Psalms into prayers. Thus it was said of Paul and Silas, Acts 16, ‘they prayed a Psalm’, so it is in the Greek… I only add this, that since according to the instruction of our blessed Savior, God is to be worshipped in Spirit and in truth, no worshipping can be more true, or more spiritual than the Psalter said with a pure mind and a hearty devotion. For David was God’s instrument to the Church, teaching and admonishing us (as our duty is to each other) in Psalms and Hymns, and spiritual Songs, and the spirit of truth was the Grand Dictator of what David wrote; so that we may confidently use this devotion as the Church of God ever did, making her addresses to God most frequently by the Psalms…”

— Robert Vaughan, The Psalter of David with Titles and Collects According to the Matter of Each Psalm, (Oxford, 1644), The Preface, no page number. This psalter only contains the 150 psalms.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+practice+of+this+devotion+%5Ba+psalmody%5D+I+derived+from+a+higher+precedent+%5Band+not+just+the+Early+Church%5D%2C+even+of+Christ+and+his+apostles%3A+for+before+the+passion%2C+immediately+they+sung+a+Psalm%2C+saith+the+Scripture%2C+hymno+dicto%2C+saith+the+vulgar+Latin%2C+%E2%80%98having+recited+or+said+a+Psalm%E2%80%99.+But+however%2C+it+was+part+of+David%E2%80%99s+Psalter+that+was+sung%2C+it+was+the+great+Allelujah%2C+as+the+Jews+called+it%2C+beginning+at+the+113+psalm%2C+to+the+119+exclusively%2C+part+of+that+was+sung%E2%80%A6+Against+the+example+of+Christ%2C+if+we+confront+the+practice+of+Antichrist%2C+nothing+can+be+said+greater+in+commendation+of+this+manner+of+devotion%3A+for+B.+Hippolytus%2C+in+his+oration+of+the+end+of+the+world%2C+saith+that+in+the+days+of+Antichrist%2C+Psalmorum+decantatio+cessabit%2C+they+shall+then+no+more+use+the+singing+or+saying+of+the+Psalms%3B+which+when+I+had+observed.+without+any+further+deliberation+I+fixed+upon+the+Psalter+as+the+best+weapon+against+him+whose+coming+we+have+great+reason+to+believe+is+not+far+off%2C+so+great+preparation+is+making+for+him.+From+the+example+of+Christ+this+grew+to+be+a+practice+apostolical%2C+and+their+devotion+came+exactly+home+to+the+likeness+of+the+design+of+this+very+Book%3A+they+turned+the+Psalms+into+prayers.+Thus+it+was+said+of+Paul+and+Silas%2C+Acts+16%2C+%E2%80%98they+prayed+a+Psalm%E2%80%99%2C+so+it+is+in+the+Greek%E2%80%A6+I+only+add+this%2C+that+since+according+to+the+instruction+of+our+blessed+Savior%2C+God+is+to+be+worshipped+in+Spirit+and+in+truth%2C+no+worshipping+can+be+more+true%2C+or+more+spiritual+than+the+Psalter+said+with+a+pure+mind+and+a+hearty+devotion.+For+David+was+God%E2%80%99s+instrument+to+the+Church%2C+teaching+and+admonishing+us+%28as+our+duty+is+to+each+other%29+in+Psalms+and+Hymns%2C+and+spiritual+Songs%2C+and+the+spirit+of+truth+was+the+Grand+Dictator+of+what+David+wrote%3B+so+that+we+may+confidently+use+this+devotion+as+the+Church+of+God+ever+did%2C+making+her+addresses+to+God+most+frequently+by+the+Psalms%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Robert+Vaughan%2C+The+Psalter+of+David+with+Titles+and+Collects+According+to+the+Matter+of+Each+Psalm%2C+%28Oxford%2C+1644%29%2C+The+Preface%2C+no+page+number.+This+psalter+only+contains+the+150+psalms.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff1c0d1278e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f1c0d1278e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=But%20the%20practice%20of%20this%20devotion,God%20most%20frequently%20by%20the%20Psalms&amp;text=But%20the%20practice%20of%20this%20devotion%20%5Ba%20psalmody&amp;text=addresses%20to%20God%20most%20frequently%20by%20the%20Psalms" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-15a0eb115b" data-kw="">
<blockquote><p>What is there, sir, concerning Christ’s kingdom that is not celebrated in the Psalms in the language of fulfilment? I say that even when the mystery of God shall have been finished, and both the fulness of Israel and the fulness of the Gentiles shall have been brought in, the Church may celebrate her millennial glory in the language of fulfilment from the Psalms of David.

“He mindful of his grace and truth To Israel’s house hath been; And the salvation of our God All ends of the earth have seen.”

All the ends of the earth that have seen the salvation of our God, know the Psalms of David. The Psalms are the grand catholic hymnal, and the singing of them provides for Christian union and for perfect catholicity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine</cite></span></figcaption>

<blockquote><p>The heart is the thing He chiefly calls for, expects, and eyes in all our performances… When we pray unto Him, praise Him, sing Psalms (2 Chron. 7:14; Isa. 26:9; Ps. 9:1; Col. 3:16; 1 Chron. 30:19), let’s do it with the heart. When we read or hear his Word, receive the Sacrament, or celebrate any other ordinance; let’s do it with the heart.</p></blockquote>

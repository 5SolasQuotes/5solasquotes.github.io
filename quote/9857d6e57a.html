<main class="wrap"><figure class="quote" id="q-9857d6e57a" data-kw="">
<blockquote><p>It [the covenant of grace] is called positively a new way. … Because it comes after another, as the apostle teaches us to argue, Heb. viii. 13. In that he saith, A new covenant, he hath made the first old. So may we say, when Christ is said to be a new way, there hath been then some way before, that is now made void, and made void by it, as this was.

There was a way by the first covenant, wherein sinless man might have been saved and happy. This was a way God never intended to bring one man to heaven by. Do not imagine, that God did ever design that which he never effected. When the Lord made the first covenant with Adam, he foresaw the event. If I may so speak, the first covenant was but a scaffold reared up a little while, that the glory of the new might be displayed.

The first covenant was, (1.) A covenant without a mediator, God and man treated immediately together; sinless creatures made in so great perfection, as God made them, were in case, if I may so speak, of treating with God. (2.) This covenant was made upon condition, that is to say, the blessings of that covenant were suspended until the duty of that covenant was fulfilled.

(3.) There were peremptory threatenings that did make all void, whenever it was incurred, In the day thou eatest thereof, thou shalt die. Sin broke this quite to pieces, this covenant of works, this covenant without a mediator, this covenant upon conditions, this covenant that might be broken by sin, is altogether removed, and no man can ever get good by it. The bridge is quite broke down; but such is the folly of this blind world, that multitudes will labour to build up this bridge again; whereas the day of the Lord, or a storm, will quickly discover how rotten it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Profession of Our Faith, Recommended in Several Sermons (1718) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 3: 180-81.</cite></span></figcaption>

</figure><figure class="quote" id="q-40b5bfce1f" data-kw="">
<blockquote><p>Wherefore we must grant two distinct covenants, rather than a twofold administration of the same covenant merely, to be intended. We must, I say, do so, provided always that the way of reconciliation and salvation was the same under both. But it will be said, —and with great pretense of reason, for it is that which is the sole foundation they all build upon who allow only a twofold administration of the same covenant, —&#x27;That this being the principal end of a divine covenant, if the way of reconciliation and salvation be the same under both, then indeed are they for the substance of them but one.&#x27; And I grant that this would inevitably follow, if it were so equally by virtue of them both. If reconciliation and salvation by Christ were to be obtained not only under the old covenant, but by virtue thereof, then it must be the same for substance with the new. But this is not so; for no reconciliation with God nor salvation could be obtained by virtue of the old covenant, or the administration of it, as our apostle disputes at large, though all believers were reconciled, justified, and saved, by virtue of the promise, whilst they were under the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 92</span></figcaption>

</figure><figure class="quote" id="q-91b2e85290" data-kw="">
<blockquote><p>If you would be silent under your greatest afflictions, your sharpest trials, then make this consideration your daily companion, viz., That all the afflictions that come upon you, come upon you by and through that covenant of grace that God hath made with you. In the covenant of grace, God hath engaged himself to keep you from the evils, snares, and temptations of the world; in the covenant of grace, God hath engaged himself to purge away your sins, to brighten and increase your graces, to crucify your hearts to the world, and to prepare you and preserve you to his heavenly kingdom; and by afflictions he effects all this, and that according to his covenant too: Ps. lxxxix. 30-34, ‘If his children forsake my law, and walk not in my commandments; if they break my statutes, and keep not my commandments.’ In these words you have a supposition that the saints may both fall into sins of commission and sins of omission; in the following words you have God’s gracious promise: ‘Then will I visit their transgressions with the rod, and their iniquities with stripes.’

God engages himself by promise and covenant, not only to chide and check, but also to correct his people for their sins: ‘Nevertheless, my loving-kindness will I not utterly take from him, nor suffer my faithfulness to fail.’ Afflictions are fruits of God’s faithfulness, to which the covenant binds him. God would be unfaithful, if first or last, more or less, he did not afflict his people. Afflictions are part of that gracious covenant which God hath made with his people; afflictions are mercies, yea, covenant mercies, Ps. cxix. 75. Hence it is that God is called the terrible God, keeping covenant and mercy, Neh. i. 5; because, by his covenant of mercy, he is bound to afflict and chastise his people.

God by covenant is bound to preserve his people, and not to suffer them to perish; and happy are they that are preserved, whether in salt and vinegar, or in wine and sugar. All the afflictions that come upon a wicked man come upon him by virtue of a covenant of works, and so are cursed unto him; but all the afflictions that come upon a gracious man, they come upon him by virtue of a covenant of grace, and so they are blessed unto him; and therefore he hath eminent cause to hold his peace, to lay his hand upon his mouth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 395.</span></figcaption>

<blockquote><p>Q. What are the false grounds of the Lord’s making the Covenant of Grace?

A. There are two bastard grounds devised by Arminians. 1. Because the Covenant of Works cannot oblige both to active and passive obedience, but to one of them only (say they) and the Covenant of Works was so rigid, that God could not follow it out, and cast infants in hell for a sin which is theirs, only by imputation, and was pardoned to the first man that committed it. Therefore he was necessitated to make a Covenant of Grace with all mankind, none excepted. But the Covenant of Works is broken, and can now be a way of Justification and salvation to none, but yet it obliges all. And sin cannot make us lawless, for the spiritual Law is of an eternal obligation.

2. They that never heard of Christ, perish by the Law, and not by the Covenant of Grace of which they never heard, and the Gospel is written in the heart of none. 3. The first Covenant was holy and spiritual, and God should unjustly threaten death upon infants, if they be not guilty of eternal condemnation, as Arminius, disp. pub. 7. th. 16.3. and the Scripture saith, infants are guilty of this sin, Eph. 2.3. Rom. 5. Psal. 51.5. Job 14.4. As also Christ must not have died for the sins of Infants, if there be no sin in them, they need not the ransom of Christ’s Blood.

The other bastard ground is, the natural antecedent desire and love of God to have all saved, moved him (say they) to make this Covenant of Grace with all. But this makes away free-grace, and changes God as the blind Talmud, which saith God hath a secret place in which he afflicts himself, because he burnt the Temple, and delivered the Jews to captivity. As also, the Lord remembering the captivity of the Jews, and their desolation, he powers out two tears every day in the Sea or Ocean, and for grief, smites his breasts with both his hands. And the Alcoran saith, that God and the Angels wish well to Mahomet, but cannot free him from death. So made the Heathen their Jupiter to deplore the destinies which he could not amend. And what is this, but to say, God hath passionate desires to have all, Elect, and Reprobate, Men, and Angels, to obey and be eternally saved, but he cannot help the matter; and therefore must upon the same account, be sorrowful and mourn that he cannot get all saved, which destroys the power of grace and restrains the outgoings of free-love.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-31d1b8ba34" data-kw="">
<blockquote><p>Now, it happens in certain things which are ordained towards an end that there is both a right and a wrong way to proceed: and for this reason, in the government of a multitude there is a distinction between right and wrong. A thing is rightly directed when it is led towards a fitting end; wrongly, when it is led towards an unfitting end. Now the end which befits a multitude of free men is different from that which befits a multitude of slaves, for the free man is one who exists for his own sake, while the slave, as such, exists for the sake of another.

If, therefore, a multitude of free men is ordered by the ruler towards the common good of the multitude, that rulership will be right and just, as is suitable to free men. If, on the other hand, a rulership aims not at the common good of the multitude, but at the private good of the ruler, it will be an unjust and perverted rulership. And hence the Lord threatens such rulers, saying by the mouth of Ezekiel: Woe to the shepherds that feed themselves, as seeking their own interest, should not the flocks be fed by the shepherd? (Ezek 34:2). Shepherds indeed should seek the good of their flocks, and every ruler the good of the multitude subject to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Ad Regem Cypri</cite>, (1266-67), Book 1, C. 1.</span></figcaption>

<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God</cite>, bk. 11, ch. 26 in NPNF1 2.220</span></figcaption>

</figure><figure class="quote" id="q-fe52bd7c6f" data-kw="">
<blockquote><p>Frame takes it for granted that “worldview” is a durable, if not permanent, concept. This assumption seems unwarranted. Worldview is itself a product of modern philosophy—of Hegel’s idealism, to be precise. Frame doesn’t see an antithesis between worldview and Christianity. But that tension needs to be explored. Worldview as a concept may not even survive the passing of the modern age. If not, then Christians need to be equipped for life after worldview.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-m-gamble.html">Richard M. Gamble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Horizons</cite>, (March 2017), a magazine of the OPC</span></figcaption>

</figure><figure class="quote" id="q-021583a31f" data-kw="">
<blockquote><p>Let your theologians [O Stapleton] dispute as much as they will that it is the least of all sins, and less than any venial one: what else do they reveal to all but their singular ignorance? If it is so minimal that it ought to be considered less than even any venial sin, then it cannot even be a sin, because what is less than venial is not to be placed among sins, since no sin is less than venial. Do you think Thomas felt this, when he writes that original sin is greater extensively than actual sin, but intensively less, because the actual has more of the nature of the voluntary (Thomas, in pt. 1 of 2, q. 82, art. 2)? If that reason does not deceive, they did rightly who placed it below any venial sin whatsoever, since in the slightest sin there is more of the voluntary than in the original, unless we are understood to have willed in Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

am" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Efficient causality is nothing else but the realization or actualization of something which did not previously exist. It is clear that this realization, defined in terms of its immediate relation to potential and actual being, is perceived by the intellect, the faculty of being, under the appearances of color, heat, etc., which are perceived by the senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God: his Existence &amp; his Nature</cite>, vol. 1 (B. Herder: 1945), pp. 131-32</span></figcaption>

<blockquote><p>I believe indeed that these men do auoid offenses, to wit, offenses of the world, that they would not be any offense unto tyrants and antichrists… But these be not the offenses which Christ taught to be avoided when He says of the scribes and Pharisees, ‘Let them alone, they are blind, and leaders of the blind.’ What offenses then be dissallowed?… Yea, and the weaker brethren newly conuerted unto the Gospel… But we ought (say they) to bear with the weak ones, and sometimes to frame ourselues unto them… Wherefore somewhat must be done for their weakeness’s sake: as Paul in his epistle to the Romans faithfully gave advise. We grant that somewhat must be consented to for their sakes that be so weak: howbeit… Yea, we must not always bear with the weak ones in those indifferent things, except in the meantime, while they may be the better and more perfectly taught. But when they once understand the thing, and yet nevertheless stick fast in their opinion, their weakeness is not to be nourished. Moreover, we must not so much bear with them, as by our example we should hurt others and also many members of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-vermigli.html">Peter Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places (), bk. 2, ch. 4, sect. 32-33</cite>, p. 321</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b00b9b705f" data-kw="">
<blockquote><p>5th Rule: To do any good action, or lawful, or indifferent, when I probably foresee a scandal will follow, is an active scandal, for I prefer my own will to my brother’s salvation (says Antoninus, and Navarret), and therefore says Antoninus: ‘A virgin going abroad, without just necessity, where her beauty shall be a snare to young men, or to go out upon a necessary cause with a whorish attire, is an active scandal,’ her feet ‘abideth not in her house,’ says Solomon (Prov. 7). And Navarre says, ‘It is to sin mortally’ and Silvester says: ‘If the Pope’s commandment do but smell of venial [light] sin, and if by giving audience thereunto it be presumed that the state of the Church shall be troubled, or a scandal shall arise, though the commandment go out under the pain of excommunication, it is not to be obeyed.’ Vasques and Suarez say to sell, gift or dispose of any things indifferent, when we foresee they shall abuse them, is to commit the sin of active scandalizing. Yea, the form of an idol, though he never adore it, does highly scandalize, and Antoninus, Silvester, Corduba, Metina [and] the Jesuit Zanches teach that to contribute to that which we see shall induce any to sin, is to be guilty of scandalizing. And the reasons be these: 1. We are not to prefer our will to the salvation of our brother. 2. Things less necessary than our brother’s salvation, in that case, become not necessary, and so fruitless and idl. 3. Charity infers that we hinder, so far as we can, the ruin of our brother’s soul; scandal is spiritual homicide. 4. To contribute any moral help and influence to our brother’s fall and soul-ruin, is to be accessary to his sin. Hence ceremonies and things not necessary to salvation may be omitted altogether in their specialities when the practicing of them does scandalize, and so though kneeling in God’s worship cannot well be universally omitted, yet kneeling appropriate to such an act of worship may be omitted, and ought to be omitted if it scandalize; and ceremonies which scandalize universally, seeing they are not in their very kind necessary to salvation, are to be abolished. Yet I may add one caution here. To contribute help for the doing of that which of itself is necessary, which I know another, in respect of human frailty, will abuse to sin is no active scandal. So to lay hands on a qualified pastor is not sin, though I foresee through human frailty [that] he will abuse his power in some things to sin. So for an artificer to make swords, though he know some shall abuse them to murdering the innocent, is no scandalous work. I take not on me to prescribe rules for eschewing scandal in all occurrences of providence. The godly-learned can see more than I can do in this matter, where love should be wary to lay a straw in the way of any weak traveler.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 13-14 of Question 2 in An Introduction to the Doctrine of Scandal in The Divine Right of Church Government (1646)</cite></span></figcaption>

</figure><figure class="quote" id="q-e3be58e389" data-kw="">
<blockquote><p>Thirdly, If an occasional offence of weaker brethren may be a ground for restraining Christian liberty, then much more may commands from lawful authority do it; but the offence of weaker brethren may restrain Christian liberty, as to the exercise of it, as appears by the apostle’s discourse, Rom. 14:21. The reason of the consequence lies here, that a case of mere offence, which is here pleaded towards weak brethren, cannot have that obligation upon conscience which a known duty of obeying lawful authority, in things in themselves lawful, has. Nay further, insisting only on the law of scandal, I would fain know whether it be a greater offence and scandal to Christians’ consciences to infringe the lawful authority of the magistrate and to deny obedience to his commands, in things undetermined by the Law of God, or else to offend the consciences, that is, go against the judgements of some well-meaning, but less-knowing Christians. Or thus, whether in the matter of scandal, it be a greater offence to go against the judgments of the weaker and more ignorant, or the more knowing and able, when the one have only their own weak apprehension to bias them, the other are backed by and grounded upon an established law. And whether it be not a greater scandal to religion to disobey a Christian magistrate than it is to offend some private Christians. Let these things be examined, and then let us see whether the argument will not hold à majori; if the law of scandal as to private Christians may restrain liberty, then may a command from the magistrate do it.</p></blockquote>

<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)”

— George Gillespie, English Popish Ceremonies (1637), pt. 2, ch. 8, p. 32-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIX.+Neither+can+the+indifferency+or+lawfulness+of+the+thing+done%2C+nor+the+ordinance+of+authority+commanding+the+use+of+it%2C+make+the+scandal+following+upon+it+to+be+only+passive+%5Band+hence+the+commanders+would+be+innocent%5D%2C+which+otherwise%2C+i.e.+in+case+the+thing+were+neither+lawful%2C+nor+ordained+by+authority%2C+should+be+active.+Not+the+former%3B+for+our+divines+teach+%28Hemmings.%2C+Enchir.+Theol.%2C+class+3%2C+ch.+17%3B+Magdeburg%2C+Century+1%2C+bk.+2%2C+ch.+4%2C+cols.+448-449%29+that+scandalum+datum+%5Bscandal+given%5D+rises+sometimes%2C+ex+facto-in+se+adiaphoro+%5Bout+of+the+fact+in+itself+by+the+thing+indifferent%5D+when+it+is+done+intempessive%2C+contra+charitatis+regulam+%5Bunseasonably+contra+the+rule+of+charity%5D.+Not+the+latter%3B+for+no+human+authority+can+take+away+the+condition+of+scandal+from+that+which+otherwise+should+be+scandal%2C+because+nullum+homo+potist+vel+charitati%2C+vel+conscientiis+nostris+imperare%2C+vel+periculum+scandali+d%E2%80%A2%E2%80%A6ti+prestar%E2%80%A2%E2%80%A6%2C+says+a+learned+casuist+%28Ames%2C+bk.+5%2C+de+Consc.%2C+ch.+11%2C+q.+6%29.+.+ch.+9%2C+p.+41+%E2%80%9D+If+this+be+not+taken+well+from+us%2C+let+one+of+our+opposites+speak+for+us%2C+who+aknowledges+that+human+power+cannot+make+us+do+that+which+we+cannot+do+without+giving+of+scandal%2C+and+that+in+this+case%2C+the+pretext+of+obedience+to+superiors+shall+not+excuse+us+at+the+hands+of+the+Supreme+Judge.+%28Dr.+%5BJohn%5D+Forbes%2C+Iren.%2C+bk.+2%2C+ch.+20%2C+num.+19%29%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+2%2C+ch.+8%2C+p.+32-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbda28d4fcf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bda28d4fcf.html">Permalink</a><a class="src" href="https://reformedbooks <blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>

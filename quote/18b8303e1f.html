<main class="wrap"><figure class="quote" id="q-18b8303e1f" data-kw="">
<blockquote><p>…the minister… is to begin with prayer: ‘In all reverence and humility acknowledging the incomprehensible greatness and majesty of the Lord, (in whose presence they do then in a special manner appear) and their own vileness and unworthiness to approach so near Him, with their utter inability of themselves to so great a work; and humbly beseeching Him for pardon, assistance, and acceptance, in the whole service then to be performed; and for a blessing on that particular portion of his word then to be read: And all in the name and mediation of the Lord Jesus Christ.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, Of the Assembling of the Congregation, and their Behaviour in the Publick Worship of God.</span></figcaption>

<blockquote><p>2. Rash [Schisms]. 1. Where a ground and cause is pretended, but it is but a light cause. Possibly… some corruptions in or about the worship of God, but those not destructive to the ordinances, being not in substance, but in ceremony; and those such as the person offended is not enforced to be active in… Now in this case to separate, it is a rash separation, because it is upon a ground not sufficient, a light ground.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brinsley-jr.html">John Brinsley Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Araignment of the Present Schism of New Separation in Old England</cite>, … (London: John Field, 1646) Brinsley (1600-1665) was an English nonconforming presbyterian clergyman and an ejected minister in 1662., pp. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-7f4dbee3fa" data-kw="">
<blockquote><p>[An objectionable belief and practice of Separatists and New England congregationalist churches:] 7. That a man that is sui juris [legally his own] may not lawfully stand member of such a church in which he cannot observe and enjoy all God’s ordinances, nor where any corruption in God’s worship or other sin is suffered unreformed, but if he be joined to it, he must separate from it, else he is defiled therewith. Answer to the 32 Questions, pp. 32-33; John Robinson, Justification, pp. 15-16, 197, 200-1; Johns., Plea, p. 245; Barrow, Discovery of the False Church, pp. 26, 29, 34, 38.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice</cite>, … (London, 1644), ch. 9, p. 35 Rathband was an English puritan and Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“[An objectionable belief and practice of Separatists and New England congregationalist churches:] 7. That a man that is sui juris [legally his own] may not lawfully stand member of such a church in which he cannot observe and enjoy all God’s ordinances, nor where any corruption in God’s worship or other sin is suffered unreformed, but if he be joined to it, he must separate from it, else he is defiled therewith. Answer to the 32 Questions, pp. 32-33; John Robinson, Justification, pp. 15-16, 197, 200-1; Johns., Plea, p. 245; Barrow, Discovery of the False Church, pp. 26, 29, 34, 38.”

</figure><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-8ef3bef083" data-kw="">
<blockquote><p>Furthermore that must be observed: what kind of idolatry that is which saint Paul says may fall into a brother and yet he retain the name of ‘brother’. (1 Cor. 8, 10) This appears upon the discourse he makes in that epistle to have been only a sitting down to eat at the feast of idolaters, made in honor of their idols, without any honor done to idols by sacrifice or bodily worship, and without any conscience of that meat more than of other. Which although he prove a species of idolatry: yet was that one of the least and lightest kinds, and such as holding still the foundation of Christianity, could not without obstinacy in it, cut [him] from the church. Whereby [it] falls out that the papists, which in their idolatry raze the foundations of true religion, cannot, by that place, come into any account of the church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, (Heidelberg, 1575), ‘Of election of ministers’, p. 246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

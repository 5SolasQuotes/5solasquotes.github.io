<blockquote><p>Now on the contrary side, whereas they of the Romish Church erroneously led, or perhaps by simplicity, confirmed therein through ignorance, and carried only with self-wild obstinacy, worship that whereof they but presume, and have (indeed) no knowledge of at all. For seeing that in the most part of their service, there is nothing else contained but human traditions, it is most evident, that there can likewise be nothing beside but opinion: that is to say, wavering and doubtful thoughts, tending either to good or evil, &amp; inconsonant or disagreeable to God. And since it is so, that where there is no faith, there can be no certainty: it must needs follow, that in whatsoever they introduce, there can be no assurance, considering therein is no faith contained.

But let us go a little further, those things which have nether faith nor certainty, must needs be matters much displeasing to God, because what soever is done without faith, is sin. Yet notwithstanding seeing it hath pleased God to give us such grace, as to hold his word in price and estimation, addicting our selves wholly to the service thereof, as neither speaking or thinking any thing, but what is therein uttered and prescribed to us, that we might embrace the very least particle therein contained, we may say and speak it by good right, that we know, namely by a knowledge more firm, then are all the sciences and demonstrations induced by human sense or discourse.

For our faith being grounded on the word of God, holdeth more strictly then all else in the world beside can do: it is firm and stable, subject to no kind of alteration whatsoever. Following then the contents of this word, we believe in our hearts, &amp; confess with our mouths, that God only is to be served &amp; honoured, &amp; that the service due to his Majesty, ought to be given according to his good pleasure &amp; ordinance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-la-faye.html">Antoine de la Faye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief treatise of the virtue of the cross and the true manner how to honour it</cite>, trans. Anthony Munday (London: Edward White, 1599), unpaginated.</span></figcaption>

<blockquote><p>Obj. 2. The covenant was occasional and temporary, being made upon the occasion of the prevalency and growing power of the enemy (as is mentioned in the narrative), which foundation being taken away the superstructure cannot stand.

Ans. 1. … Shall we therefore be no longer bound to obey and maintain good laws, because the evils which gave occasion to their making have ceased?

2. The covenant doth, in express words, oblige us constantly, and all the days of our lives, to pursue the ends therein expressed; so that to hold it but a temporary obligation is a breach of covenant.

3. There is not any one of the ends of the covenant which is yet fully attained. The very Directory of Worship is not observed in most places of the kingdom; neither is the abolition of prelacy, and of the Book of Common Prayer, yet established by act of parliament.

4. If we had attained the ends of the covenant (which we have not), yet non minor est virtus quam quorere parta tueri, and the recidivation may prove worse than the first disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, (1649; Edinburgh, 1844), pp 87-88.</span></figcaption>

<blockquote><p>We come now to the principal relics of our Lord, viz., those connected with his sufferings and death. And, first, let us consider the case of the cross on which he was suspended. I know it is regarded as a certain fact, that Helena, the mother of the Emperor Constantine, discovered it. And I am not ignorant of what ancient Doctors have written, to prove that it undoubtedly was the cross on which our Saviour was crucified. Let all those have their due credit, though it was vain curiosity, or ill-judged religious zeal, that caused Helena to make the search for it. But assuming that her exertions to find out the cross are worthy of all praise, and that our Lord himself, after it was found, miraculously declared that it was truly his cross, let us see how the matter is to be viewed with reference to our own times. The cross which Helena found is said to be still at Jerusalem. And no one calls this in question, though it is plainly inconsistent with ecclesiastical history, which relates that Helena sent part of it to the emperor her son, by whom it was placed on a pillar of porphyry at Constantinople; and that she inclosed the remainder in a silver chest, which she gave to the Bishop of Jerusalem for preservation. Therefore, we must either accuse the history of falsehood, or the things told of the true cross in the present day are utterly vain and frivolous. Again, let us consider how many fragments of it are scattered up and down over the whole globe. A mere enumeration of those of which I have a catalogue would certainly fill a goodly volume. There is no town, however small, which has not some morsel of it, and this not only in the principal cathedral church of the district, but also in parish churches. There is no abbey so poor as not to have a specimen. In some places, larger fragments exist, as at Paris, in the Holy Chapel, at Poictiers, and at Rome, where a crucifix of tolerable size is said to have been entirely made out of it. In fine, if all the pieces which could be found were collected into a heap, they would form a good ship-load, though the gospel testifies, that a single individual was able to carry it. What effrontery, then, thus to fill the whole world with fragments, which it would take more than three hundred men to carry? But they have fallen upon an explanation, and it is, that how much soever may be cut from it, it never grows less. But this device is too foolish and absurd for the superstitious themselves not easily to see through it. I leave it to all men to consider what certainty can be had as to the genuineness of all the pieces of wood which are worshipped in all the different places as the true cross. Whence certain fragments were brought, and by what way and means, I omit to say; some affirming that they were brought to them by angels, others that they dropt from heaven. Those of Poictiers say, that the piece which they have was stolen by a maid-servant of Helena, and carried off, and that she having afterwards fled, brought it, in the course of her wanderings, into that district. They also add to the story that she was lame. Such are the illustrious grounds on which they stimulate the wretched populace to idolatry. And not contented with imposing on the rude and ignorant, by displaying a piece of common wood as the wood of the cross, they have declared it every way worthy of adoration. The doctrine is altogether devilish, and Ambrose expressly condemns it as heathen superstition. Next after the cross comes the title which Pilate ordered to be affixed to it, and on which he wrote, “Jesus of Nazareth, King of the Jews.” But we must know the time, place, and manner, of its being found. It will be said that Socrates, the Ecclesiastical Historian, makes mention of it. This I admit. But he says nothing as to what became of it, and hence his testimony is of no great weight. Besides, that inscription having been written hastily, and on the spur of the moment, after our Saviour had been actually crucified, it is most irrational to suppose that it was a picture painted skillfully as for display. Were only one exhibited, it might deservedly be deemed false and fictitious, but when the people of Tholouse say that they have it, and those of Rome contradict them, and show it in the church of Santa Croce, they convict each other of falsehood. Let them, therefore, debate the matter among themselves as long as they please; in the end, if all things are duly examined, both will be proved false. There is a still greater controversy as to the nails. I will mention those of which I have heard, and from them the merest child will judge how grossly the devil had deluded mankind, after having deprived them of all sense and reason, and so made them incapable of exercising any discernment in the matter. If ancient writers, and especially Theodoret, the historian of the ancient Church, say true, Helena ordered one to be fixed in her son’s helmet, and the other two to be fitted to his horse’s bridle. Yet Ambrose does not express an unqualified assent. For he says, that one was fixed in the crown of Constantine, that his horse-bit was made of the second, and that Helena kept the third to herself. We thus see, that twelve hundred years ago there was a controversy as to what became of the nails. What certainty, then, can we now have? The Milanese boast of having the one which was fitted to the horse’s bridle, while the inhabitants of Carpentras interpose, and claim it for themselves. But Ambrose does not say at all that it was fitted to the bit, but that it was made into a bit, an account which cannot by any possibility agree with what is affirmed by the inhabitants of Milan and of Carpentras. There are also two nails at Rome, one in the church of St Helena, and another in that of Santa Croce. Then there is one at Sienna, another at Venice, two in Germany, viz. at Cologne, in the church of the Three Maries, and at Treves. In France, there is one in the Holy Chapel, another in the possession of the Carmelites, another at the church of St Denis, in the Isle of France, another at Bourges, another in the Abbey of Ciseaux, and another at Draguignan. Here we have them to the number of fourteen. Moreover, each place seems confident of the sufficiency of the proof in its favour. One thing certainly I will concede, that all the claims are equally good, and hence nothing is simpler than to pass the same sentence upon all, namely, to account them all, in spite of their boasting, to be spurious. There is no other way of unravelling the matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Admonition Showing the Advantages Which Christendom Might Derive From an Inventory of Relics</cite>, Vol. 1 | Edinburgh: Calvin Translation Society, 1844, pp. 301–04</span></figcaption>

y made out of it. In fine, if all the pieces which could be found were collected into a heap, they would form a good ship-load, though the gospel testifies, that a single individual was able to carry it. What effrontery, then, thus to fill the whole world with fragments, which it would take more than three hundred men to carry? But they have fallen upon an explanation, and it is, that how much soever may be cut from it, it never grows less. But this device is too foolish and absurd for the superstitious themselves not easily to see through it. I leave it to all men to consider what certainty can be had as to the genuineness of all the pieces of wood which are worshipped in all the different places as the true cross. Whence certain fragments were brought, and by what way and means, I omit to say; some affirming that they were brought to them by angels, others that they dropt from heaven. Those of Poictiers say, that the piece which they have was stolen by a maid-servant of Helena, and carried off, and that she having afterwards fled, brought it, in the course of her wanderings, into that district. They also add to the story that she was lame. Such are the illustrious grounds on which they stimulate the wretched populace to idolatry. And not contented with imposing on the rude and ignorant, by displaying a piece of common wood as the wood of the cross, they have declared it every way worthy of adoration. The doctrine is altogether devilish, and Ambrose expressly condemns it as heathen superstition. Next after the cross comes the title which Pilate ordered to be affixed to it, and on which he wrote, “Jesus of Nazareth, King of the Jews.” But we must know the time, place, and manner, of its being found. It will be said that Socrates, the Ecclesiastical Historian, makes mention of it. This I admit. But he says nothing as to what became of it, and hence his testimony is of no great weight. Besides, that inscription having been written hastily, and on the spur of the moment, after our Saviour had been actually crucified, it is most irrational to suppose that it was a picture painted skillfully as for display. Were only one exhibited, it might deservedly be deemed false and fictitious, but when the people of Tholouse say that they have it, and those of Rome contradict them, and show it in the church of Santa Croce, they convict each other of falsehood. Let them, therefore, debate the matter among themselves as long as they please; in the end, if all things are duly examined, both will be proved false. There is a still greater controversy as to the nails. I will mention those of which I have heard, and from them the merest child will judge how grossly the devil had deluded mankind, after having deprived them of all sense and reason, and so made them incapable of exercising any discernment in the matter. If ancient writers, and especially Theodoret, the historian of the ancient Church, say true, Helena ordered one to be fixed in her son’s helmet, and the other two to be fitted to his horse’s bridle. Yet Ambrose does not express an unqualified assent. For he says, that one was fixed in the crown of Constantine, that his horse-bit was made of the second, and that Helena kept the third to herself. We thus see, that twelve hundred years ago there was a controversy as to what became of the nails. What certainty, then, can we now have? The Milanese boast of having the one which was fitted to the horse’s bridle, while the inhabitants of Carpentras interpose, and claim it for themselves. But Ambrose does not say at all that it was fitted to the bit, but that it was made into a bit, an account which cannot by any possibility agree with what is affirmed by the inhabitants of Milan and of Carpentras. There are also two nails at Rome, one in the church of St Helena, and another in that of Santa Croce. Then there is one at Sienna, another at Venice, two in Germany, viz. at Cologne, in the church of the Three Maries, and at Treves. In France, there is one in the Holy Chapel, another in the possession of the Carmelites, another at the church of St Denis, in the Isle of France, another at Bourges, another in the Abbey of Ciseaux, and another at Draguignan. Here we have them to the number of fourteen. Moreover, each place seems confident of the sufficiency of the proof in its favour. One thing certainly I will concede, that all the claims are equally good, and hence nothing is simpler than to pass the same sentence upon all, namely, to account them all, in spite of their boasting, to be spurious. There is no other way of unravelling the matter.”

— John Calvin, An Admonition Showing the Advantages Which Christendom Might Derive From an Inventory of Relics, Vol. 1 | Edinburgh: Calvin Translation Society, 1844, pp. 301–04">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+come+now+to+the+principal+relics+of+our+Lord%2C+viz.%2C+those+connected+with+his+sufferings+and+death.+And%2C+first%2C+let+us+consider+the+case+of+the+cross+on+which+he+was+suspended.+I+know+it+is+regarded+as+a+certain+fact%2C+that+Helena%2C+the+mother+of+the+Emperor+Constantine%2C+discovered+it.+And+I+am+not+ignorant+of+what+ancient+Doctors+have+written%2C+to+prove+that+it+undoubtedly+was+the+cross+on+which+our+Saviour+was+crucified.+Let+all+those+have+their+due+credit%2C+though+it+was+vain+curiosity%2C+or+ill-judged+religious+zeal%2C+that+caused+Helena+to+make+the+search+for+it.+But+assuming+that+her+exertions+to+find+out+the+cross+are+worthy+of+all+praise%2C+and+that+our+Lord+himself%2C+after+it+was+found%2C+miraculously+declared+that+it+was+truly+his+cross%2C+let+us+see+how+the+matter+is+to+be+viewed+with+reference+to+our+own+times.+The+cross+which+Helena+found+is+said+to+be+still+at+Jerusalem.+And+no+one+calls+this+in+question%2C+though+it+is+plainly+inconsistent+with+ecclesiastical+history%2C+which+relates+that+Helena+sent+part+of+it+to+the+emperor+her+son%2C+by+whom+it+was+placed+on+a+pillar+of+porphyry+at+Constantinople%3B+and+that+she+inclosed+the+remainder+in+a+silver+chest%2C+which+she+gave+to+the+Bishop+of+Jerusalem+for+preservation.+Therefore%2C+we+must+either+accuse+the+history+of+falsehood%2C+or+the+things+told+of+the+true+cross+in+the+present+day+are+utterly+vain+and+frivolous.+Again%2C+let+us+consider+how+many+fragments+of+it+are+scattered+up+and+down+over+the+whole+globe.+A+mere+enumeration+of+those+of+which+I+have+a+catalogue+would+certainly+fill+a+goodly+volume.+There+is+no+town%2C+however+small%2C+which+has+not+some+morsel+of+it%2C+and+this+not+only+in+the+principal+cathedral+church+of+the+district%2C+but+also+in+parish+churches.+There+is+no+abbey+so+poor+as+not+to+have+a+specimen.+In+some+places%2C+larger+fragments+exist%2C+as+at+Paris%2C+in+the+Holy+Chapel%2C+at+Poictiers%2C+and+at+Rome%2C+where+a+crucifix+of+tolerable+size+is+said+to+have+been+entirely+made+out+of+it.+In+fine%2C+if+all+the+pieces+which+could+be+found+were+collected+into+a+heap%2C+they+would+form+a+good+ship-load%2C+though+the+gospel+testifies%2C+that+a+single+individual+was+able+to+carry+it.+What+effrontery%2C+then%2C+thus+to+fill+the+whole+world+with+fragments%2C+which+it+would+take+more+than+three+hundred+men+to+carry%3F+But+they+have+fallen+upon+an+explanation%2C+and+it+is%2C+that+how+much+soever+may+be+cut+from+it%2C+it+never+grows+less.+But+this+device+is+too+foolish+and+absurd+for+the+superstitious+themselves+not+easily+to+see+through+it.+I+leave+it+to+all+men+to+consider+what+certainty+can+be+had+as+to+the+genuineness+of+all+the+pieces+of+wood+which+are+worshipped+in+all+the+different+places+as+the+true+cross.+Whence+certain+fragments+were+brought%2C+and+by+what+way+and+means%2C+I+omit+to+say%3B+some+affirming+that+they+were+brought+to+them+by+angels%2C+others+that+they+dropt+from+heaven.+Those+of+Poictiers+say%2C+that+the+piece+which+they+have+was+stolen+by+a+maid-servant+of+Helena%2C+and+carried+off%2C+and+that+she+having+afterwards+fled%2C+brought+it%2C+in+the+course+of+her+wanderings%2C+into+that+district.+They+also+add+to+the+story+that+she+was+lame.+Such+are+the+illustrious+grounds+on+which+they+stimulate+the+wretched+populace+to+idolatry.+And+not+contented+with+imposing+on+the+rude+and+ignorant%2C+by+displaying+a+piece+of+common+wood+as+the+wood+of+the+cross%2C+they+have+declared+it+every+way+worthy+of+adoration.+The+doctrine+is+altogether+devilish%2C+and+Ambrose+expressly+condemns+it+as+heathen+superstition.+Next+after+the+cross+comes+the+title+which+Pilate+ordered+to+be+affixed+to+it%2C+and+on+which+he+wrote%2C+%E2%80%9CJesus+of+Nazareth%2C+King+of+the+Jews.%E2%80%9D+But+we+must+know+the+time%2C+place%2C+and+manner%2C+of+its+being+found.+It+will+be+said+that+Socrates%2C+the+Ecclesiastical+Historian%2C+makes+mention+of+it.+This+I+admit.+But+he+says+nothing+as+to+what+became+of+it%2C+and+hence+his+testimony+is+of+no+great+weight.+Besides%2C+that+inscription+having+been+written+hastily%2C+and+on+the+spur+of+the+moment%2C+after+our+Saviour+had+been+actually+crucified%2C+it+is+most+irrational+to+suppose+that+it+was+a+picture+painted+skillfully+as+for+display.+Were+only+one+exhibited%2C+it+might+deservedly+be+deemed+false+and+fictitious%2C+but+when+the+people+of+Tholouse+say+that+they+have+it%2C+and+those+of+Rome+contradict+them%2C+and+show+it+in+the+church+of+Santa+Croce%2C+they+convict+each+other+of+falsehood.+Let+them%2C+therefore%2C+debate+the+matter+among+themselves+as+long+as+they+please%3B+in+the+end%2C+if+all+things+are+duly+examined%2C+both+will+be+proved+false.+There+is+a+still+greater+controversy+as+to+the+nails.+I+will+mention+those+of+which+I+have+heard%2C+and+from+them+the+merest+child+will+judge+how+grossly+the+devil+had+deluded+mankind%2C+after+having+deprived+them+of+all+sense+and+reason%2C+and+so+made+them+incapable+of+exercising+any+discernment+in+the+matter.+If+ancient+writers%2C+and+especially+Theodoret%2C+the+historian+of+the+ancient+Church%2C+say+true%2C+Helena+ordered+one+to+be+fixed+in+her+son%E2%80%99s+helmet%2C+and+the+other+two+to+be+fitted+to+his+horse%E2%80%99s+bridle.+Yet+Ambrose+does+not+express+an+unqualified+assent.+For+he+says%2C+that+one+was+fixed+in+the+crown+of+Constantine%2C+that+his+horse-bit+was+made+of+the+second%2C+and+that+Helena+kept+the+third+to+herself.+We+thus+see%2C+that+twelve+hundred+years+ago+there+was+a+controversy+as+to+what+became+of+the+nails.+What+certainty%2C+then%2C+can+we+now+have%3F+The+Milanese+boast+of+having+the+one+which+was+fitted+to+the+horse%E2%80%99s+bridle%2C+while+the+inhabitants+of+Carpentras+interpose%2C+and+claim+it+for+themselves.+But+Ambrose+does+not+say+at+all+that+it+was+fitted+to+the+bit%2C+but+that+it+was+made+into+a+bit%2C+an+account+which+cannot+by+any+possibility+agree+with+what+is+affirmed+by+the+inhabitants+of+Milan+and+of+Carpentras.+There+are+also+two+nails+at+Rome%2C+one+in+the+church+of+St+Helena%2C+and+another+in+that+of+Santa+Croce.+Then+there+is+one+at+Sienna%2C+another+at+Venice%2C+two+in+Germany%2C+viz.+at+Cologne%2C+in+the+church+of+the+Three+Maries%2C+and+at+Treves.+In+France%2C+there+is+one+in+the+Holy+Chapel%2C+another+in+the+possession+of+the+Carmelites%2C+another+at+the+church+of+St+Denis%2C+in+the+Isle+of+France%2C+another+at+Bourges%2C+another+in+the+Abbey+of+Ciseaux%2C+and+another+at+Draguignan.+Here+we+have+them+to+the+number+of+fourteen.+Moreover%2C+each+place+seems+confident+of+the+sufficiency+of+the+proof+in+its+favour.+One+thing+certainly+I+will+concede%2C+that+all+the+claims+are+equally+good%2C+and+hence+nothing+is+simpler+than+to+pass+the+same+sentence+upon+all%2C+namely%2C+to+account+them+all%2C+in+spite+of+their+boasting%2C+to+be+spurious.+There+is+no+other+way+of+unravelling+the+matter.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+An+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+301%E2%80%9304&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f7e83fec4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f7e83fec4.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-5/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

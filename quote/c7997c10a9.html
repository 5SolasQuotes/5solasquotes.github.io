<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into by all the members of the visible Church of one nation or kingdom: when the Church in that kingdom or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not accrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn Covenant in the presence of God. 4. …it is lawful also expressely, publicly and solemnly to vow to God those things which are in the precepts of God enjoined to all believers: But that necessity of making this public, solemn and express covenant, in the presence of the whole Church, requiring it as a thing of absolute necessity to the essential constitution of a particular church, we do not acknowledge: But that union above mentioned, we conceive sufficient by the Word of God for the joining men professing the faith into one particular church. So that, by the Word of God, to the essence and entireness of a particular Church, this union is sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God</cite>, (London, 1645), ch. 2, ‘Of a church-covenant’, pp. 15-16</span></figcaption>

<blockquote><p>4. It is none of our controversy whether this [SL&amp;C] or any other covenant or vow do bind us to rebellion, sedition or any unlawful act; we renounce all such obligation.

5. Yea, we hold that neither this, nor any other vows of our own can prevent any obligation that the king has authority to impose upon us in things great or small; else men might disable magistrates to rule them and exempt themselves from obedience by vowing beforehand not to obey.</p></blockquote>

<blockquote><p>Now because lots may say to cards what Naomi said to Boaz, ‘They are near unto us, and of our affinity,’ something also of the use of them. It were no great harm if there were no other cards used than those of clothiers about wool and of mariners in the ship. But as for cards to play with, let us not wholly condemn them, lest lacing our consciences too straight we make them to grow awry on the wrong side. Such recreations are lawful if we use them as Jonathan tasted the honey, putting forth the end of his rod he touched a little of it, and his eyes were cleared. But let us take heed of a surfeit into which those do fall who either play out of covetousness, or for more than their estates can bear, or constantly and continually; all their meat is sauce, all the days in their almanac play-days, though few holy-days. The Creation lasted but a week, but these men’s recreations all the days of their lives; such using of lawful exercises is altogether unlawful.</p></blockquote>

Online</a></div>
</figure><figure class="quote" id="q-59fd7dbf92" data-kw="">
<blockquote><p>It is farther observed in this Answer [of the Larger Catechism], that men take the name of God in vain by sinful lots. This subject, however, needs explanation. Let it be considered, then, that when lots were an ordinance, by which God in an extraordinary manner determined things which were before unknown, they being an instituted means of appealing to Him for that end, as in the case of Achan and others, were not to be used in a common way; for to have used them so would have been a profaning of a sacred institution. But as this extraordinary ordinance has now ceased, it does not seem unlawful, so as to be an instance of profaneness to make use of lots in civil matters, provided we do not consider them as an ordinance which God has appointed, in which we think we have ground to expect his immediate interposition and to depend upon it as if it were a divine oracle. In this view it would be unlawful, at present, to use lots in any respect whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (d. 1734; NY: Robert Carter, 1855), vol. 2, p. 340 Ridgley (c. 1667–1734) was an English dissetning minister and here wrote the first commentary on Westminster’s Larger Catechism.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is farther observed in this Answer [of the Larger Catechism], that men take the name of God in vain by sinful lots. This subject, however, needs explanation. Let it be considered, then, that when lots were an ordinance, by which God in an extraordinary manner determined things which were before unknown, they being an instituted means of appealing to Him for that end, as in the case of Achan and others, were not to be used in a common way; for to have used them so would have been a profaning of a sacred institution. But as this extraordinary ordinance has now ceased, it does not seem unlawful, so as to be an instance of profaneness to make use of lots in civil matters, provided we do not consider them as an ordinance which God has appointed, in which we think we have ground to expect his immediate interposition and to depend upon it as if it were a divine oracle. In this view it would be unlawful, at present, to use lots in any respect whatsoever.”

— Thomas Ridgley, A Body of Divinity (d. 1734; NY: Robert Carter, 1855), vol. 2, p. 340 Ridgley (c. 1667–1734) was an English dissetning minister and here wrote the first commentary on Westminster’s Larger Catechism.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+farther+observed+in+this+Answer+%5Bof+the+Larger+Catechism%5D%2C+that+men+take+the+name+of+God+in+vain+by+sinful+lots.+This+subject%2C+however%2C+needs+explanation.+Let+it+be+considered%2C+then%2C+that+when+lots+were+an+ordinance%2C+by+which+God+in+an+extraordinary+manner+determined+things+which+were+before+unknown%2C+they+being+an+instituted+means+of+appealing+to+Him+for+that+end%2C+as+in+the+case+of+Achan+and+others%2C+were+not+to+be+used+in+a+common+way%3B+for+to+have+used+them+so+would+have+been+a+profaning+of+a+sacred+institution.+But+as+this+extraordinary+ordinance+has+now+ceased%2C+it+does+not+seem+unlawful%2C+so+as+to+be+an+instance+of+profaneness+to+make+use+of+lots+in+civil+matters%2C+provided+we+do+not+consider+them+as+an+ordinance+which+God+has+appointed%2C+in+which+we+think+we+have+ground+to+expect+his+immediate+interposition+and+to+depend+upon+it+as+if+it+were+a+divine+oracle.+In+this+view+it+would+be+unlawful%2C+at+present%2C+to+use+lots+in+any+respect+whatsoever.%E2%80%9D%0A%0A%E2%80%94+Thomas+Ridgley%2C+A+Body+of+Divinity+%28d.+1734%3B+NY%3A+Robert+Carter%2C+1855%29%2C+vol.+2%2C+p.+340+Ridgley+%28c.+1667%E2%80%931734%29+was+an+English+dissetning+minister+and+here+wrote+the+first+commentary+on+Westminster%E2%80%99s+Larger+Catechism.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F59fd7dbf92.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/59fd7dbf92.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-lots-dice-games-using-free-contingent-causes/#:~:text=It%20is%20farther%20observed%20in%20this,use%20lots%20in%20any%20respect%20whatsoever&amp;text=It%20is%20farther%20observed%20in%20this%20Answer%20%5Bof&amp;text=present%2C%20to%20use%20lots%20in%20any%20respect%20whatsoever" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

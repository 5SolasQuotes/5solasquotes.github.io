<main class="wrap"><figure class="quote" id="q-ecdf1a866d" data-kw="">
<blockquote><p>Now in receiving the sacrament of the Eucharist, the memory of the Lord’s death and of the whole mystery of our redemption through the incarnate Word of God is reopened, the acknowledgement of God’s testament is renewed, and the blessed communion of Christ and remission of sins through his sacrifice given on the altar of the cross is offered.

So in this sacrament, if received rightly and with faith, not by any power of the work [vi operis] but by the free benefit of Christ which we apprehend in believing, we acknowledge that our sins are forgiven, the covenant between God and ourselves confirmed, and God’s very Son, who possesses life in himself through the Father, is received in such a way that whoever partakes of his flesh and blood in true faith lives through him, so that the heavenly inheritance is possessed by the faithful, as far as the state of this life permits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), dedication, pp 11-12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e276a209dc" data-kw="">
<blockquote><p>The median position we hold … requires us not to tear asunder the hypostatic union of Christ (as they call it), on account of which the properties of the two natures, divine and human, communicate with each other; yet also to distinguish with sound understanding exactly what we have communicated by alternation of the properties, so that the divinity is not made subject to human infirmities, nor the humanity so deified that it leave the bounds of its own nature and be destroyed.

Thereby by a spiritual wisdom, such as only holy Scripture provides, we must discern what is agreeable to Christ in respect of one nature and the other. In this regard, the presence of the body of Christ which I remove from the Eucharist is that by which it is everywhere diffused, or else in many places at once, so that it frees itself from the quantity and limitation necessary to a human body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), dedication, p. 16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-aee103fb5c" data-kw="real spiritual">
<blockquote><p>Although this spiritual presence does not take place except faith mediates, it does not follow (as our opponents falsely charge upon us) that it is only imaginary and unreal (phantastikēn), by which not so much Christ as a phantasm (phantasma) of him or his image becomes present. Spiritual things are no less real and true than corporeal; nay, as they are more perfect, so their mode of presence ought to have perfection. I confess that by those to whom faith is only historical and consists in the bare knowledge of the object, that presence can be called less real (although not even so is a presence denied by philosophers by whom whatever is perceived by the intellect can be said to be truly present to it). But the Scriptures far otherwise describe faith and the presence which it works, while they designate it by sight, hearing and touch, by access, reception and manducation: all of which prove not an unreal (phantasticam) presence (which is made only by phantasms or notions and imaginary ideas), but a true and real presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.4.6</span></figcaption>

<blockquote><p>14 Q. How often is the Lord’s Supper to be administered and received?

14 A. The Lord’s Supper is to be often administered, and received often by every Christian. 1 Cor. 11 24, 25, 26, 27, 28.

Is it often to be administered?

Yes.

Or, Seldom?

No.

And, Must it be received often?

Yes.

Or, Seldom?

No.

Or, May any keep away at their own pleasure, and come only when they list?

No.

Or, Are they excusable that refuse to come, because they have no leisure for worldly businesses?

No.

Or, Because they have not repented of their sins?

No.

Or, Because they are not in charity?

No.

Or, Any such like excuse?

No.</p></blockquote>

<blockquote><p>…this sacrament requiring a self-examination going before (1 Cor. 11:28). Therefore a sermon of preparation is preached the day before, even as Christ prepared and dieted his guests with heavenly sermons preceding the action (as is clear, Luke 22:14,15; Mark 14:18-20; Matt 26:21-23; John 13:13-16). … The nature of the sacrament requires thanksgiving, and therefore in the afternoon [on the Lord’s Day] a sermon of thanksgiving is preached, which is also warranted from Matt 26:30.</p></blockquote>

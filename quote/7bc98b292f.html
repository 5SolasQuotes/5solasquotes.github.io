<blockquote><p>8 Q. Just as there is only one way to salvation, the crucified Christ, there is also only one doctrine of salvation that freely and graciously offers us Christ and all His benefits for our possession. What is this doctrine? A.* The gospel. Because it contains promises of salvation, it is called the gospel of salvation, a word of salvation, and a power of God unto salvation (Rom. 1[:16]). Of course the law leads us by the hand, as it were, to this doctrine. For after we are convicted of our unrighteousness and smitten with the awareness of eternal death, the law teaches us not to seek salvation in ourselves but to accept by faith the salvation offered us outside of ourselves in the gospel. St. Paul speaks of this in Rom. 10[:4]: “The end of the law is Christ for righteousness to every believer.” Also, “The law was our tutor to bring us to Christ” (Gal. 3[:24]). 9 Q. Could you give a more definitive explanation of what the gospel is? A. The gospel, or the good news that delights the heart of the poor condemned sinner, is a revelation of the fatherly and immutable will of God, in which He promised us, who are unworthy, that all our sins have been washed away and pardoned not just for the rest of our lives but, indeed, forever. He carries out this promise by giving His Son to die for us and by raising Him. Since Christ died not in His own sin but in ours (as if He Himself had committed it) and arose out of this same sin as a mighty victor (1 Cor. 15:17), it follows that there is not a single sin of ours for which He has not paid. If even one of all those sins that Christ took upon Himself had not been paid for, He would have had to remain the tomb and could not have risen. For where there is even one sin, there is also eternal death, as God Himself says in Deuteronomy 27. Also, “The wages of sin is death” (Rom. 6[:23]). Since, therefore, Christ arises out of all our sin as a victor in our flesh (which He assumed and forever retains), this is public testimony to us that we are considered as pure and righteous in the eyes of God as Christ Jesus was when He arose from the grave (Rom. 4; 1 Cor. 15:17). Along with that, God through Christ both promises us in the gospel and then actually gives us the Holy Spirit. The Spirit turns our hearts from sin and from the kingdom of the Devil to Himself, bears witness that we are children of God, initiates in us both joy in God and eternal life here below, and brings it to completion in us up in heaven. All of this God freely offers and gives to us in the gospel, without any regard to our past, present, or future merit or piety. He applies it to us by grace through faith, so that whoever boasts, boasts in the Lord (Jer. 9[:24]; 1 Cor. 1[:31]). It can also be described more briefly: the gospel is a revelation of the fatherly and immutable will of God, in which He promises all believers (1) that their sins have been pardoned from eternity and shall be forever forgotten, and (2) that He will freely give them the Holy Spirit and eternal life, without any past, present, or future merit of ours, because of the voluntary sacrifice of this most exalted person, Christ—truly God and truly human. This sacrifice was there before the face of God from eternity, then was promised, and now has been carried out and completed, retaining forever its efficacy for our full redemption (Eph. 1).</p></blockquote>

<blockquote><p>23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning.</p></blockquote>

<blockquote><p>Ver. 5. —But to him that worketh not, but we leave it on him that justifies the ungodly, his faith is counted for righteousness. But to him that worketh not.—This is entirely misunderstood by Dr. Macknight and Mr. Stuart, as if it meant, according to Dr. MacKnight, ‘one who does not work all that he is bound to do;’ or, according to Mr. Stuart, ‘the sinner who has not exhibited perfect obedience.’ It means, however, what it literally expresses, namely, that the person who is justified does not work at all for his justification. It is not that he does not perform all the works that he ought, but that for justification he does nothing. It is true that he works, but not for justification. Mr. Tholuck, who likewise misunderstands in this place the whole of the Apostle’s argument, seems to think that the case of Abraham is only an analogy, and not an example of justification by faith. But Abraham’s faith respected the Messiah, whose day he saw afar off, and by his righteousness he was justified. Justified the ungodly.—if the expression, ‘to him that worketh not,’ needed any explanation, this term—the ungodly—would place it meaning beyond all doubt. The term ungodly is applied throughout the Scriptures to wicked men, Rom v.6; 1 Tim ii. i.9; 1 Pet.iv.18; 2 Pet. ii.5, iii.7; Jude 4, 15. Men are ungodly in themselves, though, as soon as they are justified, they cease to be ungodly. They are ungodly till they believe; but in the moment that they receive the gift of faith, they are thereby united to the savior, and are instantly invested with the robe of righteousness, and also partake, according to the measure of their faith, of all those other graces that are received out of his fullness. They then passed from death to life,—A transition in which there is no medium; they are turned from darkness to light, and from the power of Satan unto God; for till then, being without Christ, they are the children of the devil. They cannot at the same time be both dead and alive–under the power of God, and under the power of the devil; they must in every instance of their existence be either under the one or the other. In that moment, then, in which they believe, they are justified; and to justify, signifies not to treat men as if they were just or righteous, though they are not so, but because they are in truth righteous by imputation, really righteous, the law having been fulfilled in them, ch. viii.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Ver. 5. —But to him that worketh not, but we leave it on him that justifies the ungodly, his faith is counted for righteousness. But to him that worketh not.—This is entirely misunderstood by Dr. Macknight and Mr. Stuart, as if it meant, according to Dr. MacKnight, ‘one who does not work all that he is bound to do;’ or, according to Mr. Stuart, ‘the sinner who has not exhibited perfect obedience.’ It means, however, what it literally expresses, namely, that the person who is justified does not work at all for his justification. It is not that he does not perform all the works that he ought, but that for justification he does nothing. It is true that he works, but not for justification. Mr. Tholuck, who likewise misunderstands in this place the whole of the Apostle’s argument, seems to think that the case of Abraham is only an analogy, and not an example of justification by faith. But Abraham’s faith respected the Messiah, whose day he saw afar off, and by his righteousness he was justified. Justified the ungodly.—if the expression, ‘to him that worketh not,’ needed any explanation, this term—the ungodly—would place it meaning beyond all doubt. The term ungodly is applied throughout the Scriptures to wicked men, Rom v.6; 1 Tim ii. i.9; 1 Pet.iv.18; 2 Pet. ii.5, iii.7; Jude 4, 15. Men are ungodly in themselves, though, as soon as they are justified, they cease to be ungodly. They are ungodly till they believe; but in the moment that they receive the gift of faith, they are thereby united to the savior, and are instantly invested with the robe of righteousness, and also partake, according to the measure of their faith, of all those other graces that are received out of his fullness. They then passed from death to life,—A transition in which there is no medium; they are turned from darkness to light, and from the power of Satan unto God; for till then, being without Christ, they are the children of the devil. They cannot at the same time be both dead and alive–under the power of God, and under the power of the devil; they must in every instance of their existence be either under the one or the other. In that moment, then, in which they believe, they are justified; and to justify, signifies not to treat men as if they were just or righteous, though they are not so, but because they are in truth righteous by imputation, really righteous, the law having been fulfilled in them, ch. viii.”

— Robert Haldane, Exposition of the Epistle to the Romans (Edinburgh: The Banner of Truth Trust, 1996, repr. from 9th edition, 1874), 165 (on Rom 4:5).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVer.+5.+%E2%80%94But+to+him+that+worketh+not%2C+but+we+leave+it+on+him+that+justifies+the+ungodly%2C+his+faith+is+counted+for+righteousness.+But+to+him+that+worketh+not.%E2%80%94This+is+entirely+misunderstood+by+Dr.+Macknight+and+Mr.+Stuart%2C+as+if+it+meant%2C+according+to+Dr.+MacKnight%2C+%E2%80%98one+who+does+not+work+all+that+he+is+bound+to+do%3B%E2%80%99+or%2C+according+to+Mr.+Stuart%2C+%E2%80%98the+sinner+who+has+not+exhibited+perfect+obedience.%E2%80%99+It+means%2C+however%2C+what+it+literally+expresses%2C+namely%2C+that+the+person+who+is+justified+does+not+work+at+all+for+his+justification.+It+is+not+that+he+does+not+perform+all+the+works+that+he+ought%2C+but+that+for+justification+he+does+nothing.+It+is+true+that+he+works%2C+but+not+for+justification.+Mr.+Tholuck%2C+who+likewise+misunderstands+in+this+place+the+whole+of+the+Apostle%E2%80%99s+argument%2C+seems+to+think+that+the+case+of+Abraham+is+only+an+analogy%2C+and+not+an+example+of+justification+by+faith.+But+Abraham%E2%80%99s+faith+respected+the+Messiah%2C+whose+day+he+saw+afar+off%2C+and+by+his+righteousness+he+was+justified.+Justified+the+ungodly.%E2%80%94if+the+expression%2C+%E2%80%98to+him+that+worketh+not%2C%E2%80%99+needed+any+explanation%2C+this+term%E2%80%94the+ungodly%E2%80%94would+place+it+meaning+beyond+all+doubt.+The+term+ungodly+is+applied+throughout+the+Scriptures+to+wicked+men%2C+Rom+v.6%3B+1+Tim+ii.+i.9%3B+1+Pet.iv.18%3B+2+Pet.+ii.5%2C+iii.7%3B+Jude+4%2C+15.+Men+are+ungodly+in+themselves%2C+though%2C+as+soon+as+they+are+justified%2C+they+cease+to+be+ungodly.+They+are+ungodly+till+they+believe%3B+but+in+the+moment+that+they+receive+the+gift+of+faith%2C+they+are+thereby+united+to+the+savior%2C+and+are+instantly+invested+with+the+robe+of+righteousness%2C+and+also+partake%2C+according+to+the+measure+of+their+faith%2C+of+all+those+other+graces+that+are+received+out+of+his+fullness.+They+then+passed+from+death+to+life%2C%E2%80%94A+transition+in+which+there+is+no+medium%3B+they+are+turned+from+darkness+to+light%2C+and+from+the+power+of+Satan+unto+God%3B+for+till+then%2C+being+without+Christ%2C+they+are+the+children+of+the+devil.+They+cannot+at+the+same+time+be+both+dead+and+alive%E2%80%93under+the+power+of+God%2C+and+under+the+power+of+the+devil%3B+they+must+in+every+instance+of+their+existence+be+either+under+the+one+or+the+other.+In+that+moment%2C+then%2C+in+which+they+believe%2C+they+are+justified%3B+and+to+justify%2C+signifies+not+to+treat+men+as+if+they+were+just+or+righteous%2C+though+they+are+not+so%2C+but+because+they+are+in+truth+righteous+by+imputation%2C+really+righteous%2C+the+law+having+been+fulfilled+in+them%2C+ch.+viii.%E2%80%9D%0A%0A%E2%80%94+Robert+Haldane%2C+Exposition+of+the+Epistle+to+the+Romans+%28Edinburgh%3A+The+Banner+of+Truth+Trust%2C+1996%2C+repr.+from+9th+edition%2C+1874%29%2C+165+%28on+Rom+4%3A5%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54d52494b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54d52494b5.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/04/haldane-ungodly-in-romans-45-means-what-it-says-just-as-works-not-means-what-it-says/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

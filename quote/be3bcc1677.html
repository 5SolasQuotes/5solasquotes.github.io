<main class="wrap"><figure class="quote" id="q-be3bcc1677" data-kw="">
<blockquote><p>It is a fact now distinctly recognized by the Christian world, that God did cease from the work of creation at the close of the sixth day, and did thus consecrate the seventh as a holy rest to man. Even the light labours of Paradise, which never brought fatigue, were, on this day, remitted; and man’s constant worship became more emphatic and devout as, on this day, he contemplated the glory of the Creator in the glory of His works.

It is equally unnecessary to array the physiological proof, that a weekly vacation from toil is required to repair the energies both of man and beast. To the sceptical it must suffice here to say, that a large induction of particular facts has fully established the natural law, that the sons of toil, in addition to the hours of repose which night affords, need the supplemental rest of a weekly Sabbath.

In all departments of labour, whether mental or mechanical, both the schemer and the operative, and the very beasts of burden, wear out the faster for unremitting exertion. Even while retaining their physical capacity, there is cumulative evidence to show, that through a given term of sufficient length, the amount of productive labour will be in favour of those who intercalate one day of rest amidst six of toil.</p></blockquote>

<blockquote><p>It is no wonder, therefore, that such a number of musical instruments should be so heaped together; but although they were a part of the Pedagogia Legalis [the instruction of the law], yet they were not for that reason to be brought into Christian assemblies. For God willeth that, after the coming of Christ, his people should cultivate the hope of eternal life and the practice of true piety by very different and more simple means than these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, Instrumental Music in the Public Worship of the Church</cite></span></figcaption>

<blockquote><p>But all light into, all perceptions of, this glory, all experience of its power, were, amongst the most, lost in the world. I intend, in all these instances, the time of the Papal apostasy. Those who had the conduct of religion could discern no glory in these things, nor obtain any experience of their power. Be the worship what it will, they can see no glory in it, nor did it give any satisfaction to their minds; for, having no light to discern its glory, they could have no experience of its power and efficacy. What then shall they do? The notion must be retained, that divine worship is to be beautiful and glorious. But in the spiritual worship of the gospel they could see nothing thereof; wherefore they thought necessary to make a glory for it, or to dismiss it out of the world, and set up such an image of it as might appear beautiful unto their fleshly minds, and give them satisfaction. To this end they set their inventions on work, to find out ceremonies, vestments, gestures, ornaments, music, altars, images, paintings, with prescriptions of great bodily veneration. This pageantry they call “the beauty, the order, the glory of divine worship.” This is that which they see and feel, and which, as they judge, doth dispose their minds unto devotion; without it they know not how to pay any reverence unto God himself; and when it is wanting, whatever be the life, the power, the spirituality of the worship in the worshippers, whatever be its efficacy unto all the proper ends of it, however it be ordered according unto the prescription of the word, it is unto them empty, indecent; they can see neither beauty nor glory in it. This light and experience being lost, the introduction of “beggarly elements” and carnal ceremonies in the worship of the church, with attempts to render it decorous and beautiful, by superstitious rites and observances, wherewith it hath been defiled and corrupted, as it was and is in the church of Rome, was nothing but the setting-up of a deformed image in the room of it; and this they are pleased withal. The beauty and glory which carving, and painting, and embroidered vestures, and musical incantations, and postures of veneration, do give unto divine service, they can see and feel; and, in their own imagination, are sensibly excited unto devotion by them. But hereby, instead of representing the true glory of the worship of the gospel, wherein it excels that under the Old Testament, they have rendered it altogether inglorious in comparison of it; for all the ceremonies and ornaments which they have invented for that end, come unspeakably short, for beauty, order, and glory, of what was appointed by God himself in the temple, scarce equalling what was among the Pagans. It will be said, that “the things whereunto we assign the glory of this worship are spiritual and invisible. Now this is not that which is inquired after; but that whose beauty we may behold, and be affected with.” And this may consist in the things which we decry, at least in some of them: though I must say, if there be glory in any of them, the more they are multiplied, the better it must needs be. But this is that which we plead: Men, being not able, by the light of faith, to discern the glory of things spiritual and invisible, do make images of them unto themselves, as gods that may go before them, and these they are affected withal; but the worship of the church is spiritual, and the glory of it is invisible unto eyes of flesh. So both our Saviour and the apostles do testify in the celebration of it: “We are come unto Mount Sion, and unto the city of the living God, the heavenly Jerusalem, and to an innumerable company of angels, to the general assembly and church of the first-born, which are written in heaven, and to God the Judge of all, and to the spirits of just men made perfect, and to Jesus the Mediator of the new covenant, and to the blood of sprinkling, that speaketh better things than that of Abel.” ( Heb. xii. 22-24.) The glory of this assembly, though certainly above that of organs, and pipes, and crucifixes, and vestments, yet doth not appear unto the sense or imaginations of men. That which I design here, is to obviate the meretricious allurements of the Roman worship, and the pretences of its efficacy to excite devotion and veneration by its beauty and decency. The whole of it is but a deformed image of that glory which they cannot behold. To obtain and preserve in our hearts an experience of the power and efficacy of that worship of God which is “in spirit and truth,” as unto all the real ends of divine worship, is that alone which will secure us. Whilst we do retain right notions of the proper object of gospel-worship, and of our immediate approach by it thereunto, of the way and manner of that approach through the mediation of Christ, and assistance of the Spirit; whilst we keep up faith and love unto their due exercise in it, wherein on our part the life of it doth consist, preserving an experience of the spiritual benefit and advantage which we receive thereby; we shall not easily be inveigled to relinquish them all, and to give up ourselves unto the embraces of this lifeless image.</p></blockquote>

+prescription+of+the+word%2C+it+is+unto+them+empty%2C+indecent%3B+they+can+see+neither+beauty+nor+glory+in+it.+This+light+and+experience+being+lost%2C+the+introduction+of+%E2%80%9Cbeggarly+elements%E2%80%9D+and+carnal+ceremonies+in+the+worship+of+the+church%2C+with+attempts+to+render+it+decorous+and+beautiful%2C+by+superstitious+rites+and+observances%2C+wherewith+it+hath+been+defiled+and+corrupted%2C+as+it+was+and+is+in+the+church+of+Rome%2C+was+nothing+but+the+setting-up+of+a+deformed+image+in+the+room+of+it%3B+and+this+they+are+pleased+withal.+The+beauty+and+glory+which+carving%2C+and+painting%2C+and+embroidered+vestures%2C+and+musical+incantations%2C+and+postures+of+veneration%2C+do+give+unto+divine+service%2C+they+can+see+and+feel%3B+and%2C+in+their+own+imagination%2C+are+sensibly+excited+unto+devotion+by+them.+But+hereby%2C+instead+of+representing+the+true+glory+of+the+worship+of+the+gospel%2C+wherein+it+excels+that+under+the+Old+Testament%2C+they+have+rendered+it+altogether+inglorious+in+comparison+of+it%3B+for+all+the+ceremonies+and+ornaments+which+they+have+invented+for+that+end%2C+come+unspeakably+short%2C+for+beauty%2C+order%2C+and+glory%2C+of+what+was+appointed+by+God+himself+in+the+temple%2C+scarce+equalling+what+was+among+the+Pagans.+It+will+be+said%2C+that+%E2%80%9Cthe+things+whereunto+we+assign+the+glory+of+this+worship+are+spiritual+and+invisible.+Now+this+is+not+that+which+is+inquired+after%3B+but+that+whose+beauty+we+may+behold%2C+and+be+affected+with.%E2%80%9D+And+this+may+consist+in+the+things+which+we+decry%2C+at+least+in+some+of+them%3A+though+I+must+say%2C+if+there+be+glory+in+any+of+them%2C+the+more+they+are+multiplied%2C+the+better+it+must+needs+be.+But+this+is+that+which+we+plead%3A+Men%2C+being+not+able%2C+by+the+light+of+faith%2C+to+discern+the+glory+of+things+spiritual+and+invisible%2C+do+make+images+of+them+unto+themselves%2C+as+gods+that+may+go+before+them%2C+and+these+they+are+affected+withal%3B+but+the+worship+of+the+church+is+spiritual%2C+and+the+glory+of+it+is+invisible+unto+eyes+of+flesh.+So+both+our+Saviour+and+the+apostles+do+testify+in+the+celebration+of+it%3A+%E2%80%9CWe+are+come+unto+Mount+Sion%2C+and+unto+the+city+of+the+living+God%2C+the+heavenly+Jerusalem%2C+and+to+an+innumerable+company+of+angels%2C+to+the+general+assembly+and+church+of+the+first-born%2C+which+are+written+in+heaven%2C+and+to+God+the+Judge+of+all%2C+and+to+the+spirits+of+just+men+made+perfect%2C+and+to+Jesus+the+Mediator+of+the+new+covenant%2C+and+to+the+blood+of+sprinkling%2C+that+speaketh+better+things+than+that+of+Abel.%E2%80%9D+%28+Heb.+xii.+22-24.%29+The+glory+of+this+assembly%2C+though+certainly+above+that+of+organs%2C+and+pipes%2C+and+crucifixes%2C+and+vestments%2C+yet+doth+not+appear+unto+the+sense+or+imaginations+of+men.+That+which+I+design+here%2C+is+to+obviate+the+meretricious+allurements+of+the+Roman+worship%2C+and+the+pretences+of+its+efficacy+to+excite+devotion+and+veneration+by+its+beauty+and+decency.+The+whole+of+it+is+but+a+deformed+image+of+that+glory+which+they+cannot+behold.+To+obtain+and+preserve+in+our+hearts+an+experience+of+the+power+and+efficacy+of+that+worship+of+God+which+is+%E2%80%9Cin+spirit+and+truth%2C%E2%80%9D+as+unto+all+the+real+ends+of+divine+worship%2C+is+that+alone+which+will+secure+us.+Whilst+we+do+retain+right+notions+of+the+proper+object+of+gospel-worship%2C+and+of+our+immediate+approach+by+it+thereunto%2C+of+the+way+and+manner+of+that+approach+through+the+mediation+of+Christ%2C+and+assistance+of+the+Spirit%3B+whilst+we+keep+up+faith+and+love+unto+their+due+exercise+in+it%2C+wherein+on+our+part+the+life+of+it+doth+consist%2C+preserving+an+experience+of+the+spiritual+benefit+and+advantage+which+we+receive+thereby%3B+we+shall+not+easily+be+inveigled+to+relinquish+them+all%2C+and+to+give+up+ourselves+unto+the+embraces+of+this+lifeless+image.%E2%80%9D%0A%0A%E2%80%94+Samuel+Annesley%2C+Other+citations+%28work+not+named%29%2C+Volume+III.+Containing+a+continuation+of+morning-exercise+questions+and+cases+of+conscience.+The+morning+exercises+at+Cripplegate%2C+St.+Giles+in+the+Fields%2C+and+in+Southwark+ed.+James+Nichols+%28London%2C+Thomas+Tegg%2C+1844%29%2C+222%E2%80%93223.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F564b5b0a71.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/564b5b0a71.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/10/standard-reformed-polemics-against-the-use-of-musical-instruments-in-worship/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The use of instruments in worship was admittedly part of the Temple service. It had no place in the Tabernacle before David’s day, beyond the use of two silver trumpets made by Moses, in the hands of the priests. There is not a particle of evidence to show that it entered into the ordinary worship of the family or the synagogue. We are now prepared to take a step further, and note that, in the Temple service, it was uniformly and most closely associated with sacrifice and the burning of incense. …[T]he playing on instruments was confined to those bands of Levites whom David was training in anticipation of the building of the temple—these acting in this for and as representing the whole people. …1 Chron xxiii.26–32. It is very plain from this passage that the service of praise as conducted by the Levitical choirs with musical accompaniment, was associated with the regular morning and evening sacrifice, and with other sacrifices.</p></blockquote>

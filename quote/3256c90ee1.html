</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9116331511" data-kw="">
<blockquote><p>Position 6. Grace is not educed or extracted out of the potency of any created nature. Grace is born in heaven and came from the inmost of the heart of Christ; it has neither seed nor parent on earth; therefore the Lord challenges it as his own, 2 Cor. 12.9, ‘The Lord said unto me, My grace is sufficient for thee.’ 2 Tim. 2:1, ‘The grace that is in Christ Jesus.’ 1 Cor. 15:10, ‘The grace of God.’ 2 Cor. 13:14, ‘The grace of the Lord Jesus Christ.’ Gal. 1:15, ‘He called me by his grace.’ If we could engage the grace of God, or prevent it [come before it], then should grace be our birth; but grace is not essential to angels. It’s a doubt if any creature can be capable by nature of any possibility-natural not to sin; it is much to know the just owner of grace who begot it? It came out of the eternal womb and bowels of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-0dd2b3f86c" data-kw="">
<blockquote><p>Fifthly, the union of the two natures in Christ is an inseparable union. So that from the first moment thereof, there never was, nor to eternity shall be, any separation of them. If you ask how the union remained betwixt them when Christ’s human soul and body were separated from each other upon the cross? Is not death the dissolution of union betwixt soul and body? True, the natural union betwixt his soul and body was dissolved by death for a time, but this hypostatical union remained even then as entire and firm as ever. For though his soul and body were divided from each other, yet neither of them from the divine nature. Divines assist our conception of this mystery by an apt illustration. A man that holds in his hand a sword sheathed, when he pleases, draws forth the sword, but still holds that in one hand and the sheath in the other, and then sheaths it again, still holding it in his hand; so when Christ died his soul and body retained their union with the divine nature, though not (during that space) one with another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘5th Sermon’ on Jn. 1:14 in The Fountain of Life Opened… (London, 1673)</cite>, pp. 56-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-411959d55f" data-kw="">
<blockquote><p>3. Nor does it hinder [the legitimacy of the atonement] that Christ, as subject to the divine law, also owed obedience, which seems to destroy all merit (Socinus ibid. ch. 5 and Praelections, ch. 18, §4). For he did not owe it by that title of justice by which he now offered it, namely for sins. And what else is merit with respect to God than if a rational person offers those formal acts which are in the pact? as Adam and the fallen angels would have merited salvation if they had rendered the obedience that was in the pact. Why therefore will we detract praise of merit from Christ, who most exactly satisfied the divine demands?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-56f985347c" data-kw="">
<blockquote><p>§8. Question 3. Is a man obliged by a contract which he made in ignorance or mistake of the matter? Answer: I have answered this before in the case of marriage, pt. 2, ch. 1. I add here, we must distinguish: 1. Between culpable and inculpable error; 2. Between an error about the principal matter and about some smaller accidents or circumstances; 3. Between a case where the law of the Land, or the common good interposes and where it does not. 1. If it be your own fault that you are mistaken, you are not wholly freed from the obligation: But if it was your gross fault, by negligence or vice, you are not at all freed. But if it were but such a frailty as almost all men are liable to, so that none but a person of extraordinary virtue or diligence could have avoided the mistake, then equity will proportionably make you an abatement or free you from the obligation. So far as you were obliged to understand the matter, so far you are obliged by the contract; especially when another is a loser by your error. 2. An inculpable error about the circumstances or smaller parts will not free you from an obligation in the principal matter: But an inculpable error in the essentials will. 3. Except when the law of the land or the common good, does otherwise overrule the case: For then you may be obliged by that accident. In diverse cases the rulers may judge it necessary, that the effect of the contract shall depend upon the bare words or writings, or actions; lest false pretenses of misunderstanding should exempt deceitful persons from their obligations and nothing should be a security to contractors. And then men’s private commodity must give place to the law and to the public good. 4. Natural infirmities must be numbered with faults, though they be not moral vices, as to the contracting of an obligation, if they be in a person capable of contracting. As if you have some special defect of memory, or ignorance of the matter which you are about! Another who is no way faulty by over-reaching you, must not be a loser by your weakness. For he that comes to the market, or contracts with another who knows not his infirmity, is to be supposed to understand what he does, unless the contrary be manifest: You should not meddle with matters which you understand not: Or if you do, you must be content to be a loser by your weakness. 5. Yet in such cases, another that has gained by the bargain, may be obliged by the laws of equity and charity, to remit the gain, and not to take advantage of your weakness: But he may so far hold you to it, as to secure himself from loss: except in cases where you become the object of his charity, and not of commutative justice only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 115</span></figcaption>

<blockquote><p>Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits. We do not speak of the rhetorical use of equivocations, nor of the logical use which often obtains in disputations. Rather we speak of the theological and moral use in giving testimony and in oaths, where truth and sincerity are required.</p></blockquote>

</figure><figure class="quote" id="q-20b1752885" data-kw="">
<blockquote><p>And I dare say, whosoever shall peruse with a judicious and unpartial eye most of those pamphlets, that in this daring age have been thrust into the world against… (…things of lesser regard and usefulness and more open to acception [exception] and abuse, yet so far as I can understand, unjustly condemned as things utterly unlawful, such as are lusorious lots, dancing, stage plays and some other things of like nature), when he shall have drained out the bitter invectives, unmannerly jeers, petulant guirding at those that are in authority, impertinent digressions, but above all those most bold and perverse wrestings of holy Scripture, wherewith such books are infinitely stuffed, he shall find that little poor remainder that is left behind to contain nothing but vain words and empty arguments. For when these great undertakers have snatched up the bucklers, as if they would make it good against all comers, that such and such things are utterly unlawful, and therefore ought in all reason and conscience to bring such proofs as will come up to that conclusion: Quid dignum tanto? very seldom shall you hear from them any other arguments than such as will conclude but an inexpediency at the most, as that they are apt to give scandal, that they carry with them an appearance of evil, that they are often occasions of sin, that they are not command[ed] in the Word, and such like. Which objections, even where they are just, are not of force (no not taken altogether, much less any of them singly) to prove a thing to be utterly unlawful. And yet are they glad many times, rather than sit out, to play very small game and to make use of arguments yet weaker than these and such as will not reach so far as to prove a bare inexpediency, as that they were invented by heathens, that they have been abused in Popery and other such like. Which to my understanding is a very strong presumption that they have taken a very weak cause in hand and such as is wholly destitute of sound proof.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-39caced0d9" data-kw="three persons perichoresis">
<blockquote><p>In the one only and most simple essence of God there are three distinct persons so distinguished from each other by incommunicable properties or modes of subsisting that one cannot be the other—although by an inexpressible circum-insession (emperichōrēsin) they always remain and exist in each other mutually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.25.1</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 3.25.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn%20the%20one%20only%20and%20most%20simple%20essence%20of%20God%20there%20are%20three%20distinct%20persons%20so%20distinguished%20from%20each%20other%20by%20incommunicable%20properties%20or%20modes%20of%20subsisting%20that%20one%20cannot%20be%20the%20other%E2%80%94although%20by%20an%20inexpressible%20circum-insession%20%28emperich%C5%8Dr%C4%93sin%29%20they%20always%20remain%20and%20exist%20in%20each%20other%20mutually.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.25.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39caced0d9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39caced0d9.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74c3572d0d" data-kw="unity three persons">
<blockquote><p>While he proclaims his unity, he distinctly sets it before us as existing in three persons. These we must hold, unless the bare and empty name of Deity merely is to flutter in our brain without any genuine knowledge. Moreover, lest any one should dream of a threefold God, or think that the simple essence is divided by the three Persons, we must here seek a brief and easy definition which may effectually guard us from error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/one-essence.html">One Essence</a> › <a href="../topics/the-trinity/one-essence/unity-of-nature.html">Unity of nature</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/distinct-persons.html">Distinct persons</a></span></div>

— John Calvin, Institutes of the Christian Religion, 1.13.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile%20he%20proclaims%20his%20unity%2C%20he%20distinctly%20sets%20it%20before%20us%20as%20existing%20in%20three%20persons.%20These%20we%20must%20hold%2C%20unless%20the%20bare%20and%20empty%20name%20of%20Deity%20merely%20is%20to%20flutter%20in%20our%20brain%20without%20any%20genuine%20knowledge.%20Moreover%2C%20lest%20any%20one%20should%20dream%20of%20a%20threefold%20God%2C%20or%20think%20that%20the%20simple%20essence%20is%20divided%20by%20the%20three%20Persons%2C%20we%20must%20here%20seek%20a%20brief%20and%20easy%20definition%20which%20may%20effectually%20guard%20us%20from%20error.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%201.13.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74c3572d0d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74c3572d0d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>

<blockquote><p>The characteristics or properties of the persons are that the Father is unbegotten, the Son is begotten, and the Spirit proceeds.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The characteristics or properties of the persons are that the Father is unbegotten, the Son is begotten, and the Spirit proceeds.”

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, XIX">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20characteristics%20or%20properties%20of%20the%20persons%20are%20that%20the%20Father%20is%20unbegotten%2C%20the%20Son%20is%20begotten%2C%20and%20the%20Spirit%20proceeds.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20XIX&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62b2ff440d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62b2ff440d.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VII</span></figcaption>

</figure><figure class="quote" id="q-2c3189cb1c" data-kw="person subsistence Sabellians">
<blockquote><p>By person, we mean a subsistence in the divine essence, which, in relation to other persons, is distinguished from them by an incommunicable property. It is not for the Sabellians to odiously attack or disdainfully reject the term “person,” as if it were humanly invented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis XI</span></figcaption>

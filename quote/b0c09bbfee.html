<main class="wrap"><figure class="quote" id="q-b0c09bbfee" data-kw="">
<blockquote><p>Precious in the sight of the Lord is the death of his saints;” and he will make inquisition for the blood of his saints that has been shed like water in our streets. Sirs, much of this blood was shed in the times of persecuting tyranny, particularly in this city [Edinburgh]. That blood, I say, hath not been purged; yea, the guilt of it calls for wrath upon us their sinful posterity.

There was no due inquiry after it, when the Lord turned back our captivity after the Revolution; yea, instead of that, men who had dipt their hands in the blood of his saints were put into places and posts both civil and military; yea, I will add, that they were admitted to sit as constituent members in the supreme judicatories of this church.

We have reason to believe, that he will inquire after that blood; for he “visits the iniquity of the fathers upon the children, to the third and fourth generation.” It is crying yet from under the altar against many families in Scotland; and I fear it has a loud cry against this city, where it was shed in great abundance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tabernacle of David Ruined by Man, and reared up by the Mighty God. Being Three Discourses. The First and Second Preached at Edinburgh, November 1735; and the Third at Kinross, February 17th 1736, at the opening of the Presbytery of the Associate Ministers there in The Whole Works of Ebenezer Er</cite></span></figcaption>

<blockquote><p>by way of precept there is an absolute necessity of uniting laid upon the Church, so that it falls not under debate whether a Church should continue divided or united in these [in thesis]… seeing that union is both commanded as a duty and commanded as eminently tending to the edification of the Church, and therefore is so frequently joined with edification? Nor is it to be asked by a Church what is to be done for the Church’s good in a divided way, thereby supposing a dispensation, as it were, to be given to division and a forbearing of the use of means for the attaining thereof; or rather supposing a stating or fixing of division, and yet notwithstanding thereof, thinking to carry on edification?</p></blockquote>

<blockquote><p>Yea and the injunctions and statutes do permit and give leave to speak against all abuses in all things (but with these exceptions), that we speak not reproachfully, willfully and obstinately, but in humility as we ought, and as being under correction and judgment of magistrates if we speak amiss; read the statute and you shall find such like words; yea and experience will teach you that of late and also long ago both at Paul’s Cross and in the Court some preachers have boldly condemned abuses in the state, and speaking under correction of the magistrate, have not only been suffered but commended of the Queen Majesty herself.</p></blockquote>

<blockquote><p>It is a delusion to think that it is the only way to testify against what I judge amiss in the minister, to cast at this ministry, and to withdraw from him. Whosoever adopts this principle and practices it accordingly, has not the mind of Christ; for there are other patent and obvious ways to witness against all the evil of our ways besides these: Nay, this way of witnessing is such as Christ will witness against it, as not the way.</p></blockquote>

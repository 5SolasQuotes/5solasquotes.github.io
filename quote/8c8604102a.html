<main class="wrap"><figure class="quote" id="q-8c8604102a" data-kw="">
<blockquote><p>Scottish Sabbatarianism had, properly speaking, nothing ritualistic about it at alL It was never held that there was any virtue in merely ceasing from ordinary toil and ordinary recreations on the first day of the week. These things they held, indeed, to be commanded of God, to whom men were bound to give a reverent and dutiful obedience, and obedience to whom, wlien in a right spirit, was spiritually elevating; but the day of rest was ever and chiefly regarded as a means to a blessed end. …

And, for my part, I do not comprehend how any person with religious feelings and sympathies should not be ready to admit that at least there is something very grand about the Scottish Sabbath, in its idea of a day of communion with the Unseen and Eternal; of adoration of our Maker and our Saviour; of self-examination and moral exercise; of acquisition of religious knowledge; and all this in order to the spiritual elevation of the soul, the replenishing of our moral energies, and a closer hold of the verities which have a place in our creed.

Of course, Scotch religion has had its formalism; and that formalism very naturally connects itself with the Sabbath. The Sabbath is the thing among us in which the Pharisaic tendency and conscience find readiest exercise. It is our chief opportunity for religious display. And no doubt we have had our share of the miserable thing. Nor do I hold myself obliged to defend all the minutiae of Sabbatic observance which you may find in presbytery records, or of which people may have heard stray reports.

In breaking in a turbulent, and energetic, and uneducated people, a certain rigour was, I believe, both necessary and advantageous. But is there more of sham and unreality in the North than the South of our Island? Under any of the ordinary tests which you apply in such cases, can it be said that Scottish religion, when it has been a day of power with it, has been deficient comparatively in vital moral force?

At the same time we admit that Scotch religion has been distinguished by a certain Sabbatic stringency. We have regarded the outward observance of the day of holy rest as resting upon direct divine command and as including in it a larger measure of abstinence from work and the ways of ordinary every-day life. Have we suffered from this? I do not believe it. … On mere grounds of patriotism, I think no Scotchman should be over-ready to find fault with the Sabbath of his country, and should be very chary in meddling with an institution so entwined with our history, and I believe our nation’s progress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-walker.html">James Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Theology and Theologians of Scotland, Chiefly of the Seventeenth and Eighteenth Centuries</cite>, (2nd edn, Edinburgh: T. &amp; T. Clark, 1888), pp 183-85, 187.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7d7a09c02d" data-kw="">
<blockquote><p>Here are two parts of this law, the commandment, &amp; the reason of the same. And again, there are two parts of the commandment, of the which the one is moral or everlasting, namely, that the Sabbath be hallowed, that is to say, that some certain time be appointed for the ministry of the Church, or public worship of God. The other is ceremonial, and for a time, namely, that this time should be the seventh day, and that in it should be observed and kept the ceremonies of the Levitical law. And that this part is for a time, and the other everlasting, we do understand by the end of the commandment, and causes of both these parts.

The end of the commandment is the public praising of God in the congregation, or the conservation or maintenance and use of the ministry of the Church, which is an office ordained by God, to teach the Church concerning God and his will out of the word of God delivered by the Prophets and Apostles, and to minister the sacraments according to the ordinance of God. And God would have at all times of the world that there should be public assemblies of the Church, in the which should sound true doctrine concerning God, for these causes especially.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A very profitable and necessary discourse concerning the observation and keeping of the Sabbath day serving as well to confute the superstition of the Jews, which obstinately urge the strict keeping of the seventh day, as also to overthrow the vain and godless reasons of others, that stiffly at this</cite>, trans. John Stockwood (London: John Harrison, 1584), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>…and undeniably the Jewish days, the High Priest’s garment and many things of that kind, were divine or religious performances, things or adjuncts of divine worship, but so as they are not merely adjuncts of worship, but also worship; for the High Priest’s ephod was not only a civil ornament, nor was it a mere physical or natural means to fence off the injuries of sun and heaven, we do not think that the Lord in all or any place of the Old or New Testament sets down any laws concerning garments simply, as they do fence off cold or heat (that belongs to art), only he speaks of garments as contrary to gravity, as signs of vanity and lightness, Isa. 3:16, etc. Zeph. 1:8; 1 Pet. 3:3-4. And of garments as religious observances, of which sort was the attire and garments of the priests and High-Priests in their service, in which consideration the religious times, holy places, and mosaical garments were divine worship, by which God was immediatly honored, but not adjuncts only, or actions; but religious things or performances.</p></blockquote>

<blockquote><p>The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.”

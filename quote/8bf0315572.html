<main class="wrap"><figure class="quote" id="q-8bf0315572" data-kw="">
<blockquote><p>God created man in his own image, in the image of God created he him; male and female created he them.” Man and woman were both equally endued with this likeness or similitude of their divine Creator; and clearly does this image consist not in any bodily shape or figure, which never can be said to resemble God, who is a Spirit incorporeal and invisible. This image must, therefore, be found in the nature of the rational soul, with which the body of man was united at his creation.

Nor was this rational soul merely a higher measure of that animal mind, with which the inferior creatures were endued, and which thus fitted him merely to be their lord and ruler in this world. It was something of a much higher order—a spiritual and immortal mind—an emanation from the Divine Spirit, directly communicated from the Father of all spirits. “The Lord God formed man of the dust of the ground, and breathed into his nostrils the breath of life; and man became a living soul.” Man was thus, in his intellectual and moral nature, the offspring of God, bearing, as a child to a parent, a resemblance, incalculably limited indeed, and remote in degree, but nevertheless real and essential in kind, to that which is divine.

There is such a likeness of intelligence in man to his Maker, as to render him capable, in some respects, of thinking and feeling as God himself does. There is such a similarity in spiritual faculty, as to render him capable of maintaining a species of intercourse and sympathy with his infinite Creator. There was thus wrought in man’s creation “the miracle of miracles” — a creature formed from the earth, and dwelling upon the earth, yet capable of holding communion with the Supreme, capable of sensibly experiencing his spiritual influences, and intelligently apprehending his sacred will. …

But, in all this, we only express the capability of that living soul, which God originally breathed into man, for receiving his own image. We are taught, farther, the character of that living soul, as actually impressed with that image—as endued at his creation with “a knowledge, righteousness, and holiness,” similar in kind to the same attributes of the blessed Godhead.

These three qualities are so distinctly declared in the Inspired Word to be leading features of that image of God, to which his redeemed are restored, that it cannot be questioned that they formed the leading features of that Divine image or likeness in which man was created. “And have put on the new man, which is renewed in knowledge, after the image of him that created him.” “And that ye put on the new man, which after God is created in righteousness and true holiness” — knowledge in the understanding, righteousness in the will, and holiness in the affections.

The soul of man was created after the image of God, in regard to knowledge — a knowledge not merely intellectual, but spiritual — not merely resembling that which the fallen angels, or the natural man, may be capable of receiving, but resembling the knowledge of the Creator; a knowledge not, indeed, infallible as that of God, but agreeable to the mind of God—predisposed to the reception of moral truth, and endowed with a true understanding of his Maker and his will — of his own place and duty — of his own interests and happiness.

The soul of man was created after the image of God, in regard to righteousness, in such a state of heart and inclination of the will, as to approve all that was right, and good, and true; with the Divine law impressed on his soul, and with power imparted to fulfil it perfectly in all its demands.

The soul of man was created after the image of God, in regard to holiness, with the affections pure and well-regulated — free from all evil taint or bias — directed towards high and holy objects — drawn especially towards God himself, and delighting chiefly in his favour and fellowship.</p></blockquote>

<blockquote><p>It may press us to admire the grace of God to his children. He cannot satisfy himself in doing good to you, but he must do good to your children too. How should we entertain this with reverence! When God told Abraham, I am thy God, and the God of thy seed, ‘Abraham fell upon his face,’ as humbly adoring the goodness of God, Gen.17:3; so David, when God spake concerning his house and his children: 2 Sam. 7:18, 19, ‘What am I, O Lord, and what is my house, that thou hast brought me hitherto?’ And this was yet a small thing in thy sight, O Lord God; for thou hast spoken also of thy servant’s house for a great while to come;’ he stands wondering at this mercy of God.</p></blockquote>

<blockquote><p>But a great question here does justly offer itself, whether man might not eat flesh at the first, but herbs, seeds and fruits only. And because the other creatures are confined to herbs and seeds, whether such of them as live now upon flesh, were otherwise sustained then, as lions, beares, wolves, etc. Touching either of these diverse expositours are of diverse opinions. Some think that although herbs and seeds and fruits only are named, when man’s food is appointed unto him, yet for so much as flesh is not forbidden, and a dominion over the creatures to use them, as he thought good, was given unto him, he might at his pleasure make food of that also. And they argue from this that sacrifices were to be made of the creatures, some part of which was to be eaten, and likewise that they were to be killed, that they might have their skins for clothing, wherefore it is most probable that they ate their flesh. So that God in appointing these things to be eaten, did but appoint their ordinary food, there being a liberty to use flesh for food also, when man should think good. But others hold that seeds and herbs and fruits were mans only food till the Flood, because none but these are mentioned and an express allowance is given to eat flesh after the flood, as these things. Thus the Fathers generally, and most new writers of all sorts. And it seems to have been an ancient received opinion, by that which old poets have left written, as Boethius. The former age was content with the faithful fields, and satified their hunger with the acorn, when they had fasted long. And Ovid: Men were content with meat growing without forcing, they gathered the fruits growing in mountainous places and those that grow upon thorns, etc. (bk. 1, Metamor.) And it stands with good reason that man should feed then only upon such things, they being such as might well suffice nature, and most pleasant at the first, and men’s bodies being strong and healthful, and this was a most simple diet, and so most fit to be appointed at the first to rebuke the luxury of after times. Some also yield this for a reason, that man not being used to the shedding of blood might be better preserved from murder. But this reason is weak, because beasts were killed for sacrifice, and to have their skins for apparel, and therefore Cain, the very first man born into the world, fell into this damnable sin of murder. The reasons before rendered therefore are best, and that the creatures not being killed up at the first, might the better be multiplied upon the earth. After the flood men’s bodies grew weaker, and it is generally thought that neither herbs nor waters were so wholesome as before, but more corrupt through that deluge, and therefore flesh was now allowed to be eaten; and whereas waters were their only drink before, vines were now planted that they might have wine for their infirmity. Yet it is not to be doubted but that Noah and his sons did forbear the killing of beasts to eat for a time, that their increase might not be hindered. Calvin thinks it best to suspend and not to determine this question. Touching beasts, that now live upon flesh, some also think that they did so at the first, because the nature of a creature is always the same, and that when God assigned herbs and seeds for the beasts to feed upon, He meant not all beasts. But this is contrary to the text, speaking of all, wherein was the breath of life, and howsoever creatures never alter from their specifical nature, yet they may alter from their individual [nature], using such food at one time, as they used not at another, as children, who at the first are nourished with milk, and eat no solid meat, yet afterwards they eat it. Others therefore more probably hold, that even those beasts that since have lived upon flesh, and birds also, lived then all upon seeds and herbs, and that this discord and malignity of nature came upon them afterwards, since the Flood, one bearing a kind of hatred to another and so preying upon it and tearing and eating the flesh thereof. And this opinion has both the present text plainly for it and even at the time of the Flood it must needs be yielded to have been so, because all sorts of creatures earthly living with Noah in the ark, were susteined without eating flesh, for otherwise their number, being so few of each kind taken in, would not have sufficed, see also for this Isa. 11:7 and 65:25.</p></blockquote>

<blockquote><p>§XLVII. The purpose of created man with respect to God is the glory of his goodness, wisdom, power and sanctity (Prov. 16:4; Rom. 11:36). With respect to man, it is eternal life and salvation, which he ought to acquire by the consideration of his purpose and the use of the means (Lev. 18:5; Dt. 30:15,19; Eze. 33:11; Mt. 9:13; Lk. 10:28; Rom. 7:10; also Jn. 3:15-17; 2 Pet. 3:9; 1 Tim. 2:4; 1 Thess. 5:9). With respect to those who do not attend to the purpose of man and neglect the means of life, the end by accident, the event and consequence, is death (Rom. 7:10; Mk. 16:16; Jn. 3:18, 36; Rom. 1:18; 2 Cor. 2:16), and although man may fall short of his end, God is nevertheless not frustrated of his.</p></blockquote>

<blockquote><p>III. Man was eminently created by God in his own Image, after his Likeness, in respect of Sanctity and Holiness, Integrity and Rectitude.

There is a moral as well as intellectual Perfection. The Blessedness of God and his Glory lies in both. HE is infinitely and unchangeably possess’d of both. Nor is there any possible Perfection of Souls or Angels, but it must be both in Mind and Understanding, and also in Will and Affections. This is to follow the Dictate of that, and then the Light of God rules in the Heart; which is what we are call’d to by the Voice of Reason and Scripture. Then all is regular, wise, just, perfect.

There is none Holy as the Lord. He is glorious in Holiness. Holy, Holy, Holy, is his Name. Christ is the Holy One of God, and all the Angels of Heaven are holy Ones. They proclaim the equal Holiness of Father Son and Spirit, while they treble the Praises of the Divine Holiness. What then should be the Image of God on the Seraphims but their Holiness? while with cover’d Faces they make the Superlative Holiness of God the Subject of their Adoration. They never cease from this, They rest not Day and Night saying, Holy, Holy, Holy, Lord God Almighty! which art and wast and art to come. The Work of Saints on Earth is just the same, Exalt the Lord our God and worship at his Footstool, for the Lord our God is holy. And again, Give Thanks at the Remembrance of his Holiness.

This renders God fearful in Praises, that He is glorious in Holiness. “A perfect Understanding must have a perfect Will, and where the Mind and Will is perfect there must be perfect Holiness. Therefore is the Name of God most holy and reverend. He must needs be Holy in all his Works. He must needs then make Angels and Men holy. They could not come other out of his holy Hand. The Impress and Stamp of his Holiness must be upon them. Being capable of this Image of God, and it being necessary to their Perfection, they could not possibly be destitute of it. If every Word of God is pure, so is every Work. He cannot look upon Iniquity, he is of purer eyes than to behold it, he hates and loaths it, and loves Righteousness.

This bears his own Likeness, and is therefore lovely in his Eyes, for he infinitely loves Himself. We read, The Lord loveth the righteous: why? but because He is Himself righteous, and those that love and do Righteousness are like to Him. This one Thing is easily found, nor is all the Wisdom of Solomon needed to find it out, that God made Man upright. He could not make him otherwise. This Uprightness in the Creature is the Image of God upon it.

Men are Partakers of a Divine Nature, in the Regeneration of Souls. They are made upright and sincere in the Sight of God. Integrity and Uprightness preserves them, and they escape the Corruption that is in the World thro’ Lust, and add to their Faith, Virtue, Knowledge, Temperance, Patience, Godliness, brotherly Kindness and Charity. The Sons of Men (you see here) are capable of such a Glory and Likeness to God as to become again Partakers of the Divine Nature. This cannot possibly mean any thing more or less than some Restoration of the Image of God in them. The Loss of that Image is supposed, and it is said to be the Want of Original Righteousness &amp; the Corruption of his whole Nature.

He has corrupted himself thro’ Lust, and the World lies in this Corruption, it is propagated from Age to Age, and common to all Places. But then there is thro’ Grace an Escaping out of this Corruption, which some are made Partakers of, thro’ Sanctification of the Spirit. That is to say, they are made holy, virtuous, wise, temperate, patient, godly by the Power of Divine Grace, making a glorious Change in them; whereby they do again partake of that Divine Nature which was the Likeness of God upon Man in his first Creation.

This is the true and genuine Meaning of St. Peter‘s Words, repeated in the next Chapter They have escaped the Pollutions of the World, thro’ the Knowledge of the Lord and Saviour Jesus Christ. These the Holy Ghost calls new Men and new Creatures; being renewed in the Spirit of their Mind; the old Man being put off, which is corrupt according to deceitful Works, and the New Man put on, which after God is created in Righteousness &amp; true Holiness. See here the Image of God wherein Adam was created, and into which the Elect of God are recovered by the Power and Efficacy of the Gospel, which calls us with a holy Calling, from Uncleanness unto Holiness. This is the Image of God’s dear Son, and this is his Calling, Be ye Holy, for I am Holy. So we are made Children and adopted in Christ; for the HOLY ONE will put no other among his Children, but those in whom he puts this Likeness to Himself, his Son and Spirit.</p></blockquote>

e+must+needs+then+make+Angels+and+Men+holy.+They+could+not+come+other+out+of+his+holy+Hand.+The+Impress+and+Stamp+of+his+Holiness+must+be+upon+them.+Being+capable+of+this+Image+of+God%2C+and+it+being+necessary+to+their+Perfection%2C+they+could+not+possibly+be+destitute+of+it.+If+every+Word+of+God+is+pure%2C+so+is+every+Work.+He+cannot+look+upon+Iniquity%2C+he+is+of+purer+eyes+than+to+behold+it%2C+he+hates+and+loaths+it%2C+and+loves+Righteousness.%0A%0AThis+bears+his+own+Likeness%2C+and+is+therefore+lovely+in+his+Eyes%2C+for+he+infinitely+loves+Himself.+We+read%2C+The+Lord+loveth+the+righteous%3A+why%3F+but+because+He+is+Himself+righteous%2C+and+those+that+love+and+do+Righteousness+are+like+to+Him.+This+one+Thing+is+easily+found%2C+nor+is+all+the+Wisdom+of+Solomon+needed+to+find+it+out%2C+that+God+made+Man+upright.+He+could+not+make+him+otherwise.+This+Uprightness+in+the+Creature+is+the+Image+of+God+upon+it.%0A%0AMen+are+Partakers+of+a+Divine+Nature%2C+in+the+Regeneration+of+Souls.+They+are+made+upright+and+sincere+in+the+Sight+of+God.+Integrity+and+Uprightness+preserves+them%2C+and+they+escape+the+Corruption+that+is+in+the+World+thro%E2%80%99+Lust%2C+and+add+to+their+Faith%2C+Virtue%2C+Knowledge%2C+Temperance%2C+Patience%2C+Godliness%2C+brotherly+Kindness+and+Charity.+The+Sons+of+Men+%28you+see+here%29+are+capable+of+such+a+Glory+and+Likeness+to+God+as+to+become+again+Partakers+of+the+Divine+Nature.+This+cannot+possibly+mean+any+thing+more+or+less+than+some+Restoration+of+the+Image+of+God+in+them.+The+Loss+of+that+Image+is+supposed%2C+and+it+is+said+to+be+the+Want+of+Original+Righteousness+%26+the+Corruption+of+his+whole+Nature.%0A%0AHe+has+corrupted+himself+thro%E2%80%99+Lust%2C+and+the+World+lies+in+this+Corruption%2C+it+is+propagated+from+Age+to+Age%2C+and+common+to+all+Places.+But+then+there+is+thro%E2%80%99+Grace+an+Escaping+out+of+this+Corruption%2C+which+some+are+made+Partakers+of%2C+thro%E2%80%99+Sanctification+of+the+Spirit.+That+is+to+say%2C+they+are+made+holy%2C+virtuous%2C+wise%2C+temperate%2C+patient%2C+godly+by+the+Power+of+Divine+Grace%2C+making+a+glorious+Change+in+them%3B+whereby+they+do+again+partake+of+that+Divine+Nature+which+was+the+Likeness+of+God+upon+Man+in+his+first+Creation.%0A%0AThis+is+the+true+and+genuine+Meaning+of+St.+Peter%E2%80%98s+Words%2C+repeated+in+the+next+Chapter+They+have+escaped+the+Pollutions+of+the+World%2C+thro%E2%80%99+the+Knowledge+of+the+Lord+and+Saviour+Jesus+Christ.+These+the+Holy+Ghost+calls+new+Men+and+new+Creatures%3B+being+renewed+in+the+Spirit+of+their+Mind%3B+the+old+Man+being+put+off%2C+which+is+corrupt+according+to+deceitful+Works%2C+and+the+New+Man+put+on%2C+which+after+God+is+created+in+Righteousness+%26+true+Holiness.+See+here+the+Image+of+God+wherein+Adam+was+created%2C+and+into+which+the+Elect+of+God+are+recovered+by+the+Power+and+Efficacy+of+the+Gospel%2C+which+calls+us+with+a+holy+Calling%2C+from+Uncleanness+unto+Holiness.+This+is+the+Image+of+God%E2%80%99s+dear+Son%2C+and+this+is+his+Calling%2C+Be+ye+Holy%2C+for+I+am+Holy.+So+we+are+made+Children+and+adopted+in+Christ%3B+for+the+HOLY+ONE+will+put+no+other+among+his+Children%2C+but+those+in+whom+he+puts+this+Likeness+to+Himself%2C+his+Son+and+Spirit.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Colman%2C+A+dissertation+on+the+image+of+God+wherein+man+was+created%2C+%28Boston%3A+S.+Kneeland+and+T.+Green%2C+1736%29%2C+pp+11-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe7ebf03766.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e7ebf03766.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/26/benjamin-colman-on-the-image-of-god-3/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

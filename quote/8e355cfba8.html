<blockquote><p>Let’s examine whether we are a people in Covenant with God. I know special care has been taken that these Nations should not be God’s people in Covenant; Men are afraid of an Association, but it will do them no harm if God be not the bond of it, and his honour, and interest the great end of it: But this we may assure our selves, that if we send away our God we may as wisely disband our Forces, and lay up our Ships; we must be God’s vineyard if we expect his special protection. Isa. 27. 2, 3. In that day sing ye unto her, A vineyard of red wine: I the Lord do keep it; I will water it every moment; left any hurt it, I will keep it night and day: That is, I will neither slumber nor sleep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vincent-alsop.html">Vincent Alsop</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God in the mount: A sermon upon the wonderful deliverance of His Majesty from assassination. The nation from invasion</cite>, (London: J. Barnes, 1696), p. 25.</span></figcaption>

<blockquote><p>Beware therefore Kings and Princes, beware kingdoms and common-wealths. Beware of false prophets, which come to you in sheep’s clothing, but inwardly are ravening wolves. And thou Britain especially Scotland, my dear country, the purest portion of Christ’s Church in the world this day, assure thy self, and I assure thee, for I know it, that thy good people are as sheep in the midst of wolves, be ye therefore (heads and members thereof) wise as serpents Casting out this bound woman and her Son, by the execution of the Law, of the kingdom, ad amussim, punctually, not granting them a pecunial [sic] liberty of conscience, or any toleration whatsoever, and GOD will help you, yet notwithstanding your imminent dangers, whereof I shall advertise you in the end of this discourse; otherwise your liberties and kingdoms are lost, and Antichrist hath prevailed.</p></blockquote>

ormed Covenanter</a></div>
</figure><figure class="quote" id="q-4ae08d984d" data-kw="">
<blockquote><p>A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) if love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, pp. 100-101 Wolter was a Scotus scholar.</span></figcaption>

<blockquote><p>We are apt to think, that there is such a difference between our open sins and our religious exercises, that any defilement attaching to the latter must be so inconsiderable in itself, and so outweighed by the sacredness of the act performed, that no particular account need to be taken of these sins. God’s estimate is very different indeed. His eye sees the sins of our religious services in another light, as being no less heinous than other iniquities, and needing special forgiveness no less than they.

Not merely our open transgressions—our scarlet and crimson sins—need pardon, but our holy services, our good words and deeds, our prayers, our praises, our worship, our breaking of bread at the table of the Lord. In every one of these there is such an amount of sin cleaving to, and mingled with, every act, and feeling, and thought, and word, as to render them in themselves so miserably defective and defiled, as to be utterly unacceptable in the sight of the Holy One.

When seeking God, we need to have our way of seeking and our act of seeking forgiven. When praying for pardon, we need to have that prayer itself forgiven. Each petition bears witness against us. There is such imperfection, such coldness, such formality, such deadness, such wandering, such half-heartedness, such a want of every thing that constitutes prayer, that, were there not forgiveness for the sins of our holy things, we might as well cease to pray. When coming to Christ, we need forgiveness for our act of coming, for the impure motives which lead us to come, as well as for the defective way in which we come. All this is provided for. There is forgiveness not merely for the sins we bring to Christ, but for our way of bringing them. …

There is forgiveness, then, for the iniquities of our holy things forgiveness not only for our omissions of duty, but for our duties themselves; forgiveness, not only for our estrangement from God, but for our sins in returning to him; forgiveness, not only for our prayerlessness, but for our prayers; forgiveness, not only for our long rejection of Christ, but for our sins in coming to him; forgiveness, not only for our unbelief, but for our faith; forgiveness, not only for our past enmity, but for our present cold-hearted love; forgiveness, not only for the sins we bring to Christ, but for our way of bringing them; forgiveness, not only for the sins we carried to the altar of burnt-offering, and laid upon the bleeding sacrifice, but for our imperfect way of taking them, the impure motives that defiled our service, and also for the sins mingling with our worship when standing within the veil in that sanctuary, where the majesty of the Holy One has made its abode.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ our High Priest, Bearing the Iniquity of our Holy Things in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>But do not Libertines teach that no man is saved, but these that walk holily, and that sanctification is the unseparable fruit and effect of justification? Answer: They say it in words, but fraudulently: 1. Because all sanctification to them, all repentance, all mortification, all new obedience is but an apprehension that Christ has done all these for them, and that is their righteousness, and so Christ repented for them and mortified sin for them, and performed all active obedience for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 321</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c626d585fe" data-kw="">
<blockquote><p>Q. 23. Is it correct to say that the righteousness of the Mediator is imputed to us in justification and infused in sanctification? …it is not the same righteousness of Christ that occurs in its two parts. When I speak of an imputed righteousness of the Mediator, then I mean that righteousness that He obtained by means of his suffering and dying and obedience in the state of humiliation–not, however, the righteousness of life of the human nature of Christ, that is, that Christ in his human nature now possesses. The latter is not imputed to me. And, conversely, the former cannot be infused into me; it can only be reckoned to me. Really, one cannot even say that the righteousness in which Christ now lives is infused into me. This always rests on a more or less unclear mystical conception. It is not the personal righteousness of Christ that is infused into the believer, for, as an inherent quality, righteousness cannot be detached from the person. Q. 24 Is then no ‘holiness’ of Christ imputed to us? Yes; by that term, if one wishes, one can designate his active obedience, imputed to us in justification. As our [Heidelberg] Catechism states in the answer to question 60, ‘How are you righteous before God?… God grants and imputes to me the perfect satisfaction, righteousness, and holiness of Christ,’ etc. In this sense, one may thus then say that Christ is not only our sanctification but also our holiness before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics tr: Richard Gaffin 1 vol. ed.</cite>, pp. 801-2</span></figcaption>

<blockquote><p>Whether we be justified by the passive obedience of Christ alone, or also by his active?¹ ¹ Bishop Carlton, Consens. Eccles. Cathol. contr. Trid. de Fide Justif., ch. 3; Daniel Featley in his Sacra nemesis, pp. 24, 29-30, 36-38; L’Emper. in his Theses, Article 1 and many others are for both Christ’s active and passive obedience. Etsi autem in negotio Iustificationis magno periculo erratur, prout ea de re controversia procedit inter nos et Pontificios, utrum scilicet gratiá Dei Iustificatio nobis contingat, an meritis nostris: Attamen prout inter nos &amp; Piscatorem controversia instituitur, passiváne tantum, an etiam activa Christi obedientia justificemur coram Deo, nullo prorsus erratur periculo. Utrobique enim Iustificationis causae gratiae et Christi meritis adscribuntur, non autem operibus nostris. Twisse, i• Corv. Defens. Arm. contra Tilenum Animadversio. Scriptura Christi passioni Iustificationem passim adscribit; idque eu i• locis, in quibus exprofesso argumentum istud pertractat: nulla tamen justitiae, quae in obedientia legi exhibita consistat, facti mentione vel levissima, Rom. 3:24-25 &amp; 4:24-25 &amp; 5:9-10; Gal. 3:11, 13. Gataker. Animadv. in Piscat. &amp; Lucii Scripta Adversaria, p. 2, Sect. 10. Vide plura in cjus Gomar, Disput. Elentic. de Iustif. Elench. In this controversy many learned divines of our own differ among themselves, and it does not seem to be of that importance that some others are about justification. We are justified in part by Christ’s active obedience, for by it we obtain the imputation of that perfect righteousness which gives us title to the Kingdom of Heaven. Seeing it was not possible for us to enter into life, till we had kept the commandments of God, Mt. 19:17, and we were not able to keep them ourselves, it was necessary our Surety should keep them for us, Dan. 9:24; Rom. 10:4; Rom. 3:21. (Mr. Hildersham on Ps. 51:7, Lecture 119) The Scripture seems to ascribe our redemption wholly to Christ’s bodily death, and the blood that He shed for us, Eph. 1:7; Rev. 5:9, but in these places the Holy Ghost uses a synecdoche, it puts one part of Christ’s passion for the whole: 1. Because the shedding of his blood was a sensible sign and evidence that He died for us. 2. This declared Him to be the true propitiatory sacrifice that was figured by all the sacrifices under the Law. (Idem, ibid.) Some urge this argument, By Christs active obedience imputed to them, the faithful be made perfectly righteous, what need is there then of his passive righteousness? need there anymore than to be made righteous? (See Mr. Bradshaw, Of Justification) Christ fulfilled the duty of the Law, and did undergo the penalty, that last was a satisfaction for the trespass which was as it were the forfeiture, and the fulfilling the Law was the principal, Ps. 40:4; Jer. 31:3; Gal. 4:4. Some, to avoid Christ’s active obedience, question whether Christ as man was not bound to fulfill the Law for Himself? All creatures are subject to God’s authority. Yet this detracts not from his active obedience, partly from his own free condescension, and partly because his whole person God and man obeyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’</cite>, pp. 518-19</span></figcaption>

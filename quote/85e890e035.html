<blockquote><p>THE DESERT SHALL REJOICE AND BLOSSOM LIKE THE ROSE. ISAIAH, XXXV. I.

THIS is a beautiful description of that glorious epoch, which Christendom beholds with an eye of faith, and in which the world will finally rejoice. The time is rapidly advancing, when the outcasts of Israel and the dispersed of Judah will be gathered together, from the four quarters of the globe, to the ancient land of promise. They will wail because of him, whom their forefathers have pierced, and will flee to the standard of the cross. This great event will usher in the aurora of that happy day, which prophets, time immemorial, have predicted, and which poets, with raptures, have often sun.

The children of Abraham, who arc now despised, as the mere offscouring of the earth, will then be revered as the favoured of heaven. Ten men at that time, out of all languages of the nations, will even take hold of the skirt of him, who is a Jew, and will say to him, we will go with you; for we have heard that God is with you. The kingdoms of the world will become the kingdoms of Immanuel. The knowledge of the Lord will cover the earth, as the waters cover the depths of the sea, The great family of man will become a family of brethren. Every knee will bow in the name of Jesus. Every tongue will confess that he is Lord, to the glory of the God supreme. The fear of Jehovah will dwell in every heart, and tranquillity and happiness in every dominion of the globe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-alden-jr.html">Timothy Alden, Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory of America. A Century Sermon delivered at the South Church, in Portsmouth, Newhampshire, IV January, MDCCCI</cite>, (Portsmouth NH: William Treadwell and Co., 1801), pp 5-6.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-28eb35bd0f" data-kw="">
<blockquote><p>The Mohammadan Theology of the Turks, Arabs, Persians, etc., has its name from Muhammad the Arab, a most cunning imposter, who began to put forth his own revelations in his fortieth year of age, in the year 612 of the common Era; while the time of the rise of Mohammadanism is reckoned to begin with the Hegira of the Arabs in the year 622 of the Dionysian Era, on the sixteenth day of July; namely, at which time Muhammad, who had begun to scatter the seeds of his new religion in Mecca, a chief city of the Arabian desert, being sought by the Magistrate of this city, secretly fled from Mecca to Medina, making use of a camel, with a multitude of his compatriots and dependents following. The principium and rule of the Mohammadan sect is the Alcoran [Koran].

The chief head of the Religion concerns Muhammad the Prophet, sent by God, who to the extent that he is greater than Christ, by so much he outshined Moses; while with the Holy Trinity they deny in particular the Deity of Christ, and His Satisfaction for the sins of His people. Now, Muhammad, so that he might propagate his new Religion all the more easily and successfully, astutely conflated it from various observances and rites; partly from the old Arabism and Gentilism, partly from Judaism, partly from the impure founts of the Gnostics, and other heresies distracting Christians at that time, Manichean, Arian, Nestorian: for in this manner he sought to capture the goodwill of the Arabs, Gentiles, Jews, and Heretics. The imposter died just over the age of sixty in the year of our Lord 632.

Among his followers, the names of the various sects are reckoned at seventy-two. Now, the principal Schism among the Mohammadans arose upon the occasion of a controversy concerning the right of succession in the principate: although Muhammad, bereft of male offspring, had designated his son-in-law Ali as successor; his three father-in-laws had first claimed the succession for themselves, who also were the first of the Caliphs before Ali, then about to succeed: hence in the following time some held Ali and his posterity as the legitimate successors of Muhammad, others otherwise: the Persians and even the Indians sided with the former; the Saracens, Egyptians, Turks, and Mongols sided with the latter …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ontinuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 6, pp 76-77.</span></figcaption>

<blockquote><p>The modern Jew acknowledges the true God of his fathers Abraham, Isaac and Jacob, but owns not Jesus the son of Mary for the true Christ… The deluded Mahometan confesses one God, the Creator of heaven and earth; yea conceives so well of the Lord Jesus, as not to suffer any Jew to take up the profession of a Musulman, till he have first renounced his enmity against Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Armilla catechetica: a Chain of Principles</cite>, pp. 68-69</span></figcaption>

</figure><figure class="quote" id="q-57c26decf7" data-kw="">
<blockquote><p>Accordingly, when the Turk now rises up haughtily against us, because he has already vanquished so great a multitude of Christians, we need not be alarmed on that account, as if the power of God were diminished, and as if he had not strength to deliver us. But we ought to consider in how many ways the inhabitants of Greece and of Asia provoked his anger, by the prevalence of every kind of base and shocking licentiousness in those countries, and by the dreadful superstitions and wickedness which abounded.

On this account very severe chastisement was needed for restraining the crimes of those who made a false profession of the name of God. Hence came the prosperity of the Turk, and hence was it followed by a shockingly ruinous condition throughout the whole of the east. Yet we see him insolently raising his crest, laughing at our religion, and applauding his own in a strange manner; but still more does he applaud himself, and “sacrifice to his net,” (Habakkuk 1:16,) as we have already said of other infidels.

We ought, therefore, to direct our minds towards the judgments of God, that we may not think that the Turk acquired such extensive dominion by his own strength. But the Lord allowed him greater freedom, for the purpose of punishing the ungodliness and wickedness of men, and will at length restrain his insolence at the proper time. Now, although prosperity is a token of the blessing of God, yet we must not begin with it if we wish to form right views of God himself, as Mahometans and Papists infer from the victories which they have gained, that God is in some respects subject to their control. But when we have known the true God, blessings are added in the proper order to testify his grace and power.</p></blockquote>

<blockquote><p>do constantly affirm what I set forth in my Apology, as I remember, whether in my own or the late Queen’s time, that conscience and religion have been the cause of the last extremity of punishment. For however much a man may be addicted to his religion, however much he may openly and constantly profess it, no danger of death will hang over him unless he shall have actually offended against the foreign laws in any act; or shall have been seen to be the very summit of a conspiracy of counsels pernicious to the commonwealth: except only such as relate to sacrifices, and other parts of the Pontifical system, who in transmarine regions insinuate themselves into sacred orders: who have so many conspiracies, so many treasons by them in England, either conceived or instigated or applauded, that from our borders they are driven back under the penalty of destruction. And yet none of them remains in the same thing which you would wish to call holy: that by the single case, being mulcted, death should immediately follow.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6ccc9b4c4f" data-kw="">
<blockquote><p>The particle wde, ‘here’, if referred to time, notes during Moses’s economy, while the Levitical law lasted; if it refer to place, it notes Jerusalem in the land of Canaan, where the temple was: in that habitation of the Israelitish church the Levitical priests were not only as to their nature and persons withering and decaying, ceasing to be on earth, though they had the honor to decimate their brethren, but as to their order and office, mortal, they were no better than the tithed and blessed by them, in prospect of death. Aaron himself, the first of the order, died, and so did all his successors, as well as Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations</cite>, On Mt. 23:23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>

</figure><figure class="quote" id="q-1e721d28af" data-kw="">
<blockquote><p>XX. The absolution committed to the ministers of the gospel is not judicial, such as belongs to a judge or lord; but ministerial, such as is partly by the preaching of the gospel (which consists in remission of this kind) or by his heralding or ministry of it, and in the exercise of ecclesiastical discipline, as it is subordinated to that preaching of the gospel (which is none other than that declaration by which he who was before leprous is declared clean); or such as belongs to a herald, who officially announces the favor of the magistrate to anyone. Nor does the power of the keys involve anything else because they are not the principal keys of the Lord (which are ascribed to Christ alone, Rev. 1:18; 3:7), but ministerial, such as belong to stewards and doorkeepers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, Q. 31, ‘The Five False Sacraments of the Romanists, p. 554</span></figcaption>

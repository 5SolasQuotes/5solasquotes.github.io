<main class="wrap"><figure class="quote" id="q-b3889c9410" data-kw="">
<blockquote><p>When Christ speaks here of an abiding in Him as the true Vine, He thereby indicates that true believers, who are in Him and must abide in Him through faith, are truly cut out of that old stock Adam, upon which they grow by virtue of the covenant of works (Rom. 11. 16-24); and that they through true saving faith being grafted into Him, must draw life from Him as the true stock, unto growth and fruitfulness. …

O! how few there are who shall fall out of the old stock! And though we admit that not every one experiences all that has been described in that order; yet we are certain that each one must be completely cut away from Adam, ere he shall live and grow through Jesus, the second Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), pp 72, 77.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3dcf2df3aa" data-kw="">
<blockquote><p>For because Paul had taught, that a man is justified by faith without works, hence some inferred, that in whatever manner a man live, it, equally suffices, that he persuade himself that Christ is his Saviour. Which they could have inferred with no plausibility, if that had been evident which the very learned man will have to be so, viz. That Paul, by faith understood evangelical godliness. But because Paul’s words evidently bore that sense, that faith was a thing distinct from all the works of holiness, as in reality it is, hence arose the pretext of calumny. I say, of calumny: for though Paul taught, that works contribute nothing to justification, or to procure a man’s title to salvation; yet he always taught, that they were not only useful, but also necessary to salvation, and that it is impossible, that sanctification should be separated from justification. James treads in the same path, and teaches that it is necessary that he who is justified by faith, should also be justified by works: that is, perform these works which are the evidences and effects of righteousness, and by which it is demonstrated not only before men, but also before God, that he is righteous: according to that of John, “He who doeth righteousness is righteous,” 1 John 3:7. Indeed there is a double justification: one of a man sinful in himself, whereby he is absolved from sin, and declared to have a title to eternal life, on account of Christ’s righteousness apprehended by faith, which Paul inculcated: another of a man, righteous already, sanctified by the Spirit of Christ, and who is declared to be such, by his words and actions. James teaches, that this is so necessary, and so connected with the former, that he is deceived who boasts of that and is destitue of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, trans. Thomas Bell (Glasgow: W. Lang, 1807), 97–99.</span></figcaption>

</figure><figure class="quote" id="q-8abea0f166" data-kw="">
<blockquote><p>These are the two parts of justification; the first is grace revealed by Christ, in that by Him we have God appeased, so that sin can no longer accuse us, but our conscience is, through trust in the mercy of God, brought back to security: the other is the gift of the Holy Ghost, with his gifts, who illuminates us against the defilements of the flesh and the spirit.</p></blockquote>

</figure><figure class="quote" id="q-4c8a8c117d" data-kw="">
<blockquote><p>XXII… Fourth, it is asked whether good works are prerequisite for justification. … (5) Indeed, there are not lacking among recent theologians those who teach a justification of the justified that happens with works going before it, whereby the one justified justifies himself from hypocrisy, which depends upon an inherent holiness, albeit imperfect, yet sincere. … (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed…</p></blockquote>

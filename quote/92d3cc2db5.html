<blockquote><p>And what are the leading characteristics, which it points out of this new covenant, as contradistinguished from that formerly made in the wilderness? They are chiefly two: first, that, according to this, provision should be distinctly made for the pardoning of iniquity, which the other, of itself, could not do, it being a simple revelation of law, threatening death for every transgression; and secondly, that, while under the old covenant, the law was only written upon tables of stone, and consequently was without then, by the new covenant it was to be put in “their inward parts, and written in their hearts.” [Jeremiah 31:33]

But what law is it that was thus to be changed from an outward into an inward testimony — transferred, as it were, from the tables of stone, into the “fleshly tables of the heart?” Not certainly the ceremonial law, as the Mosaic ritual is sometimes called, for this so far from being exalted into a higher place by Christ, was, in him, abolished, passing away like the shadow when the substance came. And, indeed, that outward ritual, though it is sometimes spoken of as a law, is never designated absolutely the law of God, and least of all, can it be meant when the law and covenant are considered, as they are here, in great measure identical, what was called pre-eminently the law, and what formed exclusively the old covenant, was simply the Ten Commandments— these wholly, and these alone.

It can scarcely, therefore, admit of a doubt, that these are what the Spirit of prophecy here foretold should, one day, viz., in the Gospel dispensation, be written by the finger of God upon the hearts of his people. Their relative position to man, indeed, was to be changed; they were no longer to be placed before him as a law of strict and unbending holiness, by conformity to which he was to make good his title to God’s favour and blessing; as a covenant, in that respect, they were to cease, having served, only while they stood through man’s inability to keep them, to multiply transgression; but as God was going to take the vindication of the law’s honour into his own hand, so that he could bestow pardon and righteousness, as a free gift, upon the guilty, he was at the same time to make provision for having that law, the image of his own holiness, impressed upon the hearts of his people by the living energy of his Spirit.

In short, by the terms of the new covenant, the people of God were not to have the law of the Ten Commandments imposed on them as the way by which they were to attain life, but breathed into them as the form and pattern of life already received from above; they were to become the law of the Spirit of life in Christ Jesus, because the law, in all the requirements of which he had perfected himself, and therefore that also, unto which they should be ever growing up, who, through the Spirit, were to be in all things “made conformable to his image.”

But if this be true of the Ten Commandments as a whole, it must, of course, be true of each individual part—of the Fourth Commandment, as well as any of the rest. This, undoubtedly, was included as an essential part of the law or covenant, which was formerly written without, and set up before, the people of God; but is now written within, and infused with living power into the feelings and affections of their heart.

Hence the framers of the English Liturgy, with a right understanding of this truth, have added, after the reading of the Ten Commandments in the public service, the following prayer, which is just the words of this prophecy turned into a petition, “And have mercy upon us, and write all these laws in our hearts”—a prayer which, with marvellous inconsistence, is constantly read by the ministers of that Church; while a vast proportion of them hold that the Fourth Commandment, one of these laws, is no longer binding upon the consciences of men. [1]

And is not the argument which we have drawn from the words of this prophecy, in favour of the Sabbath, strikingly confirmed by the records of experience? For how uniformly do those, who are admitted into the privileges of the new covenant, love and delight in the day of God? When he writes his law upon the heart, we never see the Fourth Commandment omitted. Nay, the more any one drinks into the spirit of the Gospel, and experiences the grace of God writing the law of holiness upon the tablet of his heart, the more invariably does he count the Sabbath “the holy of the Lord and honourable.” So far from disliking the restraints which it throws around his condition, and panting for a larger freedom amid the recreations or business of the world, he gladly hails its hallowed employments, and finds its weekly returns as so many “spring days” to his spiritual nature.</p></blockquote>

<blockquote><p>Good news from heaven! the Day-spring from on high hath visited this undone world! After a deluge of sin and misery, behold the bow in the cloud. The Lord God has made and established a new covenant, and this it is that has cast the first beam on the dark state of lost and fallen man, and has brought life and immortality to light. This covenant is the hope of sinners, the riches of saints, the magna charta of the city of God: the forfeited lease of eternity renewed; God’s deed of gift, wherein he has, on fair conditions, granted sinners their lives, and settled upon his saints an everlasting inheritance.

Hear, ye forlorn captives, who have sold yourselves to eternal bondage, spoiled yourselves of all your glory, sealed yourselves up under everlasting misery. You are dead in your sins, guilty before God, under wrath, under a curse, bound over to eternal vengeance. But behold, there is yet hope in Israel concerning this thing; the Lord God has had compassion upon you, has opened a way for you to escape out of all this misery and bondage.

Lift up the hands that hang down, strengthen the trembling knees: an ark, an ark has (rod prepared, in which is salvation from the flood; a covenant, a new covenant has he made and established, which, if you lay hold on it, will recover all you have lost, ransom you from death, redeem you from hell, and advance you to a more sure and blessed condition than your original state from which you have fallen. This is the hope of sinners; this is the heritage of the servants of the Lord.

Glorious tidings, good news indeed! But what is this covenant? Or what is there that is given and granted therein? Why, in sum, there is all that heaven and earth can afford, all that can be needed or desired; and this, by a firm and irrevocable deed, made over, and made sure to all who will sincerely embrace it.</p></blockquote>

<blockquote><p>Q. 32 Why is this covenant also called a testament?

A. First, because the term testament began to be used in the church instead of the term covenant.

Second, because just as a testament is not valid without the death of the testator, so also this covenant could not be valid without the death of Christ.

Q. 33 What is the difference between the Old and the New Testament?

A. It is the same testament or covenant of God with all the elect from the first promise given in Paradise, concerning the seed of the woman who would crush the head of the serpent, to the end of the world.

But they are called Old and New Testaments because some of the circumstances and signs of the covenant were changed.

First, in the Old they believed in the Christ who was still to come; in the New we believe in the Christ who has been revealed.

Second, the Old contained the promise of the preservation of the nation of Israel until the time of Christ; in the New we have only the general promise of the preservation of the church under various governments.

Third, the Old had levitical ceremonies, for which, having been abolished in the New, Christ instituted baptism and the Lord’s supper.

Fourth, the Old was more obscure; the New is clearer.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q. 32 Why is this covenant also called a testament?

A. First, because the term testament began to be used in the church instead of the term covenant.

Second, because just as a testament is not valid without the death of the testator, so also this covenant could not be valid without the death of Christ.

Q. 33 What is the difference between the Old and the New Testament?

A. It is the same testament or covenant of God with all the elect from the first promise given in Paradise, concerning the seed of the woman who would crush the head of the serpent, to the end of the world.

But they are called Old and New Testaments because some of the circumstances and signs of the covenant were changed.

First, in the Old they believed in the Christ who was still to come; in the New we believe in the Christ who has been revealed.

Second, the Old contained the promise of the preservation of the nation of Israel until the time of Christ; in the New we have only the general promise of the preservation of the church under various governments.

Third, the Old had levitical ceremonies, for which, having been abolished in the New, Christ instituted baptism and the Lord’s supper.

Fourth, the Old was more obscure; the New is clearer.”

s.com/2019/04/11/zacharias-ursinus-on-the-covenant-and-testament-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4601d11d85" data-kw="">
<blockquote><p>Let this truth be fixed in the heart of every backsliding believer. The Lord restores the soul gently. The moment He discovers to it its sin, He conveys some token of His pardoning mercy; the balm is applied the moment the wound is given; the remedy is at hand the moment the distemper is discovered. There is a tenderness, an unutterable tenderness, in the heart and hand, in the mercy and the method of the Lord’s recovery of His child, which only He can feel. See it in the case of David. How did God bring his sin to remembrance? By the chastising rod? by heavy judgment? by severe expressions of displeasure? No; none of these were His messengers: but He sent a kind, tender, faithful prophet to discover to him his awful backsliding; and the astounding words, “Thou art the man,” had scarcely died away upon his ear, before he pours in this healing balm, “The Lord also hath put away thy sin, thou shalt not die.”

Oh, what gentleness, what tenderness, are thus shown in the Lord’s restorings of His wandering child! From whom could this have been expected but from Him whose nature and whose name is love—from whom, but Him who could thus speak to His backsliding Ephraim: “Is Ephraim my dear son? is he a pleasant child? for since I spoke against him, I do earnestly remember him still; therefore my bowels are troubled for him: I will surely have mercy upon him, saith the Lord.” (Jer. 31:20). This gush of tenderness towards a poor, returning, backsliding soul could only have had its dwelling-place in the heart of Jehovah.

All real return of a backsliding soul is through Jesus. Jesus is God’s great door of approach to His throne. No other entrance will conduct us to the golden scepter; no other will bring us to the holy of holies. Thus has the Holy Spirit unfolded this truth: “Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, His flesh; and having an High Priest over the house of God; let us draw near.” Oh, blessed Door of return for a poor, backsliding, heart-broken believer! A crucified Savior, in whom God is well pleased, and for whose sake He can receive the sinner, and put away his sin, can welcome the backslider, and heal his backsliding.</p></blockquote>

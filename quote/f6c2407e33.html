<blockquote><p>The question before us, is Whether a man be justified before God by faith only? Or by faith and sincere obedience to the Gospel jointly?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6c3d9a315" data-kw="">
<blockquote><p>There are innumerable passages in Scripture in which forgiveness of sins is attributed to good works, proceeding from faith and the special aid of grace. to mot for the present that passage, St. James 2:24, where man is expressly said to be ‘justified by works, and not by faith only;’ to omit, I say, that passage, about the meaning of which there is such warm contention between the parties, and of which we will afterwards treat in its proper place, see Eze. 17:21, and 33:12, 14-16, 19; Mt. 6:14; 18:35; Lk. 6:37; James 5:19-20, etc. Nay, any one who attentively reads the Scriptures will find that there are perhaps more passages which exact the condition of good works for obtaining the pardon of sins and eternal life, than there are which require the condition of faith, simply so called (Apology for the Remonstrants’ Confession, ch. 22, p. 237 verso); although it [i.e. faith] is necessarily always understood (nay rather presupposed) in them all. Let whoever chooses consult the Collection of passages for good works taken from both Testaments by G. Wicelius (Coacervatio locorum utriusque Testamenti de absoluta necessitate bonorum operum), and others; but especially let him diligently, and without prejudice, read the Holy Scriptures themselves. Scripture also very frequently teaches that we are purged from sins by the participation of the sacraments. (Eph. 5:26; Acts 2:38; 22:16; Tit. 3:5-7; Mt. 26:27-28 and frequently others)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, pp. 39-41</span></figcaption>

</figure><figure class="quote" id="q-b7a08b602c" data-kw="">
<blockquote><p>18. That imputation of the righteousness of Christ is neither fictitious, nor ideal, nor absurd; nor does it overthrow the δικαιοκρισία [dikaiokrisia, righteous judgment] of God, nor does it clash with human reason or practice. Nay, it is established by the Pontificals themselves through the trafficking of papal indulgences and the market of satisfactions and pardons, where the λογισμός [logismos, reckoning/imputation] and communication of another’s righteousness — albeit fictitious — is manifestly taught. It is no wonder, however, that the imputation of the righteousness of Christ is denied and opposed in this matter by those who neither know nor feel the union of ourselves with Christ and the power and efficacy thereof, and who prefer the means of salvation to be profitable to themselves [as independent workers] rather than gratuitous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts. 4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching +they+have+received+the+remission+of+sins+and+reconciliation+on+account+of+the+merits+of+Christ%2C+through+the+free+%5Bgratuita%5D+goodness+of+God%2C+and+cry+out+to+God%3A+Abba+Father%E2%80%99.+But+this+happens+to+no+one+unless+also+at+the+same+time+love+is+infused+%5Binfundatur%5D+which+heals+the+will+so+that+the+healed+will+may+begin+to+fulfil+the+law%2C+just+as+Saint+Augustine+said+%5BOf+the+Spirit+%26+Letter%2C+ch.+9%2C15%5D.+So+living+faith+is+that+which+both+appropriates+mercy+in+Christ%2C+believing+that+the+righteousness+which+is+in+Christ+is+freely+imputed+to+it%2C+and+at+the+same+time+receives+the+promise+of+the+Holy+Spirit+and+love.+Therefore+the+faith+that+truly+justifies+is+that+faith+which+is+effectual+through+love+%5BGal.+5%3A6%5D.+Nevertheless+it+remains+true+that+it+is+by+this+faith+that+we+are+justified+%28i.e.+accepted+and+reconciled+to+God%29+inasmuch+as+it+appropriates+the+mercy+and+righteousness+which+is+imputed+to+us+on+account+of+Christ+and+his+merit%2C+not+on+account+of+the+worthiness+or+perfection+of+the+righteousness+imparted+%5Bcommunicatae%5D+to+us+in+Christ.+5.+Although+the+one+who+is+justified+receives+righteousness+and+through+Christ+also+has+inherent+%5Brighteousness%5D%2C+as+the+apostle+says+%5B1+Cor.+6%3A11%5D%3A+%E2%80%98you+are+washed%2C+you+are+sanctified%2C+you+are+justified%2C+etc.%E2%80%99+%28which+is+why+the+holy+fathers+made+use+of+%5Bthe+term%5D+%E2%80%98to+be+justified%E2%80%99+even+to+mean+%E2%80%98to+receive+inherent+righteousness%E2%80%99%29%2C+nevertheless%2C+the+faithful+soul+depends+not+on+this%2C+but+only+on+the+righteousness+of+Christ+given+to+us+as+a+gift%2C+without+which+there+is+and+can+be+no+righteousness+at+all.+And+so+by+faith+in+Christ+we+are+justified+or+reckoned+to+be+righteous%2C+that+is+we+are+accepted+through+his+merits+and+not+on+account+of+our+own+worthiness+or+works.+And+on+account+of+the+righteousness+inherent+in+us+we+are+said+to+be+righteous%2C+because+the+works+which+we+perform+are+righteous%2C+a

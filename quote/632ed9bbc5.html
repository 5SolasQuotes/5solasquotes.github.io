<main class="wrap"><figure class="quote" id="q-632ed9bbc5" data-kw="">
<blockquote><p>…for as the state of the Church and people of God, some years since, was not unlike to that which was figured in the smoking furnace which was showed to Abraham, when horror and darkeness had fallen upon Him at the going down of the sun; so the late and present providences of God are not unanswerable to that which was shadowed in the vision which Moses saw when God appeared to him in a flame of fire in the bramble; The good will of Him that dwelt in the bush has come abundantly,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ward.html">John Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Goodwill of Him that dwelt</cite>, … the House of Lords… 1645 (London: 1645), pp. 14-15 Ward (d. 1665) was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43153d271d" data-kw="">
<blockquote><p>The argument of this paper is that Byzantine Iconoclasm was a response to the rise of Islam. This is an old-fashioned point of view. First advanced by the Byzantines themselves, the theory of Saracen influence was accepted by older scholarship on the subject, and long remained academically respectable. In the last generation, however, it has fallen out of favour. Contemporary literature on the subject, though far from agreed in other respects, is virtually unanimous that, whatever may have been the causes of Iconoclasm, Islam was not among them… the assumption that the Byzantines paid attention to what the successful Arabs believed is now deemed unproven, unnecessary or even incredible. Yet the case for Islam seems so effortless that the determination to exclude it must strike the outsider as an almost wilful exercise of professional scepticism… it is considerably simpler to assume that it was the role of Islam to make epidemic what had hitherto been merely endemic [in Christianity]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patricia-crone.html">Patricia Crone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Islam, Judeo Christianity &amp; Byzantine Iconoclasm’ in From Kavad to al-Ghazali: Religion, Law &amp; Political Thought in the Near East c. 600 – c. 1100 Pre (Ashgate, 2005), pp. 59-96, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“The argument of this paper is that Byzantine Iconoclasm was a response to the rise of Islam. This is an old-fashioned point of view. First advanced by the Byzantines themselves, the theory of Saracen influence was accepted by older scholarship on the subject, and long remained academically respectable. In the last generation, however, it has fallen out of favour. Contemporary literature on the subject, though far from agreed in other respects, is virtually unanimous that, whatever may have been the causes of Iconoclasm, Islam was not among them… the assumption that the Byzantines paid attention to what the successful Arabs believed is now deemed unproven, unnecessary or even incredible. Yet the case for Islam seems so effortless that the determination to exclude it must strike the outsider as an almost wilful exercise of professional scepticism… it is considerably simpler to assume that it was the role of Islam to make epidemic what had hitherto been merely endemic [in Christianity]…”

— Patricia Crone, ch. 3, ‘Islam, Judeo Christianity &amp; Byzantine Iconoclasm’ in From Kavad to al-Ghazali: Religion, Law &amp; Political Thought in the Near East c. 600 – c. 1100 Pre (Ashgate, 2005), pp. 59-96, p. 59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+argument+of+this+paper+is+that+Byzantine+Iconoclasm+was+a+response+to+the+rise+of+Islam.+This+is+an+old-fashioned+point+of+view.+First+advanced+by+the+Byzantines+themselves%2C+the+theory+of+Saracen+influence+was+accepted+by+older+scholarship+on+the+subject%2C+and+long+remained+academically+respectable.+In+the+last+generation%2C+however%2C+it+has+fallen+out+of+favour.+Contemporary+literature+on+the+subject%2C+though+far+from+agreed+in+other+respects%2C+is+virtually+unanimous+that%2C+whatever+may+have+been+the+causes+of+Iconoclasm%2C+Islam+was+not+among+them%E2%80%A6+the+assumption+that+the+Byzantines+paid+attention+to+what+the+successful+Arabs+believed+is+now+deemed+unproven%2C+unnecessary+or+even+incredible.+Yet+the+case+for+Islam+seems+so+effortless+that+the+determination+to+exclude+it+must+strike+the+outsider+as+an+almost+wilful+exercise+of+professional+scepticism%E2%80%A6+it+is+considerably+simpler+to+assume+that+it+was+the+role+of+Islam+to+make+epidemic+what+had+hitherto+been+merely+endemic+%5Bin+Christianity%5D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Patricia+Crone%2C+ch.+3%2C+%E2%80%98Islam%2C+Judeo+Christianity+%26+Byzantine+Iconoclasm%E2%80%99+in+From+Kavad+to+al-Ghazali%3A+Religion%2C+Law+%26+Political+Thought+in+the+Near+East+c.+600+%E2%80%93+c.+1100+Pre+%28Ashgate%2C+2005%29%2C+pp.+59-96%2C+p.+59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43153d271d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/43153d271d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-iconoclasm/#:~:text=The%20argument%20of%20this%20paper%20is,hitherto%20been%20merely%20endemic%20%5Bin%20Christianity&amp;text=The%20argument%20of%20this%20paper%20is%20that%20Byzantine&amp;text=what%20had%20hitherto%20been%20merely%20endemic%20%5Bin%20Christianity" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5c74c573f6" data-kw="">
<blockquote><p>In the worship service itself, it is by no means unlawful to use things, rites, and actions borrowed from the worshippers of idols and polluted with idolatry if, from the law of nature, they are either necessarily presupposed for worship, or if the causes and conditions of the same, without which worship would be impossible, demand them; which conditions are time and place of worship, a baptistry, cups, dishes, tables, the opening of the mouth, extending of the hand, going to the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla theologiae</cite>, 14.37 trans. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-0150883e5c" data-kw="">
<blockquote><p>…those who are not contented with His voice, but seek His visible form, substitute imaginations and phantoms in His place. But here arises a difficult question, for God made Himself known to the patriarchs in other ways besides by His voice alone; thus Abraham, Isaac and Jacob knew Him not only by hearing, but by sight. Moses himself saw Him in the midst of the burning bush; and He also manifested Himself to the prophets under visible figures…. And yet God was not forgetful of Himself when He thus presented Himself to the sight of His servants. Wherefore, this argument does not appear to be valid and good, that it is sinful to represent God in a visible image, because His voice was once heard without His being seen [Dt. 4:15-16]; when, on the other side, it is easy to object that visible forms have often been exhibited, wherein He testified His presence. The solution is twofold: first, that, although God may have invested Himself in certain forms for the purpose of manifesting Himself, this must be accounted as a peculiar circumstance, and not be taken as a general rule;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 4 | verse 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

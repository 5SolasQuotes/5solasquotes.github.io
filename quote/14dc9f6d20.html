<main class="wrap"><figure class="quote" id="q-14dc9f6d20" data-kw="">
<blockquote><p>But where I added, that in the name of Jesus Christ we baptize, though I said no more than the Scripture says [i.e. Acts 2:38; 8:12,16; 19:5], yet he [Mr. Hussey] is pleased to object against me… I cited plain texts to prove that baptism is done in the name of Christ… But how does baptizing in the name of Christ, as Mediator, agree with the commission to baptize in the name of the Father, Son and Holy Ghost?… First, I say, the question is of things or actions, not of words. Mr. Hussey (it seems) did apprehend my meaning, as if I had intended an expression to be made in the act of baptizing, thus: ‘I baptize thee in the name of Jesus Christ.’ But [on the contrary] I speak of the action, not of the expression, even as in another instance I gave: our assembling together is in the name of Christ, though we do not say in terminis [in the very terms], ‘We are now assembled in the name of Christ.’ In baptism Christ does not command us to say either these words, ‘I baptize thee in the name of Christ;’ or these, ‘I baptize thee in the name of the Father, Son and Holy Ghost:’ but we are commanded to do the thing, both in the name of Christ as Mediator, and in the name of the Father, Son and Holy Ghost; but in different respects. A minister of Christ does both preach and baptize in the name of Christ, as Mediator; that is, vice Christi, in Christ’s stead [see 2 Cor. 5:20], and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our commission to preach and baptize, by Mr. Hussey’s confession. So that to preach and baptize epi to onomati Iesou Christou [in the name of Jesus Christ] (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38), comprehends a formal commission, power and authority, given and derived from Christ. I say not that it comprehends no more, but this it does comprehend. But when Christ bids us baptize eis ta onoma, ‘unto’, or ‘into’, or ‘in the name’ of the Father, Son and Holy Ghost, Mt. 28:19, this does relate to the end and effect of baptism, or the good of the baptized (if we understand the words properly), not the authority of the baptizer, as if a formal commission were there given him from the Father, Son and Holy Ghost. So that to baptize on ‘in’ or ‘unto’ the name of the Father, Son and Holy Ghost, is properly meant both of sealing the parties’ right and title to the enjoyment of God Himself, as their God by covenant, and their interest in the love of God, the grace of Christ, and of the communion of the Holy Ghost; and of dedicating the party to the knowledge, profession, faith, love, and obedience of God the Father, Son and Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, p. 110-111</span></figcaption>

<blockquote><p>From this it follows that the children of believers are baptized not in order that they who were previously strangers to the church may then for the first time become children of God, but rather that, because by the blessing of the promise they already belonged to the body of Christ, they are received into the church with this solemn sign.</p></blockquote>

</figure><figure class="quote" id="q-d546e837e5" data-kw="">
<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-horn.html">John Horn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>…A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.”

— John Horn, …A Consideration of Infant Baptism, wherein the grounds of it are laid down… and many things of Mr Tombes [a Baptist] about it… Answered… (London, 1654), pp. 38-9 Horn (1614-1676) was an English minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNor+yet+do+%5Bthey%2C+the+apostles%5D+make+their+being+of+a+household+simply+the+ground+of+their+being+baptized%3B+for+I+confess+there+may+be+diverse+in+and+of+a+houshold%2C+that+in+some+case%2C+that+is%2C+of+positive+refusing+to+stoop+to+the+Gospel%2C+may+not+be+baptized%3B+as+an+unbelieving+wife%2C+servant%2C+or+child+grown%2C+they+are+by+persuasion+to+be+won+in%2C+or+else+let+alone%2C+this+springing+from+the+foresaid+ground+of+not+forcing+ordinances+upon+men%3A+But+I+make+the+grounds+of+their+baptism%3A+the+tenor+of+the+commission+that+bids+them+%5Bministers+to%5D+disciple+all+the+gentiles%2C+and+of+the+gospel+holding+forth+grace+to+all%2C+one+and+other%2C+no+man+being+common+or+unclean+in+that+respect+in+God%E2%80%99s+account%2C+but+as+they+render+themselves+so+by+their+willing+rejections+of+the+grace+tendered+to+them%2C+with+their+being+under+the+tuition+of+those+that+profess+faith%2C+and+subjection+to+the+doctrine+of+Christ%2C+and+the+non-resistance+found+in+them%2C+and+the+duty+lying+upon+parents+to+bring+them+up+in+the+nurture+and+admonition+of+the+Lord.+Whence+it+is+to+be+noted%2C+that+it%E2%80%99s+said+of+the+jailor%2C+he+and+all+his%2C+not+all+his+%E2%80%98houshold%E2%80%99%2C+but+all+%E2%80%98his%E2%80%99+were+baptized%3B+possibly+some+in+the+house+might+not+be+in+his+%5Bto%5D+dispose%2C+but+so+many+as+were+his+were+baptized.+If+any+man+say%2C+its+an+act+of+force+to+disciple+an+infant%3B+I+say+no%2C+of+no+more+force+to+baptize+them+to+Christ%2C+than+to+lay+them+in+their+cradles+or+carry+them+in+their+arms%3B+they+have+no+will+nor+reluctancy+against+it%2C+ye+may+do+with+them+what+ye+will%3A+whence+they+are+a+pattern+of+right+entring+the+Kingdom%3A+%E2%80%98He+that+receives+not+the+Kingdom+of+God+as+a+little+child%2C%E2%80%99+etc.+They+receive+it+as+God+and+his+people+order+them+into+it%2C+and+in+it.+And+for+their+discipling+by+instruction%2C+they+usually%2C+if+well+educated%2C+drink+it+in%2C+and+submit+to+it+better+than+others%2C+as+to+the+outward+profession+at+least%2C+as+was+before+said.+And+I+find+not+that+baptism+was+ever+denied+to+any+that+would+submit+themselves+to+learn+the+Christian+profession%E2%80%A6+%E2%80%A6who+yet+when+they+%5Binfants%5D+came+to+years+of+understanding%2C+owning+what+was+in+infancy+done+to+them%2C+were+never+therefore+reputed+members+of+the+Church+or+proselytes+by+compulsion.%E2%80%9D%0A%0A%E2%80%94+John+Horn%2C+%E2%80%A6A+Consideration+of+Infant+Baptism%2C+wherein+the+grounds+of+it+are+laid+down%E2%80%A6+and+many+things+of+Mr+Tombes+%5Ba+Baptist%5D+about+it%E2%80%A6+Answered%E2%80%A6+%28London%2C+1654%29%2C+pp.+38-9+Horn+%281614-1676%29+was+an+English+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd546e837e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d546e837e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=Nor%20yet%20do%20%5Bthey%2C%20the%20apostles,the%20Church%20or%20proselytes%20by%20compulsion&amp;text=Nor%20yet%20do%20%5Bthey%2C%20the%20apostles%5D%20make%20their&amp;text=members%20of%20the%20Church%20or%20proselytes%20by%20compulsion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

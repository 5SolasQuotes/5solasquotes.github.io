<main class="wrap"><figure class="quote" id="q-189b457bc9" data-kw="">
<blockquote><p>11. The angels, as touching their substance and nature, seeing they be spirits, cannot be expressed; yet is it lawful sometimes to picture them in such wise, as they have showed themselves unto men: for they be not, as God is, infinite; but are bounded and limited. Neither does the commandment of God forbid this, unless their pictures were made, to the intent they should be religiously and devoutly worshipped.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (London: Henrie Denham et al., 1583), pt. 2, ch. 5. ‘The Second Precept, which concerns Images, their Beginning, Antiquity &amp; Cause’, p. 341</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f2a62812d" data-kw="">
<blockquote><p>Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

— John Norton, The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 7-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDuration+is+either+increated%2C+viz.+eternity%2C+proper+to+God%2C+or+created%2C+viz.+eviternity%2C+the+duration+of+the+blessed+in+glory%3A+or+time%2C+which+is+the+duration+of+the+corruptible+creature%3A+Eternity+is+a+duration%2C+consisting+of+an+eternal+NOW%2C+without+beginning%2C+and+without+ending%3B+there+is+nothing+past%2C+nor+to+come.+Eviternity+is+a+duration%2C+having+a+continuing+NOW%2C+with+a+beginning%2C+but+without+ending.+The+duration+of+angels+and+of+the+blessed%2C+in+respect+of+their+persons+and+substances+admit+of+no+instant+concerning+which+it+can+be+said+that+it+is+past%3A+but+in+regard+of+their+operations+and+other+accidents%2C+their+duration+admits+of+succession.+Time+is+a+successive+duration%2C+having+a+beginning+and+ending%2C+without+any+remaining+NOW.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+7-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9f2a62812d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9f2a62812d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-angels/#:~:text=Duration%20is%20either%20increated%2C%20viz.%20eternity,and%20ending%2C%20without%20any%20remaining%20NOW&amp;text=Duration%20is%20either%20increated%2C%20viz.%20eternity%2C%20proper%20to&amp;text=a%20beginning%20and%20ending%2C%20without%20any%20remaining%20NOW" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a> › <a href="../topics/angels-and-demons/good-angels/guardian-angels.html">Guardian angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).”

— Francis Turretin, Institutes of Elenctic Theology, 7.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIs%20a%20particular%20angel%20assigned%20as%20a%20perpetual%20guardian%20to%20each%20believer%3F%20We%20deny.%20From%20Acts%2012%3A15%2C%20where%20mention%20is%20made%20of%20Peter%E2%80%99s%20angel%2C%20it%20can%20be%20collected%20that%20a%20certain%20angel%20was%20then%20present%20with%20Peter%2C%20but%20not%20that%20a%20particular%20and%20perpetual%20guardian%20was%20given%20to%20him.%20For%20he%20is%20said%20%E2%80%9Cto%20have%20come%20upon%20him%E2%80%9D%3B%20as%20when%20%E2%80%9Cthe%20physician%20and%20servant%20of%20the%20king%E2%80%9D%20is%20alluded%20to%2C%20not%20a%20particular%20one%20is%20understood%2C%20but%20indefinitely%20he%20who%20performs%20that%20office%20%28which%20many%20can%20perform%20successively%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%207.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F753214a097.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/753214a097.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

</figure><figure class="quote" id="q-06e5794c6a" data-kw="">
<blockquote><p>Bodies are in places circumscriptively bounded by their dimensions without penetration. Angels are in places definitively, that is, though they are not bounded by dimensions of height, breadth and depth, as bodies, yet they are not in two places at once; whilst they are in this place, they are not in another. God is in every place always.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, p. 8</span></figcaption>

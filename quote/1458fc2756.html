<main class="wrap"><figure class="quote" id="q-1458fc2756" data-kw="">
<blockquote><p>The Socinian Error is Fundamental, they deny Christ’s satisfaction, and so overthrow the foundation of our faith, the foundation of our Justification; they deny the Holy Trinity, and so take away the very Object of our Faith; they deny the Resurrection of these Bodies, and so take away the foundation of our hope; they deny original sin, and so take away the ground of our Humiliation, and indeed the necessity of regeneration; they advance the power of Nature, and destroy the efficacy of Grace. It is an Antichristian error, because it takes away the very Essence and Person of Jesus Christ, for they deny him to be God, and so take away his Essence; they deny him to be the second Person in the Trinity, and so destroy his very person also.

They do in effect rob him of all his offices, for if Christ be not God, he is not that great Prophet foretold by Moses, who is Prince and Author of life, Act. 3. 15. 22. ad finem, Act. 7. 37, 38. Nor can he be a Priest able to save by the offering of himself, because the merit of his sacrifice depends upon the dignity of his person: the offering of a mere man cannot satisfy for so many thousands of men: and therefore the Socinians having denied the Godhead of Christ, deny that he hath given God full satisfaction. Nor can Christ be a King, who hath an heavenly and eternal kingdom by nature, if he be not God.

It is an Anti-spiritual error, for they deny the Nature and Person of the holy Ghost, the special grace and saving efficacy of the holy Ghost; they say, we can understand the deepest mysteries of faith, and believe in Christ without the special assistance of the holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The rise, growth, and danger of Socinianism together with a plain discovery of a desperate design of corrupting the Protestant religion, whereby it appears that the religion which hath been so violently contended for (by the Archbishop of Canterbury and his adherents) is not the true pure Protestant</cite>, (London: Samuel Gellibrand, 1643), pp 24-25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/socinians/trinity-and-deity-of-christ.html">Socinians: Trinity and Deity of Christ</a></span></div>

</figure><figure class="quote" id="q-dcb5c92470" data-kw="">
<blockquote><p>We sharply contend with Socinus that finite and corrupt reason must not be made the rule of believing, or what amounts to the same thing, that we must not trust in reason if the sacred page contradicts it. Such a hideous error we all abhor, but many among us – some knowingly, others incautiously and ignorantly – follow in the footsteps of Socinus, although from this source comes every deformity of religion. What a miserable little mankin that has more faith in himself than in God! The divine oracles teach that in the beginning all things were created from nothing, which finite and vitiated reason does not accept.</p></blockquote>

</figure><figure class="quote" id="q-d4c96bffd2" data-kw="">
<blockquote><p>Whereas our Savior is frequently, in Scripture, call’d the Son of God, the Socinians deny that he is so call’d with respect to his Eternal Generation, or being Begotten of his Father before all World’s; as also they deny that his Divinity can be prov’d thence.</p></blockquote>

</figure><figure class="quote" id="q-067a7e2059" data-kw="">
<blockquote><p>And in a special manner, the enmity of the heart against Christ in his priestly office, seems to be hid from the view of most of the hearers of the gospel. Yet there appears to be a peculiar malignity in corrupt nature against that office of his. It may be observed, that the Socinians, these enemies of our blessed Lord, allow him to be properly a Prophet and a King, but deny him to be properly a Priest. And this is agreeable enough to the corruption of our nature; for under the covenant of works, the Lord was known as a Prophet or Teacher, and also as a King or Ruler; but not at all as a Priest: so man knows nothing of the mystery of Christ, as the way to the Father, till it be revealed to him. And when it is revealed, the will riseth up against it; for corrupt nature lies cross to the mystery of Christ, and the great contrivance of salvation, through a crucified Saviour, revealed in the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all mankind in the future state. In severa</cite>, ed. Michael Boston (1784; United States: The Booksellers, 1787), p. 71.</span></figcaption>

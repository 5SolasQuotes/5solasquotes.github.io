<main class="wrap"><figure class="quote" id="q-312f6b8e83" data-kw="">
<blockquote><p>Wherefore we are not to imagine that faith is infused either before or without other graces, or that the soul is not at the same time and as soon disposed to love and fear God as to believe in Him, or to humility, to patience, to charity, to repentance, as for faith. The seed of all these graces is sown at once; and for their habits they are coeval stems of one common root of inherent sanctity: though yet some of them shoot up faster and bear fruit sooner than other. Those that do so are the two principal graces of faith and repentance: the actions of both which seem to appear first in the regenerate: which of them show first, I will not now dispute; but certain it is that the regenerate soul works here most lively and stirring, and after the infusion of spirituall life the pulse beats strongest in those arteries. The reason whereof I take it is, the singular use of these two graces arising from the manner of our conversion: which being wrought by the sight of sin and misery on the one side, and the representation of grace and mercy on the other, of necessity draws the newly-regenerate soul by strong motions immediately to conceive sorrow for, and detestation of its sinful misery, and also to a vehement desiring and looking after the promise of grace, which may bring it deliverance from an estate so damnable. But in this point of the priority of one grace before another, we may not be too bold nor curious: for as the working of the Holy Ghost is secret and wonderful, in making us wild gourds partakers of the sap and sweetness of the true vine: so is it not possibly observable in all or the most, where, and in what branch this sap first buds forth into blossoms and fruit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627)</cite>, pp. 11-12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d54f60b6ea" data-kw="">
<blockquote><p>Therefore secondly, we say that there are other graces coexistent with faith in the person justified. A solitary faith is not a saving and justifying faith: Faith, if it has not works, is dead, being alone. Faith that is alone saves not, though faith alone save. As the act of seeing is by the eye only, without the ear, or other senses; the eye only sees; the ear sees not, nor the taste, nor the smell, nor the feeling; yet the eye could not see if you should take away the other senses from the body. So it’s faith only that justifies without other graces or good works; yet faith without them, or separated from them, cannot justify: because indeed it cannot be without them in the person or subject where it is. So that faith is without other graces and works in its office, but not in its existence. And you may as soon part light and heat in the sun, as sanctification from justification in a believer. For faith is not only a fruit of the Spirit with other graces, but also the seed and nursery of other graces, because faith in Christ is the root-grace… It would be a strange soul that should give a faculty of seeing and no other faculty or sense: as strange a state of grace would that be that should give an act of saving and justifying faith and give no other grace besides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ the Lord our Righteousness… (London, 1669)</cite>, pp. 155-56</span></figcaption>

<blockquote><p>Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians (London: Griffin, 1615), on Col. 2:18</cite>, p. 704</span></figcaption>

<blockquote><p>XXX. Indeed, when we say that faith alone justifies, we do not even mean by that merely the act of believing taken precisely, as it is opposed to acts of love and hope, and is distinguished from repentance, or penitence, as being the condition demanded by the new covenant, or Gospel, for us to obtain the remission of our sins and to be absolved from them because of Christ. For just as the hope of pardon and the love of God, as well as sorrow for sin and the purpose of leading a new life, and, in a word, all the acts necessary for true and sincere conversion, are also required, so they are necessary and altogether prerequisite so that anyone may be received into favor by God and may be regarded by Him as justified. Indeed, that living and operative faith which we affirm justifies alone includes and involves all these acts. XXXI. And just as Scripture frequently asserts that we obtain the remission of sins through faith, so, no less frequently and expressly, does it teach that repentance and the entire conversion of the sinner to God are conditions without which the remission of sins cannot be obtained from God, and which, no less than faith, are required beforehand for it, although it neither effects nor merits it. To this belongs Solomon’s saying, already cited before, “He who hides his sins will not prosper, but he who confesses and forsakes them will obtain mercy.” And what Christ says in Luke, “Unless you repent, you will all likewise perish.” Hence it is that Peter thus exhorts the Jews, “Repent and be baptized every one of you in the name of Jesus Christ for the remission of your sins,” Acts 2:38. And, “Repent, therefore, and turn again, that your sins may be blotted out,” Acts 3:19. … LII. From what has now been explained, it is clear that the doctors of both the Roman and Reformed Schools recognize by common consent: … 2. That only living faith justifies, while dead faith contributes nothing to justice and salvation. 3. That not only the act of believing taken precisely but many other acts also, which concur to true repentance and serious conversion to God, are conditions required by God for one to obtain from Him the remission of sins and the infusion of new and habitual justice. 4. That the remission of sins and the renewal of the inner man are purely gratuitous gifts of God, which are not due out of justice to faith or any works, however much performed by the grace of God. 5. That it is fitting and suitable to divine goodness and wisdom to remit sins and grant the grace of the Holy Spirit to a sinner who sincerely repents and flees to God’s mercy by faith, but not to the unbelieving and impenitent. 6. That the new justice which the Holy Spirit creates in the faithful consists not only of the habit of faith but also of other Christian virtues.</p></blockquote>

on+of+your+sins%2C%E2%80%9D+Acts+2%3A38.+And%2C+%E2%80%9CRepent%2C+therefore%2C+and+turn+again%2C+that+your+sins+may+be+blotted+out%2C%E2%80%9D+Acts+3%3A19.+%E2%80%A6+LII.+From+what+has+now+been+explained%2C+it+is+clear+that+the+doctors+of+both+the+Roman+and+Reformed+Schools+recognize+by+common+consent%3A+%E2%80%A6+2.+That+only+living+faith+justifies%2C+while+dead+faith+contributes+nothing+to+justice+and+salvation.+3.+That+not+only+the+act+of+believing+taken+precisely+but+many+other+acts+also%2C+which+concur+to+true+repentance+and+serious+conversion+to+God%2C+are+conditions+required+by+God+for+one+to+obtain+from+Him+the+remission+of+sins+and+the+infusion+of+new+and+habitual+justice.+4.+That+the+remission+of+sins+and+the+renewal+of+the+inner+man+are+purely+gratuitous+gifts+of+God%2C+which+are+not+due+out+of+justice+to+faith+or+any+works%2C+however+much+performed+by+the+grace+of+God.+5.+That+it+is+fitting+and+suitable+to+divine+goodness+and+wisdom+to+remit+sins+and+grant+the+grace+of+the+Holy+Spirit+to+a+sinner+who+sincerely+repents+and+flees+to+God%E2%80%99s+mercy+by+faith%2C+but+not+to+the+unbelieving+and+impenitent.+6.+That+the+new+justice+which+the+Holy+Spirit+creates+in+the+faithful+consists+not+only+of+the+habit+of+faith+but+also+of+other+Christian+virtues.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+on+How+Faith+Justifies%2C+pp.+228-29%2C+234+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F377645d263.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/377645d263.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=XXX.%20Indeed%2C%20when%20we%20say%20that,but%20also%20of%20other%20Christian%20virtues." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VI. (3) The question is not whether solitary faith (i.e. separated from the other virtues) justifies (which we grant could not easily be the case, since it is not even true and living faith); but whether it “alone” (sola) concurs to the act of justification (which we assert); as the eye alone sees, but not when torn out of the body. Thus the particle “alone” (sola) does not determine the subject, but the predicate (i.e., “faith only does not justify [sola fides non justificat], but “faith justifies alone” [fides justificat sola]). The coexistence of love in him who is justified is not denied; but its coefficiency or cooperation in justification is denied. (4) The question is not whether the faith “which justifies” (quae justificat) works by love (for otherwise it would not be living but dead); rather the question is rather faith “by which it justifies” (qua justificat) or in the act itself of justification, is to be considered under such a relation (schesei) (which we deny). … XIII. It is one thing for love and works to be required in the person who is justified (which we grant); another in the act itself or causality of justification (which we deny). If works are required as concomitants of faith, they are not on that account determined to be causes of justification with faith or to do the very thing which faith does in the matter. XIV. Although the whole force of justifying on the part of man is in faith as to the act of apprehension (so that other virtues contribute nothing to it with faith), it does not follow that faith can justify when they are absent as well as when they are present–yea, even wehn the opposite vices are present. It is one thing to justify without virtues (i.e., separated from them–which we deny); another for it to justify alone, but not separated from them. As it does not follow, the hand alone writes and the eye alone sees–therefore [it does this] as much when torn from the head and the other members as [it does when it is] in the body; the sole force of respiration is in the lungs–therefore the lungs can respire torn out from the liver and other viscera as well as when connected to them (which everyone sees to be absurd). Natural potencies are connected as to existence, but disjoined as to operation. Light and heat in the sun are most closely connected together, but still the light alone illuminates, the heat alone warms. Therefore, although the other virtues do not justify with faith, still faith cannot justify in their absences, much less the opposite vices being present. For faith cannot be true except in connection with the virtues (which if they do not contribute to justification, still contribute to the existence and life of faith, which the presence of vices would destroy). … XX. Although remission of sins is promised to repentance (because it ought to accompany faith and be in him who is justified as a certain condition requisite from him because God cannot pardon sin to an impenitent), it does not follow that it can be said to justify with faith because it contributes nothing (neither meritoriously, nor instrumentally) to the act of justification.</p></blockquote>

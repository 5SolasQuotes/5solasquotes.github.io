<blockquote><p>…namely, forasmuch as the uncovering of the head was then a sign of power and dominion, as on the contrary now at this day those that have power over others will keep their heads covered, and they that are under others will uncover their heads before them. But in all these things, we must always have the respect to the use of divers times and countries, and what is honorable and edifying therein, 1 Cor. 14:40, Phil. 4:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dutch-reformed.html">Dutch Reformed</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dutch Annotations 1637 | On 1 Cor.</cite>, 11:4</span></figcaption>

</figure><figure class="quote" id="q-00a419400e" data-kw="">
<blockquote><p>I rather think, with the learned Cappellus, that this apostolical prescript or canon of good order was founded upon some civil custom then obtaining among the Corinthians and elsewhere; from whence he concludes that according to the difference of several countries, such an habit and deportment is to be used in divine service which is commonly used to express reverence and decency in conversation. … (He, that will see the different customs of nations in this matter, both in and out of sacred uses, may consult Grotius and Cappellus at large on the place.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/france.html">France</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Louis Cappel | As narrated by Samuel Thomas, Animadversions upon a Late Treatise, entitled, The Protestant Reconciler… (London, 1683), section 8</cite>, pp. 110-12 Louis Cappel (d. 1658)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I rather think, with the learned Cappellus, that this apostolical prescript or canon of good order was founded upon some civil custom then obtaining among the Corinthians and elsewhere; from whence he concludes that according to the difference of several countries, such an habit and deportment is to be used in divine service which is commonly used to express reverence and decency in conversation. … (He, that will see the different customs of nations in this matter, both in and out of sacred uses, may consult Grotius and Cappellus at large on the place.)”

</figure><figure class="quote" id="q-91a53fdb92" data-kw="">
<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms a Gospel-Ordinance… (London, 1650), ch. 10, ‘Of the Manner of Singing’</cite>, pp. 58-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

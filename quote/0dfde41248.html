<main class="wrap"><figure class="quote" id="q-0dfde41248" data-kw="">
<blockquote><p>The moral law (to begin first with it) is contained under two heads, one of which simply commands us to worship God with pure faith and piety; the other, to embrace men with sincere affection. Accordingly, it is the true and eternal rule of righteousness, prescribed for men of all nations and times, who wish to conform their lives to God’s will. For it is his eternal and unchangeable will that he himself indeed be worshiped by us all, and that we love one another. The ceremonial law was the tutelage of the Jews, with which it seemed good to the Lord to train this people, as it were, in their childhood, until the fullness of time should come [Gal. 4:3–4; cf. ch. 3:23–24], in order that he might fully manifest his wisdom to the nations, and show the truth of those things which then were foreshadowed in figures. The judicial law, given to them for civil government, imparted certain formulas of equity and justice, by which they might live together blamelessly and peaceably. Those ceremonial practices indeed properly belonged to the doctrine of piety, inasmuch as they kept the church of the Jews in service and reverence to God, and yet could be distinguished from piety itself. In like manner, the form of their judicial laws, although it had no other intent than how best to preserve that very love which is enjoined by God’s eternal law, had something distinct from that precept of love. Therefore, as ceremonial laws could be abrogated while piety remained safe and unharmed, so too, when these judicial laws were taken away, the perpetual duties and precepts of love could still remain. But if this is true, surely every nation is left free to make such laws as it foresees to be profitable for itself. Yet these must be in conformity to that perpetual rule of love, so that they indeed vary in form but have the same purpose. For I do not think that those barbarous and savage laws such as gave honor to thieves, permitted promiscuous intercourse, and others both more filthy and more absurd, are to be regarded as laws. For they are abhorrent not only to all justice, but also to all humanity and gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 4.20.15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-65f336f864" data-kw="">
<blockquote><p>Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent:

1. In that it is a foundation of the other laws, and they are reducible to it.

2. This was to abide always, not the other.

3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 155</span></figcaption>

<blockquote><p>Assertion 2: That the king only has the power of war and raising armies must be but a positive civil law. For: 1. By divine right, if the inferior judges have the sword given to them of God, then have they also power of war and raising armies. 2. …as therefore the king cannot take from one particular man the power of the sword for natural self-preservation, because it is the birthright of life, neither can the king take from a community and kingdom a power of rising in arms for their own defense… 3. Because no king, no civil power can take away nature’s birthright of self-defense from any man or a community of men.</p></blockquote>

</figure><figure class="quote" id="q-14e7e73d96" data-kw="">
<blockquote><p>To give a larger view, in short, of some of the differences between Feser and myself (and many others), the following comparisons respect specifically the voluntary exercise of one’s own faculty in regard to the necessity (or not) of the realization of an essential end of that faculty:

1. An essential natural end fixes moral possibility vs. An essential natural end entails ethical weight and a general orientation.

2. Acting against the given teleological end is morally, metaphysically impossible vs. Acting against the teleological end admits of proportional exceptions (i.e. the greater good).

3. Teleological, moral and metaphysical necessity in such a context are bound up together vs. these three things can function separately.

4. Properly functioning biology determines an action’s moral-kind vs. Rational, moral ordering and reasoning determines moral-kind and ought to (and does) weigh competing goods, proportionality, context and intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture</cite>, [Edward] Feser’ (RBO, 2025) | Conclusions:</span></figcaption>

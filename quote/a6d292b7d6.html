<main class="wrap"><figure class="quote" id="q-a6d292b7d6" data-kw="">
<blockquote><p>It is the privilege of believers to have eternal life, and the inheritance, by promise, and not by the tenor of the Law; and therefore all they, and only they are free from being under the Law. Gal. 3. 18. If the inheritance be by the Law, it is no more by promise. But God gave it to Abraham by the promise.

Were believers under the Law, they should have the inheritance by the Law: but they have it not by the Law, but by promise; and therefore are not under the Law. For the Law and the promise in the cause of righteousness, and life, will not be agreed, no more than light and darkness, fire and water, whose natures are most abhorring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regula Vitæ, the rule of the law under the Gospel. Containing a discovery of the pestiferous sect of Libertines, Antinomians, and sons of Belial, lately sprung up both to destroy the law, and disturb the faith of the Gospel: wherein is manifestly proved, that God seeth sin in justified persons</cite>, (London: Robert Dawlman, 1631), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c49dd8aef" data-kw="">
<blockquote><p>A fifth argument is that which so much sounds in all books: If good works be the effect and fruit of our justification, then they cannot be conditions, or causa sine qua non [a cause without which: nothing] of our justification. The consequence is clear, because such a supposed condition, or causa sine qua non, must be antecedent, and going before. Now the Orthodox bring Augustine’s known position, which also may be made good out of Scripture, Bona opera non praecedunt justificandum, sed sequuntur justificatum [‘Good works do not precede being justified, but follow having been justified’]; and another to that sense is quoted out of Gregory: Non per opera venitur ad fidem, sed per fidem ad opera [‘not through works is one come to faith, but through faith to works’], faith must go before works. Till we are justified, we are not able to do anything that is good… Seeing therefore that justification is antecedent to a holy life, good works cannot be any condition of it; and by this we may see that more things are required to our salvation than to our justification; to the possession of heaven and [versus] the entitling us thereunto. For justification does entitle and interest us in that eternal inheritance which is performed by faith; but to be made actual partakers of everlasting happiness, good works are the way to that Kingdom, not the cause of it. Therefore none contend more then the Orthodox writers for the necessity of good works, and that in respect of salvation; yet in respect of our justification, then the Scripture calls them a menstruous rag and such as are utterly unworthy. It’s true that justification cannot be continued in a man unless he continue in good works, yet for all that they are not conditions of his justification: they are qualifications and determinations of the subject who is justified, but no conditions of his justification. As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God. Its a thousand times affirmed by our divines, many things are required to the constitution of some subject, which yet are not either causes or conditions of such and such an effect: Light is necessarily required and dryness as qualities in fire, yet it burns as it’s hot, not as light or dry. To the integral being of a man are required his head and shoulders, so that the eye could not see if not seated there; yet a man’s shoulders are not the causa sine qua non of his seeing. Many things are necessarily conjoined together, and yet one is not the condition of the others’ effect. So that this doctrine does not exclude, but [does] command holy works, only it gives faith and works their proper place.</p></blockquote>

%20their%20proper%20place" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e5ff02224" data-kw="">
<blockquote><p>When we use the word faith strictly and properly we mean that for certain reasons apprehended by us we are satisfied as to the reality, reliability or truth of a certain event, object or person… When it has respect to a person we mean that we credit him as trustworthy in respect of that character which is under consideration… … To sum up, faith is trust. Trust presupposes an object. An object evokes our trust when there is an antecedent judgment of the mind that the object is trustworthy. This judgment is formed by the evaluation of evidence as sufficient. It is a state of mind induced by considerations objective to ourselves though always apprehended by our minds. … In this case it is useless or futile to try to ground this conviction [that the Scripture is the Word of God] upon rational argumentation based upon evidence extraneous to the sum total of the data with which the Christian revelation confronts us. It might seem that such argumentation is necessary in order to avoid the charge of arguing in a circle. But it will become apparent how impossible it is to produce by evidence extraneous to the Scripture the faith which has as its object the Scripture itself. The Reformers were aware of the fallacy attaching to argumentation on the basis of extrinsic evidence, and so they laid down the principle that Scripture is autopistic, that is, self-authenticating, and this means that the evidence validating the faith of Scripture as the Word of God is the Scripture itself. This is to say that it contains within itself the evidence of its divine origin, character, and authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Faith’ in Collected Writings</cite>, 2.235-6, 237, 241</span></figcaption>

<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification Through The Righteousness of Christ Alone Freely Imputed, Obtained by Living Faith in R. Scott Clark and Casey Carmichael, eds., Justification By Faith Alone</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>

<div class="actions"><button class="copy" data-copy="“By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.”

<main class="wrap"><figure class="quote" id="q-dcfe852884" data-kw="">
<blockquote><p>…If any person on Sunday shall himself be found labouring at his own or any other trade or calling, or shall employ his apprentices, servants or slaves in labour, or other business, except it be in the ordinary household offices of daily necessity, or other work of necessity or charity, he shall forfeit the sum of ten shillings for every such offence, deeming every apprentice, servant, or slave so employed, and every day he shall be so employed as constituting a distinct offence.† † Report, p. 59. Text of Act as adopted is in Hening, xii, 336–7. Bill was presented by Madison 31 Oct. 1785 and on 14 Dec. postponed to next session; at the Oct. 1786 session it was brought up again, amended by both House and Senate, and passed on 27 Nov. (JHD, Oct. 1785, 1828 edn., p. 12–15, 92; same, Oct. 1786, p. 16–17, 49, 52, 64, 127). The Act as adopted and the Bill as proposed agree except as noted below; Act was suspended until 1 July 1787 (Hening, xii, 410–11).</p></blockquote>

_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59f824cb51" data-kw="">
<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maxwell.html">John Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacro-Sancta Regum Majestas, or the Sacred &amp; Royal Prerogative of Christian Kings</cite>, (1644; London: Dring, 1680) 304 pp. ToC, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-15b6f3d606" data-kw="">
<blockquote><p>Forasmuch as it has pleased the Almighty God by the wise disposition of his divine providence so to Order and dispose of things that we… are now cohabiting and dwelling in and upon the River of Conectecotte… And well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God… do therefore… enter into Combination and Confederation together, to maintain and preserve the liberty and purity of the gospel of our Lord Jesus which we now profess, as also the discipline of the Churches, which according to the truth of the said gospel is now practiced amongst us… 1. It is Ordered, sentenced and decreed that there shall be yearly two general Assemblies or Courts… wherein shall be yearly chosen form time to time so many magistrates and other public officers… Whereof one to be chosen Governor… which… shall have power to administer justice according to the Laws here established, and for want thereof according to the rule of the word of God… … The Oath of the Governor, for the [Present] I N. W…. do swear by the great and dreadful name of the everliving God, to promote the public good and peace of the same… and will further the execution of Justice according to the rule of God’s word; so help me God, in the name of the Lord Jesus Christ.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7ebc79b998" data-kw="">
<blockquote><p>God does not ravish our wills, but by setting up a sacred light in our understandings, and a sacred power in our wills, He makes our will fit to determine themselves; we do not determine God’s will, nor does God immediately determine our wills, but by infusing a life and soul, as it were, of grace, without precedent preparations often and where there be preparations, yet the first preparation must needs be without a former, we cannot take in anything without a light of grace; but the light of grace, as of glory, must needs be received immediately into the soul. By an habit of grace, deserved for us by Christ, God makes our wills determine themselves to follow Him; and this the Scripture calls, not a forcing, but a drawing of us, not as we draw a man to the gibbet, but as we draw a man to a wedding who has the wedding garment, or as we draw a sheep after us with a bush of ivy, as we draw children after us with nuts and apples, by way of persuasion, indeed, which is so forcible, that Scripture calls it a kind of constraining… The act of knowing works so in clear evidence of the object, that the understanding cannot choose but assent: The act of believing waits upon the will. All this must be received with a grain of salt thus; There is an act of the will to receive grace, which is antecedent to the first infusion of faith, but so as that it is concomitant with it: Antecedent in the first moment of nature, concomitant in the first moment of time, as the wind by blowing opens the window, and the window by opening lets in the wind. This wind which ‘blows as it lists’ (Jn. 3:8), is the voice of the Spirit within (a voice behind us, Isa. 30:20), which knows and tells a man what is in a man…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tentations: their Nature, Danger, Cure, the Fourth Part, pp. 38-39 bound in Tentations… sixth edition, the Fourth Part left enlarged (London: Ratcliffe, 1659)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2f2ddb52d" data-kw="">
<blockquote><p>That we may attain unto a more clear understanding of the nature of this regeneration, so necessary to salvation: we must carefully observe with regard to the word, that both the Scriptures and also divines use it sometimes in a larger sense, to denote the whole operation of the Holy Ghost upon the souls of those who are to be saved, whereby they are brought into a state of grace, so that, besides the external call, it comprehends conversion, and even initial santification: in which sense practical divines lay down the marks, motives and means of regeneration. Sometimes the word regeneration is used in a more limited sense, as distinguished from the external call, from conversion and from sanctification: so that the external call signifies only the offer of redemption for our reception: Regeneration conveys that power into the soul, by which the person who is to be saved is enabled to receive the offer. Conversion puts forth the power received into actual exercise, so that the soul does actually receive the offered benefits. Sanctification brings forth the fruits of conversion, or of faith and repentance, in a carefulness to maintain good works, yet not so immediately but that a union with Christ and justification come between conversion and sanctification, at least in the order of nature, if not of time. It is in this stricted sense of the word we shall consider the doctrine of regeneration at present…</p></blockquote>

<blockquote><p>(3) [‘Regeneration’ as taken] Most Strictly: For the Grace proper only to those who attain salvation in the work itself, and therefore for the donation of habitual faith, by which we apprehend the blood of Christ, our hearts are purified from dead works to serve the Living God. Heb. 9:14, i.e., by which our intellect, so evil from our youth, Gen. 8, is illuminated to know Christ, John 17:3, ‘And this is eternal Life.’ etc. Our will, so perverse, is so corrected that it rests in Christ alone. Ps. 73:25. Phil. 3 from v. 7 to v. 12 inclusive: ‘What things were gain to me, those I counted loss for Christ.’ Also v. 12, ‘Apprehended by Christ, that I may apprehend.’ In one Word: By which a man who before was plainly dead, is perfectly brought from spiritual death into spiritual life, Eph. 2:1, ‘And you He made alive, who were dead in trespasses and sins.’ Also vv. 5 &amp; 6. To this regeneration we [Grebenitz et al.] attribute, with the excellent Mr. President [Samuel Strimesius], operating grace. It is otherwise called conversion.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a1e2a858d1" data-kw="">
<blockquote><p>…in taking up the language of ‘the space of six days,’ the Westminster Assembly declared that it stood with previous theologians in affirming a literal six-day creation. The expression of has its roots in at least four previous theologians whom the Westminster divines knew. As we have seen, the words ‘in the space of six days’ appear in the writings of Bonaventure, Calvin, Zanchi, and Ussher.² ² Bonaventure, Commentaries on the Four Books of Sentences, book 2, distinction 12, art. 1, question 2; Calvin, Commentaries on Genesis, 1:78; Zanchius, Confession of Christian Religion, 21 [5.1]; De Operibus Dei intra Spacium Sex Dierum Creatis; Ussher, Works, 11:183.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-beeke.html">Joel Beeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What did the Reformers Believe about the Age of the Earth?</cite>, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0a0784f1ca" data-kw="">
<blockquote><p>Third, it is shown by the relation of effects to their cause. For effects proceed from the agent that causes them, in so far as they pre-exist in the agent; since every agent produces its like. Now effects pre-exist in their cause after the mode of the cause. Wherefore since the Divine Being is His own intellect, effects pre-exist in Him after the mode of intellect, and therefore proceed from Him after the same mode. Consequently, they proceed from Him after the mode of will, for His inclination to put in act what His intellect has conceived appertains to the will. Therefore the will of God is the cause of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 19 | art. 4, I answer that</span></figcaption>

</figure><figure class="quote" id="q-02bf9e3817" data-kw="first day heaven earth light">
<blockquote><p>The works of the first day are reckoned as three (the heaven, the earth and light) according to the Mosaic account. God demonstrates his power in the production of all things ex nihilo by his word alone; his wisdom in their variety, order and use; his goodness in making all things very good. Thus he exercised an ordering and command which powerfully gave existence to things, and ordination which wisely directed all things and assigned to each its own use.</p></blockquote>

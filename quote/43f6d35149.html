<blockquote><p>13. Our indulgence ought to extend much farther in tolerating imperfection of conduct. Here there is great danger of falling, and Satan employs all his machinations to ensnare us. For there always have been persons who, imbued with a false persuasion of absolute holiness, as if they had already become a kind of aerial spirits, spurn the society of all in whom they see that something human still remains. Such of old were the Cathari and the Donatists, who were similarly infatuated Such in the present day are some of the Anabaptists, who would be thought to have made superior progress. Others, again, sin this respect, not so much from that insane pride as from inconsiderate zeal. Seeing that among those to whom the gospel is preached, the fruit produced is not in accordance with the doctrine, they forthwith conclude that there no church exists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.1.13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e895dc2d9f" data-kw="">
<blockquote><p>Anno, 1522. Did arise in Saxony Nicholas Stork, who boasted of dreams and visions and rejected the Scripture as being a carnal and literal rule. Antinomians call it carnal, literal, and legal. From him and others arose Thomas Muntzer, about anno 1524, who styled himself “Thomas Muntzer, the servant of God, with the sword of Gideon against the ungodly.” This man, being hungry for glory, hunted for Luther’s name to his new designs but not obtaining it, said but [unclear] Antichrist: that Luther’s carnal and literal gospel was worse than the pope and therefore cried down books and the letter of Scripture and said the Spirit was the leader and rule to believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, …The Mind of Luther a Most Professed Opposer of Antinomians is cleared and Diverse Considerable Opinions Of the Law and the Gospel, of the Spirit and the Letter, of t</span></figcaption>

</figure><figure class="quote" id="q-a0c4324357" data-kw="">
<blockquote><p>Hence I believe that there is one Church of those who have the same Spirit, through whom they are made certain that they are the true children of the family of God; and this is the first fruits of the Church. I believe that this Church does not err in regard to truth, namely in those fundamental matters of faith upon which everything depends. I believe also that the universal, visible Church is one, while it maintains that true confession, of which we have already spoken. I believe also that all belong to this Church who give their adherence to it according to the rule and promise of God’s Word. I believe that to this Church belong Isaac, Jacob, Judah and all who were of the seed of Abraham, and also those infants whose parents in the first beginnings of the Christian Church, through the preaching of the apostles, were won to the cause of Christ. For if Isaac and the rest of the ancients had not belonged to the Church, they would not have received the Church’s token, circumcision. Since these, then, were members of the Church, infants and children belonged to the primitive Church. Therefore I believe and know that they were sealed by the sacrament of baptism. For children also make a confession, when they are offered by their parents to the Church, especially since the promise offers them to God, which is made to our infants no less, but even far more amply and abundantly, than formerly to the children of the Hebrews. These are the grounds for baptizing and commending infants to the Church, against which all the weapons and war engines of the Anabaptists avail nothing. For not only are they to be baptized who believe, but they who confess, and they who, according to the promise of God’s Word, belong to the Church. For otherwise even the apostles would not have baptized anyone, since no apostle had absolute evidence regarding the faith of one confessing and calling himself a Christian. For Simon the impostor, Ananias, Judas, and no one knows who, were baptized when they declared their adherence to Christ, even though they did not have faith. On the other hand, Isaac was circumcised as an infant without declaring his adherence or believing, but the promise acted in his behalf. But since our infants are in the same position as those of the Hebrews, the promise also declares their adherence to our Church and makes confession. Hence, in reality baptism, like circumcision (I am speaking of the sacrament of baptism) pre-supposes nothing but one of two things, either confession, i.e., a declaration of allegiance or a covenant, i.e., a promise. All of which will become somewhat clearer from what follows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fidei Ratio</cite>, (1530) in James T. Dennison Jr. ed., Reformed Confessions of the 16th and 17th Centuries in English Translation: 1523–1693, vol. 1 (Grand Rapids: Reformation Heritage Books, 2008–14), 122–23.</span></figcaption>

</figure><figure class="quote" id="q-02b0eac0a6" data-kw="">
<blockquote><p>Today, also, those crackpots, the Anabaptists, who cause so much trouble in the world, who denounce governments, magistrates, the unity of the church, never tire of repeating this phrase, “Blessed are those who suffer persecution.” Yes, but do they suffer on account of righteousness? The answer is no: the opposite is true. We should have the word “‘righteousness’ firmly written in our hearts, and ensure that, whenever we are persecuted, our conscience testifies before God that our cause is just. For that is the mark chosen by Christ to distinguish his disciples from those who are brigands, thieves, murderers, blasphemers, and adulterers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Beatitudes</cite>, (Carlisle, PA: Banner of Truth Trust, 2006), 60–61.</span></figcaption>

<blockquote><p>That infant baptism is the practice of all branches of the Christian church, with one solitary exception, is a well-known fact. That it has been the practice of the church of God for eighteen centuries is also beyond dispute. When one sect, therefore, ventures to differ in opinion from all other Christian churches, it should have very strong reasons to support it. But I was considering the objections which the Anabaptists advance against the administration of the ornaments, and then let all men judge whether they are sound and conclusive. 1. The first of these objections is founded on the baptism of Christ (Matt. 3:13–17). The fact that Christ was not baptized in childhood, but only when he entered on his ministry, some thirty years afterwards, is considered by many of the more ignorant class a strong proof against infant baptism. This will be short. At the time of Christ’s birth, the ordinance of baptism did not exist in the church of God. Circumcision was then the initiatory right, and Christ was circumcised (Luke 2:21). Thirty years afterwards, John was sent to baptize, and so soon as the opportunity presented itself, Christ submitted to the rite. But although His own disciples baptized during the Savior’s lifetime (John 4:1–2), yet it was not until the Lord had risen from the dead that Christian baptism was instituted (Matt. 28:19). The mere fact, therefore, that the Lord Jesus did not receive, infancy, an ordinance that did not exist until after his death and resurrection, is no argument against infant baptism. One might as well argue against the circumcision of infants, on the ground that Abraham was not circumcised until he was 100 years of age. 2. Again, it is said that an infant cannot understand baptism, and eloquent pictures are sometimes drawn of the wrong inflicted on the poor unconscious babe which receives an ordinance of which it knows nothing, and is made party to a solemn transaction without any consent of its own. It is admitted, readily, that a child at baptism does not understand the nature of the ordinance of which it is the subject, but that is no reason why it should not drive benefit thereby. He does not know the texture of the clothes that cover it, and yet these clothes keep it warm. It does not understand the nature of its mother’s milk, and yet that milk sustains its life. The children that were brought to Jesus that he might touch them (Mark 10:13–16) did not understand the ceremony that was gone through on that occasion, and yet we cannot but believe that Christ did them good. An Anabaptist might have rebuked those mothers, and said to them, “take your children home, what is the good of it? What can they know about Christ blessing?” But Jesus would have shown him, what he did show the ignorant disciples, that with such conduct “he was indignant.” A divine purpose may be served, and good, by the administration of baptism to a child, while, at the same time, the child does not understand the ordinance. If our Anabaptist friends had seen a Jew, with a knife in hand, ready to perform on an infant of eight days old the right of circumcision, they would have attempted to dissuade him from his bloody work in some such way as this: “How can this poor babe know anything of a covenant made so many years ago? Why administer to it an ordinance that it does not understand? Why make it a party to such a solemn transaction without any consent of its own?” The Jew could scarcely hide his contempt for one so ignorant of the law and the prophets, as he would reply: “Beautiful reasoning, indeed, Gentile unbeliever! But with me it does not weigh one feather against the appointment of God.” Now we say the same. The baptized infant may be ignorant of the ordinance, but that does not, with us, weigh one feather against the appointment of God. Alexander Carson, an Anabaptist writer, says, “I would baptize Satan himself, without the smallest scruple, had I a divine warrant.” Possessing, as we do, a divine warrant for baptizing the children of believers, we hesitate still less to administer the ordinance to an unconscious babe.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That infant baptism is the practice of all branches of the Christian church, with one solitary exception, is a well-known fact. That it has been the practice of the church of God for eighteen centuries is also beyond dispute. When one sect, therefore, ventures to differ in opinion from all other Christian churches, it should have very strong reasons to support it. But I was considering the objections which the Anabaptists advance against the administration of the ornaments, and then let all men judge whether they are sound and conclusive. 1. The first of these objections is founded on the baptism of Christ (Matt. 3:13–17). The fact that Christ was not baptized in childhood, but only when he entered on his ministry, some thirty years afterwards, is considered by many of the more ignorant class a strong proof against infant baptism. This will be short. At the time of Christ’s birth, the ordinance of baptism did not exist in the church of God. Circumcision was then the initiatory right, and Christ was circumcised (Luke 2:21). Thirty years afterwards, John was sent to baptize, and so soon as the opportunity presented itself, Christ submitted to the rite. But although His own disciples baptized during the Savior’s lifetime (John 4:1–2), yet it was not until the Lord had risen from the dead that Christian baptism was instituted (Matt. 28:19). The mere fact, therefore, that the Lord Jesus did not receive, infancy, an ordinance that did not exist until after his death and resurrection, is no argument against infant baptism. One might as well argue against the circumcision of infants, on the ground that Abraham was not circumcised until he was 100 years of age. 2. Again, it is said that an infant cannot understand baptism, and eloquent pictures are sometimes drawn of the wrong inflicted on the poor unconscious babe which receives an ordinance of which it knows nothing, and is made party to a solemn transaction without any consent of its own. It is admitted, readily, that a child at baptism does not understand the nature of the ordinance of which it is the subject, but that is no reason why it should not drive benefit thereby. He does not know the texture of the clothes that cover it, and yet these clothes keep it warm. It does not understand the nature of its mother’s milk, and yet that milk sustains its life. The children that were brought to Jesus that he might touch them (Mark 10:13–16) did not understand the ceremony that was gone through on that occasion, and yet we cannot but believe that Christ did them good. An Anabaptist might have rebuked those mothers, and said to them, “take your children home, what is the good of it? What can they know about Christ blessing?” But Jesus would have shown him, what he did show the ignorant disciples, that with such conduct “he was indignant.” A divine purpose may be served, and good, by the administration of baptism to a child, while, at the same time, the child does not understand the ordinance. If our Anabaptist friends had seen a Jew, with a knife in hand, ready to perform on an infant of eight days old the right of circumcision, they would have attempted to dissuade him from his bloody work in some such way as this: “How can this poor babe know anything of a covenant made so many years ago? Why administer to it an ordinance that it does not understand? Why make it a party to such a solemn transaction without any consent of its own?” The Jew could scarcely hide his contempt for one so ignorant of the law and the prophets, as he would reply: “Beautiful reasoning, indeed, Gentile unbeliever! But with me it does not weigh one feather against the appointment of God.” Now we say the same. The baptized infant may be ignorant of the ordinance, but that does not, with us, weigh one feather against the appointment of God. Alexander Carson, an Anabaptist writer, says, “I would baptize Satan himself, without the smallest scruple, had I a divine warrant.” Possessing, as we do, a divine warrant for baptizing the children of believers, we hesitate still less to administer the ordinance to an unconscious babe.”

— Thomas Witherow, I Will Build My Church: Selected Writings on Church Polity, Baptism, and the Sabbath, ed. Jonathan Gibson. Philadelphia: Westminster Seminary Press, 2021), 179–81.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+infant+baptism+is+the+practice+of+all+branches+of+the+Christian+church%2C+with+one+solitary+exception%2C+is+a+well-known+fact.+That+it+has+been+the+practice+of+the+church+of+God+for+eighteen+centuries+is+also+beyond+dispute.+When+one+sect%2C+therefore%2C+ventures+to+differ+in+opinion+from+all+other+Christian+churches%2C+it+should+have+very+strong+reasons+to+support+it.+But+I+was+considering+the+objections+which+the+Anabaptists+advance+against+the+administration+of+the+ornaments%2C+and+then+let+all+men+judge+whether+they+are+sound+and+conclusive.+1.+The+first+of+these+objections+is+founded+on+the+baptism+of+Christ+%28Matt.+3%3A13%E2%80%9317%29.+The+fact+that+Christ+was+not+baptized+in+childhood%2C+but+only+when+he+entered+on+his+ministry%2C+some+thirty+years+afterwards%2C+is+considered+by+many+of+the+more+ignorant+class+a+strong+proof+against+infant+baptism.+This+will+be+short.+At+the+time+of+Christ%E2%80%99s+birth%2C+the+ordinance+of+baptism+did+not+exist+in+the+church+of+God.+Circumcision+was+then+the+initiatory+right%2C+and+Christ+was+circumcised+%28Luke+2%3A21%29.+Thirty+years+afterwards%2C+John+was+sent+to+baptize%2C+and+so+soon+as+the+opportunity+presented+itself%2C+Christ+submitted+to+the+rite.+But+although+His+own+disciples+baptized+during+the+Savior%E2%80%99s+lifetime+%28John+4%3A1%E2%80%932%29%2C+yet+it+was+not+until+the+Lord+had+risen+from+the+dead+that+Christian+baptism+was+instituted+%28Matt.+28%3A19%29.+The+mere+fact%2C+therefore%2C+that+the+Lord+Jesus+did+not+receive%2C+infancy%2C+an+ordinance+that+did+not+exist+until+after+his+death+and+resurrection%2C+is+no+argument+against+infant+baptism.+One+might+as+well+argue+against+the+circumcision+of+infants%2C+on+the+ground+that+Abraham+was+not+circ ophets%2C+as+he+would+reply%3A+%E2%80%9CBeautiful+reasoning%2C+indeed%2C+Gentile+unbeliever%21+But+with+me+it+does+not+weigh+one+feather+against+the+appointment+of+God.%E2%80%9D+Now+we+say+the+same.+The+baptized+infant+may+be+ignorant+of+the+ordinance%2C+but+that+does+not%2C+with+us%2C+weigh+one+feather+against+the+appointment+of+God.+Alexander+Carson%2C+an+Anabaptist+writer%2C+says%2C+%E2%80%9CI+would+baptize+Satan+himself%2C+without+the+smallest+scruple%2C+had+I+a+divine+warrant.%E2%80%9D+Possessing%2C+as+we+do%2C+a+divine+warrant+for+baptizing+the+children+of+believers%2C+we+hesitate+still+less+to+administer+the+ordinance+to+an+unconscious+babe.%E2%80%9D%0A%0A%E2%80%94+Thomas+Witherow%2C+I+Will+Build+My+Church%3A+Selected+Writings+on+Church+Polity%2C+Baptism%2C+and+the+Sabbath%2C+ed.+Jonathan+Gibson.+Philadelphia%3A+Westminster+Seminary+Press%2C+2021%29%2C+179%E2%80%9381.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc308458db3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c308458db3.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/06/witherows-responses-to-anabaptist-objections/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

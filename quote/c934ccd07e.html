<main class="wrap"><figure class="quote" id="q-c934ccd07e" data-kw="">
<blockquote><p>To us, as in most things, so also in this, the middle way seems to be the safest; so that in examining the mysteries of faith, the aid of reason ought to be called in, yet not wholly and altogether relied upon: but to keep that just medium, this is a difficult and arduous work …

Those are called the mysteries of faith which no man was ever able to find out by his own reasoning powers, but are known by the revelation of God alone, and are opposed to that which may be known of God by the light of nature. Rom. i. 19. 1 Cor. ii. 7. Eph. iii. 3. …

That revelation is contained in the sacred books of the Old and New Testament, which evince their authenticity to the conscience of a serious enquirer, duly attending to the external and internal marks of their divinity; and, if any thing be there plainly taught, it is certainly a great crime to treat them with reproach, under any pretence whatever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on the Use and Abuse of Reason, in Matters of Religion</cite>, trans. John Carter (Norwich: Crouse, Stevenson and Matchett, 1795), pp 3, 5-6.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c950bed6a" data-kw="">
<blockquote><p>We can distinguish between adequate and inadequate distinction. The first is if the things said to be distinct are as it were equal or equivalent, as is the case with all the distinctions above adduced. A distinction is inadequate if the distinct things are not equal, so that one includes the other but not conversely. Such inadequate distinctions flourish, for example, between the whole and its part, or between a subject and its mode, for a mode includes the subject it modifies and the whole includes its parts. These sort of inadequate distinctions, as is plain, can be real (for example between the human body and an arm), or formal (for example between soul and intellect, between animality and sense feeling, between formality and its mode, as between divine wisdom and the same thing’s infinity), or logical (for instance between the rays of the sun and their power of heating). Also here can be added real negative distinctions, which flourish not between thing and thing but between a thing and a negation of it (for example between man and blindness).</p></blockquote>

</figure><figure class="quote" id="q-ccb43f1a89" data-kw="">
<blockquote><p>…as the soul of man is said to be in the head or heart, so conceive of God’s being in Heaven. The soul (we know) animates the whole body of man, and by the presence of it in every member communicates life to the whole: yet by way of preeminency and excellency it is said to be in the head or heart of man, because in these two parts of man, and from thence she exercises her cheifest functions, and derives her cheifest influence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nehemiah-rogers.html">Nehemiah Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fast Friend</cite>, … (London, 1658)</span></figcaption>

<blockquote><p>§1. We have laid out the concept of the natural knowledge of God based on the mainstream orthodox view. What is left is to demonstrate the wider agreement on this by quoting different authors… These authors do not just generally affirm this natural knowledge of God, but also distinctly break it down into parts or species which they explain: the innate or implanted or subjective type; and the acquired or added or objective or discursive or demonstrative type, derived a posteriori from observing effects.</p></blockquote>

</figure><figure class="quote" id="q-a2a7ab57d0" data-kw="">
<blockquote><p>IV. But when God is set forth as the object of theology, he is not to be regarded simply as God in himself (for thus he is incomprehensible to us), but as revealed and as he has been pleased to manifest himself to us in his word, so that divine revelation is the formal relation which comes to be considered in this object.

Nor is he to be considered exclusively under the relation of deity (according to the opinion of Thomas Aquinas and many Scholastics after him, for in this manner the knowledge of him could not be saving but deadly to sinners), but as he is our God (i.e., covenanted in Christ as he has revealed himself to us in his word not only as the object of knowledge, but also of worship). True religion (which theology teaches) consists of these two things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian and Reformed, 1992), 1.5.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/nature-of-theology.html">Nature of Theology</a></span></div>

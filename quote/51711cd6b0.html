<main class="wrap"><figure class="quote" id="q-51711cd6b0" data-kw="">
<blockquote><p>You alone in pre-eminent distinction from all others, have entered upon the thing itself; that is, the grand turning point of the cause; and, have not wearied me with those irrelevant points about popery, purgatory, indulgences, and other like baubles, rather than causes, with which all have hitherto tried to hunt me down,—though in vain! You, and you alone saw, what was the grand hinge upon which the whole turned, and therefore you attacked the vital part at once; for which, from my heart, I thank you.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>The Bondage of the Will</cite>, Sect. 168, p. 165</figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/bondage-of-the-will.html">Bondage of the Will</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dda3160a8c" data-kw="Hardening Free Will Justice">
<blockquote><p>For in those people God did not make the common sins but found them there, as we have noted before. And although God, in his just but to us hidden judgment, does abandon and harden them more and more (Romans 9:18), yet it is they who by their own free choice first become hardened (Romans 11:7) and abandon the benefits of general providence; they abuse God’s longsuffering, as Paul testifies in Romans 1:18, 26, and 28.</p></blockquote>
<figcaption>— <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a>, <cite>Synopsis of a Purer Theology</cite>, Disp. 24, On Divine Predestination</figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/judicial-hardening.html">Judicial hardening</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/hardening.html">Hardening</a></span></div>

</figure><figure class="quote" id="q-8a099d7ada" data-kw="Sovereignty Free Will">
<blockquote><p>God brings about every man&#x27;s lot, and all the parts of it. He sits at the helm of human affairs, and turns them about in whatever way he lists. &quot;Whatever the Lord pleased, that He did in heaven and in earth, in the seas and all deep places.&quot; There is not anything whatever befalls us without his overruling hand. The same providence that brought us out of the womb, brings us to, and fixes us in the condition and place allotted for us, by him who &quot;has determined the times and the bounds of our habitation.&quot; It overrules the smallest and most casual things about us, such as &quot;hairs of our head being all numbered;&quot; a &quot;lot cast into the lap.&quot; Yea, the free acts of our will, by which we choose for ourselves: for even &quot;the king&#x27;s heart is in the hand of the Lord, as rivers of water.&quot;</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>The Crook in the Lot</cite>, Doct. I, head II (the crook is of God&#x27;s making)</figcaption>

</figure><figure class="quote" id="q-cca077ef66" data-kw="Hardening Depravity">
<blockquote><p>Suitably upon the will and affections he hath several acts, -- obfirming the one in corruption, and giving up the other to vileness, Rom. 1:24, 26, until the heart become thoroughly hardened, and the conscience seared; not forcing the one, but leaving it to follow the judgment of practical reason, -- which being a blind, yea, a blinded guide, whither can it lead a blind follower, but into the ditch? -- not defiling the other with infused sensuality, but provoking them to act according to inbred, native corruption, and by suffering frequent vile actings to confirm them in ways of vileness.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Righteous Zeal Encouraged by Divine Protection</cite>, sermon on Jer. 15:19–20</figcaption>
<div class="meta"><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/judicial-hardening.html">Judicial hardening</a></span></div>

</figure><figure class="quote" id="q-dbd64be838" data-kw="Permission Author of sin Free Will">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.6.8</figcaption>

<main class="wrap"><figure class="quote" id="q-dbe57e278f" data-kw="">
<blockquote><p>Now if Christ has committed the power of excommunication unto the Church, what have bishops to say for themselves, who appropriate the power [wholly] unto themselves, each one in his own diocese? (Calvin &amp; Cartwright on Mt. 18; Paraeus on 1 Cor. 5) For we cannot give the name of the Church unto a bishop: because he is but one man, and the Church is a company of many men. Nay, nor yet can we give the name of the Church unto a company of bishops; for if they might be called the Church, it should be for this respect alone, because they represent the Church. But soli Episcopi, etc. ‘Bishops alone’ says [Johann] Gerard [a Lutheran]: ‘or they who teach, cannot represent the Church, since hearers also pertain to the definition thereof, but the presbytery can represent the Church, whereunto not only they pertain who labor in the Word, but also elders or governors, put in authority, for expeding of ecclesiastical matters in [the] name of the whole Church.’ We grant then (Trelcatius, Instittutes of Theology, bk. 1, p. 291), that by the ‘Church’ [in Mt. 18], Christ means that company of Church governors whereby a certain particular Church is represented, but for as much as the Church consists of two integrant parts, viz. pastors and sheep, teachers and hearers, we therefore deny that the representative Church whereof Christ speaks can be any other than that ecclesiastical consistory whereof we have spoken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 8, Digression 4, p. 186</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2bc022c4e9" data-kw="">
<blockquote><p>Restoration England [post-1660] witnessed a prolonged period of ecclesiastical persecution to stamp out religious nonconformists, but women responded to this suppression by stepping into more prominent and public roles… many nonconformist women earned the title of ‘nursing mothers’ through their public efforts to nurture and promote Protestant dissent in the face of fierce resistance… Scholars have often depicted Margaret [Baxter] as a paragon of Puritan virtue who fulfilled the traditional role of a wife. However, such depictions underemphasize the controversial nature of Margaret’s agency in her own time. Like the ‘nursing mothers,’ her activities broke with established norms for women. Her efforts to aid her husband in composing religious literature, patronize the illegal ministry of non-conformist pastors, establish schools for religious education, and set up charities, all drew significant criticism, since they lay outside the ‘appropriate’ private sphere of a woman. And yet Richard Baxter used his memorialization of her life (A breviate of the life of Margaret) to not only praise her public labors but also defend her against critics of her public role. By appealing to biblical examples of women who helped Paul in his ministry, he rebuked those who maligned her for not being content to stay at home. Thus, Margaret’s life does not simply shed additional light on how many women of the period achieved a greater space for female agency; rather, her memorialization in print provided English readers with a new, biblically defended image of how godly female piety could be fleshed out in the public realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Margaret Baxter, Richard Baxter &amp; the Defense of Women’s Public Role in Restoration England’</cite>, (2020) 25 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-0a52960761" data-kw="">
<blockquote><p>The second defect which he [an opponent] wishes supplied is that the temporary ruling elders may be made perpetual and for life… This I assent unto providing he admit a distinction betwixt the office itself, and the exercise of the same. The office of a ruling elder ought to be for his life no less than the pastors; yet must we not condemn those Churches which dispense with the intermission of their actual attendance for a certain space, and permit them to exercise their office by course, as the Levites did of old, whose example himself here takes for a pattern.</p></blockquote>

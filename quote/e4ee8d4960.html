<blockquote><p>10th Assertion. Hence I am not afraid to assert a reciprocation of subordinations between the Church and the Magistrate, and a sort of collaterality and independent supremacy in their own kind common to both, for every soul, pastors and others, are subject to the Magistrate as the higher power, in all civil things, Rom. 13:1-4; Tit. 3:1; 1 Pet. 2:13-14; Mt. 22:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, p. 560</span></figcaption>

<blockquote><p>91. For the national synod ought to declare, and that with [the] greatest reverence, to the Magistrate the grounds of their sentence, and the reasons of their proceedings when he demands or enquires into the same, and desires to be satisfied: but if the Magistrate nevertheless do dissent, or cannot by contrary reasons (which may be brought, if he please) move the synod to alter their judgement, yet may he require and procure that the matter be again debated and canvassed in another national synod…</p></blockquote>

</figure><figure class="quote" id="q-86f1b7b339" data-kw="">
<blockquote><p>Yea and the Christian king rules over men as men, and also as Christian-men; he rules over them as men, with a dominion over their bodies, lives and goods by his civil laws, he has also dominion as king over men, as Christians and members of Christ’s kingdom and Church, not over their consciences (for that is proper only to the Father of spirits), but he has a coactive [coercive] power over all men, even pastors, as to cause them do their Christian duties, he has power to compel Church-men in assemblies to determine truth, and to use the keys right, and to preach and use the sacraments according as Christ has commanded in his Word, and to punish them when they do otherwise. … I answer, the infallible rule of judging for both [Church and State] is the Word of God, which speaks home impartially to both, if they will hear, but certainly the king’s civil, kingly coactive power to compel men to do their duty remains the highest and most supreme power on earth, in genere potestatis politicae, in ‘the kind of politic-power’, and pastors and all men may by this power be compelled to do right; as for the abuse of the power, it is no part of the power; and in this kind the king has a negative-politic and kingly suffrage [vote] and voice in all Church assemblies, no ecclesiastical constitution has the force of a [civil] law without the politic suffrage of the civil judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea (1642), ch. 19, ‘…as about… the King’s Power in Things Ecclesiastical’</cite>, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-b422c05a73" data-kw="">
<blockquote><p>5. An appellation is one thing, and the complaint of an oppressed man is another thing; or a provocation to a competent judge is one thing, and the refugium, the refuge and fleeing of an oppressed man to a higher power is another thing; if the Church err and fail against the Law of Christ in the matter, and decree the man to be a heretic, who is none, and that to be heresy which is truth, the oppressed man in a constituted Church may have his refuge to the godly Magistrate and complain, but he cannot appeal, for an appellation is from an erring judge to an higher judge, in eadem serie, in the same nature and kind of judicatures… but a complaint may be made to the Magistrate; if the Church fail in their judging, the Magistrate is to command the Church to judge it over again, but the Magistrate cannot judge it himself; as there is a complaint made to the Magistrate that the printer has not drawn the image exactly, according to the samplar: the Magistrate judges not of the art of the painter, nor can the Magistrate as the Magistrate draw the image himself; But the Magistrate may judge of the painter’s breach of promise who did the action to draw it exactly according to the samplar, and has not kept faith to the man who pays him wages; and therefore the Magistrate may either punish his moral error, his breach of promise, not his error of art (the faculty or company of painters must judge of that) or then command the painter to paint the same image again, according as the painter convenanted. But it may be objected, ‘You then make the Magistrate to meddle no more with matters of faith and preaching truth or falsehood, and giving out Ecclesiastical rules in Church government, as Acts 15, then he meddles with painting according to the principles of art; now painting according to art belongs not at all to the conscience of the Magistrate, but sound preaching, right ruling in God’s house, belongs in a far nearer relation to the conscience of the godly Magistrate.’ I Answer: As touching the formal judging Ecclesiastically… it no more belongs to him as a Magistrate… But in another consideration, as [the] sound or unsound dispensing of Word and Sacraments, as right or unjust ruling in the house of God, may more or less hurt or benefit the souls of men, which he is to care for indirectly, in ordine ad penas vel premia civilia et corporalia [in the order of civil and corporal penalties or rewards], it belongs more to the Magistrate to take care of the Church, of religion, of preaching and governing God’s House, than any painting or arts in the earth. Again, the Church proceeding in these things that are against common justice in all judicatures, no less then in the Church, as to condemn the party never heard, or not convinced [convicted] either by confession, or under two sufficient witnesses, or to do manifest injustice in the manner of proceeding, leaves a clear place to the wronged party, by the Law of Nature, if not to appeal, yet to flee and have re-course to the Christian Magistrate, who is Parens Patrie, the father of the Commonwealth. … 7. …Or, 2. the godly Magistrate would command that the Church would impartially proceed to right an oppressed man, as Cabeljavius says [Pieter Cabeljauw, c.1608-1668, who was reformed] (De Lib. Eccles., ch. 9, pp. 134-35) . Or, 3. when there is no synods to be had, then as [Jacob] Triglandius says well from Beza, the Christian Magistrate may provide fit means of relieving the oppressed. (Trigland, De Civili &amp; Ecclesiastic. Potest., ch. 20, pp. 420-21)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 580-82</span></figcaption>

+principles+of+art%3B+now+painting+according+to+art+belongs+not+at+all+to+the+conscience+of+the+Magistrate%2C+but+sound+preaching%2C+right+ruling+in+God%E2%80%99s+house%2C+belongs+in+a+far+nearer+relation+to+the+conscience+of+the+godly+Magistrate.%E2%80%99+I+Answer%3A+As+touching+the+formal+judging+Ecclesiastically%E2%80%A6+it+no+more+belongs+to+him+as+a+Magistrate%E2%80%A6+But+in+another+consideration%2C+as+%5Bthe%5D+sound+or+unsound+dispensing+of+Word+and+Sacraments%2C+as+right+or+unjust+ruling+in+the+house+of+God%2C+may+more+or+less+hurt+or+benefit+the+souls+of+men%2C+which+he+is+to+care+for+indirectly%2C+in+ordine+ad+penas+vel+premia+civilia+et+corporalia+%5Bin+the+order+of+civil+and+corporal+penalties+or+rewards%5D%2C+it+belongs+more+to+the+Magistrate+to+take+care+of+the+Church%2C+of+religion%2C+of+preaching+and+governing+God%E2%80%99s+House%2C+than+any+painting+or+arts+in+the+earth.+Again%2C+the+Church+proceeding+in+these+things+that+are+against+common+justice+in+all+judicatures%2C+no+less+then+in+the+Church%2C+as+to+condemn+the+party+never+heard%2C+or+not+convinced+%5Bconvicted%5D+either+by+confession%2C+or+under+two+sufficient+witnesses%2C+or+to+do+manifest+injustice+in+the+manner+of+proceeding%2C+leaves+a+clear+place+to+the+wronged+party%2C+by+the+Law+of+Nature%2C+if+not+to+appeal%2C+yet+to+flee+and+have+re-course+to+the+Christian+Magistrate%2C+who+is+Parens+Patrie%2C+the+father+of+the+Commonwealth.+%E2%80%A6+7.+%E2%80%A6Or%2C+2.+the+godly+Magistrate+would+command+that+the+Church+would+impartially+proceed+to+right+an+oppressed+man%2C+as+Cabeljavius+says+%5BPieter+Cabeljauw%2C+c.1608-1668%2C+who+was+reformed%5D+%28De+Lib.+Eccles.%2C+ch.+9%2C+pp.+134-35%29+.+Or%2C+3.+when+there+is+no+synods+to+be+had%2C+then+as+%5BJacob%5D+Triglandius+says+well+from+Beza%2C+the+Christian+Magistrate+may+provide+fit+means+of+relieving+the+oppressed.+%28Trigland%2C+De+Civili+%26+Ecclesiastic.+Potest.%2C+ch.+20%2C+pp.+420-21%29%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Div

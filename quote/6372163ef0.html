<main class="wrap"><figure class="quote" id="q-6372163ef0" data-kw="">
<blockquote><p>VIII. …For on the first day [of Creation]… a shining body lighted up in one hemisphere of the ethereal heavens (which by its circumrotation distinguished the day and night of the first three days, until that light was afterwards, on the fourth day, collected and distributed into the body of the sun and stars).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, vol. 1, 5th Topic, ‘Creation’, 6th Question</cite>, p. 449</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46682f7824" data-kw="">
<blockquote><p>The forme of Creation, to wit, of that which is primary, is both that hidden force of divine power, put into that first matter, according to the being and conditions of the same: as also the external, immediate and instant bringing forth of the matter &amp; the state thereof, without shape and order: But, of that which is secondary, the form internal is that common and hidden nature of the whole frame, which God has imprinted into all things after a common mean and manner: but the external, whereof speech is here, is that powerful bringing forth of all things, out of the first matter in the beginning of time, by the space of six days; as also the most godly disposing of the same, both in themselues and among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity (London, 1610), bk. 2, ch. 3, Of Creation, Confirming Part</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-13e0408f9c" data-kw="">
<blockquote><p>Although the work of redemption was not actually wrought by Christ till after his incarnation, yet the virtue, efficacy, and benefits thereof were communicated unto the elect, in all ages successively from the beginning of the world, in and by those promises, types, and sacrifices, wherein he was revealed, and signified to be the seed of the woman which should bruise the serpent’s head, and the Lamb slain from the beginning of the world, being yesterday and today the same, and forever. (Gen 3:15; Gal 4:4-5; Heb 13:8; Rev 13:8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, ch. 8.6</span></figcaption>

</figure><figure class="quote" id="q-bcb786eb53" data-kw="">
<blockquote><p>Voetius as well as Van Mastricht and Driessen maintained a literal interpretation of the description of Genesis that God created the world in six days. Both Van Mastricht and Driessen criticised the notion of natural laws that are in force prior to creation… Van Mastricht notes that the concepts of matter and form make it possible still to speak of creation after the first day…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<main class="wrap"><figure class="quote" id="q-e8a8561edc" data-kw="">
<blockquote><p>I. God from all eternity did, by the most wise and holy counsel of his own will, freely and unchangeably ordain whatsoever comes to pass:[a] yet… nor is violence offered to the will of the creatures, nor is the liberty or contingency of second causes taken away, but rather established.[c] [a] Eph. 1:11. Rom. 11:33. Heb. 6:17. Rom. 9:15,18. … [c] Acts 2:23. Matt. 17:12. Acts 4:27,28. John 19:11. Prov. 16:33.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Faith</cite>, 3.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5481a13ede" data-kw="fifth commandment parents">
<blockquote><p>Among others in relation to the fifth precept, this question concerning the honoring of parents is agitated between us and the papists. In many ways, the latter weaken this precept, maintaining that children, against the consent of their parents, may not only contract marriage, but even adopt a monastic life. May children withdraw themselves from the power of their parents and marry without their consent? We deny against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.15.1</span></figcaption>

</figure><figure class="quote" id="q-42caf17fa2" data-kw="">
<blockquote><p>But in these games, pastimes, sports and plays at cards and dice, there is a certain distinction to be used. For, some of them are after such a sort played and passed over, that to the winning and obtaining of the victory, honest industry of the mind helps more than any blind casualty or chanceable hazard: insomuch that the awkward luck which falls out contrary to desire is supplied, amended and reformed by art and cunning. These kinds of play may not properly be termed ‘alea’ [chance] or hazardry, neither are they absolutely to be forbidden: only let measurable mean therein be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 6, ‘What the meaning of this word ‘Alea’ [Chance] properly is: and what Games &amp; Plays are contained and comprehended under the name thereof’ in A Discourse of Gaming, and Specially of Dice-Play in True &amp; Christian Friendship… Together also with a right excellent Invective… against the wicked exercise of diceplay, and other profane gaming (London: Veale, 1586) no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

<blockquote><p>for the obligation of all oaths is only observable while the matter thereof is in being: and this rule is undeniable, sublata juramenti materia tollitur obligatio [the matter of the oath being taken away, the obligation is removed]. I conceive therefore, that although when time was, I was bound to monarchical government, both to the substance and to the settled form and circumstances thereof, as they stood in law, yet that now I am no more bound thereunto, because ipso facto these ties are unloosed not by the absolution of any earthly power to pronounce the tie void (which nevertheless has also been done by the supreme power of the nation when they declared the government to be altered), but by the decree of heaven, which has providentially and ipso facto loosened the ties by removing the late king and his heirs from the legal capacity wherein they stood towards me formerly, that is, before this parliament made it treason to make any more addresses to him, and before he was sentenced for treason himself. Now that God has a right by the changes of government to absolve you from your sacred ties I suppose you will not deny, and that He has changed this government is undeniable; for without Him it could not have been done, and He claims to Himself the sole power of changing governments, Dan. 4:17. And that the commonwealth has also a power according to emergencies to dispose of the government within itself for its own safety, I think will not by you be denied; and if by the changes which it has power to make within itself, as emergencies require, the matter of your oath be taken away, it is clear that thereby the obligation is extinct. Above all this, I shall offer unto your consideration something concerning the original of your sacred tie; for the oath which you took to maintain certain forms and circumstances of government (which in their own nature are alterable) was lawful to be taken by you, either because the supreme authority that then was required it of you, and you saw no just cause to refuse that which they required, or because only you of your own accord did choose to take such an oath: I suppose you will not say the last… it will follow then that the tie to those things was sacred; that is, it was lawful for you to be bound by an oath to them only, because the supreme authority which was over you, and had power to establish those forms and circumstances of government, did require such an obligation from you, to engage you to be faithful thereunto, and if this is the only lawful original of such a sacred tie; Then I say, that the dissolution of that tie, may arise from the same power which did establish it: he that has power to oblige me to a form of his creating has also power to absolve me from that obligation. In old times and now also in some places, the soldiers were wont to be obliged by oath to serve their commanders faithfully, till they should be dismissed: the Romans called this sacramentum militare: Now he that might lawfully give them this oath, might also absolve them from it; and so it is in all obligations unto things which in their own nature are not morally good, but good only ex instituto legitimo [out of the legitimate institution]: the power which gives them a being, may take it from them; If therefore the supreme power which now is over you has absolved you from those ties, your voluntary continuance under them cannot make them any longer sacred, no more than your voluntary taking an oath at first to them, without the conduct of the authority which was over you, could have made your obligation lawful. I conceive then, that in things merely civil and human (that is of a changeable nature, as being subject to civil and human ordinances) your oath cannot put a stronger tie upon you towards them than their nature will bear; that is, you cannot be unalterably bound unto them, for if they cease to be, you cannot stand obliged towards them; now that they do cease to be is clear, and that they may cease to be by the power which is over you, and by the acts of divine providence absolving subjects from such oaths.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Objections Against the Taking of the Engagement Answered</cite>, … (London, 1650), pp. 7-9</span></figcaption>

+for+the+oath+which+you+took+to+maintain+certain+forms+and+circumstances+of+government+%28which+in+their+own+nature+are+alterable%29+was+lawful+to+be+taken+by+you%2C+either+because+the+supreme+authority+that+then+was+required+it+of+you%2C+and+you+saw+no+just+cause+to+refuse+that+which+they+required%2C+or+because+only+you+of+your+own+accord+did+choose+to+take+such+an+oath%3A+I+suppose+you+will+not+say+the+last%E2%80%A6+it+will+follow+then+that+the+tie+to+those+things+was+sacred%3B+that+is%2C+it+was+lawful+for+you+to+be+bound+by+an+oath+to+them+only%2C+because+the+supreme+authority+which+was+over+you%2C+and+had+power+to+establish+those+forms+and+circumstances+of+government%2C+did+require+such+an+obligation+from+you%2C+to+engage+you+to+be+faithful+thereunto%2C+and+if+this+is+the+only+lawful+original+of+such+a+sacred+tie%3B+Then+I+say%2C+that+the+dissolution+of+that+tie%2C+may+arise+from+the+same+power+which+did+establish+it%3A+he+that+has+power+to+oblige+me+to+a+form+of+his+creating+has+also+power+to+absolve+me+from+that+obligation.+In+old+times+and+now+also+in+some+places%2C+the+soldiers+were+wont+to+be+obliged+by+oath+to+serve+their+commanders+faithfully%2C+till+they+should+be+dismissed%3A+the+Romans+called+this+sacramentum+militare%3A+Now+he+that+might+lawfully+give+them+this+oath%2C+might+also+absolve+them+from+it%3B+and+so+it+is+in+all+obligations+unto+things+which+in+their+own+nature+are+not+morally+good%2C+but+good+only+ex+instituto+legitimo+%5Bout+of+the+legitimate+institution%5D%3A+the+power+which+gives+them+a+being%2C+may+take+it+from+them%3B+If+therefore+the+supreme+power+which+now+is+over+you+has+absolved+you+from+those+ties%2C+your+voluntary+continuance+under+them+cannot+make+them+any+longer+sacred%2C+no+more+than+your+voluntary+taking+an+oath+at+first+to+them%2C+without+the+conduct+of+the+authority+which+was+over+you%2C+could+have+made+your+obligation+lawful.+I+conceive+then%2C+that+in+things+merely+civil+and+human+%28that+is+of+a+changeable+nature%2C+as+being+subject+to+civil+and+human+ordinances%29+your+oath+cannot+put+a+stronger+tie+upon+you+towards+them+than+their+nature+will+bear%3B+that+is%2C+you+cannot+be+unalterably+bound+unto+them%2C+for+if+they+cease+to+be%2C+you+cannot+stand+obliged+towards+them%3B+now+that+they+do+cease+to+be+is+clear%2C+and+that+they+may+cease+to+be+by+the+power+which+is+over+you%2C+and+by+the+acts+of+divine+providence+absolving+subjects+from+such+oaths.%E2%80%9D%0A%0A%E2%80%94+John+Dury%2C+Objections+Against+the+Taking+of+the+Engagement+Answered%E2%80%A6+%28London%2C+1650%29%2C+pp.+7-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe113c3dd0e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e113c3dd0e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=for%20the%20obligation%20of%20all%20oaths,providence%20absolving%20subjects%20from%20such%20oaths&amp;text=for%20the%20obligation%20of%20all%20oaths%20is%20only&amp;text=of%20divine%20providence%20absolving%20subjects%20from%20such%20oaths" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1826e86ef5" data-kw="oath obligation third commandment">
<blockquote><p>To the third commandment belongs the celebrated question concerning the faith of an oath; or what and how great is the obligation of an oath; and in what cases we can violate or are bound to keep plighted faith. First, every oath repugnant to the law of God and the lawful obedience to magistrates (concerning things either unlawful or impossible) does not bind the swearer to a performance of it. An oath ought not to be a bond of iniquity and no one ought to be compelled to do anything iniquitously. The apostolic maxim ought always to hold good here, “It is better to obey God rather than men” (Acts 5:29).</p></blockquote>

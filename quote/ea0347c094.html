</figure><figure class="quote" id="q-9bef223640" data-kw="">
<blockquote><p>A person so great, so high, so glorious, as this Jesus Christ was, should have love for us, that passes knowledge. It is common for equals to love, and for superiors to be beloved; but for the King of princes, for the Son of God, for Jesus Christ to love man thus: this is amazing, and that so much the more, for that man the object of this love, is so low, so mean, so vile, so undeserving, and so inconsiderable, as by the scriptures, everywhere he is described to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

</figure><figure class="quote" id="q-85b10e50c5" data-kw="">
<blockquote><p>A soule acquainted with the Gospell, knowes that there is no Property of Christ rendred more glorious therein, than that of his patience; That he should beare with so many unkindnesses, so many causelesse breaches, so many neglects of his love, so many affronts done to his Grace, so many violations of ingagements, as he doth; it manifests his Gospell to be not only the word of his Grace, but also of his patience. He suffers also from them, in all the reproaches, they bring upon his name and wayes: and he suffers in them; for in all their Afflictions, he is afflicted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Temptation</cite>, Oxford, 1658, ch. 8, p. 145</span></figcaption>

</figure><figure class="quote" id="q-0bc84a0fa8" data-kw="">
<blockquote><p>The great question is, What constitutes a Christian? It is being so constrained by a sense of the love of our divine Lord to us, that we consecrate our lives to him. Hence, faith in his divinity, faith in his love, faith in his having died for us, is the principle or source of the Christian life. And this is the only form in which true religion can now exist. That is, the only true religion now possible is, the worship, love, and service of the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:14</span></figcaption>

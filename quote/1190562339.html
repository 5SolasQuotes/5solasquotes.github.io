<main class="wrap"><figure class="quote" id="q-1190562339" data-kw="">
<blockquote><p>Controversy II: What is justifying faith? Thesis: Faith is general or special. General faith is common to both the reprobate and the elect, being historical, miraculous, and temporary. Special faith, called justifying, is a confident acceptance that depends on the mercy of God in Jesus Christ. Its subject or seat, according to some orthodox theologians, is the intellect (like Perkins); others say it is the intellect and will together or the soul (like Polanus, Tilenus, etc.). These opinions can be reconciled by saying that justifying faith resides formally and properly in the practical intellect. It is a certain and firm knowledge of the grace of God, by which the elect man applies to himself the promise of grace in Christ. As for the confidence with which we rest in God as gracious to us, it arises from faith, that is, from this special knowledge. Thus, popularly, it can be said that faith is a light in the intellect, and confidence is in the will or the heart. The common object of faith is the written word of God; the proper object is the Gospel, or Christ. Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure:

1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed.

2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.

3. The Church Fathers also describe saving faith in this way and recognize the special and infallible certainty of faith; as Augustine says: “There is a way of glorying in the conscience, and you shall know that your faith is sincere, your hope certain, and your charity without simulation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

<blockquote><p>VII. He calls both [kinds of people] in earnest [serio] and without any deceit. Concerning the elect there is no doubt. As to the reprobate, although they are not called ‘according to his purpose,’ or to salvation, nevertheless they are called in earnest, and salvation is offered them on condition of faith. Nor are they mocked because they have been deprived of the grace of believing. Rather, because they destroyed the original grace of their own accord, and also, by their evil passion, despised the means of grace, God therefore has the right to demand faith from them and uses it no less justly than do other creditors, so that their mouths are closed, they are without excuse, and the justice of God is upheld. Therefore, He does not call them to mock them, but in order to declare and reveal his justice.

VIII. Therefore, common calling is not the basis for any conclusion regarding election, both because common calling is extended to both the reprobate and the elect, and because it is subject to the condition of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in</cite>, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 20, sect. 7–8, pp. 116-17 Latin: conditione</span></figcaption>

</figure><figure class="quote" id="q-04f7e630cc" data-kw="">
<blockquote><p>At last, by the mercy of God, meditating day and night, I gave heed to the context of the words, namely, “In it the righteousness of God is revealed, as it is written, ‘He who through faith is righteous shall live.’” There I began to understand that the righteousness of God is that by which the righteous lives by a gift of God, namely by faith. And this is the meaning: the righteousness of God is revealed in the gospel, namely, the passive righteousness with which merciful God justifies us by faith, as it is written, “He who through faith is righteous shall live.” Here I felt that I was altogether born again and had entered paradise itself through open gates.</p></blockquote>

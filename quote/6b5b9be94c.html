<main class="wrap"><figure class="quote" id="q-6b5b9be94c" data-kw="">
<blockquote><p>Few that have any respect to religion but would have their feelings hurt if they saw the theatres thrown open, and men flocking to places of public entertainment or business, on the Lord’s day (although this is done in some countries called Christian); but he is distressed to know that this holy day is so generally spent in idleness, in private dissipation and parties of pleasure, in unnecessary visiting, or in vain, worldly and irreligious company and conversation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grief for sins of men in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-fea30d9bc7" data-kw="">
<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on Jn., 17:1</span></figcaption>

</figure><figure class="quote" id="q-4b238971e4" data-kw="">
<blockquote><p>Among the Hebrews, as indeed in most nations, particular faculties were connected with particular parts of the body; and we read of ‘bowels’ the seat of sympathy; of the ‘reins’ the seat of deep and anxious thought; and of the ‘heart’ the seat of all inward reflection.

And here we think it of some importance to call attention to the circumstance that the Scriptures do not distinguish, as we do, the heart from the head; and do not make the heart signify mere emotion, but use it to include all that passes through the mind prior to action; and we read of the ‘imaginations’ and of the ‘thoughts’ of man’s heart,—hence the absurdity of arguing that faith consists in feeling, from the fact that we are said to believe with the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mccosh.html">James McCosh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to, The Complete Works of Stephen Charnock, B.D.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-f1428f6aba" data-kw="">
<blockquote><p>To the [citation of the] Confession of Wittenburg [by ‘good divines’] it is answered [by Ames’s opponents]: 1. That it does not so much as give any glance at Mark 7. Which, how true it is, may appear by these their words: ‘Nor is it lawful to restore either the old rites of the law, or to devise new in their place to signify the truth of the gospel now come to light, as for example, to use banners and crosses to sign Christ’s victory on the cross: of which kind of i […]ly devised representations is the whole furniture of Mass accontrements, which they say does set forth the whole passion of Christ and many such like things. Of which sacred ceremonies Christ preaches out of Isaiah: In vain they worship Me, teaching for doctrines the precepts of men.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>

<main class="wrap"><figure class="quote" id="q-c7c2707c98" data-kw="">
<blockquote><p>And thus was the Sabbath, or the observation of one day in seven as a sacred rest, fixed on the same moral grounds with monogamy, or the marriage of one man to one woman only at the same time; which, from the very fact and order of the creation, our Saviour proves to have been an unchangeable part of the law of it. For because God made them two single persons, male and female, fit for individual conjunction, he concludes that this course of life they were everlastingly obliged not to alter nor transgress.

As, therefore, men may dispute that polygamy is not against the law of nature, because it was allowed and practised by many, by most of those who of old observed and improved the light and rule thereof to the uttermost, when yet the very “factum” and order of the creation is sufficient to evince the contrary; so although men should dispute: hat the observation of one days sacred rest in seven is not of the light or law of nature, all whose rules and dictates, they say, are of an easy discovery, and prone to the observation of all men, which this is not, yet the order of the creation, and the rest of God that ensued thereon, are sufficient to evince the contrary.

And in the renewing of the law upon mount Sinai, God taught the people not only by the words that he spake, but also by the works that he wrought. Yea, he instructed them in a moral duty, not only by what he did, but by what he did not; for he declares that they ought to make no images of or unto him, because he made no representation of himself unto them. “They saw no manner of similitude on the day that the LORD spake unto them in Horeb out of the midst of the fire,” Deut. iv. 15, 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 345.</span></figcaption>

<blockquote><p>How should involuntary mental portraits of Christ be treated by those who experience them?… Erskine’s comparison of mental idolatry with mental adultery suggests some important clues. A man cannot always avoid seeing a beautiful woman or being attracted to her. Mental adultery does not consist in physical sight, but in cultivating the mental image of that woman for the purpose of sexual stimulation… When a mental image comes into the mind without a deliberate volition, its content must be evaluated. If it is symbolic of God’s attributes or if it represents an event in the life of the Lord Jesus, it may be entertained with caution. If it consists of a virtual portrait of the Savior, it ought to be rejected rather than fondled.</p></blockquote>

<blockquote><p>The date of its publication is almost all that has been ascertained in regard to the circumstances in which this “Peace-offering” appeared. We are inclined to attach to it considerable value; and of all the writings of Owen in defence of Nonconformity, in the trying and critical period of its history when this tract was published (1667), there is none in which the case of the Nonconformists is more simply and conclusively argued, or more likely to produce a greater effect on the modern reader. Very earnest in its tone, and yet very moderate in its language,—calm, and yet most impressive in the appeal which it contains,—it affords a pleasing illustration alike of the meekness of wisdom and the wisdom of meekness.

It seems impossible to read it without a mingled feeling of regret and indignation that there ever should have been a time when men breathing the spirit which our author here breathes should have been denied religious freedom and the rights of conscience on the soil of Britain. The chief fault of the tract is its very moderation, as “a humble plea,”—for an “indulgence,” too, in the exercise of those rights which no government is either able to confer or entitled to withhold, and the protection of which is one of the highest ends of government.</p></blockquote>

</figure><figure class="quote" id="q-f04961c268" data-kw="">
<blockquote><p>But above all else, I beg the sincere reader, and I beg for the sake of our Lord Jesus Christ himself, to read those things judiciously, yes, with great commiseration. May he be mindful of the fact that I was once a monk and a most enthusiastic papist when I began that cause. I was so drunk, yes, submerged in the pope’s dogmas, that I would have been ready to murder all, if I could have, or to co-operate willingly with the murderers of all who would take but a syllable from obedience to the pope. So great a Saul was I, as are many to this day. I was not such a lump of frigid ice in defending the papacy as Eck and his like were, who appeared to me actually to defend the pope more for their own belly’s sake than to pursue the matter seriously. To me, indeed, they seem to laugh at the pope to this day, like Epicureans! I pursued the matter with all seriousness, as one, who in dread of the last day, nevertheless from the depth of my heart wanted to be saved. So you will find how much and what important matters I humbly conceded to the pope in my earlier writings, which I later and now hold and execrate as the worst blasphemies and abomination. You will, therefore, sincere reader, ascribe this error, or, as they slander, contradiction to the time and my inexperience. At first I was all alone and certainly very inept and unskilled in conducting such great affairs. For I got into these turmoils by accident and not by will or intention. I call upon God himself as witness. Hence, when in the year 1517 indulgences were sold (I wanted to say promoted) in these regions for most shameful gain—I was then a preacher, a young doctor of theology, so to speak—and I began to dissuade the people and to urge them not to listen to the clamors of the indulgence hawkers; they had better things to do. I certainly thought that in this case I should have a protector in the pope, on whose trustworthiness I then leaned strongly, for in his decrees9 he most clearly damned the immoderation of the quaestors [revenue officials], as he called the indulgence preachers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But above all else, I beg the sincere reader, and I beg for the sake of our Lord Jesus Christ himself, to read those things judiciously, yes, with great commiseration. May he be mindful of the fact that I was once a monk and a most enthusiastic papist when I began that cause. I was so drunk, yes, submerged in the pope’s dogmas, that I would have been ready to murder all, if I could have, or to co-operate willingly with the murderers of all who would take but a syllable from obedience to the pope. So great a Saul was I, as are many to this day. I was not such a lump of frigid ice in defending the papacy as Eck and his like were, who appeared to me actually to defend the pope more for their own belly’s sake than to pursue the matter seriously. To me, indeed, they seem to laugh at the pope to this day, like Epicureans! I pursued the matter with all seriousness, as one, who in dread of the last day, nevertheless from the depth of my heart wanted to be saved. So you will find how much and what important matters I humbly conceded to the pope in my earlier writings, which I later and now hold and execrate as the worst blasphemies and abomination. You will, therefore, sincere reader, ascribe this error, or, as they slander, contradiction to the time and my inexperience. At first I was all alone and certainly very inept and unskilled in conducting such great affairs. For I got into these turmoils by accident and not by will or intention. I call upon God himself as witness. Hence, when in the year 1517 indulgences were sold (I wanted to say promoted) in these regions for most shameful gain—I was then a preacher, a young doctor of theology, so to speak—and I began to dissuade the people and to urge them not to listen to the clamors of the indulgence hawkers; they had better things to do. I certainly thought that in this case I should have a protector in the pope, on whose trustworthiness I then leaned strongly, for in his decrees9 he most clearly damned the immoderation of the quaestors [revenue officials], as he called the indulgence preachers.”

— Martin Luther, Luther’s Works, Vol. 34: Career of the Reformer IV, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 34 (Philadelphia: Fortress Press, 1999), 328–29.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+above+all+else%2C+I+beg+the+sincere+reader%2C+and+I+beg+for+the+sake+of+our+Lord+Jesus+Christ+himself%2C+to+read+those+things+judiciously%2C+yes%2C+with+great+commiseration.+May+he+be+mindful+of+the+fact+that+I+was+once+a+monk+and+a+most+enthusiastic+papist+when+I+began+that+cause.+I+was+so+drunk%2C+yes%2C+submerged+in+the+pope%E2%80%99s+dogmas%2C+that+I+would+have+been+ready+to+murder+all%2C+if+I+could+have%2C+or+to+co-operate+willingly+with+the+murderers+of+all+who+would+take+but+a+syllable+from+obedience+to+the+pope.+So+great+a+Saul+was+I%2C+as+are+many+to+this+day.+I+was+not+such+a+lump+of+frigid+ice+in+defending+the+papacy+as+Eck+and+his+like+were%2C+who+appeared+to+me+actually+to+defend+the+pope+more+for+their+own+belly%E2%80%99s+sake+than+to+pursue+the+matter+seriously.+To+me%2C+indeed%2C+they+seem+to+laugh+at+the+pope+to+this+day%2C+like+Epicureans%21+I+pursued+the+matter+with+all+seriousness%2C+as+one%2C+who+in+dread+of+the+last+day%2C+nevertheless+from+the+depth+of+my+heart+wanted+to+be+saved.+So+you+will+find+how+much+and+what+important+matters+I+humbly+conceded+to+the+pope+in+my+earlier+writings%2C+which+I+later+and+now+hold+and+execrate+as+the+worst+blasphemies+and+abomination.+You+will%2C+therefore%2C+sincere+reader%2C+ascribe+this+error%2C+or%2C+as+they+slander%2C+contradiction+to+the+time+and+my+inexperience.+At+first+I+was+all+alone+and+certainly+very+inept+and+unskilled+in+conducting+such+great+affairs.+For+I+got+into+these+turmoils+by+accident+and+not+by+will+or+intention.+I+call+upon+God+himself+as+witness.+Hence%2C+when+in+the+year+1517+indulgences+were+sold+%28I+wanted+to+say+promoted%29+in+these+regions+for+most+shameful+gain%E2%80%94I+was+then+a+preacher%2C+a+young+doctor+of+t

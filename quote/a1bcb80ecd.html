<blockquote><p>And kings shall be thy nursing fathers. After having spoken of the obedience of the Gentiles, he shews that this relates not to the common people only, but to “kings” also. He compares “kings” to hired men who bring up the children of others, and “queens” to “nurses,” who give out their labour for hire. Why so? Because “kings” and “queens” shall supply everything that is necessary for nourishing the offspring of the Church.

Having formerly driven out Christ from their dominions, they shall henceforth acknowledge him to be the supreme King: and shall render to him all honour, obedience, and worship. This took place when the Lord revealed himself to the whole world by the Gospel; for mighty kings and princes not only submitted to the yoke of Christ, but likewise contributed their riches to raise up and maintain the Church of Christ, so as to be her guardians and defenders.

Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labour in it more diligently. And this is the reason why David expressly addresses and exhorts them to “be wise, and serve the Lord, and kiss his Son.” (Ps. ii. 10-12.)

This shews how mad are the dreams of those who assert that kings cannot be Christians without laying aside that office; for those things were accomplished under Christ, when kings, who had been converted to God by the preaching of the Gospel, obtained this highest pinnacle of rank, which surpasses dominion and principality of every sort, to be “nursing-fathers” and guardians of the Church.

The Papists have no other idea of kings being “nursing-fathers” of the Church than that they have left to their priests and monks very large revenues, rich possessions and prebends, on which they might fatten, like hogs in a sty. But that “nursing” aims at an object quite different from filling up those insatiable gulls. Nothing is said here about enriching the houses of those who, under false pretences, hold themselves out to be ministers of the Church, (which was nothing else than to corrupt the Church of God and to destroy it by deadly poison,) but about removing superstitions and putting an end to all wicked idolatry, about advancing the kingdom of Christ and maintaining purity of doctrine, about purging scandals and cleansing from the filth that corrupts piety and impairs the lustre of the Divine majesty.

Undoubtedly, while kings bestow careful attention on these things, they at the same time supply the pastors and ministers of the Word with all that is necessary for food and maintenance, provide for the poor and guard the Church against the disgrace of pauperism; erect schools, and appoint salaries for the teachers and board for the students; build poor-houses and hospitals, and make every other arrangement that belongs to the protection and defense of the Church. But those unnecessary and extravagant expenses for Anniversaries and Masses, for golden vessels and costly robes, which swell the pride and insolence of papists, serve only to uphold pomp and ambition, and corrupt the pure and simple “nursing” of the Church, and even choke and extinguish the seed of God, by which alone the Church lives.

When we see that matters are now very different, and that “kings” are not the “nursing-fathers,” but the executioners of the Church; when, in consequence of taking away the doctrine of piety and banishing its true ministers, idle bellies, insatiable whirlpools, and messengers of Satan, are fattened, (for such are the persons to whom the princes cheerfully distribute their wealth, that is, the moisture and blood which they have sucked out of the people;) when even princes otherwise godly have less strength and firmness for defending the Word and upholding the Church; let us acknowledge that this is the reward due to our sins, and let us confess that we do not deserve to have good “nursing-fathers.” But yet, after this frightfully ruinous condition, we ought to hope for a restoration of the Church, and such a conversion of kings that they shall shew themselves to be “nursing-fathers” and protectors of believers, and shall bravely defend the doctrine of the Word.

And shall lick the dust of thy feet. This passage is also tortured by the Papists in order to uphold the tyranny of their idol, as if kings and princes had no other way of proving themselves to be sincere and lawful worshippers of God than by adoring that masked prince of the Church instead of God. Thus they consider the obedience of piety to consist in kissing the Pope’s feet with deep reverence. What they ought to think of such barbarous and idolatrous worship, let them learn, first, from Peter, whose seat they boast of occupying, who would not permit such honour to be rendered to him by the centurion. (Acts x. 26.) Let them, next, learn from Paul, who tore his garments, and rejected such worship with the utmost abhorrence. (Acts xiv.14.)

What could be more absurd than to imagine that the Son of God appointed, instead of a minister of the Gospel, an object of abhorrence, some king dazzling in Persian luxury and splendour? But let us remember that the Church, so long as she is a pilgrim in this world, is subjected to the cross, that she may be humble and may be conformed to her Head; that if her foes make any cessation of their hostility, still her highest ornament and lustre is modesty. Hence it follows, that she has laid aside her own attire, when she is clothed with irreligious pride.

Here the Prophet means nothing else than the adoration by which princes bow down before God, and the obedience which they render to his Word in the Church. What we have already said must be carefully observed, that, when we speak of rendering honour to the Church, she must never be separated from the Head; for this honour and worship belongs to Christ, and, when it is bestowed on the Church, it still continues to belong undivided to him alone. By the obedience of piety kings do not profess submission, so as to bear the yoke of men, but to yield to the doctrine of Christ. Whosoever therefore rejects the ministry of the Church, and refuses to bear the yoke which God wishes to lay with his own hand on all his people, can neither have any fellowship with Christ nor be a child of God.</p></blockquote>

<blockquote><p>In the midst of the debates within the Free Church of Scotland surrounding a potential union with the United Presbyterians (Voluntaries), Horatius Bonar argued against any compromise of the Free Kirk’s position on church-state relations:

EDINBURGH FREE CHURCH PRESBYTERY.

THE UNION QUESTION. …

Dr [Horatius] BONAR brought forward the following overture, of which he had given notice:-

Whereas the prosecution of the negotiations for union on their present footing threatens to issue in the compromise of the distinctive principles of this Church, and is already producing most serious internal dissensions, it is humbly overtured by the Free Presbytery of Edinburgh to the ensuing General Assembly that said negotiations be discontinued, the Assembly at the same time recommending the cultivation of brotherly intercourse and co-operation in every work of faith and labour of love in which the negotiating Churches can consistently with their principles unite.

Dr Bonar, in supporting the overture, maintained that, while union among Presbyterian Churches was eminently desirable, it was absolutely-essential that the Free Church should maintain her distinctive principles. He held that the United Presbyterian Church had not made the slightest concession of their principles, while the Free Church had done so, and this it was which had led to the present crisis. He proceeded at great length to expound the distinctive principles of the Free Church, dwelling mainly upon the relation of the Church and the State.

He contended that the question of the relation of the Civil Magistrate to the Church had not been an open question in the past history of the Church; and that, if they were to found a new Church leaving that an open question, they would stand alone in the face of the Churches in Christendom – they would be proclaiming, not merely that they had altered their creed, but that the Churches of the Reformation were wrong. … He protested against the proposal to leave any of the distinctive principles of the Church as open questions, maintaining that, if such a proposal were carried out, the questions would be open, but the mouths of the members of the Church would be shut, and their hands would be tied. …

Dr Bonar concluded, amidst loud applause, by expressing his desire for conciliation with the members of other Churches, though he could not agree to any proposal for union on a footing which would involve any compromise of the distinctive principles of the Free Church. …</p></blockquote>

Dr Bonar, in supporting the overture, maintained that, while union among Presbyterian Churches was eminently desirable, it was absolutely-essential that the Free Church should maintain her distinctive principles. He held that the United Presbyterian Church had not made the slightest concession of their principles, while the Free Church had done so, and this it was which had led to the present crisis. He proceeded at great length to expound the distinctive principles of the Free Church, dwelling mainly upon the relation of the Church and the State.

He contended that the question of the relation of the Civil Magistrate to the Church had not been an open question in the past history of the Church; and that, if they were to found a new Church leaving that an open question, they would stand alone in the face of the Churches in Christendom – they would be proclaiming, not merely that they had altered their creed, but that the Churches of the Reformation were wrong. … He protested against the proposal to leave any of the distinctive principles of the Church as open questions, maintaining that, if such a proposal were carried out, the questions would be open, but the mouths of the members of the Church would be shut, and their hands would be tied. …

Dr Bonar concluded, amidst loud applause, by expressing his desire for conciliation with the members of other Churches, though he could not agree to any proposal for union on a footing which would involve any compromise of the distinctive principles of the Free Church. …”

<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>

</figure><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>

<blockquote><p>…the pope… can excommunicate a ruler and thereby dissolve all obligations his subjects have to support and obey him, thus overthrowing governments at will. Thomas [of Aquinas] wrote: …if someone commits the sin of unbelief he can be deprived of his right to rule by judicial sentence, just as for other failings… Therefore, as soon as someone falls under a sentence of excommunication for apostasy from the faith, his subjects are ipso facto absolved from his rule and from the oath of fealty by which they were bound to him. (Summa Theologiae, ii-ii, Question 12, in Basic Writings of Thomas Aquinas, Anton C. Pegis, editor. New York: Random House, 1945.)</p></blockquote>

<blockquote><p>Obj. 8. The law is the letter which killeth, and is the ministration of death and condemnation. (2 Cor. 3:6, 7.) But there is no condemnation to Christians. Therefore, the law does not have respect to Christians who are in Christ Jesus. Ans. There is here a fallacy of accident; for the law is not in itself the letter which killeth; since this comes to pass by the fault of men, who, the more clearly they perceive the difference between themselves and the law, the more fully do they give themselves over to despair in reference to their salvation, and are therefore slain by the law. Again, the law alone, without the gospel, is the letter, that is, it is the doctrine which merely teaches, demands obedience, denounces the wrath of God and death to such as are disobedient, without producing the spiritual obedience which it requires. But when it is joined with the gospel, which is the Spirit, it also commences to become the Spirit, which is effectual in the godly, inasmuch as those who are regenerated commence willingly and cheerfully to yield obedience to the law. The law, therefore, is the letter, 1. By itself and without the gospel. 2. In respect to those who are unregenerated. On the other hand, the gospel is the Spirit; that is, it is the ministration and means through which the Holy Ghost, which works spiritual obedience in us, is given; not indeed as though all who hear, would receive the Holy Ghost and be regenerated, but because faith, by which our hearts are quickened, so that they begin to yield obedience to the law, is received by it. It does not follow, therefore, that the law is no longer to be taught in the church; for Christ himself says: “I am not come to destroy the law, but to fulfill it.” (Matt. 5:17.) And Paul also says, that we establish the law through faith. (Rom. 3:31.) Christ fulfilled the law in two respects: by obedience and suffering. He was just and holy in himself and did not violate the law in a single instance, but partly performed in our behalf those things which he was not bound to do, and partly sustained the punishment of the law. He also fulfills the law in us in two ways, by teaching it and granting unto us his Spirit, that so we may commence obedience to it, as we proved when speaking of the abrogation of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-771cc66c44" data-kw="">
<blockquote><p>As for that which they tax the ministers, to be ministers of the dead letter, one may plainly see the Lord’s taking vengeance upon the outrage offered unto his holy Word; smiting them with the spirit of giddiness, for having despised the true and only means of coming unto God, which is the Scripture and the Word of God. In the passage of the Corinthians where Paul says, “The letter kills, and the Spirit quickens;” let any closely consider, against whom the Apostle disputes, and they will understand his drift. It is very evident that Paul in this place, had to do with false Apostles, who preached and extolled the Law without Christ, and caused the people to recoil from salvation purchased by Christ, and the grace of the new covenant, whereunto the Lord had promised to write his Law in the heart of the faithful: the Law then being separated from Christ, as a body without a soul; and nothing comes from it but death, to those that are under it: it does nothing but beat and strike the ears, without quickening the soul, until by faith we are sent from it unto Christ, as from the usher to the master; and then the Law will be found such as David sings it, “The Law of the Lord is perfect, converting the soul; the testimony of the Lord is faithful, making Wise the simple: the commandments of the Lord are right, rejoicing the heart, etc.” Thus must we understand how it is said, “The Letter kills:” Paul called the Law, The killing Letter, and says, The Spirit quickens, i.e., The Ministry of the Gospel, which he opposes unto the naked Law; and he himself calls his preaching “The Ministry of the Spirit.</p></blockquote>

</figure><figure class="quote" id="q-25c96cbda1" data-kw="moral law not abolished">
<blockquote><p>As it was not abolished but fulfilled by Christ, neither is its use among us to be abolished. Luke wants us to hear Moses and the prophets: “They have Moses and the prophets, let them hear them” (16:29). If they are to be heard, their commands must therefore be obeyed also. If this is said by Christ to the Jews of his time, it ought not forthwith to be understood of them to the exclusion of others. He does not give here a special, but a general precept to all who desire to escape the place of torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.5</span></figcaption>

</figure><figure class="quote" id="q-ffaa63822b" data-kw="civil pedagogical conviction restraint">
<blockquote><p>In the destitute state of sin, the use of the law cannot be “justification” because it was weak in the flesh. It is not said to have been given for life, but “because of transgressions” (Gal. 3:19). Still there is a threefold use of the law. (a) For conviction, when it brings man to a knowledge of sin and convinces him of his guilt—“by the law is the knowledge of sin” (Rom. 3:20). Thus it is like a mirror in which we see our blemishes. (b) For restraint, restraining and checking men by its commands and threatenings, so that they who feel no regard for justice and rectitude unless compelled (while they hear its direful sanctions) may be restrained at least by the fear of punishment. In this respect, Paul says “the law is not made for a righteous man, but for lawless and disobedient, for the ungodly and for sinners” (1 Tim. 1:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In the destitute state of sin, the use of the law cannot be “justification” because it was weak in the flesh. It is not said to have been given for life, but “because of transgressions” (Gal. 3:19). Still there is a threefold use of the law. (a) For conviction, when it brings man to a knowledge of sin and convinces him of his guilt—“by the law is the knowledge of sin” (Rom. 3:20). Thus it is like a mirror in which we see our blemishes. (b) For restraint, restraining and checking men by its commands and threatenings, so that they who feel no regard for justice and rectitude unless compelled (while they hear its direful sanctions) may be restrained at least by the fear of punishment. In this respect, Paul says “the law is not made for a righteous man, but for lawless and disobedient, for the ungodly and for sinners” (1 Tim. 1:9).”

— Francis Turretin, Institutes of Elenctic Theology, 11.22.9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn%20the%20destitute%20state%20of%20sin%2C%20the%20use%20of%20the%20law%20cannot%20be%20%E2%80%9Cjustification%E2%80%9D%20because%20it%20was%20weak%20in%20the%20flesh.%20It%20is%20not%20said%20to%20have%20been%20given%20for%20life%2C%20but%20%E2%80%9Cbecause%20of%20transgressions%E2%80%9D%20%28Gal.%203%3A19%29.%20Still%20there%20is%20a%20threefold%20use%20of%20the%20law.%20%28a%29%20For%20conviction%2C%20when%20it%20brings%20man%20to%20a%20knowledge%20of%20sin%20and%20convinces%20him%20of%20his%20guilt%E2%80%94%E2%80%9Cby%20the%20law%20is%20the%20knowledge%20of%20sin%E2%80%9D%20%28Rom.%203%3A20%29.%20Thus%20it%20is%20like%20a%20mirror%20in%20which%20we%20see%20our%20blemishes.%20%28b%29%20For%20restraint%2C%20restraining%20and%20checking%20men%20by%20its%20commands%20and%20threatenings%2C%20so%20that%20they%20who%20feel%20no%20regard%20for%20justice%20and%20rectitude%20unless%20compelled%20%28while%20they%20hear%20its%20direful%20sanctions%29%20may%20be%20restrained%20at%20least%20by%20the%20fear%20of%20punishment.%20In%20this%20respect%2C%20Paul%20says%20%E2%80%9Cthe%20law%20is%20not%20made%20for%20a%20righteous%20man%2C%20but%20for%20lawless%20and%20disobedient%2C%20for%20the%20ungodly%20and%20for%20sinners%E2%80%9D%20%281%20Tim.%201%3A9%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2011.22.9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fffaa63822b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ffaa63822b.html">Permalink</a><span class="src none">No free online copy linked</span></div>

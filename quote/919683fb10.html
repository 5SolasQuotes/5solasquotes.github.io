<main class="wrap"><figure class="quote" id="q-919683fb10" data-kw="">
<blockquote><p>Q. 10. How did God create man? A. God created man male and female, after his own image, in knowledge, righteousness, and holiness, with dominion over the creatures. (Gen. 1:26-28; Col. 3:10; Eph. 4:24) … Q. 59. Which day of the seven hath God appointed to be the weekly Sabbath? A. From the beginning of the world to the resurrection of Christ, God appointed the seventh day of the week to be the weekly Sabbath; and the first day of the week, ever since, to continue to the end of the world, which is the Christian Sabbath. (Gen. 2:2-3; 1 Cor. 16:1-2; Acts 20:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shorter Catechism</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f14b20fcab" data-kw="">
<blockquote><p>‘My Father worketh hitherto, etc.’ God having finished that work of Creation in the space of six days, rested from that work on the seventh day; but from the work of his providence, and governing the things He has made, He never rested one day from the Creation of the world. In six days the Creation of the world was finished, but the government thereof is perpetual, and God continually works in preserving and maintaining the order thereof, even as the apostle says…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Eye &amp; Wheel of Providence, or a Treatise Proving that there is a Divine Providence</cite>, (London: Tyton, 1662), ch. 1, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, ch. 1, verse 10, section 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-0a819d3bca" data-kw="">
<blockquote><p>A simple survey of the world should of itself suffice to attest a Divine Providence. The heavens revolve daily, and, immense as is their fabric, and inconceivable the rapidity of their revolutions, we experience no concussion — no disturbance in the harmony of their motion. The sun, though varying its course every diurnal revolution, returns annually to the same point. The planets, in all their wanderings, maintain their respective positions. How could the earth hang suspended in the air were it not upheld by God’s hand? By what means could it maintain itself unmoved, while the heavens above are in constant rapid motion, did not its Divine Maker fix and establish it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 93:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-62d6ab6209" data-kw="">
<blockquote><p>With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-barker.html">William S. Barker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘The Westminster Assembly on the Days of Creation: a Reply to David W. Hall’ in Word to the World (Ross-shire, UK: Christian Focus Publications, 2005), pp. 259-70, pp. 263, 265-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

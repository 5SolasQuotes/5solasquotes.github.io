<main class="wrap"><figure class="quote" id="q-6d554ae102" data-kw="">
<blockquote><p>Let every man walk within the compass of his calling. Whatsoever lies not in us to reform, it shall be our zeal and piety to tolerate, and with patience to forbear, especially in things of this nature, which concern not so much the outward communion with God or man, essentially required in a visible state, as the due ordering of business in the said communion, wherein there be many superfluities and defects, salva tamen Ecclesia; yea, and such a Church notwithstanding, as wherein the best and truest members (circumstances considered) may have more cause to rejoice than to grieve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, (d. 1617), ch. 2, pp. 297-98</span></figcaption>

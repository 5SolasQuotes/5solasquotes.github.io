<main class="wrap"><figure class="quote" id="q-57fc8840e2" data-kw="">
<blockquote><p>The first is the act of knowledge (notitia)—of all things to be believed by us, whether pertaining to our misery or to the grace of God. For as truth is the object of faith (and indeed not any truth, but the divine and supernatural truth revealed in the word of God), it requires above all knowledge for its apprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-209fbb2df4" data-kw="">
<blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</span></figcaption>

</figure><figure class="quote" id="q-159631b248" data-kw="">
<blockquote><p>Faith consists not in ignorance, but in knowledge--knowledge not of God merely, but of the divine will. We do not obtain salvation either because we are prepared to embrace every dictate of the Church as true, or leave to the Church the province of inquiring and determining; but when we recognize God as a propitious Father through the reconciliation made by Christ, and Christ as given to us for righteousness, sanctification, and life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.2</span></figcaption>

</figure><figure class="quote" id="q-2957ad874d" data-kw="">
<blockquote><p>Endeavour diligently to perform the great work of believing on Christ in a right manner without any delay, and then also to continue and increase in your most holy Faith, that so your enjoyment of Christ, Vnion and Fellowship with him, and all holiness by him, may be begun, continued, and increased in you.</p></blockquote>

</figure><figure class="quote" id="q-7581bd9f56" data-kw="">
<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-platt.html">David Platt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Follow Me</cite>, p. 60</span></figcaption>

<main class="wrap"><figure class="quote" id="q-388b438a3a" data-kw="">
<blockquote><p>First, for schismatical Churches, that is, such as embrace and profess the common saving faith of the catholic Church; but yet have separated themselves from the outward communion of those particular visible Churches, that sometimes they have been, and should be members of: the cause of such schisms is sometimes pride, discontent, weakness, willfulness, pretended zeal, a factious spirit; always it is Satan’s instigation, and man’s acceptation: whatsoever the cause be, and how great soever the schism be, though they be justly condemned as schismatical, in regard they are rent from the outward fellowship of such visible congregations as they belong unto, yet because they hold correspondency with the catholic Church in matters of saving faith, and accordingly profess the same, they [the schismatics] cannot be denied to be true visible Churches: Such were the Donatists of old, and such are the Brownists at this day…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 2, Lecture 26; p. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

pener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>My mind being thus many years immersed in studies of this nature, and I having also long wearied myself in searching what fathers and schoolmen have said of such things before us, and my genius abhorring confusion and equivocals, I came by many years longer study to perceive that most of the doctrinal controversies among Protestants (that I say not in the Christian world) are far more about equivocal words than matter; and it wounded my soul to perceive what work both tyrannical and unskillful, disputing clergymen had made these thirteen hundred years in the world! And experience since the year 1643 till this year, 1675, has loudly called to me to repent of my own prejudices, sidings and censurings of causes and persons not understood, and of all the miscarriages of my ministry and life, which have been thereby caused; and to make it my chief work to call men that are within my hearing to more peaceable thoughts, affections and practices: And my endeavours have not been in vain, in that the ministers of the country where I lived, were very many of such a peaceable temper (though since cast out [at the Great Ejection, 1662]), (and a great number more through the land by God’s grace (rather than any endeavors of mine) are so minded). But the sons of the coal were exasperated the more against me, and accounted him to be against every man that called all men to love and peace, and was for no man as in a contrary way. And now looking daily in this posture, when God calls me hence (summoned by an incurable disease to hasten all that ever I will do in this world) being uncapable of prevailing with the present Church disturbers, I do apply myself to posterity, leaving them the sad warning of their ancestors’ distractions, as a pillar of salt, and acquainting them what I have found to be the cause of our calamities, and therein they will find the cure themselves.

II. I Have oft taken the boldness (constrainedly) to say that I doubt not but the contentions of the clergy have done far more hurt to the Christian world than the most bloody wars of princes. …

      13. No man is sufficiently apprehensive of the greatness of the curse in the confusion of tongues [Gen. 10]: whereby as we can preach but to few nations in the world, so we cannot intelligibly converse with one another. All words (being arbitrary signs) are ambiguous; And few disputers have the jealousy and skill which is necessary to discuss equivocations, and to agree of the meaning of all their terms before they use them in disputing: And so taking verbal differences for material, does keep up most of the wretched academical and theological wars of the world.

      14. And nothing here undoes all the world in point of wisdom, so much as over-hasty judging or prefidence: It is natural to almost all to fasten presently upon the first appearances and to be confident before they have half tried: In cases where seven and seven years serious study is necessary to a thorough digested knowledge, every novice will presently conclude as if he were sure. And then as everyone is apt to be confident, so to be tenacious; every error leading on more, and the reputation of the person being concerned in it, mutability being a shame: And so it becomes a very difficult thing to unlearn the errors once learned; as white paper is easier [to be] written on than that which is written on before.

      15. And then no man knows his own error (else it were no error), nor knows what another man’s perceptions are, nor what any other man knows more than he. 16…. And by all these means almost all are of the opinion of the country where they live, or of those that they most reverence, or which are most for their interest; and boldly condemn the rest not understood.</p></blockquote>

</figure><figure class="quote" id="q-a2bba13919" data-kw="">
<blockquote><p>Are we then heretics, condemned in ourselves? wherein overthrow we the foundation? What other God, Savior, Scriptures, justification, sacraments, Heaven do they teach beside us? Can all the masters of Seperation, yea can all the churches in Christendom set forth a more exquisite and worthy confession of Faith than is contained in the [39] Articles of the Church of England? Who can hold these and be heretical? Or, from which of these are we revolted? But to make this good they have taught you to say that every truth in Scripture is fundamental; so fruitful is error of absurdities, whereof still one breeds another more deformed than itself. That Trophimus was left at Miletum sick, that Paul’s cloak was left at Troas, that Gaius, Paul’s host, saluted the Romans, that Nabal was drunk; or that Thamar baked cakes [2 Sam. 13:8-10], and a thousand of this nature are fundamental: How large is the Separatists’ Creed, that has all these articles? If they say all Scripture is of the same Author, of the same authority: so say we, but not of the same use. Is it as necessary for a Christian to know that Peter hosted with one Simon, a tanner in Joppa, as that Jesus Christ the Son of God was born of the Virgin Mary? What a monster is this of an opinion, that all truths are equal? That this spiritual house should be all foundation, no walls, no roof? Can no man be saved but he that knows everything in Scripture?… You see then that both all truths must not of necessity be known, and some must: and these we justly call fundamental: which who so holds, all his hay and stubble (through the mercy of God) condemn him not: stil he has right to the church on earth, and hope in heaven: but whither every truth be fundamental, or necessary: Discipline (you say) is so: indeed necessary to the well-being of a church, no more: it may be true without it, not perfect. Christ compares his spouse to an army with banners: as order is to an army, so is discipline to the Church: if the troops be not well marshalled in their several ranks, and move not forward, according to the discipline of war, it is an army still: confusion may hinder their sucess, it cannot bereave them of their name: it is as beautiful proportion to the body, an hedge to a vineyard, a wall to a city, an hem to a garment, ceiling to an house. It may be a body, vineyard, city, garment, house, without them: it cannot be well and perfect. Yet which of our adversaries will say we have no discipline? Some they grant, but not the right: as if they said, Your city has a brick wall indeed, but it should have one of hewn stone; your vineyard is hedged, but it should be paled and ditched: while they cavil at what we want, we thank God for what we have; and so much we have, in spite of all detraction, as makes us both a true Church and a worthy one. But the main quarrel is against but ministry and form of worship: let these be examined; this is the circle of their censure: No Church, therefore no ministry; and no ministry, therefore no Church… What would they have? Have we not competent gifts from aboue, for so great a function? Are we all unlearned, insufficient? Not a man that knows to devide the word aright? As Paul to the Corinthins, is it so that there is not one wise man amongst us? No man will affirm it: some of them have censured our excess in some knowledge; none, our defect in all: What then? Have we not a true desire to do faithful service to God and his Church? No zeal for God’s glory?…</p></blockquote>

— Joseph Hall, Epistles, the Second Volume (London: 1608) | 6th Decade, Epistle 5… dissuading from Separation &amp; Shortly Oppugning the Grounds of that Error, pp. 50-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAre+we+then+heretics%2C+condemned+in+ourselves%3F+wherein+overthrow+we+the+foundation%3F+What+other+God%2C+Savior%2C+Scriptures%2C+justification%2C+sacraments%2C+Heaven+do+they+teach+beside+us%3F+Can+all+the+masters+of+Seperation%2C+yea+can+all+the+churches+in+Christendom+set+forth+a+more+exquisite+and+worthy+confession+of+Faith+than+is+contained+in+the+%5B39%5D+Articles+of+the+Church+of+England%3F+Who+can+hold+these+and+be+heretical%3F+Or%2C+from+which+of+these+are+we+revolted%3F+But+to+make+this+good+they+have+taught+you+to+say+that+every+truth+in+Scripture+is+fundamental%3B+so+fruitful+is+error+of+absurdities%2C+whereof+still+one+breeds+another+more+deformed+than+itself.+That+Trophimus+was+left+at+Miletum+sick%2C+that+Paul%E2%80%99s+cloak+was+left+at+Troas%2C+that+Gaius%2C+Paul%E2%80%99s+host%2C+saluted+the+Romans%2C+that+Nabal+was+drunk%3B+or+that+Thamar+baked+cakes+%5B2+Sam.+13%3A8-10%5D%2C+and+a+thousand+of+this+nature+are+fundamental%3A+How+large+is+the+Separatists%E2%80%99+Creed%2C+that+has+all+these+articles%3F+If+they+say+all+Scripture+is+of+the+same+Author%2C+of+the+same+authority%3A+so+say+we%2C+but+not+of+the+same+use.+Is+it+as+necessary+for+a+Christian+to+know+that+Peter+hosted+with+one+Simon%2C+a+tanner+in+Joppa%2C+as+that+Jesus+Christ+the+Son+of+God+was+born+of+the+Virgin+Mary%3F+What+a+monster+is+this+of+an+opinion%2C+that+all+truths+are+equal%3F+That+this+spiritual+house+should+be+all+foundation%2C+no+walls%2C+no+roof%3F+Can+no+man+be+saved+but+he+that+knows+everything+in+Scripture%3F%E2%80%A6+You+see+then+that+both+all+truths+must+not+of+necessity+be+known%2C+and+some+must%3A+and+these+we+justly+call+fundamental%3A+which+who+so+holds%2C+all+his+hay+and+stubble+%28through+the+mercy+of+God%29+condemn+him+not%3A+stil+he+has+right+to+the+church+on+earth%2C+and+hope+in+heaven%3A+but+whither+every+truth+be+fundamental%2C+or+necessary%3A+Discipline+%28you+say%29+is+so%3A+indeed+necessary+to+the+well-being+of+a+church%2C+no+more%3A+it+may+be+true+without+it%2C+not+perfect.+Christ+compares+his+spouse+to+an+army+with+banners%3A+as+order+is+to+an+army%2C+so+is+discipline+to+the+Church%3A+if+the+troops+be+not+well+marshalled+in+their+several+ranks%2C+and+move+not+forward%2C+according+to+the+discipline+of+war%2C+it+is+an+army+still%3A+confusion+may+hinder+their+sucess%2C+it+cannot+bereave+them+of+their+name%3A+it+is+as+beautiful+proportion+to+the+body%2C+an+hedge+to+a+vineyard%2C+a+wall+to+a+city%2C+an+hem+to+a+garment%2C+ceiling+to+an+house.+It+may+be+a+body%2C+vineyard%2C+city%2C+garment%2C+house%2C+without+them%3A+it+cannot+be+well+and+perfect.+Yet+which+of+our+adversaries+will+say+we+have+no+discipline%3F+Some+they+grant%2C+but+not+the+right%3A+as+if+they+said%2C+Your+city+has+a+brick+wall+indeed%2C+but+it+should+have+one+of+hewn+stone%3B+your+vineyard+is+hedged%2C+but+it+should+be+paled+and+ditched%3A+while+they+cavil+at+what+we+want%2C+we+thank+God+for+what+we+have%3B+and+so+much+we+have%2C+in+spite+of+all+detraction%2C+as+makes+us+both+a+true+Church+and+a+worthy+one.+But+the+main+quarrel+is+against+but+ministry+and+form+of+worship%3A+let+these+be+examined%3B+this+is+the+circle+of+their+censure%3A+No+Church%2C+therefore+no+ministry%3B+and+no+ministry%2C+therefore+no+Church%E2%80%A6+What+would+they+have%3F+Have+we+not+competent+gifts+from+aboue%2C+for+so+great+a+function%3F+Are+we+all+unlearned%2C+insufficient%3F+Not+a+man+that+knows+to+devide+the+word+aright%3F+As+Paul+to+the+Corinthins%2C+is+it+so+that+there+is+not+one+wise+man+amongst+us%3F+No+man+will+affirm+it%3A+some+of+them+have+censured+our+excess+in+some+knowledge%3B+none%2C+our+defect+in+all%3A+What+then%3F+Have+we+not+a+true+desire+to+do+faithful+service+to+God+and+his+Church%3F+No+zeal+for+God%E2%80%99s+glory%3F%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+Epistles%2C+the+Second+Volume+%28London%3A+1608%29+%7C+6th+Decade%2C+Epistle+5%E2%80%A6+dissuading+from+Separation+%26+Shortly+Oppugning+the+Grounds+of+that+Error%2C+pp.+50-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa2bba13919.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a2bba13919.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Are%20we%20then%20heretics%2C%20condemned%20in,Church%3F%20No%20zeal%20for%20God%E2%80%99s%20glory&amp;text=Are%20we%20then%20heretics%2C%20condemned%20in%20ourselves%3F%20wherein&amp;text=and%20his%20Church%3F%20No%20zeal%20for%20God%E2%80%99s%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It concerns not our Church alone, but all Christianity, that all to whom the Lord has entrusted any charge in his Church should agree in true concord; we must therefore purposefully and carefully cherish association and friendship with all ministers of Christ… As for me, as far as in me lies, I shall always labor to this end.</p></blockquote>

<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>

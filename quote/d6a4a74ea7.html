<blockquote><p>4. What if many churches, yea all the churches, should offend one, should that one church gather all the rest together, judge them all, and in case of not submitting themselves to her judgement, separate herself from them all? If so, we should have separations and schismes enough, which should be continued to all posterity to come. … 7. What if the churches in their judgements should differ one from another, in such a case should they all by schisms separate themselves one from another?</p></blockquote>

<blockquote><p>I. The Articles of the Christian Belief It is a catechism if you prefix to every article the question, ‘What do you believe?’ There is one only God in three persons, the Father, Son and Holy Ghost: who is infinite in being, power, wisdom and goodness: the Creator of all things, our most absolute Lord, most righteous Governor and most gracious Father. God made man for Himself in his own image, with reason and freewill: endued with wisdom and holiness; and put under him the inferior creatures, for his use: and bound him by the Law of Nature to adhere to God his Maker; to believe Him, fear Him, love Him, honor Him and obey Him with all his powers: moreover forbidding Him to eat of the Tree of Knowledge upon pain of death. Man being tempted by Satan, did willfully sin, and so fell from God and happiness, under the wrath of God, the curse of his Law and the power of the Devil: and hence we are all conceived in sin, and prone to evil, and condemnation is passed upon all; and no mere creature is able to deliver us. God so loved the world that He gave his only Son to be their Redeemer; who being God, and one with the Father did take our nature, and become man; being conceived by the Holy Ghost in the Virgin Mary, and born of her, and called Jesus Christ; and being free from sin, He conquered the tempter, fulfilled all righteousness, revealed the Gospel, and confirmed it by miracles; and gave Himself a sacrifice for our sins, and a ransom for us, in suffering death on the cross, to reconcile us unto God; and was buried, and went among the dead) and rose again the third day, having conquered death; and afterward ascended into heaven where he remains God and Man, in one Person, and is Lord of all, in glory with the Father; the chief Priest, and Prophet, and King of his Church; interceding for us; and teaching and ruling us, by his Spirit, ministers, and Word. The Lord Jesus Christ has ordained in his Testament that all they that receive Him by a true effectual faith, and by true repentance do turn from the flesh, the world, and the Devil unto God, shall freely receive the pardon of their sins, and shall become the sons of God, and heirs of everlasting life, and the Spirit of Christ shall dwell within them: and all that overcome and persevere to the death, shall live with Christ in endless glory: But the unbelievers, impenitent and unholy shall be condemned to everlasting fire. And this He has commanded his ministers to preach to all the world: And has told us that, All that are given Him of the Father, shall come to Him, and that he will in no wise cast them out, nor shall any pluck them out of his hands. The Holy Ghost proceeding from the Father and the Son, did inspire and guide the prophets, apostles, and evangelists, that they might truly and fully reveal the doctrine of Christ, and deliver it in Scripture to the Church as the rule of our faith and life: and by abundance of evident uncontrolled miracles, and wonderful gifts, to be the great witness of Christ, and of the truth of his holy Word. Where the Gospel is made known, the Holy Ghost by it does enlighten the minds of all that shall be saved, and opening and softening their hearts, does draw them to believe in Christ and turns them from the power of Satan unto God: Whereupon they are joined to Christ the Head, and into one holy catholic Church which is his Body, consisting of all true believers: and are freely justified, and made the sons of God; and a sanctified peculiar people unto Him, and do love Him above all, and serve Him sincerely in holiness and righteousness, loving and desiring the communion of the saints; overcoming the flesh, the world and the Devil, and hoping for Christ’s second coming, and for everlasting life. At death the souls of the justified go to happiness with Christ, and the souls of the wicked to misery: And at the end of this world the Lord Jesus Christ will come again, and will raise the bodies of all men from the dead; and will judge all according to their works; And the righteous shall go into everlasting life, and the rest into everlasting punishment: All this I do unfeignedly believe. II. Our Consent to the Gospel Covenant, with God the Father, Son and Holy Ghost, by which we are Christians and members of the catholic Church Question: Are you willing and resolved to give up yourself to God the Father, Son and Holy Ghost, according to the Gospel doctrine which your profess? Repenting of my sins and renouncing the flesh, the world and the devil, I do take this one God to be my only God, and do heartily give up myself unto Him; even to the Father, as my Creator and reconciled Father in Christ: And to his Son Jesus Christ, as my Lord, and only Savior, to reconcile and bring me unto God: And to the Holy Ghost as my Sanctifier; that He may further illuminate, sanctify and confirm me, and I may hold fast and obey the doctrine of Christ, which was revealed by his inspiration, and witnessed by his gifts and miracles, and is now contained in the Holy Scriptures; and that he may be in me the earnest of my everlasting happiness with God. III. The Sum of Christian Duty Question: What are [???…] Christ has appointed that fit men shall be ordained his ministers, to preach the Gospel to the nations of the world, and make them his disciples, baptizing them in the name of the Father, Son and Holy Ghost: and to congregate his disciples, and to oversee and guide the several congregations, and each member thereof: particularly, to teach them the Word of God; to pray and praise God with them and for them to administer the Lord’s Supper in remembrance of Him; especially on the Lord’s Day, which He has appointed for holy communion in such works: Also to rebuke with authority the scandalous and unruly; and to bind and reject those that are obstinately impenitent, and unreformed; and to absolve and restore the penitent, and confirm the weak. It is therefore the people’s duty to join with such churches, for the aforesaid worship of God; and to know, hear, submit to, and obey these their guides that are over them in the Lord; and to avoid division and discord, and to live in unity, love and peace. The secret duties of holiness are these: The exercise of faith, repentance, love, hope, delight in God, and all other graces; The mortifying of our sins; especially atheism, unbelief, and unholiness; hardness of heart, disobedience and unthankfulness, flesh-pleasing, covetousness, and pride; The diligent examining of our own hearts, about our estates, our duties, and our sins: meditating upon God, and his Word and works; especially of our redemption by Jesus Christ; and of death, Judgment, heaven, and Hell; watching diligently over our thoughts, affections, words and actions: resisting temptations: And frequent and fervent prayer to God, in the name of Christ, with confession, thanksgiving, and cheerful praises; Parents and masters must diligently teach their children and servants the Word and fear of God, and pray with them and for them, and hinder them from sin, and use all their power that they and their households may serve the Lord: children and servants must willingly learn and obey: We must seek instruction in the matters of our salvation, especially of our teachers: we must take heed of the company of tempting and ungodly persons, and delight in the company and help of the godly: We must lovingly and faithfully give, and thankfully receive admonitions and exhortations: confessing our faults one to another: and by prayer, psalms, and edifying conference, and a holy conversation, provoking one another to love, and to good works. Superiors must rule for God and the common good, with justice and mercy: Inferiors must honor and obey them in the Lord: We must not injure, but preserve the life, chastity, estate, name, and rights of our neighbor: Not seeking our own against his welfare, but doing as we would be done by; forbearing and forgiving; and loving our neighbor as ourselves: Yea loving our enemies; and doing good to all according to our power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, The Christian Religion expressed: I. briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II. more largely in a Profession taken out of the Holy Scriptures, containing 1. the articles of the Christian Belief, 2. our consent to the Gospel Covenant, 3. the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660) | The Profession of the Christian Religion. See the original for the Scripture proofs.</span></figcaption>

ll+that+shall+be+saved%2C+and+opening+and+softening+their+hearts%2C+does+draw+them+to+believe+in+Christ+and+turns+them+from+the+power+of+Satan+unto+God%3A+Whereupon+they+are+joined+to+Christ+the+Head%2C+and+into+one+holy+catholic+Church+which+is+his+Body%2C+consisting+of+all+true+believers%3A+and+are+freely+justified%2C+and+made+the+sons+of+God%3B+and+a+sanctified+peculiar+people+unto+Him%2C+and+do+love+Him+above+all%2C+and+serve+Him+sincerely+in+holiness+and+righteousness%2C+loving+and+desiring+the+communion+of+the+saints%3B+overcoming+the+flesh%2C+the+world+and+the+Devil%2C+and+hoping+for+Christ%E2%80%99s+second+coming%2C+and+for+everlasting+life.+At+death+the+souls+of+the+justified+go+to+happiness+with+Christ%2C+and+the+souls+of+the+wicked+to+misery%3A+And+at+the+end+of+this+world+the+Lord+Jesus+Christ+will+come+again%2C+and+will+raise+the+bodies+of+all+men+from+the+dead%3B+and+will+judge+all+according+to+their+works%3B+And+the+righteous+shall+go+into+everlasting+life%2C+and+the+rest+into+everlasting+punishment%3A+All+this+I+do+unfeignedly+believe.+II.+Our+Consent+to+the+Gospel+Covenant%2C+with+God+the+Father%2C+Son+and+Holy+Ghost%2C+by+which+we+are+Christians+and+members+of+the+catholic+Church+Question%3A+Are+you+willing+and+resolved+to+give+up+yourself+to+God+the+Father%2C+Son+and+Holy+Ghost%2C+according+to+the+Gospel+doctrine+which+your+profess%3F+Repenting+of+my+sins+and+renouncing+the+flesh%2C+the+world+and+the+devil%2C+I+do+take+this+one+God+to+be+my+only+God%2C+and+do+heartily+give+up+myself+unto+Him%3B+even+to+the+Father%2C+as+my+Creator+and+reconciled+Father+in+Christ%3A+And+to+his+Son+Jesus+Christ%2C+as+my+Lord%2C+and+only+Savior%2C+to+reconcile+and+bring+me+unto+God%3A+And+to+the+Holy+Ghost+as+my+Sanctifier%3B+that+He+may+further+illuminate%2C+sanctify+and+confirm+me%2C+and+I+may+hold+fast+and+obey+the+doctrine+of+Christ%2C+which+was+revealed+by+his+inspiration%2C+and+witnessed+by+his+gifts+and+miracles%2C+and+is+now+contained+in+the+Holy+Scriptures%3B+and+that+he+may+be+in+me+the+earnest+of+my+everlasting+happiness+with+God.+III.+The+Sum+of+Christian+Duty+Question%3A+What+are+%5B%3F%3F%3F%E2%80%A6%5D+Christ+has+appointed+that+fit+men+shall+be+ordained+his+ministers%2C+to+preach+the+Gospel+to+the+nations+of+the+world%2C+and+make+them+his+disciples%2C+baptizing+them+in+the+name+of+the+Father%2C+Son+and+Holy+Ghost%3A+and+to+congregate+his+disciples%2C+and+to+oversee+and+guide+the+several+congregations%2C+and+each+member+thereof%3A+particularly%2C+to+teach+them+the+Word+of+God%3B+to+pray+and+praise+God+with+them+and+for+them+to+administer+the+Lord%E2%80%99s+Supper+in+remembrance+of+Him%3B+especially+on+the+Lord%E2%80%99s+Day%2C+which+He+has+appointed+for+holy+communion+in+such+works%3A+Also+to+rebuke+with+authority+the+scandalous+and+unruly%3B+and+to+bind+and+reject+those+that+are+obstinately+impenitent%2C+and+unreformed%3B+and+to+absolve+and+restore+the+penitent%2C+and+confirm+the+weak.+It+is+therefore+the+people%E2%80%99s+duty+to+join+with+such+churches%2C+for+the+aforesaid+worship+of+God%3B+and+to+know%2C+hear%2C+submit+to%2C+and+obey+these+their+guides+that+are+over+them+in+the+Lord%3B+and+to+avoid+division+and+discord%2C+and+to+live+in+unity%2C+love+and+peace.+The+secret+duties+of+holiness+are+these%3A+The+exercise+of+faith%2C+repentance%2C+love%2C+hope%2C+delight+in+God%2C+and+all+other+graces%3B+The+mortifying+of+our+sins%3B+especially+atheism%2C+unbelief%2C+and+unholiness%3B+hardness+of+heart%2C+disobedience+and+unthankfulness%2C+flesh-pleasing%2C+covetousness%2C+and+pride%3B+The+diligent+examining+of+our+own+hearts%2C+about+our+estates%2C+our+duties%2C+and+our+sins%3A+meditating+upon+God%2C+and+his+Word+and+works%3B+especially+of+our+redemption+by+Jesus+Christ%3B+and+of+death%2C+Judgment%2C+heaven%2C+and+Hell%3B+watching+diligently+over+our+thoughts%2C+affections%2C+words+and+actions%3A+resisting+temptations%3A+And+frequent+and+fervent+prayer+to+God%2C+in+the+name+of+Christ%2C+with+confession%2C+thanksgiving%2C+and+cheerful+praises%3B+Parents+and+masters+must+diligently+teach+their+children+and+servants+the+Word+and+fear+of+God%2C+and+pray+with+them+and+for+them%2C+and+hinder+them+from+sin%2C+and+use+all+their+power+that+they+and+their+households+may+serve+the+Lord%3A+children+and+servants+must+willingly+learn+and+obey%3A+We+must+seek+instruction+in+the+matters+of+our+salvation%2C+especially+of+our+teachers%3A+we+must+take+heed+of+the+company+of+tempting+and+ungodly+persons%2C+and+delight+in+the+company+and+help+of+the+godly%3A+We+must+lovingly+and+faithfully+give%2C+and+thankfully+receive+admonitions+and+exhortations%3A+confessing+our+faults+one+to+another%3A+and+by+prayer%2C+psalms%2C+and+edifying+conference%2C+and+a+holy+conversation%2C+provoking+one+another+to+love%2C+and+to+good+works.+Superiors+must+rule+for+God+and+the+common+good%2C+with+justice+and+mercy%3A+Inferiors+must+honor+and+obey+them+in+the+Lord%3A+We+must+not+injure%2C+but+preserve+the+life%2C+chastity%2C+estate%2C+name%2C+and+rights+of+our+neighbor%3A+Not+seeking+our+own+against+his+welfare%2C+but+doing+as+we+would+be+done+by%3B+forbearing+and+forgiving%3B+and+loving+our+neighbor+as+ourselves%3A+Yea+loving+our+enemies%3B+and+doing+good+to+all+according+to+our+power.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Profession+of+the+Christian+Religion.+See+the+original+for+the+Scripture+proofs.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a4aed3395.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a4aed3395.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=I.%20The%20Articles%20of%20the%20Christian,to%20all%20according%20to%20our%20power&amp;text=I.%20The%20Articles%20of%20the%20Christian%20Belief%20It&amp;text=doing%20good%20to%20all%20according%20to%20our%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As for schismatics, that is, those who separate themselves from true Christian churches for some slight cause, whether in doctrine or discipline, our theologians distinguish between the authors of the schism and the people deceived by them. As for the authors of the schism, since they break the bond of charity, they acknowledge that they cannot belong to the invisible Church, whose bond and communion consist in faith, hope, and charity. But concerning the deceived people or those born in schism, they are less rigid and believe that there can be good men among them, not alien to the body of Christ but joined to it by true faith and charity; nor do they entirely exclude schismatic churches from the visible Church if they retain the foundations of doctrine and discipline, since they reserve this honor only for those who deny and overthrow the fundamentals of faith and discipline.</p></blockquote>

<blockquote><p>…whatsoever a man holds, though his conscience be never so much taken with it, yet if it cannot stand with the power of godliness, but destroys it, if this man be in a Christian society after all means used to reduce him, if he still perseveres in it, he is, notwithstanding his conscience, to be cast out of the society of the saints; This is not a little matter, if a man has any conscience in him, it cannot but be a dreadful thing to him: If poison be got into a glass, and you cannot wash it out, the poison and glass too is to be thrown into the sink: Such a man as this is, with the conscience that he has, is to be thrown upon the dunghill. If a man by his wickedness cuts himself off from the mystical body of Christ, the Church may cut him off from his visible, he has forfeited his Church-priviledge.</p></blockquote>

<blockquote><p>[Margin note:] Schism and actual gathering of churches out of churches cannot be tolerated. 3. Such opinions and practice as make an evident schism in a Church and set up two distinct Churches of different forms of government, and pretending to different institutions of Christ, of which the one must by the nature of their principles labor the destruction of the other, cannot be tolerated, etc. for each pretending their fellow Churches to be of man, and so of the devil, though they should both make one true invisible Church, agreeing in all fundamentals and many other truths, yet sure the whole should be a kingdom divided against itself, and this destroys peace and unity. And if Paul could not endure the divisions of one and the same Church of Corinth, though they pretended not to be different Churches, for those that said they were of Paul professed they could not be disciples of Peter, but he sharply rebuked them as carnal men and such as divided Christ, and by consequence must say Paul was crucified for them and was their redeemer, and so, if obstinately they had proceeded in that separation, Paul would have gone on to higher censures of the Church: far more could he not endure gathering of true Churches out of true Churches, which is the professed practice of Independents: And yet both sides pretending the spirit of discerning could say, ‘The Spirit testifies to my soul that Paul is the only called preacher,’ and the other, ‘Nay but to my discerning, Cephas or Peter is the only man that I can hear or follow.’ And a third, ‘Nay, not any on earth, nor any ministry will I acknowledge but Jesus Christ, whom the heavens must contain till the last day is my only, only preacher.’ Now if a Jezabel come in and say no ministry is to be heard but Christ and turn away all from hearing the Word, and not suffer Sergius Paulus or any other to hear Paul or any godly minister, sure Jezabel should be a perverter of the right ways of the Lord and so not suffered.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f207c9e0fe" data-kw="">
<blockquote><p>…those dreamers who have a spirit of bitterness and contradiction, who reprove everything and prevent the order of nature. We will see some who are so deranged, not only in religion but who in all things reveal their monstrous nature, that they will say that the sun does not move, and that it is the earth which shifts and turns. When we see such minds we must indeed confess that the devil posses them, and that God sets them before us as mirrors, in order to keep us in his fear. So it is with all who argue out of pure malice, and who happily make a show of their imprudence. When they are told: “That is hot,” they will reply: “No, it is plainly cold.” When they are shown an object that is black, they will say that it is white, or vice versa. Just like the man who said that snow is black; for although it is perceived and known by all to be white, yet he clearly wished to contradict the fact. And so it is that they are madmen who would try to change the natural order, and even to dazzle eyes and benumb their senses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on 1 Corinthians 10:19-24’ in Calvini Opera Selecta, Corpus Refomatorum, Vol 49, p. 677, tr. Robert White in ‘Calvin &amp; Copernicus: the Problem Reconsidered’ in Calvin Theological Journal 15 (1980)</cite>, pp. 236-237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-6a3cda8d11" data-kw="">
<blockquote><p>But even according to what was said above (A. 2), that these names signify the divine substance, although in an imperfect manner, it is also clear from what has been said (AA. 1, 2) that they have diverse meanings. For the idea signified by the name is the conception in the intellect of the thing signified by the name. But our intellect, since it knows God from creatures, in order to understand God, forms conceptions proportional to the perfections flowing from God to creatures, which perfections pre-exist in God unitedly and simply, whereas in creatures they are received and divided and multiplied. As therefore, to the different perfections of creatures, there corresponds one simple principle represented by different perfections of creatures in a various and manifold manner, so also to the various and multiplied conceptions of our intellect, there corresponds one altogether simple principle, according to these conceptions, imperfectly understood. Therefore although the names applied to God signify one thing, still because they signify that under many and different aspects, they are not synonymous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 13 | art. 4, I answer that</cite></span></figcaption>

</figure><figure class="quote" id="q-074219182d" data-kw="">
<blockquote><p>Seventhly, some may ask in what space did God make the world? I answer: God could have made the world and all things in it in one moment: but He began and finished the whole work in six distinct days. [This phrase is likely opposed to those in the early and Medieval Church who taught that the six days were but one day repeated six times.] In the first day He made the matter of all things and the light… and in the end of the sixth day He made man. Thus in six distinct spaces of time, the Lord did make all things: and that especially for three causes: I. To teach men that they ought to have a distinct and serious consideration of every creature: for if God had made the world in a moment, some might have said, this work is so mystical that no man can speak of it. But for the preventing of this cavil, it was his pleasure to make the world and all things therein in six days: and the seventh day He commanded it to be sanctified by men, that they might distinctly and seriously meditate upon every work of the creation. II. God made the world and every thing therein in six distinct days, to teach us what wonderful power and liberty He had over all his creatures: for He made the light when there was neither sun nor moon, nor stars: to show that in giving light to the world, He is not bound to the sun, to any creature or to any means: for the light was made the first day: but the sun, the moon and the stars were not created before the fourth day. Again, trees and plants were created the third day: but yet the sun, moon and the stars, and rain which nourish and make herbs, trees and plants to grow were not created till after the third day: which shows plainly that God can make trees, plants and herbs to grow without the means of rain, and without the virtue and operation of the sun, the moon and the stars. III. He made the world in six distinct days and framed all things in this order to teach us his wonderful providence of his creatures: for before man was created He provided for him a dwelling place and all things necessary for his perpetual preservation and perfect happiness and felicity. So also He created beasts and cattle: but not before He had made herbs, plants and grass, and all means whereby they are preserved. And if God had this care over man when as yet He was not: much more will God have care over him now when he is, and has a being in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles… (London, 1595)</cite>, pp. 62-63</span></figcaption>

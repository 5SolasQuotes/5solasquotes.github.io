<blockquote><p>The Covenant which God makes with man is a sure Covenant. Hence called a Covenant of Salt, Numb. 18. 19. Because Salt preserves from perishing and putrefaction. The Covenant of God with man about temporal things is called a Covenant of Salt, and a Covenant for ever, 2 Chron. 15. 3.

For though his Covenant about temporal things (as all temporals must) hath an end of termination, yet it hath no end of corruption; time will conclude it, but time cannot violate it. But as for his Covenant about eternal things, that, like eternity knows not only no end of corruption, but none of termination.

Although my House (saith gasping David) be not so with God, yet be hath made with me an everlasting Covenant, ordered in all things and sure: for this is all my salvation and all my desire, although he make it not to grow, 2 Sam. 23. 5. And what is it that makes the Covenant of God with man thus sure? Sure not only in it self, but (as the Apostle speaks) to all the seed, Rom 5. 16. Is it not this, because it hath a strong foundation, a double, impregnable foundation? First, his own free grace. Secondly, the blood of Christ; which is therefore also called, the blood of the Covenant, Heb. 10. 29. Because of all this, this All, which hath an infinity in it, The Lord God hath made with us a sure Covenant.</p></blockquote>

<blockquote><p>5. They differ [objecto] in the object. The chief object concerned in the first covenant was all mankind, (though it referred to Adam more immediately,) the first man being the root, spring, and representative head of all mankind. Adam was the first person with whom this covenant was made, yet it was not only personal, but comprehensive, and extended to all man’s posterity, therefore when he violated that covenant, it was imputed to us, his fault was our guilt; “for in Adam all sinned,” see Rom. v. 12, 16. But this second covenant is personal, it is contracted with individual souls; it is true, the general grant is to all, the proclamation is universal, whosoever will, it is offered promiscuously but the saving benefits of this covenant reach no further with respect to persons at age, than those that by faith apply them, by particularly laying hold of this blessed covenant; it is only the seed, believers, heirs of the promise, children of the covenant, that are sharers in it, Gal. iii. 22.

6. The first covenant, and this new gospel covenant differ [materia] in the matter, or good things promised, in the former God promised life only, “Do this and live”; he did not promise continuance of life absolutely, but upon condition of man’s obedience, nor yet his restitution in case he fell, for fall once, and fall finally, there is no recovery by virtue of that old covenant. But now by this gospel covenant, God promiseth many rich blessings which in this our fallen state are needful for us, as pardon of sin, reconciliation, adoption, sanctification, means of grace, daily supports, perseverance, a crown of glory ; God gives grace and glory by virtue of it, and what tends to both, and that immutably without failure or defectibility; see Jer. xxxi. 34—36. xxxiii. 20, 21. Isa. liv. 9, 10.

7. They differ [conditionibus] in the conditions of both; indeed some say obedience is the condition on man’s part under both covenants, but surely not the same obedience, the former required personal, perfect, absolute, and perpetual obedience to the commands, both moral and positive, without any deviation to the right-hand, or to the left, if he failed in the least punctilio, he was under the curse, Gal. iii. 10; and this obedience must be performed by strength of grace received in his first creation; since man was able to perform it, this condition was highly reasonable. But in the gospel covenant the great condition is faith; a free acceptance of the offered grace, an unfeigned faith, which is not an antecedent condition to the making of the covenant, but subsequent, or intermediate for man’s laying hold, and receiving the benefits thereof; yea, God promiseth and worketh what he requires; all faith, repentance, and new obedience, are the gifts of free grace; grace doth all, Rom. iv. 16</p></blockquote>

<blockquote><p>For manner of administration this covenant [of grace] is diverse, as it pleased God in sundry ways to dispense it; but for substance it is one—the last, unchangeable, and everlasting. One, for Jesus Christ is the same yesterday, and today, and forever. The last, for it succeeded the covenant of works, but none shall succeed it. (Heb. 13:8) In it God has revealed his whole pleasure concerning the salvation of man, and has manifested his principal properties, the riches of his grace, wherein he delights to be magnified. He who is not saved by the covenant of grace must and shall perish everlastingly. Unchangeable and everlasting, for therein God has revealed Himself, with respect to the things He wills concerning man’s salvation, to be one and the same forever. There is no other relation or respect that might give occasion to another covenant. It was the pleasure of God to show mercy to miserable man; but he will not extend compassion to him who obstinately and willfully contemns the riches of his grace. The covenant made with Adam in the state of innocence is altered for our great good and comfort; but this covenant is like the covenant of the day and of the night—it stands fast forever and ever. (Isa. 24:5; Ps. 111:9) Though men are unfaithful, God continues faithful; he waits for the conversion of those who go astray, and if they return, he will receive them into favor. (1 Sam. 7:3; Dt. 4:31; Jer. 3:1-2; Rom. •:6 &amp; 11:1, •9) The Lord will not utterly cast off that people whom he has once chosen and received unto mercy. And with respect to the life to come, the covenant is eternal; for after this life the people effectually in covenant shall live with the Lord forever. (Hos. 13:14; Mt. 22:32)</p></blockquote>

</figure><figure class="quote" id="q-d64f9341df" data-kw="">
<blockquote><p>The word Testament is a Latin word, whereby the Greek word Diatheke is rendered, which the Greek Translators use to express the Hebrew word Berith, that is, Covenant. And thereby is properly understood the Covenant itself, which God hath made with mankind upon certain conditions to give them everlasting life: which Covenant is twofold, the Old and the New.

The Old is that which God made with the first man before the fall, wherein eternal life was promised upon condition of a thoroughly perfect, and keeping of the Law; and is therefore called the Legal Covenant, which God again propounded to the Israelites, that from thence they might learn to understand (seeing this condition is transgressed by all men, and can now be fulfilled by no man) that they must seek their salvation in another Covenant, which is called the New [Covenant,] and consisteth in this: That God hath appointed his Son for a Mediator, and promiseth eternal life upon condition that we believe in him; and is called the Covenant of Grace.

And this also in regard of the several administrations thereof unto mankind is called Old and New. The Old is the administration of the Covenant before the coming of the Mediator, which was promised to Abraham and his posterity [to come] of his seed, and prefigured by manifold Ceremonies laid down by Moses. The New is the administration of the same Covenant, since the Son of God, the Mediator of this Covenant came in the flesh, and hath accomplished man’s reconciliation with God. These two Covenants are of one kind as concerning their substance, forasmuch as in both forgiveness of sins, salvation and eternal life are promised upon condition of faith in the Mediator: but are different in respect of their several administrations, which in the New is much clearer, without figures, and extends itself unto all Nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-haak.html">Theodore Haak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Argument of the New Testament in The Dutch Annotations upon the Whole Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-60381d9307" data-kw="">
<blockquote><p>Congregation, recognize the truth expounded here in its essence and commended for the profit of your souls. This truth that was sealed by Jesus’ suffering and death can free us from the evil of sin through the power of the Spirit. Oh, that your hearts would desire to see, to use prudently, and to profit from that which concerns your eternal salvation. These few pages are a treasure that contains everything that is able to satisfy you eternally. Learn here to know the God of gods and how through worship to be affected by the Holy Word; here learn how truly to pray to the Triune God—Father, Son, and Holy Spirit—exalting His being, honouring His name, recognizing His glories.

Wisely and holily, He accomplishes what He eternally decrees concerning creation and providence. He displays His service and gives His laws to reasonable creatures that they might know what leads them to true virtue. Behold here the first man, glorious in covenant with God, then sadly falling into sin and guilt and slavery to Satan. Behold how he was plunged into death, swept into the abyss by a thousand evils. Note God’s Son, moved to compassion, fulfilling God’s righteousness, displaying pity in the covenant of peace, our Mediator.

Note His sweet-sounding names, His natures, His offices, and how He brought redemption for our endangered souls. Observe that God’s Son in both His low and His exalted estates obtained God’s sweet honeycombs, medicine for our souls. He called His child, gave her new life, faith, salvation, righteousness, and holiness. And by godly living, praying, and watching, she is made a participant in full assurance by Him when He uses baptism and the Lord’s Supper as seals for heart and mouth. He shows His love and strengthens His partner in their holy covenant.

Behold mankind, which shall surely die and be raised again to receive its judgment on the last day. Then the ungodly will receive eternal woe, but God’s people, chosen for salvation, will be jubilant. Oh! What a holy outcome for Jesus’ followers, gathered here on earth and guided by heaven’s Word and Spirit. They will taste this salvation for all eternity, and after their struggle they will come to the eternal, blessed, joyful feast. Oh, come and see, savour the truth—so blessed in its radiance and clarity for those who see it with the Spirit’s help. Beg for light, that you may find life in the treasury of exalted truth, the rock on which God’s people build.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-schortinghuis.html">Wilhelmus Schortinghuis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essential Truths in the Heart of a Christian</cite>, trans. Harry Boonstra and Gerrit W. Sheeres, ed. James A. De Jong (1738; Grand Rapids MI: Reformation Heritage Books, 2009), pp 29-30.</span></figcaption>

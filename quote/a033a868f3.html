<main class="wrap"><figure class="quote" id="q-a033a868f3" data-kw="">
<blockquote><p>Now, such were the innovations of the late hierarchists. In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, 8:28.</span></figcaption>

<blockquote><p>3. Touching the material parts of the sacrament, what elements He appointed: even such as of all other are of most general use among all nations, bread and wine, those which most befit a common salvation, Jude verse 2, and a common Savior, 1 John 2:1.

<blockquote><p>On the second point, when God is worshipped by inventions of men, he condemns this “fear” as superstitious, though men endeavour to cloak it under a plausible pretence of religion, or devotion, or reverence. He assigns the reason, that it “hath been taught by men.” I consider מלמדה (mĕlŭmmādāh)1 to have a passive signification; for he means, that to make “the commandments of men,” and not the word of God, the rule of worshipping him, is a subversion of all order. But it is the will of the Lord, that our “fear,” and the reverence with which we worship him, shall be regulated by the rule of his word; and he demands nothing so much as simple obedience, by which we shall conform ourselves and all our actions to the rule of the word, and not turn aside to the right hand or to the left. Hence it is sufficiently evident, that those who learn from “the inventions of men” how they should worship God, not only are manifestly foolish, but wear themselves out by destructive toil, because they do nothing else than provoke God’s anger; for he could not testify more plainly than by the tremendous severity of this chastisement, how great is the abhorrence with which he regards false worship. The flesh reckons it to be improper that God should not only reckon as worthless, but even punish severely, the efforts of those who, through ignorance and error, weary themselves in attempts to appease God; but we ought not to wonder if he thus maintains his authority. Christ himself explains this passage, saying, “In vain do they worship me, teaching doctrines, the commandments of men.” (Matt. 15:9.) Some have chosen to add a conjunction, “teaching doctrines and commandments of men,” as if the meaning had not been sufficiently clear. But he evidently means something different, namely, that we act absurdly when we follow “the commandments of men” for our doctrine and rule of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, trans. William Pringle (repr. Bellingham, WA: Logos Bible Software, 2010), 2.324–25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5c50f1c820" data-kw="">
<blockquote><p>The gospel after the fall was revealed in the form of a free and absolute promise of a Savior with salvation in Him to lost sinners of mankind. It was then promised that the seed of the woman would bruise the head of the serpent (Gen. 3:15). The gospel was preached to Abraham also under the form of an absolutely free promise: in thee and in thy seed shall all the nations of the earth be blessed (see Gen. 12:3; 22:18; Gal. 3:8). In the gospel, salvation from sin, from the curse of the law, and from the wrath of God, as well as restoration to fellowship with God, conformity to Him, and the eternal enjoyment of Him are graciously promised in Christ to all who cordially believe in Him. The Lord promises in His gospel that He will give His Holy Spirit to elect sinners to quicken their dead souls; to enlighten their dark minds; to enable them to believe in Jesus; to repent of their sins after a godly sort; to love, obey, and enjoy Him now; and to attain the perfect fruition of Him forevermore. In the gospel, as preached under the Old Testament, were promises of the coming of Messiah in human nature; and in the same gospel, as preached under the New, are promises of the coming of the Spirit, or of Christ’s coming in a greater measure of spiritual influences. These promises are, in the gospel, presented or offered to sinners in common and are made and performed to such sinners as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 95–96.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cfae9ab62b" data-kw="">
<blockquote><p>And this is clear by all covenants in the Word of God: even the covenant between God and man is in like manner mutual — “I will be your God, and ye shall be my people.” The covenant is so mutual, that if the people break the covenant, God is loosed from his part of the covenant, Zech. 11:10. The covenant gives to the believer ‘a sort of action of law,’ and jus quoddam, to plead with God in respect of his fidelity to stand to that covenant that binds him by reason of his fidelity, Isa. 43:26; 63:16; Dan. 9:4-5;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 54</span></figcaption>

</figure><figure class="quote" id="q-fb228d71e6" data-kw="">
<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners (Acts 5:30–31; 2:36; 1 Cor. 1:22–24).</p></blockquote>

<blockquote><p>Christ weeps to us in the law, but we do not lament; and He pipes to us in the gospel, but we do not dance: He is willing to draw us with the cords of men and with the bands of love, and yet we will not have Him to reign over us… Christ has now given us the first and second summons, the day is approaching when the sad and woeful summons shall be sent against us, of departing from Him into these everlasting flames, out of which there is no redemption.</p></blockquote>

</figure><figure class="quote" id="q-c774472096" data-kw="">
<blockquote><p>[For He does not punish from his heart] it arises not from God’s voluntary desire, but from the sin of man that God punishes; [and makes sorrowful the children of men] gives them cause by afflicting them to be vexed and grieved. Doctrine. [for etc.] sin constrains the Lord to afflict his dearest children: for the reasons hereof, see verse 27. … Doctrine. [not punish from his heart] God takes no delight in afflicting his children, Ps. 81:13; Isa. 1:24. The use is to teach us, first, to abhor their profaneness that say God sports Himself in punishing man. Secondly, by his example, to censure others with all remorse and pity, not delighting to disgrace them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-udall.html">John Udall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, (London: Orwin, 1593), ch. 3, on v. 33, p. 127</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3256f8381d" data-kw="">
<blockquote><p>…here are rules of order for the outward fashion of praying and prophesying; these may be as variable as the other are constant, it is no more possible to fit all Churches and countries with one form than to fit all bodies with one suit, or all limbs with one size…. They, exercising these manly functions, presumed to take upon them manly fashions; whereas therefore bare-headedness was in Corinth, as also in all Greece and Rome a token of honor and superiority, and covering the head a token of subjection; these forward women usurp upon the fashions of their husbands, and will have their faces seen as well as their voices heard;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (d. 1656; 1660), ‘The Women’s Vail: or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… upon 1 Cor. 11:10, Occasioned by an offence unjustly taken at a Modest Dress’, p. 237</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

0their%20voices%20heard" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87f72e989e" data-kw="">
<blockquote><p>This thesis argues that in 1 Corinthians 11:2-16 Paul asserts most centrally that women should wear head coverings while praying and prophesying in the Corinthian Christian assembly. I examine the honor and shame value system of the Greco-Roman world, both generally and in specific reference to head adornment, since head coverings and hairstyles were connected to honor and status. Then I look at Paul’s treatment of honor and shame throughout 1 Corinthians, which denounces the worldly value system of status seeking in favor of the value system of the cross. Paul’s stance leads him to subject cultural norms to gospel values…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/april-m-hoelke.html">April M. Hoelke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposed Heads &amp; Exposed Motives</cite>, (Gardner-Webb Univ., 2014) 125 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-c7f59003ee" data-kw="">
<blockquote><p>Argument 9. If any perhaps should not be moved by these arguments, but should contend, the apostle opposes to their contentious apologies the received and established custom of the Jews and the rest of the Churches: Other Churches have no such custom that women should be present at public assemblies with their heads uncovered, and the man with his head covered: Therefore your custom not agreeing with decency, either according to natural use, or of the Churches, is altogether unseemly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(London</cite>, 1659), on 1 Cor. 11, ‘The Seventh Article concerning Order &amp; Decency’ | On v. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Argument 9. If any perhaps should not be moved by these arguments, but should contend, the apostle opposes to their contentious apologies the received and established custom of the Jews and the rest of the Churches: Other Churches have no such custom that women should be present at public assemblies with their heads uncovered, and the man with his head covered: Therefore your custom not agreeing with decency, either according to natural use, or of the Churches, is altogether unseemly.”

— David Dickson, (London, 1659), on 1 Cor. 11, ‘The Seventh Article concerning Order &amp; Decency’ | On v. 16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CArgument+9.+If+any+perhaps+should+not+be+moved+by+these+arguments%2C+but+should+contend%2C+the+apostle+opposes+to+their+contentious+apologies+the+received+and+established+custom+of+the+Jews+and+the+rest+of+the+Churches%3A+Other+Churches+have+no+such+custom+that+women+should+be+present+at+public+assemblies+with+their+heads+uncovered%2C+and+the+man+with+his+head+covered%3A+Therefore+your+custom+not+agreeing+with+decency%2C+either+according+to+natural+use%2C+or+of+the+Churches%2C+is+altogether+unseemly.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+%28London%2C+1659%29%2C+on+1+Cor.+11%2C+%E2%80%98The+Seventh+Article+concerning+Order+%26+Decency%E2%80%99+%7C+On+v.+16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7f59003ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7f59003ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=Argument%209.%20If%20any%20perhaps%20should,of%20the%20Churches%2C%20is%20altogether%20unseemly&amp;text=Argument%209.%20If%20any%20perhaps%20should%20not%20be&amp;text=use%2C%20or%20of%20the%20Churches%2C%20is%20altogether%20unseemly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f25aa18f93" data-kw="">
<blockquote><p>But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fides Catholica</cite>, … (London, 1661), ch. 1, question 6, p. 82 Annand (1633–1689) was born and educated in Scotland (University of Aberdeen, 1649) and took another degree at Oxford in 1655. He was ordained by an Irish bishop and wrote the following as an Anglican minister against the English puritans upon the restoration of King Charles II. He then served as a Scottish minister from 1663-1689.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.”

</figure><figure class="quote" id="q-f9ceab92ff" data-kw="">
<blockquote><p>He prescribes not a rule necessary every where to be observed; but accommodates himself unto the custom then observed among the Corinthians. It is admirably expounded by Alting… Almost all Christians have observed the canon of the apostle. Not because the uncovering of the head is counted a token of reverence; for with a very great part of the world it is not so to this day. But as my [Herman] Witsius thinks, Videtur potius perinere ad libertatem Novi Testamenti [This seems to more pertain to the liberty of the New Testament].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cotton-mather.html">Cotton Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblica Americana, America’s First Bible Commentary</cite>, vol. 9 (†1652; Tubingen: Siebeck, 2018), p. 265 on 1 Cor. 11:4</span></figcaption>

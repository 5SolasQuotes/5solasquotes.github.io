<main class="wrap"><figure class="quote" id="q-9a6ae500e9" data-kw="">
<blockquote><p>…ye are full Donatists [early Church heretics]… you do agree with them in the sum and substance of all the fowlest things…: …

2. That ye condemn all the Churches in Europe which profess the Gospel… that their worship is blasphemous idolatry, in as much as they have liturgies… …

3. That ye confound errors and heresies, as to make all errors heresies… … 5. That ye deny the distinction of errors fundamental and not fundamental… … 13. That ye deny men are to join in that worship where any errors whatsoever do appear, and are not reformed, and so open a most wide gap unto all schisms… … 28. That ye maintain that no fault is to be tolerated in the church: but if any private man do espy a fault and reprove it, if they will not amend it, he is to forsake that church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Reply unto the Last Printed Books of Henry Barrow &amp; John Greenwood, the Chief Ringleaders of our Donatists in England</cite>, … (London, 1591), pp. 95-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d66a33c40b" data-kw="">
<blockquote><p>Because there is some burthensome servitude in every Church: in some more mild, in others more hard; and the sorrows of such servitude and burdens should be comforted by the brethren and not increased by their condemnation, so long as the foundation is retained; Melanchthon, Consil. pt. 2, fol. 92.</p></blockquote>

</figure><figure class="quote" id="q-fab792f8a8" data-kw="">
<blockquote><p>You [the opponent] suggest that nonconformists think they may quit the communion of the Church if [the Church is defective] in their opinion, nor in the truth in every point… [McWard responds:]… in [the] name of all true nonconformists… it is not every real difference in profession or practice that they hold to be a sufficient cause; Nor do they judge that, even the cause being sufficient, the separation should be always carried to the extremity; but the sound and clear rule which they propose for Christian practice in this matter is that where the controverted difference is such as would render a conjunction therein either sinful or contagious [Mt. 16:6; 1 Cor. 5:6; 15:33; Rev. 18:4], then a just and proportionate separation, precisely and with all tenderness, commensurate to the exigence, is the safer course.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contagiousness</cite>, The True Non-Conformist... (Amsterdam, 1671), Dialogue 1, pp. 6-7 McWard was a resisting Scottish covenanter, and a disciple of Samuel Rutherford. | Separation from Contagious Corruptions</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

%20course" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-72239b2dfd" data-kw="">
<blockquote><p>Superstition is an offering somewhat as pleasing to God, which is not pleasing to Him. All Christians have some degree of this in matter or manner; for we know but in part, and prophesy in part, etc. And so [it is the logical consequence of separatistic principles that] no Christians must join with others. But must they not give over all religious duty themselves, seeing their own defects more defile them than other men’s [defects]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>

</figure><figure class="quote" id="q-7250e55d25" data-kw="">
<blockquote><p>19. Not meddling with ministers subscribing, declaring, swearing, nor with the discipline, by-offices, baptizing as by our sort of godfathers’ covenanting without the parents, crossing and undue application of words at burial and such like, I know nothing in the common [Anglican] Lord’s-Day worship [1661] spoken in the name of the Church which a godly Christian may not join in with the exercise of the spirit of prayer with faith and comfort,¹ if prejudice and false apprehensions of it affright him not or put not his soul out of relish with it. (As on the other side: prejudice distastes many too much with the faulty methods and words of many men’s extemporate prayers.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Anglican Liturgy: Tolerable</span></figcaption>

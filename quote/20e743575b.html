<main class="wrap"><figure class="quote" id="q-20e743575b" data-kw="">
<blockquote><p>10. We have said that the symbols by which the Church is discerned are the preaching of the Word and the observance of the sacraments, for these cannot any where exist without producing fruit and prospering by the blessing of God… When the preaching of the gospel is reverently heard, and the sacraments are not neglected, there for the time the face of the Church appears without deception or ambiguity; and no man may with impunity spurn her authority… far less revolt from her, and violate her unity, (see Chap. II, sec. 1, 10, and Chap. VIII, sec. 12). For such is the value which the Lord sets on the communion of his Church, that all who contumaciously alienate themselves from any Christian society, in which the true ministry of his Word and sacraments is maintained, He regards as deserters of religion. So highly does He recommend her authority, that when it is violated He considers that his own authority is impaired. For there is no small weight in the designation given to her, “the house of God,” “the pillar and ground of the truth,” (1 Tim. 3:15)… 11… How perilous, then, nay, how fatal the temptation, when we even entertain a thought of separating ourselves from that assembly in which are beheld the signs and badges which the Lord has deemed sufficient to characterise his Church!… If it holds the order instituted by the Lord in Word and sacraments there will be no deception; we may safely pay it the honour due to a church: on the other hand, if it exhibit itself without Word and sacraments, we must in this case be no less careful to avoid the imposture… 12… in the administration of word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith…</p></blockquote>

</figure><figure class="quote" id="q-38d5a0ab65" data-kw="">
<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew</cite>, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 29-34</span></figcaption>

<blockquote><p>In this work [his Commentary on Romans] Bucer was convinced that a clear exposition of the scriptures, as well as the chuch fathers and even some scholastic theologians, would lead the old church to the evangelical truth of the fundamentals of the Christian faith.</p></blockquote>

</figure><figure class="quote" id="q-ae60862e38" data-kw="">
<blockquote><p>Let us 1. distinguish of opinions. Some are in the foundation, in those necessary doctrines upon which the House of God is built, 1 Cor. 3:9-10; Heb. 6:1; Mt. 7:24, the errors contrary wherereunto are pernicious and damnable, 2 Pet. 2:1. Some are only in the superstruction which do not so nearly touch the vitals and essentials of religion, which are not fidei but quaestionum, as Augustine somewhere distinguishes. Such were in the apostles’ time disputes touching meats, and drinks, and days, and things indifferent, Rom. 14:5-6, and in our days touching forms of discipline and government in the Church, wherein men abound in their own sense, with meekness and with submission to the spirits of the prophets.</p></blockquote>

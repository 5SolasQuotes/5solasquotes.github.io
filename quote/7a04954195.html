<blockquote><p>But when God will receive any as His people, He brings them under the bond of the covenant, He enters into a covenant with them upon His divine word, in which He undertakes to be their God and to receive them as His people; they also embrace that covenant with all its promises and precious substance, entering into it and delivering themselves up to it, which is expressed in Bible language as a subscribing with the hand that one will be the Lord’s; from this exercise springs hope, and there is laid a sure and certain ground for the expectation of the soul. I find this frequently in God’s unerring word: ‘Although my house be not so with God; yet He hath made with me an everlasting covenant, ordered in all things and sure: for this is all my salvation and all my desire, although He make it not to grow’ (2 Sam. 23.5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), pp 161-62.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ae6dd80bb" data-kw="">
<blockquote><p>But in this place and present argument, ‘grace’ is the favor and goodness of the eternal Godhead wherewith He according to his incomprehensible goodness does gratis, freely for Christ’s sake embrace, call, justify and save us mortal men. Now here me thinks before we go any further it is not amiss to examine and search out the cause of this God’s love to us exhibited. For we see that there is a certain relation between the favor of God and us men to whom his favour is so bent. It is a matter neither hard nor tedious to be found out. For in us there is nothing wherewith God can be in love, or wherewithal He may be moved or stirred up to embrace us: yea, in so much as we are all unpure sinners, and that God is holy, just and a revenger of iniquities, He has matter enough to find in us for which He may be angry at and with just revengement plague us. So then the cause of God’s love to us wards must of necessity be, not in us, nor in any other thing beside God (considering that nothing is more excellent than man) but even in God Himself. Moreover, the most true Scripture does teach us that God is of his own inclination naturally good, gentle, and as Paul calls Him, Philanthropon, a lover of us men, who has sent his own Son of his own nature into the world for our redemption: whereupon it does consequently follow, that God does freely of Himself, and for his Son’s sake love man, and not for any other cause. Whereby immediately all the preparaments, incitaments and merits of men being dissolved by the fire of God’s great love, do fade and pass away like smoke. For the grace of God is altogether free, and unless it be so, I cannot see how it can be called grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (d. 1575; London: Ralph Newberry, 1577), 4th Decade, 1st Sermon, Of the Gospel of the Grace of God, p. 529</span></figcaption>

<blockquote><p>In the times of truest spiritual life, this was not forgotten in Israel. The holy men who “obtained a good report by faith” had large and world-wide views, and large and world-wide hopes, as to the grace of God and the reign of their Messiah. They expected Him to rule over a kingdom co-extensive with the whole world. They expected Him to dispense blessings sufficient for every land.

The more they appreciated their own sinfulness and the freeness and sovereignty of the grace of God, the more did they clearly comprehend how the Gentiles also might freely partake of the same free mercy with themselves; and the more they felt the vanity of all earthly good and the helplessness of their whole earthly estate, and appreciated the promised kingdom and sovereign reign of their Christ as unworldly, spiritual, heavenly, divine, and eternal, so much the more did they clearly see how all nations, as they needed, so they might be embraced by, this new, heavenly kingdom of the Lord and His Anointed.

Hence, in the days of David, when true spiritual life flourished, and un-Pharisaic knowledge of the grace of God was comparatively widely diffused, the Gentiles were looked on with no evil eye; their salvation was felt to be clearly within the compass of the covenant of Abraham; and their subjugation to the coming Messiah was regarded as one of the glorious events which should mark and grace His advent and manifestation. Hence such passages in the Psalms as these,—the first addressed by the Father to His Anointed, and the second by the Church to her covenant God :— “Ask of me, and I will give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession;” “Have respect unto Thy covenant, for the dark places of the earth are full of the habitations of cruelty” (Ps. ii. 6; lxxiv. 20).

And if any farther proof be needed that the Church, in the days of her true life and fidelity, looked for being enlarged with the believing brotherhood of the converted nations, we have it in that noble hymn of missionary prayer and hope, opening as it does with the well-remembered words, “God be merciful unto us, and bless us: and cause his face to shine upon us; that thy way may be known upon earth, thy saving health among all nations,” and closing with the confession of free, unhampered, appropriating faith, “God shall bless us,” and with the enlarged and unbounded expectation, “And all the ends of the earth shall fear him” (Ps. lxvii. 1—7).

But in the days of Israel’s degeneracy, when faith gave place to formalism, and contrite gratitude to cold and supercilious ceremony; when self-righteous pride, singularly enough keeping pace with increasing iniquity and worthlessness, arrogantly claimed right to the privileges of the covenant in very proportion as all the spirit of the covenant was violated; when the close and narrow spirit of legalism, resting its claims on carnal distinctions, and saying, “ We have Abraham to our Father,” superseded the true spirit of Israel, “I am not worthy of the least of all the goodness and the truth thou hast shown unto thy servant;” the idea of pure and sovereign grace being lost sight of — that grace whereby Jew and Gentile alike may be freely saved, — and the kingdom of the Messiah being conceived of as earthly and limited — set up, indeed, as a badge of distinction, to magnify the seed of Abraham according to the flesh; then the Gentile nations began to be looked upon as natural and irreconcilable enemies.

The Jewish Church, in fact, in such a spirit, enacts exactly the part of the Pharisee of the parable, while the publican may represent the waste of heathendom; and the vain-glorious Church, claiming Heaven’s favour on the ground of her carnal distinctions and pitiable tithings, thanks God that she is not as this poor publican!

For in every point of view, and on whatever scale, self-righteousness is exclusive and malignant, remorselessly consigning over others to a destruction which, on its own proud merit and pre-eminence, it counts itself entitled to escape. Perhaps, more properly indeed, it came to this, that the heathen nations, as to their moral and spiritual interests, were, among Israel, objects of simple contempt and neglect, and were dealt with as if Jehovah, the God of Israel, utterly neglected them also —-as if, in short, they were beyond the pale of His government; or, in other words, as if Jehovah’s government were not universal, but limited to their own nation alone. It is evident how, with such a view of their own God, their own adoring regards for Him must have been destroyed.

Jehovah is the God of the spirits of all flesh, and ruleth over all the nations. Any other or more limited idea of His government, reduces Him, if not to the level, at least to the company, of the local, territorial, geographical gods of heathendom. And thus, by taking a wrong view of the relation of heathendom to the living and true God, the God of Israel, Israel virtually imbibed the very views of heathendom itself. Indeed, nothing but true faith, contrition, adoring confidence, and loyalty to Jehovah, could prevent this painful perversion of the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prophet Jonah: His Character and Mission to Nineveh</cite>, (London: Alexander Strahan, 1866), pp 6-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

D+%E2%80%9CHave+respect+unto+Thy+covenant%2C+for+the+dark+places+of+the+earth+are+full+of+the+habitations+of+cruelty%E2%80%9D+%28Ps.+ii.+6%3B+lxxiv.+20%29.%0A%0AAnd+if+any+farther+proof+be+needed+that+the+Church%2C+in+the+days+of+her+true+life+and+fidelity%2C+looked+for+being+enlarged+with+the+believing+brotherhood+of+the+converted+nations%2C+we+have+it+in+that+noble+hymn+of+missionary+prayer+and+hope%2C+opening+as+it+does+with+the+well-remembered+words%2C+%E2%80%9CGod+be+merciful+unto+us%2C+and+bless+us%3A+and+cause+his+face+to+shine+upon+us%3B+that+thy+way+may+be+known+upon+earth%2C+thy+saving+health+among+all+nations%2C%E2%80%9D+and+closing+with+the+confession+of+free%2C+unhampered%2C+appropriating+faith%2C+%E2%80%9CGod+shall+bless+us%2C%E2%80%9D+and+with+the+enlarged+and+unbounded+expectation%2C+%E2%80%9CAnd+all+the+ends+of+the+earth+shall+fear+him%E2%80%9D+%28Ps.+lxvii.+1%E2%80%947%29.%0A%0ABut+in+the+days+of+Israel%E2%80%99s+degeneracy%2C+when+faith+gave+place+to+formalism%2C+and+contrite+gratitude+to+cold+and+supercilious+ceremony%3B+when+self-righteous+pride%2C+singularly+enough+keeping+pace+with+increasing+iniquity+and+worthlessness%2C+arrogantly+claimed+right+to+the+privileges+of+the+covenant+in+very+proportion+as+all+the+spirit+of+the+covenant+was+violated%3B+when+the+close+and+narrow+spirit+of+legalism%2C+resting+its+claims+on+carnal+distinctions%2C+and+saying%2C+%E2%80%9C+We+have+Abraham+to+our+Father%2C%E2%80%9D+superseded+the+true+spirit+of+Israel%2C+%E2%80%9CI+am+not+worthy+of+the+least+of+all+the+goodness+and+the+truth+thou+hast+shown+unto+thy+servant%3B%E2%80%9D+the+idea+of+pure+and+sovereign+grace+being+lost+sight+of+%E2%80%94+that+grace+whereby+Jew+and+Gentile+alike+may+be+freely+saved%2C+%E2%80%94+and+the+kingdom+of+the+Messiah+being+conceived+of+as+earthly+and+limited+%E2%80%94+set+up%2C+indeed%2C+as+a+badge+of+distinction%2C+to+magnify+the+seed+of+Abraham+according+to+the+flesh%3B+then+the+Gentile+nations+began+to+be+looked+upon+as+natural+and+irreconcilable+enemies.%0A%0AThe+Jewish+Church%2C+in+fact%2C+in+such+a+spirit%2C+enacts+exactly+the+part+of+the+Pharisee+of+the+parable%2C+while+the+publican+may+represent+the+waste+of+heathendom%3B+and+the+vain-glorious+Church%2C+claiming+Heaven%E2%80%99s+favour+on+the+ground+of+her+carnal+distinctions+and+pitiable+tithings%2C+thanks+God+that+she+is+not+as+this+poor+publican%21%0A%0AFor+in+every+point+of+view%2C+and+on+whatever+scale%2C+self-righteousness+is+exclusive+and+malignant%2C+remorselessly+consigning+over+others+to+a+destruction+which%2C+on+its+own+proud+merit+and+pre-eminence%2C+it+counts+itself+entitled+to+escape.+Perhaps%2C+more+properly+indeed%2C+it+came+to+this%2C+that+the+heathen+nations%2C+as+to+their+moral+and+spiritual+interests%2C+were%2C+among+Israel%2C+objects+of+simple+contempt+and+neglect%2C+and+were+dealt+with+as+if+Jehovah%2C+the+God+of+Israel%2C+utterly+neglected+them+also+%E2%80%94-as+if%2C+in+short%2C+they+were+beyond+the+pale+of+His+government%3B+or%2C+in+other+words%2C+as+if+Jehovah%E2%80%99s+government+were+not+universal%2C+but+limited+to+their+own+nation+alone.+It+is+evident+how%2C+with+such+a+view+of+their+own+God%2C+their+own+adoring+regards+for+Him+must+have+been+destroyed.%0A%0AJehovah+is+the+God+of+the+spirits+of+all+flesh%2C+and+ruleth+over+all+the+nations.+Any+other+or+more+limited+idea+of+His+government%2C+reduces+Him%2C+if+not+to+the+level%2C+at+least+to+the+company%2C+of+the+local%2C+territorial%2C+geographical+gods+of+heathendom.+And+thus%2C+by+taking+a+wrong+view+of+the+relation+of+heathendom+to+the+living+and+true+God%2C+the+God+of+Israel%2C+Israel+virtually+imbibed+the+very+views+of+heathendom+itself.+Indeed%2C+nothing+but+true+faith%2C+contrition%2C+adoring+confidence%2C+and+loyalty+to+Jehovah%2C+could+prevent+this+painful+perversion+of+the+truth.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Prophet+Jonah%3A+His+Character+and+Mission+to+Nineveh%2C+%28London%3A+Alexander+Strahan%2C+1866%29%2C+pp+6-9.&amp;url=https%3A%2F% <blockquote><p>Nay, there is a general and universal invitation to everyone who thirsts to come to the waters; and God has promised to give “to him that is athirst, of a fountain of the water of life freely” (Revelation 21:6).</p></blockquote>

</figure><figure class="quote" id="q-4d6b6e7b50" data-kw="">
<blockquote><p>That this covenant between God and us is free and undeserved, and leaneth upon no condition of our worthiness or merits, but standeth by faith alone, hence it may easily appear. For in respect of God he properly maketh the covenant with us, and he sealeth in our hearts by his holy spirit, that same promise of underserved reconciliation offered unto us in the Gospel. Titus 3. ver. 5, 6, 7. 2 Tim. I. ver. 9. Gal. 3. ver. 6. 28, 29. In respect of us this covenant is received only by faith, while that freely and underservedly the holy Ghost is given unto us, who bringeth to pass that both we will and are able to believe the free promise of reconciliation through Christ. Eph. I. Joel 2. Esay. 59.

If you respect the mediator, verily our heavenly father hath received of him the price of reconciliation, and we have satisfied in him: notwithstanding because the mediator is freely given unto us, and imputeth also freely this merit unto us, even by this reason also the covenant is free. And so the covenant is free. And so this whole covenant is merely free, and consisteth in faith alone: the oblation of promise of grace in Christ, and also the giving of Christ himself in respect of God is freely receiving on our part is also free, because it is the work of God in us, whereby he sealeth his promise in our hearts, that being drawn we should work, that is to say, that being made believers by him we might believe. Ephe. 2. ver. 1, 5, 6, 7, 8, 9, 10.</p></blockquote>

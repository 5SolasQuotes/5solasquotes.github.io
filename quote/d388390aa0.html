<blockquote><p>25. Axioms concerning the perfection of God:

I. God is in Himself absolutely and in every way perfect from eternity to eternity, devoid of all defect or progress. Rom. 11:35, ‘Who has first given to Him, and it shall be recompensed to them?’

      26. II. God can lack no perfection, neither privatively nor negatively: that is, No privation of perfection, no negation can fall upon God.

      27. III. All perfections belong to God according to one and simple form, which is His essence.

      28. IV. God is the cause of all perfections in other things, Rom. 11:36, ‘For from Him, and through Him, and to Him are all things.’

      29. V. All perfections, which are found in things created by God, were first in God most perfect and in the most perfect manner. Indeed, God, as the first cause, contains all possible perfection in Himself. All perfections are simply simple in God, because in their formal concept they have no imperfection, but pure perfection, nor do they involve any contradiction among themselves. God, by reason of His perfection, eminently contains the perfections of creatures. Eminently: to contain the perfection of something is to have such a perfection of a higher order, which by its power contains whatever is in the lower perfection: whence, because He also contains eminently, He can bring it about. For all effects are in efficient causes by power, so that such causes are said to be like their effects; and conversely, effects are such as their causes.</p></blockquote>

<blockquote><p>Therefore the aforesaid names signify the divine substance, but in an imperfect manner, even as creatures represent it imperfectly. So when we say, God is good, the meaning is not, God is the cause of goodness, or God is not evil; but the meaning is, Whatever good we attribute to creatures, pre-exists in God, and in a more excellent and higher way. Hence it does not follow that God is good, because He causes goodness; but rather, on the contrary, He causes goodness in things because He is good; according to what Augustine says (De Doctr. Christ. i, 32), Because He is good, we are.</p></blockquote>

<blockquote><p>33. The divine ideas, therefore, are not the creatures themselves known by God, but are objective reasons, that is, the divine essence itself, conceived by God, insofar as it is imitable by created things: so that the divine exemplar is infinitely more perfect than created things, since it is the divine essence itself known as imitable.

34. But they express the things themselves, because the divine essence, which holds the nature of an idea, insofar as it is known by God, as in tablets by creatures, eminently contains man, for example, of whom it is the idea, as it is imitable by him, and similarly the other things, and represents them most perfectly.

35. The ideas are removed and separated from the commerce of matter and the concretion of singulars.

36. They are eternal, stable, unchangeable, and incorruptible. And they themselves are not formed: just as neither are created ideas made by an artificer, as Plato rightly teaches in the tenth book of the Republic, not far from the beginning.

37. They agree in part with created ideas and in part differ from them. They agree in that both are objective reasons: they differ in that the ideas of the supreme Architect are not things which he intends to produce, as the created ideas of a created artisan. The reason for this distinction is that in the divine essence, which is the primary object of divine understanding, all things that can be made are contained and reflected; therefore, it is necessary that God, in making any work, principally regards the idea of it in his mind and primarily imitates it. In the created artisan, however, the matter is not so, who sometimes changes something as the situation arises and does not always imitate the idea first conceived. They also differ from the conjoined forms of things. For ideas are objective forms, from which imitation is taken, and they always remain outside the essences of made things, not becoming part of them: but the conjoined forms of things are [Hebrew or Greek] forms, constitutive, and part of composite things. Furthermore, ideas are the prototypical reasons of things, of which they are the exemplars: but the conjoined forms, induced into things by God the Creator, are certain principled likenesses of them, which by informing matter comprehend essence.</p></blockquote>

<blockquote><p>Q. 4. In what time did God create all things? A. God created all things in the space of six days. He could have created all things together in a moment, but he took six days’ time to work in, and rested on the seventh day, that we might the better apprehend the order of the creation, and that we might imitate Him in working but six days of the week, and in resting on the seventh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explicatory Catechism: or an Explanation of the</cite>, (1673; NY: Deare, 1806), Question 9, ‘What is the work of creation?’, p. 44</span></figcaption>

<main class="wrap"><figure class="quote" id="q-88ac8bbca2" data-kw="">
<blockquote><p>The orthodox therefore define the unio mystica as the spiritual conjunction (conjunctio spiritualis) of the Triune God with the believer in and following justification. It is a substantial and graciously effective indwelling. In relation to the ordo salutis (q.v.), or order of salvation, the Protestant scholastics distinguish the initial unitio (q.v.), or uniting, of the unio mystica, which is the basis for the imputation of Christ’s righteousness to the believer and which corresponds with the adoption (adoptio) of the believer, and the ongoing unio, or union, of the unio mystica, which continues concurrent with sanctification throughout the life of the believer…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘unio mystica sive praesentia gratiae tantum’ in Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st ed. (Baker, 1985)</cite>, pp. 314-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ba75fe427" data-kw="">
<blockquote><p>But this communication of the subsistence of the second Person unto the humanity is not (as [Robert] Baron,Philosophia. Theol. Ancil., Article 12, and after him Mr. Barlow in the forementioned place, very excellently show) by way of real inhesion, or denomination, but only by way of sustentation: And this is no advantage unto the Lutherans’ communication of divine properties. Look as when a subject does communicate itself unto its accidents by way of support, it does not hereupon follow that it inheres in them, or does denominate them. So though the person of the Son do assume, receive, and sustain the humanity of Christ, yet it does not hereupon follow that the subsistence of the Son is formally in the manhood, or that the manhood is a person, as is proved at large by those two mentioned authors.</p></blockquote>

</figure><figure class="quote" id="q-6fabee8190" data-kw="">
<blockquote><p>It should be noted that assumption and hypostatic union are not the same thing. Assumption speaks of the action in the agent assuming and the passion in the patient assumed. Union implies the relationship that follows from this. To be united may be said equally of the divine and human natures in the incarnate Word; but to assume actively is said only of the Word’s divine nature, and to be assumed is said only of the human nature. It cannot be said of the Word’s divinity that it is assumed, though it can be said that it is united. Thus, assumption and hypostatic union do not have the same meaning. Assumption, considered actively and passively, is what establishes the hypostatic union as a consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dolezal.html">James Dolezal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’Neither Subtraction, Nor Addition: The Word’s Terminative Assumption of a Human Nature’ Nova et Vetera, vol. 20, no. 1 (Winter, 2022), fn. 10.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

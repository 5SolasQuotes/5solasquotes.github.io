<blockquote><p>Whether of these goes before, faith or repentance? Whereas we have said before that repentance is sometimes used by a synecdoche for that which they call contrition, and have showed that contrition is legal or evangelical, we have placed faith as it were in the middle, between the former of those sorrows which comes of the acknowledgement of our sins and the accusations of the conscience, or which proceeds from the Law, and the latter, which proceeds from the Gospel, for godly sorrow is an effect of faith as well as joy and gladness of conscience.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68d9e3558b" data-kw="">
<blockquote><p>…pardon of sin and salvation are propounded and preached upon condition of faith, repentance and newness of life, which are the conditions of the gospel; and yet may they also be so termed, as conditions of peace, upon agreement unto, and performance whereof, peace may be had (Lk. 14:31), which otherwherewise cannot be obtained. Only sir, I shall endeavour by help of logic out of Scripture thus to justify the use of that term: That which is so propounded as that being performed, life and salvation may undoubtedly be attained and without which it cannot be had, may well be termed a condition. But such are the things before mentioned. They may therefore justly be termed conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away</cite>, Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646), p. 40</span></figcaption>

<blockquote><p>6. Whether repentance is prior to faith? Initial repentance is prior; continued [repentance] is posterior [to faith].</p></blockquote>

</figure><figure class="quote" id="q-ea0b26a3f6" data-kw="">
<blockquote><p>Assertion 11. That the promises of the Gospel are holden forth to sinners, as sinners, has a twofold sense: 1. As that they be sinners and all [be] in a sinful condition to whom the promises are holden forth. This is most true and sound. The Kingdom of grace is an hospital and guest-house of sick ones, fit for the art and mercy of the Physician Christ. 2. So as they are all immediately to believe and apply Christ and the promises, who are sinners; and there be nothing required of sinners but that they may all immediately challenge interest in Christ, after their own way and order, without humiliation or any Law-work. In this sense it is most false that the promises are holden forth to sinners as sinners, because then Christ should be holden forth to all sinners, Americans, Indians and sinners who never by the least rumor heard one word of Christ. 2. Peter desires not Simon Magus to believe that God had loved him in Christ Jesus with an everlasting love, nor does the Gospel-promise offer immediately soul-rest to the hardened and proud sinner wallowing in his lusts, as he is a hardened sinner; nor is the acceptable year of the Lord proclaimed, nor beauty and the oil of joy offered immediately to any but to those who are weary and laden and who mourn in Zion and wallow in ashes, Mt. 11:28-30; Isa. 61:1-3. It’s true, to all within the visible Church Christ is offered without price or money, but to be received after Christ’s fashion and order, not after our order; that is, after the soul is under self-despair of salvation and in the sinner’s month, when he has been with child of hell. I grant, in regard of time, sinners cannot come too soon to Christ, nor too early to wisdom; but in regard of order, many come too soon and unprepared. Simon Magus too soon believed. Saltmarsh says He misbelieved too soon, for he falsely believed: none can believe too soon. Answer: To believe too soon is to misbelieve, and Saltmarsh and Antinomians teach us the method of false-believing when they teach us too soon to believe; that is, to believe that God has loved you (be ye what ye will, Simon Magus, Judas or others) with an everlasting love, for that is the Antinomian Faith. Simon Magus is without any foregoing humiliation or sense of sin, or self-despair, to believe he was no less written in the Lamb’s book of life from eternity than Peter; and this he cannot believe soon enough. I say, neither soon or late ought a reprobate to believe any such thing. A covetous man who had great possessions [the rich young ruler] had not yet bidden farewell to his old god mammon when he came to Christ; therefore he departed sad from Christ. Another came before he had buried his father; and some come, Lk. 14:28-29, before they advise with their strength and what Christ will cost them. I desire I be not mistaken: none can be thoroughly fitted for Christ before he come to Christ; but it is as true some would buy the pearl before they sell all they have, which is not the wise merchant’s part: and they err foully who argue thus, If I were not a sinner, or if my sins were less heinous, and so I were less unworthy, I would come to Christ and believe; but ah, I am so grievous an offender and so unworthy that I cannot go. Their antecedent is true, but the consequence is naught and wicked. It is true, I am sick, and [it is] good that I both say and feel that I am sick; but, therefore, I cannot, I will not go to the Physician: that is wicked logic and the contrary consequence is good: whereas the other consequence is a seeking of righteousness in ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 258-59</span></figcaption>

<blockquote><p>2. The wilderness of sorrow, contrition, repentance, call it what you please, though I know the latter term ‘repentance’ be controverted by some new opinionists. Yet I know not why we may not say that a man may repent without saving grace. And for that repentance which they say must be the effect of faith, if I were a schoolman, I should rather call it godly sorrow, but I desire not to play upon terms: and for their defining repentance to be a sorrow for sin out of the sense of the love of God revealed in Jesus Christ, it is a definition they have devised for their own purpose; and give them their premises according as they please, they would be poor logicians if they made the conclusion to displease them: for from hence they argue, if the love of God be the ground and cause of repentance (viz. the love of God manifested and sensible to us, we having apprehended it by faith), the special love of God, then faith must go before repentance, viz. an apprehension of God’s saving love and reliance upon it. But I answer: the definition which they give us of repentance is deceitful; it is a definition of a species instead of a genus (as we say in logic). As some unwary divines define faith, to be an assurance of God’s love in Jesus Christ: this is true, but this is a faith of the highest stamp, and many a precious soul is without this faith to his dying day. Faith of adherence is another thing; as if I should go to define a man to be a reasonable creature, skilled in all sorts of learning. Any man would understand me, that I did not go about to describe a man in general, but this or that particular man. And I say once again, if I were a schoolman, I should rather call this a godly sorrow, and define repentance in general to be a sorrow for sin, there is the genus and differentia: or if there be required a fuller definition with the ground, though I conceive such a definition would be more proper to give of repentance in its several kinds than of repentance in general; yet we may give it thus, it is a sorrow for sin, arising out of the fear of God’s wrath or apprehensions of God’s love. And I know not why we may not say that a man may repent without saving grace. Bishop [John] Davenant says, a man by exciting the grace of God, may peccata propria considerare, ad sensum eorundem expavescere et liberationem ab hoc metu exoptare, tremble for his sins and mourn for them, and desire deliverance out of them (Mk. 1:15; Lk. 17:3-4; Eze. 14:6); and if this be not repentance, I know not what is (not taking repentance for the whole work of conversion, as sometimes it is taken in Scripture), but taking repentance for a weariness of sin and sorrow for it. But those of our brethren here (that are so afraid of Babylon that they will run quite beyond Jerusalem, so afraid of being Arminians or Papists, to ascribe any desert to duties, or tie that God has to concur with our duties, that they are resolved they will not be sober Protestants: so afraid of being heterodox, that to avoid it, they will not be orthodox) tell us that this is a legal, not a saving repentance; it sounds ill to distinguish between a legal and saving repentance. I will digress a little to rend this fig-leaf, being all they have to cover the nakedness of their opinion: I would fain understand that term ‘saving repentance’ in what sense they take it; the Scripture warrants no such distinction. 1. If they mean by ‘saving repentance’, such a repentance as merits salvation, or such a repentance as God is tied necessarily to concur with, with his saving grace, I say, no repentance can be saving repentance. No repentance (says learned Davenant) can so dispose the heart, ut ex merito congrui teneatur Deus gratiam cuiquam infundere. 2. If they mean by ‘saving repentance’, such a repentance as of itself, without any more ado, shall be sufficient to salvation: I say again, no repentance can be called a saving repentance. For without faith it is impossible to please God. 3. If they mean by ‘saving repentance’, a repentance that conduces to salvation; I say, this kind of repentance (let them call it legal or what they please) is a saving repentance. 4. If they mean by ‘saving repentance’, such a repentance as is wrought ordinarily in such as shall be saved, I say, in that sense this repentance is a saving repentance. Now, whether it ought not to be preached, as well from law as gospel motives, is a question that lies not in my way to determine, only I hear my Savior (though He were Gospel itself) preaching it from a law-motive, Lk. 13:2, “Except ye repent, ye shall all likewise perish.” Let the unprejudiced reader judge if damnation be not there preached as a terrible motive to repentance: surely I then may learn to preach from the best of preachers and preach, ‘Repent, or you will go to hell; repent, or you will be damned,’ as well as ‘Repent, because God has loved you:’ yea, and John too preached repentance as well, because the axe was laid to the root of the tree and whatsoever tree brought not forth good fruit should be hewn down and cast into the fire, as because the kingdom of heaven was at hand. I dare not learn contrary to Christ and the Baptist’s copy; I will preach mercy and judgment: the law and the gospel go well together; I will not be accursed for separating what God has joined. But 5. Lastly, I conceive, we cannot call any repentance saving repentance till the work of conversion be fully wrought in our souls. Nay, I make a question whether any man (without the grace of assurance) can properly call his repentance ‘saving repentance’, till he comes into Heaven. And for my own part, I am full in the negative. But I have digressed too far, to convince some (who I fear are not so willing to suffer the word of conviction, as I to speak it.) We left the spouse in the second wilderness, the wilderness of sorrow; it is time we now return to her, and comfort her, and show you how she comes out of that, leaning upon her Beloved.</p></blockquote>

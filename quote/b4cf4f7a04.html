<main class="wrap"><figure class="quote" id="q-b4cf4f7a04" data-kw="">
<blockquote><p>4. Eternal life does not come to anyone by chance, for it is a lot that God, according to the good pleasure of His will, assigns only to those whom He has decreed and not to others. If the entire plan of the lot is from Jehovah in the distribution of earthly inheritances [Prov. 16:33], then much more does the heavenly inheritance depend on His good pleasure. Therefore, it should never be admitted that some were saved in the past or are being saved now by the chance mercy of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8ae778da8" data-kw="">
<blockquote><p>Before the foundation of the world, by sheer grace, according to the free good pleasure of his will, God chose in Christ to salvation a definite number of particular people out of the entire human race, which had fallen by its own fault from its original innocence into sin and ruin. Those chosen were neither better nor more deserving than the others, but lay with them in the common misery. God did this in Christ, whom he also appointed from eternity to be the mediator, the head of all those chosen, and the foundation of their salvation. And so God decreed to give to Christ those chosen for salvation, and to call and draw them effectively into Christ’s fellowship through the Word and Spirit. In other words, God decreed to grant them true faith in Christ, to justify them, to sanctify them, and finally, after powerfully preserving them in the fellowship of the Son, to glorify them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 7</span></figcaption>

</figure><figure class="quote" id="q-5f317cf4ce" data-kw="">
<blockquote><p>Of what sort of men is election? Of such as are uncleane and ungodly in the sight of God. “For He has chosen us that we might be holy and without blame,” Eph. 1:4. But whereas He chose us before the world was made, it is effected that God set before his eyes all men that ever should be, and for as much as they would be ungodly and accursed, He likewise so considered them and so chose some out of the common lump and filth of men, and those freely according to the good pleasure of his will, leaving others in their sin and curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London: 1606), Place 36, ‘Of Predestination’, p. 433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-9d7bd937c1" data-kw="">
<blockquote><p>Predestination &amp; Reprobation Contrasted 1. The [Westminster] Confession does not teach or imply a double predestination. In an attempt to distinguish between election and reprobation we should use predestination for the elect and foreordination for the reprobate [as the Confession does].

2. Election and reprobation rest on different grounds: election on the redeeming love of God that undertakes the salvation of the lost; reprobation on the moral necessity to manifest to the universe the nature and consequences of sin in moral personality.

3. Means are used of God to fulfil the purpose of election, but God uses no means to fulfil His purpose of reprobation. It is left to sin to run its course and receive its wages.

4. The fruits of election are attributable to divine grace, the fruits of reprobation to personal sin. This means that while there is grace to some, there is injustice to none.

5. While God finds pleasure in the salvation of the elect, He has sworn by Himself that He has no pleasure in the death of the wicked. God does not need sin or its retribution for His self-manifestation, but its reality in the universe can serve that end.

6. That the elect will constitute a recreation of the race under a new Head is evident, while the reprobate are but the branches cut off from the tree of humanity. Christ will be revealed as the Savior of the world, though many are lost in the process.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-a-finlayson.html">R.A. Finlayson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Theological Writings of R.A. Finlayson</cite>, p. 265. Finlayson was a Free Church of Scotland professor during the mid-1900’s.</span></figcaption>

</figure><figure class="quote" id="q-81b6437563" data-kw="">
<blockquote><p>In establishing the Covenant of Redemption, unlike in predestination, the elect are viewed as fallen sinners, from whom God’s justice requires perfect satisfaction. Since they cannot render this, it is required, in the Covenant of Redemption, of their representative Head, Christ Jesus.</p></blockquote>

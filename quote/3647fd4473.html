<blockquote><p>In the times of truest spiritual life, this was not forgotten in Israel. The holy men who “obtained a good report by faith” had large and world-wide views, and large and world-wide hopes, as to the grace of God and the reign of their Messiah. They expected Him to rule over a kingdom co-extensive with the whole world. They expected Him to dispense blessings sufficient for every land.

The more they appreciated their own sinfulness and the freeness and sovereignty of the grace of God, the more did they clearly comprehend how the Gentiles also might freely partake of the same free mercy with themselves; and the more they felt the vanity of all earthly good and the helplessness of their whole earthly estate, and appreciated the promised kingdom and sovereign reign of their Christ as unworldly, spiritual, heavenly, divine, and eternal, so much the more did they clearly see how all nations, as they needed, so they might be embraced by, this new, heavenly kingdom of the Lord and His Anointed.

Hence, in the days of David, when true spiritual life flourished, and un-Pharisaic knowledge of the grace of God was comparatively widely diffused, the Gentiles were looked on with no evil eye; their salvation was felt to be clearly within the compass of the covenant of Abraham; and their subjugation to the coming Messiah was regarded as one of the glorious events which should mark and grace His advent and manifestation. Hence such passages in the Psalms as these,—the first addressed by the Father to His Anointed, and the second by the Church to her covenant God :— “Ask of me, and I will give thee the heathen for thine inheritance, and the uttermost parts of the earth for thy possession;” “Have respect unto Thy covenant, for the dark places of the earth are full of the habitations of cruelty” (Ps. ii. 6; lxxiv. 20).

And if any farther proof be needed that the Church, in the days of her true life and fidelity, looked for being enlarged with the believing brotherhood of the converted nations, we have it in that noble hymn of missionary prayer and hope, opening as it does with the well-remembered words, “God be merciful unto us, and bless us: and cause his face to shine upon us; that thy way may be known upon earth, thy saving health among all nations,” and closing with the confession of free, unhampered, appropriating faith, “God shall bless us,” and with the enlarged and unbounded expectation, “And all the ends of the earth shall fear him” (Ps. lxvii. 1—7).

But in the days of Israel’s degeneracy, when faith gave place to formalism, and contrite gratitude to cold and supercilious ceremony; when self-righteous pride, singularly enough keeping pace with increasing iniquity and worthlessness, arrogantly claimed right to the privileges of the covenant in very proportion as all the spirit of the covenant was violated; when the close and narrow spirit of legalism, resting its claims on carnal distinctions, and saying, “ We have Abraham to our Father,” superseded the true spirit of Israel, “I am not worthy of the least of all the goodness and the truth thou hast shown unto thy servant;” the idea of pure and sovereign grace being lost sight of — that grace whereby Jew and Gentile alike may be freely saved, — and the kingdom of the Messiah being conceived of as earthly and limited — set up, indeed, as a badge of distinction, to magnify the seed of Abraham according to the flesh; then the Gentile nations began to be looked upon as natural and irreconcilable enemies.

The Jewish Church, in fact, in such a spirit, enacts exactly the part of the Pharisee of the parable, while the publican may represent the waste of heathendom; and the vain-glorious Church, claiming Heaven’s favour on the ground of her carnal distinctions and pitiable tithings, thanks God that she is not as this poor publican!

For in every point of view, and on whatever scale, self-righteousness is exclusive and malignant, remorselessly consigning over others to a destruction which, on its own proud merit and pre-eminence, it counts itself entitled to escape. Perhaps, more properly indeed, it came to this, that the heathen nations, as to their moral and spiritual interests, were, among Israel, objects of simple contempt and neglect, and were dealt with as if Jehovah, the God of Israel, utterly neglected them also —-as if, in short, they were beyond the pale of His government; or, in other words, as if Jehovah’s government were not universal, but limited to their own nation alone. It is evident how, with such a view of their own God, their own adoring regards for Him must have been destroyed.

Jehovah is the God of the spirits of all flesh, and ruleth over all the nations. Any other or more limited idea of His government, reduces Him, if not to the level, at least to the company, of the local, territorial, geographical gods of heathendom. And thus, by taking a wrong view of the relation of heathendom to the living and true God, the God of Israel, Israel virtually imbibed the very views of heathendom itself. Indeed, nothing but true faith, contrition, adoring confidence, and loyalty to Jehovah, could prevent this painful perversion of the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prophet Jonah: His Character and Mission to Nineveh</cite>, (London: Alexander Strahan, 1866), pp 6-9.</span></figcaption>

<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>

<blockquote><p>By the name of covenant, we understand, not that general earthly, and temporary covenant, which God made, and keepeth with all created things, according to their nature, by the free law of his providence; neither that special covenant, which he entered into, with our first Parents in that state of integrity, a special examination or trial of obedience being added, as also both the promise of a life supernatural, and the threat of a double death being put thereto; the one is of nature, universal, the other of human nature limited by a certain bound of time and state; neither of both are properly pertaining to us, who are to be advanced from the universal nature, and the corruption of particular nature to the communion of supernatural glory: but we understand that covenant, which God entered into with man after his fall, by his special grace: which covenant is one only; for as much as there is but one only way of salvation, though a variable, and divers manner of administering the same, be pointed out: Wherefore, first we must speak concerning the very substance of the covenant: Secondly, of the Forms thereof which diversly it had from the outward manner, and circumstances.

The Covenant then which God entered into with man corrupt, is the free disposition of God, whereby he promiseth eternal salvation, by the death of his Son, to the glory of his Grace. The Efficient cause of this Covenant is God: for here is not the disposition of two parties, which is wont to presuppose the equality of persons, and right, between parties: for such a one can never befall between God and the creature: but it is of God alone, who of his mere will, stroke that covenant with man, whereby he might be advanced from his own nature, unto the communion of God’s grace, and glory.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“By the name of covenant, we understand, not that general earthly, and temporary covenant, which God made, and keepeth with all created things, according to their nature, by the free law of his providence; neither that special covenant, which he entered into, with our first Parents in that state of integrity, a special examination or trial of obedience being added, as also both the promise of a life supernatural, and the threat of a double death being put thereto; the one is of nature, universal, the other of human nature limited by a certain bound of time and state; neither of both are properly pertaining to us, who are to be advanced from the universal nature, and the corruption of particular nature to the communion of supernatural glory: but we understand that covenant, which God entered into with man after his fall, by his special grace: which covenant is one only; for as much as there is but one only way of salvation, though a variable, and divers manner of administering the same, be pointed out: Wherefore, first we must speak concerning the very substance of the covenant: Secondly, of the Forms thereof which diversly it had from the outward manner, and circumstances.

The Covenant then which God entered into with man corrupt, is the free disposition of God, whereby he promiseth eternal salvation, by the death of his Son, to the glory of his Grace. The Efficient cause of this Covenant is God: for here is not the disposition of two parties, which is wont to presuppose the equality of persons, and right, between parties: for such a one can never befall between God and the creature: but it is of God alone, who of his mere will, stroke that covenant with man, whereby he might be advanced from his own nature, unto the communion of God’s grace, and glory.”

— Lucas Trelcatius Jr., A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved, trans. John Gawen (London: Francis Burton, 1610), 2.10, pp 277-79.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+the+name+of+covenant%2C+we+understand%2C+not+that+general+earthly%2C+and+temporary+covenant%2C+which+God+made%2C+and+keepeth+with+all+created+things%2C+according+to+their+nature%2C+by+the+free+law+of+his+providence%3B+neither+that+special+covenant%2C+which+he+entered+into%2C+with+our+first+Parents+in+that+state+of+integrity%2C+a+special+examination+or+trial+of+obedience+being+added%2C+as+also+both+the+promise+of+a+life+supernatural%2C+and+the+threat+of+a+double+death+being+put+thereto%3B+the+one+is+of+nature%2C+universal%2C+the+other+of+human+nature+limited+by+a+certain+bound+of+time+and+state%3B+neither+of+both+are+properly+pertaining+to+us%2C+who+are+to+be+advanced+from+the+universal+nature%2C+and+the+corruption+of+particular+nature+to+the+communion+of+supernatural+glory%3A+but+we+understand+that+covenant%2C+which+God+entered+into+with+man+after+his+fall%2C+by+his+special+grace%3A+which+covenant+is+one+only%3B+for+as+much+as+there+is+but+one+only+way+of+salvation%2C+though+a+variable%2C+and+divers+manner+of+administering+the+same%2C+be+pointed+out%3A+Wherefore%2C+first+we+must+speak+concerning+the+very+substance+of+the+covenant%3A+Secondly%2C+of+the+Forms+thereof+which+diversly+it+had+from+the+outward+manner%2C+and+circumstances.%0A%0AThe+Covenant+then+which+God+entered+into+with+man+corrupt%2C+is+the+free+disposition+of+God%2C+whereby+he+promiseth+eternal+salvation%2C+by+the+death+of+his+Son%2C+to+the+glory+of+his+Grace.+The+Efficient+cause+of+this+Covenant+is+God%3A+for+here+is+not+the+disposition+of+two+parties%2C+which+is+wont+to+presuppose+the+equality+of+persons%2C+and+right%2C+between+parties%3A+for+such+a+one+can+never+befall+between+God+and+the+creature%3A+but+it+is+of+God+alone%2C+who+of+his+mere+will%2C+stroke+that+covenant+with+man%2C+whereby+he+might+be+advanced+from+his+own+nature%2C+unto+the+communion+of+God%E2%80%99s+grace%2C+and+glory.%E2%80%9D%0A%0A%E2%80%94+Lucas+Trelcatius+Jr.%2C+A+brief+institution+of+the+common+places+of+sacred+divinity.+Wherein%2C+the+truth+of+every+place+is+proved%2C+and+the+sophisms+of+Bellarmine+are+reproved%2C+trans.+John+Gawen+%28London%3A+Francis+Burton%2C+1610%29%2C+2.10%2C+pp+277-79.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0a2ee307a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0a2ee307a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/25/lucas-trelcatius-on-the-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[The Gospel] serves, likewise, the highly important purpose of discovering to sinners their warrant to trust in Christ Jesus for complete salvation. In the blessed gospel, Christ, and God in Christ, are freely offered to sinful men, and men are graciously invited as sinners to receive the offer and to entrust the whole affair of their salvation to Christ and to God in Him (Isa. 55:1–4; John 6:32). By the gospel, they are informed that the Lord Jesus offers Himself with all the inestimable blessings of the everlasting covenant to them and that He graciously invites and urges them as sinners to accept Him as their all-sufficient Savior “and to place the confidence of their hearts in Him for salvation from sin and wrath. Were they to not know that a divine warrant is thereby afforded them to receive and trust in the Savior for their salvation, it would be as great presumption in any of them as it would be in a fallen angel to attempt trusting that He would save him. But by the declarations, offers, calls, and promises of the word of grace, an ample warrant is afforded them as sinners of mankind to trust in the divine Savior and so to take possession of His great salvation. And it is by the gospel, accompanied by the illuminating grace of the Holy Spirit, that their warrant is revealed, that their full right of access to the compassionate Savior is disclosed to them, and that He manifests Himself to be so near them as to be within their reach (Rom. 10:6–8). Oh, how great is the importance and utility of the gracious offers and invitations of the blessed gospel to convinced and despondent sinners! By these, under the illuminating influences of the adorable Spirit, they see that it is lawful and warrantable for them to come as sinners and to entrust, with humble and strong confidence, the eternal salvation of their souls to the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 108–9.</span></figcaption>

<blockquote><p>Although my house be not so with God; yet he hath made with me an everlasting covenant, ordered in all things, and sure: for this is all my salvation, and all my desire, although he make it not to grow.” 2 Samuel 23:5

Commenting on the above verse, J. C. Ryle wrote:

But who can fully understand a covenant made by the Eternal God? It is something far above us and out of sight. It is a phrase by which He is graciously pleased to accommodate Himself to our poor weak faculties, but at best we can only grasp a little of it. The covenant of God to which David refers as his comfort must mean that everlasting agreement or counsel between the Three Persons of the Blessed Trinity which has existed from all eternity for the benefit of all the living members of Christ.

It is a mysterious and ineffable arrangement whereby all things necessary for the salvation of our souls, our present peace, and our final glory, are fully and completely provided, and all this by the joint work of God the Father, God the Son, and God the Holy Ghost. The redeeming work of God the Son by dying as our Substitute on the cross, – the drawing work of God the Father by choosing and drawing us to the Son, – and the sanctifying work of the Holy Ghost in awakening, quickening, and renewing our fallen nature, – are all contained in this covenant, besides everything that the soul of the believer needs between grace and glory.

Of this covenant, the Second Person of the Trinity is the Mediator (Heb. xii. 24). Through Him all the blessings and privileges of the covenant are conveyed to every one of His believing members. And when the Bible speaks of God making a covenant with man, as in the words of David, it means with man in Christ, as a member and part of the Son. They are His mystical body, and He is their Head, and through the Head of all the blessings of the eternal covenant are conveyed to the body. Christ, in one word, is “Surety of the covenant,” and through Him believers receive its benefits. This is the great covenant which David had in view.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Upper Room: Being a Few Truths for the Times</cite>, (1880; Edinburgh: Banner of Truth, 1970), pp 259-60.</span></figcaption>

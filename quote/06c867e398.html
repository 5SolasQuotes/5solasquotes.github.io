</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df7761f9a2" data-kw="">
<blockquote><p>The bestowment of common grace upon the non-elect shows that non-election does not exclude from the kingdom of heaven by Divine efficiency, because common grace is not only an invitation to believe and repent, but an actual help towards it; and a help that is nullified solely by the resistance of the non-elect, and not by anything in the nature of common grace, or by any preventive action of God. The fault of the failure of common grace to save the sinner, is chargeable to the sinner alone; and he has no right to plead a fault of his own as the reason why he is entitled to special grace. It is absurd for him to contend that God has no right to refuse him regenerating grace, because he has defeated the Divine mercy in common grace. The true way out of the difficulty for the sinner is, not to demand regenerating grace as a debt by denying that God has the right to withhold it, but to confess the sinful abuse and frustration of common grace, and to cry with the leper: ‘Lord, if thou wilt, thou canst make me clean.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 5, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><figure class="quote" id="q-956899ff18" data-kw="">
<blockquote><p>We have already advertised that this opinion is falsely laid upon us: That God does draw a man unresistibly [being unable to resist]. We only say that the elect, although they may resist a long time, yet at length they obey God calling, and their voluntary conversion is wrought certainly and infallibly, and that it cannot come to pass that they should never be converted, or being converted, that they should finally fall away and the grace of God should be at length extinguished, and be finally overcome by the resistance of the flesh.</p></blockquote>

</figure><figure class="quote" id="q-5b1ec6d995" data-kw="">
<blockquote><p>God, by way of an agreement [pacto], willed our salvation by a simple love [affectu] and that salvation is pleasing to him, so that unless sins hinder it, he effectually wills it… therefore because of this mixed [implicitae] will under a condition, we say that God has a conditional will, or as they say, willingness [velleitatem].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | “Davenant also often distinguishes between conditional and absolute decrees with respect to the voluntas simplicis complacentiae. Absolute decrees properly fall under God’s voluntas beneplaciti, whereas God’s voluntas simplicis complacentiae is often expressed conditionally in Scripture. Thus, when Scripture says God wills the salvation of all, it is on the condition of believing in Christ— an act “so agreeable unto Gods will that wheresoever it is found it shall be rewarded.” Consider, for example, God’s voluntas simplicis complacentiae by which God is said to desire or will the salvation of all. This will can be understood as an effectual will (virtually, in itself) with a condition. That is, it is a mixed conditional, as opposed to a mere conditional. As the sixteenth-century Jesuit Gabriel Vásquez explains, pp. 151-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

ture.+Thus%2C+when+Scripture+says+God+wills+the+salvation+of+all%2C+it+is+on+the+condition+of+believing+in+Christ%E2%80%94+an+act+%E2%80%9Cso+agreeable+unto+Gods+will+that+wheresoever+it+is+found+it+shall+be+rewarded.%E2%80%9D+Consider%2C+for+example%2C+God%E2%80%99s+voluntas+simplicis+complacentiae+by+which+God+is+said+to+desire+or+will+the+salvation+of+all.+This+will+can+be+understood+as+an+effectual+will+%28virtually%2C+in+itself%29+with+a+condition.+That+is%2C+it+is+a+mixed+conditional%2C+as+opposed+to+a+mere+conditional.+As+the+sixteenth-century+Jesuit+Gabriel+V%C3%A1squez+explains%2C+pp.+151-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5b1ec6d995.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b1ec6d995.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=God%2C%20by%20way%20of%20an%20agreement,or%20as%20they%20say%2C%20willingness%20%5Bvelleitatem&amp;text=God%2C%20by%20way%20of%20an%20agreement%20%5Bpacto%5D%2C%20willed&amp;text=conditional%20will%2C%20or%20as%20they%20say%2C%20willingness%20%5Bvelleitatem" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-001baf6d80" data-kw="">
<blockquote><p>Nor is it [baptism] to be administered in private places, or privately, but in the place of public worship, and in the face of the congregation, where the people may most conveniently see and hear; and not in the places where fonts, in the time of Popery, were unfitly and superstitiously placed.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-48dc2b88ba" data-kw="">
<blockquote><p>This Covenant was first published and made known by lively voice: afterwards it was committed to writing, the tables thereof being the holy Scripture. It was made both by word and oath (Ps. 85:4, 35; Dt. 29:12, 14; Isa. 54:9; Heb. 6:17-18; Gen. 22:16; Lk. 1:72), to demonstrate the certainty and constancy thereof: and sealed by the sacraments, which on God’s part do confirm the promise made by Him: and on man’s part are bills obligatory or hand-writings, whereby they testify and bind themselves to the performance of their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a></span></div>

</figure><figure class="quote" id="q-1f85e5fd28" data-kw="intention">
<blockquote><p>(1) The personal sin of one does not injure another who does not share in it. Now the defect of intention of the minister is the personal sin of that minister. Therefore it does not injure another not partaking of it—him, namely, who is the partaker of the sacrament rightly celebrated. However, it would injure him, if from the defect of that intention, the sacrament would be made void. 2. Because there is the same relation of the sacrament as of the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.7.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a> › <a href="../topics/the-sacraments-in-general/minister-and-intention/the-ministers-intention.html">The minister&#x27;s intention</a></span><span class="t"><a href="../topics/the-sacraments-in-general/minister-and-intention.html">Minister and Intention</a> › <a href="../topics/the-sacraments-in-general/minister-and-intention/who-administers.html">Who administers</a></span></div>

</figure><figure class="quote" id="q-df48507748" data-kw="">
<blockquote><p>4. A graceless man, as [Simon] Magus [Acts 8:9-13; 18-24], hath thus far right to demand the seals, that he may say to the Church, ‘You sin in withholding the seals, and therefore I require you baptize me, as Christ hath commanded you’: but he cannot say, ‘I have right, even external, to receive Baptism, and I sin not in receiving it.’ And Mr. Hooker’s argument to prove it is naught: ‘Why’, saith he, ‘Graceless men have the command of God to challenge the seals’; Magus hath the command of God to challenge, and to receive the Lord’s Supper. [Rutherford:] A command absolute he has none: show me such a command: Magus, Judas, eat and drink at the Lord’s Supper, challenge, claim and receive Baptism; All Israel eat the Passover, be ye real believers or hypocrites, be ye self-triers, and prepared or not, be ye clean or unclean. I confess there were no better right to challenge the seals than such a command, if any such were; but if Mr. Hooker or any of his read such a command, I pray I may see and read also. But Magus has only a conditional command, which gives him no true and real right, save only conditionally, to wit, Magus, receive the seals and the Lord’s Supper. So thou believe and examine thyself: if not, thou hast no right to the seals, but eatest and drinkest thine own damnation. And because these graceless men fulfill not the condition, and believe not, Mr. Hooker’s argument is wa[…]ry; They have right from the command of God, which is the b[irth?]right: that is, they have no right at all from a conditional command, they not fulfilling the condition, but such right as robbers have to the traveler’s purse; yea, they have no command of God, but the contrary: a severe discharge, Isa. 1:13, ‘Bring no more vain oblations.’ Mt. 22:12, ‘Friend, how camest thou in hither, not having a wedding garment?’ ‘He that eateth and drinketh unworthily, eateth and drinketh damnation to himself,’ 1 Cor. 11:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658) | ch. 18, ‘Answer to Mr. Hooker’s Arguments, that the Invisible Church is Not the First Subject of the Seals’</cite>, p. 88</span></figcaption>

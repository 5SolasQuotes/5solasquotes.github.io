<main class="wrap"><figure class="quote" id="q-70a1722148" data-kw="">
<blockquote><p>Therefore, this is our thesis: No good works of the regenerate, even which are most excellent before others from themselves or in themselves, can endure the judgment of God, because they are imperfect, impure, and mixed with vice, and therefore they have no reason of cause of our justification before God or of our absolution and acceptance to eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification Through the Righteousness of Christ Alone Freely Imputed, Obtained by Living Faith (1592) in R. Scott Clark and Casey Carmichael eds. Justification By Faith Alone (Grand Rapids: Reformation Heritage Books, 2023), 25-26.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Therefore, this is our thesis: No good works of the regenerate, even which are most excellent before others from themselves or in themselves, can endure the judgment of God, because they are imperfect, impure, and mixed with vice, and therefore they have no reason of cause of our justification before God or of our absolution and acceptance to eternal life.”

— Theodore Beza, A Defense of Justification Through the Righteousness of Christ Alone Freely Imputed, Obtained by Living Faith (1592) in R. Scott Clark and Casey Carmichael eds. Justification By Faith Alone (Grand Rapids: Reformation Heritage Books, 2023), 25-26.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+this+is+our+thesis%3A+No+good+works+of+the+regenerate%2C+even+which+are+most+excellent+before+others+from+themselves+or+in+themselves%2C+can+endure+the+judgment+of+God%2C+because+they+are+imperfect%2C+impure%2C+and+mixed+with+vice%2C+and+therefore+they+have+no+reason+of+cause+of+our+justification+before+God+or+of+our+absolution+and+acceptance+to+eternal+life.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Defense+of+Justification+Through+the+Righteousness+of+Christ+Alone+Freely+Imputed%2C+Obtained+by+Living+Faith+%281592%29+in+R.+Scott+Clark+and+Casey+Carmichael+eds.+Justification+By+Faith+Alone+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+2023%29%2C+25-26.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70a1722148.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/70a1722148.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/06/beza-no-good-works-can-save-you/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

</figure><figure class="quote" id="q-6cae4a7dae" data-kw="">
<blockquote><p>But this fruit (of Christ’s death) the apostle says belongs not promiscuously to all, but to them only who obey Him; For only these do accept the offered benefit. The rest by their own fault are deprived of it, because they obstinately refuse it: To obey Christ is not only to profess the name of Christ, but it is to acknowledge Christ the only perfect Redeemer, by true affiance to adhere to him and to live worthy the Gospel. This condition is in the whole Gospel required in them that must be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 404 | On Heb.</cite>, 5:9</span></figcaption>

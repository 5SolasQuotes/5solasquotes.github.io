</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-addf886a5b" data-kw="">
<blockquote><p>I will make your cause better than you have made it, but not by making other men’s worse, but by opening the reconciling truth.

I. I shall tell you in what sense God’s will and decrees may and must be said to have an extrinsic cause, without change in God. (Predestinatio nihil ponit in praedestinato inquit [Predestination places nothing in the one who is predestined]; Aquinas, pt. 1, q. 23, art. 2)

      1. Know therefore that God’s essence is his will, but not as essence. To say that God is God, and that God wills this or that, are not terms of the same signification.

      2. God’s will is his essence denominated from some amiable good as the object; and so there is ever quid respectivum [in that respect] in the notion of will.

      3. As God wills Himself, the act being perfectly immanent, his will is called Himself much more properly than his will of things extrinsic (which is ever either effectively, or at least objectively transient), because it is God that wills, and that is willed or loved (which made many ancients say that this was the Third Person in the Trinity).

      4. But as God wills things ad extra [to things outside Himself], though it is his essence that so wills them, yet it is unfit to say simply that this will is God; e.g. that to will Peter’s salvation is God, because the name ‘will’ here includes the thing willed.

      5. And therefore when we speak of God’s will in the universal notion, as abstracted from all particular objects and acts, it is less inconvenient to say simply that this will is God than when we speak of his will in act ad extra. By this time you may see that though God’s will, as his essence, has no cause, yet his will as denominated extrinsically from the object may have some kind of cause, that is objective, which is quasi materia actus [the matter of the act, as it were], and the terminus sine quo non [end-without-which-nothing] (Alvarez himself says that by a ’cause’ he means also any objective condition or reason of the act); that is, God’s will is not denominated a complacency in Christ existent or in Peter regenerate, or his understanding a seeing that the world was good before any of these things did exist. (This is all that Ruiz’s reasons prove, Of the Will of God, disp. 115, sect. 4, p. 102, who says that there is more than extrinsic denomination; et relatio rationis quam realis formalitas [and a relation of reason rather than a real formality]. But he does but show by his quodammodo [in some way], that he knows not what to say.) So that by extrinsic denomination, without any change in God, He may and should be said de novo [of new] to know things to be existent, to be past, to will things as existent with complacency or will them with displicency: But not to will the futurity of men’s damnation de novo; but yet his will of the futurity of men’s damnation has several degrees of the objective cause, from whence it is denominated: As in esse cognito [known being], the person who is the object is in order of nature first a man, a subject, and then a sinner, and a despiser of mercy, and then a damnable sinner. And so these are indeed conditions in the object, or causae sine quibus non [causes without which nothing], or objective material-constituent causes, not in themselves, but the foresight of them, not of God’s will as his essence, nor of his will as a will, but of his will as extrinsically denominated: a decree to damn Judas, e.g. because no otherwise is Judas an object capable of giving such an extrinsic denomination to God’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, pp. 8-9</span></figcaption>

<blockquote><p>If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.”

— William Perkins, A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601), p. 44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+we+compare+this+text+%5BMatt+23%3A37%2C+Christ+lamenting+over+Jerusalem%5D+with+Isa.+6%3A10+they+seem+to+be+contrary.+For+here+Christ+says%2C+%E2%80%98I+would+have+gathered+you%E2%80%99%3A+there+He+says%2C+%E2%80%98Harden+them+that+they+be+not+gathered+and+converted.%E2%80%99+God+therefore+seems+to+will+and+not+to+will+one+and+the+same+thing.+Answer%3A+There+is+but+one+will+in+God%3A+yet+does+it+not+equally+will+all+things%2C+but+in+diverse+respects+it+does+will+and+nil+the+same+thing.+He+wills+the+conversion+of+Jerusalem%2C+in+that+He+approves+it+as+a+good+thing+in+itself%3A+in+that+He+commands+it%2C+and+exhorts+men+to+it%3A+in+that+He+gives+them+all+outward+means+of+their+conversion.+He+wills+it+not%2C+in+that+He+did+not+decree+effectually+to+work+their+conversion.+For+God+does+approve%2C+and+He+may+require+many+things%2C+which+nevertheless+for+just+causes+known+to+Himself%2C+He+will+not+do.+The+confirmation+of+the+angels+that+fell%2C+God+approved+as+a+thing+good+in+itself%2C+yet+did+not+He+will+to+confirm+them.+A+judge+in+compassion+approves+and+will%5Bs%5D+the+life+of+a+malefactor%3A+and+yet+withal+he+wills+the+execution+of+justice+in+his+death.+Even+so+God+sometimes+wills+that+in+his+signifying+will%2C+which+He+wills+not+in+the+will+of+his+good+pleasure.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Treatise+of+God%E2%80%99s+Free+Grace+%26+Man%E2%80%99s+Free+Will+%28Cambridge%2C+1601%29%2C+p.+44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c2f5df2d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c2f5df2d3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=If%20we%20compare%20this%20text%20%5BMatt,the%20will%20of%20his%20good%20pleasure&amp;text=If%20we%20compare%20this%20text%20%5BMatt%2023%3A37%2C%20Christ&amp;text=not%20in%20the%20will%20of%20his%20good%20pleasure" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4e40a5d205" data-kw="">
<blockquote><p>And so as to all the approbatory, exhortatory, remunerative will of God, it may truly be said that He wills these natural duties because they are good, and not that they are good because He wills them. As, also, that there is no further free act of his will necessary to make them good, or duty, besides this making man and the nature of creatures; but as to God’s creating will, which laid the foundation of this duty, it may truly be said, that all such duties are duties because He wills them; for He might have chosen to have made man, or have made him not man, but somewhat else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity</cite>, section 15 in The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory, pp. 11-12, p. 12</span></figcaption>

<blockquote><p>Question 13: Whether God wills Himself as the end, and creatures as means? Distinguished. Answer: As the ultimate end He always wills Himself, Prov. 16:4. Creatures, and their actions, He sometimes wills as means in respect of others, sometimes as ends; but those ends are always subordinated, in respect of God, who is the universal and ultimate end of all things, Rom. 11, last verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5 (Utrecht, 1669) tr. AI by Roman Prestarri Latin</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e458fb20dc" data-kw="">
<blockquote><p>The third point comes now to be considered, namely the harmony or consent of both wills. For the words are, ‘I would, ye would not.’ [Mt. 23:37] Here it may justly be demanded whether there be a harmony or consent between God’s will and man’s will, and how it stands with this text. I answer, there is an excellent harmony: and generally it stands in this, that God’s will has a sovereign lordship over the will of man, and man’s will stands subject to it absolutely, and simply depends upon it. And by this means, where man has a will, God has an antecedent will;† and where man’s will has any stroke or action, there God’s will formerly had his stroke and action. † [Given the context and below, it is likely Perkins means God’s will of decree is antecedent to man’s will, involving the predetermination of man’s will. Perkins below criticizes Damascene’s sense of the term antecedent will.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, pp. 133-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-cd5332d564" data-kw="">
<blockquote><p>6. Next it must be noted how peremptorily he [a Romish adversary] charges me with ignorance for saying this antecedent will is not simply, properly and formally in God. But he should have considered that when I said so, I spoke in the words of Durand (Durand, bk. 1, dist. 46, quest. 1), one of his own side, whom I alleged in the margin: that, if it were false I said, yet the ignorance should not be fathered on me, but on them that begot it. For I said the truth, and himself is ignorant of the doctrine of his own Church. For Thomas handling this antecedent will, says (pt. 1, quest. 19, art. 6, to obj. 1), ‘We do not simply will what we will antecedently; and therefore this antecedent will may rather be called a velleity than an absolute will. (magis dici potest velleitas quam absoluta voluntas) A velleity, that is to say as Gregory of Valence expounds him (Commentary on Thomas, pt. 1, disp. 1, quest. 19, point 2), ‘a certain conditionated will; when that only can be said simply to be willed, that is willed consequently.’ Where we see that Thomas reduces this antecedent will to an imperfect kind of willing, which he calls a velleity, which is not a simple, proper or formal will: and the most Schoolmen follow him upon this ground, because there cannot be a formal will in God which is not fulfilled, as the salvation of all men is not. Hence it is says Suarez (Tract on Predestination, bk. 4, ch. 2, no. 2), that some have inferred that this of God whereby He would the salvation of all men, is no proper and formal act of willing in God: because He has no imperfect act of willing, as they call velleity, but only a signification of will (voluntatem signi), which only is metaphorical and interpretative, in that He carries Himself towards men, as if He had that act of willing. Thus think Cajetan and Marsilius. Others say, the formal and proper will of God reaches not to the salvation of all men, for that cause because it is not fulfilled, but only to the giving of sufficient means: which will, only to appoint sufficient means, is formal in God, and thereof God is said to will the salvation of all men: and of this mind are many Schoolmen. This will of God, says Vasquez (in pt. 1 of Thomas, disp. 83, no. 22), whereby He would the salvation of all men, even of the reprobate, very many Schoolmen, especially the newer, think to be only a conditionated will, which they call a velleity: whose act is not absolute and perfect, but under condition. Now the probabler opinion, says Dominicus Bannes (Commentary, pt. 1, quest. 19, art. 6, conclusion 2), is that there is formally no will in God which is signified by the name of velleity. Whence it follows that since by the doctrine of Thomas and many others, this antecedent will is but a velleity, it cannot be formally in God. But to take down this raw student yet a little more, Soto Major says (in tome above, p. 274): This word, God will the salvation of all men, by the good leave of so many ancient authors, we will not only expound of will properly so called, which is God’s good pleasure, but of his antecedent will; that is to say, an imaginary and metaphorical will: according to the which, it is no inconvenience to say, God will have all men to be saved: of which antecedent will, or will improperly so called, Damascene speaks (p. 279). And again: Damascene’s antecedent will is but a general, metaphorical and improper will, which they call a velleity. Here you see that Damascene and Thomas’s antecedent will is but a velleity, and this velleity is no will simply or formally in God; and therefore I spoke not ignorantly, but after the mind of the best Schoolmen that write when I said out of Durand that this antecedent will is not simply, properly and formally the will of God, but knew well enough what I said: and such as hold the contrary, that this antecedent will whereby God is said to will the salvation of all men, is simply, properly or formally the will of God, are driven to hold a paradox, that God’s absolute will, which is defined to be the will of his good pleasure, may be defeated and not accomplished (Opus est fateri non omnem voluntatem Beneplaciti semper impleri. Magal. in Tim., p. 252): which is a desperate shift and contrary to the doctrine of the best ancient divines in the Church of Rome (Thomas, pt. 1, quest. 19, art. 6; Master [of the Sentences, Lombard], bk. 1, dist. 46, where Scotus, Ockham, Dionysius Capreollus, dist. 45, quest. unic. art. 2, concl. 5; Cajetan on 1. Tim. 2:4; Dominic Banez, pt. 1, quest. 19, art. 6, concl. 2, in sum. text. Perer., Select Disputations on Jn. 1, no. 73); and directly against the Scripture, which says, ‘Our God has done whatsoever pleased Him in heaven and earth.’ (Ps. 135:6) ‘Who has resisted his will?’ (Rom. 9:19) ‘Who works all things according to the counsel of his own will.’ (Eph. 1:11)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Way to the True Church… wherein the motives leading to papistry… are handled and fully disputed (London: Field, 1614), ch. 25, pp. 212-14 White (1570–1615) was an English clergyman, a royal chaplain and controversialist.</cite></span></figcaption>

n+God%3A+because+He+has+no+imperfect+act+of+willing%2C+as+they+call+velleity%2C+but+only+a+signification+of+will+%28voluntatem+signi%29%2C+which+only+is+metaphorical+and+interpretative%2C+in+that+He+carries+Himself+towards+men%2C+as+if+He+had+that+act+of+willing.+Thus+think+Cajetan+and+Marsilius.+Others+say%2C+the+formal+and+proper+will+of+God+reaches+not+to+the+salvation+of+all+men%2C+for+that+cause+because+it+is+not+fulfilled%2C+but+only+to+the+giving+of+sufficient+means%3A+which+will%2C+only+to+appoint+sufficient+means%2C+is+formal+in+God%2C+and+thereof+God+is+said+to+will+the+salvation+of+all+men%3A+and+of+this+mind+are+many+Schoolmen.+This+will+of+God%2C+says+Vasquez+%28in+pt.+1+of+Thomas%2C+disp.+83%2C+no.+22%29%2C+whereby+He+would+the+salvation+of+all+men%2C+even+of+the+reprobate%2C+very+many+Schoolmen%2C+especially+the+newer%2C+think+to+be+only+a+conditionated+will%2C+which+they+call+a+velleity%3A+whose+act+is+not+absolute+and+perfect%2C+but+under+condition.+Now+the+probabler+opinion%2C+says+Dominicus+Bannes+%28Commentary%2C+pt.+1%2C+quest.+19%2C+art.+6%2C+conclusion+2%29%2C+is+that+there+is+formally+no+will+in+God+which+is+signified+by+the+name+of+velleity.+Whence+it+follows+that+since+by+the+doctrine+of+Thomas+and+many+others%2C+this+antecedent+will+is+but+a+velleity%2C+it+cannot+be+formally+in+God.+But+to+take+down+this+raw+student+yet+a+little+more%2C+Soto+Major+says+%28in+tome+above%2C+p.+274%29%3A+This+word%2C+God+will+the+salvation+of+all+men%2C+by+the+good+leave+of+so+many+ancient+authors%2C+we+will+not+only+expound+of+will+properly+so+called%2C+which+is+God%E2%80%99s+good+pleasure%2C+but+of+his+antecedent+will%3B+that+is+to+say%2C+an+imaginary+and+metaphorical+will%3A+according+to+the+which%2C+it+is+no+inconvenience+to+say%2C+God+will+have+all+men+to+be+saved%3A+of+which+antecedent+will%2C+or+will+improperly+so+called%2C+Damascene+speaks+%28p.+279%29.+And+again%3A+Damascene%E2%80%99s+antecedent+will+is+but+a+general%2C+metaphorical+and+improper+will%2C+which+they+call+a+velleity.+Here+you+see+that+Damascene+and+Thomas%E2%80%99s+antecedent+will+is+but+a+velleity%2C+and+this+velleity+is+no+will+simply+or+formally+in+God%3B+and+therefore+I+spoke+not+ignorantly%2C+but+after+the+mind+of+the+best+Schoolmen+that+write+when+I+said+out+of+Durand+that+this+antecedent+will+is+not+simply%2C+properly+and+formally+the+will+of+God%2C+but+knew+well+enough+what+I+said%3A+and+such+as+hold+the+contrary%2C+that+this+antecedent+will+whereby+God+is+said+to+will+the+salvation+of+all+men%2C+is+simply%2C+properly+or+formally+the+will+of+God%2C+are+driven+to+hold+a+paradox%2C+that+God%E2%80%99s+absolute+will%2C+which+is+defined+to+be+the+will+of+his+good+pleasure%2C+may+be+defeated+and+not+accomplished+%28Opus+est+fateri+non+omnem+voluntatem+Beneplaciti+semper+impleri.+Magal.+in+Tim.%2C+p.+252%29%3A+which+is+a+desperate+shift+and+contrary+to+the+doctrine+of+the+best+ancient+divines+in+the+Church+of+Rome+%28Thomas%2C+pt.+1%2C+quest.+19%2C+art.+6%3B+Master+%5Bof+the+Sentences%2C+Lombard%5D%2C+bk.+1%2C+dist.+46%2C+where+Scotus%2C+Ockham%2C+Dionysius+Capreollus%2C+dist.+45%2C+quest.+unic.+art.+2%2C+concl.+5%3B+Cajetan+on+1.+Tim.+2%3A4%3B+Dominic+Banez%2C+pt.+1%2C+quest.+19%2C+art.+6%2C+concl.+2%2C+in+sum.+text.+Perer.%2C+Select+Disputations+on+Jn.+1%2C+no.+73%29%3B+and+directly+against+the+Scripture%2C+which+says%2C+%E2%80%98Our+God+has+done+whatsoever+pleased+Him+in+heaven+and+earth.%E2%80%99+%28Ps.+135%3A6%29+%E2%80%98Who+has+resisted+his+will%3F%E2%80%99+%28Rom.+9%3A19%29+%E2%80%98Who+works+all+things+according+to+the+counsel+of+his+own+will.%E2%80%99+%28Eph.+1%3A11%29%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Defence+of+the+Way+to+the+True+Church%E2%80%A6+wherein+the+motives+leading+to+papistry%E2%80%A6+are+handled+and+fully+disputed+%28London%3A+Field%2C+1614%29%2C+ch.+25%2C+pp.+212-14+White+%281570%E2%80%931615%29+was+an+English+clergyman%2C+a+royal+chaplain+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcd5332d564.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd5332d564.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=6.%20Next%20it%20must%20be%20noted,of%20his%20own%20will.%E2%80%99%20%28Eph.%201%3A11%29" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

<blockquote><p>XXIV. All these [previous] things are not therefore spoken that we should reject this distinction of the will of God into his antecedent and consequent will: For we know that among the decrees of God, some are before and some are after in order. But we deny that there are two decrees of God, between which man’s will steps in, as if man’s will came between the decree of creating man and the decree of condemning certain men. But we deny that the will of man does so come between the two decrees of God that the first, or antecedent decree, is broken off by the will of man and that God is compelled to absist from that end which He had propounded to Himselfe and which He did seriously intend: We deny also in the work of our election, the precise will of God to depend on the foreseeing of any power or action of man’s free-will, or the consequent will of God to be suspended on man’s will.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a6f09fda47" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker [a congregationalist] leaves out the chief word, wherein stands the force of my argument, he speaks nothing of God’s revealed intention and command to call in fools that they may be made wise, and he frames his answer, as if I had argued from the bare intention and hidden decree of God. But I find that Mr. Hooker utterly mistakes the distinction of God’s decree, and of his approving will, and therefore he takes for one and the same, the decree or intention of God (from which I bring not my argument) and the revealed intention of God, or his commanding will: the ignorance of which is a stumbling to Arminians, and Socinians, and to Mr. Hooker, who, as we shall hear, goes on with them, but I judge it one mistake in judgment in that godly man, but no heretical spirit, and therefore his defenders and followers would take heed to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), Book 1, ch. 8</cite>, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f567a20fa" data-kw="Sovereignty">
<blockquote><p>Here, speculative theologian, the discussion is not about the will of good pleasure, of which it is written, &#x27;Whatsoever the Lord pleased, that did he in heaven and in earth,&#x27; and that &#x27;no one can resist his will.&#x27; That is plain, because we see that not all men come to the knowledge of the truth. Rather, the discussion is about the will of sign, by which God sets before all men the precepts of salvation and the doctrine of the Gospel. It is charged against those who refuse to come to the knowledge of the truth and refuse to be saved, of which it is written, &#x27;How often would I have gathered thy children, and ye would not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-de-vio-cajetan.html">Thomas de Vio Cajetan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In omnes D. Pauli et aliorum Apostolorum Epistolas Commentarii</cite>, on 1 Tim. 2:4 (Opera omnia, vol. 5, p. 295, col. 1)</span></figcaption>

</figure><figure class="quote" id="q-2cf47a9734" data-kw="">
<blockquote><p>I long ago began a treatise [Baxter’s Catholick Theology] to reconcile the Arminians and Anti-Arminians in these matters… And because I know not whether ever I shall live to reassume it… I must give the judicious a few hints of the media [means] of conciliation which I would have used: … 20. The doctrine of God’s antecedent and consequent will must be better explained, as being but his governing will, so called from legislation and judgment, which are the antecedent and consequent parts of government. 21. So must God’s will de naturalibus et moralibus [of natural and moral things], and his legislative antecedent will be well opened, and the uselessness and confusion of the distinction of signi [sign] and beneplaciti [good-pleasure] manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry… (London: Parkhurst, 1681)</cite>, pp. 122-23, 127</span></figcaption>

</figure><figure class="quote" id="q-0ffc758c98" data-kw="">
<blockquote><p>34. The Will of God is the other faculty of the life of God, or the act that follows, by which God knows Himself and wills and approves of all good things as they agree unto the nature and order of his mind, the contraries He necessarily disapproves, which will is called approving; and out of which things He is able to do, some He freely wills, chooses and decrees by a foregoing wisdom, and does, which is the effecting will;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-anthoy-thysius.html">Sr. Anthoy Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis 34 in The Sixth of the Theological Disputations in On the Nature of God &amp; the Divine Attributes (d. 1640; Leiden, 1620) This disputation is also in the Synopsis of Pure Theology as disputation 6.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-12c2017005" data-kw="">
<blockquote><p>The fact that all the true people of God in every age and in every part of the Church, in the exercise of their private judgment, in accordance with the simple rules above stated, agree as to the meaning of Scripture in all things necessary either in faith or practice, is a decisive proof of the perspicuity of the Bible, and of the safety of allowing the people the enjoyment of the divine right of private judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea02d03b91" data-kw="">
<blockquote><p>The other, then, is the external judgment; by which, we judge, to the greatest certainty, of the spirits and doctrines of all men; not for ourselves only, but for others also, and for their salvation. This judgment is peculiar to the public ministry of the Word and the external office, and especially belongs to teachers and preachers of the Word. Of this we make use, when we strengthen the weak in faith, and when we refute adversaries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>

</figure><figure class="quote" id="q-ada3721f7b" data-kw="Church as witness">

<div class="actions"><button class="copy" data-copy="“The church does indeed deliver that rule, not as its author, but as a witness, and an admonisher, and a minister: it judges also when instructed by the Holy Spirit.”

</figure><figure class="quote" id="q-881fe0274c" data-kw="">
<blockquote><p>But we hold that the interpretation of the Scripture to be orthodox and genuine which is gleaned from the Scriptures themselves (from the nature of the language in which they were written, likewise according to the circumstances in which they were set down, and expounded in the light of like and unlike passages and of many and clearer passages) and which agree with the rule of faith and love, and contributes much to the glory of God and man&#x27;s salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-5b92934789" data-kw="">
<blockquote><p>Although we allow to individual believers the judgment of private discretion (because &quot;he that is spiritual judgeth all things&quot; [1 Cor. 2:15], and the apostle commands us to &quot;prove all things&quot; [1 Thess. 5:21]), we do not therefore assert in opposition to Peter (2 Pet. 1:20*) that the Scriptures are of private interpretation (idia epilysis). For epilysis here does not mean the interpretation of the Scriptures so much as the origin of the prophetic oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.33</span></figcaption>

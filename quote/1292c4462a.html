<main class="wrap"><figure class="quote" id="q-1292c4462a" data-kw="">
<blockquote><p>…repentance is taken sometimes largely and sometimes strictly: By this distinction it may easily appear how sorrow goes before repentance and how repentance goes before faith. Indeed, for the latter is the great controversy, but some reconcile it thus: Repentance has two parts, the aversion of the soul from sin, and the conversion of the soul to God; the latter part of it is only an effect of faith, the former part of it, viz. the turning of the soul from sin is also an effect, but not only an effect, for it is begun before faith, though it be not ended till our life end. Some object that God works repentance and faith together: But we dispute not how God works them, but how the soul acts them; not which is in the soul first, but which appears out of the soul first: neither is it any new thing in philosophy to say those causes which produce an effect, though they be in time together, yet are mutually before one another in order of nature, in diverse respects to their several causalities. Thus a man must have repentance before he have saving and justifying faith; and yet a man must have faith before the work of repentance be perfect in the soul. As we maintain repentance to be a precedent work, so we deny it not to be a subsequent effect: Sorrow is before the birth too, as the apostle intimates, 2 Cor. 7:10, ‘Godly sorrow works repentance,’ that is, sorrow prepares a man for repentance, it goes afore it and prepares for it. And now it is that God’s spirit begins to renew his heart…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 29-30 of ‘The New Birth’ in Prima the First Things... (London, 1650)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b7beba402" data-kw="">
<blockquote><p>As for repentance and new obedience; there is as much difference between them and faith, in regard of its peculiar office, in this latter [New] Covenant; so much more between them and works in the former [Old Covenant]. 1. Between them and faith, in the point of justification, or the discharge of a sinner from the guilt of his sins; for that, howsoever they are both required as conditions to be necessarily performed by all those that expect life, or pardon of sin, and salvation by Christ; yet neither of them comes in, as having any hand in the business of our justification, or discharge of us from the guilt of our sin; because that neither do they cast ought in toward the discharge of our debt, nor have they any peculiar act in the application of, or special relation unto, that whereby our debt is discharged. Whereas our faith, though it afford not the least mite of itself toward the making up of that price wherewith our debt is to be discharged, yet it is that whereby we receive Jesus Christ (Jn. 1:12) and in Him and with Him the price by Him paid for us, and whereby we trust to Him and rely upon Him for the discharge of our debt by the merit of his sufferings: in regard whereof it is called, as ‘faith on Christ’ (Acts 20:21; 26:18), so more specially, on his blood. (Rom. 3:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away</cite>, Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646), p. 47</span></figcaption>

</figure><figure class="quote" id="q-0c51fe25c0" data-kw="">
<blockquote><p>Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, (London: Griffin, 1615), on Col. 2:18, p. 704</span></figcaption>

</figure><figure class="quote" id="q-b2f5dcfd25" data-kw="">
<blockquote><p>There is a great difference between vocation and justification. Vocation precedes, justification follows. Justification praesupponit aliquid [presupposes something], viz. faith and repentance; Effectual Calling ponit haec, non autem praesupponit [posits this, but does not presuppose it]. (Conference between Cameron and Tilen)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 512</span></figcaption>

<blockquote><p>Therefore secondly, we say that there are other graces coexistent with faith in the person justified. A solitary faith is not a saving and justifying faith: Faith, if it has not works, is dead, being alone. Faith that is alone saves not, though faith alone save. As the act of seeing is by the eye only, without the ear, or other senses; the eye only sees; the ear sees not, nor the taste, nor the smell, nor the feeling; yet the eye could not see if you should take away the other senses from the body. So it’s faith only that justifies without other graces or good works; yet faith without them, or separated from them, cannot justify: because indeed it cannot be without them in the person or subject where it is. So that faith is without other graces and works in its office, but not in its existence. And you may as soon part light and heat in the sun, as sanctification from justification in a believer. For faith is not only a fruit of the Spirit with other graces, but also the seed and nursery of other graces, because faith in Christ is the root-grace… It would be a strange soul that should give a faculty of seeing and no other faculty or sense: as strange a state of grace would that be that should give an act of saving and justifying faith and give no other grace besides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-grew.html">Obadiah Grew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord Jesus Christ the Lord our Righteousness</cite>, … (London, 1669), pp. 155-56</span></figcaption>

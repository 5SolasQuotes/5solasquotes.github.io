<blockquote><p>Defenders of unbiblical holy days often like to appeal to John Calvin’s toleration of the certain festivals at Geneva. Before claiming Calvin as one of their own, however, they should read what he had to say about Christmas when preaching on 25 December 1551:

Now, I see here today more people than I am accustomed to having at the sermon. Why is that? It is Christmas day. And who told you this? You poor beasts. That is a fitting euphemism for all of you who have come here today to honour Noel. Did you think you would be honouring God?

Consider what sort of obedience to God your coming displays. In your mind, you are celebrating a holiday for God, or turning today into one. But so much for that. In truth, as you have often been admonished, it is good to set aside one day of the year in which we are reminded of all the good that has occurred because of Christ’s birth in the world, and in which we hear the story of his birth retold, which will be done Sunday. But if you think that Jesus Christ was born today, you are as crazed as wild beasts. For when you elevate one day alone for the purpose of worshipping God, you have just turned it into an idol. True, you insist that you have done so for the honour of God, but it is more for the honour of the Devil.

Let us consider what our Lord has to say on the matter. Was it not Saul’s intention to worship God when he spared Agag, the king of the Amalekites, along with the best spoils and cattle? He says as much: “I want to worship God.” Saul’s tongue was full of devotion and good intention. But what was the response he received? “You soothsayer! You heretic! You apostate! You claim to be honouring God, but God rejects you and disavows all that you have done!” [see 1 Samuel 15:8-9].

Consequently, the same is true of our actions. For no day is superior to another. It matters not whether we recall our Lord’s nativity on a Wednesday, Thursday, or some other day. But when we insist on establishing a service of worship based on our whim, we blaspheme God, and create an idol, though we have done it all in the name of God. And when you worship God in the idleness of a holiday spirit, that is a heavy sin to bear, and one which attracts others about it, until we reach the height of iniquity.

Therefore, let us pay attention to what Micah is saying here, that God must not only strip away things that are bad in themselves, but must also eliminate anything that might foster superstition. Once we have understood that, we will no longer find it strange that Noel is not being observed today, but that on Sunday we will celebrate the Lord’s Supper and recite the story of the nativity of our Lord Jesus Christ. But all those who barely know Jesus Christ, or that we must be subject to him, and that God removes all those impediments that prevent us from coming to him, these folk, I say, will at best grit their teeth. They came here in anticipation of celebrating a wrong intention, but will leave with it wholly unfulfilled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the book of Micah</cite>, trans. and ed. B. W. Farley (1551; Phillipsburg: Presbyterian and Reformed, 2003), pp 302-04.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7522500b5" data-kw="">
<blockquote><p>That King Hezekiah rent his clothes. He likewise adds the outward expressions of repentance, the “rending of the clothes and wearing sackcloth,” sprinkling of ashes, and other things of the same kind; for these were the ordinary signs of repentance, when, under the weight of any calamity by which they were afflicted, they confessed their guilt before God and implored pardon from him.

Wonderful is the modesty of the holy king, who, after having performed so many illustrious works, and after having been adorned by the excellence of so many virtues, does not hesitate to prostrate himself humbly before God; and, on the other hand, wonderful is his courage and the steadfastness of his faith, in not being hindered by the weight of so heavy a temptation from freely seeking God by whom he was so severely smitten.

Scarcely do we find one man in a hundred who does not murmur if God treats him with any degree of severity, who does not bring forward his good deeds as a ground of complaint, and remonstrate that he has been unjustly rewarded. Other men, when God does not comply with their wishes, complain that their worship of God has served no good purpose.

We perceive nothing of this kind in Hezekiah, who, though he is conscious of possessing uncommon piety, does not shrink from a confession of guilt, and therefore if we desire to turn away God’s anger, and to experience his favour in adversity, we must testify our repentance and sincerely acknowledge our guilt; for adversity does not fall out to us by chance, but is the method by which God arouses us to repentance.

True, indeed, sackcloth and ashes will be of little avail, if they be not preceded by the inward feelings of the heart; for we know that hypocrites are abundantly liberal in the use of ceremonies; but as we have formerly said, the Holy Spirit justly commends those exercises, when they are directed to their proper object. And indeed it was a proof of uncommon piety and modesty, that the pious king and the whole nation excited themselves in this manner to fear God, and that he made a voluntary acknowledgement of guilt in a form attended by wretched filthiness; for we know how unwilling kings are to let themselves down from their rank.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 8: 106-07.</span></figcaption>

<blockquote><p>Why the Church is called a temple it is not difficult to perceive. It is so called in allusion to the sacred edifice, which, by Divine command, was erected in Jerusalem. That edifice was dedicated to the service of God, and so are all those who believe in Jesus. They feel that they are not their own, and they are taught to glorify God in their bodies and in their spirits, which are his. In the Jewish temple, the Lord was pleased to reveal his glory; and so he does in the Church, but more spiritually and more fully. He manifests himself to all that love and serve him. While the eyes of other men are darkened by the influence of sin, their eyes are opened to discern the Divine glory in the face of Jesus Christ.

The Jewish temple was regarded as God’s residence, for the visible emblem of his glory dwelt between the cherubims. And is not his life-giving presence with his Church on earth? Has he not promised to be always with his people? In the one temple were observed the rites which he was pleased to institute; in the other, he is worshipped in spirit and truth. The world withholds from him its homage. Every unbeliever does so, whether outwardly connected with the Church or not. Those only who believe with the heart unto righteousness are his true worshippers. It is the Church which they constitute, that offers up to him the sacrifices of righteousness, and the grateful incense of praise and supplication. Most fitly, then, is it styled “the temple of the Lord.”

Now, of this temple Jesus is the builder. Before a structure can be reared, the foundation must be laid; and Christ has laid the foundation of his Church. He virtually laid it in the counsels of eternity, when he undertook to accomplish the work of our redemption; and he actually laid it in the fulness of time, when he obeyed and suffered in our stead. He is himself the rock on which his Church is built; and on what other foundation could the temple of the Lord have stood unshaken and secure? Not on a foundation laid by man; for that, like man himself, would have been unstable as the sand. Not on a foundation laid by angels; for that, being the work of creatures, could have had no virtue in itself to sustain the interests of a ruined world.

None but Immanuel, God in our nature, could sustain this mighty load. What the strength of all creatures could never have achieved, he graciously undertook and accomplished to the full, although the work subjected him to humiliation and to suffering intense beyond conception. He satisfied the claims of eternal justice, and is therefore able to save unto the uttermost. O what cause of joy that the foundation laid in Zion is so firm and sure! No power in the universe can shake it; for it is laid by him who has all power in heaven and on earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-couper.html">David Couper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the Builder and Ruler of the Temple in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

— David Couper, Christ, the Builder and Ruler of the Temple in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhy+the+Church+is+called+a+temple+it+is+not+difficult+to+perceive.+It+is+so+called+in+allusion+to+the+sacred+edifice%2C+which%2C+by+Divine+command%2C+was+erected+in+Jerusalem.+That+edifice+was+dedicated+to+the+service+of+God%2C+and+so+are+all+those+who+believe+in+Jesus.+They+feel+that+they+are+not+their+own%2C+and+they+are+taught+to+glorify+God+in+their+bodies+and+in+their+spirits%2C+which+are+his.+In+the+Jewish+temple%2C+the+Lord+was+pleased+to+reveal+his+glory%3B+and+so+he+does+in+the+Church%2C+but+more+spiritually+and+more+fully.+He+manifests+himself+to+all+that+love+and+serve+him.+While+the+eyes+of+other+men+are+darkened+by+the+influence+of+sin%2C+their+eyes+are+opened+to+discern+the+Divine+glory+in+the+face+of+Jesus+Christ.%0A%0AThe+Jewish+temple+was+regarded+as+God%E2%80%99s+residence%2C+for+the+visible+emblem+of+his+glory+dwelt+between+the+cherubims.+And+is+not+his+life-giving+presence+with+his+Church+on+earth%3F+Has+he+not+promised+to+be+always+with+his+people%3F+In+the+one+temple+were+observed+the+rites+which+he+was+pleased+to+institute%3B+in+the+other%2C+he+is+worshipped+in+spirit+and+truth.+The+world+withholds+from+him+its+homage.+Every+unbeliever+does+so%2C+whether+outwardly+connected+with+the+Church+or+not.+Those+only+who+believe+with+the+heart+unto+righteousness+are+his+true+worshippers.+It+is+the+Church+which+they+constitute%2C+that+offers+up+to+him+the+sacrifices+of+righteousness%2C+and+the+grateful+incense+of+praise+and+supplication.+Most+fitly%2C+then%2C+is+it+styled+%E2%80%9Cthe+temple+of+the+Lord.%E2%80%9D%0A%0ANow%2C+of+this+temple+Jesus+is+the+builder.+Before+a+structure+can+be+reared%2C+the+foundation+must+be+laid%3B+and+Christ+has+laid+the+foundation+of+his+Church.+He+virtually+laid+it+in+t </figure><figure class="quote" id="q-8032717e6d" data-kw="">
<blockquote><p>Oh! the wise invention of the teacher who contrived that while we were singing we should at the same time learn something useful; by this means, too, the teachings are in a certain way impressed more deeply on our minds. Even a forceful lesson does not always endure, but what enters the mind with joy and pleasure somehow becomes more firmly impressed upon it.

What, in fact, can you not learn from the psalms? Can you not learn the grandeur of courage? The exactness of justice? The nobility of self-control? The perfection of prudence? A manner of penance [repentance]? The measure of patience? And whatever other good things you might mention? Therein is perfect theology, a prediction of the coming of Christ in the flesh, a threat of judgment, a hope of resurrection, a fear of punishment, promises of glory, an unveiling of mysteries; all things, as if in some great public treasury, are stored up in the Book of Psalms.

To it, although there are many musical instruments, the prophet adapted the so-called harp, showing, as it seems to me, that the gift from the Spirit resounded in his ears from above. With the cithara and the lyre the bronze from beneath responds with sound to the plucking, but the harp has the source of its harmonic rhythms from above, in order that we may be careful to seek the things above and not be borne down by the sweetness of the melody to the passions of the flesh. And I believe this, namely, that the words of prophecy are made clear to us in a profound and wise manner through the structure of the instrument, because those who are orderly and harmonious in soul possess an easy path to the things above.</p></blockquote>

</figure><figure class="quote" id="q-24865c5f13" data-kw="">
<blockquote><p>God gave to his people, the Jews, a civil, as well as a moral law; and he constituted the Sabbath a civil, as well as a religious institution. In one instance, at least, during the sojourn of the children of Israel in the wilderness, the presumptuous violation of the law of the Sabbath was visited by the penalty of death.

The fact that God made it a civil institution, indicates clearly the duty of all civil legislators, unless it can be shown that the reasons why the Jewish nation should have a Sabbath, do not apply to other nations. But as individuals and families have their respective accountability to God, so do nations. And as the civil ruler is “a minister of God,” he must make his legislation conform to God’s legislation. …

Now, God has commanded all men to remember the Sabbath-day to keep it holy; no civil ruler, therefore, has the right to require his subjects to labour on that day, save in case of necessity. And since ”righteousness exalteth a nation,” it is the wisdom of civil rulers to protect the people, in the enjoyment of the divinely-appointed day for the cultivation of virtue. This is eminently true of a free government, since all such governments depend upon the moral forces. The Sabbath, then, originated in the moral necessities of nations, as well as of individuals and families.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathan-l-rice.html">Nathan L. Rice</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Origin and History of the Sabbath in The Christian Sabbath: Its History, Authority, Duties, Benefits, and Civil Relations. A Series of Discourses</cite></span></figcaption>

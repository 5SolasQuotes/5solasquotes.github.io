<main class="wrap"><figure class="quote" id="q-e568ece11d" data-kw="">
<blockquote><p>Christ, as God the Son, is of one substance, power, and eternity with God the Holy Spirit. Christ also, as the Son of man, had the Spirit bestowed on him without measure. His human nature was formed, in body and soul, and sanctified from the first, by the special operation of the Spirit. He was anointed with the immeasurable plenitude of the Spirit. By the light of the Spirit, the Man Christ Jesus thought all his thoughts; by the grace of the Spirit, willed all his purposes; by the strength of the Spirit wrought all his works; till finally he, “through the eternal Spirit, offered himself without spot to God,” thereafter rising from the dead by the Spirit of holiness, and ascending to pour out that Spirit of truth and consolations which he had promised so graciously to his disciples. In his Godhead, our Lord is one with the Spirit; and as man, – by the Spirit he was what he was.

When Christ, therefore, sends his Spirit, not to speak of himself, but to take of what is Christ’s and show it unto us; to create us again in Christ and like Christ; to dwell in us as in a living temple, as ourselves living spirits to which he has given a new and Christ-like life; – can we fail to see that there is something here which in no respect falls short even of the great marvel of our text, “Christ living in us?” Christ, the eternal Son, liveth in us, when the Spirit liveth in us; for the Spirit and the Son with the Father are inseparable in their joint possession of the all-fulness of the Godhead. And Christ, as God-man, the Son of man, the very Christ that tabernacled with men upon the earth, liveth in us, when the Spirit living in us confines himself to revealing Christ as the God-man, whose glory his disciples saw in human flesh, as the glory of the Only-begotten of the Father, full of grace and truth.

It is as the agent and ambassador of the God-man that the Spirit is given in the Church; it is the God-man whom the Spirit reveals and glorifies in the Church; it is within the limits of what he himself revealed and wrought in the God-man that he restricts himself in working in the Church or body of the faithful. He lives in them as he lived in him. He works to reveal in them progressively the truth which he implanted and developed in unclouded spiritual splendour in the mind of the Man Christ Jesus; to establish in them progressively the grace with which he replenished the heart of the Man Christ Jesus; – to conform them, in a word, to the “Firstborn of many brethren.” And how then can his in-dwelling, in-working, in-living in them be other than most adequately expressed by the doctrine that “Christ liveth in them?”

Christ, by his Spirit, liveth in them. By his Spirit he quickens them to new and spiritual life; and by his Spirit he takes possession of them as his living temple. As a living temple, he always regards them and acts in them. Their faculties as living men-alive from the dead-he animates and controls. Whatever in their thoughts, affections, purposes, actions, is opposed to his own, he sets himself to suppress; and the faculties themselves he undertakes to sanctify, – to form, and mould, and guide into harmony with his own. Nay; their whole character, their very natures, as living men, – spiritually living, he works by his Spirit to assimilate unto his own.

So far as this work advances, the very thoughts that he thinks they think; the affections he entertains they entertain; the purposes of his mind are theirs also; his work is their work; his nature theirs. And up to the limit to which this blessed result has in its onward progress been achieved, how can a better, a briefer, a more perfect expression be found for it, than to say that, to this extent, “Christ liveth in them?” It is, then, literally, profoundly true that Christ liveth in his people. He liveth in them by his Spirit which he hath given them.</p></blockquote>

<blockquote><p>The Spirit. Esa. 11.2. The Spirit with all the gifts thereof are upon him; is sent and given by God the Father, and abide in Christ. Yet it is said upon him because the Spirit came down from heaven and did visibly rest on him. On me, I, that is on my Humanity. Math. 3.16. So that these words signify thus much. The gifts of the Holy Ghost, proceeding from God my Father, doth reside and dwell in this my Humanity, which ye see; by which gifts, I am sanctified to this Office of Reconciliation.

[Object.] But it may be said, what Excellency hath Christ by this, above others; for the Prophet Esay affirms the like of him, and so may other Holy men, that they have the Spirit.

[Answ.] To this, answer is, That that of Esay is chiefly to be understood of Christ, and not of himself; and with great difference the Spirit doth reside in Christ and in others. And this difference appears in two things.

First, in the Universality of the gifts in Christ. Second, in the Perfection of gifts. As touching the first God did not bestow one or two, or more gifts on the Humanity of Christ, but he powered them out most plentifully on him. John 3.34, 35. Col. 2.3.9. It pleased the Father, that all fullness should dwell in him: all gifts are not given to one, but to every member, as much as seems good to the Spirit of God. 1 Cor. 12.11. For as the head is the common receptacle of all the senses, and doth exercise their faculties, when as yet, every Sense hath it distinct Office; In the execution whereof, they are employed. [Simile.] So our head Christ, is most fully furnished with all necessary gifts, to the animating of his body, when as yet the members of his body have their several functions and parts, in which all their faculty or ability is circumscribed.

For the second, all the gifts of Christ were most perfect in him, perfect Wisdom, Knowledge, Justice, Holiness; not inchoate, but in their perfect maturity. There was no defect of any gift, or in any; but all were ministered unto, absolute in all parts and degrees, to the full perfection of his Humanity; and this not only from some time of his Age, but from his first Conception. Luke 1.35. To his Resurrection and Ascension. 2 Cor. 5.21.

Now the gifts, given to the Saints, are only the first fruits, a handful and as earnest-pence. 1 Cor. 13.12. We know but in part, we Love but in part. So that we may easily see, how far the dwelling of the Spirit in holy men, differs from the manner of the same in Christ. In the one without measure, in the other in measure. In Christ full, in us in part; in him Primarily, In us, Secondarily. So that as great difference as there is twixt the spring, and the stream flowing thence. Twixt the light of the Moon and stars, and the Sun. [Simile.] The one being borrowed and imperfect, the other being original, and always equal. So great difference is there twixt Christ and his Saints in regard of gifts. And indeed, this plenitude of gifts, is one of the peculiar Prerogatives, which the Humanity of Christ hath received by the Hypostatical union; neither can they be found in any other person, who is not God and man.</p></blockquote>

st%2C+is+most+fully+furnished+with+all+necessary+gifts%2C+to+the+animating+of+his+body%2C+when+as+yet+the+members+of+his+body+have+their+several+functions+and+parts%2C+in+which+all+their+faculty+or+ability+is+circumscribed.%0A%0AFor+the+second%2C+all+the+gifts+of+Christ+were+most+perfect+in+him%2C+perfect+Wisdom%2C+Knowledge%2C+Justice%2C+Holiness%3B+not+inchoate%2C+but+in+their+perfect+maturity.+There+was+no+defect+of+any+gift%2C+or+in+any%3B+but+all+were+ministered+unto%2C+absolute+in+all+parts+and+degrees%2C+to+the+full+perfection+of+his+Humanity%3B+and+this+not+only+from+some+time+of+his+Age%2C+but+from+his+first+Conception.+Luke+1.35.+To+his+Resurrection+and+Ascension.+2+Cor.+5.21.%0A%0ANow+the+gifts%2C+given+to+the+Saints%2C+are+only+the+first+fruits%2C+a+handful+and+as+earnest-pence.+1+Cor.+13.12.+We+know+but+in+part%2C+we+Love+but+in+part.+So+that+we+may+easily+see%2C+how+far+the+dwelling+of+the+Spirit+in+holy+men%2C+differs+from+the+manner+of+the+same+in+Christ.+In+the+one+without+measure%2C+in+the+other+in+measure.+In+Christ+full%2C+in+us+in+part%3B+in+him+Primarily%2C+In+us%2C+Secondarily.+So+that+as+great+difference+as+there+is+twixt+the+spring%2C+and+the+stream+flowing+thence.+Twixt+the+light+of+the+Moon+and+stars%2C+and+the+Sun.+%5BSimile.%5D+The+one+being+borrowed+and+imperfect%2C+the+other+being+original%2C+and+always+equal.+So+great+difference+is+there+twixt+Christ+and+his+Saints+in+regard+of+gifts.+And+indeed%2C+this+plenitude+of+gifts%2C+is+one+of+the+peculiar+Prerogatives%2C+which+the+Humanity+of+Christ+hath+received+by+the+Hypostatical+union%3B+neither+can+they+be+found+in+any+other+person%2C+who+is+not+God+and+man.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brightman%2C+Brightman+redivivus%3A+or+The+post-humian+of-spring+of+Mr.+Thomas+Brightman%2C+in+IIII.+sermons.+Viz.+1.+Of+the+two+covenants.+2.+The+danger+of+scandals.+3.+God%E2%80%99s+commission+to+Christ+to+preach+the+Gospel.+4.+The+saint%E2%80%99s+security%2C+%28London%3A+John+Rothwell%2C+1647%29%2C+pp+46-47.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74b5c996f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74b5c996f0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/02/13/thomas-brightman-on-the-humanity-of-christ-and-the-gifts-of-the-holy-spirit/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d403a142c2" data-kw="">
<blockquote><p>The Word is that through which the Holy Spirit commences and confirms faith in us, and for this reason, should go before the sacraments. The sacraments are means through which the Holy Spirit confirms faith already called into exercise, and for this reason ought to follow the Word. The reason of this difference is that the sacraments do not exert any influence unless they be understood. There is no desire for that which is unknown. There must, therefore, necessarily be some explanation of the sacraments out of the Word before they are observed. The case is different, however, in regard to the infants of the church: for in them the Holy Spirit neither begins, nor confirms faith by means of the Word; but by an inward working; and that because they are also included in the covenant and promise of God, being born in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, following his commentary on Q&amp;A #7, 352 (on Heidelberg 67)</span></figcaption>

</figure><figure class="quote" id="q-c9ff42a636" data-kw="">
<blockquote><p>At the same time, as he works not effectually in all, but only where the Spirit, the inward teacher, illuminates the heart, he subjoins, to every one who believes. The gospel is indeed offered to all for their salvation but the power of it appears not everywhere: and that it is the savor of death to the ungodly, does not proceed from what it is, but from their own wickedness. By setting forth but one salvation he cuts off every other trust. When men withdraw themselves from this one salvation, they find in the gospel a sure proof their own ruin. Since then the gospel invites all to partake of salvation without any difference, it is rightly called the doctrine of salvation: for Christ is there offered, whose peculiar office is to save that which was lost; and those who refuse to be saved by him, shall find him a judge. But everywhere in Scripture the word salvation is simply set in opposition to the word destruction: and hence we must observe, when it is mentioned, what the subject of the discourse is. Since then the gospel delivers from ruin and the curse of endless death, its salvation is eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, 1.16.</span></figcaption>

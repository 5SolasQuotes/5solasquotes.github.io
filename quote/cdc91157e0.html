<main class="wrap"><figure class="quote" id="q-cdc91157e0" data-kw="">
<blockquote><p>Titus 3:. Therefore to the obtaining of eternal life two things are necessary. the first is to believe well; the second is, to live well. By the first we are justified in the sight of God, for he respects our faith; by the second we are justified in the sight of men, for they regard our works. And thus are the apostles Paul and James reconciled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question</cite>, (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 107-09, pp. 110-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Titus 3:. Therefore to the obtaining of eternal life two things are necessary. the first is to believe well; the second is, to live well. By the first we are justified in the sight of God, for he respects our faith; by the second we are justified in the sight of men, for they regard our works. And thus are the apostles Paul and James reconciled.”

— Henry Smith, ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 107-09, pp. 110-11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTitus+3%3A.+Therefore+to+the+obtaining+of+eternal+life+two+things+are+necessary.+the+first+is+to+believe+well%3B+the+second+is%2C+to+live+well.+By+the+first+we+are+justified+in+the+sight+of+God%2C+for+he+respects+our+faith%3B+by+the+second+we+are+justified+in+the+sight+of+men%2C+for+they+regard+our+works.+And+thus+are+the+apostles+Paul+and+James+reconciled.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+%E2%80%98Good+Works+are+the+Way+to+Heaven%E2%80%99+in+The+Lawyer%E2%80%99s+Question%3A+In+Three+Sermons+%281595%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A+107-09%2C+pp.+110-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdc91157e0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdc91157e0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Titus%203%3A.%20Therefore%20to%20the%20obtaining,the%20apostles%20Paul%20and%20James%20reconciled&amp;text=Titus%203%3A.%20Therefore%20to%20the%20obtaining%20of%20eternal&amp;text=thus%20are%20the%20apostles%20Paul%20and%20James%20reconciled" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69ed907ca2" data-kw="">
<blockquote><p>…we will prove that subsequent grace exists and that it is necessary for every good work. We presuppose: 1. That grace is a supernatural gift, operation, and work of God. So that it may be distinguished from nature and from natural operation and gift as the author, preserver, and governor of all nature, especially human nature; to which He gives being, which He preserves in being, which He governs by His concurrence and precursive assistance in operating, as the prime cause of all motions and operations. Acts 27:28 “For in Him we live and move and have our being.” And verse 25 “He himself gives to all life and breath and everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on Subsequent Grace, pt. 1-5</cite>, tr. by AI by Onku in Select Theological Disputations, vol. 5 (1669), pp. 716-63 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-94fef87e96" data-kw="">
<blockquote><p>But are not works required in the covenant of grace? Yes. “This is a faithful saying, that those who believe in God, should be careful to maintain good works.” But the covenant of grace does not require works in the same manner as the covenant of works did. In the first covenant, works were required as the condition of life; in the second covenant, they are required only as the signs of life. In the first covenant, works were required as grounds of salvation; in the new covenant, they are required as evidences of our love to God. In the first covenant, they were required to the justification of our persons; in the new covenant, to the manifestation of our grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, Question 20, ‘Of the Covenant of Grace’, p. 106 in The Select Works of the Rev. Thomas Watson… (New York, 1855) See also Question 22, ‘Of the Covenant of Works’, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“But are not works required in the covenant of grace? Yes. “This is a faithful saying, that those who believe in God, should be careful to maintain good works.” But the covenant of grace does not require works in the same manner as the covenant of works did. In the first covenant, works were required as the condition of life; in the second covenant, they are required only as the signs of life. In the first covenant, works were required as grounds of salvation; in the new covenant, they are required as evidences of our love to God. In the first covenant, they were required to the justification of our persons; in the new covenant, to the manifestation of our grace.”

</figure><figure class="quote" id="q-7e78c2f41c" data-kw="">
<blockquote><p>3. The stream of the Sinai-Covenant runs much upon doing, and perfection of doing… partly to instruct them, that though God intended not their works and obedience as an antecedent condition requisite to their justification; yet He intended them as a consequent condition and qualification in justified persons, as fruits of true faith, and the way towards the attainment of the promises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum</cite>, (London, 1657), book 3, ch. 4, aphorism 2, p. 788</span></figcaption>

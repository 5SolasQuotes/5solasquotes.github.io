<blockquote><p>VII… Now, there are three principal opinions of the theologians. Some think, that Christ by His soul properly descended into hell, that is, the place of the damned: either so that He might there undergo hellish sufferings, or so that He might inaugurate His triumph over defeated death. We repudiate this opinion… IX. Others say, that by the descent of Christ into hell nothing else is signified than the grave… X. Most of the Orthodox, by the descent of Christ into hell, understand His infernal anguish and sufferings, which Christ felt in His soul. In this opinion we also acquiesce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Parts of Christ’s Office, pt. 2 in Christian Theology 3rd</cite>, ed. (1634)</span></figcaption>

<blockquote><p>39. Moreover, it might be here inquired whether the eternity of punishment ought to be derived from this natural right of God; or, which is the same thing, whether a punishment justly equivalent to every sin ought necessarily to be eternal, according to God’s natural right; so that to maintain the contrary would be unworthy of God and consequently impossible. A difficult question this, and the rather because to determine concerning this absolute right of God in special cases, seems to be above human reach. God is greater than man; He gives not an account of his matters. (Job 33:12-13) Let us, however, try whether from the consideration of the divine perfections, we may not gather what may in this case be worthy of God. 40. I now presuppose that there is in sin committed against the infinite majesty of God, a malignity in its measure infinite, and therefore a demerit of punishment in its measure infinite also. I fay that there is in sin a malignity only in its measure infinite. For it cannot be called infinite in an absolute sense. If you confider the entity of the act in itself, an act infinitely intense cannot be elicited by a finite creature: if the irregularity, and the privation of moral good adhering to the act, it is a privation of a finite rectitude, such as can be competent to a creature: if, in fine, you confider the whole complex, namely, sin in the concrete, as they speak, neither in that case is its malignity absolutely infinite. For all vicious acls are not equal, but there is a great disparity among them; which could not be unequal, if they were infinite. However, the malignity of sin is in its measure infinite: 1. Objctively, becaufe it is committed against an infinite good. 2. Extensively, in respect of duration, because the blot or stain of sin endures forever, unless it be purged away by the blood of Christ. And therefore there is in Him a desert of punishment not absolutely infinite as to intenseness of torments: (1) Because such a punishment is absolutely impossible; for a finite creature is not capable of infinite torments. (2) Because it would follow that God could never satisfy his justice by inflicting condign punishment on the wicked, seeing they are incapable of this punishment. Now, it is then absurd to say that any punishment is of right due to sin, which God could never inflict. (3) Because it would follow that an equal punishment was due to all sins, or that all in fact were to be punished alike: which is an absurdity and against Mt. 11:22, 24. The reason of this consequence is because there neither is, nor can be any disparity between infinites. Nevertheless there is in sin a desert of punishment in its measure infinite; namely, in the same manner that the malignity of it is infinite. That is: 1. Objectively, so as to deprive man of the enjoyment of the infinite good, which is God. 2. Extensively, so that the punishment shall last forever. And thus I consider this desert of eternal punishment so far only as to conclude that God does nothing contrary to equity and justice when He punishes the sins of men with eternal torments both of soul and body. Which the event shows, as I have made appear above, sect. 17. 41. But I know not if it can be determined whether this eternity ought necessarily to consist in the punishment of sense or whether the justice of God may be satisfied by the eternal punishment of loss in the annihilation of the sinful creature. This, I apprehend, may be said with sufficient probability and sobriety: If God shall be pleased to continue in existence forever the sinful creature, it is necessary (without a satisfaction) that He forever inflict punishment on him, not only the punishment of loss, but likewise that of sense. The reason is because not only the guilt of sin always remains, but also the stain with which sin, once committed, infects the soul and which can never be purged out but by the blood of Christ. But it is impossible, as we proved, sect. 22-24, that God should admit man stained with sin, to communion with Himself: and it cannot be that a rational creature, excluded the enjoyment of the divine favor, should not feel this indignation of God with the deepest anguish. Conscience most severely lashes the wretches for having squandered away the chief good. Which with no small care we have alfo shown, sect. 13 and the following sections. 42. But whether it be necessary that God should preserve forever the sinful creature in a state of existence, I own I am ignorant. May it not in its measure be reckoned an infinite punishment if God should please to doom man, who was by nature a candidate for eternity, to total annihilation, from whence He should never be suffered to return to life? I know God has now determined otherwise, and that with the highest: justice. But it is queried whether, agreeably to his juftice, He might not have settled it in this manner: ‘If thou, O man, sin, I will frustrate thy desire of eternal happiness and of a blessed eternity, and, on the contrary, give thee up to eternal annihilation?’ Here at Ieast let us stop.</p></blockquote>

xistence+forever+the+sinful+creature%2C+it+is+necessary+%28without+a+satisfaction%29+that+He+forever+inflict+punishment+on+him%2C+not+only+the+punishment+of+loss%2C+but+likewise+that+of+sense.+The+reason+is+because+not+only+the+guilt+of+sin+always+remains%2C+but+also+the+stain+with+which+sin%2C+once+committed%2C+infects+the+soul+and+which+can+never+be+purged+out+but+by+the+blood+of+Christ.+But+it+is+impossible%2C+as+we+proved%2C+sect.+22-24%2C+that+God+should+admit+man+stained+with+sin%2C+to+communion+with+Himself%3A+and+it+cannot+be+that+a+rational+creature%2C+excluded+the+enjoyment+of+the+divine+favor%2C+should+not+feel+this+indignation+of+God+with+the+deepest+anguish.+Conscience+most+severely+lashes+the+wretches+for+having+squandered+away+the+chief+good.+Which+with+no+small+care+we+have+alfo+shown%2C+sect.+13+and+the+following+sections.+42.+But+whether+it+be+necessary+that+God+should+preserve+forever+the+sinful+creature+in+a+state+of+existence%2C+I+own+I+am+ignorant.+May+it+not+in+its+measure+be+reckoned+an+infinite+punishment+if+God+should+please+to+doom+man%2C+who+was+by+nature+a+candidate+for+eternity%2C+to+total+annihilation%2C+from+whence+He+should+never+be+suffered+to+return+to+life%3F+I+know+God+has+now+determined+otherwise%2C+and+that+with+the+highest%3A+justice.+But+it+is+queried+whether%2C+agreeably+to+his+juftice%2C+He+might+not+have+settled+it+in+this+manner%3A+%E2%80%98If+thou%2C+O+man%2C+sin%2C+I+will+frustrate+thy+desire+of+eternal+happiness+and+of+a+blessed+eternity%2C+and%2C+on+the+contrary%2C+give+thee+up+to+eternal+annihilation%3F%E2%80%99+Here+at+Ieast+let+us+stop.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+%26+Man%3A+Comprehending+a+Complete+Body+of+Divinity+%28d.+1708%3B+NY%3A+George+Forman%2C+1798%29%2C+vol.+1%2C+bk.+1+%7C+ch.+5%2C+Penal+Sanction+of+the+Covenant+of+Works%2C+pp.+134-36+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43faae85ab.html&amp;via=5Solas" target="_blank" rel="noop <blockquote><p>…universalism soon arose in England among independent churchmen who were open to questioning the status quo. Between 1649 and 1653, Gerrad Winstanley, Richard Coppin, and three anonymous authors, had works published which advocated for universalism… No doubt inspired by these authors, universalism rapidly spread among a highly influential group of theologians, comprised of both conformists and non-conformists, known as the Cambridge Platonists. This group had a special appreciation for the writings of Origen, the retrieval of whom dated back to Erasmus in the previous century, and their universalist ideas were inspired by him. Of this group, we know that at least Peter Sterry [Westminster Divine], George Rust, and Joseph Glanvill affirmed universalism, and Henry More, John Smith, and Ralph Cudworth likely did as well, though they were more coy about it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…universalism soon arose in England among independent churchmen who were open to questioning the status quo. Between 1649 and 1653, Gerrad Winstanley, Richard Coppin, and three anonymous authors, had works published which advocated for universalism… No doubt inspired by these authors, universalism rapidly spread among a highly influential group of theologians, comprised of both conformists and non-conformists, known as the Cambridge Platonists. This group had a special appreciation for the writings of Origen, the retrieval of whom dated back to Erasmus in the previous century, and their universalist ideas were inspired by him. Of this group, we know that at least Peter Sterry [Westminster Divine], George Rust, and Joseph Glanvill affirmed universalism, and Henry More, John Smith, and Ralph Cudworth likely did as well, though they were more coy about it.”

<blockquote><p>7. Works done by unregenerate men, although, for the matter of them, they may be things which God commands, and of good use both to themselves and others;[y] yet, because they proceed not from a heart purified by faith;[z] nor are done in a right manner, according to the word;[a] nor to a right end, the glory of God;[b] they are therefore sinful, and cannot please God, or make a man meet to receive grace from God.[c] And yet their neglect of them is more sinful, and displeasing unto God.[d] [y] 2 Kings 10:30,31. 1 Kings 21:27,29. Phil. 1:15,16,18. [z] Gen. 4:5 with Heb. 11:4. Heb. 11:6. [a] 1 Cor. 13:3. Isa. 1:12. [b] Matt. 6:2,5,16. [c] Hag. 2:14. Tit. 1:15. Amos 5:21,22. Hosea 1:4. Rom. 9:16. Tit. 3:5. [d] Ps. 14:4. Ps. 36:3. Job 21:14,15. Matt. 25:41-43,45. Matt. 23:23.</p></blockquote>

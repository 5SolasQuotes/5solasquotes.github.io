<main class="wrap"><figure class="quote" id="q-982875edce" data-kw="">
<blockquote><p>And as the Church of the Jews did preserve the Hebrew Original of the Old Testament safe and sure, so I doubt not but the same hand of the providence of God, hath and doth preserve the Greek Original of the New Testament.

And for that it is not possible that the Originals should serve the turn of all, or immediately of any, but of such as have the knowledge of those tongues, (who are but a poor few in respect of all the world over) wherefore I take it for granted that the line of God’s providence hath, and doth, and will carry the matter, in having translations of several languages so entire, as to be a sufficient rule to ground their faith: else God in his providence must needs be wanting in providing necessaries for his Church.

Nor do I think that there was, or ever shall be a Church of Christ, or a Church of Christians in the belly of Antichrist, but have had translations sufficient to rest their souls on. I doubt not but the vulgar, for all its faults hath sufficient for the saving of some souls.

Besides among the Papists they have Pagnine allowed by two Popes, which runs as pure as any Translation in the world; and Arias Montanus a translation without exception. Senensi much commends Jacobus de Voragine a Papist, Arch-Bishop of Genoa his translation into the Italian, and Senensis could well tell, having great skill in the Originals.

To me it is much, that Senensis (so sharp a Papist as he is) should in print, and that since the Council of Trent, so highly commend a translation of the Bible into the Italian tongue. And Leo the tenth, Bishop of Rome, did just before Luther’s days, print a recommendation of Erasmus’s translation of the New Testament into Latin. So that I look on it as a special providence of God, that there were translations, and those exact too in the heart of Popery: And if so, then he will not suffer the visible Church to be without a sufficient translation, as a sufficient rule. …

Well then, as God committed the Hebrew Text of the Old Testament to the Jews, and did and doth move their hearts to keep it untainted to this day:

So I dare lay it on the same God, that he in his providence is so with the Church of the Gentiles, that they have and do preserve the Greek Text uncorrupt, and clear: As for some scapes by Transcribers, that comes to no more, then to censure a book to be corrupt, because of some scapes in the printing, and ’tis certain, that what mistake is in one print, is correct in another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Capel’s remains being an useful appendix to his excellent Treatise of tentations, concerning the translations of the Holy Scriptures: left written with his own hand. By that incomparably learned and judicious divine, Mr. Richard Capel, sometimes fellow of Magdalen-College in Oxford; with a preface p</cite>, (London: John Bartlet, 1658), pp 65-68, 79-80.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6e7c4e50a" data-kw="">
<blockquote><p>By this method (as I have before observed) the dishonesty of those men is sufficiently rebuked, who censure Moses for not speaking with greater exactness. For as it became a theologian, he had respect to us rather than to the stars. Nor, in truth, was he ignorant of the fact, that the moon had not sufficient brightness to enlighten the earth, unless it borrowed from the sun; but he deemed it enough to declare what we all may plainly perceive, that the moon is a dispenser of light to us. That it is, as the astronomers assert, an opaque body, I allow to be true, while I deny it to be a dark body. For, first, since it is placed above the element of fire, it must of necessity be a fiery body.† Hence it follows, that it is also luminous; but seeing that it has not light sufficient to penetrate to us, it borrows what is wanting from the sun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1:15</span></figcaption>

</figure><figure class="quote" id="q-fa950a99bd" data-kw="Vernacular">
<blockquote><p>Because these original tongues are not known to all the people of God, who have a right unto, and interest in the Scriptures, and are commanded in the fear of God to read, and search them, therefore they are to be translated into the vulgar language of every nation unto which they come, that the Word of God dwelling plentifully in all, they may worship Him in an acceptable manner, and through patience and comfort of the Scriptures may have hope.</p></blockquote>

</figure><figure class="quote" id="q-5a492649a0" data-kw="">
<blockquote><p>The authority of the Word is derived from the Word itself. The church cannot be the foundation upon which one believes that the Scriptures are the Word of God, for: First, the church derives all its authority from the Word. … Thus, we do not believe the Word to be the Word of God because the church affirms it, but on the contrary, we believe the church to be the true church because the Word validates her as such.</p></blockquote>

</figure><figure class="quote" id="q-e46797928f" data-kw="">
<blockquote><p>Why are the Scriptures our only rule of faith and obedience?

The Scriptures are our only rule of faith end obedience because as the written word of God they are unique and infallible, and therefore no other rule of faith and obedience may be placed alongside of them.

This principle of course does not rule out such subordinate standards as the [Westminster] Larger Catechism itself, which present not another rule in addition to Scripture, but merely a systematic summary of whet Scripture teaches. The Larger Catechism, for example, is a legitimate rule of faith and obedience only because, and only so far as, it is faithful to the teachings of the Scriptures. It possesses no inherent authority of its own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Larger Catechism of the Westminster Assembly in Blue Banner Faith and Life</cite></span></figcaption>

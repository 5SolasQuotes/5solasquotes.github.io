<main class="wrap"><figure class="quote" id="q-9057bfd0a5" data-kw="">
<blockquote><p>But, alas! ‘Twas not this that drove us from the Church of Rome. ‘Twas not the fall of one Felix, nor the weakness of some Cecilians, ’twas not the covetousness of her Prelates, the licentiousness of her Monks, the filthiness of her Court, the excess and abuse of her Sovereign Pontiffs. For though she suffered these disorders with too much indulgence, yet she neither doth command them, nor openly approve of them.

Though she very gently tolerate such as were debauched or vicious, yet she did not force any to be so. No man was for entering into her communion constrained to be a slave to any of those vices which bore sway in the midst of her. No, a man might have lived within it, and yet addicted himself to honesty and goodness: And as yet corruption had not gained so far, as that ill manners were authorized by public laws. But on the contrary during the worst of times, though her voice was weak and languishing, yet she made some noise against the impiety of the age. And oftentimes those very men that gave ill example in their lives preached against it and decried it horribly in the pulpit.

That which hath pulled us from her communion is her doctrine, and not her actions; that which she commands, and not that which she suffers; that which she requires of us all, and not that which she tolerates in some others; the articles of her faith, and not the faults of her life. For the adoration of the Eucharist, invocation of Saints, veneration of images, and those other articles which we rehearsed before, are not such things as she only tolerates as bad, or excuseth as doubtful; but beliefs which she commendeth as true, and observations which she commandeth as useful and necessary to salvation.

Nor doth she only practise them in the house and privately, but likewise preach them in the Temple, as perpetual parts of her Faith. So that if we continue in her communion, we must needs make profession of believing them, that is, make our selves guilty of an horrible hypocrisy, confessing with our mouth what we do not believe with our heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 15-16.</span></figcaption>

<blockquote><p>18. And if the unsoundness, badness or weakness of the pastors and the faultiness of the worship, order or discipline be not so great as to make communion with the church simply unlawful, yet any free man whose edification is greatly hindered by it, and can elsewhere have far greater helps for his salvation and join with a church which walks more conformably to the Christian rule, may lawfully remove himself to such a ministry and church, when it is not to the greater hurt of others than his own good. Especially such whose ignorance, weakness and deadness makes a lively and convincing ministry more needful to their safety and welfare than it is to others: For it is a sin, caeteris paribus [other things being equal], to prefer the worse before the better, and a sin to neglect the best means for our souls which we can lawfully enjoy: And the soul is more precious than to be hazarded or left in sin and darkness for an unnecessary circumstance.</p></blockquote>

<blockquote><p>17. The Sieur Codure, formerly pastor and professor of divinity in the Church and University of Nismes, having sent letters with a diatribe of his, dedicated unto this Assembly, in which he pretends to reconcile the differences between the Protestants and the Church of Rome concerning Justification, and demanded audience of it: According to his request, he was admitted to propound the reasons and motives of his design. Which having done, there was a most serious remonstrance made him of the great wrong he had done; First, unto the truth of God, in taking upon him to reconcile contradictory opinions, and utterly inconsistent one with the other. And then secondly, how injurious he was unto the Protestants, in oppugning as erroneous their common Confession, that so to their prejudice he might advantage the Romish Church, which does notoriously confound two of the greatest blessings of God, and inseparable one from the other, though yet always distinct in themselves; to wit, the sinner’s absolution before the tribunal of God, upon the account of the merits of Christ Jesus, his obedience imputed to him, and regeneration wrought in the heart of man, by the sanctifying operation of the Holy Ghost. And lastly, how much an enemy he was unto himself, in forsaking his ministry, and the cure of souls, to become an advocate of such a vile and ungodly cause as is this of the Papacy, which is altogether unreasonable in him, for that he undertakes things impossible. But he still protesting that he never intended to, and never would depart from the Orthodox Creed professed in our Churches, and offered to purge and acquit himself from all suspicions that might be had of him by his voluntary subscribing the principal articles of the doctrine of truth, from which he was supposed to have swerved and declined: They were thereupon offered to him; which when he had as freely and in general signed and subscribed, as he had offered to do it, yet it being done with hesitation for some time, and this also attended with ambiguous expressions, the Assembly was constrained to doubt of his sincerity; and it was the rather feared, for that after the subscription required, he resolutely refused to follow his vocation, and the counsel of his brethren, discovering an unworthy disdain and scorn of that holy and honorable employment in the ministry of the Gospel, whereunto in his younger days he was called by God. All which considered, the synod interdicted him all the offices of the sacred ministry, and of the profession of theology, and enjoined both the province, and that particular church where he constantly resides, to watch over his deportments, and to give an accompt of him and his conversation unto the next national synod, which may, according to what testimonials they shall receive of him, and his future carriage, proceed unto his restoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick, Synodicon (London, 1692), 3rd National Synod of Charenton, ch. 11, p. 460</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a0c131ba83" data-kw="">
<blockquote><p>As the term ‘good’ signifies perfect being, so the term ‘evil’ signifies nothing else than privation of perfect being. In its proper acceptation, privation is predicated of that which is fitted by its nature to be possessed, and to be possessed at a certain time and in a certain manner. Evidently, therefore, a thing is called evil if it lacks a perfection it ought to have.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendium of Theology, ch. 114, ‘The Meaning of Good &amp; Evil in Things’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e710bbc718" data-kw="Author of sin">
<blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-cox.html">Benjamin Cox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Appendix to a Confession of Faith</cite>, 1646, art. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a> › <a href="../topics/providence/providence-and-evil/the-problem-of-evil.html">The problem of evil</a></span><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/gods-concurrence-with-secondary-causes.html">God&#x27;s concurrence with secondary causes</a></span></div>

</figure><figure class="quote" id="q-dd8a7a7dad" data-kw="">
<blockquote><p>Infinite goodness does not immediately take away all evils if it is a perfectly free and not a necessary agent. It judges that the permission of evil for the purpose of extracting good from it pertains more to its wisdom and omnipotence than the not permitting the existence of evil.</p></blockquote>

</figure><figure class="quote" id="q-6ed08fe31b" data-kw="">
<blockquote><p>Then when we say all things to have been created by God, we include not those things which are evil, as they are evil. For those things are not from God, but from Satan, the parent of all evils. Execrable is the error of the Manichees, who contend that evil is from God, whom blessed Augustine very strongly repressed. And evil spirits, although they are from God, as spirits, yet from Him they are not, as evil spirits. For God saw all things which He had made, and they were very good (Gen. 1). But that we read, Isa. 45: ‘I am the Lord, and there is no other, forming light, and creating darkness, making peace, and creating evil,’ is not to be understood concerning the evil of iniquity and impiety, but concerning the evil of adversity and calamity: just as also that word, Amos 3: ‘If there is evil in the city, have I not done it?’ Thus ‘evil days’ are spoken of, in which we are pressed with some calamity and tribulation: which manner of speaking is common and vulgar, which also Christ used, saying: ‘Sufficient unto the day is the evil thereof.’ (Mt. 6) … That place, Prov. 16, where Solomon says: ‘The Lord works all things for Himself, and the impious also unto the evil day,’ is not to be adduced unto this operation of creation. For Solomon speaks there not concerning creation, although God Himself the principle and end of all things created all things for Himself: but concerning His providence and government, by which He so governs all things, even the minds of the impious, that they make unto His glory. Therefore it is to be taken heed, lest anyone from the words of Solomon badly understood and applied, should gather that God created the impious, as impious. For the impious as impious is not from God, but from the father the devil (Jn. 8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-47c06a0653" data-kw="">
<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

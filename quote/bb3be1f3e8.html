<main class="wrap"><figure class="quote" id="q-bb3be1f3e8" data-kw="">
<blockquote><p>V. Moreover, this federal sanctity suffices as a warrant for parents to bring their infants to the sacred bath of baptism. It is also a sufficient warrant for the office-bearers of the church to wash the children so brought in the waters of the mystical font. For charity requires that children so distinguished be regarded as children beloved of God and reckoned of the family of God until they manifest the reverse by an evil disposition and a wicked course of life.

Indeed, the height and depth of eternal predestination forbids us to pry into its hidden things with more than a lawful curiosity. Yet, judging soberly, there can be nothing to prevent us from conferring the sign and seal of the covenant upon those whom it is proper to acknowledge as the covenanted people of God; meanwhile the secret things of predestination have been left to God according to his freedom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 130.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-96da43f7dc" data-kw="">
<blockquote><p>11. ‘Then Zipporah tooke a sharpe knife and cut away the foreskin of her son.’ The two things that here might be considered (namely, that doctrine of Popery concerning the danger of children dying unbaptized, and secondly of such an absolute necessity of baptism, as that women must administer it in time of supposed need) I forbear to stand upon now: I have sufficiently touched them in my Notes upon Genesis. Therefore do but remember with yourself (touching the first) that we make a great difference betwixt want [lack] of the sacrament and contempt of the same; contempt, damning; and want, not, through the strength of God’s promise; meaning, by want, when God so prevents by death, that it cannot be had, according to the manner allowed in the Word. And, touching the second, observe, that this act of Zipporah, here, in circumcizing her child, was merely extraordinary, and does no way warrant women to baptize now-a-days.</p></blockquote>

<blockquote><p>Still it must be confessed that others are not so rigid, but allow certain exceptions. First, that this necessity had a place only after the death of Christ and from the day of Pentecost. Again, the baptism of water could be supplied by the desire for it or by martyrdom. Hence the Council of Trent utters an anathema against those “who say that without the sacraments, or a desire for them, men receive the grace of justification by faith alone” (Session 7, Canon 4, Schroeder, p. 52).</p></blockquote>

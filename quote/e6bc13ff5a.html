</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4f0a417ed" data-kw="">
<blockquote><p>It may seem absurd to say that he ‘is in heaven’ while he still lives on earth. If it is answered that this is true about his divine nature, then this expression would mean something else—-namely, that while he was man he was ‘in heaven.’ I could point out that no place is mentioned here and that only Christ is distinguished from everybody else as far as his state is concerned, since he is the heir of the kingdom of God, from which the whole human race is banished. However, as very frequently happens, because of the unity of the person of Christ, what correctly applies to one of his natures is applied to another of his natures, and so we need seek no other solution. So Christ, who ‘is in heaven,’ has clothed himself in our flesh, so that by stretching out his brotherly hand to us he may raise us to heaven with himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John in Crossway Classic Commentaries, eds. Alister McGrath &amp; J. I. Packer</cite>, (Wheaton, IL: Crossway, 1994), on Jn. 3:13, pp. 74-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“It may seem absurd to say that he ‘is in heaven’ while he still lives on earth. If it is answered that this is true about his divine nature, then this expression would mean something else—-namely, that while he was man he was ‘in heaven.’ I could point out that no place is mentioned here and that only Christ is distinguished from everybody else as far as his state is concerned, since he is the heir of the kingdom of God, from which the whole human race is banished. However, as very frequently happens, because of the unity of the person of Christ, what correctly applies to one of his natures is applied to another of his natures, and so we need seek no other solution. So Christ, who ‘is in heaven,’ has clothed himself in our flesh, so that by stretching out his brotherly hand to us he may raise us to heaven with himself.”

</figure><figure class="quote" id="q-853d9e4727" data-kw="">
<blockquote><p>Not one argument alleged to prove that sitting at table has a sacramental signification, for we made difference of signs and of necessity. We did not reason from a divine institution to prove a table, but other things are necessary that are not of a sacramental necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/session.html">Session</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

— Session, Rutherford">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNot+one+argument+alleged+to+prove+that+sitting+at+table+has+a+sacramental+signification%2C+for+we+made+difference+of+signs+and+of+necessity.+We+did+not+reason+from+a+divine+institution+to+prove+a+table%2C+but+other+things+are+necessary+that+are+not+of+a+sacramental+necessity.%E2%80%9D%0A%0A%E2%80%94+Session%2C+Rutherford&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F853d9e4727.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/853d9e4727.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/sitting-at-the-table#:~:text=Not%20one%20argument%20alleged%20to%20prove,are%20not%20of%20a%20sacramental%20necessity&amp;text=Not%20one%20argument%20alleged%20to%20prove%20that%20sitting&amp;text=necessary%20that%20are%20not%20of%20a%20sacramental%20necessity" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6ff5def8b9" data-kw="">
<blockquote><p>When the old prophet did invite the young prophet to eat bread and drink water with him, common civility made a table necessary in this single entertainment (1 Kings 13:20), ‘And it came to pass as they sat at the table…’ If it were a disrespect to invite friends to eat and drink with us, and yet when they come, not to place them at a table (where a table may be had), I know no reason why it ought not also to be conceived a wronging of Christ’s guests when they are not placed at his Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 18, ‘Of the Use of a Table in the Lord’s Supper…’, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-f4f0adf507" data-kw="">
<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, section 3, p. 443</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

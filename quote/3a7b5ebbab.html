<main class="wrap"><figure class="quote" id="q-3a7b5ebbab" data-kw="">
<blockquote><p>6. God created not the world in one moment, but in the space of six days. In the seventh day God ended all his works. Objection: ‘He that lives forever’ (says the son of Sirach, Ecclesiasticus 18:1) ‘made all things together.’ Therefore He made all in one moment. Answer: He speaks not of a moment of time, but of the whole number of things: as if he should say, whatsoever are, they are all from God by creation. But the causes why God created not all in one moment, are these:

1. Because He would have the creation of the matter itself distinct and manifest from the forming, and fashioning of the bodies of the world, which consist of it.

2. Because He would show his power and liberty in producing and bringing forth whatsoever effects He could, and that without natural causes, while He yields light to the world, makes the earth fruitful, brings plants out of it, even before the sun and moon were made.

3. He would this way show his goodness and providence, whereby He cherishes his creatures, and provides for them not yet born, bringing beasts into the earth full of plants and food, and men into the world most stored and fraught with all things appertaining to the necessity and delight of life.

4. He would by that order and course of creation hold us not in an idle, but diligent consideration of his works: which also by the consecration of a Sabbath He has consecrated to all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his lectures upon the [Heidelberg] Catechism authorized by the noble Prince Frederick, throughout his Dominions... (d. 1583; Oxford: Barnes, 1587), pt. 2, ‘Of Creation’, 2. ‘How God made the world’, p. 366</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b81e91a18" data-kw="">
<blockquote><p>Question: What is Creation? Answer: Creation is a work proper only to God, undividedly common to the Father, the Son, and to the Holy Ghost, whereby, in the beginning, and in the space of six days, God made of nothing, the heavens and earth, and all the host of them visible, and invisible, to the glory of his Name, and the use of man… Yea whereas the Lord could have made the world in an instant, it pleased Him to take six days to finish the heaven and the earth, with all the host of them, to this end (we may well suppose) that we should take good notice of the same. For this, was the Sabbath ordained, that we might preserve the memory of the Creation, and praise the Lord…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Divinity Plainly Discovering the Mysteries of Christian Religion</cite>, (London, 1614), Grounds of Divinity, pp. 73, 75-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-7ed895c771" data-kw="">
<blockquote><p>Thus also a celebration of the finishing of the creation within the space of seven days, which is termed the Sabbath, was observed not only amongst the Grecians and Italians (for of the Hebrews it is clear enough) but also by… and by the most ancient appellations of the days in the week. …and that the lives of those which lived at the beginning, and afterward were protracted almost to the space of a thousand years, it [is] witnessed by Berosus, Manethos, and others…</p></blockquote>

<blockquote><p>VI…. Hence, God, the Word and the Spirit are joined by David in Ps. 33:6, “By the word of the Lord were the heavens made; and all the host of them by the breath of his mouth,” which the rule of the theologians confirms: “The outward works of the Godhead are undivided.</p></blockquote>

</figure><figure class="quote" id="q-ac26449f03" data-kw="six days creation">
<blockquote><p>Creation may be viewed either in general with regard to the production of the whole universe, or in particular with regard to the production of its various parts in the six days of creation. In the latter, their creation is first set forth, then their distinction and lastly their adornment. In all these, God demonstrates his power splendidly in the production of all things (great as well as small) ex nihilo by his word alone; his wisdom, in their variety, order and use; his goodness, in the communication of himself (by which he made all things very good).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 5.1</span></figcaption>

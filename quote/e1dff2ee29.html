<main class="wrap"><figure class="quote" id="q-e1dff2ee29" data-kw="">
<blockquote><p>Thus, before the act of justification, I mean by nature, not by time, our faith or confidence has this proposition about the future as its object, ‘to me believing, sins will be forgiven.’ In the act of justification, this is about the present, ‘sins are being forgiven to me;’ after the act of justification, this is about the past, ‘sins have been forgiven to me.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | And he concludes:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7a8aa218c" data-kw="">
<blockquote><p>If you confess with your mouth the Lord Jesus and believe in your heart that God has raised Him from the dead, you will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 160-61 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | XCII. Nevertheless, when it is said that faith, as it justifies and saves, primarily deals with the Gospel promises, it should signify mainly and principally, not exclusively. For faith, as it saves and justifies, does not deal only with those promises. Faith is said to save and justify as it is the condition of the covenant of grace, where God no longer demands from us, under the penalty of eternal death and curse, the perfect and absolute observation of the law in all its details as the covenant of works required, but instead requires living faith, which works through love. While the Law of Moses says, “do and live,” the Gospel says, “believe and be saved.” However, the faith that the Gospel demands as the condition under which it offers us salvation, does not only regard the promises of the Gospel but also its commands and doctrines, such as the Resurrection of our Lord Jesus Christ, as is evident from the words of Paul:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-c52c042edb" data-kw="">
<blockquote><p>Some would suppose our union to Christ, and consequently, by virtue of that, our justification by Christ, to be before actual faith, even in adult persons, and consequently without it; they insist upon a priority in nature and time, and build positions upon that distinction that will not hold… They who hold justification before faith are afraid lest they should be betrayed into a justification by works, if they should hold otherwise; and therefore choose rather to plead for a justification before faith, and without faith, lest they should seem to be justified by anything in and from themselves; but how contrary is this to Scripture, ‘He that believeth not, is condemned’? (Jn. 3:18) But he that believes not, is justified, is nowhere written in my Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance</cite>, ... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’, p. 92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-c6059b169b" data-kw="">
<blockquote><p>After effectual calling follows justification, which consists in God’s imputation of the righteousness of Christ, who has already been apprehended by faith in effectual calling, to the sinner, just as if that righteousness were the sinner’s own… On the basis of these considerations, take note that faith has a twofold function: the first in effectual calling, when it accepts Christ with his righteousness as such is offered to man; the second in justification, when it accepts Christ with his righteousness as such is imputed to man. It should be noted, moreover, that when man is said to be justified through faith, the faith in question is that which has already played a role in effectual calling—a role, that is, in apprehending Christ and his righteousness as such is offered to man. But salvation is more appropriately attributed to that faith that apprehends the righteousness of Christ imputed to man in justification. “By grace you have been saved through faith” (Eph. 2.8).”… It may be asked: If in effectual calling Christ’s righteousness is apprehended through faith, then cannot someone be said to be justified already by that righteousness? I answer, no. For justification is the pronouncement of a sentence. But in effectual calling there is no pronouncement of a sentence. Therefore, one cannot be called justified as a result of effectual calling alone.</p></blockquote>

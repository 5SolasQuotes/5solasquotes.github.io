<blockquote><p>WHAT IT IS TO KEEP HOLY THE SABBATH-DAY.

To keep holy the sabbath-day is not to cease from bodily labour, that thou shouldest the more licentiously give thy mind to the wearing of gallant apparel, to banqueting, to idle talk, to vain pastimes, and such other filthy pleasures of the flesh; but that thou, setting aside all worldly business, shouldest the more freely apply thyself to read, hear, and learn the word of God, to pray in the temple with the congregation, to be thankful to God for his benefits, to be present at the ministration of the holy sacraments, to be partaker of the mysteries of the Lord’s body and blood, to give some good thing to the relief of the poor, to visit and comfort the sick and them that are in prison, and, casting away the works of the flesh, wholly to exercise thyself in the fruits of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), p. 500.</cite></span></figcaption>

<blockquote><p>The daring attack that is now made by some of the directors of the Edinburgh and Glasgow Railway on the law of God and the peace of our Scottish Sabbath – the blasphemous motion which they mean to propose to the shareholders in February next – and the wicked pamphlets which are now being circulated in thousands, full of all manner of lies and impieties- call loudly for the calm, deliberate testimony of all faithful ministers and private Christians in behalf of God’s holy day. … (1) The keeping open of Reading-Rooms – In this town, and in all the large towns of Scotland, I am told, you may find in the public reading-rooms many of our men of business turning over the newspapers and magazines at all hours of the Lord’s day… (2) The keeping open Public-Houses – Public-houses are the curse of Scotland. I never see a sign, “Licensed to sell spirits,” without thinking that it is a licence to ruin souls. (3) Sunday Trains upon the Railway – A majority of the directors of the Edinburgh and Glasgow Railway have shown their determination, in a manner that has shocked all good men, to open the railway on the Lord’s day.</p></blockquote>

<blockquote><p>Still farther, coming to Christ implies a renouncing of self. This follows of necessity from what has been said, for self-trusting and self- seeking are sin. So long as we trust in our own arm to save, we will never seek after the salvation which Christ offers; and so long as we follow out our selfish ends, we are abiding far, and wandering farther from him. What saith the Lord? “If any man will come after me, let him deny himself” As the soul goes out from the Babylon of sin, so it also goes out from the tottering tabernacle of self-sufficiency, in fleeing unto Christ as the strong tower. We cannot betake ourselves to him without seeing our own emptiness.

Coming to receive all from him implies our feeling of needing all. We must come like the prodigal—yonder “is bread, enough, and to spare, while I perish with hunger.” It is for lack of this that many come to ordinances, as we have seen, and yet come not to Christ. In self-sufficiency they verily think that, some how or other, their reading, their worship, their prayers, are to save them; that these, their own doings, are in some manner to help them to acceptance with God.

It is as if they said, “I will not be cast out because I do these things,” while all the time the true and only because stares them in the face—because Christ hath done all for us, I put it to your consciences, brethren, is not this the natural reasoning of the heart? Even the conscience of the renewed man must answer, that he is often tempted of the old man to feel as if observance of duties were to win his way to Jesus, and bring down blessings from on high. And yet I put it to the commonest understanding, if this be not robbing Christ of His glory, and thinking to take His sceptre of salvation into our own hands.

Coming to Christ is just a casting ourselves upon him, that He may save, for he alone can. It is not our reading, but finding Christ in the word read, which profits. It is not our worshipping, but the surrender of ourselves to Christ in the worship, that realizes the blessing. It is not our praying, but Christ’s merits pled in the prayer, that brings down the answer. O that men remembered this, and so, coming out of themselves, would come to Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller-of-monifieth.html">Samuel Miller of Monifieth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Coming unto Jesus in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-83a5c9bf20" data-kw="">
<blockquote><p>Now it is to be considered what kind of religious observations God has reserved to his own determination and forbidden to be devised or instituted by man. And these are first, such as are of the same reason with those ordinances which God has instituted to be observed by the universal Church to the world’s end, as to make an addition of another weekly day to the same holy intents for which the Lord’s Day is set apart, or to institute any ordinance that is of the same reason with the sacraments of the Covenant of Grace. …

2. No new integral part of divine worship, without which the worship of God is supposed not entire, but deficient in part, may be invented of man. For it were to invent a new part of the Christian religion and to augment it beyond the state thereof as settled by the Author and Founder of it. Here note that the accidental parts of religion being varied, or augmented, or diminished, make no variation, addition or diminution in the religion, no more than alteration in clothes makes an alteration in the man.

3. No ordinance that is of universal and perpetual use to the Church of God (if it be at all of use), so that it may in no place, in no age be omitted, may be devised of man. For the devising of such an ordinance supposes a defect in the divine ordinances of universal and perpetual use, to be made up by adding other ordinances by way of supplement. And it is but a presuming that those others are requisite, when they are not. Also if the universal Lawgiver has reserved anything to his own power, it can be no less than the making of such laws or ordinances as are of universal and perpetual use. And surely that He has reserved something to Himself, few among us will gainsay. Howbeit an arbitrary and temporary use of a religious observance by particular men for such ends as equally concern all Christians may not be unlawful upon this account, because therein Christ’s legislative power is not encroached upon, it not being made a law to the Church, but only a private arbitrary observation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 4, What of Divine Worship may not be Devised or Instituted by Man</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now it is to be considered what kind of religious observations God has reserved to his own determination and forbidden to be devised or instituted by man. And these are first, such as are of the same reason with those ordinances which God has instituted to be observed by the universal Church to the world’s end, as to make an addition of another weekly day to the same holy intents for which the Lord’s Day is set apart, or to institute any ordinance that is of the same reason with the sacraments of the Covenant of Grace. …

2. No new integral part of divine worship, without which the worship of God is supposed not entire, but deficient in part, may be invented of man. For it were to invent a new part of the Christian religion and to augment it beyond the state thereof as settled by the Author and Founder of it. Here note that the accidental parts of religion being varied, or augmented, or diminished, make no variation, addition or diminution in the religion, no more than alteration in clothes makes an alteration in the man.

3. No ordinance that is of universal and perpetual use to the Church of God (if it be at all of use), so that it may in no place, in no age be omitted, may be devised of man. For the devising of such an ordinance supposes a defect in the divine ordinances of universal and perpetual use, to be made up by adding other ordinances by way of supplement. And it is but a presuming that those others are requisite, when they are not. Also if the universal Lawgiver has reserved anything to his own power, it can be no less than the making of such laws or ordinances as are of universal and perpetual use. And surely that He has reserved something to Himself, few among us will gainsay. Howbeit an arbitrary and temporary use of a religious observance by particular men for such ends as equally concern all Christians may not be unlawful upon this account, because therein Christ’s legislative power is not encroached upon, it not being made a law to the Church, but only a private arbitrary observation.”

— John Corbet, The Remains of, Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 4, What of Divine Worship may not be Devised or Instituted by Man">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+it+is+to+be+considered+what+kind+of+religious+observations+God+has+reserved+to+his+own+determination+and+forbidden+to+be+devised+or+instituted+by+man.+And+these+are+first%2C+such+as+are+of+the+same+reason+with+those+ordinances+which+God+has+instituted+to+be+observed+by+the+universal+Church+to+the+world%E2%80%99s+end%2C+as+to+make+an+addition+of+another+weekly+day+to+the+same+holy+intents+for+which+the+Lord%E2%80%99s+Day+is+set+apart%2C+or+to+institute+any+ordinance+that+is+of+the+same+reason+with+the+sacraments+of+the+Covenant+of+Grace.+%E2%80%A6+2.+No+new+integral+part+of+divine+worship%2C+without+which+the+worship+of+God+is+supposed+not+entire%2C+but+deficient+in+part%2C+may+be+invented+of+man.+For+it+were+to+invent+a+new+part+of+the+Christian+religion+and+to+augment+it+beyond+the+state+thereof+as+settled+by+the+Author+and+Founder+of+it.+Here+note+that+the+accidental+parts+of+religion+being+varied%2C+or+augmented%2C+or+diminished%2C+make+no+variation%2C+addition+or+diminution+in+the+religion%2C+no+more+than+alteration+in+clothes+makes+an+alteration+in+the+man.+3.+No+ordinance+that+is+of+universal+and+perpetual+use+to+the+Church+of+God+%28if+it+be+at+all+of+use%29%2C+so+that+it+may+in+no+place%2C+in+no+age+be+omitted%2C+may+be+devised+of+man.+For+the+devising+of+such+an+ordinance+supposes+a+defect+in+the+divine+ordinances+of+universal+and+perpetual+use%2C+to+be+made+up+by+adding+other+ordinances+by+way+of+supplement.+And+it+is+but+a+presuming+that+those+others+are+requisite%2C+when+they+are+not.+Also+if+the+universal+Lawgiver+has+reserved+anything+to+his+own+power%2C+it+can+be+no+less+than+the+making+of+such+laws+or+ordinances+as+are+of+universal+and+perpetual+use.+And+surely+that+He+has+reserved+something+to+Himself%2C+few+among+us+will+gainsay.+Howbeit+an+arbitrary+and+temporary+use+of+a+religious+observance+by+particular+men+for+such+ends+as+equally+concern+all+Christians+may+not+be+unlawful+upon+this+account%2C+because+therein+Christ%E2%80%99s+legislative+power+is+not+encroached+upon%2C+it+not+being+made+a+law+to+the+Church%2C+but+only+a+private+arbitrary+observation.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+The+Remains+of%2C+Of+Divine+Worship%E2%80%A6+in+The+Remains+of+the+Reverend+and+Learned+Mr.+John+Corbet%2C+Late+of+Chichester+Printed+from+his+own+Manuscripts+%28London%3A+Thomas+Parkhurst%2C+1684%29%2C+pt.+3+%7C+sect.+4%2C+What+of+Divine+Worship+may+not+be+Devised+or+Instituted+by+Man&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83a5c9bf20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83a5c9bf20.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=Now%20it%20is%20to%20be%20considered,but%20only%20a%20private%20arbitrary%20observation&amp;text=Now%20it%20is%20to%20be%20considered%20what%20kind&amp;text=the%20Church%2C%20but%20only%20a%20private%20arbitrary%20observation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

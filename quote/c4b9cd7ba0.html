<blockquote><p>In the midst of the mindless fanaticism surrounding the current presidential election, James Dick provides us with a sense of perspective that is sadly missing among the pseudo-religious right – who think that you can reform a nation by voting for a Mormon antichrist. It is especially sad that professors at “Puritan Reformed” seminaries ignore the teaching of the Reformed confession in relation to extirpating idolatry and caring for the poor and needy in order to justify supporting the heresy of American conservatism (being “conservative” in America means conserving an atheist, idolatrous, Christ-despising, hell-inspired constitution. It is, therefore, a political heresy to be a conservative in an American context. Why do you think the Libertarians and conservatives slander our Reformed forebears as Statists and socialists? It is because they know that the Reformed position is at odds with their idol of conservatism). I wonder how many Puritans would have voted for Socinians or members of other cults? Seriously, if you were to accept the reasoning in the post linked above, “vote for Mitt Romney because he is against abortion and homosexuality” [which is debatable], you could use it to justify voting for the Pope of Rome! After all, the Pope is against homosexuality and abortion, but no Puritan would ever have voted him or his votaries into civil office because they knew that the spiritual damage popery and false relgion can potentially do is far worse than anything that can be done by abortionists or homosexuals. The reality is that such “conservatism” (a useless term if ever there was one) is of its father the devil. May God deliver us from such folly by returning us to the Old Light Covenanter position:

The Reformed Presbyterian Church exists to keep this Gospel pure and entire. Is there any other Church that does this? If so, we shall be glad to join hand and heart with that Church. We do not know, however, of any Church but our own that openly protests against the nation’s rejection of Christ. We do not know of one single resolution or memorial or action of any Court of the British Presbyterian Churches in which they profess a desire to bring the nation to Christ’s feet. We do not know of a single act in which they denounce the sin of this nation in breaking Christ’s Covenants at the Restoration, and its continued sin in persisting in the breach of those Covenants today.

Yet members of these churches will tell us when we feel constrained to protest against a rebellious nation, and to separate ourselves from it, that they are taking the more excellent way of “voting for good men,” and seeking reform in the direction of which we are speaking. For first, no good man ever yet solicited the votes of the electors in order to advocate the restoration of the nation to Christ’s law. No vote was ever given or received for the purpose of purging the nation from its unholy confederacy with Christ’s enemies. When we find a candidate for Parliamentary honours who will pledge himself heartily and honestly to urge upon the nation the Gospel of our Testimony, and when we find members of other churches willing to vote that the Gospel of our Testimony may be accepted by the nation, it will be time enough for us to consider whether voting side by side with Papists and other enemies of Christ be a more excellent way, or any holy way at all, to seek reform.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), p. 19.</span></figcaption>

<blockquote><p>Again, my friends, we would beseech you all to cultivate a catholic spirit. Think not that merely because you are Presbyterians you are therefore better than others. There are many members of the Independent and Episcopal churches whom the Son of God has delighted to honour, and who shall doubtless shine throughout all eternity, as pearls in his royal diadem. Our forms of government and discipline are but perishable barriers by which the various sections of the church are now separated, but at death these partitions fall asunder, and the faithful in the world above are all one in Christ Jesus for ever.

The Saviour will certainly honour his own ordinances, and, other things being equal, we may expect to find the purest piety where the Redeemer is worshipped according to the purest forms; but still we are not to trust to our privileges — we are not to worship the temple, instead of the God of the temple. Love is the essence of Christianity, and a Presbyterian church, where the life of piety is wanting, is a temple from which the glory has departed. Again, whilst Presbyterians act towards others in a spirit of expansive charity, and whilst they acknowledge that their ecclesiastical arrangements are not of such importance as the more enduring treasures of the new covenant, let them not imagine that they may therefore disregard the peculiarities of their religious system. Everything is precious which the Redeemer has ordained.

As Presbyterians consider that their own church is more perfect than others in her constitution, let them bestow upon her more abundant honour. Let them cleave steadfastly to her ordinances; let them not be seduced from her apostolic forms by the pageantry or the profits of a more gorgeous establishment. A good conscience is a constant feast; and let not Presbyterians sell, for any of the beggarly elements of this world, even the smallest portion of their birth-right as citizens of Zion.</p></blockquote>

<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinaris et operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving. … 11. The question, if such a pastor be called lawfully, is a question of fact, not a question of law; [it is] as this [case]: if such an one be baptized and there be an invincible ignorance in a question of fact which excuses. And therefore we may hear a gifted pastor taken and supposed by the Church to have the Church’s calling, though indeed he received no calling from the Church at his entry. … 3. We are nowhere forbidden in God’s Word to hear teachers sent and called, but only wolves in sheep skins, void of all calling, and intruders: for pastors may be antichristian in the manner of the entry, as Caiaphas… 3. Yea, and brook an antichristian calling, as prelates do and have done in Britain, and yet their ministry be valid. For that the calling of a minister be valid and his ministerial acts not null, it is sufficient that the governing Church give him a calling, either by themselves, their express call, their silence, or tacit consent, or their approbation communicating with him in his ministry, or by these to whom the Church resigned her power, or by these who stand in place of the Church, though prelates invade the place of the Church: yet: [1.] because first they themselves be pastors and have power to teach and baptize as pastors called of Christ. Mt. 18:19. 2. Because they stand for the Church, the Church approving or someway by silence consenting (as in the case of Caiaphas’s entry to the priesthood) thereunto. These who are baptized of them are not rebaptized, and these who are ordained pastors by them are not reordained, but have a calling to the ministry and do validly confer a calling upon others. Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized, not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinaris et operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving. … 11. The question, if such a pastor be called lawfully, is a question of fact, not a question of law; [it is] as this [case]: if such an one be baptized and there be an invincible ignorance in a question of fact which excuses. And therefore we may hear a gifted pastor taken and supposed by the Church to have the Church’s calling, though indeed he received no calling from the Church at his entry. … 3. We are nowhere forbidden in God’s Word to hear teachers sent and called, but only wolves in sheep skins, void of all calling, and intruders: for pastors may be antichristian in the manner of the entry, as Caiaphas… 3. Yea, and brook an antichristian calling, as prelates do and have done in Britain, and yet their ministry be valid. For that the calling of a minister be valid and his ministerial acts not null, it is sufficient that the governing Church give him a calling, either by themselves, their express call, their silence, or tacit consent, or their approbation communicating with him in his ministry, or by these to whom the Church resigned her power, or by these who stand in place of the Church, though prelates invade the place of the Church: yet: [1.] because first they themselves be pastors and have power to teach and baptize as pastors called of Christ. Mt. 18:19. 2. Because they stand for the Church, the Church approving or someway by silence consenting (as in the case of Caiaphas’s entry to the priesthood) thereunto. These who are baptized of them are not rebaptized, and these who are ordained pastors by them are not reordained, but have a calling to the ministry and do validly confer a calling upon others. Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized, not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.”

t+way+%5Bthe%5D+baptized+do+indeed+want+the+Lord%E2%80%99s+seal%3B+but+we+cannot+for+that+say+that+they+are+no+better+than+infidels+and+unbaptized+Turks+and+Jews%2C+because%3A+1.+Their+being+born+in+the+visible+Church+gives+a+federal+holiness%2C+as+all+of+Jewish+parents+had+a+federal+right+to+circumcision+and+were%2C+eatenus%2C+%E2%80%98insofar%E2%80%99%2C+separated+from+the+womb.+2.+Because+their+profession+of+that+Covenant+whereof+baptism+is+a+seal%2C+separates+them+sufficiently+from+infidels%2C+though+they+want+the+seal+external.+But+our+divines+esteem%2C+and+that+justly%2C+baptism+administrated+by+women+or+such+as+have+no+calling%2C+to+be+no+baptism+at+all%3B+for+which+let+the+reader+see+Calvin%2C+Institutes%2C+bk.+4%2C+ch.+15%2C+sect.+20%3B+Epistle+326%3B+Beza%2C+Libel.%2C+Questione+de+Baptism%3B+the+learned+Rivet%2C+in+Cathol.+Orthod.%2C+tome+2%2C+tract+2%2C+q.+7.+We+stand+not+for+what+Bellarmine%2C+Maldonatus%2C+Gretserus+and+other+papists+say+on+the+contrary.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%E2%80%A6+%28London%2C+1644%29%2C+pt.+1%2C+pp.+204-8%2C+229%2C+235+irregular+numbering&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce6f22c7a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce6f22c7a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=4th%20Distinction.%20A%20calling%20may%20be,other%20papists%20say%20on%20the%20contrary&amp;text=4th%20Distinction.%20A%20calling%20may%20be%20expressly%20and&amp;text=Gretserus%20and%20other%20papists%20say%20on%20the%20contrary" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…Cotton’s ‘The Way Of The Churches Of Christ In New-England’, whose manuscript was widely circulated in England even a few years before its publication in 1645…. Particularly, Cotton’s ‘The Keys Of The Kingdom Of Heaven’ (1644) was so influential in England that John Owen, a Presbyterian, became convinced that Cotton was right and, finally, supported the Congregational form of church government. Meanwhile, refuting Cotton’s works, both Robert Baillie and Daniel Cawdrey wrote ‘A Dissuasive from the Errors of the Time’ (1645) and ‘Vindicae Clavium, or a Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners’ (1645) respectively. Three years later, Cotton’s reply to Baillie and Cawdrey was published under the title, ‘The Way of Congregational Churches Cleared’ (1648).</p></blockquote>

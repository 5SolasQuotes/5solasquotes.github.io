<blockquote><p>3… Christ does not disown all imperfect worship that has some superstition: And we must receive one another as Christ receives us. 4. It was superstitious persons that Paul commands Christians to receive to communion, Rom. 14:5. Thus he [the separatist opponent] condemns the apostles and the Churches then, and the Scripture itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-79cbcf5e8e" data-kw="">
<blockquote><p>The non-conformist, non-separatist, puritan minister authors of this book: …were examples of holiness, so in this, that they have ever, not only forborne, but steadfastly opposed to their great reproach, damage and danger many ways, the corruptions in our [Anglican] Church government, worship and liturgy, and have been lights and leaders to these latter times therein, yet always in a peaceable and regular way, as not on the one side to subject themselves to suspicious inventions, so on the other, not sinfully to separate from the communion and true worship of churches, accounting it more agreeable to all rules of piety, charity and Christian prudence to tolerate for the time what they could not mend rather than to rent and tear all in pieces to an utter ruin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Publisher, William Rathband</cite>, (1604; 1644; RBO, 2025), p.</span></figcaption>

</figure><figure class="quote" id="q-50e9332d21" data-kw="">
<blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress.

2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do.

3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>

<blockquote><p>20. There are so few Churches on earth that worship God without all set liturgies or forms as are next to none. And there are very few in all the world so good as the English liturgy and that have so few faults: which martyrs composed and joyfully used. And it is unchristian to renounce communion with any one Church for a reason that is common to all, or almost all, it being contrary to the communion of saints in one body, and [is] far worse than to slander any single man.</p></blockquote>

</figure><figure class="quote" id="q-f9c7f70eeb" data-kw="">
<blockquote><p>They [older non-conformists] argue that there is no necessity for [total] Separation for the sake of such corruptions, because a person may communicate in the worship without partaking in those corruptions…

1. This separation of the good from the bad in divine worship they grant possible. So Mr. [John] Ball: ‘If some things human be mixed with divine, a sound Christian must separate the one from the other, and not cast away what is of God as a nullity, fruitless, unprofitable, defiled, because somewhat of men is annexed unto them. In the body we can distinguish betwixt the substance and the sickness which cleaves unto it; betwixt the substance of a part or member, and some bunch or swelling, which is a deformity, but destroys not the nature of that part or member, etc.’ (Trial of the Grounds, etc., [ch. 13,] p. 308) …

2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters</cite>, (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)”

there+%28though+great%2C+yet%29+are+not+such+as+make+the+worship+cease+to+be+God%E2%80%99s+worship%2C+nor+of+necessity+to+be+swallowed+down+if+one+would+communicate+in+that+worship%2C+while+any+Christian+%28that+is+watchful+over+his+own+heart+and+carriage%2C+as+all+ought+ever+to+be%29+may+partake+in+the+one%2C+without+being+active+in%2C+or+approving+the+other%3B+there+God+is+yet+present%2C+there+he+may+be+spiritually+worshipped%2C+served+acceptably%2C+and+really+enjoyed.%E2%80%99+%28England%E2%80%98s+Remembrancer%2C+sermon+4%2C+p.+94%29%E2%80%9D%0A%0A%E2%80%94+London+Ministers%2C+A+Collection+of+Cases+%26+other+Discourses+lately+written+to+recover+Dissenters+to+the+communion+of+the+Church+of+England+by+some+Divines+of+the+City+of+London%2C+%28London%2C+1685%29%2C+vol.+1%2C+John+Williams%2C+%E2%80%98The+Non-Conformists%E2%80%99+Plea+for+Lay-Communion+with+the+Church+of+England%E2%80%99+Williams+%28d.+1709%29+was+an+Anglican+bishop.%2C+p.+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9c7f70eeb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9c7f70eeb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=They%20%5Bolder%20non%2Dconformists%5D%20argue%20that%20there,England%E2%80%98s%20Remembrancer%2C%20sermon%204%2C%20p.%2094&amp;text=They%20%5Bolder%20non%2Dconformists%5D%20argue%20that%20there%20is%20no&amp;text=really%20enjoyed.%E2%80%99%20%28England%E2%80%98s%20Remembrancer%2C%20sermon%204%2C%20p.%2094" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

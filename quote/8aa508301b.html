</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7c2afaf46" data-kw="">
<blockquote><p>He manifests the more grace and goodwill to our salvation, and that He is more ready to pardon than to punish, in that He waits so long on the sinner’s choice: Rom. 9:22, ‘What if God, willing to show his wrath, and to make his power known, endured with much long‑suffering the vessels of wrath filled to destruction?’ He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace; and if He should do that, the world would never be put upon choice and trial, and obedience would be a matter of necessity and constraint, not of willing acceptation; and men may as well quarrel at this as that He has not made them all angels.</p></blockquote>

</figure><figure class="quote" id="q-dca7db9516" data-kw="">
<blockquote><p>The Lord therefore did raise up his prophet Malachi (who was the last before Christ) sharply to rebuke, and plainly to convict this horrible ingratitude of that unthankful nation, who so shamefully had forgotten those so great benefits recently bestowed upon them. And thus begins he his prophecy: “I have loved you, sayeth the Lord,” in which words he speaks not of a common love, which in preserving and feeding all creatures is common to the reprobate, but of that love by the which he had sanctified and separated them from the rest of nations, to have his glory manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On Predestination” in The Works of John Knox</cite>, ed. David Laing (Edinburgh: J. Thin, 1895), 5:150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-a820c2eadb" data-kw="">
<blockquote><p>Q. What difference is there betwixt the combat which is to be found in the temporary [believer], and that which is proper to the regenerate? A. Besides the remainders of God’s image, the temporary believer is endued with the common graces of the Spirit, for substance not counterfeit, though ineffectual to sanctification. He is illightened with the knowledge of divine mysteries grounded upon the Scripture, which is not altogether idle and ineffectual: He is drawn to believe in some sort and with confidence to receive the Word of the Kingdom both as true and good. He may reform himself in such sort, that it may be said Satan is cast out of him: and all this not in hypocrisy or for fear of punishment, but freely and according to the Word of grace, whereby he is moved to affect things that are above. From whence follows a combat in him far greater and of another nature than that betwixt reason and appetite, conscience and affection, or the relics of God’s image with the power of sin; even of the common graces of the Spirit with the power of corruption repressed, not mortified or killed. But the graces of the Spirit are not soundly planted, the Word of the Kingdom is not kindly received into the heart so as to rule with universal sovereignty, and to season throughout the powers of the soul. Temporary Christians make some account of God’s favor and the joys of heaven in an inferior place: but their desire of happiness is subordinate to the things of this world; in particular estimation, which is joined with choice of heart, they prefer their special delights before Christ, and will rather leave Him than leave the world, if the one of necessity must be parted with. Wherefore the will of the best unregenerate man, is still in captivity under the dominion of sin, and his heart of an earthly temper, though it be somewhat changed by the superficial receipt of the Word of Life, which it tastes, but digests not. In which respect the motions of the unregenerate in the ways of godliness may be said to be dead and accidental; because the soul is not enlivened by the Spirit of grace: but the motion of the regenerate is lively and natural, proceeding from the Spirit of grace that dwells in them, whereby they are quickened in the inner man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Power of Godliness both Doctrinally &amp; Practically handled</cite>, … (London: Miller, 1657), ch. 3, p. 299</span></figcaption>

<blockquote><p>VII. (2) The question [at hand to be discussed] is not whether God is born by a general love and philanthropy (philanthropia) towards men as his creatures, and also bestows upon them various temporal benefits pertaining to the things of this life (ta biotika). We do not deny that God has never left Himself without witness (amartyron) with regard to this (Acts 14:17). And we readily grant that there is no one who does not owe some gratitude to God and who, whatever he is or can do, is not bound to give thanks to his Creator. But the question concerns the special and saving love which tends to spiritual benefits, and by which God willed to have mercy upon them to salvation. We think this is particular to the elect alone, not universal and common to all.</p></blockquote>

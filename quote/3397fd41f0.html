<main class="wrap"><figure class="quote" id="q-3397fd41f0" data-kw="">
<blockquote><p>I wish the reader to understand that as often as we mention Faith alone in this question, we are not thinking of a dead faith, which worketh not by love, but holding faith to be the only cause of justification. (Galatians 5:6; Romans 3:22.) It is therefore faith alone which justifies, and yet the faith which justifies is not alone: just as it is the heat alone of the sun which warms the earth, and yet in the sun it is not alone, because it is constantly conjoined with light. Wherefore we do not separate the whole grace of regeneration from faith, but claim the power and faculty of justifying entirely for faith, as we ought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, Canon 11, p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/faith-alone-justifies-but-not-alone.html">Faith alone justifies, but not alone</a></span><span class="t"><a href="../topics/faith/faith-and-works.html">Faith and Works</a> › <a href="../topics/faith/faith-and-works/faith-working-by-love.html">Faith working by love</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/trent.html">Trent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9fb981b913" data-kw="">
<blockquote><p>Here the question arises by what means are we justified? We answer with Paul, &quot;By faith only in Christ are we pronounced righteous, and not by works.&quot; Not that we reject good works. Far from it. But we will not allow ourselves to be removed from the anchorage of our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on 2:16, p. 55</span></figcaption>

— Martin Luther, Commentary on Galatians, on 2:16, p. 55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+the+question+arises+by+what+means+are+we+justified%3F+We+answer+with+Paul%2C+%22By+faith+only+in+Christ+are+we+pronounced+righteous%2C+and+not+by+works.%22+Not+that+we+reject+good+works.+Far+from+it.+But+we+will+not+allow+ourselves+to+be+removed+from+the+anchorage+of+our+salvation.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+on+2%3A16%2C+p.+55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9fb981b913.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9fb981b913.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7581bd9f56" data-kw="">
<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-platt.html">David Platt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Follow Me</cite>, p. 60</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.”

</figure><figure class="quote" id="q-00b847c504" data-kw="">
<blockquote><p>We dream not of a faith which is devoid of good works, nor of a justification which can exist without them: the only difference is, that while we acknowledge that faith and works are necessarily connected, we, however, place justification in faith, not in works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.16.1</span></figcaption>

</figure><figure class="quote" id="q-05656507d3" data-kw="">

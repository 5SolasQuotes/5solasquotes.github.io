<main class="wrap"><figure class="quote" id="q-6ca0517cfa" data-kw="">
<blockquote><p>See hence a good reason for that solemn work and duty of covenanting, by stretching out the hand into the Lord, as it is said of Ethiopia, Ps. lxviii. 31 This duty is warranted by scripture example, and scripture prophecy concerning the days of the New Testament, and the example of our worthy forefathers in the three kingdoms, and this land in a particular manner. As God the Father, by solemn oath, has constituted his own Son the great Manager of his house, hanging all the offspring and issue upon him; so it is highly reasonable that all the offspring and issue of the family should homologate his deed, by solemn oath and covenant, before the whole world, because this is for his declarative glory, upon whom all the glory hangs. …

There are a generation of men in our day, who set up only for a private, selfish kind of religion. If they believe with the heart, they think they have done enough. If they enjoy raptures and ecstasies of love to Christ, they are easy what come of Jerusalem, what come of the ark of God, or a covenanted reformation. Let error in doctrine, corruption in worship, tyranny in government, prevail as much as they will, it is all a matter; these are not the essentials; all is well with them if they have what they call the Spirit. But what sort of a spirit is that which follows, cleaves to, and coalesces with abjured prelacy, a corrupt backsliding ministry, and judicatories that deny the obligation of solemn covenants, and at the same time inspire men with enmity against a testimony for a covenanted reformation and all that own it?

Surely such a spirit must be the spirit of the old serpent transforming himself into an angel of light; the old malignant spirit that persecuted our forefathers unto death, for cleaving to a covenanted reformation, although now indeed, it has put on the name and vizard of Presbyterian. They that boast of such a spirit, as if it were a spirit of conversion, they boast themselves in a thing of nought; yea, in a thing that is worse than nought, even of a spirit of strong delusion. A deceived heart, and a subtle devil, has turned them aside from the truth, that they cannot deliver their souls, nor say, Is there not a lie in my right hand?</p></blockquote>

<blockquote><p>3. We must hold that the Covenant of Grace, though it take not away the obligation of the Law, yet it takes away the rigor, or severity and terribleness of that obligation. For though it set before our eyes an universal perfection of righteousness, as to be affected and endeavored to our utmost strength, yet does it not strictly and precisely require it on the pain of eternal damnation. Indeed to a certain measure of obedience, to wit, such as by ordinary grace is possible, it does strictly and precisely oblige us, that is, on pain of eternal damnation, requiring that we actually have it. But to a farther measure, which by the power of ordinary grace we cannot attain, it obliges us less strictly, to wit, requiring that we have it in desire and endeavor, v.g. to the perfection of parts, as they call it, it obliges precisely: For it does no otherwise promise eternal life, but on this condition, that we actually have this.</p></blockquote>

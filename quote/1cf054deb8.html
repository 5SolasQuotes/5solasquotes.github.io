<main class="wrap"><figure class="quote" id="q-1cf054deb8" data-kw="knowledge assent trust fiducia">
<blockquote><p>As to the acts, they are explained by theologians in different ways—some making more, others fewer. Some make only one, namely assent or persuasion. Others acknowledge only two—knowledge and assent. Others add a third (to wit, trust). Others a fourth also (to wit, confidence or the acquiescence of the will). These different opinions do not so much change the nature of faith as unfold it in different ways. And hence it is that some place faith equally in the intellect and the will; others only in the intellect formally and in the will only energetically or effectively and consequently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.1b</span></figcaption>

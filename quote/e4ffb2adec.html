<main class="wrap"><figure class="quote" id="q-e4ffb2adec" data-kw="">
<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology. 7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Method of Christian Theology (London: White &amp; Snowden, 1681), pt. 1, ch. 1, pp. 31-32 tr. AI Stiven Peter Latin</cite></span></figcaption>

</figure><figure class="quote" id="q-eda808d4d5" data-kw="">
<blockquote><p>Doth the plowman plow all day to sow? doth he open and break the clods of his ground? When he hath made plain the face thereof, doth he not cast abroad the fitches, and scatter the cummin, and cast in the principal wheat and the appointed barley and the rie in their place? For his God doth instruct him to discretion, and doth teach him. For the fitches are not threshed with a threshing instrument, neither is a cart wheel turned about upon the cummin; but the fitches are beaten out with a staff, and the cummin with a rod. Bread corn is bruised; because he will not ever be threshing it, nor break it with the wheel of his cart, nor bruise it with his horsemen. This also cometh forth from the Lord of hosts, which is wonderful in counsel, and excellent in working.</p></blockquote>

</figure><figure class="quote" id="q-cf8c8a1fda" data-kw="">
<blockquote><p>Being is what is called in A[ristotelian]-T[homistic] metaphysics a transcendental, something above every genus, common to all beings and thus not restricted to any category or individual. The other transcendentals are thing, one, something, true, and good, and each is ‘convertible’ with being in the sense that each designates one and the same thing—namely being—under a different aspect. (To put the point in terms made familiar by Frege, the transcendentals differ in sense but not in reference, referring to the same thing under different names just as ‘Superman’ and ‘Clark Kent’ do.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>III. ‘The Transcendentals’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 303-7</cite>, pp. 304-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

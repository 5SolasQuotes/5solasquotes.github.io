<blockquote><p>IT is of some difficulty to know certainly what was the opinion of Mahomet, the Author of the Turkish Religion, concerning this Question, Whether the Profession of all Religions be Indifferent? For he seems sometimes to affirm it: as when he says in the Chapter of the Fable, That Jews, Samaritans, Christians, all that shall have trusted in God and believed the Resurrection of the Dead, and done good Works, shall be exempt from affliction, and they shall have nothing to fear at the day of Judgement. Sometimes again he denies it: as when in the same Chapter and Page he says, Certainly they which say that Jesus the son of Mary, is God, are impious; and the entrance into Paradise is forbidden to him that says God hath a companion equal to himself, but hell shall be his habitation. Which Assertions are manifestly contradictory.

And he is otherwise alike unconstant and fluctuating. For sometimes he promises the grace of God to all those that do good works, provided they believe the unity of the Deity; a thing which he is very instant in recommending. And sometimes he says that his Law is the only way of truth and salvation, and almost every where he teaches to promote it by force of Arms; which does not well consist with his former maxim. For if all Religions equally endear to God and his favour, what necessity is there of so many bloody wars for the propagation of Mahometism? In truth it would be a strange thing if a good Musulman should think his salvation secured in the profession of the Christian Religion, which censures Mahomet for the greatest and most abominable Deceiver, that ever lived upon the Earth, and his Alcoran for a piece of unparalleled imposture and execrable impiety; or if he should partake in a communion where they pray continually for the destruction of the Empire of the Turk, and the extirpation of the Mahometan Religion.

It is possible he might dextrously explicate his meaning by this distinction, whereof there are some shadows frequently in his book; That if a person who once embraced the faith, afterwards happen to relapse from or renounce the same by constraint, yet he shall not be condemned, provided he retain the same in his heart: but if he do it voluntarily and without any violence, he shall never be redressed or restored into the right way by God, but shall be adjudged unto eternal pains. And it is well known, that whatever the Alcoran says to the contrary, The Turks hold the Persians for eternally damned, as heretics of their Law, though they consent in the principal points of the same, and both unanimously hold that impostor for a supreme Prophet.

But as to matter of life and ordinary practise, there is no people under the Sun more scrupulous in observation of things which they account as making part of their Religion, or come near it within a hundred leagues; as not to employ any paper to unclean uses, because the Alcoran is written in it, and other such niceties, which speak them indeed sufficiently foolish, but otherwise exact observers of their most minute ceremonies. Their public prayers are constantly frequented, &amp; their private never neglected. Their Fasts are strict and inviolable; and seeing they condemn the use of Wine as abominable, how can they be indifferent in other things more essential and important to Religion?

Certainly though Christians have without comparison better grounds for this pretension, that the truth is on their side, yet they are nothing near so passionate for the promoting of Christianity, as the Turks are for the propagation of the Law of Mahomet. For they invite Christians to them by great rewards; they favour and advance renegades: and when a war is undertaken, they are wonderfully zealous and ardent therein, if there be hope of extending their Belief, further thereby, and planting it amongst the Nations which they invade. Which also themselves are so obstinate in retaining, that it is very ordinary to find amongst them great numbers of persons that have abandoned the name of Christ; but to see converted Turks in Christendom, is a thing then which nothing is more rare: Yea there have been some who have rather chosen to suffer an ignominious death, then to accept of a pardon for notorious crimes committed by them, on condition of being baptised.</p></blockquote>

<blockquote><p>But this is most certain, that there are yet better things to come then have been since the first calling of the Gentiles. Among other better things to come, the recalling of the Jews is most clearly and plentifully fore told by the Prophets. Many apply sundry prophecies that tend that way, to the delivery of the Jews from the Babylonish Captivity; and others, to the spiritual Israel, consisting of Gentiles.

But assuredly such prophecies as fore-tell the re-uniting of Judah and Ephraim together, have especial reference to the fore-said recalling of the Jews: as that Parable, whereof this our Prophet maketh mention, about joining two sticks, on the one whereof was written, For Judah, and for the children of Israel his companions: and on the other, For Joseph the stick of Ephraim, and for all the house of Israel his companions. That Parable the Prophet thus applieth, I will make them one Nation, and one King shall be King to them all, &amp;c.

But if any shall question this and other prophecies of the ancient Prophets. The Apostle Paul hath so expressly fore-told a recalling of the Jews, and thereupon, a bringing in a fullness of the Gentiles, as no question can be made thereof: and he doth after such a manner express these, as apparently declareth a future glory of the Christian Church. Some particular expressions of his in the 11. to the Romans, are these.

1.Vers. 11. Having propounded this Question concerning the Jews, Have they stumbled, that they should fall? (namely, totally and finally, never to be raised again.) He gives this answer, God forbid. Whereby he implieth, that assuredly they shall be raised again, that is, they shall be made a visible Church of Christ, and submit themselves to his ordinances.

2. Vers. 12. This supposition, If the fall of them be riches of the world, and the diminishing of them the riches of the Gentiles: how much more their fullness? By their fullness, he meaneth their bringing them in to the Church of Christ, consisting of Gentiles, and thereby making that Church full, when both Gentiles and Jews shall be joined together.

3. Vers. 15. This Question (What shall the receiving of them be but life from the dead?) doth take it for grant, that they shall be received, and taken into the Church of Christ; and that this restoration of theirs will be as a new glorious resurrection.

4. Vers. 23. It is said, They also shall be graffed in; namely, into the body of the Christian Church; and a proof thereof is taken from God’s omnipotency, For God is able to graff them in again.

5. Vers. 24. This emphatical Interrogation, How much more shall these, which be the natural branches, he graffed into their own Olive-tree? doth put it out of all question, that the Jews shall again be brought to be of the true Church, which is the Olive-tree here intended.

6. Vers. 25. This restrictive particle, In part (blindness in part is happened unto Israel) doth import, that they shall not be finally blinded, but that at length they shall come to have their eyes so opened, as they shall know and believe in Jesus Christ. This is further manifested by expressing the period of this limitation, thus, Until the fullness of the Gentiles be come in.

7. Verse 26. This general phrase; All Israel shall be saved, sheweth, that there is a time to come, when not only two or three, or a few Jews here and there thorowout the Christian Church (as have been in all ages thereof) but the whole Nation shall be called.

8. Vers. 31. This phrase, Through your mercy they also may obtain mercy; sheweth, that God purposely suffered them sometime to abide in unbelief, that when they should be brought to believe, this grace and honour might appear to arise from God’s mere mercy and free grace. The words following in the next verse doe shew as much: They are these, For God hath concluded them all in unbelief, that he might have mercy upon all.

Thus we see that there is a calling of the Jews to come, and that their calling shall be as a resurrection from the dead, as an incision of many more branches into a glorious tree, that it shall be an universal, conspicuous calling of a whole Nation, wherein the freeness and largeness of God’s grace and mercy shall be evidently manifested. At which time there shall be also such a number of Gentiles brought in, as may well be called the fullness of the Gentiles, vers. 25. This certainly shall be a most glorious condition of the Christian Church, and this is yet to come: therefore God will yet doe better things for us. In expectation whereof we may comfort our selves, though for a while thick clouds of troubles doe over-spread the face of the Church, and somewhat eclipse the glorious brightness thereof.</p></blockquote>

— William Gouge, The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast, (London: Joshua Kirton, 1645), pp 29-33.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+this+is+most+certain%2C+that+there+are+yet+better+things+to+come+then+have+been+since+the+first+calling+of+the+Gentiles.+Among+other+better+things+to+come%2C+the+recalling+of+the+Jews+is+most+clearly+and+plentifully+fore+told+by+the+Prophets.+Many+apply+sundry+prophecies+that+tend+that+way%2C+to+the+delivery+of+the+Jews+from+the+Babylonish+Captivity%3B+and+others%2C+to+the+spiritual+Israel%2C+consisting+of+Gentiles.%0A%0ABut+assuredly+such+prophecies+as+fore-tell+the+re-uniting+of+Judah+and+Ephraim+together%2C+have+especial+reference+to+the+fore-said+recalling+of+the+Jews%3A+as+that+Parable%2C+whereof+this+our+Prophet+maketh+mention%2C+about+joining+two+sticks%2C+on+the+one+whereof+was+written%2C+For+Judah%2C+and+for+the+children+of+Israel+his+companions%3A+and+on+the+other%2C+For+Joseph+the+stick+of+Ephraim%2C+and+for+all+the+house+of+Israel+his+companions.+That+Parable+the+Prophet+thus+applieth%2C+I+will+make+them+one+Nation%2C+and+one+King+shall+be+King+to+them+all%2C+%26c.%0A%0ABut+if+any+shall+question+this+and+other+prophecies+of+the+ancient+Prophets.+The+Apostle+Paul+hath+so+expressly+fore-told+a+recalling+of+the+Jews%2C+and+thereupon%2C+a+bringing+in+a+fullness+of+the+Gentiles%2C+as+no+question+can+be+made+thereof%3A+and+he+doth+after+such+a+manner+express+these%2C+as+apparently+declareth+a+future+glory+of+the+Christian+Church.+Some+particular+expressions+of+his+in+the+11.+to+the+Romans%2C+are+these.%0A%0A1.Vers.+11.+Having+propounded+this+Question+concerning+the+Jews%2C+Have+they+stumbled%2C+that+they+should+fall%3F+%28namely%2C+totally+and+finally%2C+never+to+be+raised+again.%29+He+gives+this+answer%2C+God+forbid.+Whereby+he+implieth%2C+that+assuredly+they+shall+be+raised+again%2C+that+is%2C+they+shall+be+made+a+visible+Church+of+Christ%2C+and+submit+themselves+to+his+ordinances.%0A%0A2.+Vers.+12.+This+supposition%2C+If+the+fall+of+them+be+riches+of+the+world%2C+and+the+diminishing+of+them+the+riches+of+the+Gentiles%3A+how+much+more+their+fullness%3F+By+their+fullness%2C+he+meaneth+their+bringing+them+in+to+the+Church+of+Christ%2C+consisting+of+Gentiles%2C+and+thereby+making+that+Church+full%2C+when+both+Gentiles+and+Jews+shall+be+joined+together.%0A%0A3.+Vers.+15.+This+Question+%28What+shall+the+receiving+of+them+be+but+life+from+the+dead%3F%29+doth+take+it+for+grant%2C+that+they+shall+be+received%2C+and+taken+into+the+Church+of+Christ%3B+and+that+this+restoration+of+theirs+will+be+as+a+new+glorious+resurrection.%0A%0A4.+Vers.+23.+It+is+said%2C+They+also+shall+be+graffed+in%3B+namely%2C+into+the+body+of+the+Christian+Church%3B+and+a+proof+thereof+is+taken+from+God%E2%80%99s+omnipotency%2C+For+God+is+able+to+graff+them+in+again.%0A%0A5.+Vers.+24.+This+emphatical+Interrogation%2C+How+much+more+shall+these%2C+which+be+the+natural+branches%2C+he+graffed+into+their+own+Olive-tree%3F+doth+put+it+out+of+all+question%2C+that+the+Jews+shall+again+be+brought+to+be+of+the+true+Church%2C+which+is+the+Olive-tree+here+intended.%0A%0A6.+Vers.+25.+This+restrictive+particle%2C+In+part+%28blindness+in+part+is+happened+unto+Israel%29+doth+import%2C+that+they+shall+not+be+finally+blinded%2C+but+that+at+length+they+shall+come+to+have+their+eyes+so+opened%2C+as+they+shall+know+and+believe+in+Jesus+Christ.+This+is+further+manifested+by+expressing+the+period+of+this+limitation%2C+thus%2C+Until+the+fullness+of+the+Gentiles+be+come+in.%0A%0A7.+Verse+26.+This+general+phrase%3B+All+Israel+shall+be+saved%2C+sheweth%2C+that+there+is+a+time+to+come%2C+when+not+only+two+or+three%2C+or+a+few+Jews+here+and+there+thorowout+the+Christian+Church+%28as+have+been+in+all+ages+thereof%29+but+the+whole+Nation+shall+be+called.%0A%0A8.+Vers.+31.+This+phrase%2C+Through+your+mercy+they+also+may+obtain+mercy%3B+sheweth%2C+that+God+purposely+suffered+them+sometime+to+abide+in+unbelief%2C+that+when+they+should+be+brought+to+believe%2C+this+grace+and+honour+might+appear+to+arise+from+God%E2%80%99s+mere+mercy+and+free+grace.+The+words+following+in+the+next+verse+doe+shew+as+much%3A+They+are+these%2C+For+God+hath+concluded+them+all+in+unbelief%2C+that+he+might+have+mercy+upon+all.%0A%0AThus+we+see+that+there+is+a+calling+of+the+Jews+to+come%2C+and+that+their+calling+shall+be+as+a+resurrection+from+the+dead%2C+as+an+incision+of+many+more+branches+into+a+glorious+tree%2C+that+it+shall+be+an+universal%2C+conspicuous+calling+of+a+whole+Nation%2C+wherein+the+freeness+and+largeness+of+God%E2%80%99s+grace+and+mercy+shall+be+evidently+manifested.+At+which+time+there+shall+be+also+such+a+number+of+Gentiles+brought+in%2C+as+may+well+be+called+the+fullness+of+the+Gentiles%2C+vers.+25.+This+certainly+shall+be+a+most+glorious+condition+of+the+Christian+Church%2C+and+this+is+yet+to+come%3A+therefore+God+will+yet+doe+better+things+for+us.+In+expectation+whereof+we+may+comfort+our+selves%2C+though+for+a+while+thick+clouds+of+troubles+doe+over-spread+the+face+of+the+Church%2C+and+somewhat+eclipse+the+glorious+brightness+thereof.%E2%80%9D%0A%0A%E2%80%94+William+Gouge%2C+The+progress+of+divine+providence%2C+set+out+in+a+sermon+preached+in+the+Abbey+Church+of+Westminster+before+the+House+of+Peers%2C+on+the+24th+of+September%2C+1645.+being+the+day+of+their+monthly+fast%2C+%28London%3A+Joshua+Kirton%2C+1645%29%2C+pp+29-33.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F811810855a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/811810855a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/08/william-gouge-on-the-restoration-of-the-jews/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>do constantly affirm what I set forth in my Apology, as I remember, whether in my own or the late Queen’s time, that conscience and religion have been the cause of the last extremity of punishment. For however much a man may be addicted to his religion, however much he may openly and constantly profess it, no danger of death will hang over him unless he shall have actually offended against the foreign laws in any act; or shall have been seen to be the very summit of a conspiracy of counsels pernicious to the commonwealth: except only such as relate to sacrifices, and other parts of the Pontifical system, who in transmarine regions insinuate themselves into sacred orders: who have so many conspiracies, so many treasons by them in England, either conceived or instigated or applauded, that from our borders they are driven back under the penalty of destruction. And yet none of them remains in the same thing which you would wish to call holy: that by the single case, being mulcted, death should immediately follow.</p></blockquote>

<blockquote><p>IT may be that in the civil part of man’s life where (if the worst come to the worst) it toucheth but the temporal good: this affected winking of the understanding is not altogether hurtful. But in Religion it fareth otherwise, the danger here is dreadful, and the loss beyond recovery: when all here is embarked, and carried away, the body &amp; the soul, not to be no more, which would be at least a forlorn kind of happiness, but to be everlastingly miserable, which is the woeful complement of all unhappiness. …

If by reasons so sensible, that mere sense might comprehend them, it be strongly endeavoured to make the folly of the Turkish Religion [Islam] visible unto a Turk, all this while the Sun is but shewed to a beetle, the Turk sees not a whit: not as if that had impaired his senses, but it being an irksome business to acknowledge the horrid absurdities of his superstition, his passions grow furious, &amp; either besot his understanding, or divert it from a discontenting speculation of such a truth, which being assented to, would force him to pronounce sentence of condemnation upon his country-men, his Sultan, his friends, and kindred. This is so torturing a grief unto him, that nature will not suffer him to believe it, and so it remaineth as incredible unto him, as it is unpleasant, unless God work above nature.

Let us accuse the obstinate Jews of blasphemy, by testimonies of Scripture, we shall stop their mouths, we shall convince them, but yet for all that not convert them. An inconsiderate zeal without knowledge (as the Apostle hath observed it) a superstitious reverence of the traditions of their fathers, a sottish doting upon their own righteousness, a desire of the restoration of their state, of their reestablishment in the land of promise; overspread their eyes, as it were, with a vail, so that they cannot behold the glory of God in the face of Christ; who nullifieth their traditions; teareth from them the false covert of righteousness; who confoundeth their hope of an earthly kingdom, and prosperity; who frustrateth their expectation of a King, a Messias triumphing in secular pomp: who bindeth them to the taking up of his Cross, presenting himself to them crucified, and in his Cross the shame, &amp; horror of the rebellion of their Ancestors.

All this is thus, and more harsh to the natural apprehension of the Jew: and therefore he is no less blockish, and backward to believe it. In as much as he considereth not, neither alloweth the true, &amp; full poise to those means whereby this truth should be proved unto him. It is then from his passion that this his affected, voluntary, and in consequence malicious ignorance proceedeth.</p></blockquote>

— John Cameron, An examination of those plausible appearances which seem most to commend the Romish Church, and to prejudice the Reformed. Discovering them to be but mere shifts, purposely invented, to hinder an exact trial of doctrine by the Scriptures, trans. William Pinke (Oxford: Edward Forrest, 1626), pp 5, 6-7.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIT+may+be+that+in+the+civil+part+of+man%E2%80%99s+life+where+%28if+the+worst+come+to+the+worst%29+it+toucheth+but+the+temporal+good%3A+this+affected+winking+of+the+understanding+is+not+altogether+hurtful.+But+in+Religion+it+fareth+otherwise%2C+the+danger+here+is+dreadful%2C+and+the+loss+beyond+recovery%3A+when+all+here+is+embarked%2C+and+carried+away%2C+the+body+%26+the+soul%2C+not+to+be+no+more%2C+which+would+be+at+least+a+forlorn+kind+of+happiness%2C+but+to+be+everlastingly+miserable%2C+which+is+the+woeful+complement+of+all+unhappiness.+%E2%80%A6%0A%0AIf+by+reasons+so+sensible%2C+that+mere+sense+might+comprehend+them%2C+it+be+strongly+endeavoured+to+make+the+folly+of+the+Turkish+Religion+%5BIslam%5D+visible+unto+a+Turk%2C+all+this+while+the+Sun+is+but+shewed+to+a+beetle%2C+the+Turk+sees+not+a+whit%3A+not+as+if+that+had+impaired+his+senses%2C+but+it+being+an+irksome+business+to+acknowledge+the+horrid+absurdities+of+his+superstition%2C+his+passions+grow+furious%2C+%26+either+besot+his+understanding%2C+or+divert+it+from+a+discontenting+speculation+of+such+a+truth%2C+which+being+assented+to%2C+would+force+him+to+pronounce+sentence+of+condemnation+upon+his+country-men%2C+his+Sultan%2C+his+friends%2C+and+kindred.+This+is+so+torturing+a+grief+unto+him%2C+that+nature+will+not+suffer+him+to+believe+it%2C+and+so+it+remaineth+as+incredible+unto+him%2C+as+it+is+unpleasant%2C+unless+God+work+above+nature.%0A%0ALet+us+accuse+the+obstinate+Jews+of+blasphemy%2C+by+testimonies+of+Scripture%2C+we+shall+stop+their+mouths%2C+we+shall+convince+them%2C+but+yet+for+all+that+not+convert+them.+An+inconsiderate+zeal+without+knowledge+%28as+the+Apostle+hath+observed+it%29+a+superstitious+reverence+of+the+traditions+of+their+fathers%2C+a+sottish+doting+upon+their+own+righteousness%2C+a+desire+of+the+restoration+of+their+state%2C+of+their+reestablishment+in+the+land+of+promise%3B+overspread+their+eyes%2C+as+it+were%2C+with+a+vail%2C+so+that+they+cannot+behold+the+glory+of+God+in+the+face+of+Christ%3B+who+nullifieth+their+traditions%3B+teareth+from+them+the+false+covert+of+righteousness%3B+who+confoundeth+their+hope+of+an+earthly+kingdom%2C+and+prosperity%3B+who+frustrateth+their+expectation+of+a+King%2C+a+Messias+triumphing+in+secular+pomp%3A+who+bindeth+them+to+the+taking+up+of+his+Cross%2C+presenting+himself+to+them+crucified%2C+and+in+his+Cross+the+shame%2C+%26+horror+of+the+rebellion+of+their+Ancestors.%0A%0AAll+this+is+thus%2C+and+more+harsh+to+the+natural+apprehension+of+the+Jew%3A+and+therefore+he+is+no+less+blockish%2C+and+backward+to+believe+it.+In+as+much+as+he+considereth+not%2C+neither+alloweth+the+true%2C+%26+full+poise+to+those+means+whereby+this+truth+should+be+proved+unto+him.+It+is+then+from+his+passion+that+this+his+affected%2C+voluntary%2C+and+in+consequence+malicious+ignorance+proceedeth.%E2%80%9D%0A%0A%E2%80%94+John+Cameron%2C+An+examination+of+those+plausible+appearances+which+seem+most+to+commend+the+Romish+Church%2C+and+to+prejudice+the+Reformed.+Discovering+them+to+be+but+mere+shifts%2C+purposely+invented%2C+to+hinder+an+exact+trial+of+doctrine+by+the+Scriptures%2C+trans.+William+Pinke+%28Oxford%3A+Edward+Forrest%2C+1626%29%2C+pp+5%2C+6-7.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc3d1b1dbc1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c3d1b1dbc1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/06/john-cameron-on-mans-corrupt-affections-and-the-islamic-and-jewish-religions/" rel="noopener" target="_blank">Read it online · Reformed Coven

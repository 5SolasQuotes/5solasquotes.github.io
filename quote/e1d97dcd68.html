<main class="wrap"><figure class="quote" id="q-e1d97dcd68" data-kw="">
<blockquote><p>There is therefore need that both our hands should be employed in doing good. Now the two hands of a Christian Kingdom are the Magistracy and Ministry thereof. The business of Reformation calls for both. As we commonly use our hands for the washing and cleansing of each other. So if the Minister be extravagant, the Magistrate may correct him; then the right hand washeth the left: If the Magistrate do amiss, the Minister may admonish him, then the left hand clenseth the right.

But he that makes use of one hand to cut off the other with, destroys his body: such would our condition be, if either Ministers should suffer the Magistracy to be cried down; or Magistrates permit the Ministry to be debased. Scripture and experience bid us hope, that Amalek shall then be foiled, and Israel prevail, when faith in Christ, and zeal for truth shall support both these hands, as Aaron and Hur did those of Moses upon the mount.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), p. 43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e850c375ba" data-kw="">
<blockquote><p>I. It belongs to the duty of the supreme magistrate, the governor or shepherd of the people, in any nation, being acquainted with the mind of God, to take care that the truth of the gospel be preached to all the people of that nation, according to the way appointed, either ordinary or extraordinary.

I make no doubt but God will quickly reject them from their power who, knowing their Master’s will, are negligent herein.

[2.] As he is to declare it, so he is to protect it from all violence whatever. Jesus Christ is the great king of nations, as well as the holy king of saints. His gospel hath a right to be preached in every nation, and to every creature under heaven. Whoever forbids or hinders the free passage of it, is not only sinful and impious towards God, but also injurious towards men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Toleration; and the Duty of the Magistrate about Religion in William H. Goold (ed.), The Works of John Owen</cite></span></figcaption>

</figure><figure class="quote" id="q-26dcc05369" data-kw="">
<blockquote><p>The second duty is obedience, to be performed by all persons, and in all things possible (the contrary whereof God commands not), though hard and unequal… and this obedience must be to all governors, to the king as superior, and to the rest appointed by him, and to these, whether Christian or heathen, good or bad, merciful or cruel, for there is no power but of God (Rom. 13:1). The third is piety, that subjects pray for their governors, yea though they were infidels, or wicked: Thus did Daniel, thus did the ancient Christians for the heathen emperors, for their long life and safety… … Use 2. Hence it appears that the Pope with his limbs are the great rebels of the world; for not only pulling their necks as ecclesiastical persons from the yoke of the emperor and their sons’ reigns, but especially for seeking to overrule, depose and destroy the kings and kingdoms of the earth. Use 3. Learn they duty. Thy calling is to be subject… Pay all subsidies, tares, customs, etc…. and surely, if we must willingly pay to a heathen, much more to a Christian, religious, merciful, and renowned king.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Divinity Plainly Discovering the Mysteries of Christian Religion</cite>, … (London, 1615), pp. 361-4. Parr (d. 1632?) was a reformed Anglican.</span></figcaption>

<blockquote><p>2dly. Outward monuments — ways of declaring and holding out false and idolatrous worship — he is to remove; as the Papists’ images, altars, pictures, and the like; Turks’ mosques; prelates’ service-book. Now these are of two sorts: —

(1st.) Such things as, in their whole use and nature, serve only for the carrying on of worship in itself wholly false, and merely invented; as altars, images, crosses.

(2dly.) Such as are used for the carrying on of worship true in itself, though vilely corrupted; as praying and preaching; — such are those places commonly called churches.

The first are to be abolished; the latter aright used. I speak as to public appearances; for private disquisitions after such things I may be otherwise minded. The reason of this difference is evident to all.

Thus, in days of old, Constantine shut up Pagans’ temples, Euseb. de Vita Constant., lib. iv. cap. 23, 24; and demolished some of the most filthy of them, lib. iii. cap. 52. Theodosius utterly cast them to the ground, though not without some blows and bloodshed, Socrat. Ecclesiastes Hist., lib. v. cap. 16. The command of God for the abolishing all monuments of idolatry, Deut. xii. 1-3, with the commendation of those kings of Judah who accordingly performed this duty, 2 Chron. xvii. 6, xxx. 14, are enough to confirm it, and to bottom this position: —

VI. It is the duty of the magistrate not to allow any public places for (in his judgment) false and abominable worship; as also, to demolish all outward appearances and demonstrations of such superstitious, idolatrous, and unacceptable service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Toleration; and the Duty of the Magistrate about Religion</cite>, (1649) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1967), 8: 194.</span></figcaption>

<blockquote><p>Q90 Let us leave this matter, the delight of those on whom God will execute his just judgements. Now, come, tell me what is this corruption?

A90 Neither will nor intelligence is removed, as I have already said, because it would be necessary for the soul to then perish, or for the soul to cease existing, if these things were removed. But both of these faculties are so injured, that whereas the eye of understanding ought to have been very clear (even as it was before the Fall), especially in divine things and those things which pertain to a right conscience; partly it sees nothing at all, not even with the light of the Creator Himself set before it, as it is seen in the chief points of the true religion, which man’s reason not only loathes, but also fights as absurd and false for all men; partly, if it should see, it sees very dimly to the extent that those small traces of light (some measure of which is innate in every soul; some who have been intent on considering sublime things have perceived more things), having been left in man to the end so that man is without excuse, they will leave a man in the vestibule of truth, not to mention that, with the torch going before, he might come all the way to the very sanctuary of the truth.

And further, in regard to equity that can be observed between men, although the sharpness of the human mind is somewhat less dull in this, God so moderates His just judgement, so that the society of the human race from which he collects His church, might more easily be preserved. Otherwise, soon that society would have been annihilated, in accordance as the fall of man merits, if all discrimination of right and wrong, virtue and vice had been removed from the minds of men. The repugnancies, not only in the opinions of the vulgar, where there are as many opinions as there are heads, but also in the judgements of the most wise philosophers and lawyers, in which making them agree many recently have wearied themselves in vain, prove that still the blindness of men is very great, both in discussing general things, but especially in discussing hypothetical things.

Now I descend to the other faculty of the mind, which is the seat of the affections. Although it ought to be ruled by reason as by one that handles reins, how often does it snatch him away headlong? It is no marvel, then, when it sometimes snatches away even the soul itself. I omit the unruliness of all the natural affections, which evil reason, fighting against it, sees and condemns, but only the law of God utterly detects it. But to that darkness whereby the faculty of reason and will is overcast, still another worse evil is added, that reason feeds upon untruth, and wrestles willfully against the wisdom of God, even when convicted; and that the will is carried willfully to vice even against the reprehensions of reason, and is not able to flee or strive after anything rightly, since it has been completely enslaved to sin.

Q91 Are we but logs then?

A91 Not at all. For when I say that the reason and will of man are blind and perverse, I do not strip man of the faculty of reasoning or willing.

Q92 Therefore, you take away free will.

A92 If by free you mean spontaneous, I am far from doing that; to the contrary, I would say that the whole soul is carried to evil willingly and spontaneously. But if by free you mean that it has any ableness of itself to either, that is, to even be inclined to good, I deny this completely, relying on the nearly infinite testimonies of all of Scripture, and taught by perpetual experience. For you are not able to bring forth anyone among the number of men (except among the saints) who truly knows good, much less one who desires it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses. In which the Principal Headings of the Christian Religion are briefly set forth</cite>, trans. Kirk M. Summers, ed. Dikran Y. Hadidian (1570; Eugene OR: Pickwick Publications, 1986), pp 31-33.</span></figcaption>

lated%2C+in+accordance+as+the+fall+of+man+merits%2C+if+all+discrimination+of+right+and+wrong%2C+virtue+and+vice+had+been+removed+from+the+minds+of+men.+The+repugnancies%2C+not+only+in+the+opinions+of+the+vulgar%2C+where+there+are+as+many+opinions+as+there+are+heads%2C+but+also+in+the+judgements+of+the+most+wise+philosophers+and+lawyers%2C+in+which+making+them+agree+many+recently+have+wearied+themselves+in+vain%2C+prove+that+still+the+blindness+of+men+is+very+great%2C+both+in+discussing+general+things%2C+but+especially+in+discussing+hypothetical+things.%0A%0ANow+I+descend+to+the+other+faculty+of+the+mind%2C+which+is+the+seat+of+the+affections.+Although+it+ought+to+be+ruled+by+reason+as+by+one+that+handles+reins%2C+how+often+does+it+snatch+him+away+headlong%3F+It+is+no+marvel%2C+then%2C+when+it+sometimes+snatches+away+even+the+soul+itself.+I+omit+the+unruliness+of+all+the+natural+affections%2C+which+evil+reason%2C+fighting+against+it%2C+sees+and+condemns%2C+but+only+the+law+of+God+utterly+detects+it.+But+to+that+darkness+whereby+the+faculty+of+reason+and+will+is+overcast%2C+still+another+worse+evil+is+added%2C+that+reason+feeds+upon+untruth%2C+and+wrestles+willfully+against+the+wisdom+of+God%2C+even+when+convicted%3B+and+that+the+will+is+carried+willfully+to+vice+even+against+the+reprehensions+of+reason%2C+and+is+not+able+to+flee+or+strive+after+anything+rightly%2C+since+it+has+been+completely+enslaved+to+sin.%0A%0AQ91+Are+we+but+logs+then%3F%0A%0AA91+Not+at+all.+For+when+I+say+that+the+reason+and+will+of+man+are+blind+and+perverse%2C+I+do+not+strip+man+of+the+faculty+of+reasoning+or+willing.%0A%0AQ92+Therefore%2C+you+take+away+free+will.%0A%0AA92+If+by+free+you+mean+spontaneous%2C+I+am+far+from+doing+that%3B+to+the+contrary%2C+I+would+say+that+the+whole+soul+is+carried+to+evil+willingly+and+spontaneously.+But+if+by+free+you+mean+that+it+has+any+ableness+of+itself+to+either%2C+that+is%2C+to+even+be+inclined+to+good%2C+I+deny+this+completely%2C+relying+on+the+nearly+infinite+testimonies+of+all+of+Scripture%2C+and+taught+by+perpetual+experience.+For+you+are+not+able+to+bring+forth+anyone+among+the+number+of+men+%28except+among+the+saints%29+who+truly+knows+good%2C+much+less+one+who+desires+it.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Little+Book+of+Christian+Questions+and+Responses.+In+which+the+Principal+Headings+of+the+Christian+Religion+are+briefly+set+forth%2C+trans.+Kirk+M.+Summers%2C+ed.+Dikran+Y.+Hadidian+%281570%3B+Eugene+OR%3A+Pickwick+Publications%2C+1986%29%2C+pp+31-33.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb9a4d7d2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb9a4d7d2e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/15/theodore-beza-on-the-corruption-of-mans-will/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

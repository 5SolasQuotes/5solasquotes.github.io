<main class="wrap"><figure class="quote" id="q-c439071ff3" data-kw="final judgment">
<blockquote><p>The final judgment which Christ will exercise at the end of the world over the living and the dead, raised up and gathered together at the trump of God and the voice of the archangel, must be investigated as to its truth and manner. It is not inquired concerning the judgment of God taken merely for his rule and governing, nor concerning the fatherly judgment of God toward believers, but concerning that public and solemn judgment of the last day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.6.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-judge.html">The Judge</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-subjects.html">The subjects</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-standard.html">The standard</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0579630e02" data-kw="conflagration renewal">
<blockquote><p>What will the destruction of the earth be like? Will it be annihilated by the final conflagration or will it be restored and renewed? It is not inquired whether it will occur by a conflagration of fire. For the Scriptures so expressly declare this that no Christian can or ought to doubt it: “The heavens and the earth are reserved unto fire” (2 Pet. 3:7); “The heavens shall pass away with a great noise, and the elements shall melt with fervent heat.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.5.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/end-of-the-world.html">End of the World</a> › <a href="../topics/judgment-and-the-final-state/end-of-the-world/new-heavens-and-new-earth.html">New heavens and new earth</a></span></div>

</figure><figure class="quote" id="q-8872bfd394" data-kw="">
<blockquote><p>Although pardon of sin be compleated at that great day, yet this is not to be understood, as if Gods pardon of any sin were imperfect, and something of sinne did still remain to be done away. No, those expressions of forgivenes of sin in the Scripture, denote such a full and plenary pardon, that a sin cannot be more remitted then it is. But because we commit new sinnes daily, and so need pardon daily, Therefore it is that we are not compleatly pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publikely be declared to all the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification</cite>, London, 1651, Lecture 29, pp. 258–259</span></figcaption>

</figure><figure class="quote" id="q-e12381ac27" data-kw="degrees of glory">
<blockquote><p>Will there be degrees of glory? And will the glory in heaven be equal or unequal and unlike? The Romanists assert the inequality of glory from the inequality of merits which they are accustomed to place under it as a foundation. Among the orthodox the question is problematic; yet the more common opinion asserts degrees of glory without founding them upon merit of works, but upon the free gift of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.10.1–2</span></figcaption>

</figure><figure class="quote" id="q-605a0ea47d" data-kw="saints know one another">
<blockquote><p>Will the saints in the other world know one another? We affirm. As in the Scriptures nothing is taught expressly and distinctly on this question, so nothing is set forth to be necessarily believed concerning it. In the meanwhile, the more common opinion is the affirmative, which asserts that the saints will know each other. In our opinion, this is also the more probable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.11.1</span></figcaption>

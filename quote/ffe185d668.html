<main class="wrap"><figure class="quote" id="q-ffe185d668" data-kw="descent paradise not local hell">
<blockquote><p>Was the soul of Christ, after its separation from the body, translated to paradise immediately? Or did it descend locally to hell? The former we affirm; the latter we deny against the papists and Lutherans. The papists maintain that the soul of Christ really and by presence descended into hell and remained there just as long as his body was in the sepulchre, for the purpose of freeing the souls of the fathers of the Old Testament detained in limbo. We reject a local descent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.15.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/descent-into-hell.html">Descent into Hell</a> › <a href="../topics/the-states-of-christ/descent-into-hell/interpretations-calvin-rome-lutherans.html">Interpretations (Calvin, Rome, Lutherans)</a></span><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a> › <a href="../topics/the-states-of-christ/state-of-humiliation/burial.html">Burial</a></span><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a> › <a href="../topics/the-states-of-christ/state-of-humiliation/death.html">Death</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f42ee4c27d" data-kw="extra calvinisticum circumscription">
<blockquote><p>For the more easily to evade the argument drawn from the ascension of Christ to prove the circumscription of Christ’s body, they deny that Christ truly and properly ascended; but only figuratively, inasmuch as he withdrew his visible presence from the world (although he still remains in the world invisibly). And the heaven into which he ascended (they maintain) is not the highest or third heaven (called the heaven of the blessed), but the heaven of the beatitude and kingdom of God (which is everywhere). We affirm that Christ ascended properly by a local movement from the lower places to the supreme heaven of the blessed; and deny the metaphorical disappearance against the Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.18.1</span></figcaption>

</figure><figure class="quote" id="q-9bef223640" data-kw="">
<blockquote><p>A person so great, so high, so glorious, as this Jesus Christ was, should have love for us, that passes knowledge. It is common for equals to love, and for superiors to be beloved; but for the King of princes, for the Son of God, for Jesus Christ to love man thus: this is amazing, and that so much the more, for that man the object of this love, is so low, so mean, so vile, so undeserving, and so inconsiderable, as by the scriptures, everywhere he is described to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>

</figure><figure class="quote" id="q-6b2d9a44b2" data-kw="local ascension against ubiquity">
<blockquote><p>Did Christ ascend properly by a local movement from the lower places to the supreme heaven of the blessed; or metaphorically by disappearance? We affirm the former and deny the latter against the Lutherans. This question is introduced on account of the Lutherans and those who ascribe ubiquity to the body of Christ.</p></blockquote>

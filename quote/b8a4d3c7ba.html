<main class="wrap"><figure class="quote" id="q-b8a4d3c7ba" data-kw="">
<blockquote><p>Many a sermon hath God bestowed upon thee, O Scotland, but ere long God’s judgments shall be as frequent as these precious meetings have been wherein He sent forth His faithful servants to give warning in His name of their hazard in apostatizing from God, and in breaking all these noble vows which He brought the land unto Himself. God sent out a Welch, a Semple, a Cameron, and a Cargill to preach to thee, O Scotland, but ere long God shall preach unto thee by a bloody sword; for God shall not let a sentence of these men’s words fall to the ground that He sent out, and a commissioned to preach these things in His name – I say, God shall not let a sentence of these men’s words fall to the ground, but they shall have their due accomplishment ere it be long.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-peden.html">Alexander Peden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to Sermons in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-273c4b3c37" data-kw="">
<blockquote><p>A meeting was held at which it was agreed that the ministers who had accepted the Indulgence should be invited to preach alongside their non-complying brethren, while the latter would be given access to their pulpits… Up till now [the latter part of 1677], Welwood had been virtually a lone [public] voice [against the Indulgence], but there were already signs that others were ready to follow in his footsteps. To forestall this, it was agreed that those presenting themselves for license should in future be required to give a promise not to preach on any matters which might create division–by which, of course, the Indulgence was primarily intended. All the non-complying ministers were strictly enjoined to enforce these requirements when licensing young men to preach. These instructions were in force by the beginning of 1678…</p></blockquote>

</figure><figure class="quote" id="q-9cdd80b30f" data-kw="">
<blockquote><p>No sooner was it known that the [Scottish, civil] convention of estates [at Dundee] was to meet in March, 1689 [during the Glorious Revolution], than the Covenanters of the west resolved on repairing in a body to Edinburgh, to aid in protecting the meeting from the apprehended attack of the Jacobites [those for the previous king, James II]. Their assistance was far from being unnecessary… The sudden rising of Dundee having led to measures for the defence of the country, those of the Covenanters known by the name of Cameronians, chiefly in the neighbourhood of Douglas, raised a regiment of eight hundred men, without beat of drum or expense of levy, under the command of the Earl of Angus… Such was the origin of the Cameronian regiment… Discussions ensued, of a kind similar to those which had divided the counsels of the Covenanters at Bothwell. It was keenly debated among them whether it was not a “sinful association” to enlist under the same banner with other regiments, composed of those who had been malignants and abettors of tyranny, or who had not cleared themselves from the scandal of unlawful engagements. Owing to their pertinacity in these unreasonable scruples [longtime covenanter] Colonel Cleland, on whom the command of the regiment was devolved, very nearly lost temper, and he refused to accede to their demands, as subversive of all military discipline. But the matter was finally compromised by their agreeing on a brief general declaration, drawn up by Sir Patrick Hume of Polwart, and explained by Mr. Alexander Shields… It was to the effect that they “appeared in his majesty’s service in defence of the nation, recovery and preservation of the Protestant religion, and, in particular, the work of reformation in Scotland, in opposition to Popery, Prelacy, and arbitrary power, in all its branches and steps, until the government of church and state be brought back to their lustre and integrity, established in the best and purest times.</p></blockquote>

</figure><figure class="quote" id="q-4ae8fece6a" data-kw="">
<blockquote><p>And when Robert Hamilton came from abroad [from the Netherlands] among them, they got a brow of brass, calling him [i.e. Alexander Shields, one of the last three Cameronian ministers] a liar, and upbraided him to his face, saying, although he used these arguments [to join the 1690 Church of Scotland] to draw them out of the way of the Lord, yet you dare not publish them. I well remember he said, ‘Dare I not? dare I not? I promise before you all, I both dare and will, and avow it before the world.’ [which he did] But alas they still gave us a deaf ear, and now will not be spoken to nor plead with; however it stands for our mite of testimony… But, if the Lord spare, I resolve to give the world a more surprising account of the rude treatment and unheard-of ingratitude Mr. Shields, [Thomas] Linning [another of the last three Cameronian ministers, which joined the 1690 Church of Scotland], and others received at that time, and since, at their hands… …all know that it was the fewest number of the United Societies, that was led off with Robert Hamilton to the disowning of King William as King of Britain and his Government; the greater part [of the Cameronians] reckoned it their duty to take a legal unite way of witnessing, by humble pleadings, representations, and protestations, pleading for and with their mother to put away her whoredoms.</p></blockquote>

<blockquote><p>But if besides the testimonies of conscience which appear in very many, although they cannot appear in individuals, whence there is no need to dispute about the conscience of individuals–if, I say, besides these we also want to seek other testimonies, by which God is never destitute, and through which He can be found by groping, soon they will occur so infinitely that he who does not apprehend Him from any of them will have degenerated from man into a beast, etc.</p></blockquote>

<blockquote><p>While we admit there are many practical atheists, we deny that there are any speculative. A speculative atheist is either direct and express or indirect and interpretative. The direct is one who shakes off all knowledge and sense of deity; but such, properly speaking, there are none, because the sense of deity can never be wholly erased from the mind of man.</p></blockquote>

</figure><figure class="quote" id="q-749bb3c55a" data-kw="">
<blockquote><p>Although I, by divine testimony, and by the truth and merit of the thing itself, and by invincible reasons am persuaded that God exists, and I think it to be a most grievous and destructive sin to suspend judgment concerning it; yet because you suspend judgment concerning the existence of God, you hold in contempt all the authority of divine testimony, in which you certainly sin most grievously: yet, about to deal with you according to your capacity; having set aside divine testimony, likewise also the merit of the truth, I will convince you with invincible natural reasons; then what you can allege to the contrary, I will dispatch: You assent, for example, that you exist, he will grant it; nor will he be able, if he wished ever so much, to suspend judgment on this with the Cartesians. You assent that you are not from yourself, but from another, and this one similarly; he will grant it, and this willy-nilly. I will proceed therefore: One of these therefore will have to be chosen by you: [1] That in this series of causes one must ascend either to infinity; [2] Or that things in this series are mutually causes and effects of each other, with circular efficacy; by which e.g. the father produced you; the grandfather the father; the great-grandfather the grandfather; the great-great-grandfather the great-grandfather, etc. and you finally the great-great-grandfather: [3] Or that at some point in this series one must stop at some first, which is that very thing, which we wish to be designated by the Word God. If he chooses the first; I will say that he contradicts himself in this reasoning, inasmuch as thus, he himself cannot exist, which however he has already acknowledged before, willy-nilly: he cannot, I say, exist; because that infinite series of causes, which is presupposed to have to precede his production, and existence, would never have been completed, so that the next to produce, could have succeeded: If he chooses the second, the circular series, by which e.g. the great-great-grandfather through the great-grandfather, the grandfather, the father produced himself; but he himself the great-great-grandfather; I will say that he also thus contradicts himself, inasmuch as by this reasoning he states, that he is at the same time and is not, for inasmuch as he was produced by the great-great-grandfather, he certainly was not: but inasmuch as he produced the great-great-grandfather; he certainly was: Therefore there remains nothing, but that the third be acknowledged in this subordination, that there is some first, which produced all things, and was produced by none, and that this is infinitely perfect, hence I will proceed to demonstrate, that nothing is believed to finish or limit its own perfection; nor is there anything else for this first which may finish it: necessarily that thing remains infinite.</p></blockquote>

<blockquote><p>68. When being is divided through contradictory attributes opposite to each other with respect to being [such as permanent vs. transient; eternal vs. temporal; uncaused vs. caused; necessary vs. contingent; act vs. potency; substantial vs. accidental being; absolute vs. relative being; simple vs. composite being; infinite vs. finite], one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections because, from conclusion 62,¹ pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65).² But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection). ¹ [62. No pure perfection is incompatible with another pure perfection. This is plain from the definition of pure perfection; for a pure perfection or a perfection simply is that whose formal idea does not involve limitation or imperfection. Therefore of itself such a perfection cannot limit the being-ness of the subject in which it is, and so neither can it exclude from its subject other perfections simply.] ² [64. Conversely, no being that is altogether independent and uncausable can be finite, either intensively or extensively. 65. If there is something finite, there is something infinite. I prove it as follows: a finite being, because it is also a caused being, involves the existence of another being, namely an uncaused being (from conclusion 23 and following [on pp. 45-46]). But from conclusion 64, an uncaused being is both intensively and extensively infinite.] 69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus ibid. [Oxon. 1 d.39 q.un n.13]). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.</p></blockquote>

<blockquote><p>Even if we cannot be clear whether number is in wisdom or derives from wisdom, or whether wisdom itself derives from number or is in number, or whether each can be shown to be the name of a single thing, it is certainly evident that each is true, and unchangeably true. Consequently, you will not deny that there is unchangeable truth, containing everything that is unchangeably true. You cannot call it yours or mine or anyone else’s. Instead, it is present and offers itself in common to all who discern unchangeable truths, like a light that is miraculously both public and hidden. Who would claim that everything present in common to all who reason and understand pertains to the nature of any one [person] of them in particular? …We said that those things that we touch in common with the senses belonging to the eyes or to the ears, such as colors and sounds (which you and I see simultaneously or hear simultaneously), do not pertain to the nature of our eyes or ears but rather are common objects for us to sense. The same applies to those objects you and I recognize in common, each with his own mind. You would never say that they pertain to the nature of my mind, or to the nature of your mind… …Then, in regard to this truth we have long been talking about and in which we recognize so many things: Do you think it is (a) more excellent than our mind is, (b) equal to our minds, or even (c) inferior? If (c) were the case, we would make judgments about it rather than in accordance with it, the way we make judgments about physical objects because they are lower than us – we often say not only that they are so or not so, but that they ought to be so or not so. So too with our minds: We know not only that the mind is so, but that it ought to be so. We make judgments about physical objects in this fashion when we say that something is less bright than it ought to be, or less square, and so on, and about minds when we say that one is less well disposed than it ought to be, or less gentle, or less forceful, as we are wont to do by reason. We make these judgments in accordance with the inner rules of truth that we discern in common. But nobody makes judgments about the rules themselves. When anyone says that eternal things are more valuable than temporal things, or seven and three are ten, no one says that it ought to be so; he simply knows that it is so. He is not an inspector making corrections but merely a discoverer taking delight [in his discovery]. Now if (b) were the case, that this truth is equal to our minds, then it would itself also be changeable. For our minds sometimes see more of the truth and sometimes less. And for this reason, they acknowledge themselves to be changeable. The truth, remaining in itself, neither increases when we see more of it nor decreases when we see less, but instead it is intact and uncorrupted, bringing joy with its light to those who turn towards it and punishing with blindness those who turn away from it. We even make judgments about our own minds in accordance with [the unchangeable truth], although we are not able to make any judgment about it at all. For we say that a mind understands less than it ought to, or that it understands just as much as it ought to. Furthermore, the closer a mind is able to approach the unchangeable truth and hold fast to it, the more it ought to understand. Consequently, if the truth is neither inferior nor equal, it follows that it is superior and more excellent. Now I had promised you, if you recall, that I would show you that there is something more exalted than our mind and reason. Here you have it: the truth itself! Embrace it if you can and enjoy it; “Take delight in the Lord and He will give you your heart’s longings” [Ps. 36:4 (37:4 rsv)]. What do you long for more than to be happy? And who is happier than one who enjoys the unshakeable, unchangeable, and most excellent truth? People cry out that they are happy when they embrace with passionate desire the beautiful bodies of their wives, or even of prostitutes. Shall we doubt that people are happy in the embrace of the truth? People cry out that they are happy when, with throats parched from the heat, they arrive at a plentiful and wholesome spring, or, when hungry, they come upon a well-supplied sumptuous lunch or dinner. Shall we deny that we are happy when we are refreshed and nourished by the truth? …Are we afraid to set up the happy life in the light of truth? Instead, since the highest good is known and possessed in the truth, and this truth is wisdom, let us recognize and possess the highest good in it and enjoy it completely, since anyone who enjoys the highest good is happy. This truth reveals all true goods, which people elect for themselves to enjoy – either one or many of them – in accordance with their capacity for understanding. Consider the following analogy. There are people who elect what they like to look at in the sunlight, and take pleasure in the sight. And if they were by chance to be supplied with sound, healthier, and quite powerful eyes, they would like nothing better than to gaze at the Sun itself, which also sheds its light on the rest of the things that weaker eyes take pleasure in. Likewise, when the sharp, healthy, and strong sight of the mind is trained upon many unchangeable truths with its sure reason, it directs [its gaze] on the very truth itself by which all things are disclosed; holding fast to it as though it were unmindful of the others, it enjoys them all together in the truth itself. For whatever is agreeable in the other truths is surely agreeable in virtue of the truth itself. Our freedom is this: to submit to this truth, which is our God Who set us free from death – that is, from the state of sin. Truth itself, speaking as a human being among others, said to those believing in Him: “If you continue in my word, you are truly my disciples; and you shall know the truth, and the truth shall set you free” [Jn. 8:31–32]. The soul does not enjoy anything with freedom unless it enjoys it with security. Now nobody is secure in goods that can be lost against his will. Nobody loses truth and wisdom against his will, however. It is not possible for anyone to be physically separated from it. Instead, what we call “separation” from truth and wisdom is a perverse will that takes delight in inferior things, and nobody unwilling wills anything. Hence we possess something that all can enjoy equally in common. It has no restrictions or defects. It welcomes all its lovers who are not envious of each other: It is common to all and faithful to each. No one says to the other: “Back off so that I too may approach! Take your hands away so that I too may embrace it!” All hold fast to it and all touch the selfsame thing. Its food is not divided into portions; you drink nothing from it that I cannot drink. For you do not change anything from its commonness into something private of yours, but rather you take something from it and yet it remains intact for me. When you draw in its breath I do not wait for you to exhale for me to then draw breath from it. No part of it ever becomes the property of anyone. On the contrary, it is common as a whole to all at once. Therefore, the objects we touch or taste or smell are less analogous to this truth than those we hear or discern. Every word is heard as a whole by all who hear it and as a whole at once by each of them; any sight before the eyes is seen at once as much by one person as another. But these analogies [to the truth] are quite remote. No utterance is spoken as a whole at once, for it is brought forth and extended in time, so that one part of it is pronounced before another. Any visible sight is elongated (so to speak) in space, and is not a whole in any one place. All these things can surely be taken away against our will, and various obstacles prevent us from being able to enjoy them… To cap it off, even if the sweetness of light were always present for me to see, and of sound for me to hear, what great benefit would I gain? This would be common to me and the animals. By contrast, insofar as the will to enjoy it is steadfastly present, the beauty of truth and wisdom does not shut out those coming to it… It is close to all the people in the whole world who take delight in it and have turned themselves to it; it lasts forever for all; it is never absent from any place; outwardly it counsels us and inwardly it teaches us. It changes for the better all those who behold it, and it is not changed for the worse by anyone. No one passes judgments on it, and no one passes judgments rightly without it. And from this it is clear beyond a doubt that it is more valuable than our minds, each of which becomes wise by this one thing and passes judgment, not on it, but on other things through it. Now you had conceded that if I were to show you something above our minds you would admit it to be God, as long as there were nothing still higher. I accepted your concession and said that it would be sufficient if I were to prove this point. For if there is something more excellent, that instead is God; but if not, then the truth itself is God. Therefore, in either case you won’t be able to deny that God exists… There is a God who truly is, in the highest degree. This we now not only hold free of doubt by faith, I think. We also reach it by a form of understanding that, although as yet very slight, is certain.</p></blockquote>

— Augustine of Hippo, Augustine: On the Free Choice of the Will, On Grace &amp; Free Choice, &amp; Other Writings, tr. Peter King in Cambridge Texts in the History of Philosophy (Cambridge Univ. Press, 2010), On the Free Choice of the Will, 2.12-15, pp. 56-61">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEven+if+we+cannot+be+clear+whether+number+is+in+wisdom+or+derives+from+wisdom%2C+or+whether+wisdom+itself+derives+from+number+or+is+in+number%2C+or+whether+each+can+be+shown+to+be+the+name+of+a+single+thing%2C+it+is+certainly+evident+that+each+is+true%2C+and+unchangeably+true.+Consequently%2C+you+will+not+deny+that+there+is+unchangeable+truth%2C+containing+everything+that+is+unchangeably+true.+You+cannot+call+it+yours+or+mine+or+anyone+else%E2%80%99s.+Instead%2C+it+is+present+and+offers+itself+in+common+to+all+who+discern+unchangeable+truths%2C+like+a+light+that+is+miraculously+both+public+and+hidden.+Who+would+claim+that+everything+present+in+common+to+all+who+reason+and+understand+pertains+to+the+nature+of+any+one+%5Bperson%5D+of+them+in+particular%3F+%E2%80%A6We+said+that+those+things+that+we+touch+in+common+with+the+senses+belonging+to+the+eyes+or+to+the+ears%2C+such+as+colors+and+sounds+%28which+you+and+I+see+simultaneously+or+hear+simultaneously%29%2C+do+not+pertain+to+the+nature+of+our+eyes+or+ears+but+rather+are+common+objects+for+us+to+sense.+The+same+applies+to+those+objects+you+and+I+recognize+in+common%2C+each+with+his+own+mind.+You+would+never+say+that+they+pertain+to+the+nature+of+my+mind%2C+or+to+the+nature+of+your+mind%E2%80%A6+%E2%80%A6Then%2C+in+regard+to+this+truth+we+have+long+been+talking+about+and+in+which+we+recognize+so+many+things%3A+Do+you+think+it+is+%28a%29+more+excellent+than+our+mind+is%2C+%28b%29+equal+to+our+minds%2C+or+even+%28c%29+inferior%3F+If+%28c%29+were+the+case%2C+we+would+make+judgments+about+it+rather+than+in+accordance+with+it%2C+the+way+we+make+judgments+about+physical+objects+because+they+are+lower+than+us+%E2%80%93+we+often+say+not+only+that+they+are+so+or+not+so%2C+but+that+they+ought+to+be+so+or+not+so.+So+too+with+our+minds%3A+We+know+not+only+that+the+mind+is+so%2C+but+that+it+ought+to+be+so.+We+make+judgments+about+physical+objects+in+this+fashion+when+we+say+that+something+is+less+bright+than+it+ought+to+be%2C+or+less+square%2C+and+so+on%2C+and+about+minds+when+we+say+that+one+is+less+well+disposed+than+it+ought+to+be%2C+or+less+gentle%2C+or+less+forceful%2C+as+we+are+wont+to+do+by+reason.+We+make+these+judgments+in+accordance+with+the+inner+rules+of+truth+that+we+discern+in+common.+But+nobody+makes+judgments+about+the+rules+themselves.+When+anyone+says+that+eternal+things+are+more+valuable+than+temporal+things%2C+or+seven+and+three+are+ten%2C+no+one+says+that+it+ought+to+be+so%3B+he+simply+knows+that+it+is+so.+He+is+not+an+inspector+making+corrections+but+merely+a+discoverer+taking+delight+%5Bin+his+discovery%5D.+Now+if+%28b%29+were+the+case%2C+that+this+truth+is+equal+to+our+minds%2C+then+it+would+itself+also+be+changeable.+For+our+minds+sometimes+see+more+of+the+truth+and+sometimes+less.+And+for+this+reason%2C+they+acknowledge+themselves+to+be+changeable.+The+truth%2C+remaining+in+itself%2C+neither+increases+when+we+see+more+of+it+nor+decreases+when+we+see+less%2C+but+instead+it+is+intact+and+uncorrupted%2C+bringing+joy+with+its+light+to+those+who+turn+towards+it+and+punishing+with+blindness+those+who+turn+away+from+it.+We+even+make+judgments+about+our+own+minds+in+accordance+with+%5Bthe+unchangeable+truth%5D%2C+although+we+are+not+able+to+make+any+judgment+about+it+at+all.+For+we+say+that+a+mind+understands+less+than+it+ought+to%2C+or+that+it+understands+just+as+much+as+it+ought+to.+Furthermore%2C+the+closer+a+mind+is+able+to+approach+the+unchangeable+truth+and+hold+fast+to+it%2C+the+more+it+ought+to+understand.+Consequently%2C+if+the+truth+is+neither+inferior+nor+equal%2C+it+follows+that+it+is+superior+and+more+excellent.+Now+I+had+promised+you%2C+if+you+recall%2C+that+I+would+show+you+that+there+is+something+more+exalted+than+our+mind+and+reason.+Here+you+have+it%3A+the+truth+itself%21+Embrace+it+if+you+can+and+enjoy+it%3B+%E2%80%9CTake+delight+in+the+Lord+and+He+will+give+you+your+heart%E2%80%99s+longings%E2%80%9D+%5BPs.+36%3A4+%2837%3A4+rsv%29%5D.+What+do+you+long+for+more+than+to+be+happy%3F+And+who+is+happier+than+one+who+enjoys+the+unshakeable%2C+unchangeable%2C+and+most+excellent+truth%3F+People+cry+out+that+they+are+happy+when+they+embrace+with+passionate+desire+the+beautiful+bodies+of+their+wives%2C+or+even+of+prostitutes.+Shall+we+doubt+that+people+are+happy+in+the+embrace+of+the+truth%3F+People+cry+out+that+they+are+happy+when%2C+with+throats+parched+from+the+heat%2C+they+arrive+at+a+plentiful+and+wholesome+spring%2C+or%2C+when+hungry%2C+they+come+upon+a+well-supplied+sumptuous+lunch+or+dinner.+Shall+we+deny+that+we+are+happy+when+we+are+refreshed+and+nourished+by+the+truth%3F+%E2%80%A6Are+we+afraid+to+set+up+the+happy+life+in+the+light+of+truth%3F+Instead%2C+since+the+highest+good+is+known+and+possessed+in+the+truth%2C+and+this+truth+is+wisdom%2C+let+us+recognize+and+possess+the+highest+good+in+it+and+enjoy+it+completely%2C+since+anyone+who+enjoys+the+highest+good+is+happy.+This+truth+reveals+all+true+goods%2C+which+people+elect+for+themselves+to+enjoy+%E2%80%93+either+one+or+many+of+them+%E2%80%93+in+accordance+with+their+capacity+for+understanding.+Consider+the+following+analogy.+There+are+people+who+elect+what+they+like+to+look+at+in+the+sunlight%2C+and+take+pleasure+in+the+sight.+And+if+they+were+by+chance+to+be+supplied+with+sound%2C+healthier%2C+and+quite+powerful+eyes%2C+they+would+like+nothing+better+than+to+gaze+at+the+Sun+itself%2C+which+also+sheds+its+light+on+the+rest+of+the+things+that+weaker+eyes+take+pleasure+in.+Likewise%2C+when+the+sharp%2C+healthy%2C+and+strong+sight+of+the+mind+is+trained+upon+many+unchangeable+truths+with+its+sure+reason%2C+it+directs+%5Bits+gaze%5D+on+the+very+truth+itself+by+which+all+things+are+disclosed%3B+holding+fast+to+it+as+though+it+were+unmindful+of+the+others%2C+it+enjoys+them+all+together+in+the+truth+itself.+For+whatever+is+agreeable+in+the+other+truths+is+surely+agreeable+in+virtue+of+the+truth+itself.+Our+freedom+is+this%3A+to+submit+to+this+truth%2C+which+is+our+God+Who+set+us+free+from+death+%E2%80%93+that+is%2C+from+the+state+of+sin.+Truth+itself%2C+speaking+as+a+human+being+among+others%2C+said+to+those+believing+in+Him%3A+%E2%80%9CIf+you+continue+in+my+word%2C+you+are+truly+my+disciples%3B+and+you+shall+know+the+truth%2C+and+the+truth+shall+set+you+free%E2%80%9D+%5BJn.+8%3A31%E2%80%9332%5D.+The+soul+does+not+enjoy+anything+with+freedom+unless+it+enjoys+it+with+security.+Now+nobody+is+secure+in+goods+that+can+be+lost+against+his+will.+Nobody+loses+truth+and+wisdom+against+his+will%2C+however.+It+is+not+possible+for+anyone+to+be+physically+separated+from+it.+Instead%2C+what+we+call+%E2%80%9Cseparation%E2%80%9D+from+truth+and+wisdom+is+a+perverse+will+that+takes+delight+in+inferior+things%2C+and+nobody+unwilling+wills+anything.+Hence+we+possess+something+that+all+can+enjoy+equally+in+common.+It+has+no+restrictions+or+defects.+It+welcomes+all+its+lovers+who+are+not+envious+of+each+other%3A+It+is+common+to+all+and+faithful+to+each.+No+one+says+to+the+other%3A+%E2%80%9CBack+off+so+that+I+too+may+approach%21+Take+your+hands+away+so+that+I+too+may+embrace+it%21%E2%80%9D+All+hold+fast+to+it+and+all+touch+the+selfsame+thing.+Its+food+is+not+divided+into+portions%3B+you+drink+nothing+from+it+that+I+cannot+drink.+For+you+do+not+change+anything+from+its+commonness+into+something+private+of+yours%2C+but+rather+you+take+something+from+it+and+yet+it+remains+intact+for+me.+When+you+draw+in+its+breath+I+do+not+wait+for+you+to+exhale+for+me+to+then+draw+breath+from+it.+No+part+of+it+ever+becomes+the+property+of+anyone.+On+the+contrary%2C+it+is+common+as+a+whole+to+all+at+once.+Therefore%2C+the+objects+we+touch+or+taste+or+smell+are+less+analogous+to+this+truth+than+those+we+hear+or+discern.+Every+word+is+heard+as+a+whole+by+all+who+hear+it+and+as+a+whole+at+once+by+each+of+them%3B+any+sight+before+the+eyes+is+seen+at+once+as+much+by+one+person+as+another.+But+these+analogies+%5Bto+the+truth%5D+are+quite+remote.+No+utterance+is+spoken+as+a+whole+at+once%2C+for+it+is+brought+forth+and+extended+in+time%2C+so+that+one+part+of+it+is+pronounced+before+another.+Any+visible+sight+is+elongated+%28so+to+speak%29+in+space%2C+and+is+not+a+whole+in+any+one+place.+All+these+things+can+surely+be+taken+away+against+our+will%2C+and+various+obstacles+prevent+us+from+being+able+to+enjoy+them%E2%80%A6+To+cap+it+off%2C+even+if+the+sweetness+of+light+were+always+present+for+me+to+see%2C+and+of+sound+for+me+to+hear%2C+what+great+benefit+would+I+gain%3F+This+would+be+common+to+me+and+the+animals.+By+contrast%2C+insofar+as+the+will+to+enjoy+it+is+steadfastly+present%2C+the+beauty+of+truth+and+wisdom+does+not+shut+out+those+coming+to+it%E2%80%A6+It+is+close+to+all+the+people+in+the+whole+world+who+take+delight+in+it+and+have+turned+themselves+to+it%3B+it+lasts+forever+for+all%3B+it+is+never+absent+from+any+place%3B+outwardly+it+counsels+us+and+inwardly+it+teaches+us.+It+changes+for+the+better+all+those+who+behold+it%2C+and+it+is+not+changed+for+the+worse+by+anyone.+No+one+passes+judgments+on+it%2C+and+no+one+passes+judgments+rightly+without+it.+And+from+this+it+is+clear+beyond+a+doubt+that+it+is+more+valuable+than+our+minds%2C+each+of+which+becomes+wise+by+this+one+thing+and+passes+judgment%2C+not+on+it%2C+but+on+other+things+through+it.+Now+you+had+conceded+that+if+I+were+to+show+you+something+above+our+minds+you+would+admit+it+to+be+God%2C+as+long+as+there+were+nothing+still+higher.+I+accepted+your+concession+and+said+that+it+would+be+sufficient+if+I+were+to+prove+this+point.+For+if+there+is+something+more+excellent%2C+that+instead+is+God%3B+but+if+not%2C+then+the+truth+itself+is+God.+Therefore%2C+in+either+case+you+won%E2%80%99t+be+able+to+deny+that+God+exists%E2%80%A6+There+is+a+God+who+truly+is%2C+in+the+highest+degree.+This+we+now+not+only+hold+free+of+doubt+by+faith%2C+I+think.+We+also+reach+it+by+a+form+of+understanding+that%2C+although+as+yet+very+slight%2C+is+certain.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Augustine%3A+On+the+Free+Choice+of+the+Will%2C+On+Grace+%26+Free+Choice%2C+%26+Other+Writings%2C+tr.+Peter+King+in+Cambridge+Texts+in+the+History+of+Philosophy+%28Cambridge+Univ.+Press%2C+2010%29%2C+On+the+Free+Choice+of+the+Will%2C+2.12-15%2C+pp.+56-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f4799c73f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f4799c73f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/proofs-arguments-for-god/#:~:text=Even%20if%20we%20cannot%20be%20clear,as%20yet%20very%20slight%2C%20is%20certain&amp;text=Even%20if%20we%20cannot%20be%20clear%20whether%20number&amp;text=that%2C%20although%20as%20yet%20very%20slight%2C%20is%20certain" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

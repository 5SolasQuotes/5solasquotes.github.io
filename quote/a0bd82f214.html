<blockquote><p>But, after all, the best security for sound doctrine is in ‘the force of truth.’ The Bible has maintained its hold on the world, virtually, without subscription to its contents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription in the Church of England and in the University of Oxford</cite>, (Oxford: Henry &amp; Parker, 1863), p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“But, after all, the best security for sound doctrine is in ‘the force of truth.’ The Bible has maintained its hold on the world, virtually, without subscription to its contents.”

— Arthur P. Stanley, A Letter to the Lord Bishop of London on the State of Subscription in the Church of England and in the University of Oxford (Oxford: Henry &amp; Parker, 1863), p. 51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%2C+after+all%2C+the+best+security+for+sound+doctrine+is+in+%E2%80%98the+force+of+truth.%E2%80%99+The+Bible+has+maintained+its+hold+on+the+world%2C+virtually%2C+without+subscription+to+its+contents.%E2%80%9D%0A%0A%E2%80%94+Arthur+P.+Stanley%2C+A+Letter+to+the+Lord+Bishop+of+London+on+the+State+of+Subscription+in+the+Church+of+England+and+in+the+University+of+Oxford+%28Oxford%3A+Henry+%26+Parker%2C+1863%29%2C+p.+51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa0bd82f214.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a0bd82f214.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=But%2C%20after%20all%2C%20the%20best%20security,virtually%2C%20without%20subscription%20to%20its%20contents&amp;text=But%2C%20after%20all%2C%20the%20best%20security%20for%20sound&amp;text=the%20world%2C%20virtually%2C%20without%20subscription%20to%20its%20contents" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4a00019d58" data-kw="">
<blockquote><p>1. It has been already declared (yea, adjudged) that, by that statute [the Act of Parliament in the 13th year of Elizabeth], there is no liberty for any man to subscribe the [39] Articles with any limitation, or explication, if any credit be given to Sir Edward Cook, who says (Institutes, 4.47, p. 324, ed. 1658), that he has heard Wray, chief Justice in the King’s Bench, Pasch. 23 Elizabeth (quoting Dier 23 Elizabeth, 377, bk. 6, fol. 69, Grene’s Case, Smith’s Case) report that where one Smith subscribed to the said 39 Articles of Religion with this addition, ‘so far forth as the same were agreeable to the Word of God,’ that it was resolved by him and all the judges of England that this subscription was not according to the Statute of 13th Elizabeth, because the statute required an absolute subscription, and this subscription made it conditional; and that this act was made for avoiding diversities of opinions, etc. And, by this addition the party might by his own private opinion take some of them to be against the Word of God: and by this means diversities of opinions should not be avoided, which was the scope of the statute; and the very act itself made touching subscription, hereby [be] of none effect. Thus, he. 2. This shows a necessity of repealing that branch of the act, so far as it concerns subscription, because: 1. If we may not subscribe with such an addition, ‘so far forth as the same Articles are agreeable to God’s Word,’ it must needs be granted that the composers of them are admitted to be infallible; and their Articles, of equal authority with canonical Scripture: or else that the statute intended to tyrannize over the consciences of men, which is not to be imagined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reasons showing the Necessity of Reformation</cite>, … (London: Cotrel, 1660), I. ‘Of Doctrine,’, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-8e6b20902e" data-kw="Creeds below Scripture">
<blockquote><p>The authority of confessions ought indeed to be great with the pious in the churches, but still sinking below the authority of the Scripture. For the latter is a rule, they the thing ruled. It alone is self-credible (autopistos) with respect to words as well as to things, divine and infallible; they, as divine in things, still in words and manner of treatment are human writings. Faith is immediately and absolutely due to it; to them an examination is due and that having been made, if they agree with the word, faith. It is the constant and immutable canon of faith; while they are subject to revision and new examination, in which it is right not only to explain and amplify them, but also to correct whatever fault should be found in them and reform according to the rule of the word. Hence it is evident that they err here in excess who hold such confessions as the rule of the truth itself and make them equal to the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.9</span></figcaption>

</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

</figure><figure class="quote" id="q-c89569f066" data-kw="councils can err">
<blockquote><p>The question does not simply concern the invisible church of the elect or the universality of believers, whether it can err in the foundation (which our doctrine concerning the perseverance of the saints sufficiently proves is slanderously charged upon us), but whether it is to be said to be so infallible as to be exposed to no error (which we deny). The question is not properly of the collective visible church of believers, but especially of the representative church in councils and of the Roman pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-26adfe6d32" data-kw="">
<blockquote><p>Because God added thereunto a pledge and Sacrament in the Tree of Life, whereby he would have that Covenant of the Law, written in the heart, more clearly confirmed also outwardly; to wit, that he would by the observation of his Law, first perpetuate man’s life in this world unto the solemn justification of him; at his appointed time; and then advance him to a further and heavenly Felicity. And on the other side, he threatens Death unto him, in case he should depart from that Will and Law of God: all which had been done to no purpose, if man had been at first made by God himself, in any measure or manner sinful and perverse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism</cite>, (London: Thomas Davies, 1659), p. 19.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7dc25ca674" data-kw="">
<blockquote><p>In Adam’s sin there was the breach of the whole law in every commandment, either directly or by consequence, for he showed evident want of love to God in believing Satan more than God. Therein he chose Satan for his god; he worshipped Satan and took God’s name in vain; he showed also evident want of brotherly love, for hereby he became a murderer not only of himself, but of all his posterity. And thus do sins concur in every wicked action, in which regard it may be said with James that “he which faileth in one commandment is guilty of all” [2:10], which must admonish us to make conscience of every sin, for we cannot live in any one but we must needs run into many other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Christ’s Sermon on the Mount in The Works of William Perkins</cite>, (Reformation Heritage Books, 2014), 399.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-99809b9d03" data-kw="">
<blockquote><p>The second consequence attributed to the imputation of Christ’s righteousness, is a title to eternal life. This in the older writers is often expressed by the words “adoption and heirship.” Being made the children of God by faith in Christ Jesus (Gal. 3:26), they are heirs of God and joint heirs with Jesus Christ of a heavenly inheritance. (Romans 8:17.) The mere expiation of guilt confers no title to eternal life. The condition of the covenant under which man was placed was perfect obedience. This, from all that appears in Scripture, the perfection of God requires. As He never pardons sins unless the demands of justice be satisfied, so He never grants eternal life unless perfect obedience be rendered. Heaven is always represented as a purchased possession. In the covenant between the Father and the Son the salvation of his people was promised as the reward of his humiliation, obedience, and death. Having performed the stipulated conditions, He has a claim to the promised recompense. And this claim inures to the benefit of his people. But besides this, as the work of Christ consisted in his doing all that the law of God, or covenant of works requires for the salvation of men, and as that righteousness is freely offered to every one that believes. every such believer has as valid a claim to eternal life as he would have had, had he personally done all that the law demands. Thus broad and firm is the foundation which God has laid for the hopes of his people. It is the rock of ages; Jehovah our righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, 3 vols. (Oak Harbor, WA: Logos Research Systems, Inc., 1997), 3.164–65.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

9d03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99809b9d03.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/hodge-christ-fulfilled-the-conditions-of-the-covenant-of-works-for-believers/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-874faebf03" data-kw="">
<blockquote><p>God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfill it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 93</span></figcaption>

</figure><figure class="quote" id="q-05ac45d599" data-kw="">
<blockquote><p>Since the creature must pattern his ways after his Creator’s, and since the Creator rested only after he had worked, it was a covenant of works which was proffered to Adam as the means by which to arrive at the consummation. In the sense that it was the door to the consummation, this original Covenant of Creation was eschatological.

That door, however, was never opened. It was not the Fall in itself that delayed the consummation. According to the conditions of the Covenant of Creation the prospective consummation was either/or. It was either eternal glory by covenantal confirmation or original righteousness or eternal perdition by covenant-breaking repudiation of it.

The Fall, therefore, might have been followed at once by a consummation of the curse of the covenant. The delay was due rather to the principle and purpose of divine compassion by which a new way of arriving at the consummation was introduced, the way of redemptive covenant with common grace as its historical corollary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/meredith-g-kline.html">Meredith G. Kline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Structure of Biblical Authority</cite>, (rev. edn, Grand Rapids MI: Eerdmans, 1975), p. 155.</span></figcaption>

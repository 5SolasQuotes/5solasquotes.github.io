<main class="wrap"><figure class="quote" id="q-6acee4bbb0" data-kw="">
<blockquote><p>Certainly, we are not saved by chairs, but by rules; nor by titles or succession of persons, but by the precepts of faith and godliness.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.”

</figure><figure class="quote" id="q-373f952ee3" data-kw="">
<blockquote><p>From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 4.26.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/the-church/marks-of-the-true-church.html">Marks of the True Church</a> › <a href="../topics/the-church/marks-of-the-true-church/unity-holiness-catholicity-apostolicity.html">Unity, holiness, catholicity, apostolicity</a></span></div>
<div class="actions"><button class="copy" data-copy="“From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.”

— Irenaeus of Lyons, Against Heresies, 4.26.4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom%20all%20such%20persons%2C%20therefore%2C%20it%20behooves%20us%20to%20keep%20aloof%2C%20but%20to%20adhere%20to%20those%20who%2C%20as%20I%20have%20already%20observed%2C%20do%20hold%20the%20doctrine%20of%20the%20apostles%2C%20and%20who%2C%20together%20with%20the%20order%20of%20priesthood%20%28presbyterii%20ordine%29%2C%20display%20sound%20speech%20and%20blameless%20conduct%20for%20the%20confirmation%20and%20correction%20of%20others.%E2%80%9D%0A%0A%E2%80%94%20Irenaeus%20of%20Lyons%2C%20Against%20Heresies%2C%204.26.4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F373f952ee3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/373f952ee3.html">Permalink</a><a class="src" href="https://www.newadvent.org/fathers/0103426.htm" rel="noopener" target="_blank">Read it online · New Advent</a></div>
</figure><figure class="quote" id="q-63d112067c" data-kw="Succession of doctrine">
<blockquote><p>Succession is necessary in the church, but of doctrine and of the common and pastoral office; but not of place, or of persons and of the extraordinary apostolic office. Pastors in the first way succeed the apostles, but no one could have succeeded them in the latter way. … There are officers who must perpetually accompany the church, as pastors and teachers. Others, who were appointed to found it (such as apostles and evangelists), ought to remain only for a time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span></div>
<div class="actions"><button class="copy" data-copy="“Succession is necessary in the church, but of doctrine and of the common and pastoral office; but not of place, or of persons and of the extraordinary apostolic office. Pastors in the first way succeed the apostles, but no one could have succeeded them in the latter way. … There are officers who must perpetually accompany the church, as pastors and teachers. Others, who were appointed to found it (such as apostles and evangelists), ought to remain only for a time.”

</figure><figure class="quote" id="q-dc182cff5f" data-kw="Keys Peter">
<blockquote><p>Secondly, That authority of the keys was not committed to Peter alone, but to the rest of the apostles also. For in this place he did not give the keys, but only promised that he would give them: but afterwards, when he actually gives them (Matthew 28:18, 19; John 20:21, 22, 23), he addresses all the apostles equally. Therefore, if the pope have the authority of interpreting the scriptures, because the keys were given to Peter, then also other bishops and ministers, who were successors of the rest of the apostles, received the same authority, because the keys were given to the rest of the apostles as well as to Peter. Thirdly, Augustine says in his 124th Tractate upon John, as in many other places, that “Peter signified the universal church,” when the keys were given to him: therefore this power of the keys was given not to the pope alone, but to the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>
